name: Potential Data Exfiltration Activity Via CommandLine Tools
id: 60fe87e5-ae9e-4917-821a-0e8e45815471
description: |
  Detects command-line web utilities being used to push data outbound. The rule fires when a
  recon/staging payload pattern is present AND at least one of several transfer patterns matches:
  powershell.exe / cmd.exe issuing an HTTP POST with URL, method, and body flags; curl.exe with a
  URL and data flags; or wget.exe with --post-data / --post-file. The payload half looks for
  reconnaissance output or file content being read for the body (whoami, ipconfig, systeminfo,
  ToBase64String, type C:\...). Legitimate context exists -- automation, monitoring agents, and
  developers do POST data to APIs from the command line -- so the investigation determines whether
  the outbound request carries host or domain reconnaissance, what destination received it, and
  whether the launch context (parent, user, host) is consistent with sanctioned automation.
type: detection
detection_id: 7d1aaf3d-4304-425c-b7c3-162055e0b3ab
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line match the outbound-transfer-plus-recon pattern this rule detects?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires when a recon or
    file-content payload is present AND at least one transfer pattern matches -- EITHER powershell/cmd
    issuing an HTTP POST (URL + method + body flags together), OR curl.exe with a URL and data flags,
    OR wget.exe with --post-data/--post-file. Note which branch fired and which payload tokens
    appear (whoami, ipconfig, systeminfo, ToBase64String, type C:\...): the transfer branch tells you
    which binary did the sending, and the payload tokens tell you what was being staged for the body.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to push data outbound via command-line web tools?
  context: >-
    Legitimate automation, monitoring agents, and developers do POST data to APIs from curl,
    powershell, or wget. Knowing whether this user role and host function normally make scripted
    outbound web requests is often the fastest way to separate sanctioned automation from operator
    activity. A workstation with no automation role POSTing reconnaissance output is far more
    concerning than a known integration host calling a known API.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Are the files referenced in the command line still on disk for analysis?
  context: >-
    The payload half of this rule reads file content into the request body (type C:\... > file
    patterns, Get-Content). If the command references a source file or an intermediate output file,
    checking whether it still exists enables hash lookup, content review, and a determination of
    exactly what data was selected for the body. File paths here are derived from the command line,
    so the query scopes to those extracted paths rather than all file activity on the host.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What exactly did this command do? Decode the full request -- URL, method, and body.
  context: >-
    The full command line reveals the destination and what was sent. Decode the URL (where did the
    data go -- internal API, known SaaS endpoint, or a raw external IP?), the method (POST signals an
    upload rather than a fetch), and the body expression. Body content built from whoami, ipconfig,
    systeminfo, nltest, or ToBase64String means host or domain reconnaissance was staged for
    transfer. This host+binary scope captures sequential invocations that together form one logical
    exfil operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Was the request body encoded, and what does it decode to?
  context: >-
    A common pattern here wraps reconnaissance output in
    [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes((<recon>))) and POSTs the
    result, so the body on the wire is base64 even though the command itself is readable. Decode the
    body expression to recover what was actually sent -- a whoami result, domain trust enumeration, a
    file's contents -- and identify the destination URL or IP it was sent to. Distinguishing
    benign API payloads from staged host reconnaissance turns on what the decoded body contains.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What files or data sources were selected to populate the request body?
  context: >-
    The command-line arguments reveal what was targeted for the body: a specific file read with type
    or Get-Content, output of reconnaissance commands (systeminfo, tasklist, netstat, nltest), or a
    file path under C:\. Broad or sensitive selections (credential stores, business document
    directories, full enumeration output) raise severity and determine which data owners need to be
    notified. The query surfaces files the sending binary touched beyond what is visible in the
    command line itself.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: Where did the data go, and was anything written to disk along the way?
  context: >-
    Outbound transfer typically has a destination encoded in the request and may stage an
    intermediate file before sending. Checking file events from the sending binary reveals any local
    staging (an output file from a type/redirect, a temporary archive), while the destination in the
    decoded URL or IP reveals the exfiltration target -- an internal endpoint, a known cloud service,
    or an unfamiliar external server. Pairing the local writes with the destination establishes the
    full transfer path.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was the body encoded or obfuscated to hide what was being sent?
  context: >-
    Encoding the body (ToBase64String, GetBytes wrapping) keeps the data opaque to inspection while
    in transit and is part of this rule's payload pattern. Identify how the body was transformed --
    base64, byte-array conversion, or no encoding at all -- and whether reconnaissance output was
    deliberately wrapped before sending. A request body that base64-encodes whoami or domain-trust
    output is a stronger indicator of staged exfiltration than an unencoded API call.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned this tool, and is that parent chain expected?
  context: >-
    The parent reveals how the transfer was launched. A scheduled task, monitoring agent, or
    deployment tool spawning curl or powershell to POST telemetry is routine. An Office application,
    mshta, wscript, or a web-server process (w3wp, a shell dropped by a web shell) spawning the same
    command points to exploitation or hands-on-keyboard activity. Walk up from the immediate parent
    to see what spawned it and what else it launched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Were PowerShell security controls bypassed or weakened before this execution?
  context: >-
    Operators frequently disable or bypass PowerShell controls before running a payload: AMSI
    patching, execution-policy bypass flags, language-mode escape, or a v2 downgrade that strips
    logging. Finding these precursor events on the host strengthens the case that the outbound
    request is part of an operation rather than sanctioned automation. Tamper that immediately
    precedes a recon-and-POST sequence is a meaningful escalation signal.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the full deobfuscated script?
  context: >-
    Script block logging records the script content PowerShell actually executed, even when the
    body expression is built dynamically or base64-wrapped. It provides ground truth about what was
    assembled for the request body and where it was sent, bypassing command-line obfuscation. If
    PowerShell operational logs are not ingested in this environment, treat zero results as a
    visibility gap rather than evidence nothing ran, and fall back to decoding the body from the
    alerting command line directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Did this PowerShell process load .NET or web-stack assemblies consistent with in-memory transfer?
  context: >-
    PowerShell web requests run through .NET. Loaded modules such as System.Net.Http, System.Net, or
    System.Management.Automation tie the transfer to in-process .NET execution rather than a separate
    binary, and rare or never-before-seen assemblies loaded into the same process can indicate a
    fileless cradle assembling the request. This crosses from the command line into module-load
    evidence, which confirms how the request was constructed when the command line alone is ambiguous.
  range: +/-5m
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
- question: When this host previously fired this rule's pattern, what parents and users drove it, and does the current alert fit?
  context: >-
    Even routine automation can match this pattern. The query mirrors the rule's full selection
    structure scoped to this host, so the resulting parent and user distribution reflects how this
    specific recon-and-POST pattern has historically run here -- not generic powershell or curl usage.
    A new parent process, an unexpected account, or a first-ever appearance of the pattern on this
    host is the anomaly worth chasing; a stable parent/user pair points to established automation.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_iwr:
        Image|endswith:
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
        - \cmd.exe
        CommandLine|contains:
        - 'curl '
        - Invoke-RestMethod
        - Invoke-WebRequest
        - 'irm '
        - 'iwr '
        - 'wget '
        CommandLine|contains|all:
        - ' -ur'
        - ' -me'
        - ' -b'
        - ' POST '
      selection_curl:
        Image|endswith: \curl.exe
        CommandLine|contains: --ur
      selection_curl_data:
        CommandLine|contains:
        - ' -d '
        - ' --data '
      selection_wget:
        Image|endswith: \wget.exe
        CommandLine|contains:
        - --post-data
        - --post-file
      payloads:
      - CommandLine|re:
        - net\s+view
        - sc\s+query
      - CommandLine|contains:
        - Get-Content
        - GetBytes
        - hostname
        - ifconfig
        - ipconfig
        - netstat
        - nltest
        - qprocess
        - systeminfo
        - tasklist
        - ToBase64String
        - whoami
      - CommandLine|contains|all:
        - 'type '
        - ' > '
        - ' C:\'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: ((selection_iwr or all of selection_curl* or selection_wget) and payloads) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_iwr:
        Image|endswith:
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
        - \cmd.exe
        CommandLine|contains:
        - 'curl '
        - Invoke-RestMethod
        - Invoke-WebRequest
        - 'irm '
        - 'iwr '
        - 'wget '
        CommandLine|contains|all:
        - ' -ur'
        - ' -me'
        - ' -b'
        - ' POST '
      selection_curl:
        Image|endswith: \curl.exe
        CommandLine|contains: --ur
      selection_curl_data:
        CommandLine|contains:
        - ' -d '
        - ' --data '
      selection_wget:
        Image|endswith: \wget.exe
        CommandLine|contains:
        - --post-data
        - --post-file
      payloads:
      - CommandLine|re:
        - net\s+view
        - sc\s+query
      - CommandLine|contains:
        - Get-Content
        - GetBytes
        - hostname
        - ifconfig
        - ipconfig
        - netstat
        - nltest
        - qprocess
        - systeminfo
        - tasklist
        - ToBase64String
        - whoami
      - CommandLine|contains|all:
        - 'type '
        - ' > '
        - ' C:\'
      _pb_scope:
        User|expand: '%User%'
      condition: ((selection_iwr or all of selection_curl* or selection_wget) and payloads) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_iwr:
        Image|endswith:
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
        - \cmd.exe
        CommandLine|contains:
        - 'curl '
        - Invoke-RestMethod
        - Invoke-WebRequest
        - 'irm '
        - 'iwr '
        - 'wget '
        CommandLine|contains|all:
        - ' -ur'
        - ' -me'
        - ' -b'
        - ' POST '
      selection_curl:
        Image|endswith: \curl.exe
        CommandLine|contains: --ur
      selection_curl_data:
        CommandLine|contains:
        - ' -d '
        - ' --data '
      selection_wget:
        Image|endswith: \wget.exe
        CommandLine|contains:
        - --post-data
        - --post-file
      payloads:
      - CommandLine|re:
        - net\s+view
        - sc\s+query
      - CommandLine|contains:
        - Get-Content
        - GetBytes
        - hostname
        - ifconfig
        - ipconfig
        - netstat
        - nltest
        - qprocess
        - systeminfo
        - tasklist
        - ToBase64String
        - whoami
      - CommandLine|contains|all:
        - 'type '
        - ' > '
        - ' C:\'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: ((selection_iwr or all of selection_curl* or selection_wget) and payloads) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts in the surrounding window reveals whether the
    outbound transfer is isolated or part of broader movement. The same account running recon,
    staging, and POSTs on multiple endpoints points to a wider scope of compromise; activity confined
    to one host narrows it. This is the immediate cross-host view, distinct from the long-term
    historical baseline.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
