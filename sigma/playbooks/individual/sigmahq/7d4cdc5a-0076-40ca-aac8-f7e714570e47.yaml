name: CMSTP Execution Process Creation
id: 47254f44-68be-4ce4-9b29-7fb4e309d135
description: |
  Detects a child process spawned by cmstp.exe, the Microsoft Connection Manager Profile Installer.
  cmstp.exe is a signed, on-disk system binary that can execute local or remote VBScript/JScript via a
  weaponized INF file, perform proxy execution of arbitrary commands, and auto-elevate from medium to high
  integrity through its COM interface with no user prompt — making it attractive for application-allowlist
  bypass and UAC bypass. Legitimate CMSTP use is rare in modern enterprises, so any process descending from
  cmstp.exe should be investigated to determine what the child binary is, what INF/SCT/DLL payload drove it,
  and whether network, registry, file, or COM-injection artifacts accompanied the execution.
type: detection
detection_id: 7d4cdc5a-0076-40ca-aac8-f7e714570e47
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Is the alerting process a genuine child of cmstp.exe, and what binary did it launch?
  context: Before investing investigation time, confirm the parent is cmstp.exe and review the child Image,
    its full command line, and integrity level. cmstp.exe spawning a child is the rule's sole trigger, so the
    parent attribution and the identity of the spawned binary are the first facts to establish.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: Is this user and host expected to run cmstp.exe and install connection-manager profiles?
  context: Legitimate CMSTP use is rare in modern enterprises and usually tied to remote-access deployment
    on specific managed endpoints. Knowing whether this user role and host function involve connection-profile
    installation is often the fastest way to separate routine administration from abuse.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What was cmstp.exe's own command line, and which INF or SCT did it process?
  context: The parent cmstp.exe event shows the INF/SCT path or switch it was invoked with — for example a
    /s flag pointing at a local or remote INF whose UnregisterOCXSection invokes scrobj.dll and a .SCT script,
    or a RunPreSetupCommandSection holding an arbitrary executable path. Decoding the parent command line
    identifies the payload the profile installer was driven to execute.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - IntegrityLevel
- question: What exactly did the child process do? Decode its command-line arguments.
  context: The child's full command line reveals the action proxied through cmstp.exe. Decode any flags,
    script paths, URLs, or encoded content. A child such as cmd.exe, powershell.exe, wscript.exe, or mshta.exe
    running at high integrity points to UAC bypass or remote-script fetch-and-execute rather than benign
    profile installation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - IntegrityLevel
- question: Has cmstp.exe spawned this child binary on this host before?
  context: A cmstp.exe-to-this-child relationship that has never been seen on the host is more suspicious than
    one that recurs. Connection-profile installation is uncommon, so zero or very low historical counts for
    this specific parent-child pairing indicate a novel and likely operator-driven execution.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: What other child processes did cmstp.exe spawn on this host around the alert?
  context: A profile installer driven by an attacker often launches multiple tools in sequence —
    reconnaissance, credential access, or additional payloads. Enumerating every child of cmstp.exe reveals
    the full scope of activity proxied through this signed binary beyond the one process that triggered the
    alert.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: What other activity is associated with cmstp.exe on this host around the same time?
  context: Beyond child processes, cmstp.exe may have generated other process activity in the same window.
    Correlating that activity within minutes of the alert helps reconstruct the sequence — what configured
    the profile install, what it launched, and what ran immediately after.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is cmstp.exe spawning this child binary on other hosts in the environment?
  context: The same cmstp.exe parent-child pattern appearing across multiple hosts may indicate a coordinated
    rollout, a phishing wave, or lateral reuse of the same INF payload. A single occurrence is more likely
    targeted. Environment-wide comparison calibrates the scope of the activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
- question: Did cmstp.exe make outbound network connections around the time of the alert?
  context: A weaponized INF can point cmstp.exe at a remote .SCT or DLL, causing the signed binary itself to
    reach out to an external host to fetch and execute script. cmstp.exe initiating outbound connections is
    abnormal for legitimate local profile installation, so any external destination here is investigative
    signal worth resolving against threat intelligence.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \cmstp.exe
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - Initiated
- question: Did dllhost.exe spawn a child process at High or System integrity around the alert, consistent with the CMSTPLUA/CMLUAUTIL auto-elevating COM path?
  context: The direct COM-interface UAC bypass invokes the auto-elevated CMSTPLUA interface via dllhost.exe, often without cmstp.exe appearing as the parent at all. The COM handle-marshaling call itself has no equivalent telemetry on Elastic Defend, so a zero result on that access alone is not evidence the path was not used. The observable footprint is the elevated child process the COM object spawns — a high-integrity child of dllhost.exe in this window corroborates the COM-elevation path even though the underlying handle access stays invisible.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\dllhost.exe'
        IntegrityLevel:
          - 'High'
          - 'System'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - IntegrityLevel
- question: Were connection-manager profile registry values written on this host around the alert?
  context: The RunPreSetupCommandSection UAC bypass leaves a registry footprint where dllhost.exe creates a
    cmmgr32.exe object and sets ProfileInstallPath to C:\ProgramData\Microsoft\Network\Connections\Cm. Registry
    writes touching cmmgr32.exe or that ProfileInstallPath value, especially when not attributable to a known
    profile deployment, corroborate CMSTP-based profile installation as the elevation mechanism.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_target:
        TargetObject|contains:
          - cmmgr32.exe
          - \Network\Connections\Cm
      condition: selection_host and selection_target
    fields:
      - Image
      - TargetObject
      - Details
- question: Were INF, SCT, or DLL files written on this host shortly before cmstp.exe executed?
  context: Abuse usually requires dropping a weaponized INF, and often an accompanying .SCT script or DLL, to
    disk before invoking cmstp.exe. A newly written .inf, .sct, or .dll — particularly in a user-writable
    location such as a user profile, ProgramData, or a temp directory — staged just before the execution
    identifies the payload and its origin.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_ext:
        TargetFilename|endswith:
          - '.inf'
          - '.sct'
          - '.dll'
      condition: selection_host and selection_ext
    fields:
      - Image
      - TargetFilename
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \cmstp.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \cmstp.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining process activity around the alert reveals what led to
    the cmstp.exe execution and what followed it. Aggregating by Image and ParentImage collapses routine
    agent telemetry into high-count rows while novel parent-child pairs stand out at low counts — those are
    what to scan for reconnaissance, escalation, or persistence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may
    reveal the attack stages that preceded the CMSTP execution and help reconstruct the full timeline. UAC
    bypass and proxy execution are typically mid-chain steps rather than the initial foothold.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
