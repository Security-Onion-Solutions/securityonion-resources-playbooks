- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity on more than one host, the scope of the incident may be larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: Under a service or machine account, asking what else the user did across the network returns agent-telemetry noise, because every host runs those accounts constantly. The meaningful question is whether the same launch mechanism fired elsewhere; the query mirrors the rule's selection scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith:
        - \eqnedt32.exe
        - \wordpad.exe
        - \wordview.exe
        - \certutil.exe
        - \certoc.exe
        - \CertReq.exe
        - \Desktopimgdownldr.exe
        - \esentutl.exe
        - \mshta.exe
        - \AcroRd32.exe
        - \RdrCEF.exe
        - \hh.exe
        - \finger.exe
        TargetFilename|endswith:
        - .bat
