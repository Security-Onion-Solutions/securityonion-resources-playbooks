name: Legitimate Application Dropped Script
id: 2460695b-b947-421b-9f13-b31a55ba1bd4
description: |
  Detects a script file being written to disk by a document-handling application or a download-capable LOLBIN that has no legitimate reason to produce scripts. The rule fires when one of the flagged images (eqnedt32.exe, wordpad.exe, wordview.exe, certutil.exe, certoc.exe, CertReq.exe, Desktopimgdownldr.exe, esentutl.exe, mshta.exe, AcroRd32.exe, RdrCEF.exe, hh.exe, finger.exe) creates a file whose extension is scriptable (.bat, .chm, .hta, .js, .jse, .ps1, .py, .vbs, .vbe, .wsf, .wsh, .scf, .csproj, .proj) AND the benign case of mshta.exe writing a .hta is excluded. This pattern commonly reflects maldoc payload staging or abuse of a trusted binary for script-based code execution; the investigation should determine what the dropping process was doing, what the script contains, and whether the script subsequently executed.
type: detection
detection_id: 7d604714-e071-49ff-8726-edeb95a70679
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Do the dropped script path and the creating process match what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact file path and script extension, the operation performed (created/renamed), and the responsible process against the rule's criteria. The creating image must be one of the flagged document apps or download LOLBINs and the target extension must be scriptable; a plain mshta.exe write of a .hta is excluded by design, so a fire means the writer/extension pair is outside that benign case.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to have this application write a script file?
  context: Legitimate administrative activity can trigger many detections. Knowing whether the user role and host function are consistent with a document viewer or a download utility producing a script is often the fastest path to distinguishing a true positive from a routine operation. When the user is a machine or service account, judge by the writing process and the host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What was the full command line of the process that wrote the script, and is it encoded or obfuscated?
  context: The file event carries no command line, so this pivots to the process record for the writing image via its process identifier. Download LOLBINs reveal their source in arguments — certutil -urlcache/-decode with a URL and output path, esentutl or finger retrieving remote content, Desktopimgdownldr fetching an image URL. Decode any base64, hex, character-concatenation, or environment-variable substitution to establish what the process actually did and where the script content came from.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What is the content of the dropped script, and does it contain obfuscation, encoded strings, or known malware indicators?
  context: Read and analyze the script's actual content. Check for base64 or hex encoding, obfuscated string concatenation, embedded URLs or IP addresses, download cradles, in-memory loaders, and known malicious string patterns. Content analysis answers what is IN the file and is distinct from a hash or reputation lookup; actual retrieval is from the endpoint or an EDR console.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Is the script still on disk, or was it deleted or renamed after the alert?
  context: The script's post-alert lifecycle drives both urgency and next steps. A payload still on disk can be retrieved, hashed, and analyzed; a file deleted seconds after creation suggests anti-forensic cleanup or a self-deleting stager and shifts the investigation toward what executed in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the responsible process write or delete around the alert?
  context: A process that drops one suspicious script often drops several — a maldoc unpacking components, a loader staging a second stage, or a tool writing intermediate output. The breadth, paths, and extensions of the writing process's other file activity distinguish a single artifact from staging in progress and enumerate what else needs review. The correlation covers the writer and its direct children, since droppers often delegate.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process spawned the application that wrote the script, and is that parent chain expected?
  context: The parent process reveals how the writing binary was invoked. A document viewer or download utility launched by explorer.exe for a user action is very different from one launched by an Office application, a script host, or an unexpected command interpreter, which points to macro-driven or exploit-driven execution. Walk up the tree to see what spawned the parent and what else that parent spawned.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: If a payload executed from this activity, what is its hash — and is it known to threat intelligence?
  context: The hash needed for a reputation lookup or sandbox detonation is recorded when a payload runs, not when the script is written — file-creation events carry no hash in this telemetry. This returns the processes the writing binary and the shell that launched it spawned — its children and siblings — with their executable hashes, which for a drop-and-execute is the interpreter or second-stage payload. If the script was run later by an unrelated process it will not appear here; retrieve it from its on-disk path and hash it manually.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection_children
    fields:
      - Image
      - Hashes
- question: Did the dropped script execute, and if so which interpreter ran it and what did that process do?
  context: Scripts are not run as their own image; an interpreter such as powershell.exe, wscript.exe, cscript.exe, mshta.exe, or python.exe loads them, so the dropped file name appears in that process's command line rather than as its executable. This searches for the script name in later command lines to confirm execution and identify the interpreter. The hash returned is the interpreter's, not the script's — hash the script from disk to check its reputation.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|expand: '%file_basename%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - Hashes
- question: Did the writing process open an external network connection around the time of the drop?
  context: Several of the flagged binaries can retrieve content over the network before writing it to disk — certutil, Desktopimgdownldr, esentutl, and finger all support remote fetches. An external connection by the writing process close to the drop indicates the script content was pulled from a remote source rather than assembled from local data; document viewers such as wordpad.exe or AcroRd32.exe writing a script with no accompanying connection points instead to embedded or locally staged content.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: When this host has previously fired this rule's pattern, what programs and users normally drive it, and does the current alert fit?
  context: Even flagged binaries occasionally write scripts as part of legitimate tooling. The query mirrors the rule's selection scoped to this host, so the resulting program and user distribution reflects how this specific drop pattern (not generic use of the binary) has historically run here. A new acting program process, an unexpected user account, or a first-ever appearance of the pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith:
        - \eqnedt32.exe
        - \wordpad.exe
        - \wordview.exe
        - \certutil.exe
        - \certoc.exe
        - \CertReq.exe
        - \Desktopimgdownldr.exe
        - \esentutl.exe
        - \mshta.exe
        - \AcroRd32.exe
        - \RdrCEF.exe
        - \hh.exe
        - \finger.exe
        TargetFilename|endswith:
        - .bat
        - .chm
        - .csproj
        - .hta
        - .js
        - .jse
        - .proj
        - .ps1
        - .py
        - .scf
        - .vbe
        - .vbs
        - .wsf
        - .wsh
      filter_main_mshta:
        Image|endswith: \mshta.exe
        TargetFilename|endswith: .hta
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - Image
    - User
- always_include: true
  question: Has this user previously produced this rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection scoped to this user, so the result is the user's 90-day history of this specific drop pattern (not generic use of the binary), aggregated by host. A user who has never produced this pattern is more suspicious than one who does so regularly; weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith:
        - \eqnedt32.exe
        - \wordpad.exe
        - \wordview.exe
        - \certutil.exe
        - \certoc.exe
        - \CertReq.exe
        - \Desktopimgdownldr.exe
        - \esentutl.exe
        - \mshta.exe
        - \AcroRd32.exe
        - \RdrCEF.exe
        - \hh.exe
        - \finger.exe
        TargetFilename|endswith:
        - .bat
        - .chm
        - .csproj
        - .hta
        - .js
        - .jse
        - .proj
        - .ps1
        - .py
        - .scf
        - .vbe
        - .vbs
        - .wsf
        - .wsh
      filter_main_mshta:
        Image|endswith: \mshta.exe
        TargetFilename|endswith: .hta
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this rule's pattern on this host or across the environment, or is the program new for this activity?
  context: When the alert fires under a service or machine account, user identity does not attribute behavior; the meaningful pivot is the launch mechanism. The query mirrors the rule's selection scoped to the alerting program, so the result is the 90-day history of this program driving this specific drop pattern. A new or rare program for this pattern is the deviation worth chasing; a program that already accounts for thousands of prior events is vendor or operating-system automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith:
        - \eqnedt32.exe
        - \wordpad.exe
        - \wordview.exe
        - \certutil.exe
        - \certoc.exe
        - \CertReq.exe
        - \Desktopimgdownldr.exe
        - \esentutl.exe
        - \mshta.exe
        - \AcroRd32.exe
        - \RdrCEF.exe
        - \hh.exe
        - \finger.exe
        TargetFilename|endswith:
        - .bat
        - .chm
        - .csproj
        - .hta
        - .js
        - .jse
        - .proj
        - .ps1
        - .py
        - .scf
        - .vbe
        - .vbs
        - .wsf
        - .wsh
      filter_main_mshta:
        Image|endswith: \mshta.exe
        TargetFilename|endswith: .hta
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
