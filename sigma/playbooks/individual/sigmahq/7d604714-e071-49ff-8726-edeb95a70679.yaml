      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this drop pattern rather than generic use of the binaries. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith:
        - \eqnedt32.exe
        - \wordpad.exe
        - \wordview.exe
        - \certutil.exe
        - \certoc.exe
        - \CertReq.exe
        - \Desktopimgdownldr.exe
        - \esentutl.exe
        - \mshta.exe
