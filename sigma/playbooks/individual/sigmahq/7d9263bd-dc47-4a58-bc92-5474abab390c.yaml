name: Change Winevt Channel Access Permission Via Registry
id: e0c3c101-78bd-4889-89c6-ef29332b1546
description: |
  Detects modification of a Windows Event Log channel's access permissions through the registry. The rule fires when a process writes a restrictive security descriptor (an SDDL string that grants access only to Local System, Local Administrators, or Built-in Administrators) to a value ending in \ChannelAccess under HKLM\...\WINEVT\Channels\, AND the writing process is neither the legitimate servicing binary TrustedInstaller.exe nor TiWorker.exe.
  Restricting a channel's access limits which principals can read or write that event log, a defense-evasion technique used to keep activity out of normal log collection. Investigation should confirm which channel was targeted, decode the written SDDL, identify the process and account responsible, and determine whether the restriction accompanied other log-tampering or persistence actions.
type: detection
detection_id: 7d9263bd-dc47-4a58-bc92-5474abab390c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Do the registry key path and value data match what this rule detects?
  context: Confirm the alert is a true positive before investing investigation time. The rule requires a TargetObject under WINEVT\Channels\ ending in \ChannelAccess AND a Details value containing a restrictive access-control entry such as (A;;0x1;;;SY), (A;;0x1;;;LA), or (A;;0x5;;;BA). Writes by the servicing binaries TrustedInstaller.exe and TiWorker.exe are excluded as legitimate, so the writing process shown here is expected to be something else.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify Windows event log channel access permissions?
  context: Changing a channel's access descriptor is a rare, privileged operation normally tied to servicing or deliberate administration. Knowing whether the account and host function are consistent with legitimate event-log management is often the fastest way to separate a true positive from routine activity. If User is a machine account or SYSTEM, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which event log channel was targeted, and what access does the written security descriptor grant or restrict?
  context: The value name under WINEVT\Channels\ identifies the targeted channel (Security, System, or a provider operational channel). Decode the SDDL in Details, where each access-control entry lists a type, permission mask, and trustee, so (A;;0x1;;;SY) grants read to Local System and (A;;0x5;;;BA) grants read plus clear to Built-in Administrators. A descriptor listing only these privileged trustees strips the broader read access the channel normally carries, keeping its records out of collection.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What tool and full command performed the ChannelAccess modification?
  context: The registry event names the writing process but not its arguments; pivoting to that process's creation event reveals the full command line. Registry-editing utilities or scripts may show the SDDL string directly, while a binary that calls the registry API sets the value with no descriptor visible on the command line. Either way, the command line establishes how the change was made.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process invoked the tool that wrote this registry value?
  context: The parent of the writing process shows how the modification was launched. A servicing or management chain (services.exe, a deployment agent) reads very differently from an interactive shell, a script host such as wscript.exe or powershell.exe, or an Office child process, which point to hands-on or macro-driven activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
- question: Has this event log channel's ChannelAccess value been modified before on this host?
  context: Legitimate ChannelAccess changes are rare and are normally made by servicing processes, which this rule already excludes. Zero or very low history for this key on this host means a first-time modification by a non-servicing process, which is more notable than a routinely changing value. Compare the historical Details values against the one that fired.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: After the alert, was this ChannelAccess value written again, either reverted to a broader descriptor or left restricted?
  context: The restriction stays in effect until the value is overwritten; this telemetry emits no registry-delete event, so persistence is judged from later writes to the same key rather than from a removal. A subsequent write of a broader SDDL (for example by a servicing process or an administrator) indicates the access was restored, while no further write means the channel remains locked down.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What other registry modifications were made on this host around the same time?
  context: Attackers who alter one key often alter several. Other ChannelAccess writes, Defender policy keys, audit-policy values, or Run keys from the same writing process within the window reveal whether this was an isolated change or part of a broader configuration-tampering operation. The triggering key will appear in the results; the signal is what else changed alongside it.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Were other defense-tampering commands run on this host, such as clearing event logs, disabling auditing, or stopping services?
  context: Event-channel access restriction often accompanies other log tampering. This surfaces process executions that clear logs, disable recovery, stop services, or change firewall and Defender settings on the host. Log-clearing invocations (wevtutil cl / clear-log) here corroborate a broader effort to suppress event evidence beyond the single channel that was restricted.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Is the affected event log channel's access still restricted, or has it been restored?
  context: The restriction persists until the descriptor is rewritten, so a channel left locked down means records from it are still not being collected and the access should be restored before the investigation relies on that log. Confirm the current effective access by inspecting the channel directly on the host or by checking for a later broader-descriptor write to the same key. The query re-displays the tampering command for reference only.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What executed on this host after the event log channel was restricted?
  context: Channels are locked down to keep subsequent actions out of the log, so process activity in the window after the write may reveal what the restriction was meant to conceal. Note that the tampered channel itself is a visibility gap; correlate with network connections and file activity in the same window, and treat missing records from the affected channel as expected rather than as absence of activity.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Was this ChannelAccess key modified on other hosts in the environment?
  context: The same channel restriction across many hosts suggests a centrally pushed policy or fleet-wide malware, while a single host suggests targeted tampering. Compare the Details descriptor across hosts to see whether the same value is being set everywhere or whether this host stands alone.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Does this host normally run the process that wrote the registry value?
  context: A writing process with no execution history on this host is more notable than a routinely present management tool. Zero or very low counts over the baseline period indicate first-time or rare execution of the binary that performed the channel-access change, which strengthens the case that the modification was not part of normal operations.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — credential access, execution, reconnaissance, or other defense tampering — may show the stages that preceded the log tampering and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were process-based persistence mechanisms installed on this host around the same time?
  context: Defense tampering and persistence often occur together in a hands-on intrusion. Scheduled tasks, services, Run-key writes, or BITS jobs created in the same timeframe indicate the actor established a foothold alongside the log tampering rather than performing an isolated administrative change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task persistence locations on this host?
  context: File-based persistence bypasses command-line detection entirely. Drops to a Startup folder or to a path referenced by a registry Run key in the same window point to a broader intrusion, since file-event monitoring captures these even when the attacker avoids the standard persistence tools.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
