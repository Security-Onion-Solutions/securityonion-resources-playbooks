name: Scripted Diagnostics Turn Off Check Enabled - Registry
id: 743336e1-adca-470b-ba19-beb51c331457
description: |
  Detects a registry write that sets the ScriptedDiagnostics policy value TurnOffCheck to 1, under a key path
  ending in \Policies\Microsoft\Windows\ScriptedDiagnostics\TurnOffCheck. Both conditions must hold on the same
  event: the key path and the DWORD value 1. ScriptedDiagnostics is the Microsoft Support Diagnostic Tool and
  troubleshooting-pack framework; enabling TurnOffCheck removes the signature check that normally prevents
  unsigned diagnostic packages from running, which is the guardrail relevant to the ms-msdt handler abuse
  described by CVE-2022-30190. The change lowers a defense rather than executing anything, so the alert marks an
  enabling step, not the activity it enables. This value is Group Policy-managed and is legitimately touched by
  troubleshooting-pack deployment, IT policy baselines, and support tooling, so a domain-wide push looks
  identical to a targeted change on a single host. The investigation should establish which process wrote the
  value, whether the change was policy-driven or hands-on, how widely it appears across the fleet, and whether
  diagnostic-package execution followed on this host.
type: detection
detection_id: 7d995e63-ec83-4aa3-89d5-8a17b5c87c86
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Do the registry key path and value data match what this rule detects?
  context: >-
    The rule fires only when both parts hold together — the key path ends in
    \Policies\Microsoft\Windows\ScriptedDiagnostics\TurnOffCheck and the value data written is the DWORD 1.
    Confirm both against the event before investing further time, and note the writing process. The signer
    columns are context, not a verdict; read them for coherence between the vendor that published the writing
    process and a machine-wide diagnostics policy value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - registry_event
- question: Is this user and host expected to modify diagnostics policy values?
  context: >-
    Policy values under \Policies\Microsoft\Windows are normally written by Group Policy processing or by a
    documented configuration-management routine, not by an interactive account. Knowing the host's role and
    whether this account administers policy on it is often the fastest way to separate a managed baseline change
    from a hands-on edit. User attribution is present on most endpoint registry events; when it resolves to a
    machine account or SYSTEM, judge the writer by the process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What specific registry key and value were modified, and is this a known evasion location?
  context: >-
    The key path carries the intent. ScriptedDiagnostics governs the Microsoft Support Diagnostic Tool and
    troubleshooting-pack framework; TurnOffCheck set to 1 turns off the check that keeps unsigned diagnostic
    packages from running, which is a defense-relevant policy location rather than a persistence one. Confirm the
    full path and value, and judge whether the vendor that signed the writing process plausibly owns a
    machine-wide diagnostics policy setting.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - registry_event
- question: What value data was written, and does it enable or restore the diagnostics check?
  context: >-
    Read the value data rather than assuming it from the alert title. A DWORD of 1 on TurnOffCheck turns the
    check off, which is what this rule fires on; a later write of 0 restores it. Value data is recorded on most
    endpoint registry modifications but is absent when the data is binary or empty, so treat a missing value as a
    telemetry gap rather than evidence the value was cleared.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
  answer_sources:
  - registry_event
  - manual_review
- question: What command wrote this policy value, and what guardrail does it remove?
  context: >-
    The control targeted here is the signature check on scripted diagnostics — with it off, diagnostic packages
    that are not signed will run through the troubleshooting framework. Read the command line of the process that
    performed the write to identify how the value was set, whether through a policy-management utility, a
    registry editing tool, or a script. That distinction sets the remediation and the investigation priority.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: What process wrote this value, and what spawned it?
  context: >-
    The registry event names the writing process but not its origin. Retrieving that process's own start event
    reveals the parent that launched it. A policy-processing service or a configuration-management agent is
    consistent with a managed change; a script host, an Office application, or a command interpreter under an
    interactive session points at a hands-on or scripted edit that should be accounted for. Command line and
    parent are not carried on the registry event itself, so this pivot is how they are obtained.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: Did policy-management or registry-editing tooling run on this host around the time of the write?
  context: >-
    This value is Group Policy-managed, so the discriminating question is whether the write arrived through the
    policy path or was made directly. Group Policy processing and configuration-management runs leave their own
    process activity in the surrounding window; a direct edit shows up as a registry utility, a script host, or a
    command interpreter instead. Correlate what ran here with the account and parent on the writing process, and
    with any change record covering a troubleshooting-pack or baseline deployment.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_config_tools:
        Image|endswith:
          - '\gpupdate.exe'
          - '\gpscript.exe'
          - '\reg.exe'
          - '\regedit.exe'
          - '\msiexec.exe'
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\cmd.exe'
          - '\wscript.exe'
          - '\cscript.exe'
      condition: selection and selection_config_tools
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Was this same policy value written on other hosts in the environment?
  context: >-
    Fleet distribution is the strongest discriminator for a policy-managed value. The same write landing across
    many hosts in the same window is the signature of a domain-wide push or a troubleshooting-pack deployment; a
    single host standing alone is the case that needs an owner. Compare the value data and the writing process
    across hosts — a consistent writer and value across a fleet reads as managed configuration, while one host
    with a different writer does not.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
  answer_sources:
  - registry_event
- question: Has this policy value been modified before on this host?
  context: >-
    Diagnostics policy values should rarely change on a stable host, so historical frequency calibrates the
    finding. A recurring pattern of writes with the same value and the same writer is consistent with policy
    refresh reapplying a baseline. No prior history means the value was set for the first time, which puts more
    weight on identifying who set it and why.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
  answer_sources:
  - registry_event
- question: Does the value remain set, or was it later rewritten on this host?
  context: >-
    Look at the key's full modification history after the alert to judge whether the setting stuck. A later write
    of 0 restores the check, while repeated writes of 1 suggest something reasserts the setting after policy
    refresh reverts it. Registry value deletions are not recorded in endpoint telemetry, so absence of further
    events is not evidence the value was removed — judge the state from the re-modification history and from
    direct host inspection.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
  answer_sources:
  - registry_event
  - manual_review
- question: Is the signature check on scripted diagnostics currently restored, or is it still turned off?
  context: >-
    The setting may have been reverted by the next policy refresh or it may still be in place. Confirm the
    current state of the value on the host directly rather than inferring it from the alert, since the registry
    event only records the write. If the check is still off, restoring it removes the exposure while the rest of
    the investigation proceeds. The query redisplays the command that performed the write for reference.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - edr_console
  - manual_review
- question: Did diagnostic-package execution follow on this host after the value was set?
  context: >-
    The setting only matters if the diagnostics framework was then used. msdt.exe, pcwrun.exe, and sdiagnhost.exe
    are the processes that run troubleshooting packs, and their parents carry the signal — a support technician's
    session or the Control Panel troubleshooter is routine, while a document-handling application or a browser as
    parent means the diagnostics handler was invoked from content rather than by a user opening a troubleshooter.
    No execution in the window means the change stands on its own as a configuration finding.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_diag:
        Image|endswith:
          - '\msdt.exe'
          - '\pcwrun.exe'
          - '\sdiagnhost.exe'
      condition: selection and selection_diag
    fields:
      - Image
      - CommandLine
      - ParentImage
  answer_sources:
  - process_creation
- question: What activity occurred on this host after the check was turned off?
  context: >-
    A defense is lowered ahead of something that the defense would otherwise stop. Reviewing what ran on the host
    in the hour after the write shows whether the change was followed by execution or whether it stands alone as
    a configuration action. Novel binaries and unusual accounts in that window are what to scan for; a quiet
    window supports a routine baseline change.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: Were other defense tampering actions performed on this host?
  context: >-
    Lowering one guardrail is often accompanied by others — service stops, log clearing, firewall changes, or
    protection settings edited in the same session. Several such actions from the same account or parent within
    the window points at a deliberate operation rather than a single managed policy change. The results include
    routine administrative use of these utilities, so weigh the account and the timing against the diagnostics
    write.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: Were other registry modifications made on this host in the same session?
  context: >-
    Configuration changes rarely arrive alone. Grouping every registry write on the host in the surrounding
    window by key path and writing process shows what else changed alongside the diagnostics value. A batch of
    policy paths written by the same process within seconds is consistent with policy refresh; the diagnostics
    value written on its own, or beside autostart and protection keys, is a different picture. The alerting key
    will appear in the results — the signal is what accompanies it.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
  answer_sources:
  - registry_event
- question: What other registry activity occurred on this host around the time of the alert?
  context: >-
    Widening to all registry activity on the host in the surrounding window collapses repetitive writes into
    high-count rows while uncommon key and writer pairs stand out at low counts. That contrast is what shows
    whether the diagnostics write sits inside a broad, machine-driven configuration pass or arrived as an
    isolated change against an otherwise quiet registry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
  answer_sources:
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Turning off a check is an enabling step, so the events that led up to it carry weight. Earlier detections on
    the same host — delivery of content, script execution, or other configuration changes — help place this write
    in a sequence and establish whether it was preceded by activity that would explain why the setting was
    changed. No prior detections leaves the change to be explained on its own terms.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    Where a lowered defense is followed by execution, the operator commonly arranges to come back. Scheduled
    tasks, services, registry autostart entries, and BITS jobs created in the same broad window as the
    diagnostics write suggest the change belongs to a larger sequence rather than a maintenance action. These
    utilities are also routine administrative tools, so read the results alongside the account and parent
    identified on the write.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
