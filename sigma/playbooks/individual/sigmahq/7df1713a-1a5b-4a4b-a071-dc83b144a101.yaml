name: Esentutl Gather Credentials
id: 2798e6e9-9abb-483b-a10c-beae9775e1af
description: |
  Fires when esentutl is invoked with a ' /p' (repair) argument. esentutl is a
  signed Windows utility for the Extensible Storage Engine (ESE) database format;
  the credential-access abuse copies or repairs ESE databases that hold secrets —
  the NTDS.dit domain database on a domain controller, or browser credential stores
  such as Edge/Chrome WebCache — so the data can be parsed offline. Legitimate use
  exists (database maintenance, backup recovery), so the investigation determines
  which ESE database the command touched, what parent invoked it, whether the user
  and host are expected to run database-repair tooling, and whether credential
  access was followed by lateral movement.
type: detection
detection_id: 7df1713a-1a5b-4a4b-a071-dc83b144a101
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line contain esentutl together with a ' /p' repair argument?
  context: Before investing investigation time, confirm the alert is a true positive by
    reviewing the exact command line against the rule's criteria — esentutl AND a ' /p'
    argument must both be present. Note the database file path that follows, since it
    identifies which ESE store was touched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run ESE database-repair tooling such as esentutl?
  context: Legitimate esentutl /p use is largely confined to database administrators,
    backup operators, and domain controller maintenance. A workstation user or a host
    with no database-administration role running esentutl repair against a credential
    store is the deviation worth chasing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which ESE database did esentutl target, and is it a credential store?
  context: Read the file path argument on the command line to determine what was touched.
    Paths under the NTDS directory (the domain database, ntds.dit) point at full domain
    credential theft; paths under user AppData browser profiles (WebCacheV*.dat and
    similar) point at saved-password and history theft. esentutl /p can repair a copy
    extracted from a shadow snapshot so a locked, in-use database becomes readable offline.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned this esentutl invocation, and is that parent chain expected?
  context: The parent reveals how esentutl was launched. Interactive maintenance typically
    descends from explorer.exe or a console started by an administrator; launches from
    script hosts, Office applications, or remote-execution service processes suggest the
    command was driven by an intruder or a malicious script rather than a database
    administrator.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Was an ESE credential database file accessed or written on this host around the alert?
  context: esentutl /p operates on a database file on disk, so the load-bearing artifact
    is file activity against a credential store. Look for the domain database (ntds.dit),
    its working files, or browser credential caches (WebCacheV*.dat, History, Login Data)
    being read or written, especially copies staged outside their normal directories. A
    repair that produces a readable copy of one of these databases confirms credential-access
    intent. If file telemetry is not collected on this host, treat zero results as a
    visibility gap rather than evidence nothing happened.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_files:
        TargetFilename|contains:
          - 'ntds.dit'
          - 'WebCacheV'
          - '\Login Data'
          - '\History'
          - 'edb.log'
          - 'EDB.chk'
      condition: selection_host and selection_files
    fields:
      - TargetFilename
      - Image
      - User
- question: Has this host run esentutl with a repair argument before?
  context: A repair invocation that has never been seen on a host is more suspicious than
    one that recurs on a maintenance schedule. Zero or very low historical counts indicate
    first-time or rare execution of this specific pattern.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
          - 'esentutl'
          - ' /p'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the esentutl repair pattern, what parents
    and users drove it, and does the current alert fit that pattern?
  context: Even legitimate database tooling has a stable profile. The query mirrors the
    rule's selection scoped to this host, so the resulting parent and user distribution
    reflects how this specific firing pattern has historically run here. A new parent
    process, an unexpected user account, or an unusual command structure is the anomaly worth
    chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - esentutl
        - ' /p'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did this esentutl invocation spawn afterward?
  context: The children of the launching context reveal the operation's actual impact.
    Credential staging is often followed by archiving, copying, or transferring the
    extracted database, so look for compression utilities, copy operations, or network
    tooling started by the same parent shortly after the repair.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - esentutl
        - ' /p'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - esentutl
        - ' /p'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or
    activity spanning multiple endpoints. If the same user drove similar activity on
    several hosts, the scope of credential access may be larger than this one alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - esentutl
        - ' /p'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals
    the immediate context — what led to this event, what happened after, and whether it is
    part of a larger sequence. Look for shadow-copy creation, reconnaissance, privilege
    escalation, or data staging that surrounds the credential-access step.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or
    shadow-copy creation — may reveal the attack stages that preceded this credential-access
    step and help reconstruct the full timeline. Credential dumping from ESE databases is
    frequently preceded by snapshot creation that makes a locked database copyable.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Which accounts may be compromised, and do any have elevated privileges?
  context: The severity of this credential theft depends on what the targeted database held.
    A repaired NTDS.dit exposes every domain account, including Domain Admin and krbtgt,
    and requires incident escalation; a browser credential store exposes only that user's
    saved passwords. Cross-reference the affected scope against directory group memberships
    to scope remediation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
