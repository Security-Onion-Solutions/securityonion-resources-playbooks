name: Potential Encrypted Registry Blob Related To SNAKE Malware
id: 6d3544ba-5bbc-41cd-af57-92a6d0ff8938
description: |
  Detects a registry value written under the Windows file-association key
  \SOFTWARE\Classes\.wav\OpenWithProgIds\ whose value name is neither the standard
  .AssocFile.WAV association nor any name containing ".wav." — that is, an entry under an
  audio-handler registration key that does not correspond to a normal audio handler. Storing
  an encrypted payload or configuration as registry value data rather than as a file on disk
  keeps the content away from file-scanning controls; the stored value is inert on its own,
  so a separate process must read and decrypt it before anything executes. The investigation
  should establish which process wrote the value, what the value data contains, whether a
  loader or dropped file exists on the host, and whether the same value name appears on other
  hosts.
type: detection
detection_id: 7e163e96-b9a5-45d6-b2cd-d7d87b13c60b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Does the alerting value sit under the .wav\OpenWithProgIds key with a name that is
    neither the standard .AssocFile.WAV association nor a name containing ".wav."?
  context: >-
    The rule fires only when all three conditions hold together — the key path contains
    \SOFTWARE\Classes\.wav\OpenWithProgIds\, the value name does not end in .AssocFile.WAV,
    and the value name does not contain ".wav." — so confirm each one against the exact
    TargetObject before spending further time. Both exclusions describe ordinary audio-handler
    registrations, which means the remaining value name is the whole substance of the alert;
    read it character by character and note whether it looks like a ProgID at all. The signer
    columns say who published the writing process, and they are context rather than a verdict
    — nearly every alerting process is trusted-signed. The useful judgment is coherence — an
    audio application registering its own handler is self-consistent, while a general-purpose
    interpreter or a signed system utility writing an unreadable value name under an audio
    key is not.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - registry_event
- question: Is this user and host expected to register file-association handlers for audio files?
  context: >-
    Writes under \SOFTWARE\Classes\.wav\OpenWithProgIds\ normally come from installers and
    from media applications claiming the file type, and they usually happen at install or
    first-run time rather than during routine use. If the account is a machine account or is
    absent, attribute the activity through the writing process instead. Read the signer
    columns for coherence with an audio-handler registration rather than as a pass or fail.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Does the timing of this registry write align with a software deployment or maintenance window?
  context: >-
    File-association registrations cluster around installs, upgrades, and package rollouts,
    so a write that lands inside a documented deployment window has an ordinary explanation
    available. The same write at a time when no package activity is scheduled, or outside the
    hours the account normally operates, leaves the registration unaccounted for and keeps
    the writing process as the open question.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - asset_inventory
- question: >-
    What exact value name and value data were written under the audio-handler key, and does
    the writing process plausibly own that registration?
  context: >-
    The OpenWithProgIds subkey is a list of ProgIDs that can open a file type, so every normal
    value name there is a readable handler identifier such as WMP11.AssocFile.WAV. A value
    name that is a long random-looking string is not a handler registration at all; the key is
    being used as a storage location. Judge whether the vendor that signed the writing process
    plausibly owns an audio handler — a media player registering its own ProgID is coherent,
    while a signed system utility or interpreter writing an opaque name into the same key is not.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - registry_event
- question: What data is stored in this registry value, and does it read as encrypted or compressed content?
  context: >-
    A normal ProgIds entry carries a trivial marker value; content of any real size stored
    here is a payload or a configuration blob, and high-entropy bytes with no readable strings
    are consistent with encryption. Value data is not recorded for every registry modification
    and is specifically unavailable when the data is binary, which is exactly what an encrypted
    blob would be — so an empty Details column is consistent with a binary blob rather than
    evidence the value is empty, and the data should then be read from the host or from an
    endpoint console directly. Record the value size where it is available, since a
    kilobyte-scale value under an association key has no legitimate counterpart.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - TargetObject
      - ProcessGuid
  answer_sources:
  - registry_event
  - manual_review
  - edr_console
- question: >-
    What other values exist under the .wav\OpenWithProgIds key on this host, and how many of
    them are uncommon names?
  context: >-
    Payload staging in the registry is rarely a single value — content that exceeds a
    practical value size gets split across several entries under the same key, and a
    configuration blob usually sits beside the payload it configures. Enumerating every
    modification under \SOFTWARE\Classes\.wav\OpenWithProgIds\ separates a single odd entry
    from a set of them written by the same process in one burst, and the legitimate handler
    registrations that appear alongside give a direct comparison for what a normal value name
    on this host looks like.
  range: -30d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\SOFTWARE\Classes\.wav\OpenWithProgIds\'
      condition: selection
    fields:
      - TargetObject
      - Image
      - Details
  answer_sources:
  - registry_event
- question: Which process wrote this registry value, and what launched that process?
  context: >-
    This is the decisive pivot for the alert — the registry event names the acting process but
    not its origin, and the writing process is what connects an opaque stored value to
    something executable on the host. Retrieving that process's own start event supplies the
    command line and the parent. An installer or a media application launched from explorer.exe
    or services.exe fits an association registration; an interpreter, a script host, or a
    process launched from an Office application or a browser child does not, and its command
    line becomes the next thing to read.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: Does this host normally run the process that wrote the value?
  context: >-
    A binary that has run regularly on this host for months and writes association keys as part
    of its normal function is a different finding from one that appears for the first time
    minutes before the registry write. Zero or very low historical counts point to a
    first-time or rare execution and raise the value of the process's own origin. The grouping
    by account also shows whether the binary normally runs under this user or under a service
    context.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: Is this value still present, and has anything rewritten it since the alert?
  context: >-
    Registry-resident payloads are maintained — the loader that consumes the value often
    rewrites it after each use, and a configuration blob gets updated as the operation
    progresses. Value deletion is not recorded by endpoint registry telemetry, so removal
    cannot be confirmed from logs; judge the value's persistence from its re-modification
    history over a longer window and from whether the writing process is still on the host.
    Repeated writes to the same value name by the same process describe active use rather than
    a one-time registration.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - registry_event
  - manual_review
- question: Has this exact registry value been written on this host before?
  context: >-
    A legitimate handler registration is written once at install time and then sits unchanged,
    so a long history of writes to the same value name from the same installer reads as
    ordinary software behaviour. No history at all means the value name is new to this host,
    which narrows the question to what created it and when. Compare the recorded value data
    across the results to see whether the content is stable or changes on each write.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
  answer_sources:
  - registry_event
- question: Were other registry modifications made on this host in the same session?
  context: >-
    A process that stages content in one registry location commonly touches several — an
    autostart entry that launches the loader, a service or COM registration, or settings
    changes made in the same burst. Grouping every registry modification on the host in the
    surrounding window by key path and writing process puts the alerting write in company. The
    alerting key will appear in the results; the signal is what else the same process wrote
    beside it.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
  answer_sources:
  - registry_event
- question: Did the process that wrote the value, or any of its children, also drop files on this host?
  context: >-
    A payload held in the registry cannot run by itself — something on disk has to read the
    value, decrypt it, and execute the result, so the presence of a loader written in the same
    session is what turns stored content into a working mechanism. Correlating file activity
    by the writing process and its children surfaces that loader if it was dropped rather than
    already resident. File writes carry no hash; if a file of interest is present, hash it from
    a later execution of that path or retrieve it for a reputation lookup. An absence of file
    writes does not close the question, since a resident interpreter can serve as the loader.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What ran on this host in the hours after the registry write?
  context: >-
    Registry reads are not recorded by endpoint telemetry, so the process that consumes the
    stored value cannot be identified directly; the observable consequence is what executed
    afterwards. Grouping process activity across the following window by binary and command
    line brings out interpreters, script hosts, rundll32 or regsvr32 invocations, and
    unfamiliar binaries that appeared after the write and could be reading the value. Match
    anything here against the writing process and its parent rather than treating the list as
    a verdict on its own.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
  - registry_event
- question: Was this same registry value written on other hosts in the environment?
  context: >-
    The same value name appearing across several hosts separates a software rollout or a
    policy push from activity confined to one machine. Legitimate handler registrations spread
    with the application that owns them and carry the same writing process everywhere, so the
    writing process column is the discriminator — a consistent installer across hosts is
    ordinary, while the same opaque value name written by different or unfamiliar processes is
    not. A single-host result keeps the finding local and points the investigation at how this
    host was reached.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
  answer_sources:
  - registry_event
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Registry staging normally sits inside a longer sequence — the content has to arrive on the
    host before it can be written, and something has to arrange for it to be read afterwards.
    Grouping process activity in the surrounding window by binary and parent collapses routine
    telemetry into high-count rows and leaves unfamiliar parent and child pairings standing out
    at low counts, which is what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Content stored in the registry has to be delivered first, so earlier detections covering
    download activity, script execution, or defense tampering may identify how the payload
    reached the host and which process brought it. An empty result does not clear the host; it
    means no other rule fired in the window.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Were other persistence mechanisms installed on this host around the time of the registry write?
  context: >-
    A registry-stored payload needs something to trigger it, and the same session frequently
    installs a conventional autostart alongside — a scheduled task, a service, or a Run key
    entry written with reg.exe. Surfacing persistence tool executions across the surrounding
    window shows whether the stored value is paired with a launcher and whether more than one
    mechanism was stacked. Compare the accounts and timing against the registry write rather
    than reading each execution in isolation.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Were files dropped to Startup folders or scheduled-task definition paths on this host?
  context: >-
    Persistence can be established without running any persistence tool, by writing a file
    into a Startup folder or writing a scheduled-task XML definition directly, and file
    telemetry captures those drops when the command-line route is avoided. For a payload held
    in the registry this is the parallel question to the persistence tools — a small loader
    dropped into Startup is enough to read and execute the stored value at every logon.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
