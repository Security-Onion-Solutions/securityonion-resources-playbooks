name: Windows Internet Hosted WebDav Share Mount Via Net.EXE
id: f666844f-7f7b-47b9-b38a-270b38740900
description: |
  Detects net.exe or net1.exe mounting an internet-hosted WebDAV share, identified by a command line that
  contains both ' use ' and an ' http' URL. Mapping a drive to an attacker-controlled WebDAV endpoint lets an
  operator stage and execute remote payloads as if they were local files, bypassing some download controls and
  blending file access into normal SMB-style drive usage. Legitimate uses exist (developers or IT mapping a
  WebDAV-backed document store), so the investigation should confirm the destination URL, who and what launched
  net.exe, whether the host has mounted such shares before, and what executed from or after the mount.
type: detection
detection_id: 7e6237fe-3ddb-438f-9381-9bf9de5af8d0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Did net.exe or net1.exe run with ' use ' and an ' http' URL on the command line?
  context: Confirm the alert is a true positive by reviewing the exact command line and process identity. The
    rule fires only when net.exe or net1.exe (by Image or OriginalFileName) carries both the ' use ' verb and an
    ' http' substring, which together indicate a drive mapping to an internet-hosted WebDAV endpoint rather than
    an internal SMB share.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to map internet-hosted WebDAV shares with net.exe?
  context: Legitimate administrative or developer activity can map WebDAV-backed drives, but most endpoints and
    users never do. Knowing whether the user role and host function are consistent with mounting an HTTP(S) share
    is often the fastest path to distinguishing routine operations from operator activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the full WebDAV URL and drive letter in the net use command?
  context: The full command line reveals the exact destination. Decode the ' http' URL (host, path, http vs.
    https, any embedded credentials or ports) and the target drive letter. The destination host is the pivot for
    reputation and network-trail checks; a freshly registered or unfamiliar domain mapped as a drive is the
    detail that drives disposition.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains|all:
          - ' use '
          - ' http'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned net.exe, and is that parent chain expected?
  context: The parent process reveals how the mount was invoked. A drive mapping launched by explorer.exe or a
    logon script differs from one launched by mshta.exe, wscript.exe, powershell.exe, or an Office application,
    which would point to scripted or macro-driven execution rather than a deliberate user action.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What network logon or credential-mapping events accompanied this WebDAV mount?
  context: Mounting a WebDAV share authenticates to the remote endpoint, producing logon events (4624) and, when
    explicit credentials are passed, credential-mapping events (4648). Correlating those events with the mount
    identifies the account used and whether the access came with explicit alternate credentials, which separates
    routine session reuse from deliberate credential supply to a remote host. If Security event logs are not
    ingested in this environment, treat zero results as a visibility gap rather than evidence nothing authenticated.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 4624
          - 4648
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetUserName
      - LogonType
      - IpAddress
- question: What processes ran on this host shortly after the WebDAV share was mounted?
  context: Mounting a remote share is a means to an end. After the mount, look for processes that read or execute
    from the mapped drive letter or the WebDAV cache, especially script hosts, command interpreters, or unsigned
    binaries launched from the newly available path. This reveals whether the share was used to stage and run a
    payload.
  range: +30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - Image
- question: What child processes did net.exe spawn afterward?
  context: net.exe normally spawns net1.exe to carry out the requested operation and little else. Any other
    child process, or a chain that leads to a command interpreter or download tool, indicates the mount was a
    step in a larger sequence rather than a standalone drive mapping.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single net.exe invocation may be routine, but multiple reconnaissance commands in rapid succession
    -- whoami, nltest, net user, net view, ipconfig -- is a signature of post-compromise enumeration. WebDAV
    mounts that sit inside a recon burst are more likely to be operator-driven staging than administrative drive
    mapping.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \net.exe
        - \net1.exe
      - OriginalFileName:
        - net.exe
        - net1.exe
      selection_cli:
        CommandLine|contains|all:
        - ' use '
        - ' http'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \net.exe
        - \net1.exe
      - OriginalFileName:
        - net.exe
        - net1.exe
      selection_cli:
        CommandLine|contains|all:
        - ' use '
        - ' http'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or staging across multiple
    endpoints. If the same user mounted WebDAV shares or ran tools on several hosts in the same window, the scope
    of activity is broader than this single mount.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \net.exe
        - \net1.exe
      - OriginalFileName:
        - net.exe
        - net1.exe
      selection_cli:
        CommandLine|contains|all:
        - ' use '
        - ' http'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: When this host previously mounted WebDAV shares with net.exe, what parents and users drove it, and
    does this alert fit?
  context: Even routine tools can be abused. The query mirrors the rule's selection structure scoped to this
    host, so the resulting parent and user distribution reflects how the rule's specific firing pattern -- net.exe
    with ' use ' and ' http' -- has historically run here. A new parent process, an unexpected user account, or
    an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \net.exe
        - \net1.exe
      - OriginalFileName:
        - net.exe
        - net1.exe
      selection_cli:
        CommandLine|contains|all:
        - ' use '
        - ' http'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Was net.exe executed from its expected System32 path?
  context: net.exe and net1.exe run from System32 or SysWOW64 under normal use. A copy running from a user temp
    directory, a download folder, or the mounted WebDAV path itself would indicate the binary was relocated to
    evade path-based allowlists or staged from the share.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Were any other download or transfer LOLBins used on this host recently?
  context: Operators who use one living-off-the-land binary to fetch remote content often use several. A WebDAV
    mount alongside certutil, bitsadmin, curl, or PowerShell download cradles on the same host strengthens the
    case that this was a deliberate remote-staging step rather than a one-off drive mapping.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\hh.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Have other hosts mounted WebDAV shares with net.exe in the past week, and does the spread look like
    automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, giving a fleet-wide count of the
    rule's firing pattern rather than generic net.exe usage. Many hosts firing the same pattern points to scripted
    deployment or vendor automation mapping a shared WebDAV store; one host or a small unrelated set points to
    manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \net.exe
        - \net1.exe
      - OriginalFileName:
        - net.exe
        - net1.exe
      selection_cli:
        CommandLine|contains|all:
        - ' use '
        - ' http'
      condition: all of selection_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- reconnaissance, defense
    tampering, or credential access -- may reveal the stages that preceded the mount and help reconstruct whether
    the WebDAV share was part of a multi-step operation or an isolated event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
