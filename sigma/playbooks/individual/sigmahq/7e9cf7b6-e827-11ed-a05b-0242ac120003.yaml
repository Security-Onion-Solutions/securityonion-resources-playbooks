name: Suspicious Non-Browser Network Communication With Google API
id: aca11cc2-92ef-4474-b554-15572706ad83
description: |
  Detects a process other than a recognized web browser, updater, or mail client establishing outbound connections to Google API endpoints (drive, oauth2, sheets, or www.googleapis.com). Adversaries abuse legitimate cloud APIs as a command-and-control and exfiltration channel because the traffic blends with normal Google service usage and reaches no attacker-owned infrastructure, defeating reputation- and domain-based network detection. Investigation should identify the initiating process and its origin, confirm whether it is an approved application, and look for the connection cadence, data volume, and on-disk artifacts consistent with a covert channel rather than routine API use.
type: detection
detection_id: 7e9cf7b6-e827-11ed-a05b-0242ac120003
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the alert show a non-browser process connecting to one of the monitored Google API endpoints, and on which port?
  context: Confirm the connection by reviewing the destination hostname against the monitored googleapis endpoints, the port, and the initiating process, which the rule requires not to be a recognized browser, updater, or mail client. The contacted hostname is sparsely recorded on connection events and the alerting event may originate from network-level telemetry with no process fields attached, so use the DNS lookup to confirm the exact endpoint.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
  answer_sources:
  - alert
  - network_connection
- question: Is this user and host expected to run a non-browser application that communicates with Google API endpoints?
  context: Legitimate cases exist, including approved line-of-business integrations, custom Google Workspace automation, and sync clients not present in the browser exclusion list. Knowing whether the process and user fit the host's role is often the fastest way to separate a sanctioned integration from an unexpected tool.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What is the initiating process and what does its command line reveal?
  context: The full command line and working directory of the non-browser process show whether it is a sanctioned integration or an unknown tool. Look for embedded credentials, script paths, or arguments referencing sheets or drive operations. The network alert carries no command line, so this pivots to process telemetry for the same binary on the host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: Which specific Google API endpoints did this host resolve, and from which process?
  context: Enumerate the exact googleapis hostnames queried. The sheets and drive endpoints are the transport used by cloud-API command-and-control that reads instructions from and writes results to a spreadsheet or drive, whereas oauth2 or www calls alone may be ordinary token and service traffic. Because the contacted hostname is sparsely recorded on connection events, DNS lookups are the reliable source of which endpoint was reached.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|endswith:
        - drive.googleapis.com
        - oauth2.googleapis.com
        - sheets.googleapis.com
        - www.googleapis.com
      condition: selection
    fields:
      - QueryName
      - Image
  answer_sources:
  - dns_query
  - network_connection
- question: Is the process that contacted the Google API a recognized application, or an unexpected or renamed binary running from a user-writable location?
  context: The rule excludes known browsers, so the initiating process is something else. A binary whose recorded original filename differs from its on-disk name, or one running from a temporary, user-profile, or download path, points to masquerading or a dropped tool rather than a sanctioned integration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CurrentDirectory
  answer_sources:
  - process_creation
  - edr_console
- question: What process spawned the initiating process, and is that parent chain expected?
  context: How the process was launched narrows intent. A sync client started by services.exe or explorer.exe differs from a binary spawned by an Office application, a script host such as wscript.exe or mshta.exe, or a command shell, which points to macro- or script-delivered execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Does this host normally reach these Google API endpoints from a non-browser process?
  context: Browsers on most hosts contact googleapis routinely, so the discriminator is a non-browser process resolving these endpoints for the first time, or a newly seen process doing so. Grouped by process over 90 days. If DNS logging is not retained this far back in this environment, treat sparse history as a visibility gap rather than evidence nothing ran.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|endswith:
        - drive.googleapis.com
        - oauth2.googleapis.com
        - sheets.googleapis.com
        - www.googleapis.com
      condition: selection
    fields:
      - Image
  answer_sources:
  - dns_query
  - network_connection
- question: Does this host normally run this process at all?
  context: A process never before seen on the host is more notable than one that runs routinely. Zero or very low counts over 90 days indicate first-time or rare execution.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: What other network destinations did this process contact on this host?
  context: Pivoting on the initiating process reveals its full network footprint, including additional cloud endpoints, staging domains, or direct IP connections, which distinguishes a single API call from a broader covert channel or multi-stage operation. The alerting event may originate from network telemetry with no process fields, in which case correlate by host and time instead.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
  - dns_query
- question: How frequently and on what schedule does this process connect to the Google endpoint?
  context: Cloud-API command-and-control typically polls its command console at a regular interval, producing repeated connections at a steady cadence, while exfiltration produces bursts of outbound volume, for example more than roughly 1 MB within about five minutes. Connections concentrated outside normal business hours further separate automated polling from interactive use. Outbound byte volume is not summarized by this query; review the raw connection records for transfer size.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationPort
  answer_sources:
  - network_connection
- question: What files did this process write to disk on this host?
  context: Cloud-API command-and-control can download files to the host and stage data for upload. File writes by the initiating process may reveal downloaded payloads or collected data assembled for exfiltration.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
  answer_sources:
  - file_event
  - network_connection
- question: Which other hosts have non-browser processes reaching these Google API endpoints?
  context: Browsers legitimately contact these endpoints fleet-wide, so the meaningful comparison is other hosts where a non-browser process does the same. A single isolated host suggests targeted activity, while several hosts running the same unexpected process suggests a wider operation or a common deployed application to validate.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        QueryName|endswith:
        - drive.googleapis.com
        - oauth2.googleapis.com
        - sheets.googleapis.com
        - www.googleapis.com
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - dns_query
  - network_connection
- question: What other activity occurred on this host around the time of the alert?
  context: Covert-channel connections rarely occur in isolation. Surrounding process activity may show how the initiating process arrived through delivery or extraction and what it did before or after the connection. Aggregated by process and parent to surface novel pairs against routine telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier alerts on the same host, such as delivery, execution, defense evasion, or credential access, may reveal the stages that preceded the outbound channel and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
