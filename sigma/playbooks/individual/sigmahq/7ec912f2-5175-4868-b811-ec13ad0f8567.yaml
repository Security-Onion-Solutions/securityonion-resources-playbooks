name: CVE-2020-1048 Exploitation Attempt - Suspicious New Printer Ports - Registry
id: 4d582cb6-de8e-422d-96e7-437839d23b66
description: |
  This rule detects a write to a value under HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Ports whose
  data contains a filesystem path (C:) or a file with an executable or script extension (.exe, .dll, .bat,
  .com, .ps1, .vbe, .vbs). The rule fires only when the port value targets the Ports key AND the value data
  carries such a path or extension. Printer ports are normally I/O device names or standard TCP/LPR port
  monitors; a port whose target is a file path is the artifact CVE-2020-1048 leaves behind, where an
  unprivileged user has the Print Spooler write attacker-controlled data to a privileged path for
  persistence or privilege escalation. Legitimate printer-driver installs occasionally create file-backed
  ports, so confirm the writing process, the exact port value, and whether the referenced payload was
  subsequently created or executed.
type: detection
detection_id: 7ec912f2-5175-4868-b811-ec13ad0f8567
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the alert's registry write target a printer Ports value with file-path or executable data, as the rule requires?
  context: >-
    Confirm the alert is a true positive by reviewing the exact key path (TargetObject) under
    ...\CurrentVersion\Ports and the value data (Details). The rule fires only when the port data contains a
    drive path (C:) or a file ending in .exe, .dll, .bat, .com, .ps1, .vbe, or .vbs. A normal port value is
    a device or TCP/LPR monitor name, not a file path.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to add or modify printer ports?
  context: >-
    Legitimate printer-port creation is usually driven by a print-management tool or driver installer run by
    an administrator or by the Spooler service. Knowing whether this user role and host function normally
    configure printers is often the fastest way to separate a routine install from abuse of the port-add
    path. User attribution is present on most endpoint registry events; when it is a machine account or
    missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the process that wrote this port value expected, and what started it?
  context: >-
    The registry event attributes the port write to a writing process. The Print Spooler service
    (spoolsv.exe, started by services.exe) performs the HKLM write on a client's behalf over RPC, so a
    services.exe to spoolsv.exe chain is normal for the mechanism itself. If the writing process or its
    parent is instead a script host, an Office application, or an interactive shell, the port was added
    outside the standard print path. The real requester of an RPC-driven port add is not captured in the
    parent lineage, so corroborate with the user and concurrent process activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What exact Ports value was written, and does its data represent a legitimate device port or a file-backed port?
  context: >-
    Values under ...\CurrentVersion\Ports normally name I/O ports (COM/LPT), TCP/IP port monitors, or standard
    print processors. A value whose data is a filesystem path — especially one ending in .dll or .exe under a
    system directory such as System32 or Windows — is the port-monitor abuse pattern: the Spooler will write to
    or load that path, giving persistence or a privileged-write primitive. The exact port value and its data
    determine what the Spooler would execute or overwrite.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What file path or payload is written into the Ports value, and what would the Spooler do with it?
  context: >-
    Decode the Details field: the port data is the filesystem target the Spooler binds to. A path ending in
    .exe, .dll, .ps1, or .bat is a payload the Spooler can write to or side-load; a drive path under a
    protected directory points to a privileged-write or DLL-hijack target. The extension and directory
    indicate whether the goal is persistence, code execution, or overwriting a trusted binary. Details is
    absent for binary or empty value data (present on roughly 79% of registry writes).
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - TargetObject
- question: Does the same printer Ports value get written again after the alert, and is the referenced payload still configured?
  context: >-
    Registry key and value deletions are not recorded on this telemetry, so attacker cleanup of the port is
    not directly visible. Judge whether the port persists from its re-modification history over a longer
    window rather than from a deletion event: a value set once and never rewritten differs from one that is
    repeatedly re-established, which indicates an actively maintained persistence port. Verify separately
    whether the file the port points to is a legitimate, signed binary or an unexpected artifact.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Was the file referenced by the port created on disk by the writing process or its children?
  context: >-
    A file-backed printer port matters only if the Spooler actually writes the payload to the referenced
    path — printing to the port causes the Spooler to write attacker-controlled data there. Correlating file
    activity by the writing process and its children shows whether the payload landed on disk, for example a
    .dll under System32 that would be side-loaded or an .exe staged for later execution. The file-write event
    carries no hash; if the payload is present, hash it from a later execution or retrieve it for a reputation
    lookup. Reboot persistence is a judgment call — pair the value data with the port's re-modification history.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor abusing the Spooler for persistence often makes several changes together — additional ports,
    service or Run-key entries, or defense settings. Grouping every registry write on the host in the
    surrounding window by key path and writing process reveals whether this port change was isolated or part
    of a broader configuration change. The triggering port value will appear in the results; the signal is
    what else was written alongside it.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has this printer Ports value been modified before on this host?
  context: >-
    Routine printer setup does touch the Ports key, but a specific file-backed port value that has never
    appeared on this host before is more notable than a recurring change. Zero or very low history for this
    exact value indicates a first-time modification; a long history of the same benign device port suggests
    an established, legitimate configuration.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was the same Ports key modified on other hosts in the environment?
  context: >-
    The same file-backed port appearing across many hosts can indicate a pushed configuration (group policy
    or a deployment tool) or a spreading implant, while a change confined to one host is more likely
    targeted. Compare the value data across hosts — identical payload paths on multiple machines point to
    coordinated activity rather than a local print install.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because this event type does not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What process activity occurred on this host around the time of the port change?
  context: >-
    The registry write shows the port was configured, but not what ran before or after it. Aggregating
    process activity on the host in the surrounding window by process and parent surfaces the execution
    context — a print-management tool and driver installer look different from script hosts, encoded
    PowerShell, or the payload the port points at being launched. Novel parent-child pairs at low counts are
    what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before the port change?
  context: >-
    A port-monitor abuse is often a late stage — it follows initial access or a privilege-escalation
    attempt. Earlier detections on the same host, such as suspicious script execution, credential access, or
    defense tampering, help place this event in a sequence and reconstruct what led to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was there a change ticket or approved maintenance for adding or changing this printer port?
  context: >-
    Printer deployments and driver installs are often documented or pushed through management tooling. A
    corresponding change record for new printer configuration on this host points to authorized activity;
    the absence of one, where policy would require it, leaves the file-backed port unexplained and worth
    further review.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the user or an administrator recall installing a printer or adding a port on this host?
  context: >-
    Direct confirmation from the person behind the account is often the fastest way to resolve the alert. If
    no one recalls installing a printer or configuring a port, the account may be misused or the activity may
    be automated; if someone does recall it, capture what tool they used and why.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
