name: Invoke-Obfuscation COMPRESS OBFUSCATION
id: 1301b2e6-73d7-43be-9b91-3cd0fcf6de27
description: |
  Detects an obfuscated PowerShell command line that builds an in-memory decompression cradle: a New-Object construction
  combined with an ASCII text-encoding reference AND one of the deflate-stream / stream-reader / ReadToEnd read primitives.
  This is the COMPRESS obfuscation method of the Invoke-Obfuscation framework, which compresses a payload, base64-encodes it,
  and decompresses it in memory before invoking it — hiding the real command from casual inspection and string-based detection.
  Legitimate scripts occasionally use .NET compression streams, but the combination with ASCII byte-array reconstruction and
  in-memory read primitives on a single command line is characteristic of obfuscated execution. Investigation should recover
  the decompressed payload, establish how PowerShell was invoked (direct powershell.exe or .NET-hosted automation), and
  determine whether the surrounding activity looks like an operator's hands-on session or a one-off.
type: detection
detection_id: 7eedcc9d-9fdb-4d94-9c54-474e8affc0c7
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line contain the New-Object plus ASCII-encoding plus deflate/stream-read pattern this rule detects?
  context: Confirm the alert is a true positive by reading the exact command line. The rule fires only when a single command
    line combines a New-Object construction AND an ASCII text-encoding reference AND at least one in-memory read primitive
    (a deflate stream, a stream reader, or a ReadToEnd call). Verify all three parts are present and not a benign coincidence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run compressed or .NET-stream-based PowerShell one-liners?
  context: Legitimate administrative or developer activity can construct .NET compression streams from PowerShell, but it is
    uncommon on most endpoints. Knowing whether the user role and host function involve PowerShell automation that legitimately
    decompresses in-memory payloads is often the fastest way to separate a true positive from routine work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this obfuscated PowerShell execution part of an authorized penetration test or red team engagement?
  context: Obfuscation frameworks that build compressed in-memory cradles are commonly used in authorized security assessments.
    Before investing investigation time, check whether a pentest or red team exercise is currently active on this host or
    network segment. An authorized engagement with matching timing resolves the alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did this command write a decoded or decompressed payload to disk that is still available for analysis?
  context: The COMPRESS cradle normally decompresses and invokes its payload in memory, but variants stage a temporary file
    or drop a follow-on script. If any file path appears in the decoded command, checking whether that file still exists on
    disk enables hash lookups, sandbox submission, or content review.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What does the compressed payload decode to once the deflate stream is decompressed and read?
  context: The detected pattern base64-decodes a blob, decompresses it through a deflate stream, and reads it back as ASCII
    before invoking it. Reverse that chain — base64 decode, inflate, then read — to recover the actual script. The decompressed
    content typically reveals a download cradle, a reverse shell, or in-memory loading of a .NET assembly.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which obfuscation and execution primitives does this command line actually use?
  context: The COMPRESS method can be layered with other Invoke-Obfuscation transforms — token reordering, splatting, hex or
    BXOR encoding, launcher tampering. Identify exactly which read primitive fired (DeflateStream, StreamReader, or ReadToEnd),
    whether the payload is invoked via IEX or Invoke-Expression, and whether additional encoding layers wrap the inner command.
    This determines how much decoding work remains and what the payload ultimately runs.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the deobfuscated script content?
  context: Script block logging (Event ID 4104) records the deobfuscated script PowerShell actually executes, even when the
    command line is compressed and base64-encoded. This is ground truth for what ran, bypassing the obfuscation entirely.
    If these operational logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence
    nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Was the .NET PowerShell automation assembly loaded into a process that is not powershell.exe on this host?
  context: COMPRESS obfuscation runs through .NET classes, so the payload can execute via a host process that loads
    System.Management.Automation.dll directly instead of launching powershell.exe — a runspace embedded in another binary
    leaves no powershell.exe command line. A load of the automation or AMSI assembly into an unexpected process is the signal
    that PowerShell ran indirectly. If image-load telemetry is not collected here, treat zero results as a visibility gap.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|contains:
          - System.Management.Automation
          - amsi.dll
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: What process spawned the PowerShell that ran this obfuscated command, and is that parent chain expected?
  context: The parent reveals how the obfuscated cradle was launched. Office applications, mshta.exe, wscript.exe, or a browser
    spawning PowerShell that immediately decompresses an in-memory payload points to delivery via document, script, or web
    download. A predictable interactive parent (explorer.exe) shifts the disposition toward a deliberate operator action.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Were PowerShell security controls bypassed or weakened on this host before this execution?
  context: Operators commonly disable or bypass PowerShell defenses before running an obfuscated payload. Common precursors
    include AMSI patching, execution-policy bypass flags, constrained-language-mode escapes, and version-2 downgrade attacks
    that lack script block logging. Finding these events shortly before the alert strengthens the case for malicious activity.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: What child processes were spawned on this host right after the obfuscated command ran?
  context: The processes spawned after the cradle decompresses reveal its actual impact. Decompressed payloads often launch
    cmd.exe, additional powershell.exe instances, certutil.exe, or network utilities for post-exploitation. Unexpected
    children in the minutes after the alert are the next investigative thread.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: \powershell.exe
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host has previously fired this obfuscation pattern, what parents and users normally drive it, and does
    the current alert fit?
  context: The query mirrors the rule's exact selection scoped to this host, so the resulting parent and user distribution
    reflects how this specific compression-obfuscation pattern has historically run here — not generic PowerShell usage. A
    new parent process, an unexpected user account, or a first-ever appearance of the pattern is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - new-object
        - text.encoding]::ascii
        CommandLine|contains:
        - system.io.compression.deflatestream
        - system.io.streamreader
        - readtoend(
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - new-object
        - text.encoding]::ascii
        CommandLine|contains:
        - system.io.compression.deflatestream
        - system.io.streamreader
        - readtoend(
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - new-object
        - text.encoding]::ascii
        CommandLine|contains:
        - system.io.compression.deflatestream
        - system.io.streamreader
        - readtoend(
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network in the hour around this alert?
  context: Tracking the user's activity across all hosts reveals lateral movement or staged activity on multiple endpoints.
    If the same user triggered similar activity elsewhere in the same window, the scope of the operation may be larger than
    this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - new-object
        - text.encoding]::ascii
        CommandLine|contains:
        - system.io.compression.deflatestream
        - system.io.streamreader
        - readtoend(
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired this obfuscation pattern in the past week, and does the cross-host distribution look like
    automation or one-off activity?
  context: The query mirrors the rule's exact selection with no host scope, so the result is a fleet-wide count of this
    compression-obfuscation pattern. Many hosts firing the same pattern points to scripted deployment or vendor automation;
    one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - new-object
        - text.encoding]::ascii
        CommandLine|contains:
        - system.io.compression.deflatestream
        - system.io.streamreader
        - readtoend(
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or
    credential access — may reveal the attack stages that preceded this obfuscated execution and help reconstruct the
    timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
