name: RemCom Service File Creation
id: 9a344891-27c8-4293-88f9-a280df4cddab
description: |
  Detects creation of a file named RemComSvc.exe, the default service-component filename for RemCom, an open-source
  PsExec-style remote command execution tool. RemCom deploys by dropping this service binary on a target host, registering
  it as a service, and driving commands through a client that connects to it, so it is commonly abused for lateral movement
  and functions as a PsExec alternative that can slip past detections tuned to Sysinternals naming. Investigation should
  confirm the artifact, establish how it was written and whether the service was installed and executed, and determine
  whether the same binary appears on other hosts.
type: detection
detection_id: 7eff1a7f-dd45-4c20-877a-f21e342a7611
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the created file match the RemCom service filename this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact created path
    against the rule's criterion (a filename ending in \RemComSvc.exe) and the operation performed. The responsible process
    and account are covered by the host/user expectation check.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to have a RemCom service binary written to disk?
  context: RemCom is not standard software; a legitimate write would tie to sanctioned remote-administration or authorized
    red-team activity, and known-good service installers form the allowlist to judge against. When the writing account is a
    machine or SYSTEM account, which is typical of a remote push over an administrative share, judge by the host role and the
    deploying process rather than the account name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the RemCom service file still on disk, or was it deleted or renamed after the alert?
  context: The file's post-alert lifecycle drives next steps. A binary still on disk can be retrieved, hashed, and analyzed;
    a file removed seconds after creation suggests anti-forensic cleanup or a self-removing deployment and shifts the focus
    to what executed in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Is the created file the genuine RemCom service component, or a modified binary planted under that name?
  context: Confirm the artifact's identity by file size, signing status, and strings. The stock RemComSvc build is normally
    unsigned; a trojanized or repurposed binary carrying that name changes the response. Retrieve the file from its on-disk
    path for static analysis, since file-creation telemetry does not carry the content itself.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If this service binary has executed, what is its hash and does it have known threat-intel detections?
  context: A file's hash is recorded when it runs, not when it is written, so file-creation events carry no hash. This query
    looks for the binary executing and reads its hash; submit that to reputation and threat-intel sources to determine whether
    it is known malicious, benign, or previously unseen. If the binary is present but has not executed, retrieve it from its
    on-disk path and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: Was the RemCom service binary executed after it was written?
  context: Service installation is normally followed by rapid execution. RemComSvc.exe running, typically as a service under
    services.exe, confirms the drop progressed from delivery to remote command execution. The interval between the file write
    and the first execution is the correlation window worth measuring; a very short gap is the service-abuse signature.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Was a service registry key for RemComSvc created around the alert?
  context: Installing RemCom registers a service named RemComSvc under the services hive, with an ImagePath value that points
    at the dropped binary; a matching key created near the file write corroborates service installation. Value data is present
    on most registry modifications but may be absent for binary or empty values. Registry key removal is not observable on
    this telemetry, so a later absence of the key is not evidence of cleanup — judge cleanup from the payload's execution
    history instead.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Services\RemComSvc'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What network connections occurred on this host around the service file creation?
  context: The PsExec-style deployment model pushes the service binary over an inbound administrative-share session from the
    deploying host and drives commands through it. This is an aggregated survey of the host's connections in the window,
    grouped by process and destination so repetitive agent traffic collapses into high counts; the deviations worth chasing
    are flows attributed to the service binary and low-count peers near the file write, which identify the operator host and
    whether a remote shell relayed traffic. Compare any such peer against the set of approved remote-administration hosts.
    Process-attributed connections appear only for endpoint-collected events.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
- question: What other files did the responsible process write or delete around the alert?
  context: A process that drops one service binary often stages several — a deployment unpacking components, a tool writing
    output, or broader tampering. The breadth, paths, and extensions of the process's other file activity distinguish a single
    artifact from a wider deployment and enumerate what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has a file named RemComSvc.exe been seen on this host before?
  context: First appearance of the service binary on a host is more notable than recurring presence that ties to a known
    process. Zero or very low historical counts indicate a new drop rather than routine operation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What other process activity occurred on this host around the time of the alert?
  context: Examine what ran immediately around the drop — services.exe starting the new service, a spawned command shell, or
    reconnaissance — to place the event in a sequence. Novel parent-child pairs stand out at low counts while repetitive agent
    telemetry collapses into single high-count rows.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — credential access, reconnaissance, or remote-service activity — may reveal
    the stages that preceded the service drop and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Has this user previously produced this service-file-creation pattern, and does that history fit their role?
  context: The query mirrors the rule's selection scoped to this user — the user's 90-day history of RemCom service-file
    creation, aggregated by host, not generic use of any binary. A user who has never produced this pattern is more notable
    than one who does so routinely; weigh the count against the user's role and sanctioned toolset.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: \RemComSvc.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this program historically driven this service-file-creation pattern on this host or across the environment?
  context: When the alert fires under a service or machine account, user identity does not attribute the behavior — the launch
    mechanism does. The query mirrors the rule's selection scoped to the alerting program, so the result is the 90-day
    history of this program driving this specific pattern. A new or rare program for this pattern is the deviation worth chasing;
    a program that already accounts for many prior events is vendor or operating-system automation.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: \RemComSvc.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If
    the same user drove similar activity on several hosts, the scope of compromise may be larger.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same program-driven service-file-creation pattern fire on other hosts in the same window?
  context: Under a service or machine account, asking what else the user did across the network returns agent-telemetry noise,
    because every host runs SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism
    produced this pattern elsewhere. Multiple hosts in the same window point to pushed or scheduled automation, while a single
    host points to a host-local trigger.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: \RemComSvc.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Is a file named RemComSvc.exe present on any other hosts in the environment?
  context: RemCom is a lateral-movement tool, so the same service binary appearing on several hosts maps the spread and its
    timeline. If the file is only on one host, the deployment may be targeted; if on many, determine the distribution pattern
    and order of arrival.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
