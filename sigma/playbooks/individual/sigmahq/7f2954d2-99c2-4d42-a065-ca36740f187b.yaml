name: Hypervisor Enforced Paging Translation Disabled
id: 87d435d6-fa1d-487e-863e-c567c0808ec4
description: |
  Detects a write to the DisableHypervisorEnforcedPagingTranslation registry value that sets it
  to DWORD 1, which turns off Hypervisor-enforced Paging Translation (HVPT). The rule fires when a
  registry modification targets that value name AND the data written equals DWORD (0x00000001).
  HVPT is a virtualization-based kernel-memory mitigation (built on Intel HLAT/VT-rp) that lets the
  hypervisor own virtual-to-physical translation for protected kernel pages, closing the remapping
  attack class against Code Integrity policy structures and other protected globals; disabling it
  lowers the bar for non-data-driven kernel exploits. Legitimate changes are rare outside kernel
  debugging or security research, so the investigation should confirm the value and writing process,
  determine whether the change was authorized, and look for kernel-facing or other defense-tampering
  activity around it.
type: detection
detection_id: 7f2954d2-99c2-4d42-a065-ca36740f187b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Do the registry key and value data match what this rule detects?
  context: >-
    Before investing investigation time, confirm the alert is a true positive by reviewing the exact
    registry path (TargetObject ending in \DisableHypervisorEnforcedPagingTranslation), the value
    data (Details should read DWORD (0x00000001)), and the writing process against the rule's
    criteria. This value set to 1 turns off Hypervisor-enforced Paging Translation, a
    virtualization-based kernel-memory mitigation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify virtualization-based security or kernel-mitigation policy values?
  context: >-
    Legitimate changes to Hypervisor-enforced Paging Translation are rare outside kernel debugging or
    security research. Knowing whether the user role and host function (a developer workstation, a
    test box, a production server) align with editing kernel-mitigation settings is often the fastest
    way to separate authorized tuning from tampering. User attribution is present on most endpoint
    registry events; when it is a machine account or missing, pivot on the writing process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What registry key and value were modified, and is this a known security-mitigation or evasion location?
  context: >-
    The registry path reveals intent. The DisableHypervisorEnforcedPagingTranslation value governs a
    kernel exploit mitigation built on virtualization-based security; setting it to 1 weakens
    protection of kernel executable sections, Code Integrity policy structures, and related memory
    against remapping attacks. This is a defense-impairment location, not a persistence key -- the
    modification lowers the bar for kernel-level exploitation rather than establishing a foothold.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What command line set this registry value, and what mitigation did it disable?
  context: >-
    The writing process command line reveals how the value was set -- a reg.exe add, a PowerShell
    Set-ItemProperty, an installer, or a purpose-built tool. The targeted control here is
    Hypervisor-enforced Paging Translation; disabling it removes hypervisor ownership of
    virtual-to-physical translation for protected kernel pages, re-opening the remapping attack class
    against Code Integrity and other protected kernel globals. CommandLine is absent on the registry
    event itself, so this pivots to the writing process by its ProcessGuid.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is Hypervisor-enforced Paging Translation currently restored, or is the host still running with the mitigation disabled?
  context: >-
    The change may be a one-off or persistent. Registry value and key deletion is not directly
    observable on this telemetry, so confirm the current state by host inspection -- check whether
    virtualization-based security and HVPT are active on the host now. If the mitigation is still off,
    the host remains exposed to the kernel remapping attack class and the value should be reverted
    before further analysis. The query re-displays the setting command for reference.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What activity occurred on this host after the mitigation was disabled?
  context: >-
    Defenses are lowered to enable something that would otherwise be blocked or detected. Examining
    process activity in the window after the value was set can reveal driver loads, exploitation
    attempts, or other kernel-facing activity the weakened protection was meant to permit. Correlate
    with driver and network events in the same window; a burst of new activity right after the change
    points to what the tampering enabled.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense-tampering actions performed on this host?
  context: >-
    Actors who disable one protection often disable several -- clearing logs, stopping services,
    deleting shadow copies, or turning off real-time protection -- to widen coverage. Multiple
    tampering events from the same user or parent within a short window point to a deliberate
    impairment sequence rather than an isolated setting change. The tunable process and command list
    in this query can be extended to match locally expected administrative tooling.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: What other registry modifications were made on this host in the same window?
  context: >-
    Actors weakening kernel mitigations often make several registry changes together -- disabling
    additional protections, staging persistence, or altering policy. Clustering registry writes by
    key path and writing process within a short window around the alert surfaces whether this value
    change stood alone or was part of a broader configuration edit. If the host is registry-noisy,
    narrow to the writing process from the alert or to security-relevant hive paths (Run, Services,
    Policies, Winlogon).
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Was this value re-modified after the alert, and did the disabled state persist?
  context: >-
    Registry key and value deletion is not emitted on this telemetry, so an attacker reverting or
    removing the value is not visible as a delete event. Judge persistence of the disabled state from
    the key's re-modification history -- a later write of DWORD 0 would indicate the mitigation was
    re-enabled, while no further writes means it stayed off -- and from whether kernel-facing activity
    followed. Reboots do not reset the value.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Has this registry value been modified before on this host?
  context: >-
    Security-mitigation values like this one should essentially never change on a normally managed
    host. Zero prior history means this is the first time the value was touched, which is more
    notable than a key that changes routinely. Compare any historical Details values to see whether
    the same disable was set before or whether this is unique.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this value modified on other hosts in the environment?
  context: >-
    The same modification across many hosts may indicate a policy or configuration push; a change
    isolated to one host is more likely targeted. Compare Details values and writing processes across
    hosts to tell a fleet-wide rollout from a single-host action.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What process spawned the process that wrote this value, and is that parent chain expected?
  context: >-
    The parent of the writing process shows how the registry edit was launched. A value set from an
    interactive administrative shell reads differently from one set by a script host, an Office child,
    or an unknown binary. Walk up the process tree to see what invoked the writing process; if parent
    lineage is not recorded on the event, pivot from the writing process image instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur alone. Aggregating process activity in a tight window around the registry
    change collapses routine agent noise into high-count rows and surfaces novel parent-child pairs at
    low counts -- reconnaissance, privilege escalation, or tooling that accompanied the mitigation
    change is what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host -- reconnaissance, credential access, or other defense
    tampering -- can reveal the stages that led to weakening this kernel mitigation and help
    reconstruct the timeline of the activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were process-based persistence mechanisms installed on this host?
  context: >-
    Weakening a kernel exploit mitigation is typically part of a larger operation rather than an end
    in itself. Check whether persistence tooling -- scheduled tasks, services, registry Run keys, BITS
    jobs, or WMI -- was used on the host in the surrounding window, which would indicate the actor was
    also establishing a foothold. Multiple mechanisms in the same timeframe indicate deliberate
    stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations such as the Startup folder or scheduled-task definition paths on this host?
  context: >-
    File-based persistence sidesteps command-line detection by writing an executable or script into a
    Startup folder or a path referenced by a registry Run key. File-event monitoring captures these
    drops even when standard persistence tools are avoided, complementing the process-based check.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
