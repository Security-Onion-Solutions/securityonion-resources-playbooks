name: OpenEDR Spawning Command Shell
id: 11d3efc7-9194-4489-a2af-e2b0234dadf7
description: |
  Detects the OpenEDR/Xcitium remote shell host (ssh-shellhost.exe) being spawned by the OpenEDR service (ITSMService.exe) with the --pty pseudo-terminal flag to launch an interactive cmd, PowerShell, pwsh, or bash session. The rule fires only when the parent is ITSMService.exe AND the child is ssh-shellhost.exe AND the command line contains --pty AND a shell name. This can be sanctioned remote support through the OpenEDR management features, but the same interactive shell capability gives an operator hands-on-keyboard command execution that typically runs as SYSTEM and bypasses application allowlisting because the agent is legitimately signed. Determine whether an authorized support session explains the activity, what was run in the pseudo-terminal, and whether the same agent shows file drops or fan-out to other hosts.
type: detection
detection_id: 7f3a9c2d-4e8b-4a7f-9d3e-5c6f8a9b2e1d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does this event show ssh-shellhost.exe launched by ITSMService.exe with --pty and a shell name?
  context: Confirm the alert is a true positive before investing time. The rule fires only when all conditions hold together - parent ITSMService.exe, child ssh-shellhost.exe, and a command line containing --pty plus one of cmd, powershell, pwsh, or bash. Verify the full command line and process ancestry match these criteria.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Is this host expected to be managed by OpenEDR, and is interactive remote shell use sanctioned for it?
  context: Legitimate remote support through OpenEDR can trigger this detection. Knowing whether this host is enrolled in OpenEDR for a business reason, and whether interactive shell sessions are a sanctioned support workflow, is often the fastest way to separate routine administration from abuse of the agent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is ITSMService.exe expected to spawn ssh-shellhost.exe here, and what started ITSMService.exe?
  context: The ITSMService.exe to ssh-shellhost.exe parent-child relationship is the core signal. Tracing the service's own origin confirms whether the OpenEDR agent was installed and is running as a normal managed service, or whether it was recently introduced as attacker-deployed tooling. A signed agent installed without an authorized rollout is the deviation worth chasing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did this ITSMService.exe instance spawn around the same time?
  context: If the OpenEDR service is being driven by an operator, the interactive shell is rarely the only child. Examining siblings of the same ITSMService.exe instance reveals additional tools, discovery commands, or payloads launched through the agent and shows the full scope of activity in this session.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is OpenEDR on the organization's approved remote access and management software list?
  context: Organizations typically sanction a specific set of remote management tools. OpenEDR (also branded Comodo/Xcitium) offers a free trial that requires only minimal registration, which makes its signed agent attractive for unauthorized remote access. If OpenEDR is not a sanctioned product for this environment, treat its presence as shadow IT or attacker-deployed access regardless of the signed binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a helpdesk ticket or scheduled maintenance window explaining this remote shell session?
  context: Sanctioned interactive remote shell use usually correlates with an active support ticket, a change record, or a scheduled maintenance window. If no support context exists for this session, the agent may be driven by an operator who has co-opted it for hands-on access rather than by legitimate IT.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What external endpoints did the OpenEDR agent connect to around the time of this shell?
  context: The OpenEDR agent maintains an outbound channel to its management infrastructure to relay the interactive session. The destination distinguishes the vendor's expected management endpoints from a custom or attacker-controlled controller. Connections to unexpected addresses around the shell launch point toward operator-controlled infrastructure.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: What shell and arguments did this pseudo-terminal session launch? Decode the full command line.
  context: The ssh-shellhost.exe command line carries the requested shell and its options after --pty (for example cmd, powershell, pwsh, or bash, with width, height, and log-dir parameters). Decode the full invocation to identify which interpreter was launched and any session parameters; this is the entry point for whatever the operator typed interactively.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: '--pty'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is the ssh-shellhost.exe binary located under the expected OpenEDR install path and validly signed?
  context: Remote access agents are routinely renamed or relocated to user-writable or temporary paths to evade allowlisting and masquerade as legitimate tooling. A copy of ssh-shellhost.exe running from outside the standard OpenEDR/Comodo Endpoint Manager program directory, or with a broken or unexpected signature, points to a planted or tampered binary rather than a managed install.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: What files did this ITSMService.exe instance write on the host around the time of the shell?
  context: When OpenEDR is driven by an operator, payload uploads surface as the ITSMService.exe agent creating files on disk - executables, scripts, or archives. File writes by the agent that coincide with the interactive shell indicate staging of additional tooling rather than ordinary management traffic.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\ITSMService.exe'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What inbound remote-access connections reached this host around the time of the shell, and from where?
  context: An interactive remote shell on this host requires a source. Identifying inbound connections on common remote-management ports reveals whether the session originated from a known admin jump box, a compromised internal workstation used as a pivot, or an unexpected source. The originating host is a primary lead for scoping the operator.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 445
          - 135
          - 3389
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - SourceIp
      - DestinationPort
- question: What processes were spawned on this host shortly after the remote shell session started?
  context: The remote shell is a means to an end - operators use the interactive session to run discovery, deploy tools, or access data. Examining processes that started shortly after the session reveals the objectives pursued on this host once interactive access was established.
  range: +30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - Image
- question: Has this user account used remote-access or lateral-movement tooling against other hosts?
  context: Operators with interactive access rarely stop at one target. If the account tied to this session is also running remote-access or lateral-movement utilities against other systems, the scope of compromise is wider. Connections from a single account to many hosts in a short window indicate active fan-out across the environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_lateral:
        Image|endswith:
          - '\psexec.exe'
          - '\psexec64.exe'
          - '\mstsc.exe'
          - '\ssh.exe'
          - '\plink.exe'
          - '\wmic.exe'
      condition: selection and selection_lateral
    fields:
      - host.name
      - Image
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
        ParentImage|endswith: \ITSMService.exe
        Image|endswith: \ssh-shellhost.exe
        CommandLine|contains: --pty
      selection_cli_shell:
        CommandLine|contains:
        - bash
        - cmd
        - powershell
        - pwsh
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
        ParentImage|endswith: \ITSMService.exe
        Image|endswith: \ssh-shellhost.exe
        CommandLine|contains: --pty
      selection_cli_shell:
        CommandLine|contains:
        - bash
        - cmd
        - powershell
        - pwsh
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user account do across the network around this time?
  context: Tracking the account's activity across all hosts reveals whether the interactive session is isolated or part of activity spanning multiple endpoints. The same account driving similar activity on several hosts widens the likely scope. When the alert fires as SYSTEM, read this alongside the launch-mechanism fan-out view, which carries the meaningful signal.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
        ParentImage|endswith: \ITSMService.exe
        Image|endswith: \ssh-shellhost.exe
        CommandLine|contains: --pty
      selection_cli_shell:
        CommandLine|contains:
        - bash
        - cmd
        - powershell
        - pwsh
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
