name: Execute From Alternate Data Streams
id: 6922c83a-a19a-45e0-bb63-db34e84e37d1
description: |
  Detects command lines that reference an NTFS Alternate Data Stream (ADS) using colon syntax (txt:) together with a
  staging or extraction utility — type with redirection, makecab, reg export, regedit /E, or esentutl with /y /d /o. The
  rule fires when the ADS-stream pattern matches AND any one of those tool patterns matches, so the alert reflects data
  being written into or read out of a hidden stream rather than a normal file. Legitimately this is rare; ADS is used by
  some installers and a few utilities, but operators use it to hide payloads and exfiltration staging from tools that only
  inspect the visible file body. Determine which utility branch fired, decode what data moved into or out of the stream,
  and confirm whether the host and user routinely perform this kind of operation.
type: detection
detection_id: 7f43c430-5001-4f8b-aaa9-c3b88f18fa5c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line reference an ADS stream and use one of the staging utilities this rule watches for?
  context: Confirm the alert is a true positive by reviewing the exact command line. The rule fires when a colon-stream
    reference (txt:) appears together with EITHER a type redirection (type ... > ...), OR makecab writing a .cab, OR reg
    export, OR regedit /E, OR esentutl with /y /d /o. Note which utility branch fired — that branch determines which
    decode and follow-on questions carry the most weight.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to write into or read from NTFS alternate data streams?
  context: Legitimate ADS usage is uncommon outside a few installers and admin utilities. Knowing whether the user role and
    host function involve packaging, registry export, or database utilities is often the fastest way to separate a routine
    administrative task from data being deliberately hidden in a stream.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What data was moved into or out of the alternate data stream, and which file and stream were named?
  context: The full command line reveals the operation. Identify the host file the colon-stream attaches to (file.ext:stream),
    the direction of the transfer (write into the stream vs. read it back out), and which utility carried it. type with
    redirection and esentutl /y read or copy a stream; makecab and reg/regedit export stage content that can be redirected
    into one. Decode any paths so you know what was hidden and where.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_pattern:
        CommandLine|contains: 'txt:'
      condition: selection_host and selection_pattern
    fields:
      - CommandLine
      - CurrentDirectory
      - Image
- question: What process spawned this command and is that parent chain expected?
  context: The parent process reveals how the ADS operation was invoked. A command interpreter launched by explorer.exe for
    an interactive admin task reads differently from one spawned by a script host, an Office application, or a remote-execution
    service, which point to scripted or operator-driven staging.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Was an alternate data stream actually created on this host around the alert time?
  context: Process command lines show intent to use a stream; a matching file-creation event confirms one was written.
    Elastic Defend records the stream write as an ordinary file-creation event, with the stream name embedded in the
    target path (host-file:stream-name) — there is no separate stream-contents field on this telemetry, so the write
    itself, not the stream's bytes, is what corroborates the command line. Correlating a created stream with the
    alerting command line strengthens the case that data was hidden rather than the colon syntax appearing incidentally.
    Confirming what the stream actually holds requires retrieving the carrier file and reading it directly. Absence of a
    matching event suggests the command may not have produced a stream.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_ads:
        TargetFilename|re: ':[^\\]'
      condition: selection and selection_ads
    fields:
      - TargetFilename
      - Image
- question: What files were written on this host around the alert time that could be the stream's host file or staged output?
  context: makecab, reg export, regedit /E, and type redirection all produce a file or stream artifact. This query returns
    the file activity of the alerted process itself, locating the .cab, .reg, or stream-bearing file the command produced
    and showing where it landed (user-writable temp paths versus normal application directories). A zero means the write
    was not captured in file telemetry - stream writes are not always recorded - not that no artifact exists.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
      - EventType
- question: When this host previously fired this ADS-plus-utility pattern, what parents and users drove it, and does the
    current alert fit that pattern?
  context: Even common utilities can be abused. This query mirrors the rule's selection structure scoped to this host, so the
    resulting parent/user distribution reflects how this specific firing pattern has historically run here. A new parent
    process, an unexpected user, or an unusual command structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_stream:
        CommandLine|contains: 'txt:'
      selection_tools_type:
        CommandLine|contains|all:
        - 'type '
        - ' > '
      selection_tools_makecab:
        CommandLine|contains|all:
        - 'makecab '
        - .cab
      selection_tools_reg:
        CommandLine|contains|all:
        - 'reg '
        - ' export '
      selection_tools_regedit:
        CommandLine|contains|all:
        - 'regedit '
        - ' /E '
      selection_tools_esentutl:
        CommandLine|contains|all:
        - 'esentutl '
        - ' /y '
        - ' /d '
        - ' /o '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_stream and (1 of selection_tools_*)) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did this command spawn afterward?
  context: The processes spawned after the ADS operation reveal its actual impact. Staging data into a stream is often
    followed by execution of the hidden content or by further packaging and exfiltration utilities; unexpected children
    such as script hosts or download tools point to post-staging activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_stream:
        CommandLine|contains: 'txt:'
      selection_tools_type:
        CommandLine|contains|all:
        - 'type '
        - ' > '
      selection_tools_makecab:
        CommandLine|contains|all:
        - 'makecab '
        - .cab
      selection_tools_reg:
        CommandLine|contains|all:
        - 'reg '
        - ' export '
      selection_tools_regedit:
        CommandLine|contains|all:
        - 'regedit '
        - ' /E '
      selection_tools_esentutl:
        CommandLine|contains|all:
        - 'esentutl '
        - ' /y '
        - ' /d '
        - ' /o '
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_stream and (1 of selection_tools_*)) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_stream:
        CommandLine|contains: 'txt:'
      selection_tools_type:
        CommandLine|contains|all:
        - 'type '
        - ' > '
      selection_tools_makecab:
        CommandLine|contains|all:
        - 'makecab '
        - .cab
      selection_tools_reg:
        CommandLine|contains|all:
        - 'reg '
        - ' export '
      selection_tools_regedit:
        CommandLine|contains|all:
        - 'regedit '
        - ' /E '
      selection_tools_esentutl:
        CommandLine|contains|all:
        - 'esentutl '
        - ' /y '
        - ' /d '
        - ' /o '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_stream and (1 of selection_tools_*)) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or staging across multiple endpoints. If
    the same user triggered similar activity elsewhere, the scope may be larger than this one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_stream:
        CommandLine|contains: 'txt:'
      selection_tools_type:
        CommandLine|contains|all:
        - 'type '
        - ' > '
      selection_tools_makecab:
        CommandLine|contains|all:
        - 'makecab '
        - .cab
      selection_tools_reg:
        CommandLine|contains|all:
        - 'reg '
        - ' export '
      selection_tools_regedit:
        CommandLine|contains|all:
        - 'regedit '
        - ' /E '
      selection_tools_esentutl:
        CommandLine|contains|all:
        - 'esentutl '
        - ' /y '
        - ' /d '
        - ' /o '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_stream and (1 of selection_tools_*)) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired this ADS-plus-utility pattern in the past week, and does the cross-host distribution look
    like consistent automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, giving a fleet-wide count of this firing
    pattern rather than generic utility usage. Many hosts firing the same pattern points to scripted deployment or vendor
    automation; one host or a small unrelated set points to manual operator activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_stream:
        CommandLine|contains: 'txt:'
      selection_tools_type:
        CommandLine|contains|all:
        - 'type '
        - ' > '
      selection_tools_makecab:
        CommandLine|contains|all:
        - 'makecab '
        - .cab
      selection_tools_reg:
        CommandLine|contains|all:
        - 'reg '
        - ' export '
      selection_tools_regedit:
        CommandLine|contains|all:
        - 'regedit '
        - ' /E '
      selection_tools_esentutl:
        CommandLine|contains|all:
        - 'esentutl '
        - ' /y '
        - ' /d '
        - ' /o '
      condition: selection_stream and (1 of selection_tools_*)
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led to this event and what
    happened after. Look for reconnaissance, privilege escalation, or additional staging that provides broader context.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the attack
    stages that preceded ADS staging and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
