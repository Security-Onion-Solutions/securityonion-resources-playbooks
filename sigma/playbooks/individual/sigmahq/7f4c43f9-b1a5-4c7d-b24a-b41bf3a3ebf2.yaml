name: Registry Tampering by Potentially Suspicious Processes
id: 0966fa3f-4310-4b30-9712-391831cbee67
description: |
  Detects registry modifications performed by script-host binaries (mshta.exe, wscript.exe, cscript.exe)
  rather than the standard registry utilities reg.exe or regedit.exe, after excluding known-benign wscript
  writes (Windows Script telemetry, BAM state, Internet Settings, self-referential wscript keys) and events
  whose value data is binary or empty. Script engines writing autorun or configuration keys are a common
  living-off-the-land route to persistence and defense evasion, because the write rides script-host telemetry
  instead of the tools an administrator would normally use. Determine which key and value were written, what
  spawned the script host, and whether the change installs a persistence entry or alters a security setting.
type: detection
detection_id: 7f4c43f9-b1a5-4c7d-b24a-b41bf3a3ebf2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Do the registry key path, value data, and writing process match what this rule detects?
  context: >-
    Confirm the alert is a true positive before investing further time. The rule fires when one of the
    script hosts (mshta.exe, wscript.exe, cscript.exe) writes a registry value, and none of the benign-wscript
    exclusions (Windows Script telemetry, BAM state, Internet Settings, self-referential wscript keys) or the
    binary/empty value-data exclusions apply. Review the exact key path (TargetObject), the value data
    (Details), and the writing process (Image) against those criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify the registry through a script host?
  context: >-
    Legitimate administrative activity can trigger this detection, but reg.exe and regedit.exe are the usual
    tools; a script engine writing the registry is uncommon in routine operations. Knowing whether the user
    role and host function are consistent with script-driven registry changes is often the fastest way to
    separate an install script from an intrusion. User attribution is present on most endpoint registry
    events; when it resolves to a machine account or SYSTEM, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What process spawned this script host, and is that parent chain expected?
  context: >-
    The parent of a script host is the core attribution signal here. A document application or mshta.exe
    spawning wscript.exe or cscript.exe is a common macro-execution chain, whereas explorer.exe from a
    user double-click is more routine. Tracing the parent's own origin (grandparent) shows whether the
    execution chain is user-driven or launched by another process. Maintain an allowlist of legitimate
    registry-management tools when judging what parents are normal for this environment.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What specific registry key and value were modified, and is this a known persistence or evasion location?
  context: >-
    The registry path reveals intent. Run and RunOnce keys indicate autostart persistence; Services, Winlogon,
    and Image File Execution Options keys enable launch-time hijacking; policy keys under Windows Defender or
    system-policy hives indicate security-setting tampering. The environment-specific list of monitored,
    high-value keys is what this judgment draws on. The value name and data (Details) determine what executes
    or what setting changes.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the script-host command line or the written value encoded or obfuscated, and what does it decode to?
  context: >-
    VBScript and JScript payloads commonly hide intent behind Chr() chains, string concatenation, base64,
    or hex before calling RegWrite. Decoding the script host's command line reveals the actual operation:
    a download cradle, an in-memory loader, or the concrete value being planted in the registry. The
    registry value data itself is decoded in the value-analysis step; here focus on the invocation that
    performed the write.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which scripting-engine modules did the writing process load?
  context: >-
    A RegWrite from wscript.exe, cscript.exe, or mshta.exe runs through a scripting engine loaded into the
    process. Loads of vbscript.dll, jscript.dll, or scrrun.dll confirm the VB/JScript engine that executed
    the write and distinguish genuine script execution from a renamed or hollowed binary. If scripting-engine
    module telemetry is not collected in this environment, treat an empty result as a visibility gap rather
    than evidence no script ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        ImageLoaded|endswith:
          - \vbscript.dll
          - \jscript.dll
          - \scrrun.dll
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- question: What other registry modifications occurred on this host in the same session?
  context: >-
    An operator who modifies one key often modifies several — setting an autostart entry while also
    disabling a security control or changing a service configuration. Grouping the registry changes on this
    host in the surrounding window by key path and writing process shows whether the alerting write stands
    alone or is one of a cluster of configuration changes made together, and places the change alongside the
    nearby activity it correlates with.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Does the registry change reference a payload on disk, and did the script host or its children write that file?
  context: >-
    Registry persistence is only effective if the referenced payload exists at the path stored in the value.
    If the write points an autostart key at a file, confirming that file was created determines whether the
    mechanism is active and what would execute on next logon. Correlating file activity by the writing
    process and its children surfaces the drop; the file-write event carries no hash, so hash the payload
    from a later execution or retrieve it for reputation lookup. Value or key deletion is not observable on
    this telemetry, so judge cleanup from the key's re-modification history and whether the payload ran.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What child processes did the script host spawn after the registry write?
  context: >-
    The processes a script host launches reveal its actual purpose. A VB or HTA script that spawns
    powershell.exe, cmd.exe, or a network-capable binary after touching the registry points to a
    multi-stage operation, whereas a script host with no children more often reflects a self-contained
    configuration change.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining the process activity surrounding the registry write reveals
    what led to it and what followed — reconnaissance, privilege escalation, or additional persistence — and
    correlates the registry change with nearby process execution. Aggregating by process and parent collapses
    repetitive agent noise while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Were other process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Attackers rarely rely on a single persistence method. After planting one foothold, they commonly add
    backups using different tools — scheduled tasks, services, or additional registry writes via reg.exe or
    bitsadmin. Several persistence installations in the same timeframe indicate intentional stacking rather
    than an isolated administrative change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were other living-off-the-land binaries used on this host recently for execution or persistence?
  context: >-
    Operators who use one built-in binary often use several. A script host writing registry persistence is
    frequently paired with proxy-execution or download binaries such as rundll32.exe, regsvr32.exe,
    certutil.exe, or msiexec.exe. Finding several such binaries performing related actions strengthens the
    case for hands-on activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\wmic.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\hh.exe'
          - '\ie4uinit.exe'
          - '\infdefaultinstall.exe'
          - '\installutil.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\diskshadow.exe'
          - '\dnscmd.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\xwizard.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was the script host executed from its expected system path?
  context: >-
    A script host running from outside System32 or SysWOW64 may have been copied or renamed to evade
    path-based allowlists. A wscript.exe or mshta.exe launched from a user temp or AppData directory is
    more notable than one in its standard system location. Comparing Image against OriginalFileName also
    reveals a renamed binary masquerading as a script host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: When this host previously produced this rule's script-host registry-write activity, what programs and users drove it, and does the current alert fit?
  context: >-
    The query mirrors the rule's selection and exclusions scoped to this host, so the program
    and user distribution reflects how this specific firing activity has historically run here
    rather than generic script-host usage. A new acting program process or an unexpected user
    account against that history is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: registry_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - \mshta.exe
        - \wscript.exe
        - \cscript.exe
      filter_main_binary_data:
        Details: Binary Data
      filter_main_null:
        Details: null
      filter_main_wscript_legit_1:
        Image|endswith: \wscript.exe
        TargetObject|contains:
        - SOFTWARE\Microsoft\Windows NT\CurrentVersion\Notifications\Data\
        - \Services\bam\State\UserSettings\S-1-
        - Software\Microsoft\Windows Script\Settings\Telemetry\wscript.exe\
        - Software\Microsoft\Windows\CurrentVersion\Internet Settings\
      filter_main_wscript_legit_2:
        Image|endswith: \wscript.exe
        TargetObject|contains: \wscript.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts produced this rule's script-host registry-write activity in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection and exclusions with no host scope, giving a fleet-wide count of
    this firing activity rather than generic script-host usage. Many hosts producing the same activity points
    to scripted deployment or vendor automation; a single host or a small unrelated set points to hands-on
    operator activity. Use the host distribution and parent/binary consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: registry_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - \mshta.exe
        - \wscript.exe
        - \cscript.exe
      filter_main_binary_data:
        Details: Binary Data
      filter_main_null:
        Details: null
      filter_main_wscript_legit_1:
        Image|endswith: \wscript.exe
        TargetObject|contains:
        - SOFTWARE\Microsoft\Windows NT\CurrentVersion\Notifications\Data\
        - \Services\bam\State\UserSettings\S-1-
        - Software\Microsoft\Windows Script\Settings\Telemetry\wscript.exe\
        - Software\Microsoft\Windows\CurrentVersion\Internet Settings\
      filter_main_wscript_legit_2:
        Image|endswith: \wscript.exe
        TargetObject|contains: \wscript.exe
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
- question: How often has this host produced the rule's script-host registry-write activity over the past 90 days, and what command-line structures are typical?
  context: >-
    This firing activity with no prior history on a host is more notable than activity seen regularly under
    stable parents. The query mirrors the rule's selection and exclusions scoped to this host, so the count
    reflects the rule's specific activity; the command-line projection lets typical invocations be compared
    against the alerting one. Command-line data is sparse on registry telemetry, so treat empty command-line
    values as a telemetry limitation rather than absence of activity.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - \mshta.exe
        - \wscript.exe
        - \cscript.exe
      filter_main_binary_data:
        Details: Binary Data
      filter_main_null:
        Details: null
      filter_main_wscript_legit_1:
        Image|endswith: \wscript.exe
        TargetObject|contains:
        - SOFTWARE\Microsoft\Windows NT\CurrentVersion\Notifications\Data\
        - \Services\bam\State\UserSettings\S-1-
        - Software\Microsoft\Windows Script\Settings\Telemetry\wscript.exe\
        - Software\Microsoft\Windows\CurrentVersion\Internet Settings\
      filter_main_wscript_legit_2:
        Image|endswith: \wscript.exe
        TargetObject|contains: \wscript.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - CommandLine
