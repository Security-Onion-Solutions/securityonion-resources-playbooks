name: Potential Provlaunch.EXE Binary Proxy Execution Abuse
id: 6a0a2413-d2a4-426b-9577-b4c8dcb78471
description: |
  Detects provlaunch.exe spawning a child process that is not on the list of routinely
  benign children and does not live in the common temporary or user-writable paths that
  normally accompany provisioning activity. provlaunch.exe reads command lines from
  HKLM\SOFTWARE\Microsoft\Provisioning\Commands and launches them, so an attacker who
  writes the right registry keys can proxy arbitrary execution under a trusted, signed
  Microsoft binary, leaving provlaunch.exe as the parent. The investigation should determine
  what child was launched, what command line it received, whether a registry provisioning
  command preceded it, and whether the activity matches expected provisioning or device
  setup on this host.
type: detection
detection_id: 7f5d1c9a-3e83-48df-95a7-2b98aae6c13c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the alerting event show provlaunch.exe as the parent of a child process that is not a routinely benign binary and not in a common temp or user-writable path?
  context: Confirm the alert is a true positive by reviewing the triggering event. The rule fires when provlaunch.exe is the parent AND the child is neither one of the commonly benign binaries (calc.exe, cmd.exe, cscript.exe, mshta.exe, notepad.exe, powershell.exe, pwsh.exe, regsvr32.exe, rundll32.exe, wscript.exe) nor located under PerfLogs, Temp, Users\Public, AppData\Temp, or the Windows Tasks/Temp directories. Read the child Image path and command line and check that it falls outside both exclusion sets.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: Is this user and host expected to be running provisioning or device-setup activity through provlaunch.exe?
  context: provlaunch.exe is normally invoked by Windows provisioning and device-setup flows, often shortly after imaging, enrollment, or a provisioning package install. If the host is a managed endpoint being set up or re-provisioned and the user context matches that workflow, the activity may be routine. Outside of a setup window, provlaunch.exe spawning an arbitrary child is unusual.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the full command line of the child process, and does it reference a URL, script, DLL entrypoint, or remote path?
  context: provlaunch.exe proxies whatever command it reads from the provisioning registry keys, so the child's command line is the operational payload. Decode any flags, file paths, URLs, or DLL entrypoints. Arguments pointing at externally hosted or unsigned content, script files, or rundll32/regsvr32-style entrypoints indicate the binary is being used to retrieve or execute attacker-controlled code rather than a setup task.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - Image
      - CurrentDirectory
- question: What spawned provlaunch.exe itself, and what command line did that parent carry?
  context: provlaunch.exe is launched by provisioning workflows, but an attacker can also invoke it directly to trigger execution of registry-defined commands. Retrieving the parent of provlaunch.exe shows whether it started from a legitimate provisioning host process or from an interactive shell, script interpreter, or other unexpected origin that would point to deliberate abuse.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Was a provisioning command written to the registry under Provisioning\Commands shortly before provlaunch.exe ran?
  context: provlaunch.exe executes commands defined under HKLM\SOFTWARE\Microsoft\Provisioning\Commands, and the keys are deleted after a successful run. A reg.exe or PowerShell invocation that creates Provisioning\Commands subkeys with an altitude value and a Commandline value, immediately preceding the alert, is the setup step that plants the proxied command. Its absence in normal provisioning would point to manual key creation.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_cmd:
        CommandLine|contains:
          - '\Provisioning\Commands'
          - 'Microsoft\Provisioning'
      condition: selection_host and selection_cmd
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- question: After it launched, did the child process load DLLs from a user-writable or temporary directory?
  context: System binary proxy execution frequently chains into loading attacker-supplied code in memory. Modules loaded by the child from PerfLogs, Temp, Users\Public, AppData, or the Windows Tasks/Temp directories indicate the proxied command pulled in non-system code rather than performing a self-contained setup action. If image-load telemetry is not collected in this environment, treat zero results as a visibility gap rather than evidence nothing loaded.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_paths:
        ImageLoaded|contains:
          - ':\PerfLogs\'
          - ':\Temp\'
          - ':\Users\Public\'
          - '\AppData\'
          - '\Windows\Tasks\'
          - '\Windows\Temp\'
      condition: selection and filter_paths
    fields:
      - Image
      - ImageLoaded
- question: Did the child process or its descendants make outbound network connections after launch?
  context: Proxy-execution payloads commonly retrieve a second stage or call back to remote infrastructure. Outbound connections from the child shortly after it was launched, especially to external addresses, point to retrieval or command-and-control rather than a local provisioning task. If network telemetry is not collected for this host, treat zero results as a visibility gap.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
- question: What other child processes did provlaunch.exe spawn around this time?
  context: provlaunch.exe can launch multiple commands within a single run. Enumerating every child it spawned on this host reveals whether the alerting process was one of several proxied commands forming a sequence, which would expand the scope of the activity beyond the single triggering event.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: How often has provlaunch.exe spawned this child binary on this host historically?
  context: Routine provisioning produces a recognizable set of provlaunch.exe child processes. A child binary that this parent has rarely or never spawned on this host before is a stronger signal of abuse than one that appears regularly as part of normal setup activity.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: Is provlaunch.exe spawning this same child binary on other hosts?
  context: The same provlaunch.exe parent-child pairing appearing across multiple hosts can indicate a pushed provisioning package or, if unexpected, a coordinated rollout of the proxied command. A single isolated occurrence is more consistent with host-local activity. Comparing across the environment helps calibrate scope.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \provlaunch.exe
      filter_main_covered_children:
      - Image|endswith:
        - \calc.exe
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \notepad.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
      - Image|contains:
        - :\PerfLogs\
        - :\Temp\
        - :\Users\Public\
        - \AppData\Temp\
        - \Windows\System32\Tasks\
        - \Windows\Tasks\
        - \Windows\Temp\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \provlaunch.exe
      filter_main_covered_children:
      - Image|endswith:
        - \calc.exe
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \notepad.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
      - Image|contains:
        - :\PerfLogs\
        - :\Temp\
        - :\Users\Public\
        - \AppData\Temp\
        - \Windows\System32\Tasks\
        - \Windows\Tasks\
        - \Windows\Temp\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around the time of the alert?
  context: Tracking the user's activity across all hosts reveals whether this provlaunch.exe execution is isolated or part of broader hands-on activity. The same user triggering related activity on multiple hosts would enlarge the scope of the investigation.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \provlaunch.exe
      filter_main_covered_children:
      - Image|endswith:
        - \calc.exe
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \notepad.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
      - Image|contains:
        - :\PerfLogs\
        - :\Temp\
        - :\Users\Public\
        - \AppData\Temp\
        - \Windows\System32\Tasks\
        - \Windows\Tasks\
        - \Windows\Temp\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What other process activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining process activity around the alert reveals what led to this event and what followed, and whether it is part of a larger sequence such as reconnaissance, privilege escalation, or persistence. Aggregating by Image and parent collapses repetitive agent noise while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal the attack stages that preceded this event and help reconstruct the timeline. The sequence of alerts on a host often tells the broader story behind a proxy-execution event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
