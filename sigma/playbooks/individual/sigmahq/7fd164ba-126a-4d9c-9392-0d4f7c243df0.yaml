name: OneNote Attachment File Dropped In Suspicious Location
id: 715fc305-8510-4135-bdc6-88c74aefeee8
description: |
  Detects creation of a OneNote container file (.one or .onepkg) in a user-writable staging
  location such as AppData\Local\Temp, C:\Users\Public, C:\Windows\Temp, or any :\Temp\ path,
  written by a process other than the legitimate OneNote application installed under
  Program Files\Microsoft Office. OneNote attachments are used as a phishing delivery vector: a
  container dropped outside the normal OneNote data directories, or written by an unexpected
  process, can indicate an attachment saved from email and staged for a click-to-run lure that
  spawns script hosts or downloaders. Investigation should confirm which process wrote the file,
  what it contains, whether it or a follow-on payload executed, and whether the same pattern
  appears on other hosts.
type: detection
detection_id: 7fd164ba-126a-4d9c-9392-0d4f7c243df0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Was a .one or .onepkg file created in a user-writable staging location by a process other than the installed OneNote application?
  context: >-
    Confirm the alert is a true positive by reviewing the exact file path, extension, and the
    responsible process. The rule fires on a OneNote container written to Temp, Public,
    Windows\Temp, or a :\Temp\ path by any process except ONENOTE.EXE running from
    Program Files\Microsoft Office. Verify the file lands in one of those locations and that the
    writer is not the legitimate OneNote install.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to receive and save OneNote attachments to a temporary location?
  context: >-
    Legitimate OneNote use stores notebooks under the user's OneDrive or Documents, not in Temp or
    Public. Knowing whether this user routinely handles OneNote files, and whether this host has a
    business reason to stage them in a temporary path, is often the fastest way to separate a
    benign save from an emailed attachment opened by a user.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What does this OneNote file contain?
  context: >-
    Inspect the container for embedded scripts, executables, or a click-to-run lure. A OneNote
    file can embed scripts, HTA files, batch files, or executables behind a button that
    instructs the user to double-click to view content. Retrieve the file and inspect its
    embedded objects and any URLs, encoded strings, or command fragments they reference.
    Legitimate notebooks hold notes and images, not launchers.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What was the full command line of the process that wrote this file?
  context: >-
    The file event names the writing process but not its command line. Pivoting to the process's
    own execution record reveals how the container arrived — a browser or mail client saving an
    attachment, a script host writing it, or a downloader fetching it. A command line that
    references a URL, a temp path, or a scripting interpreter is a different situation from an
    interactive save.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: Did the dropped file, or a renamed copy of it, later run as a process — and if so, what is its hash?
  context: >-
    File-creation events carry no hash; a hash is recorded only when a file runs. OneNote
    containers are opened by the OneNote application rather than executed directly, so this most
    often returns nothing — in which case retrieve the file from its on-disk path and hash it
    manually, then check it against threat intelligence. If a copy of the path was renamed and
    executed, this surfaces the running image and its hash.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: What process spawned the writer, and is that parent chain expected?
  context: >-
    The parent of the writing process shows how the drop was initiated. A container written by a
    child of a mail client, browser, or script host fits the emailed-attachment pattern; a child
    of an Office application launching a script host is a common step in click-to-run delivery.
    A predictable parent such as explorer.exe for a manual save is lower concern.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Did script hosts or command interpreters run on this host shortly after the file was created?
  context: >-
    OneNote attachment lures typically fire a script host or downloader once the user clicks the
    embedded prompt — mshta.exe, wscript.exe, cscript.exe, cmd.exe, or PowerShell launching from
    an Office parent. Their presence in the hours after the container was dropped, especially with
    ONENOTE.EXE as the parent, connects the file to payload retrieval or hands-on activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
        - \mshta.exe
        - \wscript.exe
        - \cscript.exe
        - \powershell.exe
        - \pwsh.exe
        - \cmd.exe
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Is the OneNote file still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives next steps. A container still on disk can be retrieved,
    its embedded objects extracted, and hashed; a file deleted or renamed shortly after creation
    suggests cleanup or that its payload was unpacked and the container discarded, shifting the
    investigation to what executed in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A process that drops one container often stages several files — an unpacked HTA, a batch
    script, or a downloaded second stage. The breadth, paths, and extensions of the writer's other
    file activity distinguish a single saved attachment from an active delivery chain and
    enumerate what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to these staging locations on this host recently, and by which processes?
  context: >-
    The paths this rule watches — Temp, Public, and :\Temp\ directories — are user-writable and
    see legitimate traffic, so the useful signal is which processes write there and whether other
    unusual files arrived in the same window. A single unfamiliar writer placing multiple files,
    or other executables and scripts landing beside the container, points to staging rather than
    an isolated save.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
        - \AppData\Local\Temp\
        - \Users\Public\
        - \Windows\Temp\
        - :\Temp\
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has a file with this name been seen before on this host?
  context: >-
    A container filename that has never appeared on this host is more notable than one tied to
    routine work. First-time appearance, especially in a temporary location, is consistent with a
    freshly delivered attachment.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Is a file with this name present on any other hosts in the environment?
  context: >-
    The same container name arriving on multiple hosts points to a distribution — a phishing wave
    reaching several mailboxes, or deliberate staging. A single host suggests a targeted or
    one-off delivery; a broad spread defines the set of hosts that received the attachment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- question: Has this user previously produced this drop pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's detection scoped to this user — their 90-day history of dropping
    OneNote containers into these staging locations, not generic file activity, aggregated by
    host. A user who has never produced this pattern is more notable than one who does so
    routinely; weigh the count against whether their role involves handling such files.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains:
        - \AppData\Local\Temp\
        - \Users\Public\
        - \Windows\Temp\
        - :\Temp\
        TargetFilename|endswith:
        - .one
        - .onepkg
      filter_main_onenote:
        Image|contains: :\Program Files\Microsoft Office\
        Image|endswith: \ONENOTE.EXE
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this program historically driven this drop pattern here or across the environment, or is it new for this activity?
  context: >-
    When the alert fires under a service or machine account, user identity does not attribute the
    behavior; the launch mechanism does. The query mirrors the rule's detection scoped to the
    alerting program — its 90-day history of driving this specific drop pattern, aggregated
    by host. A program that already accounts for many prior events is likely software automation; a
    new or rare program for this pattern is the deviation worth chasing.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains:
        - \AppData\Local\Temp\
        - \Users\Public\
        - \Windows\Temp\
        - :\Temp\
        TargetFilename|endswith:
        - .one
        - .onepkg
      filter_main_onenote:
        Image|contains: :\Program Files\Microsoft Office\
        Image|endswith: \ONENOTE.EXE
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts shows whether the drop is isolated or part of
    broader movement. The same user producing related activity on multiple hosts widens the scope
    of what must be reviewed.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same program-driven drop pattern fire on other hosts in the same window?
  context: >-
    Under a service or machine account, a user-wide network query returns agent-telemetry noise.
    The meaningful question is whether the same launch mechanism dropped this pattern elsewhere in
    the alert window: the query mirrors the rule's detection scoped to the alerting program,
    fleet-wide. Multiple hosts in the same window point to pushed or scheduled automation; a single
    host points to a host-local trigger.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains:
        - \AppData\Local\Temp\
        - \Users\Public\
        - \Windows\Temp\
        - :\Temp\
        TargetFilename|endswith:
        - .one
        - .onepkg
      filter_main_onenote:
        Image|contains: :\Program Files\Microsoft Office\
        Image|endswith: \ONENOTE.EXE
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. The process activity around the drop reveals what led to it
    and what followed — an Office application launching a script host, a downloader reaching out,
    or persistence being established. Novel parent-child pairs stand out against routine background
    processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — phishing indicators, script-host abuse, or
    reconnaissance — may reveal the stages that preceded the drop and help reconstruct the delivery
    timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
