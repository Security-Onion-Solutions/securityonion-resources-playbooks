name: UAC Bypass Using NTFS Reparse Point - File
id: 8c4aa36d-006a-4902-a3ff-5d02d68d423d
description: |
  Detects a file named api-ms-win-core-kernel32-legacy-l1.DLL being written under a user's AppData\Local\Temp directory, the planted-DLL stage of a User Account Control bypass that abuses an auto-elevated binary's DLL search order (the reparse-point / wusa.exe variant). Legitimate software rarely drops a copy of a core Windows API-set DLL into a per-user Temp path, so the write itself is the signal: an auto-elevated process that subsequently loads that DLL executes attacker-controlled code at high integrity without a consent prompt. Investigation should confirm the file's identity and load context, trace the process that planted it and its parent lineage, and determine what elevated action followed.
type: detection
detection_id: 7fff6773-2baa-46de-a24a-b6eec1aba2d1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Do the file path and creating process match what this rule detects?
  context: Confirm the alert is a true positive before investing time. The rule fires on a write to a path that starts with C:\Users\ and ends with \AppData\Local\Temp\api-ms-win-core-kernel32-legacy-l1.DLL. Review the exact path, the operation performed, and the responsible process against those criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to have a core Windows API-set DLL written into a per-user Temp directory?
  context: Legitimate installers and updaters stage files under AppData\Local\Temp, but a copy of a system API-set DLL named api-ms-win-core-kernel32-legacy-l1.DLL landing there is not a normal software pattern. Knowing whether the user role and host function involve software packaging or developer tooling helps separate a routine operation from an elevation attempt. When the writer is a machine or service account, judge by the responsible process and host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What did the process that dropped this DLL do, and how was the file planted?
  context: The file event names the responsible process but not its command line or parent. Retrieving the writing process's full command line and working directory reveals how the DLL arrived - extracted from a package by an auto-elevated installer, copied directly, or written through a reparse-point redirection into a protected path. The command line often names the source archive or the bypass method.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - ParentImage
- question: Is the written file the legitimate signed API-set DLL, or a planted payload?
  context: The real api-ms-win-core-kernel32-legacy-l1.dll is a small signed API-set forwarder that ships in the system directory, not something applications drop into a user Temp folder. Retrieve the file from its on-disk path and check its size, signing status, and embedded strings. A planted hijack DLL is typically unsigned or signed by an unexpected party and contains the attacker's payload rather than the expected forwarder stub.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Was this DLL loaded into a process, and what is its hash and signature status?
  context: A DLL carries its hash and signature on the load event, so this reveals whether the planted file was actually loaded and by which process. A load into an auto-elevated binary (for example wusa.exe or another process that elevates without a prompt) means the hijack executed with high integrity. Submit the hash to threat intelligence to determine whether the file is known malicious, and treat an unsigned or unexpectedly signed loaded module as confirmation the API-set name was spoofed.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - ImageLoaded
      - Image
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: Is the file still on disk, or was it deleted or renamed after the alert?
  context: The file's post-alert lifecycle drives urgency and next steps. A payload still on disk can be retrieved, hashed, and analyzed; a copy deleted seconds after the load suggests anti-forensic cleanup once the elevation succeeded, shifting the investigation to what executed in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the responsible process write or delete around the alert?
  context: A process staging a DLL hijack often writes several files - the payload DLL, a package or reparse-point structure, and helper artifacts. The breadth, paths, and extensions of the process's other file activity distinguish a single planted file from a full staging operation and enumerate what else needs review. The correlation covers the writer and its direct children, since droppers often delegate.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to this Temp directory recently, and by which processes?
  context: The per-user AppData\Local\Temp directory sees high legitimate volume, so the value is in the writers and neighbors rather than raw counts. Other API-set-named DLLs, packages, or reparse-point artifacts arriving in the same location around the same time reveal whether this is an isolated drop or a location under active use, and which processes are writing there. Group by path and writer and look for an unfamiliar process placing system-looking DLLs into a user Temp path.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\AppData\Local\Temp\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What process spawned the one that dropped this DLL, and is that parent chain expected?
  context: The parent lineage shows how the planting process was invoked. A non-elevated process spawning an auto-elevated one, or an unusual parent such as a script host or Office application, is the parent-child mismatch that UAC bypasses rely on. Walk up the tree to see what launched the writer and what else that parent spawned.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining process activity in the surrounding window reveals what led to the DLL being planted and what happened after - reconnaissance, additional elevation attempts, or persistence. Aggregating by process and parent collapses routine agent noise into high-count rows while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: What action was performed with elevated privileges after the DLL was planted?
  context: UAC bypass is a means to an end - attackers elevate to install persistence, dump credentials, tamper with security tools, or reach protected resources. Processes running at High or System integrity shortly after the planted DLL loads reveal the objective. Correlating the drop and the elevated execution within a short window (a tunable time correlation, on the order of tens of seconds) separates the bypass from unrelated admin activity. Common follow-on binaries include reg.exe and schtasks.exe for persistence and credential-dumping tools.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: Were command-line registry writes made to set up a UAC bypass on this host?
  context: Many UAC bypasses plant a command in a registry key that an auto-elevated process reads and executes. Command lines invoking reg.exe, powershell.exe, or cmd.exe against keys such as ms-settings\Shell\Open\command, mscfile, exefile, Folder\shell\open\command, Environment, or DelegateExecute reveal a registry-based bypass being staged alongside or instead of the file-based one. Finding such a write confirms deliberate elevation setup and names the payload.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\reg.exe'
          - '\powershell.exe'
          - '\cmd.exe'
        CommandLine|contains:
          - 'ms-settings'
          - 'mscfile'
          - 'Classes\exefile'
          - 'Classes\Folder'
          - 'Environment'
          - 'Shell\Open\command'
          - 'DelegateExecute'
      condition: selection
    fields:
      - CommandLine
      - Image
- question: Were the registry keys that other UAC-bypass techniques hijack modified on this host around the alert?
  context: Operators frequently try several bypass methods until one succeeds. Beyond command-line inference, a direct registry modification to an auto-elevated handler key - ms-settings\Shell\Open\command, mscfile\shell\open\command, exefile\shell\open\command, Folder\shell\open\command, Environment, or a DelegateExecute value - points to a registry-based bypass staged in the same window as this file-based one. Registry-value deletion is not observable on this telemetry, so the absence of a later cleanup event does not clear a key.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\ms-settings\Shell\Open\command'
          - '\mscfile\shell\open\command'
          - '\exefile\shell\open\command'
          - '\Folder\shell\open\command'
          - '\Environment'
          - 'DelegateExecute'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Were other privilege escalation techniques attempted on this host?
  context: Attackers who attempt one UAC bypass often try multiple methods, especially if the OS version or configuration blocks certain techniques. Other privilege-escalation or defense-tampering detections on this host in the surrounding window confirm deliberate escalation activity rather than a false positive, and their ordering helps reconstruct the timeline.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection scoped to this user - the user's 90-day history of this exact file-write pattern, not generic activity, aggregated by host. A user who has never produced this pattern is more suspicious than one who does so regularly; weigh the count against the user's role and typical toolset.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\Users\
        TargetFilename|endswith: \AppData\Local\Temp\api-ms-win-core-kernel32-legacy-l1.DLL
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this program historically driven the rule's pattern on this host or across the environment, or is the program new for this activity?
  context: 'When the alert fires under a service or machine account, user identity does not attribute behavior; the launch mechanism does. This query mirrors the rule''s selection scoped to the alerting program, returning the 90-day history of that program driving this specific file-write pattern. A new or rare program for this pattern is the deviation worth chasing; a program that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\Users\
        TargetFilename|endswith: \AppData\Local\Temp\api-ms-win-core-kernel32-legacy-l1.DLL
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or parallel activity on multiple endpoints. If the alert fired under a service or machine account, this pivot returns unbounded agent-telemetry noise and the parent-driven fleet-wide view is the meaningful answer instead; for an interactive user account it summarizes what else they ran in the window.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same program-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: 'Under a service principal, a user-scoped network view returns agent-telemetry noise. The meaningful question is whether the same launch mechanism fired elsewhere: this query mirrors the rule''s selection scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\Users\
        TargetFilename|endswith: \AppData\Local\Temp\api-ms-win-core-kernel32-legacy-l1.DLL
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
