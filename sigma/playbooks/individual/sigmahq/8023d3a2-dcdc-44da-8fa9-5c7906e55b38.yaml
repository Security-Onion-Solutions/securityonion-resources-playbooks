name: Potential CVE-2023-36884 Exploitation Dropped File
id: 6cb2192d-ebd8-4355-8d7f-6e74ec5e9695
description: |
  Detects creation of a file named file001.url inside the Office Recent folder
  (C:\Users\<user>\AppData\Roaming\Microsoft\Office\Recent\), an artifact observed
  during exploitation of CVE-2023-36884. The Recent folder normally holds .lnk
  shortcuts to recently opened documents written by Office applications, so this
  specific filename and extension in that location is not a routine Office artifact.
  Investigation should confirm the exact path, read the shortcut's target, identify
  the Office process and the document that triggered the write, and determine whether
  the drop was followed by code execution or persistence.
type: detection
detection_id: 8023d3a2-dcdc-44da-8fa9-5c7906e55b38
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the alerting file path match the rule's pattern — a file001.url written into the Office Recent folder?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact file path and the process that created it. The rule fires when a file named file001.url is written under C:\Users\...\AppData\Roaming\Microsoft\Office\Recent\, a filename and location associated with CVE-2023-36884 exploitation rather than normal Office use.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to have a file001.url written into the Office Recent folder?
  context: Legitimate Office activity populates the Recent folder with .lnk shortcuts to recently opened documents, not a file001.url. Knowing whether this user and host routinely handle the documents that would explain Office writing here is often the fastest way to separate exploitation from benign activity. When the writer is a machine or service account, judge by the writing process and host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the file still on disk, or was it deleted or renamed after the alert?
  context: The dropped file's post-alert lifecycle drives both urgency and next steps. A file001.url still on disk can be retrieved and its target URL read; a file deleted seconds after creation suggests anti-forensic cleanup or a self-deleting dropper and shifts focus to what executed in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What is inside this file001.url — what resource does the shortcut point to?
  context: A .url file is an INI-format Internet Shortcut whose [InternetShortcut] URL= line names the resource opened when the shortcut is invoked; some variants also reference an icon over SMB or WebDAV, which can coerce an outbound authentication attempt. Read the file's content and record the target host, path, and scheme. An external or SMB/WebDAV destination is consistent with CVE-2023-36884 exploitation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What was the process that wrote this file doing, and which document did it have open?
  context: The Recent folder is written by Office applications; the writing process's command line and working directory reveal which document was open when the drop occurred, and for CVE-2023-36884 that document is the exploit-bearing file. This shows every execution of that process on the host within a few minutes of the alert, so a multi-step operation is visible as a sequence rather than a single event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Did any process later run from this dropped path, and if so what is its hash and threat-intel reputation?
  context: A file's hash is recorded when it runs, not when it is written. A .url Internet Shortcut is not itself an executable, so this pivot mainly matters if the shortcut's target is a local payload that later runs; check whether any process image matches the dropped path, and hash whatever the shortcut retrieves. Submit any resulting hash to threat intelligence to judge whether it is known malicious, benign, or previously unseen.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
- question: Did the process that dropped this file spawn any child processes afterward?
  context: Exploitation progresses from delivering an artifact to running code. The Office application that wrote this file is identified by its process GUID on the alert; enumerating processes it spawned reveals whether the drop was followed by execution — a scripting host, a downloaded payload, or a living-off-the-land binary launched from the same parent.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other files did the responsible process write or delete around the alert?
  context: A process that drops one exploitation artifact often writes several — staged payloads, additional shortcuts, or configuration. The breadth, paths, and extensions of the writing process's other file activity distinguish an isolated drop from active staging and enumerate what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to the Office Recent folder recently, and by which processes?
  context: The Office Recent folder normally holds .lnk shortcuts to recently opened documents, written by Office applications. Other recent arrivals here — additional .url files, unexpected extensions, or writes by a non-Office process — reveal whether this is an isolated drop or a location under active use, and which other artifacts belong to the same activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\AppData\Roaming\Microsoft\Office\Recent\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has this file been seen before on this host?
  context: A file that has never appeared on a host is more notable than one that is part of normal operations. This filename in the Office Recent folder is not a standard Office artifact, so any prior appearance is itself worth examining as an earlier exploitation attempt. Zero or very low counts indicate a first-time drop.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Is this file present on any other hosts in the environment?
  context: Finding the same dropped file across multiple hosts points to a broader exploitation attempt rather than a single target. If it is only on one host, the activity may be targeted; if on many, establish the distribution timeline and whether the same document reached each host.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining process activity around the drop reveals what led to it and what followed — reconnaissance, payload execution, or persistence — and whether the file drop is one step in a larger sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — phishing-document handling, defense tampering, or reconnaissance — may reveal the stages that preceded this drop and help reconstruct the timeline of the exploitation attempt.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection scoped to this user — the result is the user's 90-day history of this specific drop pattern (not generic file activity), aggregated by host. A user who has never produced this pattern is more notable than one who does so regularly; weigh the count against the user's role and typical document handling.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\Users\
        TargetFilename|contains: \AppData\Roaming\Microsoft\Office\Recent\
        TargetFilename|endswith: \file001.url
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven the rule's pattern on this host or across the environment, or is the program new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior. The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection scoped to the alerting program, so the result is the 90-day history of this program driving this specific pattern (not generic program co-occurrence). A new or rare program for this pattern is the deviation worth chasing; a program that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\Users\
        TargetFilename|contains: \AppData\Roaming\Microsoft\Office\Recent\
        TargetFilename|endswith: \file001.url
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity on multiple hosts, the scope of the incident may be larger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: 'Under a service principal, asking what else this user did across the network returns agent-telemetry noise, because every host runs SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism fired elsewhere: the query mirrors the rule''s selection scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\Users\
        TargetFilename|contains: \AppData\Roaming\Microsoft\Office\Recent\
        TargetFilename|endswith: \file001.url
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Were files dropped to persistence locations (Startup folders, scheduled-task definitions) on this host?
  context: File-based persistence bypasses command-line detection entirely. After an initial foothold, actors commonly drop an executable or script into a Startup folder or a path referenced by a registry Run key. File-event monitoring captures these drops even when standard persistence tools are avoided; matches near this drop's timeframe indicate the exploit established persistence.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
