name: Usage of Renamed Sysinternals Tools - RegistrySet
id: e530e147-e824-4502-a2b6-0fa5ef578228
description: |
  Detects a registry write to a Sysinternals EULA-acceptance key (a TargetObject containing \PsExec, \ProcDump, \Handle, \LiveKd, \Process Explorer, \PsLoglist, \PsPasswd, or \Active Directory Explorer and ending in \EulaAccepted) where the writing process is NOT one of the canonical Sysinternals executable names and the process is attributed. Sysinternals utilities write this key themselves on first run, and the key name is baked into the tool by its author, so it still names the real tool even when the executable on disk has been renamed. The gap between the tool identity declared by the registry key and the name of the process that wrote it is the finding. Legitimate renaming does happen (administrators shortening names, scripts and deployment packages wrapping the tools), and Sysinternals binaries are signed Microsoft utilities, so signing status is not a discriminator here. The investigation should establish both halves of the gap -- which tool the key identifies and what the writing process was actually called -- and then let the real tool identity drive the follow-on question, since PsExec points toward remote execution and ProcDump toward credential access.
type: detection
detection_id: 8023f872-3f1d-4301-a384-801889917ab4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the registry key name a Sysinternals tool while the process that wrote it carries a different name?
  context: >-
    Confirm the key path contains one of the tracked tool names and ends in \EulaAccepted, then read the Image of the writing
    process. The rule only fires when that Image is not one of the tools' own filenames, so the mismatch between the key name
    and the executable name is the trigger condition itself. The signer columns are context, not a verdict -- Sysinternals
    binaries are Microsoft-signed whatever they are renamed to, so read the signer for coherence with the key rather than as
    an exoneration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to run Sysinternals administrative utilities?
  context: >-
    Sysinternals tools are standard administrative software, and a server administrator or helpdesk technician running them
    is routine. A general user account, a service account, or a workstation with no administrative role running one is not.
    User attribution is present on most endpoint registry events; when it resolves to a machine account or is missing, attribute
    the activity through the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What was this binary actually named on disk, and does its embedded metadata still identify the original tool?
  context: >-
    Renaming an executable changes the name on disk but not the PE metadata compiled into it. Comparing the Image path against
    OriginalFileName gives the second half of the identity gap the registry key opened -- the key says which tool it is, the
    metadata says what the tool was built as, and the Image path says what someone chose to call it. The hash supports a reputation
    lookup that confirms whether this is a stock Sysinternals build or a modified one.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: Which Sysinternals tool does the registry key identify, and how consequential is that tool?
  context: >-
    The key path segment before \EulaAccepted is the tool's self-declared identity, written by the tool itself and unaffected
    by renaming the executable. Which tool it names changes the investigation: PsExec provides remote execution, ProcDump
    provides process memory capture, PsPasswd changes account passwords, and Active Directory Explorer enumerates directory
    objects, while Process Explorer, Handle, LiveKd, and PsLoglist are largely local inspection utilities. The Details value
    is normally the DWORD 1 that records acceptance and carries no further information.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Is the writing process a plausible owner of this Sysinternals key, or does the key belong to a different tool entirely?
  context: >-
    A EULA key under the Sysinternals hive should be written by the tool it names. The discriminating judgment is whether
    the vendor and the executable name of the writing process are coherent with the key -- a wrapper or launcher signed by
    an internal software publisher writing a PsExec key is a different situation from a process named after an operating system
    service writing one. Sysinternals executables are Microsoft-signed, so trusted signing status is expected here and settles
    nothing on its own.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: How did the renamed binary arrive on this host, and what process wrote it to disk?
  context: >-
    A renamed tool was copied, downloaded, extracted, or dropped by something. Matching the file creation event by basename
    over a long window surfaces every write of that filename to this host regardless of where it landed. A browser, an archive
    utility, or a transfer tool as the creating process points to ad-hoc delivery, while a deployment or packaging process
    points to a sanctioned installation that happens to rename the tool.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What launched the process that wrote this key, and what arguments did it run with?
  context: >-
    The registry event names the acting process but not its origin or its command line. Retrieving the process start event
    supplies both. An interactive shell or explorer.exe as the parent is consistent with a person running the tool by hand;
    a script host, a remote-execution service, or an unexpected application as the parent points to programmatic or delivered
    execution. The command line also reveals whether the tool was invoked against a remote target.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What child processes did the renamed binary spawn?
  context: >-
    The point of renaming a tool is to keep its function while changing its name, so the children reveal the function. PsExec
    under any name spawns a command interpreter or the payload it was asked to run; ProcDump and the inspection utilities
    normally spawn nothing. Children that do not fit the tool the registry key named are worth more attention than the rename
    itself.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did the process that wrote the key connect to other hosts, and over which ports?
  context: >-
    Several of the tools named by these keys operate against remote systems. PsExec reaches a target over SMB on port 445
    to stage its service, and PsLoglist, PsPasswd, and Active Directory Explorer likewise take a remote target. Outbound connections
    from this process to internal hosts indicate the renamed tool was pointed at something rather than run locally, which
    turns this into a lateral-movement question and gives the next hosts to examine.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
- question: Was a process memory dump file written to this host after the tool ran?
  context: >-
    When the registry key identifies ProcDump, the natural follow-on is credential access -- a dump of a privileged process
    written to disk for offline parsing. A dump file appearing in the hours after the alert, particularly in a user-writable
    or staging directory, moves the investigation from tool usage to credential exposure. If the key identifies a tool with
    no dumping capability, an unexpected dump file here still indicates separate activity on the host.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith:
          - .dmp
          - .dump
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Were other registry modifications made on this host in the same session?
  context: >-
    Operators who bring one renamed tool to a host often bring several, and each Sysinternals utility writes its own EULA
    key on first run. Additional EULA keys in the same window mean a toolkit rather than a single utility. Modifications to
    autostart, service, or security policy keys alongside the tool usage indicate the session had objectives beyond running
    the tool.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Aggregating process starts by executable and parent around the alert collapses routine agent and service telemetry into
    high-count rows and leaves novel parent-child pairs standing out at low counts. Look for the remote-access or scripting
    process that delivered the tool, other renamed binaries running from the same directory, and reconnaissance or credential
    access running alongside it.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Has a binary with this name run on this host before, and under which accounts?
  context: >-
    If the renamed executable name has a long, stable history on this host under the same accounts, it is likely an internal
    naming convention or a wrapper that has always worked this way. Zero or very low counts mean the name arrived with this
    activity. Note that a common or system-sounding name with heavy history may reflect a legitimate binary that this renamed
    tool was named after rather than a history of the tool itself.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Has this Sysinternals EULA key been written on this host before, and by what process?
  context: >-
    The key is written on a tool's first run per user, so history here shows whether this tool has an established presence
    on the host. History written by the tool's canonical executable name followed by a write from a differently named process
    indicates the rename is new rather than the tool. No history at all means the tool is new to this host and user.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Has this same Sysinternals key been written on other hosts recently, and by which processes?
  context: >-
    The same key written across many hosts by the tool's canonical filename is a normal administrative footprint and helps
    establish what the environment's baseline looks like. The same key written by the same non-canonical executable name on
    several hosts indicates the renamed tool is being distributed rather than used once, and gives the set of hosts to examine
    next.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Renamed administrative tooling usually arrives partway through an operation rather than at its start. Earlier detections
    on the same host covering remote execution, defense tampering, or reconnaissance help place this event in a sequence and
    identify how the operator reached the host.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
