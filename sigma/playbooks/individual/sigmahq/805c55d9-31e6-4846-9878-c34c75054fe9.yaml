name: Octopus Scanner Malware
id: 7a99540c-abc9-4334-a9b5-637556ecec17
description: |
  Detects creation of a file whose path ends in one of two known Octopus Scanner artifact
  names (Cache134.dat or ExplorerSync.db) under \AppData\Local\Microsoft\. Octopus Scanner is
  open-source supply-chain malware that backdoors developer build processes so that artifacts
  produced by an infected project are themselves infected; the Windows dropper writes its payload
  to this path and persists it through a per-minute scheduled task that runs the payload via
  javaw, which in turn spawns a remote-administration payload that reaches out to command-and-control.
  Investigation should confirm the drop, identify the process and parent that wrote it, determine
  whether the payload executed and established persistence or outbound connections, and establish
  how far the same artifact has spread across the environment.
type: detection
detection_id: 805c55d9-31e6-4846-9878-c34c75054fe9
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the dropped file path match one of the artifact names this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing
    the exact file path against the rule's criteria — a write whose path ends in either
    \AppData\Local\Microsoft\Cache134.dat or \AppData\Local\Microsoft\ExplorerSync.db — along with
    the operation performed and the responsible process. Note which of the two artifact names
    fired, as each maps to a different payload stage.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to have a Java build or development toolchain writing to this path?
  context: The malware backdoors developer build tooling, so a drop under \AppData\Local\Microsoft\
    by a Java runtime is most plausible on an engineering endpoint. Confirm whether the host is a
    developer or build machine and whether the user account routinely runs Java-based development
    tools; restricting analytics to known development hosts and trusted signers is the primary way
    to separate expected activity from a compromise. When the writer is a machine or service
    account, judge by the writing process and host role instead of the user.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What process and parent chain wrote this file?
  context: The writing process and its parent reveal how the artifact arrived. For this malware the
    payload is dropped and later relaunched from a Java runtime (javaw) under a scheduled task, so
    look for a build tool, IDE, installer, or scheduled-task host as the parent. Identifying the
    delivery mechanism enables blocking it and searching for the same origin on other endpoints.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Did this same detection fire on any other hosts?
  context: Supply-chain compromise propagates through shared build tooling and infected project
    artifacts, so the same drop frequently appears on multiple developer or build endpoints.
    Correlating this rule across hosts reveals how broadly the artifact has spread and identifies
    additional systems that need the same investigation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is the developer tool or Java runtime that wrote this file a trusted, current install?
  context: This malware family rides inside legitimate development tooling, so the provenance and
    version of the writing application matter more than a specific CVE. Determine whether the Java
    runtime or build tool that produced this file came from an approved source and is current, and
    whether its projects or dependencies could have been tampered with. An outdated or unmanaged
    developer toolchain widens the set of endpoints that could be similarly affected.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: Is the file still on disk, or was it deleted or renamed after the alert?
  context: The file's post-alert lifecycle drives both urgency and next steps. A payload still on
    disk can be retrieved, hashed, and analyzed; a file deleted or replaced shortly after creation
    suggests cleanup or a self-updating dropper and shifts the investigation to what executed in
    between. Interpret the returned operations by type to see the full creation-to-deletion history
    on this host.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the responsible process write or delete around the alert?
  context: A dropper rarely writes a single file — it often stages several components (a payload,
    a persistence artifact, a loader). The breadth, paths, and extensions of the writing process's
    other file activity distinguish a single artifact from a multi-component install and enumerate
    what else needs review. The alert's file event carries the writer's process identifiers, so the
    correlation covers the writer and its direct children.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to the Local\Microsoft directory recently, and by which processes?
  context: The malware hides its payload alongside legitimate content under \AppData\Local\Microsoft\,
    a directory a small set of processes normally write to. Other recent arrivals here — and which
    processes created them — reveal whether this is an isolated drop or a location under active use,
    and surface sibling artifacts (a second payload stage, a loader) that belong to the same activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\AppData\Local\Microsoft\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What is in the dropped file, and does its content match the known malware artifact?
  context: Read and analyze the file's actual content rather than trusting the filename alone. This
    family is a Java payload that heavily obfuscates itself with chained encrypted byte-array methods
    to defeat strings-based analysis, so confirm the file type and check for embedded classes,
    obfuscated strings, and known indicators. Compare against threat intelligence to establish
    whether it is the real payload, a decoy, or an unrelated file that happens to match the path.
    Content retrieval requires pulling the file from the endpoint or an offline copy.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If this artifact executed, what is its hash — and does it have known AV or threat-intel detections?
  context: A file's hash is recorded when it runs, not when it is written, so this query looks for
    the artifact executing and reads its hash for submission to reputation and threat-intel services.
    Because this payload is launched as a Java argument (javaw -jar), the running process image is
    typically the Java runtime rather than the artifact itself, so it may not appear here — in that
    case retrieve the file from its on-disk path and hash it manually. A present-but-not-executed
    file will likewise not appear.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: Was this file executed or launched after it was written?
  context: This family's Windows persistence relaunches the payload through a Java runtime on a
    scheduled task, so execution can follow the drop within minutes and recur every minute. Correlating
    the file write to subsequent process execution reveals whether the artifact progressed from
    delivery to running code. A correlation window of roughly 90 minutes to two hours after the write
    captures staged first-run activity; extend it for slow rollouts.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: After this file was written, did the host load any unsigned or abnormally-signed modules?
  context: Supply-chain first-run activity often surfaces as unsigned or unexpectedly-signed modules
    loading when the newly written component executes. Modules loaded on this host that fail signing
    or carry no signature — weighed against the publishers you expect on a build endpoint — point to
    tampered or attacker-supplied code loaded after the drop. Grouping by loaded module and signer
    isolates the unusual loads from routine signed ones.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_signed:
        Signed: 'true'
      condition: selection and not filter_signed
    fields:
      - ImageLoaded
      - Signature
      - SignatureStatus
      - Image
- question: Did the process that wrote this file also modify registry autostart or persistence values?
  context: Beyond the scheduled task, supply-chain tooling can plant persistence or configuration in
    the registry. Reviewing registry values the writing process modified shows whether it also
    established a run-key foothold or altered developer-tool settings. Registry value data is present
    on most modifications but absent for binary or empty values, and value deletion is not observable
    on this telemetry — assess the current value history rather than expecting a delete record.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: After the drop, did the host make outbound connections to new or uncommon external destinations?
  context: The dropper's payload spawns a remote-administration component that reaches out to
    command-and-control, frequently over dynamic-DNS hostnames. Outbound connections from this host
    that are new or go to destinations outside the approved update and registry endpoints are the
    egress stage of this activity; grouping by destination and initiating process separates first-time
    external contact from routine traffic. Known update CDNs and package registries can be treated as
    expected to reduce noise.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- always_include: true
  question: Has this user previously produced the rule's drop pattern, and does that history fit their role?
  context: The query mirrors the rule's selection scoped to this user — the result is the user's
    90-day history of this specific artifact being written (not generic file activity), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against whether the user routinely works with Java build tooling.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith:
        - \AppData\Local\Microsoft\Cache134.dat
        - \AppData\Local\Microsoft\ExplorerSync.db
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has the alerting program historically driven this drop pattern, or is the program new for this activity?
  context: When the alert fires under a service principal or machine account, user identity does not
    attribute behavior; the meaningful pivot is the launch mechanism. The query mirrors the rule's
    selection scoped to the alerting program, so the result is the 90-day history of this
    program writing this specific artifact. A new or rare program for this pattern is the deviation worth
    chasing; a program already responsible for thousands of prior events is more likely automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith:
        - \AppData\Local\Microsoft\Cache134.dat
        - \AppData\Local\Microsoft\ExplorerSync.db
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the same account triggered
    related activity on multiple endpoints, which would enlarge the scope of compromise. If the alert
    fired under a system, service, or machine account, this view returns broad agent-telemetry noise,
    and the parent-driven view of the same window is the meaningful answer instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven drop fire on other hosts in the same window, or is it isolated to this host?
  context: Under a service principal, asking what else the user did network-wide returns agent-telemetry
    noise, because every host runs system-owned agents constantly. The meaningful question is whether
    the same launch mechanism wrote this artifact elsewhere in the alert window, where multiple hosts
    point to scheduled or pushed automation and a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith:
        - \AppData\Local\Microsoft\Cache134.dat
        - \AppData\Local\Microsoft\ExplorerSync.db
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
