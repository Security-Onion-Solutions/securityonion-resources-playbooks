name: PUA - Process Hacker Execution
id: 07cbf7c3-3e11-46fb-828c-13116f21aab0
description: |
  Detects execution of Process Hacker (now rebranded System Informer) by binary metadata — Image name/path, OriginalFileName, Description, Product, or a known file hash. Process Hacker is a kernel-driver-backed process and service viewer that legitimate administrators and developers use, but is also routinely staged by operators to close handles held by security products, stop kernel-mode AV/EDR driver services, and impersonate the token of a SYSTEM-context process. Because the rule matches on tool identity rather than any specific argument, the investigation centers on whether this user, host, and parent chain are expected to run a low-level process-manipulation tool, what the tool did once running, and whether protection-tampering, persistence, or follow-on execution accompanied it.
type: detection
detection_id: 811e0002-b13b-4a15-9d00-a613fce66e42
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the alerting process match Process Hacker by name, metadata, or hash?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when the Image path, OriginalFileName, Description, Product, or file hash identifies the binary as Process Hacker (or a renamed copy of it). Review the event's Image, OriginalFileName, Description, Product, and Hashes against the rule criteria — a renamed copy still matches on metadata or hash even when the filename is changed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Description
      - Hashes
      - Product
- question: Is this user and host expected to run a low-level process and service manipulation tool?
  context: Legitimate administrative and development activity can trigger this detection — Process Hacker is a dual-use tool. Knowing whether the user role (IT support, developer, sysadmin) and host function are consistent with running a kernel-driver-backed process viewer is often the fastest path to distinguishing routine use from operator activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is Process Hacker on the organization's approved software list for this host?
  context: Organizations typically maintain a list of sanctioned administrative and diagnostic tools. Process Hacker is unsigned in its free distribution and is commonly shipped alongside attacker tooling rather than installed through normal channels, so its presence on a host where it is not approved may represent shadow IT or operator-staged tooling regardless of the tool's general reputation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: From where was Process Hacker run, and is the binary signed and located in an expected install path?
  context: The full execution context reveals how the tool was staged. Note the directory it ran from — a path under a user profile, Temp, or a download folder rather than a Program Files install location suggests it was dropped for a single operation. The free build is unsigned, so an unsigned binary alone is not conclusive, but combined with an unusual path and an unusual parent it points to operator staging rather than a managed install.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CurrentDirectory
      - Hashes
- question: What process spawned Process Hacker, and is that parent chain expected?
  context: The parent process reveals how the tool was invoked. Interactive administrative use typically has explorer.exe or a console shell in the chain. A parent such as a script interpreter, an Office application, a download cradle, or a service process spawning Process Hacker points to scripted or exploitation-driven launch rather than a human opening the tool.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did Process Hacker spawn afterward?
  context: Process Hacker's "Run as this user…" action lets an operator inherit another process's token — most notably a SYSTEM-context process — and spawn arbitrary executables with it. Children such as cmd.exe, powershell.exe, or other tooling launched from Process Hacker indicate it was used as a launch vehicle rather than just for viewing process state.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: Does this host normally run Process Hacker?
  context: A process that has never been seen on a host is more notable than one that runs regularly. Zero or very low historical counts over the past 90 days indicate first-time or rare execution, which raises the priority of the parent-chain and follow-on questions; a steady history suggests an installed administrative or development tool.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously matched this rule's pattern, what parents and users normally drove it, and does the current alert fit?
  context: The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how Process Hacker has historically run here, not generic binary usage. A new parent process, an unexpected user account, or a first-ever appearance is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|contains: \ProcessHacker_
      - Image|endswith: \ProcessHacker.exe
      - OriginalFileName:
        - ProcessHacker.exe
        - Process Hacker
      - Description: Process Hacker
      - Product: Process Hacker
      - Hashes|contains:
        - MD5=68F9B52895F4D34E74112F3129B3B00D
        - MD5=B365AF317AE730A67C936F21432B9C71
        - SHA1=A0BDFAC3CE1880B32FF9B696458327CE352E3B1D
        - SHA1=C5E2018BF7C0F314FED4FD7FE7E69FA2E648359E
        - SHA256=D4A0FE56316A2C45B9BA9AC1005363309A3EDC7ACF9E4DF64D326A0FF273E80F
        - SHA256=BD2C2CF0631D881ED382817AFCCE2B093F4E412FFB170A719E2762F250ABFEA4
        - IMPHASH=3695333C60DEDECDCAFF1590409AA462
        - IMPHASH=04DE0AD9C37EB7BD52043D2ECAC958DF
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|contains: \ProcessHacker_
      - Image|endswith: \ProcessHacker.exe
      - OriginalFileName:
        - ProcessHacker.exe
        - Process Hacker
      - Description: Process Hacker
      - Product: Process Hacker
      - Hashes|contains:
        - MD5=68F9B52895F4D34E74112F3129B3B00D
        - MD5=B365AF317AE730A67C936F21432B9C71
        - SHA1=A0BDFAC3CE1880B32FF9B696458327CE352E3B1D
        - SHA1=C5E2018BF7C0F314FED4FD7FE7E69FA2E648359E
        - SHA256=D4A0FE56316A2C45B9BA9AC1005363309A3EDC7ACF9E4DF64D326A0FF273E80F
        - SHA256=BD2C2CF0631D881ED382817AFCCE2B093F4E412FFB170A719E2762F250ABFEA4
        - IMPHASH=3695333C60DEDECDCAFF1590409AA462
        - IMPHASH=04DE0AD9C37EB7BD52043D2ECAC958DF
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|contains: \ProcessHacker_
      - Image|endswith: \ProcessHacker.exe
      - OriginalFileName:
        - ProcessHacker.exe
        - Process Hacker
      - Description: Process Hacker
      - Product: Process Hacker
      - Hashes|contains:
        - MD5=68F9B52895F4D34E74112F3129B3B00D
        - MD5=B365AF317AE730A67C936F21432B9C71
        - SHA1=A0BDFAC3CE1880B32FF9B696458327CE352E3B1D
        - SHA1=C5E2018BF7C0F314FED4FD7FE7E69FA2E648359E
        - SHA256=D4A0FE56316A2C45B9BA9AC1005363309A3EDC7ACF9E4DF64D326A0FF273E80F
        - SHA256=BD2C2CF0631D881ED382817AFCCE2B093F4E412FFB170A719E2762F250ABFEA4
        - IMPHASH=3695333C60DEDECDCAFF1590409AA462
        - IMPHASH=04DE0AD9C37EB7BD52043D2ECAC958DF
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user ran similar tooling on several hosts in this window, the scope of the activity may be larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|contains: \ProcessHacker_
      - Image|endswith: \ProcessHacker.exe
      - OriginalFileName:
        - ProcessHacker.exe
        - Process Hacker
      - Description: Process Hacker
      - Product: Process Hacker
      - Hashes|contains:
        - MD5=68F9B52895F4D34E74112F3129B3B00D
        - MD5=B365AF317AE730A67C936F21432B9C71
        - SHA1=A0BDFAC3CE1880B32FF9B696458327CE352E3B1D
        - SHA1=C5E2018BF7C0F314FED4FD7FE7E69FA2E648359E
        - SHA256=D4A0FE56316A2C45B9BA9AC1005363309A3EDC7ACF9E4DF64D326A0FF273E80F
        - SHA256=BD2C2CF0631D881ED382817AFCCE2B093F4E412FFB170A719E2762F250ABFEA4
        - IMPHASH=3695333C60DEDECDCAFF1590409AA462
        - IMPHASH=04DE0AD9C37EB7BD52043D2ECAC958DF
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Was a new or modified Windows service created on this host around the time of the alert?
  context: Process Hacker can create, edit, and stop services — including kernel driver services — directly from its UI, and installing its own driver service is how it gains kernel-level access. A service installation recorded in the security log near the alert time, especially one pointing at an unusual binary path or a driver, indicates the tool was used for service-backed persistence or driver loading rather than read-only inspection. If service install auditing is not collected in this environment, treat zero results as a visibility gap rather than evidence nothing happened.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4697
      condition: selection
    fields:
      - ServiceName
      - ServiceFileName
      - ServiceType
      - SubjectUserName
- question: Were autostart service or driver registry keys created or modified on this host around the alert?
  context: Process Hacker's kernel access depends on a driver service registered under the services hive (for example a KProcessHacker entry under HKLM\SYSTEM\CurrentControlSet\Services). Writes to service or autostart registry paths near the alert time can reveal the driver-service install or other persistence stacking that accompanies hands-on use of the tool. If registry change events are not collected in this environment, treat zero results as a visibility gap.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_paths:
        TargetObject|contains:
          - '\CurrentControlSet\Services\'
          - '\CurrentVersion\Run'
          - '\CurrentVersion\RunOnce'
      condition: selection and selection_paths
    fields:
      - TargetObject
      - Details
      - Image
- question: Have other hosts matched this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of where Process Hacker matched this pattern, not generic usage of the binary name. Many hosts matching points to scripted or vendor deployment of the tool; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|contains: \ProcessHacker_
      - Image|endswith: \ProcessHacker.exe
      - OriginalFileName:
        - ProcessHacker.exe
        - Process Hacker
      - Description: Process Hacker
      - Product: Process Hacker
      - Hashes|contains:
        - MD5=68F9B52895F4D34E74112F3129B3B00D
        - MD5=B365AF317AE730A67C936F21432B9C71
        - SHA1=A0BDFAC3CE1880B32FF9B696458327CE352E3B1D
        - SHA1=C5E2018BF7C0F314FED4FD7FE7E69FA2E648359E
        - SHA256=D4A0FE56316A2C45B9BA9AC1005363309A3EDC7ACF9E4DF64D326A0FF273E80F
        - SHA256=BD2C2CF0631D881ED382817AFCCE2B093F4E412FFB170A719E2762F250ABFEA4
        - IMPHASH=3695333C60DEDECDCAFF1590409AA462
        - IMPHASH=04DE0AD9C37EB7BD52043D2ECAC958DF
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the attack stages that preceded staging a process-manipulation tool and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
