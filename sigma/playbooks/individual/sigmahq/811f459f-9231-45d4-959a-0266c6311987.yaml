name: Suspicious Child Process Of BgInfo.EXE
id: 36bd6906-7400-4857-b8b9-ec351fac78fc
description: |
  Detects bginfo.exe or bginfo64.exe spawning a child process whose Image either ends in a known interpreter or GUI binary
  (calc.exe, cmd.exe, cscript.exe, mshta.exe, notepad.exe, powershell.exe, pwsh.exe, wscript.exe) or runs from a user-writable
  directory (AppData\Local, AppData\Roaming, Users\Public, Temp, Windows\Temp, PerfLogs). bginfo.exe is a Microsoft-signed
  SysInternals utility that can be abused to proxy execution of attacker-controlled VBScript embedded in a .bgi configuration
  file, allowing an application-allowlisting bypass under caller-level privileges; a child interpreter or a child launched
  from a writable path is a sign the binary was driven to run external script content rather than display desktop information.
  Investigation should confirm which branch fired, reconstruct what the bginfo invocation and its child actually executed,
  and determine whether the parent chain and the .bgi source are legitimate.
type: detection
detection_id: 811f459f-9231-45d4-959a-0266c6311987
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the alerting event show bginfo.exe or bginfo64.exe spawning a child that is a known interpreter or that runs from a user-writable directory?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires when the parent Image ends in bginfo.exe or
    bginfo64.exe AND the child either ends in one of the named binaries (calc.exe, cmd.exe, cscript.exe, mshta.exe, notepad.exe,
    powershell.exe, pwsh.exe, wscript.exe) or its Image path contains a user-writable directory (AppData\Local, AppData\Roaming,
    Users\Public, Temp, Windows\Temp, PerfLogs). Note which branch fired: a named-interpreter child points at script-host
    proxying, while a writable-path child points at a binary dropped and launched from an operator-controlled location.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
- question: Is this user and host expected to run bginfo.exe at all, and to have it spawn child processes?
  context: >-
    bginfo.exe has no default install path and is not present on stock Windows; it must be deployed deliberately, often as
    part of a desktop-information policy that runs at logon. Knowing whether this host is supposed to run bginfo at all, and
    whether its normal use ever spawns child processes, is often the fastest way to separate a sanctioned deployment from
    abuse of the binary to proxy script execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is bginfo.exe expected to spawn this child, and what started bginfo.exe itself?
  context: >-
    The parent-child relationship is the core signal here. Tracing bginfo's own origin (the grandparent) reveals whether the
    chain is a legitimate logon-time desktop policy run from a logon script or scheduled task, or whether bginfo was launched
    interactively or from an unexpected parent to drive a malicious .bgi. A bginfo instance started from a script host, a
    shell, or a writable path is far more concerning than one started by the logon/policy infrastructure.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did this same bginfo.exe instance spawn?
  context: >-
    If bginfo was driven to proxy execution, the embedded VBScript can launch additional processes beyond the one that fired
    the alert. Examining all children of the exact parent instance reveals the full scope of activity initiated through this
    bginfo run -- multiple interpreters or tools from the same bginfo parent strongly suggests the .bgi carried an active
    payload rather than benign display logic.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What did the bginfo.exe parent invocation reference, and was a .bgi configuration file involved?
  context: >-
    The bginfo command line shows whether it was pointed at a .bgi configuration file, and from where. A .bgi argument that
    resolves to a user-writable directory, a UNC path, or a WebDAV share is the classic abuse pattern, since bginfo evaluates
    VBScript embedded in that .bgi inline without spawning a separate script host. Reading the parent's own event shows what
    drove the detected child to run.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: What exactly did the child process do? Decode its full command line and working directory.
  context: >-
    The child's full command line reveals the action taken once bginfo proxied execution. Decode any flags, script paths,
    encoded content, URLs, or output files. For a named interpreter child this shows whether it ran a script, fetched a remote
    payload, or executed an in-memory loader; for a writable-path child it shows what the dropped binary was told to do.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: If the child is powershell.exe or pwsh.exe, was its command encoded or obfuscated, and what does it decode to?
  context: >-
    When the child is PowerShell, attackers frequently use the -EncodedCommand (-enc) parameter or string concatenation,
    backtick escaping, and variable substitution to hide intent. Base64-encoded commands are the most common form. Decoding
    reveals the actual payload -- download cradles, reverse shells, or in-memory execution of .NET assemblies handed off from
    the bginfo-proxied VBScript.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the VBScript or script content reached through bginfo show signs of obfuscation or encoding?
  context: >-
    bginfo evaluates VBScript embedded in the .bgi inline. High-entropy strings, Chr() concatenation chains, base64 blobs,
    or character-code reconstruction in the child command line or referenced script are signs the payload was obfuscated to
    evade casual inspection. Reconstruct any such chains to recover the real command the script forms before assessing intent.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: If the child is PowerShell, did script block logging capture the full deobfuscated script content?
  context: >-
    Script block logging records the deobfuscated script content PowerShell actually executes, even when the command line
    is encoded or obfuscated, providing ground truth about what ran. If PowerShell operational logs are not ingested in this
    environment, treat zero results as a visibility gap rather than evidence that nothing ran, and fall back to decoding the
    child command line directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell or endpoint security controls bypassed or weakened on this host before the bginfo activity?
  context: >-
    Abuse of a signed binary to proxy script execution is itself an allowlisting bypass; operators frequently pair it with
    disabling AMSI, flipping Defender preferences, or invoking an execution-policy bypass before running a payload. Finding
    these precursor events on the host strengthens the case that the bginfo child is malicious rather than a benign display run.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: Did bginfo or its child read or write a .bgi, .vbs, or other script file from a user-writable or network path around this time?
  context: >-
    The .bgi configuration that bginfo proxies, and any .vbs it references, are the artifacts that carry the payload. A .bgi
    or script file created or accessed in a writable directory, on a UNC share, or over WebDAV just before the alert points
    at attacker-staged content rather than a managed desktop policy. Correlating these file events with the process chain
    helps locate the actual payload source.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - '.bgi'
          - '.vbs'
          - '.vbe'
          - '.wsf'
          - '.bgi64'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: Did bginfo.exe or the child process make outbound network connections, especially to a UNC, WebDAV, or external host?
  context: >-
    The .bgi can be served from a remote WebDAV or UNC path, and the proxied script can itself fetch a follow-on payload or
    contact command-and-control. Outbound connections from bginfo.exe or its child -- particularly to an external address or
    a non-enterprise share -- indicate remote payload retrieval or callback rather than local desktop display.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - Initiated
- question: Does bginfo.exe normally spawn this child binary on this host?
  context: >-
    Some parent-child pairings are routine while others are inherently abnormal. A bginfo parent spawning an interpreter or
    a binary from a writable path has rarely or never been seen before is a strong novelty signal; a pairing that already
    accounts for many prior events on this host is more likely a quirk of a sanctioned deployment.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith:
        - \bginfo.exe
        - \bginfo64.exe
      selection_child:
      - Image|endswith:
        - \calc.exe
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \notepad.exe
        - \powershell.exe
        - \pwsh.exe
        - \wscript.exe
      - Image|contains:
        - \AppData\Local\
        - \AppData\Roaming\
        - :\Users\Public\
        - :\Temp\
        - :\Windows\Temp\
        - :\PerfLogs\
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith:
        - \bginfo.exe
        - \bginfo64.exe
      selection_child:
      - Image|endswith:
        - \calc.exe
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \notepad.exe
        - \powershell.exe
        - \pwsh.exe
        - \wscript.exe
      - Image|contains:
        - \AppData\Local\
        - \AppData\Roaming\
        - :\Users\Public\
        - :\Temp\
        - :\Windows\Temp\
        - :\PerfLogs\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the
    same user triggered similar bginfo-driven or interpreter activity on multiple hosts, the scope may extend beyond this
    single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith:
        - \bginfo.exe
        - \bginfo64.exe
      selection_child:
      - Image|endswith:
        - \calc.exe
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \notepad.exe
        - \powershell.exe
        - \pwsh.exe
        - \wscript.exe
      - Image|contains:
        - \AppData\Local\
        - \AppData\Roaming\
        - :\Users\Public\
        - :\Temp\
        - :\Windows\Temp\
        - :\PerfLogs\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host -- defense tampering, reconnaissance, or other
    proxy-execution activity -- may reveal the stages that preceded this event and help reconstruct the timeline of how the
    bginfo abuse came about.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
