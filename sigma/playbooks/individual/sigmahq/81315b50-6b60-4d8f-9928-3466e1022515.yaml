name: Desktop.INI Created by Uncommon Process
id: 0618e15b-2c42-4a9c-9e2b-2c456cfbfd96
description: |
  Detects creation of a desktop.ini file by a process outside the standard system, installer, upgrade, and known-application
  locations the rule excludes. desktop.ini controls how File Explorer displays a folder's contents, and an attacker can write
  one to remap the shown names of files or folders — making a disguised executable appear benign, or relabeling a folder —
  without renaming anything on disk, which leaves no rename events and makes the deception stealthy. Investigation should
  confirm the writing process and its lineage, read what the desktop.ini remaps, and determine whether a disguised file in
  that folder was subsequently executed.
type: detection
detection_id: 81315b50-6b60-4d8f-9928-3466e1022515
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Do the desktop.ini file path and the creating process match what this rule detects?
  context: Confirm the alert reflects the detection before investing time — a desktop.ini file was written by a process outside
    the standard system, installer, upgrade, and known-application locations the rule excludes. Review the full target path,
    the operation that occurred, and the responsible process against the rule's criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to write desktop.ini files from this process?
  context: Applications and installers write desktop.ini routinely, which is why the rule excludes those locations; what remains
    is a write from an unexpected process, path, or account. Whether this user role and host function normally produce such
    writes is often the fastest way to separate a routine operation from a finding. When the account is a machine or service
    principal, judge by the writing process and the host's role.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the process that wrote desktop.ini expected to run under this parent, and what started the parent?
  context: The parent-child lineage is the core signal — a desktop.ini write from a script host, an Office application, or a
    freshly spawned shell is very different from one by a resident application. Tracing the parent's own origin shows whether
    the chain is user-driven or the result of an exploitation or delivery step.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because this event type does not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is the desktop.ini still on disk, or was it deleted or renamed after the alert?
  context: The file's post-alert lifecycle drives next steps. A desktop.ini still present can be retrieved and read to see exactly
    what it remaps; one deleted shortly after creation points to cleanup of the deception. Because this technique changes only
    how File Explorer displays names, the underlying files are never renamed, so watch the desktop.ini itself rather than expecting
    rename events on other files.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What does this desktop.ini configure, and which display names or icons does it remap?
  context: desktop.ini controls how File Explorer renders a folder. The [LocalizedFileNames] section can remap a file's displayed
    name so a disguised executable appears as a harmless document, and [.ShellClassInfo] LocalizedResourceName or IconResource
    can relabel or re-icon the folder itself. Read the file's contents and record every remapped name, custom icon, and resource
    pointer, since that is what the write was meant to disguise. File contents are not in the event stream and must be retrieved
    from the host or an endpoint console.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What was the full command line of the process that created desktop.ini?
  context: The file event names the responsible process but carries none of its arguments. Pivoting to that process's execution
    recovers the full command line and working directory, showing whether the write was a deliberate action, a scripted step,
    or a side effect of a broader operation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: After the desktop.ini was written, what did the user launch from File Explorer on this host, and do those binaries
    have known detections?
  context: The remap only pays off when a user double-clicks a disguised file in Explorer, so the follow-on evidence is an execution
    parented by explorer.exe. A binary's hash is recorded when it runs, not when the desktop.ini is written, so read the hash
    of any such execution and check it against reputation sources, focusing on binaries started from the folder named in the
    alert path. Mark-of-the-web data that would show an internet origin lives in an alternate data stream not captured here,
    so treat that as a manual or endpoint-console check.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\explorer.exe'
      condition: selection
    fields:
      - Image
      - Hashes
      - CommandLine
- question: What other files did the process that wrote desktop.ini create or delete around the alert?
  context: A process staging a deception often touches more than one path — dropping the disguised executable, its desktop.ini,
    and supporting files together. The breadth, locations, and types of the process's other file activity separate a single
    folder tweak from a staging operation and enumerate what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Does the user or administrator recall creating or customizing this folder's configuration?
  context: Direct confirmation from the person behind the account is often the fastest way to establish legitimacy. Custom folder
    icons and display names are a normal, if uncommon, user action; if no one recalls setting one here, the write is more likely
    automated or attacker-driven. If they do recall it, capture why and what tool they used.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: How often has a desktop.ini been created on this host, and by which processes?
  context: desktop.ini creation by system and installer processes is routine, but the rule already excludes those; a low historical
    count of desktop.ini writes by non-excluded processes marks this as unusual for the host. A first-time or rare writer is
    more suspicious than one that appears regularly.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has this user produced this desktop.ini write pattern before, and does that history fit their role?
  context: This scopes the rule's exact firing pattern — a desktop.ini write by a non-excluded process — to the alerting user
    over 90 days, aggregated by host. A user who has never produced this pattern is more notable than one who does so routinely;
    weigh the count against their role and normal toolset.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith: \desktop.ini
      filter_main_generic:
        Image|startswith:
        - C:\Windows\
        - C:\Program Files\
        - C:\Program Files (x86)\
      filter_main_upgrade:
        TargetFilename|startswith: C:\$WINDOWS.~BT\NewOS\
      filter_optional_jetbrains:
        Image|startswith: C:\Users\
        Image|endswith: \AppData\Local\JetBrains\Toolbox\bin\7z.exe
        TargetFilename|contains: \JetBrains\apps\
      filter_optional_onedrive:
        Image|startswith: C:\Users\
        Image|contains: \AppData\Local\Microsoft\OneDrive\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: Has this program historically driven this desktop.ini write pattern, or is the program new for this activity?
  context: When the alert fires under a service or machine account, user identity does not attribute the behavior; the launch
    mechanism does. This scopes the rule's exact pattern to the alerting program over 90 days — a program that already
    accounts for many prior writes is application or platform automation, while a new or rare program for this pattern is the
    deviation worth chasing.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith: \desktop.ini
      filter_main_generic:
        Image|startswith:
        - C:\Windows\
        - C:\Program Files\
        - C:\Program Files (x86)\
      filter_main_upgrade:
        TargetFilename|startswith: C:\$WINDOWS.~BT\NewOS\
      filter_optional_jetbrains:
        Image|startswith: C:\Users\
        Image|endswith: \AppData\Local\JetBrains\Toolbox\bin\7z.exe
        TargetFilename|contains: \JetBrains\apps\
      filter_optional_onedrive:
        Image|startswith: C:\Users\
        Image|contains: \AppData\Local\Microsoft\OneDrive\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around the time of the alert?
  context: Tracking the user's activity on other hosts in the same window reveals whether this desktop.ini write is isolated
    or part of activity spanning multiple endpoints. Concurrent action elsewhere by the same account widens the likely scope.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same program-driven desktop.ini pattern fire on other hosts in the same window, or is it isolated to this
    host?
  context: Under a service or machine account, asking what else the user did returns constant agent telemetry rather than the
    actor's actions. The meaningful question is whether the same launch mechanism produced this pattern elsewhere in the alert
    window — multiple hosts point to scheduled or pushed automation, while a single host points to a local trigger.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith: \desktop.ini
      filter_main_generic:
        Image|startswith:
        - C:\Windows\
        - C:\Program Files\
        - C:\Program Files (x86)\
      filter_main_upgrade:
        TargetFilename|startswith: C:\$WINDOWS.~BT\NewOS\
      filter_optional_jetbrains:
        Image|startswith: C:\Users\
        Image|endswith: \AppData\Local\JetBrains\Toolbox\bin\7z.exe
        TargetFilename|contains: \JetBrains\apps\
      filter_optional_onedrive:
        Image|startswith: C:\Users\
        Image|contains: \AppData\Local\Microsoft\OneDrive\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely occur in isolation. Earlier detections on the same host — reconnaissance, credential access, defense
    tampering — can reveal the stages that preceded this write and help place the desktop.ini creation in a timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
