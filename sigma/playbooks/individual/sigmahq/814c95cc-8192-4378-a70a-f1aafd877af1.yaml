name: Use of OpenConsole
id: 40f4d69f-511a-4f48-80a7-62cdef308b4f
description: |
  Detects execution of the signed OpenConsole.exe binary from outside the WindowsTerminal package directory.
  OpenConsole is shipped with Windows Terminal and some developer toolchains and can be abused as a signed
  proxy to launch arbitrary payloads, bypassing application-control policies. The rule fires when a process
  has OriginalFileName OpenConsole.exe or an Image ending in OpenConsole.exe AND is NOT running from the
  legitimate Microsoft.WindowsTerminal package path. Investigation should establish what OpenConsole launched,
  how the binary arrived, whether its location and parent chain are consistent with a legitimate install, and
  whether the same pattern appears elsewhere in the environment.
type: detection
detection_id: 814c95cc-8192-4378-a70a-f1aafd877af1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Is this OpenConsole.exe running from outside the Windows Terminal package directory?
  context: Confirm the alert is a true positive by reviewing the triggering event. The rule fires when a process
    reports OriginalFileName OpenConsole.exe or an Image path ending in OpenConsole.exe and that path does not
    begin with the Microsoft.WindowsTerminal package directory. Verify the Image path and OriginalFileName so a
    relocated or renamed copy is distinguished from the in-package binary that is filtered out.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Is this user and host expected to run OpenConsole.exe from this location?
  context: Legitimate use is typically by a developer running a Visual Studio or Windows Terminal toolchain, or by
    an administrator. Knowing whether the user role and host function are consistent with developer or terminal
    tooling is often the fastest way to separate a benign install from a binary that was placed to proxy execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the actual identity of this binary based on its metadata and hash?
  context: The PE metadata reports OriginalFileName OpenConsole.exe even when the file on disk has been renamed,
    so comparing the Image path against OriginalFileName reveals whether the name on disk matches the embedded
    identity. The signing party and signature status indicate whether this is the Microsoft-signed terminal helper
    relocated outside its package, a third-party signed copy, or an unsigned or tampered file. The hash enables a
    reputation lookup to determine whether this is a known-good copy or a novel binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: What did OpenConsole.exe actually launch? Decode its full command line.
  context: OpenConsole is abused as a proxy launcher, so the operationally meaningful part is the payload it was
    asked to start. Decode the full command line for the child binary, its path, and any flags or encoded content.
    The query returns every OpenConsole.exe execution on this host within the window so sequential invocations that
    together form one operation are visible.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this OpenConsole.exe and is that parent chain expected?
  context: The parent process reveals how OpenConsole was invoked. Legitimate launches come from explorer.exe, a
    developer IDE, or the Windows Terminal host. Unusual parents such as office applications, mshta.exe, wscript.exe,
    or a script interpreter suggest the binary is being used to proxy execution rather than as a terminal helper.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: How did this OpenConsole.exe binary arrive at its current location?
  context: A copy of OpenConsole running outside the Windows Terminal package was either installed by a toolchain,
    copied, downloaded, or dropped by another process. Tracing the file creation event for the binary by basename
    over a long window reveals the delivery mechanism and the process that wrote it. A user-writable location such
    as Downloads, Temp, or AppData points to download or extraction; a developer toolchain path points to a routine
    install.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What child processes did OpenConsole.exe spawn, and is the same binary present on other hosts?
  context: The purpose of proxying execution through a signed binary is to run a payload while evading controls, so
    the child processes are the actual objective. Examining what OpenConsole spawned reveals whether it launched a
    command interpreter, a download tool, or post-exploitation activity. The same out-of-package copy appearing on
    multiple hosts suggests deliberate distribution rather than an isolated developer machine.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run OpenConsole.exe?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. Zero or very
    low historical counts indicate first-time or rare execution, which on a host without a terminal or developer
    toolchain install is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and
    does the current alert fit?
  context: Even a signed helper can be abused. The query mirrors the rule's selection structure scoped to this host,
    so the resulting parent and user distribution reflects how this specific out-of-package OpenConsole pattern has
    historically run here. A new parent process, an unexpected user account, or an unusual launch pattern is the
    anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - OriginalFileName: OpenConsole.exe
      - Image|endswith: \OpenConsole.exe
      filter:
        Image|startswith: C:\Program Files\WindowsApps\Microsoft.WindowsTerminal
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - OriginalFileName: OpenConsole.exe
      - Image|endswith: \OpenConsole.exe
      filter:
        Image|startswith: C:\Program Files\WindowsApps\Microsoft.WindowsTerminal
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - OriginalFileName: OpenConsole.exe
      - Image|endswith: \OpenConsole.exe
      filter:
        Image|startswith: C:\Program Files\WindowsApps\Microsoft.WindowsTerminal
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated activity on multiple
    endpoints around the alert. If the same user triggered similar activity elsewhere, the scope of the operation may
    be larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - OriginalFileName: OpenConsole.exe
      - Image|endswith: \OpenConsole.exe
      filter:
        Image|startswith: C:\Program Files\WindowsApps\Microsoft.WindowsTerminal
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what
    led to this execution, what happened after, and whether it is part of a larger sequence. Look for reconnaissance,
    privilege escalation, persistence installation, or data staging surrounding the OpenConsole launch.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host such as defense tampering, reconnaissance, or credential access may
    reveal the attack stages that preceded the OpenConsole execution and help reconstruct the full timeline. The
    sequence of alerts on a host often tells the broader story.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired this rule's pattern in the past week, and does the distribution look like automation
    or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of
    the out-of-package OpenConsole pattern rather than generic usage of the binary. Many hosts firing the same pattern
    points to a scripted deployment or toolchain rollout; one host or a small unrelated set points to manual operator
    activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - OriginalFileName: OpenConsole.exe
      - Image|endswith: \OpenConsole.exe
      filter:
        Image|startswith: C:\Program Files\WindowsApps\Microsoft.WindowsTerminal
      condition: selection and not filter
    fields:
    - host.name
