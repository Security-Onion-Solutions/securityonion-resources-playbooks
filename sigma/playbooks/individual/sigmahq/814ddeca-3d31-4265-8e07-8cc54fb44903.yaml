name: LiveKD Kernel Memory Dump File Created
id: 1fb81314-557c-49c0-a2fd-8f495e2d03f1
description: |
  Detects the creation of a file at C:\Windows\livekd.dmp, the default output path of LiveKD — a Microsoft-signed Sysinternals
  tool that captures kernel memory from a running system without a reboot. The resulting dump contains essentially everything
  resident in memory at capture time, including credential material, keys, and process memory, which makes it a credential-access
  and collection route that never touches lsass.exe and therefore sidesteps controls built around lsass handle access. LiveKD
  requires local administrator rights and the Debugging Tools for Windows, so the capture is deliberate; legitimate cases exist
  (driver development, a vendor support engagement) and are answerable by asking who ran it and on what kind of host. Because
  the rule keys on a filename convention, the investigation is which process actually wrote the file, whether it was really
  LiveKD, and — the impact question — what happened to the dump afterward.
type: detection
detection_id: 814ddeca-3d31-4265-8e07-8cc54fb44903
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Was the LiveKD dump file written to its default path on this host, and which process wrote it?
  context: >-
    The rule fires on one condition — a file created at the exact path C:\Windows\livekd.dmp. Confirm the path and the
    operation, then read the responsible process. Because the path is a naming convention rather than a behavior, anything
    writing to it fires the rule whether or not LiveKD was involved; the signer columns are context for judging whether the
    writer is coherent with a kernel dump, not a verdict.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - file_event
- question: Is this user and host expected to be performing live kernel debugging?
  context: >-
    LiveKD needs local administrator rights and an installed copy of the Debugging Tools for Windows (kd.exe / dbgeng.dll),
    so a dump at this path is a deliberate act rather than an incidental one. A driver developer's workstation or a host under
    an active vendor support engagement is a specific benign case; a general-purpose server or a standard user endpoint is
    not, and the user's role is the fastest way to tell them apart. When the user is a machine or service account, judge by
    the writing process and the host's function instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is the dump still on disk, or was it deleted or renamed after the alert?
  context: >-
    A kernel memory dump holds whatever was resident at capture time, so the file's fate drives both urgency and next steps.
    A dump still on disk can be sized, hashed, and preserved. A dump deleted or renamed within minutes of creation points to
    a capture-then-clean sequence and moves the question to what read or copied it in between; a dump left sitting on a shared
    or removable path is a standing exposure of everything that was in memory.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Which process wrote the dump, and what launched it?
  context: >-
    The file event names the writing process but not its origin. Retrieving that process's own start event gives its full
    command line and its parent. LiveKD started from an administrator's interactive console reads differently from the same
    binary started by a service, a scripting host, or a remote-execution parent — and a writer that is not livekd.exe at all
    means a renamed copy or an unrelated program is producing a file at this path.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What were the full command lines of the program that wrote the dump?
  context: >-
    The arguments determine what was captured and where it went — the output path, whether a full physical memory image or a
    smaller kernel-only dump was requested, and whether the tool was pointed at a hypervisor or a remote target. LiveKD is
    genuinely signed by Microsoft, so the signature says nothing about intent; the arguments do. If the writing program is not
    LiveKD, its arguments identify what it actually is.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: Is the file on disk a real kernel memory dump, and how much memory does it contain?
  context: >-
    Size is the fastest discriminator. A full capture approaches the size of physical memory; a small or truncated file points
    to an aborted capture or to an unrelated program reusing the name. If the file is a genuine dump, treat everything that was
    resident on the host at that moment — credential material, keys, process memory — as exposed, and scope the response to
    the accounts and secrets that were in use rather than to the dump alone.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A kernel dump is rarely the only output of the operation that produced it. The writing process and its direct children may
    also leave debugger logs, a second dump, or an archive of the first, and the paths those land in show whether the output
    stayed on local disk or was written somewhere reachable from elsewhere. Breadth is not the signal here — location is.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: Did any process reference the dump file on its command line after it was written?
  context: >-
    A memory dump is data, not code — it never executes, so its handling rather than its execution is the investigation. A
    process naming the dump on its command line is the archiver, copier, or uploader that acted on it, and its arguments show
    the destination: a local working directory, a UNC path, removable media, or an external service. This is where the capture
    turns into exfiltration, or is shown not to have.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reference:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and selection_reference
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What other dump or archive files were written on this host around the alert?
  context: >-
    Moving a kernel dump usually starts with staging — a copy under a different name, or the dump compressed into an archive
    small enough to transfer. Other .dmp or archive files appearing on the host in the same window, and the processes that wrote
    them, show whether the capture stopped at disk. An archive whose size roughly tracks the dump's, written by a compression
    utility shortly after the capture, is the packaging step.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith:
          - '.dmp'
          - '.zip'
          - '.7z'
          - '.rar'
          - '.cab'
          - '.gz'
          - '.tar'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Has this dump file been written on this host before?
  context: >-
    A first-ever appearance of this path on the host means the capture was a one-off and should reconcile to a specific reason.
    Repeated writes across the 90-day window point to recurring debugging work — which still needs a change record behind it,
    since every capture requires administrator rights and exposes the same material again.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Has the same dump file appeared on other hosts in the environment?
  context: >-
    The same default path appearing across several hosts in a day points to someone working through a set of machines rather
    than debugging one problem, and each additional host adds another memory image worth of exposed credentials. A single host
    narrows the question to why that host was chosen.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Does this host normally run the program that wrote the dump?
  context: >-
    Historical execution frequency of the writing binary on this host separates an established debugging workflow from a first
    run. Zero or very low counts over 90 days mean the tool arrived for this occasion. The accounts in the results also show
    whether this is one person's routine or something several accounts have done.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- always_include: true
  question: Has this user produced this dump file before, and does that history fit their role?
  context: >-
    The query mirrors the rule's condition scoped to this user, so the result is their 90-day history of writing this specific
    path, aggregated by host. A user who has never done this before, on a host that is not a debugging target, is the deviation
    worth chasing. Weigh any count against whether the account belongs to someone who develops or debugs kernel-mode code.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename: C:\Windows\livekd.dmp
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this program written this dump file before, on this host or elsewhere, or is this new for it?
  context: >-
    When the alert fires under a machine or service account, user identity does not attribute the behavior, and a file event
    carries no parent to pivot on. The acting program is the meaningful pivot: the query mirrors the rule's condition scoped
    to the alerting binary, giving its 90-day history of producing this exact path. A program that is new to this activity is
    the deviation; one already responsible for many prior events is an established process worth identifying by name.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename: C:\Windows\livekd.dmp
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user do across the environment around this time?
  context: >-
    Tracking the account's activity across all hosts in the alert window shows whether the capture was an isolated action or
    one step in a session that spans endpoints. The same account taking administrative actions on several hosts around the same
    time widens the scope beyond this dump. When the alert fires under a service principal, expect this view to fill with routine
    agent telemetry and read the acting-program view instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same program write this dump file on other hosts in the same window?
  context: >-
    Where user identity is uninformative, the question becomes whether the same program produced the same path elsewhere at the
    same time. The query mirrors the rule's condition scoped to the alerting binary, fleet-wide, across the alert window. Several
    hosts in one window points to scheduled or pushed automation; a single host points to a host-local trigger and to whoever
    was at the console.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename: C:\Windows\livekd.dmp
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Capturing kernel memory requires administrator rights and the debugging toolchain, so the surrounding process activity
    usually shows how both were obtained — an installer for the Debugging Tools, an elevation, a remote-management parent, or
    a session that started shortly before. The aggregation collapses repetitive agent telemetry into high-count rows; novel
    parent-child pairs appear at low counts and are what to read.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host help place this capture in a sequence. Because a kernel dump is a credential-access
    route that never opens a handle to lsass, the preceding stages to look for are the ones that make it possible — privilege
    escalation, remote administrative access, or tooling being staged — rather than lsass-focused alerts, which this technique
    does not generate.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
