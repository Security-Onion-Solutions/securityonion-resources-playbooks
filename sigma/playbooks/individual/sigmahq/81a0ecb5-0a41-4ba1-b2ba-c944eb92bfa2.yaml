name: Add Insecure Download Source To Winget
id: 7bcf24e0-6976-4820-abfa-9174b438cb73
description: |
  Detects winget being used to add a new package source whose URL is an insecure
  http:// endpoint. The rule fires when a process whose Image ends in winget.exe (or
  whose OriginalFileName is winget.exe) runs a command line that contains all of
  "source ", "add ", and "http://". winget normally refuses insecure sources, so this
  pattern indicates either a typo or a deliberate attempt to register an
  attacker-controlled repository; once a custom source is trusted on the host, an
  operator can deliver arbitrary signed packages through that channel via
  winget install -s <source>. The investigation should decode the exact source name
  and URL, determine who and what launched winget, and check whether any package was
  subsequently installed from the new source.
type: detection
detection_id: 81a0ecb5-0a41-4ba1-b2ba-c944eb92bfa2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line show winget adding a package source over an insecure http:// URL?
  context: Before investing investigation time, confirm the alert is a true positive. The
    rule fires only when the process is winget (Image ends in winget.exe or OriginalFileName
    is winget.exe) and the command line contains all of "source ", "add ", and an http://
    URL. Read the full command line to confirm all three elements are present and that the
    URL is genuinely insecure rather than an https endpoint that incidentally embeds the
    substring.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to register new winget package sources?
  context: Adding a winget source is an administrative configuration action that changes the
    trust state of the box, and it requires administrator privileges. A developer or IT
    administrator who manages internal package repositories may do this routinely; a standard
    user account or a host with no package-management role doing so is harder to explain and
    raises the priority of the alert.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What source name and URL were added, and were any trust-suppressing flags used?
  context: Decode the full winget command line to extract the source name (-n/--name) and the
    URL or UNC path (-a/--arg). Note any flags that weaken trust controls — --trust-level
    trusted, --type Microsoft.Rest, --header, or --accept-source-agreements — because they
    suppress prompts and pre-trust the new repository. The source name and URL are the core
    indicators to pivot on; a URL that is not the official Microsoft winget repository is the
    finding.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What does threat intel, DNS, and WHOIS reveal about the http source URL being registered?
  context: The URL passed to winget source add becomes a trusted package-delivery channel on
    the host. Investigate the host and domain in that URL — DNS resolution history,
    registration age, hosting, and known threat-intel hits. A recently registered domain, a
    raw IP, or infrastructure with no business relationship points to an attacker-controlled
    repository staged for package delivery; a known internal mirror points to a configuration
    or typo issue.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: 'http://'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned winget and is that parent chain expected?
  context: The parent process reveals how winget was invoked. An interactive elevated shell
    (explorer.exe to cmd.exe or powershell.exe) launched by an administrator is consistent
    with manual repository management. A scripted parent, a remote-execution service, an
    Office application, or a script host (wscript.exe, mshta.exe) launching winget points to
    automated or unattended registration of the source.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Was any package installed from the new source, or were other winget commands run after it?
  context: Adding the source is the setup step; the payoff is winget install --id <pkg> -s
    <source>, which delivers a package through the newly trusted channel. Review what winget
    did next on this host. A source add immediately followed by an install from that same
    source is the full delivery chain; a source add with no follow-on install may be staging
    or an abandoned typo.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run winget?
  context: A binary that has never executed on a host is more suspicious than one that runs
    regularly. winget is common on developer and IT-managed workstations but rare on servers
    and locked-down endpoints. Zero or very low historical counts indicate first-time or rare
    execution and raise the priority of an insecure-source registration.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously run winget source add over http, what parents and users drove it, and does the current alert fit?
  context: Even common tools can be abused. This mirrors the rule's exact firing pattern
    (winget plus the source / add / http:// command line) scoped to this host, so the
    resulting parent and user distribution reflects how this specific pattern — not generic
    winget usage — has historically run here. A new parent process, an unexpected user
    account, or a first-ever appearance of this pattern is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \winget.exe
      - OriginalFileName: winget.exe
      selection_cli:
        CommandLine|contains|all:
        - 'source '
        - 'add '
        - http://
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What other tools ran on this host around the same time?
  context: Configuration of a delivery channel typically sits inside a broader sequence.
    Activity surrounding the winget source add — reconnaissance, privilege escalation,
    persistence installation, or staging — provides context for whether this is an isolated
    administrative action or one step in a multi-stage operation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Have other hosts run winget source add over http in the past week, and does the distribution look like automation or one-off activity?
  context: This mirrors the rule's exact firing pattern with no host scope, giving a
    fleet-wide count of the insecure-source registration rather than generic winget usage.
    Many hosts registering the same source points to scripted deployment or a misconfigured
    automation push; one host or a small unrelated set points to manual operator activity.
    Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \winget.exe
      - OriginalFileName: winget.exe
      selection_cli:
        CommandLine|contains|all:
        - 'source '
        - 'add '
        - http://
      condition: all of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \winget.exe
      - OriginalFileName: winget.exe
      selection_cli:
        CommandLine|contains|all:
        - 'source '
        - 'add '
        - http://
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \winget.exe
      - OriginalFileName: winget.exe
      selection_cli:
        CommandLine|contains|all:
        - 'source '
        - 'add '
        - http://
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around this time?
  context: Tracking the account's activity across all hosts in the surrounding window reveals
    lateral movement or coordinated activity on multiple endpoints. If the same user
    registered sources or ran related tooling elsewhere, the scope of the activity is larger
    than this one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \winget.exe
      - OriginalFileName: winget.exe
      selection_cli:
        CommandLine|contains|all:
        - 'source '
        - 'add '
        - http://
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Surveying activity around the alert reveals what
    led to the source registration and what followed — reconnaissance, persistence, or further
    package delivery. Aggregating by process and parent collapses repetitive agent telemetry
    into high-count rows while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense
    tampering, reconnaissance, or credential access — may reveal the attack stages that
    preceded the source registration and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
