name: Potential Application Whitelisting Bypass via Dnx.EXE
id: b43d0b5f-17fb-4613-ad4d-29d1bf169fce
description: |
  Detects execution of dnx.exe, the Microsoft-signed .NET Execution Environment shipped with Visual Studio.
  Because dnx.exe is signed and trusted, it can JIT-compile and run unsigned C# placed in a Project.json + Program.cs
  layout in its working directory, executing arbitrary code under a trusted-binary context and bypassing application
  whitelisting / code-integrity restrictions. The rule fires whenever a process whose Image ends in \dnx.exe runs;
  investigation should establish whether this is developer tooling on a workstation that legitimately has Visual
  Studio, or dnx.exe relocated outside install paths and pointed at attacker-supplied source code.
type: detection
detection_id: 81ebd28b-9607-4478-bf06-974ed9d53ed7
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Is the process that fired this alert actually dnx.exe, and where on disk does it live?
  context: Confirm the alert is a true positive by reviewing the triggering event. The rule fires on any process whose
    Image ends in \dnx.exe. dnx.exe running from a Visual Studio install path on a developer's machine is routine;
    dnx.exe staged in a user profile, temp, or other non-install directory is the relocated-trusted-binary pattern
    this rule is meant to catch.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is this user and host expected to run a .NET execution host like dnx.exe?
  context: Legitimate dnx.exe use is almost entirely confined to developer workstations with Visual Studio installed.
    A developer building or running a C# project is routine; the same binary on a server, a non-developer's endpoint,
    or an account with no development role is the deviation worth chasing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Are the Project.json and Program.cs source files dnx.exe executed still present on disk?
  context: dnx.exe compiles and runs the C# project found in its working directory — typically a Program.cs source file
    paired with a Project.json manifest. If those files are still on disk, they can be retrieved for hash lookup,
    content review, or sandbox submission to determine exactly what code ran. Their location matters too — source files
    in a non-developer profile directory point away from legitimate development.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: From which working directory did dnx.exe run, and what source project did it pick up there?
  context: dnx.exe takes no arguments in the bypass pattern — it loads Project.json and Program.cs from its current
    working directory and JIT-compiles them. The working directory is therefore the key indicator of intent. A path
    under a Visual Studio solution folder is routine; a path under a user profile, temp, public, or download directory
    indicates source code staged for execution under trusted-binary integrity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is the C# source dnx.exe compiled encoded or obfuscated, and what does the decoded content do?
  context: 'Source code staged for JIT compilation often hides its payload from casual inspection. Common encodings:
    base64 or hex blobs decoded at runtime, character concatenation (string-builder or Convert.FromBase64String chains),
    and environment-variable substitution. Decoding the staged Program.cs reveals the actual intent — download cradles,
    reverse shells, credential theft, or in-memory loaders. Review the source file content captured around the alert
    and reconstruct any encoded strings it builds at runtime.'
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned dnx.exe, and is that parent chain consistent with a development workflow?
  context: The parent process reveals how dnx.exe was invoked. Visual Studio components (devenv.exe), a developer's
    interactive shell, or a build tool are expected parents. Unusual parents such as office applications, wscript.exe,
    mshta.exe, or a script interpreter point to dnx.exe being driven as a proxy-execution primitive rather than for
    development.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did dnx.exe spawn after it ran?
  context: The code dnx.exe JIT-compiles can launch further processes, and those children reveal its actual impact.
    Legitimate development produces predictable children (the compiled application, build helpers). Unexpected children
    such as cmd.exe, powershell.exe, certutil.exe, or network utilities indicate the compiled payload is performing
    post-exploitation rather than running an application.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What .NET assemblies and DLLs did dnx.exe load, and were any of them written from a non-install directory?
  context: dnx.exe hosts the .NET runtime and loads managed assemblies to execute the compiled project. The set of
    modules it maps distinguishes a normal runtime startup (framework assemblies from install paths) from a payload
    that loads attacker-supplied or relocated DLLs. Modules loaded from a user profile, temp, or public directory are
    the signal that unsigned code is being hosted under the trusted process. If image-load telemetry is not collected
    in this environment, treat zero results as a visibility gap rather than evidence nothing loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - CommandLine
- question: Did dnx.exe or the code it ran open any outbound network connections?
  context: Trusted-binary proxy execution and compile-after-delivery are frequently followed by network activity — the
    JIT-compiled code pulls a second-stage payload or beacons to a controller. dnx.exe itself rarely needs outbound
    connectivity outside package restore, so connections to external addresses, especially shortly after compilation,
    are worth tracing to a destination. Correlate the destination against the source code recovered from disk to
    confirm whether the connection is a download cradle or command-and-control.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Does this host normally run dnx.exe?
  context: A process never before seen on a host is more suspicious than one that runs regularly. On a host without
    Visual Studio or a development role, any dnx.exe execution is anomalous. Zero or very low historical counts indicate
    first-time or rare execution and raise the priority of the on-disk source-code review.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously run dnx.exe, what parents and users normally drive that activity, and does the
    current alert fit that pattern?
  context: Even a binary that exists on a developer machine can be abused. The query mirrors the rule's selection scoped
    to this host, so the resulting parent/user distribution reflects how dnx.exe has historically run here. A new parent
    process, an unexpected user account, or an unusual working-directory pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \dnx.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What other tools ran on this host in the minutes around the dnx.exe execution?
  context: Trusted-binary abuse rarely stands alone. Activity surrounding the dnx.exe execution may reveal the staging
    of source files, reconnaissance, privilege escalation, or persistence installation that provides broader context.
    Correlating what ran immediately before and after places the compilation event in its operational timeline.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \dnx.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \dnx.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints.
    If the same user staged and compiled C# on more than one host, the scope of the activity is larger than a single
    alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \dnx.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance,
    or credential access — may reveal the attack stages that preceded the trusted-binary execution and help reconstruct
    the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
