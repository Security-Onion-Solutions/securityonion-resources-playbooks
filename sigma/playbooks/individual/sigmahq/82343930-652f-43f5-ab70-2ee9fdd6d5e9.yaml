name: Potential ShellDispatch.DLL Functionality Abuse
id: f245a072-ef99-4f5c-9944-d115487ab856
description: |
  Detects rundll32.exe invoking the RunDll_ShellExecuteW export, a callback exposed by the Nullsoft ShellDispatch.dll plug-in that wraps the ShellExecute API and can launch an arbitrary program of the operator's choosing. The rule fires when the process is rundll32.exe (by Image path or OriginalFileName) AND the command line contains RunDll_ShellExecuteW. Legitimate sightings are rare because ShellDispatch.dll is normally used only transiently by certain installers and deleted afterward; an analyst should determine what binary was launched through the wrapper, where the DLL came from, and whether the activity fits a known install workflow or operator-driven proxy execution.
type: detection
detection_id: 82343930-652f-43f5-ab70-2ee9fdd6d5e9
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Is this rundll32.exe execution invoking the RunDll_ShellExecuteW export on the command line?
  context: Confirm the alert is a true positive by reviewing the full command line and process identity. The rule fires when the process resolves to rundll32.exe (by Image path or OriginalFileName) and the command line contains RunDll_ShellExecuteW. Note the DLL referenced and the argument that follows the export name — that argument is the program the wrapper was told to launch.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run rundll32.exe against the ShellDispatch wrapper?
  context: Legitimate use of RunDll_ShellExecuteW is rare and typically tied to a transient installer workflow. Knowing whether the user role and host function involve software packaging or installer activity is often the fastest way to separate a benign install from operator-driven proxy execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What program did the RunDll_ShellExecuteW wrapper launch, and from where?
  context: The argument following RunDll_ShellExecuteW is the program ShellExecute was asked to run, along with any verb (open, runas) and parameters. Decode the full command line to identify the launched binary, its path, and any arguments. The query is scoped to rundll32.exe executions carrying this export on the host so the full sequence around the alert is visible.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: RunDll_ShellExecuteW
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this rundll32.exe, and is that parent chain expected?
  context: The parent process reveals how the wrapper was invoked. An installer or setup executable is a more benign parent than a script host (wscript.exe, mshta.exe), an Office application, or a shell launched from an unexpected location. Walk up to the parent's own parent if the immediate parent is itself a generic host process.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did this rundll32.exe spawn afterward?
  context: The wrapper exists to launch another program, so the processes spawned by this rundll32.exe reveal its actual effect. A launched cmd.exe, powershell.exe, or a binary from a user-writable directory points to proxy execution of attacker-chosen code rather than an installer routine.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Was rundll32.exe executed from its expected System32 or SysWOW64 path?
  context: rundll32.exe run from outside System32 or SysWOW64 may be a copied or renamed binary used to evade path-based allowlists. A rundll32.exe in a user temp or AppData directory is more suspicious than one in the standard system path. The rule also matches on OriginalFileName, so a renamed copy still fires — confirm the on-disk path.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Does this host normally run rundll32.exe?
  context: A baseline of rundll32.exe execution frequency on this host provides context for the alert. rundll32.exe itself is common, so pair this volume with the rule-specific pattern history — the RunDll_ShellExecuteW invocation is the rare part, not rundll32.exe generally.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the ShellDispatch wrapper pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even common tools can be abused. The query mirrors the rule's selection structure scoped to this host, so the parent/user distribution reflects how the rule's specific firing pattern has historically run here rather than generic rundll32.exe usage. A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      selection_cli:
        CommandLine|contains: RunDll_ShellExecuteW
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: How often has this host fired the ShellDispatch wrapper pattern over the past 90 days, and what command-line structures are typical?
  context: A LOLBin pattern with no prior history on a host is more suspicious than one used regularly under stable parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects the rule's specific firing pattern, not generic rundll32.exe usage. The command-line projection lets the analyst compare typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      selection_cli:
        CommandLine|contains: RunDll_ShellExecuteW
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- question: Have other hosts fired the ShellDispatch wrapper pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, returning a fleet-wide count of the rule's firing pattern rather than generic rundll32.exe usage. Many hosts firing the same pattern points to scripted deployment or an installer pushed across the environment; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      selection_cli:
        CommandLine|contains: RunDll_ShellExecuteW
      condition: all of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      selection_cli:
        CommandLine|contains: RunDll_ShellExecuteW
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      selection_cli:
        CommandLine|contains: RunDll_ShellExecuteW
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in the alert window reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity on other hosts, the scope may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      selection_cli:
        CommandLine|contains: RunDll_ShellExecuteW
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the attack stages that preceded this event and help reconstruct the timeline leading to the proxy-execution attempt.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were any other proxy-execution LOLBins used on this host recently?
  context: Operators who use one proxy-execution LOLBin often use several. If rundll32.exe was abused to launch a chosen binary, check whether regsvr32, mshta, msbuild, installutil, or similar binaries were also used to run arbitrary code on the same host. Multiple such binaries performing the same objective strengthens the case for operator-driven execution.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\installutil.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
