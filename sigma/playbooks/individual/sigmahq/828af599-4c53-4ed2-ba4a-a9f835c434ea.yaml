name: Fax Service DLL Search Order Hijack
id: 818ffd82-deda-40ad-bd1d-76263fb67f53
description: |
  Detects the Windows Fax service (fxssvc.exe) loading a library named ualapi.dll from a location
  outside the WinSxS store. The Fax service references ualapi.dll, but that DLL does not ship in
  System32, so any load of it is a phantom / search-order load — planting a ualapi.dll where the
  service searches causes attacker code to run inside a process that holds SeImpersonatePrivilege
  and SeAssignPrimaryTokenPrivilege, a common path to privilege escalation and persistence.
  Investigation should confirm the loaded module's path and signature, determine how the file
  reached the search path, and check whether the load led to child-process execution or additional
  persistence on the host.
type: detection
detection_id: 828af599-4c53-4ed2-ba4a-a9f835c434ea
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the loaded module match what this rule detects across its path, signature, and loading process?
  context: Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded), its
    code-signature status, and the process that loaded it against the rule's criteria — a ualapi.dll
    loaded by fxssvc.exe from any path other than the WinSxS store. The load event carries the module's
    hash and signing status directly, so a first pass can be made without pivoting to another log source.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Is this host expected to run the Fax service and load a ualapi.dll module?
  context: The Fax service is dormant on the large majority of endpoints, and ualapi.dll is not a module
    it normally resolves. Knowing whether this host has a legitimate fax role, and whether the account
    the service ran under is expected, is often the fastest way to separate a genuine sideload from a
    rare but sanctioned configuration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is the loaded ualapi.dll still on disk, and did the Fax service or its children write any files?
  context: Preserving the module on disk enables hash lookups, signature review, and sandbox submission.
    The file may have been planted by a separate process before the service loaded it, so also confirm
    the ualapi.dll path from the alert directly; this query surfaces file writes tied to the alerting
    process and its immediate children.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was there a change ticket, maintenance window, or documented approval for enabling or servicing the Fax service on this host?
  context: The Fax service starting and resolving new modules is unusual on most systems. A corresponding
    change record — a role deployment, a printer/fax configuration, or vendor maintenance — suggests
    authorized activity; absence of one when policy requires it points toward an unsanctioned change.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this activity align with normal work hours and maintenance windows?
  context: Legitimate service configuration typically occurs during business hours or scheduled
    maintenance. A dormant service loading a phantom DLL outside those windows is more consistent with
    opportunistic execution than with planned administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is loading modules into the Fax service this way consistent with how your organization normally deploys fax or print functionality?
  context: Organizations that use fax capability normally deploy it through managed installers or role
    features that stage signed DLLs into system-owned directories. A ualapi.dll appearing on the service's
    search path outside those locations may indicate an operator bypassing normal tooling, or an attacker
    planting a module where the service will resolve it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What modules did the Fax service load around this event, and are any from non-canonical paths, unsigned, or from user-writable directories?
  context: The set of modules a process loads tells the operator's story here. A system DLL name such as
    ualapi.dll resolved from anywhere other than the expected system path is a search-order hijack signal;
    modules from user-writable directories (AppData, ProgramData, Public, TEMP) or unsigned modules where
    signed ones are expected extend that picture. Compare each loaded module's path against the canonical
    location for its name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For the loaded ualapi.dll, what is its signing status, hash, and threat-intel reputation?
  context: Module reputation distinguishes a routine third-party DLL from a side-loaded malicious one. A
    system-named DLL that is unsigned, or signed with an unexpected or invalid certificate, is a strong
    masquerading signal; a hash lookup against threat intelligence surfaces known loaders. Watch the
    SignatureStatus values Unsigned, Expired, Distrusted, and Invalid.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: Has a ualapi.dll module been loaded on this host before, and under what processes?
  context: A first-time module load is a stronger anomaly signal than a recurring one. If a ualapi.dll has
    never been loaded here, or has only been loaded by unrelated processes, the current load by the Fax
    service is anomalous. Because the reference DLL genuinely does not exist in System32, any prior load
    is itself worth examining.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Does this host normally run the Fax service at all?
  context: A process that has rarely or never started on a host is more suspicious than one that runs
    routinely. Zero or very low counts of fxssvc.exe starts over the trailing period indicate the service
    was brought up specifically around this event rather than as part of steady-state operation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously loaded ualapi.dll into the Fax service, what program and user drove it, and does the current alert fit that pattern?
  context: The query mirrors the rule's selection scoped to this host, so the resulting program/user
    distribution reflects how this specific firing pattern — not generic service activity — has run here
    before. Expect the Image column to show the Fax service host fxssvc.exe itself; a new user account or
    a first-ever occurrence is the deviation worth chasing. Image-load events carry no parent lineage —
    pivot to fxssvc.exe's start event if you need to know what launched it.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith: \fxssvc.exe
        ImageLoaded|endswith: ualapi.dll
      filter:
        ImageLoaded|startswith: C:\Windows\WinSxS\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - Image
    - User
- question: What child processes did the Fax service spawn after this load?
  context: The Fax service does not normally spawn interactive or scripting processes. Children such as
    cmd.exe, powershell.exe, or other tools following the module load point to code executing inside the
    service. Re-parenting can move a spawned process out from under the service in the process tree, so
    absence of children here does not rule out execution — corroborate with host-wide activity around the
    same window.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Have other hosts loaded ualapi.dll into the Fax service in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this
    firing pattern rather than generic service usage. Many hosts firing the same pattern points to a
    scripted deployment or vendor automation dropping the module; one host or a small unrelated set points
    to targeted or manual activity. Use the distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith: \fxssvc.exe
        ImageLoaded|endswith: ualapi.dll
      filter:
        ImageLoaded|startswith: C:\Windows\WinSxS\
      condition: selection and not filter
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Activity surrounding the load reveals the immediate context —
    what led to the service starting, what ran alongside it, and whether the event is one step in a larger
    sequence. Look for reconnaissance, privilege escalation, or persistence installation near the same
    timestamp.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential access —
    may reveal the stages that preceded this load and help reconstruct the timeline. A DLL sideload used
    for escalation is often preceded by the activity that planted the module or enabled the service.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were registry keys that govern DLL search order or the Fax service configuration modified on this host around the alert?
  context: DLL search-order hijacking is sometimes enabled or reinforced through registry changes.
    Modifications to KnownDLLs, AppInit_DLLs, or the Fax service's own configuration keys can redirect
    which library a trusted process loads or force the service to start. Registry modifications to these
    keys near the alert time show whether the phantom-DLL load was accompanied by a configuration change.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\Control\Session Manager\KnownDLLs'
          - '\Services\Fax'
          - '\Windows NT\CurrentVersion\Windows\AppInit_DLLs'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: Were other process-based persistence mechanisms installed on this host?
  context: A single foothold is rarely the whole story. After establishing execution inside a privileged
    service, operators commonly install backup persistence using different techniques — scheduled tasks,
    services, registry Run keys, BITS jobs, or WMI subscriptions. Multiple persistence installations in
    the same timeframe indicate intentional stacking rather than isolated administration.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations such as the Startup folder or scheduled-task definition paths on this host?
  context: File-based persistence bypasses command-line detection entirely. Dropping an executable or
    script into the Startup folder or a path referenced by a registry Run key achieves persistence without
    running schtasks, sc, or reg. File event monitoring captures these drops even when the operator avoids
    standard persistence tooling.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
