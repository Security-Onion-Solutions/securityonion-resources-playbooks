name: Microsoft Office DLL Sideload
id: 6ee603f1-371f-4289-8493-84b4e81a721a
description: |
  This detection fires when a module whose filename ends in outllib.dll — a legitimate Microsoft Office component — is loaded from a directory outside the standard Microsoft Office installation paths. Loading a genuine Office DLL name from a non-canonical location is a hallmark of DLL search-order hijacking (sideloading): a planted or trojanized outllib.dll is dropped where a trusted, signed Office process will load it in preference to the real one. Investigation should confirm the exact load path against the expected Office directories, establish the module's signature and hash reputation, identify the loading process and how it was started, and check for the file drop or registry redirection that enabled the load.
type: detection
detection_id: 829a3bdf-34da-4051-9cf4-8ed221a8ae4f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the loaded module match the path and loading process this rule detects?
  context: Confirm the alert is a true positive by checking that the loaded module path (ImageLoaded) ends in outllib.dll and sits outside the standard Microsoft Office install directories. A genuine Office DLL loaded from within the normal Office program directories does not fire this rule; a match here means the module loaded from a non-canonical location. Signature and hash reputation are examined separately.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this user and host expected to run Microsoft Office and load this module?
  context: Legitimate Office use loads outllib.dll routinely, but only from the standard install paths. Knowing whether the host runs Office at all, and whether the user and host function are consistent with the loading process, is often the fastest path to distinguishing a real sideload from an unusual but benign deployment.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is the sideloaded DLL still on disk at the non-standard path for analysis?
  context: The planted outllib.dll is the primary artifact. Confirming it still exists at the load path enables a hash lookup, signature check, and sandbox submission. This query correlates file writes back to the loading process and its direct children so any related dropped files surface alongside the DLL.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was there a change ticket, software deployment, or documented approval that would place this DLL at this path?
  context: Some installers and repackaged application bundles stage signed DLLs outside the canonical Office directories. A corresponding deployment record or change ticket suggests authorized activity; absence of one when a Microsoft-named module is loading from a user-writable or non-standard location points toward an unauthorized plant.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this module load align with normal work hours or a maintenance window?
  context: A sideloaded module typically loads whenever the hijacked application is launched, so correlate the load time with expected usage. An outllib.dll load from a non-standard path outside business hours, or on a host that does not normally run Office interactively, is harder to explain as routine activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What modules did the loading process pull in, and did any load from outside the standard Microsoft Office directories or arrive unsigned?
  context: 'The full set of modules a process loads tells the operator''s story for a sideload. Look for: DLLs from %TEMP%, AppData, ProgramData, Public, or an application''s own folder rather than the system or canonical Office path; system or Office DLL names loaded from non-system locations — search-order hijacking; and unsigned modules sitting where signed ones are expected. The load path relative to the module''s expected home is the deciding detail.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For the sideloaded module, what is its signing status, hash, and threat-intel reputation?
  context: Module reputation separates a routine third-party DLL from a malicious sideload. A genuinely-signed Microsoft DLL loaded from an unexpected location may still be legitimate, since some installers stage signed DLLs; an unsigned module carrying a Microsoft-style filename with no valid signature points to masquerading. Hash lookups against threat intelligence surface known loader families. DLL loads carry the hash and signing status on the load event itself.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What process spawned the process that loaded this module, and is that parent chain expected?
  context: The parent chain reveals how the loading process was started. A legitimate Office process launched from explorer.exe or a click-to-run service is expected; the same image started by an unusual parent such as a script host, an unpacked archive, or a process running from a user-writable directory is more consistent with a hijacked or relocated application.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Does this host normally run the process that loaded this module?
  context: A loading process that has never or rarely run on this host is more suspicious than one that runs regularly. Zero or very low historical counts for the loading binary indicate a first-time or relocated application, which is consistent with a process staged to sideload a planted DLL.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Has this module been loaded on this host before, and under which processes?
  context: A first-time module load on a host is a stronger anomaly signal than a recurring one. If outllib.dll has been loaded repeatedly by the same Office binary from the same path over the past 90 days, this load is probably routine. If this is the first occurrence, or the module has only been loaded by different processes or from different paths historically, the current load is anomalous.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Were registry keys that influence DLL search order or module loading modified on this host recently?
  context: DLL search-order hijacking is sometimes enabled by registry redirection rather than by planting a file alone. Modifications to KnownDLLs, AppInit_DLLs, or Image File Execution Options can force a trusted process to load an attacker-controlled module. These keys change rarely, so any modification close to the load window is worth correlating. The Details value is absent for binary or empty payloads.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\Session Manager\KnownDLLs'
          - '\CurrentVersion\Windows\AppInit_DLLs'
          - '\Image File Execution Options'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Is this module being loaded from a non-standard path by other hosts in the environment?
  context: Cross-host correlation surfaces how far the module has spread. The same module loaded from a non-standard path across multiple hosts points to shared tooling or a coordinated deployment rather than a one-off, while a single host is more consistent with a localized incident. Note the variety of loading processes — the same module loaded by unexpected processes on other hosts widens the scope.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation, and DLL sideloading correlates in time with the file drop, any registry redirection, and the launch of the hijacked application. Examining activity in the minutes around the load reveals the immediate context: what dropped the module, what launched the loader, and what ran afterward. Look for reconnaissance, privilege escalation, or additional persistence.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or a suspicious download that staged the module — may reveal the stages that preceded this load and help reconstruct the timeline. The sequence of alerts on a host often tells the fuller story of how the sideload was set up.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host around this module load?
  context: Attackers rarely rely on a single persistence mechanism. Alongside a sideloaded DLL that re-executes whenever the hijacked application launches, backup mechanisms are commonly installed using different techniques — scheduled tasks, services, registry Run keys, or BITS jobs. Multiple persistence installations in the same timeframe indicate intentional stacking rather than isolated administration.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations such as the Startup folder or scheduled-task definition paths on this host?
  context: File-based persistence bypasses command-line detection entirely. Dropping an executable or script into the Startup folder or a path referenced by a registry Run key achieves persistence without running schtasks, sc, or reg. File-write monitoring captures these drops even when the standard persistence tools are avoided, complementing the DLL sideload as a separate foothold.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
