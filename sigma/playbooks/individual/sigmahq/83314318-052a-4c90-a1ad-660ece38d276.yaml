name: Blackbyte Ransomware Registry
id: f5f08758-89f5-4574-8514-4c23b335b48d
description: |
  Detects the three registry values BlackByte ransomware sets to DWORD 1 while preparing a
  host for lateral movement and encryption: LocalAccountTokenFilterPolicy (removes UAC
  remote-token filtering so local administrator accounts keep full rights over the network),
  EnableLinkedConnections (links mapped drives across filtered and elevated logon tokens), and
  LongPathsEnabled (lifts the 260-character path limit so deeply nested files can be reached).
  The rule fires when any one of these keys is set to DWORD (0x00000001); a single hit is worth
  reviewing, but all three together are consistent with the BlackByte preparation sequence.
  Legitimate software and administrators occasionally set these values, so confirm the writing
  process and its parent lineage, and determine whether recovery-inhibiting or encryption
  activity followed on the same host or spread to others.
type: detection
detection_id: 83314318-052a-4c90-a1ad-660ece38d276
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Which of the three BlackByte registry keys fired, and is its value data DWORD 1?
  context: Confirm the alert before investing time. The rule fires when TargetObject is one of
    LocalAccountTokenFilterPolicy, EnableLinkedConnections, or LongPathsEnabled and Details is
    DWORD (0x00000001). Note which key fired -- each enables a different stage of privilege
    retention, mapped-drive propagation, or long-path file access, and that determines which
    follow-on activity to look for.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify system security-policy registry keys?
  context: Legitimate administrative activity and some installers set these policy values.
    Knowing whether the account and host function make such a change routine is often the
    fastest way to separate an authorized change from a BlackByte host-preparation write. On
    registry events the user is present about 94% of the time and may be a machine account or
    SYSTEM; when it is, pivot to the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What specific registry key and value were written, and what protection does that
    key control?
  context: The key path reveals intent. LocalAccountTokenFilterPolicy set to 1 disables UAC
    remote-token filtering so local administrator accounts keep full rights over the network;
    EnableLinkedConnections set to 1 links mapped drives across filtered and elevated tokens;
    LongPathsEnabled set to 1 removes the 260-character path ceiling. Read the writing process
    (Image) here; command-line detail is not carried on the registry event and needs a process
    pivot.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the modified setting still in effect, or was the key re-written afterward?
  context: These are security-relevant policy keys that should rarely change. Registry key and
    value deletions are not recorded in this telemetry, so cleanup cannot be observed directly;
    instead judge whether the change persists from the key's later modification history on this
    host. A value that was set once and left in place keeps the capability enabled for any
    follow-on lateral movement or encryption.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Were other registry modifications made on this host in the same window?
  context: BlackByte host preparation sets these three keys together and often touches
    additional hives -- FileSystem controls, Policies\System, or security-tool keys. All
    registry modifications on this host in the window, grouped by key path and writing process,
    reveal whether this was an isolated change or one of a cluster of configuration changes
    made by the same process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has this registry key been modified before on this host?
  context: First-time changes to a security policy key are more notable than routine ones. These
    keys are set once during host preparation and are otherwise stable on most hosts; a 90-day
    history showing no prior writes, or a sudden new writing process, argues for a genuine
    change rather than a recurring management task.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same registry key modified on other hosts in the environment?
  context: The same value set on many hosts can mean a management push (group policy,
    configuration tool) or malware spreading the identical change. Comparing the writing
    process and value across hosts separates a fleet-wide administrative change from BlackByte
    replicating its preparation step laterally. A change confined to this host alone points to
    targeted activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What process wrote this key, and what started that process?
  context: The writing process and its own parent reveal how the change was made. A policy write
    from an interactive administrator tool has a different lineage than one from a script host,
    an injected system process, or a binary launched by a ransomware loader. Legitimate writers
    such as regedit.exe or msiexec.exe with an expected parent argue for a benign change; an
    unsigned or unexpected writer with an abnormal parent chain argues against.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because this event type does not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What recovery-inhibiting commands were executed on this host?
  context: BlackByte and similar ransomware delete shadow copies and disable recovery before
    encrypting. This surfaces shadow-copy deletion (vssadmin, wmic), boot-recovery changes
    (bcdedit), and backup deletion (wbadmin, reagentc) on the host. Verify each result against
    system state -- vssadmin list shadows, bcdedit /enum, reagentc /info -- to confirm whether
    recovery was actually destroyed.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\reagentc.exe'
          - '\diskshadow.exe'
      selection_cmdline:
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'recoveryenabled'
          - 'bootstatuspolicy'
          - 'delete catalog'
          - 'delete systemstatebackup'
          - 'boot.ini'
          - 'winre.wim'
          - '/disable'
      condition: selection and (selection_recovery or selection_cmdline)
    fields:
      - Image
      - CommandLine
- question: What other destructive or recovery-inhibiting actions occurred on this host?
  context: Ransomware chains destructive actions -- deleting shadow copies, stopping security
    services, changing file permissions, clearing logs. The set of destructive tool executions
    in the window, grouped by tool and user, shows whether this registry write sits inside a
    full BlackByte sequence or stands alone. A shared parent across the commands points to
    scripted execution.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_destructive:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\cipher.exe'
          - '\fsutil.exe'
          - '\icacls.exe'
          - '\takeown.exe'
          - '\attrib.exe'
          - '\sc.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\powershell.exe'
          - '\taskkill.exe'
      condition: selection and selection_destructive
    fields:
      - Image
      - User
- question: Are there signs of file encryption, ransom notes, or ransomware binary execution on
    this host?
  context: Recovery destruction usually precedes encryption by minutes. Unknown binaries
    executing from user-writable paths after the registry change, high file I/O, or ransom-note
    file names indicate encryption has started. BlackByte drops a ransom note and may run a
    payload copied for onward spreading; checking file activity and unfamiliar executables
    shows how far impact has progressed.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_known:
        Image|startswith:
          - 'C:\Program Files'
          - 'C:\Windows\System32\svchost'
          - 'C:\Windows\System32\wbem'
      condition: selection and not filter_known
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: Is this same alert firing on other hosts in the environment?
  context: Ransomware operators run the same preparation and destruction sequence across many
    hosts. Searching for this rule firing fleet-wide shows whether the registry change is
    isolated or part of coordinated multi-host activity, which sets the scope for containment.
    Multiple hosts firing the same key write indicate coordinated activity and broaden the
    containment scope.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
- question: What other process activity occurred on this host around the time of the alert?
  context: The registry write rarely stands alone. Process activity in the surrounding window --
    reconnaissance, privilege checks, security-tool changes, or a loader spawning helpers --
    reconstructs what led to the change and what followed. Aggregating by process and parent
    collapses routine agent noise while novel parent-child pairs stand out.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host --
    exploitation of a public-facing service, credential access, or defense tampering -- may
    reveal the stages that preceded this registry change and help place it on the intrusion
    timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other persistence mechanisms installed on this host?
  context: Attackers rarely rely on a single foothold. Executions of scheduling and service
    tools (schtasks, sc, reg, at, bitsadmin, wmic) in the surrounding window show whether
    additional persistence was stacked alongside the registry change. BlackByte uses scheduled
    tasks for lateral triggering and print-bombing; multiple mechanisms installed together
    indicate deliberate stacking.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
