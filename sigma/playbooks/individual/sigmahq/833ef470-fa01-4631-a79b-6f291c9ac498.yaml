name: Add Debugger Entry To Hangs Key For Persistence
id: a3e79304-fbf2-42d3-bc42-79de462fa621
description: |
  Detects creation of a Debugger value under the Windows Error Reporting Hangs registry key
  (HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\Hangs\Debugger). When an application
  hangs, the Windows Error Reporting framework launches the executable named in this value, giving
  an attacker a persistence mechanism that runs outside the normal parent-child process lineage.
  This value is not present by default and is only rarely set by administrators, so confirm the
  writing process, decode the executable path in the value data, and determine whether that payload
  was dropped to disk and executed.
type: detection
detection_id: 833ef470-fa01-4631-a79b-6f291c9ac498
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Do the registry key path and value data match what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing
    the exact key path (TargetObject) against the Windows Error Reporting Hangs Debugger location
    and the value data written, along with the process that performed the write.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify Windows Error Reporting persistence keys?
  context: Legitimate administrative activity can trigger this detection, but a write to the Hangs
    Debugger value is uncommon. Knowing whether the user role and host function are consistent with
    manual registry edits under Windows Error Reporting is often the fastest path to distinguishing
    a true positive from routine maintenance. When the user is a machine account or missing, pivot
    on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What executable path is written to the Debugger value, and is this a known persistence
    location?
  context: The Hangs Debugger value under Windows Error Reporting takes an executable path that the
    framework runs when an application hangs. Decode the value data (Details) to identify the
    referenced binary and its location; payloads in user-writable directories (Temp, AppData,
    ProgramData, Public) or with mismatched names are higher concern than a signed system utility.
    Details is absent for binary or empty value data, so note when it does not resolve.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Has the Hangs Debugger value been modified before on this host?
  context: This value is not set by default, so a first-time modification is more notable than a
    recurring one. Zero history indicates a key that has never been touched on this host, which
    raises the concern that the write is attacker-initiated rather than an established configuration.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this registry key modified on other hosts in the environment?
  context: The same Hangs Debugger modification across multiple hosts may indicate a policy push or
    widespread activity, while a single-host change looks targeted. Compare the value data across
    hosts to see whether the same executable path is configured everywhere or differs per host.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Were other registry modifications made on this host in the same session?
  context: An actor who sets one persistence key often modifies several — for example configuring the
    Hangs Debugger while also adding a Run key or altering security policy. Clusters of registry
    changes from the same writing process in a short window reveal the full scope of the configuration
    changes and whether multiple objectives were pursued.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What process wrote this key, and is its parent chain expected?
  context: The writing process and its parent reveal how the registry change was made. A registry
    edit driven by explorer.exe or a deployment tool differs from one driven by a script host,
    Office application, or an unexpected shell, which may indicate exploitation or a malicious
    dropper. Walk up from the parent to see what launched it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Did the executable configured in the Debugger value subsequently run on this host?
  context: Persistence via the Hangs Debugger value is only effective if the referenced executable
    runs when an application hangs. Because the Windows Error Reporting framework launches it, the
    process appears outside the normal parent-child lineage. Confirming that the configured binary
    executed shows the persistence is active. If value data was unavailable, filter process activity
    for the path identified in the key-context question instead.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Details%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Was the referenced executable or script dropped to disk on this host?
  context: The persistence is only live if the executable named in the Debugger value exists on disk.
    Correlating file activity by the registry-writing process and its children locates a payload
    dropped in the same session. The file-write event carries no hash; if the payload is present,
    hash it from a later execution or retrieve it for a reputation lookup. Registry value deletion is
    not observable here, so judge cleanup from re-modification history and payload execution rather
    than a delete event.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining process activity in the window around the
    registry write reveals what led to it and what followed, and whether the persistence change is
    part of a larger sequence such as reconnaissance, privilege escalation, or payload staging.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential
    access — may reveal the attack stages that preceded the persistence write and help reconstruct
    the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was there a change ticket, maintenance window, or documented approval for this registry
    change?
  context: Many organizations require change tickets for persistence-relevant system modifications.
    A corresponding ticket suggests authorized activity; absence of one when policy requires it
    suggests the write was unauthorized. This check can quickly close false positives or escalate
    true positives.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the user or administrator recall making this registry change?
  context: Direct confirmation from the human behind the account is often the fastest path to
    determining legitimacy. If the user does not recall the change, their credentials may be
    compromised or the activity may be automated; if they do recall it, capture why the Hangs
    Debugger value was set.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this change align with normal work hours and maintenance windows?
  context: Legitimate system changes typically occur during business hours or scheduled maintenance.
    A persistence-relevant registry write outside those windows is more notable than the same change
    during a documented maintenance window.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were other process-based persistence mechanisms installed on this host?
  context: Attackers rarely rely on a single persistence mechanism. After establishing one foothold,
    they commonly install backups using different techniques — scheduled tasks, services, registry
    Run keys, BITS jobs, or WMI subscriptions. Multiple persistence installations in the same
    timeframe indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations such as the Startup folder or scheduled-task definition paths
    on this host?
  context: File-based persistence bypasses command-line detection entirely. Dropping an executable or
    script into a Startup folder or a path referenced by a registry Run key achieves persistence
    without running schtasks, sc, or reg. File event monitoring captures these drops even when the
    attacker avoids standard persistence tools.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
