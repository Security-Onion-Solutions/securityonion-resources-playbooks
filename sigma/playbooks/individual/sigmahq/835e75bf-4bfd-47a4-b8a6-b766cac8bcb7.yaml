name: Uncommon Child Process Of Setres.EXE
id: c6e6d68a-1411-4d14-a893-7481d164c128
description: |
  Detects setres.exe spawning a child process whose Image path contains "\choice"
  while excluding the legitimate choice.exe under System32 or SysWOW64. setres.exe is
  a Windows Server display-resolution utility that launches a binary named "choice"
  from its current working directory, so an attacker who drops a renamed payload named
  "choice" alongside it gets arbitrary code executed through a trusted parent — a form
  of proxied, indirect execution. Investigation should confirm what the child binary
  actually is and where it lives, identify what launched setres.exe, and determine
  whether the spawned child reached out to the network or dropped further artifacts.
type: detection
detection_id: 835e75bf-4bfd-47a4-b8a6-b766cac8bcb7
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the alert show setres.exe as the parent spawning a child whose image path contains "\choice" from a non-System32 location?
  context: Confirm the alert is a true positive by reviewing the exact parent and child image paths. The rule fires only when the parent ends in setres.exe AND the child image path contains "\choice" AND the child is not the legitimate choice.exe under System32 or SysWOW64. Verify the child's full path before investing further.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
- question: Is this host expected to run setres.exe, and is this user expected to perform display-resolution or server-configuration tasks here?
  context: setres.exe ships only on Windows Server SKUs and is normally used to set screen resolution during configuration. A workstation running it, or a standard user invoking it interactively, is a fast discriminator between routine server administration and abuse of the binary as an execution proxy.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What started setres.exe, and is that launch chain expected on this host?
  context: The parent-child relationship is the core signal here. setres.exe is rarely launched interactively; tracing setres.exe's own origin (its grandparent) reveals whether this was a hands-on-keyboard launch from a shell or script versus a routine configuration process. An unexpected launcher for setres.exe is the deviation worth chasing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did this setres.exe instance spawn?
  context: If setres.exe was used to proxy execution, it may have launched more than the one child that triggered the alert. Examining the siblings of the alerting child reveals whether the same setres.exe instance orchestrated multiple stages. ParentProcessGuid scopes to the exact parent instance; host.name is the fallback when it resolves to NODATA.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What is setres.exe's own command line, and what spawned it?
  context: setres.exe's process_creation event shows the resolution flags it was invoked with and confirms its own parent. A setres.exe launched from an interactive shell or scripting host, rather than as part of a server-configuration sequence, reframes the spawned child as the deliberate payload rather than incidental output of a configuration task.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: What exactly is the "choice" child binary, and what did its command line do?
  context: The child whose path contains "\choice" is the proxied payload. Decode its full command line, flags, and any URLs or script paths. Because setres.exe launches "choice" from its working directory, a renamed payload (e.g., choice.exe, choice.com, or choice.cmd dropped in a non-System32 path) is the abuse pattern; high-risk indirect-execution children include powershell.exe, cmd.exe, rundll32.exe, regsvr32.exe, mshta.exe, and curl.exe content invoked this way.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|contains|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What "choice"-named files exist in the working directory that setres.exe launched from?
  context: setres.exe resolves "choice" from its current working directory, so abuse requires an attacker-dropped file such as choice.exe, choice.com, or choice.cmd outside System32. File events scoped to the spawned child's paths reveal when and by what the renamed payload was written, which distinguishes a freshly staged binary from a long-present file.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - User
      - EventType
- question: Did the "choice" child binary make any outbound network connections?
  context: Proxied execution through a trusted parent frequently exists to run a downloader or beacon. Network connections initiated by the spawned child, correlated to its process instance, indicate retrieval of a follow-on payload or command-and-control. Absence of network activity points toward purely local actions such as dropping or modifying files.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|contains|expand: '%Image%'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: What other activity occurred on this host around the time of the alert?
  context: The indirect-execution chain ties together the launcher, the spawned child, and any follow-on actions within a short window. Aggregating process activity around the alert surfaces the immediate context — what led to setres.exe running and what happened after the child executed — while collapsing repetitive agent telemetry into high-count rows so novel parent-child pairs stand out.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Has setres.exe spawned a child whose image path contains "\choice" on this host before?
  context: Historical frequency of this specific parent-child pairing distinguishes routine from anomalous. setres.exe legitimately launching the System32 choice.exe is excluded by the rule, so any prior occurrence of this exact non-System32 pairing is itself notable. Zero or very low counts indicate a novel spawning relationship.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|contains|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: Does this host normally run a binary named "choice" from this location?
  context: A "choice"-named binary that has never been seen at this path is more suspicious than one that runs regularly. The legitimate choice.exe lives under System32; an aggregation showing prior executions from a different directory reframes the disposition, while zero counts indicate first-time execution of the renamed payload.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|contains|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \setres.exe
        Image|contains: \choice
      filter_main_legit_location:
        Image|endswith:
        - C:\Windows\System32\choice.exe
        - C:\Windows\SysWOW64\choice.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \setres.exe
        Image|contains: \choice
      filter_main_legit_location:
        Image|endswith:
        - C:\Windows\System32\choice.exe
        - C:\Windows\SysWOW64\choice.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar indirect-execution activity on other hosts, the scope of the operation may be larger than a single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \setres.exe
        Image|contains: \choice
      filter_main_legit_location:
        Image|endswith:
        - C:\Windows\System32\choice.exe
        - C:\Windows\SysWOW64\choice.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Indirect execution through a trusted binary is usually a mid-chain action rather than an entry point. Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the stages that preceded this event and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
