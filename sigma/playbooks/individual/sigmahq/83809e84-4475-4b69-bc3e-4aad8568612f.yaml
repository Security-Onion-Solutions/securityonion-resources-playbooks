name: MSExchange Transport Agent Installation
id: 6018ce4a-c1fc-4140-b286-ca0e536d5f88
description: |
  Detects command lines that install a Microsoft Exchange transport agent via the Install-TransportAgent cmdlet.
  Transport agents are .NET assemblies registered into the Exchange transport pipeline; once installed they fire on
  SMTP events and gain access to every message flowing through the server, which makes them a durable code-execution
  and email-interception persistence mechanism that survives reboots and runs inside the Exchange transport service.
  Legitimate use is limited to administrators deploying signed, vendor-supplied agents (anti-spam, journaling,
  signature tools); the investigation should determine who ran the cmdlet, which assembly path it registered, whether
  that assembly is signed and expected, and whether the install was approved.
type: detection
detection_id: 83809e84-4475-4b69-bc3e-4aad8568612f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line contain Install-TransportAgent and match what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line
    and process details. The rule fires on any command line containing the Install-TransportAgent cmdlet; verify the
    full invocation, including the agent name and the AssemblyPath argument that points at the DLL being registered.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to install Exchange transport agents?
  context: Registering a transport agent is an Exchange administrative action that should only happen on Exchange
    servers, performed by an Exchange administrator or an approved deployment account. A workstation, a non-Exchange
    server, or a non-administrative user running this cmdlet is a strong deviation from the legitimate baseline.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What did the Install-TransportAgent invocation actually register? Decode the agent name and AssemblyPath.
  context: The full command line reveals which assembly was registered and where it lives on disk. Decode the
    -Name, -AssemblyPath, and -TransportAgentFactory arguments. AssemblyPath pointing at a vendor or Exchange
    install directory with a signed DLL is routine; a path under a user profile, ProgramData, a temp directory, or
    any world-writable location, or an unsigned/unknown assembly, indicates a malicious agent.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: Install-TransportAgent
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned the cmdlet host that ran Install-TransportAgent, and is that parent chain expected?
  context: The parent process reveals how the cmdlet was invoked. A legitimate install runs from the Exchange
    Management Shell or a deployment tool with a predictable parent. An unusual parent such as a web server worker
    process, an Office application, a script host, or a remote-management tool suggests the install followed
    exploitation or hands-on-keyboard activity rather than planned administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously run Install-TransportAgent, what parents and users normally drive it, and
    does the current alert fit that pattern?
  context: Even on Exchange servers, transport agent installs are infrequent and tied to specific maintenance.
    The query mirrors the rule's selection scoped to this host, so the resulting parent/user distribution reflects
    how this exact install pattern has historically run here. A new parent process, an unexpected account, or an
    unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains: Install-TransportAgent
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Did the Exchange transport service load an unusual or unsigned .NET assembly, or log transport-agent errors,
    around the time of this install?
  context: A registered transport agent only takes effect when the Exchange transport service loads its assembly; a
    malicious or malformed agent often produces application-log errors when the transport service initializes or fails
    to load it. Reviewing transport-service application events near the install time confirms whether the registered
    assembly was actually brought into the pipeline and whether it is one the environment recognizes.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      service: application
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Provider_Name
      - EventID
      - Message
- question: Was a DLL loaded from the registered AssemblyPath, and is that module signed and expected for Exchange?
  context: The transport agent is a .NET assembly DLL; once registered, the Exchange transport process loads it.
    Module-load telemetry shows which DLL was actually mapped and whether it carries a valid signature. An unsigned
    module, or one loaded from a user-writable or non-standard directory rather than the Exchange or a known vendor
    install path, indicates the registered agent is not a sanctioned component.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith: .dll
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - Image
- question: What other administrative tools and cmdlets ran on this host around the time of the install?
  context: A transport agent install rarely stands alone in an intrusion. Activity in the surrounding window may reveal
    reconnaissance, web-shell drops, credential access, or additional persistence being staged alongside the agent.
    The time delta between related actions also helps establish whether this was a single planned change or part of a
    longer hands-on session.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains: Install-TransportAgent
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains: Install-TransportAgent
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around the time of the install?
  context: Tracking the account's activity across all hosts reveals lateral movement or staging on other systems. If
    the same account triggered Exchange management actions, web-shell drops, or persistence on multiple servers in this
    window, the scope of the intrusion is larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains: Install-TransportAgent
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this install?
  context: Server-side persistence is often installed after initial access. Earlier detections on the same host such as
    web-shell activity, exploitation of the mail server, reconnaissance, or credential access may reveal the stages
    that preceded the agent install and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was there a change ticket, maintenance window, or documented approval for this transport agent install?
  context: Installing a transport agent is a significant configuration change to mail flow and is normally governed by
    change control. A corresponding ticket or approved maintenance window suggests authorized activity; absence of one
    when policy requires it suggests the install was unauthorized and should be escalated.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the Exchange administrator recall installing this transport agent, and can they identify the assembly?
  context: Direct confirmation from the person behind the account is often the fastest path to legitimacy. If the
    administrator recalls the install, capture which agent and assembly they deployed and why. If no one recalls it,
    the credentials may be compromised or the activity may be automated, and the registered assembly should be treated
    as untrusted until proven otherwise.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: Attackers rarely rely on a single persistence mechanism. After registering a transport agent, they commonly
    stack backup footholds using different techniques such as scheduled tasks, services, registry Run keys, BITS jobs,
    or WMI subscriptions. Multiple persistence installs in the same timeframe indicate intentional stacking rather than
    an isolated administrative change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations such as the Startup folder or scheduled-task definition paths on this host?
  context: File-based persistence bypasses command-line detection entirely. Dropping an executable or script into a
    Startup folder or a path referenced by a registry Run key achieves persistence without invoking schtasks, sc, or
    reg. File event monitoring captures these drops even when the operator avoids standard persistence tooling, which
    is relevant when a server foothold is being made resilient.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
