name: Suspicious Encoded Scripts in a WMI Consumer
id: 20aa90e1-e356-4d9d-ac28-0b81e1bd37ac
description: |
  Detects a WMI event consumer whose script or command payload carries base64-encoded content
  matching markers of an in-memory loader or an embedded PE file: WriteProcessMemory, the DOS
  stub strings "This program cannot be run in DOS mode" and "This program must be run under
  Win32". A WMI event consumer is one leg of a three-object persistence structure — an
  __EventFilter defines the trigger, an __EventConsumer holds the payload, and a
  __FilterToConsumerBinding joins them. The objects live in the WMI repository under
  root\subscription rather than on disk, survive reboot, and execute as SYSTEM under
  WmiPrvSE.exe or scrcons.exe when the filter condition matches. Legitimate management,
  inventory, and backup agents register consumers too, so the investigation should determine
  what the consumer executes once decoded, what event triggers it, when and by what process it
  was registered, whether the same filter and consumer names recur across the fleet as a
  deployed product would, and how to enumerate and remove the objects given that they leave no
  file to delete.
type: detection
detection_id: 83844185-1c5b-45bc-bcf3-b5bf3084ca5b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the event consumer's payload carry a base64-encoded PE image or a WriteProcessMemory reference?
  context: >-
    The rule fires on base64-encoded forms of three markers inside the consumer's payload —
    WriteProcessMemory, and the two DOS stub strings that begin every Windows PE file. Decoding
    the payload and finding an MZ header or a memory-writing API reference confirms the consumer
    is carrying an executable loader rather than a management script. Read the consumer record
    itself for the payload text; the objects are stored in the WMI repository, so the payload is
    recovered from the subscription object or from the WMI activity record of its registration,
    not from a file on disk.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Destination
  answer_sources:
  - alert
  - manual_review
- question: Is this user and host expected to register WMI event subscriptions?
  context: >-
    Permanent WMI event subscriptions are registered by a narrow set of actors — management and
    inventory agents, backup products, and a small number of Windows built-ins. Registration
    performed under an interactive user account, or on a host that runs none of those products,
    separates operator activity from routine agent behavior faster than any query. Note that
    subscription registration commonly runs as SYSTEM even when a person initiated it, so a
    SYSTEM attribution is not on its own evidence of an agent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What WMI subscription activity did this host's WMI activity log record, and when was the consumer registered?
  context: >-
    The native WMI activity operational log records permanent consumer registration under event
    code 5861, temporary registration under 5860, and filter-to-consumer subscription activity
    under 5859. The 5861 record carries the consumer definition in the CONSUMER column and the
    binding in ESS, while 5859 and 5860 carry the filter query text in the Query column — read
    them alongside the message narrative and the trigger condition and the payload reference
    become readable together; that answers what runs and what makes it run. The registration
    timestamp bounds the
    intrusion, and a registration followed shortly by a deletion of the same objects is the
    pattern of one-shot lateral movement rather than durable persistence. This channel is not
    collected on every host; if this host does not ship it, an empty result is a visibility gap
    rather than evidence that no subscription exists, and the objects should be enumerated
    directly on the host against the root\subscription namespace, where __EventFilter,
    __EventConsumer, and __FilterToConsumerBinding instances can be listed and removed.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: wmi
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 5861
          - 5860
          - 5859
      condition: selection
    fields:
      - EventID
      - winlog.user_data.CONSUMER
      - winlog.user_data.ESS
      - winlog.user_data.Query
      - winlog.user_data.NamespaceName
      - message
  answer_sources:
  - manual_review
  - edr_console
- question: What does the consumer's encoded payload decode to, and what operation does the decoded content perform?
  context: >-
    Decode the payload the consumer stores and read what it actually does. A base64 blob that
    resolves to an MZ header is an embedded PE the consumer loads into memory; a
    WriteProcessMemory reference points at injection into an already-running process rather than
    a new one. Script consumers frequently layer encodings — base64 wrapping a VBScript or JScript
    body that itself rebuilds strings through Chr() chains or character concatenation — so iterate
    the decoding until the content is readable. The decoded content names the operation: a
    download cradle, a named-pipe listener awaiting shellcode, a reverse shell, or a loader that
    hijacks a thread in an existing process. Detonate nothing from a production host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - manual_review
  - safe_environment
- question: Did WMI subscription tooling or a MOF compilation run on this host around the alert?
  context: >-
    Subscription objects reach the WMI repository through a small set of paths — compiling a MOF
    file with mofcomp.exe, wmic.exe invocations against root\subscription, or PowerShell calls
    such as Register-WmiEvent, Set-WmiInstance, New-CimInstance, and Invoke-WmiMethod that create
    __EventFilter, __EventConsumer, and __FilterToConsumerBinding instances. Seeing which of these
    ran, with what arguments, identifies the registering process and often names the MOF or script
    carrying the payload. Absence of all of them alongside a subscription registration points at a
    process that drove the WMI API directly, or at a registration performed remotely over DCOM
    from another host, in which case the tooling evidence lives on the source host rather than
    this one.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tool:
        Image|endswith:
          - '\mofcomp.exe'
          - '\wmic.exe'
          - '\wbemtest.exe'
          - '\powershell.exe'
          - '\pwsh.exe'
      selection_wmi:
        CommandLine|contains:
          - '__EventFilter'
          - '__EventConsumer'
          - '__FilterToConsumerBinding'
          - 'root\subscription'
          - 'root/subscription'
          - 'Register-WmiEvent'
          - 'Set-WmiInstance'
          - 'New-CimInstance'
          - 'Invoke-WmiMethod'
          - 'process call'
          - '.mof'
      condition: selection and selection_tool and selection_wmi
    fields:
      - Image
      - CommandLine
      - User
  answer_sources:
  - process_creation
- question: What launched the process that registered this WMI event consumer?
  context: >-
    The registering process is what the WMI activity record and the subscription tooling evidence
    name, but its lineage is not in either. Looking that process up by its own identifier returns
    the parent that started it, which is what separates an agent installer or update chain from an
    interactive shell, a script host, or an Office application spawned by a macro. WMI activity
    records carry no process identifier of their own, so this pivot needs the registering process
    resolved from the tooling evidence first; where it cannot be resolved, the parent lineage has
    to come from endpoint process history rather than this query.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other processes did the registering process spawn?
  context: >-
    A process that registers a WMI subscription rarely stops there. Listing the children it
    launched shows whether the registration was an isolated change or one step in a longer chain —
    payload staging, an additional persistence mechanism, or follow-on tooling. Registration
    performed remotely over DCOM leaves the calling chain on the source host, so an empty result
    here is consistent with a remote operator rather than with an absence of activity.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What did WmiPrvSE.exe or scrcons.exe spawn on this host, and does any of it look unrelated to a management agent?
  context: >-
    The consumer object holds the payload but executes nothing itself — execution surfaces as a
    child of WmiPrvSE.exe for a CommandLineEventConsumer or of scrcons.exe for an
    ActiveScriptEventConsumer, running as SYSTEM. That child is an ordinary process creation event
    even though the consumer registration is not, which makes this the pivot that shows whether
    the subscription has already fired. Management agents produce a small, repeating set of
    children under these parents; a command interpreter, a script host, an encoded PowerShell
    invocation, or a binary running from a user-writable directory does not belong to that set.
    The interval between the subscription's registration and the first such child bounds how long
    the persistence has been executing.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith:
          - '\WmiPrvSE.exe'
          - '\scrcons.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - User
  answer_sources:
  - process_creation
  - edr_console
- question: Did scrcons.exe or WmiPrvSE.exe load a script engine or scripting-host library on this host?
  context: >-
    An ActiveScriptEventConsumer runs its script body inside scrcons.exe, which has to load a
    script engine to do it — vbscript.dll or jscript.dll for the language itself, and
    wbemdisp.dll, wshom.ocx, or scrrun.dll for the object model the script reaches for. Those loads
    are recorded on the endpoint independently of the WMI activity channel, so they corroborate
    that a script consumer executed on hosts where the channel is not collected. wshom.ocx or
    scrrun.dll under scrcons.exe indicate the script reached for shell execution or file system
    objects rather than staying inside WMI.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\scrcons.exe'
          - '\WmiPrvSE.exe'
      selection_engine:
        ImageLoaded|endswith:
          - '\vbscript.dll'
          - '\jscript.dll'
          - '\jscript9.dll'
          - '\wbemdisp.dll'
          - '\wshom.ocx'
          - '\scrrun.dll'
      condition: selection and selection_engine
    fields:
      - Image
      - ImageLoaded
      - Signature
      - SignatureStatus
  answer_sources:
  - process_creation
  - edr_console
- question: Did WmiPrvSE.exe or scrcons.exe make outbound connections close to the alert, and to how many distinct destinations?
  context: >-
    A loader carried in a consumer generally has to reach somewhere — to fetch the stage it does
    not carry, or to report back once it runs. Connections from the WMI provider host or the
    script consumer host process, within a short window of the subscription activity, tie the
    persistence to a remote endpoint. The count of distinct destinations separates a single fetch
    from repeated check-ins, and a spread of destinations across internal hosts points at WMI
    being used for lateral movement rather than local persistence. Payloads delivered over a
    named pipe rather than a socket leave no outbound connection at all, so an empty result does
    not rule out remote delivery.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\WmiPrvSE.exe'
          - '\scrcons.exe'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
  answer_sources:
  - network_connection
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Subscription registration is a step, not an outcome. Aggregating process activity on the host
    around the alert collapses agent telemetry into a few high-count rows and leaves novel
    parent-child pairs standing out at low counts, which is what reconnaissance, credential
    access, or a second persistence mechanism looks like next to a WMI registration. The interval
    between whatever preceded the registration and the registration itself is what establishes
    whether this was the operator's first action on the host or a late one.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Was there a change ticket, maintenance window, or agent deployment that accounts for this WMI subscription?
  context: >-
    Persistence mechanisms are the class of change most organizations require a ticket for, and
    WMI subscriptions in particular arrive almost exclusively through product deployments rather
    than ad-hoc work. A corresponding ticket, or a monitoring or backup agent rollout scheduled
    for this window, closes the alert quickly. Absence of one on a host that is not part of a
    rollout leaves the registration unaccounted for.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: Does an administrator or the owning team recall registering this WMI subscription?
  context: >-
    Direct confirmation from the person or team behind the activity is often the fastest path to
    a determination. Because subscription registration runs as SYSTEM, the account on the event
    rarely names anyone — ask the team that owns the host and the team that owns any management
    agent installed on it. If someone confirms it, get what the consumer is meant to do and what
    filter is meant to trigger it, and compare that against the decoded payload.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: Does the timing of this registration align with normal work hours and maintenance windows?
  context: >-
    Agent deployments that register WMI subscriptions run on a schedule and land in a maintenance
    window or during a rollout. A subscription registered outside of both, on a host with no
    deployment activity around it, is unaccounted for on timing alone. Check the host's local time
    rather than the collection timestamp, and check whether an automated job was scheduled to run
    at this point.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - asset_inventory
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    Operators rarely rely on a single persistence mechanism. After registering a WMI subscription,
    a common next step is a backup foothold through a different technique — a scheduled task, a
    service, a registry Run key, or a BITS job. Several persistence installations inside the same
    window point at intentional stacking rather than isolated administrative action, and each one
    found is a separate object that has to be removed during eradication.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Were files dropped to persistence locations such as Startup folders or scheduled-task definitions on this host?
  context: >-
    WMI subscription persistence writes nothing to disk, which is the point of it — but an
    operator who used it once often also takes a path that does. Dropping an executable or script
    into a Startup folder, or writing a scheduled-task XML definition directly, achieves
    persistence without running any of the usual command-line tools. File event monitoring
    captures those drops even when the tooling evidence is absent.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Do permanent WMI event subscriptions with this consumer profile appear across the fleet, or only on this host?
  context: >-
    This is the discriminator that separates a management agent from an operator. Deployment,
    inventory, and backup products register the same consumer names, in the same namespace, on
    every host they manage, and they do it repeatedly over time — a handful of recurring names
    across many hosts is what a product looks like. A subscription that appears on one host, or on
    a small unrelated set of hosts inside a short window, has no fleet pattern behind it. Consumer
    names that are randomized, generic, or that imitate a product name while matching nothing
    deployed belong in the second group. Use the recurring CONSUMER values this returns as the
    allowlist for
    future alerts on this rule, and remember that hosts not shipping the WMI activity channel
    contribute nothing here regardless of what is registered on them.
  range: -30d
  query: |
    aggregation: true
    logsource:
      category: wmi
      product: windows
    detection:
      selection:
        EventID: 5861
      condition: selection
    fields:
      - winlog.user_data.CONSUMER
      - host.name
  answer_sources:
  - organizational_knowledge
  - asset_inventory
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Persistence is usually installed after access is already established, so earlier detections on
    the same host frequently name how the operator arrived — remote execution, credential access,
    or defense tampering. A subscription registered remotely over DCOM may leave its precursor on
    a different host entirely, so an empty result here narrows the question to how this host was
    reached rather than closing it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
