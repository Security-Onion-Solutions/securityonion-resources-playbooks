name: Audio Capture via SoundRecorder
id: e327d5b6-3d3e-4276-bff1-15a298ea540c
description: |
  Detects SoundRecorder.exe launched with the /FILE argument, which directs the built-in Windows audio
  recorder to capture microphone audio to a file path supplied on the command line. Legitimately this is a
  user manually recording audio; abused, it is a hands-on or scripted collection step that captures
  conversations or ambient audio and stages the resulting file for later exfiltration. Investigation should
  confirm the recording target path, establish whether the user/host normally records audio, and check what
  happened to the captured file afterward.
type: detection
detection_id: 83865853-59aa-449e-9600-74b9d89a6d6e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Did SoundRecorder.exe run with the /FILE argument that writes captured audio to a file?
  context: Confirm the alert is a true positive by reviewing the exact command line and process details. The
    rule fires when the recorder binary is invoked with /FILE, which names the output file the captured audio
    is written to. Read that path now — it is the artifact you will track through the rest of the investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to record audio with the built-in recorder?
  context: Legitimate audio capture by a user is the expected benign case for this rule. Knowing whether this
    person's role and this host's function involve recording audio (training, support calls, conferencing) is
    often the fastest way to separate routine use from collection activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What output file path and recording options did the SoundRecorder command line specify?
  context: The full command line reveals where the captured audio was written and any duration or device
    options passed alongside /FILE. Decode the output path — a temp, public, or hidden directory is more
    consistent with staging for collection than a user's own documents folder.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: /FILE
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Did this exact SoundRecorder.exe instance or a child it spawned write the audio file to disk, since the microphone/audio-API engagement itself cannot be observed?
  context: Windows routes audio capture through the multimedia and audio-runtime libraries (winmm.dll,
    avrt.dll, audioses.dll), but there is no process-level telemetry for that engagement on this platform —
    a zero result here is not evidence the microphone stayed idle. The file this specific process instance
    or its children wrote is the observable proxy — an output file confirms the capture completed even
    though the underlying audio-API call stays invisible.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What audio files did the recorder write, and to which directory?
  context: The captured audio lands as a file on disk. Reviewing the files the recorder created confirms the
    output target and reveals whether it was written to a user media folder (more consistent with legitimate
    use) or to a temp/public/hidden directory (more consistent with staging for later exfiltration).
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: What files did the recorder touch around the capture, and do they look like a single recording or
    bulk collection?
  context: The files the recorder created or read reveal the scope of what was captured — a single audio file
    in a media folder, or multiple files and broad output suggesting repeated or automated capture. The scope
    of targeted data determines the severity of potential data loss.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: Was the captured audio file moved, copied, or staged elsewhere after it was recorded?
  context: Collection typically ends with the captured data being moved to a staging location or exfiltrated.
    Checking for file events on the recorded audio after creation reveals whether it stayed in place or was
    moved toward a staging path, removable media, or a location used for outbound transfer.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process spawned SoundRecorder.exe and is that parent chain expected?
  context: The parent process reveals how the recorder was launched. Interactive launch from explorer.exe fits
    a user manually recording, while a parent like cmd.exe, powershell.exe, wscript.exe, or a remote-access
    tool points to scripted or operator-driven capture.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did SoundRecorder.exe spawn afterward?
  context: The processes spawned by the recorder reveal post-capture handling. Legitimate recording rarely
    spawns children; follow-on processes such as cmd.exe, powershell.exe, or archive/transfer tools point to
    automated staging or exfiltration of the captured audio.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run SoundRecorder.exe?
  context: A recorder that has never run on this host is more suspicious than one that runs regularly. Zero or
    very low historical counts over the trailing window indicate first-time or rare execution.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously recorded audio with /FILE, what parents and users drove it, and does
    this alert fit that pattern?
  context: Even a benign tool can be abused. The query mirrors the rule's selection scoped to this host, so the
    resulting parent/user distribution reflects how this specific recording pattern has historically run here.
    A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \SoundRecorder.exe
        CommandLine|contains: /FILE
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts recorded audio with /FILE in the past week, and does the distribution look like
    automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this
    recording pattern rather than generic use of the binary. Many hosts firing the same pattern points to
    scripted deployment; one host or a small unrelated set points to manual operator activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \SoundRecorder.exe
        CommandLine|contains: /FILE
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \SoundRecorder.exe
        CommandLine|contains: /FILE
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \SoundRecorder.exe
        CommandLine|contains: /FILE
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple
    endpoints. If the same user drove similar activity on other hosts, the scope of the collection effort may
    be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \SoundRecorder.exe
        CommandLine|contains: /FILE
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate
    context: what led to the recording, what happened after, and whether it is part of a larger collection
    sequence. Look for reconnaissance, credential access, or data staging.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — reconnaissance, credential access, or other collection steps
    — may reveal the attack stages that preceded the recording and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
