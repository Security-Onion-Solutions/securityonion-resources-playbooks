name: Potential ShellDispatch.DLL Sideloading
id: 54550fda-a907-482d-92c3-bc0d8d68cbae
description: |
  Detects the Nullsoft installer plug-in ShellDispatch.dll being loaded from a location outside the
  temporary directories where legitimate installers stage it. ShellDispatch.dll exports a
  RunDll_ShellExecuteW callback that rundll32.exe can invoke to launch arbitrary programs, so the DLL
  becomes a proxy-execution vector when it is placed in and loaded from a persistent or user-writable
  directory. Legitimate use is normally confined to short-lived installer runs that drop the DLL under a
  user's AppData\Local\Temp or Windows\Temp and delete it immediately; a load from any other path should
  be investigated to determine which process loaded the DLL, what it was used to execute, whether the DLL
  is signed, and whether it is still present on disk.
type: detection
detection_id: 844f8eb2-610b-42c8-89a4-47596e089663
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the loaded module match what this rule detects — path, signature, and loading process?
  context: Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded) and the
    process that loaded it against the rule's criteria. The rule fires only when ShellDispatch.dll is
    loaded from a path that is NOT under a user's AppData\Local\Temp and NOT under Windows\Temp, because
    legitimate installer use is confined to those temporary locations. A load from a persistent or
    user-writable directory is the pattern of interest. DLL loads carry a hash and signing status on the
    load event itself.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this user and host expected to load this DLL through this process?
  context: Legitimate installer activity can load ShellDispatch.dll, and some applications are expected to
    load DLLs from non-standard locations (developer tools, packaging utilities). Knowing whether the user
    role and host function are consistent with running an installer or a rundll32-style loader is often the
    fastest path to distinguishing a benign install from proxy execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What was the full command line of the process that loaded this DLL, and what did it execute?
  context: The loading process's command line reveals how the DLL was used. ShellDispatch.dll's
    RunDll_ShellExecuteW callback is invoked through rundll32.exe (for example, rundll32 ShellDispatch.dll,
    RunDll_ShellExecute open <target>), so the command line names the program the DLL was used to launch.
    Decode any flags, paths, or target executables. This query returns all executions of the loading binary
    on this host within the window, which for multi-step loaders may span several invocations.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What other DLLs or modules did this process load, and are any from non-canonical paths or unsigned?
  context: 'The full set of modules a process loads gives context beyond the single flagged DLL. Look for:
    (1) additional DLLs from Temp, AppData, ProgramData, or Public — a side-loading pattern; (2) unsigned
    modules in directories where signed ones are expected; (3) system DLL names loaded from non-system paths
    — search-order hijacking; (4) modules the loading process does not normally load. A ShellDispatch.dll
    sideload is frequently accompanied by other staged modules from the same directory.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: What is the signing status, hash, and reputation of the loaded ShellDispatch.dll?
  context: Module reputation distinguishes a benign staged plug-in from a side-loaded malicious one. A
    genuinely signed copy loaded from an unexpected location may still be an installer artifact; an unsigned
    copy, or one whose signer does not match the expected Nullsoft/installer vendor, is a masquerading
    pattern. Use the hash to pivot against threat intelligence, and note that a copy downloaded from the
    internet may carry a mark-of-the-web tag that is only observable through file-system or endpoint tooling,
    not the load event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Hashes
      - Signature
      - Signed
      - SignatureStatus
- question: What process spawned the loader, and is that parent chain expected?
  context: The parent process reveals how the loader was invoked. A ShellDispatch.dll load driven by a
    legitimate installer typically descends from a setup executable or a browser download folder; a load
    driven from an unexpected parent (a script host, an Office application, a remote-access tool) points
    toward proxy execution rather than installation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Is the ShellDispatch.dll file still on disk for analysis?
  context: The plug-in is normally deleted immediately after an installer uses it, so a copy that persists is
    itself notable. If the file is still present, it enables hash lookups, signature review, and content
    analysis, and lets an analyst check for a downloaded-file marker. This query correlates file writes to the
    loading process and its direct children by process lineage.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has ShellDispatch.dll been loaded on this host before, and under which processes?
  context: A first-time module load on a host is a stronger anomaly than a recurring one. If the same DLL has
    been loaded from the same location by the same process repeatedly, the current load is more likely routine
    installer behavior. If this is the first occurrence, or the DLL has previously loaded only from the
    expected temporary installer paths, this load from a different path is anomalous. Known-safe DLL
    directories in the environment inform how to read the result.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Is ShellDispatch.dll being loaded on other hosts, and under which processes?
  context: Cross-host correlation surfaces deployment scope. The DLL loaded on a single host may be a
    localized event; the same DLL loading across multiple hosts suggests coordinated distribution or a shared
    deployment mechanism. Pay attention to the variety of loading processes — a single expected installer
    parent is benign, while loads under unrelated processes on other hosts suggest wider abuse.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Were registry values that redirect DLL loading or establish persistence modified on this host around the alert?
  context: DLL hijacking is sometimes backed by registry changes that redirect module resolution or ensure the
    loader runs again — COM InprocServer32 entries pointing at a planted DLL, Image File Execution Options,
    KnownDLLs edits, or Run/RunOnce keys. Correlating registry modifications with the DLL load helps determine
    whether this is a one-off proxy execution or a configured persistence mechanism. Value data is present on
    most registry modifications but absent for binary or empty values.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\InprocServer32'
          - '\Image File Execution Options\'
          - '\KnownDLLs'
          - '\CurrentVersion\Run'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity in the minutes around the load reveals the
    immediate context: what dropped or launched the DLL, what ran afterward, and whether the load is one step
    in a longer sequence. The correlation window between a DLL being staged, any registry change, and the
    module load is what ties these events together.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or a download of the
    staging tool — may reveal the stages that preceded this load and help reconstruct the timeline. Proxy
    execution through a planted DLL is often a mid-chain step rather than the initial access.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was there a change ticket, maintenance window, or documented approval for this software installation or action?
  context: Many organizations require change records for software deployment and system changes. A
    corresponding ticket or an active maintenance window suggests authorized installer activity; the absence
    of one when policy requires it suggests the load was unauthorized. This check can quickly close a false
    positive or escalate a true positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the user or administrator recall running the software or action that loaded this DLL?
  context: Direct confirmation from the person behind the account is often the fastest path to determining
    legitimacy. If the user does not recall installing or running anything that would load this plug-in, their
    session may be compromised or the activity may be automated. If they do recall it, capture what they were
    installing or running and why.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this activity align with normal work hours and maintenance windows?
  context: Legitimate software installation typically occurs during business hours or scheduled maintenance
    windows. A DLL load driven from a non-standard path outside those windows — for instance overnight or on a
    weekend with no documented change — is more notable than the same activity during a planned deployment.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is loading this DLL from this location consistent with how your organization normally deploys software?
  context: Organizations typically deploy software through managed tooling that stages files in standard
    program directories. A plug-in loaded from a user-writable or temporary-adjacent path outside the managed
    process may indicate an attacker bypassing normal tooling, or an admin taking a shortcut. Understanding the
    normal deployment path helps distinguish the two.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were other process-based persistence mechanisms installed on this host?
  context: Attackers rarely rely on a single persistence mechanism. After establishing one foothold, they
    commonly install backups using different techniques — scheduled tasks, services, registry Run keys, BITS
    jobs, or WMI subscriptions. Multiple persistence installations in the same timeframe indicate intentional
    stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations such as the Startup folder or scheduled-task definition paths on this host?
  context: File-based persistence bypasses command-line detection entirely. Dropping an executable or script
    into a Startup folder or a path referenced by a registry Run key achieves persistence without running
    schtasks, sc, or reg. File-event monitoring captures these drops even when standard persistence tools are
    avoided, and a planted DLL is often paired with such a drop.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
