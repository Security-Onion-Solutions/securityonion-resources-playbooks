name: VHD Image Download Via Browser
id: dd7b80a3-828d-401c-b829-300e448f10fa
description: |
  Detects a web browser process (Chrome, Edge, Firefox, and other common browsers) creating a
  virtual hard disk file (.vhd or .vhdx) on disk. Mountable disk images can encapsulate executables,
  scripts, or shortcut files inside a container that bypasses mark-of-the-web tagging and some content
  scanning, which is why they appear in malware delivery; they are also created legitimately by
  virtualization, backup, and system-imaging workflows. Investigate whether the download was
  user-initiated and expected, what the image contains once mounted, and whether any payload from it
  executed on the host.
type: detection
detection_id: 8468111a-ef07-4654-903b-b863a80bbc95
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Did a browser process create the .vhd/.vhdx file named in this alert?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the
    exact file path, the operation performed, and that the writing process is one of the listed browser
    executables against the rule's detection criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to download virtual hard disk files with a browser?
  context: Legitimate downloads of .vhd/.vhdx files trigger this detection, and virtualization, backup,
    or imaging staff may retrieve them routinely. Knowing whether the user role and host function line
    up with pulling a mountable disk image is often the fastest way to separate a true positive from a
    routine operation. When the writer is a machine or service account, judge by the host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the .vhd/.vhdx file still on disk, or was it deleted or renamed after the alert?
  context: The file's post-alert lifecycle drives both urgency and next steps. An image still on disk
    can be retrieved, hashed, and mounted for analysis; a file deleted seconds after creation suggests
    anti-forensic cleanup or a self-deleting dropper and shifts the investigation to what executed in
    between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What does the downloaded virtual hard disk contain when mounted?
  context: A .vhd/.vhdx is a mountable disk image that can carry executables, scripts, or shortcut files
    inside a container, which lets the contents evade mark-of-the-web tagging and some scanning. Mount
    the image in a safe environment and inspect what it holds, checking for obfuscated strings, embedded
    URLs, and known malicious file patterns; the file-write event itself carries only the container, not
    its contents.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What other files did the browser process write or delete around the alert?
  context: A process that drops one suspicious file often drops several — a dropper unpacking components,
    a tool staging output, or a delivery step writing further payloads. Browsers are high-volume writers,
    so volume alone is not suspicion; look at WHERE the writes land (user-writable, Startup, Temp,
    ProgramData) and which extensions accompany the disk image.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other .vhd/.vhdx files have been written on this host recently, and by which processes?
  context: Virtual hard disk downloads are uncommon on most endpoints. Enumerating recent .vhd/.vhdx
    writes on this host, grouped by writing process, reveals whether mountable images arrive regularly
    here (a virtualization or backup workflow) or whether this is a first appearance — and which other
    processes, beyond browsers, are producing them.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '.vhd'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did the download complete, or did the browser write only a partial or temporary file?
  context: Browsers commonly write an in-progress download under a temporary name (.crdownload, .part,
    .tmp) and rename it to the final name only on completion, and network errors or blocked URLs can
    abort a transfer partway. Confirming that a fully materialized disk image exists — not just a
    partial fragment — establishes whether delivery actually succeeded.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: If a payload from the download was executed, what is its hash and is it known to threat intelligence?
  context: The hash needed for a reputation lookup or sandbox detonation is recorded when a payload runs,
    not when the file is written — file-creation events carry no hash in this telemetry. This query
    returns the processes the browser and the shell that launched it spawned, with their executable
    hashes. Note that a disk image is typically mounted before its contents run, so payload execution may
    occur later from a mounted volume rather than as a direct browser child; if nothing relevant appears,
    retrieve the file from its on-disk path and hash it manually.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection_children
    fields:
      - Image
      - Hashes
- question: When this host has previously produced a browser-written virtual hard disk, what programs and
    users normally drive it, and does this alert fit that pattern?
  context: Even routine browser activity can be abused. The query mirrors the rule's selection structure
    scoped to this host, so the resulting program and user distribution reflects how this specific firing
    pattern (a browser writing a .vhd/.vhdx), not generic browser usage, has historically run here.
    Deviations — a browser executable that has never written one before, or an unexpected user account —
    are the anomaly worth chasing; file events carry no parent lineage, so pivot to the browser's
    process-creation event if lineage matters.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - \brave.exe
        - \chrome.exe
        - \firefox.exe
        - \iexplore.exe
        - \maxthon.exe
        - \MicrosoftEdge.exe
        - \msedge.exe
        - \msedgewebview2.exe
        - \opera.exe
        - \safari.exe
        - \seamonkey.exe
        - \vivaldi.exe
        - \whale.exe
        TargetFilename|contains: .vhd
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts written virtual hard disk files via a browser in the past week, and does
    the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of the firing pattern (a browser writing a .vhd/.vhdx), not generic browser usage.
    Many hosts producing the same pattern points to scripted deployment or a vendor workflow; one host
    or a small unrelated set points to manual activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - \brave.exe
        - \chrome.exe
        - \firefox.exe
        - \iexplore.exe
        - \maxthon.exe
        - \MicrosoftEdge.exe
        - \msedge.exe
        - \msedgewebview2.exe
        - \opera.exe
        - \safari.exe
        - \seamonkey.exe
        - \vivaldi.exe
        - \whale.exe
        TargetFilename|contains: .vhd
      condition: selection
    fields:
    - host.name
- question: Has this user previously downloaded virtual hard disk files via a browser, and does that
    history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user, so the result is the
    user's 90-day history of the specific firing pattern (a browser writing a .vhd/.vhdx), not generic
    browser use, aggregated by host. A user who has never produced this pattern is more notable than one
    who does so regularly; weigh the count against the user's role and typical toolset.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - \brave.exe
        - \chrome.exe
        - \firefox.exe
        - \iexplore.exe
        - \maxthon.exe
        - \MicrosoftEdge.exe
        - \msedge.exe
        - \msedgewebview2.exe
        - \opera.exe
        - \safari.exe
        - \seamonkey.exe
        - \vivaldi.exe
        - \whale.exe
        TargetFilename|contains: .vhd
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this program historically driven browser-written virtual hard disks on this host
    or across the environment, or is the program new for this activity?
  context: When the alert fires under a service or machine account, user identity does not attribute
    behavior; the meaningful pivot is the launch mechanism. The query mirrors the rule's selection
    structure scoped to the alerting program, so the result is the 90-day history of this program
    driving this specific pattern. A new or rare program for this pattern is the deviation worth chasing;
    a program already accounting for many prior events is a vendor or system workflow.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - \brave.exe
        - \chrome.exe
        - \firefox.exe
        - \iexplore.exe
        - \maxthon.exe
        - \MicrosoftEdge.exe
        - \msedge.exe
        - \msedgewebview2.exe
        - \opera.exe
        - \safari.exe
        - \seamonkey.exe
        - \vivaldi.exe
        - \whale.exe
        TargetFilename|contains: .vhd
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning
    multiple endpoints. If the same user triggered similar activity on several hosts, the scope of the
    operation may be larger than a single download.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same program-driven pattern fire on other hosts in the same window, or is the
    activity isolated to this host?
  context: Under a service or machine account, asking what else the user did across the network returns
    agent-telemetry noise. The meaningful question is whether the same launch mechanism fired
    elsewhere, so the query mirrors the rule's selection structure scoped to the alerting program,
    fleet-wide, in the alert window. Multiple hosts in the same window points to scheduled or pushed
    automation; a
    single host points to a host-local trigger.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - \brave.exe
        - \chrome.exe
        - \firefox.exe
        - \iexplore.exe
        - \maxthon.exe
        - \MicrosoftEdge.exe
        - \msedge.exe
        - \msedgewebview2.exe
        - \opera.exe
        - \safari.exe
        - \seamonkey.exe
        - \vivaldi.exe
        - \whale.exe
        TargetFilename|contains: .vhd
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate
    context: what led to this event, what happened after, and whether it is part of a larger sequence.
    Look for reconnaissance, privilege escalation, or persistence mechanisms in the surrounding process
    activity.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering,
    reconnaissance, credential access — may reveal the stages that preceded this event and help
    reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
