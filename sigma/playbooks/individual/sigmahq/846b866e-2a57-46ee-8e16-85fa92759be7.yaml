name: Exploited CVE-2020-10189 Zoho ManageEngine
id: ae085cd1-24fe-4f4c-a8a8-7b500d98102b
description: |
  Detects a child process launched by the ManageEngine Desktop Central Java service
  (a java.exe under DesktopCentral_Server\jre\bin\) where the child is one of cmd.exe,
  powershell.exe, pwsh.exe, bitsadmin.exe, systeminfo.exe, net.exe, net1.exe, reg.exe, or
  query.exe. Both criteria must match together: the parent path AND the child binary name.
  A Java application service is a long-running process that does not normally spawn command
  interpreters or discovery utilities, so this parent-child pairing is the post-exploitation
  evidence of CVE-2020-10189 — a Java deserialization remote code execution against Desktop
  Central builds earlier than 10.0.479, in which a serialized payload uploaded through a
  directory-traversal file-upload endpoint is deserialized by the server and runs as the
  privileged service account. The investigation should establish what the child command did,
  whether a payload was fetched to disk or a service installed, whether the server build
  predates the fix, and whether other application servers produced the same pattern.
type: detection
detection_id: 846b866e-2a57-46ee-8e16-85fa92759be7
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the alerting event show the ManageEngine Java service as the parent and one
    of the rule's command or discovery binaries as the child?
  context: The rule requires both criteria together — a parent whose path ends in
    DesktopCentral_Server\jre\bin\java.exe AND a child image ending in cmd.exe,
    powershell.exe, pwsh.exe, bitsadmin.exe, systeminfo.exe, net.exe, net1.exe, reg.exe, or
    query.exe. Confirm both before investing further time, and note which child binary fired,
    because an interpreter (cmd, powershell, pwsh) points at stager execution while a
    discovery utility (systeminfo, net, query, reg) points at enumeration already underway.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
  answer_sources:
  - alert
  - process_creation
- question: Is this host an application server running Desktop Central, and is the alerting
    account the service identity that runs it?
  context: The exploitation path runs code as the account hosting the Java service, so the
    alerting identity is normally a service or SYSTEM principal rather than a person. An
    interactive user account here suggests a different origin — a local administrator running
    tools from a shell that happens to descend from the service — and is worth separating
    from unauthenticated exploitation before proceeding.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What web request to the Desktop Central server triggered this execution?
  context: >-
    Exploitation of this deserialization flaw begins with an HTTP request to the
    application's own listener (8383/SSL by default) — a file upload carrying a
    directory-traversal path value that writes a serialized Java archive into the server's
    chart directory, followed by a request to the chart-rendering endpoint that deserializes
    it. The application's request logs are the record of that pair; look for the upload and
    render requests immediately preceding this process, the source IP behind them, and
    request bodies carrying Java serialization markers such as an rO0AB prefix. Elevated 4xx
    or 5xx counts from one client (more than about 5 in 5 minutes) around the same time
    indicate probing before the successful attempt.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - manual_review
  - edr_console
- question: Is the ManageEngine Java service expected to spawn this child, and what started
    the Java service itself?
  context: The Java service is a long-running process started by the service control manager
    at boot, so its own start time is typically hours or days before this alert and its
    command line names the Desktop Central server jar and options. A service parent that
    matches that description with an unexplained recent child is consistent with code being
    driven into an already-running service through its network listener rather than through
    anything local. A Java parent started by something other than the service control manager
    is a separate finding.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What Desktop Central build is this server running, and does it predate the
    CVE-2020-10189 fix?
  context: The file-upload restriction shipped in build 10.0.474 and the full remote code
    execution fix in build 10.0.479; builds below those remain exploitable without
    authentication. The build number is readable from the server's own configuration page and
    from the installation directory under the DesktopCentral_Server path. Confirming an
    unpatched build establishes that this execution path was reachable and identifies every
    other server on the same build as reachable too.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
  answer_sources:
  - asset_inventory
  - edr_console
- question: What other child processes did this same Java service instance spawn?
  context: Deserialization payloads commonly execute a short sequence rather than a single
    command — an interpreter to fetch a file, a transfer utility as a fallback, then
    enumeration or service installation. Listing every child of this exact service instance
    shows the full sequence driven through the listener. Look in particular for transfer
    tooling (bitsadmin, certutil), writes into temporary or public directories, and service
    creation via sc.exe.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Were other application servers hit by the same exploitation pattern?
  context: An unauthenticated remote code execution against an Internet-facing management
    product is usually exercised against every reachable instance, not one. Correlating this
    same detection across all hosts shows how many servers produced the pattern and which
    accounts it ran under, which sets the scope of the response and identifies additional
    servers needing the same build check.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - alert
- question: What modules did the Desktop Central Java service load around the time of this
    alert, and are any of them unsigned or unexpected for the service?
  context: A public-facing application under exploitation may load non-standard modules in
    addition to spawning processes, and the loaded-module record is the part of the chain
    that survives when the payload runs in memory rather than dropping to disk. Read the
    signer and signature status for coherence with the application vendor and the JRE rather
    than as a verdict — an unsigned or unrelated module loaded by the service process in this
    window is a distinct finding worth its own timeline entry. A module set that is stable
    against the service's normal load list points the analysis back at the process chain.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: DesktopCentral_Server\jre\bin\java.exe
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - process_creation
- question: Was the command encoded or obfuscated? What does it decode to?
  context: >-
    Stagers driven through this flaw are frequently plain-text download cradles rather than
    base64 — a Net.WebClient DownloadFile call fetching a batch file or DLL into a temporary
    directory, or a cmd /c wrapper around a transfer utility. If -EncodedCommand or -enc is
    present, decode the base64 and read what the payload actually does; if the command is
    already readable, identify the source URL, the local path it writes to, and what executes
    that file afterwards. Concatenation, backtick escaping, and caret escaping in a cmd
    wrapper serve the same purpose as encoding and should be resolved the same way.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: What specific registry key and value were modified, and is this a known
    persistence or evasion location?
  context: When the child is reg.exe, or when an interpreter child shells out to a registry
    write, the registry event carries the key path and value data as structured fields rather
    than as text to parse out of a command line. Run and RunOnce keys indicate persistence;
    keys under the Windows Defender policy paths indicate security tooling being weakened;
    service keys under CurrentControlSet indicate a loader being registered to start
    automatically. Read the signer columns for coherence with the key being written, never as
    a verdict.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - process_creation
- question: Did PowerShell script block logging capture the full script content?
  context: Event ID 4104 records the deobfuscated script content PowerShell actually
    executed, which is ground truth when the command line is encoded, concatenated, or
    truncated. For a download cradle it reveals the full URL, the destination path, and any
    follow-on execution the command line alone does not show. If PowerShell operational logs
    are not ingested in this environment, treat zero results as a visibility gap rather than
    evidence nothing ran, and decode the payload from the alerting command line directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
  answer_sources:
  - powershell_script_block
- question: Did the interpreter or transfer tooling on this host make outbound connections
    around the time of the alert?
  context: The stage that follows code execution on an exploited server is normally a fetch —
    an interpreter or a transfer utility pulling a loader, a batch file, or shellcode from an
    external host, sometimes over a non-standard port and sometimes over 443 to blend with
    normal traffic. Connections from these binaries on a server that otherwise only serves
    its own listener are worth resolving to a destination and a reputation. A second transfer
    to a different destination usually means a fallback path or a second payload rather than
    a retry.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tools:
        Image|endswith:
          - '\cmd.exe'
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\bitsadmin.exe'
          - '\certutil.exe'
          - '\net.exe'
      condition: selection and selection_tools
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - Initiated
  answer_sources:
  - network_connection
- question: Were PowerShell security controls bypassed or weakened before this execution?
  context: Download cradles routinely precede the payload fetch with an execution policy
    bypass, an AMSI patch, or a downgrade to PowerShell version 2 to avoid script block
    logging, and real-time monitoring is often disabled before a loader is written to disk.
    Finding these on the same host in the hour before the alert extends the timeline backward
    and identifies which telemetry to distrust for the rest of the investigation.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Did other reconnaissance commands run on this host around the same time?
  context: Four of the nine child binaries this rule matches are enumeration utilities, and
    an operator who has just obtained execution on a server typically runs several in quick
    succession to learn the host's role, domain membership, and logged-on sessions before
    choosing a next step. Three or more distinct discovery binaries inside 15 minutes on a
    server that runs none of them routinely is the pattern to look for; a single utility run
    by an administrator troubleshooting is not.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: Has this account previously produced this parent-child pattern, and does that
    history fit its role?
  context: The query mirrors the rule's criteria scoped to the alerting account, so the
    result is that account's 90-day history of the Java service spawning these specific
    binaries, aggregated by host — not generic use of cmd.exe or net.exe, which any account
    on a server produces constantly. Zero prior events means the account has never driven
    this pattern before. Weigh the count against what the account is for; a service identity
    with no history of spawning interpreters is a different finding from an administrator who
    does so weekly.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: DesktopCentral_Server\jre\bin\java.exe
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
        - \bitsadmin.exe
        - \systeminfo.exe
        - \net.exe
        - \net1.exe
        - \reg.exe
        - \query.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: Has the ManageEngine Java service historically driven this pattern on this host
    or across the environment, or is this new for that parent?
  context: 'This alert fires under whatever identity runs the application service, so account
    identity attributes little; the launch mechanism is the meaningful pivot. The query
    mirrors the rule''s criteria scoped to the alerting parent process, giving the 90-day
    history of that service driving these specific child binaries, aggregated by host. A
    parent that already accounts for thousands of prior events is product automation — some
    deployments do use the service to run scripted management actions. A parent with no such
    history is the deviation to chase.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: DesktopCentral_Server\jre\bin\java.exe
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
        - \bitsadmin.exe
        - \systeminfo.exe
        - \net.exe
        - \net1.exe
        - \reg.exe
        - \query.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did this account do across the environment around this time?
  context: Tracking the alerting account across all hosts in the alert window shows whether
    activity stayed on the exploited server or reached others, which is the difference between
    a single compromised application server and movement outward from it. If the account is a
    service or machine principal, this returns routine agent and service telemetry from every
    host it runs on; in that case read the count as background and rely on the parent-scoped
    view instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: Did this same parent-driven pattern fire on other hosts in the same window, or is
    the activity isolated to this host?
  context: 'Under a service identity, asking what the account did everywhere returns agent
    telemetry from every host it runs on. The precise question is whether the same launch
    mechanism fired elsewhere: the query mirrors the rule''s criteria scoped to the alerting
    parent process, fleet-wide, in the alert window. Several Desktop Central servers producing
    the pattern in the same window points at either a management action pushed from the
    product or the same exploit being run against each reachable instance — the request logs
    and build numbers separate those. A single host points at a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: DesktopCentral_Server\jre\bin\java.exe
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
        - \bitsadmin.exe
        - \systeminfo.exe
        - \net.exe
        - \net1.exe
        - \reg.exe
        - \query.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
