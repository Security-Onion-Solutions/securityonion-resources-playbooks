name: HackTool - QuarksPwDump Dump File
id: ef5bf9b7-4d09-47c2-bf02-ca24e497d8ca
description: |
  This rule detects a dump file written to the user Temp directory whose path contains both the
  \AppData\Local\Temp\SAM- prefix and the .dmp extension — the output pattern produced by the
  QuarksPwDump credential-dumping tool. The tool extracts local account password hashes from the SAM
  registry hive and writes them to disk for offline cracking, so this file is evidence that SAM-based
  credential access (T1003.002) has already run: the dump is the result, not the attempt. Confirm the
  writing process and its command line, determine whether the SAM, SYSTEM, and SECURITY hives were all
  captured, identify which local accounts are exposed, and check for follow-on execution or lateral
  movement using the recovered credentials. Legitimate causes are rare and generally limited to
  authorized penetration tests or forensic tooling; verify any such engagement before closing.
type: detection
detection_id: 847def9e-924d-4e90-b7c4-5f581395a2b4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the dump-file path and the process that wrote it match what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the
    exact file path against the rule's criteria — the name must contain both the \AppData\Local\Temp\SAM-
    prefix and the .dmp extension — along with the operation performed (created / renamed) and the
    responsible process. This name pattern is the on-disk signature of a SAM hive dump.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - file_event
- question: Is this user and host expected to produce SAM hive dumps in the Temp directory?
  context: Legitimate administrative activity can trigger many detections, but writing a SAM dump file
    is almost never routine. Knowing whether the user role and host function involve credential recovery
    or forensic work is often the fastest path to distinguishing an authorized action from theft. When
    the writing account is a machine or service account, judge by the responsible process and the host's
    role instead of the user name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this QuarksPwDump execution part of an authorized penetration test or red team engagement?
  context: Credential-dumping tools are used in authorized security assessments. Before investing
    investigation time, check whether a penetration test or red team exercise is currently active on this
    host or network segment. An authorized engagement with matching tool usage and timing resolves the
    alert without further analysis; the absence of one on a critical credential-access detection makes
    the remaining questions load-bearing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: What did the writing process invoke, and which hive-dump capability was used?
  context: The command line of the process that produced the dump reveals the specific action taken —
    whether the tool was pointed at the SAM hive alone or at SAM, SYSTEM, and SECURITY together, and
    whether it used direct registry access or a live-system technique. The captured hives determine
    the scope of exposed credentials. The dump event itself carries no command line, so this reads the
    triggering process's own execution record by its identifier.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Which credential stores were targeted, and were all three registry hives captured?
  context: SAM-based dumping recovers local account hashes, but offline extraction needs the SAM,
    SYSTEM, and (for cached secrets) SECURITY hives together. Check the command line for reg save,
    reg.exe save, or equivalent hive-export invocations against HKLM\SAM, HKLM\SYSTEM, and HKLM\SECURITY;
    all three being saved confirms credential-theft intent rather than a partial or interrupted attempt.
    Handle-level access to the hives (Security 4656 / cross-process handle telemetry) is not collected on
    this endpoint telemetry, so the command line and the resulting dump file are the primary evidence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - file_event
- question: What process launched the tool that wrote this dump file, and is that parent chain expected?
  context: The parent process reveals how the tool was invoked and whether the launch was interactive or
    programmatic. Legitimate credential recovery usually descends from an interactive administrative
    shell; parents such as web servers, Office applications, or scripting hosts point to exploitation or
    a malicious script. Known-good backup or forensic tooling in the parent chain is the main benign
    explanation to rule out. The dump event does not carry parent fields, so this reads the writer's own
    process record by its identifier.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What other files did the writing process create on this host?
  context: Credential-dumping tools leave characteristic artifacts beyond the primary dump — additional
    hive exports (SYSTEM-, SECURITY-), log or output files, and the tool binary itself. Enumerating the
    files created by the responsible process confirms execution and reveals the full breadth of activity
    even after the process has exited.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: Is the dump file still on disk, or was it deleted or renamed after the alert?
  context: The file's post-alert lifecycle drives both urgency and next steps. A dump still on disk can
    be retrieved, hashed, and examined to confirm the exposed accounts; a file deleted seconds after
    creation suggests anti-forensic cleanup after the hashes were exfiltrated and shifts the focus to
    what ran in between. Interpret the operation type to tell recovery from cleanup.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What other files did the responsible process write or delete around the alert?
  context: A process that dumps one hive often dumps several in quick succession — SAM, then SYSTEM, then
    SECURITY — and may stage or clean up output files. The breadth, paths, and extensions of the
    process's other file activity in the surrounding window distinguish a single artifact from a full
    hive-capture sequence and enumerate what else needs review. A short gap between the SAM and SYSTEM
    writes is the expected temporal pattern for this technique.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: What else has been written to the user Temp directory recently, and by which processes?
  context: The user Temp directory is where this technique stages its output, so co-located arrivals
    matter. Other recent writes here — additional SYSTEM- or SECURITY- hive dumps, the tool binary, or
    other staged payloads — reveal whether this is an isolated drop or a location under active use, and
    which other artifacts belong to the same activity. The aggregation groups by path and writing
    process so an unfamiliar writer across several files stands out.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\AppData\Local\Temp\'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Which accounts may be compromised, and do any have elevated privileges?
  context: The severity of a SAM dump depends on which local accounts it exposes. A local administrator
    hash enables reuse across every host sharing that credential; a service or standard account may need
    only monitoring. Cross-reference the exposed local accounts and the account that ran the tool against
    directory group memberships to size the required response and any password-reset scope.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - active_directory
  - organizational_knowledge
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound
    connections from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM),
    22 (SSH) -- in the hours after the event, with the originating process and account showing what drove
    each connection. Two limits are worth noting. Credentials cracked offline and replayed from another machine will not
    appear here (check logon events on suspected targets for the exposed accounts), and if host network
    telemetry is not collected, treat zero rows as a visibility gap rather than evidence no movement
    occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
  answer_sources:
  - network_connection
- question: Has this user produced this rule's SAM dump-file pattern before, and does that history fit
    their role?
  context: The query mirrors the rule's own selection scoped to this user, so the result is the user's
    90-day history of this specific dump-file pattern — not generic file activity — aggregated by host.
    A user who has never produced it is more concerning than one who does so regularly as part of
    sanctioned recovery work; weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains|all:
        - \AppData\Local\Temp\SAM-
        - .dmp
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Has the alerting program driven this dump-file pattern before on this host or across
    the environment, or is the program new for this activity?
  context: When the alert fires under a service or machine account, user identity does not attribute the
    behavior — the launch mechanism does. The query mirrors the rule's selection scoped to the alerting
    program, so the result is the 90-day history of that program producing this specific pattern,
    aggregated by host. A new or rare program for this pattern is the deviation worth chasing; a program
    that already accounts for many prior events is more likely vendor or system automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains|all:
        - \AppData\Local\Temp\SAM-
        - .dmp
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the credential access is
    isolated or part of a wider sequence. If the same user triggered related activity on multiple
    endpoints in the surrounding window, the scope of compromise may be larger than the alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  always_include: true
  answer_sources:
  - process_creation
- question: Did this same program-driven dump-file pattern fire on other hosts in the alert window, or is
    it isolated to this host?
  context: Under a service or machine account, asking what else the user did network-wide returns
    agent-telemetry noise. The meaningful question is whether the same launch mechanism produced this
    pattern elsewhere. The query mirrors the rule's selection scoped to the alerting program, fleet-wide,
    in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a
    single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains|all:
        - \AppData\Local\Temp\SAM-
        - .dmp
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the process activity around the dump reveals what
    led to it and what followed — the privilege escalation or interactive access needed to read the SAM
    hive, reconnaissance, or staging for exfiltration. Aggregating by process and parent collapses
    repetitive agent telemetry into high-count rows while novel parent-child pairs stand out at low
    counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: Reading the SAM hive requires SYSTEM or local-administrator rights, so earlier detections on
    the same host — privilege escalation, defense tampering, or reconnaissance — often reveal how the
    actor reached the point of dumping credentials and help reconstruct the timeline that led here.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
