name: PCRE.NET Package Image Load
id: 41caa31e-2856-4081-981f-d01db4ceb391
description: |
  Detects a process loading a module from a fixed, hash-named subdirectory under the user's %TEMP% folder
  (\AppData\Local\Temp\ba9ea7344a4a5f591d6e5dc32a13494b\). That directory is the extraction artifact of a specific
  build of the PCRE.NET regular-expression library, which unpacks a native support DLL to that path the first time it
  runs; several .NET reconnaissance and post-exploitation utilities embed that library, so the load can betray such a
  tool even when the parent binary has been renamed. The same load can also occur under a benign application that
  bundles the same PCRE.NET build, so the investigation should identify the loading process, confirm whether it is
  sanctioned software, and review the module's signature, hash, and the surrounding process activity.
type: detection
detection_id: 84b0a8f3-680b-4096-a45b-e9a89221727c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the loaded module path match what this rule detects?
  context: Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded) against the rule's
    criterion — a module loaded from the fixed hash-named subdirectory under the user temp folder. The code-signature
    status and hash of that module are examined in the module-analysis steps; here the goal is to verify the path
    itself matched rather than a partial or coincidental substring.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this user and host expected to run the process that loaded this module?
  context: Legitimate developer or administrative software can bundle the same regex library. Knowing whether the
    user role and host function are consistent with running a .NET tool that extracts native modules to the temp
    folder is often the fastest path to distinguishing sanctioned software from unauthorized tooling.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Are the files the loading process wrote — including the extracted native module — still on disk for analysis?
  context: The extracted native DLL and any other files the process staged in the temp directory enable deeper
    analysis (hash lookups, sandbox submission, content review) while they remain on disk. This correlates file
    activity to the loading process and its direct children by process lineage rather than by a hardcoded path so
    the pivot survives renamed or relocated payloads.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What modules did the loading process load, and are any from the temp folder, unsigned, or from other
    non-canonical paths?
  context: The full set of modules a process loads tells the operator's story when the parent binary alone is opaque.
    Look for native DLLs extracted to %TEMP%, AppData, or Public; .NET assemblies loaded from those directories
    (in-memory tooling); and system DLL names loaded from non-system paths (search-order hijacking). The PCRE.NET
    native DLL from the flagged directory is the anchor, but a single process often reveals more than one staged
    module.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For the flagged module and any other suspicious load, what is the signing status, hash, and threat-intel
    reputation?
  context: Module reputation distinguishes a routine third-party DLL from a side-loaded malicious one. A genuinely
    signed DLL loaded from an unexpected location may still be legitimate, while an unsigned or invalidly signed
    module carrying a system-style filename is a masquerading indicator. Hash lookups against threat intelligence
    surface known loaders. DLL load events carry the hash and signing status directly, so no execution pivot is
    needed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What is the full command line of the process that loaded this module, and what tool does it represent?
  context: The load event names the loading process but carries no command line. Pivoting to the process launch event
    reveals the invoked binary, its arguments, and its working directory, which together identify whether the loader
    is a recognized application or a reconnaissance utility. Encoded or obfuscated arguments and an execution
    directory outside expected locations sharpen the assessment.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: What process spawned the loading process, and is that parent chain expected?
  context: The parent process reveals how the tool was invoked. Legitimate usage often has predictable parent chains
    (explorer.exe for user actions, services.exe for services). Parents such as mshta.exe, wscript.exe, or an Office
    application point to script-driven or macro-driven launch rather than an interactive developer session.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Has this module been loaded on this host before, and by which processes?
  context: A first-time module load on a host is a stronger anomaly signal than a recurring one. If the same module
    has been loaded by the same process binary repeatedly over the past 90 days, this load is probably routine. If
    this is the first occurrence, or the module has only ever been loaded by unrelated processes, the current load
    is anomalous.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Does this host normally run the process that loaded this module?
  context: A process binary that has never been seen on a host is more suspicious than one that runs regularly. Zero
    or very low historical counts over the past 90 days indicate first-time or rare execution of the loading binary
    on this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously loaded a module from this directory, what programs and users normally drove
    that activity, and does the current alert fit that pattern?
  context: Even a tool-specific artifact can recur legitimately if sanctioned software bundles the same library. The
    query mirrors the rule's selection scoped to this host, so the resulting program and user distribution reflects
    which loading processes have historically driven this firing pattern here. A new loading executable, an
    unexpected user account, or a first-ever occurrence is the deviation worth chasing; image-load events carry no
    parent lineage, so pivot to the loading process's start event if lineage matters.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|contains: \AppData\Local\Temp\ba9ea7344a4a5f591d6e5dc32a13494b\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: What child processes did the loading process spawn afterward?
  context: The processes spawned by a tool reveal its actual impact. Reconnaissance and post-exploitation utilities
    often spawn cmd.exe, powershell.exe, or other native binaries for follow-on collection or lateral movement, so
    unexpected children scoped to this loading process point to the operator's next stage.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity in the minutes surrounding the load reveals what led
    to it and what followed, and whether it is part of a larger sequence. Aggregating by loading and parent binary
    collapses repetitive agent telemetry into high-count rows so novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts loaded a module from this directory in the past week, and does the cross-host
    distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this
    specific firing pattern. Many hosts loading from the same directory points to a bundled library shipped by
    sanctioned software; one host or a small unrelated set points to targeted operator activity. Use the host
    distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|contains: \AppData\Local\Temp\ba9ea7344a4a5f591d6e5dc32a13494b\
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal
    the attack stages that preceded this load and help reconstruct the full timeline. A tool that extracts this
    native module is frequently one step of a larger sequence rather than an isolated event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
