name: Suspicious CustomShellHost Execution
id: 6b40ade9-a7b9-4b3a-bf93-fd1a29f6dfbe
description: |
  Detects CustomShellHost.exe spawning a child process other than C:\Windows\explorer.exe. CustomShellHost.exe is a signed Microsoft binary used by custom shells in kiosk mode; by design it launches explorer.exe with /NoShellRegistrationCheck, so any other child is unexpected and can be a signed-binary proxy execution (T1216) used to run untrusted code under a trusted parent. Investigation should identify the spawned child, confirm it is not explorer.exe, determine the child's signature and on-disk location, and reconstruct what the child did and how CustomShellHost.exe itself was launched.
type: detection
detection_id: 84b14121-9d14-416e-800b-f3b829c5a14d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Did CustomShellHost.exe spawn a child process other than C:\Windows\explorer.exe?
  context: Confirm the alert is a true positive by reviewing the triggering event. The rule fires when a process whose ParentImage ends in \CustomShellHost.exe spawns any child whose Image is not exactly C:\Windows\explorer.exe. Verify the parent is genuinely CustomShellHost.exe and note the exact child Image and its path, since the child's identity drives the rest of the investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: Is this user and host expected to be running custom shell / kiosk-mode configurations?
  context: CustomShellHost.exe is unlikely to run on a normal workstation; it is associated with kiosk or custom-shell deployments. A host or user with no kiosk-mode role spawning non-explorer children from this binary is more suspicious than a configured kiosk endpoint.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What was CustomShellHost.exe's own command line, and what launched it?
  context: The parent's own process_creation event shows how CustomShellHost.exe was invoked and what spawned it. Legitimate kiosk use launches it as part of shell setup; an unexpected launcher (a script interpreter, a download tool, or a user-writable binary) points to proxy abuse. The -7d range is intentional because the parent may have started long before the alert.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Is the child process spawned by CustomShellHost.exe signed, and by whom?
  context: T1216 proxies execution of untrusted code through a signed Microsoft parent. The diagnostic transition is a Microsoft-signed parent launching an unsigned or third-party-signed child. Pull the child binary's signature and signer; an unsigned child, or one signed by an unexpected vendor, is the load-bearing signal that this is proxy execution rather than a misconfiguration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: What did the spawned child process do? Decode its full command line.
  context: The child's command line reveals the actual operational purpose proxied through CustomShellHost.exe. Decode any flags, encoded content, file paths, or URLs; download cradles, encoded PowerShell, or interpreter invocations indicate payload execution rather than benign shell setup.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What files did the spawned child process write to disk?
  context: Proxy execution frequently drops a follow-on payload, script, or configuration file. Reviewing files written by the child binary reveals staged tooling or persistence artifacts that the process_creation event alone does not show. Files written to user-writable or temporary locations are of particular interest.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - CommandLine
      - EventType
- question: What other child processes did CustomShellHost.exe spawn on this host?
  context: A compromised or abused parent often launches multiple tools in sequence. Seeing every child of CustomShellHost.exe on this host reveals the full scope of activity proxied through it, beyond the single child that triggered the alert.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other activity is associated with CustomShellHost.exe around the same time?
  context: Beyond child processes, the parent may correlate with file writes or network activity in the same window. Reviewing process activity tied to CustomShellHost.exe around the alert helps place the spawn in a broader sequence of actions.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has CustomShellHost.exe spawned this child binary on this host before?
  context: Some parent-child pairings are routine on configured kiosk hosts; a never-before-seen child binary launched from CustomShellHost.exe is a novel relationship. Zero or very low historical counts indicate first-time execution worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: Does this host normally run CustomShellHost.exe at all?
  context: CustomShellHost.exe is unlikely to run on standard workstations. A host with no prior history of this binary executing is more suspicious than a kiosk endpoint where it runs as part of shell setup. Zero or very low counts indicate first-time or rare execution.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \CustomShellHost.exe
      condition: selection
    fields:
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \CustomShellHost.exe
      filter_main_explorer:
        Image: C:\Windows\explorer.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \CustomShellHost.exe
      filter_main_explorer:
        Image: C:\Windows\explorer.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity on multiple hosts, the scope may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \CustomShellHost.exe
      filter_main_explorer:
        Image: C:\Windows\explorer.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Is this CustomShellHost.exe-to-child spawning pattern occurring on other hosts?
  context: The same parent-child relationship appearing on multiple hosts may indicate a campaign or a pushed configuration; a single occurrence is more likely targeted. Environment-wide comparison helps calibrate scope and severity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the attack stages that preceded this event and help reconstruct the timeline leading up to the proxied execution.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
