name: Potentially Suspicious GoogleUpdate Child Process
id: 60686ad2-accf-40ff-8b2a-c92d245d9252
description: |
  Detects a process whose parent is GoogleUpdate.exe and whose own image is not one of the
  expected Google updater children (setup.exe, chrome_updater.exe, chrome_installer.exe, or an
  executable under a Google path). The rule fires when the parent ends in \GoogleUpdate.exe AND
  none of the known-legitimate-child filters match. Legitimately, the Google updater spawns its
  own installer and Chrome maintenance helpers; an unexpected child such as cmd.exe, rundll32.exe,
  or a script host can indicate DLL side-loading into a trojanised or impersonated GoogleUpdate.exe
  used for persistence and execution. Investigate what the child process did, what spawned the
  updater itself, and whether the pairing is routine for this host and user.
type: detection
detection_id: 84b1ecf9-6eff-4004-bafb-bae5c0e251b2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Is the child of GoogleUpdate.exe one of the expected updater binaries, or an unexpected process?
  context: Confirm the alert is a true positive before investing time. The rule fires when GoogleUpdate.exe
    is the parent AND the child is not setup.exe, chrome_updater.exe, chrome_installer.exe, or an
    executable under a Google path. Review the child image and command line against those exclusions; a
    child like cmd.exe, rundll32.exe, or a script host is the pattern worth chasing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: Is this user and host expected to run GoogleUpdate maintenance that spawns this child process?
  context: Legitimate Google updater activity runs under service or user contexts on endpoints with Chrome
    installed. Knowing whether the host normally runs the Google updater stack, and whether the spawned
    child fits routine update behavior, is often the fastest way to separate a benign update from an
    impersonated updater.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did the child process do? Decode its command-line arguments.
  context: The full command line of the child reveals the specific action taken. Decode flags, file paths,
    URLs, and any encoded content. Spawned cmd.exe or rundll32.exe invocations are notable — a known
    side-loading path invokes rundll32.exe with url.dll FileProtocolHandler to launch arbitrary paths, and
    a batch dropper may run delete-and-restart and self-delete sequences from a hidden working directory.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What launched GoogleUpdate.exe itself, and is that launch chain expected?
  context: The updater's own parent and command line show how the updater instance was started. A genuine
    Google updater is launched by its scheduled task, service, or the Google update stack; an updater
    started by a service ImagePath that chains through rundll32.exe and url.dll, or relaunched from a
    ProgramData copy, points to an impersonated or side-loaded binary rather than the shipped updater.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: What other child processes did this GoogleUpdate.exe instance spawn?
  context: A compromised or impersonated updater often spawns several tools in sequence — a batch script,
    a command interpreter, a discovery utility, or a network-capable binary. Seeing every child of the
    same updater instance reveals the full scope of activity initiated through this execution chain rather
    than just the one child that triggered the alert.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other activity is associated with the GoogleUpdate.exe parent around the same time?
  context: Beyond spawning children, the updater process may have generated file writes or network
    connections in the same window. File activity under ProgramData or a download directory and outbound
    connections to non-standard ports can reveal payload staging or command-and-control associated with an
    impersonated updater.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does GoogleUpdate.exe normally spawn this child binary on this host?
  context: Some parent-child pairings are routine (the updater spawning its own installer and Chrome
    maintenance helpers) while others are anomalous (the updater spawning a command interpreter or script
    host). Historical frequency of this specific GoogleUpdate.exe-to-child pairing on this host distinguishes
    routine update behavior from a novel, suspicious spawn.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: Does this host normally run the child binary at all?
  context: A child binary that has never been seen on this host is more suspicious than one that runs
    regularly. Zero or very low historical counts indicate first-time or rare execution, which for a process
    spawned by the updater stack points to an unexpected addition rather than shipped update tooling.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \GoogleUpdate.exe
      filter_main_known_legit:
      - Image|contains: \Google
      - Image|endswith:
        - \setup.exe
        - chrome_updater.exe
        - chrome_installer.exe
      filter_main_image_null:
        Image: null
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \GoogleUpdate.exe
      filter_main_known_legit:
      - Image|contains: \Google
      - Image|endswith:
        - \setup.exe
        - chrome_updater.exe
        - chrome_installer.exe
      filter_main_image_null:
        Image: null
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did the firing user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning
    multiple endpoints. If the same user triggered similar activity on several hosts, the scope of the
    incident may be larger than this single updater spawn.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \GoogleUpdate.exe
      filter_main_known_legit:
      - Image|contains: \Google
      - Image|endswith:
        - \setup.exe
        - chrome_updater.exe
        - chrome_installer.exe
      filter_main_image_null:
        Image: null
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate
    context: what led to this event, what happened after, and whether it is part of a larger sequence. Look
    for reconnaissance, defense tampering, or persistence mechanisms near the updater spawn.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access — may
    reveal the stages that preceded this event and help reconstruct the timeline leading to the updater
    spawn.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Is this GoogleUpdate.exe-to-child spawning pattern occurring on other hosts?
  context: The same updater-to-child pairing appearing on multiple hosts may indicate a broader rollout of a
    trojanised installer or a multi-host operation. A single occurrence is more likely targeted or host-local.
    Environment-wide comparison helps calibrate scope.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
