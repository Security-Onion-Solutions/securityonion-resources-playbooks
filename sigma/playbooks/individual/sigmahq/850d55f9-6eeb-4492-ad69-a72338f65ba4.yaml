name: C# IL Code Compilation Via Ilasm.EXE
id: 0bb2e78c-83dd-4941-964b-82372f661307
description: |
  Detects ilasm.exe compiling C# intermediate (IL) code into an EXE or DLL, identified by an Image
  ending in \ilasm.exe (or OriginalFileName ilasm.exe) AND a command line containing ' /dll' or ' /exe'.
  ilasm.exe is a signed .NET Framework developer utility, so its execution proxies code compilation under
  a trusted binary; outside build and developer hosts this is a way to produce attacker tooling on the
  endpoint and bypass controls that key on unsigned compilers. Investigation should confirm the compile
  flags, identify the source IL and the output binary, determine what spawned ilasm.exe, and follow the
  compiled artifact to whether it was executed or made network connections.
type: detection
detection_id: 850d55f9-6eeb-4492-ad69-a72338f65ba4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Did ilasm.exe run with a /dll or /exe compile flag, and what source file was it pointed at?
  context: Confirm the alert is a true positive by reviewing the exact command line and process identity.
    The rule fires when the Image ends in \ilasm.exe (or OriginalFileName is ilasm.exe) AND the command
    line contains ' /dll' or ' /exe'. Read off the compile flag and the input path (typically a .txt or
    .il file) so later steps can follow the output binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to compile .NET code with developer utilities?
  context: ilasm.exe is legitimate on build servers, developer workstations, and CI/CD agents. On a host
    with no development role, or under a user who does not write or build code, IL compilation is a strong
    deviation worth chasing. Compare the user role and host function against the detected behavior.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What did this ilasm.exe invocation compile? Decode the full command line, including the source
    path and output binary.
  context: The full command line reveals the input IL file and the resulting EXE or DLL. ilasm.exe takes a
    source file (commonly .txt or .il) and an output target set by /exe or /dll; the output path may be set
    explicitly with /output or defaults next to the source. Decode the source and output locations so the
    compiled artifact can be tracked. This scopes to all ilasm.exe runs on the host within the window, which
    catches multi-step compile sequences.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned ilasm.exe, and is that parent chain expected for a compiler invocation?
  context: The parent reveals how the compile was launched. A developer IDE, build orchestrator, or shell
    on a build host is expected. Parents like an Office application, a script host (wscript.exe, mshta.exe),
    a browser, or a binary running from a user-writable directory suggest the compile was driven by
    delivered code rather than a developer.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What EXE or DLL files were written on this host around the time of the compile, and where do
    they live?
  context: ilasm.exe produces a new PE on disk. The chain for trusted-developer-utility proxy execution
    writes a payload and then runs it, often from a user-writable location such as %TEMP%, %APPDATA%, the
    public profile, or the recycle bin. Correlate file writes in the window with the output path decoded
    from the command line to locate the compiled binary and judge whether its directory is atypical.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith:
          - '.exe'
          - '.dll'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: Was the compiled output binary subsequently executed on this host?
  context: Compilation alone is preparation; execution of the output is the impact. After ilasm.exe writes
    an EXE or DLL, look for that binary launching as a process (for an EXE) or being loaded (for a DLL via
    rundll32.exe or regsvr32.exe). The query returns processes started by the same parent that ran
    ilasm.exe - the operator's shell typically launches the output next - plus any rundll32.exe or
    regsvr32.exe starts on the host. Pair each hit's command line with the decoded output path; a zero
    is expected if the artifact ran later, from a different session, or as an in-process load.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_sibling:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      selection_loader:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
      condition: selection_sibling or selection_loader
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: What child processes did ilasm.exe spawn afterward?
  context: ilasm.exe is a compiler and normally spawns nothing. Children such as cmd.exe, powershell.exe,
    rundll32.exe, regsvr32.exe, wscript.exe, or certutil.exe spawned by ilasm.exe point to scripted
    post-compilation activity rather than a routine build step.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did this host make outbound network connections shortly after the compile that are not to known
    update or build infrastructure?
  context: Trusted-developer-utility proxy execution frequently ends in outbound connections — the compiled
    payload beaconing or pulling additional stages. Review egress in the minutes after the compile and
    exclude routine system and update traffic. A connection to a rare or newly seen destination immediately
    after IL compilation ties the compiled artifact to command-and-control or staging.
  range: +30m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      filter_known:
        Image|endswith:
          - '\svchost.exe'
          - '\OneDrive.exe'
          - '\msedge.exe'
      condition: selection and not filter_known
    fields:
      - Image
      - DestinationIp
      - DestinationHostname
- question: Does this host normally run ilasm.exe?
  context: A compiler that has never run on a host, or runs only rarely, is more suspicious than one that
    appears regularly as part of a build pipeline. Zero or very low historical counts over the window
    indicate first-time or rare execution on this endpoint.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this ilasm.exe compile pattern, what parents and users
    normally drive it, and does the current alert fit?
  context: Even legitimate compilers get abused. The query mirrors the rule's selection (ilasm.exe with
    ' /dll' or ' /exe') scoped to this host, so the parent and user distribution reflects how this specific
    compile pattern has historically run here. A new parent process, an unexpected user account, or an
    unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \ilasm.exe
      - OriginalFileName: ilasm.exe
      selection_cli:
        CommandLine|contains:
        - ' /dll'
        - ' /exe'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \ilasm.exe
      - OriginalFileName: ilasm.exe
      selection_cli:
        CommandLine|contains:
        - ' /dll'
        - ' /exe'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \ilasm.exe
      - OriginalFileName: ilasm.exe
      selection_cli:
        CommandLine|contains:
        - ' /dll'
        - ' /exe'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated activity
    on multiple endpoints. If the same user drove similar compilation or follow-on activity elsewhere, the
    scope may be larger than this host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \ilasm.exe
      - OriginalFileName: ilasm.exe
      selection_cli:
        CommandLine|contains:
        - ' /dll'
        - ' /exe'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining surrounding activity reveals what led to the compile
    and what happened after — reconnaissance, privilege escalation, persistence, or data staging that gives
    broader context. Novel parent-child pairs at low counts stand out against high-count agent telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access — may
    reveal the attack stages that preceded the compile and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
