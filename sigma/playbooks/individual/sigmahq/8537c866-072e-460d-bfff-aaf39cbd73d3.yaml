name: Potentially Suspicious Inline JavaScript Execution via NodeJS Binary
id: 0aeba2c5-43a6-451a-9c53-53d5ba2943f2
description: |
  Detects node.exe (identified by Image name, OriginalFileName, or Product) running with a command line that contains all of
  the module/keyword markers http, execSync, spawn, fs, path, and zlib together. The rule fires only when the node.exe identity
  AND the full keyword set are present at once. Legitimate Node.js applications and developer tooling use these modules, so the
  combination alone is not malicious; the same inline-JavaScript pattern has also been used to run downloader and discovery code
  directly from the command line via node.exe -e while blending in with trusted Node.js usage. Investigation should confirm the
  exact inline code, identify what spawned node.exe, decode what the JavaScript actually does, and determine whether the user,
  host, and parent chain are consistent with sanctioned Node.js development or automation.
type: detection
detection_id: 8537c866-072e-460d-bfff-aaf39cbd73d3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the alerting node.exe command line contain all of the markers http, execSync, spawn, fs, path, and zlib together,
    and is the binary identified as node.exe by name, original filename, or product?
  context: Before investing investigation time, confirm the alert is a true positive. The rule requires both the node.exe identity
    (Image ending in node.exe, OriginalFileName node.exe, or Product Node.js) and every one of the six keyword markers in the
    command line at once. Review the exact command line and binary identity against those two criteria.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
      - Product
- question: Is this user and host expected to run Node.js with inline or module-loading JavaScript?
  context: Legitimate Node.js development, build tooling, and packaged Node.js applications routinely use these modules. Knowing
    whether the user role (developer, automation account, end user) and host function (workstation, build server, general
    endpoint) line up with sanctioned Node.js usage is often the fastest way to separate routine activity from an inline-script
    payload running on a host with no Node.js footprint.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly does the node.exe command line execute? Decode the inline JavaScript and the modules and arguments it
    references.
  context: The full command line reveals the specific action taken. Look for an -e or --eval flag carrying inline JavaScript, a
    -r preload module, or a script path, then read what the code does with the referenced modules — http for outbound requests,
    execSync/spawn for launching commands, fs/path for file access, and zlib for compression or decompression of staged data.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is the inline JavaScript encoded or obfuscated? What does it decode to, and what operation does the decoded content
    perform?
  context: Inline JavaScript passed to node.exe is frequently obfuscated to hide its purpose. Common encodings include base64
    string literals decoded at runtime, String.fromCharCode and char-code concatenation chains, hex escapes, and Buffer-based
    decoding. Reconstruct the readable script and identify the actual intent — outbound HTTP to a remote host, spawning of a
    secondary command interpreter, reading or staging local files, or compressing data before exfiltration. Iterate decoding
    until the payload is readable for multi-layer obfuscation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What library modules did this node.exe process load, and do any of them point to network, compression, or credential
    access beyond a normal application?
  context: Inline-JavaScript abuse pulls in supporting library modules at runtime, and the loaded-module list shows what the
    script is actually wired to do even when the command line is short or obfuscated. Network, compression, and cryptography or
    credential-store modules loaded by a node.exe instance with no legitimate application context indicate the script is set up
    for outbound communication, data staging, or browser-data access rather than ordinary development. If image-load events are
    not collected in this environment, treat zero results as a visibility gap rather than evidence nothing loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Image
- question: What process spawned this node.exe instance, and is that parent chain expected for Node.js execution?
  context: The parent process reveals how node.exe was invoked. Sanctioned usage commonly descends from a developer shell,
    explorer.exe, a build or packaging tool, or a service wrapper. A parent such as powershell.exe, cmd.exe, mshta.exe, a
    browser, or an Office application launching node.exe with inline JavaScript is a stronger indicator that the runtime was
    dropped and driven by another stage rather than run by the user.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did this node.exe instance spawn afterward?
  context: The processes spawned by the inline script reveal its actual impact. The execSync and spawn markers in the command
    line mean the script is set up to launch other commands. Look for follow-on cmd.exe, powershell.exe, certutil.exe, or
    network utilities that indicate downloading, discovery, persistence installation, or data staging after the initial
    execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run node.exe?
  context: A runtime that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low
    historical counts of node.exe on this host indicate first-time or rare execution, which on a general-purpose endpoint with
    no development role points toward a dropped runtime rather than sanctioned tooling.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this node.exe inline-JavaScript pattern, what parents and users normally drove
    it, and does the current alert fit that pattern?
  context: Even legitimately installed runtimes can be abused. The query mirrors the rule's selection structure scoped to this
    host, so the resulting parent and user distribution reflects how this specific firing pattern — node.exe with the full
    module-marker set — has historically run here, not generic node.exe usage. A new parent process, an unexpected user account,
    or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \node.exe
      - OriginalFileName: node.exe
      - Product: Node.js
      selection_cmd:
        CommandLine|contains|all:
        - http
        - execSync
        - spawn
        - fs
        - path
        - zlib
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this node.exe inline-JavaScript pattern in the past week, and does the cross-host distribution
    look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this
    specific firing pattern rather than generic node.exe usage. Many hosts firing the same pattern points to scripted
    deployment or packaged Node.js application rollout; one host or a small unrelated set points to manual operator activity.
    Use the host distribution and parent and binary consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \node.exe
      - OriginalFileName: node.exe
      - Product: Node.js
      selection_cmd:
        CommandLine|contains|all:
        - http
        - execSync
        - spawn
        - fs
        - path
        - zlib
      condition: all of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \node.exe
      - OriginalFileName: node.exe
      - Product: Node.js
      selection_cmd:
        CommandLine|contains|all:
        - http
        - execSync
        - spawn
        - fs
        - path
        - zlib
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \node.exe
      - OriginalFileName: node.exe
      - Product: Node.js
      selection_cmd:
        CommandLine|contains|all:
        - http
        - execSync
        - spawn
        - fs
        - path
        - zlib
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If
    the same user triggered similar Node.js or follow-on execution on multiple hosts, the scope of the activity may be larger
    than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \node.exe
      - OriginalFileName: node.exe
      - Product: Node.js
      selection_cmd:
        CommandLine|contains|all:
        - http
        - execSync
        - spawn
        - fs
        - path
        - zlib
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led to this node.exe execution
    and what followed it, and whether it is part of a larger sequence. Look for reconnaissance, the runtime and its modules
    being downloaded, persistence installation, or data staging in the surrounding window.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, a
    download cradle, or scripted persistence — may reveal the attack stages that preceded the node.exe execution and help
    reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
