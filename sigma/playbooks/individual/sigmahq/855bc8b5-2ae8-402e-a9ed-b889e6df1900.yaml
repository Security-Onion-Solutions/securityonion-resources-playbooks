name: Copy From Or To Admin Share Or Sysvol Folder
id: 1370ffb7-c010-4046-b91b-bc3abf3d22f2
description: |
  Detects a copy or move operation that references a hidden administrative share (a UNC path matching \\<host>\<share>$, e.g. C$ or ADMIN$) or the domain Sysvol folder. The rule fires when the command line targets such a path AND the activity runs through one of several tools: robocopy.exe or xcopy.exe, cmd.exe with a copy verb, or a PowerShell host (powershell.exe, powershell_ise.exe, pwsh.exe) using copy/move cmdlets or aliases (copy-item, cp, mv, move-item, mi). Hidden admin shares and Sysvol are routinely used by administrators for legitimate file distribution, but the same paths are abused for lateral tool transfer, data staging, and exfiltration. The investigation should determine which tool branch fired, what file or directory was copied and in which direction, which user and host initiated it, and whether the same pattern is spreading across the environment.
type: detection
detection_id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line reference an admin share or Sysvol path, and which copy tool branch fired?
  context: >-
    Confirm the alert is a true positive by reviewing the full command line. The rule fires when the command line
    contains either a hidden admin-share path (\\<host>\<share>$) or a \Sysvol\ path, AND the activity runs through
    either robocopy.exe or xcopy.exe, OR cmd.exe with a copy verb, OR a PowerShell host with a copy/move cmdlet or
    alias. Note which branch matched and the direction of the copy (reading from the share versus writing to it) —
    that branch and direction determine which downstream questions carry weight.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to copy files to or from admin shares or Sysvol?
  context: >-
    Administrators, backup jobs, and deployment tooling routinely copy to hidden shares and Sysvol. A copy initiated
    by an account or from a host with no administrative role is the deviation worth chasing. Knowing whether the user
    role and host function fit the detected behavior is often the fastest way to separate routine operations from
    lateral movement or staging.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this copy command do? Decode the source, destination, and direction of the transfer.
  context: >-
    The full command line reveals which path is the source and which is the destination, the file or wildcard being
    copied, and the recursion/mirror flags (robocopy /MIR /E, xcopy /S /E). Determine whether data is being pulled
    off a remote share to this host (collection) or pushed to a remote share (tool transfer or staging), and whether
    the target is C$/ADMIN$ on another machine or the local Sysvol replicated content.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Are the files referenced in the copy command still on disk for analysis?
  context: >-
    The paths parsed from the command line point to the copied or staged files. Checking whether they still exist on
    disk enables hash lookup, content review, and sandbox submission. Staged archives or transferred tools left on
    disk are direct evidence of the operation's intent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process spawned this copy tool and is that parent chain expected?
  context: >-
    The parent process reveals how the copy was invoked. Interactive admin use typically descends from explorer.exe
    or a console launched by a logged-on user; scripted distribution descends from a scheduler or management agent.
    Parents like wmic.exe, a remote-execution service, wscript.exe, or an Office application point to remote-triggered
    or scripted execution rather than a hands-on administrator.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Does this host normally run this copy tool against admin shares?
  context: >-
    A copy tool that has never been seen on this host, or is rarely run by this user, is more suspicious than one that
    runs on a regular schedule. Zero or very low historical counts indicate first-time or rare execution of the
    alerting binary here.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that copy activity, and does the current alert fit?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the parent/user distribution reflects how
    this specific admin-share/Sysvol copy pattern has historically run here — not generic use of the copy tools. A new
    parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_target:
        CommandLine|contains:
        - \\\\*\\*$
        - \Sysvol\
      selection_other_tools:
      - Image|endswith:
        - \robocopy.exe
        - \xcopy.exe
      - OriginalFileName:
        - robocopy.exe
        - XCOPY.EXE
      selection_cmd_img:
      - Image|endswith: \cmd.exe
      - OriginalFileName: Cmd.Exe
      selection_cmd_cli:
        CommandLine|contains: copy
      selection_pwsh_img:
      - Image|contains:
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - powershell_ise.exe
        - PowerShell.EXE
        - pwsh.dll
      selection_pwsh_cli:
        CommandLine|contains:
        - copy-item
        - 'copy '
        - 'cpi '
        - ' cp '
        - 'move '
        - ' move-item'
        - ' mi '
        - ' mv '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_target and (selection_other_tools or all of selection_cmd_* or all of selection_pwsh_*)) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_target:
        CommandLine|contains:
        - \\\\*\\*$
        - \Sysvol\
      selection_other_tools:
      - Image|endswith:
        - \robocopy.exe
        - \xcopy.exe
      - OriginalFileName:
        - robocopy.exe
        - XCOPY.EXE
      selection_cmd_img:
      - Image|endswith: \cmd.exe
      - OriginalFileName: Cmd.Exe
      selection_cmd_cli:
        CommandLine|contains: copy
      selection_pwsh_img:
      - Image|contains:
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - powershell_ise.exe
        - PowerShell.EXE
        - pwsh.dll
      selection_pwsh_cli:
        CommandLine|contains:
        - copy-item
        - 'copy '
        - 'cpi '
        - ' cp '
        - 'move '
        - ' move-item'
        - ' mi '
        - ' mv '
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_target and (selection_other_tools or all of selection_cmd_* or all of selection_pwsh_*)) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_target:
        CommandLine|contains:
        - \\\\*\\*$
        - \Sysvol\
      selection_other_tools:
      - Image|endswith:
        - \robocopy.exe
        - \xcopy.exe
      - OriginalFileName:
        - robocopy.exe
        - XCOPY.EXE
      selection_cmd_img:
      - Image|endswith: \cmd.exe
      - OriginalFileName: Cmd.Exe
      selection_cmd_cli:
        CommandLine|contains: copy
      selection_pwsh_img:
      - Image|contains:
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - powershell_ise.exe
        - PowerShell.EXE
        - pwsh.dll
      selection_pwsh_cli:
        CommandLine|contains:
        - copy-item
        - 'copy '
        - 'cpi '
        - ' cp '
        - 'move '
        - ' move-item'
        - ' mi '
        - ' mv '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_target and (selection_other_tools or all of selection_cmd_* or all of selection_pwsh_*)) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or staging spanning multiple endpoints. If
    the same user triggered similar copy or remote-access activity on several hosts in the same window, the scope of
    the operation is larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_target:
        CommandLine|contains:
        - \\\\*\\*$
        - \Sysvol\
      selection_other_tools:
      - Image|endswith:
        - \robocopy.exe
        - \xcopy.exe
      - OriginalFileName:
        - robocopy.exe
        - XCOPY.EXE
      selection_cmd_img:
      - Image|endswith: \cmd.exe
      - OriginalFileName: Cmd.Exe
      selection_cmd_cli:
        CommandLine|contains: copy
      selection_pwsh_img:
      - Image|contains:
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - powershell_ise.exe
        - PowerShell.EXE
        - pwsh.dll
      selection_pwsh_cli:
        CommandLine|contains:
        - copy-item
        - 'copy '
        - 'cpi '
        - ' cp '
        - 'move '
        - ' move-item'
        - ' mi '
        - ' mv '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_target and (selection_other_tools or all of selection_cmd_* or all of selection_pwsh_*)) and _pb_scope
    fields:
    - host.name
- question: Was the admin share actually accessed over SMB, and by which account and source host?
  context: >-
    Process-creation evidence shows the copy command but not the network-share access it performed. Share-access
    object-access records (network share access, event 5145) and the corresponding logon records (events 4624/4648)
    confirm whether the hidden admin share was opened over SMB, which account authenticated, and from which source
    address. First-time or off-hours access to ADMIN$/C$ by an account that does not normally administer the host is
    the lateral-movement signal. If security/share-access auditing is not enabled in this environment, treat zero
    results as a visibility gap rather than evidence nothing happened.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 5140
          - 5145
        ShareName|contains: $
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - SubjectUserName
      - IpAddress
      - ShareName
      - RelativeTargetName
- question: What host initiated the SMB connection to this share, and is it an expected administrative source?
  context: >-
    Admin-share copies traverse SMB. Identifying the originating host reveals whether the connection came from a known
    admin jump box, a routine deployment server, or an unexpected workstation. An attacker who compromised one host
    uses it as a pivot to reach others over 445/135.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 445
          - 135
          - 3389
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - SourceIp
      - DestinationPort
- question: What processes were spawned on this host shortly after the copy to or from the share?
  context: >-
    A copy to an admin share is usually a means to an end — staging a tool for execution or pulling data for
    collection. Processes that start shortly after the copy reveal whether a transferred binary was executed, a
    service or task was created, or further commands were run, exposing the operation's objective on this host.
  range: +30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - Image
- question: What files or directories were selected for collection or staging by this copy?
  context: >-
    The command-line arguments and the resulting file events reveal what data was targeted: specific file types,
    sensitive directories (finance, HR, source repositories), or broad recursive wildcards indicating bulk
    collection. The scope of targeted data determines the severity of potential data loss and which business units
    need to be notified.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Admin-share copies rarely happen in isolation. Earlier detections on the same host — reconnaissance, credential
    access, defense tampering, or remote-service creation — may reveal the attack stages that preceded the copy and
    help reconstruct the full timeline of the operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this
    admin-share/Sysvol copy pattern — not generic use of the copy tools. Many hosts firing the same pattern points to
    scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity.
    Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_target:
        CommandLine|contains:
        - \\\\*\\*$
        - \Sysvol\
      selection_other_tools:
      - Image|endswith:
        - \robocopy.exe
        - \xcopy.exe
      - OriginalFileName:
        - robocopy.exe
        - XCOPY.EXE
      selection_cmd_img:
      - Image|endswith: \cmd.exe
      - OriginalFileName: Cmd.Exe
      selection_cmd_cli:
        CommandLine|contains: copy
      selection_pwsh_img:
      - Image|contains:
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - powershell_ise.exe
        - PowerShell.EXE
        - pwsh.dll
      selection_pwsh_cli:
        CommandLine|contains:
        - copy-item
        - 'copy '
        - 'cpi '
        - ' cp '
        - 'move '
        - ' move-item'
        - ' mi '
        - ' mv '
      condition: selection_target and (selection_other_tools or all of selection_cmd_* or all of selection_pwsh_*)
    fields:
    - host.name
