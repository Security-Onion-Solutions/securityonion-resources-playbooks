name: Unsigned Image Loaded Into LSASS Process
id: a6fa6f37-2f73-4755-8c2e-6bff03cd3db3
description: |
  This detection fires when lsass.exe loads a module (DLL or EXE) that carries no valid code signature.
  LSASS holds every credential secret cached on the host in memory, so legitimate third-party code rarely
  loads into it; an unsigned module is consistent with credential-theft tooling that injects into or
  registers itself with LSASS -- a malicious Security Support Provider, an injected reflective DLL, or a
  driver used to bypass LSA protection. A small set of endpoint-security products legitimately load into
  LSASS, so confirm the module's signer and origin, determine how it came to be loaded, and check whether
  credential-dump artifacts or follow-on lateral movement accompanied it before escalating.
type: detection
detection_id: 857c8db3-c89b-42fb-882b-f681c7cf4da2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: 'Does the loaded module match what this rule detects: an unsigned DLL or EXE loaded by lsass.exe?'
  context: Confirm the alert is a true positive by reviewing the exact module path, its code-signature
    status, and that lsass.exe is the loading process. DLL loads carry signing status and a hash on the
    load event itself, so the signature verdict can be checked directly without pivoting to the file on
    disk.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - Signed
- question: Is this host expected to have third-party or unsigned modules loading into LSASS?
  context: Legitimate endpoint-security and authentication products occasionally load signed modules into
    LSASS, but unsigned modules there are rare on a normally-managed host. LSASS runs as SYSTEM, so the
    user context usually reflects the machine rather than an interactive operator; weigh the host's role
    and its installed security software instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What other modules did lsass.exe load around this time, and are any unsigned or from user-writable
    directories?
  context: The full set of modules loaded by LSASS in the surrounding window shows whether the unsigned
    load was isolated or one of several. Modules loaded from %TEMP%, AppData, ProgramData, or Public, or
    system-named DLLs loaded from non-system paths, point to side-loading or reflective injection rather
    than a normal driver or security package.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
- question: For the unsigned module loaded into LSASS, what is its hash, signer, and reputation?
  context: Module reputation separates a rare-but-legitimate third-party component from a side-loaded malicious
    one. An unsigned module with a system-style filename, or one whose hash matches known credential-dumping
    tooling, is the malicious case; a module signed by a recognised endpoint-security vendor is the common
    benign explanation. Use the hash for a threat-intelligence lookup.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signature
      - SignatureStatus
- question: Was LSASS memory accessed or dumped, and by what method?
  context: This rule points at LSASS memory as the credential target, which holds cached logon secrets,
    Kerberos tickets, and NTLM hashes. Determine whether the unsigned module read or dumped that memory
    and by what method -- a registered Security Support Provider, reflective injection, or a driver-based
    LSA-protection bypass. Cross-process handle access to LSASS (the classic full-access read) is not recorded
    on this telemetry, so absence of a handle-access event is a visibility gap, not evidence the memory
    was untouched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Has this specific module been loaded on this host before, and by which processes?
  context: A first-time module load on a host is a stronger anomaly than a recurring one. If the same module
    has loaded repeatedly under the same process binary over the past 90 days, it is more likely a stable
    third-party component; a first occurrence, or prior loads only under unrelated processes, marks the
    current load as anomalous.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: When this host has previously loaded an unsigned module into LSASS, what program and user
    contexts were involved, and does the current alert fit that pattern?
  context: This mirrors the rule's own detection scoped to this host, so the historical program and user
    distribution reflects how this specific pattern -- not generic module loading -- has fired here before.
    Expect the Image column to show lsass.exe itself under a system account; an unfamiliar account driving
    the load, or a pattern that has never fired on this host before, is the deviation worth chasing.
    Image-load events carry no parent lineage -- pivot to process-creation telemetry if lineage matters.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith: \lsass.exe
        Signed: 'false'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts loaded unsigned modules into LSASS in the past week, and does the spread look
    like a fleet-wide rollout or isolated activity?
  context: This counts the rule's firing pattern across all hosts with no host scope, giving the fleet-wide
    footprint rather than any single binary's usage. Many hosts loading the same unsigned module at once
    points to a pushed software or driver update -- often benign once the module is identified; one host
    or a small unrelated set points to targeted activity. Use the host spread together with module identity
    to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith: \lsass.exe
        Signed: 'false'
      condition: selection
    fields:
    - host.name
- question: Did lsass.exe spawn any child processes after the unsigned module loaded?
  context: LSASS legitimately spawns almost no child processes, so any command interpreter, script host,
    or utility launched with lsass.exe as the parent indicates code execution inside the LSASS context.
    Command shells, rundll32, or unknown binaries spawned here point to hands-on-keyboard activity following
    the load.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Around the alert, did any process call memory-write or APC injection APIs on this host?
  context: An unsigned module can reach LSASS through reflective injection, where another process writes
    the module into LSASS memory and starts it. Behavioral API telemetry records the injection side of
    that operation -- WriteProcessMemory, QueueUserAPC, and SetWindowsHookEx calls; filter the results
    for lsass.exe as the target. The read side (a process opening LSASS to scrape memory) is not captured
    on this telemetry, so its absence here does not rule out credential access.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        event.dataset: endpoint.events.api
        process.Ext.api.name:
          - WriteProcessMemory
          - QueueUserAPC
          - SetWindowsHookEx
      condition: selection
    fields:
      - Image
      - process.Ext.api.name
      - User
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. This returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB), 5985/5986 (WinRM), 22 (SSH) -- in the
    hours after the event, with the originating process and user for each. Two limits apply -- credentials exfiltrated
    and replayed from another machine will not appear here, so check logon activity for this account on
    suspected targets; and if network telemetry is not collected from this host, treat zero rows as a visibility
    gap rather than evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Which accounts may be compromised, and do any have elevated privileges?
  context: Compromise of LSASS memory exposes every credential cached on the host -- interactive and service-account
    logons, Kerberos tickets, and hashes. The severity depends on the privilege of those accounts -- domain-admin
    or broadly-scoped service credentials require escalation, while a single standard user may only need
    a password reset and monitoring. Cross-reference the accounts with recent logon sessions on this host
    against directory group membership.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were the LSA security-package, authentication-package, or LSA-protection registry values modified
    on this host recently?
  context: A durable way to force LSASS to load attacker code is to register a malicious Security Support
    Provider or authentication package under the LSA control key, or to disable LSA protection (RunAsPPL)
    so an unsigned module is allowed to load. Modifications to these values shortly before the load are
    a likely delivery mechanism. Value deletion is not observable on this telemetry, so focus on the modification
    history and on whether the referenced module resolves to the unsigned file.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - \Control\Lsa\Security Packages
          - \Control\Lsa\OSConfig\Security Packages
          - \Control\Lsa\Notification Packages
          - \Control\Lsa\RunAsPPL
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - User
- question: Was a memory dump of LSASS written to disk on this host around the time of the alert?
  context: Credential theft from LSASS commonly stages a memory dump on disk before extracting secrets
    offline, typically to %TEMP%, C:\Windows\Temp, or another writable path, and the write usually follows
    access within minutes. The file write carries no hash, so identify the writing process and pivot to
    its execution for the hash and command line. A dump file named for lsass is the common case; attackers
    also rename dumps, so if this returns nothing, widen to any large dump written by an unexpected process.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: lsass
        TargetFilename|endswith: .dmp
      condition: selection
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
      - User
- question: Around the time of the load, did any process run a known LSASS credential-dumping command?
  context: Common LSASS-dumping invocations appear in process command lines even when a signed system binary
    performs the dump -- rundll32 loading comsvcs.dll MiniDump, procdump against lsass, and mimikatz sekurlsa
    or lsadump commands. Their presence on this host near the alert corroborates active credential theft;
    their absence does not clear it, since a custom in-memory dumper leaves no such command line.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
          - comsvcs
          - MiniDump
          - procdump
          - sekurlsa
          - lsadump
          - Invoke-Mimikatz
          - lsass
      condition: selection
    fields:
      - Image
      - CommandLine
      - ProcessGuid
      - User
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Aggregating process activity in the surrounding window collapses
    routine background telemetry into high-count rows while novel parent-child pairs stand out at low counts.
    Reconnaissance, privilege escalation, or persistence launched near the load may reveal what else the
    operator was doing.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- defense tampering, reconnaissance, or prior credential-access
    attempts -- can reveal the stages that led up to this load and help reconstruct the timeline. A cluster
    of related alerts before this one indicates a multi-stage operation rather than an isolated event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
