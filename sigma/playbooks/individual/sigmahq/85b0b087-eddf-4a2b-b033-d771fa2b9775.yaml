name: PowerShell Download and Execution Cradles
id: 7ba535f3-9d1d-46dd-a8bd-955cc1fafbde
description: |
  Detects PowerShell command lines that combine a remote-download primitive (Net.WebClient
  DownloadString/DownloadFile, Invoke-WebRequest/iwr, Invoke-RestMethod/irm) with an in-place
  execution primitive (Invoke-Expression/IEX, including backtick-obfuscated variants) in the same
  invocation. The rule fires only when BOTH a download token AND an execution token are present,
  the canonical pattern of a fileless download-and-run cradle that fetches a script or payload and
  executes it in memory. Legitimate installers and packaging tooling occasionally pair these
  primitives, so the investigation determines what URL was fetched, what it executed, whether the
  payload touched disk, and whether the user, host, and parent process are consistent with expected
  scripting activity.
type: detection
detection_id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line pair a download primitive with an in-memory execution primitive
    as this rule requires?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires
    only when the command line contains BOTH a download token (DownloadString, DownloadFile,
    Invoke-WebRequest/iwr, Invoke-RestMethod/irm) AND an execution token (IEX/Invoke-Expression,
    including backtick-broken forms like I`EX). Read the full command line and confirm both halves
    are present rather than a benign single primitive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to download and execute remote scripts from the command line?
  context: Legitimate administrative and packaging activity can pair a download primitive with
    in-memory execution. Knowing whether the user role and host function include running download
    cradles (build automation, software deployment, developer tooling) is often the fastest path to
    distinguishing a true positive from routine operations.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What URL does the cradle fetch, and what does the downloaded content execute?
  context: The detection matches a plain-text cradle pattern (DownloadString/DownloadFile/iwr/irm piped
    into IEX), so the command line is already readable rather than base64-encoded. Extract the source
    URL or host being fetched, identify whether the result is piped straight into Invoke-Expression
    (in-memory execution) or saved to a path first, and check the URL reputation. Watch for backtick
    breaks (I`EX) and string concatenation used to evade simple matching.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Decode the full PowerShell command line on this host — what is the complete download-and-run
    operation, including any staged second-stage commands?
  context: Cradles frequently arrive as multi-statement command lines or as a sequence of PowerShell
    invocations that together form one logical operation (fetch loader, then execute payload). Scoping
    to PowerShell command lines that carry the same download and execution tokens on this host within a
    short window surfaces the full operation rather than only the single triggering event. Decode any
    flags, concatenation, and the fetched resource.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_download:
        CommandLine|contains:
        - .DownloadString(
        - .DownloadFile(
        - 'Invoke-WebRequest '
        - 'iwr '
        - 'Invoke-RestMethod '
        - 'irm '
      selection_iex:
        CommandLine|contains:
        - ;iex $
        - '| IEX'
        - '|IEX '
        - I`E`X
        - I`EX
        - IE`X
        - 'iex '
        - IEX (
        - IEX(
        - Invoke-Expression
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
      - CommandLine
      - CurrentDirectory
- question: Does the command line carry obfuscation or evasion markers beyond the literal download and
    execution tokens?
  context: Command-and-scripting-interpreter abuse is tunable around the exact pattern. Beyond the
    DownloadString/IEX tokens the rule keys on, cradles commonly add execution-policy bypass,
    window-hidden, non-interactive, or base64 (-enc) wrappers, and break keywords with backticks or
    string joins. Surfacing which of these markers are present calibrates how deliberately the command
    was crafted to evade detection.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_evasion:
        CommandLine|contains:
        - '-enc'
        - '-EncodedCommand'
        - '-w hidden'
        - '-WindowStyle Hidden'
        - '-nop'
        - '-NoProfile'
        - 'FromBase64String'
        - I`E`X
        - I`EX
        - IE`X
      condition: selection_host and selection_evasion
    fields:
      - CommandLine
      - User
- question: Were PowerShell security controls bypassed or weakened before this execution?
  context: Attackers often disable or bypass PowerShell security controls before running a cradle.
    Common techniques include AMSI bypass (patching amsi.dll in memory), execution policy changes
    (Set-ExecutionPolicy or -ep bypass), constrained language mode escape, and downgrade attacks
    (powershell.exe v2, which lacks logging). Finding these precursor events strengthens the case for
    malicious activity.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the full deobfuscated script content?
  context: Script block logging records the deobfuscated script content PowerShell actually executes,
    even when the command line uses backtick breaks or concatenation. This provides ground truth about
    what the cradle fetched and ran, bypassing command-line obfuscation. If PowerShell operational logs
    are not ingested in this environment, treat zero results as a visibility gap rather than evidence
    nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: What process spawned this PowerShell instance, and is that parent chain expected?
  context: The parent process reveals how the cradle was invoked. User-driven scripting typically has
    predictable parents (explorer.exe, a console host, an IDE), while Office applications, mshta.exe,
    wscript.exe, or a server service (sqlservr.exe, w3wp.exe) spawning a download-and-run command line
    points to macro execution or exploitation of an internet-facing application.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did this PowerShell instance spawn afterward?
  context: The processes a cradle spawns reveal its actual impact. In-memory execution may launch
    cmd.exe, additional powershell.exe instances, certutil.exe, rundll32.exe, or a dropped binary for
    post-exploitation. A cradle that fetches and reflectively loads a .NET assembly may show no child at
    all, so an empty result does not clear the alert.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is a downloaded or staged file referenced by the command line still on disk for analysis?
  context: If the cradle saved the fetched content to a path (DownloadFile to a local file, or output
    redirected to disk) rather than executing purely in memory, checking whether that file still exists
    enables hash lookup, sandbox submission, or content review. Many cradles run entirely in memory and
    leave no on-disk artifact.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: If the downloaded payload was executed, what is its hash and reputation?
  context: The hash for a reputation lookup is recorded when the payload runs, not when the cradle fetches it —
    file-creation events carry no hash. If the cradle dropped the payload and ran it, it is a child or sibling of
    the alerting process, so this query returns those processes with their executable hashes; pair the hash with the
    source URL from the command line. Many cradles execute in memory (IEX) with no file or process payload at all —
    if this returns nothing, review PowerShell script-block logging for the fetched content instead.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      selection_siblings:
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: 1 of selection_*
    fields:
      - Image
      - Hashes
- question: What other file activity occurred in the directory the cradle wrote to?
  context: Cradles often stage multiple files in the same directory, or the fetched payload triggers
    further writes (extraction, decompression, additional downloads). Examining directory-level file
    activity reveals the broader scope of the delivery operation beyond the single referenced file.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_download:
        CommandLine|contains:
        - .DownloadString(
        - .DownloadFile(
        - 'Invoke-WebRequest '
        - 'iwr '
        - 'Invoke-RestMethod '
        - 'irm '
      selection_iex:
        CommandLine|contains:
        - ;iex $
        - '| IEX'
        - '|IEX '
        - I`E`X
        - I`EX
        - IE`X
        - 'iex '
        - IEX (
        - IEX(
        - Invoke-Expression
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_download:
        CommandLine|contains:
        - .DownloadString(
        - .DownloadFile(
        - 'Invoke-WebRequest '
        - 'iwr '
        - 'Invoke-RestMethod '
        - 'irm '
      selection_iex:
        CommandLine|contains:
        - ;iex $
        - '| IEX'
        - '|IEX '
        - I`E`X
        - I`EX
        - IE`X
        - 'iex '
        - IEX (
        - IEX(
        - Invoke-Expression
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning
    multiple endpoints. If the same user triggered similar download-and-execute activity on multiple
    hosts, the scope of the operation may be larger than a single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_download:
        CommandLine|contains:
        - .DownloadString(
        - .DownloadFile(
        - 'Invoke-WebRequest '
        - 'iwr '
        - 'Invoke-RestMethod '
        - 'irm '
      selection_iex:
        CommandLine|contains:
        - ;iex $
        - '| IEX'
        - '|IEX '
        - I`E`X
        - I`EX
        - IE`X
        - 'iex '
        - IEX (
        - IEX(
        - Invoke-Expression
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired the rule's download-and-execute pattern in the past week, and does
    the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of the cradle pattern (not generic PowerShell usage). Many hosts firing the same
    pattern points to scripted deployment or vendor automation; one host or a small unrelated set points
    to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_download:
        CommandLine|contains:
        - .DownloadString(
        - .DownloadFile(
        - 'Invoke-WebRequest '
        - 'iwr '
        - 'Invoke-RestMethod '
        - 'irm '
      selection_iex:
        CommandLine|contains:
        - ;iex $
        - '| IEX'
        - '|IEX '
        - I`E`X
        - I`EX
        - IE`X
        - 'iex '
        - IEX (
        - IEX(
        - Invoke-Expression
      condition: all of selection_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering,
    reconnaissance, exploitation of an internet-facing service, or credential access — may reveal the
    attack stages that preceded the cradle and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
