name: Potentially Suspicious Desktop Background Change Via Registry
id: e43f8022-6fd8-4e30-97b4-366d76a06453
description: |
  Detects a registry write that would replace the user's desktop background, targeting a value
  under a Control Panel\Desktop, CurrentVersion\Policies\ActiveDesktop, or CurrentVersion\Policies\System
  key. The rule fires when such a key is written and EITHER the value name ends in \Wallpaper (the
  background image path), OR the value name ends in NoChangingWallpaper with data DWORD (0x00000001)
  (a lock that prevents the user from changing the background back), OR the value name ends in
  \WallpaperStyle with data 2 — while excluding routine writes by svchost.exe, Explorer.EXE, and the
  EC2Launch provisioning agent, and an empty Wallpaper write. Legitimate changes come from
  administrative scripts or group policy that set a corporate background; malicious use replaces the
  background with a ransom note and locks it as a visible, late-stage impact step. Investigate which
  value branch fired, the process and command that wrote it, whether the referenced image was dropped
  to disk, and what recovery-inhibition or encryption activity followed on the host.
type: detection
detection_id: 85b88e05-dadc-430b-8a9e-53ff1cd30aae
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the alerting registry write set a desktop wallpaper value under a Desktop or Policies key?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a
    value under a Control Panel\Desktop, Policies\ActiveDesktop, or Policies\System key is written and
    EITHER the value name ends in \Wallpaper (the background image path), OR it ends in
    NoChangingWallpaper with data DWORD (0x00000001), OR it ends in \WallpaperStyle with data 2.
    Review the exact TargetObject and Details on the triggering event and note which of the three
    branches fired: the \Wallpaper branch carries an image file path in Details and makes the
    image-drop and value-decode checks load-bearing, while the NoChangingWallpaper branch is a lock
    with no path and makes the durability and re-modification history the decisive angle. Writes by
    svchost.exe, Explorer.EXE, or the EC2Launch agent are filtered out, so the writing process on a
    genuine hit is something else.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to change desktop wallpaper or personalization policy?
  context: >-
    Legitimate wallpaper and personalization policy changes are usually pushed by group policy or a
    provisioning script to set a corporate background, on a defined set of hosts and by a small set of
    accounts or a management agent. Knowing whether the writing account and host function match that
    expectation is often the fastest way to separate a sanctioned change from defacement. User
    attribution is present on roughly 94% of endpoint registry events; when it is a machine account,
    SYSTEM, or missing, pivot on the writing process instead. The expected tooling and accounts form
    the baseline that separates a routine push from an ad-hoc change.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Was there a change ticket, deployment, or documented approval for this wallpaper change?
  context: >-
    Corporate background changes are often rolled out through a documented deployment or policy
    refresh. A corresponding ticket or scheduled push suggests authorized activity; the absence of one
    where policy requires it points to an unsanctioned change. This check can quickly close the common
    false positive of an administrative script that sets a company logo.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this method of setting the wallpaper consistent with how your organization normally does it?
  context: >-
    Organizations typically set desktop backgrounds through group policy or a management agent rather
    than a direct command-line reg.exe or PowerShell write. A hands-on write to these values from an
    interactive shell may indicate an actor bypassing normal tooling, or it may be an administrator
    taking a shortcut. Knowing the standard procedure helps distinguish the two.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which wallpaper value was written, and what does that key control?
  context: >-
    The specific value determines the effect. A value ending in \Wallpaper sets the background image
    path; NoChangingWallpaper set to DWORD (0x00000001) locks the background so the user cannot change
    it back; \WallpaperStyle set to 2 selects the stretched display style. When these appear under a
    Policies\ActiveDesktop or Policies\System key they apply machine-wide rather than for a single
    user, which broadens the impact. The value name, its data, and the writing process together
    identify what changed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What image path or value data was written to this key?
  context: >-
    Read the Details field on the triggering write. For the \Wallpaper branch, Details holds the file
    path to the new background image (often a dropped file under a user-writable or public location
    such as %APPDATA% or C:\Users\Public); that path becomes a follow-on artifact to run down. For the
    NoChangingWallpaper branch, Details is DWORD (0x00000001), meaning the background is being locked;
    for \WallpaperStyle it is 2. Details is present on roughly 79% of registry modifications and is
    absent only for binary or empty value data, so for these values it should be populated.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote this value, and is its parent chain expected?
  context: >-
    The registry event carries no command line, so pivot to the writing process by its ProcessGuid to
    read its parent lineage and command. Policy-driven changes have predictable parents (a management
    agent, services.exe, or an interactive console launched from explorer.exe). A reg.exe or
    powershell.exe write whose parent is a nested cmd.exe chain, a script host such as wscript.exe or
    mshta.exe, or an unsigned binary points to scripted defacement rather than a sanctioned push.
    Note whether the writing process is signed and whether the lineage is one the filtered-out
    processes (svchost.exe, Explorer.EXE, EC2Launch) would produce.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
- question: What recovery-inhibition or log-clearing activity occurred on this host around the change?
  context: >-
    A wallpaper replacement is frequently the visible, terminal step of an impact operation. Shadow
    copy deletion, backup catalog removal, boot recovery being disabled, or event log clearing near
    the wallpaper write ties the registry edit to encryption and anti-recovery activity rather than a
    cosmetic change. This query surfaces recovery-inhibition and log-clearing tooling on the host in
    the surrounding window.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_impact:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\wbadmin.exe'
          - '\bcdedit.exe'
          - '\wevtutil.exe'
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'delete catalog'
          - 'recoveryenabled no'
          - 'cl '
          - 'clear-log'
      condition: selection and selection_impact
    fields:
      - Image
      - CommandLine
- question: Was the wallpaper image referenced in Details written to disk, and where did it come from?
  context: >-
    When the \Wallpaper branch fires, the value points at an image file; a defacement drops that image
    before setting the value. Correlating file activity by the writing process and its children reveals
    whether the referenced image was created in the same session and the path it landed at. A file
    written to a user-writable or public location by the same lineage that made the registry change is
    the defacement content; a path under a managed corporate share is more consistent with a sanctioned
    background. The file write carries no hash — if the image is present, retrieve it or hash it from a
    later handling event for a reputation check.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: After this write, was the same value re-set, reverted, or the lock re-applied on this host?
  context: >-
    Registry key or value deletions are not observable in this telemetry, so durability is judged from
    the value's re-modification history rather than from a delete event. Look at later writes to the
    same value: a \Wallpaper write that is never restored leaves the defaced background in place, while
    a later write returning it to the corporate image would indicate remediation or a policy refresh.
    A NoChangingWallpaper lock that is re-applied after being cleared, or a value that flip-flops,
    shows a policy fighting a manual change.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What other registry modifications were made on this host in the same window?
  context: >-
    Actors who change the wallpaper as an impact step often change several values in the same session —
    the \Wallpaper path, the NoChangingWallpaper lock, and \WallpaperStyle together, alongside Defender
    policy, firewall, or persistence keys. Clustering the registry writes on this host within a short
    window around the alert reveals the full scope of configuration changes and whether one process
    made them all. The triggering key appears in the results; the signal is what else was modified and
    by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has this wallpaper value been modified before on this host?
  context: >-
    A background pushed by policy tends to be set repeatedly and identically over time, while a
    first-time write to these values is more notable. A history that shows no prior writes makes this a
    new change and raises its weight; a history of periodic identical writes points to a management
    process that routinely sets it. Compare the historical Details values to see whether the same image
    path or lock value was set before, or whether this is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same value modified on other hosts in the environment?
  context: >-
    The same write across many hosts suggests a centrally managed policy or a corporate background
    rollout; the same write confined to one host, or spreading across a subset in a short burst,
    suggests targeted defacement or an operation moving host to host. Compare the Details values across
    hosts to see whether they all set the same image path or lock, or whether values differ, and
    whether the writing process is consistent with a management deployment or with ad-hoc tampering.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A defacement rarely happens in isolation. Aggregating process activity in a tight window around the
    alert surfaces what led up to the change and what ran immediately after. Novel parent-child pairs
    stand out at low counts against high-count routine telemetry, which is what points to file
    enumeration, encryption, or the rundll32 call that applies the wallpaper live around the
    configuration change.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Were process-based persistence mechanisms installed on this host in the same window?
  context: >-
    An impact operation is often preceded or accompanied by a foothold. Scheduled tasks, services,
    registry Run keys, BITS jobs, or WMI subscriptions created by schtasks.exe, sc.exe, reg.exe,
    bitsadmin.exe, or wmic.exe near the wallpaper change indicate the change was part of a larger
    operation rather than an isolated cosmetic edit. Named payloads launched from these tools are worth
    correlating with the registry write.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — reconnaissance, execution of scripting tools, defense
    tampering, or recovery inhibition — may reveal the stages that preceded this change and help
    reconstruct the timeline. A wallpaper defacement arriving after those stages places this registry
    edit at the end of a longer operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
