name: HackTool - HollowReaper Execution
id: 16e21b96-3455-4990-a6e5-293154557e85
description: |
  Fires when a process named HollowReaper.exe runs. HollowReaper is a process-hollowing launcher: it
  creates a legitimate-looking child process in a suspended state, unmaps the child's original image,
  writes shellcode into that memory with VirtualAllocEx/WriteProcessMemory, then redirects the thread
  and resumes it so the payload executes under the identity of a trusted binary. A filename match is a
  high-confidence signal because the tool has no legitimate use, but the binary can be renamed, so the
  investigation should confirm the hollowing behavior (a suspended child, a cross-process memory write,
  the resumed payload) and determine which process was hollowed and what the payload did.
type: detection
detection_id: 85d23b42-9a9d-4f8f-b3d7-d2733c1d58f5
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Is the process that fired this alert actually named HollowReaper.exe as the rule detects?
  context: Confirm the alert is a true positive by reviewing the triggering event. The rule fires on a
    single condition - an Image path ending in HollowReaper.exe. Check the full image path and command
    line; a binary renamed to HollowReaper.exe (or the real tool deliberately left under its own name)
    both warrant the same hollowing-behavior follow-up.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is this user and host expected to run a process-hollowing launcher?
  context: A general-purpose hollowing tool has no routine administrative use. Knowing whether the host
    is a security-testing system and whether the user performs authorized offensive work is the fastest
    way to separate a sanctioned test from an intrusion.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this execution part of an authorized penetration test or red team engagement?
  context: Offensive tooling is run during sanctioned assessments. Before investing further analysis,
    check whether a penetration test or red team exercise is active on this host or network segment with
    matching timing. A documented engagement that accounts for the activity resolves the alert.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What does the full command line show about which process was targeted and where the shellcode came from?
  context: HollowReaper takes operands that select the binary to hollow and the source of the payload.
    Decode the command line to identify the target image (often a benign system binary such as svchost.exe
    or notepad.exe) and any shellcode file path or inline payload reference. This establishes what was
    impersonated and where the code originated.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Which target process did this invocation hollow, and what payload was launched into it?
  context: The specific operands determine the scope of compromise. Identify the decoy binary that was
    hollowed and the payload that ran inside it - a benign-looking host process now executing arbitrary
    code changes which follow-on activity (network beacons, child processes) is attributable to the attacker
    rather than the genuine binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did the HollowReaper process make any of the API calls associated with writing shellcode into a target process and hijacking its execution?
  context: Elastic Defend has no cross-process handle telemetry, so the handle-open step that Sysmon's
    process-access channel would normally show (GrantedAccess, CallTrace) cannot be observed on this
    platform. Defend does record the behavioral API calls a process makes, and process hollowing depends
    on a small set of memory-write and thread-hijack calls - WriteProcessMemory, QueueUserAPC, and
    SetWindowsHookEx among them. A hit naming HollowReaper.exe as the calling process confirms the
    hollowing step even without handle-level visibility; treat a miss as a coverage gap, not proof no
    injection occurred.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        event.dataset: endpoint.events.api
        process.Ext.api.name:
          - WriteProcessMemory
          - QueueUserAPC
          - SetWindowsHookEx
      condition: selection
    fields:
      - process.executable
      - process.Ext.api.name
      - Image
- question: What child processes did HollowReaper create, and is any of them a suspended or hollowed system binary?
  context: The hollowed process is created as a child of the launcher, typically in a suspended state before
    its memory is replaced. A child that is a normally-network-facing system binary (svchost.exe, dllhost.exe)
    spawned directly by this tool, especially one that then makes outbound connections, is the payload running
    under a borrowed identity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What process spawned HollowReaper, and is that parent chain expected?
  context: The parent reveals how the launcher was delivered and run. An interactive shell from explorer.exe
    points to hands-on-keyboard operation, while parents such as wscript.exe, mshta.exe, an Office application,
    or a download utility point to scripted or document-driven delivery. An unexpected parent for an injection
    tool is the lead worth following upstream.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What files did HollowReaper create on this host?
  context: The launcher commonly reads a shellcode file from disk and may drop staging or output artifacts.
    Files created by this process - raw payload blobs in user-writable or temporary directories, or other
    dropped tooling - confirm execution and reveal the payload source even after the process exits.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: When this host has previously run this binary, what parents and users drove it, and does the current alert fit?
  context: The query mirrors the rule's selection scoped to this host, so the resulting parent and user
    distribution reflects how this specific binary has run here historically. For a tool with no legitimate
    purpose, a zero or near-zero baseline is itself the finding; any prior runs and the accounts behind them
    are worth correlating with known testing activity.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \HollowReaper.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts run this binary in the past week, and does the spread look like coordinated activity or one host?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this
    binary. The same launcher appearing on many hosts in a short window points to a pushed or scripted
    rollout across the estate; a single host or a small unrelated set points to isolated operator activity.
    The host distribution calibrates how broad the response needs to be.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \HollowReaper.exe
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \HollowReaper.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \HollowReaper.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around the time of the alert?
  context: Tracking the account's activity on all hosts in the surrounding window reveals whether the
    hollowing was an isolated action or one step in a wider operation - reconnaissance, credential access,
    or activity on other endpoints under the same identity widens the apparent scope.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \HollowReaper.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: A hollowing launcher is usually one stage of a longer operation. Earlier detections on the same
    host - defense tampering, reconnaissance, privilege escalation, or credential access - help reconstruct
    what preceded the payload execution and whether protection was weakened first.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
