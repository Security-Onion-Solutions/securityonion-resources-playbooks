name: Devcon Execution Disabling VMware VMCI Device
id: ef4447a2-31bc-41c9-a5db-37b5a5f95379
description: |
  Detects execution of devcon.exe (the Windows Device Console tool) with a command line that disables the VMware Virtual Machine Communication Interface (VMCI) device. The rule fires only when all three conditions match together: the image is devcon.exe (or carries the OriginalFileName DevCon.exe), the command line contains ' disable ', and the command line references the VMCI device identifier (15AD&DEV_0740 or VMWVMCIHOSTDEV). devcon.exe can enable, disable, install, start, and stop arbitrary devices from the command line without Device Manager, so it can be scripted to turn off security or virtualization devices.
  Disabling the VMCI device can be legitimate during VMware Tools troubleshooting or driver-conflict resolution, but it is also used to hijack guest-to-host communication and has facilitated VM-escape exploitation against the ESXi hypervisor. Investigation should confirm the exact command, establish whether the action was authorized and consistent with normal administration on this host, and check for surrounding persistence or defense-tampering activity.
type: detection
detection_id: 85f520e7-6f5e-43ca-874c-222e5bf9c0de
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line match the devcon disable of the VMware VMCI device that this rule detects?
  context: Confirm this is a true positive by reviewing the exact command line and image against the rule's three combined criteria — the process is devcon.exe (or has OriginalFileName DevCon.exe), the command line contains ' disable ', and it references the VMCI device identifier (15AD&DEV_0740 or VMWVMCIHOSTDEV). All three must be present together for the rule to fire.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to manage device state with devcon.exe?
  context: devcon.exe ships with the Windows Driver Kit and is normally found only on developer or driver-engineering systems, not general workstations or servers. Knowing whether this host's function and the acting user's role involve VMware Tools maintenance or driver troubleshooting is often the fastest way to separate authorized administration from abuse.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Was there a change ticket, maintenance window, or documented approval for disabling the VMCI device on this host?
  context: VMware Tools troubleshooting and driver-conflict resolution are normally planned activities. A corresponding ticket or maintenance window suggests authorized work; absence of one when policy requires it shifts the disposition toward unauthorized device tampering and warrants follow-up.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this activity align with normal work hours and maintenance windows?
  context: Legitimate device or driver maintenance typically occurs during business hours or scheduled windows. Disabling a virtualization device outside those windows, especially on a server, is more suspicious than the same action during a documented maintenance window.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which device or component did the devcon command target, and was it the VMCI device specifically?
  context: The full command line reveals the exact device targeted. Confirm whether the hardware identifier (15AD&DEV_0740 or VMWVMCIHOSTDEV) points at the VMware VMCI device and whether the action was a disable, remove, or a broader device operation. Disabling the VMCI device interrupts guest-to-host communication and is a precondition for some VM-escape exploitation paths.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Was a Windows service created or modified on this host around the same time, and what binary does it execute?
  context: devcon.exe can install device drivers as kernel services, and driver installation is a common persistence and privilege-escalation path tied to this activity. System event 7045 records service installations with structured fields — the image path is the payload to analyze, and a path in a world-writable or unusual directory (C:\Users\, C:\Temp\) or an unsigned binary is a strong follow-up signal.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: system
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 7045
      condition: selection
    fields:
      - ServiceName
      - ImagePath
      - StartType
      - AccountName
- question: Were service or device registry keys created or modified on this host around the time of the alert?
  context: Disabling a device with devcon.exe and installing drivers as services both write to registry locations under HKLM\System\CurrentControlSet (Services and Enum/device state). Registry changes capture service creation, StartType edits, and driver registration that may not appear in command-line evidence, and correlating these with the alert window reveals whether the device disable was paired with a persistence or autostart change.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\CurrentControlSet\Services\'
          - '\CurrentControlSet\Enum\'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Is the VMCI device or any newly created service currently disabled or running, and under what account?
  context: A device disabled by devcon.exe stays disabled until re-enabled, and a created service may be set to demand or auto start. Checking the current state of the VMCI device and any associated service reveals whether the host remains in a tampered state. A service running as LocalSystem has full privileges; the current device/service state should be verified directly on the host before closing the investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned devcon.exe and is that parent chain expected?
  context: The parent process reveals how devcon.exe was invoked. Legitimate use is typically launched interactively (explorer.exe, a console) or by a known deployment tool. Unusual parents such as mshta.exe, wscript.exe, an Office application, or a script interpreter point toward scripted or exploited execution rather than hands-on administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What activity occurred on this host after the VMCI device was disabled?
  context: Disabling the VMCI device is often a precondition for follow-on actions — code execution against the hypervisor, payload deployment, or further tampering. Examining process activity in the window immediately after the disable reveals what the action was meant to enable. A gap in expected telemetry followed by new process creation is itself a signal worth chasing.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense or device tampering actions performed on this host?
  context: Operators who disable one device or control often disable several — stopping services, clearing logs, deleting shadow copies, or disabling additional devices to maximize coverage. Finding multiple tampering events from the same user or parent process indicates a coordinated operation rather than an isolated maintenance action.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\devcon.exe'
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - ' disable '
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: When this host has previously fired this devcon VMCI-disable pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even legitimate device maintenance leaves a baseline. This query mirrors the rule's selection structure scoped to this host, so the resulting parent/user distribution reflects how this specific firing pattern has historically run here. A new parent process, an unexpected user account, or a first-ever occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \devcon.exe
      - OriginalFileName: DevCon.exe
      selection_action:
        CommandLine|contains: ' disable '
      selection_vmci_pci:
        CommandLine|contains:
        - 15AD&DEV_0740
        - VMWVMCIHOSTDEV
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \devcon.exe
      - OriginalFileName: DevCon.exe
      selection_action:
        CommandLine|contains: ' disable '
      selection_vmci_pci:
        CommandLine|contains:
        - 15AD&DEV_0740
        - VMWVMCIHOSTDEV
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \devcon.exe
      - OriginalFileName: DevCon.exe
      selection_action:
        CommandLine|contains: ' disable '
      selection_vmci_pci:
        CommandLine|contains:
        - 15AD&DEV_0740
        - VMWVMCIHOSTDEV
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar device or persistence activity on multiple hosts, the scope of the operation may be larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \devcon.exe
      - OriginalFileName: DevCon.exe
      selection_action:
        CommandLine|contains: ' disable '
      selection_vmci_pci:
        CommandLine|contains:
        - 15AD&DEV_0740
        - VMWVMCIHOSTDEV
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — reconnaissance, credential access, or other defense tampering — may reveal the attack stages that preceded the device disable and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host?
  context: Attackers rarely rely on a single persistence mechanism. After establishing one foothold, they commonly install backup mechanisms using different techniques — scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions. Multiple persistence installations in the same timeframe indicate intentional stacking rather than isolated administration.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
