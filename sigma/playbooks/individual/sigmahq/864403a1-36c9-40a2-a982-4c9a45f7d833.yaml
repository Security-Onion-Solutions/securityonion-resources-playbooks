name: Exploit for CVE-2017-0261
id: 3b12f3b8-f1b7-46b9-bf80-46cbf42fb89c
description: |
  Detects WINWORD.EXE spawning FLTLDR.exe, the Office graphics import filter that renders
  embedded EPS (Encapsulated PostScript) images. Both conditions must hold: the parent path ends
  in \WINWORD.EXE and the child path contains \FLTLDR.exe. An EPS file is a PostScript program,
  and CVE-2017-0261 and CVE-2017-0262 are memory-corruption flaws in that interpreter reachable
  by opening a document with an embedded EPS image, so a Word-parented FLTLDR.exe process marks
  the point where attacker-supplied PostScript is executed. EPS processing was disabled in Office
  by an April 2017 update, so on a patched estate this pairing should not occur at all; where it
  does, it is either a document containing a legacy EPS graphic on an unpatched or re-enabled
  installation, or an exploitation attempt. Determine which document was opened and where it came
  from, whether Word crashed or spawned further children, what files were written to user-writable
  paths, and whether the same document reached other users.
type: detection
detection_id: 864403a1-36c9-40a2-a982-4c9a45f7d833
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the alerting event show WINWORD.EXE as the parent and FLTLDR.exe as the child?
  context: >-
    The rule fires only when both hold at once - the parent path ends in \WINWORD.EXE and the child
    path contains \FLTLDR.exe. Confirm both against the event before investing further time, and note
    the full child path: a FLTLDR.exe outside the Office installation directory is a different finding
    from the genuine filter binary being invoked.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to open documents containing embedded EPS graphics in Word?
  context: >-
    EPS rendering in Office is a legacy path used by print, design, and publishing workflows that
    exchange PostScript artwork. A user whose role involves those workflows on a workstation with an
    unpatched or deliberately re-enabled EPS filter is a plausible benign explanation; a general
    office user with no such workflow is not.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What document did Word have open, and how did it reach this host?
  context: >-
    FLTLDR.exe only runs when Word is rendering an embedded image, so the document Word was opening
    is the delivery vehicle. The parent command line usually carries the document path; recover the
    filename and then trace it back to a mail attachment, a browser download, a chat client, or a
    file share. That origin determines whether other recipients need the same check.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - manual_review
  - edr_console
- question: What started WINWORD.EXE itself, and is that launch consistent with a user opening a document?
  context: >-
    A Word process started by explorer.exe or outlook.exe matches a person double-clicking an
    attachment or a file. A Word process started by a script host, a command interpreter, or an
    automation framework indicates the document was opened programmatically, which changes the
    delivery question entirely. The grandparent's own command line often names the document as well.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What image file was FLTLDR.exe passed, and where was it working from?
  context: >-
    FLTLDR.exe is handed the graphic to render, so its command line and working directory point at
    the EPS or image file extracted from the document - typically a temporary path under the user
    profile. Recover that path: the file itself is the PostScript program that would carry an
    exploit, and it is the artifact worth preserving for analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What files did this Word process write around the time of the alert?
  context: >-
    Word extracts embedded objects to disk before handing them to a filter, so its file writes in this
    window normally include the EPS or image artifact and the document's own temporary copies. Writes
    into Downloads, %TEMP%, %APPDATA%, OneDrive caches, or an Office startup folder are the ones to
    read closely - an executable, script, or startup-folder entry written by Word is a payload drop
    rather than a rendering artifact.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - process_creation
- question: Is the EPS or image artifact FLTLDR.exe rendered still on disk for analysis?
  context: >-
    The rendered file is the PostScript program, and it is the single most useful artifact for
    deciding exploitation versus benign rendering. This query returns files written by the alerting
    process and by any child it spawned; collect the path before the temporary directory is cleared,
    then hash it or detonate it in a safe environment.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What other child processes did this same Word process spawn?
  context: >-
    Rendering a graphic should produce a filter process and nothing else. Command interpreters, script
    hosts, or LOLBINs from the same Word instance - powershell.exe, cmd.exe, wscript.exe, cscript.exe,
    mshta.exe, rundll32.exe, regsvr32.exe, msiexec.exe, curl.exe, bitsadmin.exe - mean code ran beyond
    the document, and their timing relative to the filter process shows whether execution followed the
    render.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Did Word or the graphics filter record an application-error event around this time?
  context: >-
    CVE-2017-0261 is a use-after-free in the EPS interpreter's restore operator and CVE-2017-0262 is a
    type confusion in forall, so a failed or unstable exploitation attempt often leaves an Application
    Error record (event 1000) naming WINWORD.EXE or FLTLDR.exe within minutes of the spawn. A crash
    entry alongside the spawn supports memory corruption over a benign rendering explanation; its
    absence does not rule exploitation out, since a reliable exploit returns control cleanly, and hosts
    that do not forward the application channel return nothing here by construction.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: application
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 1000
      condition: selection
    fields:
      - Provider_Name
      - EventID
      - Data
  answer_sources:
  - manual_review
- question: Did Word or the graphics filter make outbound network connections around this time?
  context: >-
    Shellcode that lands inside the Office or filter process usually reaches out for a second stage
    from that same process, so egress attributed to WINWORD.EXE or FLTLDR.exe within minutes of the
    spawn is the tell that separates exploitation from rendering. Discount connections to known update
    and content-delivery endpoints and to proxy egress ranges; a direct connection to an unfamiliar
    address from a document-rendering process is not part of that traffic.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_proc:
        Image|endswith:
          - \WINWORD.EXE
          - \FLTLDR.exe
      condition: selection_host and selection_proc
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
- question: Is this Office installation patched against the EPS filter vulnerabilities?
  context: >-
    The April 2017 Office update disabled EPS processing by default, and CVE-2017-0261 and
    CVE-2017-0262 were fixed in the May 2017 updates. An installation that still renders EPS is either
    missing those updates or has had the filter re-enabled through the EPSCodeGeneration or
    DisableEPSFilter registry settings. Establishing which one applies tells you whether exploitation
    was possible here and which other hosts share the exposure.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
  answer_sources:
  - asset_inventory
  - edr_console
- question: Has this user previously opened documents that drove Word to render EPS graphics, and does that fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, so the result is the user's 90-day
    history of Word spawning the graphics filter, grouped by host - not generic Office use. A user who
    routinely handles PostScript artwork on an unpatched installation will show a steady count; a user
    with no such history producing this pattern once points at the specific document they just opened.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \WINWORD.EXE
        Image|contains: \FLTLDR.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: Has this Word parent historically driven this pattern on this host or across the environment, or is it new?
  context: >-
    When the alert fires under a service or machine principal, user identity attributes nothing and the
    launch mechanism is the meaningful pivot. This returns the 90-day history of WINWORD.EXE driving
    the filter spawn, grouped by host. A count concentrated on a handful of design or publishing
    workstations describes an established legacy workflow; a first occurrence on this host is the
    deviation to chase.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \WINWORD.EXE
        Image|contains: \FLTLDR.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did this user do across the environment around this time?
  context: >-
    If the document delivered execution, the user's session is the starting point for what followed.
    Activity on hosts other than the alerting one, or process names unrelated to their normal desktop
    software, widens the scope beyond a single opened file. Under a service or machine account this
    view returns routine agent telemetry rather than an answer.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: Did the same Word-driven filter spawn fire on other hosts in the same window, or is it isolated to this host?
  context: >-
    This mirrors the rule's selection scoped to the alerting parent process, fleet-wide, inside the
    alert window. Several hosts rendering EPS through Word within the same hour is what a document
    distributed to multiple recipients looks like, and it makes the sender and the attachment the
    priority. A single host points at one locally opened file.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \WINWORD.EXE
        Image|contains: \FLTLDR.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating every process spawn on the host by binary and parent collapses routine service and
    agent traffic into high-count rows and leaves novel parent-child pairs standing out at low counts.
    Read the low-count rows for interpreters, reconnaissance utilities, or persistence tooling that
    appeared alongside the document render.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Document-borne execution is an entry point, so earlier detections on the same host tell you whether
    this is the first stage or a later one. Mail-handling, download, and script-execution detections in
    the preceding hours help reconstruct how the document arrived and what ran before Word opened it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Did other users receive and open a document that drove the same Word EPS render?
  context: >-
    A document sent to one mailbox is rarely sent to only one. Correlating this rule across every host
    shows how many users opened a document that reached the EPS filter, which identifies the additional
    systems needing the same document and file-write checks and gives mail filtering a concrete set of
    recipients to work back from.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - alert
