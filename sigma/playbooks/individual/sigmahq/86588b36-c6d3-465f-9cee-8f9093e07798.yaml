name: Scheduled Task Executing Payload from Registry
id: 804e4042-b8d6-4863-83e9-b448ee59b658
description: |
  Detects creation of a scheduled task (schtasks.exe /Create) whose run command launches PowerShell to read
  a payload stored in the Windows Registry, using Get-ItemProperty or the gp alias against an HKCU/HKLM/registry::
  hive path. The rule fires when all of these conditions hold together AND the command line does NOT already
  contain FromBase64String or encodedcommand. Storing payload bytes in the registry and re-reading them from a
  recurring scheduled task is a fileless persistence pattern: the task survives reboot and re-executes the
  registry-resident payload on a schedule. Legitimate administrative scripts rarely combine task creation with
  PowerShell registry reads in one command line, so the investigation should confirm what the task runs, where
  the registry payload lives, and whether the task is still registered.
type: detection
detection_id: 86588b36-c6d3-465f-9cee-8f9093e07798
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line create a scheduled task whose run command reads a registry-stored payload via PowerShell?
  context: Before investing investigation time, confirm this is a true positive. The command line should be a schtasks.exe /Create that ties together a registry read (Get-ItemProperty or the gp alias against HKCU:, HKLM:, registry::, or HKEY_) without an explicit FromBase64String or encodedcommand token. Review the full Image, OriginalFileName, and CommandLine against these criteria.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to create scheduled tasks that run PowerShell registry reads?
  context: Legitimate administrative activity can trigger this detection. Knowing whether the user role and host function normally involve scheduled-task creation, and whether this account routinely runs PowerShell against the registry, is often the fastest path to separating a true positive from routine operations.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Was there a change ticket, maintenance window, or documented approval for this scheduled task?
  context: Many organizations require change tickets for persistence mechanisms such as scheduled tasks. A corresponding ticket suggests authorized deployment; absence of one when policy requires it suggests the task was created outside normal process. This check can quickly close a false positive or escalate a true positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What scheduled task was created, and what command does its run action execute?
  context: The schtasks command line carries the task name (/TN), the command to run (/TR), the schedule (/SC and /MO), and the run-as account (/RU). Identify the task name, the full /TR PowerShell command, the schedule type, and whether it runs as SYSTEM. A GUID-style or randomized task name running a recurring PowerShell registry read is the persistence payload.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which registry path does the task's PowerShell command read from, and is that location holding a payload rather than configuration?
  context: The /TR command references a registry path via Get-ItemProperty or gp against an HKCU:, HKLM:, registry::, or HKEY_ hive. Identify the exact key and value name. Randomized key/value names under HKCU\Software (for example HKCU\SOFTWARE\<random>) holding large opaque value data are a fileless payload store, not normal application configuration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the task's PowerShell command decode or transform the registry value before running it?
  context: The rule fires specifically when FromBase64String and encodedcommand are absent from the command line, but the payload may still be transformed once read. Reconstruct what the PowerShell does with the registry value -- decoding, casting bytes to a string, or piping into Invoke-Expression/IEX or [Reflection.Assembly]::Load. The decoded content reveals whether the task runs a download cradle, a reverse shell, or an in-memory .NET loader.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the task-creation audit record show the same task, and what run-as principal and trigger were registered?
  context: Task Scheduler writes an audit event when a task is registered, capturing the task name, the registered command, the trigger, and the account that created it. Comparing the audited registration against the command line confirms the task took effect and surfaces a run-as principal (SYSTEM is high-risk) or recurring trigger that the process command line alone may not make obvious. If task-registration auditing is not collected in this environment, treat absence as a visibility gap rather than evidence the task did not register.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4698
          - 4702
      condition: selection
    fields:
      - TaskName
      - TaskContent
      - SubjectUserName
- question: When is the task scheduled to run, and has the scheduler already launched it?
  context: The trigger determines when the persistence activates. Recurring schedules (for example every few minutes) may have already executed multiple times; logon or boot triggers fire on next session start. Processes spawned by the Task Scheduler service after task creation reveal whether the registry payload has already run.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\svchost.exe'
        ParentCommandLine|contains: 'Schedule'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is the scheduled task still registered on the system?
  context: Persistence is only effective if the task still exists; some operators delete the task after it runs to reduce artifacts. Confirming the task is still present (schtasks /query /tn <name> /v or the Task Scheduler view on the host) determines whether the mechanism is active and requires remediation. Use the task name recovered from the run command.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned schtasks.exe, and is that parent chain expected?
  context: The parent process reveals how the task creation was invoked. Logon-driven administration typically shows explorer.exe or a console shell; service-driven automation shows services.exe. Unusual parents such as wscript.exe, mshta.exe, regsvr32.exe, or an Office application point to script or macro-driven execution rather than an interactive admin.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_cli_create:
        CommandLine|contains: /Create
      selection_cli_get:
        CommandLine|contains:
        - Get-ItemProperty
        - ' gp '
      selection_cli_hive:
        CommandLine|contains:
        - 'HKCU:'
        - 'HKLM:'
        - 'registry::'
        - HKEY_
      filter_main_encoding:
        CommandLine|contains:
        - FromBase64String
        - encodedcommand
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_cli_create:
        CommandLine|contains: /Create
      selection_cli_get:
        CommandLine|contains:
        - Get-ItemProperty
        - ' gp '
      selection_cli_hive:
        CommandLine|contains:
        - 'HKCU:'
        - 'HKLM:'
        - 'registry::'
        - HKEY_
      filter_main_encoding:
        CommandLine|contains:
        - FromBase64String
        - encodedcommand
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the account's activity across all hosts reveals lateral movement or repeated persistence installs. If the same user created similar tasks on multiple endpoints, the scope of the operation is larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_cli_create:
        CommandLine|contains: /Create
      selection_cli_get:
        CommandLine|contains:
        - Get-ItemProperty
        - ' gp '
      selection_cli_hive:
        CommandLine|contains:
        - 'HKCU:'
        - 'HKLM:'
        - 'registry::'
        - HKEY_
      filter_main_encoding:
        CommandLine|contains:
        - FromBase64String
        - encodedcommand
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- question: Was schtasks.exe executed from its expected System32 path?
  context: schtasks.exe executed from outside System32 or SysWOW64 may indicate the binary was copied or renamed to evade path-based allowlists. Confirm the Image path and OriginalFileName so a relocated or renamed scheduler binary is not mistaken for the system one.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired this scheduled-task-from-registry pattern over the past 90 days, and what command structures are typical?
  context: A pattern with no prior history on a host is more suspicious than one seen regularly under stable parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects this specific firing pattern rather than all schtasks.exe usage. The CommandLine projection lets you compare typical invocations against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_cli_create:
        CommandLine|contains: /Create
      selection_cli_get:
        CommandLine|contains:
        - Get-ItemProperty
        - ' gp '
      selection_cli_hive:
        CommandLine|contains:
        - 'HKCU:'
        - 'HKLM:'
        - 'registry::'
        - HKEY_
      filter_main_encoding:
        CommandLine|contains:
        - FromBase64String
        - encodedcommand
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - CommandLine
- question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: Operators rarely rely on a single persistence mechanism. Around the time this task was created, look for additional scheduled tasks, service creation, registry Run-key writes, BITS jobs, or WMI subscriptions. Multiple persistence installs in the same window indicate intentional stacking rather than an isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- defense tampering, reconnaissance, or credential access -- may reveal the stages that preceded this persistence install and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
