name: Potential Exploitation Attempt From Office Application
id: a012fd45-2849-4d49-9306-243b0ac4cd15
description: |
  Detects a Microsoft Office application (winword.exe, excel.exe, powerpnt.exe, msaccess.exe,
  mspub.exe, eqnedt32.exe, or visio.exe) spawning a child process whose command line contains a
  stacked directory-traversal sequence (`../../../..`, `..\..\..\..`, or `..//..//..//..`). Both
  conditions must hold together for the rule to fire. Exploitation and command injection reached
  through a crafted document commonly pass a traversal string so the argument resolves from the
  drive root regardless of the working directory; documented cases include the MSHTML
  (CVE-2021-40444) and MSDT (CVE-2022-30190) vulnerabilities, both triggered by opening a
  document. Office does legitimately spawn a limited set of children — add-in hosts,
  click-to-run updaters, registered protocol handlers, and print helpers — but those rarely carry
  stacked `..` segments, which is what makes the traversal string the discriminator here.
  Determine what the resolved path points at, which document caused the Office process to run,
  whether the same Office instance spawned other children, and whether the same document reached
  other users.
type: detection
detection_id: 868955d9-697e-45d4-a3da-360cefd7c216
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Was this child spawned by an Office application, and does its command line contain a
    stacked directory-traversal sequence?
  context: >-
    The rule requires both conditions at once: a parent ending in winword.exe, excel.exe,
    powerpnt.exe, msaccess.exe, mspub.exe, eqnedt32.exe, or visio.exe, and a child command line
    containing `../../../..`, `..\..\..\..`, or `..//..//..//..`. Confirm both in the raw event.
    The Office parent alone is not the trigger, and neither is a single `..` segment.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to open documents that launch external child processes?
  context: >-
    Roles that routinely handle documents from outside the organization see Office spawn helper
    processes more often than roles that do not. Office running on a server or a service host is
    itself outside the usual profile. Knowing the user's role and the host's function is often
    the fastest way to separate a delivered document from routine desktop work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this Office application expected to spawn this child, and what started the Office
    process itself?
  context: >-
    The parent's own command line usually names the document that was opened, and the
    grandparent tells you how it arrived — a double-click from a file browser, an attachment
    opened from a mail client, or a browser download. An Office process started by an automation
    host or a script interpreter rather than by user interaction is a different situation from an
    opened attachment.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What document or email attachment caused this Office process to run?
  context: >-
    The parent command line typically carries the document path. A path under a mail client's
    temporary directory, a downloads folder, or a network share points at delivery from outside
    the host. Documents sourced from the internet normally open in a restricted view that blocks
    active content, so a document that reached execution was either opened from a trusted
    location or explicitly enabled by the user.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - manual_review
  - edr_console
- question: What other child processes did this same Office instance spawn?
  context: >-
    Document-borne execution usually produces more than one child — a launcher, a script host or
    interpreter, and something that retrieves the next stage. Listing every child of this exact
    Office instance shows whether the alerting process was isolated or one step in a sequence.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Is this Office installation patched against known document-execution vulnerabilities?
  context: >-
    Traversal strings passed through an Office child process are the documented pattern for the
    MSHTML (CVE-2021-40444) and MSDT (CVE-2022-30190) vulnerabilities, both fixed years ago. An
    unpatched installation means the attempt could have succeeded and that other hosts at the
    same patch level are reachable the same way. An eqnedt32.exe parent additionally means the
    Equation Editor component is still present, which has no supported use.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
  answer_sources:
  - asset_inventory
  - edr_console
- question: Did this same detection fire for other users or on other hosts in the last day?
  context: >-
    A document sent to one recipient is usually sent to several. Several hosts firing this rule
    within a short window points at a mail wave or a shared file location; a single host points
    at a targeted or host-local trigger. The user list also tells you who else needs their
    mailbox and downloads reviewed.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - alert
- question: What does the full command line resolve to once the traversal sequences are followed?
  context: >-
    Stacked `..` segments walk up from the working directory until they hit the drive root, so
    the argument resolves to a fixed absolute path no matter where the process started. Resolve
    the path against CurrentDirectory to see what binary, script, or file it actually points at,
    and decode anything else on the line — a protocol handler invocation, a URL, or an inline
    script body. The query returns every traversal-carrying command on this host in the alert
    window, which catches multi-step invocations rather than only the alerting one.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
        - ../../../..
        - ..\..\..\..
        - ..//..//..//..
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What files did the Office parent process write around the time of the alert?
  context: >-
    The document itself, and anything staged alongside it, are normally written by the Office
    process into cache or temporary directories before the child is spawned. File events carrying
    the parent's process identity surface the triggering document path and any payload dropped
    with it, which is the artifact to preserve for analysis.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Has this Office application spawned this child binary on this host before?
  context: >-
    Office legitimately spawns a small set of children — add-in hosts, click-to-run updaters,
    registered protocol handlers, and print helpers. A 90-day count in the hundreds with a steady
    rhythm describes one of those; zero or a handful describes a new spawning relationship. This
    count covers the parent-child pairing regardless of arguments, so treat it as background
    frequency for the pairing rather than history of the traversal string.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Has any process on this host previously run with stacked traversal sequences in its
    command line?
  context: >-
    Build tools, installers, and packaging scripts sometimes pass relative paths with repeated
    `..` segments, and those executions have nothing to do with Office. A host with an
    established history of these strings tells you the traversal string alone is unremarkable
    there and that the Office parent is doing the work in this alert. A host with no such history
    makes the alerting invocation the first of its sort.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
        - ../../../..
        - ..\..\..\..
        - ..//..//..//..
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: Has this user previously produced Office-spawned traversal commands, and does that
    history fit their role?
  context: >-
    The query mirrors the rule's own selection scoped to this user, so the result is their 90-day
    history of this exact firing pattern rather than generic Office use, aggregated by host. A
    user who has never produced it is a different situation from one who produces it weekly.
    Weigh the count against what the user's role would explain — a developer or packager may have
    a reason; a document-handling role generally does not.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        ParentImage|endswith:
        - \winword.exe
        - \excel.exe
        - \powerpnt.exe
        - \msaccess.exe
        - \mspub.exe
        - \eqnedt32.exe
        - \visio.exe
        CommandLine|contains:
        - ../../../..
        - ..\..\..\..
        - ..//..//..//..
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Has this Office parent driven the same traversal pattern before, on this host or
    elsewhere?
  context: >-
    When the alert fires under a service principal or a machine account, user identity attributes
    nothing and the launch mechanism is the meaningful pivot. The query mirrors the rule's
    selection scoped to the alerting parent process, so the result is the 90-day history of this
    Office binary driving this specific pattern. A parent that already accounts for thousands of
    prior events is an installed integration; a new or rare one is the deviation worth chasing.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        ParentImage|endswith:
        - \winword.exe
        - \excel.exe
        - \powerpnt.exe
        - \msaccess.exe
        - \mspub.exe
        - \eqnedt32.exe
        - \visio.exe
        CommandLine|contains:
        - ../../../..
        - ..\..\..\..
        - ..//..//..//..
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What else did this user run across the environment around the time of the alert?
  context: >-
    If a delivered document was opened, the same account often has other activity in the same
    hour — a second document, a browser download, or a logon to another host. Tracking the
    account across all hosts rather than just this one shows whether the activity is confined to
    the alerting endpoint. When the alert fires under SYSTEM or a machine account this view
    returns routine service telemetry and the parent-scoped fleet view is the meaningful answer.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did this same Office-parent traversal pattern fire on other hosts in the same window?
  context: >-
    The query mirrors the rule's selection scoped to the alerting parent process, fleet-wide,
    across the alert window. Several hosts producing the pattern in the same hour points at a
    document that reached multiple recipients or at pushed automation; a single host points at a
    host-local trigger. This view stays meaningful when the alerting account is a service
    principal, where a user pivot would return unrelated service telemetry.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        ParentImage|endswith:
        - \winword.exe
        - \excel.exe
        - \powerpnt.exe
        - \msaccess.exe
        - \mspub.exe
        - \eqnedt32.exe
        - \visio.exe
        CommandLine|contains:
        - ../../../..
        - ..\..\..\..
        - ..//..//..//..
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Aggregating every process by binary and parent collapses routine service and agent telemetry
    into a few high-count rows, leaving novel parent-child pairings visible at low counts. Scan
    for interpreters, archive utilities, and remote-access tooling appearing under parents that
    do not normally launch them.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Is this Office parent spawning the same child binary on other hosts?
  context: >-
    The same parent-child pairing on several hosts within a day describes either a fleet-wide
    integration such as an add-in or updater, or the same document reaching multiple recipients.
    A single host makes a host-local cause more likely. This counts the pairing only and not the
    traversal argument, so read a high count as the background rate for that pairing across the
    environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host help place this event in a sequence. Look for a mail or
    browser-sourced file write, followed by document execution, followed by whatever the spawned
    child did next. An empty result narrows the timeline to this Office process; earlier hits
    extend it backwards.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
