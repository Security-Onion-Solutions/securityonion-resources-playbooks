name: Suspicious Child Process Of SQL Server
id: a10d02f2-a702-44c9-85ee-49da1f4292ed
description: |
  Detects the SQL Server database engine (sqlservr.exe) starting a shell, script host, or
  reconnaissance binary. The rule fires when a process whose parent path ends in \sqlservr.exe
  starts one of bash.exe, bitsadmin.exe, cmd.exe, netstat.exe, nltest.exe, ping.exe,
  powershell.exe, pwsh.exe, regsvr32.exe, rundll32.exe, sh.exe, systeminfo.exe, tasklist.exe,
  or wsl.exe, and it excludes one known DATEV database-engine install path that launches
  cmd.exe as part of normal operation.
  The engine reaches operating-system command execution mainly through xp_cmdshell, a stored
  procedure that is disabled by default but that database administrators and some vendor
  products deliberately enable, and secondarily through CLR assemblies, SQL Agent CmdExec job
  steps, or Ole Automation procedures. The same path is what SQL injection against an
  Internet-facing application converts into remote code execution, so the discriminating
  questions are whether those surfaces are enabled on this instance and whether the command
  that ran belongs to a documented job.
  Determine which surface is enabled, recover the statement or job step that drove the
  execution, read the child's full command line, and establish whether the engine has driven
  this pattern before on this host or elsewhere in the environment.
type: detection
detection_id: 869b9ca7-9ea2-4a5a-8325-e80e62f75445
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Which binary did the database engine spawn, and does the parent path confirm it is a SQL Server engine process?
  context: >-
    Confirm the alert before spending time on it. The parent path must end in \sqlservr.exe and
    the child must be one of the fourteen binaries the rule lists: bash.exe, bitsadmin.exe,
    cmd.exe, netstat.exe, nltest.exe, ping.exe, powershell.exe, pwsh.exe, regsvr32.exe,
    rundll32.exe, sh.exe, systeminfo.exe, tasklist.exe, wsl.exe. Which one fired matters for
    everything downstream: ping.exe or tasklist.exe from a monitoring job reads very differently
    from regsvr32.exe or bitsadmin.exe. The rule carves out one DATEV database-engine install
    path launching cmd.exe; if the parent matches that path and the alert still fired, record it
    as a tuning gap rather than an investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
  answer_sources:
  - alert
  - process_creation
- question: Is this SQL Server instance expected to run operating-system commands, and what started the engine process itself?
  context: >-
    The parent-child relationship is the core signal for this detection. The engine runs
    continuously under a service account, so its own start event is often days old — the -7d
    lookup returns the engine's command line, which names the instance and its install path, and
    the service control chain that launched it. An engine that legitimately shells out does so
    because xp_cmdshell, a CLR assembly, or a SQL Agent CmdExec step was deliberately enabled by
    an administrator or a vendor installer, and that decision is recorded somewhere. An engine
    started from an unexpected path, or one whose install directory sits outside the standard
    Microsoft SQL Server tree, is worth reconciling before anything else.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What SQL statement, stored procedure, or Agent job step drove this command execution, and is xp_cmdshell enabled on this instance?
  context: >-
    SQL Server reaches the operating system mainly through xp_cmdshell — disabled by default,
    deliberately enabled by some administrators and vendor products — and secondarily through
    CLR assemblies, SQL Agent CmdExec steps, or Ole Automation procedures. Establish which of
    those is enabled, then recover the statement that ran from the SQL error and audit logs,
    Agent job history, and the application tier's query and web logs around the alert time.
    Injected input usually leaves a trace in the request that carried it — `../`, `union select`,
    `cmd=`, `${jndi:`, `rO0AB` (Java serialization), `%00`, `${env:}`, `${${::-j}ndi}` — often
    alongside a spike of more than about 5 HTTP 4xx/5xx responses in 5 minutes from one client or
    against one URI. A statement arriving from an application account over a web front end points
    to injected input; one matching a documented job step points to routine automation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - manual_review
  - edr_console
- question: Is this host and this service account expected to run operating-system commands from the database engine?
  context: >-
    Legitimate administrative activity triggers many detections. A database engine normally runs
    under a dedicated identity — a virtual account, a managed service account, or a domain
    account — whose job is to serve queries, not to run shells. Knowing whether this host is a
    production database server, a packaged vendor appliance, or a developer instance, and whether
    its service account is documented as running command steps, is usually the fastest way to
    separate a scheduled job from injected execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this SQL Server instance patched, and are its command-execution surfaces configured the way the environment intends?
  context: >-
    Command execution through a database engine follows either a deliberately enabled surface, a
    misconfiguration, or an application-layer injection flaw. Record the instance's build and
    cumulative-update level, then confirm how xp_cmdshell, Ole Automation Procedures, and CLR
    strict security are set, and when those settings last changed. An instance at current patch
    level with xp_cmdshell disabled narrows the path to an authenticated administrative action or
    to a configuration change made shortly before the alert; an instance with xp_cmdshell already
    enabled for a vendor product widens the set of accounts that could have reached it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
  answer_sources:
  - asset_inventory
  - edr_console
- question: What other processes did this same engine instance spawn around the alert?
  context: >-
    Command execution through a database engine rarely stops at one command. Listing every child
    of this engine instance in the surrounding window shows whether the alert is an isolated job
    step or one command in a sequence — enumeration, then download, then account manipulation or
    persistence. Several unrelated children from the same engine instance within minutes points
    to an operator driving the instance interactively rather than to a scheduled task, which
    tends to produce the same small set of children on a fixed cadence.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Did this same rule fire on other database servers in the last 24 hours?
  context: >-
    Exploitation of a database tier rarely reaches only one instance. A vulnerable application
    front end, a shared service account, or a management port exposed by a common build image
    tends to expose every engine built the same way. Correlating this detection across hosts shows
    how many engines executed operating-system commands in the same window and which of them need
    the same query-log and job-history review.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - alert
- question: What is the full command line the engine passed to the child, and if it is encoded or obfuscated, what does it decode to?
  context: >-
    This is the payload the database layer handed to the operating system, so read the arguments
    end to end. A bare ping or tasklist from a monitoring job looks nothing like a cmd /c wrapper
    that pipes into powershell with -enc, a Net.WebClient or Invoke-WebRequest download cradle, a
    bitsadmin /transfer, or a rundll32 call into an exported function. Base64 behind
    -EncodedCommand or -enc is the most common wrapper; decode it, and for layered encoding keep
    decoding until the content is readable, then identify what the decoded content fetches,
    writes, or executes and where that destination or path lives.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: If the engine launched PowerShell, did script block logging capture the deobfuscated script content?
  context: >-
    Event ID 4104 records the script text PowerShell actually compiled, even when the command line
    was encoded, which makes it ground truth about what ran. On a database server the volume of
    4104 events is normally low, so entries in the alert window are easy to read and attribute. If
    PowerShell operational logs are not ingested in this environment, treat zero results as a
    visibility gap rather than evidence nothing ran, and decode the alerting command line directly
    instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
  answer_sources:
  - powershell_script_block
- question: Did anything on this host weaken PowerShell or antimalware controls in the hour before the alert?
  context: >-
    Execution reached through a database engine is commonly preceded by an execution-policy
    bypass, an AMSI patch, a real-time-monitoring disable, or a downgrade to PowerShell v2, which
    lacks script block logging. A database server runs interactive PowerShell rarely, so these
    strings appearing there in the preceding hour place the alerting command inside a prepared
    execution chain rather than a maintenance task. Note whether the bypass ran under the engine's
    own service account or a named one — the two imply different entry points.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Did other reconnaissance commands run on this host around the same time?
  context: >-
    Five of the binaries this rule matches — netstat.exe, nltest.exe, ping.exe, systeminfo.exe,
    tasklist.exe — are enumeration tools, and one of them alone may be a monitoring script. Three
    or more distinct discovery binaries within fifteen minutes is the pattern of automated
    post-exploitation enumeration: whoever just obtained command execution establishes the host's
    identity, domain membership, network position, and running software before choosing the next
    step. Check which account each ran under; a burst under the engine's service account ties the
    enumeration back to the database path.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: What modules did the database engine load in the day before this alert, and are any unsigned or outside the install path?
  context: >-
    The server-software-component technique implants code inside the server process itself — an
    extended stored procedure DLL, a CLR assembly registered with UNSAFE permission, or a replaced
    module — so the engine keeps offering command execution across restarts with no dropped file
    in a web root to find. The install directory of this instance is the tuning parameter: modules
    loaded from outside it, unsigned modules, and modules whose signature resolves to neither
    Microsoft nor a documented vendor are the ones to reconcile against the instance's registered
    assemblies and extended stored procedures. A module first loaded hours or days before this
    execution is the implant-then-use interval the technique produces.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\sqlservr.exe'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
  answer_sources:
  - process_creation
  - manual_review
- question: Did the alerting child process open outbound network connections, and to what destinations?
  context: >-
    The exploit-to-command-execution path commonly ends in a callback: the command fetches a next
    stage or opens a channel to operator infrastructure, typically within about fifteen minutes of
    the spawn. A database engine's expected egress is narrow — replication partners, linked
    servers, a backup target, an update endpoint — and an internal-tier engine often has no route
    to the internet at all. Resolve every destination against that list and against the public
    addresses that front this application tier; an egress connection from a shell or LOLbin
    running under the engine to anything outside it is the finding.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
- question: Which accounts authenticated to this host in the hour before the alert, and were explicit credentials presented?
  context: >-
    The detection strategy for server-side command execution pairs the server process spawning a
    shell with the host's authentication record. Event 4624 shows which accounts logged on and by
    what logon type, and 4648 shows a process presenting explicit credentials, which is how an
    operator moves from a service context to a named account. An interactive or remote-interactive
    logon by a database administrator immediately before the alert supports a hands-on maintenance
    explanation. Command execution with no preceding logon, under the engine's own service
    account, points back at the query path instead — the statement, not a session, is the entry
    point.
  range: -1h
  query: |
    aggregation: true
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4624
          - 4648
      condition: selection
    fields:
      - EventID
      - TargetUserName
      - LogonType
      - IpAddress
  answer_sources:
  - active_directory
  - manual_review
- question: Has this account previously produced the rule's pattern, and does that history fit its role?
  context: >-
    The query mirrors the rule's selection structure scoped to this account — the result is the
    account's 90-day history of the engine spawning these binaries, aggregated by host, not
    generic use of cmd.exe or powershell.exe. If the alert fired under the engine's service
    account, the count answers whether that identity routinely drives command execution here. An
    account with no prior history producing this pattern is the deviation worth chasing; weigh the
    count against the role, since a database administrator running maintenance shell-outs looks
    nothing like an application account.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \sqlservr.exe
        Image|endswith:
        - \bash.exe
        - \bitsadmin.exe
        - \cmd.exe
        - \netstat.exe
        - \nltest.exe
        - \ping.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \sh.exe
        - \systeminfo.exe
        - \tasklist.exe
        - \wsl.exe
      filter_optional_datev:
        ParentImage|startswith: C:\Program Files\Microsoft SQL Server\
        ParentImage|endswith: DATEV_DBENGINE\MSSQL\Binn\sqlservr.exe
        Image: C:\Windows\System32\cmd.exe
        CommandLine|startswith: '"C:\Windows\system32\cmd.exe" '
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Has the engine process historically driven this pattern on this host or across the environment, or is this parent new for the activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute behavior; the
    launch mechanism does. The query mirrors the rule's selection structure scoped to the alerting
    parent process, so the result is the 90-day history of the engine driving this specific
    pattern, aggregated by host. A parent that already accounts for thousands of prior events
    across several database servers is vendor or job automation — reconcile it against the SQL
    Agent job catalogue and the instance's documented command steps, and it becomes the
    environment's own allow-list of expected children rather than a list someone had to write. A
    parent with no history for this pattern is the deviation worth chasing.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \sqlservr.exe
        Image|endswith:
        - \bash.exe
        - \bitsadmin.exe
        - \cmd.exe
        - \netstat.exe
        - \nltest.exe
        - \ping.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \sh.exe
        - \systeminfo.exe
        - \tasklist.exe
        - \wsl.exe
      filter_optional_datev:
        ParentImage|startswith: C:\Program Files\Microsoft SQL Server\
        ParentImage|endswith: DATEV_DBENGINE\MSSQL\Binn\sqlservr.exe
        Image: C:\Windows\System32\cmd.exe
        CommandLine|startswith: '"C:\Windows\system32\cmd.exe" '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What else did this account do across the environment around this time?
  context: >-
    Tracking the account's activity across all hosts shows whether the command execution is
    confined to this database server or reaches others, which separates a host-local problem from
    a credential being used broadly. If the alert fired under a named account, activity on several
    hosts within the hour suggests an operator or a script driving that identity. If it fired under
    a service principal such as the engine's virtual account, a machine account, or SYSTEM, this
    view returns routine service and agent telemetry from every host — read the parent-driven
    fleet view instead and treat the volume here as noise rather than scope.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did the same engine-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, an account-wide sweep returns routine agent telemetry from every
    host. The meaningful question is whether the same launch mechanism fired elsewhere: the query
    mirrors the rule's selection structure scoped to the alerting parent process, fleet-wide, in
    the alert window. Several database engines executing operating-system commands in the same
    hour points to a scheduled or pushed job, or to an application flaw reachable against each of
    them; a single host points to a host-local trigger and keeps the query-log review narrow.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \sqlservr.exe
        Image|endswith:
        - \bash.exe
        - \bitsadmin.exe
        - \cmd.exe
        - \netstat.exe
        - \nltest.exe
        - \ping.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \sh.exe
        - \systeminfo.exe
        - \tasklist.exe
        - \wsl.exe
      filter_optional_datev:
        ParentImage|startswith: C:\Program Files\Microsoft SQL Server\
        ParentImage|endswith: DATEV_DBENGINE\MSSQL\Binn\sqlservr.exe
        Image: C:\Windows\System32\cmd.exe
        CommandLine|startswith: '"C:\Windows\system32\cmd.exe" '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
