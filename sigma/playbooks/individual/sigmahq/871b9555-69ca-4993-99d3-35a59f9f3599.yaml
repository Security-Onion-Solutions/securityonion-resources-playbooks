name: Suspicious UltraVNC Execution
id: c486efd5-40c1-4cbf-a130-30f6dc5faef0
description: |
  Detects an UltraVNC viewer invocation whose command line combines the auto-reconnect, connect, and id flags
  (-autoreconnect AND -connect AND -id:), a combination that configures the client to call back to a listening
  endpoint and re-establish the session automatically — typically used to keep a hands-on-keyboard remote-control
  channel alive across reboots or network drops. Legitimate IT support occasionally uses VNC clients, but the
  specific auto-reconnect-plus-connect-plus-id pattern is characteristic of attacker-staged remote access deployed
  for persistence and lateral control. Investigation should confirm the flag combination on the alerting process,
  determine who and what launched it, identify the connect-back endpoint and id, and establish whether the same
  pattern reached other hosts.
type: detection
detection_id: 871b9555-69ca-4993-99d3-35a59f9f3599
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line carry the auto-reconnect, connect, and id flags together?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command
    line. The rule fires only when all three flags are present together (-autoreconnect AND -connect AND -id:);
    verify each is on the alerting process and read the connect target and id value they carry.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run a VNC remote-control client configured to auto-reconnect to an
    external endpoint?
  context: Legitimate administrative activity can trigger this detection — for example, an IT technician running a
    sanctioned remote-support client. Knowing whether the user role and host function are consistent with running
    an auto-reconnecting VNC viewer is often the fastest path to distinguishing routine support from attacker-staged
    remote access.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is UltraVNC on the organization's approved remote access software list?
  context: Organizations typically sanction a specific remote access or remote-support tool for IT use. A VNC client
    that is not on the approved list — even widely used software — may represent shadow IT or attacker-deployed
    persistence, and should be checked regardless of the tool's reputation. The auto-reconnect/connect/id flag pattern
    in particular is unusual for routine interactive support.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a current helpdesk ticket or scheduled support session explaining this VNC connection?
  context: Legitimate remote access typically correlates with an active support ticket, a maintenance window, or a
    user request. If no support context exists for this session, the auto-reconnect configuration suggests the client
    was set up for unattended, persistent access rather than a one-time interactive support call.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: 'What connect-back endpoint and id did this command line specify? Decode the -connect and -id: arguments.'
  context: >-
    The full command line reveals where the client was told to call back and which session identifier it used.
    Read the value following the -connect flag (host/IP and optional port of the listening endpoint) and the value
    following the -id flag (the connection/relay id), and note whether the endpoint is internal, an external
    address, or a relay service. These values are the pivot for identifying the controlling host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this VNC client, and is that parent chain expected?
  context: The parent process reveals how the client was launched. A user-initiated session typically descends from
    explorer.exe; launch from wscript.exe, mshta.exe, cmd.exe driving a script, an archive self-extractor, or a
    scheduled-task host points to automated or staged deployment rather than interactive support.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What processes were spawned on this host after the VNC client connected?
  context: A remote-control session is a means to an end — once interactive control is established, the operator
    executes commands, deploys tools, or accesses data. Examining processes spawned shortly after the client started
    reveals what was done through the session and whether hands-on-keyboard activity followed.
  range: +30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - Image
- question: What external endpoint and port did the VNC client connect to from this host?
  context: VNC clients establish outbound sessions to a listening viewer or relay. The destination reveals whether
    the connect-back endpoint is an internal admin host, an external address, or a relay service. Cross-check the
    observed destination against the -connect value read from the command line; a mismatch or an unexpected external
    address shifts the disposition toward attacker-controlled infrastructure. The query is anchored on the alerted
    VNC client process itself, so only its connections are returned; a zero means the session never left the host
    or the connection was not captured, not that the attempt was benign.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: When this host previously fired this flag pattern, which parents and users drove it, and does the current
    alert fit?
  context: Even legitimate tools can be abused. This view shows how the rule's specific firing pattern (the
    auto-reconnect/connect/id combination, not generic VNC usage) has historically run on this host. A new parent
    process, an unexpected user account, or a first-time appearance of the pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - '-autoreconnect '
        - '-connect '
        - '-id:'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What is the interactive logon context on this host around the VNC session start -- was a new interactive
    or remote-interactive session created?
  context: A VNC remote-control session manifests as an interactive desktop session for the connecting operator.
    Correlating the client start with logon activity (interactive type 2 and remote-interactive type 10 logons)
    distinguishes an operator driving a live desktop from a backgrounded client that merely established the channel.
    Pair this with the logon-event detail to confirm whether session creation accompanied the client start.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 4624
        LogonType:
          - 2
          - 10
        ComputerName|expand: '%hostname%'
      condition: selection
    fields:
      - TargetUserName
      - LogonType
      - IpAddress
- question: What command-line activity ran under the account tied to this VNC session in the surrounding window?
  context: Lateral movement via remote control is followed by command execution, file manipulation, or further
    network connections under the connecting account. Reviewing what that account ran around the session start
    reveals whether the remote operator performed reconnaissance, staged tools, or moved toward other systems.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Have other hosts fired this same flag pattern in the past week, and does the cross-host spread look like
    automation or isolated activity?
  context: This is a fleet-wide count of the rule's firing pattern (the auto-reconnect/connect/id combination), not
    generic VNC usage. Many hosts firing the same pattern points to scripted or pushed deployment; one host or a
    small unrelated set points to a targeted, operator-driven session. Use the host spread and parent consistency to
    calibrate scope and severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - '-autoreconnect '
        - '-connect '
        - '-id:'
      condition: selection
    fields:
    - host.name
- question: What else did this user do across the network around the time of the VNC session?
  context: Tracking the connecting account's activity across all hosts reveals lateral movement or activity on
    multiple endpoints. If the same account drove similar activity on other hosts in the same window, the scope of
    the remote-access operation may be larger than this single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - '-autoreconnect '
        - '-connect '
        - '-id:'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before the VNC session?
  context: Remote-control deployment rarely happens in isolation. Earlier detections on the same host — script-host
    execution, scheduled-task creation, ingress tool transfer, or defense tampering — may reveal the staging that
    preceded the remote-access channel and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Is this same VNC flag pattern occurring on other hosts?
  context: Staged remote-access deployment often pushes the same client configuration across many systems. Finding
    the same auto-reconnect/connect/id flag combination on other hosts shows the activity is not isolated and helps
    determine the scope for containment.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - '-autoreconnect '
        - '-connect '
        - '-id:'
      filter_self:
        host.name|expand: '%hostname%'
      condition: selection and not filter_self
    fields:
      - host.name
