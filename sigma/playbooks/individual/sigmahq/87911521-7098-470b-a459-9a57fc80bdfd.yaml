name: Sysmon Configuration Update
id: c57b4165-4a55-4338-959b-701a2aa8bbc8
description: |
  Detects execution of Sysmon (Sysmon64.exe or Sysmon.exe, or a binary whose
  description is "System activity monitor") with a command line containing the
  -c switch AND the binary/description match. The -c switch live-reloads or dumps
  Sysmon's configuration; an actor can swap in a bare-bones config to silence
  telemetry without stopping the service, leaving the host monitored on paper but
  blind in practice. Legitimately, administrators update Sysmon config during
  tuning or deployment. Determine which config was applied, who applied it, what
  the parent process was, and whether the change coincides with other defense
  tampering or activity that the reduced telemetry would have hidden.
type: detection
detection_id: 87911521-7098-470b-a459-9a57fc80bdfd
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does this execution match the rule — a Sysmon binary (or a "System activity monitor" process) run with the -c config switch?
  context: Confirm the alert is a true positive by reviewing the exact image, description, and command line against the rule's criteria. The rule requires both the binary/description match AND a -c switch, so verify the command line actually carries -c and note the config path or argument that follows it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - Description
- question: Is this user and host expected to update Sysmon configuration?
  context: Sysmon config updates are routine on hosts managed by a detection-engineering or IT team and unusual elsewhere. Knowing whether the user role and host function include telemetry administration is often the fastest way to separate a tuning change from an attempt to blind monitoring.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What configuration did this -c invocation apply, and does it reduce Sysmon's coverage?
  context: The full command line reveals the config the operator pushed. A path to a known tuning baseline points to maintenance; a path under a user-writable or temp directory, an inline minimal config, or a -c with no path (which dumps current config) point to reconnaissance or an attempt to install a bare-bones config. Read the argument after -c and, where possible, compare the applied config against the expected baseline to see which event types were dropped.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned this Sysmon execution, and is that parent chain expected?
  context: The parent process reveals how the config update was invoked. Administrative tuning typically descends from an interactive shell, a management agent, or a deployment tool. A parent such as a script host, an Office application, or a binary in a user-writable directory points to operator-driven tampering rather than scheduled administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Was Sysmon's driver or service registry configuration modified around the time of this config update?
  context: Sysmon stores its boot-start driver and service settings under HKLM\SYSTEM\CurrentControlSet\Services (the driver, by default SysmonDrv, and the Sysmon service). Renaming the driver, changing its Start value, or editing service parameters is a way to blind or relocate monitoring that a -c config reload alone does not show. Registry edits to these keys in the same window as the config update strengthen the case for deliberate tampering. If registry_set events are not collected in this environment, treat zero results as a visibility gap rather than evidence nothing changed.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\Services\SysmonDrv'
          - '\Services\Sysmon64'
          - '\Services\Sysmon\'
      condition: selection_host and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: Is Sysmon still emitting its normal telemetry after this config update, or has event coverage dropped?
  context: A config update may be temporary tuning or a persistent reduction in coverage. Confirm Sysmon's current effective configuration and event volume — if expected event types (process access, image load, registry, network) are no longer emitting after this change, the host is monitored in name only and the config should be restored before further investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What activity occurred on this host after the Sysmon configuration was changed?
  context: Operators reduce telemetry to enable actions that would otherwise be logged or blocked. Examining process activity immediately after the config update reveals what the reduced coverage may have been meant to hide — credential access, payload execution, or lateral movement. A drop in event volume followed by process creation in that window points to the activity the change enabled.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense tampering actions performed on this host?
  context: Operators who reduce one control often reduce several — pairing a Sysmon config swap with stopping AV/EDR, clearing event logs, or disabling Defender to maximize coverage. Finding multiple tampering events from the same user or parent process in the surrounding window indicates several controls were targeted in one operation.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Does this host normally run Sysmon with the -c config switch?
  context: A config update that has never been seen on a host is more notable than one that recurs on a tuning schedule. Zero or very low historical counts of Sysmon running on this host indicate a first-time or rare config interaction worth scrutinizing against expected administration.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously run Sysmon with -c, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Config updates can be routine maintenance. This query mirrors the rule's selection structure scoped to this host, so the resulting parent/user distribution reflects how the rule's specific firing pattern has historically run here. A new parent process, an unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_pe:
      - Image|endswith:
        - \Sysmon64.exe
        - \Sysmon64a.exe
        - \Sysmon.exe
      - Description: System activity monitor
      selection_cli:
        CommandLine|contains|windash: -c
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_pe:
      - Image|endswith:
        - \Sysmon64.exe
        - \Sysmon64a.exe
        - \Sysmon.exe
      - Description: System activity monitor
      selection_cli:
        CommandLine|contains|windash: -c
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_pe:
      - Image|endswith:
        - \Sysmon64.exe
        - \Sysmon64a.exe
        - \Sysmon.exe
      - Description: System activity monitor
      selection_cli:
        CommandLine|contains|windash: -c
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated changes across multiple endpoints. If the same user reduced telemetry or ran related tooling on several hosts, the scope of the operation may be larger than this one alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_pe:
      - Image|endswith:
        - \Sysmon64.exe
        - \Sysmon64a.exe
        - \Sysmon.exe
      - Description: System activity monitor
      selection_cli:
        CommandLine|contains|windash: -c
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — reconnaissance, credential access, or other defense tampering — may reveal the stages that preceded reducing telemetry and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
