name: Enumeration for 3rd Party Creds From CLI
id: 0f10f913-53a2-4cdc-9804-e88655047bdc
description: |
  Detects a process whose command line references the registry paths used by third-party
  applications (mail clients, FTP/SFTP/SSH clients, VNC/RDP tools, OpenVPN, MobaXterm,
  Radmin, and others) to store saved credentials. The rule fires when the command line
  contains any of those credential-store registry paths AND the process is not reg.exe
  performing an export/save (that case is handled by a separate rule). Legitimate hits are
  rare — these keys have no benign reason to be enumerated by anything other than the
  application that owns them — so the investigation should confirm what was queried, which
  application's saved credentials were targeted, who and what launched the query, and
  whether credential access was followed by lateral movement or exfiltration.
type: detection
detection_id: 87a476dc-0079-4583-a985-dee7a20a03de
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line reference one of the third-party credential-store registry paths this rule detects?
  context: Confirm the alert is a true positive by reading the exact command line and checking
    that it contains one of the watched registry paths (for example \Software\SimonTatham\PuTTY\Sessions,
    \Software\Mobatek\MobaXterm\, \Software\Martin Prikryl\WinSCP 2\Sessions, or
    \Software\FTPWare\COREFTP\Sites) and that the process is not reg.exe doing an export/save.
    Note which application's credential store the matched path belongs to — that drives the rest of the investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to enumerate third-party application credential stores from the command line?
  context: Querying these registry paths is normal only for the owning application itself or for a
    deliberate credential-migration/backup task. A general-purpose user or service account reading
    saved-credential keys for SSH, FTP, VNC, or mail clients is unusual and is often the fastest way
    to separate a true positive from routine activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which application's saved credentials were targeted, and were multiple credential stores queried together?
  context: Decode the command line to identify which third-party store was read — MobaXterm
    (\Software\Mobatek\MobaXterm\ holds base64 SSH/SFTP/RDP secrets), PuTTY sessions and host keys,
    WinSCP sessions, CoreFTP/FFFTP sites, OpenVPN configs, Radmin/VNC passwords, or a mail client
    (Foxmail, IncrediMail, Eudora, Becky!). A single process referencing several of these paths in
    quick succession is a strong credential-harvesting fingerprint and tells you which application
    accounts may be exposed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: How many distinct third-party credential registry paths were referenced on this host in a short window, and by which processes?
  context: A single legitimate read touches one application's key; a stealer sweeps many. Counting how
    many of the watched credential paths were queried across the host's processes in a tight window
    distinguishes a one-off lookup from an automated enumeration of every saved-credential store. Review
    the Image and command line of each matching process to see whether one tool drove the whole sweep.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
        - \Software\Aerofox\Foxmail\V3.1
        - \Software\Aerofox\FoxmailPreview
        - \Software\DownloadManager\Passwords
        - \Software\FTPWare\COREFTP\Sites
        - \Software\IncrediMail\Identities
        - \Software\Martin Prikryl\WinSCP 2\Sessions
        - \Software\Mobatek\MobaXterm\
        - \Software\OpenSSH\Agent\Keys
        - \Software\OpenVPN-GUI\configs
        - \Software\ORL\WinVNC3\Password
        - \Software\Qualcomm\Eudora\CommandLine
        - \Software\RealVNC\WinVNC4
        - \Software\RimArts\B2\Settings
        - \Software\SimonTatham\PuTTY\Sessions
        - \Software\SimonTatham\PuTTY\SshHostKeys\
        - \Software\Sota\FFFTP
        - \Software\TightVNC\Server
        - \Software\WOW6432Node\Radmin\v3.0\Server\Parameters\Radmin
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What process spawned the process that queried these credential keys, and is that parent chain expected?
  context: The parent reveals how the enumeration was launched. A query of saved-credential keys spawned
    from explorer.exe during interactive admin work reads differently than one spawned from a script host
    (wscript.exe, cscript.exe, powershell.exe), an Office application, or an unexpected downloader.
    An unusual parent points toward post-exploitation rather than legitimate use.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously fired this credential-enumeration pattern, what parents and users normally drove it, and does the current alert fit?
  context: The query mirrors the rule's selection scoped to this host, so the resulting parent/user
    distribution reflects how this specific pattern has historically run here — not generic process usage.
    A new parent process, an unexpected user account, or a first-ever appearance of the pattern on this
    host is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - \Software\Aerofox\Foxmail\V3.1
        - \Software\Aerofox\FoxmailPreview
        - \Software\DownloadManager\Passwords
        - \Software\FTPWare\COREFTP\Sites
        - \Software\IncrediMail\Identities
        - \Software\Martin Prikryl\WinSCP 2\Sessions
        - \Software\Mobatek\MobaXterm\
        - \Software\OpenSSH\Agent\Keys
        - \Software\OpenVPN-GUI\configs
        - \Software\ORL\WinVNC3\Password
        - \Software\Qualcomm\Eudora\CommandLine
        - \Software\RealVNC\WinVNC4
        - \Software\RimArts\B2\Settings
        - \Software\SimonTatham\PuTTY\Sessions
        - \Software\SimonTatham\PuTTY\SshHostKeys\
        - \Software\Sota\FFFTP
        - \Software\TightVNC\Server
        - \Software\WOW6432Node\Radmin\v3.0\Server\Parameters\Radmin
      filter_main_other_rule:
        Image|endswith: reg.exe
        CommandLine|contains:
        - export
        - save
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this credential-enumeration pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this
    specific pattern. Many hosts firing the same pattern points to scripted deployment or a credential
    backup/migration tool; one host or a small unrelated set points to manual operator activity. Use the
    host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - \Software\Aerofox\Foxmail\V3.1
        - \Software\Aerofox\FoxmailPreview
        - \Software\DownloadManager\Passwords
        - \Software\FTPWare\COREFTP\Sites
        - \Software\IncrediMail\Identities
        - \Software\Martin Prikryl\WinSCP 2\Sessions
        - \Software\Mobatek\MobaXterm\
        - \Software\OpenSSH\Agent\Keys
        - \Software\OpenVPN-GUI\configs
        - \Software\ORL\WinVNC3\Password
        - \Software\Qualcomm\Eudora\CommandLine
        - \Software\RealVNC\WinVNC4
        - \Software\RimArts\B2\Settings
        - \Software\SimonTatham\PuTTY\Sessions
        - \Software\SimonTatham\PuTTY\SshHostKeys\
        - \Software\Sota\FFFTP
        - \Software\TightVNC\Server
        - \Software\WOW6432Node\Radmin\v3.0\Server\Parameters\Radmin
      filter_main_other_rule:
        Image|endswith: reg.exe
        CommandLine|contains:
        - export
        - save
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - \Software\Aerofox\Foxmail\V3.1
        - \Software\Aerofox\FoxmailPreview
        - \Software\DownloadManager\Passwords
        - \Software\FTPWare\COREFTP\Sites
        - \Software\IncrediMail\Identities
        - \Software\Martin Prikryl\WinSCP 2\Sessions
        - \Software\Mobatek\MobaXterm\
        - \Software\OpenSSH\Agent\Keys
        - \Software\OpenVPN-GUI\configs
        - \Software\ORL\WinVNC3\Password
        - \Software\Qualcomm\Eudora\CommandLine
        - \Software\RealVNC\WinVNC4
        - \Software\RimArts\B2\Settings
        - \Software\SimonTatham\PuTTY\Sessions
        - \Software\SimonTatham\PuTTY\SshHostKeys\
        - \Software\Sota\FFFTP
        - \Software\TightVNC\Server
        - \Software\WOW6432Node\Radmin\v3.0\Server\Parameters\Radmin
      filter_main_other_rule:
        Image|endswith: reg.exe
        CommandLine|contains:
        - export
        - save
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - \Software\Aerofox\Foxmail\V3.1
        - \Software\Aerofox\FoxmailPreview
        - \Software\DownloadManager\Passwords
        - \Software\FTPWare\COREFTP\Sites
        - \Software\IncrediMail\Identities
        - \Software\Martin Prikryl\WinSCP 2\Sessions
        - \Software\Mobatek\MobaXterm\
        - \Software\OpenSSH\Agent\Keys
        - \Software\OpenVPN-GUI\configs
        - \Software\ORL\WinVNC3\Password
        - \Software\Qualcomm\Eudora\CommandLine
        - \Software\RealVNC\WinVNC4
        - \Software\RimArts\B2\Settings
        - \Software\SimonTatham\PuTTY\Sessions
        - \Software\SimonTatham\PuTTY\SshHostKeys\
        - \Software\Sota\FFFTP
        - \Software\TightVNC\Server
        - \Software\WOW6432Node\Radmin\v3.0\Server\Parameters\Radmin
      filter_main_other_rule:
        Image|endswith: reg.exe
        CommandLine|contains:
        - export
        - save
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or parallel activity on
    multiple endpoints. If the same user enumerated credentials or ran related tooling on several hosts in
    this window, the scope of compromise may be larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - \Software\Aerofox\Foxmail\V3.1
        - \Software\Aerofox\FoxmailPreview
        - \Software\DownloadManager\Passwords
        - \Software\FTPWare\COREFTP\Sites
        - \Software\IncrediMail\Identities
        - \Software\Martin Prikryl\WinSCP 2\Sessions
        - \Software\Mobatek\MobaXterm\
        - \Software\OpenSSH\Agent\Keys
        - \Software\OpenVPN-GUI\configs
        - \Software\ORL\WinVNC3\Password
        - \Software\Qualcomm\Eudora\CommandLine
        - \Software\RealVNC\WinVNC4
        - \Software\RimArts\B2\Settings
        - \Software\SimonTatham\PuTTY\Sessions
        - \Software\SimonTatham\PuTTY\SshHostKeys\
        - \Software\Sota\FFFTP
        - \Software\TightVNC\Server
        - \Software\WOW6432Node\Radmin\v3.0\Server\Parameters\Radmin
      filter_main_other_rule:
        Image|endswith: reg.exe
        CommandLine|contains:
        - export
        - save
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Credential enumeration rarely occurs in isolation. Activity surrounding the alert reveals what
    led to it and what followed — reconnaissance, privilege escalation, staging, or exfiltration. Novel
    parent-child process pairs at low counts are what to scan for amid the high-count agent telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, initial execution — may
    reveal the attack stages that preceded this credential enumeration and help reconstruct the timeline.
    Credential access typically sits in the middle of an intrusion, so prior alerts often explain how the
    actor reached this point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Which application accounts may be exposed, and do any provide access to sensitive systems?
  context: The impact depends on what the targeted credential stores unlock. Saved WinSCP/CoreFTP/FFFTP
    sites, PuTTY/OpenSSH/MobaXterm sessions, OpenVPN configs, and VNC/Radmin passwords often grant access
    to servers, network devices, or third-party services. Cross-reference the acting user and the targeted
    applications against what those saved sessions reach to scope remediation and credential rotation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were other registry add, delete, or import operations performed on this host in the same session?
  context: Credential harvesting is frequently paired with configuration changes — staging persistence,
    disabling protections, or writing back modified keys. Finding reg.exe or regedit.exe write operations
    from the same host within a short window reveals whether the activity went beyond reading credentials
    into modifying system state.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
