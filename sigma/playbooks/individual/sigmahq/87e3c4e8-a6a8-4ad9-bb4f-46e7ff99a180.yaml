- question: Have other hosts set a permissive PowerShell policy this way in the past week, and does the distribution look like automation or one-off activity?
  context: This mirrors the rule's pattern with no host scope, giving a fleet-wide count of where the policy-bypass invocation fired. Many hosts at once points to a pushed deployment or packaging routine; one host or a small unrelated set points to manual operator activity. Use the distribution to judge how unusual this single alert is.
