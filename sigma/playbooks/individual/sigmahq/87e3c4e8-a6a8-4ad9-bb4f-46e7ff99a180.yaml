        - Bypass
        - Unrestricted
      filter_main_powershell_core:
        ParentImage:
        - C:\Windows\SysWOW64\msiexec.exe
        - C:\Windows\System32\msiexec.exe
        CommandLine|contains:
        - -NoProfile -ExecutionPolicy Bypass -File "C:\Program Files\PowerShell\7\
        - -NoProfile -ExecutionPolicy Bypass -File "C:\Program Files (x86)\PowerShell\7\
      filter_optional_avast:
        ParentImage|contains:
        - C:\Program Files\Avast Software\Avast\
        - C:\Program Files (x86)\Avast Software\Avast\
        - \instup.exe
        CommandLine|contains:
        - -ExecutionPolicy ByPass -File "C:\Program Files\Avast Software\Avast
        - -ExecutionPolicy ByPass -File "C:\Program Files (x86)\Avast Software\Avast\
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
