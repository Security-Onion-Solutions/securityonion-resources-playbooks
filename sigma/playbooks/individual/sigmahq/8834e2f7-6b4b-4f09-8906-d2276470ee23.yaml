name: PsExec/PAExec Escalation to LOCAL SYSTEM
id: ef4fcb77-0dea-4f53-8a55-b195a4211e5c
description: |
  Detects command-line flags used by PsExec and PAExec to launch a command interpreter
  (cmd, powershell, or pwsh) under the LOCAL SYSTEM account. The rule fires when a command
  line contains a system-escalation flag combination (-s, or -s with -i in either order)
  immediately preceding a shell name AND also contains one of the tool markers (psexec,
  paexec, or accepteula). Both conditions must be present together. Administrators
  occasionally escalate to SYSTEM for maintenance or while following vendor troubleshooting
  steps, so the investigation should establish whether the user, host, and parent chain are
  consistent with sanctioned administration, or whether this is an operator obtaining an
  interactive SYSTEM shell as a step toward credential access, lateral movement, or impact.
type: detection
detection_id: 8834e2f7-6b4b-4f09-8906-d2276470ee23
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line contain a PsExec/PAExec marker together with a flag combination that escalates a shell to LOCAL SYSTEM?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when both a tool marker (psexec, paexec, or accepteula) AND a system-escalation flag combination preceding a shell name (for example -s cmd, -s -i powershell, or -i -s pwsh) are present in the same command line. Read the exact command line and confirm both halves are present rather than an incidental substring.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to escalate a shell to LOCAL SYSTEM using PsExec or PAExec?
  context: Legitimate administrative activity can trigger this detection. A workstation admin or maintenance account running this on a host they manage, or someone following documented vendor troubleshooting steps, is far more routine than the same pattern under a standard user or service account. Knowing whether the user role and host function fit SYSTEM-shell administration is often the fastest path to a disposition.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the full command line, and which shell and flag combination was used to obtain the SYSTEM context?
  context: The full command line reveals exactly which interpreter (cmd, powershell, or pwsh) was launched and whether the session is interactive (-i present) or detached. Note any target host specification, copy flags (-c), custom service name (-r or -noname), or credential flags (-u/-p), since these distinguish a local SYSTEM shell from a remote push that could stage a payload across hosts.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this command, and is that parent chain expected?
  context: The parent process reveals how the escalation was invoked. An interactive admin session (explorer.exe, an RDP-hosted shell, or a remote-management console) is consistent with sanctioned use, while parents such as script hosts, Office applications, or a freshly dropped binary point toward operator activity. Walk up the tree to see what spawned the parent and what else it launched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: How often has this same SYSTEM-escalation pattern run on this host before, and which users drove it?
  context: A command interpreter alone runs constantly, so a generic binary baseline is meaningless here. This query counts only command lines that match the rule's escalation pattern on this host over 90 days, grouped by user. Zero or very low counts indicate a first-time or rare event; a steady history under known maintenance accounts points toward sanctioned administration.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_sys:
        CommandLine|contains|windash:
        - ' -s cmd'
        - ' -s -i cmd'
        - ' -i -s cmd'
        - ' -s pwsh'
        - ' -s -i pwsh'
        - ' -i -s pwsh'
        - ' -s powershell'
        - ' -s -i powershell'
        - ' -i -s powershell'
      selection_other:
        CommandLine|contains:
        - psexec
        - paexec
        - accepteula
      selection_host:
        host.name|expand: '%hostname%'
      condition: all of selection_*
    fields:
      - User
- question: When this host has previously fired the rule's pattern, which parents and users normally drive it, and does the current alert fit?
  context: Even legitimate SYSTEM escalation tends to come from a consistent set of parents and accounts on a given host. The query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern has historically run here. A new parent process, an unexpected account, or an unusual command structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_sys:
        CommandLine|contains|windash:
        - ' -s cmd'
        - ' -s -i cmd'
        - ' -i -s cmd'
        - ' -s pwsh'
        - ' -s -i pwsh'
        - ' -i -s pwsh'
        - ' -s powershell'
        - ' -s -i powershell'
        - ' -i -s powershell'
      selection_other:
        CommandLine|contains:
        - psexec
        - paexec
        - accepteula
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did this escalated shell spawn afterward?
  context: A SYSTEM shell is a means to an end. The processes launched from it reveal the actual objective, whether that is credential-access tooling, reconnaissance, registry or hive access (for example regedit reading SAM/SECURITY), service or task creation, or payload execution. Scoping to the alerting process instance keeps the result precise rather than returning every child of an interpreter.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Have other hosts fired this same SYSTEM-escalation pattern in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this specific escalation pattern rather than generic interpreter usage. Many hosts firing the same pattern points to scripted deployment or vendor automation; a single host or a small unrelated set points to manual operator activity. Use the host spread and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_sys:
        CommandLine|contains|windash:
        - ' -s cmd'
        - ' -s -i cmd'
        - ' -i -s cmd'
        - ' -s pwsh'
        - ' -s -i pwsh'
        - ' -i -s pwsh'
        - ' -s powershell'
        - ' -s -i powershell'
        - ' -i -s powershell'
      selection_other:
        CommandLine|contains:
        - psexec
        - paexec
        - accepteula
      condition: all of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_sys:
        CommandLine|contains|windash:
        - ' -s cmd'
        - ' -s -i cmd'
        - ' -i -s cmd'
        - ' -s pwsh'
        - ' -s -i pwsh'
        - ' -i -s pwsh'
        - ' -s powershell'
        - ' -s -i powershell'
        - ' -i -s powershell'
      selection_other:
        CommandLine|contains:
        - psexec
        - paexec
        - accepteula
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_sys:
        CommandLine|contains|windash:
        - ' -s cmd'
        - ' -s -i cmd'
        - ' -i -s cmd'
        - ' -s pwsh'
        - ' -s -i pwsh'
        - ' -i -s pwsh'
        - ' -s powershell'
        - ' -s -i powershell'
        - ' -i -s powershell'
      selection_other:
        CommandLine|contains:
        - psexec
        - paexec
        - accepteula
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether this escalation is isolated or part of broader movement. If the same user triggered activity on multiple endpoints in the same window, the scope of the operation may extend past this host. This view is most meaningful when the alert fires under a named interactive account rather than a service principal.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_sys:
        CommandLine|contains|windash:
        - ' -s cmd'
        - ' -s -i cmd'
        - ' -i -s cmd'
        - ' -s pwsh'
        - ' -s -i pwsh'
        - ' -i -s pwsh'
        - ' -s powershell'
        - ' -s -i powershell'
        - ' -i -s powershell'
      selection_other:
        CommandLine|contains:
        - psexec
        - paexec
        - accepteula
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining what ran on this host shortly before and after the escalation reveals the immediate context, such as preceding reconnaissance, the tool being transferred in, or follow-on persistence and impact. Aggregating by parent and child collapses repetitive agent telemetry while novel process pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal the attack stages that preceded this escalation and help reconstruct the timeline. The sequence of alerts often tells the story leading up to an operator obtaining a SYSTEM shell.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
