name: Regedit as Trusted Installer
id: 1bcf8017-1875-4887-9301-ebc7954af9ab
description: |
  Detects regedit.exe spawned by either TrustedInstaller.exe or ProcessHacker.exe. Both parents are paths to launching the registry editor with a token more privileged than a standard administrator: TrustedInstaller is the most privileged service identity on Windows and ProcessHacker can impersonate or steal a TrustedInstaller token. Running regedit under such a token lets an operator read and modify protected registry hives that even local administrators cannot touch, so the investigation should confirm which parent fired, establish whether the elevation was intentional, and determine what was changed in the registry once running at that integrity level.
type: detection
detection_id: 883835a7-df45-43e4-bf1d-4268768afda4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Was regedit.exe spawned by either TrustedInstaller.exe or ProcessHacker.exe?
  context: Confirm the alert is a true positive before investing investigation time. Review the alerting event and note which parent fired — TrustedInstaller.exe (a service-token relaunch) or ProcessHacker.exe (a tool that can steal or impersonate the TrustedInstaller token). The parent that fired changes which downstream questions carry weight. A ProcessHacker parent points to a token-manipulation tool on the host, while a TrustedInstaller parent points to a service-context relaunch.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
- question: Is this user and host expected to launch regedit.exe under an elevated service token?
  context: Launching the registry editor at TrustedInstaller integrity is not a routine end-user action. Knowing whether the user role and host function involve servicing protected components or system-integrity registry work is often the fastest way to separate sanctioned maintenance from token abuse.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is TrustedInstaller.exe or ProcessHacker.exe expected to spawn regedit.exe here, and what started the parent itself?
  context: The parent-child relationship is the core signal. Tracing the parent's own origin reveals whether the elevation chain is legitimate (servicing component started by the OS) or operator-driven (a token-stealing tool launched interactively). For a ProcessHacker parent, examine its command line and grandparent to see whether a user explicitly ran it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did the same parent process spawn?
  context: If the parent spawned regedit.exe at elevated integrity, it may have spawned other processes too. Multiple children from the same TrustedInstaller- or ProcessHacker-tokened parent reveals the full scope of what was launched under that privileged token.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What is the full command line of the parent process and why did it spawn regedit.exe?
  context: The parent's own command line shows how the elevated launch was initiated. For a ProcessHacker parent, the arguments may reveal token-manipulation flags or a target process to impersonate. For a TrustedInstaller parent, the command line shows whether this was a genuine servicing operation. Extend upward by checking what spawned the parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: What registry key and value did this regedit.exe instance modify, and is it a protected or persistence location?
  context: The registry path reveals intent. At TrustedInstaller integrity, regedit can write to protected hives a normal administrator cannot — service configurations under HKLM\SYSTEM, security-tool policy keys, or Image File Execution Options entries. The specific key and value written determine what executes or what protection was changed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Were other registry modifications made on this host in the same session?
  context: An operator who relaunches regedit at elevated integrity often makes several changes — for example disabling a security tool AND setting a persistence key. Finding clusters of registry write activity within a short window reveals the full scope of configuration changes and whether multiple objectives were pursued.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- question: Were Security log token-elevation events (4672/4673) recorded for this regedit.exe process around the alert time?
  context: Running under a TrustedInstaller or stolen-SYSTEM token grants sensitive privileges (SeDebugPrivilege, SeTcbPrivilege, SeBackupPrivilege). Security events 4672 (special privileges assigned to new logon) and 4673 (privileged service called) confirm the process actually ran with non-standard token rights rather than as a relabeled but unprivileged process. If Security audit logs are not ingested in this environment, treat the absence of these events as a visibility gap rather than evidence the privileges were not held.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 4672
          - 4673
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - EventID
      - SubjectUserName
      - PrivilegeList
- question: What actions were performed at high or system integrity on this host after the elevated regedit launch?
  context: Elevation is a means to an end. After obtaining a TrustedInstaller or SYSTEM token, an operator typically performs actions that require high integrity — installing persistence, dumping credentials, tampering with security tools, or accessing protected resources. High- and System-integrity processes spawned shortly after the launch reveal the objective.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: Were registry-backed elevation or auto-elevate keys modified on this host before the launch?
  context: Some elevation paths stage a payload in a registry key that an auto-elevating process reads and executes. Finding such a write shortly before the elevated regedit launch can reveal the mechanism that produced the privileged token and the exact payload run with it.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\reg.exe'
          - '\powershell.exe'
          - '\cmd.exe'
        CommandLine|contains:
          - 'ms-settings'
          - 'mscfile'
          - 'Classes\exefile'
          - 'Classes\Folder'
          - 'Environment'
          - 'Shell\Open\command'
          - 'DelegateExecute'
      condition: selection
    fields:
      - CommandLine
      - Image
- question: Were other privilege escalation or token-manipulation detections recorded on this host?
  context: Operators who pursue elevation often try multiple methods or chain token theft with other escalation tooling. Finding additional privilege-escalation or token-manipulation alerts on the same host within a short window confirms deliberate elevation activity rather than a benign servicing event.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- question: Has TrustedInstaller.exe or ProcessHacker.exe spawned regedit.exe on this host before?
  context: A parent-child pairing that has never occurred on a host is more suspicious than one that recurs. Zero or very low historical counts for this specific parent spawning regedit indicate a novel elevation event rather than established servicing automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: Is this parent spawning regedit.exe at elevated integrity on other hosts?
  context: The same elevated launch pattern appearing on multiple hosts points to pushed automation or a tool deployed across the environment, while a single occurrence is more likely a targeted or host-local action. Cross-host comparison helps calibrate scope.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \regedit.exe
        ParentImage|endswith:
        - \TrustedInstaller.exe
        - \ProcessHacker.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \regedit.exe
        ParentImage|endswith:
        - \TrustedInstaller.exe
        - \ProcessHacker.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Elevation rarely happens in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the stages that preceded this event and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
