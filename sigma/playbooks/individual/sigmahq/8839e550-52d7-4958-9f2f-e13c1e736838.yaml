name: Security Event Logging Disabled via MiniNt Registry Key - Registry Set
id: 0064bbb3-eb23-4db0-a310-74bbeb760b07
description: |
  Detects a registry write that creates the MiniNt key at
  HKLM\System\CurrentControlSet\Control\MiniNt on a Windows host. Windows checks this key at boot
  to decide whether it is running in a minimal preinstallation (WinPE) or recovery environment;
  when the key is present on a normal install, the Windows Event Log service refuses to start on
  the next reboot, suppressing event collection system-wide without altering any service
  configuration or ACL. The key is normally absent outside of imaging or recovery, so its creation
  on a running host is a deliberate act — legitimate cases are limited to recovery tooling, while
  malicious use disables logging to hide follow-on activity. Because event logging stops only after
  a reboot and Windows event records become unreliable once it does, ground the investigation in
  registry, process, and file telemetry: confirm which process and command created the key, whether
  it persists, what else changed on the host, and what activity followed.
type: detection
detection_id: 8839e550-52d7-4958-9f2f-e13c1e736838
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the alerting registry write create the MiniNt key under HKLM\System\CurrentControlSet\Control?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires on a
    write to TargetObject HKLM\System\CurrentControlSet\Control\MiniNt\(Default). The MiniNt key
    normally exists only when Windows runs in a recovery or preinstallation (WinPE) environment, so
    its presence on a normally booted host is the tamper. The primitive is typically a `reg add` of
    the key with no value data, so the Details field is often empty — the presence of the key path,
    not its value, is the signal. Review the exact TargetObject on the triggering event to confirm
    the path.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to create low-level Control keys such as MiniNt?
  context: >-
    Legitimate creation of the MiniNt key is essentially limited to recovery or imaging workflows,
    not normal operation on a running host. Knowing whether the writing account and host function
    match any imaging or maintenance role is often the fastest way to separate a rare legitimate
    action from tampering. User attribution is present on roughly 94% of endpoint registry events;
    when it is a machine account or missing, pivot on the writing process instead. The accounts and
    tooling authorized to make low-level Control changes form the baseline that separates routine
    changes from tampering.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Was there a change ticket or maintenance window covering this registry change?
  context: >-
    Creating the MiniNt key on a running host is not a routine administrative action. A
    corresponding ticket for imaging, recovery testing, or scheduled maintenance would explain it,
    while the absence of one when policy requires it points to unauthorized activity. This check can
    quickly close a false positive or escalate a true positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What does the MiniNt key control, and why does its presence disable event logging?
  context: >-
    The path HKLM\System\CurrentControlSet\Control\MiniNt is read by Windows at boot to decide
    whether it is running in a minimal preinstallation (WinPE) environment. When the key is present
    on a normal install, the Windows Event Log service refuses to start on the next boot, which
    suppresses event collection system-wide without touching any service ACL. The key's mere
    presence is the mechanism rather than any value it holds; the writing process identifies who set
    it. This is a known defense-evasion location, distinct from Run/Services persistence keys.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What command created this registry key, and did it touch anything else?
  context: >-
    The registry event carries no command line, so pivot to the writing process by its ProcessGuid
    to read the full command that made the change. This distinguishes a `reg add ...\MiniNt`
    one-liner or a PowerShell or WMI equivalent from a legitimate imaging tool, and reveals whether
    the same invocation also stopped services, cleared logs, or set other keys. Decode the arguments
    to confirm the MiniNt path was the target and to see the full operation the command performed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What launched the process that created the MiniNt key, and is that chain expected?
  context: >-
    The parent chain reveals how the change was invoked. A reg.exe or powershell.exe write whose
    parent is an interactive console launched from explorer.exe or a management agent looks
    different from one spawned by an Office application, a script host such as wscript.exe or
    mshta.exe, or an unsigned binary. Tracing the parent's own origin shows whether the lineage is
    legitimate imaging or maintenance, or scripted tampering. An unexpected or unsigned parent that
    is not on the environment's list of legitimate registry tools carries the most weight.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: After this write, was the MiniNt key re-set or reverted on this host?
  context: >-
    Registry key or value deletions are not observable in this telemetry, so durability is judged
    from the key's re-modification history rather than from a delete event. The suppression persists
    for as long as the key exists and takes effect on the next reboot. A later write that overwrites
    or clears the value would indicate remediation, a policy refresh, or an administrator reverting
    the change; no further writes leave the key in place and logging suppressed after the next boot.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Is Windows event logging currently functioning on this host, or did a reboot leave it suppressed?
  context: >-
    The MiniNt key takes effect on the next reboot, when the Windows Event Log service refuses to
    start, so the current running state may differ from the moment of the write. Confirm through
    direct host inspection or endpoint tooling whether the Event Log service is running and
    collecting events; if it is not, treat any absence of Windows event records after the reboot as
    a visibility gap rather than evidence that nothing happened, and restore logging before deeper
    investigation. Process and registry telemetry from the endpoint agent is collected
    independently of the Windows Event Log service and remains available.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What activity occurred on this host after the MiniNt key was created?
  context: >-
    Suppressing event logging is usually a means to an end — running tools, dumping credentials, or
    moving laterally with reduced Windows-side visibility. Endpoint process telemetry is collected
    independently of the Windows Event Log service, so it still captures what ran in the window
    after the write even when Windows event records stop. Review process activity in that window to
    see what the suppression was meant to cover; the correlation window links the registry edit to
    the activity that followed.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense-tampering actions taken on this host in the same window?
  context: >-
    An actor who suppresses event logging often weakens other controls in the same operation —
    stopping or reconfiguring services, clearing logs, deleting shadow copies, or turning off
    protections. Finding additional tampering from the same user or writing process indicates
    several controls were targeted together rather than an isolated key creation. Named security
    service changes in this window are worth correlating with the MiniNt write.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: What other registry modifications were made on this host in the same window?
  context: >-
    Actors who create one control key often change several — pairing the MiniNt key with Defender
    policy, firewall, or persistence keys. Clustering the registry writes on this host in a short
    window around the alert reveals the full scope of configuration changes and which process made
    them. The triggering key appears in the results; the signal is what else was modified and by
    which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has the MiniNt key been created before on this host?
  context: >-
    The MiniNt key should never be present during normal operation, so any prior history of it being
    written is itself notable. No prior writes make this a first-time change and raise its weight; a
    history of periodic writes would point to a recurring imaging or recovery process on this host
    that routinely sets it. Compare the historical writing process to see whether the same tooling
    set it before.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was the MiniNt key created on other hosts in the environment?
  context: >-
    The same write across many hosts points to a scripted rollout or an imaging process; the same
    write confined to one host points to a targeted action. Compare the writing process across hosts
    to see whether it is consistent with a management deployment or with ad-hoc tampering, and note
    how many distinct hosts show the key.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A registry tamper rarely happens in isolation. Aggregating process activity in a tight window
    around the alert surfaces what led up to the change and what ran immediately after. Novel
    parent-child pairs stand out at low counts against high-count routine telemetry, which is what
    points to reconnaissance, credential access, or staging around the configuration change.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — reconnaissance, execution of scripting tools, or other
    defense tampering — may reveal the stages that preceded this change and help reconstruct the
    timeline. Defense tampering often precedes credential access or other objectives, and prior
    alerts help place this registry edit within that sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were process-based persistence mechanisms installed on this host in the same window?
  context: >-
    An actor who suppresses logging to reduce visibility frequently establishes persistence in the
    same operation. Scheduled tasks, services, registry Run keys, BITS jobs, and WMI subscriptions
    created by schtasks.exe, sc.exe, reg.exe, bitsadmin.exe, or wmic.exe near the key creation
    indicate the change was part of a footholding effort rather than an isolated edit.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
