name: Remote Access Tool - UltraViewer Execution
id: cec6049e-1619-438e-9d37-6b89e84cb417
description: |
  Detects execution of UltraViewer, a commercial remote-desktop/remote-support tool, by matching the binary's file metadata (Product UltraViewer, Company "DucFabulous Co,ltd", OriginalFileName UltraViewer_Desktop.exe). Remote access tools establish an interactive control channel to the host and are routinely used for legitimate IT support, but the same capability gives an operator hands-on-keyboard access, file transfer, and a persistent egress path that often blends in with sanctioned remote-support traffic. The investigation should determine whether this execution maps to an authorized support session and approved tooling, where the binary came from, what it connected to, and what ran around it on the host and across the fleet.
type: detection
detection_id: 88656cec-6c3b-487c-82c0-f73ebb805503
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does this process match UltraViewer's file metadata that the rule detects?
  context: Confirm the alert is a true positive before investing time. The rule fires when the process file metadata matches the UltraViewer remote-access tool — Product UltraViewer, Company "DucFabulous Co,ltd", or OriginalFileName UltraViewer_Desktop.exe. Review the alerting event's metadata fields against those values.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - OriginalFileName
      - Company
      - Product
- question: Is this user and host expected to run a remote access tool like UltraViewer?
  context: Remote-support software is normal on some endpoints (help-desk workstations, jump hosts) and unexpected on others. Knowing whether the user role and host function are consistent with running interactive remote-control software is often the fastest path to separating sanctioned support from shadow IT or attacker-deployed access.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is UltraViewer on the organization's approved remote access software list?
  context: Organizations typically sanction a limited set of remote-support tools (often a single product). A remote access tool that is not on the approved list — even well-known commercial software — may represent shadow IT or operator-deployed persistence, and should be treated as unauthorized regardless of the tool's reputation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a current helpdesk ticket or support session that explains this UltraViewer run?
  context: Legitimate remote-access usage usually correlates with an active support ticket, a scheduled maintenance window, or a user request. If no support context exists for this session, the tool may have been installed by an operator for persistent access or by a user circumventing controls.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What was the full UltraViewer command line, and does it carry session IDs, passwords, or unattended-access flags?
  context: The full command line reveals how the tool was launched. UltraViewer can be started interactively or driven with parameters that auto-connect, supply a session ID/password, or enable unattended access. Decode the arguments and working directory to understand whether this was a user-initiated session or a pre-configured, headless connection.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned UltraViewer, and is that parent chain expected?
  context: The parent process reveals how the tool was invoked. A user launching it from explorer.exe or an installer looks different from a script host, an Office application, or an unfamiliar binary spawning it. An unusual parent points to installation by a dropper or automated deployment rather than a person double-clicking the application.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What external endpoints did UltraViewer connect to?
  context: Remote access tools establish outbound connections to relay or rendezvous servers. The destination reveals whether the tool reached the vendor's legitimate infrastructure or a custom/unexpected endpoint, and whether the session was a short interactive support call or a long-lived channel. Connections to non-vendor addresses or unusual ports are the higher-concern case.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: Was the UltraViewer executable written to disk on this host shortly before it ran, and where?
  context: Remote access tool abuse frequently begins with the binary being dropped to a user-writable or temporary path (Downloads, AppData, %TEMP%) rather than installed under Program Files. Correlate the file-write that landed the executable with this execution to see whether it was freshly delivered or a pre-existing install, and note the writing process. If file-creation telemetry is not collected in this environment, treat zero results as a visibility gap rather than evidence nothing was written.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - 'UltraViewer'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: What child processes did UltraViewer spawn afterward?
  context: A remote-control session is meaningful for what the operator does through it. Children spawned by the tool — command interpreters, script hosts, file-transfer or reconnaissance utilities — reveal hands-on-keyboard activity. A support session that only renders a desktop looks very different from one that launches cmd.exe, powershell.exe, or download utilities.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run UltraViewer?
  context: A remote access tool that has never been seen on a host is more notable than one that runs regularly as part of sanctioned support. Zero or very low historical counts over the trailing window indicate first-time or rare execution and raise the priority of confirming authorization.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this UltraViewer pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even sanctioned remote-support tools run under predictable conditions. The query mirrors the rule's metadata selection scoped to this host, so the resulting parent/user distribution reflects how this specific firing pattern has historically run here. A new parent process, an unexpected user account, or an unusual launch pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Product: UltraViewer
      - Company: DucFabulous Co,ltd
      - OriginalFileName: UltraViewer_Desktop.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Product: UltraViewer
      - Company: DucFabulous Co,ltd
      - OriginalFileName: UltraViewer_Desktop.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Product: UltraViewer
      - Company: DucFabulous Co,ltd
      - OriginalFileName: UltraViewer_Desktop.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the remote-access session was an isolated event or part of broader movement. If the same user drove similar activity on multiple endpoints in the same window, the scope of the session — or of the compromise — may be larger than this one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Product: UltraViewer
      - Company: DucFabulous Co,ltd
      - OriginalFileName: UltraViewer_Desktop.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding this event reveals what led to it and what followed — reconnaissance, privilege escalation, persistence installation, or data staging that frames whether the remote-access session is benign support or one stage of a larger sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts fired this UltraViewer pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's metadata selection with no host scope, so the result is a fleet-wide count of this firing pattern rather than generic binary usage. Many hosts firing the same pattern points to scripted or vendor-pushed deployment; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Product: UltraViewer
      - Company: DucFabulous Co,ltd
      - OriginalFileName: UltraViewer_Desktop.exe
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the stages that preceded a remote-access session and help reconstruct the timeline. An RAT execution preceded by tampering or recon reads very differently from one with a clean prior history.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
