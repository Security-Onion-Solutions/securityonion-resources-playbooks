name: Suspicious Regsvr32 Execution From Remote Share
id: 28814c03-2a87-4da6-9cff-464ce4594242
description: |
  Detects regsvr32.exe (or a binary whose OriginalFileName is REGSVR32.EXE) executing with a command line that
  references a UNC path (a backslash-backslash sequence), indicating registration or execution of a DLL or scriptlet
  hosted on a remote share. The rule fires when both conditions match: the image is regsvr32.exe AND the command line
  contains a remote-share reference. regsvr32.exe is a Microsoft-signed binary that legitimate installers and COM
  registration occasionally drive, but loading code directly from a network location is a proxy-execution pattern used
  to run externally hosted payloads while blending in with a trusted process. Investigation should confirm the exact
  command line and remote path, identify what spawned regsvr32.exe, determine what the loaded module did, and check
  whether the remote share and downstream activity are expected for this host and user.
type: detection
detection_id: 88a87a10-384b-4ad7-8871-2f9bf9259ce5
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line show regsvr32.exe loading a DLL or scriptlet from a remote share?
  context: Confirm the alert is a true positive by reviewing the exact command line and process details. The rule fires
    only when the image is regsvr32.exe (or its OriginalFileName is REGSVR32.EXE) AND the command line contains a UNC
    remote-share reference (a backslash-backslash sequence). Verify the referenced path points to a network location and
    note the exact remote host and file so downstream questions can follow it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to register or execute COM components from a network location?
  context: Legitimate COM registration is normally driven by local installers and runs against local files; loading a
    module from a remote share is unusual for most endpoints. Knowing whether the user role and host function involve
    software deployment or developer workflows that legitimately pull components from a file server is often the fastest
    path to distinguishing routine activity from proxy execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did regsvr32.exe do? Decode the command-line arguments and identify the remote path and entrypoint.
  context: The full command line reveals the specific action. Identify the UNC path that was referenced, the file name
    and extension of the module (.dll, .ocx, .sct scriptlet, or a renamed file), and any /i, /u, /s, or /n switches that
    control registration, unregistration, silent mode, or a custom entrypoint. A /u or /i flag with a scriptlet or a
    file from a temporary or remote path is a stronger proxy-execution signal than a plain DLL registration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned regsvr32.exe and is that parent chain expected?
  context: The parent process reveals how regsvr32.exe was invoked. Legitimate COM registration is typically launched by
    explorer.exe, an installer, or services.exe. Parents such as office applications, script hosts, msdt.exe,
    sdiagnhost.exe, or a command shell suggest the invocation came from a document, macro, or operator activity rather
    than routine software installation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What modules did regsvr32.exe load right after it started, and were any unsigned or loaded from an unusual path?
  context: The proxy-execution payload arrives as a module that regsvr32.exe loads shortly after process creation.
    Correlating the load events for this process surfaces the DLL or scriptlet actually executed, its on-disk location,
    and its signature state. An unsigned module, or one loaded from a temporary, user-writable, or remote-mapped path,
    is the artifact that distinguishes proxy execution from legitimate COM registration. If image-load telemetry is not
    collected in this environment, treat the absence of results as a visibility gap rather than evidence nothing loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - CommandLine
- question: Did regsvr32.exe make any outbound network connections around the time of the alert?
  context: When a remote-share or remote-URL path is referenced, regsvr32.exe may reach across the network to retrieve
    the module before executing it. An outbound connection from regsvr32.exe to a file server, an internal host, or an
    external address corroborates remote payload retrieval and gives a destination to scope. regsvr32.exe rarely
    initiates network traffic during legitimate local COM registration, so any connection here is worth examining.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Was regsvr32.exe executed from its expected System32 or SysWOW64 path?
  context: regsvr32.exe executed from a non-standard path (outside System32 or SysWOW64) may indicate the binary was
    copied or renamed to evade path-based allowlists. Compare the Image path against OriginalFileName — a file whose
    OriginalFileName is REGSVR32.EXE but whose path or name differs from the expected system location points to a
    relocated or renamed copy.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: What child processes did regsvr32.exe spawn afterward?
  context: The processes spawned after regsvr32.exe loads its module reveal the payload's actual impact. Legitimate COM
    registration spawns nothing; proxy execution frequently leads to a command shell, a script host, or additional
    binaries that carry out discovery, persistence, or further download activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host has previously fired this remote-share regsvr32 pattern, what parents and users normally drive
    it, and does the current alert fit?
  context: Even common tools can be abused. The query mirrors the rule's selection structure scoped to this host — the
    resulting parent and user distribution reflects how the rule's specific firing pattern (not generic regsvr32 usage)
    has historically run here. A new parent process, an unexpected user account, or an unusual command-line structure is the
    deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regsvr32.exe
      - OriginalFileName: \REGSVR32.EXE
      selection_cli:
        CommandLine|contains: ' \\\\'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: How often has this host fired the remote-share regsvr32 pattern over the past 90 days, and what command-line
    patterns are typical?
  context: A LOLBin pattern with no prior history on a host is more suspicious than one used daily under stable parents.
    The query mirrors the rule's selection structure scoped to this host, so the count reflects the rule's specific
    firing pattern rather than generic regsvr32 usage. The command-line projection lets the analyst compare typical
    invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regsvr32.exe
      - OriginalFileName: \REGSVR32.EXE
      selection_cli:
        CommandLine|contains: ' \\\\'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regsvr32.exe
      - OriginalFileName: \REGSVR32.EXE
      selection_cli:
        CommandLine|contains: ' \\\\'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regsvr32.exe
      - OriginalFileName: \REGSVR32.EXE
      selection_cli:
        CommandLine|contains: ' \\\\'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple
    endpoints. If the same user triggered similar activity on more than one host, the scope may be larger than a single
    endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regsvr32.exe
      - OriginalFileName: \REGSVR32.EXE
      selection_cli:
        CommandLine|contains: ' \\\\'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — reconnaissance, exploitation of a
    document or browser, or credential access — may reveal the stages that preceded this event and help reconstruct the
    full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were any other proxy-execution LOLBins used on this host recently?
  context: Attackers who use one proxy-execution LOLBin often use several. If regsvr32.exe was used to run a remote
    module, check whether rundll32, mshta, msiexec, installutil, or similar binaries were also used to execute code on
    the same host. Finding multiple proxy-execution LOLBins performing the same objective strengthens the case for
    malicious activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\installutil.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
