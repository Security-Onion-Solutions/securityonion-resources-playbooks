name: Chromium Browser Instance Executed With Custom Extension
id: 33c9d127-4a43-42b2-a382-f0a4363c77fd
description: |
  Detects a Chromium-based browser (brave.exe, chrome.exe, msedge.exe, opera.exe, or vivaldi.exe) launched with the
  --load-extension= flag, which forces the browser to side-load an unpacked extension from a directory on disk. The flag is
  occasionally used by developers and testing tools, but it is also a known persistence and browser-session-hijacking
  primitive: an attacker who can write to a directory and append --load-extension to a browser shortcut or launch command
  forces every subsequent browser start to load an attacker-controlled extension, with no second process spawn. Investigation
  should confirm the flag fired, decode the extension directory path, establish how the browser was invoked and by whom, and
  check for the file writes, registry entries, and outbound connections that a loaded extension typically generates.
type: detection
detection_id: 88d6e60c-759d-4ac1-a447-c0f1466c2d21
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line show a Chromium browser launched with the --load-extension= flag?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when the process image
    ends in brave.exe, chrome.exe, msedge.exe, opera.exe, or vivaldi.exe AND the command line contains --load-extension=.
    Confirm both conditions are present in the alerting event and read the directory path that follows the flag.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to launch browsers with a custom-loaded extension?
  context: Loading an unpacked extension via --load-extension is normal for browser-extension developers and some automated
    testing tools, but unusual for general users. Knowing whether the user role and host function involve browser-extension
    development or QA work is often the fastest way to separate a developer workflow from an attacker-installed persistence
    foothold.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Was there a change ticket, maintenance window, or documented approval for loading this extension?
  context: Some organizations require approval or a change record for installing browser extensions, especially unpacked ones
    loaded from disk. A corresponding ticket or an entry in an approved developer/testing workflow suggests authorized
    activity; absence of one suggests the extension load was not sanctioned and should be escalated.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the user recall launching the browser with a custom extension, or configuring one?
  context: Direct confirmation from the human behind the account is often the fastest path to legitimacy. If the user does
    not recall loading an extension or running the browser this way, the flag may have been appended to a shortcut or launch
    command without their knowledge. If they do recall it, capture why and where the extension came from.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this browser launch align with the user's normal work hours?
  context: A custom extension loaded during business hours by a developer fits an expected workflow; the same activity outside
    working hours, on a host with no development role, or at an unusual cadence is more suspicious and warrants closer review
    of the extension path and the launching parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What extension directory path follows --load-extension=, and where does it live on disk?
  context: The command line reveals which extension is being side-loaded. Decode the path after --load-extension= and note its
    location. A path under a user-writable, transient, or staging directory (AppData\Local, Public, Temp) is more concerning
    than a vendor or developer project directory. Multiple comma-separated paths, or a path that does not correspond to any
    extension the user installed, point toward attacker side-loading.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: '--load-extension='
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this browser, and is that parent chain expected?
  context: The parent process reveals how the browser was invoked. A normal interactive launch comes from explorer.exe or a
    shell/shortcut handler. A browser carrying --load-extension that was spawned by powershell.exe, cmd.exe, wscript.exe,
    cscript.exe, or another scripting host suggests the flag was injected programmatically rather than chosen by the user.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \brave.exe
        - \chrome.exe
        - \msedge.exe
        - \opera.exe
        - \vivaldi.exe
        CommandLine|contains: --load-extension=
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \brave.exe
        - \chrome.exe
        - \msedge.exe
        - \opera.exe
        - \vivaldi.exe
        CommandLine|contains: --load-extension=
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around this time?
  context: Tracking the user's activity across all hosts reveals whether the extension load is isolated or part of broader
    activity. If the same user triggered similar browser launches or related staging actions on multiple endpoints, the scope
    of the activity may be larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \brave.exe
        - \chrome.exe
        - \msedge.exe
        - \opera.exe
        - \vivaldi.exe
        CommandLine|contains: --load-extension=
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What files did this browser write around the time the extension loaded?
  context: A newly loaded extension and its host browser commonly write supporting files (the unpacked extension manifest and
    scripts, cached payloads, downloaded archives) to disk. Reviewing files written by the browser process near the alert
    helps confirm where the extension was staged and whether additional payloads landed alongside it. File writes into
    user-writable staging directories are consistent with attacker side-loading.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did this browser make outbound connections to untrusted or newly observed destinations after the extension loaded?
  context: A malicious extension typically beacons to a command-and-control endpoint or fetches per-site injection scripts soon
    after it loads, producing browser-originated connections to domains and addresses the host has not contacted before. Review
    the browser's outbound connections after the alert and separate normal browsing and update traffic from connections to
    unfamiliar or low-reputation destinations.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: Were browser extension registration or settings registry keys written on this host around the alert?
  context: Browsers and extension-management tooling record installed and force-loaded extensions under user and machine
    registry hives. Writes to extension-related keys (Chrome/Edge/Brave extension install lists, force-install or allowlist
    policy keys) around the alert can corroborate that an extension was registered for persistent loading rather than loaded
    once for testing. Policy-key writes that force an extension to install are especially notable.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\Extensions\'
          - '\ExtensionInstallForcelist'
          - '\ExtensionInstallAllowlist'
          - '\ExtensionSettings'
      condition: selection
    fields:
      - TargetObject
      - Image
- question: Have other hosts launched a Chromium browser with --load-extension in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the
    rule's firing pattern, not generic browser usage. Many hosts firing the same pattern points to scripted deployment or a
    vendor/testing workflow; one host or a small unrelated set points to manual or targeted activity. Use the host distribution
    to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \brave.exe
        - \chrome.exe
        - \msedge.exe
        - \opera.exe
        - \vivaldi.exe
        CommandLine|contains: --load-extension=
      condition: selection
    fields:
    - host.name
- question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: Attackers rarely rely on a single persistence mechanism. After establishing a browser-extension foothold, they
    commonly install backup mechanisms using different techniques — scheduled tasks, services, registry Run keys, BITS jobs,
    or WMI subscriptions. Multiple persistence installations in the same timeframe indicate intentional stacking rather than
    isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations such as the Startup folder or scheduled-task definition paths on this host?
  context: File-based persistence bypasses command-line detection entirely. Dropping an executable or script into the Startup
    folder, or rewriting a browser shortcut so it carries --load-extension, achieves persistence without running standard
    persistence tools. File-event monitoring captures these drops and shortcut modifications even when the attacker avoids
    schtasks, sc, or reg.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
          - '.lnk'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
