name: Renamed Microsoft Teams Execution
id: 68a3d5a2-247a-490c-b5b1-059e70dcab88
description: |
  Detects a process whose embedded PE metadata declares it to be Microsoft Teams (OriginalFileName of
  msteams.exe or teams.exe) while the file it executed from does not carry that name on disk. The
  OriginalFileName value is compiled into the binary's version resource at build time and does not
  change when the file is copied or renamed, so the mismatch between the on-disk name and the binary's
  self-declared identity is the entire finding. Teams is a signed Electron application that bundles a
  full scripting and browser runtime and is routinely present and network-active on user workstations,
  which makes a relocated or renamed copy a convenient carrier for execution that inherits a trusted
  signature and unremarkable traffic. The application's own updater stages and renames binaries, and
  repackaged installers rename them too, so the investigation should establish where the renamed copy
  lives, what launched it, what it loaded and spawned, and whether that combination matches a known
  update or deployment path.
type: detection
detection_id: 88f46b67-14d4-4f45-ac2c-d66984f22191
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the alerting process report an OriginalFileName of msteams.exe or teams.exe while running
    from a file with a different name?
  context: >-
    The rule fires on exactly one condition, and it is a contradiction inside a single event. Confirm
    the event's OriginalFileName is msteams.exe or teams.exe and that the Image path ends in something
    other than those names, then record both values verbatim — the pair is the finding and every later
    question is calibrated against it. A blank or absent OriginalFileName means the mismatch cannot be
    confirmed from this event alone.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - OriginalFileName
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to be running Teams components from the path this binary
    executed from?
  context: >-
    Teams is normal on a user workstation; a Teams binary running under a different name from an
    arbitrary directory is what needs explaining. Establish whether the account is an ordinary desktop
    user whose machine runs Teams, a packaging or deployment account that repackages application
    binaries, or a service principal that has no interactive reason to launch a collaboration client.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What is the actual identity of this binary based on its metadata and hash?
  context: >-
    Record the Image path and OriginalFileName side by side — that gap is the detection. A renamed copy
    of Teams remains genuinely Microsoft-signed, because renaming a file does not touch its signature or
    its version resource, so a valid signature here is the premise of the alert rather than an
    exculpatory finding. The hash is the field that carries real information at this step: it separates
    an unmodified shipped Teams build from a patched or trojanized one carrying the same version
    resource, and it can be matched against other copies in the environment.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: How did this renamed binary arrive on the host, and which process wrote it?
  context: >-
    A Teams binary under a different name was copied, extracted, downloaded, or written by an installer.
    Matching the file name over a long window surfaces every write of that name to this host and shows
    the creating process. An application updater or a packaging tool writing the file points at a
    staging or repackaging path; an archive extractor, a browser, a script host, or a remote-management
    tool writing it into a user-writable directory points somewhere else. The interval between the write
    and this execution indicates whether the copy sat in place or was placed immediately before use.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - process_creation
- question: What directory did this renamed copy run from, and what arguments and working directory did
    it carry?
  context: >-
    Location is the discriminator here, not the name. A renamed copy under the application's own
    per-user install or update directory is consistent with the updater staging a build; the same
    binary under a public directory, a program-data directory, or a temporary directory is not a path
    the application's own maintenance uses. Read the arguments as well — an Electron host accepts
    switches that change what code it runs and where it loads it from.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned this renamed binary and is that parent chain expected?
  context: >-
    The parent separates the common legitimate causes from the rest. The application's own updater or an
    installer service launching a staged, renamed build is routine maintenance. An interactive shell, a
    script host, an archive tool, an Office application, or a remote-management agent as the parent
    means something other than the application's maintenance path started it. Note what else that parent
    launched in the same session.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What did this binary do after execution, and is the same renamed binary present on other
    hosts?
  context: >-
    A collaboration client's normal child processes are its own helper and update components. Command
    interpreters, script hosts, or enumeration binaries spawned by a renamed copy indicate the runtime
    is being used for something other than the application's function. The same renamed file appearing
    on additional hosts points at deliberate distribution or a packaged deployment rather than a local
    staging artifact.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Which DLLs did this renamed copy load, and did any of them come from its own directory
    rather than a system directory?
  context: >-
    A copy of a signed application relocated into a user-writable directory alongside a planted library
    is a recurring pattern, and the load events are where it becomes visible. Read each loaded module's
    path against the directory the process ran from, and check the signer and signature status per
    module. Library load events carry the signature and hash of each module directly, so an unsigned or
    unexpectedly signed DLL loading from the same directory as the renamed binary is answerable here
    without pivoting anywhere else.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - process_creation
  - manual_review
- question: Has this exact file path been executed on this host before, and under which accounts?
  context: >-
    This counts executions of the renamed path itself over 90 days, so it answers whether this specific
    file name and location are established on the host or new. A path with a long history under the same
    account is more consistent with a staging or install directory the environment already uses; zero or
    near-zero prior executions mean the file is new here. It does not find copies renamed to other
    names — the metadata-anchored fleet view covers that.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: When this host has previously run a renamed Teams binary, what parents and users drove that
    activity, and does the current alert fit that pattern?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the parent and user
    distribution reflects prior firings of this exact metadata mismatch rather than generic application
    usage. A host that regularly produces this pattern under its own updater is showing an application
    maintenance behavior; the same pattern arriving under a new parent or a different account is the
    deviation worth pursuing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName:
        - msteams.exe
        - teams.exe
      filter_main_legit_names:
        Image|endswith:
        - \msteams.exe
        - \teams.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, giving their 90-day history of
    this metadata mismatch aggregated by host. An ordinary desktop account that produces it on every
    machine it touches is likely riding the application's update behavior; an account that has never
    produced it, or a packaging account producing it on machines it does not own, is the more
    interesting result. Weigh the host list against the systems the account is expected to use.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName:
        - msteams.exe
        - teams.exe
      filter_main_legit_names:
        Image|endswith:
        - \msteams.exe
        - \teams.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: >-
    When the alert fires under SYSTEM or another service principal, the user field does not attribute
    the behavior and the launch mechanism becomes the meaningful pivot. This query gives the 90-day
    history of this parent driving this metadata mismatch, aggregated by host. A parent that already
    accounts for a large prior volume across many machines is the application's own maintenance or a
    deployment system; a parent that is new for this pattern is the deviation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName:
        - msteams.exe
        - teams.exe
      filter_main_legit_names:
        Image|endswith:
        - \msteams.exe
        - \teams.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    The account's activity across the fleet in the alert window shows whether the renamed execution sat
    alone or alongside other activity the same user drove on other machines. If the alert fired under a
    service principal this view returns routine agent telemetry from every host and the parent-driven
    view is the meaningful one instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same parent-driven pattern fire on other hosts in the same window, or is the
    activity isolated to this host?
  context: >-
    Under a service principal, a user-scoped fleet view returns agent telemetry from every machine. This
    query mirrors the rule's selection structure scoped to the alerting parent process, fleet-wide, in
    the alert window. Several hosts producing the same parent-driven mismatch at once is what a pushed
    update or a packaged rollout looks like; a single host points at a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName:
        - msteams.exe
        - teams.exe
      filter_main_legit_names:
        Image|endswith:
        - \msteams.exe
        - \teams.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating process activity on the host in the surrounding window collapses repetitive agent noise
    into high-count rows and leaves novel parent-child pairs visible at low counts. Look for an
    application update or installer sequence bracketing the event, which would explain the renamed copy,
    and for the alternative — archive extraction, script execution, or enumeration around the same
    minute.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host
    distribution look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so it counts every process
    fleet-wide whose metadata declares Teams while its file name does not — including copies renamed to
    names other than the one on this alert. Many hosts producing it points at an update mechanism or a
    packaged deployment that renames the binary as part of its normal operation; one host or a small
    unrelated set points at something local to this machine.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName:
        - msteams.exe
        - teams.exe
      filter_main_legit_names:
        Image|endswith:
        - \msteams.exe
        - \teams.exe
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    A signed application copied under a new name is usually a staging step rather than a starting point.
    Earlier detections on the same host — archive extraction, script execution, remote access, or
    library loads from user-writable directories — help establish whether the renamed copy was placed as
    part of a sequence or is the only thing that fired.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
