  context: >-
    When the alert fires under SYSTEM, a service account, or a computer account, identity does not attribute the
    behavior and the launch mechanism is the meaningful pivot. The query mirrors the rule's selection scoped to the
    alerting parent, giving the 90-day history of that parent producing this encoded pattern, aggregated by host. A
    parent already accounting for large counts across many hosts is vendor or platform automation; a parent that has
    never driven this pattern before is the deviation worth chasing.
  range: -90d
