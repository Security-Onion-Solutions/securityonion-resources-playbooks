name: PowerShell Base64 Encoded IEX Cmdlet
id: 70872b4b-9521-4ef8-a251-c1c205af4ca5
description: |
  Detects a base64-encoded IEX (Invoke-Expression) cmdlet inside a process command line. The rule fires when the
  command line either matches a base64-encoded form of an IEX/Invoke-Expression fragment such as "IEX ([" or
  "iex (New" at any of the three UTF-16LE byte alignments, or contains one of the pre-computed literal encodings
  of those same fragments; both branches describe the same underlying string, so the branch that matched indicates
  the encoding offset rather than a different behavior. Encoding by itself is not the finding — some management
  tooling, installers, and automation legitimately pass encoded PowerShell — so the investigation turns on decoding
  the payload and identifying what it fetches and executes. An encoded IEX is most often a download cradle
  (T1027 obfuscation feeding T1059.001 execution, frequently T1105 ingress tool transfer), and the decoded content
  names the URL, the in-memory assembly, or the script that ran.
type: detection
detection_id: 88f680b8-070e-402c-ae11-d2914f2257f1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Does the command line contain either a base64-encoded IEX cmdlet fragment matched at a UTF-16LE byte offset,
    or one of the rule's literal base64 IEX strings?
  context: >-
    The rule has two alternative branches. One encodes fragments such as "IEX ([", "iex (New", or "IEX(('" and
    matches them at each of the three UTF-16LE byte alignments; the other matches pre-computed literal encodings
    of those same fragments, for example "SQBFAFgAIAAoAFsA" or "aQBlAHgAIAAoAE4AZQB3A". Note which branch matched:
    because both branches describe the same underlying string, the branch tells you the padding/offset of the
    encoded blob rather than a different behavior, and it mostly confirms the encoding is deliberate rather than
    incidental. Confirm the hit is a real encoded IEX and not an unrelated base64 substring, then copy the full
    encoded blob out of the command line for decoding.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run PowerShell with an encoded command payload?
  context: >-
    Encoded PowerShell has legitimate users. Software installers, configuration-management agents, remote-management
    tooling, and scheduled automation routinely pass encoded commands to avoid quoting problems. Knowing whether this
    account and host function normally involve scripted PowerShell is often the fastest way to separate routine
    automation from operator-driven execution before any decoding work begins.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What does the encoded blob decode to, and what does the decoded IEX statement fetch and run?
  context: >-
    Decode the base64 payload rather than re-reading the command line. The encoded content is UTF-16LE, so decoded
    bytes read with null separators unless the decoder is told the encoding. An IEX wrapped around encoded content
    is a download cradle the large majority of the time, so the decoded text usually names the operation directly.
    Look for the source URL or host in "New-Object Net.WebClient" DownloadString/DownloadFile calls, Invoke-WebRequest
    or Invoke-RestMethod endpoints, "[Reflection.Assembly]::Load" for in-memory .NET loading, and any local path the
    payload writes or executes. Multi-layer encoding is common; iterate decoding until the content is readable, and
    record every URL, IP, and file path for reputation and follow-up checks.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Did PowerShell script block logging capture the full script content?
  context: >-
    Event ID 4104 records the deobfuscated script block PowerShell actually compiled, which is the decoded form of
    the encoded IEX payload — ground truth that does not depend on manual decoding. Correlate the 4104 events on this
    host to the alert time and read ScriptBlockText for the URLs, assemblies, and commands the payload ran; long
    payloads are split across multiple script block events that must be reassembled in order. If PowerShell operational
    logs are not ingested in this environment, this query returns nothing by construction — treat that as a visibility
    gap rather than evidence that nothing ran, and decode the encoded blob from the alerting command line instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
  answer_sources:
  - powershell_script_block
- question: What modules did the alerting process load, and do they indicate .NET assembly loading or a non-standard PowerShell host?
  context: >-
    The rule matches a command line only, so the process carrying the encoded IEX is not necessarily powershell.exe —
    any binary that hosts the automation engine can run the same payload. Loaded modules distinguish these cases.
    System.Management.Automation.dll loading into a process that is not a PowerShell host indicates indirect invocation;
    clr.dll and mscoree.dll indicate a .NET runtime being spun up; unsigned or never-before-seen assemblies loading
    shortly after the alert are consistent with reflective loading of a payload delivered by the decoded cradle.
    Check the signer and signature status of anything unfamiliar in the list.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
  answer_sources:
  - process_creation
  - manual_review
- question: Did the alerting process make outbound network connections, and to what destinations?
  context: >-
    An encoded IEX typically exists to fetch remote content and execute it in memory, so the connections this process
    opened are the other half of the cradle. Compare the destination addresses and ports against the URLs recovered
    from the decoded payload — a match confirms the fetch happened and gives an address to check for reputation and
    to pivot on across other hosts. Connections on 80/443 to an address with no corresponding DNS lookup, or to a
    host the environment has no other reason to contact, are worth carrying forward. No connections may mean the
    fetch failed, or that the payload operated locally.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - Initiated
  answer_sources:
  - network_connection
  - external_threat_intel
- question: Did the alerting process write any files to disk?
  context: >-
    In-memory execution is the point of an IEX cradle, but the payload frequently stages something anyway — a second-stage
    script, an archive, a DLL, or a configuration file. Files written by this process, particularly into user-writable
    locations such as the user profile, ProgramData, or a temp directory, are the artifacts to collect and hash for
    reputation checks and to follow into later execution. An absence of writes is itself useful, and points the
    investigation back to the in-memory path.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
- question: What process spawned the process carrying the encoded command, and is that parent chain expected?
  context: >-
    The parent shows how the encoded command was introduced. Automation and management tooling produce predictable
    parents such as services.exe, svchost.exe, an agent binary, or taskeng.exe/svchost.exe for scheduled tasks;
    explorer.exe indicates an interactive launch. Office applications, mshta.exe, wscript.exe, cscript.exe, or a
    browser as parent point to a delivery path rather than administration, and shift the investigation toward how the
    user was reached. Walk the parent's own command line and, where needed, its parent, to see how far back the chain
    of scripted activity extends.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What child processes did the alerting process spawn afterward?
  context: >-
    Children reveal what the decoded payload actually did. A cradle that stages a binary usually executes it, and
    interpreters, certutil.exe, rundll32.exe, regsvr32.exe, or a binary running out of a user-writable directory as
    a child of this process are the execution step. Scoping on the alerting process identity rather than the binary
    name keeps the answer to this process tree instead of every PowerShell instance on the host.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Were PowerShell security controls bypassed or weakened before this execution?
  context: >-
    Encoded payload delivery is often preceded by work to remove the logging and inspection that would expose it.
    Look for AMSI tampering through AmsiUtils or amsiInitFailed references, execution-policy relaxation via
    "-ExecutionPolicy Bypass" or "-ep bypass", real-time monitoring changes through Set-MpPreference and
    DisableRealtimeMonitoring, and engine downgrades via "-Version 2" or "-v 2", which drops script block logging
    entirely. A hit here changes how much weight the decoded payload's own appearance of legitimacy deserves.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Scripted execution rarely stands alone. The surrounding process activity shows what led to the encoded command and
    what followed it — discovery commands, credential access tooling, persistence installation, or archive utilities.
    The aggregation collapses repetitive agent telemetry into high-count rows; the parent/child pairs appearing once or
    twice are what to read.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host help place this execution in a sequence. Delivery-stage alerts on a mail client
    or browser, script-host activity, or defense-tampering detections before this event indicate the encoded command is
    a later stage rather than the entry point, and each earlier alert carries its own process identity to pivot on.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: >-
    When this host has previously produced an encoded IEX command line, what parents and users drove it, and does the
    current alert fit that pattern?
  context: >-
    The query mirrors the rule's own selection scoped to this host, so the parent/user distribution reflects the
    history of this specific encoded pattern rather than generic PowerShell usage. A host where an agent or installer
    regularly produces encoded IEX commands under the same parent and account has an established profile; a new parent,
    an unexpected account, or no prior history at all is the deviation to carry into the decoding work.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|base64offset|contains:
        - IEX ([
        - iex ([
        - iex (New
        - IEX (New
        - IEX([
        - iex([
        - iex(New
        - IEX(New
        - IEX(('
        - iex(('
      - CommandLine|contains:
        - SQBFAFgAIAAoAFsA
        - kARQBYACAAKABbA
        - JAEUAWAAgACgAWw
        - aQBlAHgAIAAoAFsA
        - kAZQB4ACAAKABbA
        - pAGUAeAAgACgAWw
        - aQBlAHgAIAAoAE4AZQB3A
        - kAZQB4ACAAKABOAGUAdw
        - pAGUAeAAgACgATgBlAHcA
        - SQBFAFgAIAAoAE4AZQB3A
        - kARQBYACAAKABOAGUAdw
        - JAEUAWAAgACgATgBlAHcA
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- always_include: true
  question: Has this user previously produced encoded IEX command lines, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this account, so the result is the account's 90-day history of
