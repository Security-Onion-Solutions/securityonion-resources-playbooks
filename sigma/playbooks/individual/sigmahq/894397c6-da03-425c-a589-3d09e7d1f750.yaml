name: Potential CVE-2021-40444 Exploitation Attempt
id: 0a5ba414-6089-4693-8b4a-ae455b956a9e
description: |
  Detects an Office application (winword.exe, powerpnt.exe, or excel.exe) spawning control.exe,
  with the routine `control.exe input.dll` invocation excluded by the rule's filter. This
  parent-child pattern is the observable step in CVE-2021-40444 exploitation, where a crafted
  document loads a remote MSHTML/ActiveX object that resolves to a CAB/INF side-load and reaches
  code execution through the Control Panel binary; other Office-document exploit chains that route
  execution through control.exe present the same way. Office applications do spawn children
  legitimately — add-ins, updaters, and protocol handlers among them — so the investigation should
  establish what document was open, what file control.exe was asked to load, and whether the Office
  install is patched and running with Protected View intact.
type: detection
detection_id: 894397c6-da03-425c-a589-3d09e7d1f750
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: >-
    Was control.exe launched directly by winword.exe, powerpnt.exe, or excel.exe, and does its
    command line differ from the routine `control.exe input.dll` form?
  context: >-
    Before investing investigation time, confirm both halves of the trigger: the parent is one of
    the three Office binaries the rule names, and the child is control.exe. The rule excludes
    command lines ending in `control.exe input.dll`, which is how the Control Panel input applet
    is normally invoked, so note the exact argument that survived that exclusion.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to open Office documents that launch Control Panel items?
  context: >-
    Legitimate activity triggers many detections, and a narrow set of add-ins and vendor helpers do
    invoke Control Panel applets from Office in supported flows. A user whose role involves no such
    workflow, on a host with no relevant add-in deployed, narrows the question to how the document
    caused the spawn.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this Office application expected to spawn control.exe, and what started the Office process itself?
  context: >-
    The Office-parent to control.exe pairing is the core signal for this detection. The parent's own
    command line usually carries the document path, and its grandparent shows how the document
    arrived — a mail client or browser launching Office points to a delivered file, while
    explorer.exe points to a local double-click.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What document or email attachment triggered this execution?
  context: >-
    The parent command line normally names the document that was open when control.exe was spawned.
    CVE-2021-40444 chains carry an embedded remote OLE/ActiveX reference rather than a macro, so a
    document with no macros does not rule the path out. Identify the file, then trace how it reached
    the user so the same file can be searched for on other mailboxes and hosts.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - manual_review
  - edr_console
- question: Is this Office installation patched against CVE-2021-40444?
  context: >-
    CVE-2021-40444 is an MSHTML remote code execution flaw reachable from Office documents, fixed in
    the September 2021 updates; the parent path names the install to check. Protected View and a
    policy disabling ActiveX control installation each block the exploit path independently of the
    patch, so confirm those too — a fully patched or fully restricted install points at a different
    Office-to-control.exe route rather than this CVE.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
  answer_sources:
  - asset_inventory
  - edr_console
- question: What other child processes did this same Office process spawn?
  context: >-
    Exploit chains rarely stop at one child. Other processes from the same Office instance in the
    surrounding window — script hosts, archive tools, additional control.exe or rundll32.exe
    invocations — show how far the execution got and what it staged next.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Did this same detection fire on other hosts or for other users in the last day?
  context: >-
    Documents built for this technique are rarely delivered to a single recipient. The same
    detection appearing on other hosts within a day points to a delivery run rather than a one-off,
    and each additional host needs the same document identification and containment work.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - alert
- question: What did control.exe load? Decode the argument on its command line.
  context: >-
    control.exe takes a Control Panel applet name or a file path and loads it. In this exploit path
    the argument resolves to a side-loaded .cpl or .inf extracted from an archive the document
    fetched, often under a temporary or user-writable directory or carrying an extension that does
    not match its content. Read the full argument and the working directory, and record the exact
    file it names.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What files did the Office process write around the time control.exe was spawned?
  context: >-
    The exploit chain fetches a remote archive and drops its contents to disk before control.exe
    loads them. Files written by the alerting Office instance in the same window — a CAB, an .inf,
    a .cpl, or a renamed DLL under a temporary or user-writable directory — identify the payload and
    give a filename to hunt for on other hosts.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - TargetFilename
  answer_sources:
  - file_event
- question: Did the Office process make outbound network connections before control.exe was spawned?
  context: >-
    Rendering an embedded remote object makes the Office process itself fetch the payload over HTTP
    or SMB, so the document need not carry it. Egress from the alerting Office instance in the
    minutes before the child spawn gives the delivery infrastructure to block and to search for
    elsewhere; Office also contacts vendor services routinely, so weigh each destination against
    known service endpoints.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
- question: Has this Office application ever spawned control.exe on this host before?
  context: >-
    Historical frequency of this specific parent-child pairing separates a deployed add-in or
    supported workflow from a first occurrence. Zero events over 90 days means the pairing is novel
    on this host; a steady count means something here does this routinely, and the command lines in
    the result show what.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Does this host normally run control.exe at all, and under which user accounts?
  context: >-
    control.exe is a standard Windows binary that runs whenever someone opens a Control Panel item,
    so a non-zero count is expected on an interactive workstation. The user breakdown is what
    matters — control.exe appearing under the alerting account for the first time, or on a server
    where nobody opens Control Panel items, is the deviation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: Has this user previously produced an Office-to-control.exe spawn, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the
    user's 90-day history of Office applications spawning control.exe rather than generic use of the
    binary, aggregated by host. A user who has never produced this pattern is a different reading
    from one who does so regularly; weigh the count against their role and normal document workflow.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \control.exe
        ParentImage|endswith:
        - \winword.exe
        - \powerpnt.exe
        - \excel.exe
      filter:
        CommandLine|endswith:
        - \control.exe input.dll
        - \control.exe" input.dll
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: Has this Office application historically driven this control.exe spawn across the environment, or is the parent new for this activity?
  context: >-
    When the alert fires under a service or machine account, user identity does not attribute the
    behavior and the launch mechanism is the meaningful pivot. The query mirrors the rule's
    selection structure scoped to the alerting parent process, giving the 90-day history of that
    parent driving this pattern rather than generic parent-and-binary co-occurrence. A parent that
    already accounts for a large prior count is vendor or add-in automation; a new one is the
    deviation to chase.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \control.exe
        ParentImage|endswith:
        - \winword.exe
        - \powerpnt.exe
        - \excel.exe
      filter:
        CommandLine|endswith:
        - \control.exe input.dll
        - \control.exe" input.dll
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did this user do across the environment around this time?
  context: >-
    Tracking the user's activity across all hosts in the alert window shows whether the document
    opening was isolated or whether the same account was active on other endpoints at the same time.
    If the alert fires under a machine or service account this view returns routine agent activity,
    and the parent-scoped fleet view is the one that answers the question.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: Did Office spawn control.exe on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, asking what else the user did across the network returns
    agent-telemetry noise. The query instead mirrors the rule's selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Several hosts firing together points
    to one document reaching several recipients or to pushed automation; a single host points to a
    host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \control.exe
        ParentImage|endswith:
        - \winword.exe
        - \powerpnt.exe
        - \excel.exe
      filter:
        CommandLine|endswith:
        - \control.exe input.dll
        - \control.exe" input.dll
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Aggregating process activity in the window around the alert collapses repetitive agent telemetry
    into high-count rows and leaves novel parent-child pairs standing out at low counts. Execution
    that ran alongside the document chain — reconnaissance, credential access, or persistence setup
    — surfaces here, and the timing relative to the alert shows what led in and what followed.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host can show the stages that preceded the document being opened
    or ran alongside it. For a document-delivered exploit, look for mail-client or browser child
    processes, archive extraction, and any execution that started before the Office process did.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
