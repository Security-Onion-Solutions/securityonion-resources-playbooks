name: UAC Bypass WSReset
id: 333741e5-243b-42cc-b93c-5db2b6f83711
description: |
  Detects wsreset.exe running at a High or System integrity level, the signature of a UAC bypass that abuses this auto-elevated Store-reset binary. wsreset.exe reads a command from an HKCU shell-handler key during startup and runs it as a high-integrity process without a consent prompt, so an elevated wsreset.exe is rarely a normal user action. Determine whether the elevation was operator-driven by examining the parent chain, any HKCU handler-key writes that preceded it, and what high-integrity activity followed.
type: detection
detection_id: 89a9a0e0-f61a-42e5-8957-b1479565a658
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did wsreset.exe run at High or System integrity, matching what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the process image and integrity level against the rule's detection criteria. The rule fires only when wsreset.exe runs at High, System, or the equivalent SID-form integrity levels, so an elevated wsreset.exe with no consent prompt is the pattern to verify.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - IntegrityLevel
- question: Is this user and host expected to run wsreset.exe at an elevated integrity level?
  context: Legitimate Store troubleshooting runs wsreset.exe at the user's own integrity level, not High or System. Knowing whether the user role and host function involve administrative elevation is often the fastest path to distinguishing a true positive from a routine Store reset.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What was the full wsreset.exe command line, and did it carry any non-default arguments?
  context: Normal Store-reset invocations run wsreset.exe with no arguments. Decode the full command line and working directory to confirm whether this is a bare auto-elevated launch or carries unexpected parameters. The bypass mechanism lives in a registry handler key rather than the command line, so a blank command line here does not clear the alert.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this elevated wsreset.exe, and is that parent chain expected?
  context: The parent reveals how wsreset.exe was launched. A user-driven Store reset is typically spawned from explorer.exe at medium integrity. A parent such as a shell, script host, or Office application spawning an already-elevated wsreset.exe points to a scripted bypass rather than a manual Store action.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Was the WSReset HKCU shell-handler key written or modified before this alert?
  context: The WSReset bypass works by writing an attacker command to the HKCU Store-app shell open-command handler that wsreset.exe reads at startup. Finding a registry write to that handler key shortly before the elevated launch confirms the bypass mechanism and reveals the exact payload that ran with high integrity. Absence of a write may mean the registry channel is not collected in this environment.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - 'AppX82a6gwre4fdg3bt635tn5ctqjf8msdd2\Shell\open\command'
          - 'Classes\ms-windows-store'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Were registry-handler writes made through reg.exe, powershell.exe, or cmd.exe to set up this UAC bypass?
  context: Many UAC bypasses write a command to an HKCU shell-handler key that an auto-elevated process reads and executes. Common targets include the ms-windows-store handler abused by WSReset, plus ms-settings, mscfile, and exefile handlers used by sibling bypasses. Finding the write through a command-line tool confirms the mechanism and reveals the payload that ran elevated.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\reg.exe'
          - '\powershell.exe'
          - '\cmd.exe'
        CommandLine|contains:
          - 'ms-windows-store'
          - 'ms-settings'
          - 'mscfile'
          - 'Classes\exefile'
          - 'Classes\Folder'
          - 'Environment'
          - 'Shell\Open\command'
          - 'DelegateExecute'
      condition: selection
    fields:
      - CommandLine
      - Image
- question: What action was performed with elevated privileges after the UAC bypass?
  context: UAC bypass is a means to an end -- the elevation exists to perform actions that require high integrity, such as installing persistence, dumping credentials, tampering with security tools, or accessing protected resources. Examining processes that ran at High or System integrity on this host shortly after the bypass reveals the objective.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: What child processes did this elevated wsreset.exe spawn?
  context: A normal Store reset spawns at most mmc.exe or no child at all. A child such as cmd.exe, powershell.exe, or another interpreter spawned by an elevated wsreset.exe is the payload the bypass was set up to launch, and reveals the actual impact of the elevation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Were other privilege escalation or UAC bypass detections seen on this host around the alert?
  context: Attackers who attempt one UAC bypass often try multiple methods until one succeeds, especially when the OS version or configuration blocks certain techniques. Multiple bypass or escalation alerts in a short window confirm deliberate privilege escalation activity rather than a benign elevated Store reset.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- question: Does this host normally run wsreset.exe?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. wsreset.exe is invoked only when a user troubleshoots the Store, so it should be rare on most hosts. Zero or very low historical counts indicate first-time or rare execution worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this elevated-wsreset pattern, what parents and users drove it, and does the current alert fit?
  context: Even a known binary can be abused. The query mirrors the rule's selection -- wsreset.exe at High or System integrity -- scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern has historically run here. A new parent process, an unexpected user, or an unusual launch pattern is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \wsreset.exe
        IntegrityLevel:
        - High
        - System
        - S-1-16-16384
        - S-1-16-12288
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \wsreset.exe
        IntegrityLevel:
        - High
        - System
        - S-1-16-16384
        - S-1-16-12288
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \wsreset.exe
        IntegrityLevel:
        - High
        - System
        - S-1-16-16384
        - S-1-16-12288
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar elevation activity on other hosts, the scope of the operation may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \wsreset.exe
        IntegrityLevel:
        - High
        - System
        - S-1-16-16384
        - S-1-16-12288
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to the elevation, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, additional escalation attempts, or persistence installation.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts fired this elevated-wsreset pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection -- wsreset.exe at High or System integrity -- with no host scope, so the result is a fleet-wide count of this firing pattern rather than generic wsreset.exe usage. Many hosts firing the same pattern points to scripted deployment or a shared image quirk; one host or a small unrelated set points to manual operator activity. Use the distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \wsreset.exe
        IntegrityLevel:
        - High
        - System
        - S-1-16-16384
        - S-1-16-12288
      condition: selection
    fields:
    - host.name
