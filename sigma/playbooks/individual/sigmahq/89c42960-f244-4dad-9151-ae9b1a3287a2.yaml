name: Suspicious File Write to Webapps Root Directory
id: e6d76fbc-7973-4c99-ba40-c894e2460062
description: |
  Detects a web server process — one whose Image ends in \dotnet.exe, \w3wp.exe, or \java.exe —
  writing a file ending in .jsp into a path that contains \apache or \tomcat AND \webapps\ROOT\.
  A web server worker writing executable script content into its own served web root is the classic
  webshell-drop pattern: an exploited public-facing application persists access by planting a script
  the operator can later request to run commands on the host. Legitimate application deployments and
  build tooling can also write into a web root, so the investigation centers on what wrote the file,
  whether the .jsp is subsequently requested or executed, and whether the write correlates with
  inbound web traffic and follow-on process or network activity.
type: detection
detection_id: 89c42960-f244-4dad-9151-ae9b1a3287a2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the alerting write match the rule — a web server process writing a .jsp into a Tomcat or Apache webapps ROOT path?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires only
    when all of its conditions hold together: the writing process Image ends in \dotnet.exe,
    \w3wp.exe, or \java.exe AND the target path contains \apache or \tomcat AND the path contains
    \webapps\ROOT\ AND the filename ends in .jsp. Review the exact TargetFilename and the writing
    Image on the triggering event, and note which of the three server binaries performed the write,
    since that identifies the runtime that hosted the drop.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is a web server process expected to write .jsp files into this application's ROOT directory on this host?
  context: >-
    Legitimate application deployments, hot-deploys, and CI build tooling do write into web roots,
    typically on a defined set of application servers and through known processes and accounts.
    Knowing whether this host serves this application and whether the writing identity matches an
    expected deployment path is often the fastest way to separate a routine deploy from a webshell
    drop. The web root location varies by install, so a custom directory alone is not the signal.
    The User on file events is a service or app-pool identity roughly 94% of the time; when it is a
    machine account or SYSTEM, judge by the writing process and host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the dropped .jsp still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives both urgency and next steps. A payload still on disk can
    be retrieved, hashed, and read; a file deleted or renamed shortly after creation suggests
    anti-forensic cleanup or a self-removing dropper and shifts the focus to what executed in
    between. Interpret the operation type on later events for this path over the following window.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What is the content of the dropped .jsp file, and does it contain webshell logic?
  context: >-
    Read the file's actual content. JSP webshells commonly wrap runtime command execution
    (Runtime.getRuntime().exec or a process builder) driven by a request parameter, or stage an
    uploader or file browser. Check for base64 or hex-encoded strings, character-concatenation
    obfuscation, embedded URLs or IP addresses, and known command-execution string patterns.
    Content retrieval is a manual step against the on-disk file or endpoint tooling; the file-write
    event records the path and writer but not the bytes.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If anything with this filename later executed as a process, what is its hash and reputation?
  context: >-
    A file's hash is recorded when it runs, not when it is written, so this pivot looks for a process
    whose image matches the dropped filename and reads its hash for threat-intel lookup. A JSP is
    interpreted inside the web server process rather than launched as its own process, so this query
    frequently returns nothing by construction; when it does, that is a notable renamed-binary case.
    The reliable path for a JSP is to retrieve the file from its on-disk path and hash it manually,
    and to assess the interpreter child processes the web server spawned, which carry their own
    hashes.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: After the write, did the web server process spawn a command shell or script interpreter?
  context: >-
    A JSP webshell executes by having its hosting web server process (java.exe, w3wp.exe, or
    dotnet.exe) spawn child processes such as cmd.exe, powershell.exe, or other command
    interpreters and LOLbins to run operator commands. Child processes appearing under the writing
    process after the drop are the strongest confirmation that the planted file is a functioning
    webshell rather than a benign deploy artifact. Some app pools legitimately spawn known children
    (for example msbuild.exe in a build pipeline); exclude those from suspicion. Custom server
    wrappers such as php-cgi.exe or apache.exe can play the same launching role on other stacks.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A process that drops one webshell often drops several — additional shells for redundancy, staged
    tooling, or output files. The breadth, paths, and extensions of the writing process's other file
    activity distinguish a single artifact from active staging and enumerate what else needs review.
    A busy web server writes many benign files, so weigh where the writes land, not volume alone.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to the webapps ROOT directory recently, and by which processes?
  context: >-
    A served web root has a small set of processes that legitimately write there — deployment
    tooling and the application server itself. Other recent arrivals in the same \webapps\ROOT\
    path reveal whether this is an isolated drop or a location under active use, and surface
    additional planted scripts. The exact web root path varies by install; reuse the directory the
    rule pinned. A single unfamiliar writer across several files is the signal.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\webapps\ROOT\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What modules did the web server process load, and are any unsigned or unusual for this application?
  context: >-
    Exploitation of a public-facing application can cause the server process to load non-standard
    modules — injected managed assemblies or unmanaged DLLs — as part of the code-execution chain
    that precedes or accompanies the drop. Modules loaded by the alerting process that are unsigned,
    have an invalid signature, or are first-seen for this application corroborate exploitation.
    Loaded modules carry their own hash on the load event, so a suspicious module can be looked up
    directly.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - SignatureStatus
- question: What network connections did this host make in the window after the file write?
  context: >-
    After a successful drop, a webshell or the exploited server process frequently reaches out —
    pulling additional tooling or establishing an operator channel. Connections from the host in the
    window after the write, particularly egress to external addresses, tie the file write to an
    active operation. The correlation horizon between request, drop, and callback is short, on the
    order of fifteen minutes. Routine agent, update, and telemetry egress is expected noise; the
    Initiated direction and destination address separate that from an operator channel.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
      - Image
- question: What inbound web request preceded this file write?
  context: >-
    For a server-side webshell drop the delivery vector is a crafted HTTP request to the
    public-facing application. Correlate the write timestamp against the web server access logs for
    the originating request and its source address, scoped to the application's public addresses and
    hostnames. Exploit-like inputs include path traversal (../), SQL injection (union select),
    command injection (cmd=), JNDI lookups (${jndi:), Java serialization (rO0AB), and null-byte
    (%00) markers. A spike in 4xx/5xx responses around the drop, on the order of more than five in
    five minutes from one client or to one path, indicates probing that preceded the write.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Is the web application server up to date with security patches?
  context: >-
    Exploitation of a public-facing application typically abuses a known vulnerability in the app or
    server. Confirm the version of the Tomcat, Apache, or .NET application behind this host and
    whether it is patched against known remote-code-execution and path-traversal issues. An
    unpatched server confirms exploitation was feasible, helps distinguish a known-CVE exploit from
    a zero-day, and identifies other similarly unpatched hosts at risk.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: Were other servers hit by the same file-write pattern?
  context: >-
    Exploitation of a public-facing application rarely reaches a single host. The same rule firing
    on other systems reveals how many servers were reached and which additional hosts need the same
    review. A cluster of hits in a short window points to a scripted campaign against the exposed
    application.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- always_include: true
  question: Has this user account previously produced this write pattern, and does that history fit its role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the
    account's 90-day history of this specific web-root .jsp write pattern, aggregated by host — not
    generic use of the server binary. An account that has never produced this pattern is more
    notable than one that does so regularly as part of deployments; weigh the count against the
    account's role and whether it is a deployment or service identity.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection_susp_img:
        Image|endswith:
        - \dotnet.exe
        - \w3wp.exe
        - \java.exe
      selection_servers:
        TargetFilename|contains:
        - \apache
        - \tomcat
      selection_path:
        TargetFilename|contains: \webapps\ROOT\
      selection_susp_extensions:
        TargetFilename|endswith: .jsp
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has the alerting program historically driven this write pattern here or across the environment?
  context: >-
    When the alert fires under a service or app-pool identity, user identity does not attribute the
    behavior; the launch mechanism does. The query mirrors the rule's selection structure scoped to
    the alerting program, so the result is the 90-day history of that program driving this
    specific web-root .jsp write pattern. A new or rare program for this pattern is the deviation
    worth chasing; a program that already accounts for many prior events is application or deployment
    automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection_susp_img:
        Image|endswith:
        - \dotnet.exe
        - \w3wp.exe
        - \java.exe
      selection_servers:
        TargetFilename|contains:
        - \apache
        - \tomcat
      selection_path:
        TargetFilename|contains: \webapps\ROOT\
      selection_susp_extensions:
        TargetFilename|endswith: .jsp
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user account do across the environment around this time?
  context: >-
    Tracking the account's activity across all hosts in the alert window reveals whether the same
    identity is active on multiple systems, which would widen the scope of the investigation. If the
    alert fires under a machine account or a system service principal, this view returns broad agent
    telemetry; in that case the parent-driven cross-host view is the meaningful answer, and this one
    is read for obvious multi-host operator activity only.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did the same program-driven write pattern fire on other hosts in the same window, indicating a coordinated rollout rather than host-local activity?
  context: >-
    Under a service principal, asking what else the user did returns agent-telemetry noise. The
    meaningful question is whether the same launch mechanism fired elsewhere: the query mirrors the
    rule's selection structure scoped to the alerting program, fleet-wide, in the alert
    window. Multiple hosts in the same window point to scripted or pushed automation, or to a
    campaign hitting several exposed servers at once; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection_susp_img:
        Image|endswith:
        - \dotnet.exe
        - \w3wp.exe
        - \java.exe
      selection_servers:
        TargetFilename|contains:
        - \apache
        - \tomcat
      selection_path:
        TargetFilename|contains: \webapps\ROOT\
      selection_susp_extensions:
        TargetFilename|endswith: .jsp
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — reconnaissance, exploitation attempts against the exposed
    application, or prior file drops — may reveal the stages that led to this write and help
    reconstruct the timeline. Probing or an exploit alert followed by a web-root script write is a
    common progression, and prior alerts help place this drop within it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
