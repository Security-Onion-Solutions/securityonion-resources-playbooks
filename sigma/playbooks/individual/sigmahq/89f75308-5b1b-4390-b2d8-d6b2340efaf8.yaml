name: Windows Backup Deleted Via Wbadmin.EXE
id: 31fe82ef-24f0-48d3-a18d-48db2049a740
description: |
  Detects execution of wbadmin.exe with a "delete" and "backup" command line that removes Windows backups or system state backups, excluding the benign keepVersions:0 retention form. The rule fires when the image ends in wbadmin.exe (or carries the WBADMIN.EXE original filename) AND the command line contains both "delete" and "backup", AND the keepVersions:0 filter does not match. Deleting backups inhibits recovery and is a common precursor to file encryption; it can also be a legitimate administrative or backup-software maintenance action. Investigate which backups were targeted, whether other recovery-inhibiting commands ran on the host, and whether the user, parent process, and timing are consistent with sanctioned administration.
type: detection
detection_id: 89f75308-5b1b-4390-b2d8-d6b2340efaf8
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line show wbadmin.exe deleting a backup or system state backup?
  context: Confirm the alert is a true positive before investing investigation time. The rule requires the process to be wbadmin.exe (by image name or original filename) AND a command line that contains both "delete" and "backup", AND that the command is not the benign keepVersions:0 retention form. Read the full command line and identify whether it targets system state backups, full backups, or a specific catalog version.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to delete backups or system state backups?
  context: Legitimate backup maintenance and administration scripts do delete old backups, so user role and host function are often the fastest way to separate routine operations from an operator inhibiting recovery. Backup deletion typically runs on server platforms with Windows Backup enabled and requires Backup Operators or Administrators membership and an elevated prompt; confirm whether this account and host are a sanctioned backup target.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which backup or recovery target was deleted, and was a specific version, catalog, or all backups removed?
  context: Decode the wbadmin arguments to identify the exact recovery asset destroyed. wbadmin delete systemstatebackup and wbadmin delete backup accept mutually exclusive selectors -version:<MM/DD/YYYY-HH:MM>, -deleteOldest, or -keepVersions:<n>, plus optional -backupTarget and -quiet for unattended use. Determine whether one dated version, the oldest, or the full set was removed, and whether -quiet suppressed prompts, since this defines what recovery is still possible.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned wbadmin.exe, and is that parent chain expected for backup administration?
  context: The parent process reveals how the deletion was invoked. Sanctioned backup maintenance is usually launched by a scheduled task, a backup product service, or an interactive administrative shell. A parent such as a script host, an Office application, or an unfamiliar interpreter that ran a one-line destructive command points to scripted recovery inhibition rather than routine administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What recovery-inhibiting commands were executed on this host?
  context: 'Recovery inhibition is rarely a single command. Operators chain native utilities to remove every recovery path: deleting shadow copies (vssadmin, wmic), disabling boot recovery (bcdedit recoveryenabled / bootstatuspolicy), deleting backups and catalogs (wbadmin), and disabling the Windows Recovery Environment (reagentc). This query surfaces the full set of recovery-inhibiting commands on the host so the analyst can see the complete scope, then verify each outcome with wbadmin get versions, vssadmin list shadows, bcdedit /enum, and reagentc /info.'
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\reagentc.exe'
          - '\diskshadow.exe'
      selection_cmdline:
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'recoveryenabled'
          - 'bootstatuspolicy'
          - 'delete catalog'
          - 'delete systemstatebackup'
          - 'boot.ini'
          - 'winre.wim'
          - '/disable'
      condition: selection and (selection_recovery or selection_cmdline)
    fields:
      - Image
      - CommandLine
- question: What other destructive or recovery-inhibiting actions occurred on this host?
  context: 'Operators inhibiting recovery typically chain several destructive actions in one operation: deleting backups AND shadow copies AND stopping security services AND clearing event logs. Surfacing the complete set of destructive utility executions, and noting whether they share a common parent, distinguishes a coordinated destruction sequence from an isolated administrative backup deletion.'
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_destructive:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\cipher.exe'
          - '\fsutil.exe'
          - '\icacls.exe'
          - '\takeown.exe'
          - '\attrib.exe'
          - '\sc.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\powershell.exe'
          - '\taskkill.exe'
      condition: selection and selection_destructive
    fields:
      - Image
      - User
- question: Were recovery or system-restore settings disabled through the registry on this host around the alert?
  context: Inhibit System Recovery is not limited to command-line utilities. The same outcome can be reached by writing registry values that disable System Restore or turn off automatic recovery, which leaves no wbadmin or bcdedit process to detect. Checking registry modifications to the System Restore and recovery policy keys in the alert window catches recovery inhibition performed directly against the registry rather than through a native tool.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\SystemRestore\DisableSR'
          - '\SystemRestore\DisableConfig'
          - '\Windows NT\CurrentVersion\SystemRestore'
          - '\WindowsBackup\DisableMonitoring'
          - '\Reliability\TimeStampInterval'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: Are the deleted backups recoverable, or is the host still without backup coverage?
  context: Backup deletion may be a temporary maintenance step or a permanent loss of recovery capability. Verify the current backup state on the host with wbadmin get versions and check whether the affected backup target, catalog, or system state versions still exist. If the backups are gone and no offline, tape, or cloud copy remains, recovery options should be confirmed before any remediation that could overwrite remaining data.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does this host normally run wbadmin.exe?
  context: A host that has never run wbadmin is more suspicious than one where scheduled backup maintenance runs it regularly. The 90-day aggregation by user shows historical frequency; zero or very low counts indicate first-time or rare execution and raise the priority of the current deletion.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously run wbadmin deleting a backup, what parents and users normally drove it, and does the current alert fit that pattern?
  context: Even routine backup maintenance has a stable pattern. This query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific deletion pattern has historically run here. A new parent process, an unexpected account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wbadmin.exe
      - OriginalFileName: WBADMIN.EXE
      selection_cli:
        CommandLine|contains|all:
        - 'delete '
        - backup
      filter_main_keep_versions:
        CommandLine|contains: keepVersions:0
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wbadmin.exe
      - OriginalFileName: WBADMIN.EXE
      selection_cli:
        CommandLine|contains|all:
        - 'delete '
        - backup
      filter_main_keep_versions:
        CommandLine|contains: keepVersions:0
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wbadmin.exe
      - OriginalFileName: WBADMIN.EXE
      selection_cli:
        CommandLine|contains|all:
        - 'delete '
        - backup
      filter_main_keep_versions:
        CommandLine|contains: keepVersions:0
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts run wbadmin deleting a backup in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, giving a fleet-wide count of the same deletion pattern rather than generic wbadmin usage. Many hosts firing the same pattern points to scripted deployment or scheduled backup automation; a single host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wbadmin.exe
      - OriginalFileName: WBADMIN.EXE
      selection_cli:
        CommandLine|contains|all:
        - 'delete '
        - backup
      filter_main_keep_versions:
        CommandLine|contains: keepVersions:0
      condition: all of selection_* and not 1 of filter_main_*
    fields:
    - host.name
- question: Is this same backup-deletion alert firing on other hosts in the environment?
  context: Destructive operations are often executed across many hosts simultaneously or in rapid succession. Finding this same alert firing on multiple hosts indicates network-wide recovery inhibition and determines the scope for containment and incident response. If many hosts are affected, escalate to incident response.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
- question: Are there signs of file encryption, ransom notes, or unknown binary execution on this host after the backup deletion?
  context: Recovery-inhibiting actions such as backup destruction typically precede file encryption by minutes. Checking for unknown or suspicious binaries executing from temp or user-writable paths after the deletion, and for ransom-note file creation, determines whether encryption has already started and how far it has progressed.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_known:
        Image|startswith:
          - 'C:\Program Files'
          - 'C:\Windows\System32\svchost'
          - 'C:\Windows\System32\wbem'
      condition: selection and not filter_known
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the backup deletion reveals the immediate context: what led to it, what followed, and whether it is part of a larger destruction sequence. Aggregating by image and parent collapses repetitive agent telemetry while novel parent-child pairs stand out at low counts.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Backup deletion is often a late stage of an intrusion. Earlier detections on the same host -- defense tampering, reconnaissance, credential access, or service stops -- may reveal the attack stages that preceded recovery inhibition and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
