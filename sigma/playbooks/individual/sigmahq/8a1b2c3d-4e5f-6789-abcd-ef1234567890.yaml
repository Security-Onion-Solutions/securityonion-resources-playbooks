name: PUA - Memory Dump Mount Via MemProcFS
id: 93649428-9621-4591-b4ea-669604019b01
description: |
  Detects execution of MemProcFS with the '-device' parameter. MemProcFS mounts physical memory or a
  raw memory dump file as a virtual file system, exposing process memory and system structures as
  browsable files. Legitimately it is a memory-forensics tool; the same capability lets an operator
  mount a captured dump (MEMORY.dmp, a .raw image, or an archived dump) offline and read credentials
  straight out of LSASS, the SAM/SECURITY/SYSTEM hives, LSA secrets, and cached domain credentials
  without touching a live LSASS handle. The rule fires only when the process is identified as MemProcFS
  (Image, OriginalFileName, or Description) AND the command line carries '-device'. Investigation should
  establish what dump the analyst pointed it at, whether this was sanctioned forensic work, and what
  credential material was reachable in that dump.
type: detection
detection_id: 8a1b2c3d-4e5f-6789-abcd-ef1234567890
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Is the alerting process MemProcFS, and did it run with the '-device' parameter?
  context: Confirm the alert is a true positive before investing time. The rule fires only when the
    process is identified as MemProcFS (by Image name, OriginalFileName, or Description) AND the command
    line contains '-device'. Read the full command line and confirm both halves are present, and note
    the value that follows '-device' — it names the memory source being mounted.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
      - Description
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run memory-forensics tooling?
  context: Memory forensics is normally performed by a small set of IR or DFIR personnel on designated
    analysis hosts. A workstation or server that has no forensic role, or a user account outside the
    investigation team, running MemProcFS is the deviation worth chasing. Knowing the host function and
    user role is often the fastest way to separate sanctioned analysis from credential theft.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is MemProcFS on the organization's approved tooling list for this host?
  context: MemProcFS is flagged as a potentially unwanted application because its memory-mount
    capability doubles as a credential-extraction primitive. Many environments either ban it outright
    or restrict it to designated forensic workstations. If it is not sanctioned for this host, the
    execution is shadow tooling or operator-deployed regardless of who ran it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is there an authorized forensic engagement or incident ticket that explains this MemProcFS run?
  context: Sanctioned memory analysis is normally tied to an open incident, a documented IR engagement,
    or a scheduled forensic task. If no such record covers this execution, the run should be treated as
    unauthorized credential access rather than routine analysis. Match the timestamp and host against
    the change/incident record.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: What memory source was mounted, and what credential stores would it expose?
  context: The value after '-device' names what MemProcFS mounted — a live device, a raw image, or a
    dump file such as MEMORY.dmp. Whatever the dump captured becomes browsable as files, so a full
    physical-memory dump exposes LSASS process memory, the SAM/SECURITY/SYSTEM registry hives, LSA
    secrets, and cached domain credentials in one mount. Decode the full command line, identify the
    mounted source, and treat every credential store present in that memory image as reachable.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - file_event
- question: What memory dump file was MemProcFS pointed at, and is that file present on this host?
  context: The '-device' argument typically points at a memory image such as a .raw, .dmp, .mem, or
    archived (.7z/.zip) dump rather than a live device. Locating that file on disk confirms an offline
    credential-extraction workflow and tells you which host's memory was captured — the source host may
    differ from the analysis host. File paths under user profiles, %TEMP%, C:\Windows\Temp, or
    C:\Users\Public are common staging locations for such dumps.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_dumps:
        TargetFilename|contains:
          - '.dmp'
          - '.raw'
          - '.mem'
          - 'MEMORY.'
          - 'memdump'
      condition: selection and filter_dumps
    fields:
      - TargetFilename
      - Image
      - User
  answer_sources:
  - file_event
  - manual_review
- question: What process spawned MemProcFS, and is that parent chain expected?
  context: The parent reveals how MemProcFS was launched. A direct launch from explorer.exe or a console
    is consistent with hands-on analyst use; a launch from a script host, an Office application, a
    remote-execution service, or an unexpected automation parent points to operator or malware-driven
    execution. Walk up the tree to see what spawned the parent and what else it spawned.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What child processes did MemProcFS spawn afterward?
  context: Once a dump is mounted, the operator usually reads or copies files out of the virtual file
    system. Child processes such as cmd.exe, powershell.exe, findstr, or copy operations reading from the
    mount point indicate active extraction of credential material rather than a tool that was merely
    launched. Legitimate analysis may instead show interactive review with no scripted children.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Which accounts are exposed by the mounted memory image, and do any have elevated privileges?
  context: The severity depends on whose credentials sat in the captured memory. A dump from a domain
    controller or privileged server exposes domain-admin, service-account, krbtgt, and cached-credential
    material and requires incident escalation; a standard workstation dump may expose only local and
    interactive-user secrets. Cross-reference the source host and any recovered account names against
    directory group memberships.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - active_directory
  - organizational_knowledge
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: When this host has previously fired this rule's pattern, what parents and users drove it, and
    does the current alert fit?
  context: Even sanctioned forensic hosts run MemProcFS the same way each time. The query mirrors the
    rule's selection (MemProcFS identity AND '-device') scoped to this host, so the historical parent and
    user distribution reflects how this specific firing pattern has run here. A new parent, an unexpected
    user, or a first-ever appearance is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \MemProcFS.exe
      - OriginalFileName: MemProcFS.exe
      - Description: MemProcFS
      selection_cli:
        CommandLine|contains: -device
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \MemProcFS.exe
      - OriginalFileName: MemProcFS.exe
      - Description: MemProcFS
      selection_cli:
        CommandLine|contains: -device
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \MemProcFS.exe
      - OriginalFileName: MemProcFS.exe
      - Description: MemProcFS
      selection_cli:
        CommandLine|contains: -device
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether credential extraction was part of
    a wider operation. If the same user mounted dumps or ran related tooling on multiple endpoints, the
    scope of credential exposure is larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \MemProcFS.exe
      - OriginalFileName: MemProcFS.exe
      - Description: MemProcFS
      selection_cli:
        CommandLine|contains: -device
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Credential dumping rarely stands alone. Earlier detections on this host — defense tampering,
    reconnaissance, the staging or transfer of a dump file, or privilege escalation — may reveal how the
    operator reached the point of mounting a memory image and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
