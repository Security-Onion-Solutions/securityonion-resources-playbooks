name: Potential Remote Desktop Tunneling
id: cd397122-dd99-49b3-9bab-d526bfeadc51
description: |
  Detects command-line invocations that combine the RDP port reference :3389 with an SSH tunneling flag
  (-L, -P, -R, -pw, or -ssh). This pattern is consistent with an SSH utility forwarding Remote Desktop
  traffic through an encrypted tunnel, which lets RDP reach a destination that direct connections cannot
  — for example, bypassing a firewall that blocks inbound RDP but permits outbound SSH. The rule fires
  only when both the :3389 reference and at least one tunneling flag appear in the same command line.
  Legitimate use is uncommon; investigation should determine which utility ran, what the forward mapping
  was, which user and source host drove it, and whether the tunnel reached an internal or external endpoint.
type: detection
detection_id: 8a3038e8-9c9d-46f8-b184-66234a160f6f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line contain :3389 together with an SSH tunneling flag (-L, -P, -R, -pw, or -ssh)?
  context: Before investing investigation time, confirm the alert is a true positive by reading the exact
    command line. The rule fires only when the :3389 reference and at least one tunneling flag both appear,
    so verify that both elements are present and note which tool ran (plink.exe, ssh.exe, or similar) and
    what the port-forward mapping looks like.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run SSH tunneling utilities that forward RDP?
  context: Legitimate administrative remote access usually goes through sanctioned jump boxes and management
    tooling, not ad-hoc SSH port forwards to port 3389. Knowing whether this user's role and this host's
    function involve SSH tunneling is often the fastest way to separate a sanctioned admin action from
    operator activity establishing covert reach.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What was the full tunnel command? Decode the forward mapping, the SSH server, and any embedded credentials.
  context: The full command line reveals what the tunnel actually does. Read the forward specifier to see
    the mapping — for example -R 3389:127.0.0.1:3389 (reverse forward exposing local RDP to the remote
    SSH server) or -L 13389:127.0.0.1:3389 (local forward). Identify the SSH server hostname or IP, the
    -P port, and whether -pw passed a plaintext password. These details determine whether the tunnel reaches
    an internal pivot or an external destination.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - Image
- question: What process spawned this tunneling command, and is that parent chain expected?
  context: The parent process reveals how the tunnel was launched. An interactive shell or remote-access
    parent suggests hands-on-keyboard activity, while a script host, Office application, or unusual service
    parent points to scripted or exploitation-driven invocation. Note what spawned the parent and what
    else the parent launched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did this tunneling command spawn afterward?
  context: Processes spawned by the tunnel command reveal its operational impact. A tunnel utility that
    spawns command interpreters, credential tools, or additional network clients shortly after launch
    indicates the forward was used as a staging step for further hands-on activity rather than a one-off
    connection.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host has previously fired the tunneling pattern, what parents and users normally drive
    it, and does the current alert fit that pattern?
  context: Even sanctioned tunneling can recur on a host. The query mirrors the rule's :3389-plus-flag
    selection scoped to this host, so the resulting parent and user distribution reflects how this specific
    pattern has run here before. A new parent process, an unexpected user account, or an unusual command
    pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: :3389
      selection_opt:
        CommandLine|contains:
        - ' -L '
        - ' -P '
        - ' -R '
        - ' -pw '
        - ' -ssh '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the tunneling pattern in the past week, and does the cross-host distribution
    look like consistent automation or one-off activity?
  context: The query mirrors the rule's :3389-plus-flag selection with no host scope, giving a fleet-wide
    count of the tunneling pattern rather than generic SSH-client usage. Many hosts firing the same pattern
    points to scripted deployment or a management tool; one host or a small unrelated set points to manual
    operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: :3389
      selection_opt:
        CommandLine|contains:
        - ' -L '
        - ' -P '
        - ' -R '
        - ' -pw '
        - ' -ssh '
      condition: all of selection*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: :3389
      selection_opt:
        CommandLine|contains:
        - ' -L '
        - ' -P '
        - ' -R '
        - ' -pw '
        - ' -ssh '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in the alert window reveals whether the tunnel
    is isolated or part of broader movement. If the same user triggered similar activity or touched multiple
    endpoints, the scope of compromise may be larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate
    context: what led to the tunnel command, what happened after, and whether it is part of a larger sequence.
    Look for reconnaissance, credential access, or staging that surrounds the tunnel setup.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — reconnaissance, credential access, or defense tampering —
    may reveal the attack stages that preceded the tunnel setup. A tunnel is usually a means to reach a
    target, so prior alerts often explain how the operator got to the point of forwarding RDP.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: What inbound RDP or SSH connections reached this host, and are those sources expected administrative origins?
  context: Lateral movement requires a source and destination. Inbound connections to the RDP (3389) and
    SSH (22) ports reveal whether the tunneled access came from a known admin jump box, a compromised
    workstation, or an unexpected origin. A tunnel that terminates RDP locally is often consumed by a
    connection arriving on one of these ports.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 3389
          - 22
          - 445
          - 5985
          - 5986
      condition: selection
    fields:
      - SourceIp
      - DestinationPort
- question: What user and credential context launched the tunnel, and does the command pass a plaintext password?
  context: The acting user and any embedded credentials reveal how access was obtained. A -pw flag passes
    a plaintext SSH password on the command line, which is both an exposure and a sign of scripted operator
    use. The user account driving the tunnel determines whether legitimate credentials, stolen credentials,
    or a service account is in play.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
      - CommandLine
- question: What processes ran on this host after the tunnel was established?
  context: A tunnel is a means to an end — once RDP is forwarded, the operator interacts with the desktop
    or runs commands. Examining processes spawned shortly after the tunnel setup reveals the objective on
    this host, such as remote desktop sessions, file access, or tool deployment.
  range: +30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - Image
- question: Has this user account run remote-access or tunneling tools against other hosts?
  context: Attackers rarely stop at one target. If this user account is invoking SSH clients, RDP clients,
    or other remote-access tooling across multiple systems within a short window, the scope of compromise
    is larger. Connections to many hosts from one account indicate active lateral movement.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_lateral:
        Image|endswith:
          - '\plink.exe'
          - '\ssh.exe'
          - '\putty.exe'
          - '\mstsc.exe'
          - '\psexec.exe'
          - '\psexec64.exe'
      condition: selection and selection_lateral
    fields:
      - host.name
      - Image
- question: Where has this user authenticated recently, and do the logon events line up with the tunnel timing?
  context: Remote service abuse pairs a logon with follow-on activity. Security logon events show which
    systems the user reached before and after the tunnel command and which logon types were used (3 network,
    10 RDP, 2 interactive). A burst of logons across systems around the tunnel timing, or an RDP logon that
    immediately follows the forward, helps confirm the tunnel carried an actual session. If Security logs
    are not ingested in this environment, treat zero results as a visibility gap rather than evidence nothing
    occurred.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 4624
          - 4625
          - 4648
        TargetUserName|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - IpAddress
      - EventID
      - LogonType
