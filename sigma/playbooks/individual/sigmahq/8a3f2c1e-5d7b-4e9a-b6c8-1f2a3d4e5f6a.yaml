name: TanStack Supply-Chain Attack File Creation Indicators - Windows
id: 7e2a2c06-84e7-4236-924a-7a25d7a02d81
description: |
  Detects the creation of files matching either branch of a package supply-chain compromise pattern: the credential-harvesting payload itself (router_init.js, tanstack_runner.js), or its persistence copies planted in developer-tool hook directories (.claude/router_runtime.js, .vscode/router_runtime.js). The pattern originates in maliciously republished npm package versions that pull the payload in through a dependency reference rather than a modified build script, so it typically reaches a workstation or CI runner through a routine dependency install or update. On first run the payload forks a detached background process so it survives the parent installer exiting, fingerprints the host and CI environment, and harvests cloud and CI credentials; some variants can also republish themselves to further packages. Investigation should confirm which branch fired, examine the artifact's content and any process it spawns after creation, and determine whether the same package version reached other hosts.
type: detection
detection_id: 8a3f2c1e-5d7b-4e9a-b6c8-1f2a3d4e5f6a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the created file match one of this rule's two detection patterns, and which one?
  context: This rule fires when a file's path ends in either the payload names (router_init.js, tanstack_runner.js) or the persistence copies in developer-tool hook directories (.claude/router_runtime.js, .vscode/router_runtime.js) — note which branch matched, since the two imply different stages. The payload names indicate a first-time drop; the .claude/.vscode copies indicate the persistence step has already run. Review the writing process alongside the path before investing further time.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - file_event
- question: Is this user or host expected to install or update npm dependencies that would write a file at this path?
  context: Legitimate development and CI activity routinely installs and updates npm packages, which is when this file pattern is normally written. Judge whether the user and host role fit package installation — a developer workstation or CI runner performing a dependency update — versus a host with no expected package-management activity. When the account is a service or CI-runner identity, judge by the writing process and host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is the file still on disk, or was it deleted or renamed after the alert?
  context: The artifact's post-alert lifecycle drives next steps. A payload or persistence copy still on disk can be retrieved and analyzed directly; this pattern does not delete itself as part of normal first-run behavior, so an unexpected deletion or rename shortly after creation may indicate cleanup or a separate process interfering with the artifact. Interpret by EventType and the process performing each operation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What package install or update process wrote this file, and which dependency delivered it?
  context: This pattern originates in compromised versions of npm packages that inject the payload through a dependency reference rather than a modified build script, so the trigger is typically an npm, yarn, or pnpm install or update rather than a document or email. Identify the parent install process and, from its command line or the project's lock file, the specific package name and version that pulled in the dependency, so the affected project can be traced and the reference pinned or removed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - manual_review
  - edr_console
- question: Did this same detection fire on other hosts, indicating a wider dependency compromise?
  context: A compromised package version reaching one host through routine dependency resolution likely reaches other hosts or CI runners that depend on the same package range. Correlating this rule's firings across the fleet shows how many systems pulled in the same dependency and whether the exposure is isolated or organization-wide.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - alert
- question: What is the content of this file — does it show heavy obfuscation, encoded string tables, or environment-variable probing?
  context: Read the file's actual content rather than relying on the filename alone. Payloads in this class typically wrap their logic in a numeric dispatcher of many small obfuscated functions plus a secondary base64/XOR decode layer, defeating simple string search, and probe many environment variables to fingerprint the CI platform, cloud provider, and OS before deciding what to do next. Compare any decoded strings, embedded hosts, or file paths against threat intelligence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
- question: Beyond general obfuscation, what does the encoded content decode to, and which credential sources does it target?
  context: This payload class layers a numeric dispatcher over many small functions with a secondary base64/XOR decode step, then reads environment variables to identify the CI platform, cloud provider, and credential stores — secrets APIs, instance-metadata services, secret managers, and service-account tokens are typical targets. Fully decoding the content shows which credential surfaces were queried and what needs rotation. The writer's command line, if present, may show how the payload was invoked.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: If this artifact has executed, what is its hash, and does that hash have known threat-intelligence detections?
  context: A file's hash is recorded when it runs, not when it is written — file-creation events carry no hash. This query looks for the artifact executing and reads its hash; check that hash against reputation and threat-intelligence sources to determine whether it matches a known-malicious release of this payload, a benign package file, or something previously unseen. If the artifact is present but has not executed, retrieve it from its on-disk path and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: What launched the process that wrote this file, and is that launch chain expected?
  context: The launch chain shows how the write occurred. A developer's terminal or IDE spawning a package manager fits an interactive install; an automation service, CI orchestrator, or scheduled task spawning the chain fits a pipeline run. An unfamiliar parent, or a package manager launched from a script host or unexpected interpreter, fits neither pattern and warrants closer review.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Did the process that wrote this file spawn a child process afterward, and does that child persist independently of the original session?
  context: Payloads in this class commonly check an environment marker on first run, then relaunch themselves as a detached background process with no attached console before the original installer or session exits — this decouples the running payload from the process that triggered it and lets it survive after the install finishes. A child process spawned by the writer shortly after the file was created, especially one still running after the parent process has exited, is that re-launch.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
  answer_sources:
  - process_creation
- question: Did the host make outbound network connections in the hours after this file was created, to any previously unseen destinations?
  context: Payloads in this class commonly perform first-run network activity shortly after install — reaching credential and secrets APIs, cloud instance-metadata services, or external infrastructure used for command-and-control or exfiltration. Review connections in the window after the alert for destinations this host has not contacted before, and treat repeated peer-to-peer or non-standard-protocol traffic on common web ports as worth deeper inspection.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
  - external_threat_intel
- question: What other files did the responsible process write or delete around the alert?
  context: A dropper for this pattern often writes more than one artifact together — the payload file itself alongside the persistence copies placed in developer-tool hook directories, or supporting files staged nearby. The correlation covers the writer and its direct children, since droppers often delegate the actual writes to a spawned process. The breadth and paths of the process's other file activity show whether this is an isolated drop or part of the same install-time burst.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: What else has been written to the .claude or .vscode configuration directories recently, and by which processes?
  context: These directories hold developer-tool hook and task configuration that few processes legitimately touch — an editor or CLI tool setting up its own config, or a setup script during onboarding. The persistence branch of this pattern plants files here so its runtime survives reboots and re-runs on tool events or folder opens. Other recent, unfamiliar writers in these directories beyond the alerting file indicate related persistence artifacts to review together.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - '\.claude\'
          - '\.vscode\'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Is a file with this name present on any other hosts in the environment?
  context: The same payload or persistence filename appearing on multiple hosts points to a shared compromised dependency reaching several projects or CI runners, rather than a single targeted drop. Compare which hosts show the file, when it first appeared on each, and whether the writing process matches — a tight cluster in time suggests a shared dependency update landing broadly; scattered appearances over a longer period suggest independent installs of the same compromised package range.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- always_include: true
  question: Has this user previously triggered this rule's file-creation pattern, and does that history fit their role?
  context: The query mirrors the rule's own detection scoped to this user — the result is the user's 90-day history of writing files matching either of this rule's patterns, aggregated by host. A user who has never produced this pattern before is more notable than one with a routine history of package installs and updates producing it; weigh the count against whether the user's role involves regular dependency management.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_malware_files:
        TargetFilename|endswith:
        - \router_init.js
        - \tanstack_runner.js
      selection_persistence_claude_vscode:
        TargetFilename|endswith:
        - \.claude\router_runtime.js
        - \.vscode\router_runtime.js
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has the process that launched this activity historically driven this rule's pattern here or across the environment, or is it new?
  context: When the alert fires under a service or CI-runner identity rather than a human account, user identity does not attribute the behavior — the meaningful pivot is the launch mechanism. The query mirrors the rule's own detection scoped to the alerting program, showing its 90-day history of driving this specific file pattern. A new or rare program for this pattern is the deviation worth chasing; a program that already accounts for many prior events is routine package-manager or build automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_malware_files:
        TargetFilename|endswith:
        - \router_init.js
        - \tanstack_runner.js
      selection_persistence_claude_vscode:
        TargetFilename|endswith:
        - \.claude\router_runtime.js
        - \.vscode\router_runtime.js
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the user's process activity across all hosts in the alert window shows whether the same account is active elsewhere in ways consistent with development or CI work — package manager invocations, editors, build tooling — or in ways that don't fit, such as activity on hosts the user doesn't normally touch. If the alert fired under a service or CI-runner identity, this view fills with automation noise; rely on the parent-process-scoped questions instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window — coordinated automation, or isolated to this host?
  context: Under a service or CI-runner identity, "what else did this user do" returns automation noise across every host running the same agents. The meaningful question is whether the same launch mechanism produced this rule's pattern elsewhere in the same window — multiple hosts indicates a shared pipeline or scheduled rollout pulling in the same dependency; a single host indicates the exposure is local to this build or install.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_malware_files:
        TargetFilename|endswith:
        - \router_init.js
        - \tanstack_runner.js
      selection_persistence_claude_vscode:
        TargetFilename|endswith:
        - \.claude\router_runtime.js
        - \.vscode\router_runtime.js
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
