name: HackTool - SysmonEOP Execution
id: b6f7b88f-4fe0-437b-87c0-f09e33cdc408
description: |
  Detects execution of the SysmonEOP proof-of-concept, which exploits a privilege-escalation
  flaw in older Sysmon builds (CVE-2022-41120 / CVE-2022-44704) to perform arbitrary file
  write and delete as SYSTEM and chain to a full local privilege escalation. The rule fires
  when at least one of two conditions matches: EITHER a process whose Image ends in
  \SysmonEOP.exe runs, OR a process whose import hash matches one of the two known PoC IMPHASHes
  runs (the second branch catches renamed copies of the tool). Legitimate appearance is
  unlikely; investigation should confirm which branch fired, identify how the binary reached
  the host and what spawned it, and determine whether SYSTEM-context follow-on activity or a
  privilege-use event indicates the escalation succeeded.
type: detection
detection_id: 8a7e90c5-fe6e-45dc-889e-057fe4378bd9
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did this process match on the SysmonEOP.exe filename, on a known PoC import hash, or both?
  context: >-
    This rule fires when EITHER the Image ends in \SysmonEOP.exe OR the import hash matches one of
    two known PoC IMPHASHes; at least one branch is enough. Note which branch matched. A filename
    match on \SysmonEOP.exe is the unobfuscated PoC; an IMPHASH-only match means a renamed copy
    whose Image will not read SysmonEOP.exe, so downstream binary-name reasoning must account for
    the rename. If both matched, the operator did not bother renaming. Confirm the Image and Hashes
    fields on the alerting event before investing further.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: Is this user and host expected to run privilege-escalation exploitation tooling?
  context: >-
    SysmonEOP is a local privilege-escalation exploit, not an administrative utility. There is no
    routine operational reason for it to run. If this host is a security-tester workstation or the
    user is on a sanctioned offensive team, the activity may be expected; otherwise treat any
    execution as unexpected and proceed with the exploitation-chain questions.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this SysmonEOP execution part of an authorized penetration test or red team engagement?
  context: >-
    Privilege-escalation proof-of-concept tools are run during authorized security assessments. Before
    investing investigation time, check whether a pentest or red team exercise is currently active on
    this host or network segment. An authorized engagement with matching tooling and timing resolves
    the alert without further analysis; absent one, an unsanctioned local-privilege-escalation attempt
    is in scope for incident handling.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What does this tool do, and is there evidence the privilege escalation it performs succeeded?
  context: >-
    This PoC abuses an older Sysmon RPC handler to win a race between directory creation and ACL
    hardening on the Sysmon archive directory, gaining arbitrary file write/delete as SYSTEM. The
    documented chain then overwrites a printer-driver INF to drop an attacker DLL into the system
    directory and re-installs the driver so a SYSTEM-context component processes it, ending in an
    elevated shell. The binary itself takes no meaningful command-line arguments, so the decisive
    evidence is the outcome: review the alerting event, then look for SYSTEM-owned follow-on
    processes and privilege-use records.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: How many times did this binary run on this host in the window, and did the executions form a single escalation attempt or repeated tries?
  context: >-
    The query scopes to all executions of this Image on this host within a few minutes of the alert,
    not just the triggering event. Race-condition exploits frequently retry until they win, so several
    back-to-back invocations can represent one logical escalation attempt rather than independent
    events. Note the working directory each ran from, since the binary needs write access to its
    drop location. An IMPHASH-only match means the Image is renamed; expect the executable name here
    to differ from SysmonEOP.exe.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this tool and is that parent chain expected?
  context: >-
    The parent process reveals how the exploit was launched and is a primary tuning point, since the
    parent-child relationship varies by delivery vector. A drop-and-run from a browser download
    directory, an archive utility, an interactive shell, or a remote-execution service each tells a
    different story about how the tool reached the host. An unexpected parent such as a script host
    or an Office application points to scripted delivery rather than a hands-on operator double-click.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did a special-privileges-assigned logon (Security event 4672) occur on this host around the time of the alert?
  context: >-
    Successful local privilege escalation produces a logon to which sensitive privileges are
    assigned, recorded in the Security channel as event 4672. A 4672 for an account that is not
    normally privileged, timed near this execution, corroborates that the escalation succeeded and
    that a SYSTEM or administrator-equivalent context was obtained. If Security audit logging for
    special logons is not enabled in this environment, treat zero results as a visibility gap rather
    than evidence the escalation failed.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4672
      condition: selection
    fields:
      - SubjectUserName
      - PrivilegeList
- question: What child processes did this tool spawn afterward?
  context: >-
    The processes spawned after the exploit reveal whether escalation succeeded and what the operator
    did with it. The documented chain ends in an elevated command shell; a cmd.exe or powershell.exe
    child, or any process running as SYSTEM that the tool launched, indicates the operator gained and
    used elevated context. The absence of children does not prove failure, since the elevated shell
    may be spawned by a separate re-installed driver component.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What files did this tool create on the host, and do any touch the Sysmon archive directory or a printer-driver INF?
  context: >-
    This exploit leaves characteristic file-system traces: writes or deletes under the default Sysmon
    archive directory (C:\Sysmon), a directory junction created there to redirect the privileged
    write, an overwritten printer-driver INF, and a dropped DLL in the system directory. File creation
    events from this process pointing at any of those locations confirm the exploitation primitive ran
    even if the original process has exited.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has this binary ever run on this host before?
  context: >-
    A privilege-escalation exploit that has never been seen on a host is more suspicious than one that
    appears regularly. Zero or very low historical counts over the trailing window indicate first-time
    execution, which is the expected profile for a freshly delivered PoC. An IMPHASH-only match means
    the Image name is renamed, so this host-and-Image baseline reflects the renamed copy.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the resulting parent and
    user distribution reflects how the rule's specific firing pattern has run here historically rather
    than generic binary usage. For an exploitation PoC this is expected to be empty; any prior history
    is itself notable. Deviations such as a new parent process or an unexpected account are the anomaly
    worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \SysmonEOP.exe
      selection_hash:
        Hashes|contains:
        - IMPHASH=22F4089EB8ABA31E1BB162C6D9BF72E5
        - IMPHASH=5123FA4C4384D431CD0D893EEB49BBEC
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \SysmonEOP.exe
      selection_hash:
        Hashes|contains:
        - IMPHASH=22F4089EB8ABA31E1BB162C6D9BF72E5
        - IMPHASH=5123FA4C4384D431CD0D893EEB49BBEC
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \SysmonEOP.exe
      selection_hash:
        Hashes|contains:
        - IMPHASH=22F4089EB8ABA31E1BB162C6D9BF72E5
        - IMPHASH=5123FA4C4384D431CD0D893EEB49BBEC
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether the escalation attempt is isolated or
    part of broader hands-on activity. If the same account ran tooling or touched multiple endpoints in
    the same window, the scope of the intrusion may extend past this host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \SysmonEOP.exe
      selection_hash:
        Hashes|contains:
        - IMPHASH=22F4089EB8ABA31E1BB162C6D9BF72E5
        - IMPHASH=5123FA4C4384D431CD0D893EEB49BBEC
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like a deployment or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of the rule's firing pattern rather than generic binary usage. For an exploitation PoC, several
    hosts firing the same pattern points to scripted deployment or a testing rollout; one host or a small
    unrelated set points to manual operator activity. Use the host distribution to calibrate scope.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \SysmonEOP.exe
      selection_hash:
        Hashes|contains:
        - IMPHASH=22F4089EB8ABA31E1BB162C6D9BF72E5
        - IMPHASH=5123FA4C4384D431CD0D893EEB49BBEC
      condition: 1 of selection_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Escalation rarely happens in isolation. Earlier detections on the same host, such as initial-access
    tooling, reconnaissance, or defense tampering, may reveal the stages that preceded this exploit and
    help reconstruct the timeline. The order of alerts often tells the story of how the operator reached
    the point of attempting local privilege escalation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
