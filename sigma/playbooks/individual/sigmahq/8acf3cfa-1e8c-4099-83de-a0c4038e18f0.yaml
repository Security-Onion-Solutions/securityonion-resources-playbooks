name: EvilNum APT Golden Chickens Deployment Via OCX Files
id: 7597f094-95db-46d0-beb1-e8fc1268c28b
description: |
  Detects a command line that contains regsvr32 together with the /s and /i switches, a path fragment under \AppData\Roaming\, and an .ocx extension. regsvr32.exe is a Microsoft-signed binary that registers ActiveX controls: /i calls the control's DllInstall entry point and passes it the string that follows, while /s suppresses the result dialog, so a control staged in a user-writable profile directory executes inside a signed process with no visible output. Legitimate installers register controls from Program Files or a system directory under an installer parent, not from a roaming profile path. Determine what the .ocx is, how it reached the host, whether it actually loaded, what regsvr32 spawned or contacted afterward, and whether any of it matches a known packaging routine.
type: detection
detection_id: 8acf3cfa-1e8c-4099-83de-a0c4038e18f0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: >-
    Does the command line contain regsvr32 with the /s and /i switches, a path under \AppData\Roaming\, and an .ocx file?
  context: >-
    Confirm the alert before investing time by reading the exact command line. All five elements must be present together
    for the rule to fire — the regsvr32 invocation, the silent /s switch, the /i install switch, the \AppData\Roaming\ path
    fragment, and the .ocx extension. Record the full path to the .ocx and any argument that follows /i; both drive the rest
    of the investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: >-
    Is this user and host expected to register ActiveX controls from the user's roaming profile directory?
  context: >-
    Software installers do register ActiveX controls, but they normally do so from Program Files or a system directory,
    under an installer or management-agent parent. A user with no software-packaging, development, or desktop-support role
    has little reason to produce this pattern, and a host that is not a build or packaging machine has little reason to see it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: >-
    Is this regsvr32 execution part of an authorized penetration test or red team engagement?
  context: >-
    Proxy execution through signed Windows binaries such as regsvr32.exe is standard practice in authorized security
    assessments. Check whether a pentest or red team exercise is active on this host or network segment; an engagement whose
    scope and timing match the alerting command resolves it without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: >-
    Which .ocx was registered, and what argument was passed to its DllInstall entry point?
  context: >-
    regsvr32 is multi-purpose, and the switches say which capability was invoked. The /i switch calls the control's DllInstall
    export and hands it the string that follows as a parameter, which commonly carries a URL, a file path, or an
    operator-supplied token; /s suppresses the success and failure dialogs so nothing appears on screen. Record the control's
    full path and the /i argument, then retrieve the file for analysis — those two values determine what the control was asked
    to do and how far the response has to reach.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: >-
    What files did the alerting process write to disk on this host after the registration?
  context: >-
    A control that executes on registration commonly stages further components — additional modules, script files,
    configuration, or a decoy document — usually under the same profile directory it was launched from. File operations
    attributable to the alerting process in the hour that follows show what the control did beyond loading itself, and give
    the file paths to collect even if the process has already exited.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: >-
    What exactly did this regsvr32 command do, and did the same pattern run more than once on this host?
  context: >-
    Decode every element of the command line — the .ocx path, the /i argument, and any shell wrapper or quoting around the
    invocation. The rule matches on command-line content alone, so the alerting process may be regsvr32.exe itself or a shell
    that invoked it; scoping to the pattern rather than to a binary name returns both. Several invocations in the same window
    usually mean the registration failed and was retried, or that more than one control was registered in sequence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
        - regsvr32
        - /s
        - /i
        - \AppData\Roaming\
        - .ocx
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: >-
    What process spawned this regsvr32 invocation, and is that parent chain expected?
  context: >-
    The parent shows how the registration was launched. An installer, a packaging tool, or a management agent is a routine
    parent. A script host, a command shell, a browser, an email client, or a document application points at a delivery chain
    that wrote the .ocx to the profile directory and then registered it. If the immediate parent is a generic shell, walk up
    to its own parent — the shell is the mechanism, not the origin.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: >-
    Did a module from the user's roaming profile directory load on this host around the time of the alert, and is it signed?
  context: >-
    The command line shows an attempted registration; the module-load event shows whether the control was actually mapped
    into a process. An .ocx is a DLL, so it carries a signature and a hash on the load event itself, with no pivot to a later
    execution needed. An unsigned module, or one signed by a party unrelated to whatever software claims that directory, is
    the file to collect and analyse. If module-load telemetry is not ingested in this environment, treat an empty result as a
    visibility gap rather than evidence that nothing loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|contains: '\AppData\Roaming\'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - process_creation
  - manual_review
- question: >-
    Did regsvr32 open any network connections on this host around the time of the alert?
  context: >-
    regsvr32.exe has no routine reason to talk to the network. Egress from it near the registration points at a control that
    fetched a further stage or checked in to a remote endpoint, and the destination is the pivot for the rest of the
    investigation. Treat any external address as a lead: check what else on the host contacted it, and over what port. An
    empty result does not clear the control, since execution and network activity can be separated in time or handed off to a
    child process.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\regsvr32.exe'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
  - external_threat_intel
- question: >-
    What child processes did this invocation spawn afterward?
  context: >-
    Children reveal what the control does once it is loaded. A registration that only registers a control spawns nothing;
    one that executes an embedded payload typically continues into a command shell, a script host, powershell.exe, or
    msiexec.exe, or into a legitimate utility copied nearby to carry the next step. Read the child command lines rather than
    just the binary names — the arguments carry the operation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: >-
    When this host has previously fired this pattern, what parents and users drove it, and does the current alert fit that history?
  context: >-
    The query mirrors the rule's selection scoped to this host, so the parent and user distribution reflects how this specific
    pattern has run here historically rather than generic regsvr32 usage. A host with prior hits under a packaging tool or a
    known installer parent reads very differently from a host with none. A parent that has never driven this pattern here, or
    an account that does not belong to it, is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - regsvr32
        - /s
        - /i
        - \AppData\Roaming\
        - .ocx
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- always_include: true
  question: >-
    Has this user previously produced this pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, aggregated by host, over 90 days. A user who has never
    registered a control from their roaming profile is a different proposition from one who does it regularly as part of a
    packaging or development workflow. Weigh the count against what the user's role actually requires rather than against the
    fleet average.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - regsvr32
        - /s
        - /i
        - \AppData\Roaming\
        - .ocx
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: >-
    Has this parent process historically driven this pattern on this host or across the environment, or is the parent new for this activity?
  context: >-
    When the alert fires under a service principal or a machine account, user identity attributes nothing and the launch
    mechanism becomes the meaningful pivot. The query mirrors the rule's selection scoped to the alerting parent process over
    90 days, aggregated by host. A parent that already accounts for a long history of this pattern is packaging or management
    automation; a parent that is new for it is the deviation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - regsvr32
        - /s
        - /i
        - \AppData\Roaming\
        - .ocx
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: >-
    What else did this user do across the network around this time?
  context: >-
    The user's activity on every host in the surrounding hour shows whether the registration stands alone or is one step in a
    sequence that touched several endpoints. Look for the same profile path or the same control name surfacing on another
    host. When the alert fires under a service or machine account this returns routine agent telemetry rather than a person's
    actions — read the parent-scoped fleet question instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: >-
    Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal a user-scoped sweep returns agent telemetry rather than attacker activity, so the meaningful
    question is whether the same launch mechanism fired elsewhere. The query mirrors the rule's selection scoped to the
    alerting parent process, fleet-wide, within the alert window. Several hosts in the same hour points at pushed or scheduled
    automation; a single host points at a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - regsvr32
        - /s
        - /i
        - \AppData\Roaming\
        - .ocx
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: >-
    What other activity occurred on this host around the time of the alert?
  context: >-
    The registration rarely stands alone. Aggregating processes by binary and parent across the surrounding half hour
    collapses routine telemetry into a few high-count rows and leaves novel parent-child pairs standing out at low counts —
    that is where the delivery step, a discovery command, or a persistence write will surface.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: >-
    Have other hosts fired this pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this specific pattern
    rather than the generic footprint of regsvr32. Many hosts firing it points at a deployment routine or vendor packaging
    that needs an allowlist decision; one host, or a small set with nothing in common, points at operator activity. Use the
    host distribution and the consistency of the parent to calibrate the response.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - regsvr32
        - /s
        - /i
        - \AppData\Roaming\
        - .ocx
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: >-
    Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host often show the steps that preceded the registration — an archive or document opened,
    a script host writing to the profile directory, a download utility fetching the control. Read them in timestamp order to
    reconstruct how the .ocx reached the host and whether anything else on the way was missed.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
