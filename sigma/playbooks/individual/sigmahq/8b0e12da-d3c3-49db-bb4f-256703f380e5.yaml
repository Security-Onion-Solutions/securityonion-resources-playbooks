name: PUA - Chisel Tunneling Tool Execution
id: d9e042bb-2922-4daa-956c-0188f12dc30a
description: |
  Detects execution of Chisel, a single-binary Go-based TCP/UDP tunnel that relays traffic over HTTP/WebSocket and secures it with SSH. The rule fires when EITHER the process image ends in chisel.exe, OR the command line carries the client/server subcommand strings together with one of Chisel's tunneling flags (-socks5, -reverse, reverse-forward "r:" prefixes, the loopback ":127.0.0.1:" relay form, -tls-skip-verify, or :socks) — either branch is sufficient. Chisel is a dual-use tool: it has legitimate uses for traversing firewalls during development and remote administration, but in intrusions it is used to build SOCKS proxies and reverse port forwards that bridge an internal host to operator infrastructure for command-and-control and lateral pivoting. Investigation should confirm the command line matches the tunneling pattern, identify the tunnel direction and endpoints, and determine whether the tool and its destination are authorized for this host.
type: detection
detection_id: 8b0e12da-d3c3-49db-bb4f-256703f380e5
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does this process match the Chisel tunneling pattern via its image name, or a client/server subcommand together with a tunneling flag?
  context: The rule fires when EITHER the image ends in chisel.exe, OR the command line contains 'exe client '/'exe server ' together with a tunneling flag (-socks5, -reverse, ' r:', ':127.0.0.1:', '-tls-skip-verify ', or :socks). Confirm which branch matched and read the full command line — a rename can hide the image branch while the flags still fire, and a flag-only match is meaningful because operators frequently rename the binary. Note which branch fired; the image-name branch alone implies an unmodified binary, while a flag-only match on a renamed image points to deliberate evasion and makes the command-line decode load-bearing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to run a network tunneling or proxy tool?
  context: Tunneling tools that build SOCKS proxies or reverse port forwards are rare on most endpoints. A developer host or a jump box used for firewall traversal may legitimately run one; a standard workstation or server with no remote-administration role generally should not. Matching the user role and host function against the detected behavior is often the fastest path to separating sanctioned use from operator activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What tunnel did this Chisel invocation build? Decode the subcommand, mode, endpoints, and TLS flags from the command line.
  context: The full command line reveals the tunnel's pattern. Determine whether it ran as client or server; whether it enables a SOCKS5 proxy (-socks5 / the socks remote token) or reverse forwarding (-reverse / 'r:' / 'R:' prefixes); the server address and port; and whether certificate validation was skipped (-tls-skip-verify). The ':127.0.0.1:' form and the socks token bridge to a loopback service, exposing it through the tunnel. A reverse forward means the server side listens and the client proxies an internal service outward — the pattern most often seen in intrusions.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is this tunneling tool authorized for use on this host, and what business purpose does it serve?
  context: Organizations typically sanction a specific, small set of remote-access and tunneling tools for IT and development use. A tunnel that bridges an internal host to an external relay -- even from a widely available open-source tool -- may represent shadow IT or operator-deployed access if it is not on the approved list. Unauthorized tunneling tools should be reviewed regardless of the tool's reputation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there an approved development, testing, or administrative use case explaining this tunnel?
  context: Legitimate tunnel usage usually correlates with a documented purpose -- a developer traversing a firewall, an approved remote-administration procedure, or a scheduled maintenance window. If no such context exists for this session, the tunnel may have been established by an operator for persistent access or by a user circumventing network controls.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What external endpoint and port does this tunneling tool connect to?
  context: Chisel establishes an outbound connection to a relay server, which the analyst should compare against expected infrastructure. The destination reveals whether the tunnel terminates at a known business endpoint or at an arbitrary external address. Non-standard or high ports and a destination with no business relationship raise the concern that internal services are being exposed outward.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: What is the tunnel's destination, and what do DNS, WHOIS, and threat intel reveal about it?
  context: Investigate the relay endpoint the tunnel connects to -- DNS resolution history, registration age, hosting provider, TLS certificate details, and known threat-intel hits. A recently registered domain, a bare IP on a low-cost hosting provider, or a self-signed certificate paired with -tls-skip-verify points to operator-controlled infrastructure rather than a sanctioned service.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationHostname
      - DestinationPort
- question: Around the tunnel's start, did this host make internal peer-to-peer connections or connections on common proxy ports?
  context: Internal-proxy use bridges traffic to other internal hosts that this endpoint does not normally talk to, or onto well-known proxy ports such as 1080, 8080, and 4444. Chisel's default internal SOCKS5 bind is 127.0.0.1:1080 and reverse-SOCKS listens on 1080. Workstation-to-workstation or workstation-to-server connections that are rare in this environment, correlated in time with the tunnel process starting, indicate the tunnel is actively relaying internal traffic.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 1080
          - 8080
          - 4444
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
- question: What process spawned Chisel, and is that parent chain expected?
  context: The parent process reveals how the tunnel was launched. A user shell or a deployment/automation tool may explain sanctioned use; a parent such as a script host, an Office application, a web-server worker, or a remote-execution service (wmiprvse.exe, services.exe spawning from a temp path) points to hands-on-keyboard or remote deployment. Walk up the chain to see what launched the parent and what else it spawned.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did Chisel spawn afterward?
  context: A pure tunneling tool normally spawns few or no children. Processes spawned in the wake of the tunnel -- command shells, script hosts, reconnaissance binaries, or credential-access tooling -- reveal what the relayed access was used for and often mark the transition from establishing the channel to acting through it.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host has previously fired the Chisel pattern, what parents and users drove it, and does the current alert fit?
  context: Even a sanctioned tunneling tool tends to run from a consistent parent and account. The query mirrors the rule's selection structure scoped to this host, so the resulting parent/user distribution reflects how the rule's specific firing pattern -- not generic binary usage -- has historically run here. A new parent process, an unexpected user account, or an unusual command-line structure relative to that history is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \chisel.exe
      selection_param1:
        CommandLine|contains:
        - 'exe client '
        - 'exe server '
      selection_param2:
        CommandLine|contains:
        - -socks5
        - -reverse
        - ' r:'
        - ':127.0.0.1:'
        - '-tls-skip-verify '
        - :socks
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_img or all of selection_param*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \chisel.exe
      selection_param1:
        CommandLine|contains:
        - 'exe client '
        - 'exe server '
      selection_param2:
        CommandLine|contains:
        - -socks5
        - -reverse
        - ' r:'
        - ':127.0.0.1:'
        - '-tls-skip-verify '
        - :socks
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_img or all of selection_param*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \chisel.exe
      selection_param1:
        CommandLine|contains:
        - 'exe client '
        - 'exe server '
      selection_param2:
        CommandLine|contains:
        - -socks5
        - -reverse
        - ' r:'
        - ':127.0.0.1:'
        - '-tls-skip-verify '
        - :socks
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_img or all of selection_param*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in the surrounding window reveals lateral movement or activity spanning multiple endpoints. If the same user triggered tunneling or other operator activity on several hosts, the scope of the activity is larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \chisel.exe
      selection_param1:
        CommandLine|contains:
        - 'exe client '
        - 'exe server '
      selection_param2:
        CommandLine|contains:
        - -socks5
        - -reverse
        - ' r:'
        - ':127.0.0.1:'
        - '-tls-skip-verify '
        - :socks
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_img or all of selection_param*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Tunnel setup rarely occurs in isolation. Examining activity in the window around the alert reveals what led to the tunnel and what followed -- reconnaissance, credential access, privilege escalation, or staging -- and whether the tunnel is one stage of a larger sequence. Novel parent-child pairs at low counts are what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts fired the Chisel pattern in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the rule's firing pattern rather than generic usage of the binary. Many hosts firing the same pattern points to scripted deployment or sanctioned automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \chisel.exe
      selection_param1:
        CommandLine|contains:
        - 'exe client '
        - 'exe server '
      selection_param2:
        CommandLine|contains:
        - -socks5
        - -reverse
        - ' r:'
        - ':127.0.0.1:'
        - '-tls-skip-verify '
        - :socks
      condition: selection_img or all of selection_param*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- defense tampering, reconnaissance, credential access, or initial-access exploitation -- may reveal the stages that preceded the tunnel and help reconstruct the timeline. A tunnel established after credential access or after a public-facing exploit fires changes the disposition toward a hands-on intrusion.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
