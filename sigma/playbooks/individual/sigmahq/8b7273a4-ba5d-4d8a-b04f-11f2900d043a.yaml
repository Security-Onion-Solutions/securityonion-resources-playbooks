name: Windows Hypervisor Enforced Code Integrity Disabled
id: aa62fb43-52a9-4f88-931d-e07ebe83da95
description: |
  Detects a registry write that turns off Hypervisor-Enforced Code Integrity (HVCI, also called
  Memory Integrity) — a TargetObject ending in \Control\DeviceGuard\HypervisorEnforcedCodeIntegrity,
  \Control\DeviceGuard\Scenarios\HypervisorEnforcedCodeIntegrity\Enabled, or
  \Microsoft\Windows\DeviceGuard\HypervisorEnforcedCodeIntegrity written with Details of DWORD
  (0x00000000). HVCI uses virtualization-based security to keep unsigned or improperly-signed code
  from executing in the kernel; setting these values to 0 removes that guarantee (the change
  generally takes effect after the next reboot). Legitimate changes come from policy management or
  an administrator opting a host out because a driver or application is incompatible; malicious use
  clears the way to load a vulnerable or unsigned kernel driver, the precursor step in a
  bring-your-own-vulnerable-driver operation. Investigate which value was written, the process and
  command that wrote it, whether HVCI is now enforcing, and whether any kernel drivers loaded on the
  host afterward.
type: detection
detection_id: 8b7273a4-ba5d-4d8a-b04f-11f2900d043a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the alerting registry write set an HVCI value to DWORD 0?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a
    registry value whose path ends in \Control\DeviceGuard\HypervisorEnforcedCodeIntegrity,
    \Control\DeviceGuard\Scenarios\HypervisorEnforcedCodeIntegrity\Enabled, or
    \Microsoft\Windows\DeviceGuard\HypervisorEnforcedCodeIntegrity is written with Details of DWORD
    (0x00000000). Review the exact TargetObject and Details on the triggering event to verify the
    value data is 0 and note which of the three paths was written, since the two DeviceGuard-policy
    paths express the configured setting while the Scenarios\...\Enabled path reflects the running
    scenario state.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify HVCI or Device Guard policy values?
  context: >-
    Legitimate opt-out of HVCI happens through policy management or a deliberate administrator action
    — often to work around a driver or application that is incompatible with Memory Integrity — and
    usually on a defined set of hosts by a small set of accounts. Knowing whether the writing account
    and host function match that expectation is often the fastest way to separate a sanctioned
    configuration change from tampering. User attribution is present on roughly 94% of endpoint
    registry events; when it is a machine account or missing, pivot on the writing process instead.
    The expected administrative tooling and the accounts that run it form the baseline that separates
    routine changes from tampering.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which specific HVCI value was written, and what does that path control?
  context: >-
    The specific path determines what changed. Values under \Control\DeviceGuard and
    \Microsoft\Windows\DeviceGuard named HypervisorEnforcedCodeIntegrity carry the configured HVCI
    policy, while \Control\DeviceGuard\Scenarios\HypervisorEnforcedCodeIntegrity\Enabled reflects the
    running scenario state that virtualization-based security reads at boot. A DWORD 0 in any of them
    turns off enforcement of kernel code signing, which is what permits unsigned or vulnerable
    drivers to load. The value data and writing process together identify what setting changed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value data was written to this key, and does it disable the protection?
  context: >-
    Read the Details field on the triggering write. A DWORD of 0x00000000 in these policy values
    means HVCI is being turned off rather than configured or required; a non-zero value would enable
    or enforce it. Details is present on roughly 79% of registry modifications and is absent only for
    binary or empty value data, so for this DWORD policy value it should be populated. Confirm the
    value is 0 and note which of the three paths received it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: After this write, was the same HVCI value re-set, reverted, or re-enabled on this host?
  context: >-
    Registry key or value deletions are not observable in this telemetry, so durability is judged
    from the value's re-modification history rather than from a delete event. Look at later writes to
    the same path over the following window: a single 0 write that is never restored leaves HVCI off,
    while a later non-zero write would indicate the setting was re-enabled by remediation, a policy
    refresh, or an administrator. Repeated flipping of the value can indicate a policy fighting a
    manual change.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What command performed this registry write, and how was the value set?
  context: >-
    The registry event carries no command line, so pivot to the writing process by its ProcessGuid to
    read the full command that made the change. This distinguishes a reg.exe or PowerShell one-liner
    that sets the HypervisorEnforcedCodeIntegrity value to 0 from a policy-driven write, and reveals
    whether the same invocation touched more than one Device Guard or code-integrity value. Decode the
    arguments to identify exactly which path and data were written.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process wrote this value, and is its parent chain expected?
  context: >-
    The writing process and its parent reveal how the change was invoked. Policy-driven changes and
    administrator actions have predictable lineage (management agents, services.exe, an interactive
    console launched from explorer.exe). A reg.exe or powershell.exe write whose parent is an Office
    application, a script host such as wscript.exe or mshta.exe, or an unsigned binary points to
    scripted tampering rather than sanctioned configuration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
- question: Is HVCI currently enforcing on this host, or has it been disabled?
  context: >-
    The tampering may be a transient step or a lasting configuration. HVCI policy changes generally
    take effect only after a reboot, so the current running state may differ from the value in the
    registry, and whether the host has rebooted since the write is decisive. Confirm whether Memory
    Integrity is presently enforcing through direct inspection or endpoint tooling; if it is off, the
    kernel will accept unsigned or vulnerable drivers and the control should be restored before deeper
    investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which kernel-mode drivers loaded on this host after the write, and were any unsigned or newly seen?
  context: >-
    Disabling HVCI has one direct consequence — the kernel will load code that signing enforcement
    would otherwise reject. A driver that loads after the change with an invalid, absent, or
    unexpected signature, or one never seen on the host before, is the payload the tampering was meant
    to enable and is the pattern behind bring-your-own-vulnerable-driver activity. Review the driver
    load events on the host in the window after the write and judge each by its signature status and
    prior presence; a load that succeeds also implies HVCI was already off or the host rebooted, since
    the policy change applies at boot.
  range: +24h
  query: |
    aggregation: true
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - ImageLoaded
      - Signature
      - SignatureStatus
- question: What activity occurred on this host after HVCI was disabled?
  context: >-
    Disabling kernel code-integrity is usually a means to an end — loading a driver, running unsigned
    tooling, or performing other actions the control would otherwise block. Examining process activity
    in the window after the write reveals what the tampering enabled. Novel process execution, driver
    installation tooling, or credential-access activity appearing shortly after the change ties the
    registry edit to a larger operation. The correlation window links the registry edit to the
    activity that followed.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense-tampering actions performed on this host?
  context: >-
    An actor who disables HVCI often weakens several controls in the same operation — stopping or
    reconfiguring services, clearing event logs, deleting shadow copies, or turning off other
    protections. Finding additional tampering from the same user or writing process indicates
    multiple controls were targeted together rather than an isolated policy change. Named security
    service changes in this window are worth correlating with the HVCI write.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: What other registry modifications were made on this host in the same window?
  context: >-
    Actors who change one security policy value often change several — disabling HVCI alongside test
    signing, driver-block-list, Defender policy, or persistence keys. Clustering the registry writes
    on this host within a short window around the alert reveals the full scope of configuration
    changes and whether multiple objectives were pursued together. The triggering key appears in the
    results; the signal is what else was modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has this HVCI value been modified before on this host?
  context: >-
    Code-integrity policy values such as HypervisorEnforcedCodeIntegrity should change rarely and only
    through deliberate action. A history that shows no prior writes makes this a first-time change and
    raises its weight; a history of periodic writes to the same value points to a management process
    that routinely sets it. Compare the historical Details values to see whether the same 0 value was
    set before or whether this is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same value modified on other hosts in the environment?
  context: >-
    The same write across many hosts suggests a centrally managed policy or an opt-out rolled out by
    administration; the same write confined to one host suggests a targeted change. Compare the
    Details values across hosts to see whether they all set 0 or whether values differ, and whether
    the writing process is consistent with a management deployment or with ad-hoc tampering.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A registry tamper rarely happens in isolation. Aggregating process activity in a tight window
    around the alert surfaces what led up to the change and what ran immediately after. Novel
    parent-child pairs stand out at low counts against high-count routine telemetry, which is what
    points to reconnaissance, driver staging, or credential access around the configuration change.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — reconnaissance, execution of scripting tools, or other
    defense tampering — may reveal the stages that preceded this change and help reconstruct the
    timeline. Defense tampering followed by driver loading or credential access is a common
    progression, and prior alerts help place this registry edit within it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were process-based persistence mechanisms installed on this host in the same window?
  context: >-
    An actor who disables kernel code-integrity to load a driver frequently installs the driver as a
    service and establishes persistence in the same operation. Scheduled tasks, services, registry Run
    keys, BITS jobs, and WMI subscriptions created by schtasks.exe, sc.exe, reg.exe, bitsadmin.exe, or
    wmic.exe near the tampering indicate the change was part of a footholding effort rather than an
    isolated configuration edit. A driver installed with sc.exe is a common way the loaded kernel
    module survives reboot.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
