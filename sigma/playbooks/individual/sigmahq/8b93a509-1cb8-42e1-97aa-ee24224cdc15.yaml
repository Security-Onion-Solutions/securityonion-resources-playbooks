name: Sensitive File Dump Via Wbadmin.EXE
id: dd550b23-eabf-4547-a53b-6a05a015b95f
description: |
  Detects wbadmin.exe (the Windows Server Backup command-line utility) being run with a start/backup command line that
  names a sensitive credential-bearing file, specifically a registry hive under \config\ (SAM, SECURITY, or SYSTEM) or the
  Active Directory database at \Windows\NTDS\NTDS.dit. The rule fires when all three conditions hold at once, namely that
  the image is wbadmin.exe (or its original filename is WBADMIN.EXE), the command line contains both start and backup, and
  the command
  line references one of those sensitive paths. wbadmin is a legitimate administrative tool, so authorized backup jobs can
  match; however, backing up SAM/SYSTEM/SECURITY hives or NTDS.dit into a backup image is a documented offline credential
  dumping primitive, because the resulting image can be carried off-host and parsed to extract local or domain account
  hashes. Investigation should confirm exactly which sensitive store was targeted, where the backup was written, whether the
  user and host legitimately run backups of those files, and whether credential-theft follow-on or lateral movement appears
  afterward.
type: detection
detection_id: 8b93a509-1cb8-42e1-97aa-ee24224cdc15
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line run wbadmin start backup against a sensitive hive or NTDS.dit as this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and
    process details. The rule fires only when all three conditions hold together, namely that the image is wbadmin.exe (or
    its original filename is WBADMIN.EXE), the command line contains both start and backup, and the command line references
    a sensitive path (\config\SAM, \config\SECURITY, \config\SYSTEM, or \Windows\NTDS\NTDS.dit). Confirm which sensitive
    file was named and read the full command line before continuing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to back up registry hives or the Active Directory database?
  context: Legitimate wbadmin backups of SAM/SYSTEM/SECURITY hives or NTDS.dit are normally performed by backup operators or
    scheduled backup automation on domain controllers and a small set of managed servers. The same command run from a
    workstation, by a standard user, or by an account with no backup role is a stronger indicator of credential dumping than
    the same command on a known backup host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which credential store was targeted, and where was the backup written?
  context: The sensitive path in the command line identifies the store at risk. SAM (with SYSTEM) yields local account
    hashes; SECURITY holds LSA secrets and cached domain credentials; NTDS.dit (with the SYSTEM hive) yields every domain
    account hash including krbtgt. Read the command line to confirm which files were named and to recover the
    -backupTarget destination. A UNC share or removable/alternate volume as the target means the credential-bearing image
    can be carried off-host for offline extraction, which raises the severity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What backup target and item set did this wbadmin invocation use, and do they point off-host?
  context: wbadmin start backup takes a -backupTarget destination (drive letter, \\?\Volume{GUID} path, or UNC share) and
    -include/-systemState selectors. A -systemState or -allCritical capture on a domain controller pulls NTDS.dit and the
    registry into a single image even without an explicit NTDS path. A UNC or removable backupTarget stages the image where
    it can be retrieved off the host. Recover both the target and the included items to judge whether this is a routine
    backup to an approved repository or a dump staged for exfiltration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned wbadmin, and is that parent chain expected for a backup operation?
  context: The parent process reveals how the backup was invoked. Scheduled or operator-driven backups typically descend
    from the task scheduler, a service host, or an interactive administrative shell. An unusual parent such as a script host,
    an Office application, a remote-execution service, or a recently dropped binary points to hands-on-keyboard credential
    dumping rather than routine maintenance.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did wbadmin spawn afterward on this host?
  context: A backup that is part of a credential-dumping operation is often followed by tooling that retrieves and parses
    the resulting image. Processes spawned by wbadmin, or close-in-time execution of archive utilities, copy commands, or
    hash-extraction tools, indicate the backup was a means to harvest credentials rather than an end in itself.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host has previously fired this backup-of-sensitive-files pattern, what parents and users drove it, and
    does the current alert fit?
  context: Even on a legitimate backup server, the specific pattern of backing up a hive or NTDS.dit has a normal driver.
    The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution
    reflects how this exact firing pattern has historically run here. A new parent process, an unexpected account, or a
    first-time appearance of this pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wbadmin.exe
      - OriginalFileName: WBADMIN.EXE
      selection_backup:
        CommandLine|contains:
        - start
        - backup
      selection_path:
        CommandLine|contains:
        - \config\SAM
        - \config\SECURITY
        - \config\SYSTEM
        - \Windows\NTDS\NTDS.dit
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Does this host normally run wbadmin at all?
  context: A backup utility that has never been seen on a host, or runs only rarely, is more suspicious than one that runs
    on a regular schedule. Zero or very low historical counts on this host indicate first-time or unusual use of wbadmin,
    independent of whether the sensitive-file pattern matched.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wbadmin.exe
      - OriginalFileName: WBADMIN.EXE
      selection_backup:
        CommandLine|contains:
        - start
        - backup
      selection_path:
        CommandLine|contains:
        - \config\SAM
        - \config\SECURITY
        - \config\SYSTEM
        - \Windows\NTDS\NTDS.dit
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wbadmin.exe
      - OriginalFileName: WBADMIN.EXE
      selection_backup:
        CommandLine|contains:
        - start
        - backup
      selection_path:
        CommandLine|contains:
        - \config\SAM
        - \config\SECURITY
        - \config\SYSTEM
        - \Windows\NTDS\NTDS.dit
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints.
    If the same account triggered backups or other administrative activity on several hosts in the same window, the scope of
    a possible credential-dumping operation may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wbadmin.exe
      - OriginalFileName: WBADMIN.EXE
      selection_backup:
        CommandLine|contains:
        - start
        - backup
      selection_path:
        CommandLine|contains:
        - \config\SAM
        - \config\SECURITY
        - \config\SYSTEM
        - \Windows\NTDS\NTDS.dit
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Which accounts may be exposed by this backup, and do any have elevated privileges?
  context: The severity depends on what the captured store contains. A SAM/SYSTEM capture exposes local accounts on the
    host; a SECURITY hive exposes LSA secrets and cached domain credentials; an NTDS.dit capture exposes every domain
    account including Domain Admins, Enterprise Admins, and krbtgt, which enables Golden Ticket forgery and warrants
    incident escalation. Cross-reference the affected scope against directory group memberships to decide remediation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Have other hosts fired this backup-of-sensitive-files pattern in the past week, and does the cross-host
    distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this
    exact firing pattern rather than generic wbadmin usage. Many hosts firing the same pattern points to a backup policy or
    automation that legitimately captures these files; one host or a small unrelated set points to manual operator activity
    worth closer review. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wbadmin.exe
      - OriginalFileName: WBADMIN.EXE
      selection_backup:
        CommandLine|contains:
        - start
        - backup
      selection_path:
        CommandLine|contains:
        - \config\SAM
        - \config\SECURITY
        - \config\SYSTEM
        - \Windows\NTDS\NTDS.dit
      condition: all of selection_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Credential dumping rarely happens in isolation. Earlier detections on the same host, such as reconnaissance,
    privilege escalation, defense tampering, or shadow-copy manipulation, may reveal the stages that preceded this backup
    and help reconstruct how the operator obtained the access needed to back up these files.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
