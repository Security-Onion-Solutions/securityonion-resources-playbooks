name: Potential Ransomware Activity Using LegalNotice Message
id: ead77fc7-b950-4652-adcf-258af1541a06
description: |
  Detects a registry write to the pre-logon legal-notice policy values — a TargetObject ending in
  \Policies\System\LegalNoticeCaption or \Policies\System\LegalNoticeText — where the message Details
  contain ransom-note keywords (encrypted, Unlock-Password, paying). LegalNoticeCaption and
  LegalNoticeText render a title and body on the Windows sign-in screen before any user can log on;
  a corporate logon banner pushed by policy is the legitimate use, while ransomware sets these values
  to display a ransom note across the host. Because this appears at the impact stage, investigate the
  message text itself, the process and command that wrote it, whether the same values were pushed
  fleet-wide or to a single host, and the recovery-inhibiting and encryption activity that typically
  accompanies a ransom-note display.
type: detection
detection_id: 8b9606c9-28be-4a38-b146-0e313cc232c1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the alerting registry write set a LegalNotice value to a message containing ransom keywords?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a
    registry value whose path ends in \Policies\System\LegalNoticeCaption or
    \Policies\System\LegalNoticeText is written AND its Details contain one of the keywords encrypted,
    Unlock-Password, or paying. Both conditions must hold, so review the exact TargetObject and Details
    on the triggering event to confirm the write targets a LegalNotice policy value and that the
    message text carries ransom-note language rather than a benign corporate banner.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to set the pre-logon legal-notice text?
  context: >-
    A legitimate legal-notice banner is normally deployed by policy to a defined set of hosts and set
    by a small set of accounts or management processes. Knowing whether the writing account and host
    function match that expectation is often the fastest way to separate a sanctioned banner rollout
    from tampering. User attribution is present on roughly 94% of endpoint registry events; when it is
    a machine account or missing, pivot on the writing process instead. System or domain accounts
    performing this write outside a known banner deployment are the anomaly to weigh.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What message text was written to the LegalNotice value?
  context: >-
    The Details field carries the message that will render at the sign-in screen, and it is the
    highest-value artifact here. Read it in full: ransom notes typically claim files are encrypted,
    reference a payment or unlock process, and provide a contact address or identifier. Details is
    present on roughly 79% of registry modifications and is absent only for binary or empty value
    data, so a text LegalNotice value will be populated. Capture the full note text for scoping and
    for comparison against the same value on other hosts.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Which LegalNotice value was modified, and what does that policy control?
  context: >-
    The two values under HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System serve distinct
    roles: LegalNoticeCaption sets the title and LegalNoticeText the body of a message shown at the
    pre-logon screen before any user authenticates. The legitimate use is a corporate logon banner
    pushed by policy; setting either value to ransom-note language turns the sign-in screen into a
    ransom display. The value name and data written together identify what will render and to whom.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What process wrote this LegalNotice value, and is its parent chain expected?
  context: >-
    The registry event carries no command line, so pivot to the writing process by its ProcessGuid to
    read the command that made the change and its parent lineage. A policy-driven banner has
    predictable lineage (management agents, services.exe, svchost.exe hosting the policy engine). A
    reg.exe or powershell.exe write whose parent is a script host such as wscript.exe or mshta.exe, an
    Office application, or an unsigned binary points to scripted tampering rather than a sanctioned
    banner deployment.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: After this write, was the LegalNotice value changed again, reverted, or left in place?
  context: >-
    Registry key or value deletions are not observable in this telemetry, so durability is judged from
    the value's re-modification history rather than from a delete event. Look at later writes to the
    same value over the following window: a single write that is never restored leaves the ransom
    banner in place at the sign-in screen, while a later write restoring the original banner or an
    empty value indicates remediation or a policy refresh overwrote it. Repeated changes can indicate a
    policy fighting a manual edit.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor who sets a ransom banner often changes several policy values in the same operation —
    disabling recovery-related settings, weakening security tooling, or adding persistence keys.
    Clustering the registry writes on this host within a short window around the alert reveals the full
    scope of configuration changes and whether multiple objectives were pursued together. The
    triggering key appears in the results; the signal is what else was modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What recovery-inhibiting commands were executed on this host?
  context: >-
    Setting a ransom banner is typically paired with destroying the victim's ability to recover:
    deleting shadow copies (vssadmin, wmic), disabling boot recovery (bcdedit), deleting backups
    (wbadmin), and turning off the Windows Recovery Environment (reagentc). This query surfaces the
    recovery-inhibiting commands on the host, revealing how far recovery destruction has progressed.
    Verify whether each action succeeded by checking system state directly (shadow-copy listing,
    boot-configuration enumeration, recovery-environment status).
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\reagentc.exe'
          - '\diskshadow.exe'
      selection_cmdline:
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'recoveryenabled'
          - 'bootstatuspolicy'
          - 'delete catalog'
          - 'delete systemstatebackup'
          - 'boot.ini'
          - 'winre.wim'
          - '/disable'
      condition: selection and (selection_recovery or selection_cmdline)
    fields:
      - Image
      - CommandLine
- question: What other destructive or recovery-inhibiting actions occurred on this host?
  context: >-
    Ransomware operations chain several destructive actions together: deleting shadow copies, stopping
    security services, changing permissions on files, and clearing event logs. Finding the complete set
    of destructive commands reveals the operational playbook and confirms ransomware activity rather
    than an isolated administrative change. A common parent across the commands (often cmd.exe or
    powershell.exe running a script) points to automated, scripted execution.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_destructive:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\cipher.exe'
          - '\fsutil.exe'
          - '\icacls.exe'
          - '\takeown.exe'
          - '\attrib.exe'
          - '\sc.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\powershell.exe'
          - '\taskkill.exe'
      condition: selection and selection_destructive
    fields:
      - Image
      - User
- question: Are there signs of file encryption or ransomware binary execution on this host?
  context: >-
    Recovery-inhibiting actions typically precede file encryption by minutes. Filtering out known
    system processes surfaces unknown or suspicious executables running from temp or user-writable
    paths, high file-I/O processes, and interpreters launching unfamiliar binaries — the profile of an
    encryption stage. This determines whether encryption has already begun and how far it has
    progressed. Ransom-note file creation is checked separately in the file-activity question.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_known:
        Image|startswith:
          - 'C:\Program Files'
          - 'C:\Windows\System32\svchost'
          - 'C:\Windows\System32\wbem'
      condition: selection and not filter_known
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: Were ransom-note files created on this host after the LegalNotice change?
  context: >-
    The registry banner is one of two defacement artifacts a ransom-note operation leaves; the other is
    ransom-note files dropped across the file system alongside encryption. This query looks at file
    creation on the host for filenames that match common ransom-note naming, which corroborates whether
    the LegalNotice change is part of an active encryption operation. A high volume of file writes to
    the same directories in the same window also points to mass file rewriting.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_ransom_notes:
        TargetFilename|contains:
          - '\README'
          - 'HOW_TO'
          - 'DECRYPT'
          - 'RECOVER'
          - 'RESTORE_FILES'
          - '_readme'
          - 'ransom'
      condition: selection and selection_ransom_notes
    fields:
      - TargetFilename
      - Image
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A ransom-banner write rarely happens in isolation. Aggregating process activity in a tight window
    around the alert surfaces what led up to the change and what ran immediately after. Novel
    parent-child pairs stand out at low counts against high-count routine telemetry, which is what
    points to the staging, recovery destruction, or encryption tooling around the configuration change.
    Off-hours timing of the surrounding activity is itself a useful signal.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Has this LegalNotice value been modified before on this host?
  context: >-
    Legal-notice policy values change rarely and only through deliberate action, so history calibrates
    weight. No prior writes make this a first-time change and raise its significance; a history of
    periodic writes points to a management process that routinely sets a corporate banner. Compare the
    historical Details values to see whether a benign banner was set before or whether the ransom-note
    text is new to this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same LegalNotice value modified on other hosts in the environment?
  context: >-
    The same write across many hosts suggests either a centrally managed banner policy or a fleet-wide
    ransomware push; the same write confined to one host suggests a targeted change. Compare the Details
    values across hosts: identical ransom-note text on many hosts indicates broad compromise, while a
    consistent benign banner set by the same management process indicates policy. The count of affected
    hosts and the writing process together set the scope for response.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Is this same alert firing on other hosts in the environment?
  context: >-
    Ransomware operations often push the same ransom-note change across many hosts simultaneously or in
    rapid succession. Searching for this same detection firing on other hosts determines whether the
    activity is isolated to one host or spans a segment, which sets the scope for containment. The
    timeline of first-to-last detection reveals the spread pattern.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
- question: What other activity has this user performed across the network?
  context: >-
    Tracking the writing account's activity beyond the alerting host reveals whether the ransom-
    banner change is isolated or part of a wider operation. Similar registry changes,
    destructive commands, or logons on other hosts attributed to the same account indicate
    multi-host activity. This view is most useful when the account is a named user; for machine
    or service accounts the results collapse into routine noise and the process-based and rule-
    based cross-host questions carry more weight. If the alert fired under SYSTEM, LOCAL
    SERVICE, NETWORK SERVICE, or a machine account (name ending in $), this query intentionally
    returns nothing — every host runs those principals constantly, so a fleet-wide pivot on them
    is noise, not an actor trail; use the program- and host-scoped questions instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      filter_svcprin_builtin:
        User:
        - SYSTEM
        - LOCAL SERVICE
        - NETWORK SERVICE
      filter_svcprin_machine:
        User|endswith: $
      condition: (selection) and not 1 of filter_svcprin_*
    fields:
    - host.name
    - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — reconnaissance, execution of scripting tools, defense
    tampering, or credential access — may reveal the stages that preceded this change and help
    reconstruct the timeline. A ransom-note display at the sign-in screen is an impact-stage action;
    prior alerts help place it within the operation that led up to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
