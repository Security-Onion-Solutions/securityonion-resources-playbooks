name: LSA PPL Protection Setting Modification via CommandLine
id: ab8d1c73-cc93-40e6-9126-6d2b0bf86407
description: |
  Detects reg.exe or PowerShell modifying the LSA protection (PPL) settings under
  HKLM\SYSTEM\CurrentControlSet\Control\Lsa — specifically the RunAsPPL, RunAsPPLBoot,
  or IsPplAutoEnabled values. The rule fires when the Image is reg.exe / powershell.exe /
  pwsh.exe AND the command line references ControlSet and \Control\Lsa with a write verb
  (reg add, Set-ItemProperty, or New-ItemProperty) AND names one of the PPL value keys.
  LSA Protection runs lsass.exe as a protected process so that non-protected processes cannot
  read its memory; turning it off removes the barrier that blocks credential-dumping tools from
  reading LSASS. Legitimately, this setting is sometimes toggled during imaging, compatibility
  troubleshooting, or driver work, so the investigation must establish whether the change was
  authorized and whether credential access followed.
type: detection
detection_id: 8c0eca51-0f88-4db2-9183-fdfb10c703f9
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line match a write to an LSA PPL value under Control\Lsa?
  context: Before investing investigation time, confirm the alert is a true positive. The rule
    fires only when all three conditions hold together — the process is reg.exe, powershell.exe,
    or pwsh.exe; the command line references ControlSet and \Control\Lsa with a write verb (reg
    add, Set-ItemProperty, or New-ItemProperty); and it names RunAsPPL, RunAsPPLBoot, or
    IsPplAutoEnabled. Confirm the value being written, and note whether the data sets protection
    on (1) or off (0).
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to change LSA protection settings?
  context: Modifying LSA PPL values is a privileged, infrequent operation. A build/imaging host
    or an administrator performing documented compatibility work is a different disposition than
    a workstation or a server with no change record. Knowing whether the user role and host
    function fit registry-level security changes is often the fastest path to separating
    authorized maintenance from tampering.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which LSA PPL value was written, and does the data turn protection on or off?
  context: The exact value and data decide impact. RunAsPPL or RunAsPPLBoot set to 0 disables
    LSA Protection at next boot, removing the protected-process barrier that prevents
    credential-dumping tools from reading lsass.exe memory; setting them to 1 enables it.
    IsPplAutoEnabled relates to automatic PPL enablement. Parse the command line for the value
    name and the data written so the disposition reflects an actual disable rather than an
    enable or query.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What registry key path and value data were written by this process?
  context: The triggering command line carries the registry write, but the linked registry-set
    event exposes the resolved key path and the written data as structured fields rather than
    text parsed out of the command line. Confirm the full path resolves under
    HKLM\SYSTEM\CurrentControlSet\Control\Lsa and read the data value to see whether protection
    was set off. If no registry-set event is recorded, fall back to the command-line value from
    the trigger-match evidence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process spawned this tool and is that parent chain expected?
  context: The parent process reveals how the registry change was invoked. Interactive
    administration typically descends from explorer.exe or a console shell; configuration
    management descends from a known agent or service. Unusual parents such as web server
    worker processes, Office applications, mshta.exe, or wscript.exe point to exploitation or a
    scripted intrusion rather than hands-on maintenance.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Were other registry modifications made on this host in the same session?
  context: Disabling LSA protection is often one step in a sequence of configuration changes —
    for example, also enabling WDigest plaintext credential caching, weakening Defender, or
    adding firewall exceptions. Finding clusters of reg.exe write operations from the same host
    within a short window reveals the full scope of the changes and whether multiple objectives
    were pursued in one operation.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- question: Did credential-access activity targeting LSASS occur on this host after the protection change?
  context: Disabling LSA Protection has a single common purpose — to let a tool read lsass.exe
    memory for credentials. Look for processes that open or read LSASS, dump tools, or known
    process names and command lines associated with memory dumping in the window after the
    setting was changed. Activity here turns the registry change from a configuration anomaly
    into an active credential-access attempt.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_cred:
        CommandLine|contains:
          - 'lsass'
          - 'sekurlsa'
          - 'MiniDump'
          - 'comsvcs.dll'
          - 'procdump'
          - 'rundll32'
      condition: selection and selection_cred
    fields:
      - Image
      - CommandLine
      - User
- question: What activity occurred on this host after the LSA protection setting was changed?
  context: Defenses are weakened for a reason — to execute a payload, dump credentials, or take
    an action that protection would otherwise block or log. Examining process activity
    immediately after the registry change reveals what the change was meant to enable. New
    binaries, credential tooling, or download cradles in that window point to the operator's
    next step.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense tampering actions performed on this host?
  context: An operator who disables one protection often disables several — stopping Defender,
    clearing event logs, deleting shadow copies, or relaxing firewall rules to maximize
    coverage. Finding multiple tampering events from the same user or parent process within the
    surrounding window indicates several controls were targeted as part of one operation rather
    than an isolated registry edit.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'WDigest'
          - 'UseLogonCredential'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \reg.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - reg.exe
        - powershell.exe
        - pwsh.dll
      selection_cli_action:
        CommandLine|contains|all:
        - ControlSet
        - \Control\Lsa
        CommandLine|contains:
        - Set-ItemProperty
        - New-ItemProperty
        - ' add '
      selection_key:
        CommandLine|contains:
        - IsPplAutoEnabled
        - RunAsPPL
        - RunAsPPLBoot
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \reg.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - reg.exe
        - powershell.exe
        - pwsh.dll
      selection_cli_action:
        CommandLine|contains|all:
        - ControlSet
        - \Control\Lsa
        CommandLine|contains:
        - Set-ItemProperty
        - New-ItemProperty
        - ' add '
      selection_key:
        CommandLine|contains:
        - IsPplAutoEnabled
        - RunAsPPL
        - RunAsPPLBoot
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or
    coordinated action on multiple endpoints. If the same user changed LSA settings or ran
    related tooling on several hosts in the same window, the scope of the operation is broader
    than a single machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \reg.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - reg.exe
        - powershell.exe
        - pwsh.dll
      selection_cli_action:
        CommandLine|contains|all:
        - ControlSet
        - \Control\Lsa
        CommandLine|contains:
        - Set-ItemProperty
        - New-ItemProperty
        - ' add '
      selection_key:
        CommandLine|contains:
        - IsPplAutoEnabled
        - RunAsPPL
        - RunAsPPLBoot
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: When this host has previously fired this LSA-modification pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even routine tools can be abused. The query mirrors the rule's selection structure
    scoped to this host, so the resulting parent and user distribution reflects how this
    specific LSA-modification pattern has historically run here — not generic reg.exe or
    PowerShell usage. A new parent process, an unexpected user account, or an unusual
    command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \reg.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - reg.exe
        - powershell.exe
        - pwsh.dll
      selection_cli_action:
        CommandLine|contains|all:
        - ControlSet
        - \Control\Lsa
        CommandLine|contains:
        - Set-ItemProperty
        - New-ItemProperty
        - ' add '
      selection_key:
        CommandLine|contains:
        - IsPplAutoEnabled
        - RunAsPPL
        - RunAsPPLBoot
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Was this binary executed from an expected path?
  context: reg.exe and PowerShell run from System32 or SysWOW64 by default. A binary with these
    original file names executing from a user-writable or temporary directory may have been
    copied or renamed to evade path-based allowlists, which raises suspicion beyond the registry
    action itself. Compare the Image path against the expected system location.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired this LSA-modification pattern over the past 90 days, and what command-line structures are typical?
  context: An LSA-modification pattern with no prior history on a host is more suspicious than
    one seen periodically under stable parents. The query mirrors the rule's selection structure
    scoped to this host, so the count reflects this specific firing pattern rather than generic
    use of reg.exe or PowerShell. The command-line projection lets you compare typical
    invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \reg.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - reg.exe
        - powershell.exe
        - pwsh.dll
      selection_cli_action:
        CommandLine|contains|all:
        - ControlSet
        - \Control\Lsa
        CommandLine|contains:
        - Set-ItemProperty
        - New-ItemProperty
        - ' add '
      selection_key:
        CommandLine|contains:
        - IsPplAutoEnabled
        - RunAsPPL
        - RunAsPPLBoot
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — exploitation
    of an internet-facing service, reconnaissance, or other defense tampering — may reveal the
    stages that preceded this registry change and help reconstruct the timeline. Disabling LSA
    protection is typically a mid-chain step, so prior alerts often explain how the operator
    reached this host.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
