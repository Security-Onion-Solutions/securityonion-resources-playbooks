name: New Outlook Macro Created
id: c1e2b4d3-8d32-416b-b01d-8e8fbe4e0709
description: |
  Detects creation of the Outlook VBA macro project file, VbaProject.OTM, written by outlook.exe
  under the user's mail profile. The rule fires when the responsible process is outlook.exe AND the
  created file path ends in \Microsoft\Outlook\VbaProject.OTM. Saving any Outlook macro creates this
  OLE compound file in %APPDATA%\Roaming\Microsoft\Outlook; a macro placed here runs off Outlook
  events — Application_Startup when Outlook opens and Items.ItemAdd when mail arrives — giving
  user-land persistence and mail-triggered code execution that survives reboot without touching Run
  keys or scheduled tasks. The benign cause is a user genuinely authoring a macro, which is rare in
  most estates. Investigate what the macro contains, what launched Outlook, whether Outlook
  subsequently spawned interpreters, whether the macro-security registry values were lowered in the
  same window, and whether outbound network activity followed.
type: detection
detection_id: 8c31f563-f9a7-450c-bfa8-35f8f32f1f61
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Was \Microsoft\Outlook\VbaProject.OTM created by outlook.exe on this host?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires only
    when both conditions hold together: the created file path ends in \Microsoft\Outlook\VbaProject.OTM
    AND the process responsible for the write is outlook.exe. Review the triggering event to verify
    the path and the writing process, and note whether the operation was a creation or a modification
    of an existing macro project.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to author an Outlook VBA macro?
  context: >-
    Authoring an Outlook macro is uncommon in most estates and confined to a small set of developers or
    power users. Knowing whether the mailbox owner and host function match that expectation is often the
    fastest way to separate a genuine macro from mailbox tampering. User attribution is present on
    roughly 94% of endpoint file events; when it is a machine account or missing, judge by the host role
    and the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Does the mailbox owner recall creating or editing an Outlook macro?
  context: >-
    The primary benign cause is a user deliberately authoring a VBA macro in Outlook's editor. Direct
    confirmation from the mailbox owner is often the fastest way to resolve the alert. If the user did
    not author a macro, the VbaProject.OTM was created programmatically and the mailbox may be under
    external control; if they did, get context on what the macro is meant to do and why.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What VBA code does the created VbaProject.OTM contain, and which Outlook events trigger it?
  context: >-
    VbaProject.OTM is an OLE compound file whose VBA streams (ThisOutlookSession and the related project
    streams) hold the macro. The file body is not visible in this telemetry, so retrieve the file from
    the host or endpoint tooling and inspect its streams for autostart handlers (Application_Startup,
    which fires when Outlook opens) and mail-triggered handlers (an ItemAdd handler bound to the Inbox
    Items, which fires when mail arrives). Those handlers are what turn a stored macro into reboot-surviving
    persistence and mail-triggered execution. Hash the file and submit it to threat intelligence to check
    whether it is already known.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What launched the outlook.exe that wrote this macro file, and is that parent chain expected?
  context: >-
    Outlook is normally launched interactively when a user opens their mail client, so its parent is
    typically explorer.exe or the user-session initialization chain. An outlook.exe started by a script
    host, a remote-execution tool, or an automation framework points to programmatic control of the
    mailbox rather than a user sitting down to write a macro. Trace the parent's own origin to judge
    whether the launch was a person opening Outlook or an automated invocation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What child processes did outlook.exe spawn after the macro file was created?
  context: >-
    A weaponized VBA macro commonly launches a command interpreter or script host from outlook.exe when
    Outlook starts or when mail arrives; outlook.exe spawning cmd.exe, powershell.exe, wscript.exe, or
    mshta.exe is the execution half of this persistence. Legitimate Outlook rarely spawns interpreters,
    so any such child in the window after the macro was written ties the stored macro to actual code
    execution. Decode the child command lines to see what the macro ran.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Were the Outlook macro-security registry values (Level or VBAWarnings) lowered on this host around the same time?
  context: >-
    The macro-security posture is controlled by a Level or VBAWarnings value under the Outlook Security
    key; setting it to enable-all (a Level of 1) or turning off warnings removes the prompt that would
    otherwise block a stored macro from running. A change to either value in the same window as the
    VbaProject.OTM write suggests the environment was prepared so the macro executes without user
    interaction. Read the value data to see whether protection was weakened and which process made the
    change.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|endswith:
          - '\Outlook\Security\Level'
          - '\Outlook\Security\VBAWarnings'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: What outbound network connections did outlook.exe or macro-capable interpreters make on this host after the macro was created?
  context: >-
    A weaponized Outlook macro delivers command-and-control or exfiltration either from within outlook.exe
    itself or from an interpreter it spawns. Fallback channels favor uncommon ports and destinations
    outside normal mail infrastructure. Connections on unusual ports, or from a macro-spawned cmd.exe,
    powershell.exe, wscript.exe, or mshta.exe in the window after the file was written, tie the persistence
    to an active channel. Mail traffic to known Exchange or Microsoft 365 endpoints is expected background —
    the signal is everything else.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_procs:
        Image|endswith:
          - '\outlook.exe'
          - '\cmd.exe'
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\wscript.exe'
          - '\cscript.exe'
          - '\mshta.exe'
          - '\rundll32.exe'
      condition: selection and selection_procs
    fields:
      - Image
      - DestinationIp
      - DestinationPort
- question: Is VbaProject.OTM still on disk, or was it modified, renamed, or deleted after the alert?
  context: >-
    The file's post-alert lifecycle drives next steps. A macro project still on disk can be retrieved,
    hashed, and inspected; a VbaProject.OTM modified again or removed shortly after creation suggests the
    macro was updated in place or cleaned up. Read the operation type on later events to distinguish a
    file that persists from one that was churned.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did outlook.exe write or delete around the alert?
  context: >-
    A process that writes one notable file often writes several. Outlook itself writes mail-data and cache
    files as routine background, so volume alone is not suspicion — look at where the writes land. Drops
    into Startup folders, Temp, or script paths, or additional macro and template files appearing alongside
    VbaProject.OTM, enumerate what else needs review and whether more than the mailbox macro was staged.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files have been written to the Outlook profile directory recently, and by which processes?
  context: >-
    The Outlook profile directory normally holds mail data written by outlook.exe itself. Other processes
    writing into \Microsoft\Outlook\, or additional macro and template files appearing alongside
    VbaProject.OTM, indicate tampering with the mailbox profile rather than routine mail operation. The
    aggregation groups by path and writing process; an unfamiliar writer in this location is what stands
    out.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\Microsoft\Outlook\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has VbaProject.OTM been created or modified on this host before?
  context: >-
    The macro project file appears only when an Outlook macro is saved. No prior history means the mailbox
    had no macro project until now — a first-time appearance that raises the weight of the change. A history
    of periodic writes to the same path points to an established macro in routine use, which shifts the
    question toward whether that existing macro changed.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- always_include: true
  question: Has this user's mailbox produced this macro-file write before, and does that history fit their role?
  context: >-
    The query mirrors the rule's detection scoped to this user, so the result is the user's 90-day history
    of Outlook macro-file creation, aggregated by host. A user who has never produced this pattern is more
    notable than one who does so regularly; weigh the count against the user's role and whether authoring
    Outlook macros is part of their normal work.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith: \outlook.exe
        TargetFilename|endswith: \Microsoft\Outlook\VbaProject.OTM
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven Outlook macro-file creation on this host or across the environment, or is the program new for this activity?
  context: >-
    When the alert fires under a service or machine account, user identity does not attribute the behavior;
    the meaningful pivot is the launch mechanism. The query mirrors the rule's detection scoped to the
    alerting program, so the result is the 90-day history of this program driving macro-file creation.
    A new or rare program for this activity is the deviation worth chasing; a program that already accounts for
    many prior events is established automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith: \outlook.exe
        TargetFilename|endswith: \Microsoft\Outlook\VbaProject.OTM
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the environment around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether the macro creation is an isolated event or
    part of activity spanning multiple endpoints. If the same account drove notable activity on other hosts
    in the same window, the scope of the investigation is larger than one mailbox.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did the same program-driven Outlook macro creation fire on other hosts in the same window?
  context: >-
    Under a service or machine account, tracking the user across the network returns agent-telemetry noise.
    The meaningful question is whether the same launch mechanism fired elsewhere: the query mirrors the rule's
    detection scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts in the
    same window points to pushed or scheduled automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith: \outlook.exe
        TargetFilename|endswith: \Microsoft\Outlook\VbaProject.OTM
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — reconnaissance, execution of scripting tools, or defense tampering —
    may reveal the stages that preceded the macro creation and help reconstruct the timeline. Prior alerts help
    place this mailbox change within a larger sequence rather than treating it as an isolated event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: >-
    The Outlook macro is itself a persistence mechanism, and actors rarely rely on a single one. Scheduled
    tasks, services, registry Run keys, BITS jobs, or WMI subscriptions created by schtasks.exe, sc.exe,
    reg.exe, bitsadmin.exe, or wmic.exe near the macro creation indicate the change was part of a footholding
    effort with stacked mechanisms rather than an isolated action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
