name: Creation Exe for Service with Unquoted Path
id: 8b0d5b42-4f37-49e7-8fc8-76d31c79ea32
description: |
  Detects the creation of an executable at a filesystem path that an unquoted service ImagePath
  would cause Windows to resolve before the intended service binary — the rule fires on a file
  written to C:\program.exe. When a service is registered with an unquoted path such as
  C:\Program Files\App\svc.exe, Windows attempts C:\Program.exe first; an executable planted at
  that interception point runs in place of the real service binary at the next service start,
  under the service account (frequently SYSTEM). Legitimate causes are rare — a stray installer
  artifact or a genuinely named program.exe at the drive root — while malicious use hijacks a
  service for persistence and privilege escalation, with execution deferred until the service or
  the host restarts. Because the payoff is deferred, a file that has not run yet is an expected
  finding rather than an all-clear. Investigate which service the path intercepts, what process
  wrote the file, whether the binary is signed and where it came from, whether it has executed,
  and whether a restart has given it the chance to run.
type: detection
detection_id: 8c3c76ca-8f8b-4b1d-aaf3-81aebcd367c9
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the alerting file write place an executable at a path-interception point such as the drive root?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when an
    executable is created at C:\program.exe — the drive-root location Windows resolves first when a
    service is registered with an unquoted path that contains a space (for example
    C:\Program Files\App\svc.exe resolves C:\Program.exe before the real binary). Review the exact
    TargetFilename, the operation performed, and the responsible process on the triggering event to
    confirm the file is an executable sitting at that interception point, and note the writing process
    for the pivots that follow.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to write an executable to the drive root?
  context: >-
    Writing an executable directly to the root of a drive is uncommon for normal software; installers
    and update agents almost always stage binaries under Program Files, ProgramData, or per-user
    application directories. Knowing whether the writing account and host function match any legitimate
    reason to drop a file at the drive root is often the fastest way to separate a stray installer
    artifact from a deliberate interception plant. User attribution is present on roughly 94% of
    endpoint file events; when it is a machine account or SYSTEM, judge by the writing process and the
    host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What process and command wrote this executable to the drive root?
  context: >-
    The file event records the responsible process identifier but carries no command line, so pivot to
    the writing process by its ProcessGuid to read the full command that created the file. A copy from
    an interactive shell, a script host such as wscript.exe or mshta.exe, or a build or packaging tool
    writing to the drive root reads very differently from a signed installer service. Decode the
    arguments to identify what was written, from where it was copied, and whether the same invocation
    touched other paths.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - Image
      - User
- question: Is the planted executable signed, and does it carry any marker indicating it was downloaded?
  context: >-
    Confirm what the dropped binary actually is. Retrieve the file at the recorded path and check its
    digital signature, publisher, size, and embedded strings: a signed vendor binary relocated to the
    drive root reads very differently from an unsigned or renamed payload. Files fetched from the
    internet frequently carry an alternate-data-stream zone marker recording their origin; that
    marker is not collected in this telemetry, so check it directly on the host or through endpoint
    tooling to establish whether the executable was downloaded rather than produced locally.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Which service's unquoted ImagePath does this drive-root path intercept?
  context: >-
    The impact of this drop depends entirely on which service it hijacks. Enumerate services whose
    ImagePath is unquoted and contains a space that begins under the drive root — Windows would try
    C:\Program.exe (or another truncation before the first space) ahead of the intended binary, and a
    file planted there runs in that service's security context, which is often SYSTEM. Identify the
    affected service, its account, and its start type from the service configuration; a service set to
    start automatically or one that a lower-privileged user can trigger raises the practical risk.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Has the planted executable at the drive root been run since it was created?
  context: >-
    Execution of a path-interception plant is deferred until the vulnerable service or the host
    restarts, so a file that has not yet run is an expected state, not an all-clear. Look for the binary
    executing by its filename over the following window: if it has run, capture the parent that launched
    it and the account it ran under, since a launch from services.exe under a service account confirms
    the interception fired. If no execution appears, the plant is still armed and the service has not
    restarted yet.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - User
- question: If the planted executable has run, what is its hash and does it have known threat-intel detections?
  context: >-
    A file's hash is recorded when it executes, not when it is written, so this looks for the binary
    running by its filename and reads the hash from the execution event. Submit that hash to reputation
    or internal threat-intel services to determine whether the binary is known malicious, benign, or
    previously unseen. If the file is present at the drive root but has not executed, retrieve it from
    that path and hash it manually rather than waiting for the deferred service start.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: Has the vulnerable service or the host restarted since the executable was planted?
  context: >-
    The interception only executes the planted binary when the affected service next starts, which
    typically follows a service restart or a host reboot. Determine whether either has occurred since
    the file was created — through host uptime, service state, or endpoint tooling — because that is
    what converts an armed plant into an actual SYSTEM-context execution. If neither has happened, the
    file can be removed and the underlying unquoted-path configuration corrected before it runs; if a
    restart has occurred, treat the execution-search results as load-bearing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the planted executable still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives both urgency and next steps. A binary still at the drive
    root can be retrieved, hashed, and analyzed, and the unquoted-path configuration corrected before
    it runs. A file deleted or renamed shortly after creation suggests either anti-forensic cleanup or
    a stager that moved on, and shifts the investigation toward what ran in the interval. Read the
    operation type to distinguish a creation that persisted from one that was removed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A process that plants one interception binary may plant several — covering multiple truncation
    points of the same unquoted path, or staging additional payloads and components. The breadth,
    paths, and extensions of the writing process's other file activity distinguish a single artifact
    from a broader staging effort and enumerate what else needs review. The correlation follows the
    writer and its direct children, since droppers often delegate the actual write.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other executables were created on this host recently, and did any land at path-interception points?
  context: >-
    Path interception is often applied to more than one location, and executables written to the drive
    root or to the top level of a Program Files path are unusual arrivals. Reviewing recent executable
    creations on this host reveals whether this drop is isolated or one of several, and highlights any
    that landed at drive-root or other unquoted-path interception points. A single unfamiliar writing
    process across multiple executable drops is the pattern to look for.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: '.exe'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has an executable with this name been seen before at the drive root on this host?
  context: >-
    A binary that has never appeared at this location is more suspicious than one that is part of normal
    operations. A history showing no prior creation of this file at the drive root makes it a first-time
    arrival and raises its weight; a history of periodic writes points to a recurring process, such as a
    repackaging job or an installer, that routinely places it there. Compare the writing processes across
    any prior appearances to judge whether this instance fits the established pattern.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What is the parent lineage of the process that wrote this file, and is that chain expected?
  context: >-
    The writing process and what launched it reveal how the interception plant was staged. Legitimate
    software deployment has predictable lineage — management agents, services.exe, or an installer
    launched from an interactive session. A copy operation whose parent is an Office application, a
    script host such as wscript.exe or mshta.exe, or an unsigned binary points to scripted staging
    rather than sanctioned installation. Because the file event does not carry the parent identifier,
    the writer's own process record is used to read its immediate parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    A persistence plant rarely happens in isolation. Earlier detections on the same host —
    reconnaissance, execution of scripting tools, or privilege-escalation attempts — may reveal the
    stages that preceded the drop and help reconstruct the timeline. Establishing a foothold and then
    planting deferred persistence is a common progression, and prior alerts help place this file
    creation within it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- always_include: true
  question: Has this user previously produced this file-creation pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's detection scoped to this user — the result is the user's 90-day history
    of this specific drive-root executable creation, aggregated by host, rather than generic file
    activity. A user who has never produced this pattern is more suspicious than one who does so
    regularly; weigh the count against the user's role and whether their function includes software
    packaging or deployment.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename: C:\program.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this writing process historically produced this pattern on this host or across the environment, or is it new for this activity?
  context: >-
    When the alert fires under a service principal or machine account, user identity does not attribute
    the behavior; the meaningful pivot is the launch mechanism. The query mirrors the rule's detection
    scoped to the writing process's program, so the result is the 90-day history of this process driving
    this specific drive-root creation, aggregated by host. A new or rare writer for this pattern is the
    deviation worth chasing; a writer that already accounts for many prior events is more likely vendor
    or operating-system automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename: C:\program.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the writing user's activity across all hosts reveals whether this drop was an isolated
    action or part of activity spanning multiple endpoints. If the same account produced similar file
    or process activity on other hosts in the same window, the scope may extend beyond this host. When
    the alert fires under SYSTEM or a machine account, this user-pivot returns broad agent-telemetry
    volume, and the parent-driven view is the meaningful answer.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same writer-driven pattern fire on other hosts in the same window, or is it isolated to this host?
  context: >-
    Under a service principal, asking what else the user did across the network returns agent-telemetry
    noise, since every host runs SYSTEM-owned agents constantly. The meaningful question is whether the
    same launch mechanism produced this drive-root creation elsewhere: the query mirrors the rule's
    detection scoped to the writing process's program, fleet-wide, in the alert window. Multiple hosts in
    the same window points to pushed or scheduled automation; a single host points to a host-local
    trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename: C:\program.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
