name: TropicTrooper Campaign November 2018
id: 33eff281-207b-47da-b652-f27126a4e554
description: |
  Detects a process whose command line contains the fixed literal marker string
  abCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCc. The sequence has no functional role in
  ordinary administration — no installer, management agent, or administrative script emits it —
  and it appears as padding in a command buffer assembled by exploit code rather than typed by a
  user or produced by a tool. A verbatim match therefore means the command line was constructed
  by that tooling, not that it merely resembles it.
  The investigation should decode the rest of the command line, establish which process and parent
  produced it, and determine whether the command downloaded, staged, or launched a payload.
type: detection
detection_id: 8c7090c3-e0a0-4944-bd08-08c3a0cecf79
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the alerting command line contain the fixed marker string this rule keys on?
  context: >-
    Before investing investigation time, confirm the alert is a true positive by checking that
    abCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCc appears verbatim in the command line rather
    than as a coincidental fragment, and note which process and parent produced it. The rule
    constrains nothing but this string, so the binary that ran is an output of the investigation
    rather than an input to it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run the process and command line captured by this alert?
  context: >-
    Legitimate administrative activity triggers many detections, and knowing whether the user role
    and host function fit the observed behavior is often the fastest path to a disposition. Here
    the marker string is not something administrative tooling emits, so the question narrows to
    whether the process and its parent are sanctioned software on this host at all.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this execution part of an authorized penetration test or red team engagement?
  context: >-
    Exploit-generation frameworks and offensive tooling are used in authorized assessments, and a
    test harness replaying a known exploit document reproduces the same fixed marker byte for byte.
    Check whether an assessment is currently active on this host or network segment — matching scope
    and timing resolves the alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: What files did the alerting process write to disk after it ran?
  context: >-
    Command lines built by exploit code commonly stage a payload before executing it, typically
    writing a short or randomly named executable into a user-writable directory such as the user
    profile or a temp path. Files written by the alerting process confirm what the command actually
    produced and give the analyst a path to pivot on for later execution, even if the original
    process has exited.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: Was the command encoded or obfuscated, and what does it decode to?
  context: >-
    Beyond the marker itself, the command line carries the operational payload. Look for
    -EncodedCommand / -enc base64 blobs, -nop and other suppression switches, caret or backtick
    escaping, and string concatenation, then decode or deobfuscate what is left. Read the decoded
    content for a download-and-execute cradle, a target URL or IP and port, a local output path, or
    an in-memory assembly load — those determine what the operation was actually for.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Did PowerShell script block logging capture the full script content?
  context: >-
    Windows Event ID 4104 records the deobfuscated script content PowerShell actually executed, even
    when the command line is encoded, so it is ground truth when the alerting command line is
    unreadable. Very short one-liners may fall under the logged-length threshold and add little, and
    if PowerShell operational logs are not ingested in this environment, treat zero results as a
    visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
  answer_sources:
  - powershell_script_block
- question: Were PowerShell security controls bypassed or weakened before this execution?
  context: >-
    Scripted execution is frequently preceded by steps that clear the way for it — execution policy
    bypass, AMSI patching via AmsiUtils or amsiInitFailed, real-time monitoring changes, or a
    downgrade to PowerShell v2, which lacks script block logging. Finding these in the hour before
    the alert establishes that the surrounding activity was deliberate rather than incidental.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Which processes on this host loaded the PowerShell automation assemblies around the time of the alert?
  context: >-
    PowerShell runs inside any process that loads System.Management.Automation.dll, with no
    powershell.exe ever appearing in process telemetry, so command-line evidence alone misses
    .NET-hosted invocation. A load by an Office application, a script host, or an unsigned binary
    under a user-writable path is the deviation worth chasing; if module-load telemetry is not
    collected in this environment, treat zero results as a visibility gap rather than evidence
    nothing ran.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith:
          - '\System.Management.Automation.dll'
          - '\System.Management.Automation.ni.dll'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned the alerting process, and is that parent chain expected?
  context: >-
    The parent reveals how the command was invoked and is the strongest available signal here,
    because the rule constrains only the command line. A document-handling parent such as
    winword.exe, excel.exe, or eqnedt32.exe, or a script host such as wscript.exe or mshta.exe,
    points to a document-borne exploit passing a prebuilt command to the shell; explorer.exe or a
    service host points elsewhere. Walk further up the tree if the immediate parent is itself
    unexpected.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What child processes did the alerting process spawn afterward?
  context: >-
    A staged command typically finishes by launching what it wrote, so the children reveal whether
    the operation progressed past the initial command. Transfer utilities, a shell or script host, or
    a short or randomly named executable running out of a user-writable directory all indicate the
    download-then-execute step completed. The query follows process lineage from the alerting event
    rather than scoping on a binary name, since the rule pins no binary.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: When this host has previously produced this marker string in a command line, what parents and users drove it, and does the current alert fit?
  context: >-
    The query mirrors the rule's selection scoped to this host, so the parent/user distribution
    reflects how this exact string has historically appeared here rather than generic tool usage.
    For a fixed literal with no administrative meaning, an empty result is the expected outcome and
    makes the current event first-of-its-kind; a populated result points to a local test harness or
    a recurring source worth identifying by its parent.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: abCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCc
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, giving their 90-day history of this
    exact string aggregated by host rather than generic use of a binary. Weigh the count against the
    user's role and typical toolset — a security tester or developer with a history across several
    hosts reads very differently from a first occurrence under an account that has never produced it.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: abCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCc
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Has this parent process historically driven the rule's pattern here or across the environment, or is the parent new for this activity?
  context: >-
    When the alert fires under SYSTEM or another service principal, user identity does not attribute
    the behavior and the launch mechanism is the meaningful pivot. The query mirrors the rule's
    selection scoped to the alerting parent, giving the 90-day history of that parent driving this
    exact string. A parent already accounting for a large volume of prior events is automation; a new
    or rare parent for this pattern is the deviation to chase.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: abCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCc
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts in the alert window shows whether the same account
    drove activity on more than one endpoint, which bounds how far the operation reached. If the
    alert fired under a service principal, expect this to return routine agent telemetry — read the
    parent-driven view instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  always_include: true
  answer_sources:
  - process_creation
- question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, a user-wide sweep returns agent-telemetry noise, so the useful
    question is whether the same launch mechanism produced this string elsewhere. The query mirrors
    the rule's selection scoped to the alerting parent, fleet-wide, in the alert window. Multiple
    hosts in the same window points to pushed or scheduled automation; a single host points to a
    host-local trigger such as a document opened by one user.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: abCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCc
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation, and the surrounding process activity shows what led to this
    event and what followed. Aggregating by parent and child collapses repetitive agent telemetry
    into high-count rows while novel parent-child pairs stand out at low counts. Note the wall-clock
    time as well — execution outside working hours or outside a maintenance window narrows the range
    of routine explanations.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — document-handling processes behaving abnormally, defense
    tampering, reconnaissance, or credential access — help reconstruct how the host reached this
    point. The ordering matters more than the individual alerts, since exploitation followed by
    execution and staging is the progression to look for.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Have other hosts produced this marker string in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this
    exact string rather than generic usage of any binary. Because the string is a fixed literal, a
    result spanning several hosts is unlikely to be coincidence — it points either to a test harness
    deployed broadly or to the same tooling reaching multiple endpoints. Use the host distribution to
    calibrate scope.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: abCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCc
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
