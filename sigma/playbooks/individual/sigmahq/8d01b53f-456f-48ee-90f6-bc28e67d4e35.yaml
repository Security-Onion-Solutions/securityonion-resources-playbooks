name: Suspicious Obfuscated PowerShell Code
id: ec9d868d-f488-446c-a8ec-e8e86b65aa24
description: |
  Detects command lines carrying UTF-16/base64 fragments that decode to common PowerShell
  obfuscation primitives — the `-bxor 0x` byte-decode pattern, `.Invoke()` piped execution,
  and `{n}{m}` format-string token reordering. These fragments survive in the command line even
  when the surrounding script is encoded, because UTF-16-then-base64 encoding produces stable
  substrings for those constructs. Legitimate code rarely emits these exact byte sequences;
  attackers use them to hide download cradles, in-memory loaders, and reverse shells from casual
  inspection. The investigation should decode the full command line, recover what the obfuscated
  script actually executes, and determine whether security controls were weakened beforehand.
type: detection
detection_id: 8d01b53f-456f-48ee-90f6-bc28e67d4e35
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line contain the encoded obfuscation fragments this rule detects?
  context: Confirm the alert is a true positive by reviewing the full command line and checking for
    the UTF-16/base64 substrings the rule matches — encoded forms of `-bxor 0x`, `.Invoke()` piped
    execution, or `{n}{m}` format-string reordering. These fragments appear mid-command even when the
    rest of the script is itself encoded.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run encoded or obfuscated PowerShell?
  context: Legitimate administrative scripting and software installers occasionally ship obfuscated
    PowerShell, but the specific byte-decode and format-string reordering primitives here are unusual
    outside red-team tooling and malware. Knowing whether the user role and host function involve
    developer or automation workloads is often the fastest way to separate routine activity from an
    operator's payload.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Decode the full command line — what does the obfuscated PowerShell actually do?
  context: The matched fragments are only markers; the operation lives in the rest of the command
    line. Reconstruct the UTF-16/base64 sections, resolve the `-bxor` byte decode, expand any
    `{n}{m}` format-string reordering, and follow `.Invoke()` calls to identify the real action — a
    download cradle, an in-memory loader, a reverse shell, or credential access. This query returns
    every command line on the host carrying the rule's encoded fragments within the window, so a
    multi-stage obfuscated script run as separate invocations is visible as one operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
        - IAAtAGIAeABvAHIAIAAwAHgA
        - AALQBiAHgAbwByACAAMAB4A
        - gAC0AYgB4AG8AcgAgADAAeA
        - AC4ASQBuAHYAbwBrAGUAKAApACAAfAAg
        - AuAEkAbgB2AG8AawBlACgAKQAgAHwAI
        - ALgBJAG4AdgBvAGsAZQAoACkAIAB8AC
        - AHsAMQB9AHsAMAB9ACIAIAAtAGYAI
        - B7ADEAfQB7ADAAfQAiACAALQBmAC
        - AewAxAH0AewAwAH0AIgAgAC0AZgAg
        - AHsAMAB9AHsAMwB9ACIAIAAtAGYAI
        - B7ADAAfQB7ADMAfQAiACAALQBmAC
        - AewAwAH0AewAzAH0AIgAgAC0AZgAg
        - AHsAMgB9AHsAMAB9ACIAIAAtAGYAI
        - B7ADIAfQB7ADAAfQAiACAALQBmAC
        - AewAyAH0AewAwAH0AIgAgAC0AZgAg
        - AHsAMQB9AHsAMAB9ACcAIAAtAGYAI
        - B7ADEAfQB7ADAAfQAnACAALQBmAC
        - AewAxAH0AewAwAH0AJwAgAC0AZgAg
        - AHsAMAB9AHsAMwB9ACcAIAAtAGYAI
        - B7ADAAfQB7ADMAfQAnACAALQBmAC
        - AewAwAH0AewAzAH0AJwAgAC0AZgAg
        - AHsAMgB9AHsAMAB9ACcAIAAtAGYAI
        - B7ADIAfQB7ADAAfQAnACAALQBmAC
        - AewAyAH0AewAwAH0AJwAgAC0AZgAg
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Was the command encoded or obfuscated? What does it decode to?
  context: This pattern is itself an obfuscation marker, so the full payload is hidden behind encoding,
    backtick escaping, variable substitution, and the `-bxor` byte cipher. Decode the base64/UTF-16
    sections and resolve the XOR key to recover the cleartext. Decoded content usually reveals a
    download cradle, an in-memory load of a .NET assembly, or a reverse shell. The byte-XOR and
    format-string reordering here are deliberate evasions of signature matching, not normal scripting.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the deobfuscated script content?
  context: Script block logging records the script PowerShell actually executes after deobfuscation,
    which is the ground truth when the command line is XOR-encoded and format-string scrambled. This
    is often the only place the cleartext payload appears. If PowerShell operational logs are not
    ingested in this environment, treat zero results as a visibility gap rather than evidence nothing
    ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell security controls bypassed or weakened before this execution?
  context: Obfuscated payloads are frequently preceded by control tampering — AMSI patching, execution
    policy bypass, constrained language mode escape, or a downgrade to PowerShell v2 that lacks logging.
    Finding these precursor events on the host shortly before the alert strengthens the case that the
    obfuscation was hiding a malicious payload rather than a benign installer.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: What process spawned this PowerShell instance, and is that parent chain expected?
  context: The parent reveals how the obfuscated command was launched. User-driven scripting typically
    descends from explorer.exe or a console; parents like winword.exe, excel.exe, mshta.exe, wscript.exe,
    or a browser process point to macro execution or exploitation delivering the encoded payload. Walk
    up the chain to see what spawned the parent and what else it launched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes were spawned on this host right after the obfuscated command ran?
  context: The processes spawned after the obfuscated script reveal its actual impact. Decoded cradles
    commonly drop and run cmd.exe, additional powershell.exe instances, certutil.exe, rundll32.exe, or
    a freshly written binary. This query returns the direct children of the alerted PowerShell process,
    so every hit is attributable to the obfuscated command itself; a zero means the script spawned
    nothing and acted in-process instead.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - ParentImage
      - CommandLine
- question: When this host has previously fired this encoded-PowerShell pattern, what parents and users
    drove it, and does the current alert fit?
  context: The query mirrors the rule's encoded-fragment selection scoped to this host, so the
    resulting parent/user distribution reflects how this specific obfuscation pattern has historically
    run here — not generic PowerShell usage. A new parent process, an unexpected user account, or a
    first-time appearance of the pattern is the deviation worth chasing.
