name: Network Connection Initiated By IMEWDBLD.EXE
id: c6c79111-1b51-487d-97eb-73215b69be8f
description: |
  Detects an outbound network connection initiated by IMEWDBLD.exe, the Microsoft IME Open Extended
  Dictionary updater. When passed a URL as an argument, this signed system binary downloads the file
  at that URL and writes it to the user's INetCache directory, which makes it usable as a
  living-off-the-land downloader for arbitrary content. IMEWDBLD.exe has little reason to reach the
  network during normal input-method use, so any outbound connection from it is unusual - determine
  the destination and its reputation, the command line that invoked it, what file was written
  afterward, and whether the parent chain is a script host or Office application rather than a routine
  dictionary-update workflow.
type: detection
detection_id: 8d7e392e-9b28-49e1-831d-5949c6281228
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Did IMEWDBLD.exe initiate this outbound connection, and to what destination and port?
  context: Confirm the alert by reviewing the initiating process image and the connection direction against the rule's criteria. The rule fires when a process whose Image ends in \IMEWDBLD.exe initiates an outbound (egress) connection. On this telemetry the network category mixes sensor-level events that carry no process fields with endpoint events that do; a populated Image path confirms the alerting event came from the endpoint subset.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - Image
      - Initiated
- question: Is this user and host expected to run IMEWDBLD.exe in a way that reaches the network?
  context: IMEWDBLD.exe is part of the input-method dictionary-update workflow and on most endpoints never connects out. Knowing whether the user role and host function are consistent with a genuine IME dictionary download is often the fastest way to separate a true positive from routine operation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the full command line of IMEWDBLD.exe, including the URL it was given?
  context: IMEWDBLD.exe downloads whatever URL is supplied as its argument and saves it to the user's INetCache directory, so the command line carries the target URL and reveals whether a remote address was passed. The network event itself has no command line, so this pivots to endpoint process activity for the same binary on the host. For a single invocation this returns one row.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What is the destination of this connection, and what do DNS, WHOIS, and threat intelligence reveal about it?
  context: Investigate the destination IP and any resolved hostname - registration age, passive DNS history, TLS certificate details, and known-infrastructure hits. Destination hostname is sparsely recorded on this telemetry because name resolution is a separate event, so treat an empty hostname as expected and pivot through the DNS lookup for the domain. Distinguishing an internal destination from an external one narrows whether this is a pull from external infrastructure or internal movement; the port alone is weak because benign software reuses common ports.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - DestinationPort
- question: What process spawned IMEWDBLD.exe, and is that parent chain expected?
  context: The parent process reveals how the binary was launched. A dictionary-update workflow has predictable parents, while a script host such as wscript.exe or mshta.exe, an Office application, or another unexpected parent points to abuse of the utility as a downloader. Tune out known-good updater parents such as bundled application updaters before treating an unfamiliar parent as significant.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What child processes did IMEWDBLD.exe spawn afterward?
  context: A legitimate dictionary download only writes a file and spawns nothing. A child shell, script host, or other utility launched after the connection suggests the retrieved file was executed, pointing to post-download activity rather than a benign update finishing its work.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Was a file written by IMEWDBLD.exe or a child process, confirming the download completed?
  context: An outbound connection does not guarantee a file was retrieved - network errors, blocked destinations, or security controls may have stopped the transfer. IMEWDBLD.exe writes downloaded content into the user's INetCache directory; a file creation there, or by a child it spawned, establishes that the delivery stage succeeded and gives a path to analyze. This correlates file creation to the process and its direct children by lineage, not to unrelated writers.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Is a file written by this process still on disk for analysis?
  context: If the process retrieved a file, checking whether it still exists on disk enables deeper analysis - hash lookup, sandbox submission, or content review. This correlates file activity to the alerting process and its direct children by lineage; a file that was written and then deleted will show both the write and its removal.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did this process or its children write to disk around the alert?
  context: A delivery rarely arrives as a single file - the same process, or a child it spawns, often writes further files during extraction, decompression, or a follow-on transfer. Surfacing the full file-write footprint of the process and its direct children reveals the broader scope of the operation. This catches the process and its direct children, not grandchildren or unrelated writers.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: If the downloaded file was executed, what is its hash, and is it known to threat intelligence?
  context: IMEWDBLD.exe saves retrieved content to disk but does not itself run it, so the hash needed for a reputation lookup or detonation is recorded when a payload runs, not when it is written - file-creation events carry no hash in this telemetry. This returns the processes the alerting process and its parent spawned - its children and siblings - with their executable hashes; for a download-and-execute that is the payload. If the file was run later by an unrelated process it will not appear here; retrieve it from the on-disk path and hash it manually.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection_children
    fields:
      - Image
      - Hashes
- question: Does this host normally run IMEWDBLD.exe?
  context: IMEWDBLD.exe runs rarely if ever on most endpoints outside a genuine dictionary update. Zero or very low historical counts over the baseline window indicate first-time or rare execution, which raises the weight of the other findings.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Does this host normally communicate with this destination?
  context: A first-time connection to a destination is more notable than routine communication. Establishing whether this host has reached this destination before helps separate newly stood-up infrastructure from regular business traffic. The destination port variation across prior connections shows whether the service being contacted is consistent with normal use.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
- question: When this host has previously seen IMEWDBLD.exe initiate outbound connections, what programs and users drove that activity, and does the current alert fit?
  context: The query mirrors the rule's selection scoped to this host, so the resulting program and user distribution reflects how the rule's specific firing pattern - not generic binary usage - has historically run here. A new acting program process, an unexpected user account, or an unfamiliar pairing is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        Initiated: 'true'
        Image|endswith: \IMEWDBLD.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts seen IMEWDBLD.exe initiate outbound connections in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of the rule's firing pattern rather than generic usage of the binary. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        Initiated: 'true'
        Image|endswith: \IMEWDBLD.exe
      condition: selection
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining process activity around the alert reveals what led to this event and what happened after, and whether it is part of a larger sequence such as reconnaissance, privilege escalation, or persistence. Aggregating by parent-child pairs collapses repetitive agent noise into high-count rows while novel pairings stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - defense tampering, reconnaissance, credential access - may reveal the stages that preceded this event and help reconstruct the timeline. Ingress tool transfer is typically a mid-operation step, so a preceding execution or delivery alert often explains how the connection came to be initiated.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
