name: Suspicious PowerShell In Registry Run Keys
id: ccd6ba7d-0448-40d3-ab7e-d1b3416a65bd
description: |
  Detects a registry write that stores a PowerShell command in an autostart Run key — a value under
  \Software\Microsoft\Windows\CurrentVersion\Run, its WOW6432Node equivalent, or
  \Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run whose data contains a PowerShell
  invocation pattern (powershell/pwsh, FromBase64String or -EncodedCommand, a hidden-window or
  -ExecutionPolicy Bypass flag, or a download cradle such as IEX, Invoke-WebRequest, or
  .DownloadString/.DownloadFile). The rule fires when the key path is a Run location AND the value
  data matches one of those patterns. Legitimate installers, management tooling, and third-party
  scripts do register Run-key launchers, so a baseline is required; malicious use plants a PowerShell
  payload that executes at the next logon, often to fetch and run a second stage in memory. Because
  the persistence fires on logon, the payload may not have run yet — an absence of execution is
  expected and is not an all-clear. Investigate the value data, the process and parent that wrote it,
  whether the payload has since executed, and what other autostart or configuration changes landed in
  the same window.
type: detection
detection_id: 8d85cf08-bf97-4260-ba49-986a2a65129c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the alerting registry write add a PowerShell command to an autostart Run key?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a
    value whose TargetObject is under \CurrentVersion\Run, its WOW6432Node equivalent, or
    \Policies\Explorer\Run is written AND the value data (Details) contains a PowerShell invocation
    pattern — powershell/pwsh, FromBase64String or -EncodedCommand, a hidden-window or
    -ExecutionPolicy Bypass flag, or a download cradle such as IEX, Invoke-WebRequest, or
    .DownloadString/.DownloadFile. Review the exact TargetObject and Details on the triggering event
    to confirm both halves matched and note which Run-key path received the value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to register a PowerShell command in an autostart Run key?
  context: >-
    Installers, deployment tooling, and some third-party software legitimately add Run-key launchers,
    typically on a defined set of hosts and by a small set of accounts or service identities. Knowing
    whether the writing account and host function match that expectation is often the fastest way to
    separate a sanctioned autostart entry from a planted payload. User attribution is present on
    roughly 94% of endpoint registry events; when it is a machine account or missing, pivot on the
    writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What PowerShell command was written to the Run key, and what does it do?
  context: >-
    The value data is the command that runs at the next logon, so decode it fully. Look for a base64
    blob after -EncodedCommand or FromBase64String, a download cradle (IEX combined with
    Invoke-WebRequest/Invoke-RestMethod, or .DownloadString/.DownloadFile fetching a second stage),
    and stealth flags (-w hidden, -window hidden, -nop, -noni, -ExecutionPolicy Bypass). Details is
    present on roughly 79% of registry modifications and holds the payload verbatim; decoding it
    identifies whether the entry fetches remote code, runs in memory, or launches a local file.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Which Run-key variant was written, and does its scope match expected autostart persistence?
  context: >-
    The specific path determines reach. A value under HKLM\...\CurrentVersion\Run (and its
    WOW6432Node mirror) runs for every user at logon and requires elevation to write, while
    HKCU\...\CurrentVersion\Run runs only for the logged-on user, and \Policies\Explorer\Run is a
    policy-driven autostart normally set through management tooling rather than an ad-hoc write. The
    value name and the writing process together identify what will execute and whether the location
    is consistent with how autostarts are managed here.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Was the Run-key payload encoded or obfuscated, and what does it decode to?
  context: >-
    Registry Run-key payloads are frequently hidden behind -EncodedCommand base64, string
    concatenation, backtick escaping, or variable substitution. Pivoting to the writing process by
    its ProcessGuid shows the command that set the value — a reg.exe or Set-ItemProperty invocation
    usually carries the payload inline — which can be decoded alongside the stored value data.
    Decoding reveals the actual operation: a download cradle fetching a second stage, a reverse
    shell, or in-memory execution of a .NET assembly.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process wrote this Run-key value, and is its parent chain expected?
  context: >-
    The writing process and its parent reveal how the autostart entry was installed. Installers,
    management agents, and an interactive console launched from explorer.exe have predictable lineage.
    A reg.exe or powershell.exe write whose parent is an Office application, a script host such as
    wscript.exe or mshta.exe, or an unsigned binary points to scripted persistence rather than a
    sanctioned software install. The registry event carries the writer's process identifiers, so the
    lookup returns the writer's own parent context.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
- question: Did the writing process also drop the payload referenced by the Run-key value to disk?
  context: >-
    When the value data names a local file or a download cradle saves a second stage, a payload lands
    on disk in the same session. Correlating the writing process's file activity by process lineage
    surfaces where that executable or script was written so it can be retrieved and analyzed. File
    writes are matched by the writer's ProcessGuid and its children's ParentProcessGuid rather than a
    path placeholder, because the registry alert carries no file path of its own.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did PowerShell execute on this host after this Run-key value was written?
  context: >-
    Run-key persistence fires at the next logon, so the payload may not have run yet — zero executions
    on a freshly written key is expected and is not an all-clear. Look for powershell.exe or pwsh.exe
    executions in the window after the write and compare their command lines against the decoded value
    data to determine whether the persistence payload has since executed and what it did.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did PowerShell script block logging capture the script content around this write?
  context: >-
    Script block logging records the deobfuscated script content PowerShell actually executes, even
    when the command line or the stored value is encoded. If the Run-key value was written by a
    PowerShell one-liner, or if the payload has already run, the corresponding script blocks provide
    ground truth about what executed. If PowerShell operational logs are not ingested in this
    environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: After this write, was the Run-key value re-modified, overwritten, or left in place?
  context: >-
    Registry key and value deletions are not observable in this telemetry, so durability is judged
    from the value's re-modification history rather than from a delete event. A single write that is
    never changed leaves the autostart entry armed; a later overwrite could be remediation, a software
    update, or the operator rotating the payload to a new command. Compare the later Details values
    and writing processes to see how the entry evolved.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Has this Run key been modified before on this host?
  context: >-
    Run keys change when software is installed or updated, but a given value should not be rewritten
    constantly. A history that shows no prior writes makes this a first-time entry and raises its
    weight; a history of periodic writes with the same command points to a legitimate installer or
    management process. Compare the historical Details values to see whether this PowerShell command
    is new to the host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same Run key written on other hosts in the environment?
  context: >-
    The same value across many hosts suggests centrally managed software or a policy rollout, while
    the same write confined to one host suggests a targeted foothold. Compare the Details values
    across hosts to see whether they all carry the same command or differ, and whether the writing
    process is consistent with a management deployment or with ad-hoc scripting.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other registry modifications were made on this host in the same window?
  context: >-
    Persistence rarely lands alone — a Run-key write often accompanies defense-tampering, firewall, or
    additional autostart changes. Clustering the registry writes on this host within a short window
    around the alert reveals the full scope of configuration changes and whether multiple objectives
    were pursued together. The triggering key appears in the results; the signal is what else was
    modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A persistence write rarely happens in isolation. Aggregating process activity in a tight window
    around the alert surfaces what led up to the change and what ran immediately after. Novel
    parent-child pairs stand out at low counts against high-count routine telemetry, which is what
    points to reconnaissance, execution, or staging around the autostart entry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this write?
  context: >-
    Earlier detections on the same host — reconnaissance, execution of scripting tools, credential
    access, or defense tampering — may reveal the stages that preceded this autostart write and help
    reconstruct the timeline. Initial access followed by persistence is a common progression, and
    prior alerts help place this Run-key edit within it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Attackers rarely rely on a single foothold. Scheduled tasks, services, additional registry keys,
    BITS jobs, and WMI subscriptions created by schtasks.exe, sc.exe, reg.exe, bitsadmin.exe, or
    wmic.exe near the Run-key write indicate stacked persistence rather than an isolated software
    install. Multiple persistence installations in the same timeframe point to a hands-on session.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely — dropping an executable or script
    into a Startup folder, or a payload into a path referenced by a Run-key value, achieves autostart
    without invoking schtasks, sc, or reg. File writes to these locations near the Run-key edit
    indicate a parallel persistence mechanism was established alongside it.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: >-
    Does the registry change survive reboot, and is the referenced executable or script still
    present on disk?
  context: >-
    Registry persistence is only effective if the referenced payload exists at the path written to
    the registry value. If an attacker wrote a Run key pointing to C:\Users\Public\backdoor.exe,
    confirming that the file was created at that path determines whether the persistence mechanism
    is active and what it would execute on next logon. The file-write event carries no hash; if the
    payload is present, hash it from a later execution or retrieve it for a reputation lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
