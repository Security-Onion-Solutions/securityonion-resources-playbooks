        - \AppData\Local\Packages\Microsoft.WindowsTerminal_
        - \LocalState\settings.json
      filter_vsdevcmd:
        CommandLine|contains|all:
        - C:\Program Files\Microsoft Visual Studio\
        - \Common7\Tools\VsDevCmd.bat
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar terminal-spawned activity on several hosts, the scope is larger than a single workstation.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith:
        - \WindowsTerminal.exe
        - \wt.exe
      selection_susp:
      - Image|endswith:
        - \rundll32.exe
        - \regsvr32.exe
        - \certutil.exe
        - \cscript.exe
        - \wscript.exe
        - \csc.exe
      - Image|contains:
        - C:\Users\Public\
        - \Downloads\
        - \Desktop\
        - \AppData\Local\Temp\
        - \Windows\TEMP\
      - CommandLine|contains:
        - ' iex '
        - ' icm'
        - Invoke-
        - 'Import-Module '
        - 'ipmo '
        - DownloadString(
        - ' /c '
        - ' /k '
        - ' /r '
      filter_builtin_visual_studio_shell:
        CommandLine|contains|all:
        - Import-Module
        - Microsoft.VisualStudio.DevShell.dll
        - Enter-VsDevShell
      filter_open_settings:
        CommandLine|contains|all:
        - \AppData\Local\Packages\Microsoft.WindowsTerminal_
        - \LocalState\settings.json
      filter_vsdevcmd:
        CommandLine|contains|all:
        - C:\Program Files\Microsoft Visual Studio\
        - \Common7\Tools\VsDevCmd.bat
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- question: How often has this host fired this Windows Terminal child-process pattern over the past 90 days, and what command-line structures are typical?
  context: A pattern with no prior history on a host is more suspicious than one seen regularly under stable conditions. This query mirrors the rule's full selection structure scoped to this host, so the count reflects the rule's specific firing pattern rather than generic binary usage, and the command-line projection lets you compare typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith:
        - \WindowsTerminal.exe
        - \wt.exe
      selection_susp:
      - Image|endswith:
        - \rundll32.exe
        - \regsvr32.exe
        - \certutil.exe
        - \cscript.exe
        - \wscript.exe
        - \csc.exe
      - Image|contains:
        - C:\Users\Public\
        - \Downloads\
        - \Desktop\
        - \AppData\Local\Temp\
        - \Windows\TEMP\
      - CommandLine|contains:
        - ' iex '
        - ' icm'
        - Invoke-
        - 'Import-Module '
        - 'ipmo '
        - DownloadString(
        - ' /c '
        - ' /k '
        - ' /r '
      filter_builtin_visual_studio_shell:
        CommandLine|contains|all:
        - Import-Module
        - Microsoft.VisualStudio.DevShell.dll
        - Enter-VsDevShell
      filter_open_settings:
        CommandLine|contains|all:
        - \AppData\Local\Packages\Microsoft.WindowsTerminal_
        - \LocalState\settings.json
      filter_vsdevcmd:
        CommandLine|contains|all:
        - C:\Program Files\Microsoft Visual Studio\
        - \Common7\Tools\VsDevCmd.bat
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_*) and _pb_scope
    fields:
