- question: Were any other download or proxy-execution LOLBins used on this host recently?
  context: Operators who use one LOLBin often use several. If certutil or rundll32 was launched here, check whether other download or proxy-execution binaries (mshta, regsvr32, bitsadmin, curl, msiexec, installutil) ran on the host within the same day. Finding multiple LOLBins working toward the same objective strengthens the case for malicious activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\wmic.exe'
          - '\installutil.exe'
          - '\msdt.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was the Windows Terminal profile settings.json or a Startup/Run persistence location modified on this host?
  context: Windows Terminal persistence works by editing the profile settings.json under the user's AppData to launch a payload at logon, which leaves a file write rather than a persistence-tool command line. Checking writes to the Terminal settings.json path, the Startup folder, and registry Run/RunOnce paths captures profile tampering and parallel file-based persistence that bypass command-line detection.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Microsoft.WindowsTerminal_'
          - '\LocalState\settings.json'
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the stages that preceded this execution and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
