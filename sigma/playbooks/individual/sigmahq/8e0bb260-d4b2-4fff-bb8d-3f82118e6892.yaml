name: Potentially Suspicious CMD Shell Output Redirect
id: 090c0a61-cea9-487b-bfdb-131d2d139ca2
description: |
  Detects cmd.exe (matched by image name or original filename) redirecting command output to a file in a user-writable location — EITHER a path under a named writable directory (%APPDATA%, %TEMP%, %TMP%, %USERPROFILE%, C:\ProgramData, C:\Temp, C:\Users\Public, or C:\Windows\Temp) OR a redirect into a user AppData\Local path. Redirecting output with ">" is routine in scripts, but writing the results of reconnaissance commands (hostname, dir, systeminfo, ipconfig, net) to a file in a staging directory is a common way to collect host and environment data for later exfiltration. The investigation should decode which command's output was captured and to what file, confirm what spawned cmd, preserve the staged file, and look at whether the file was followed by further collection or exfiltration activity.
type: detection
detection_id: 8e0bb260-d4b2-4fff-bb8d-3f82118e6892
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-03
questions:
- question: Does this match the rule — cmd.exe redirecting output to a file in a user-writable location?
  context: Confirm the alert before investing time. The rule fires when the image (or original filename) is cmd.exe and the command line redirects output EITHER to a path under a named writable directory (%APPDATA%, %TEMP%, %TMP%, %USERPROFILE%, C:\ProgramData, C:\Temp, C:\Users\Public, C:\Windows\Temp) OR into a user AppData\Local path. Read the full command line and identify which command's output is being captured and the exact destination file; a recon command writing to a staging directory is the pattern that matters.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to redirect command output to files this way?
  context: Build scripts, logging routines, and admin one-liners legitimately redirect output to files. Knowing whether this account and host routinely do so — and to these staging-style locations — helps separate scripted logging from data collection. A redirect on a server doing batch work differs from one on an end-user workstation capturing host details to a temp file.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What command's output was redirected, and to what file?
  context: Decode the full command line. Identify the command on the left of the redirect and the destination file on the right. Reconnaissance commands — hostname, dir, systeminfo, ipconfig, whoami, net, nltest — writing their output to a file in a temp or public directory is host/environment collection staged for later use. Note the destination path so the staged file can be located and preserved.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this cmd, and is that parent chain expected?
  context: A redirect run from an interactive admin shell or a logging script is routine; the same cmd spawned by an Office application, a script host, a download cradle, or a remote-execution tool points to automated collection during an intrusion. The parent's command line shows whether a human or a program drove the redirect, and walking up reconstructs how the activity began.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What file did the redirect write, and can it be preserved for review?
  context: The redirected output is the artifact. Locating the file written to the staging path confirms what was collected and preserves it before an operator deletes it or moves it for exfiltration. The file's name, size, and the process that wrote it tell you whether this is benign logging or a staged collection of host data; capture a copy for review while it still exists.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Is writing files to this staging directory normal on this host?
  context: A directory that regularly receives files from many processes is likely a legitimate working or log location; one that has rarely or never been written to before the alert is a fresh staging spot. Comparing how often this destination directory has been written to historically helps separate routine output from a collection point set up for this activity.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What did this cmd spawn or run afterward?
  context: Collection is usually followed by more collection or by exfiltration. Children of this cmd, or a tight sequence of commands after it, show whether the redirect was one of several recon commands staging data, or whether an archiving or upload tool (a compression utility, a web-request command, or a cloud client) followed to package and move the staged file. A lone benign redirect produces no such follow-on.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host has previously redirected cmd output to a staging location, what parents and users drove it, and does the current alert fit?
  context: Even output redirection has a normal pattern on a given host. This mirrors the rule's pattern scoped to this host, so the parent/user distribution reflects how these redirects have historically run here — a logging script under a service account, an admin in a shell. A new parent process, an unexpected user, or an unusual command structure against that baseline is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \cmd.exe
      - OriginalFileName: Cmd.Exe
      selection_cli_1:
        CommandLine|contains:
        - '>?%APPDATA%\'
        - '>?%TEMP%\'
        - '>?%TMP%\'
        - '>?%USERPROFILE%\'
        - '>?C:\ProgramData\'
        - '>?C:\Temp\'
        - '>?C:\Users\Public\'
        - '>?C:\Windows\Temp\'
      selection_cli_2:
        CommandLine|contains:
        - ' >'
        - '">'
        - '''>'
        CommandLine|contains|all:
        - C:\Users\
        - \AppData\Local\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_img and 1 of selection_cli_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \cmd.exe
      - OriginalFileName: Cmd.Exe
      selection_cli_1:
        CommandLine|contains:
        - '>?%APPDATA%\'
        - '>?%TEMP%\'
        - '>?%TMP%\'
        - '>?%USERPROFILE%\'
        - '>?C:\ProgramData\'
        - '>?C:\Temp\'
        - '>?C:\Users\Public\'
        - '>?C:\Windows\Temp\'
      selection_cli_2:
        CommandLine|contains:
        - ' >'
        - '">'
        - '''>'
        CommandLine|contains|all:
        - C:\Users\
        - \AppData\Local\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_img and 1 of selection_cli_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \cmd.exe
      - OriginalFileName: Cmd.Exe
      selection_cli_1:
        CommandLine|contains:
        - '>?%APPDATA%\'
        - '>?%TEMP%\'
        - '>?%TMP%\'
        - '>?%USERPROFILE%\'
        - '>?C:\ProgramData\'
        - '>?C:\Temp\'
        - '>?C:\Users\Public\'
        - '>?C:\Windows\Temp\'
