- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — reconnaissance, a download cradle, credential access, or defense tampering — may reveal the collection or intrusion stage this redirect belongs to and help reconstruct the timeline. Staging host data to a file is often a precursor to exfiltration, so what follows is as important as what came before.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
