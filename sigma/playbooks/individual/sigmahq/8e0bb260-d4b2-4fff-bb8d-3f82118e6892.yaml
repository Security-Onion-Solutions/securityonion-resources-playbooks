        - C:\Users\
        - \AppData\Local\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_img and 1 of selection_cli_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in a tight window reveals lateral movement or activity spanning multiple endpoints. If the same user staged output or ran recon on other hosts in the same window, the scope is larger than a single machine. This pivot is meaningful only when a real user account fired the alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \cmd.exe
      - OriginalFileName: Cmd.Exe
      selection_cli_1:
        CommandLine|contains:
        - '>?%APPDATA%\'
        - '>?%TEMP%\'
        - '>?%TMP%\'
        - '>?%USERPROFILE%\'
        - '>?C:\ProgramData\'
        - '>?C:\Temp\'
        - '>?C:\Users\Public\'
        - '>?C:\Windows\Temp\'
      selection_cli_2:
        CommandLine|contains:
        - ' >'
        - '">'
        - '''>'
        CommandLine|contains|all:
        - C:\Users\
        - \AppData\Local\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_img and 1 of selection_cli_*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts redirected cmd output to staging locations this way in the past week, and does the distribution look like automation or one-off activity?
  context: This mirrors the rule's pattern with no host scope, giving a fleet-wide count of where these redirects fired. Many hosts at once points to a scripted or deployed routine that logs to these paths; one host or a small unrelated set points to manual or targeted collection. Use the distribution to judge how unusual this single alert is.
  range: -7d
  query: |
    aggregation: true
    logsource:
