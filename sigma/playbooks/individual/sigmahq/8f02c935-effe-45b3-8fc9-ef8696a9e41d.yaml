name: Non-privileged Usage of Reg or Powershell
id: 898d7146-c249-4756-9451-4a1804481b11
description: |
  Detects a non-privileged (Medium integrity) process using reg.exe or PowerShell cmdlets to modify
  service configuration in the registry. The rule fires when the command line contains a reg add or a
  PowerShell item-property write (set-itemproperty, sp, new-itemproperty) AND targets a CurrentControlSet
  Services subtree value such as ImagePath, FailureCommand, or ServiceDLL. Writing these values lets a
  user redirect what a service executes, which is a common route to persistence or privilege escalation;
  legitimate service configuration is normally done by installers or management tooling running at higher
  integrity. Investigation should confirm exactly which service and value were changed, what the new data
  points to, whether the change survives reboot, and whether the user, parent process, and timing are
  consistent with sanctioned administration.
type: detection
detection_id: 8f02c935-effe-45b3-8fc9-ef8696a9e41d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line show a reg add or PowerShell item-property write targeting a service registry value at Medium integrity?
  context: Before investing investigation time, confirm the alert is a true positive. The rule requires
    both halves to match the same event, a reg add or a PowerShell write (set-itemproperty, sp, new-itemproperty)
    AND a path under CurrentControlSet Services touching ImagePath, FailureCommand, or ServiceDLL, all at
    Medium integrity. Read the full command line and confirm both the write verb and the targeted service
    value are present.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - IntegrityLevel
- question: Is this user and host expected to modify service registry configuration from a non-privileged session?
  context: Legitimate service configuration is normally performed by installers or management tooling at
    higher integrity, not by an interactive Medium-integrity user. Knowing whether this account and host
    routinely perform service registry changes is often the fastest way to separate sanctioned administration
    from unauthorized modification.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What process spawned this reg.exe or PowerShell instance, and what started that parent?
  context: The launch chain reveals whether the registry write came from sanctioned tooling or from an
    unexpected origin. A reg or PowerShell write spawned by explorer.exe or a known management agent reads
    differently than one spawned by a script host, Office application, or a freshly dropped binary. Tracing
    the parent's own origin distinguishes routine administration from a write driven by an upstream foothold.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Which service and which value (ImagePath, FailureCommand, or ServiceDLL) were modified, and what data was written?
  context: The specific service subtree and value name determine intent and impact. ImagePath redirects
    what binary the service launches, ServiceDLL redirects the DLL a shared-host service loads, and FailureCommand
    runs an arbitrary command when the service fails. Read the structured registry event linked to this
    process to recover the exact target key path and the value data written, rather than parsing it out of
    the command line. If registry_set events are not collected in this environment, fall back to decoding
    the key and value directly from the alerting command line.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Is the registry write obfuscated, and what does it resolve to once the obfuscation is removed?
  context: This rule fires on readable write verbs, but the service name, value, and data can still be hidden
    with string concatenation, backtick escaping, variable substitution, environment-variable expansion, or
    char-code assembly. Reconstruct the effective command so the true service, value, and target path are
    visible. A command that goes out of its way to obscure a routine configuration change is a meaningful
    deviation from how administrators normally script these edits.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were other reg.exe or PowerShell registry writes made on this host in the same session?
  context: Actors who alter one service value often alter several, or pair the service change with a Run
    key, a Defender setting, or a firewall rule. Finding a cluster of registry writes from reg.exe or PowerShell
    on the same host within a short window reveals the full scope of the configuration change and whether
    multiple objectives were pursued together rather than a single isolated edit.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        CommandLine|contains:
          - 'reg add'
          - 'reg delete'
          - 'set-itemproperty'
          - 'new-itemproperty'
          - 'remove-itemproperty'
      condition: selection and selection_reg
    fields:
      - CommandLine
- question: Does the binary or DLL now referenced by the modified service value exist on disk, and what is it?
  context: A redirected ImagePath or ServiceDLL is only effective if the referenced file is present at the
    path written into the value. Identify the path from the command line, then confirm whether that file
    exists on the host and analyze its hash and signing. A write that points a service at a binary in a
    user-writable directory, or at an unsigned file, indicates an active persistence or escalation mechanism
    rather than a benign reconfiguration.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does this alert fit?
  context: Even routine tools can be abused. This query mirrors the rule's selection structure scoped to
    this host, so the resulting parent and user distribution reflects how this specific service-registry-write
    pattern has historically run here, not generic reg or PowerShell usage. A new parent process, an unexpected
    account, or a first-ever appearance of the pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cli:
      - CommandLine|contains|all:
        - 'reg '
        - add
      - CommandLine|contains:
        - powershell
        - set-itemproperty
        - ' sp '
        - new-itemproperty
      selection_data:
        IntegrityLevel:
        - Medium
        - S-1-16-8192
        CommandLine|contains|all:
        - ControlSet
        - Services
        CommandLine|contains:
        - ImagePath
        - FailureCommand
        - ServiceDLL
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host spread look like automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of this exact service-registry-write pattern rather than generic tool usage. Many hosts firing the
    same pattern points to scripted deployment or vendor automation; a single host or a small unrelated set
    points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cli:
      - CommandLine|contains|all:
        - 'reg '
        - add
      - CommandLine|contains:
        - powershell
        - set-itemproperty
        - ' sp '
        - new-itemproperty
      selection_data:
        IntegrityLevel:
        - Medium
        - S-1-16-8192
        CommandLine|contains|all:
        - ControlSet
        - Services
        CommandLine|contains:
        - ImagePath
        - FailureCommand
        - ServiceDLL
      condition: all of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cli:
      - CommandLine|contains|all:
        - 'reg '
        - add
      - CommandLine|contains:
        - powershell
        - set-itemproperty
        - ' sp '
        - new-itemproperty
      selection_data:
        IntegrityLevel:
        - Medium
        - S-1-16-8192
        CommandLine|contains|all:
        - ControlSet
        - Services
        CommandLine|contains:
        - ImagePath
        - FailureCommand
        - ServiceDLL
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cli:
      - CommandLine|contains|all:
        - 'reg '
        - add
      - CommandLine|contains:
        - powershell
        - set-itemproperty
        - ' sp '
        - new-itemproperty
      selection_data:
        IntegrityLevel:
        - Medium
        - S-1-16-8192
        CommandLine|contains|all:
        - ControlSet
        - Services
        CommandLine|contains:
        - ImagePath
        - FailureCommand
        - ServiceDLL
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around the time of this alert?
  context: Tracking the user's activity across all hosts in the alert window reveals lateral movement or
    coordinated activity on multiple endpoints. If the same account triggered similar service or registry
    changes elsewhere, the scope is larger than a single host and the disposition shifts accordingly.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cli:
      - CommandLine|contains|all:
        - 'reg '
        - add
      - CommandLine|contains:
        - powershell
        - set-itemproperty
        - ' sp '
        - new-itemproperty
      selection_data:
        IntegrityLevel:
        - Medium
        - S-1-16-8192
        CommandLine|contains|all:
        - ControlSet
        - Services
        CommandLine|contains:
        - ImagePath
        - FailureCommand
        - ServiceDLL
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Was the modified service started or restarted, or did a new process execute, shortly after the registry write?
  context: A redirected service value only takes effect when the service runs. Look for a service restart,
    a new svchost-hosted service load, or an unexpected child process on this host in the minutes after the
    write. Execution following the registry change confirms the modification produced an effect rather than
    remaining a dormant configuration edit, and it surfaces what the redirected value actually launched.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the write reveals what led to it and
    what followed, and whether it is part of a larger sequence. Aggregating by Image and ParentImage collapses
    repetitive agent noise into high-count rows while novel parent-child pairs stand out at low counts, which
    is what reconnaissance, privilege escalation, or additional persistence would look like here.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as defense tampering, reconnaissance, or credential
    access, may reveal the attack stages that preceded the service registry write and help reconstruct the
    timeline. Defense tampering or credential access followed by a persistence-oriented registry change is
    a common ordering worth confirming.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was there a change ticket, maintenance window, or documented approval for this service configuration change?
  context: Many organizations require change approval for service and persistence-affecting modifications.
    A corresponding ticket or maintenance window suggests authorized administration; absence of one when policy
    requires it suggests the change was unauthorized. Confirming whether the timing aligns with an approved
    window quickly closes false positives or escalates true positives.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
