name: Unusual File Deletion by Dns.exe
id: f60511cc-11b6-4fd6-bdcb-60527f9f50fc
description: |
  Detects the Windows DNS Server service (dns.exe) deleting a file whose name does not end in
  \dns.log — the rule fires when dns.exe performs a delete AND the target is not the benign DNS
  debug log. dns.exe runs as SYSTEM and has no legitimate reason to remove arbitrary files, so a
  deletion is less an attack in itself than a fingerprint of code executing inside a trusted system
  service — historically through a memory-corruption flaw in the DNS service that yields SYSTEM-level
  code execution (for example CVE-2020-1350, SigRed), or through a malicious module loaded into the
  process. Determine exactly what was removed (log/trace cleanup versus tool self-cleanup), whether
  dns.exe crashed and restarted, what modules it loaded, whether it spawned children or made outbound
  connections it should not, and whether this host is a DNS server or domain controller — then look
  for the follow-on the deletion was meant to enable, such as a dropped binary and new service.
type: detection
detection_id: 8f0b1fb1-9bd4-4e74-8cdf-a8de4d2adfd0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Which file did dns.exe delete, and is it something other than the DNS debug log?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when
    dns.exe deletes a file whose name does not end in \dns.log — the DNS debug log is explicitly
    excluded because its rotation is routine. Review the exact TargetFilename and the responsible
    process on the triggering event to confirm the deleting process really is dns.exe and the removed
    file is not the debug log. Note the full path and extension, since a delete under
    %SystemRoot%\System32, NETLOGON, or SYSVOL carries very different weight from a temp-file cleanup.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this host an authorized DNS server or domain controller where dns.exe is expected to run?
  context: >-
    The DNS Server service runs as SYSTEM, so the acting identity carries no attribution value here —
    User will be a machine or system account and does not distinguish routine activity from tampering.
    The meaningful baseline is the host's role: dns.exe belongs on DNS servers and domain controllers,
    and on that infrastructure a file deletion by the service is still abnormal because dns.exe does
    not delete arbitrary files as part of normal operation. Confirm the host is a sanctioned DNS
    server; a dns.exe process on a machine that has no DNS role is itself the anomaly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this DNS server patched against known DNS Server remote code execution flaws such as CVE-2020-1350?
  context: >-
    A deletion driven from inside dns.exe implies code is executing within the service, which on
    unpatched Windows DNS servers is reachable through memory-corruption vulnerabilities in DNS
    message parsing (CVE-2020-1350, SigRed, is the reference-class flaw). Confirming the host's patch
    level establishes whether a known DNS Server CVE was exploitable and identifies other DNS servers
    at the same patch level that need review. An up-to-date server points the investigation toward a
    loaded module or a zero-day instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: Was an administrator performing DNS maintenance that would explain this deletion?
  context: >-
    The documented benign causes for dns.exe touching a non-debug-log file are narrow: an
    administrator exporting a zone to a custom-named file, or reconfiguring DNS debug logging to write
    to a path with a non-.log extension during troubleshooting. Confirming with the DNS or domain
    administration team whether a planned maintenance action lines up with this deletion is often the
    fastest way to close a false positive or, if no one recalls it, to escalate. If they confirm,
    capture what file and what operation they intended.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What category of file was deleted, and does it look like log cleanup, tool self-cleanup, or routine rotation?
  context: >-
    The alert is a deletion, so the file's content can no longer be read from disk; the investigative
    value is in what was removed and why. Removal of security or DNS trace logs, backups, or shadow
    copies is an anti-forensics signal, while removal of a just-dropped executable is an attacker
    cleaning up staging tooling. Look at the path and name that dns.exe deleted and judge whether it
    matches legitimate maintenance for a DNS server or the erasure of evidence and tooling.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_delete
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did the deleted file exist or execute on this host before it was removed, and is it recoverable?
  context: >-
    A deletion event carries no hash and the content is gone from disk, but the file may have left
    traces before removal. If it ever executed, its hash was recorded on that earlier process event
    and can still be looked up for reputation. Searching backward for the same filename appearing as
    a running image tells you whether a dropped binary was staged and run before dns.exe erased it;
    on-disk recovery may still be possible from Volume Shadow Copies, backups, or the recycle bin.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: What other files did dns.exe write or delete around the alert?
  context: >-
    A single deletion is rarely the whole action. Code running inside dns.exe commonly writes a
    payload — often an executable into %SystemRoot%\System32 or a script into NETLOGON or SYSVOL on a
    domain controller — before or after cleaning up. Enumerating every file the same process touched
    in the surrounding window distinguishes an isolated deletion from a drop-and-clean sequence and
    lists exactly which additional artifacts need review. The breadth and the destination paths of
    that activity are the signal.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What was written to System32, NETLOGON, or SYSVOL on this host recently, and by which processes?
  context: >-
    Exploitation of a DNS server that is also a domain controller typically stages a malicious
    executable in the System32 DNS directory or System32 itself, or plants a script in the NETLOGON
    or SYSVOL replication shares to spread across the domain. Reviewing recent writes to these
    sensitive directories, grouped by the writing process, reveals whether an unfamiliar writer placed
    files there around the deletion. A process other than trusted installers or replication services
    writing to these paths is what to focus on.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - '\System32\dns\'
          - '\System32\'
          - '\NETLOGON\'
          - '\SYSVOL\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What modules did dns.exe load around the deletion, and were any unsigned or from unusual paths?
  context: >-
    One route to running code inside the DNS service is loading a malicious module into it, so the
    modules dns.exe loaded near the deletion are directly relevant. A legitimate DNS service loads a
    known set of signed system libraries from System32; an unsigned module, a load from a
    user-writable or temporary path, or a library that does not belong to the DNS role points to
    injected code. Module load events carry the signature state directly, so the signed status and
    load path together separate normal service startup from an implanted module.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
- question: Did dns.exe spawn any child processes around the deletion?
  context: >-
    The DNS Server service does not spawn child processes as part of normal operation, so any process
    whose parent is dns.exe is a strong sign that code executing inside the service reached out to a
    command interpreter or tool. Command shells, script hosts, or living-off-the-land binaries
    launched by dns.exe indicate hands-on-keyboard or automated post-exploitation from within the
    SYSTEM service. An empty result is the expected, benign outcome; any child at all is worth
    running down.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is the deleting process the legitimate System32 dns.exe launched by services.exe, or a masquerading binary?
  context: >-
    The genuine DNS service is C:\Windows\System32\dns.exe started by services.exe under SYSTEM. A
    process named dns.exe that runs from another directory, or that has a parent other than
    services.exe, is a masquerade rather than the real service and changes the investigation entirely.
    Confirm the image path and parent of the alerting process match the expected service lineage; a
    deviation means a look-alike binary, not exploitation of the DNS role.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did dns.exe restart around this time, consistent with a service crash and auto-recovery?
  context: >-
    Memory-corruption exploitation of the DNS service frequently crashes the process, after which the
    service control manager restarts it automatically. A new dns.exe process start close to the
    deletion is consistent with that crash-and-recover pattern and helps place the exploitation in
    time. Look for a fresh dns.exe launch near the alert; repeated restarts point to unstable
    exploitation attempts against the service.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ProcessGuid
      - User
      - CommandLine
- question: Did dns.exe make outbound connections to non-DNS ports or unusual destinations around the deletion?
  context: >-
    dns.exe legitimately opens outbound connections for recursive resolution, almost always to
    UDP/TCP 53 (and 853 for encrypted DNS). An outbound connection from dns.exe to a different port or
    to an external address that is not an upstream resolver suggests code inside the service is
    reaching a command-and-control endpoint or staging a download. This query excludes standard DNS
    ports so that non-resolution egress stands out; correlate any remaining destinations against known
    upstream forwarders.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      filter:
        DestinationPort:
          - 53
          - 853
      condition: selection and not filter
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: Was a new Windows service installed on this host around the deletion?
  context: >-
    A common objective after gaining code execution in dns.exe on a domain controller is to register
    a new service so the foothold survives a reboot. Because the install can be driven directly from
    inside the exploited process, it may not spawn a separate service-control command line, so the
    service-installation record is the more reliable evidence. A new service whose executable is an
    unexpected or freshly dropped binary, appearing near the deletion, ties the file activity to a
    persistence step.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4697
      condition: selection
    fields:
      - ServiceName
      - ServiceFileName
      - ServiceAccount
      - ServiceType
- question: Were persistence tools run on this host in the surrounding window?
  context: >-
    Alongside a service registered from within the process, an operator may also establish persistence
    through the usual command-line tooling. Executions of schtasks.exe, sc.exe, reg.exe, bitsadmin.exe,
    or wmic.exe on this host near the deletion indicate scheduled tasks, services, Run keys, BITS jobs,
    or WMI subscriptions were being installed. This complements the service-installation record by
    catching the persistence methods that do go through a spawned process.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A deletion driven from inside a system service rarely happens in isolation. Aggregating process
    activity in a tight window around the alert surfaces what ran before and after — reconnaissance,
    credential access, or staging on the DNS server or domain controller. Novel parent-child pairs
    stand out at low counts against the high-count routine telemetry of a busy server, and that is
    what points to activity connected to the deletion.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: When this host previously produced this pattern, dns.exe deleting a non-log file, what drove it?
  context: >-
    Even a service that runs constantly rarely deletes non-log files, so the history of this exact
    pattern on this host is the relevant baseline rather than how often dns.exe runs. The query mirrors
    the rule's selection scoped to this host, so the program and account distribution reflects how this
    specific deletion pattern has fired here before. Expect the Image column to show dns.exe itself and
    the account to be a system principal; a host with no prior history of this pattern makes the current
    alert a first-time deviation worth chasing. File-delete events carry no parent lineage - pivot to
    dns.exe's start event if lineage matters.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: file_delete
      product: windows
    detection:
      selection:
        Image|endswith: \dns.exe
      filter:
        TargetFilename|endswith: \dns.log
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts seen dns.exe delete a non-log file in the past week?
  context: >-
    The same pattern across several DNS servers in a short span points to opportunistic or automated
    exploitation of a shared vulnerability rather than a one-off event on a single host. The query
    mirrors the rule's selection with no host scope, giving a fleet-wide count of dns.exe deleting
    non-log files. Many hosts firing the pattern together raises the priority toward a coordinated
    campaign against the DNS role; a single isolated host keeps the focus local.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_delete
      product: windows
    detection:
      selection:
        Image|endswith: \dns.exe
      filter:
        TargetFilename|endswith: \dns.log
      condition: selection and not filter
    fields:
    - host.name
