name: Suspicious Space Characters in TypedPaths Registry Path - FileFix
id: 581dcb80-e8db-4f79-af02-90ed27a0f8b2
description: |
  Detects a registry write to HKCU\...\Explorer\TypedPaths\url1 whose value data contains both a
  '#' character and a long run of space characters. TypedPaths records the paths a user types into
  the Explorer address bar (url1 is the most recent), so a genuine entry is a short file-system
  path; a value carrying a comment marker plus dozens of padding spaces is the fingerprint of a
  copy-paste social-engineering lure. The attacker instructs the user to paste a string into the
  address bar that looks like a benign file path but is actually a command: the visible portion is
  a path or a '#' comment while the real payload is pushed out of view by whitespace padding,
  because the address bar auto-scrolls to the end. Explorer then runs the concealed command,
  typically spawning a command interpreter that stages and executes a payload. Investigate the exact
  value data written, decode the concealed command, identify the process that wrote it and what it
  spawned, and determine whether files were dropped or outbound connections followed.
type: detection
detection_id: 8f2a5c3d-9e4b-4a7c-8d1f-2e5a6b9c3d7e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the alerting TypedPaths\url1 value contain both a '#' marker and a long run of space characters?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a
    write to a value ending in \Explorer\TypedPaths\url1 has Details that contains a '#' character
    AND a long run of space characters together. A path a user genuinely types into the address bar
    is short and carries neither a comment marker nor whitespace padding, so both conditions matching
    at once is the concealed-command pattern rather than normal address-bar use. Review the exact
    TargetObject and the full Details value on the triggering event to confirm both elements are
    present.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which value was written, and what is the TypedPaths address-bar key used for?
  context: >-
    The TypedPaths key under HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer records the
    paths a user typed into the Explorer address bar, with url1 holding the most recent entry.
    Explorer writes this value as a side effect of address-bar navigation, so the key itself is
    normal; the anomaly is value data that carries a comment marker and whitespace padding instead
    of a plain file path. The exact TargetObject, Details value, and writing process together tell
    you what was entered and by which process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What command is concealed in this value once the whitespace padding is stripped?
  context: >-
    Read the full Details value on the triggering write. Removing the space padding reveals the text
    the user actually pasted: the visible portion is usually a benign-looking file path or a '#'
    comment, while the concealed portion is a command interpreter invocation. Look for the position
    of the '#' comment marker and the interpreter reference, base64 or encoded-command flags, and
    references to script hosts or download primitives. The dense run of space characters and the
    comment marker are themselves the obfuscation the rule keys on, so a high count of padding
    characters is expected here. Details is present on roughly 79% of registry modifications.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Is this user and host expected to enter this kind of value into the Explorer address bar?
  context: >-
    A normal address-bar entry is a short path to a folder or share. Knowing whether the account and
    host routinely see this activity helps separate an ordinary typed path from a pasted lure that a
    user was socially engineered into running. User attribution is present on roughly 94% of endpoint
    registry events; when it is a machine account or missing, pivot on the writing process instead.
    Confirm whether the account and host function are consistent with someone pasting a command-style
    string into Explorer.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What process wrote this value, and is its parent chain consistent with normal address-bar navigation?
  context: >-
    The writing process and its parent reveal how the value was entered. explorer.exe writing
    TypedPaths as part of interactive address-bar navigation is the normal path; a write attributed
    to a non-explorer process, or an explorer instance launched from an unusual parent, points to a
    programmatically staged value rather than a user typing a folder path. Compare the writer and its
    immediate parent against what a routine interactive session looks like on this host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - ParentImage
      - ParentCommandLine
- question: Did the writing session spawn a command interpreter carrying a pasted one-liner?
  context: >-
    The concealed command runs by spawning an interpreter as a child of the process that wrote the
    address-bar value. This query returns child processes of the writer whose command line carries
    the markers of a pasted one-liner — encoded-command flags, base64 decoding, in-memory execution,
    a headless console launch, or download primitives. A conhost.exe launched with a headless option,
    or a powershell.exe or cmd.exe child bearing these markers, is the execution the whitespace
    padding was hiding. The interpreter's full command line is the payload to decode; command-line
    entropy and escape-character density are the tuning signals for what counts as obfuscated here.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_lineage:
        ParentProcessGuid|expand: '%ProcessGuid%'
      selection_patterns:
        CommandLine|contains:
          - '-enc'
          - 'FromBase64String'
          - 'IEX('
          - 'Invoke-Expression'
          - 'DownloadString'
          - 'Invoke-WebRequest'
          - '--headless'
      condition: selection_lineage and selection_patterns
    fields:
      - Image
      - CommandLine
- question: Did the writing process or its children drop files to user-writable locations?
  context: >-
    A pasted one-liner frequently stages a payload on disk before running it — a script, archive, or
    executable written under a user-writable path such as %TEMP%, %APPDATA%, or %PUBLIC%. Correlating
    file writes by the writing process and its children reveals whether a first-stage payload was
    dropped in the same session and where it lives, enabling retrieval and deeper analysis. File
    writes carry no hash on the write event; if a dropped file later executes, its hash appears on
    that execution.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did outbound network connections follow on this host shortly after the write?
  context: >-
    User-execution lures commonly reach out after the interpreter runs — to retrieve a second stage,
    resolve a payload host, or begin command and control. Reviewing outbound connections from the host
    in the window after the write surfaces this egress; corporate update and proxy ranges can be
    treated as expected and set aside, leaving first-run connections to previously unseen destinations
    as the signal. Some variants of this technique deliberately avoid network requests by reading a
    payload the browser already cached, so an absence of egress does not clear the alert on its own.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
- question: Has this TypedPaths value carried a padded or comment-style entry before on this host?
  context: >-
    url1 changes routinely as a user navigates the address bar, so prior writes are expected — the
    question is what the historical values looked like. A history of short folder and share paths with
    no comment markers or whitespace padding makes this padded, command-style entry a first-time
    occurrence and raises its weight. Compare the historical Details values to see whether anything
    resembling this concealed-command pattern was entered before.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Did the same detection fire on other hosts or for other users?
  context: >-
    Copy-paste lures are delivered to many recipients at once, so a single user rarely sees the
    technique in isolation. Correlating this detection across hosts and users shows how many systems
    received and acted on the same lure, which distinguishes a targeted one-off from a wider
    distribution and identifies additional systems that need investigation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What application or page led the user to paste this value?
  context: >-
    The lure that produces this value usually arrives through a browser or a document that instructs
    the user to open Explorer and paste a supplied string into the address bar. Identifying the parent
    application and its command line points at the delivery surface — the page or file that carried the
    instructions — which enables blocking it and searching for other recipients. Note which parents can
    legitimately be in this lineage versus a browser or document that should not be driving address-bar
    input.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A pasted-command lure rarely happens in isolation. Aggregating process activity in a tight window
    around the write surfaces what led up to it and what ran immediately after. Novel parent-child
    pairs stand out at low counts against high-count routine telemetry, which is what points to
    staging, execution, or follow-on activity around the address-bar write. The correlation window
    from the write to child and follow-on behavior is the tuning parameter for how tight to hold this.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — reconnaissance, delivery of a document or link, or other
    execution activity — may reveal the stages that preceded this write and help reconstruct the
    timeline. Placing the address-bar write within a sequence of prior alerts clarifies whether it is
    the first observed step or a continuation of activity already underway.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: What other registry modifications were made on this host in the same window?
  context: >-
    Execution triggered from a pasted command often touches the registry beyond this one value —
    staging configuration, establishing persistence, or weakening a protection. Clustering registry
    writes on this host in a short window around the alert reveals the full scope of changes and which
    process made them. The triggering value appears in the results; the signal is what else was
    modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Was this value later overwritten by a normal path, or re-set with another padded entry?
  context: >-
    Registry value deletions are not observable in this telemetry, so durability is judged from the
    key's re-modification history rather than a delete event. Look at later writes to url1 over the
    following window: a subsequent short folder path suggests the user resumed normal navigation after
    a one-time paste, while another comment-and-padding value would indicate the technique was repeated.
    Pair this with whether the concealed command actually spawned an interpreter, since the execution —
    not the persistence of the value — is what determines impact.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
