name: User Shell Folders Registry Modification via CommandLine
id: ce322a6c-f767-426b-a0d7-6a6778832e5b
description: |
  Detects reg.exe or PowerShell command lines that modify User Shell Folders or Shell Folders registry values referencing the Startup location. The rule fires only when all of the following match together: the binary is powershell.exe, pwsh.exe, or reg.exe; the command line contains a write verb (' add ', New-ItemProperty, Set-ItemProperty, or 'si '); the command line references the Explorer Shell Folders or User Shell Folders key; and the command line references Startup. Redirecting the Startup folder path to an attacker-controlled location causes anything dropped there to execute at logon, a common persistence and defense-evasion technique; the same command structures also occur in legitimate profile or roaming configuration. The investigation should determine which registry value was changed, what path it now points to, whether a payload exists at that path, and whether the user, host, and timing make the change expected.
type: detection
detection_id: 8f3ab69a-aa22-4943-aa58-e0a52fdf6818
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line match what this rule detects — a Shell Folders or User Shell Folders Startup value being written via reg.exe or PowerShell?
  context: Confirm the alert is a true positive before investing time. The rule requires all four conditions together, so check the triggering event for powershell.exe, pwsh.exe, or reg.exe with a write verb (' add ', New-ItemProperty, Set-ItemProperty, or 'si '), a reference to the Explorer Shell Folders or User Shell Folders key, and the Startup token. Note the value name being written and the path it is being set to.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to modify Startup-related Shell Folders registry values?
  context: Legitimate profile setup, roaming-profile tooling, and some imaging workflows touch these keys, but routine end-user activity does not. Knowing whether the account is an administrator or service account and whether the host is a workstation, server, or build/imaging system is often the fastest way to separate expected configuration from persistence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Was there a change ticket, maintenance window, or documented approval for this registry change?
  context: Redirecting the Startup folder or other Shell Folders values is the kind of system modification that change management usually covers. A corresponding ticket or deployment record points to authorized activity; its absence when policy requires one moves the disposition toward unauthorized persistence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the parent that launched this reg.exe or PowerShell expected, and what started that parent?
  context: The parent-child relationship attributes who drove the registry change. A logon-time interactive shell or a deployment agent is a different story from mshta.exe, wscript.exe, an Office application, or an unfamiliar loader spawning the binary. Tracing the parent's own origin reveals whether the chain is a user action, automation, or an exploitation path.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did the same parent spawn around this time?
  context: A parent that launched this registry change may have launched other stages. Multiple children from one parent in a short window — a download, a script host, additional registry or service tools — points to orchestrated activity rather than an isolated administrative command.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What specific Shell Folders value was set, and what path or payload does it now reference?
  context: The value name and data determine intent. Reading the registry_set event linked to this process gives the actual key path and the written value as structured fields instead of parsing them from the command line. A Startup value redirected to a user-writable or unusual directory (for example a public, temp, or downloads path) is the persistence-relevant change; confirm both the value name and the destination it now points to.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: If PowerShell was used, was the command encoded or obfuscated, and what does it decode to?
  context: When the binary is powershell.exe or pwsh.exe, the registry write may be wrapped in -EncodedCommand (-enc), string concatenation, backtick escaping, or variable substitution to hide the target path. Decode any base64 or obfuscated content to recover the literal key, value, and destination path being written. If the binary is reg.exe, the command is already readable and this step is a quick confirmation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the full deobfuscated script content?
  context: Script block logging records the deobfuscated script PowerShell actually executed, even when the command line is encoded, giving ground truth about the exact key and path written. If PowerShell operational logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence nothing ran, and decode the registry write from the alerting command line directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Does a payload exist at the path the redirected Startup value points to, and what is its hash?
  context: This registry persistence is only effective if an executable or script sits at the path written into the Startup value. Checking whether a file was created at that destination and analyzing its hash determines whether the persistence is live and what would run at the next logon. Resolve the destination path from the registry value data, then look for file creations there.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Were other registry modifications made on this host in the same session?
  context: Operators who change one persistence or evasion key often change several. Finding additional reg.exe or PowerShell registry writes from the same host in a short window reveals whether multiple objectives were pursued — stacking persistence, disabling protection, or altering policy — alongside this Startup redirection.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
          - '\powershell.exe'
          - '\pwsh.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - 'New-ItemProperty'
          - 'Set-ItemProperty'
          - 'Remove-ItemProperty'
      condition: selection and selection_reg
    fields:
      - CommandLine
- question: When this host previously fired this rule's pattern, what parents and users drove it, and does the current alert fit?
  context: The query mirrors the rule's full selection scoped to this host, so the parent and user distribution reflects how this specific Startup-redirect pattern has historically run here — not generic use of the binaries. A new parent process, an unexpected account, or a first-ever appearance of the pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \reg.exe
      - OriginalFileName:
        - powershell.exe
        - pwsh.dll
        - reg.exe
      selection_cli_action:
        CommandLine|contains:
        - ' add '
        - New-ItemProperty
        - Set-ItemProperty
        - 'si '
      selection_cli_paths_root:
        CommandLine|contains:
        - \Software\Microsoft\Windows\CurrentVersion\Explorer\Shell Folders
        - \Software\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders
      selection_cli_paths_suffix:
        CommandLine|contains: Startup
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \reg.exe
      - OriginalFileName:
        - powershell.exe
        - pwsh.dll
        - reg.exe
      selection_cli_action:
        CommandLine|contains:
        - ' add '
        - New-ItemProperty
        - Set-ItemProperty
        - 'si '
      selection_cli_paths_root:
        CommandLine|contains:
        - \Software\Microsoft\Windows\CurrentVersion\Explorer\Shell Folders
        - \Software\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders
      selection_cli_paths_suffix:
        CommandLine|contains: Startup
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \reg.exe
      - OriginalFileName:
        - powershell.exe
        - pwsh.dll
        - reg.exe
      selection_cli_action:
        CommandLine|contains:
        - ' add '
        - New-ItemProperty
        - Set-ItemProperty
        - 'si '
      selection_cli_paths_root:
        CommandLine|contains:
        - \Software\Microsoft\Windows\CurrentVersion\Explorer\Shell Folders
        - \Software\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders
      selection_cli_paths_suffix:
        CommandLine|contains: Startup
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the account's activity across all hosts reveals whether this registry change is isolated or part of movement across endpoints. The same user driving similar activity on multiple hosts widens the likely scope.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \reg.exe
      - OriginalFileName:
        - powershell.exe
        - pwsh.dll
        - reg.exe
      selection_cli_action:
        CommandLine|contains:
        - ' add '
        - New-ItemProperty
        - Set-ItemProperty
        - 'si '
      selection_cli_paths_root:
        CommandLine|contains:
        - \Software\Microsoft\Windows\CurrentVersion\Explorer\Shell Folders
        - \Software\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders
      selection_cli_paths_suffix:
        CommandLine|contains: Startup
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired this rule's pattern in the past week, and does the spread look like automation or one-off activity?
  context: The query mirrors the rule's full selection with no host scope, giving a fleet-wide count of the Startup-redirect pattern rather than generic use of the binaries. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \reg.exe
      - OriginalFileName:
        - powershell.exe
        - pwsh.dll
        - reg.exe
      selection_cli_action:
        CommandLine|contains:
        - ' add '
        - New-ItemProperty
        - Set-ItemProperty
        - 'si '
      selection_cli_paths_root:
        CommandLine|contains:
        - \Software\Microsoft\Windows\CurrentVersion\Explorer\Shell Folders
        - \Software\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders
      selection_cli_paths_suffix:
        CommandLine|contains: Startup
      condition: all of selection_*
    fields:
    - host.name
- question: Were other process-based persistence mechanisms installed on this host?
  context: Operators rarely rely on a single foothold. After redirecting the Startup folder, they commonly install backups via scheduled tasks, services, or BITS jobs. Persistence-tool executions clustered in the same timeframe indicate intentional stacking rather than an isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Did other detections fire on this host in the hours before this alert?
  context: Persistence is usually one stage of a longer sequence. Earlier detections on the same host — defense tampering, reconnaissance, credential access, or a payload download — help reconstruct what preceded the registry change and whether it sits inside a multi-stage operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
