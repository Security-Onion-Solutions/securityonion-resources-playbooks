name: Potential Persistence Via MyComputer Registry Keys
id: 3a4369eb-5b52-4d75-a079-254ff00f7caa
description: |
  Detects a registry write that sets the (Default) value under a key beneath
  \Microsoft\Windows\CurrentVersion\Explorer\MyComputer — the TargetObject both contains the
  MyComputer path and ends with (Default). These subkeys map shell verbs and utility actions
  (Disk Cleanup runs CleanupPath, Defrag runs DefragPath, Backup runs BackupPath) to the programs
  Windows launches when the user interacts with the This PC / My Computer shell object; replacing a
  (Default) value points that action at an attacker-chosen command, and some of these paths
  auto-elevate, so the same edit can also serve as a UAC bypass. Legitimate writes are rare and
  generally come from an installer registering a shell verb. The persistence fires on the user's
  shell interaction rather than at write time, so no execution yet is expected and is not an
  all-clear. Investigate the command written to the value's data, the process and parent that wrote
  it, whether the referenced payload exists on disk or has since run, and whether other shell or COM
  hijack locations were modified in the same window.
type: detection
detection_id: 8fbe98a8-8f9d-44f8-aa71-8c572e29ef06
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the alerting registry write set the (Default) value under a MyComputer Explorer key?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires when a registry value
    whose path contains \Microsoft\Windows\CurrentVersion\Explorer\MyComputer AND ends with
    (Default) is written. Review the exact TargetObject and the value data on the triggering event to
    confirm both conditions hold and to identify which MyComputer subkey — for example the Disk
    Cleanup, Defrag, or Backup action — received the write, since that determines which shell action
    now runs the configured command.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify MyComputer Explorer shell keys?
  context: >-
    Writes to these keys are rare outside of installers that register a shell verb, typically on a
    defined set of hosts and by a small set of accounts. Knowing whether the writing account and host
    function match a known deployment is often the fastest way to separate a sanctioned change from a
    hijack. User attribution is present on roughly 94% of endpoint registry events; when it is a
    machine account or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Was there a change ticket, maintenance window, or documented approval for this registry change?
  context: >-
    Many organizations require change records for system modifications, especially persistence and
    shell-configuration changes. A corresponding ticket or an active maintenance window suggests
    authorized activity; absence of one when policy requires it suggests the change was unauthorized.
    This check can quickly close a false positive or escalate a true positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this method of changing shell keys consistent with how your organization deploys such changes?
  context: >-
    Organizations have standard procedures — software deployed through managed packaging, shell and
    registry settings pushed via group policy. A direct command-line write to a MyComputer shell key
    with reg.exe or powershell.exe may indicate an attacker bypassing normal tooling, or an
    administrator taking a shortcut. Understanding the normal procedure helps distinguish the two.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which MyComputer subkey was modified, and what shell action does it control?
  context: >-
    The specific subkey determines what triggers the configured command. Keys beneath the MyComputer
    path map utility actions to the binaries Windows launches when the user invokes that action from
    the This PC shell object — CleanupPath backs Disk Cleanup, DefragPath backs Defrag, BackupPath
    backs Backup. The (Default) value under one of these keys is the command that will run;
    identifying which action was retargeted tells you what user interaction triggers execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What command was written to the value's data, and what does it launch?
  context: >-
    The value data holds the command Windows will execute for the retargeted shell action — the
    highest-value artifact on the event. Read the Details field and decode it into interpreter,
    arguments, and the target binary path. Legitimate values point at a system utility under System32
    such as cleanmgr.exe or dfrgui.exe; a path into a user-writable location such as Temp, AppData, or
    ProgramData, or a script interpreter carrying arguments, points to a planted command. Details is
    present on roughly 79% of registry modifications and is absent only for binary or empty value
    data.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote this value, and is its parent chain expected?
  context: >-
    The registry event carries no command line, so identify the writing process and its parent to
    understand how the change was made. An installer registering a shell verb has predictable lineage;
    a reg.exe or powershell.exe write whose parent is a script host such as wscript.exe or mshta.exe,
    an Office application, or an unsigned binary points to scripted tampering rather than a sanctioned
    install.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
- question: Is the binary referenced by the value present on disk, and was it dropped in this session?
  context: >-
    The persistence only executes if the command's target binary exists at the referenced path.
    Correlating file activity by the writing process and its children surfaces whether that payload
    was created in the same session as the registry write — a planted command usually lands alongside
    the key edit. The file-write event carries no hash; if the payload is present, hash it from a
    later execution or retrieve it for a reputation lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did the configured command subsequently execute on this host?
  context: >-
    This persistence fires when the user interacts with the corresponding shell action rather than at
    write time, so no execution yet is expected and is not an all-clear. The query matches process
    starts whose command line carries the value data written to the key. Execution confirms the
    hijack is live; absence means it is armed and waiting for the user to trigger the shell action.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|expand: '%Details%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: After this write, was the same MyComputer value re-modified or restored on this host?
  context: >-
    Registry key and value deletions are not observable in this telemetry, so durability is judged
    from the value's re-modification history rather than a delete event. Look at later writes to the
    same value: a single write that is never restored leaves the hijack in place, while a later write
    returning it to the original system-utility path indicates the change was reverted by remediation
    or a policy refresh. Repeated flipping of the value can indicate automation fighting a manual
    change.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor who hijacks one shell action often changes several keys in the same operation —
    additional persistence values, security policy settings, or other shell verbs. Clustering the
    registry writes on this host in a short window around the alert reveals the full scope of the
    change and which process made each write. The triggering key appears in the results; the signal is
    what else was modified.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Were other shell-verb or COM command keys modified on this host around the same time?
  context: >-
    The MyComputer keys are one of several registry locations where a (Default) command value controls
    what runs on a shell interaction. Writes to shell\open\command entries, CLSID command subkeys, or
    the Explorer command store in the same window suggest multiple shell or COM hijacks were staged
    together rather than a single isolated change.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_hijack:
        TargetObject|contains:
          - '\shell\open\command'
          - '\shell\runas\command'
          - '\Classes\CLSID\'
          - '\Explorer\CommandStore\shell\'
          - '\CurrentVersion\Explorer\MyComputer'
      condition: selection and selection_hijack
    fields:
      - TargetObject
      - Details
      - Image
- question: Has this MyComputer value been modified before on this host?
  context: >-
    The (Default) values under these keys are set at install time and then rarely change. A history
    that shows no prior writes makes this a first-time change and raises its weight; a history of
    periodic writes to the same value points to a management or installer process that routinely sets
    it. Compare the historical Details values to see whether the same command was set before or
    whether this path is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same MyComputer value modified on other hosts in the environment?
  context: >-
    The same write across many hosts suggests a centrally deployed application or a management action;
    the same write confined to one host suggests a targeted change. Compare the Details values across
    hosts to see whether they all set the same command and whether the writing process is consistent
    with a software deployment or with ad-hoc tampering.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A persistence write rarely happens in isolation. Aggregating process activity in a tight window
    around the alert surfaces what led up to the change and what ran immediately after. Novel
    parent-child pairs stand out at low counts against high-count routine telemetry, which is what
    points to reconnaissance, execution, or staging around the configuration change.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — reconnaissance, execution of scripting tools, or defense
    tampering — may reveal the stages that preceded this change and help reconstruct the timeline.
    Establishing persistence often follows initial access and execution, and prior alerts help place
    this registry edit within that sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Attackers rarely rely on a single persistence mechanism. Scheduled tasks, services, registry Run
    keys, BITS jobs, or WMI subscriptions created by schtasks.exe, sc.exe, reg.exe, bitsadmin.exe, or
    wmic.exe near the shell-verb hijack indicate the change was part of a broader footholding effort
    rather than an isolated edit.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely — dropping an executable or script
    into a Startup folder or a path referenced by a registry Run key achieves persistence without
    invoking schtasks, sc, or reg. File writes to these locations near the shell-verb hijack indicate a
    parallel persistence mechanism was established alongside it.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
