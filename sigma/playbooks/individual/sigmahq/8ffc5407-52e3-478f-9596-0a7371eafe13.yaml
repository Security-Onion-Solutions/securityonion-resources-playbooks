name: Disable PUA Protection on Windows Defender
id: 797532a5-bc87-431f-84c4-3bc0845e1c94
description: |
  Detects a registry write that sets the Windows Defender PUAProtection policy value to DWORD
  0x00000000 — a TargetObject ending in \Policies\Microsoft\Windows Defender\PUAProtection with
  value data of 0. PUA (Potentially Unwanted Application) protection blocks adware, bundleware,
  cryptominers, and dual-use tooling that Defender would otherwise quarantine; setting the policy
  value to 0 turns that specific detection class off (the change generally takes effect
  immediately). This is a narrower act than disabling real-time protection — it clears the way for
  tooling Defender flags as PUA rather than removing scanning entirely. Legitimate changes come
  from policy management or an administrator unblocking a flagged-but-sanctioned tool; malicious
  use disables the class so PUA-classified tooling can run without being quarantined. Investigate
  which value was written, the process and command that wrote it, whether other Defender
  protections were weakened in the same window, whether the control is now disabled, and what ran
  afterward that PUA protection would have blocked.
type: detection
detection_id: 8ffc5407-52e3-478f-9596-0a7371eafe13
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the alerting registry write set the Windows Defender PUAProtection value to DWORD 0?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a
    registry value whose path ends in \Policies\Microsoft\Windows Defender\PUAProtection is written
    with Details of DWORD (0x00000000). Review the exact TargetObject and Details on the triggering
    event to verify the value data is 0 (off), rather than 1 (on) or 2 (audit), and note the writing
    process shown alongside it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to change Windows Defender PUA protection policy?
  context: >-
    Legitimate changes to the PUA protection class happen through policy management or a deliberate
    administrator action — often to unblock a flagged-but-sanctioned tool — typically on a defined
    set of hosts and by a small set of accounts. Knowing whether the writing account and host
    function match that expectation is often the fastest way to separate a sanctioned configuration
    change from tampering. User attribution is present on roughly 94% of endpoint registry events;
    when it is a machine account or missing, pivot on the writing process instead. Expected
    administrative tooling and the accounts that run it form the baseline that separates routine
    changes from evasion.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which registry value was modified, and does the path confirm a Windows Defender policy change?
  context: >-
    The registry path reveals intent. A value under \Policies\Microsoft\Windows Defender\PUAProtection
    controls the Defender detection policy for potentially unwanted applications; it is a security-tool
    policy location, distinct from persistence keys such as Run/RunOnce or Image File Execution Options.
    Confirm the TargetObject is the PUAProtection policy value and read the writing process, so the
    change is not confused with an unrelated Defender setting or a benign per-user preference.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value data was written to the PUAProtection value, and does it disable the protection?
  context: >-
    Read the Details field on the triggering write. A DWORD of 0x00000000 turns the PUA detection
    class off, 1 enables it, and 2 places it in audit-only mode where PUAs are logged but not blocked.
    Details is present on roughly 79% of registry modifications and is absent only for binary or empty
    value data, so for this DWORD policy value it should be populated. Confirm the value is 0 and note
    whether it disables blocking outright or drops to audit-only.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: After this write, was the PUAProtection value re-set, reverted, or re-enabled on this host?
  context: >-
    Registry key or value deletions are not observable in this telemetry, so durability is judged from
    the value's re-modification history rather than from a delete event. Look at later writes to the
    same value over the following window: a single 0 write that is never restored leaves the protection
    off, while a later write of 1 would indicate the class was re-enabled (by remediation, policy
    refresh, or an administrator). Repeated flip-flopping of the value can indicate a policy fighting a
    manual change.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What command performed this registry write, and how was PUA protection set to 0?
  context: >-
    The registry event carries no command line, so pivot to the writing process by its ProcessGuid to
    read the full command that made the change. This distinguishes a reg.exe write or a PowerShell
    Set-MpPreference -PUAProtection Disabled one-liner from a policy-driven write, and reveals whether
    the same invocation touched other Defender values (exclusions, real-time monitoring, tamper
    protection) rather than PUAProtection alone. Decode the arguments to identify exactly which value
    and data were written.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process wrote this value, and is its parent chain expected?
  context: >-
    The writing process and its parent reveal how the change was invoked. Policy-driven changes and
    administrator actions have predictable lineage (management agents, services.exe, an interactive
    console launched from explorer.exe). A reg.exe or powershell.exe write whose parent is an Office
    application, a script host such as wscript.exe or mshta.exe, or an unsigned binary points to
    scripted evasion rather than a sanctioned configuration change.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
- question: Is Windows Defender PUA protection currently disabled on this host, or has it been restored?
  context: >-
    The change may be a transient step or a lasting configuration. Unlike settings that require a
    reboot, the PUAProtection policy generally takes effect immediately, so the current running state
    usually matches the registry value at the time of the write. Confirm whether PUA protection is
    presently enforcing on the host through direct inspection or endpoint tooling; if it is off or in
    audit-only mode, PUA-classified tooling can run on the host without being quarantined and the
    control should be restored.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What activity occurred on this host after PUA protection was disabled?
  context: >-
    Turning off PUA protection is usually a means to an end — running adware, bundleware,
    cryptominers, or dual-use tooling that Defender would otherwise quarantine as potentially unwanted.
    Because the change takes effect immediately, execution in the minutes after the write is the key
    correlation: examining process activity in that window reveals what the change was meant to enable.
    New or rarely seen binaries appearing shortly after the write tie the registry edit to a larger
    operation.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense-tampering actions performed on this host?
  context: >-
    An actor who turns off PUA protection often weakens several Defender controls in the same operation
    — adding scan exclusions, disabling real-time monitoring, turning off tamper protection, or
    stopping services and clearing logs. Finding additional tampering from the same user or writing
    process indicates multiple controls were targeted together rather than an isolated policy change.
    Named security service changes and Defender-weakening commands in this window are worth correlating
    with the PUAProtection write.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: What other registry modifications were made on this host in the same window?
  context: >-
    Actors who change one Defender policy value often change several — turning off PUA protection
    alongside real-time monitoring, exclusion paths, tamper protection, or firewall and persistence
    keys. Clustering the registry writes on this host within a short window around the alert reveals
    the full scope of configuration changes and whether multiple objectives were pursued together. The
    triggering value appears in the results; the signal is what else was modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has the PUAProtection value been modified before on this host?
  context: >-
    A Defender detection-policy value such as PUAProtection should change rarely and only through
    deliberate action. A history that shows no prior writes makes this a first-time change and raises
    its weight; a history of periodic writes to the same value points to a management process that
    routinely sets it. Compare the historical Details values to see whether the same 0 value was set
    before or whether this is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was the PUAProtection value modified on other hosts in the environment?
  context: >-
    The same write across many hosts suggests a centrally managed policy or an opt-out rolled out by
    administration; the same write confined to one host suggests a targeted change. Compare the Details
    values across hosts to see whether they all set 0 or whether values differ, and whether the writing
    process is consistent with a management deployment or with ad-hoc tampering.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A defense-policy change rarely happens in isolation. Aggregating process activity in a tight window
    around the alert surfaces what led up to the change and what ran immediately after. Novel
    parent-child pairs stand out at low counts against high-count routine telemetry, which is what
    points to the download or execution of PUA-classified tooling around the configuration change.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — reconnaissance, execution of scripting tools, or other
    defense tampering — may reveal the stages that preceded this change and help reconstruct the
    timeline. Weakening a detection class shortly before running flagged tooling is a common
    progression, and prior alerts help place this registry edit within it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were process-based persistence mechanisms installed on this host in the same window?
  context: >-
    An actor who weakens a Defender detection class to run flagged tooling frequently establishes
    persistence in the same operation. Scheduled tasks, services, registry Run keys, BITS jobs, and WMI
    subscriptions created by schtasks.exe, sc.exe, reg.exe, bitsadmin.exe, or wmic.exe near the change
    indicate it was part of a footholding effort rather than an isolated configuration edit.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely — dropping an executable or script
    into a Startup folder or a path referenced by a registry Run key achieves persistence without
    invoking schtasks, sc, or reg. File writes to these locations near the PUA-protection change
    indicate a parallel persistence mechanism was established alongside it, often for the same tooling
    the change was meant to unblock.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
