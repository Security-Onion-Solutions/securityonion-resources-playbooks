name: GAC DLL Loaded Via Office Applications
id: b044aff0-1e7d-4b50-9988-cac7a8c7bab4
description: |
  Detects a Windows Office application (Excel, Publisher, OneNote, Outlook, PowerPoint, or Word)
  loading a .NET assembly from the Global Assembly Cache under C:\Windows\Microsoft.NET\assembly\GAC_MSIL.
  A managed assembly loading in-process inside an Office application is the fingerprint of hosted .NET
  code: commonly a legitimate VSTO add-in, a COM interop assembly, or a vendor Office plugin, but also
  the loading behavior a malicious macro or add-in exhibits when it runs a .NET payload in-process. Because
  benign managed add-ins are common this is a hunting-grade signal, so the investigation should establish
  which assembly loaded and whether it is Microsoft-signed, whether the Office process was launched by a
  user opening a document or spawned headlessly, whether that document originated externally, and what the
  process did afterward.
type: detection
detection_id: 90217a70-13fc-48e4-b3db-0d836c5824ac
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the loaded module match what this rule detects — a GAC .NET assembly loaded by an Office application?
  context: >-
    Confirm the alert is a true positive by reviewing the loaded module path (ImageLoaded) and the process
    that loaded it (Image). The rule fires when one of the Office binaries (excel.exe, mspub.exe, onenote.exe,
    onenoteim.exe, outlook.exe, powerpnt.exe, winword.exe) loads an assembly whose path begins with
    C:\Windows\Microsoft.NET\assembly\GAC_MSIL. Both conditions must hold: an Office loading process and a
    GAC_MSIL assembly path. The load event carries the module hash and signing status directly, so the
    identity of the assembly can be confirmed here without an execution pivot.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Is this user and host expected to run Office applications that host managed .NET add-ins?
  context: >-
    Legitimate administrative and developer activity routinely loads managed add-ins into Office. Knowing
    whether the user role and host function are consistent with running Office with VSTO or COM interop
    add-ins is often the fastest way to separate a routine managed-add-in load from injected .NET tooling.
    A shared workstation with vendor plugins is very different from a server or a user who never opens
    documents interactively.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which assemblies and other modules did this Office process load, and are any unsigned or from user-writable directories?
  context: >-
    The full set of modules the process loaded tells the story when the trigger alone is opaque. Beyond the
    flagged GAC assembly, look for additional .NET assemblies loaded from %TEMP%, AppData, ProgramData, or
    Public rather than the GAC or the application directory; unsigned modules where signed ones are expected;
    and system DLL names loaded from non-system paths. A GAC assembly loading alongside a cluster of modules
    pulled from user-writable paths points toward an add-in or macro that stages and runs its own code rather
    than a stock vendor plugin.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For the loaded GAC assembly, what is its signing status, signer, hash, and reputation?
  context: >-
    Assembly identity separates a stock managed add-in from injected .NET tooling. Framework and most vendor
    assemblies in the GAC are strong-named and carry a valid Microsoft or vendor signature; an assembly with
    this GAC path that is Unsigned, Expired, Distrusted, or Invalid, or signed by an unexpected publisher, is
    the stronger masquerading signal. Use the hash from the load event for reputation lookup and to compare
    against a known-good copy of the same assembly on a clean host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What was the Office process's full command line, and what document or mode did it open with?
  context: >-
    The command line reveals whether the Office application was opened on a specific document, launched for
    embedding or automation, or started with switches such as safe mode disabled. The document path and any
    automation or COM-embedding flags distinguish a user opening an attachment from a headless invocation
    driving Office through its object model. Note the working directory, which locates where the opened file
    resides.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this Office application, and is that parent chain expected?
  context: >-
    The parent chain reveals how the Office process was launched. A user opening a document typically shows
    explorer.exe or a mail/browser handler as the ancestor; an Office process spawned by a script host,
    another automation binary, or a service is consistent with programmatic COM automation driving Office to
    host .NET code without a person opening anything. An unexpected ancestor raises the priority of the
    assembly-provenance and follow-on questions.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What document or email opened in this Office application, and where did it come from?
  context: >-
    Malicious managed add-ins and macros usually arrive as an attachment or downloaded document. The immediate
    parent and its command line show what launched Office and, for a document open, often carry the file name.
    Establish whether the document was received by email, downloaded from a link, or opened from a network
    share, and whether it originated outside the organization — external origin plus in-process .NET hosting is
    the pattern worth chasing. Full delivery-vector analysis requires reviewing mail and web records.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: What child processes did this Office application spawn after the assembly loaded?
  context: >-
    Managed code hosted in Office frequently reaches out to the operating system by spawning helper processes.
    Prioritize command interpreters and script or proxy-execution utilities in the results — powershell.exe,
    cmd.exe, wscript.exe, cscript.exe, mshta.exe, rundll32.exe, regsvr32.exe, msiexec.exe, curl.exe,
    bitsadmin.exe — since an Office application rarely launches these during normal document editing. Benign
    children still give useful context, so review the full set rather than filtering prematurely.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What files did the Office process or its children write around the alert, and do they remain on disk?
  context: >-
    Managed code running in Office may drop secondary payloads, scripts, or staging files into user-writable
    paths such as Downloads, Temp, Desktop, or AppData. Correlating file writes to the Office process and its
    direct children by process lineage locates those artifacts while they are still on disk, enabling hash
    lookups and content review; watch for executable and script extensions (exe, scr, dll, js, vbs, ps1, hta)
    and double extensions. File writes are correlated by process lineage rather than by any command-line path
    field, so this holds even when the assembly leaves no path in the command line.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did the Office process make outbound network connections after the assembly loaded?
  context: >-
    A common purpose of in-process .NET hosting in Office is to reach an external host to download a payload or
    establish command-and-control, so outbound connections from the Office process shortly after the load are a
    high-value lead. Review the destination addresses and ports against known corporate update, CDN, and proxy
    egress; connections to unfamiliar external addresses, especially on non-standard ports, deserve follow-up.
    An Office application that only ever talks to known internal or vendor endpoints is easier to clear.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: Has this GAC assembly been loaded on this host before, and under what processes?
  context: >-
    A first-time assembly load on a host is a stronger anomaly than a recurring one. If the same GAC assembly
    has loaded repeatedly under the same Office binary over the past 90 days, the current load is probably a
    routine add-in. If this is the first occurrence, or the assembly has only ever loaded under unrelated
    processes, the current load is anomalous and worth deeper provenance review.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: When this host has previously loaded a GAC assembly into an Office application, what programs and users drove it, and does the current alert fit that pattern?
  context: >-
    Even routine managed add-ins load through predictable Office executables and user accounts.
    This query mirrors the rule's selection scoped to this host, so the resulting program and user
    distribution reflects how this specific GAC-load pattern has historically run here rather
    than generic Office usage. An Office executable that has not shown this load before, an
    unexpected user account, or a first-time appearance of the pattern is the deviation worth
    chasing; image-load events carry no parent lineage, so pivot to the Office process's start
    event if lineage matters.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith:
        - \excel.exe
        - \mspub.exe
        - \onenote.exe
        - \onenoteim.exe
        - \outlook.exe
        - \powerpnt.exe
        - \winword.exe
        ImageLoaded|startswith: C:\Windows\Microsoft.NET\assembly\GAC_MSIL
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts loaded a GAC assembly into an Office application in the past week, and does the cross-host distribution look like managed-add-in rollout or one-off activity?
  context: >-
    This query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of the same
    Office GAC-load pattern rather than generic Office usage. Many hosts firing the same pattern points to a
    deployed add-in or vendor plugin rolled out across the estate; a single host or a small unrelated set points
    to localized activity that merits closer review. Use the host distribution and the consistency of the
    loading binary to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith:
        - \excel.exe
        - \mspub.exe
        - \onenote.exe
        - \onenoteim.exe
        - \outlook.exe
        - \powerpnt.exe
        - \winword.exe
        ImageLoaded|startswith: C:\Windows\Microsoft.NET\assembly\GAC_MSIL
      condition: selection
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining process activity in the minutes around the assembly load
    reveals what led to it and what followed, and whether the load, any file drop, and any child execution fall
    inside a single correlation window. Look for reconnaissance, credential access, or persistence established
    close to the same time.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — phishing delivery, reconnaissance, defense tampering, credential
    access — may reveal the stages that preceded this load and help reconstruct the timeline. Hosting .NET code
    in Office is often a mid-chain execution step, so a preceding delivery or discovery alert changes how this
    event should be triaged.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Did the same detection fire for other users or hosts, indicating a shared delivery vector?
  context: >-
    Malicious documents are rarely sent to a single recipient. If one user opened a document that loaded managed
    code into Office, others may have received the same file. Correlating this same rule across hosts reveals how
    many systems loaded the same pattern and identifies additional accounts and machines that need review.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
