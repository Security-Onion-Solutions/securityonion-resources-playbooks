name: HackTool - GMER Rootkit Detector and Remover Execution
id: 5dd0e4ec-a03c-4b78-985d-f721fa7b9e0b
description: |
  Detects execution of the GMER anti-rootkit tool, identified either by a process image ending in gmer.exe
  or by a match on GMER's known file hashes (MD5, SHA1, or SHA256). GMER is a dual-use utility: it scans for
  hidden processes, drivers, services, registry keys, and disk/MBR hooks, but the same primitives — kernel-driver
  load, raw disk access, forced file deletion, and service disable/delete — are routinely co-opted to remove
  protected rootkit drivers or to disable AV/EDR services and delete defender files. Because operators sometimes
  rename gmer.exe (the vendor itself documents renaming it to evade malware self-defense), the hash branch can
  fire even when the image name has been changed. Investigation should confirm which branch fired, decode the
  command line for destructive switches such as -killfile and -nodriver, and determine whether the run was an
  authorized administrative or assessment activity or an attempt to weaken host defenses.
type: detection
detection_id: 9082ff1f-88ab-4678-a3cc-5bcff99fc74d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did this process fire on the gmer.exe image name, on a GMER file hash, or both?
  context: This rule fires when EITHER the process image ends in gmer.exe OR the file hash matches a known GMER
    MD5, SHA1, or SHA256. Confirm which branch matched. A name-only match is straightforward GMER; a hash match
    where the image name is NOT gmer.exe means the binary was renamed (a documented evasion against malware that
    blocks gmer.exe by name), which raises suspicion. Note the matching branch — it determines how much weight to
    place on the binary's name versus its identity downstream.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: Is this user and host expected to run an anti-rootkit or disk-level forensic tool?
  context: GMER is a hands-on diagnostic and removal tool, not something most users or endpoints run as routine.
    Knowing whether the user role and host function are consistent with rootkit scanning or driver-level cleanup
    is often the fastest path to distinguishing a deliberate administrative action from misuse.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this GMER execution part of an authorized incident response, cleanup, or security assessment?
  context: GMER is used in legitimate rootkit investigations and malware-removal workflows. Before investing
    investigation time, check whether an incident response action, sanctioned cleanup, or assessment is currently
    active on this host or network segment. An authorized engagement with matching tool usage and timing resolves
    the alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which GMER capability was invoked — scan-only, or a destructive switch such as -killfile or -nodriver?
  context: GMER is multi-purpose. A bare launch or GUI scan is diagnostic, but command-line switches change the
    risk profile sharply. -killfile forcibly deletes a file by path or NTFS Alternate Data Stream syntax even if
    locked (documented examples target driver files like system32\drivers paths and ADS streams), and -nodriver
    runs without loading the kernel driver to reduce footprint. The specific switch determines the scope of
    potential impact and the required response.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What exactly did this GMER invocation do? Decode the full command line for destructive flags and target paths.
  context: The full command line reveals the specific action taken. Decode flags and their arguments — in particular
    -killfile and the file or ADS path that follows it, and -nodriver. A -killfile target pointing at a driver,
    service binary, or defender file indicates forced deletion of a protected artifact rather than a read-only scan.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What files did the GMER process create on this host, such as save-log output or deleted-driver remnants?
  context: GMER's save-log function writes a text log of detected hooks and hidden objects, and -killfile activity
    leaves the targeted file removed. Checking file creation events from the GMER process confirms execution and
    reveals the scope of activity even after the original process has exited. Pair this with the command-line decode
    to correlate any -killfile target against what was actually removed.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process spawned GMER, and is that parent chain expected?
  context: The parent process reveals how the tool was invoked. Deliberate administrative use often has predictable
    parents (explorer.exe for an interactive launch, a remote-management or deployment service for pushed cleanup).
    Unusual parents such as script hosts, Office applications, or a web-facing service process point toward
    exploitation or scripted misuse.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did GMER spawn afterward?
  context: The processes spawned by a tool reveal its actual impact. GMER's GUI exposes a CMD tab that runs arbitrary
    shell commands, so child cmd.exe, powershell.exe, or other interpreters launched from this process indicate
    operator-driven follow-on activity rather than a contained scan.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run GMER?
  context: An anti-rootkit utility that has never been seen on a host is more notable than one that runs as part
    of a known maintenance routine. Zero or very low historical counts indicate first-time or rare execution and
    raise the priority of the run.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and
    does the current alert fit that pattern?
  context: Even dual-use tools can be abused. The query mirrors the rule's selection structure (image name or GMER
    hash) scoped to this host, so the resulting parent/user distribution reflects how this specific firing pattern
    has historically run here rather than generic binary usage. A new parent process, an unexpected user account,
    or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \gmer.exe
      selection_sysmon_hash:
        Hashes|contains:
        - MD5=E9DC058440D321AA17D0600B3CA0AB04
        - SHA1=539C228B6B332F5AA523E5CE358C16647D8BBE57
        - SHA256=E8A3E804A96C716A3E9B69195DB6FFB0D33E2433AF871E4D4E1EAB3097237173
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \gmer.exe
      selection_sysmon_hash:
        Hashes|contains:
        - MD5=E9DC058440D321AA17D0600B3CA0AB04
        - SHA1=539C228B6B332F5AA523E5CE358C16647D8BBE57
        - SHA256=E8A3E804A96C716A3E9B69195DB6FFB0D33E2433AF871E4D4E1EAB3097237173
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \gmer.exe
      selection_sysmon_hash:
        Hashes|contains:
        - MD5=E9DC058440D321AA17D0600B3CA0AB04
        - SHA1=539C228B6B332F5AA523E5CE358C16647D8BBE57
        - SHA256=E8A3E804A96C716A3E9B69195DB6FFB0D33E2433AF871E4D4E1EAB3097237173
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple
    endpoints. If the same user triggered similar activity on multiple hosts, the scope of the operation may be
    larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \gmer.exe
      selection_sysmon_hash:
        Hashes|contains:
        - MD5=E9DC058440D321AA17D0600B3CA0AB04
        - SHA1=539C228B6B332F5AA523E5CE358C16647D8BBE57
        - SHA256=E8A3E804A96C716A3E9B69195DB6FFB0D33E2433AF871E4D4E1EAB3097237173
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look
    like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure (image name or GMER hash) with no host scope, so the
    result is a fleet-wide count of the rule's firing pattern rather than generic binary usage. Many hosts firing
    the same pattern points to scripted deployment or a sanctioned sweep; one host or a small unrelated set points
    to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \gmer.exe
      selection_sysmon_hash:
        Hashes|contains:
        - MD5=E9DC058440D321AA17D0600B3CA0AB04
        - SHA1=539C228B6B332F5AA523E5CE358C16647D8BBE57
        - SHA256=E8A3E804A96C716A3E9B69195DB6FFB0D33E2433AF871E4D4E1EAB3097237173
      condition: 1 of selection_*
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context:
    what led to this event, what happened after, and whether it is part of a larger sequence. Look for
    reconnaissance, privilege escalation, or persistence mechanisms near the GMER run.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal
    the stages that preceded this event and help reconstruct the full timeline. A GMER run that follows prior
    tamper or recon alerts reads very differently from an isolated one.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
