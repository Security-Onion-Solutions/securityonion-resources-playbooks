name: Aruba Network Service Potential DLL Sideloading
id: 2bd54703-53c1-40c6-965e-d6ecfac0722a
description: |
  Detects the Aruba Networks Virtual Intranet Access service binary (arubanetsvc.exe) loading one of a
  set of common Windows libraries (for example wininet.dll, version.dll, cryptsp.dll, iphlpapi.dll,
  dbghelp.dll) from a directory outside the standard Windows locations (System32, SysWOW64, WinSxS).
  These libraries normally resolve from the system path; a load from the service's own install directory
  or a user-writable folder is consistent with DLL search-order hijacking, where an attacker plants a
  malicious DLL with an expected name next to the trusted signed executable so the service loads and runs
  attacker code under its identity and any autostart or service context. The loading process is a
  legitimate signed vendor binary — the DLL is the anomaly — so the investigation should establish
  whether the loaded module is signed and by whom, where it sits on disk and which process wrote it,
  whether its hash matches the known-good library, and what the service did after the load.
type: detection
detection_id: 90ae0469-0cee-4509-b67f-e5efcef040f7
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the loaded module match this rule's detection criteria for path, signature, and loading process?
  context: >-
    Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded), its
    code-signature status, and that the loading process is arubanetsvc.exe. The rule fires when the Aruba
    service binary loads one of a set of common Windows libraries (wininet.dll, version.dll, cryptsp.dll,
    iphlpapi.dll, dbghelp.dll, and similar) from a path that is NOT under C:\Windows\System32,
    C:\Windows\SysWOW64, or C:\Windows\WinSxS — the directories the rule treats as known-good. A load of
    one of these library names from the service's own install directory or a user-writable folder is the
    core signal, because these libraries normally resolve from the system path. DLL loads carry a hash and
    signing status on the load event itself, so verify both here.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Is this host expected to run the Aruba Virtual Intranet Access client, and from this location?
  context: >-
    Legitimate installs of the Aruba VIA client trigger no alert because the service loads its libraries
    from the standard Windows directories. Knowing whether this host is provisioned with the client and
    whether the service binary runs from its normal install path is often the fastest way to separate a
    benign relocated install from a staged side-load. If the host is not expected to run this client at
    all, or the service is running from a user-writable directory, the load is harder to explain as routine.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Besides the flagged library, what other modules did arubanetsvc.exe load, and are any from user-writable or non-canonical directories?
  context: >-
    The full set of modules the service loaded tells the operator's story. For search-order hijacking,
    look for additional libraries pulled from the service's own working folder instead of the system path
    expected for that DLL name, unsigned modules where signed ones are expected, and modules loaded from
    %TEMP%, AppData, ProgramData, or Public. A cluster of side-loaded modules alongside the flagged library
    strengthens the case that the loading directory was staged rather than the load being a single benign
    relocation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For the flagged library, what is its signing status, hash, and reputation, and does the hash match the known-good system copy?
  context: >-
    Module reputation separates a copied-legitimate library from a side-loaded malicious one. The genuine
    versions of these libraries ship signed by Microsoft from the system directories; a copy of the same
    filename carrying an invalid, distrusted, expired, or absent signature is a masquerading indicator.
    Use the hash to check reputation and to compare against the known-good copy of that library in
    System32 — a side-load replaces the file, so a hash that differs from the vendor norm for that DLL
    name is the decisive tell. Signature statuses to watch are Unsigned, Expired, Distrusted, and Invalid.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: Which process wrote the flagged library to disk, and when?
  context: >-
    A file-based side-load requires the malicious DLL to be planted next to the trusted binary before the
    service loads it. Correlating file writes whose name matches the loaded library identifies the process
    that staged it. A write by a browser, archive utility, script host, or installer running from a
    user-writable path — rather than by a signed vendor updater into the real install directory — points
    to attacker staging. The write time also bounds when the side-load was set up relative to the load.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
- question: Where does arubanetsvc.exe run from on this host, and what was its full command line and working directory?
  context: >-
    In a side-load the trusted binary is sometimes copied out of its normal install path so the attacker
    controls the directory the loader searches. The service binary's on-disk location (Image), working
    directory (CurrentDirectory), and command line reveal whether it was relocated out of the vendor
    install path and how it was launched. A copy of the service binary running from AppData, a download
    folder, or another user-writable directory is a hallmark of this technique; a binary in its normal
    Program Files install path with a colocated non-system DLL points instead to the DLL alone being
    replaced in place.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: What process spawned arubanetsvc.exe, and is that parent chain expected?
  context: >-
    The parent process reveals how the service binary was launched. A service normally starts under
    services.exe; a copy of the binary launched by explorer.exe, a script host (wscript.exe, mshta.exe),
    an Office application, or an archive or installer utility suggests the trusted binary was dropped and
    run as part of an intrusion rather than started as a registered service. The parent lookup uses a
    per-instance identifier, so a multi-day window is expected for long-running service or login sessions.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What files did arubanetsvc.exe or its children write around the alert, and do they remain on disk?
  context: >-
    Once the hijacked library executes inside the trusted service, that process or a child it spawns may
    drop secondary payloads, configuration, or staging files. Correlating file writes to the loading
    process and its direct children by process lineage locates those artifacts while they are still on
    disk, enabling hash lookups, reputation checks, and content review of both the side-loaded library and
    any follow-on files.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Were registry keys that control DLL search order or application launch paths modified on this host around the alert?
  context: >-
    Hijacking execution flow can run through the registry rather than a colocated file. Modifications to
    KnownDLLs, Image File Execution Options, or App Paths can force a trusted process to load an attacker
    library or launch an attacker binary, and may accompany or substitute for the file-based side-load.
    Focus on modifications near the load time; registry value deletion is not observable on this
    telemetry, so treat re-modification history and payload execution as the cleanup signal instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\Session Manager\KnownDLLs'
          - '\Image File Execution Options\'
          - '\App Paths\'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: Has this library name been loaded by arubanetsvc.exe on this host before, and from which paths?
  context: >-
    A first-time load of this library from a non-system path is a stronger anomaly than a recurring one.
    If the same library has loaded under the Aruba service repeatedly over the past 90 days from the same
    location, the current load is more likely a stable install quirk. If this is the first occurrence, or
    the library has previously only loaded from the system directories, the current non-canonical load is
    anomalous and consistent with a newly staged side-load.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: When this host previously matched the rule's pattern, what programs and user accounts drove the Aruba service, and does the current alert fit?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the resulting
    program and user distribution reflects how this specific side-load pattern has historically
    appeared here rather than generic service activity. A new acting program process or an
    unexpected user account driving the load — or the pattern appearing on a host that has never
    matched it before — is the deviation worth chasing, and is also the closest available
    baseline for the service's expected launch context.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith: \arubanetsvc.exe
        ImageLoaded|endswith:
        - \wtsapi32.dll
        - \msvcr100.dll
        - \msvcp100.dll
        - \dbghelp.dll
        - \dbgcore.dll
        - \wininet.dll
        - \iphlpapi.dll
        - \version.dll
        - \cryptsp.dll
        - \cryptbase.dll
        - \wldp.dll
        - \profapi.dll
        - \sspicli.dll
        - \winsta.dll
        - \dpapi.dll
      filter:
        ImageLoaded|startswith:
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
        - C:\Windows\WinSxS\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts matched the rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of the rule's firing pattern rather than generic use of the Aruba client. Many hosts loading the
    same library from a non-system path points to a bundled install quirk or a scripted deployment worth
    baselining; one host or a small unrelated set points to targeted staging. Use the host distribution
    together with the per-host signature and hash of the loaded module to decide whether this is a
    widespread benign pattern or an isolated side-load.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith: \arubanetsvc.exe
        ImageLoaded|endswith:
        - \wtsapi32.dll
        - \msvcr100.dll
        - \msvcp100.dll
        - \dbghelp.dll
        - \dbgcore.dll
        - \wininet.dll
        - \iphlpapi.dll
        - \version.dll
        - \cryptsp.dll
        - \cryptbase.dll
        - \wldp.dll
        - \profapi.dll
        - \sspicli.dll
        - \winsta.dll
        - \dpapi.dll
      filter:
        ImageLoaded|startswith:
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
        - C:\Windows\WinSxS\
      condition: selection and not filter
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining activity in the minutes around the load reveals what led
    to it and what followed, and whether the module load, a file drop, and any registry change fall inside
    a single correlation window. Look for reconnaissance, privilege escalation, or additional persistence
    established close to the same time.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, credential access — may
    reveal the stages that preceded this load and help reconstruct the timeline. A side-load is often a
    mid-chain execution or persistence step, so a preceding delivery or discovery alert changes how this
    event should be triaged.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    Attackers rarely rely on a single persistence mechanism. After establishing one foothold — such as a
    side-loaded library running inside a trusted service — they commonly install backup mechanisms via
    scheduled tasks, services, registry Run keys, or BITS jobs. Multiple persistence installations in the
    same timeframe indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations (Startup folders, scheduled-task definitions) on this host?
  context: >-
    File-based persistence bypasses command-line detection entirely. Dropping an executable or script into
    the Startup folder or a path referenced by a registry Run key achieves persistence without running
    schtasks, sc, or reg. File-event monitoring captures these drops even when the attacker avoids standard
    persistence tooling, and pairs naturally with a side-load that already writes files to disk.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
