name: Arbitrary MSI Download Via Devinit.EXE
id: b144d59e-206e-4e7e-a59b-4f6433b57764
description: |
  Detects devinit.exe, a Microsoft-signed Visual Studio helper, invoked with the
  argument combination ' -t msi-install ' AND ' -i http', which instructs it to
  download an MSI package from an HTTP/HTTPS URL into the Windows installer cache
  and install it. As a signed binary, devinit.exe can be abused to proxy execution
  of remote, attacker-supplied MSI payloads past application-control and signature
  checks. Legitimate use is largely confined to developer workstations running
  Visual Studio tooling; on servers or non-developer endpoints this argument
  pattern is unusual and warrants confirming the source URL, the downloaded
  package, and what installed afterward.
type: detection
detection_id: 90d50722-0483-4065-8e35-57efaadd354d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the devinit.exe command line contain both the msi-install mode flag and an HTTP/HTTPS URL?
  context: Confirm the alert is a true positive by reviewing the exact command line.
    The rule fires only when both ' -t msi-install ' and ' -i http' appear together,
    indicating devinit.exe was told to download and install a remote MSI. Verify both
    elements are present and capture the full URL that follows the -i flag.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run Visual Studio developer tooling like devinit.exe?
  context: devinit.exe ships with Visual Studio and is normally seen on developer
    workstations. On a server, kiosk, or general-purpose endpoint, or under a user
    who does no development work, the msi-install download pattern is out of place
    and raises the priority of the investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What is the full download URL and MSI target in the devinit.exe command line?
  context: The full command line reveals the remote source of the MSI. Decode the
    value following ' -i http' to extract the host, path, and file name being
    retrieved, and note any additional flags. The downloaded package lands in the
    Windows installer cache before installation, so the URL identifies where the
    payload originated.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
        - ' -t msi-install '
        - ' -i http'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: Did devinit.exe make an outbound HTTP/HTTPS connection to the URL host around the time of the alert?
  context: The msi-install mode retrieves the package over the network before
    installing it. Correlating an outbound connection from devinit.exe to the URL
    host confirms the download actually executed rather than failing at the
    parsing stage, and surfaces the destination address for reputation review. If
    network telemetry for this host is not ingested, treat zero results as a
    visibility gap rather than proof no transfer occurred.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\devinit.exe'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - Initiated
  answer_sources:
  - network_connection
  - external_threat_intel
- question: Was an MSI file written to the Windows installer cache after devinit.exe ran?
  context: A download command does not guarantee the file was retrieved. Network
    errors or blocked URLs may have prevented the transfer. devinit.exe writes the
    fetched package into the Windows installer directory before installing it, so
    confirming an MSI write there establishes whether the activity progressed past
    delivery.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\Windows\Installer\'
      filter:
        TargetFilename|endswith: '.msi'
      condition: selection and filter
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: What MSI did devinit cache to disk, and can you retrieve and hash it?
  context: devinit fetches the MSI into the Windows Installer cache. The MSI is installed
    by msiexec, not run as a process, and file-creation events carry no hash — so the path
    is the artifact here. Retrieve the MSI from the cache below and submit its hash to threat
    intelligence, or detonate it. Pivot on the URL host from the command line for reputation.
    What the install then drops and runs has its own process hashes — check the host's
    subsequent process activity for those.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\Windows\Installer\'
      filter:
        TargetFilename|endswith: '.msi'
      condition: selection and filter
    fields:
      - TargetFilename
  answer_sources:
  - safe_environment
  - external_threat_intel
- question: What process spawned devinit.exe, and is that parent chain expected?
  context: The parent process reveals how devinit.exe was invoked. Legitimate use
    is typically driven by Visual Studio components or developer shells. Unusual
    parents such as a browser, mshta.exe, wscript.exe, an Office application, or a
    download utility suggest the binary was launched as a proxy-execution step
    rather than during normal development.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What did the downloaded MSI do after installation, and what child processes did devinit.exe spawn?
  context: The processes spawned after the MSI installs reveal its actual impact.
    MSI installation runs through the Windows installer service and may launch
    custom actions; attacker MSIs commonly drop and execute follow-on payloads such
    as cmd.exe, powershell.exe, rundll32.exe, or a dropped binary. Unexpected
    children point to code execution beyond a benign install.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\devinit.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: When this host has previously run the msi-install download pattern, what parents and users drove it, and does the current alert fit?
  context: Even signed developer tools can be abused. This query mirrors the rule's
    selection scoped to this host, so the parent and user distribution reflects how
    this specific download pattern has historically run here rather than generic
    devinit.exe usage. A new parent process, an unexpected account, or a first-ever
    occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - ' -t msi-install '
        - ' -i http'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - ' -t msi-install '
        - ' -i http'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - ' -t msi-install '
        - ' -i http'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around the time of the alert?
  context: Tracking the user's activity across all hosts reveals lateral movement or
    activity spanning multiple endpoints. If the same user drove similar MSI download
    or installation activity on other hosts, the scope of the operation may be larger
    than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - ' -t msi-install '
        - ' -i http'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Have other hosts run the msi-install download pattern in the past week, and does the distribution look like automation or one-off activity?
  context: This query mirrors the rule's selection with no host scope, so the result
    is a fleet-wide count of the download pattern rather than generic devinit.exe
    usage. Many hosts firing the same pattern points to scripted deployment or build
    automation; one host or a small unrelated set points to manual operator activity.
    Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - ' -t msi-install '
        - ' -i http'
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert
    reveals the immediate context: what led to this event, what happened after, and
    whether it is part of a larger sequence. Look for reconnaissance, privilege
    escalation, persistence installation, or additional downloads.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host,
    such as defense tampering, reconnaissance, or initial-access activity, may reveal
    the stages that preceded this download and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
