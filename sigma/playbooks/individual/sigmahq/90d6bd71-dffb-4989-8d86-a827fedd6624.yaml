name: Visual Studio Code Tunnel Execution
id: 681af140-c80f-4263-ae70-f636a5effd79
description: |
  Detects execution of the Visual Studio Code tunnel feature, which establishes an authenticated reverse
  tunnel from the host to a Microsoft-hosted endpoint reachable from anywhere. The rule fires when EITHER a
  process runs with a command line ending in ".exe tunnel", OR a command line contains both ".exe tunnel" and
  "--accept-server-license-terms", OR cmd.exe is launched by a tunnel parent to run the bundled code-server
  script from a "\servers\Stable-" path. Legitimately this is a developer remote-development convenience; abused,
  the signed Microsoft binary becomes a turnkey command-and-control and remote-access channel that grants an
  interactive terminal and full file browser within the user's permissions while bypassing reputation and
  application-control defenses. Determine whether the tunnel was started by an expected developer workflow or
  by an operator establishing remote access, and whether it reached persistence and interactive-control stages.
type: detection
detection_id: 90d6bd71-dffb-4989-8d86-a827fedd6624
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line match the tunnel execution pattern this rule detects?
  context: >-
    Confirm the alert is a true positive by reviewing the exact command line and process details. This rule
    fires on ANY of three independent branches, so note which one matched: a command line ending in ".exe tunnel",
    a command line containing both ".exe tunnel" and "--accept-server-license-terms", or cmd.exe spawned by a
    tunnel parent to run a "\servers\Stable-" code-server.cmd script. The branch that fired tells you whether the
    evidence is a direct tunnel invocation or the cmd.exe shim the tunnel server spawns, and which downstream
    questions carry the most weight.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentCommandLine
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run a Visual Studio Code remote tunnel?
  context: >-
    Developer and engineering hosts may legitimately use VS Code tunnels for remote development. A tunnel started
    on a server, a non-developer endpoint, or by an account with no development role is far more likely to be
    operator-established remote access. Knowing whether the user role and host function fit remote-development use
    is often the fastest path to disposition.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is the Visual Studio Code tunnel an approved remote access method on this host?
  context: >-
    Organizations typically sanction a specific set of remote access and remote-development tools. A VS Code tunnel
    exposes an interactive terminal and file browser over an external service; if it is not an approved method for
    this host, it may represent shadow IT or operator-deployed remote access regardless of the binary being
    Microsoft-signed. Unauthorized use should be reviewed even when the tool is well known.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a helpdesk ticket, maintenance window, or developer request explaining this tunnel?
  context: >-
    Legitimate tunnel use usually correlates with an active support ticket, a scheduled change, or a known
    development task. If no documented context exists for this session, the tunnel may have been started by an
    operator for persistent remote access or by a user circumventing controls.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What spawned the tunnel parent, and is that launch chain expected?
  context: >-
    The parent-child relationship is the core signal for the cmd.exe branch of this rule, where a tunnel parent
    launches cmd.exe to run the bundled code-server script. Tracing the parent's own origin reveals whether the
    chain is a legitimate developer launch (a user started the CLI from a shell or shortcut) or a scripted
    download-and-run sequence that staged the CLI from a temporary or user-writable directory.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What name, data directory, and flags were specified on the tunnel command line?
  context: >-
    The full command line reveals how the tunnel was configured. Look for "--name" (a persistent, operator-chosen
    tunnel identifier), "--cli-data-dir" or the VSCODE_CLI_DATA_DIR environment variable (relocates the state
    files away from the default profile path, often to evade file-based detection), "--no-sleep" (keeps the tunnel
    alive), and "user logout" (clears prior authentication state before re-pairing). The presence of a custom name
    or relocated data directory points away from casual developer use.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: '.exe tunnel'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - Image
- question: Is the binary that invoked the tunnel the genuine Microsoft-signed Code CLI, or a renamed copy?
  context: >-
    The tunnel CLI is a portable, Microsoft-signed binary that can be downloaded standalone and renamed. Because it
    is signed, downloaded copies do not raise reputation or mark-of-the-web warnings, and the CLI build ships with
    empty product-name metadata that breaks publisher-based application control. Check the Image path and signing
    chain: a copy running from a temporary, profile, or user-writable directory, or under an unexpected file name,
    indicates staging rather than an installed Code instance.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Was the tunnel registered to persist as a Windows service?
  context: >-
    The tunnel CLI can register itself to run automatically, most notably as a Windows service via "tunnel service
    install", so it survives reboots and logoff. A service-install invocation around the alert turns an interactive
    session into durable remote access and raises the severity. This query surfaces tunnel command lines that
    request service installation or keep-alive behavior on the same host.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
          - tunnel
          - service install
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: What external endpoints did the tunnel process connect to?
  context: >-
    The tunnel relays through Microsoft dev-tunnels infrastructure; once registered, the host pulls regional
    cluster endpoints and reuses those, so blocking only the global control domain is insufficient. Review outbound
    connections from the tunnel binary for sustained, long-lived sessions to dev-tunnel and Visual Studio service
    domains. If network telemetry is not available for this host, fall back to the command-line and process-tree
    evidence to confirm the tunnel was established.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: Did the tunnel process tree spawn interactive shells or terminal helpers?
  context: >-
    Once a tunnel is paired, the operator drives an interactive terminal and tasks through the tunnel server, which
    spawns child processes such as cmd.exe, a Node.js helper, a pseudo-terminal agent, or powershell.exe. These
    children are the hands-on-keyboard signal that the tunnel was used for interactive control rather than left
    idle. Review the children of the tunnel and code-server processes on this host around the alert.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: What other child processes did the same parent spawn?
  context: >-
    If a tunnel parent spawned the detected cmd.exe shim, it likely spawned other processes too. Examining sibling
    processes of the same parent instance reveals the full scope of activity the tunnel server orchestrated on this
    host — multiple shells, helpers, or scripted actions from one parent point to active interactive use.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Were tunnel state or consent files written on this host?
  context: >-
    The CLI writes state files when a tunnel is registered, most importantly a tunnel metadata file (default name
    code_tunnel.json) and a license-consent file, normally under the user profile's Code CLI data directory. Their
    presence confirms a tunnel was actually registered rather than merely launched. The location can be moved with
    "--cli-data-dir" or the VSCODE_CLI_DATA_DIR variable, so search by the file names as well as the default path.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - code_tunnel.json
          - license_consent.json
          - \.vscode-cli\
          - \.vscode\cli\
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_only_tunnel:
        OriginalFileName: null
        CommandLine|endswith: .exe tunnel
      selection_tunnel_args:
        CommandLine|contains|all:
        - .exe tunnel
        - --accept-server-license-terms
      selection_parent_tunnel:
        ParentCommandLine|endswith: ' tunnel'
        Image|endswith: \cmd.exe
        CommandLine|contains|all:
        - '/d /c '
        - \servers\Stable-
        - code-server.cmd
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_only_tunnel:
        OriginalFileName: null
        CommandLine|endswith: .exe tunnel
      selection_tunnel_args:
        CommandLine|contains|all:
        - .exe tunnel
        - --accept-server-license-terms
      selection_parent_tunnel:
        ParentCommandLine|endswith: ' tunnel'
        Image|endswith: \cmd.exe
        CommandLine|contains|all:
        - '/d /c '
        - \servers\Stable-
        - code-server.cmd
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around this time?
  context: >-
    Tracking the user's activity across hosts reveals whether the tunnel is an isolated action or part of broader
    activity. If the same user triggered similar tunnel or remote-access behavior on multiple hosts, the scope is
    larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_only_tunnel:
        OriginalFileName: null
        CommandLine|endswith: .exe tunnel
      selection_tunnel_args:
        CommandLine|contains|all:
        - .exe tunnel
        - --accept-server-license-terms
      selection_parent_tunnel:
        ParentCommandLine|endswith: ' tunnel'
        Image|endswith: \cmd.exe
        CommandLine|contains|all:
        - '/d /c '
        - \servers\Stable-
        - code-server.cmd
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    A remote tunnel is often established after an initial foothold. Earlier detections on the same host — download
    or staging of tooling, defense tampering, reconnaissance — may reveal the stages that preceded the tunnel and
    help place it in a timeline. If no prior alerts exist, the tunnel may be the first observed action.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
