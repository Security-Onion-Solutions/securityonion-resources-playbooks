name: Suspicious ZipExec Execution
id: d2481075-4715-4d24-bc84-cd14d3450a6f
description: |
  Detects command lines consistent with ZipExec, a tool that wraps a payload binary into a
  password-protected zip and executes it from inside the archive without unzipping to disk first.
  The rule fires when EITHER a "run" command line is seen (a /generic:Microsoft_Windows_Shell_ZipFolder
  filename argument together with a .zip path, a /pass: password, and a /user: argument) OR a "delete"
  command line is seen (a /delete operation against a Microsoft_Windows_Shell_ZipFolder .zip entry).
  The technique uses COM objects to drive the built-in Windows shell zip-folder functions from a
  generated script loader, which keeps the payload inside a password-protected archive that on-disk
  and signature-based scanning cannot read. Legitimate use of this exact argument structure is rare;
  determine which branch fired, decode the full command line, identify the wrapped payload, and
  establish whether the activity belongs to an authorized engagement.
type: detection
detection_id: 90dcf730-1b71-4ae7-9ffc-6fcf62bd0132
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line match either ZipExec branch this rule detects — the run pattern or the delete pattern?
  context: >-
    Confirm the alert is a true positive by reviewing the exact command line. The rule fires on
    EITHER of two branches, so note which one matched. The run branch requires all of a
    /generic:Microsoft_Windows_Shell_ZipFolder filename argument, a .zip path, a /pass: password, and
    a /user: argument. The delete branch requires a /delete operation against a
    Microsoft_Windows_Shell_ZipFolder .zip entry. Which branch fired determines the rest of the
    investigation: the run branch points to payload execution, the delete branch to cleanup of a zip
    artifact that may already have run.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to execute payloads from password-protected zip archives?
  context: >-
    Legitimate administrative activity rarely uses the shell zip-folder COM interface with a
    /pass: password and /user: argument to launch a binary. Knowing whether the user role and host
    function involve software packaging or security testing helps separate a true positive from a
    rare-but-sanctioned operation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this ZipExec execution part of an authorized penetration test or red team engagement?
  context: >-
    Tools that wrap payloads in password-protected archives to bypass on-disk scanning are used in
    authorized security assessments. Before investing investigation time, check whether a pentest or
    red team exercise is active on this host or network segment. An authorized engagement with
    matching tool usage and timing resolves the alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which ZipExec operation was invoked, and what payload zip and account does the command line name?
  context: >-
    The command line reveals which branch ran and the operational detail behind it. From the
    /generic:Microsoft_Windows_Shell_ZipFolder filename= argument, identify the path of the .zip being
    extracted or executed; from /user: and /pass:, note the account and password used to open the
    archive. A /delete invocation indicates cleanup rather than execution. These values determine the
    wrapped payload and the scope of potential compromise.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Decode the full ZipExec command line — what zip path, account, and operation did it carry, and which other ZipExec command lines ran on this host nearby?
  context: >-
    The full command line reveals the specific action taken. Decode the .zip path from the
    /generic:Microsoft_Windows_Shell_ZipFolder filename= argument, the account from /user:, and
    whether a /delete cleanup followed an execution. ZipExec typically runs as a pair — a run
    invocation that rebuilds and executes the archive followed by a delete invocation that removes it
    — so this host-scoped view across a short window shows both halves of the operation rather than a
    single event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: 'Microsoft_Windows_Shell_ZipFolder:filename='
      condition: selection
    fields:
      - CommandLine
      - Image
      - CurrentDirectory
- question: What process spawned this command and is that parent chain expected?
  context: >-
    The parent process reveals how the command was invoked. ZipExec drives the shell zip-folder COM
    functions from a generated script loader, so script hosts (wscript.exe, cscript.exe) or an office
    or browser process spawning the chain are notable. Predictable parents such as explorer.exe for a
    user action are less suspicious; walk up the parent to see what launched it and what else it
    spawned.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes ran on this host immediately after the ZipExec command, and do any look like the unwrapped payload?
  context: >-
    The processes that run after the archive is opened reveal the actual payload. ZipExec exists to
    execute a wrapped binary, so a new or unusual process started within minutes of the run command
    line — particularly a script host, a command interpreter, or an unsigned binary from a
    user-writable path — is the likely payload. Because the COM-driven launch can obscure parent
    linkage, this is an aggregated host survey: repetitive system and agent binaries collapse into
    high counts, and the low-count novel Image is the payload candidate to pivot on.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Did the alerting host make outbound network connections from script hosts or the payload process around the time of the alert?
  context: >-
    Proxy execution through trusted utilities is frequently used to retrieve or stage an externally
    hosted payload, and the script loader that drives the archive extraction can also reach out to a
    remote endpoint. Network connections from script hosts (wscript.exe, cscript.exe), command
    interpreters, or the unwrapped payload process near the alert point to retrieval or command and
    control. Correlate destination addresses against known-good enterprise egress before treating
    them as malicious.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_known_good:
        Image|endswith:
          - '\svchost.exe'
          - '\services.exe'
          - '\lsass.exe'
      condition: selection and not filter_known_good
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Was the payload zip rebuilt on disk, and where does the named archive live?
  context: >-
    ZipExec base64-encodes the payload zip and rebuilds it on disk before opening it through the COM
    shell functions, so a .zip file matching the path in the command line should appear as a file
    creation event around the alert. Locating that archive — and any loader script written alongside
    it — confirms the technique and provides the artifact to collect for analysis. Common write
    locations are user temp and other user-writable directories.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: '.zip'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: When this host has previously fired the ZipExec pattern, what parents and users drove it, and does the current alert fit?
  context: >-
    Even rare command structures can have a benign local cause. This query mirrors the rule's run and
    delete selections scoped to this host, so the resulting parent and user distribution reflects how
    this specific firing pattern — not generic process activity — has historically run here. A new
    parent process, an unexpected user account, or an unusual command-line structure relative to that
    history is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      run:
        CommandLine|contains|all:
        - /generic:Microsoft_Windows_Shell_ZipFolder:filename=
        - .zip
        - '/pass:'
        - '/user:'
      delete:
        CommandLine|contains|all:
        - /delete
        - Microsoft_Windows_Shell_ZipFolder:filename=
        - .zip
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (run or delete) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      run:
        CommandLine|contains|all:
        - /generic:Microsoft_Windows_Shell_ZipFolder:filename=
        - .zip
        - '/pass:'
        - '/user:'
      delete:
        CommandLine|contains|all:
        - /delete
        - Microsoft_Windows_Shell_ZipFolder:filename=
        - .zip
      _pb_scope:
        User|expand: '%User%'
      condition: (run or delete) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      run:
        CommandLine|contains|all:
        - /generic:Microsoft_Windows_Shell_ZipFolder:filename=
        - .zip
        - '/pass:'
        - '/user:'
      delete:
        CommandLine|contains|all:
        - /delete
        - Microsoft_Windows_Shell_ZipFolder:filename=
        - .zip
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (run or delete) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or activity spanning
    multiple endpoints. If the same user triggered similar activity on more than one host, the scope
    of the operation may be larger than the single alert suggests.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      run:
        CommandLine|contains|all:
        - /generic:Microsoft_Windows_Shell_ZipFolder:filename=
        - .zip
        - '/pass:'
        - '/user:'
      delete:
        CommandLine|contains|all:
        - /delete
        - Microsoft_Windows_Shell_ZipFolder:filename=
        - .zip
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (run or delete) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired the ZipExec pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    This query mirrors the rule's run and delete selections with no host scope, so the result is a
    fleet-wide count of the firing pattern rather than generic process activity. Many hosts firing the
    same pattern points to scripted deployment or vendor automation; one host or a small unrelated set
    points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      run:
        CommandLine|contains|all:
        - /generic:Microsoft_Windows_Shell_ZipFolder:filename=
        - .zip
        - '/pass:'
        - '/user:'
      delete:
        CommandLine|contains|all:
        - /delete
        - Microsoft_Windows_Shell_ZipFolder:filename=
        - .zip
      condition: run or delete
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering,
    reconnaissance, or credential access — may reveal the attack stages that preceded the wrapped-payload
    execution and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
