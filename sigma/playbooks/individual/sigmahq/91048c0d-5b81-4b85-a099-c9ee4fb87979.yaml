name: Mint Sandstorm - AsperaFaspex Suspicious Process Execution
id: d3b483e0-bf22-4439-9b09-231cc236bf1d
description: |
  Detects a ruby process running from an Aspera Faspex installation path spawning a child that matches
  one of several independent command patterns: either powershell.exe or powershell_ise.exe carrying a
  flagged argument (encoded-command syntax, FromBase64String, Invoke-Expression, download cradles,
  Defender preference changes, account or domain discovery), or an lsass reference paired with
  procdump/tasklist/findstr, or wget.exe/curl.exe fetching an http URL, or one of the named
  jscript/vbscript, local-administrator or account-creation, Defender/LSA registry, wmic
  process-creation, or shadow-copy and backup-catalog deletion commands. A ruby worker of an
  internet-facing file-transfer server executes transfer and packaging logic, so a command interpreter
  or administrative utility beneath it is the first observable step after a request reaches code
  execution. The investigation should determine which branch fired, whether the parent is the packaged
  service worker, what the spawned command actually did, and whether files, accounts, or recovery data
  changed as a result.
type: detection
detection_id: 91048c0d-5b81-4b85-a099-c9ee4fb87979
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Which branch of this rule's detection did the alerting command match, and does the event hold up on review?
  context: >-
    This rule fires only when the parent is a ruby process under an Aspera Faspex install path AND the
    child matches one of several independent branches: either powershell.exe or powershell_ise.exe
    carrying a flagged argument, or an lsass reference paired with procdump/tasklist/findstr, or
    wget.exe/curl.exe fetching an http URL, or one of the named script-engine, account-creation,
    Defender/LSA registry, wmic, vssadmin, or wbadmin commands. Note which branch fired — it decides
    which of the download, credential-access, and recovery-deletion follow-ups carry weight.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this command execution under the file-transfer server part of an authorized penetration test or red team engagement?
  context: >-
    Application-server exploitation and the post-exploitation commands that follow it are in scope for
    many authorized assessments. Check whether a test is active against this host or network segment
    and whether its scope covers the Aspera Faspex service. An engagement with matching tool usage and
    timing resolves the alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: Is the account running the file-transfer server expected to launch command interpreters or administrative utilities?
  context: >-
    A file-transfer server's worker process normally executes transfer and packaging logic, not
    interactive shells or system administration tools. Confirm what the service account is expected to
    do and whether any Faspex feature, plugin, or scheduled job on this host legitimately shells out to
    the command that fired.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is the Faspex ruby process expected to spawn this child, and what started the ruby process itself?
  context: >-
    The parent-child relationship is the core signal for this detection. The ruby worker is
    long-running and normally started by the Faspex service at boot, so its own start event may be
    hours or days before the alert. Its command line and its own parent show whether it is the packaged
    service worker or a copy launched by hand.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other child processes did the same ruby parent instance spawn around the alert?
  context: >-
    One command from an application worker is rarely the only one. Listing the other children of the
    same parent instance shows whether this is a single execution or a sequence of discovery,
    credential-access, and tampering steps driven through the same entry point.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Was the command encoded or obfuscated, and what does it decode to?
  context: >-
    The PowerShell branch of this rule matches tokens including encoded-command syntax,
    FromBase64String, Invoke-Expression, DownloadString, DownloadFile, and Invoke-WebRequest. Base64
    payloads and IEX download cradles hide the instruction set behind them. Decode the argument and
    identify the source URL, the local path written, and what is loaded into memory.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: What did the full run of flagged commands under the file-transfer server do?
  context: >-
    The alert covers one process, but a multi-step operation — discovery, then download, then defence
    tampering — spans several sequential invocations in the same minutes. Scoping to the flagged
    argument tokens rather than to the binary keeps routine powershell.exe volume out of the result
    while still showing the whole operation. Decode each argument list, including base64 blobs and any
    host or URL referenced.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_cli:
        CommandLine|contains:
          - 'FromBase64String'
          - 'Invoke-Expression'
          - 'iex '
          - 'iex('
          - 'DownloadString'
          - 'DownloadFile'
          - 'Invoke-WebRequest'
          - 'certutil'
          - 'bitsadmin'
          - 'whoami'
          - 'dsquery'
          - 'adscredentials'
          - 'samaccountname='
          - 'localgroup administrators'
          - 'lsass'
          - 'procdump'
          - 'add-MpPreference'
          - 'set-MpPreference'
          - 'vssadmin'
          - 'wbadmin'
          - 'wmic'
      condition: selection and selection_cli
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: Did PowerShell script block logging capture the full script content?
  context: >-
    Event ID 4104 records the deobfuscated script text PowerShell actually compiled, which is ground
    truth when the command line is base64-encoded or built by concatenation. If PowerShell operational
    logs are not ingested in this environment, treat an empty result as a visibility gap rather than
    evidence nothing ran, and decode the alerting command line directly instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
  answer_sources:
  - powershell_script_block
- question: Were PowerShell or Defender controls weakened before this execution?
  context: >-
    This rule's own token list includes add-MpPreference and set-MpPreference, so the tampering step
    may be the alerting event itself or may have preceded it. Execution-policy bypass arguments, AMSI
    patching, and version-2 downgrade calls in the hour before the alert point to preparation for a
    payload that would otherwise be blocked or logged.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: If a downloaded payload was executed, what is its hash — and is it known to threat intelligence?
  context: >-
    File-creation events carry no hash in this telemetry; the hash is recorded when the file runs. This
    query returns the processes spawned by the alerting command and by its parent — its children and
    siblings — with their executable hashes, which for a download-and-execute is the payload. If the
    payload was run later by an unrelated process it will not appear here; retrieve the file from its
    on-disk path and hash it manually.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      selection_siblings:
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: 1 of selection_*
    fields:
      - Image
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: Which files did the alerting command and its children write, and are they still on disk?
  context: >-
    The download, base64-decode, and process-dump branches of this rule all reference files.
    Correlating file writes to the alerting process and its direct children surfaces the payload path,
    decoded output, or dump file. A file still present can be hashed, detonated, or read; one already
    removed narrows the analysis to what the logs captured before deletion. This catches the process
    and its direct children, not grandchildren or unrelated writers.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What files did this binary write on the host after the alert?
  context: >-
    Post-exploitation commands leave characteristic artifacts — .dmp output from process dumps,
    archives staged under temporary or public directories, script and implant files dropped for
    persistence. This query lists writes by the alerting binary across the host, which also catches
    artifacts produced by later instances of it, outside the alerting process's own lineage.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: Did an account creation or privileged group change actually succeed?
  context: >-
    The net user /add and localgroup Administrators /add branches of this rule fire on the command, not
    on its result. Security channel events record whether the change completed — 4720 for account
    creation, 4722 for enable, 4724 for a password reset, and 4728/4732/4756 for group membership
    additions. A completed change means an account now needs review or disabling, not just a command
    line to explain.
  range: +15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4720
          - 4722
          - 4724
          - 4726
          - 4728
          - 4732
          - 4756
      condition: selection
    fields:
      - EventID
      - TargetUserName
      - SubjectUserName
  answer_sources:
  - alert
  - manual_review
- question: Has this ruby parent spawned this child binary on this host before?
  context: >-
    A file-transfer worker that has never spawned this binary in ninety days is a new pairing. A steady
    history instead points to a packaging hook, plugin, or operational script — read the historical
    command lines and confirm they resemble the alerting one before treating the pairing as routine,
    since the same parent-child pair can cover both a product feature and an injected command.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this account do across the environment around this time?
  context: >-
    Tracking the account fleet-wide shows whether the same identity drove activity on other hosts in
    the same window, which would widen the affected set beyond this server. If the alert fired under
    the Faspex service account, a machine account, or SYSTEM, this view fills with routine service
    telemetry and the program-pivot view is the meaningful one.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did the same Faspex-spawned pattern fire on other hosts in the same window?
  context: >-
    Under a service principal, "what else did this user do across the network" returns agent telemetry
    from every host, because the file-transfer server runs as a long-lived service. The meaningful
    question is whether the same launch mechanism fired elsewhere, so this query mirrors the rule's
    parent criterion scoped to the alerting child binary, fleet-wide, in the alert window. Several
    hosts in the same window points at a request run against every reachable server; a single host
    points at a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|contains|all:
          - 'aspera'
          - '\ruby'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
  answer_sources:
  - process_creation
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Aggregating every process start on the host by binary and parent collapses repetitive agent
    telemetry into single high-count rows and leaves novel parent-child pairs standing out at low
    counts. Scan for other children of application-server processes, reconnaissance utilities, and
    persistence mechanisms in the same window.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host help reconstruct the order of events — a request reaching code
    execution on the file-transfer service, then discovery, then credential access. An empty result is
    informative too, pointing at this server as the entry point rather than at movement from another
    host.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
