name: Office Macros Warning Disabled
id: 67bce3aa-7f0a-44aa-823e-bd0543136377
description: |
  Detects a registry write that sets a Microsoft Office application's VBAWarnings value to 1
  (DWORD 0x00000001), the "enable all macros" setting that lets both signed and unsigned VBA
  macros run without a prompt. The rule fires when a TargetObject ending in \Security\VBAWarnings
  is written AND the value data is DWORD (0x00000001). On a managed host this setting is normally
  left at the default (disable with notification) or governed centrally, so a direct write to the
  least-restrictive value is uncommon. Lowering the macro barrier is a defense-impairment step that
  a loader or a macro itself performs so a macro-bearing document runs its payload without a warning;
  investigate which process wrote the value and what launched it, whether an Office application then
  executed macros and spawned child processes, whether other configuration changes or persistence
  accompanied it, and whether the setting was later reverted.
type: detection
detection_id: 91239011-fe3c-4b54-9f24-15c86bb65913
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting registry write set an Office VBAWarnings value to enable all macros?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a
    value whose path ends in \Security\VBAWarnings is written AND the value data is DWORD
    (0x00000001), which is the "enable all macros" option. Review the exact TargetObject and Details
    on the triggering event to confirm the written value is 1 rather than a more restrictive setting.
    The default on a clean host is 2 (disable with notification), so a write of 1 removes the macro
    warning entirely.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to change Office macro security settings?
  context: >-
    The VBAWarnings value is normally left at its default or managed centrally, so an individual
    account lowering it to "enable all macros" is unusual outside of deliberate reconfiguration.
    Knowing whether the writing account and host function match any sanctioned change is often the
    fastest way to separate an administrator or testing activity from a loader preparing the host for
    macro execution. User attribution is present on roughly 94% of endpoint registry events; when it
    is a machine account or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which Office application and version does this VBAWarnings key belong to, and why is it a defense-impairment location?
  context: >-
    The VBAWarnings value sits under a per-application, per-version Security subkey (for example
    Software\Microsoft\Office\<version>\<app>\Security\VBAWarnings) and governs whether that Office
    program prompts before running VBA macros. Confirming the exact path establishes which product was
    reconfigured and the writing process, and separates a targeted macro-enable from an unrelated Office
    settings edit. This key is one of the specific registry locations worth monitoring because lowering
    it disables a built-in execution barrier rather than adding a feature.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What macro-security level does the written value data represent?
  context: >-
    The Details field holds the DWORD written to VBAWarnings. A value of 1 enables all macros, signed
    and unsigned, with no notification; 2 (the default) disables macros with a prompt; 3 allows only
    digitally signed macros; and 4 disables all macros without notification. A write of 1 is the
    least-restrictive setting and the one this rule targets. Details is present on roughly 79% of
    registry modifications and should be populated for this numeric value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote this value, and what launched that process?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to read
    its Image, full command, and parent. A change pushed through Office itself or a management tool is
    routine, whereas a write from reg.exe, powershell.exe, cmd.exe, or an unsigned binary launched by a
    script host or an Office application points to the macro barrier being lowered programmatically. The
    parent chain and the signing state of the writer distinguish a scripted or dropper-driven change
    from a deliberate administrator edit.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: After macros were enabled, did an Office application spawn child processes on this host?
  context: >-
    Enabling all macros removes the warning that would otherwise block a macro-bearing document, so the
    payoff is macro code running under an Office program. An Office application spawning child processes
    such as cmd.exe, powershell.exe, mshta.exe, wscript.exe, or an arbitrary binary shortly after the
    write is the sign that macros executed and the reconfiguration took effect. Correlating the registry
    change with nearby Office-parented execution ties the setting change to actual code execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_office:
        ParentImage|endswith:
          - '\winword.exe'
          - '\excel.exe'
          - '\powerpnt.exe'
          - '\outlook.exe'
          - '\msaccess.exe'
          - '\mspub.exe'
          - '\visio.exe'
      condition: selection and selection_office
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: After this write, was the VBAWarnings value changed again or reverted to a more restrictive setting?
  context: >-
    Registry key or value deletions are not observable in this telemetry, so durability is judged from
    the value's re-modification history rather than from a delete event. A later write that restores
    VBAWarnings to 2, 3, or removes the override suggests the change was temporary, possibly to reduce
    the window in which the weakened setting is visible; the value staying at 1 leaves macros enabled for
    every future document. Compare the Details values written over the following window.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Has this VBAWarnings value been modified before on this host?
  context: >-
    A macro-security setting should change rarely and only through deliberate action, so a history with
    no prior writes makes this a first-time change and raises its weight. A history of periodic writes to
    the same value points instead to a management process or a repeatedly run configuration tool. Compare
    the historical Details values to see whether the setting was previously set to 1 or whether enabling
    all macros is new for this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same VBAWarnings value modified on other hosts in the environment?
  context: >-
    The same write across many hosts suggests a broad policy change or a mis-scoped deployment, while the
    same write confined to one or a few hosts suggests targeted preparation for macro execution. Compare
    the Details values and writing processes across hosts to see whether they all set the value to 1 and
    whether a single tool is responsible, which separates a management action from repeated hands-on use
    of the technique.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor who lowers the macro barrier often makes other configuration changes in the same session,
    such as disabling other Office protected-view or trust settings, weakening antivirus or firewall
    policy, or adding a persistence key. Clustering the registry writes on this host in a short window
    around the alert reveals the full scope of changes and which process made them. The triggering key
    appears in the results; the signal is what else was modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A macro-enable rarely happens in isolation. Aggregating process activity in a tight window around the
    alert surfaces what led up to the setting change and what ran immediately after it. Novel parent-child
    pairs stand out at low counts against high-count routine telemetry, which is what points to the tool
    that reconfigured macro security and to any code that ran once the barrier was removed.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host, such as execution of scripting tools, reconnaissance, or defense
    tampering, may reveal the stages that preceded this change and help reconstruct the timeline. Lowering
    the macro warning is often a preparatory step, so prior alerts help place the setting change within a
    larger sequence rather than treating it as a standalone event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Enabling macros is frequently a means to run a payload that then establishes a foothold. Scheduled
    tasks, services, registry Run keys, BITS jobs, or WMI subscriptions created by schtasks.exe, sc.exe,
    reg.exe, bitsadmin.exe, or wmic.exe near the setting change indicate the weakened configuration was
    used to install persistence rather than being an isolated edit.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely: dropping an executable or script into
    a Startup folder or a path referenced by a registry Run key achieves persistence without invoking
    schtasks, sc, or reg. File writes to these locations near the macro-enable indicate that a macro
    payload established a parallel persistence mechanism on disk.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Does the user or an administrator recall changing the Office macro setting?
  context: >-
    The macro-security setting has no routine reason to change on most hosts, so direct confirmation from
    the account owner is a fast way to resolve the alert. If an administrator was reconfiguring Office or
    a user was following a documented procedure, that closes it; if no one recalls the change, the account
    may be compromised or the value was set by automated tooling, and the investigation should continue
    into the writing process and any Office-parented execution that followed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Was there a change ticket, maintenance window, or documented approval for this macro-setting change?
  context: >-
    Many organizations require change records for security-configuration edits. A corresponding ticket or
    a known deployment that lowers macro protection suggests authorized activity; the absence of one when
    policy requires it suggests the change was unauthorized. Central macro policy is usually pushed through
    group policy rather than a per-host registry write, so a direct write with no record is worth escalating.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
