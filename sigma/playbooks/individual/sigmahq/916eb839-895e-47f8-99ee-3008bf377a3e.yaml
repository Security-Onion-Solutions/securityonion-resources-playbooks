name: NTLM Hash Leak Via Curl NTLM Authentication
id: 5f5e22a0-b97d-4111-b4c8-7a39febd88b2
description: |
  Detects curl.exe invoked with the --ntlm flag and an empty -u or --user value (a bare colon).
  On the Microsoft-shipped, SSPI-enabled build of curl, supplying no identity in that position causes
  Windows to silently pass the current user's logon-session NTLM material into the authentication
  handshake instead of requiring a plaintext password. The resulting NTLMv2 challenge-response is
  sent to whichever host the command line names; if that host is attacker-controlled, the response
  can be cracked offline or relayed to authenticate elsewhere -- the same forced-authentication effect
  long achieved with UNC-path or embedded-image leaks, triggered here from a single command line.
  Legitimate use is narrow (deliberate SSPI passthrough in internal automation or testing); investigation
  should establish the destination the handshake was sent to, what invoked curl with this exact flag
  combination, and whether the exposed credential material was subsequently used for lateral movement.
type: detection
detection_id: 916eb839-895e-47f8-99ee-3008bf377a3e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the command line show curl invoked with --ntlm and an empty -u or --user value?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires
    only when curl.exe (identified by Image or OriginalFileName) is run with the --ntlm flag AND a -u
    or --user value that is empty or only a colon -- the specific combination that triggers the SSPI
    current-user credential passthrough. Read the full command line from the triggering event and
    verify both conditions are present; --ntlm alone, or an empty -u without --ntlm, does not produce
    the leak.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run curl with NTLM authentication and empty credentials?
  context: Legitimate uses of SSPI credential passthrough are narrow -- specific automation, monitoring
    agents, or internal tooling that intentionally authenticates as the running account to a trusted
    internal endpoint. Knowing whether this user role and host function are consistent with that kind
    of scripted internal authentication helps separate an intentional configuration from a forced-authentication
    attempt.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What destination did the NTLM handshake authenticate to?
  context: Unlike credential-dumping techniques that pull material out of LSASS or the SAM database,
    this technique passes the current logon session's NTLM material directly into an outbound handshake
    -- the host, URL, or IP named in the command line is where that material went. An internal, known
    endpoint is consistent with sanctioned automation; an external IP, unfamiliar domain, or raw IP
    address is consistent with a forced-authentication capture attempt.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned curl, and is that parent chain expected?
  context: The parent process shows how this curl invocation was triggered -- a scheduled task, a script
    interpreter, a document macro, or interactive use from a shell. This exact NTLM flag combination
    launched by cmd.exe, wscript.exe, mshta.exe, or an Office application fits a script or document
    delivering the command rather than deliberate interactive testing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Was a script or document written to this host shortly before the process that launched curl executed?
  context: Forced-authentication delivery mechanisms typically arrive as a script or document written
    to a user-writable location and then opened or executed, at which point it drives the curl invocation.
    A file dropped immediately before the launching process, in a temp, downloads, or startup-type
    folder, points to delivery rather than an operator typing the command interactively.
  range: -30m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after this event?
  context: A leaked NTLMv2 challenge-response can be cracked offline or relayed to authenticate elsewhere
    without ever touching this host again, but an operator who has already captured the response may
    also pivot directly from here. The query returns outbound connections from this host to remote-access
    ports in the hours after the event; the originating Image and User show what drove each connection.
    Two limits to keep in mind -- a relayed or cracked credential used from a different machine will
    not appear here (check logon events on suspected target hosts for this account), and the query
    requires network telemetry from this host; if that is not collected, treat zero rows as a visibility
    gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Which account's NTLM material was exposed, and does that account have elevated privileges?
  context: The severity of an NTLM leak depends on the privilege level of the exposed account. A domain
    admin or service account with broad access materially raises the impact of a successful crack or
    relay; a standard user account limits the immediate blast radius. Cross-reference the user with
    directory group memberships to determine privilege level.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- always_include: true
  question: Has this user previously produced this exact NTLM-leak command-line pattern, and does that history fit their role?
  context: The query mirrors the rule's detection logic scoped to this user -- the result is the user's
    90-day history of the specific --ntlm empty-credential pattern, not generic curl usage. A user who
    has never produced this pattern before is more suspicious than one who runs it routinely as part
    of a known task; weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \curl.exe
      - OriginalFileName: curl.exe
      selection_ntlm_flag:
        CommandLine|contains: --ntlm
      selection_empty_creds:
        CommandLine|re: '(?i)\s(-u|--user)\s*:'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this parent process historically driven this NTLM-leak pattern on this host or across the environment, or is the parent new for this activity?
  context: When the alert fires under a service principal, user identity does not attribute the behavior.
    The meaningful pivot is the launch mechanism -- the query mirrors the rule's detection logic scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this
    specific command-line pattern. A new or rare parent is the deviation worth chasing; a parent that
    already accounts for many prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \curl.exe
      - OriginalFileName: curl.exe
      selection_ntlm_flag:
        CommandLine|contains: --ntlm
      selection_empty_creds:
        CommandLine|re: '(?i)\s(-u|--user)\s*:'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking this user's activity across all hosts in a tight window reveals whether the NTLM-leak
    attempt is isolated or part of broader hands-on activity such as reconnaissance or repeated
    authentication attempts from other endpoints. The same user driving similar activity on several
    hosts widens the potential scope.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same parent-driven pattern fire on other hosts in the same window -- is this a coordinated rollout or isolated to this host?
  context: Under a service principal, tracking user activity network-wide returns agent-telemetry noise.
    The meaningful question is whether the same launch mechanism produced this pattern elsewhere -- the
    query mirrors the rule's detection logic scoped to the alerting parent process, fleet-wide, in the
    alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single
    host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \curl.exe
      - OriginalFileName: curl.exe
      selection_ntlm_flag:
        CommandLine|contains: --ntlm
      selection_empty_creds:
        CommandLine|re: '(?i)\s(-u|--user)\s*:'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired this rule's exact NTLM-leak pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's detection logic with no host scope, so the result is a fleet-wide
    count of curl invocations that match the specific --ntlm plus empty-credential combination, not
    curl's generic fleet footprint. Many hosts firing the identical pattern points to a pushed script
    or vendor automation that deliberately relies on SSPI passthrough; a single host or a small unrelated
    set points to a one-off or targeted delivery.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \curl.exe
      - OriginalFileName: curl.exe
      selection_ntlm_flag:
        CommandLine|contains: --ntlm
      selection_empty_creds:
        CommandLine|re: '(?i)\s(-u|--user)\s*:'
      condition: all of selection_*
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the NTLM-leak attempt reveals
    what led to it and what followed -- reconnaissance, a delivery mechanism, or a follow-on step
    using the exposed material. Aggregating by process and parent collapses repetitive agent telemetry
    while novel process pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- defense tampering, reconnaissance, or delivery of a
    script or document -- may reveal the stages that preceded this NTLM-leak attempt and help
    reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were any other LOLBins used to make outbound requests or fetch remote content on this host recently?
  context: Attackers who use one LOLBin for outbound requests often use several -- certutil, bitsadmin,
    and similar binaries can also be used to reach an attacker-controlled endpoint or fetch staged
    content. Finding multiple such tools invoked around the same time strengthens the case for
    deliberate, scripted activity over a one-off command.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\hh.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was this curl binary executed from an expected path?
  context: curl.exe shipped by Microsoft normally runs from the System32 directory. A copy of curl
    running from a temp, profile, or staging directory under a name that does not match its
    OriginalFileName indicates the binary was relocated or renamed to evade path-based controls, which
    raises the likelihood this is deliberate tooling rather than routine use.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired this exact NTLM-leak pattern over the past 90 days, and what command-line structures are typical?
  context: A command-line pattern with no prior history on a host is more suspicious than one used
    routinely under stable automation. The query mirrors the rule's detection logic scoped to this
    host, so the resulting count reflects the specific --ntlm empty-credential pattern rather than
    generic curl usage. The CommandLine projection lets the analyst compare the typical invocation
    (destination host, additional flags) against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \curl.exe
      - OriginalFileName: curl.exe
      selection_ntlm_flag:
        CommandLine|contains: --ntlm
      selection_empty_creds:
        CommandLine|re: '(?i)\s(-u|--user)\s*:'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
