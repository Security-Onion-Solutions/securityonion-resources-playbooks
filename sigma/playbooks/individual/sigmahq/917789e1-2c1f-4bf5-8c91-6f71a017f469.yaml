name: Commvault QLogin with PublicSharingUser and GUID Password (CVE-2025-57788)
id: 2b44f6e7-0642-4c57-bb6b-7172d98536e4
description: |
  Detects a Commvault qlogin command line that authenticates as the built-in `_+_PublicSharingUser_`
  account while supplying a GUID-formatted string as the password. The rule fires only when a single
  command line carries all three elements together: the qlogin invocation, the `_+_PublicSharingUser_`
  username, and a GUID pattern in the arguments. That account is internal to the backup platform and its
  password is a GUID that unpatched builds expose to unauthenticated callers (CVE-2025-57788), so a
  non-interactive authentication with it is either the product or an administrative script using the
  account as designed, or an attempt to use a credential that was never meant to be reachable — that
  distinction is what the investigation has to settle. Establish which process drove the invocation,
  which commserver it authenticated against, whether the same account is used this way elsewhere in the
  environment, and what the session did afterwards.
type: detection
detection_id: 917789e1-2c1f-4bf5-8c91-6f71a017f469
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: >-
    Does the command line contain a qlogin invocation with the `_+_PublicSharingUser_` account and a
    GUID-formatted password?
  context: >-
    Confirm the alert before spending time on it. The rule requires all three elements in one command
    line: the qlogin invocation, the `_+_PublicSharingUser_` username, and a GUID-formatted string in
    the arguments. Read the full command line and note which argument carries the GUID, which commserver
    was named, and whether any argument value looks like it carries additional embedded flags.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this host expected to run the backup product's CLI, and is this account expected to invoke it?
  context: >-
    The account named in the command line is an application identity, not a Windows one, so the user shown
    here is whoever ran the CLI. A CommServe, media agent, or backup-administration host running the CLI
    under an operator or service identity is routine; a workstation or a host with no backup role running
    it is not. Note whether the invoking account administers the backup platform at all.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What request or parent process drove this qlogin invocation?
  context: >-
    The product's web front-end proxies REST requests to a backend that builds the qlogin argument string
    from request-supplied fields, so a qlogin process parented by a web or application-server process points
    at a request-driven invocation rather than an operator at a console. Read the parent command line, then
    correlate against the application and web-server access logs for the originating request and source
    address in the minutes before the alert.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - manual_review
  - edr_console
- question: Is the Commvault installation on this host patched against CVE-2025-57788?
  context: >-
    The `_+_PublicSharingUser_` password is a fixed GUID that unpatched builds hand to unauthenticated
    callers, so patch level decides whether the credential could have come from the product itself rather
    than from an internal script. Affected builds are 11.32.0-11.32.101, 11.36.0-11.36.59, and
    11.38.20-11.38.25. Confirm the installed build here and whether the same version runs on the other
    backup hosts.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
  answer_sources:
  - asset_inventory
  - edr_console
- question: >-
    Does the timing of this invocation align with normal work hours or a scheduled backup or maintenance
    window?
  context: >-
    Backup platforms run most of their work on a schedule, so use of the built-in sharing account inside a
    nightly job window reads differently from the same command at an arbitrary hour with no job attached.
    Check the host's local time, the product's job schedule for that window, and whether an operator was
    working. Timing narrows the question; it does not settle it on its own.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - asset_inventory
- question: What exactly did this qlogin command do? Decode every argument.
  context: >-
    The CLI takes the commserver, commserver name, username, and password as separate arguments, and the
    server-side path builds that argument string by string formatting without sanitizing the values, so
    extra flags can be smuggled inside what looks like a single field value. Read every argument: which
    commserver was targeted, whether the username or commserver value carries embedded switches, and
    whether several qlogin invocations in the same window form one operation. The query is anchored on
    the command line rather than the binary because the rule itself matches only on command-line content.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: qlogin
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned this qlogin invocation, and what spawned that parent?
  context: >-
    The parent identifies how the CLI was reached. A scheduler or the backup product's own service points
    at product automation; a web or application-server process, or an interactive shell, points at a
    request-driven or hands-on-keyboard invocation. The result carries the parent's own parent and command
    line, which shows what the launch chain looked like above the CLI.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What Windows logon activity accompanied this qlogin invocation on this host?
  context: >-
    The account in the command line is an application identity and never appears as a Windows logon, so the
    value here is the surrounding session context. A 4648 event shows an account deliberately supplying a
    second set of credentials; a 4624 with LogonType 10 or 3 and a remote IpAddress shows the CLI ran in a
    session that arrived over the network rather than at the console. Built-in and default account names are
    routinely renamed, so key on the logon type and source address rather than on a specific username. If the
    Security channel is not collected from this host, treat zero results as a visibility gap rather than
    evidence that nothing logged on.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4624
          - 4648
      condition: selection
    fields:
      - TargetUserName
      - LogonType
      - IpAddress
      - SubjectUserName
  answer_sources:
  - active_directory
  - manual_review
- question: Which address and port did this qlogin process connect to, and is that the commserver this host uses?
  context: >-
    The CLI authenticates against whatever commserver its arguments name, and that argument is caller-supplied
    on the request-driven path, so read the destination the process actually contacted instead of inferring it
    from the command line. Compare the address and port against the CommServe this host is registered to. A
    connection to an unexpected address, or to a local backend port rather than the registered server, changes
    what the authentication attempt means.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
  - asset_inventory
- question: >-
    Has this user account produced this qlogin authentication pattern before, and does that history fit its
    role?
  context: >-
    The query counts this account's 90-day history of the rule's exact pattern — the sharing account plus a
    GUID password — rather than generic use of the CLI, aggregated by host. A steady prior count means an
    established script is doing this; a first-ever occurrence for an account that otherwise never touches the
    backup CLI is the deviation to chase. Weigh the count against what the account exists to do.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - qlogin
        - _+_PublicSharingUser_
        CommandLine|re: '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: >-
    Has this parent process historically driven this qlogin authentication pattern, or is the parent new for
    this activity?
  context: >-
    When the CLI runs under a service identity, the Windows user attributes nothing; the launch mechanism does.
    The query counts the 90-day history of this same parent producing the rule's exact pattern, aggregated by
    host. A parent that already accounts for a long run of prior events is product or scheduler automation; a
    parent that has never driven this pattern before is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - qlogin
        - _+_PublicSharingUser_
        CommandLine|re: '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did this user account do across the environment around this time?
  context: >-
    Tracking the account's activity on every host in the alert window shows whether the credential is being
    used in one place or several. The same account driving activity on multiple hosts in a short window points
    at movement or a scripted sweep rather than a single job. If the alert fired under a service identity,
    expect routine agent activity here and read the parent-scoped fleet view instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: Did this same parent-driven qlogin pattern fire on other hosts in the same window?
  context: >-
    The query counts the rule's exact pattern under the same parent process across every host in the alert
    window. Several hosts firing together points at scheduled or pushed automation; a single host points at a
    host-local trigger, which for a credential this specific is the case that needs an owner named.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - qlogin
        - _+_PublicSharingUser_
        CommandLine|re: '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What did this user account do next on this host?
  context: >-
    Authentication is the first step; what the session did with it is the substance. Look through the following
    four hours for backup job or storage-policy manipulation, archive and export operations, credential access,
    scripting hosts, or archive utilities starting under the same account.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
  always_include: true
- question: >-
    What other qlogin invocations followed on this host in the next four hours, and did the parent or the
    argument set change?
  context: >-
    Under a service identity the user-scoped follow-on is unbounded, so the focused version is repeat use of the
    CLI itself. Routine automation repeats with a stable parent and a stable argument set; a change of parent, a
    different commserver, or a switch to a different account in the following hours is the signal worth chasing.
    The query anchors on the command line rather than the binary because the rule matches only on command-line
    content and the invoking image may be a shell.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: qlogin
      condition: selection
    fields:
      - ParentImage
      - CommandLine
  answer_sources:
  - process_creation
  always_include: true
- question: Are there detections for this user account on other hosts in the past day?
  context: >-
    If the same account is attached to detections on more than one host, the account rather than this single
    invocation is what needs scoping. Check for lateral movement or repeated credential use across the
    environment. If the account resolves to a service identity, or the user field is absent from alert records,
    this returns little and the user-scoped process view is the fallback.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        user.name|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
  answer_sources:
  - alert
  always_include: true
- question: Did this same rule fire on other hosts in the past 24 hours?
  context: >-
    Whether this detection is firing in one place or many separates an environment-wide condition — an
    administrative script that uses the built-in account on every backup host — from an isolated event. Many
    hosts at once usually resolves to product automation or to an enumeration of the estate with the same
    credential; a single host with no counterpart elsewhere is the deviation that needs an owner named.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
  answer_sources:
  - alert
  always_include: true
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating every process launch on the host in the surrounding window collapses routine agent traffic into
    a few high-count rows and leaves novel parent-child pairs standing out at low counts. Look for what preceded
    the authentication — a web or application-server process spawning shells, scripting hosts, or archive
    utilities — and for what started immediately after it.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
