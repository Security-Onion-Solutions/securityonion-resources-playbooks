name: Disable Security Events Logging Adding Reg Key MiniNt
id: 55b6a7ea-c0aa-4a44-a8a9-3135ee06807f
description: |
  Detects the appearance of the registry key HKLM\SYSTEM\CurrentControlSet\Control\MiniNt, either through a
  key created directly at that path or through an existing key renamed onto it. Windows reads the presence of
  MiniNt as a signal that it is running in the preinstallation environment, which does not run the Event Log
  service, so after the next restart the Security event log silently stops recording. The technique needs no
  service stop, no wevtutil invocation and no log clearing, which is why it leaves none of the usual
  defense-impairment artifacts, and the key has essentially no legitimate population on a running production
  host. The investigation should establish which process created the key and what launched it, whether the host
  has restarted since, and what ran on the host afterwards using telemetry collected independently of the
  Windows event log.
type: detection
detection_id: 919f2ef0-be2d-4a7a-b635-eb2b41fde044
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Does the alerting event show the MiniNt key appearing under HKLM\SYSTEM\CurrentControlSet\Control, and by
    which of the two routes?
  context: >-
    The rule fires on either of two alternatives — a key created directly at
    HKLM\SYSTEM\CurrentControlSet\Control\MiniNt, or an existing key renamed so that its new name becomes that
    path. Note which alternative fired. A direct creation is the common single-command primitive; a rename onto
    the path means the key was staged elsewhere first, which points at an attempt to avoid a detection anchored
    on the literal path and makes the writing process's earlier registry activity worth reading. Read the signer
    columns for coherence rather than as a verdict — no vendor legitimately owns this key, so a trusted
    signature only tells you a signed binary was used to make the change.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - EventType
      - NewName
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - registry_event
- question: Is this user and host expected to create keys under HKLM\SYSTEM\CurrentControlSet\Control?
  context: >-
    MiniNt is a marker of the preinstallation environment, not a configuration switch administrators set, and it
    has essentially no legitimate population on a running production Windows host. Unlike most logging changes
    there is no routine operational case for it, so the useful work is identifying the account and the writing
    process rather than searching for an approved-change explanation. User attribution is present on most
    endpoint registry events; where it resolves to a machine account or SYSTEM, pivot on the writing process
    instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What launched the process that created the MiniNt key?
  context: >-
    The registry event names the process that wrote the key but carries no lineage; that process's own start
    event holds the parent. Creating this key takes a single command through reg.exe, a PowerShell cmdlet, or a
    direct API call from a compiled binary, so the writing tool itself discriminates little and the parent is
    where the separation lies — an imaging or deployment chain reads very differently from an interactive shell,
    a script host, or a remote-execution service.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other processes did the key-writing process spawn?
  context: >-
    Suppressing event logging is an enabling step rather than an objective, so the process that wrote the key
    frequently goes on to launch the activity the suppression was meant to cover. Listing its children shows
    whether the write was isolated or one step in a longer sequence. Note this shows what the acting process
    started, not what started alongside it — registry telemetry does not record the acting process's own parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Was there a change ticket, maintenance window, or documented build activity that would account for this key?
  context: >-
    This is the one organizational check worth running here. MiniNt is not a supported configuration setting and
    no standard deployment tooling creates it, so a ticket is unlikely to exist; the value of the check is to
    rule out imaging, recovery-media, or bench-build workflows in which a host genuinely passed through the
    preinstallation environment. Absent one of those, treat the key's presence as the finding and spend the
    remaining effort on attribution and on what followed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: What exactly was written at the MiniNt path, and what does the presence of that key change on this host?
  context: >-
    The primitive is the key itself rather than any value under it — its presence makes Windows behave as though
    it booted into the preinstallation environment, where the Event Log service is not started. Value data is
    normally absent, so the discriminating details are the exact path and the writing process. This is an evasion
    location, not a persistence location; nothing executes from it. Judge the signer for coherence with the key
    being written, not as exculpatory — essentially every alerting process on Windows endpoint telemetry is
    trusted-signed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - registry_event
- question: Which logging mechanism does this change disable, and what command performed it?
  context: >-
    The control targeted is the Windows event log service as a whole — on a host carrying this key the service
    does not start at boot and the Security channel stops recording. The command line of the writing process
    shows how the key was created and whether the same invocation touched anything else. Because the suppression
    needs no service stop and no log clearing, the artifacts analysts usually look for after tampering, such as a
    log-cleared record or a service state change, will not be present.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Has the MiniNt path been written again on this host since the alert fired?
  context: >-
    Endpoint registry telemetry emits no key or value deletion events, so removal of the key cannot be confirmed
    from logs — a later write to the same path is the only registry-side evidence available. Repeated writes
    point at the key being re-established, either by a workflow that recreates it or by a process holding it in
    place. Establish the key's current presence by inspecting the host directly rather than inferring it from an
    absence of events.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
  answer_sources:
  - registry_event
  - manual_review
- question: Has the host restarted since the key was created?
  context: >-
    The key takes effect at boot — Windows reads it during startup and skips the Event Log service. Until the
    host restarts the change is latent and logging continues. Boot-time processes such as smss.exe, wininit.exe
    and winlogon.exe appearing in endpoint process telemetry mark a restart, and that telemetry is collected
    independently of the Windows event log, so it remains available after the suppression takes hold. A restart
    after the write is the point from which event-log evidence should be read as missing rather than absent.
  range: +7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_boot:
        Image|endswith:
          - '\smss.exe'
          - '\wininit.exe'
          - '\winlogon.exe'
          - '\services.exe'
      condition: selection and selection_boot
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Is this host still producing Security event log records after the key was created?
  context: >-
    If the key took effect at the next restart the Security channel stops recording, so an absence of records
    after the write is the expected result of the technique and not a reason for reassurance. A continuous stream
    of records means the change has not taken effect yet, most likely because the host has not restarted.
    Records that stop with no preceding log-cleared entry and no service stop match this technique rather than
    ordinary rotation. If the Security channel is not collected from this host at all, treat a zero result as a
    visibility gap and confirm the state on the host.
  range: +7d
  query: |
    aggregation: true
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - EventID
  answer_sources:
  - manual_review
- question: Is event logging on this host currently working, or is the key still in place?
  context: >-
    The suppression lasts as long as the key exists and applies from each restart onward. Establishing the
    current state requires inspecting the host — check for the key under HKLM\SYSTEM\CurrentControlSet\Control
    and check whether the Event Log service is running — because registry telemetry cannot show the key being
    removed. Restoring logging means deleting the key and restarting. Until that is done, any event-log-based
    analysis of this host is working from an incomplete record, and forwarded copies of earlier records or
    evidence from other hosts carry more weight than this host's own channels.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - edr_console
  - manual_review
- question: What ran on this host after the key was created?
  context: >-
    Event logging is suppressed in preparation for something; the activity it is meant to cover comes afterwards
    and by design may leave no event log record. Endpoint process telemetry is collected separately from the
    Windows event log and keeps reporting once the key takes effect, which makes it the surviving view of the
    window after the write. Scan for novel parent-child pairs at low counts — repetitive high-count rows are the
    host's routine activity.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: Were other defense tampering actions performed on this host around the same time?
  context: >-
    An operator who suppresses logging often also stops services, clears logs, disables antimalware, or removes
    shadow copies in the same session. Several of those under one account or lineage point at a hands-on session
    working through a sequence rather than an isolated change. This query covers the common tampering tools and
    switches; the registry write that triggered this alert is a quieter primitive than any of them and will not
    itself appear in these results.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: Were other registry modifications made on this host in the same session?
  context: >-
    A MiniNt write is one command, but the session containing it usually touches other keys as well — service
    configuration, policy paths, or autostart locations. Grouping registry modifications on this host in the
    surrounding window by key path and writing process shows what landed alongside it. The triggering key will
    appear in the results; the signal is what accompanies it and whether one process accounts for a cluster of
    changes.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
  answer_sources:
  - registry_event
- question: Has the MiniNt path ever been written on this host before?
  context: >-
    This path has essentially no legitimate population on a running production Windows host, so an empty history
    is the expected result and a first-ever write is consistent with the technique. A prior history of writes
    points at something environment-specific — an imaging or recovery workflow that runs on this hardware, or a
    tool that recreates the key — and is worth understanding before the current write is treated as the finding.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Image
      - User
  answer_sources:
  - registry_event
- question: Was the MiniNt path written on any other host in the environment?
  context: >-
    Because this key has no legitimate population, its appearance on more than one host points at a repeated
    procedure rather than coincidence — an operator working through several machines, or a mechanism pushing the
    change. Compare the writing process and account across hosts: the same pair on several machines suggests
    scripted reuse, while different ones suggest hands-on work. A single host suggests targeted activity, and any
    other host returned here should be checked for a restart as well.
  range: -30d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - User
  answer_sources:
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Suppressing event logging is rarely a first step. Earlier detections on the same host — credential access,
    remote execution, reconnaissance — place this write in a sequence and set the window for the rest of the
    investigation. Detections that fired before the write were recorded while logging still worked, which makes
    that part of the timeline the more complete one and the better place to reconstruct how the host was reached.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
