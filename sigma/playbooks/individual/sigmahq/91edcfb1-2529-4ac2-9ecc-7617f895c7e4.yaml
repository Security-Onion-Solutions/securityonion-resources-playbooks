name: Weak or Abused Passwords In CLI
id: cefdba19-05ab-4b37-854f-b00f0f6542ee
description: |
  Detects weak or commonly abused passwords passed inline on the command line, where the password string itself is the
  detection criteria. This pattern most often appears when an account is created or its password is set non-interactively
  (for example, net user / net1 user with a password argument), and the same weak strings recur across hands-on-keyboard
  intrusions because operators reuse throwaway credentials. Legitimate but discouraged uses include scripted account setup
  and lab automation; the investigation should determine which process supplied the password, whether an account was created
  or modified, who ran it, and whether the surrounding activity looks like routine administration or operator tradecraft.
type: detection
detection_id: 91edcfb1-2529-4ac2-9ecc-7617f895c7e4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line contain one of the weak or abused password strings this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the full command line and
    identifying which of the watched password strings appears in it. Note the surrounding command — whether the password was
    an argument to an account-creation or password-set command versus an unrelated string that happened to match.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to set credentials or create accounts from the command line?
  context: Legitimate administrative activity and provisioning scripts can pass passwords inline. Knowing whether the user
    role and host function are consistent with command-line account management is often the fastest way to separate routine
    automation from operator activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What was the full command, and what operation supplied this password inline?
  context: The full command line reveals what the password was used for. Determine the executing binary and subcommand —
    whether this is account creation or modification (for example net user, net1 user, or a localgroup add), a service or
    scheduled-task install carrying a credential, or a tool authenticating to a remote resource. Inline passwords on account
    commands are a common way operators stand up a foothold account quickly.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - Image
      - CurrentDirectory
- question: What process spawned this command, and is that parent chain expected?
  context: The parent process reveals how the command was invoked. Interactive administration typically descends from
    explorer.exe or a console launched by a logged-on admin. A parent such as a script host, a remote-execution service, or
    an unexpected application can indicate scripted deployment or operator activity rather than a person at the keyboard.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What other processes did this same parent spawn around the alert?
  context: Sibling processes launched by the same parent reveal the broader operation. Inline weak-password use often sits
    next to account-manipulation, discovery, or persistence commands; finding those alongside this event helps distinguish a
    one-off provisioning step from a multi-stage operator sequence.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this weak-password command-line pattern been seen on this host before?
  context: A host that has never produced one of these password strings on the command line is more notable than one where
    scripted provisioning routinely does so. Zero or very low historical counts point to first-time or rare use; recurring
    counts suggest an established (if discouraged) automation pattern worth confirming with the host owner.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - '123456789'
        - 123123qwE
        - Asd123.aaaa
        - Decryptme
        - P@ssw0rd!
        - Pass8080
        - password123
        - test@202
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and
    does the current alert fit that pattern?
  context: Even discouraged automation has a normal pattern. The query mirrors the rule's selection scoped to this host, so the
    resulting parent and user distribution reflects how this weak-password pattern has historically run here. A new parent
    process, an unexpected account, or an unusual command structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - '123456789'
        - 123123qwE
        - Asd123.aaaa
        - Decryptme
        - P@ssw0rd!
        - Pass8080
        - password123
        - test@202
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - '123456789'
        - 123123qwE
        - Asd123.aaaa
        - Decryptme
        - P@ssw0rd!
        - Pass8080
        - password123
        - test@202
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - '123456789'
        - 123123qwE
        - Asd123.aaaa
        - Decryptme
        - P@ssw0rd!
        - Pass8080
        - password123
        - test@202
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or repeated provisioning across multiple
    endpoints. If the same user supplied weak credentials or ran related commands on several hosts in a short window, the
    scope of the activity may be larger than this one alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - '123456789'
        - 123123qwE
        - Asd123.aaaa
        - Decryptme
        - P@ssw0rd!
        - Pass8080
        - password123
        - test@202
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other tools ran on this host around the same time?
  context: Operations rarely involve a single command. Activity surrounding the inline-password event may reveal
    reconnaissance, account enumeration, privilege changes, persistence installation, or data staging that frames whether
    this is routine provisioning or part of a larger sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the stages
    that preceded the inline-password use and help reconstruct the timeline. Account creation with a weak credential is often
    a mid-operation foothold step rather than the first action.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired this weak-password pattern in the past week, and does the cross-host distribution look like
    consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this weak-password
    pattern. Many hosts firing the same pattern points to scripted deployment or a shared provisioning template; one host or a
    small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - '123456789'
        - 123123qwE
        - Asd123.aaaa
        - Decryptme
        - P@ssw0rd!
        - Pass8080
        - password123
        - test@202
      condition: selection
    fields:
    - host.name
