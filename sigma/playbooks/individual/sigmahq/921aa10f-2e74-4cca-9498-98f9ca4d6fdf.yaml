name: Registry Modification Attempt Via VBScript
id: 73109601-02c5-46b4-aebe-c4f94c62bf93
description: |
  Detects command lines that combine CreateObject, Wscript.Shell, and the .RegWrite method, a VBScript pattern used to write
  Windows registry values without invoking reg.exe, regedit.exe, or PowerShell. The technique is commonly executed by script
  hosts such as wscript.exe, cscript.exe, mshta.exe, or rundll32.exe, and is frequently used to land Run/RunOnce autorun
  persistence keys while avoiding tools that direct registry edits would normally produce. The investigation should determine
  what registry key and value were written, what executes as a result, which script host carried out the write, and whether
  the action was authorized.
type: detection
detection_id: 921aa10f-2e74-4cca-9498-98f9ca4d6fdf
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line contain CreateObject, Wscript.Shell, and the .RegWrite method together?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line. The
    rule fires only when all three tokens appear together, which is the signature of a VBScript RegWrite registry write rather
    than a direct edit via reg.exe or regedit.exe.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to script registry changes via a VBScript RegWrite?
  context: Legitimate administrative activity can trigger this detection. Knowing whether the user role and host function are
    consistent with scripted registry writes is often the fastest path to distinguishing true positives from routine operations.
    Most users and endpoints never write registry values through a VBScript RegWrite call.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which script host carried out the RegWrite, and what started that script host?
  context: The script host that executes the VBScript determines how stealthy the write is. wscript.exe and cscript.exe read
    a script from disk, while mshta.exe and rundll32 can run inline VBScript without a script file. Tracing the parent's own
    origin reveals whether the chain is legitimate (a user double-clicked a script) or suspicious (an Office application or
    a download spawned the script host).
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did the same parent spawn around this time?
  context: If the parent that launched the script host spawned other processes too, examining siblings reveals the full scope
    of activity from that parent. Multiple script hosts or post-exploitation binaries from the same parent points to orchestrated
    activity rather than an isolated script run.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Was there a change ticket, maintenance window, or documented approval for this registry change?
  context: Many organizations require change tickets for system modifications, especially persistence-relevant registry writes.
    A corresponding ticket suggests authorized activity; absence of one when policy requires it suggests the action was unauthorized.
    This check can quickly close false positives or escalate true positives.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this activity align with normal work hours and maintenance windows?
  context: Legitimate system changes typically occur during business hours or scheduled maintenance windows. A scripted registry
    write at 3 AM on a Saturday is more suspicious than the same activity during a documented weekday maintenance window.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What specific registry key and value did the RegWrite call target, and is it a known persistence or evasion location?
  context: The registry path reveals intent. Run/RunOnce keys under HKCU or HKLM CurrentVersion\Run indicate autorun persistence;
    keys under Windows Defender policy paths indicate security tool tampering; Image File Execution Options keys indicate debugger-based
    hijacking. If registry auditing is collected, the linked registry_set event shows the target key and value data as structured
    fields; otherwise reconstruct them from the RegWrite arguments in the command line.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Is the VBScript command line encoded or obfuscated, and what does the reconstructed string write to the registry?
  context: VBScript registry writers frequently hide the target key, value, and payload behind Chr() chains, string concatenation,
    or environment-variable substitution so the RegWrite arguments are not readable at a glance. Reconstruct the string from
    any Chr() chain or concatenation to recover the actual key path and the executable or script that will run from it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were other registry modifications made on this host in the same session, whether via script hosts or reg.exe?
  context: Operators who write one registry key often write several -- for example, setting a Run key for persistence while
    also disabling a security setting. Finding clusters of registry-write activity on the host within a short window reveals
    the full scope of the configuration changes and whether multiple objectives were pursued.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        - CommandLine|contains|all:
            - CreateObject
            - .RegWrite
        - Image|endswith:
            - '\reg.exe'
            - '\regedit.exe'
          CommandLine|contains:
            - ' add '
            - ' delete '
            - ' import '
      condition: selection and selection_reg
    fields:
      - CommandLine
- question: Does the registry value reference an executable or script that is still present on disk?
  context: A registry autorun entry is only effective if the referenced payload exists at the path written to the value. If
    the RegWrite call pointed a Run key at a path under a user-writable directory, checking whether that file exists and analyzing
    its hash determines whether the persistence mechanism is active and what it would execute on next logon. If the value data
    cannot be resolved to a path from logs, examine the registry value directly to identify the referenced file.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: When this host has previously fired this RegWrite pattern, what parents and users normally drive it, and does the
    current alert fit?
  context: Even routine automation can use VBScript registry writes. This query mirrors the rule's command-line pattern scoped
    to this host, so the resulting parent and user distribution reflects how this specific RegWrite pattern has historically
    run here. A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - CreateObject
        - Wscript.shell
        - .RegWrite
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - CreateObject
        - Wscript.shell
        - .RegWrite
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - CreateObject
        - Wscript.shell
        - .RegWrite
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If
    the same user triggered similar activity on several hosts, the scope of the activity may be larger than a single registry
    write.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - CreateObject
        - Wscript.shell
        - .RegWrite
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Were other process-based persistence mechanisms installed on this host?
  context: Operators rarely rely on a single persistence mechanism. After establishing one foothold via a registry RegWrite,
    they commonly install backup mechanisms using different techniques such as scheduled tasks, services, or BITS jobs. Multiple
    persistence installations in the same timeframe indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations such as the Startup folder or scheduled-task definition paths on this host?
  context: File-based persistence bypasses command-line detection entirely. Dropping an executable or script into the Startup
    folder or a path referenced by a registry Run key achieves persistence without any registry tool. File event monitoring
    captures these drops even when the operator avoids standard persistence tooling.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- defense tampering, reconnaissance, or
    credential access -- may reveal the attack stages that preceded this registry write and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
