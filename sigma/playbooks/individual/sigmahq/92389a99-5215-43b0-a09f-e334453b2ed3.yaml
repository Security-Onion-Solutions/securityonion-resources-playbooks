name: Potential CVE-2023-36874 Exploitation - Uncommon Report.Wer Location
id: 382f878a-f84e-4749-beb5-c9c7d617cf2c
description: |
  Detects the creation of a Report.wer file inside the Windows Error Reporting archive
  (a path containing :\ProgramData\Microsoft\Windows\WER\ReportArchive\ and ending in
  \Report.wer) whose containing subfolder does NOT start with one of the standard crash-category
  prefixes (AppCrash_, AppHang_, Critical_, Kernel_, NonCritical_). The rule fires when the
  archive-path selection matches AND none of the normal-prefix filters match, so a Report.wer that
  lands in an unexpectedly named subfolder is the trigger. CVE-2023-36874 is a local privilege
  escalation in the WER service: an unprivileged process uses COM interfaces exposed by the WER
  service to create a filesystem redirection (a symbolic link) so that the privileged service writes
  its report into an attacker-chosen location, and the operation ultimately spawns a high-integrity
  interpreter such as cmd.exe or powershell_ise.exe, or installs a privileged scheduled task if the
  direct spawn fails. Legitimate WER reports always land in the standard AppCrash_/AppHang_/Critical_/
  Kernel_/NonCritical_ subfolders, so a Report.wer in any other subfolder is anomalous. Investigate
  the exact archive path, which process wrote the report and what launched it, whether a high-integrity
  interpreter spawned on the host around the same time, whether the file remains on disk, and whether
  the same anomalous pattern appears for this user, launch mechanism, or across other hosts.
type: detection
detection_id: 92389a99-5215-43b0-a09f-e334453b2ed3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Did a Report.wer file get written to a WER ReportArchive subfolder that is not one of the standard crash-category folders?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a
    Report.wer file is created under a path containing :\ProgramData\Microsoft\Windows\WER\ReportArchive\
    AND the containing subfolder does NOT start with AppCrash_, AppHang_, Critical_, Kernel_, or
    NonCritical_. Review the full TargetFilename on the triggering event and confirm the subfolder name
    is non-standard - legitimate Windows Error Reporting always uses the standard prefixes, so any other
    subfolder name is the anomaly this rule detects. Note the operation type and the responsible process
    for the following steps.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to produce Windows Error Reporting archive entries in non-standard locations?
  context: >-
    Legitimate crash reporting is driven by the WER service and lands only in the standard
    crash-category subfolders, so there is effectively no routine reason for a Report.wer to appear in a
    differently named archive subfolder. Knowing whether the writing account and host function are
    consistent with any sanctioned tool or test is often the fastest way to separate a benign anomaly
    from exploitation. User attribution is present on roughly 94% of endpoint file events; when it is a
    machine account or SYSTEM - which is expected here, since the privileged WER service performs the
    write - judge by the writing process and the host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What does the Report.wer file contain, and which application or process does it report on?
  context: >-
    A Report.wer file is a text manifest that names the faulting executable, its path, the loaded
    modules, and the event that triggered the report. Reading its contents reveals which process the WER
    service was reporting on and whether that target is consistent with a genuine crash or with the
    manipulated report path this exploit produces. The file content is not carried in endpoint telemetry
    and must be retrieved from the host or a forensic copy; compare the reported application path and
    signature status against what legitimately runs on this host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Which process wrote this Report.wer file, and what launched that process?
  context: >-
    The file event carries the writing process identifier but no command line or parent, so pivot by its
    ProcessGuid to the writing process's own record to read its Image, full command, and parent. A
    legitimate archive write comes from the WER service host (wermgr.exe, WerFault.exe, or an svchost.exe
    hosting the WER service). If the writer is a different or unsigned binary, or its parent chain is
    unexpected, the report path was likely produced by manipulation rather than normal crash handling.
    The exploiting process itself is typically a separate unprivileged process that drives the WER
    service over COM, so also review host-wide activity around this time.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Did a high-integrity interpreter such as cmd.exe or powershell_ise.exe spawn on this host shortly after the Report.wer was written?
  context: >-
    The payoff of this exploit is a command interpreter launched at high integrity in the interactive
    session - most often cmd.exe or powershell_ise.exe - immediately after the manipulated report is
    written; if the direct spawn fails the operation may instead register a privileged scheduled task to
    proxy the launch. Listing interpreter starts on this host in the window after the alert, and checking
    their integrity level and parent, ties the archive-path anomaly to actual privileged code execution.
    A cmd.exe or powershell_ise.exe running at high integrity or under SYSTEM with an unexpected parent is
    the completion of the escalation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\cmd.exe'
          - '\powershell_ise.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - User
- question: Is the Report.wer file still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives next steps. A report still on disk can be retrieved and read
    to identify the reported process and the manipulation; a Report.wer deleted or moved seconds after
    creation points to cleanup of the exploit artifact and shifts attention to what executed in between.
    Interpret the operation history for this path over the following window - a deletion shortly after
    creation is the cleanup signature.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the responsible process write or delete around the time of the alert?
  context: >-
    A process that produces one manipulated report often touches several paths - staging the redirection
    target, dropping a payload, or cleaning up afterward. The breadth, locations, and operation types of
    the writing process's other file activity distinguish an isolated event from a broader operation and
    enumerate what else needs review. If the writer is the WER service, volume alone is not suspicion;
    focus on writes that land outside the normal WER directories or that create executable content.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to the WER ReportArchive directory recently, and by which processes?
  context: >-
    The WER report archive is normally written only by the WER service and only into standard
    crash-category subfolders. Other recent arrivals in this directory tree - especially non-standard
    subfolder names or writes by processes other than the WER service - reveal whether this is an
    isolated anomaly or a location under active manipulation. A single unfamiliar writer, or a cluster of
    non-standard subfolders, is the signal.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\ProgramData\Microsoft\Windows\WER\ReportArchive\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has a Report.wer previously landed in a non-standard WER archive subfolder on this host?
  context: >-
    A first-time appearance of this exact anomaly - a Report.wer in an archive subfolder that is not one
    of the standard crash-category folders - carries more weight than a recurring one. This aggregation
    counts only the anomalous pattern (the archive path and Report.wer filename, excluding the standard
    AppCrash_/AppHang_/Critical_/Kernel_/NonCritical_ subfolders) over the trailing window on this host.
    Zero prior occurrences make this a new event; a steady history points to a benign local process that
    reproduces the pattern and should be identified.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: ':\ProgramData\Microsoft\Windows\WER\ReportArchive\'
        TargetFilename|endswith: '\Report.wer'
      filter_main_locations:
        TargetFilename|contains:
          - '\ReportArchive\AppCrash_'
          - '\ReportArchive\AppHang_'
          - '\ReportArchive\Critical_'
          - '\ReportArchive\Kernel_'
          - '\ReportArchive\NonCritical_'
      condition: selection and not 1 of filter_main_*
    fields:
      - TargetFilename
      - Image
- question: Is the same non-standard Report.wer archive pattern present on any other hosts in the environment?
  context: >-
    The same anomalous archive pattern appearing on multiple hosts points to a repeated or automated use
    of the technique rather than a one-off event on a single machine; confinement to one host points to a
    targeted attempt. This fleet-wide aggregation counts the anomalous pattern grouped by host so the
    distribution and the writing processes can be compared, which separates a single hands-on operation
    from broader activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains: ':\ProgramData\Microsoft\Windows\WER\ReportArchive\'
        TargetFilename|endswith: '\Report.wer'
      filter_main_locations:
        TargetFilename|contains:
          - '\ReportArchive\AppCrash_'
          - '\ReportArchive\AppHang_'
          - '\ReportArchive\Critical_'
          - '\ReportArchive\Kernel_'
          - '\ReportArchive\NonCritical_'
      condition: selection and not 1 of filter_main_*
    fields:
      - host.name
      - TargetFilename
      - Image
- always_include: true
  question: Has this user previously produced this non-standard Report.wer pattern, and does that history fit their role?
  context: >-
    This aggregation mirrors the rule's selection - the anomalous archive path and Report.wer filename,
    excluding the standard crash-category subfolders - scoped to the alerting user over the trailing
    window and grouped by host. It answers whether this specific user has produced this exact pattern
    before, not generic WER activity. A user with no prior history of this pattern is more notable than
    one who reproduces it routinely; weigh the count against the user's role. Because the privileged WER
    service performs the write, the account is often SYSTEM or a machine account, in which case the
    launch-mechanism baseline is the more meaningful pivot.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains: :\ProgramData\Microsoft\Windows\WER\ReportArchive\
        TargetFilename|endswith: \Report.wer
      filter_main_locations:
        TargetFilename|contains:
        - \ReportArchive\AppCrash_
        - \ReportArchive\AppHang_
        - \ReportArchive\Critical_
        - \ReportArchive\Kernel_
        - \ReportArchive\NonCritical_
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this writing process historically produced the non-standard Report.wer pattern on this host or across the environment, or is it new for this activity?
  context: >-
    When the alert fires under a service principal - which is expected here, since the privileged WER
    service writes the report - user identity does not attribute behavior; the meaningful pivot is the
    launch mechanism. This aggregation mirrors the rule's selection scoped to the alerting program,
    so the result is the trailing-window history of this process driving this specific anomalous pattern,
    grouped by host. A new or rare writer for this pattern is the deviation worth chasing; a process that
    already accounts for many prior events is normal service or vendor automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains: :\ProgramData\Microsoft\Windows\WER\ReportArchive\
        TargetFilename|endswith: \Report.wer
      filter_main_locations:
        TargetFilename|contains:
        - \ReportArchive\AppCrash_
        - \ReportArchive\AppHang_
        - \ReportArchive\Critical_
        - \ReportArchive\Kernel_
        - \ReportArchive\NonCritical_
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around the time of the alert?
  context: >-
    Tracking the alerting user's activity across all hosts in a tight window reveals whether this is an
    isolated event or part of activity spanning multiple endpoints. Similar activity by the same account
    on other hosts widens the potential scope. When the account is SYSTEM, a machine account, or another
    service principal - as it typically is for a WER-service write - this pivot returns broad agent and OS
    telemetry, and the launch-mechanism view across hosts is the sharper answer.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same writing-process pattern produce a non-standard Report.wer on other hosts in the same window?
  context: >-
    Under a service principal, asking what else the user did network-wide returns routine agent and OS
    noise, so the sharper question is whether the same writing process produced this anomalous archive
    pattern elsewhere in the alert window. This aggregation mirrors the rule's selection scoped to the
    alerting program, fleet-wide, grouped by host. Multiple hosts in the same window point to a
    coordinated or automated rollout; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains: :\ProgramData\Microsoft\Windows\WER\ReportArchive\
        TargetFilename|endswith: \Report.wer
      filter_main_locations:
        TargetFilename|contains:
        - \ReportArchive\AppCrash_
        - \ReportArchive\AppHang_
        - \ReportArchive\Critical_
        - \ReportArchive\Kernel_
        - \ReportArchive\NonCritical_
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    This exploit is driven by a separate unprivileged process that manipulates the WER service, so the
    triggering process on the file event is rarely the attacker's binary. Aggregating process activity in
    a tight window around the alert surfaces what ran just before the manipulated report was written and
    what ran immediately after. Novel parent-child pairs stand out at low counts against high-count
    routine telemetry, which is what points to the process that drove the exploit and any privileged
    follow-on.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, execution of scripting tools, or credential
    access - may reveal the stages that preceded this event and help reconstruct the timeline. A
    privilege-escalation attempt is typically a means to run privileged follow-on actions, so prior
    alerts help place this archive-path anomaly within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
