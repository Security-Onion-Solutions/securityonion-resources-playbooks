name: Binary Proxy Execution Via Dotnet-Trace.EXE
id: e40352af-5834-4f19-b21f-238c9be849a7
description: |
  Detects dotnet-trace.exe invoked with the "collect" command followed by a "-- " argument separator, which runs an arbitrary
  child process under the Microsoft-signed tracer. Because dotnet-trace.exe is a trusted signed binary, attackers use this
  pattern to proxy execution of a payload and evade controls that key on the launching binary's reputation; legitimate use is
  performance tracing of a .NET program. The investigation should confirm the child command line that ran behind the separator,
  determine what the proxied process actually did, and decide whether the parent chain and user are consistent with debugging
  work or with hands-on-keyboard abuse.
type: detection
detection_id: 9257c05b-4a4a-48e5-a670-b7b073cf401b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line show dotnet-trace.exe running collect with a "-- " separator followed by a child command?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and
    process identity. The rule fires when the Image ends in dotnet-trace.exe (or OriginalFileName is dotnet-trace.dll) AND
    the command line contains both "collect" and the "-- " separator. Confirm both conditions are present and read what command
    follows the separator, since that trailing token is the proxied process.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run dotnet-trace.exe for .NET performance tracing?
  context: Legitimate use of dotnet-trace.exe is developers and performance engineers tracing .NET applications, so it is
    expected on build agents, developer workstations, and some application servers. On a host with no .NET development or
    diagnostics role, the collect-with-separator pattern is harder to explain and shifts the disposition toward proxy
    execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did dotnet-trace.exe run behind the "-- " separator? Decode the full command line.
  context: The token after the "-- " separator is the process dotnet-trace.exe launches as a child, and it is the operational
    payload of the technique. Decode any flags, file paths, encoded content, or URLs in the trailing command to understand
    what was executed under the signed tracer. The query scopes to all dotnet-trace.exe executions on this host within the
    window so that closely-spaced invocations forming one logical operation are visible together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains|all:
          - '-- '
          - 'collect'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Does the proxied command line contain a URL, remote share, script path, or DLL entrypoint rather than an ordinary executable?
  context: Proxy execution is most concerning when the trailing command retrieves or runs externally hosted or scripted
    content rather than launching a benign local program. Check the proxied command for an HTTP/HTTPS URL, a UNC path, a
    scripting host such as powershell.exe or cscript.exe, or a rundll32-style DLL entrypoint. These argument structures indicate
    payload delivery or staging through the trusted tracer.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        - Image|endswith|expand: '%Image%'
        - OriginalFileName: dotnet-trace.dll
      selection_cli:
        CommandLine|contains|all:
          - '-- '
          - 'collect'
      selection_suspicious:
        CommandLine|contains:
          - 'http'
          - '\\\\'
          - 'powershell'
          - 'cscript'
          - 'wscript'
          - 'rundll32'
          - 'mshta'
          - '.dll'
      condition: selection_img and selection_cli and selection_suspicious
    fields:
      - CommandLine
      - Image
- question: What child process did dotnet-trace.exe spawn, and did it survive or get terminated quickly?
  context: When the proxied target is a .NET program, dotnet-trace continues to attach; when it is not, the tracer terminates
    the direct child after a few seconds. Examine the child process that dotnet-trace.exe launched, its command line, and how
    long it ran. A short-lived non-.NET child that nonetheless completed an action confirms the binary was used purely as a
    launcher rather than for tracing.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What process spawned dotnet-trace.exe and is that parent chain expected?
  context: The parent process reveals how the tracer was invoked. Legitimate tracing is typically launched interactively from
    a shell or an IDE under a developer session. Unusual parents such as a scripting host, an Office application, or a remote
    administration service point toward automated or operator-driven proxy execution rather than diagnostics.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What modules did the dotnet-trace.exe process load, and do any unsigned or unusual DLLs appear?
  context: Proxy and trusted-binary abuse frequently involves the signed process loading attacker-supplied or non-standard
    modules. Reviewing the modules loaded by this dotnet-trace.exe execution can reveal a side-loaded or unsigned DLL pulled
    in alongside the legitimate tracer components. If image-load telemetry is not collected in this environment, treat zero
    results as a visibility gap rather than evidence nothing loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- question: Did dotnet-trace.exe or the process it launched make outbound network connections around the time of the alert?
  context: Trusted-binary proxy execution is often a delivery or command-and-control step, where the proxied command retrieves
    a remote payload or beacons out. Examine network connections from the tracer and its child on this host in the alert
    window for connections to external addresses. If network telemetry is not collected in this environment, treat zero
    results as a visibility gap rather than evidence nothing connected.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: true
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: What other child processes did dotnet-trace.exe spawn on this host afterward?
  context: Beyond the immediate proxied target, the tracer may launch additional processes that reveal the broader objective.
    Malicious usage often chains into command interpreters, credential-access tools, or download utilities for post-exploitation,
    whereas legitimate tracing has predictable, limited children.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run dotnet-trace.exe?
  context: A tracer that has never run on a host is more suspicious than one that runs regularly on a developer or build
    machine. Zero or very low historical counts over the baseline window indicate first-time or rare execution that deserves
    closer scrutiny.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously run dotnet-trace.exe collect with the "-- " separator, what parents and users drove it, and does this alert fit?
  context: Even a tool that runs routinely can be abused. The query mirrors the rule's selection structure scoped to this
    host, so the resulting parent and user distribution reflects how this specific proxy-execution pattern has run here, not
    generic tracer usage. A new parent process, an unexpected account, or an unusual command-line structure is the deviation
    worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \dotnet-trace.exe
      - OriginalFileName: dotnet-trace.dll
      selection_cli:
        CommandLine|contains|all:
        - '-- '
        - collect
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \dotnet-trace.exe
      - OriginalFileName: dotnet-trace.dll
      selection_cli:
        CommandLine|contains|all:
        - '-- '
        - collect
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \dotnet-trace.exe
      - OriginalFileName: dotnet-trace.dll
      selection_cli:
        CommandLine|contains|all:
        - '-- '
        - collect
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints.
    If the same user triggered similar activity on several hosts in this window, the scope of the activity may be larger than
    a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \dotnet-trace.exe
      - OriginalFileName: dotnet-trace.dll
      selection_cli:
        CommandLine|contains|all:
        - '-- '
        - collect
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts run dotnet-trace.exe collect with the "-- " separator in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, giving a fleet-wide count of this specific
    proxy-execution pattern rather than generic tracer usage. Many hosts firing the same pattern points to scripted deployment
    or vendor automation; one host or a small unrelated set points to manual operator activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \dotnet-trace.exe
      - OriginalFileName: dotnet-trace.dll
      selection_cli:
        CommandLine|contains|all:
        - '-- '
        - collect
      condition: all of selection_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as defense tampering, reconnaissance,
    or credential access, may reveal the stages that preceded this proxy-execution event and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
