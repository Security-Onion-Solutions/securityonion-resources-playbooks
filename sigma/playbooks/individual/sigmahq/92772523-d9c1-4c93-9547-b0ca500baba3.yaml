name: Potential Persistence Via Mpnotify
id: ff575a28-7e8f-41fb-bdda-9120b12ff4a7
description: |
  Detects a registry write to HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\mpnotify.
  When this value names an executable, winlogon.exe launches that program during each interactive
  logon (the process and its children are terminated after roughly 30 seconds), giving the configured
  binary automatic SYSTEM-context execution at logon; historically the mpnotify process is also handed
  the user's cleartext logon credentials, adding a credential-access angle. Legitimate use is rare, so
  investigate what executable the value points to, which process wrote it and what launched that process,
  whether the referenced payload exists on disk, whether winlogon.exe subsequently ran it, and whether the
  value was changed again afterward.
type: detection
detection_id: 92772523-d9c1-4c93-9547-b0ca500baba3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting registry write set the Winlogon mpnotify value to an executable path?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a
    value is written under HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\mpnotify. Review
    the exact TargetObject and Details on the triggering event. This value is absent or empty on a clean
    system; when populated it names an executable that winlogon.exe runs at every logon, so any command
    written here is the persistence being staged.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify the Winlogon logon-notification configuration?
  context: >-
    The Winlogon mpnotify value has no routine reason to change on a workstation or server. A user or
    process writing this key is the setup step of a logon-persistence mechanism, so knowing whether the
    writing account and host role match any sanctioned change is the fastest way to separate maintenance
    from malicious activity. User attribution is present on roughly 94% of endpoint registry events; when
    it is a machine account or SYSTEM, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What executable path was written to the mpnotify value, and why is this a persistence location?
  context: >-
    The value HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\mpnotify names a program that
    winlogon.exe launches during each interactive logon. Because winlogon.exe runs as SYSTEM and historically
    passes the user's cleartext logon credentials to the mpnotify process, an executable placed here gains
    both automatic SYSTEM-context execution at every logon and access to credential material. Confirming the
    exact value data and the process that wrote it establishes this as the mpnotify hijack rather than an
    unrelated Winlogon edit.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What does the value written to the mpnotify key point to, and is that executable legitimate?
  context: >-
    The Details field holds the path or command winlogon.exe will execute at logon. Examine it: a path into
    Temp, AppData, ProgramData, or another user-writable directory, a script-host invocation, or an unsigned
    binary indicates malicious persistence, whereas a signed system executable in a standard location may be
    an unusual but legitimate configuration. If Details names a file path, that path becomes the lead for
    confirming the payload on disk. Details is populated on roughly 79% of registry modifications.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote the mpnotify value, and what launched that process?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to read its
    Image, full command line, and parent. A reg.exe, powershell.exe, or cmd.exe write launched from an Office
    application, a script host such as wscript.exe or mshta.exe, or an unsigned binary points to the persistence
    being staged programmatically rather than a deliberate administrator edit. The parent lineage separates a
    scripted install from an interactive console action.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: After this value was set, did winlogon.exe launch the configured executable at logon?
  context: >-
    mpnotify persistence only executes when a user logs on and winlogon.exe reads the value and starts the
    named program (the process and its children are terminated after roughly 30 seconds). A process whose
    parent is winlogon.exe and whose image matches the path written to the value confirms the persistence is
    active. Absence of such execution may mean no logon has occurred since the value was set rather than that
    the mechanism is inert.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\winlogon.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: Is the executable referenced by the mpnotify value present on disk, and was it dropped by the writing process?
  context: >-
    mpnotify persistence is only effective if the executable named in the value exists at that path when
    winlogon.exe runs it. Correlating file activity by the registry-writing process and its children shows
    whether that binary was created in the same session, which confirms the mechanism would execute and
    identifies the payload. The file-write event carries no hash; if the payload is present, hash it from a
    later execution for a reputation lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: After this write, was the mpnotify value changed again or repointed on the Winlogon key?
  context: >-
    Registry value deletions are not observable in this telemetry, so durability is judged from the value's
    re-modification history rather than a delete event. A value that remains set leaves the persistence primed
    to run at every logon; a later write that clears or repoints it may indicate the operator swapped payloads
    or reverted the change to hide it. Compare the Details values written to this key over the following window.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What other registry modifications were made on this host around the same time?
  context: >-
    An actor who plants one persistence value often makes other configuration changes in the same session -
    additional autostart keys, security-policy edits, or credential-related settings. Clustering the registry
    writes on this host in a short window around the alert reveals the full scope and which process made them.
    The mpnotify key appears in the results; the signal is what else was modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has the Winlogon mpnotify value been set before on this host?
  context: >-
    The mpnotify value is absent by default and changes only through deliberate action, so a history with no
    prior writes makes this a first-time change and raises its weight. A history of periodic writes of the
    same value points instead to a management process or a repeatedly run tool. Compare the historical Details
    values to see whether the same executable was configured before or whether this is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was the mpnotify value set on other hosts in the environment?
  context: >-
    The same write across many hosts suggests a broad tool run or a mis-scoped deployment, while the same
    write confined to one host suggests targeted persistence. Compare the Details values and writing process
    across hosts to see whether they all configure the same executable, which separates a single hands-on
    operation from repeated use of the technique across the environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Persistence is rarely established in isolation. Aggregating process activity in a tight window around the
    alert surfaces what led up to the mpnotify write and what ran immediately after. Novel parent-child pairs
    stand out at low counts against high-count routine telemetry, which is what points to the tool that staged
    the persistence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, execution of scripting tools, or defense tampering -
    may reveal the stages that preceded this change and help reconstruct the timeline. Logon persistence is
    typically installed after initial access, so prior alerts help place this write within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Attackers rarely rely on a single persistence mechanism. Alongside the mpnotify logon hook, they commonly
    install backups - scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions created by
    schtasks.exe, sc.exe, reg.exe, bitsadmin.exe, or wmic.exe. Multiple persistence installations in the same
    timeframe indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely - dropping an executable or script into a
    Startup folder or a path referenced by a registry Run key achieves persistence without invoking schtasks,
    sc, or reg. File writes to these locations near the mpnotify change indicate a parallel persistence
    mechanism was established on disk.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Does the user or an administrator recall configuring a logon-notification program on this host?
  context: >-
    The mpnotify value has no routine reason to change, so direct confirmation from the account owner or the
    responsible team is a fast way to resolve the alert. If an administrator testing a logon tool or a
    sanctioned deployment set the value, that closes it; if no one recalls the action, the account may be
    compromised or the change was made by automated tooling, and the investigation should continue into the
    writing process and any dropped payload.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
