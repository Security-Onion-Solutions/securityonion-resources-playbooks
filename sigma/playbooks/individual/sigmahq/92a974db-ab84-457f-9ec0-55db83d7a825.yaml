name: Potential AMSI Bypass Using NULL Bits
id: d36088cf-2974-4e43-8f07-5dc53c01cc02
description: |
  Detects command lines that carry the specific string fragments used to bypass the
  Antimalware Scan Interface (AMSI) by injecting NULL bits or a crafted format-string
  expression into a PowerShell payload. The rule fires when a process command line
  contains either of two literal patterns associated with this bypass: a format-string
  construct that emits a null character, or a literal NULL marker. Disabling or evading
  AMSI removes the inspection layer that would otherwise scan PowerShell, VBScript, and
  .NET content before execution, so this pattern usually precedes the execution of a
  payload the operator wanted to run unscanned. Legitimate use is rare; investigation
  should confirm the exact command line, decode what the surrounding script does, and
  determine what ran on the host after AMSI inspection was weakened.
type: detection
detection_id: 92a974db-ab84-457f-9ec0-55db83d7a825
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line contain the AMSI NULL-bit bypass pattern this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by
    reviewing the exact command line. The rule fires on either a format-string construct
    that emits a null character or a literal NULL marker embedded in the command line.
    Confirm one of those fragments is present and read the surrounding script context.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run obfuscated or AMSI-evading PowerShell?
  context: Legitimate administrative scripting almost never uses null-bit string tricks to
    evade content inspection. Knowing whether the user role and host function involve
    PowerShell development, security tooling, or red-team activity is often the fastest way
    to separate a sanctioned test from an operator preparing to run unscanned code. An
    expected administrative tool that incidentally matches the pattern can be added to a
    process exclusion list to suppress future noise.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What does the full command line do — decode the script around the AMSI bypass fragment?
  context: The AMSI bypass is only the preparation step; the rest of the command line
    reveals the payload it was meant to run unscanned. Decode any base64 or compressed
    blocks, identify downloaded content, reflected assembly loads, or in-memory execution,
    and determine what the script does once AMSI inspection is removed. The specific bypass
    fragment identifies the evasion method; the surrounding code identifies the intent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were AMSI or Defender registry values modified on this host around the time of the alert?
  context: Beyond an in-line command-line bypass, AMSI and Defender can be weakened through
    the registry — disabling real-time monitoring, setting AMSI provider keys, or flipping
    Defender policy values. This query surfaces registry modifications to the relevant
    Defender and AMSI policy paths so the analyst can see whether a more persistent
    disabling of inspection accompanied the command-line bypass.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_paths:
        TargetObject|contains:
          - '\Windows Defender\'
          - '\Windows Defender Security Center\'
          - '\AMSI\'
          - '\MpEngine\'
          - '\Real-Time Protection\'
      condition: selection_host and selection_paths
    fields:
      - TargetObject
      - Details
      - Image
- question: Is AMSI and endpoint protection currently functioning on this host, or is inspection still impaired?
  context: A command-line AMSI bypass typically affects only the PowerShell session that ran
    it, but the operator may also have disabled real-time monitoring or AMSI providers in a
    way that persists. Confirm current protection status — whether real-time scanning and
    AMSI inspection are active — so any lingering impairment is restored before the host is
    cleared.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What activity occurred on this host after the AMSI bypass ran?
  context: AMSI is bypassed so that something can run unscanned. Examining process activity
    in the window immediately after the bypass reveals the payload it was meant to enable —
    script-host invocations, reflective loads, credential access, or outbound staging. The
    correlation window between the bypass and follow-on execution is the link that
    distinguishes a single evasion event from a multi-step operation.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense tampering actions performed on this host?
  context: An operator who bypasses AMSI often disables several controls in the same
    operation — stopping AV/EDR services, clearing logs, deleting shadow copies, or changing
    firewall rules. Finding multiple tampering events from the same user or parent process
    indicates a coordinated effort to maximize coverage rather than an isolated action.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: When this host has previously fired the AMSI NULL-bit pattern, what parents and users drove it, and does this alert fit?
  context: Even rare patterns can have a benign source on a given host. The query mirrors
    the rule's selection scoped to this host, so the resulting parent and user distribution
    reflects how this specific bypass pattern has historically run here. A new parent
    process, an unexpected user account, or a first-ever appearance is the deviation worth
    chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains:
        - if(0){{{0}}}' -f $(0 -as [char]) +
        - '#<NULL>'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the AMSI NULL-bit pattern in the past week, and does the spread look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide
    count of this bypass pattern rather than generic PowerShell usage. Many hosts firing the
    same pattern points to a scripted deployment or a shared tool; one host or a small
    unrelated set points to manual operator activity. Use the host distribution to calibrate
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains:
        - if(0){{{0}}}' -f $(0 -as [char]) +
        - '#<NULL>'
      condition: selection
    fields:
    - host.name
- question: What process spawned the command that carried the bypass, and is that parent chain expected?
  context: The parent process reveals how the bypass was launched. An interactive shell or a
    developer tool is a different disposition from an Office application, a script host like
    wscript.exe or mshta.exe, or a remote-execution service spawning the PowerShell that
    carried the null-bit fragment. An unexpected parent points to exploitation or a delivery
    mechanism rather than a sanctioned script.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains:
        - if(0){{{0}}}' -f $(0 -as [char]) +
        - '#<NULL>'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user run carrying the AMSI bypass pattern across the network around this time?
  context: Tracking the same user's bypass activity across hosts reveals whether the evasion
    was used in one place or spread during lateral movement. Scoping to the bypass pattern
    keeps the result focused on the technique rather than the unbounded process telemetry a
    bare user pivot would return, which matters when the alerting account is a service
    principal that owns constant background activity.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        CommandLine|contains:
        - if(0){{{0}}}' -f $(0 -as [char]) +
        - '#<NULL>'
      condition: selection
    fields:
      - host.name
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining the activity surrounding the bypass
    reveals the immediate context: what led to this event, what happened after, and whether
    it is part of a larger sequence. Look for reconnaissance, privilege escalation, or
    persistence installation in the same window.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host —
    reconnaissance, credential access, or other defense-evasion activity — may reveal the
    stages that preceded the AMSI bypass and help reconstruct the timeline of how the
    operator reached this point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were process-based persistence mechanisms installed on this host around the time of the alert?
  context: Once an operator runs unscanned code, a common next step is to establish
    persistence. After the foothold the detected bypass enabled, backup mechanisms are
    commonly installed using scheduled tasks, services, registry Run keys, BITS jobs, or
    WMI subscriptions. Multiple persistence installations in the same timeframe indicate
    intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
