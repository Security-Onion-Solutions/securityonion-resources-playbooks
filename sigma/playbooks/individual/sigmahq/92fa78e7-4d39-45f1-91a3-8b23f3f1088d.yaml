name: Potential Startup Shortcut Persistence Via PowerShell.EXE
id: 08564961-da9d-4499-931a-6a34e0747de6
description: |
  Detects powershell.exe or pwsh.exe writing a shortcut (.lnk) file into a Start Menu Startup
  directory. Placing a shortcut in the Startup folder is a user-scoped autostart persistence method:
  the shortcut's target runs automatically at the next interactive logon without touching a registry
  Run key. Some installers and management tooling create startup shortcuts legitimately, but a script
  host writing one is unusual and is a documented loader-persistence step. Investigate the PowerShell
  command that wrote the shortcut, what the shortcut's target executes, whether a payload was dropped
  alongside it, and whether the writing process spawned or scheduled follow-on execution.
type: detection
detection_id: 92fa78e7-4d39-45f1-91a3-8b23f3f1088d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Did powershell.exe or pwsh.exe write a .lnk file into a Start Menu Startup directory?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when the
    writing process ends in powershell.exe or pwsh.exe AND the created file path contains a Start Menu
    Programs Startup segment AND the filename ends in .lnk. Review the exact TargetFilename and the
    responsible Image on the triggering event to confirm all three conditions hold. A script host
    placing a shortcut in the Startup folder is the setup step of logon persistence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to write startup shortcuts with PowerShell?
  context: >-
    Legitimate startup shortcuts are usually created by installers or management tooling, not by an
    interactive PowerShell session. Knowing whether the writing account and host function match any
    sanctioned deployment is often the fastest way to separate routine software setup from a live
    persistence attempt. User attribution is present on roughly 94% of endpoint file events; when it is
    a machine account or missing, judge by the writing process and host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What process wrote the shortcut, and what launched that process?
  context: >-
    The file event carries no command line, so pivot by ProcessGuid to the writing process to read its
    full command, its parent, and the parent's command line. A powershell.exe write launched from an
    Office application, a browser, a script host such as wscript.exe or mshta.exe, or an unsigned binary
    points to persistence being staged programmatically rather than a deliberate administrator action.
    The parent chain distinguishes a scripted loader from an interactive console session.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Was the PowerShell command that wrote the shortcut encoded or obfuscated, and what does it decode to?
  context: >-
    PowerShell writes to the Startup folder are frequently driven by an inline or encoded one-liner
    rather than a script file. Check the command line for -EncodedCommand or -enc base64 payloads,
    string concatenation, backtick escaping, and variable substitution. Decoding reveals how the .lnk
    was constructed and what its target points to - a download cradle, a dropped binary path, or an
    in-memory execution stub - which is the ground truth for whether the shortcut is malicious.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What does the dropped shortcut point to - what executable or command does it launch at logon?
  context: >-
    The .lnk file is the persistence mechanism; its target is the payload. Retrieve the shortcut from
    its on-disk path and read its target and arguments. A shortcut pointing at powershell.exe or cmd.exe
    with an inline or encoded command is a fileless loader; one pointing at a dropped binary in a
    user-writable directory names the payload to examine next. Shortcut content is not in log data and
    requires manual or endpoint retrieval of the file itself.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Is the shortcut still on disk, or was it deleted or renamed after the alert?
  context: >-
    The shortcut's post-alert lifecycle drives next steps. A .lnk still on disk can be retrieved and its
    target analyzed; a shortcut deleted seconds after creation suggests anti-forensic cleanup or a stage
    that only needed to survive until the next logon. Because the file is what establishes persistence,
    whether it remains determines whether the autostart is still primed to run.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What did the writing PowerShell process spawn after dropping the shortcut?
  context: >-
    Startup persistence usually runs its payload at the next logon, but the writing process often also
    executes the payload immediately in the same session. Listing the child processes of the writing
    PowerShell reveals whether it launched the shortcut's target directly, spawned a download cradle, or
    kicked off other tooling, tying the persistence write to live execution rather than a dormant drop.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other files did the writing process create or delete around the alert?
  context: >-
    A shortcut needs a target, and the same process that wrote the .lnk frequently drops that payload
    too - an executable or script in a Temp, AppData, or ProgramData path. The breadth, locations, and
    extensions of the writing process's other file activity distinguish a single shortcut from a loader
    staging its components, and enumerate the payload files that need review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to the Startup directory recently, and by which processes?
  context: >-
    The Start Menu Startup folder has a small set of processes that legitimately write there. Other
    recent arrivals in the same directory reveal whether this is an isolated drop or a location under
    active use for persistence, and surface any sibling shortcuts or executables placed for autostart by
    the same activity. A single unfamiliar writer across several startup entries is the signal.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\start menu\programs\startup\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has this shortcut file been seen before on this host?
  context: >-
    A file that has never appeared on a host is more suspicious than one that is part of normal
    operations. Zero or very low historical counts for this shortcut name indicate a first-time drop
    into the Startup folder; a recurring history points instead to a management process or a repeatedly
    run installer that legitimately maintains a startup entry.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did PowerShell script block logging capture the full script that wrote the shortcut?
  context: >-
    Script block logging records the deobfuscated script content PowerShell actually executed, even when
    the command line is encoded or built at runtime. It provides ground truth about how the .lnk was
    created and what its target was set to, bypassing command-line obfuscation. If PowerShell
    operational logs are not ingested in this environment, treat zero results as a visibility gap rather
    than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: When this host has previously produced this startup-shortcut write, what programs and users normally drove it, and does the current alert fit?
  context: >-
    Even legitimate tooling can write startup shortcuts. The query mirrors the rule's selection
    scoped to this host, so the resulting program and user distribution reflects how this
    specific pattern - a PowerShell write of a .lnk to the Startup folder - has historically run
    here. A new acting program process, an unexpected account, or a first-ever occurrence is the
    deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        TargetFilename|contains: \start menu\programs\startup\
        TargetFilename|endswith: .lnk
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- always_include: true
  question: Has this user previously produced this startup-shortcut write, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, so the result is the user's 90-day
    history of PowerShell writing a startup shortcut, aggregated by host. A user who has never produced
    this pattern is more suspicious than one who does so regularly; weigh the count against the user's
    role and whether they routinely deploy or script software startup entries.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        TargetFilename|contains: \start menu\programs\startup\
        TargetFilename|endswith: .lnk
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this startup-shortcut write, or is the program new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute behavior; the
    launch mechanism does. The query mirrors the rule's selection scoped to the alerting program,
    so the result is the 90-day history of this program driving a PowerShell startup-shortcut write. A new
    or rare program for this pattern is the deviation worth chasing; a program that already accounts for
    many prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        TargetFilename|contains: \start menu\programs\startup\
        TargetFilename|endswith: .lnk
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the environment around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether the persistence write is isolated or
    part of broader hands-on-keyboard activity. If the same account triggered related tool execution or
    file activity on multiple endpoints in the same window, the scope of the operation may extend beyond
    this host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven startup-shortcut write fire on other hosts in the same window?
  context: >-
    Under a service principal, asking what else the user did returns agent-telemetry noise. The
    meaningful question is whether the same launch mechanism fired elsewhere: the query mirrors the
    rule's selection scoped to the alerting program, fleet-wide, in the alert window. Multiple
    hosts in the same window points to scheduled or pushed automation; a single host points to a
    host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        TargetFilename|contains: \start menu\programs\startup\
        TargetFilename|endswith: .lnk
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Persistence rarely happens in isolation. Aggregating process activity in a tight window around the
    alert surfaces what led up to the shortcut write and what ran immediately after it. Novel
    parent-child pairs stand out at low counts against high-count routine telemetry, which is what points
    to the tool that staged the persistence and any follow-on execution.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, execution of scripting tools, or defense
    tampering - may reveal the stages that preceded this write and help reconstruct the timeline.
    Establishing startup persistence is typically a means to keep an already-running foothold, so prior
    alerts help place this shortcut write within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
