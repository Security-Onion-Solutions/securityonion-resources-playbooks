name: Potential DLL Sideloading Via VMware Xfer
id: 42ade2d1-c52c-4cbe-935d-501568c78893
description: |
  Detects the legitimate signed VMware log-transfer utility VMwareXferlogs.exe loading a module
  ending in \glib-2.0.dll from a directory other than the VMware install path (C:\Program Files\VMware\).
  This is the pattern of DLL search-order hijacking, or sideloading: an attacker co-locates a
  malicious DLL that exports the same import names next to the trusted binary, so the signed process
  resolves and executes attacker code from a non-standard directory. On a clean host the utility loads
  glib-2.0.dll only from its own install directory, so a load from anywhere else is anomalous.
  Investigate the loaded module's path, signature, and hash; how the utility was launched and what it
  did; whether it spawned children or reached out to external infrastructure; when and by which process
  the DLL was staged on disk; and whether the host or fleet has matched this pattern before.
type: detection
detection_id: 9313dc13-d04c-46d8-af4a-a930cc55d93b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the loaded module match this rule's pattern — glib-2.0.dll loaded by VMwareXferlogs.exe from a non-VMware directory?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires when VMwareXferlogs.exe
    loads a module ending in \glib-2.0.dll AND that module path does NOT start with
    C:\Program Files\VMware\. On a clean host the signed utility resolves glib-2.0.dll from its own
    install directory; a load from any other directory is the sideloading setup. Review the ImageLoaded
    path, the Signed and SignatureStatus values, and the loading Image on the event. DLL load events
    carry signing status and a hash directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Is this user and host expected to run the VMwareXferlogs.exe utility?
  context: >-
    VMwareXferlogs.exe is a legitimate signed VMware log-transfer utility that normally runs only on
    hosts with VMware Tools, from the VMware install path, under service or maintenance contexts. A load
    of glib-2.0.dll from a non-VMware directory on a host with no VMware footprint, or under an
    unexpected account, is a strong anomaly. Applications expected to load DLLs from non-standard
    locations are rare, so knowing the host role and account is often the fastest path to separating a
    supported run from a sideload.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What modules did the loading process pull in, and did any come from non-canonical or user-writable paths?
  context: >-
    The set of modules the process loaded shows whether the DLL was resolved from the application's own
    directory instead of the expected system or VMware install path — the essence of search-order
    hijacking. Look for glib-2.0.dll or other modules loaded from %TEMP%, AppData, ProgramData, Public,
    or a working directory rather than C:\Program Files\VMware\. A signed binary resolving an
    import-named DLL from a co-located non-standard path is the sideload. Known-safe DLL directories
    (System32, the VMware install path) can be treated as expected.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For the loaded glib-2.0.dll, what are its signing status, hash, and threat-intel reputation?
  context: >-
    Module reputation distinguishes the genuine VMware-shipped glib-2.0.dll from a planted copy. The
    legitimate library is signed and lives under the VMware install path; a copy in another directory
    that is unsigned, carries a mismatched or invalid signature, or whose hash is unknown or flagged is
    the substitution. Use the Hashes value for a threat-intel lookup and SignatureStatus to judge
    tampering: Valid is probably benign, while Unsigned, Expired, Distrusted, or Invalid in this context
    is suspicious. Comparing the hash against a baseline for the legitimate DLL confirms substitution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What did VMwareXferlogs.exe do — decode its command line and working directory?
  context: >-
    The image_load event carries no command line, so pivot to the process record. The full command and
    CurrentDirectory reveal how the utility was invoked and from where it ran. Execution from a debug
    folder, a user profile, or another writable staging directory rather than the VMware install path
    corroborates that the binary itself was relocated alongside the planted DLL, which is how sideloading
    is set up.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process launched VMwareXferlogs.exe, and is that parent chain expected?
  context: >-
    Pivot by ProcessGuid to the utility's own process record to read its parent Image and command line.
    A legitimate run is typically started by a service or a maintenance script. A launch by cmd.exe,
    powershell.exe, a script host such as wscript.exe or mshta.exe, or an Office application points to
    the sideload being staged programmatically rather than by normal VMware tooling. The ProcessGuid
    lookup is unique per instance, so the wider window captures long-running parents that started before
    the alert.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What child processes did VMwareXferlogs.exe spawn after the DLL load?
  context: >-
    A signed utility loading its own library has predictable, usually no, children. A sideloaded payload
    frequently spawns interpreters or living-off-the-land binaries such as cmd.exe, powershell.exe, or
    rundll32.exe, or injects into new processes for post-exploitation. Listing the children of the
    loading process anchored on its ProcessGuid shows whether the loaded code took further action.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did VMwareXferlogs.exe make outbound network connections after the DLL load?
  context: >-
    A sideloaded payload commonly establishes a channel to external infrastructure once it runs inside
    the trusted process. Because the DLL executes in-process, any such connections are attributed to
    VMwareXferlogs.exe. External destinations from a log-transfer utility that has no routine need to
    reach the internet strongly suggest the loaded module is doing more than logging. Note the direction
    and the destination address and port.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: When and by what process was glib-2.0.dll written to this host, and to which directory?
  context: >-
    Sideloading requires the malicious DLL to be placed next to the signed binary first, so identifying
    the file write that staged glib-2.0.dll establishes the entry point and timeline. The writing process
    and path — a script host, a download utility, or an interpreter dropping the file into a working or
    debug directory — reveal how the payload arrived and tie the staging to the later load. Compare the
    write time to the module-load time to measure the correlation interval between file creation and
    execution.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: '\glib-2.0.dll'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
- question: Has glib-2.0.dll been loaded on this host before, and by which processes?
  context: >-
    A first-time load of this module on the host is a stronger anomaly than a recurring one. If
    glib-2.0.dll has historically loaded only under VMware components from the install path, a load by
    VMwareXferlogs.exe from a different directory stands out. If the DLL has never been seen here, the
    current load is new and warrants the full pivot into staging, signature, and follow-on activity.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Were DLL-load-governing registry keys modified on this host around the alert?
  context: >-
    Beyond co-locating a DLL, execution flow can be redirected through registry keys that control library
    loading — KnownDLLs, AppInit_DLLs, and Image File Execution Options. Modifications to these near the
    alert indicate a parallel or additional hijack mechanism and help scope whether this is a one-off
    sideload or a broader effort to hijack module loading on the host. The written value and the process
    that made the change identify what was redirected.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_dll_keys:
        TargetObject|contains:
          - '\Session Manager\KnownDLLs'
          - '\Windows NT\CurrentVersion\Windows\AppInit_DLLs'
          - '\Image File Execution Options\'
      condition: selection and selection_dll_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: Were process-based persistence mechanisms installed on this host around the alert?
  context: >-
    A sideloaded payload that gains execution frequently installs a foothold. Scheduled tasks, services,
    registry Run keys, BITS jobs, or WMI subscriptions created by schtasks.exe, sc.exe, reg.exe,
    bitsadmin.exe, or wmic.exe near the DLL load indicate the loaded code was used to persist rather than
    being an isolated event. Multiple persistence installations in the same timeframe indicate intentional
    stacking.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host around the alert?
  context: >-
    File-based persistence bypasses command-line detection entirely — dropping an executable or script
    into a Startup folder or a path referenced by a registry Run key persists without invoking schtasks,
    sc, or reg. File writes to these locations near the sideload indicate the loaded payload established a
    parallel persistence mechanism on disk that outlives the current process.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: When this host has previously matched this rule's pattern, what programs and users drove it, and does the current alert fit?
  context: >-
    The query mirrors the rule's exact selection — VMwareXferlogs.exe loading glib-2.0.dll from
    outside the VMware install path — scoped to this host over the past two weeks. The resulting
    program and user distribution reflects how this specific pattern has fired here before, if
    at all. A new acting program process, an unexpected account, or an unusual load path against
    the current alert is the deviation worth chasing; no prior history makes this a first
    occurrence.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: image_load
    detection:
      selection:
        Image|endswith: \VMwareXferlogs.exe
        ImageLoaded|endswith: \glib-2.0.dll
      filter:
        ImageLoaded|startswith: C:\Program Files\VMware\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts matched this rule's pattern in the past week, and does the distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this exact
    sideload pattern rather than generic use of the utility. Many hosts matching the same pattern can
    point to a mis-scoped tool or software deployment; one host or a small unrelated set points to
    hands-on operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: image_load
    detection:
      selection:
        Image|endswith: \VMwareXferlogs.exe
        ImageLoaded|endswith: \glib-2.0.dll
      filter:
        ImageLoaded|startswith: C:\Program Files\VMware\
      condition: selection and not filter
    fields:
    - host.name
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A sideload rarely happens alone. Aggregating process activity in a tight window around the alert
    surfaces what led up to the DLL load and what ran immediately after. Novel parent-child pairs stand
    out at low counts against routine high-count telemetry, pointing to the tooling that staged the
    payload and any actions taken once it executed.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — reconnaissance, credential access, defense tampering, or
    ingress tool transfer — may reveal the stages that preceded the sideload and help reconstruct the
    timeline. Sideloading a signed utility is typically a means to run a payload quietly, so prior alerts
    help place this load within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Does an administrator recall running the VMware log-transfer utility on this host?
  context: >-
    The utility has a narrow legitimate use, so direct confirmation from the responsible team is a fast
    way to resolve the alert. If an administrator or a red-team operator ran it deliberately from a
    supported path, that closes the alert. If no one recalls it and the DLL loaded from a non-VMware
    directory, the account or host may be compromised, and the investigation should continue into the
    writing process and any follow-on execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
