name: Potential Notepad++ CVE-2025-49144 Exploitation
id: 2f250ba5-37b6-4380-b266-7dd2ecd29338
description: |
  Detects a process named regsvr32.exe running a `regsvr32 /s` command line that registers
  \contextMenu\NppShell.dll while the image path is NOT C:\Windows\System32\regsvr32.exe or
  C:\Windows\SysWOW64\regsvr32.exe. All three selection criteria must match together and the
  system-path filter must not match. Notepad++ installers at 8.8.1 and prior invoke regsvr32
  without a full path, so a same-named executable sitting in the installer's own directory —
  typically the directory the installer was downloaded to — is resolved first and runs with the
  installer's elevated privileges (CVE-2025-49144, fixed in 8.8.2). The installer itself is
  legitimate and signed; the premise of the technique is that a planted binary beside it inherits
  the elevation. The investigation should establish which directory the process ran from, whether
  that directory is user-writable, what wrote the executable there, what the resulting child
  processes did with the privileges they were handed, and whether the installed Notepad++ is
  still at a vulnerable version.
type: detection
detection_id: 933f0bb5-0681-4fe7-8a17-4e6cccbaac44
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Does the alerting event show a regsvr32.exe registering \contextMenu\NppShell.dll from an
    image path outside System32 and SysWOW64?
  context: >-
    The rule requires all three conditions together — the image name regsvr32.exe, a command line
    starting with `regsvr32 /s`, and the \contextMenu\NppShell.dll argument — while the image path
    is neither of the two system copies. Read the full Image path first. If it resolves to a
    directory other than System32 or SysWOW64, the binary named regsvr32.exe is not the operating
    system's copy.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation

- question: Is this user and host expected to be installing or upgrading Notepad++?
  context: >-
    A Notepad++ install or upgrade genuinely runs regsvr32 against NppShell.dll, so an expected
    installation explains the command line but not the image path. Establish whether this user
    installs their own software and whether this host is one where a user-run installer is normal
    at all.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge

- question: What version of Notepad++ is installed on this host, and was it at 8.8.1 or earlier when the installer ran?
  context: >-
    Versions 8.8.1 and prior call regsvr32 without a full path; 8.8.2 and later do not. If the
    installer that ran was 8.8.2 or later, the search-order path is closed and the alert points at
    something else that named a binary regsvr32.exe. If the installer was 8.8.1 or earlier, the
    path was open at execution time and the directory the installer ran from becomes the decisive
    fact. Read the installed version from software inventory or the endpoint console rather than
    from process telemetry.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  - edr_console

- question: Does the user recall downloading and running a Notepad++ installer around this time?
  context: >-
    The technique depends on the user being persuaded to download both a legitimate installer and a
    second executable into the same directory, then running the installer. If the user recalls the
    install, ask where they obtained the installer, what else they downloaded in the same session,
    and whether they were prompted or directed to do so. If they do not recall it, the installer
    ran without their initiation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review

- question: What did this regsvr32.exe actually do, and what full image path and working directory did it run from?
  context: >-
    Decode the command line and read the Image and CurrentDirectory values together. The `/s`
    switch suppresses dialogs, and the DLL argument names Notepad++'s shell extension — that part
    is what a real install does. The value that separates the two readings is the path the binary
    itself ran from and the directory it ran in. Any other regsvr32 execution on this host in the
    same window is shown alongside for comparison against the system copies.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review

- question: Is the directory this process ran from a user-writable location such as a Downloads folder?
  context: >-
    The technique resolves the helper binary from the installer's own directory before the system
    path, so the directory is the whole mechanism. A user profile subdirectory — Downloads,
    Desktop, Temp — is writable by the account that ran the installer and by anything running as
    that account, which is what makes the planted binary possible. A directory under Program Files
    or another location writable only by administrators does not support the same reading.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CurrentDirectory
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - manual_review

- question: What process launched this regsvr32.exe, and did the parent run from the same directory?
  context: >-
    The expected parent for NppShell.dll registration is a Notepad++ installer process. That
    installer is legitimate and signed — its signature is the premise of the technique, not a
    finding that closes the alert. What matters is where the parent ran from — if the parent
    executed out of the same user-writable directory as the alerting binary, the two sat side by
    side and the search order resolved to the neighbour. Note the parent's own path and signer, and
    what launched the parent in turn.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation

- question: What executables and libraries were written into this working directory before the alert, and which process wrote them?
  context: >-
    An executable named after a system utility appearing in a directory where executables are not
    normally written is the artifact this technique leaves behind. Look for a write of a file named
    regsvr32.exe into the same directory as the installer, and note the time between that write and
    the execution — a write shortly before the installer ran indicates the two arrived together
    rather than the binary having lived there. The writing process names the delivery path, most
    often a browser or archive utility. Alternate data stream evidence such as mark-of-the-web on
    the downloaded files is not available in this telemetry and has to be read from the endpoint or
    the endpoint console directly.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%CurrentDirectory%'
      selection_executable:
        TargetFilename|endswith:
          - '.exe'
          - '.dll'
          - '.com'
          - '.scr'
      condition: selection and selection_executable
    fields:
      - TargetFilename
      - Image
      - User
  answer_sources:
  - file_event
  - edr_console
  - manual_review

- question: What child processes did this regsvr32.exe spawn, and at what integrity level did they run?
  context: >-
    Elevation is the point of the technique — whatever the installer launches inherits the
    installer's rights, which for a per-machine install is SYSTEM. Children of this process are the
    payload of the escalation, and their integrity level states what privileges were actually
    obtained. Command interpreters, script hosts, or network utilities appearing here are the
    operation continuing under the elevated token rather than an installer finishing its work.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
      - IntegrityLevel
  answer_sources:
  - process_creation

- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating the process activity in the surrounding window collapses routine agent telemetry
    into high-count rows and leaves novel parent-child pairs standing out at low counts. Look for
    what preceded the install — a browser or archive utility writing to the user profile — and what
    followed it under the elevated token.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event

- question: >-
    When this host has previously fired the rule's pattern, what parents and users drove that
    activity, and does the current alert fit that history?
  context: >-
    The query mirrors the rule's selection criteria scoped to this host, so the parent and user
    distribution reflects how this specific pattern — a non-system regsvr32.exe registering
    NppShell.dll — has run here before. Repeated prior hits driven by the same installer parent
    suggest a packaging or path quirk in how Notepad++ is deployed on this host. A first-ever
    occurrence, or a new parent for an activity that used to run under a different one, is the
    deviation worth pursuing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|endswith: \regsvr32.exe
        CommandLine|startswith: regsvr32 /s
        CommandLine|contains: \contextMenu\NppShell.dll
      filter_main_legit_regsvr32:
        Image:
        - C:\Windows\System32\regsvr32.exe
        - C:\Windows\SysWOW64\regsvr32.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation

- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection criteria scoped to this user, aggregated by host, so the
    result is this account's 90-day history of this specific pattern rather than generic regsvr32
    usage. A user who installs their own developer tooling on several hosts reads differently from
    one who has never produced this pattern and whose role does not involve installing software.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|endswith: \regsvr32.exe
        CommandLine|startswith: regsvr32 /s
        CommandLine|contains: \contextMenu\NppShell.dll
      filter_main_legit_regsvr32:
        Image:
        - C:\Windows\System32\regsvr32.exe
        - C:\Windows\SysWOW64\regsvr32.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge

- always_include: true
  question: >-
    Has this parent process historically driven the rule's pattern here or across the environment,
    or is the parent new for this activity?
  context: >-
    When the alert fires under SYSTEM or another service principal, user identity attributes
    nothing and the launch mechanism is the meaningful pivot. The query mirrors the rule's
    selection criteria scoped to the alerting parent, aggregated by host, giving the 90-day history
    of this parent driving this pattern. A parent that already accounts for many prior events
    across many hosts is a deployment mechanism; a parent seen for the first time here is the
    deviation. This also answers whether the parent is one of the expected launchers for
    registration of this DLL at all.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|endswith: \regsvr32.exe
        CommandLine|startswith: regsvr32 /s
        CommandLine|contains: \contextMenu\NppShell.dll
      filter_main_legit_regsvr32:
        Image:
        - C:\Windows\System32\regsvr32.exe
        - C:\Windows\SysWOW64\regsvr32.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation

- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the account's activity across all hosts shows whether the same person ran installers
    elsewhere in the same window or whether this is a single event. If the same user account
    produced comparable activity on several hosts, the delivery reached more than one endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation

- always_include: true
  question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, asking what else the user did returns agent telemetry from every
    host. The query instead mirrors the rule's selection criteria scoped to the alerting parent,
    fleet-wide, in the alert window. Several hosts in the same window points to a pushed or
    scheduled deployment of Notepad++; a single host points to a host-local trigger such as one
    person running an installer they downloaded.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|endswith: \regsvr32.exe
        CommandLine|startswith: regsvr32 /s
        CommandLine|contains: \contextMenu\NppShell.dll
      filter_main_legit_regsvr32:
        Image:
        - C:\Windows\System32\regsvr32.exe
        - C:\Windows\SysWOW64\regsvr32.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation

- question: >-
    Have other hosts fired the rule's pattern in the past week, and does the cross-host
    distribution look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection criteria with no host scope, giving a fleet-wide count of
    this specific pattern. Many hosts firing it points to a packaged Notepad++ deployment that
    stages the installer somewhere the search order resolves oddly — a tuning problem. One host, or
    a small unrelated set, points to individually downloaded installers and keeps the per-host
    directory analysis load-bearing.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|endswith: \regsvr32.exe
        CommandLine|startswith: regsvr32 /s
        CommandLine|contains: \contextMenu\NppShell.dll
      filter_main_legit_regsvr32:
        Image:
        - C:\Windows\System32\regsvr32.exe
        - C:\Windows\SysWOW64\regsvr32.exe
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
  answer_sources:
  - process_creation

- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host help place this event in a timeline. Look in particular for
    activity around the download itself — browser or archive utility behavior, files written to the
    user profile — since the technique requires two files reaching the same directory before the
    installer runs.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert

- question: Were process-based persistence mechanisms installed on this host after the alerting execution?
  context: >-
    A privilege escalation is a means, not an end. Once a process runs with the installer's
    elevated token, the common next step is to convert that access into something that survives
    reboot — a scheduled task, a service, a Run key, or a WMI subscription. Executions of the
    scheduling and service tools in the window around the alert, particularly ones descending from
    the alerting process, indicate the elevation was used rather than merely obtained.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
