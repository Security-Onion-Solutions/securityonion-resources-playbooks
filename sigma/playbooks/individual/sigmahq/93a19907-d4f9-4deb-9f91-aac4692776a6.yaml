name: UAC Bypass Using .NET Code Profiler on MMC
id: bc694e86-376f-4366-bb85-90f65d2a1acb
description: |
  Detects a file write of pe386.dll into a user's local Temp directory (a path that starts under
  C:\Users\ AND ends with \AppData\Local\Temp\pe386.dll). This is the payload-staging step of the
  .NET Code Profiler User Account Control bypass: an actor registers a CLR profiler (the
  COR_ENABLE_PROFILING / COR_PROFILER environment values plus a CLSID InprocServer32 entry pointing at
  the dropped DLL), then launches auto-elevating mmc.exe, whose managed host loads the profiler DLL and
  runs the operator's code at high integrity with no consent prompt. This DLL name and path are the
  UACMe method-39 signature; a legitimate profiler would not deploy to a per-user Temp path under this
  name. Investigate what the DLL contains, which process wrote it and what launched that process,
  whether the profiler was registered in the registry, whether mmc.exe subsequently loaded the DLL, and
  what ran at high integrity afterward.
type: detection
detection_id: 93a19907-d4f9-4deb-9f91-aac4692776a6
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the created file path and the writing process match what this rule detects?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a
    file whose path starts under C:\Users\ AND ends with \AppData\Local\Temp\pe386.dll is created.
    Review the exact TargetFilename, the operation performed, and the responsible process on the
    triggering event. A per-user Temp path with this specific DLL name is the profiler-payload staging
    step of the .NET Code Profiler elevation bypass, not a normal application file.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to drop a DLL named pe386.dll into a local Temp directory?
  context: >-
    Legitimate software rarely deploys a profiler DLL under this exact name into a per-user Temp folder.
    Knowing whether the writing account and host function match any sanctioned tooling or testing is
    often the fastest way to separate red-team or administrator activity from a live bypass. User
    attribution is present on roughly 94% of endpoint file events; when it is a machine account or
    missing, judge by the writing process and host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What does pe386.dll contain, and is it a genuine .NET profiler or an operator payload?
  context: >-
    This DLL is loaded by an auto-elevating managed host (mmc.exe) as a CLR profiler, so the CLR expects
    it to export the profiler callback interface. Inspect its exports, strings, and imports to determine
    what it actually executes at high integrity - a bypass payload typically spawns a shell or runs
    embedded commands rather than implementing real profiling. File-write events carry no hash, so
    retrieve the DLL from its on-disk path to hash and analyze it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If pe386.dll was loaded, what is its hash and code-signing status, and is it known malicious?
  context: >-
    A DLL carries its hash and signature on the load event, so if the profiler was loaded these fields
    read directly from the load record. Submit the hash to threat intelligence to determine whether the
    DLL is known malicious, benign, or previously unseen. A genuine profiler component is normally signed
    by a recognizable vendor; an unsigned or unknown DLL loaded from a per-user Temp path is the payload.
    If it was never loaded, retrieve it from disk and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What process wrote pe386.dll, and what launched that process?
  context: >-
    The file event carries no command line, so pivot by the writing process's own identifier to its
    process record to read its Image, full command, and parent lineage. A drop performed by an unsigned
    binary, a script host such as wscript.exe or mshta.exe, or an interpreter launched from an Office
    application or browser points to the bypass being staged programmatically. The parent chain
    distinguishes an automated tool run from a deliberate hands-on action.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Is pe386.dll still on disk, or was it deleted or renamed after the alert?
  context: >-
    The DLL's post-alert lifecycle drives next steps. A profiler payload still on disk can be retrieved,
    hashed, and analyzed; a file deleted seconds after creation suggests the operation completed and the
    staging artifact was cleaned up, shifting the investigation to what loaded and executed in between.
    Review the file operations on this path over the following window to see whether it persisted.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A process that stages one bypass component often drops several - the profiler DLL, a registration
    helper, or a follow-on payload. The breadth, paths, and names of the writing process's other file
    activity distinguish a single artifact from a multi-file staging operation and enumerate what else
    needs review. The correlation covers the writer and its direct children, since droppers often
    delegate.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to this user's local Temp directory recently, and by which processes?
  context: >-
    Temp is a common staging location, so other recent arrivals in the same directory reveal whether this
    is an isolated drop or a folder under active use by the same tool. The aggregation groups by path and
    writing process; an unfamiliar writer placing several files here alongside the profiler DLL points to
    a staging operation rather than routine application activity. Volume alone is not suspicion in Temp -
    look at which process wrote what.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\AppData\Local\Temp\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Was pe386.dll loaded as a DLL, and was the loading process an auto-elevating binary such as mmc.exe?
  context: >-
    The bypass completes when an auto-elevating managed host loads the profiler DLL at high integrity.
    Listing the load events for this DLL and the process that loaded it reveals whether it was pulled in
    by mmc.exe - the auto-elevated .NET host this technique targets - which ties the Temp drop to the
    elevation attempt. A load by mmc.exe shortly after the write is the technique firing; no load event
    means the payload was staged but the trigger did not run in this window.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - ProcessGuid
      - ImageLoaded
- question: Was a CLR profiler registered in the registry to point an auto-elevated process at this DLL?
  context: >-
    The .NET Code Profiler bypass requires registration before the elevation triggers: the
    COR_ENABLE_PROFILING and COR_PROFILER environment values under HKCU\Environment, and a CLSID
    InprocServer32 default value pointing at the dropped DLL. Finding these writes confirms the profiler
    mechanism and reveals the CLSID and DLL path the managed host was steered to load. The query looks
    for the environment values and for a CLSID registration whose data references the profiler DLL.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection_env:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\Environment\COR_ENABLE_PROFILING'
          - '\Environment\COR_PROFILER'
      selection_clsid:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\CLSID\'
        Details|contains: 'pe386.dll'
      condition: selection_env or selection_clsid
    fields:
      - TargetObject
      - Details
      - Image
- question: What ran at high or system integrity on this host after the profiler DLL was dropped?
  context: >-
    The bypass exists to run operator code at high integrity. After mmc.exe loads the profiler, common
    follow-on actions include installing persistence, dumping credentials, tampering with security tools,
    or accessing protected resources. Reviewing processes that started at High or System integrity shortly
    after the drop reveals the objective of the elevation. A tunable correlation window of tens of seconds
    to a few hours between the drop and the elevated process keeps this focused on the same operation.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- always_include: true
  question: Has this user previously produced this file-drop pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, so the result is the user's 90-day history
    of this specific pe386.dll Temp-drop pattern, aggregated by host - not generic file activity. A user
    who has never produced this pattern is more suspicious than one who does so regularly; weigh the count
    against the user's role and whether they run elevation or profiling tooling as part of their job.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\Users\
        TargetFilename|endswith: \AppData\Local\Temp\pe386.dll
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this file-drop pattern, or is the program new for this activity?
  context: >-
    When the alert fires under a machine or service account, user identity does not attribute the
    behavior; the meaningful pivot is the launch mechanism. The query mirrors the rule's selection scoped
    to the alerting program, so the result is the 90-day history of this program driving this
    specific pe386.dll drop, aggregated by host. A new or rare program for this pattern is the deviation
    worth chasing; a program already accounting for many prior events is likely automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\Users\
        TargetFilename|endswith: \AppData\Local\Temp\pe386.dll
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around the time of the alert?
  context: >-
    Tracking the user's activity across all hosts reveals whether the same account drove related activity
    elsewhere, which would widen the scope of the incident. If the same user triggered elevation staging
    or other tooling on multiple hosts in this window, the operation is not confined to one endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven drop pattern fire on other hosts in the same window?
  context: >-
    Under a machine or service account, network-wide user activity returns agent-telemetry noise; the
    meaningful question is whether the same launch mechanism dropped this DLL elsewhere. The query mirrors
    the rule's selection scoped to the alerting program, fleet-wide, in the alert window. Multiple
    hosts point to pushed or scheduled automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\Users\
        TargetFilename|endswith: \AppData\Local\Temp\pe386.dll
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Was pe386.dll dropped on any other hosts in the environment?
  context: >-
    The same DLL name and path appearing on multiple hosts suggests a broad tool run or a mis-scoped
    deployment; the drop confined to one host suggests a targeted elevation. Comparing the writing process
    and timing across hosts separates a single hands-on operation from repeated use of the same bypass
    across the environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    An elevation bypass rarely happens in isolation. Aggregating process activity in a tight window around
    the drop surfaces what led up to it and what ran immediately after. Novel parent-child pairs stand out
    at low counts against high-count routine telemetry, which is what points to the tool that staged the
    profiler and any high-integrity actions taken once elevation succeeded.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, execution of scripting tools, defense tampering,
    or other elevation attempts - may reveal the stages that preceded this drop and help reconstruct the
    timeline. An elevation bypass is typically a means to run privileged follow-on actions, so prior
    alerts help place this staging step within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
