        - MD5=F3D4144860CA10BA60F7EF4D176CC736
        - MD5=0EEB1C0133EB4D571178B2D9D14CE3E9
      selection_pe_1:
      - OriginalFileName: 3CXDesktopApp.exe
      - Image|endswith: \3CXDesktopApp.exe
      - Product: 3CX Desktop App
      selection_pe_2:
        FileVersion|contains: 18.12.
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_pe_* or selection_hashes) and _pb_scope
    fields:
    - host.name
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Aggregating every parent-child pairing on the host in the surrounding half hour collapses
    repetitive service and agent telemetry into high-count rows while novel pairings stand out at
    low counts. Scan for an installer or package process running near the alert, which would explain
    the build as a recent deployment, and for reconnaissance binaries, credential-access tooling, or
    persistence utilities, which would mean the concern has already moved past which build is
    installed.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host place this event in a sequence. An empty preceding window
    alongside a long, unremarkable execution history is the profile of an install that has simply
    been sitting unpatched. Preceding detections — defense tampering, reconnaissance, or credential
    access — argue instead that the build on this host is the entry point for activity already
    underway, and set the timeline for how far back to look.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
