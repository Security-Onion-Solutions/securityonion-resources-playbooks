- question: What started this instance of the application, and is that launcher the expected one?
  context: >-
    A softphone is normally started by the user's shell at logon, by a session-manager or autostart
    entry, or by its own updater service. Those launchers are predictable and worth confirming. A
    start from a script interpreter, an archive utility, a browser download handler, or another
    application is not part of how a managed install runs and reframes the alert around how the file
    got onto the host rather than around which build it is. The parent's own command line, retrieved
    here, shows what invoked it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: >-
    Where did this application connect on this host around the time of the alert, and do the
    destinations match its expected endpoints?
  context: >-
    A softphone connects to the organisation's own call server and to the vendor's provisioning and
    update endpoints, so its legitimate destination set is narrow and knowable in a way that most
    applications' is not — which makes egress outside that set readable. What is worth separating
    here is call and media traffic, which is high-volume and bursty around call activity, from
    steady low-volume connections to hosts with no telephony role, which is the profile of a
    module reporting out from inside the application. Destination hostnames are resolved by a
    separate lookup event and are frequently absent from connection records, so work from the
    destination addresses and pivot to name resolution for attribution.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: Did this application spawn any child processes on this host after the alert?
  context: >-
    An Electron softphone runs its own helper renderer processes and, on update, an installer or
    updater helper — those are its normal children and are identifiable by name and path. Anything
    outside that set, particularly a command interpreter, a script host, or a signed system binary
    that loads external code, means code inside the application is driving execution rather than the
    application doing its job. Reading the children here also tells the analyst whether the concern
    is limited to which build is installed or has already progressed to execution on the host.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: How long has this application been running on this host, and who has been running it?
  context: >-
    Ninety days of execution history separates an install that has been part of this host's normal
    working pattern from one that appeared recently. A long, steady history under the same account
    describes a deployed application that simply never took an update — the most common outcome for
    a version-branch match. A short history, a first execution close to the alert, or executions
    under an account that does not match the host's owner describes a copy that arrived by some
    other route and deserves the origin questions instead.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: >-
    When this host has previously matched the rule's pattern, what parents and users drove it, and
    does the current alert fit that history?
  context: >-
    This mirrors the rule's selection scoped to this host, so the parent and user distribution
    describes how this specific build has run here over the past two weeks rather than how the
    application generally runs. A stable launcher and a single user account across the window
    describe an install that has been quietly present the whole time and only alerted because the
    rule matched it. A parent or an account that appears for the first time on the alerting event is
    the deviation to pursue, because the build did not change between those executions but something
    about how it is being launched did.
