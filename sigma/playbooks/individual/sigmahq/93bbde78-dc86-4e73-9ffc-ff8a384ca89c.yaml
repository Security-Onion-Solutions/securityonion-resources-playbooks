name: Potential Compromised 3CXDesktopApp Execution
description: |
  Detects execution of 3CXDesktopApp.exe where the running build matches one the rule treats as
  compromised. It fires when either the process identifies as the desktop softphone — by
  OriginalFileName, by an image path ending in the application executable, or by its Product string —
  AND its FileVersion reports an 18.12. build, or when the process image hash matches one of the
  MD5, SHA1, or SHA256 values the rule enumerates. This is a build-identity detection rather than a
  behavioural one: the application is signed, widely deployed, and makes routine network connections,
  so a valid signature and normal-looking egress are the premise here, not evidence against the
  alert. The investigation should determine which branch matched, whether the install on this host is
  the build the rule names or a version that merely resembles it, what modules the process loaded and
  whether any of them are unsigned or staged outside the installation directory, and — most
  decisively — how many hosts across the environment are running the same build, since an altered
  application build reaches every host that took the update while a single host points at a stale or
  relocated install.
id: adc8f97e-a8eb-46e4-b609-5bc9ed0fbf58
type: detection
detection_id: 93bbde78-dc86-4e73-9ffc-ff8a384ca89c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Did this alert match on the application-identity plus version branch, or on the hash branch?
  context: >-
    The rule fires on either of two branches, and which one matched changes what the alert means.
    The first branch needs both halves together — the process identifies as the softphone (an
    OriginalFileName of 3CXDesktopApp.exe, an image path ending in that executable, or a Product
    string of "3CX Desktop App") AND its FileVersion contains "18.12." The second branch is a direct
    hash match against the MD5, SHA1, and SHA256 values the rule enumerates. A hash-branch match
    identifies the exact build by content and is not something a version string can imitate. A
    version-branch match says only that an install reporting an 18.12. build ran, which an unpatched
    or re-versioned copy also satisfies; confirm the reported version against the actual file hash
    before treating the two branches as equivalent. Note which branch fired — the hash branch makes
    the module and fleet questions confirmatory, while the version branch makes them the discriminators.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
      - FileVersion
      - Product
- question: Is this host expected to have this softphone installed, and this user expected to run it?
  context: >-
    A desk workstation belonging to someone who takes calls is the ordinary case and does not by
    itself explain the alert, because the rule is not firing on the fact that the application ran —
    it is firing on which build ran. The useful answers are about deployment: was this install
    pushed by the organisation, is it a self-installed copy, and is the host one that deployment
    tracking knows about. A host running the application outside any managed deployment is the
    likeliest place for a build nobody has updated.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: >-
    Where is this copy of the application installed from, and what command line and working
    directory did it run with?
  context: >-
    Read the full path first. An install under the standard per-user or program installation
    directory with the vendor's own directory structure is the expected form; a copy running from a
    temporary directory, a download folder, a network share, or a renamed directory is a relocated
    or hand-placed build rather than a managed one, and changes the question from "is this install
    outdated" to "where did this file come from". The command line and working directory show
    whether the application was started normally by a user session or invoked with arguments that
    point at an alternative configuration or module directory. The host scope here also surfaces any
    other executions of the same binary in the surrounding minutes.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: >-
    What modules did this application load on this host, and were any of them unsigned, invalidly
    signed, or loaded from outside the installation directory?
  context: >-
    This is the most direct evidence available for a build-identity alert. When an application's
    build is altered, the added code generally ships as a library the application side-loads
    alongside its own — the executable itself keeps a valid vendor signature, so signing status on
    the process tells the analyst nothing, while signing status on each loaded module tells them a
    great deal. Library-load events carry the signer, the signature validation result, and the hash
    of every module, so an unsigned library sitting in the application's own directory, a module
    whose signature does not validate, a module signed by a party unrelated to the vendor, or a
    library loaded from a user-writable path can each be identified and reputation-checked without
    waiting for the module to do anything observable. Compare the module set and the module hashes
    against a known-good install of the same application version.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: >-
    Which builds of this application are running across the environment, and is the alerting host's
    version an outlier or the common one?
  context: >-
    An application build is not a host-local property — every host that took the same update runs
    the same file. Aggregating the reported version across the environment answers whether this is
    one machine that never took an update or an install base sitting on the same build, and it makes
    the remediation obvious either way. A single host on an old version alongside a fleet on a
    current one is a patching gap; a wide spread of hosts on the version the rule names is a
    deployment-level problem that no per-host triage will resolve. Feed the version list back to
    deployment or asset tracking to identify which hosts are missing an update.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - OriginalFileName: 3CXDesktopApp.exe
      - Image|endswith: \3CXDesktopApp.exe
      - Product: 3CX Desktop App
      condition: selection
    fields:
      - FileVersion
      - host.name
- question: >-
    Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution
    look like a managed deployment or an isolated install?
  context: >-
    This mirrors the rule's own selection with no host scope, so the count is fleet-wide for the
    rule's exact pattern rather than for generic use of the application. It is the question that
    decides the scope of the response. Many hosts matching within the same period means the build
    itself arrived through the deployment or update path and reached the install base at once, and
    the work is inventory and remediation rather than host triage. One host, or a small set with
    nothing in common, points at a stale, self-installed, or relocated copy that never took the
    update everyone else got. Count distinct hosts before deciding which of those two situations is
    in front of you.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_hashes:
        Hashes|contains:
        - SHA256=DDE03348075512796241389DFEA5560C20A3D2A2EAC95C894E7BBED5E85A0ACC
