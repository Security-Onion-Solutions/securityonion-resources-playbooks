  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    This mirrors the rule's selection scoped to the alerting user and aggregated by host, so the
    result is that user's ninety-day history of running this specific build rather than their
    general use of the application. A user who has produced the pattern steadily on one host is
    running an install that has been in place and unpatched; the same user producing it across
    several hosts is worth reading against their role, because an account that carries the same
    install from machine to machine is usually either a support role or a roaming or hand-copied
