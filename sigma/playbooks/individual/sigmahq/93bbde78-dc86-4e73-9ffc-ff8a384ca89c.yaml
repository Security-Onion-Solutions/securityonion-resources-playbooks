  context: >-
    Under a service principal, asking what else the user did returns agent telemetry rather than an
    answer, because every host runs service-owned processes constantly. This mirrors the rule's
    selection scoped to the alerting launcher across the environment inside the alert window
    instead. Several hosts starting this build through the same launcher within the same hour is
    the signature of something pushed or triggered across the install base at once — a deployment
    run, a scheduled update, or a rollback to an earlier package. A single host points at a
    host-local start.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_hashes:
        Hashes|contains:
        - SHA256=DDE03348075512796241389DFEA5560C20A3D2A2EAC95C894E7BBED5E85A0ACC
        - SHA256=54004DFAA48CA5FA91E3304FB99559A2395301C570026450882D6AAD89132A02
        - SHA256=D45674F941BE3CCA2FBC1AF42778043CC18CD86D95A2ECB9E6F0E212ED4C74AE
        - SHA1=480DC408EF50BE69EBCF84B95750F7E93A8A1859
        - SHA1=3B43A5D8B83C637D00D769660D01333E88F5A187
        - SHA1=6285FFB5F98D35CD98E78D48B63A05AF6E4E4DEA
        - MD5=BB915073385DD16A846DFA318AFA3C19
        - MD5=08D79E1FFFA244CC0DC61F7D2036ACA9
