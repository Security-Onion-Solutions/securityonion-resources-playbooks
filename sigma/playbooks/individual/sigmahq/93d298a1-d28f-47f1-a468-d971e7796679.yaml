name: Disable Tamper Protection on Windows Defender
id: a31018fc-07bc-4b9c-87a2-8df01d190613
description: |
  Detects a registry write that sets the Windows Defender Tamper Protection value
  (a TargetObject ending in \Microsoft\Windows Defender\Features\TamperProtection) to
  DWORD (0x00000000), which turns Tamper Protection off. Tamper Protection normally guards
  Defender's own settings from modification and is changed only through the Windows Security
  interface or centrally managed policy; the rule excludes Defender's own engine (MsMpEng.exe)
  writing this value so that the alert reflects a write from some other process. Disabling this
  control removes the barrier that stops further changes to Defender - real-time monitoring,
  exclusions, service state - and commonly precedes malware execution or credential access.
  Investigate which process set the value and how it was invoked, whether other defenses were
  tampered with in the same window, what ran on the host after protection dropped, and whether
  the value was restored afterward.
type: detection
detection_id: 93d298a1-d28f-47f1-a468-d971e7796679
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting write set the Windows Defender Tamper Protection value to 0, and did a process other than Defender's own engine make it?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a
    value whose path ends in \Microsoft\Windows Defender\Features\TamperProtection is written AND the
    value data is DWORD (0x00000000), which is the "off" state, AND the writing process is not Defender's
    own MsMpEng.exe engine. Review the exact TargetObject and Details on the triggering event to confirm
    the value was set to 0. On a protected host this value is not writable by ordinary processes, so a
    non-Defender process setting it to 0 is the tamper action itself.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to change Windows Defender Tamper Protection?
  context: >-
    Tamper Protection is turned off deliberately only in narrow circumstances - a local administrator
    using the Windows Security interface, or a change pushed through managed policy - and effectively
    never through an ad hoc registry write. Knowing whether the writing account and host function match
    any sanctioned change is the fastest way to separate a sanctioned administrative action from a live
    tamper. User attribution is present on roughly 94% of endpoint registry events; when it is a machine
    account or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which value was modified, and why is the Tamper Protection key a defense-evasion location?
  context: >-
    The value under \Microsoft\Windows Defender\Features\TamperProtection governs whether Defender's own
    settings are locked against modification. Setting it to 0 releases that lock, after which real-time
    monitoring, exclusion lists, and the Defender service can be altered without the setting being reverted
    automatically. Confirming the exact path and writing process establishes that this is the Tamper
    Protection control rather than an unrelated Defender key, and frames the tampering that this unlock
    enables.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value data was written to the Tamper Protection key and what does it mean?
  context: >-
    The Details field holds the value data. DWORD (0x00000000) means Tamper Protection is off; the enabled
    states carry a non-zero DWORD such as 1 or 5. A value of 0 written by a non-Defender process is the
    disable action, not a routine state read-back. Details is present on roughly 79% of registry
    modifications and should be populated for this DWORD value; if it is absent, treat the write itself as
    the signal and lean on the writing process to establish intent.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: How was Tamper Protection disabled - what did the writing process run?
  context: >-
    The registry event names the process that wrote the value but not how it was invoked. Pivoting to the
    writing process's own execution record reveals the command that performed the change - a direct reg.exe
    write to the value, a PowerShell Set-MpPreference or registry cmdlet, or a purpose-built tool. The exact
    invocation distinguishes a scripted, tool-driven disable from an interactive console action and shows
    whether the same command chained into further Defender changes.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process wrote the value, and what launched that process?
  context: >-
    The registry event carries no command line or parent, so pivot by ProcessGuid to the writing process's
    execution record to read its Image, full command, and parent lineage. A write launched from a script
    host such as wscript.exe or mshta.exe, an Office application, a browser child, or an unsigned binary
    points to the disable being staged programmatically rather than a deliberate administrator action. The
    parent chain separates a scripted tamper from an interactive console session.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Is Tamper Protection currently restored, or is the host still unprotected?
  context: >-
    Disabling Tamper Protection may be a brief step to enable a single action or a durable change that
    leaves Defender open to further modification. Registry value deletions are not observable in this
    telemetry, so current state is judged from the key's re-modification history and from direct host or
    endpoint-console inspection. If Tamper Protection remains off, the control should be restored before
    further investigation, since the unlock leaves the rest of Defender's configuration modifiable.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What activity occurred on this host after Tamper Protection was disabled?
  context: >-
    Defenses are disabled to enable actions that would otherwise be blocked or logged - running malware,
    dumping credentials, or changing Defender exclusions and service state now that the lock is off.
    Examining process activity in the window after the write reveals what the disable was meant to permit.
    Aggregating collapses routine agent telemetry into high-count rows while novel processes stand out at
    low counts; a quiet interval followed by new execution points to the activity the tampering enabled.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense tampering actions performed on this host?
  context: >-
    An actor who unlocks Defender often disables several controls in the same operation - stopping services,
    clearing event logs, deleting shadow copies, or changing firewall policy - to widen the coverage gap.
    Finding additional tampering commands from the same user or parent within the surrounding window shows
    whether disabling Tamper Protection was one step in a broader impairment of host defenses rather than an
    isolated change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: What other registry modifications were made on this host in the same window?
  context: >-
    With Tamper Protection off, further Defender settings can be changed without automatic reversion, so
    look for adjacent registry writes in the same session - Defender exclusion or real-time-monitoring
    policy keys, service configuration, firewall settings, or persistence keys. Clustering the registry
    writes on this host in a short window around the alert reveals the full scope of changes and which
    process made them. The triggering key appears in the results; the signal is what else was modified and
    by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: After this write, was the Tamper Protection value re-enabled or changed again?
  context: >-
    Registry value deletions are not observable in this telemetry, so durability is judged from the key's
    re-modification history rather than from a delete event. A later write restoring a non-zero (enabled)
    value indicates the control was turned back on - either by an administrator or by the actor covering
    the change after completing the intended action - while the value remaining 0 leaves Defender open to
    modification. Compare the Details values written over the following window to establish whether the host
    is still exposed.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Has the Tamper Protection value been modified before on this host?
  context: >-
    This value changes rarely and only through deliberate action, so a history with no prior writes makes
    this a first-time change and raises its weight. A history of periodic writes may point to a management
    process or a repeatedly run tool, though a recurring disable would itself warrant scrutiny. Compare the
    historical Details values to see whether the control was set to 0 before or whether this is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was the Tamper Protection value modified on other hosts in the environment?
  context: >-
    The same disable across many hosts suggests a broad tool run, a mis-scoped policy, or spreading
    activity; the same change confined to one host suggests a targeted tamper. Compare the Details values
    and writing process across hosts to see whether they all set the value to 0 through the same process,
    which separates a single hands-on operation from repeated use of the technique across the environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Defense tampering rarely happens in isolation. Aggregating process activity in a tight window around
    the alert surfaces what led up to the disable and what ran immediately after it. Novel parent-child
    pairs stand out at low counts against high-count routine telemetry, which is what points to the tool
    that performed the change and any follow-on actions taken once protection was off.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, execution of scripting tools, or other defense
    tampering - may reveal the stages that preceded this change and help reconstruct the timeline.
    Disabling Tamper Protection is typically a means to an end, so prior alerts help place this write within
    a larger sequence and identify what the actor intended to do once Defender was open.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Impairing defenses is frequently paired with establishing a foothold. Scheduled tasks, services,
    registry Run keys, BITS jobs, or WMI subscriptions created by schtasks.exe, sc.exe, reg.exe,
    bitsadmin.exe, or wmic.exe near the disable indicate the reduced visibility was used to install
    persistence rather than being an isolated action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely - dropping an executable or script into
    a Startup folder or a path referenced by a registry Run key achieves persistence without invoking
    schtasks, sc, or reg. File writes to these locations near the disable indicate a payload established a
    parallel persistence mechanism on disk while Defender was open.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
