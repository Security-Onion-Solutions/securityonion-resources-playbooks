name: Potential Devil Bait Related Indicator
id: 10a26805-fe67-49dd-9b56-312043e43bd3
description: |
  Detects schtasks.exe, wscript.exe, or mshta.exe creating a .txt or .xml file under
  \AppData\Roaming\Microsoft\, a staging pattern seen across Devil Bait samples where a
  second-stage script host drops configuration and payload artifacts into a Microsoft-branded
  user directory. These three binaries rarely have a legitimate reason to write text or XML
  files into that specific location, so the drop usually marks either the malware writing
  intermediate artifacts or a hands-on operator staging files. Investigate what the writing
  process is and what launched it, read the dropped file's content, confirm whether the file
  is still on disk, and check for the scheduled-task persistence and follow-on execution that
  characterize this chain.
type: detection
detection_id: 93d5f1b4-36df-45ed-8680-f66f242b8415
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alert show a .txt or .xml file created under \AppData\Roaming\Microsoft\ by schtasks.exe, wscript.exe, or mshta.exe?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires
    when one of schtasks.exe, wscript.exe, or mshta.exe writes a file whose path lies under
    \AppData\Roaming\Microsoft\ AND whose name ends in .txt or .xml. Review the exact
    TargetFilename, the operation performed, and the responsible process against those criteria.
    None of these three binaries normally drop text or XML artifacts into that directory, so a
    confirmed match is the staging step of the drop pattern.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to have these script-host or scheduler binaries write text or XML files into the Microsoft roaming directory?
  context: >-
    Legitimate administrative scripting can occasionally touch AppData, but schtasks.exe,
    wscript.exe, and mshta.exe writing .txt or .xml artifacts into \AppData\Roaming\Microsoft\
    is not a routine operation. Knowing whether the account and host role explain the write is
    the fastest way to separate sanctioned automation from the malware staging pattern. When
    User is a machine or service account, judge by the writing process and the host's function
    rather than the identity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the file still on disk, or was it deleted or renamed after the alert?
  context: >-
    The dropped .txt or .xml is often an intermediate staging artifact that the malware reads
    and then removes. A file still on disk can be retrieved, hashed, and its content reviewed; a
    file deleted shortly after creation points to anti-forensic cleanup or a self-clearing stage
    and shifts the investigation toward what executed in between. The post-alert lifecycle drives
    both urgency and next steps.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What command did the process that created this file run?
  context: >-
    The file event carries no command line, so pivot by ProcessGuid to the writing process's own
    record and decode its full command. wscript.exe and mshta.exe reveal the script or the remote
    HTA they were told to execute; schtasks.exe reveals the task name (/TN), the command it runs
    (/TR, commonly mshta loading a remote HTA), and the schedule (/SC, commonly a short recurring
    beacon). The command line is what distinguishes benign use from the drop-and-persist chain.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What is the content of the dropped file, and does it contain obfuscation, encoded strings, or known-malicious indicators?
  context: >-
    Read and analyze the .txt or .xml content. Devil Bait stages drop configuration and payload
    text into this directory, so check for base64 or otherwise encoded strings, embedded URLs or
    IP addresses, script fragments, and known family string patterns. Content retrieval requires
    a manual pull from the endpoint; compare any suspicious strings against threat intelligence.
    This is distinct from confirming whether the file is known by hash - here the question is what
    is actually inside it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What process created this file, and what launched it?
  context: >-
    The file event identifies the writing process but not its parent, so pivot by ProcessGuid to
    the writing process's own creation record to read its Image and parent lineage. In this chain
    the script hosts are typically launched from a macro-enabled document, so a parent such as an
    Office application, wscript.exe, or mshta.exe corroborates the malware chain; an interactive
    shell parent points instead to hands-on activity. The parent chain separates a scripted drop
    from a deliberate console action.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - ParentImage
      - ParentCommandLine
- question: What other files did the process that created this file write or delete around the alert?
  context: >-
    A process that drops one staging artifact often drops several - a script host unpacking
    components, writing configuration, and staging a payload in sequence. The breadth, paths, and
    extensions of the writing process's other file activity distinguish a single artifact from a
    multi-file staging operation and enumerate what else needs review. The correlation follows the
    writer and its direct children, since droppers frequently delegate.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to the Microsoft roaming directory recently, and by which processes?
  context: >-
    The \AppData\Roaming\Microsoft\ path holds legitimate application data, so the signal is an
    unfamiliar writer or a cluster of new .txt and .xml artifacts rather than volume alone. Other
    recent arrivals in the same directory reveal whether this is an isolated drop or a location
    under active staging use, and which other artifacts belong to the same activity. The
    aggregation groups by path and writing process so a single unfamiliar writer stands out.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\AppData\Roaming\Microsoft\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has this file been seen before on this host or elsewhere in the environment?
  context: >-
    A file that has never appeared on a host is more suspicious than one that is part of normal
    operations. First appearance of this filename should be checked even if the name looks benign,
    since the staging artifacts often mimic ordinary application data. Zero or very low historical
    counts indicate a first-time or rare drop.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: When this host has previously produced this file-drop pattern, what programs and users drove it, and does the current alert fit that history?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the resulting
    program and user distribution reflects how this specific drop pattern - not generic use of
    the binaries - has historically run here. A new acting program process, an unexpected user
    account, or a first-ever appearance of the pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith:
        - \schtasks.exe
        - \wscript.exe
        - \mshta.exe
        TargetFilename|contains: \AppData\Roaming\Microsoft\
        TargetFilename|endswith:
        - .txt
        - .xml
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- always_include: true
  question: Has this user previously produced this file-drop pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the
    user's 90-day history of this specific drop pattern (not generic use of the binaries),
    aggregated by host. A user who has never produced this pattern is more suspicious than one who
    does so regularly; weigh the count against the user's role and expected toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith:
        - \schtasks.exe
        - \wscript.exe
        - \mshta.exe
        TargetFilename|contains: \AppData\Roaming\Microsoft\
        TargetFilename|endswith:
        - .txt
        - .xml
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this file-drop pattern on this host or across the environment, or is the program new for this activity?
  context: >-
    When the alert fires under a service or machine account, user identity does not attribute the
    behavior; the meaningful pivot is the launch mechanism. The query mirrors the rule's selection
    scoped to the alerting program, so the result is the 90-day history of this program
    driving this specific pattern. A new or rare program for this pattern is the deviation worth
    chasing; a program that already accounts for many prior events is more likely automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith:
        - \schtasks.exe
        - \wscript.exe
        - \mshta.exe
        TargetFilename|contains: \AppData\Roaming\Microsoft\
        TargetFilename|endswith:
        - .txt
        - .xml
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the environment around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether the same account drove related
    activity on multiple endpoints. If the same user produced similar drops or ran follow-on tools
    elsewhere in the same window, the scope of the activity may be larger than this one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven file-drop pattern fire on other hosts in the same window, or is it isolated to this host?
  context: >-
    Under a service or machine account, asking what else the user did returns agent-telemetry
    noise. The meaningful question is whether the same launch mechanism fired elsewhere: the query
    mirrors the rule's selection scoped to the alerting program, fleet-wide, in the alert
    window. Multiple hosts in the same window points to scheduled or pushed automation; a single
    host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith:
        - \schtasks.exe
        - \wscript.exe
        - \mshta.exe
        TargetFilename|contains: \AppData\Roaming\Microsoft\
        TargetFilename|endswith:
        - .txt
        - .xml
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Have other hosts produced this file-drop pattern in the past week, and does the cross-host distribution look like automation or isolated activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of this specific drop pattern rather than generic use of the binaries. Many
    hosts producing the same pattern points to scripted deployment or a mis-scoped tool; one host
    or a small unrelated set points to hands-on operator activity. Use the host distribution and
    parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith:
        - \schtasks.exe
        - \wscript.exe
        - \mshta.exe
        TargetFilename|contains: \AppData\Roaming\Microsoft\
        TargetFilename|endswith:
        - .txt
        - .xml
      condition: selection
    fields:
    - host.name
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity in a tight window around the
    drop surfaces what led up to the write and what ran immediately after. Novel parent-child
    pairs stand out at low counts against high-count routine telemetry, which is what points to
    the tool that staged the drop and any follow-on execution it triggered.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - macro or script execution, reconnaissance, or defense
    tampering - may reveal the stages that preceded this drop and help reconstruct the timeline.
    This staging write is typically one step in a multi-stage chain, so prior alerts help place it
    within the larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host around the alert?
  context: >-
    This chain commonly establishes scheduled-task persistence that beacons on a short interval
    via mshta loading a remote HTA. Because the alert already flags a script-host or scheduler file
    drop, check whether schtasks.exe, at.exe, sc.exe, reg.exe, bitsadmin.exe, or wmic.exe also ran
    near the drop to install additional footholds. Multiple persistence installations from the same
    timeframe indicate intentional stacking rather than an isolated action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
