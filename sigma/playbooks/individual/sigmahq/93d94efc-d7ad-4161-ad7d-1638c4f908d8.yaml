name: HackTool - Dumpert Process Dumper Default File
id: 92cf1467-457b-42d5-8e06-258a905ab716
description: |
  Detects creation of a file whose name ends in dumpert.dmp, the default output file of the Outflank
  Dumpert LSASS memory dumper. Dumpert opens a handle to lsass.exe and reads its memory using direct
  system calls and API unhooking to evade user-mode AV/EDR hooks, then writes a minidump to disk; that
  minidump is the credential-theft artifact and can be parsed offline for cached passwords, hashes, and
  Kerberos tickets. The filename is tool-specific and has no routine legitimate use, so treat a match as
  a probable LSASS credential dump unless an authorized engagement explains it. Investigation should
  identify the process that wrote the file and what launched it, confirm LSASS was the target and by what
  method, assess which accounts on the host may now be exposed, and check for preceding defense tampering
  and subsequent lateral movement.
type: detection
detection_id: 93d94efc-d7ad-4161-ad7d-1638c4f908d8
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the created file path end in dumpert.dmp, and which process wrote it?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a file
    whose name ends in dumpert.dmp is created - the default output path of the Dumpert LSASS dumper. Review
    the exact TargetFilename, the operation type, and the responsible process on the triggering event. The
    filename is specific to the tool and effectively never appears through normal operation, so a genuine
    match is the on-disk product of an LSASS memory dump.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this dumpert.dmp creation part of an authorized penetration test or red team engagement?
  context: >-
    Dumpert is an offensive LSASS-dumping tool that authorized assessments sometimes run. Before deeper
    analysis, check whether a penetration test or red team exercise is active on this host or network
    segment during this window. A sanctioned engagement whose scope, host, and timing match resolves the
    alert; the absence of one leaves a probable credential dump that needs full triage.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to produce an LSASS memory dump file?
  context: >-
    Writing an LSASS minidump is not part of routine administration on most endpoints. Knowing whether the
    account and host function have any sanctioned reason to dump process memory - a rare, deliberate
    troubleshooting action or an approved forensic capture - is often the fastest way to separate a live
    credential theft from an explained event. User attribution is present on roughly 94% of endpoint file
    events; when it is a machine account or SYSTEM, judge by the writing process and host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What process wrote the dump file, and what launched that process?
  context: >-
    The file event carries no command line, so pivot by ProcessGuid to the writing process to read its
    Image, full command, and parent lineage. Dumpert runs either as a standalone executable or as a DLL
    invoked through rundll32.exe with a ,Dump export, and its shellcode form is often injected into an
    unrelated host process by a C2 agent - so the writer may be a signed binary such as rundll32.exe while
    the malicious logic lives in a loaded module. An Office application, script host, or unsigned binary in
    the parent chain points to the dump being staged programmatically rather than by an administrator.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Was LSASS memory the target, and by what dumping method?
  context: >-
    A file ending in dumpert.dmp is a minidump of lsass.exe, so the targeted credential store is LSASS
    memory - which holds cached passwords, NTLM hashes, and Kerberos tickets for accounts with sessions on
    the host. Dumpert obtains this by opening a full-access handle (0x1F0FFF) to lsass.exe and reading its
    memory with direct system calls and API unhooking, deliberately avoiding the user-mode API hooks that
    EDR relies on. Note a telemetry limit: cross-process handle access and memory reads against lsass are
    not captured as events in this environment, so the dump file and the writing process are the evidence
    that the read occurred rather than a handle-open record.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What is the writing binary, and does its hash or loaded module have known threat-intel detections?
  context: >-
    The dump file itself carries no hash on the write event, so identify the process that produced it and
    read the hash from its execution record, then check that hash against reputation and threat intel. If
    the writer is rundll32.exe or another signed system binary, the process hash will look clean - the
    malicious code is the loaded module, so pivot to the DLLs loaded by that process and look for an
    Outflank-Dumpert or similarly named module rather than trusting the process signature.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: Were LSA protection or credential-caching registry settings changed on this host around the dump?
  context: >-
    LSASS dumping is frequently preceded by weakening the protections that limit what the dump yields.
    Setting WDigest UseLogonCredential to 1 forces plaintext credentials back into memory, and clearing the
    RunAsPPL or LsaCfgFlags values disables LSA protection and Credential Guard so an ordinary handle can
    read lsass. A modification of any of these keys near the dump indicates the actor tuned the host for a
    richer credential harvest and raises the severity of what was captured.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|endswith:
          - '\Control\Lsa\RunAsPPL'
          - '\Control\Lsa\LsaCfgFlags'
          - '\SecurityProviders\WDigest\UseLogonCredential'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: Which accounts may be compromised, and do any have elevated privileges?
  context: >-
    An LSASS dump exposes the credentials of every account with a session on the host at the time - the
    logged-on user, any accounts running services, and any admin who authenticated recently. The severity
    depends on their privilege: domain admin, enterprise admin, or broad service-account credentials
    require incident escalation and password resets, while a single standard user is a narrower exposure.
    Cross-reference the accounts active on this host against directory group memberships to scope the reset.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after the dump?
  context: >-
    Credential theft is typically followed by lateral movement using the stolen credentials. The query
    returns outbound connections from this host to remote-access ports - 3389 (RDP), 445 (SMB/PsExec),
    5985/5986 (WinRM), 22 (SSH) - in the hours after the dump, with the originating process and user for
    each. Two limits: credentials replayed from another machine will not appear here, so also review
    successful logons for these accounts on suspected targets, and if network telemetry is not collected
    from this host treat zero rows as a visibility gap rather than proof no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Is the dump file still on disk, or was it deleted or renamed after the alert?
  context: >-
    The dump's post-alert lifecycle drives next steps. A minidump still on disk can be retrieved to confirm
    which accounts it contains and to hash for correlation; a file deleted shortly after creation points to
    the operator collecting it and cleaning up, which shifts focus to what left the host in between. Dumps
    are commonly written to a working directory, %TEMP%, or C:\Windows\Temp - note where this one landed and
    whether it was moved or removed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A credential-dumping operation rarely writes just one file - the same process or its children may stage
    additional dumps, output logs, an archive of collected material, or tooling. The breadth, paths, and
    extensions of the writing process's other file activity distinguish a single artifact from a collection
    in progress and enumerate what else needs review and preservation before it is exfiltrated.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other process activity occurred on this host around the time of the dump?
  context: >-
    Credential dumping sits in the middle of an intrusion, so the surrounding process activity often shows
    how the actor arrived and what they did next. Aggregating process creations in a tight window around the
    alert collapses routine agent telemetry into high-count rows while novel parent-child pairs stand out at
    low counts - reconnaissance commands, a script host launching the dumper, or archiving utilities are the
    kind of low-count neighbors that reveal the wider operation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before the dump?
  context: >-
    A credential dump is usually a means to an end, reached after initial access and often after defense
    tampering or reconnaissance. Earlier detections on the same host - a web shell write, execution of
    scripting tools, disabling of protections, or discovery commands - help reconstruct the stages that led
    here and place the dump within the larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- always_include: true
  question: Has this user produced a dumpert.dmp write before, and does that history fit their role?
  context: >-
    The query mirrors the rule's own pattern scoped to this user, so the result is the account's 90-day
    history of writing a dumpert.dmp file rather than generic activity. Because the filename has no
    legitimate use, a history of zero makes this a first-time event and reinforces that it is anomalous; any
    prior occurrences would themselves warrant review. Weigh the result against whether this account has any
    sanctioned reason to run memory-dumping tools.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: dumpert.dmp
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program driven a dumpert.dmp write before on this host or across the environment?
  context: >-
    When the alert fires under a service or machine account, user identity does not attribute the behavior,
    so the meaningful pivot is the launch mechanism. The query mirrors the rule's pattern scoped to the
    alerting program, giving its 90-day history of driving a dumpert.dmp write, aggregated by host. A
    new or rare program for this pattern is the deviation to chase; a program already responsible for many
    prior events across hosts points to a recurring tool or automation that should still be explained given
    what the artifact is.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: dumpert.dmp
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
