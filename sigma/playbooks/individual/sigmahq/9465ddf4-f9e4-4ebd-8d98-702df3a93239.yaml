name: IIS Native-Code Module Command Line Installation
id: 01bcfd82-b2d5-45f0-b3b1-f028a1d09b35
description: |
  Detects appcmd.exe installing an IIS module from the command line, where the
  Image ends in appcmd.exe (or its OriginalFileName is appcmd.exe) AND the command
  line contains both 'install' and 'module' AND a '-name:' switch, excluding the
  case where the parent is the legitimate iissetup.exe. Registering an IIS module
  is a normal administrative action when an application is deployed or updated, but
  the same operation lets an operator install a passive backdoor that loads into the
  IIS worker process w3wp.exe on every HTTP request and persists across IIS restarts
  and OS updates. The investigation should determine what module and DLL were
  registered, which path the DLL points at, what spawned appcmd.exe, whether a module
  load by the worker followed, and whether module installation from this account and
  host is expected.
type: detection
detection_id: 9465ddf4-f9e4-4ebd-8d98-702df3a93239
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the appcmd.exe command line match the IIS module install pattern this rule detects?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The
    rule fires when the binary is appcmd.exe (by Image name or OriginalFileName) AND
    the command line contains both 'install' and 'module' AND a '-name:' switch, and
    the parent is NOT the legitimate iissetup.exe. Read the full command line and
    confirm all of these criteria are present rather than a partial or coincidental
    match.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to install IIS modules?
  context: >-
    Legitimate application deployment installs IIS modules, but normally from a
    deployment pipeline, an admin session, or a maintenance window. Knowing whether
    this server is an IIS host under active deployment and whether this account
    performs module installation is often the fastest way to separate a routine
    deployment from operator persistence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What module name and DLL image path did this appcmd install command register? Decode the full command line.
  context: >-
    The full command line names what was registered. Read the value after '-name:'
    for the module name and the '/image:' path for the DLL the module points at. A
    DLL path under a webroot directory such as inetpub\wwwroot\bin or App_Bin, an
    arbitrary writable path, or any non-Microsoft signed DLL is the artifact to pivot
    on. This query scopes to appcmd executions on this host within a tight window so
    a multi-step deployment is visible as one operation rather than a single line.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_appcmd:
        CommandLine|contains|all:
          - 'install'
          - 'module'
      condition: selection and selection_appcmd
    fields:
      - CommandLine
      - Image
      - CurrentDirectory
- question: What process spawned appcmd.exe and is that parent chain expected?
  context: >-
    The parent process reveals how the install command was invoked. Module
    installation driven by a deployment tool, an interactive admin shell, or a
    documented automation parent is routine. A parent such as w3wp.exe (the IIS
    worker reaching code execution), an Office application, a script host, or an
    unknown binary indicates the install command ran from an exploitation path rather
    than an administrative context. The rule already excludes the legitimate
    iissetup.exe parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Was applicationHost.config modified or the registered DLL dropped to a webroot or inetsrv path around this time?
  context: >-
    Native module installation writes a new add element into applicationHost.config
    under globalModules, and the referenced DLL is typically dropped into a writable
    path first. File events on applicationHost.config, on the inetsrv directory, or on
    webroot bin directories such as inetpub\wwwroot\bin and App_Bin corroborate that a
    module was actually installed rather than the command failing. A new add element
    referencing an unfamiliar DLL path is the persistence artifact. If file event
    telemetry is not collected in this environment, treat zero results as a visibility
    gap rather than evidence nothing was written.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_paths:
        TargetFilename|contains:
          - '\inetsrv\config\applicationHost.config'
          - '\inetsrv\'
          - '\inetpub\wwwroot\bin\'
          - '\App_Bin\'
      condition: selection and selection_paths
    fields:
      - TargetFilename
      - Image
- question: Did w3wp.exe load a newly registered or unsigned DLL from a webroot path after the install?
  context: >-
    A registered native module only becomes a working backdoor once the worker
    process loads it, so the canonical post-installation indicator is w3wp.exe loading
    a DLL from a webroot subdirectory such as inetpub\wwwroot\bin or App_Bin, or
    loading a non-Microsoft signed DLL from any inetsrv path. Correlating a module-load
    event on the worker with the install command confirms the module is live in the
    HTTP request pipeline. If image-load telemetry is not collected in this
    environment, treat zero results as a visibility gap rather than evidence that no
    module loaded.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\w3wp.exe'
      selection_paths:
        ImageLoaded|contains:
          - '\inetpub\wwwroot\bin\'
          - '\App_Bin\'
          - '\inetsrv\'
      condition: selection and selection_paths
    fields:
      - ImageLoaded
      - Image
- question: Did the account behind this activity authenticate to the server with a logon that lines up with the install?
  context: >-
    Server-software-component persistence is usually reached through a web request or
    a remote logon rather than local interactive use, so a logon or explicit-credential
    event on the server close to the install time helps establish how the operator got
    onto the host and under which account. An unexpected network or service logon
    immediately preceding the module install points at remote operator activity; a
    routine interactive admin logon points at maintenance. If Security channel logon
    events are not collected in this environment, treat zero results as a visibility
    gap.
  range: -1h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4624
          - 4648
      condition: selection
    fields:
      - LogonType
      - TargetUserName
      - IpAddress
      - ProcessName
- question: Is any part of this install command encoded or obfuscated, and what does the decoded content reveal about the module or DLL?
  context: >-
    The module name, the DLL image path, or surrounding command content can be hidden
    with environment-variable substitution, character concatenation, base64, or
    short-name path tricks to disguise where the DLL really lives. Decode any obfuscated
    portion to recover the real '-name:' value and '/image:' path. If the command line
    is already plain text, record that the module name and DLL path were read directly.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: When this host has previously fired this appcmd install-module pattern, what parents and users normally drive it, and does the current alert fit?
  context: >-
    Even legitimate module installs leave a baseline. The query mirrors the rule's
    selection structure scoped to this host, so the resulting parent and user
    distribution reflects how this specific install-module pattern has historically run
    here, not generic appcmd usage. A new parent process, an unexpected account, or an
    unusual command structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \appcmd.exe
      - OriginalFileName: appcmd.exe
      selection_cli:
        CommandLine|contains|all:
        - install
        - module
        CommandLine|contains|windash: '-name:'
      filter_iis_setup:
        ParentImage: C:\Windows\System32\inetsrv\iissetup.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this appcmd install-module pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result
    is a fleet-wide count of this install-module pattern rather than generic appcmd
    usage. Many hosts firing the same pattern points to scripted deployment or vendor
    automation; one host or a small unrelated set points to manual operator activity.
    Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \appcmd.exe
      - OriginalFileName: appcmd.exe
      selection_cli:
        CommandLine|contains|all:
        - install
        - module
        CommandLine|contains|windash: '-name:'
      filter_iis_setup:
        ParentImage: C:\Windows\System32\inetsrv\iissetup.exe
      condition: all of selection_* and not 1 of filter_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \appcmd.exe
      - OriginalFileName: appcmd.exe
      selection_cli:
        CommandLine|contains|all:
        - install
        - module
        CommandLine|contains|windash: '-name:'
      filter_iis_setup:
        ParentImage: C:\Windows\System32\inetsrv\iissetup.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \appcmd.exe
      - OriginalFileName: appcmd.exe
      selection_cli:
        CommandLine|contains|all:
        - install
        - module
        CommandLine|contains|windash: '-name:'
      filter_iis_setup:
        ParentImage: C:\Windows\System32\inetsrv\iissetup.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user account do across the environment around the time of the alert?
  context: >-
    Tracking the account's activity across hosts in the alert window reveals whether
    the install is isolated or part of broader activity, such as the same account
    touching other IIS servers. If multiple hosts show related activity from this
    account, the scope of the operation is larger than one server.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \appcmd.exe
      - OriginalFileName: appcmd.exe
      selection_cli:
        CommandLine|contains|all:
        - install
        - module
        CommandLine|contains|windash: '-name:'
      filter_iis_setup:
        ParentImage: C:\Windows\System32\inetsrv\iissetup.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- question: Were other process-based persistence mechanisms installed on this server around the same time?
  context: >-
    Operators rarely rely on a single foothold. After installing an IIS module, they
    commonly stack backup persistence using scheduled tasks, services, registry Run
    keys, BITS jobs, or WMI. Multiple persistence installations in the same timeframe
    indicate intentional stacking rather than an isolated deployment action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Did other detections fire on this server in the hours before this alert?
  context: >-
    Persistence rarely happens in isolation. Earlier detections on the same server —
    web exploitation, reconnaissance, or credential access — may reveal the stages that
    preceded the module install and help reconstruct when the server was first reached.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
