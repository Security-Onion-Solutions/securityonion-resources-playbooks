name: File Download From Browser Process Via Inline URL
id: 9ebed994-cfb6-49d2-8957-30f2c19b4394
description: |
  Detects a browser process (brave.exe, chrome.exe, msedge.exe, opera.exe, or vivaldi.exe) launched
  from the command line with an inline http/https URL that ends in a potentially interesting file
  extension (.7z, .dat, .dll, .exe, .hta, .ps1, .psm1, .txt, .vbe, .vbs, .zip). The rule fires only
  when all three conditions match: a listed browser image AND a CommandLine containing "http" AND a
  CommandLine ending in one of the listed extensions. Passing a download URL directly on the browser
  command line is a living-off-the-land technique for retrieving arbitrary files under a trusted,
  signed browser binary; a harmless-looking extension can be appended to evade reputation checks and
  the browser can be started minimized to hide the activity from the user. Legitimate use is rare but
  possible (scripted browser launches, IT tooling). The investigation should confirm the URL and
  destination, determine whether the file was actually written to disk, and assess whether the parent
  chain and user make this an expected operation.
type: detection
detection_id: 94771a71-ba41-4b6e-a757-b531372eaab6
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line show a browser launched with an http/https URL ending in an interesting file extension?
  context: Confirm the alert is a true positive by reviewing the exact command line and image. The rule
    requires all three to be present together — a listed browser binary, the substring "http", and a
    command line ending in one of the flagged extensions (.7z, .dat, .dll, .exe, .hta, .ps1, .psm1, .txt,
    .vbe, .vbs, .zip). Read the full URL and the target file name before proceeding.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to launch a browser with a download URL on the command line?
  context: Browsers are normally started by user interaction or shortcuts, not with a file URL supplied as
    a command-line argument. Knowing whether this user role and host function routinely script browser
    launches or run automated download tooling is often the fastest way to separate a true positive from
    a routine operation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the full URL and target file name in the browser command line, and what does it resolve to?
  context: The full command line reveals the download destination, the host serving the file, and the real
    target extension. A doubled or appended extension (for example a payload renamed to end in .txt or .zip)
    and flags that start the browser minimized or headless both point to deliberate concealment. Decode the
    URL, identify the remote host, and note the on-disk file name the browser would write.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: http
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is the downloaded file still on disk for analysis?
  context: The command references a remote file that the browser would write locally. Checking whether that
    file still exists enables hash lookups, sandbox submission, or content review. Browser downloads land in
    the user's Downloads directory by default but may be redirected elsewhere by the command line.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did the browser process open a network connection to an external destination at the time of the alert?
  context: Ingress tool transfer begins with an outbound connection to the host serving the file. Correlating
    the browser's network connections in the alert window confirms the URL was actually contacted and surfaces
    the remote address and port, which can be compared against the URL seen on the command line. An external
    destination that does not match normal browsing or update traffic strengthens the case that this was a
    targeted retrieval.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Was the download successful? Check for file creation at the destination.
  context: A browser launched with a download URL does not guarantee the file arrived. Network errors, blocked
    URLs, or reputation controls may have stopped the transfer. Confirming file creation at the target path
    establishes whether the activity progressed past delivery into a usable on-disk payload.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What file did the browser download, and can you retrieve and analyze it by type?
  context: The browser was driven with an inline URL to fetch a file, which lands in Downloads (or a chosen
    path) — file-creation events carry no hash, and the browser does not run the payload itself, so analysis
    is by file type. Retrieve the file from the path below and inspect it — an .exe, hash and detonate it;
    a .dll, check its load event; a .ps1/.hta/.vbs, read the content; a .zip/.7z, extract and inspect. Hash
    it manually for a reputation lookup; if it was later executed, its hash is also on its process event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other file activity occurred in the download directory?
  context: A single download is often part of a larger staging operation — multiple files written to the same
    directory, or a retrieved archive that is then extracted into additional files. The drop path is
    informative — files written to broadly writable locations such as Public or ProgramData are more consistent with operator
    staging than the user's normal Downloads folder. Examining directory-level activity reveals the broader scope.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process spawned this browser and is that parent chain expected?
  context: Browsers started by a user are normally children of explorer.exe or a shortcut handler. A browser
    spawned by a script host (wscript.exe, cscript.exe, powershell.exe), an Office application, mshta.exe, or
    cmd.exe is a strong sign the launch was automated by something other than the user. Identify the parent and
    consider what spawned the parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did the browser spawn after the download?
  context: A browser used purely to fetch a file should not spawn interpreters or other executables. Children
    such as cmd.exe, powershell.exe, wscript.exe, or the downloaded binary itself indicate the retrieved file
    was executed or that the browser was abused to launch a command, moving the activity from delivery into
    execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run this browser with a URL on the command line?
  context: A browser binary that runs constantly through normal interactive use can still have never been
    invoked with a file URL as an argument. Low historical counts for this binary on this host help calibrate
    whether the command-line launch itself is unusual here.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even routine tooling can be abused. This query mirrors the rule's full selection scoped to this host,
    so the parent and user distribution reflects how this specific firing pattern — a browser launched with an
    inline download URL — has historically run here, not generic browser usage. A new parent process, an
    unexpected user, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith:
        - \brave.exe
        - \chrome.exe
        - \msedge.exe
        - \opera.exe
        - \vivaldi.exe
      selection_http:
        CommandLine|contains: http
      selection_extensions:
      - CommandLine|endswith:
        - .7z
        - .dat
        - .dll
        - .exe
        - .hta
        - .ps1
        - .psm1
        - .txt
        - .vbe
        - .vbs
        - .zip
      - CommandLine|contains:
        - .7z"
        - .dat"
        - .dll"
        - .hta"
        - .ps1"
        - .psm1"
        - .txt"
        - .vbe"
        - .vbs"
        - .zip"
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith:
        - \brave.exe
        - \chrome.exe
        - \msedge.exe
        - \opera.exe
        - \vivaldi.exe
      selection_http:
        CommandLine|contains: http
      selection_extensions:
      - CommandLine|endswith:
        - .7z
        - .dat
        - .dll
        - .exe
        - .hta
        - .ps1
        - .psm1
        - .txt
        - .vbe
        - .vbs
        - .zip
      - CommandLine|contains:
        - .7z"
        - .dat"
        - .dll"
        - .hta"
        - .ps1"
        - .psm1"
        - .txt"
        - .vbe"
        - .vbs"
        - .zip"
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith:
        - \brave.exe
        - \chrome.exe
        - \msedge.exe
        - \opera.exe
        - \vivaldi.exe
      selection_http:
        CommandLine|contains: http
      selection_extensions:
      - CommandLine|endswith:
        - .7z
        - .dat
        - .dll
        - .exe
        - .hta
        - .ps1
        - .psm1
        - .txt
        - .vbe
        - .vbs
        - .zip
      - CommandLine|contains:
        - .7z"
        - .dat"
        - .dll"
        - .hta"
        - .ps1"
        - .psm1"
        - .txt"
        - .vbe"
        - .vbs"
        - .zip"
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in the alert window reveals whether the download is an
    isolated action or part of broader movement across multiple endpoints. The same user driving similar
    activity on several hosts widens the potential scope.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith:
        - \brave.exe
        - \chrome.exe
        - \msedge.exe
        - \opera.exe
        - \vivaldi.exe
      selection_http:
        CommandLine|contains: http
      selection_extensions:
      - CommandLine|endswith:
        - .7z
        - .dat
        - .dll
        - .exe
        - .hta
        - .ps1
        - .psm1
        - .txt
        - .vbe
        - .vbs
        - .zip
      - CommandLine|contains:
        - .7z"
        - .dat"
        - .dll"
        - .hta"
        - .ps1"
        - .psm1"
        - .txt"
        - .vbe"
        - .vbs"
        - .zip"
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the surrounding process activity reveals what led to the
    browser launch and what followed it — reconnaissance, additional downloads, execution of the retrieved file,
    or persistence — and whether this event is one step in a larger sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
