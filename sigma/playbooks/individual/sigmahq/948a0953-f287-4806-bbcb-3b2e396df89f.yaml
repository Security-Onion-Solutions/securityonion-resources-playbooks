name: Unsigned Mfdetours.DLL Sideloading
id: 2ea50e71-461a-49da-bf68-c83c3fe34542
description: |
  Detects a module load where the loaded library ends in \mfdetours.dll AND is not the
  signed copy shipped in the Windows Kits SDK path (C:\Program Files (x86)\Windows Kits\10\bin\
  with a Valid signature). mftrace.exe, a legitimate Media Foundation trace tool from the Windows
  SDK, attaches to a target process and force-loads any DLL named mfdetours.dll from its current
  working directory. Placing an attacker-controlled, unsigned mfdetours.dll alongside the invocation
  directory yields search-order hijacking: the operator's code runs inside a signed, trusted host
  process. Legitimate loads come only from the SDK bin directory with a valid Microsoft signature;
  any other origin or an unsigned/invalid signature is the abuse. Investigate the loading process
  and its command line and current directory, the module's signature and hash, where and by whom the
  DLL was written to disk, whether the same module or tool appears elsewhere on the host or fleet,
  and whether parallel persistence was staged.
type: detection
detection_id: 948a0953-f287-4806-bbcb-3b2e396df89f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the loaded module match what this rule detects — path, signature, and loading process?
  context: >-
    Confirm the alert is a true positive before investing further. The rule fires when a module whose
    path ends in \mfdetours.dll is loaded AND that load is NOT the signed copy from the
    C:\Program Files (x86)\Windows Kits\10\bin\ SDK directory. Review the exact ImageLoaded path, its
    code-signature status, and the process that loaded it. A load from the current working directory of
    an execution, or an unsigned or invalid-signature module, is the sideload; a valid Microsoft-signed
    copy from the SDK bin path would have been filtered and should not appear here. DLL load events carry
    signing status and hash directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this user and host expected to run the Media Foundation trace tool that force-loads this module?
  context: >-
    mftrace.exe is a developer/debugging utility from the Windows SDK and is rare outside engineering
    or troubleshooting contexts. Knowing whether the account and host function are consistent with SDK
    tracing tools is often the fastest way to separate a developer or support session from an operator
    abusing the tool to sideload code. User attribution is present on roughly 94% of endpoint events;
    when it is a machine account or SYSTEM, pivot on the loading process instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: From what directory did this module load, and did the loading process pull it from its own working directory rather than the SDK bin path?
  context: >-
    The origin directory of the module is the whole story for a search-order hijack. A legitimate
    mfdetours.dll loads from C:\Program Files (x86)\Windows Kits\10\bin\ under a valid Microsoft
    signature. A load from the process's current working directory, a user-writable path such as
    %TEMP%, AppData, ProgramData, or Public, or any non-SDK location is the sideload signal. Compare the
    ImageLoaded path and signature of the alerting load against the expected SDK origin, and note any
    other unsigned or non-canonical modules the same process pulled in at load time.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: What is the signing status, hash, and reputation of the loaded mfdetours.dll?
  context: >-
    Module reputation distinguishes a stray but legitimate SDK component from a sideloaded payload. The
    rule already excludes the valid-signature SDK copy, so the alerting module is expected to be
    unsigned, expired, distrusted, or invalidly signed while carrying a Microsoft-style filename — a
    masquerading indicator. Take the Hashes value and check it against threat intelligence to surface
    known loaders; an unsigned module with the mfdetours.dll name and no valid Microsoft signature is
    the substitution this technique relies on. Alternate-data-stream and zone-identifier provenance for
    the file is not captured in this telemetry and is a manual or endpoint-console follow-up.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What did the loading process do — decode its command line and current working directory?
  context: >-
    The module load carries no command line, so pivot to the process that loaded it to read the full
    invocation. For an mftrace.exe abuse the current working directory is decisive: the tool force-loads
    mfdetours.dll from whatever directory it runs in, so a working directory under a user-writable or
    staging location shows where the operator planted the DLL. Decode any arguments — the target process
    mftrace attached to, trace configuration, or output paths — to understand the full operation. This
    query returns executions of the loading binary on this host in the surrounding window.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned the loading process, and is that parent chain expected?
  context: >-
    The parent of the loading process reveals how the sideload was launched. A trace tool started
    interactively from explorer.exe or a console during troubleshooting is different from one launched
    by a script host such as wscript.exe or mshta.exe, an Office application, a browser child, or an
    unsigned binary — parents that point to programmatic staging rather than a deliberate developer
    action. The parent-process lookup is unique per instance, so a longer lookback is intentional for
    long-running shells or sessions.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: When was mfdetours.dll written to disk on this host, and which process wrote it?
  context: >-
    A search-order hijack requires the attacker-controlled DLL to be placed in the directory the tool
    loads from, and that write frequently precedes the load by seconds to days. Finding the file-write
    event for \mfdetours.dll surfaces the drop: which process created it, under what account, and at
    what path. A write into a user-writable or staging directory by a script host, archive utility,
    browser child, or unsigned binary is the phantom-DLL insertion step, and its timestamp relative to
    the load establishes the correlation interval between staging and execution. Whether the file is
    still present on disk for collection is an endpoint-console or manual follow-up.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: '\mfdetours.dll'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: Did the loading process write files to disk that are still available for analysis?
  context: >-
    Beyond the sideloaded module itself, the loading process or its children may have written decoded
    payloads, output, or secondary tooling to disk. Correlating file writes to the alerting process and
    its direct children shows what artifacts remain for hash lookup, sandbox submission, or content
    review. Files still present enable deeper analysis; files already removed indicate cleanup around the
    operation.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has mfdetours.dll been loaded on this host before, and under which processes?
  context: >-
    A first-time module load is a stronger anomaly than a recurring one. If mfdetours.dll has been
    loaded repeatedly on this host by the same tool from the SDK path, the current load may be routine
    developer activity; if this is the first occurrence, or prior loads came from entirely different
    processes or paths, the current load stands out. Historical loading processes also reveal whether
    this DLL name has ever legitimately appeared in this environment.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Does this host normally run the Media Foundation trace tool?
  context: >-
    A binary that has never run on a host is more suspicious than one that runs regularly. mftrace.exe
    is an SDK debugging utility with no routine role on most endpoints, so zero or very low historical
    counts indicate first-time or rare execution consistent with the tool being brought in specifically
    to sideload a module. Recurring use by a known engineering account points instead to legitimate
    tracing. Applications expected to load modules from non-standard directories should be reflected in
    this baseline.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Is mfdetours.dll being loaded on other hosts in the environment, and by what processes?
  context: >-
    Cross-host correlation surfaces the scope of the activity. The same module name loaded on a single
    host suggests a localized incident; the same load across multiple hosts indicates a repeated
    technique or shared tooling distributed through the environment. Pay attention to the variety of
    loading processes and paths: a single expected loader from the SDK path is benign, while the same
    module loaded by unexpected processes from non-canonical paths on other hosts points to multi-host
    operator activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Were DLL-search-order or image-hijack registry keys modified on this host in the same window?
  context: >-
    DLL hijacking is often backed by registry-based load redirection so the payload survives a reboot or
    loads into other processes. Modifications to KnownDLLs, AppInit_DLLs, Image File Execution Options,
    or App Paths near the sideload indicate the operator configured a parallel or durable redirection
    mechanism rather than relying only on a one-time current-directory load. Clustering these registry
    writes on the host in the surrounding window reveals whether such redirection was staged and which
    process made the change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_dll_redirect:
        TargetObject|contains:
          - '\Session Manager\KnownDLLs'
          - '\Windows\AppInit_DLLs'
          - '\Image File Execution Options\'
          - '\CurrentVersion\App Paths\'
      condition: selection and selection_dll_redirect
    fields:
      - TargetObject
      - Details
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity in a tight window around the load
    surfaces what led up to the sideload and what ran immediately after — reconnaissance, the tool that
    staged the DLL, or follow-on execution inside the hijacked host process. Novel parent-child pairs
    stand out at low counts against high-count routine telemetry, which is what points to the operator's
    actions.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — reconnaissance, execution of scripting tools, credential
    access, or defense tampering — may reveal the stages that preceded the sideload and help reconstruct
    the timeline. DLL search-order hijacking is a means to run code inside a trusted process, so prior
    alerts help place this load within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Establishing execution inside a trusted process is frequently paired with a durable foothold.
    Scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions created by
    schtasks.exe, sc.exe, reg.exe, bitsadmin.exe, or wmic.exe near the sideload indicate the operator
    used the hijacked execution to install persistence rather than acting in isolation.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely — dropping an executable or script
    into a Startup folder or a path referenced by a registry Run key achieves persistence without
    running schtasks, sc, or reg. File writes to these locations near the sideload indicate the operator
    established a parallel persistence mechanism on disk alongside the module hijack.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Does the user or an administrator recall running the trace tool or staging this module?
  context: >-
    Direct confirmation from the account owner is often the fastest way to resolve the alert. If a
    developer or support engineer was tracing Media Foundation activity and legitimately ran the tool
    from a directory that happened to contain the SDK component, that closes it. If no one recalls
    running the tool or placing the module, the account may be compromised or the activity may be
    automated tooling, and the investigation should continue into the loading process, the DLL drop, and
    any follow-on execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
