name: Explorer Process Tree Break
id: d26f0f4a-20f6-4068-81b7-cbb69af3a2ac
description: |
  Detects explorer.exe used to deliberately break the process tree, EITHER by invoking the Explorer COM factory CLSID (/factory,{75dff2b7-6936-4c06-a8bb-676a7b00b24b}) OR by launching with the ' /root,' switch. Both forms cause a new explorer instance to spawn the intended process, so the payload appears as a child of explorer.exe rather than of the process that actually launched it — a masquerading and parent-spoofing trick that hides the true lineage and makes attacker activity look like ordinary shell behavior. Because the visible parent is now misleading, the investigation centers on recovering the real process that ran this explorer command, decoding what was launched, and following what the new explorer instance spawned, while confirming the explorer binary itself is genuine.
type: detection
detection_id: 949f1ffb-6e85-4f00-ae1e-c3c5b190d605
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-03
questions:
- question: Does this match the rule — explorer.exe invoked with the factory CLSID or the /root switch?
  context: Confirm the alert before investing time. The rule fires when a command line EITHER contains the Explorer COM factory CLSID (/factory,{75dff2b7-6936-4c06-a8bb-676a7b00b24b}) OR references explorer.exe together with a ' /root,' switch. Read the full command line and note which form fired — both are process-tree-break techniques, but the factory CLSID and the /root variant arrive through slightly different launch paths and tooling.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What did this explorer command launch, and how was the tree broken?
  context: Decode the full command line. The /factory CLSID spins up the Explorer COM server so that a subsequently launched process is reparented under a fresh explorer; the ' /root,' switch opens a new explorer rooted at a given path or object. Identify what was actually launched or targeted — a path, a file, or a follow-on command — because that is the payload whose true parent the technique is hiding.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is this user and host expected to launch explorer in a way that breaks the process tree?
  context: The factory and /root forms are rarely used by ordinary user activity, though some software and shell extensions do invoke them. Knowing whether this account and host run software that legitimately uses these explorer launch paths helps separate a benign shell extension from a deliberate attempt to disguise a payload's lineage.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What process actually ran this explorer command — the real parent the tree-break hides?
  context: 'Which lineage matters depends on which rule branch fired. If the command is the
    "/factory,{75dff2b7...} -Embedding" form, this is a DCOM-activated explorer instance whose
    parent is svchost.exe (DcomLaunch) BY CONSTRUCTION — not the concealed origin; the true origin
    must be sought via the sibling that requested the launch: a concurrent "explorer.exe /root,..."
    invocation on the same host, WMI Win32_Process.Create / wmiprvse.exe activity, or the precursor
    detections (Q13). If the command is the typed "/root,..." form, then its parent IS the genuine
    origin the technique conceals — a macro-spawned shell (winword, excel), a script host, a download
    cradle, or a loader from a user-writable path is the real origin; an ordinary interactive shell
    points to a more benign cause.'
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What did this new explorer instance spawn afterward?
  context: 'The point of the tree-break is to launch a payload that appears to descend from explorer.
    For the "/factory ... -Embedding" alert the children of THIS instance are that payload — a new
    interpreter, a dropped binary, reconnaissance, or a download — now wearing explorer as a disguise,
    and listing them recovers what the technique was protecting. For the typed "/root,..." alert the
    alerting process exits after handing off to a sibling factory explorer, so this query (children of
    the alerting process) can return nothing even when a payload ran — in that case find the concurrent
    "explorer.exe /factory,{75dff2b7...} -Embedding" instance on the same host and list ITS children
    instead.'
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this the genuine signed explorer.exe, by path and metadata?
  context: The technique relies on a real explorer.exe, but an attacker could also run a planted copy to compound the disguise. Confirm the binary is the legitimate Windows Explorer — running from C:\Windows\explorer.exe, with the expected original filename and signature — rather than a renamed or relocated copy. A non-standard path or mismatched metadata turns this from a lineage trick into a binary masquerade as well.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: When this host has previously broken the process tree this way, what parents and users drove it, and does the current alert fit?
  context: Even this technique can have a benign source on a given host, such as a particular shell extension or software package. This mirrors the rule's pattern scoped to this host, so the parent/user distribution reflects how these explorer launches have historically run here. A new parent process, an unexpected user, or a first-time appearance against that baseline is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_factory:
        CommandLine|contains: /factory,{75dff2b7-6936-4c06-a8bb-676a7b00b24b}
      selection_root:
        CommandLine|contains: explorer.exe
        CommandLine|contains|windash: ' /root,'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_factory:
        CommandLine|contains: /factory,{75dff2b7-6936-4c06-a8bb-676a7b00b24b}
      selection_root:
        CommandLine|contains: explorer.exe
        CommandLine|contains|windash: ' /root,'
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_factory:
        CommandLine|contains: /factory,{75dff2b7-6936-4c06-a8bb-676a7b00b24b}
      selection_root:
        CommandLine|contains: explorer.exe
        CommandLine|contains|windash: ' /root,'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in a tight window reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity on other hosts in the same window, the scope is larger than a single machine. This pivot is meaningful only when a real user account fired the alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_factory:
        CommandLine|contains: /factory,{75dff2b7-6936-4c06-a8bb-676a7b00b24b}
      selection_root:
        CommandLine|contains: explorer.exe
        CommandLine|contains|windash: ' /root,'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts broken the process tree via explorer in the past week, and does the distribution look like automation or one-off activity?
  context: This mirrors the rule's pattern with no host scope, giving a fleet-wide count of where this explorer technique fired. Many hosts at once points to a software package or a payload deployed widely that uses these launch paths; one host or a small unrelated set points to manual or targeted activity. Use the distribution to judge how unusual this single alert is.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_factory:
        CommandLine|contains: /factory,{75dff2b7-6936-4c06-a8bb-676a7b00b24b}
      selection_root:
        CommandLine|contains: explorer.exe
        CommandLine|contains|windash: ' /root,'
      condition: 1 of selection_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — a macro-spawned shell, a download cradle, defense tampering, or reconnaissance — may reveal the real origin the tree-break is hiding and help reconstruct the timeline. The technique exists to obscure lineage, so the surrounding alerts often tell the story the process tree no longer can.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
