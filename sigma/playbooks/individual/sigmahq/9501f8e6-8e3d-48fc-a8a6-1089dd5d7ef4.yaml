name: Network Connection Initiated To DevTunnels Domain
id: d503cff5-f567-4eb2-ba61-7600c023d819
description: |
  Detects an outbound network connection initiated by a process to a Dev Tunnels host (a
  DestinationHostname ending in .devtunnels.ms). Dev Tunnels is a developer tunneling service that
  exposes a local service to the internet over an authenticated outbound-only connection to
  Azure-hosted infrastructure; only outbound connectivity is required, which is why it is attractive
  for bypassing perimeter controls. The rule fires when a connection is initiated (egress) AND the
  destination host ends in .devtunnels.ms. Legitimate developer use produces the same connection, so
  the investigation determines which process opened the tunnel, whether tunneling is sanctioned on
  this host, what internal service or port is being exposed, whether the tunnel was made anonymously
  reachable, and whether the same activity appears on other hosts. Because destination hostname is
  sparsely populated on endpoint network telemetry, domain-side questions pivot to DNS lookups for
  .devtunnels.ms, while connection-side questions anchor on the destination address.
type: detection
detection_id: 9501f8e6-8e3d-48fc-a8a6-1089dd5d7ef4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Was this outbound connection initiated to a .devtunnels.ms host, and which process opened it?
  context: >-
    Confirm the alert before investing time. The rule fires when a connection is initiated (egress)
    AND the destination host ends in .devtunnels.ms. Review the destination address and port, the
    direction, and the initiating process on the triggering event. Destination hostname is sparsely
    populated on endpoint network telemetry, so the .devtunnels.ms name may not appear on the
    connection record itself; anchor on the destination address here and confirm the domain through
    the DNS lookup. Endpoint-originated connections carry the initiating process, while
    network-level telemetry may record the connection with no process fields.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - Initiated
- question: Is this user and host expected to use a developer tunneling service?
  context: >-
    Dev Tunnels is a developer tool; a connection from a non-developer host or an account with no
    development role is harder to explain than the same connection from an engineering workstation.
    Knowing whether the account and host function are consistent with legitimate tunneling is often
    the fastest way to separate sanctioned developer use from a tunnel stood up by an intruder for
    remote access. If the process context is missing because the connection came from network-level
    telemetry, resolve the host role from asset inventory.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What Dev Tunnels endpoint and port did this host connect to?
  context: >-
    A Dev Tunnels web-forwarding host takes the form <tunnelid>-<port>.devtunnels.ms, so the
    specific subdomain and port reveal the tunnel identity and which local service port is being
    forwarded. Review the destination host and port on the connection, and correlate with passive
    DNS and threat intelligence. The forwarded port (for example 3389 for RDP) indicates what
    internal service the tunnel exposes.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - DestinationPort
- question: Did this host resolve a .devtunnels.ms domain, and which process requested it?
  context: >-
    Destination hostname is sparsely recorded on endpoint network events, so the tunnel domain is
    most reliably confirmed through the DNS lookup that preceded the connection. A resolution for a
    .devtunnels.ms host names the tunnel subdomain and the process that requested it, which
    identifies the tunneling client even when the connection record carries no hostname. Sequential
    lookups to .devtunnels.ms during a short window are consistent with tunnel setup.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|endswith: '.devtunnels.ms'
      condition: selection
    fields:
      - QueryName
      - Image
- question: What exactly did the tunneling process do? Decode its command line.
  context: >-
    The full command line of the process that opened the connection reveals how the tunnel was
    configured. A developer tunneling client typically hosts a tunnel and forwards a specific local
    port; decode the host, port-create, and forwarding arguments to establish what internal service
    is exposed and how. If the connecting process is a browser or a scripting host rather than a
    tunneling client, that reframes the activity toward web-service access or a scripted tunnel.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is this tunneling tool authorized for use on this host?
  context: >-
    Organizations typically sanction a limited set of tunneling and remote-access tools for specific
    engineering purposes. A developer tunneling client establishing an outbound tunnel on a host with
    no approved use case may represent shadow IT or an intruder exposing an internal service, and
    should be checked against the approved-software list regardless of the tool's reputation. Confirm
    whether developer tunneling is permitted on this host and by this account.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there an approved development or support use case explaining this tunnel?
  context: >-
    Legitimate tunneling usually correlates with an active development task, a scheduled test, or a
    support request. If no ticket, change record, or documented engineering purpose accounts for a
    tunnel exposing a local service to the internet, the tunnel may have been established by an
    intruder for persistent remote access or by a user circumventing perimeter controls. The command
    line shows the user and configuration to match against support records.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What external endpoints and ports did the tunneling process connect to?
  context: >-
    A tunneling client maintains outbound connections to the tunnel service, and the destination and
    port profile shows what is being carried and where. Connections to the Azure-hosted Dev Tunnels
    service are expected for the tool itself; the port profile and any additional destinations
    indicate which local service is forwarded and whether traffic flows to endpoints beyond the
    tunnel provider. A large asymmetric outbound-to-inbound ratio is consistent with data leaving
    through the tunnel.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: Was the tunnel configured for anonymous or unauthenticated access?
  context: >-
    Hosting or connecting to a tunnel normally requires authentication with the account that created
    it, but an anonymous-access flag can make a tunnel reachable without any credential. Decode the
    tunneling command line for a flag that allows anonymous access; an anonymously reachable tunnel
    removes the authentication control and lets arbitrary external clients reach the exposed internal
    service, which raises the weight of the alert considerably. Confirm whether the tunnel was hosted
    with anonymous access enabled.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned the tunneling process, and is that parent chain expected?
  context: >-
    The parent process reveals how the tunnel was launched. An interactive launch from a shell or
    explorer under a developer account is consistent with sanctioned use, while a launch from a
    scripting host, an Office application, or an unsigned binary points to the tunnel being staged
    programmatically as part of an intrusion. Walking up the parent chain distinguishes a hands-on
    developer action from an automated deployment.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What files or data did the tunneling process access or stage on this host?
  context: >-
    A tunnel can carry data out of the environment, so files read, written, or staged by the
    connecting process indicate whether sensitive data was being moved. Look for files the process
    touched in sensitive directories or bulk collections that could be transferred through the
    tunnel. If the process only forwards a live service such as remote desktop, file-staging may be
    absent and the exposure is interactive access rather than bulk data theft.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: Has this host resolved or connected to Dev Tunnels domains before?
  context: >-
    A first-time appearance of .devtunnels.ms on a host carries more weight than routine developer
    traffic. Aggregating prior DNS lookups for the domain over a long window establishes whether the
    service is used regularly here or is new to this host. Zero or very low historical counts
    indicate first-time use; a steady history points to an established developer workflow.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|endswith: '.devtunnels.ms'
      condition: selection
    fields:
      - Image
- question: Does this host normally run this tunneling process?
  context: >-
    A tunneling client that has never run on a host is more suspicious than one an engineer uses
    routinely. Aggregating historical executions of the same binary over a long window shows whether
    this is established behavior or a first-time appearance. Zero or very low counts indicate the
    tool was newly introduced, which fits a tunnel stood up during an intrusion.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: What other Dev Tunnels lookups occurred on this host around the alert?
  context: >-
    A single tunnel connection may be one of several. Surfacing other .devtunnels.ms resolutions on
    this host in the surrounding window reveals whether multiple tunnels or ports were set up and
    which processes requested them. Multiple distinct tunnel subdomains in a short span are
    consistent with a setup sequence or repeated forwarding of different services.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|endswith: '.devtunnels.ms'
      condition: selection
    fields:
      - QueryName
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Tunnel setup rarely happens in isolation. Aggregating process activity in a tight window around
    the connection surfaces what led up to the tunnel and what ran once it was established, which is
    where correlation between process execution and the outbound connection becomes visible. Novel
    parent-child pairs stand out at low counts against high-count routine telemetry and point to the
    tool that staged the tunnel and any follow-on actions.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Do other hosts in the environment resolve Dev Tunnels domains?
  context: >-
    If only one host reaches .devtunnels.ms, the activity is isolated and more likely targeted; if
    many hosts do, it may reflect an accepted engineering practice or a widespread deployment.
    Aggregating .devtunnels.ms resolutions across hosts, without a host filter, shows the
    distribution and which processes are involved, which separates a single hands-on tunnel from
    routine use across the environment.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        QueryName|endswith: '.devtunnels.ms'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, credential access, or defense tampering -
    may reveal the stages that preceded the tunnel and help reconstruct the timeline. A tunnel is
    often a means to maintain access after an initial foothold, so prior alerts help place this
    connection within a larger sequence rather than treating it as a standalone event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
