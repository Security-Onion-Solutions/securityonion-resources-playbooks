name: HackTool - RedMimicry Winnti Playbook Execution
id: 165d875f-567b-4127-a40a-92cbc265d7e0
description: |
  Detects rundll32.exe or cmd.exe running with a command line that references one of three artifact names
  hardcoded into RedMimicry, a publicly available adversary-emulation utility that replays a documented
  intrusion playbook so defenders can test their detection coverage. The three names are gthread-3.6.dll,
  sigcmm-2.4.dll, and \Windows\Temp\tmp.bat; the rundll32 path executes an exported entry point from a DLL
  staged on disk (system binary proxy execution, T1218.011), while the cmd.exe path runs a batch file staged
  under \Windows\Temp (T1059.003). Because the utility is free and anyone can run it, two explanations
  compete: a sanctioned detection-validation or red team exercise, which is the single fastest way to close
  this alert, or an operator using the same public tooling for real. Confirm whether an engagement is in
  flight, identify which stage fired, and check whether the pattern appears across a planned set of hosts in
  a tight window or on one host acting alone.
type: detection
detection_id: 95022b85-ff2a-49fa-939a-d7b8f56eeb9b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Does the alerting process match the rule's criteria — rundll32.exe or cmd.exe, with gthread-3.6.dll,
    sigcmm-2.4.dll, or \Windows\Temp\tmp.bat in the command line?
  context: >-
    The rule requires both conditions together: the image ends in rundll32.exe or cmd.exe, AND the command
    line contains at least one of the three hardcoded artifact names. Note which of the three matched — a
    gthread-3.6.dll or sigcmm-2.4.dll reference points at the DLL entry-point stage, while
    \Windows\Temp\tmp.bat points at the batch stage, and the two lead to different follow-up evidence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this execution part of an authorized breach-emulation exercise, penetration test, or red team engagement?
  context: >-
    This rule fires on the artifact names of a public adversary-emulation utility whose purpose is to let a
    security team replay a known intrusion playbook against their own estate and measure what their detections
    catch. A deliberate exercise is therefore a leading explanation, not an afterthought. Check active
    engagement scope, the host list, and the window before spending further analysis time; an authorized
    exercise covering this host at this time resolves the alert outright.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: Is this user and host expected to run offensive or emulation tooling?
  context: >-
    Emulation tooling is normally run by a small set of people from a small set of staging or test systems.
    A security-team account on a lab or jump host is a different starting point than a standard workstation
    account or a service principal producing the same command line. Establish which case applies before
    building a timeline.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Which stage of the playbook was invoked — the rundll32 DLL entry point or the batch file execution?
  context: >-
    Read the full command line and identify the stage. A rundll32.exe invocation naming gthread-3.6.dll or
    sigcmm-2.4.dll also names the exported function or ordinal being called and the path the DLL was staged
    at, which tells you what code ran and from where. A cmd.exe invocation naming \Windows\Temp\tmp.bat means
    a batch file drove the step, and the batch content is the operational detail — retrieve it if it still
    exists. The stage determines which artifacts are worth collecting next.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: What files did the alerting process write on this host after it ran?
  context: >-
    The stages of this playbook stage their own artifacts — a DLL written before rundll32 maps it, a batch
    file under \Windows\Temp before cmd.exe runs it, and any output the executed code leaves behind. Files
    written by the alerting binary in the hour after execution show what the step produced and give you paths
    to collect, even after the process has exited.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: Is the alerting process the genuine system binary at its expected path, or a copy running from elsewhere?
  context: >-
    rundll32.exe and cmd.exe ship in \Windows\System32 and \Windows\SysWOW64. Either binary executing from a
    user-writable directory, a staging folder, or under a different filename means the caller supplied its own
    copy of the loader rather than using the installed one, which changes both the attribution and the
    containment step. Compare the image path against the expected system paths, and compare the working
    directory against where the named DLL or batch file was staged.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
        - gthread-3.6.dll
        - \Windows\Temp\tmp.bat
        - sigcmm-2.4.dll
      condition: selection
    fields:
      - Image
      - CurrentDirectory
  answer_sources:
  - process_creation
- question: Were gthread-3.6.dll, sigcmm-2.4.dll, or tmp.bat written to this host, and which process wrote them?
  context: >-
    Executing a DLL through rundll32 or a batch file through cmd.exe requires the file to exist on disk first.
    The write event names the process that staged it and the time it landed, which separates a local drop by
    an interactive operator or emulation harness from a file delivered by a remote-execution service or a
    download utility. A staging write with no corresponding execution also tells you the step was prepared but
    did not complete.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
        - gthread-3.6.dll
        - sigcmm-2.4.dll
        - \Windows\Temp\tmp.bat
      condition: selection
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
  answer_sources:
  - file_event
  - process_creation
- question: Did this host actually map gthread-3.6.dll or sigcmm-2.4.dll into a process, and is the loaded module signed?
  context: >-
    A DLL name on a rundll32 command line records the request, not the result — the map can fail if the file
    is missing or the architecture is wrong. The module-load event confirms the code was mapped, names the
    process that mapped it, and carries the signature status and hash of what was loaded. An unsigned module
    at a staged path is the direct evidence that native-API code from an operator-supplied DLL executed; the
    hash is what you submit for reputation checks and hunt with across the estate.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|contains:
        - gthread-3.6.dll
        - sigcmm-2.4.dll
      condition: selection
    fields:
      - ImageLoaded
      - Image
      - Signed
      - Signature
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: Did the alerting binary open network connections from this host around the time of the alert?
  context: >-
    Code executed through rundll32 runs inside a signed Microsoft process, so any egress it opens is attributed
    to that process rather than to an unfamiliar binary. Connections to destinations outside the environment's
    normal range in the alert window indicate the executed step reached out rather than acting locally. Anchor
    on the destination address and port; resolved hostnames are recorded as separate lookup events, so pivot to
    DNS activity from this host if you need the domain behind an address.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
- question: What process spawned the alerting rundll32.exe or cmd.exe, and is that parent chain expected?
  context: >-
    The parent shows how the step was launched. An interactive shell, a remote-execution service, a scheduled
    task, or an emulation harness each imply a different operator model, and a parent that is itself unexpected
    (a script host, an Office application, a service account process) moves the investigation up the tree. The
    parent's own command line often names the orchestration that drove the sequence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: >-
    When this host has previously produced the rule's pattern, what parents and users drove that activity, and
    does the current alert fit that history?
  context: >-
    The query mirrors the rule's selection scoped to this host, so the parent and user distribution reflects
    how this specific pattern has run here before — not generic rundll32.exe or cmd.exe usage. Repeat activity
    driven by the same test account and harness parent supports a recurring validation exercise. A first
    occurrence, or the same pattern arriving under a new parent or a new account, is the deviation to chase.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|endswith:
        - \rundll32.exe
        - \cmd.exe
        CommandLine|contains:
        - gthread-3.6.dll
        - \Windows\Temp\tmp.bat
        - sigcmm-2.4.dll
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: >-
    Have other hosts produced this pattern in the past week, and does the cross-host distribution look like a
    planned exercise or isolated activity?
  context: >-
    The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this
    exact pattern. This distribution is diagnostic here — a detection-validation exercise normally touches a
    defined set of hosts within a tight window on a planned schedule, which reads very differently from one
    host producing the pattern alone or from a set of unrelated hosts drifting across days. Use the host list
    and the timing together to weigh the authorized-exercise explanation.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|endswith:
        - \rundll32.exe
        - \cmd.exe
        CommandLine|contains:
        - gthread-3.6.dll
        - \Windows\Temp\tmp.bat
        - sigcmm-2.4.dll
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, so the result is their 90-day history of this
    exact pattern, grouped by host. An account that runs this regularly across test systems is consistent with
    a defensive testing role; an account that has never produced it, or one whose role has nothing to do with
    security testing, is the case to escalate. Weigh the count against what the account is provisioned to do.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|endswith:
        - \rundll32.exe
        - \cmd.exe
        CommandLine|contains:
        - gthread-3.6.dll
        - \Windows\Temp\tmp.bat
        - sigcmm-2.4.dll
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: >-
    Has this parent process historically driven the rule's pattern here or across the environment, or is the
    parent new for this activity?
  context: >-
    When the alert fires under SYSTEM or a machine account, user identity attributes nothing and the launch
    mechanism is the meaningful pivot. The query mirrors the rule's selection scoped to the alerting parent
    process, so the result is the 90-day history of this parent driving this pattern, grouped by host. A parent
    that already accounts for many prior events is established automation; a parent that is new for this
    pattern is the deviation worth chasing.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|endswith:
        - \rundll32.exe
        - \cmd.exe
        CommandLine|contains:
        - gthread-3.6.dll
        - \Windows\Temp\tmp.bat
        - sigcmm-2.4.dll
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the account's activity across all hosts in the surrounding hour shows whether the step was
    isolated or one item in a sequence, and whether the same account was working on several systems at once —
    which is what a scripted run across a target set looks like. If the alert fired under a service principal,
    this returns routine agent activity and the parent-scoped view is the meaningful answer instead.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did this same parent-driven pattern fire on other hosts in the same window, or was it isolated to this host?
  context: >-
    Under a service principal, a user-scoped network view returns agent telemetry from every host and answers
    nothing. The query mirrors the rule's selection scoped to the alerting parent process, fleet-wide, in the
    alert window. Several hosts in the same window points to scheduled or pushed execution across a target set,
    which is consistent with a planned exercise; a single host points to a host-local trigger.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|endswith:
        - \rundll32.exe
        - \cmd.exe
        CommandLine|contains:
        - gthread-3.6.dll
        - \Windows\Temp\tmp.bat
        - sigcmm-2.4.dll
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating process activity by image and parent over the surrounding window collapses repetitive agent
    telemetry into single high-count rows and leaves novel parent-child pairs standing out at low counts. Look
    for what the alerting process spawned, what ran alongside it, and whether discovery, credential access, or
    persistence steps bracket it — a replayed playbook runs its stages back to back, and so does a real
    operator.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host help place this event in a sequence. A run of detections firing in a
    compressed window across several technique areas is what a scripted replay of a playbook produces, and it
    is also what a real operator working through stages produces — the alert timeline alone does not separate
    them, but it does tell you how many stages to account for.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
