name: Potential COLDSTEEL RAT Windows User Creation
id: a53c1ad7-1ae0-447d-aab8-604ebb984809
description: |
  Detects a registry write under HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList
  that registers a new local user profile whose ProfileImagePath data contains the string
  ANONYMOUS or _DomainUser_, a profile-naming pattern seen with some COLDSTEEL RAT variants.
  The ProfileList key maps each account SID to its on-disk profile directory; the operating
  system writes a new subkey here the first time a genuine account logs on, so a profile entry
  for an unrecognized username outside normal provisioning registers a rogue local account that
  Windows then treats as valid. COLDSTEEL runs via svchost.exe and rundll32.exe and persists as a
  Windows service, so investigate which process wrote the entry and what launched it, what account
  name and path were registered, whether the account was subsequently used or logged on, whether
  service or other persistence keys were modified in the same session, and whether the same
  registration appears on other hosts.
type: detection
detection_id: 95214813-4c7a-4a50-921b-ee5c538e1d16
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting write register a ProfileList entry whose ProfileImagePath contains ANONYMOUS or _DomainUser_?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when
    a value whose path sits under ...\CurrentVersion\ProfileList\S-1-5-21- and ends in
    \ProfileImagePath is written AND the value data contains the username fragment ANONYMOUS or
    _DomainUser_. Review the exact TargetObject and Details on the triggering event to confirm both
    conditions hold. The operating system registers a ProfileList subkey when a real account first
    logs on, so an entry carrying one of these username fragments is the account-registration step
    of the implant rather than routine provisioning.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this host and account expected to register new local user profiles?
  context: >-
    New ProfileList entries are normally written by the system when a genuine user first logs on,
    or by a provisioning process, and effectively never by an interactive account editing the key
    directly. Knowing whether the writing account and host function match any sanctioned account
    provisioning is the fastest way to separate an administrative or imaging action from a rogue
    account created by an implant. User attribution is present on roughly 94% of endpoint registry
    events; when it is a machine account or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which ProfileList SID and ProfileImagePath value were written, and why is this an account-persistence location?
  context: >-
    The ProfileList key maps each account SID to its on-disk profile path; writing a new
    S-1-5-21 subkey with a ProfileImagePath registers a local account so Windows treats it as valid
    and will load its profile on logon. Confirming the exact SID, path, and writing process
    establishes that this is a rogue account registration rather than an ordinary logon-provisioned
    profile, and sets up decoding the registered username. A registered account gives an operator a
    durable local logon that survives reboot.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What profile path and username were registered in this ProfileList value?
  context: >-
    The Details field holds the ProfileImagePath the entry points at, typically a path under
    C:\Users that carries the account name the implant registered. Decode it to recover the username
    and note whether it masquerades as a system or service-style name, whether the profile directory
    sits in the standard C:\Users location or somewhere unusual, and whether the fragment ANONYMOUS
    or _DomainUser_ is present. Details is populated on roughly 79% of registry modifications and
    should be present for this string value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Is this a first-time rogue account registration, and does the ProfileList entry stay in place?
  context: >-
    ProfileList is a known account-registration and hiding location; an entry that never existed
    before and remains registered gives the account durable presence across reboots. Registry key
    or value deletions are not observable in this telemetry, so durability is judged from the key's
    re-modification history over the following window rather than from a delete event. Compare the
    Details values written over the range to see whether the entry was left in place, altered, or
    re-pointed, and correlate with whether the account was actually used.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote this ProfileList entry, and what launched that process?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to
    read its Image, full command, and parent. COLDSTEEL runs via svchost.exe and uses rundll32.exe
    to hinder detection, so a ProfileList write coming from svchost.exe, rundll32.exe, or an
    unexpected binary launched from an unusual parent points to programmatic account creation rather
    than an administrator using standard account-management tooling. The parent chain distinguishes
    a scripted registration from a deliberate console action.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Has this ProfileList key been modified before on this host?
  context: >-
    A ProfileList subkey for a given SID is normally written once, when the account is first
    provisioned, so a history with no prior writes makes this a newly introduced account and raises
    its weight. A history of periodic writes to the same subkey points instead to an existing
    account or a management process. Compare the historical Details values to see whether this
    profile path was set before or whether it is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: After this profile was registered, did the new account log on or run any processes on this host?
  context: >-
    An account persistence is only useful once the account is actually used, so check for process
    execution under the newly registered username in the hours after the write. COLDSTEEL
    supports interactive command execution by creating a new cmd.exe process communicated with over
    a network connection, so any row here is a process launched under the rogue account — look for
    cmd.exe or other interactive shells. The query is anchored on the ANONYMOUS and _DomainUser_
    username fragments the rule matches; a zero means the account has not yet been used to run
    processes, in which case check Security-channel logons for the registered name separately.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|contains:
          - 'ANONYMOUS'
          - '_DomainUser_'
      condition: selection
    fields:
      - User
      - Image
      - CommandLine
- question: What other registry modifications were made on this host in the same window?
  context: >-
    COLDSTEEL also persists as a Windows service, writing service-configuration keys under the
    Svchost hive in the same activity. Clustering the registry writes on this host in a short window
    around the alert reveals whether service persistence, additional account edits, or
    defense-evasion changes landed in the same session and which process made them. The triggering
    ProfileList key appears in the results; the signal is what else was modified and by which
    process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Was this same ProfileList value registered on other hosts in the environment?
  context: >-
    The same rogue profile entry appearing across multiple hosts suggests the implant spreading or a
    scripted rollout; the same registration confined to one host suggests targeted access. Compare
    the Details values across hosts to see whether they register the same username and whether the
    writing process is consistent, which separates a single hands-on operation from repeated use of
    the technique across the environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Account registration by an implant rarely happens in isolation. Aggregating process activity in
    a tight window around the alert surfaces what led up to the write and what ran immediately after.
    COLDSTEEL uses rundll32.exe and spawns cmd.exe over its command channel, so novel parent-child
    pairs standing out at low counts against routine telemetry point to the tooling that staged the
    account and any follow-on interactive activity.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - exploitation of a public-facing application, service
    creation, or defense evasion - may reveal the stages that preceded the account registration and
    help reconstruct the timeline. COLDSTEEL commonly gains initial access by exploiting a
    public-facing application, so prior alerts help place this account creation within a larger
    intrusion sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host in the same window?
  context: >-
    An implant that registers a rogue account frequently stacks other footholds. Scheduled tasks,
    services, registry Run keys, BITS jobs, or WMI subscriptions created by schtasks.exe, sc.exe,
    reg.exe, bitsadmin.exe, or wmic.exe near the account registration indicate the operator
    installing backup persistence rather than a single isolated change. COLDSTEEL establishes a
    Windows service for persistence, so service creation in this window is directly relevant.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely - dropping an executable or
    script into a Startup folder or a path referenced by a registry Run key achieves persistence
    without invoking schtasks, sc, or reg. File writes to these locations near the account
    registration indicate the implant established a parallel on-disk foothold alongside the rogue
    account.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Does an administrator recall creating this user account?
  context: >-
    Legitimate new profiles come from a real user logging on or a provisioning workflow. Direct
    confirmation from the team that manages accounts on this host is a fast way to resolve the alert:
    if an administrator or an imaging or onboarding process registered an account with this username,
    that closes it; if no one accounts for it, the registration is likely implant-driven and the
    investigation should continue into the writing process and any use of the account.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this account registration align with normal work hours or a provisioning window?
  context: >-
    Account and profile creation during business hours or a documented onboarding or imaging window
    is routine; the same registration off-hours with no provisioning activity is more suspicious. Check
    whether the write time falls within the host's expected maintenance or onboarding schedule, and
    whether the host is one where new local accounts would ever legitimately be created.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
