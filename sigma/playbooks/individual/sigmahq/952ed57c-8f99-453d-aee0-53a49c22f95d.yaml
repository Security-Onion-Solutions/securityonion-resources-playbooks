name: Potential AVKkid.DLL Sideloading
id: 24a6c825-f316-4672-8bcc-b26b5a97ea93
description: |
  Detects a process loading a module named AVKkid.dll from a location or under a process other than
  the legitimate G DATA security suite, where AVKKid.exe normally loads AVKkid.dll from its
  Program Files install directory. The rule fires when the loaded module path ends in \AVKkid.dll
  AND the load is NOT the legitimate case (AVKKid.exe loading the DLL from a G DATA install path),
  which is the pattern of DLL search-order hijacking (sideloading) of a trusted software component.
  Adversaries place a malicious AVKkid.dll alongside a copy of the trusted binary, or have another
  process load it, to gain code execution under the identity of trusted software and evade
  application-trust controls. Investigate the exact module path and its signature and hash, the
  process that loaded it and where that process runs from, which process wrote the DLL to disk, and
  whether the load coincides with autostart-registry changes or additional persistence on the host.
type: detection
detection_id: 952ed57c-8f99-453d-aee0-53a49c22f95d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the loaded module match what this rule detects — a path ending in \AVKkid.dll that was not loaded by AVKKid.exe from a G DATA install directory?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires when a module whose path
    ends in \AVKkid.dll is loaded AND the load is not the legitimate case: AVKKid.exe loading the DLL
    from a C:\Program Files\G DATA\ or C:\Program Files (x86)\G DATA\ path. Review the exact ImageLoaded
    path, the loading process (Image), and the module's signing status on the triggering event. A module
    loaded from a user-writable or otherwise non-vendor directory, or loaded by a process other than the
    genuine G DATA binary, is the sideload the rule targets. DLL load events carry the module's hash and
    code-signature status directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this user and host expected to run the process that loaded this module?
  context: >-
    Legitimate security-suite components loading their own DLLs are routine on hosts where that software
    is installed. Knowing whether the loading process, the account it ran under, and the host function
    are consistent with sanctioned software is often the fastest way to separate an expected vendor load
    from a sideload staged under a relocated or renamed binary. When the account is a machine account or
    missing, pivot on the loading process and its origin instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What modules did the loading process pull in, and did any come from non-canonical, user-writable, or unsigned locations?
  context: >-
    The full set of modules a process loads reveals whether the AVKkid.dll load is isolated or part of a
    broader set of suspicious loads. Look for the module loaded from a directory other than the expected
    G DATA install path, unsigned modules where signed ones are expected, and system-named DLLs loaded
    from non-system paths — all search-order hijacking signals. Directories that are expected to hold
    vendor DLLs versus directories that are not is the distinction that separates a benign relocation
    from a planted module.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For the loaded AVKkid.dll, what is its signing status and hash, and does the same path show more than one distinct hash on this host?
  context: >-
    Module reputation separates a genuine vendor DLL from a substituted one. A validly signed G DATA DLL
    loaded from the vendor path may be legitimate; an unsigned or invalidly signed module using a trusted
    filename is a strong masquerading signal. Listing every load of this exact module path on the host
    with its hash and signing status surfaces substitution — the same path resolving to different hashes,
    or loading under an unexpected process, indicates the trusted DLL was replaced. Use the hash for a
    threat-intelligence lookup to identify known loaders.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
      - Image
- question: What is the process that loaded this module — its executable path, working directory, command line, and parent?
  context: >-
    The library event names the loading process but not where it runs from or what launched it, so pivot
    by process identity to its creation record. A sideload is often driven by a copy of a trusted binary
    placed in a user-writable directory next to the planted DLL, so the executable path and current
    working directory show whether the process itself runs from a non-standard location. The command line
    and the parent process and its command line distinguish a scripted or dropper-launched load from the
    genuine installed software starting normally.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
      - ParentImage
      - ParentCommandLine
- question: Which process wrote this AVKkid.dll to disk, and when?
  context: >-
    Sideloading begins with the malicious DLL being planted into a directory the loading process will
    search. Finding the file write for this exact module path identifies the dropper and the timing
    between the drop and the load, which correlates the file-system stage with the module-load stage.
    A DLL written by a browser, an archive utility, a script host, removable-media handling, or an
    unsigned binary shortly before the load points to a planted module rather than a vendor installer.
    The write process and account are the lead for tracing how the file arrived.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: Has this module been loaded on this host before, and under which processes?
  context: >-
    A first-time module load on a host is a stronger anomaly than a recurring one. If this DLL path has
    been loaded repeatedly by the same genuine software over the prior window, this load is probably
    routine. If this is the first occurrence, or the module has historically been loaded only by entirely
    different processes, the current load is anomalous and consistent with a newly planted component.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Is this module being loaded on other hosts, and under which processes?
  context: >-
    Cross-host correlation shows how far the module has spread. The same module confined to one host
    points to a localized event; the same module loading across multiple hosts points to shared
    distribution or a repeatedly used component. Pay attention to the variety of loading processes: a
    module loaded only by its expected parent looks like installed software, while the same module loaded
    by different or unexpected processes on other hosts is consistent with the module being carried and
    sideloaded across systems.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Were autostart or DLL-search-order registry keys modified on this host around the time of the load?
  context: >-
    DLL hijacking is often paired with registry changes that establish persistence or influence where
    modules are resolved from. Writes to Run and RunOnce keys, service configuration, KnownDLLs, or Image
    File Execution Options near the load indicate the sideload was used to establish a foothold or to
    redirect module resolution. Correlating these registry writes with the module-load timing, and noting
    which process made them, ties the load into a wider change to the host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\CurrentVersion\Run'
          - '\CurrentVersion\RunOnce'
          - '\Session Manager\KnownDLLs'
          - '\Image File Execution Options\'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A sideload rarely happens in isolation. Aggregating process activity in a tight window around the
    load surfaces what led up to it and what ran immediately after, which is where the code executing
    inside the trusted process context becomes visible. Novel parent-child pairs stand out at low counts
    against high-count routine telemetry, pointing to the tool that staged the DLL and any follow-on
    actions taken once execution was gained.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — reconnaissance, execution of scripting tools, removable-media
    activity, or defense tampering — may reveal the stages that preceded this load and help reconstruct
    the timeline. Sideloading is typically a means to run follow-on code under a trusted identity, so
    prior alerts help place this module load within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Does the user or an administrator recall installing or running the software that loaded this module?
  context: >-
    Direct confirmation from the account owner is a fast way to resolve the alert. If a user or
    administrator installed or ran the legitimate security software, or was testing a relocated build,
    that context can close the alert. If no one recalls the activity, the trusted binary may have been
    copied and run by automated tooling or by removable-media propagation, and the investigation should
    continue into the loading process origin and the file drop.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this activity align with normal work hours and maintenance windows?
  context: >-
    Legitimate software installation and updates typically occur during business hours or scheduled
    maintenance. A trusted component being loaded from a non-standard location outside normal hours, or
    on a host where that software is not managed, is more suspicious than the same load during a
    documented deployment window. Timing helps weigh whether the load fits sanctioned software management.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Code gaining execution under a trusted process is frequently followed by establishing a foothold.
    Scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions created by schtasks.exe,
    sc.exe, reg.exe, bitsadmin.exe, or wmic.exe near the module load indicate the sideload was used to
    install persistence rather than being an isolated event.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely — dropping an executable or script
    into a Startup folder or a path referenced by a registry Run key achieves persistence without
    invoking schtasks, sc, or reg. File writes to these locations near the module load indicate the
    sideloaded code established a parallel persistence mechanism on disk, including additional
    sideload pairs staged for the next boot.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
