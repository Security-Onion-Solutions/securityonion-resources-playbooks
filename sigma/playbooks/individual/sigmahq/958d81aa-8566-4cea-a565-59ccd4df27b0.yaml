name: Defrag Deactivation
id: d49a545a-edfa-4873-992b-3578ae016f95
description: |
  Detects schtasks.exe removing or reconfiguring the built-in ScheduledDefrag maintenance task, matching an Image ending in
  schtasks.exe together with either /delete or /change and, in the same command line, both /TN and the literal task path
  \Microsoft\Windows\Defrag\ScheduledDefrag. Disabling defrag stops the OS from rewriting unallocated sectors, which preserves
  data an operator wants left intact, and it also appears in broader sweeps that switch off scheduled maintenance; the same
  command is equally common in performance-tuning and debloat scripts, VDI golden-image builds, and SSD-optimisation guidance,
  so a single ScheduledDefrag removal carries little information by itself. The investigation should establish what else the
  same parent process, session, and host did in the surrounding window — other scheduled tasks touched, security tooling
  stopped, backups removed — because the surrounding sequence, not this command, is what distinguishes a tuning script from
  an operator preparing a host.
type: detection
detection_id: 958d81aa-8566-4cea-a565-59ccd4df27b0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Does the command line show schtasks.exe running /delete or /change against \Microsoft\Windows\Defrag\ScheduledDefrag?
  context: >-
    The rule requires schtasks.exe, one of /delete or /change, and both /TN and the literal path
    \Microsoft\Windows\Defrag\ScheduledDefrag in the same command line. Confirm which of the two operations ran and that the
    /TN argument names the defrag task rather than some other task path that happens to contain the string.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to remove or reconfigure built-in Windows maintenance tasks?
  context: >-
    Removing ScheduledDefrag is standard content in performance-tuning scripts, image build pipelines, and SSD-optimisation
    runbooks. A build server, VDI golden image, or an administrator's workstation running this is routine; the same command
    on a general-purpose endpoint with no build or tuning role is the case worth carrying forward.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: >-
    Is this execution part of an authorized engagement, an image build, or a sanctioned tuning or debloat script?
  context: >-
    The exact ScheduledDefrag removal command appears verbatim in widely circulated debloat and optimisation scripts, in VDI
    and golden-image build steps, and in SSD guidance that treats scheduled defrag as unnecessary. Matching this execution to
    a known build job, deployment package, or active assessment closes the alert without further analysis; no match keeps the
    surrounding-activity questions in play.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: Which schtasks operation ran, and did it delete the defrag task outright or change its configuration?
  context: >-
    Read the arguments to separate the two cases the rule covers. A /delete /TN with /F unregisters the task entirely. A
    /change carries further arguments that say what was altered — /DISABLE turns the task off while leaving it registered,
    /TR repoints it at a different command, and /RU changes the account it runs under. Which operation ran determines what
    remediation and what follow-on questions apply.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: >-
    If the command used /change, did it supply a replacement command through /TR, and is that content encoded or obfuscated?
  context: >-
    A /change against an existing task can repoint it at a new command rather than just disabling it, which converts a
    built-in maintenance task into a scheduled execution path that keeps a legitimate task name. Any /TR value should be read
    in full and decoded if it is base64, hex, URL-encoded, or assembled by character concatenation or environment-variable
    substitution. A /change that only carries /DISABLE has no payload to decode.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Is the ScheduledDefrag task still registered on the host, and is it enabled?
  context: >-
    The current state on the host tells you whether the command took effect and whether anything has since restored the task.
    Running schtasks /query /tn "\Microsoft\Windows\Defrag\ScheduledDefrag" /v on the host, or checking the equivalent view in
    an endpoint console, shows whether the task is absent, present but disabled, or present with a different action or run-as
    account than the built-in default.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - manual_review
  - edr_console
- question: Do the Task Scheduler registry entries show other tasks being modified on this host around this time?
  context: >-
    Task Scheduler keeps registered task state under the TaskCache subkeys, and enabling, disabling, or reconfiguring a task
    writes there. Because key and value deletions are not observable in this telemetry, treat the absence of a TaskCache write
    for the defrag task as uninformative and read this instead as an inventory of which other tasks were touched in the same
    window. Several unrelated tasks modified together points to a maintenance or tuning pass rather than a single targeted
    change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\CurrentVersion\Schedule\TaskCache\'
      condition: selection
    fields:
      - TargetObject
      - Image
  answer_sources:
  - manual_review
- question: What process launched this schtasks.exe, and is that parent expected to be issuing task commands?
  context: >-
    The parent identifies the mechanism. cmd.exe or powershell.exe running a script, a software-deployment agent, or an
    installer each imply a different origin, and the parent's own command line usually names the script file that carried the
    defrag line. An interactive shell under a user session, or a parent that itself descends from a browser, mail client, or
    Office application, points somewhere other than a build or tuning job.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
      - host.name
  answer_sources:
  - process_creation
- question: What else did the same parent process run in this session besides the defrag task command?
  context: >-
    This is the question that gives the alert meaning. One defrag-task removal is near-meaningless on its own; the same parent
    also stopping security services, deleting shadow copies, disabling Windows Update or the firewall, or clearing event logs
    is the finding. A parent whose other children are only further tuning commands — power settings, telemetry services,
    search indexing — is a tuning script behaving as expected.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - host.name
  answer_sources:
  - process_creation
- question: Were other scheduled tasks deleted, disabled, or updated on this host around the same time?
  context: >-
    The Security channel records task deletion as 4699, task enable or disable as 4701, and task update as 4702, each carrying
    the task name and the account that made the change. Reading the task names touched in the window separates a sweep that
    removed only maintenance tasks from one that also reached defensive or backup tasks, and a task name outside the normal
    Microsoft conventions is worth reading in full. If the Security channel is not collected from this host, zero results is a
    visibility gap rather than evidence nothing else changed.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4699
          - 4701
          - 4702
      condition: selection
    fields:
      - EventID
      - TaskName
      - SubjectUserName
  answer_sources:
  - manual_review
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating process activity in the surrounding window shows what the defrag command sat inside. Novel parent and child
    pairings stand out at low counts against the repetitive agent and service telemetry that fills the high-count rows. Look
    for the sequence around the task change rather than the task change itself.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host give the defrag task change a place in a timeline. Defense tampering, credential
    access, or reconnaissance alerts preceding it change what the command means; an otherwise quiet host with a single
    maintenance-task alert reads differently.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, so the result is the user's 90-day history of removing or
    reconfiguring the defrag task specifically, aggregated by host. An account that does this routinely across many hosts is
    running build or tuning work; a first occurrence from an account with no imaging or maintenance role is the deviation.
    Weigh the count against what the account is for.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \schtasks.exe
        CommandLine|contains:
        - /delete
        - /change
        CommandLine|contains|all:
        - /TN
        - \Microsoft\Windows\Defrag\ScheduledDefrag
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: >-
    Has this parent process historically driven this same defrag-task pattern here or elsewhere, or is the parent new for this
    activity?
  context: >-
    When the alert fires under SYSTEM or a computer account, user identity attributes nothing and the launch mechanism is the
    meaningful pivot. The query mirrors the rule's selection scoped to the alerting parent, giving 90 days of that parent
    driving this specific pattern. A parent already accounting for many prior events across many hosts is deployment or image
    automation; a parent new to this pattern is what to chase.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \schtasks.exe
        CommandLine|contains:
        - /delete
        - /change
        CommandLine|contains|all:
        - /TN
        - \Microsoft\Windows\Defrag\ScheduledDefrag
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What else did this user do across the environment around this time?
  context: >-
    Tracking the account's activity across all hosts in the surrounding hour shows whether the defrag change was one step of a
    wider pass. The same account touching maintenance or security configuration on several hosts in the window is a different
    situation from a single host. Under a service principal this returns agent telemetry across the fleet and the
    parent-driven view is the meaningful one instead.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did this same parent-driven defrag-task pattern fire on other hosts in the same window?
  context: >-
    Under a service principal the user pivot returns fleet-wide agent noise, so the useful question is whether the same launch
    mechanism fired elsewhere at the same time. The query mirrors the rule's selection scoped to the alerting parent,
    fleet-wide, in the alert window. Multiple hosts in the same window points to pushed or scheduled automation; a single host
    points to a host-local trigger.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \schtasks.exe
        CommandLine|contains:
        - /delete
        - /change
        CommandLine|contains|all:
        - /TN
        - \Microsoft\Windows\Defrag\ScheduledDefrag
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: >-
    Were other persistence or system-configuration tools run on this host in the same window as the defrag task change?
  context: >-
    schtasks, at, sc, reg, bitsadmin, and wmic together cover most command-line task, service, registry, and job manipulation.
    Aggregating their use across a four-hour window around the alert shows what else was configured. A run of maintenance
    tunings reads as a tuning pass; the same window also carrying service stops, registry changes to security settings, or new
    task or service registration is the sequence that gives the defrag change its meaning.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: >-
    Have other hosts fired this same defrag-task pattern in the past week, and does the distribution look like automation or
    one-off activity?
  context: >-
    The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this specific pattern rather than
    general schtasks.exe usage. Many hosts firing it points to a deployment package, image build, or tuning script rolled out
    broadly. One host, or a small unrelated set, points to activity driven per-host and keeps the surrounding-sequence
    questions load-bearing.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \schtasks.exe
        CommandLine|contains:
        - /delete
        - /change
        CommandLine|contains|all:
        - /TN
        - \Microsoft\Windows\Defrag\ScheduledDefrag
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
