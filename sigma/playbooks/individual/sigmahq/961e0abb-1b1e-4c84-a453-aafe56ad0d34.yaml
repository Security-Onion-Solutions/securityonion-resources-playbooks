name: Execution via stordiag.exe
id: c42ea012-06d1-473a-a281-73e0e3b60b8f
description: |
  Detects stordiag.exe spawning a child process named schtasks.exe, systeminfo.exe, or fltmc.exe when the
  stordiag.exe parent is running from outside C:\Windows\System32 or C:\Windows\SysWOW64. stordiag.exe is a
  Microsoft-signed storage diagnostic utility that loads the full PowerShell runtime in-process; copying it to an
  attacker-controlled folder alongside an executable named after one of these three binaries lets an arbitrary payload
  run under a trusted, signed parent (System Binary Proxy Execution, T1218). The detected child is therefore not
  necessarily the real Windows tool by that name — the name is a proxy-execution lure. Determine whether stordiag.exe
  ran from its canonical system path (legitimate diagnostics) or a relocated copy, what the child binary actually is,
  and whether the parent loaded non-Microsoft assemblies.
type: detection
detection_id: 961e0abb-1b1e-4c84-a453-aafe56ad0d34
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did stordiag.exe spawn a child named schtasks.exe, systeminfo.exe, or fltmc.exe from a path outside System32 or SysWOW64?
  context: Confirm the alert is a true positive before investing investigation time. The rule fires when a process whose ParentImage
    ends in stordiag.exe spawns a child whose Image ends in schtasks.exe, systeminfo.exe, or fltmc.exe, AND the parent stordiag.exe
    does NOT start from C:\Windows\System32 or C:\Windows\SysWOW64. Check the parent's full path in the event — a canonical
    system path means the filter should have suppressed it and the fire is anomalous; a relocated copy is the proxy-execution pattern.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
- question: Is this user and host expected to run storage diagnostics via stordiag.exe?
  context: Legitimate stordiag.exe runs are storage and filesystem diagnostics, normally launched by an administrator or a support
    workflow from the canonical system path. A standard user or a host with no diagnostic activity history makes the relocated
    proxy-execution interpretation more likely. Compare the user role and host function against expected diagnostic usage.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Where did stordiag.exe run from, and what started it?
  context: The parent-child relationship is the core signal. stordiag.exe running from C:\Windows\System32 or C:\Windows\SysWOW64
    under an administrative or diagnostic context is routine; a copy running from a user-writable or staging directory is the
    relocated proxy surface the technique relies on. Tracing what spawned stordiag.exe itself reveals whether the chain is an
    interactive diagnostic session or an automated drop-and-execute.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What is the full command line and path of the child binary, and what does it actually do?
  context: The child Image name (schtasks.exe, systeminfo.exe, or fltmc.exe) is a lure — under the relocated stordiag.exe parent
    it may be an arbitrary executable carrying that name rather than the real Windows tool. Read the child's full path and command
    line, and confirm its OriginalFileName and signer. A binary in the same folder as the relocated stordiag.exe, unsigned, or
    with an OriginalFileName that does not match its on-disk name indicates a planted payload rather than the genuine utility.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
      - OriginalFileName
- question: If the child is the genuine schtasks.exe, what task name, command, and schedule does its command line define?
  context: When the child is actually the real schtasks.exe, its command line carries the task name (/TN), the command to run
    (/TR), the schedule type (/SC such as ONLOGON, MINUTE, DAILY), and the run-as account (/RU, where SYSTEM is high-risk). These
    define any persistence being configured. If the child binary is a planted executable merely named schtasks.exe, there will
    be no genuine task arguments and the command line reflects the payload instead — note which case applies.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did the stordiag.exe parent load any non-Microsoft DLLs or .NET assemblies in this execution?
  context: stordiag.exe hosts the PowerShell runtime in-process, loading System.Management.Automation.dll and Microsoft.PowerShell.*
    assemblies from the GAC. An attacker who places a malicious DLL bearing one of those assembly names in the relocated stordiag.exe
    folder gains code execution under the signed parent via search-order hijacking. Module loads from the stordiag.exe directory
    or any non-system, unsigned path are the in-process execution mechanism behind this proxy pattern. If image-load telemetry
    is not collected in this environment, treat zero results as a visibility gap rather than evidence nothing loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Image
      - Signed
      - Signature
- question: Did the stordiag.exe parent or its child make outbound network connections around the alert time?
  context: Proxy execution through a trusted binary is frequently paired with retrieval of a remote payload or command-and-control
    over the signed process. Outbound connections from the stordiag.exe parent or the spawned child — especially to external,
    rare, or non-enterprise destinations — point to payload download or beaconing rather than local-only diagnostics. Exclude
    known-good update and telemetry endpoints when reviewing.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - Image
- question: What other child processes did this stordiag.exe instance spawn?
  context: If a relocated stordiag.exe is being used as a proxy-execution surface, it may have spawned other processes beyond
    the one that triggered the alert. The only documented legitimate child of stordiag.exe is conhost.exe; any other children,
    or several children in sequence, reveal the full scope of activity launched through this signed parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single discovery command may be routine troubleshooting, but several reconnaissance commands in quick succession
    — whoami, ipconfig, net user, systeminfo — is a signature of post-compromise enumeration. Because systeminfo is one of the
    child names this rule targets, surrounding recon activity helps distinguish genuine host enumeration from an isolated proxy-execution event.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: Is this user expected to run administrative discovery or diagnostic commands?
  context: Administrators and IT staff legitimately run discovery and diagnostic commands for troubleshooting, while standard
    users rarely need systeminfo, fltmc, or storage diagnostics. The user's role and typical behavior baseline determine whether
    this activity is routine or anomalous.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \stordiag.exe
        Image|endswith:
        - \schtasks.exe
        - \systeminfo.exe
        - \fltmc.exe
      filter:
        ParentImage|startswith:
        - c:\windows\system32\
        - c:\windows\syswow64\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \stordiag.exe
        Image|endswith:
        - \schtasks.exe
        - \systeminfo.exe
        - \fltmc.exe
      filter:
        ParentImage|startswith:
        - c:\windows\system32\
        - c:\windows\syswow64\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If
    the same user triggered similar activity on other hosts, the scope of the activity may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \stordiag.exe
        Image|endswith:
        - \schtasks.exe
        - \systeminfo.exe
        - \fltmc.exe
      filter:
        ParentImage|startswith:
        - c:\windows\system32\
        - c:\windows\syswow64\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: Was stordiag.exe executed from its expected system path?
  context: stordiag.exe canonically lives at C:\Windows\System32\stordiag.exe and C:\Windows\SysWOW64\stordiag.exe. A copy running
    from a user-writable, temp, or staging directory is the relocation the proxy-execution technique depends on — and is precisely
    what the rule's filter is designed to leave un-suppressed. Confirm the parent's on-disk path and that its OriginalFileName
    and signer match the genuine Microsoft binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Were any other proxy-execution LOLBins used on this host recently?
  context: Attackers who use one signed-binary proxy surface often use several. If stordiag.exe was used to launch a payload
    under a trusted parent, check whether other proxy-execution LOLBins were also run on the host. Finding multiple such binaries
    performing the same objective strengthens the case for deliberate proxy execution over isolated diagnostic use.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\installutil.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: How often has this host fired the stordiag.exe proxy-execution pattern over the past 90 days, and what command-line structures are typical?
  context: A proxy-execution pattern with no prior history on a host is more notable than one seen under stable conditions. The
    query mirrors the rule's selection structure scoped to this host, so the count reflects this rule's specific firing pattern
    rather than generic stordiag.exe usage. The command-line projection lets the analyst compare typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \stordiag.exe
        Image|endswith:
        - \schtasks.exe
        - \systeminfo.exe
        - \fltmc.exe
      filter:
        ParentImage|startswith:
        - c:\windows\system32\
        - c:\windows\syswow64\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - CommandLine
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, credential
    access — may reveal the attack stages that preceded this event and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
