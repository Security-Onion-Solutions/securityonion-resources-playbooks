name: DarkSide Ransomware Pattern
id: 2602f518-4345-4d8c-afe3-1832a2e3767d
description: |
  This rule fires when either of two independent patterns appears in Windows process creation.
  The first branch matches the command line directly: a PowerShell hex-to-character decode
  sequence (`=[char][byte]('0x'+`), or the ` -work worker0 -path ` flags that the DarkSide
  encryptor accepts to select a target directory. The second branch matches a binary executing
  from `\AppData\Local\Temp\` whose parent command line is a dllhost.exe COM surrogate started
  with the CMSTPLUA elevation moniker `{3E5FC7F9-9A51-4367-9063-A120244FBEC7}` — the auto-elevation
  UAC bypass that many families and red-team frameworks reuse, which is why the rule's own
  false-positive list calls it out.
  Because the branches are independent, the two fires mean different things: the command-line
  branch points at payload decoding or encryption staging, while the COM-surrogate branch points
  at privilege elevation that usually sits earlier in the same intrusion. The investigation should
  establish which branch matched, decode the full command line, trace the parent chain upward to
  what delivered and elevated the process, and determine whether recovery-inhibiting or
  encryption activity has already followed on this host or on others.
type: detection
detection_id: 965fff6c-1d7e-4e25-91fd-cdccd75f7d2c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Does the alerting event match either branch — a command line with the hex-to-character decode
    sequence or `-work worker0 -path`, or an AppData\Local\Temp binary spawned by the CMSTPLUA
    elevation surrogate?
  context: >-
    The rule fires on either of two independent branches, and which one matched changes what the
    rest of the investigation is looking for. The command-line branch matches a PowerShell
    hex-to-character decode idiom or the `-work worker0 -path` flags that select a directory to
    process; it points at payload decoding or encryption staging. The COM-surrogate branch matches
    a binary running from AppData\Local\Temp under a dllhost.exe parent carrying the CMSTPLUA
    elevation moniker, and both halves of that branch must be true together; it points at
    auto-elevation of a staged binary, which normally sits earlier in the chain. Read the
    ParentCommandLine and CommandLine on the alerting event and record which branch fired.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentCommandLine
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: >-
    Is this user and host expected to run decoding one-liners or to execute binaries from
    AppData\Local\Temp under an elevated COM surrogate?
  context: >-
    Both branches have benign producers. Installer and updater tooling stages binaries in
    AppData\Local\Temp, and some packaging and automation frameworks use COM elevation, so a
    software-distribution host or a developer workstation can produce the parent branch legitimately.
    Hex-to-character decoding also appears in hand-written administrative scripts. Whether this
    account and this host normally do either is often the fastest way to separate routine work from
    the pattern the rule targets.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What exactly did the alerting binary do? Decode the command-line arguments.
  context: >-
    Reconstruct the operation from the arguments. A `[char][byte]('0x'+...)` construction
    concatenates hex byte values into a string at runtime — evaluate it to recover the literal it
    builds, which is commonly a command, a path, or a downloader fragment. The `-work worker0
    -path` form names the directory the process was told to operate on, so the `-path` value is the
    encryption or staging target to check directly. CurrentDirectory shows where the process was
    launched from, which distinguishes a shell-launched invocation from a service or scheduled
    start. The window covers all executions of this binary on the host, so a multi-step sequence
    driven by a script appears as consecutive rows.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: >-
    Is this parent expected to spawn this child, and what started the parent itself?
  context: >-
    This retrieves the parent's own creation event, which is where the chain becomes readable. If
    the parent is dllhost.exe carrying the CMSTPLUA moniker, it was started by the COM elevation
    request rather than by a user action, and the process that requested elevation is the one worth
    identifying. Parents that should rarely spawn OS utilities or staged binaries include
    winword.exe, excel.exe, powerpnt.exe, acrord32.exe, chrome.exe, msedge.exe, firefox.exe,
    7zFM.exe, winrar.exe, and explorer.exe; children worth noting include powershell.exe, cmd.exe,
    wscript.exe, cscript.exe, mshta.exe, rundll32.exe, regsvr32.exe, msiexec.exe, curl.exe,
    bitsadmin.exe, expand.exe, and tar.exe. The 7-day window is intentional — surrogate and shell
    parents can start well before the child.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other child processes did the same parent spawn?
  context: >-
    A parent that launched the alerting process usually launched others. For an elevation
    surrogate, siblings show what else was run with the elevated token; for a shell or script
    parent, they show the ordered steps of whatever ran. Several staged binaries or interpreters
    under one parent in a short window describes orchestration rather than a single user action.
    host.name is included because ParentProcessGuid resolves to NODATA in some telemetry.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Is the referenced file still on disk for analysis?
  context: >-
    Both branches reference files — the decoded string frequently resolves to a path, and the
    `-path` argument names a directory the process was told to work on. This correlates file
    activity to the alerting process and its direct children by process lineage, which is the
    reliable way to recover what was written. Anything still present can be hashed, reviewed, or
    submitted for analysis; anything already gone narrows the timeline for recovery.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What files were written into user-writable staging directories on this host around the alert?
  context: >-
    The rule's second branch requires the alerting binary to live under `\AppData\Local\Temp\`, so
    the write that placed it there is the preceding step. The directories worth reading are the
    ones user-facing applications write to without prompting — `\AppData\Local\Temp\`,
    `\Downloads\`, `\AppData\Roaming\`, and `\Users\Public\`. The Image column names the writer,
    which is the pivot back to whatever delivered the file.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_paths:
        TargetFilename|contains:
          - '\AppData\Local\Temp\'
          - '\Downloads\'
          - '\AppData\Roaming\'
          - '\Users\Public\'
      condition: selection and selection_paths
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Did a user-facing application crash or log an abnormal event on this host shortly before the alert?
  context: >-
    Execution that depends on a user opening something often leaves a trace on the Application
    channel first — an error or fault event (1000/1001) from an Office application, a PDF reader,
    an archiver, or a browser at the moment the content was handled. Pair the timing with the
    staged-file writes to identify which application handled the delivery. If the Application
    channel is not collected in this environment, treat zero results as a visibility gap rather
    than evidence nothing was opened.
  range: -1h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: application
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 1000
          - 1001
      condition: selection
    fields:
      - EventID
      - Provider_Name
  answer_sources:
  - manual_review
- question: Did the alerting process or its direct children make outbound network connections around the alert?
  context: >-
    A decoded one-liner that resolves to a downloader, and a staged binary that reports in, both
    produce egress from the same lineage as the alert. A 15-minute window either side of the
    process event is the practical correlation span between execution and first contact. Compare
    any destinations against the environment's known update and CDN endpoints and proxy egress
    ranges before treating them as attacker infrastructure; destinations outside that set are the
    ones to pursue.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is this
    account's 90-day history of the rule's actual firing pattern rather than generic use of the
    binary, aggregated by host. A user with no prior hits is a different situation from one whose
    role involves packaging or automation that produces the COM-surrogate branch routinely. Weigh
    the count and the host spread against what this account is expected to do.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains:
        - =[char][byte]('0x'+
        - ' -work worker0 -path '
      selection2:
        ParentCommandLine|contains: DllHost.exe /Processid:{3E5FC7F9-9A51-4367-9063-A120244FBEC7}
        Image|contains: \AppData\Local\Temp\
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: >-
    Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: >-
    When the alert fires under SYSTEM, a service account, or a computer account, the user field
    attributes nothing and the launch mechanism is the meaningful pivot. The query mirrors the
    rule's selection structure scoped to the alerting parent, so the result is the 90-day history
    of this parent driving this specific pattern, aggregated by host. A parent that already
    accounts for a large, evenly spread count is vendor or OS automation; a parent that is new for
    this pattern is the deviation to follow.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains:
        - =[char][byte]('0x'+
        - ' -work worker0 -path '
      selection2:
        ParentCommandLine|contains: DllHost.exe /Processid:{3E5FC7F9-9A51-4367-9063-A120244FBEC7}
        Image|contains: \AppData\Local\Temp\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user do across the environment around this time?
  context: >-
    Tracking the account's process activity across all hosts in the alert window shows whether the
    same person was working on more than one endpoint. Activity on several hosts in a short window
    is the pattern that distinguishes hands-on-keyboard movement from a single host-local event.
    If the alert fired under a service principal, expect this to return agent telemetry volume and
    read the parent-driven fleet question instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: >-
    Did this same parent-driven pattern fire on other hosts in the same window, or is the activity
    isolated to this host?
  context: >-
    Under a service principal, asking what else the user did returns agent-telemetry noise because
    every host runs SYSTEM-owned agents constantly. The query mirrors the rule's selection
    structure scoped to the alerting parent, fleet-wide, in the alert window. Multiple hosts in the
    same window points to scheduled or pushed automation, whether that is a deployment tool or a
    remote-execution step; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains:
        - =[char][byte]('0x'+
        - ' -work worker0 -path '
      selection2:
        ParentCommandLine|contains: DllHost.exe /Processid:{3E5FC7F9-9A51-4367-9063-A120244FBEC7}
        Image|contains: \AppData\Local\Temp\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What recovery-inhibiting commands were executed on this host?
  context: >-
    Encryption is normally preceded or accompanied by removal of recovery options — shadow-copy
    deletion via vssadmin or wmic, boot-recovery changes via bcdedit, backup-catalog deletion via
    wbadmin, and recovery-environment disabling via reagentc. This surfaces all of them on the host
    over the following 24 hours rather than only the alerting command, so the extent of recovery
    removal is visible in one place. Command execution is not proof of effect — confirm the system
    state directly with `vssadmin list shadows`, `bcdedit /enum`, `reagentc /info`, and `wbadmin
    get versions`, and check offline, tape, and cloud backup status through the backup systems.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\reagentc.exe'
          - '\diskshadow.exe'
      selection_cmdline:
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'recoveryenabled'
          - 'bootstatuspolicy'
          - 'delete catalog'
          - 'delete systemstatebackup'
          - 'boot.ini'
          - 'winre.wim'
          - '/disable'
      condition: selection and (selection_recovery or selection_cmdline)
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
  - edr_console
- question: What other destructive or recovery-inhibiting actions occurred on this host?
  context: >-
    The pre-encryption phase is usually a set of actions rather than one — shadow-copy removal,
    service and process termination, permission changes, and log clearing, often within the same
    few minutes. Aggregating the utilities involved over a 30-minute window either side of the
    alert shows how much of that set is present. The User column matters here: a single account
    driving all of it describes a scripted sequence, while separate accounts across the same window
    usually describe unrelated administrative work.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_destructive:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\cipher.exe'
          - '\fsutil.exe'
          - '\icacls.exe'
          - '\takeown.exe'
          - '\attrib.exe'
          - '\sc.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\powershell.exe'
          - '\taskkill.exe'
      condition: selection and selection_destructive
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: Are there signs of file encryption, ransom notes, or unknown binary execution on this host?
  context: >-
    Recovery removal and staging typically precede encryption by minutes, so the half hour after
    the alert is where the encryption stage would appear. Filtering out the usual system paths
    leaves unknown executables, interpreters launching unfamiliar binaries, and processes running
    from temp or user-writable directories. Check the `-path` directory named in the alerting
    command line first, and look for ransom-note filenames and renamed files with an unfamiliar
    extension through file telemetry or on the host.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_known:
        Image|startswith:
          - 'C:\Program Files'
          - 'C:\Windows\System32\svchost'
          - 'C:\Windows\System32\wbem'
      condition: selection and not filter_known
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: Is this same detection firing on other hosts in the environment?
  context: >-
    Deployment of an encryptor is commonly pushed to many hosts at once through remote execution or
    a scheduled job, so the same rule firing across hosts in a narrow window describes a rollout
    rather than an isolated event. The count of hosts scopes the response and the first-to-last
    timing shows the direction of spread. A single host in the results points back to a host-local
    trigger.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
  answer_sources:
  - process_creation
  - alert
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    The staging and pre-encryption phase is usually the tail of a longer intrusion, so the pivot
    backward is as productive as the pivot forward. Earlier detections on this host — remote
    access, credential access, discovery, defense tampering, or service creation — reconstruct how
    the process being investigated came to run and under whose access. Their absence is also
    informative, and points the investigation toward telemetry gaps or a non-endpoint entry path.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
