name: Suspicious Environment Variable Has Been Registered
id: 91789b77-5d10-4824-beb7-2f7dacde13c0
description: |
  Detects a registry write that creates or modifies an environment variable (a TargetObject path
  containing \Environment\) whose value data holds a suspicious command or an encoded payload. The
  rule fires when both conditions hold: the key sits under an Environment hive AND the value data
  contains a PowerShell/pwsh reference or a base64 fragment characteristic of a PE header (MZ), a
  PowerShell cmdlet (Invoke-, iex, Get-), a cmd string, a drive-letter path prefix, or a gzip blob.
  Environment variables are a common obfuscation and staging location: an operator stashes an encoded
  command or an embedded executable in a user or machine environment variable, then a separate
  mechanism (a logon shell value, a script, or a scheduled task) reads the variable and decodes and
  runs the payload, keeping the malicious content out of process command lines. Legitimate software
  occasionally sets environment variables, but rarely with encoded executables or interpreter
  commands. Investigate exactly what value was written, decode it, identify which process wrote it and
  what launched that process, whether a payload landed on disk or executed, and whether the variable
  was modified again afterward.
type: detection
detection_id: 966315ef-c5e1-4767-ba25-fce9c8de3660
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting registry write set an Environment variable to a PowerShell command or an encoded payload?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires only when
    the written key path contains \Environment\ AND the value data contains a PowerShell or pwsh
    reference, or a base64 fragment characteristic of an embedded PE header, a PowerShell cmdlet, a cmd
    string, a drive-letter path prefix, or a gzip blob. Review the exact TargetObject and Details on the
    triggering event to confirm both conditions are met and that the value data is genuinely an encoded
    command or payload rather than a benign long string.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to register environment variables containing scripts or encoded data?
  context: >-
    Applications set environment variables during installation and configuration, but writing an
    interpreter command or an encoded executable into a variable is unusual for routine software. Knowing
    whether the writing account and host function match any sanctioned deployment or administrative task
    is often the fastest way to separate a packaging quirk from staged execution. User attribution is
    present on roughly 94% of endpoint registry events; when it is a machine account or SYSTEM, pivot on
    the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which environment variable was written, and why is the Environment hive an obfuscation and staging location?
  context: >-
    The key path identifies whether this is a user variable (HKCU\Environment) or a machine-wide variable
    (HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Environment) and the variable name itself.
    Environment variables are read by many processes, so an encoded command or embedded executable placed
    here can be pulled and decoded by a separate script or logon mechanism without the payload ever
    appearing in a command line. Confirming the exact key and the writing process establishes that this is
    a staging write rather than an unrelated configuration change and sets up decoding the value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What is the decoded value of the environment variable, and what does it do?
  context: >-
    The Details field holds the value data the rule matched on. Decode it: a base64 fragment beginning with
    an MZ-header pattern indicates an embedded PE that would be reflectively loaded, while fragments that
    decode to Invoke-, iex, Get-, cmd, or a drive-letter path indicate a staged interpreter command or a
    reference to a payload on disk. A gzip-header fragment indicates a compressed-then-encoded blob.
    Establishing what the decoded value executes determines whether the operation is fileless (payload
    embedded in the variable) or references a file to retrieve. Details is present on roughly 79% of
    registry modifications and should be populated for this string value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote the environment variable, and what launched that process?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to read its
    Image, full command, and parent. A reg.exe, setx.exe, powershell.exe, or cmd.exe write launched from an
    Office application, a script host such as wscript.exe or mshta.exe, or a renamed or unsigned binary
    points to the variable being staged programmatically rather than a deliberate administrator or installer
    action. The parent chain distinguishes an automated implant from an interactive console change.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Did an executable run from the staging directories referenced by the encoded value, and what is its hash?
  context: >-
    Value data that decodes to a drive-letter path or references a user-writable staging location such as a
    Temp or Public directory implies a payload that is written to disk and then run. This query lists
    processes that executed from those staging directories on the host and projects their hashes; submit any
    hash to a reputation service to determine whether the binary is known malicious, benign, or unseen. If
    the payload was decoded and run in memory rather than written to disk, no process appears here and the
    operation is fileless — fall back to decoding the value data directly.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_staging:
        Image|contains:
          - '\AppData\Local\Temp\'
          - '\Users\Public\'
      condition: selection and selection_staging
    fields:
      - Image
      - CommandLine
      - Hashes
- question: Did the process that wrote the variable also drop files to disk in the same session?
  context: >-
    When the environment variable references or decodes to a payload on disk, the writing process or one of
    its children usually creates that file in the same session. Correlating file writes by the writing
    process and its children reveals whether a payload was dropped and where it lives, enabling retrieval and
    deeper analysis. If the encoded value is a self-contained executable held entirely in the variable, no
    corresponding file write appears and the payload is staged in the registry rather than on disk.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was the environment variable modified again after this write, and did the staged payload execute?
  context: >-
    Registry key or value deletions are not observable in this telemetry, so durability is judged from the
    variable's re-modification history rather than from a delete event. A later write that changes or clears
    the value may indicate the staging was cleaned up after the payload ran, while the value persisting keeps
    the encoded content available for any mechanism that reads the variable. Compare the Details values
    written to this key over the following window and correlate with whether a decoded payload executed.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Has this environment variable been modified before on this host?
  context: >-
    Environment variables set by installed software change on predictable events such as installs and
    upgrades, so a history with no prior writes to this variable makes the change first-time and raises its
    weight. A history of periodic writes with the same value points instead to a management process or a
    repeatedly run tool. Compare the historical Details values to see whether an encoded value was set before
    or whether this is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An operator who stages a payload in an environment variable often makes other configuration changes in
    the same session — a logon shell or Run key that reads the variable, defense or firewall policy edits, or
    additional staging keys. Clustering the registry writes on this host in a short window around the alert
    reveals the full scope of changes and which process made them. The triggering key appears in the results;
    the signal is what else was modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Was this same environment variable modified on other hosts in the environment?
  context: >-
    The same variable written across many hosts suggests a broad tool run or a mis-scoped deployment; the
    same write confined to one host suggests targeted staging. Compare the Details values across hosts to see
    whether they all set the same encoded content and whether the writing process is consistent, which
    separates a single hands-on operation from repeated use of the same technique across the environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Staging a payload rarely happens in isolation. Aggregating process activity in a tight window around the
    alert surfaces what led up to the environment variable write and what ran immediately after it. Novel
    parent-child pairs stand out at low counts against high-count routine telemetry, which points to the tool
    that staged the variable and any process that read and executed the decoded content.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — reconnaissance, execution of scripting tools, or defense tampering
    — may reveal the stages that preceded this write and help reconstruct the timeline. Staging an encoded
    payload is usually a means to a follow-on action, so prior alerts help place this environment variable
    write within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were process-based persistence mechanisms installed on this host in the same window?
  context: >-
    An encoded payload staged in an environment variable is frequently paired with a persistence mechanism so
    it runs again after reboot or logon. Scheduled tasks, services, registry Run keys, BITS jobs, or WMI
    subscriptions created by schtasks.exe, sc.exe, reg.exe, bitsadmin.exe, or wmic.exe near the variable write
    indicate the staging was part of establishing a foothold rather than an isolated action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely — dropping an executable or script into a
    Startup folder or a path referenced by a registry Run key achieves persistence without invoking schtasks,
    sc, or reg. File writes to these locations near the environment variable write indicate the staged payload
    established a parallel persistence mechanism on disk.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Does the user or an administrator recall setting this environment variable?
  context: >-
    Environment variables holding encoded commands or executables have no routine reason to be set by hand, so
    direct confirmation from the account owner is a fast way to resolve the alert. If an administrator or a
    known deployment tool set the value, that closes it; if no one recalls the action, the account may be
    compromised or the change was made by automated tooling, and the investigation should continue into the
    writing process and any decoded payload that executed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
