name: Potential APT10 Cloud Hopper Activity
id: 8ea7b423-7bc7-480a-86f9-9c98a75cb895
description: |
  Fires on a process_creation event that matches either of two independent command-line branches: cscript.exe launching a
  `.vbs` script with the `/shell ` argument, or a command line that contains both `csvde -f C:\windows\web\` and `.log`
  together. The first branch is Windows Script Host executing VBScript with an interactive shell argument; the second is
  an Active Directory directory export written to a fixed staging path under a web-servable system directory. Both
  patterns occur in commodity tooling and, less often, in administrative scripting, so the investigation should establish
  which branch fired, decode the full command line, confirm what the script or export actually did with the file it
  references, and determine whether the user, parent process, and host make the activity expected.
type: detection
detection_id: 966e4016-627f-44f7-8341-f394905c361f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: 'Does the alerting event match either detection branch — cscript.exe running a `.vbs` with the `/shell ` argument,
    or a command line containing both `csvde -f C:\windows\web\` and `.log`?'
  context: >-
    The rule fires when at least one of the two branches matches, so the first step is to read the exact Image and
    CommandLine and note which one fired. The cscript branch requires both the cscript.exe image and the `.vbs /shell `
    string together, and points the investigation at the referenced script file and at what the script host went on to
    do. The csvde branch requires both substrings together, has no image constraint at all, and points the investigation
    at the exported directory data and the file staged under `C:\windows\web\`.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this script-host or directory-export execution part of an authorized penetration test or red team engagement?
  context: >-
    Directory enumeration to a staged file and script-host execution with a shell argument are both standard steps in
    authorized assessments and in some internal audit tooling. Check whether an engagement is active on this host or
    network segment before investing further time; a scoped engagement with matching tooling and timing resolves the
    alert without additional analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: Is this user and host expected to run VBScript through the script host or export directory objects to a file?
  context: >-
    Domain administration and identity-tooling roles legitimately run csvde exports, and some line-of-business
    applications ship VBScript helpers. Whether the account and the host function line up with the branch that fired is
    often the fastest path to separating routine operations from operator activity. A workstation account running a
    directory export, or a server with no scripting role running cscript.exe interactively, is the deviation worth
    pursuing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Which capability was invoked — the script name and arguments passed to cscript.exe, or the csvde export filter,
    scope, and output path?
  context: >-
    Read every argument in the alerting command line and name the operation. For the script-host branch, identify the
    `.vbs` file name and full path, the arguments after `/shell `, and any host, port, or command string handed to the
    script. For the export branch, identify the `-f` output path, and any `-d` base DN, `-r` LDAP filter, or `-l`
    attribute list, which together tell you exactly which directory objects and attributes were written out. The
    capability that was used determines what data is exposed and what the response has to cover.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Is the file referenced by the command line still on disk for analysis?
  context: >-
    Both branches name a file — the `.vbs` script the script host reads, or the `.log` export csvde writes under
    `C:\windows\web\`. This query correlates file activity back to the alerting process and its direct children by
    process lineage rather than by path, because the path is only present in the command line. If the file is still
    present, retrieve it for content review, hashing, and sandbox submission before it is cleaned up. A `.log` written
    beneath a web-servable directory should also be checked against whether that directory is actually served.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Is the command line or the referenced script encoded or obfuscated, and what does the decoded content do?
  context: >-
    VBScript payloads commonly hide their intent with `Chr()` chains, string concatenation, `Execute`/`ExecuteGlobal`
    wrappers, or base64 handed to the script as an argument; reconstruct any such string and read the command it forms.
    Environment-variable substitution and doubled quoting in the command line itself serve the same purpose. High-entropy
    or unreadable argument content is itself a signal — legitimate scripting arguments are generally readable paths,
    switches, and identifiers. Decoding tells you whether the script fetches a payload, opens a shell, or performs
    collection.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: If the referenced script has executed on this host, what hash is recorded and does it have known AV or threat-intel
    detections?
  context: >-
    A file's hash is recorded when it runs, not when it is written, so this query looks for script-host executions
    carrying a `.vbs` on this host and reads the recorded hash. Note that on a script-host match the hash belongs to
    cscript.exe or wscript.exe, not to the script itself — use it to confirm the interpreter is the genuine signed
    binary, then retrieve the `.vbs` from its on-disk path and hash that separately for reputation lookup. The alert's
    own path is anchored on the rule's literal command-line values rather than a file-event field, because a
    process_creation alert carries no file path of its own.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith:
          - \cscript.exe
          - \wscript.exe
      selection_interpreter:
        CommandLine|contains: '.vbs'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: What process spawned the alerting process, and is that parent chain expected for this activity?
  context: >-
    The parent reveals how the command was invoked. An Office application, mshta.exe, an email client, or a browser
    spawning a script host is the parent profile associated with delivered VBScript payloads; explorer.exe, a management
    agent, or a scheduled-task host is the profile of user-driven or automated administration. For the export branch, a
    remote-execution service or a shell spawned by a lateral-movement mechanism carries different weight than a console
    session on an administrative workstation. Walk one more level up if the immediate parent is itself a generic shell.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Which processes on this host loaded the VBScript and scripting-runtime engine modules around the time of the alert?
  context: >-
    VB execution is backed by specific engine modules — `vbscript.dll` for the language engine and `scrrun.dll` for the
    scripting runtime that provides FileSystemObject and Dictionary. Their load tells you VB code actually ran, and by
    which process. A load inside a script host is expected for the script-host branch; a load inside an Office
    application, a browser, or an otherwise unrelated process indicates VB execution hosted somewhere the process command
    line would not reveal. If module-load telemetry is not collected in this environment, treat zero results as a
    visibility gap rather than evidence nothing loaded.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith:
          - \vbscript.dll
          - \scrrun.dll
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
  answer_sources:
  - process_creation
  - manual_review
- question: What child processes did the alerting process spawn afterward?
  context: >-
    The children reveal what the command actually accomplished. A script host handed a shell argument frequently spawns
    cmd.exe, powershell.exe, or a download utility; a directory export that is followed by an archiver, a copy to a
    remote share, or an upload utility indicates the exported data was staged for collection rather than reviewed
    locally. An absence of children narrows the operation to whatever the process did in its own address space.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating parent/child pairs across the surrounding window collapses routine agent and OS telemetry into a few
    high-count rows and leaves novel pairs standing out at low counts. Look for what preceded the alert and what followed
    it, and note whether the activity sits inside or outside this host's normal working and maintenance hours —
    enumeration and export run at an hour no one was working is a different picture than the same command inside a
    scheduled administrative window.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: What else did this user account do across the environment around this time?
  context: >-
    Tracking the account across all hosts in the surrounding hour shows whether the activity is confined to one endpoint
    or is one step in a sequence touching several. If the same account produced script-host execution or directory
    collection on multiple hosts, the scope is wider than the alerting host. When the alert fires under SYSTEM, a service
    principal, or a computer account, this view returns routine agent telemetry and the parent-process pivot is the
    meaningful answer instead.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did this same parent-driven pattern fire on other hosts in the same window — is this an automation rollout, or
    is the activity isolated to this host?
  context: >-
    Under a service principal, asking what else the user did returns agent-telemetry noise, since every host runs
    SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism produced the rule's
    pattern elsewhere: this query mirrors the rule's selection structure scoped to the alerting parent process,
    fleet-wide, in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single
    host points to a host-local trigger.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cscript:
        Image|endswith: \cscript.exe
        CommandLine|contains: '.vbs /shell '
      selection_csvde:
        CommandLine|contains|all:
        - csvde -f C:\windows\web\
        - .log
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Has this user account previously produced the rule's pattern, and does that history fit their role?
  context: >-
    This query mirrors the rule's selection structure scoped to the alerting account, so the result is that account's
    90-day history of this specific firing pattern rather than generic use of a script host, aggregated by host. An
    account with a steady prior history of directory exports is likely an identity-administration or audit role; an
    account producing the pattern for the first time is the deviation worth chasing. Weigh the count against what the
    account's role is supposed to involve.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cscript:
        Image|endswith: \cscript.exe
        CommandLine|contains: '.vbs /shell '
      selection_csvde:
        CommandLine|contains|all:
        - csvde -f C:\windows\web\
        - .log
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Has this parent process historically driven the rule's pattern here or across the environment, or is the parent
    new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute the behavior and the launch
    mechanism is the meaningful pivot. This query mirrors the rule's selection structure scoped to the alerting parent
    process, so the result is the 90-day history of that parent driving this specific pattern rather than generic
    parent-and-binary co-occurrence. A new or rare parent for this pattern is the deviation worth chasing; a parent
    already accounting for thousands of prior events is vendor or OS automation.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cscript:
        Image|endswith: \cscript.exe
        CommandLine|contains: '.vbs /shell '
      selection_csvde:
        CommandLine|contains|all:
        - csvde -f C:\windows\web\
        - .log
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and
    does the current alert fit?
  context: >-
    This query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution
    reflects how the rule's specific firing pattern has historically run here rather than generic script-host usage. A
    new parent process, an unexpected account, or a first-ever appearance of the pattern on this host is the anomaly
    worth chasing. A stable, repeating parent and user combination points at an existing script or scheduled job that can
    be identified and confirmed.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cscript:
        Image|endswith: \cscript.exe
        CommandLine|contains: '.vbs /shell '
      selection_csvde:
        CommandLine|contains|all:
        - csvde -f C:\windows\web\
        - .log
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent
    automation or one-off activity?
  context: >-
    This query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the
    rule's firing pattern rather than the generic footprint of a script host. Many hosts firing the same pattern points
    to scripted deployment or vendor automation that can be identified once and tuned; one host, or a small unrelated
    set, points to manual operator activity. Use the host distribution to calibrate how far the response has to reach.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cscript:
        Image|endswith: \cscript.exe
        CommandLine|contains: '.vbs /shell '
      selection_csvde:
        CommandLine|contains|all:
        - csvde -f C:\windows\web\
        - .log
      condition: 1 of selection_*
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host help reconstruct how the operator arrived here. Remote-execution, credential-access,
    or defense-tampering detections preceding script-host execution or directory collection place this event in the middle
    of a sequence rather than at its start, which changes both the timeline to reconstruct and the hosts that need to be
    checked.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
