name: Uncommon One Time Only Scheduled Task At 00:00
id: 3f8a1c2e-6b4d-4e9a-9c7f-2a5d8e1b0f43
description: |
  Detects creation of a scheduled task via schtasks.exe whose command line schedules a one-time-only run at 00:00 (midnight) and whose action invokes a script host or proxy-execution binary (wscript, cscript, vbscript, wmic, regsvr32, powershell) or references an AppData path. The rule fires only when all three conditions hold together: the schtasks.exe binary, the suspicious action keyword, and the once + 00:00 timing pattern. A one-time task at midnight is unusual outside legitimate offline-maintenance windows; the same pattern is used to detonate a payload at a fixed time while blending into normal task-scheduler activity. Determine what command the task runs, whether the task is still registered, whether it has already executed, and whether the user, host, and timing are consistent with sanctioned administrative change.
type: detection
detection_id: 970823b7-273b-460a-8afc-3a6811998529
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the schtasks command line schedule a one-time task at 00:00 that runs a script host or proxy-execution binary?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when all three conditions are present together in one schtasks.exe invocation. Those conditions are the once and 00:00 timing keywords, a suspicious action keyword (wscript, cscript, vbscript, wmic, regsvr32, powershell, or an AppData path), and the schtasks binary name or OriginalFileName. Verify the exact command line shows all three before proceeding.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to create scheduled tasks that run script hosts or proxy-execution binaries at midnight?
  context: Legitimate administrative activity can trigger this detection. Knowing whether the user role and host function routinely involve scheduling maintenance tasks helps distinguish a sanctioned change from an attacker establishing timed execution. A one-time midnight task on a workstation by a non-administrative user is harder to explain than the same task on a server during a known maintenance build.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Was there a change ticket, maintenance window, or documented approval for this scheduled task?
  context: Many organizations require change tickets for persistence mechanisms such as scheduled tasks. A corresponding ticket suggests authorized maintenance; absence of one when policy requires it suggests the task was created outside sanctioned process. This check can quickly close a false positive or escalate a true positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What scheduled task was created, and what command does it execute? Identify the task name, the run command, and the schedule.
  context: The schtasks command line contains the task name (/TN), the command or program to execute (/TR), and the schedule (/SC once /ST 00:00). The /TR value reveals the persistence payload, frequently a script host invocation, a regsvr32 or wmic proxy-execution call, or a binary dropped under an AppData path. Read each argument to determine exactly what will run at the scheduled time.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the task's run command (/TR) encoded or obfuscated, and what does the decoded content do?
  context: The action embedded in the /TR argument is the operator's payload and is often hidden from casual inspection. Look for base64 (powershell -EncodedCommand), character concatenation in VBScript or JScript run via wscript/cscript, regsvr32 scriptlet URLs, or wmic process-call invocations. Decoding reveals the actual intent, such as a download cradle, a reverse shell, or an in-memory loader. Iterate decoding until the payload is readable.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does a task-registration record exist in the Security log for this host around the alert time, and what task name and author does it show?
  context: Scheduled-task creation is also recorded natively when task-creation auditing is enabled, capturing the task name, the registering account, and the task content independently of the process_creation event. This corroborates the schtasks command line and surfaces the registering account even when the command-line view is incomplete. If task-registration auditing is not enabled in this environment, treat the absence of a record as a visibility gap rather than evidence the task was not created.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4698
          - 4702
      condition: selection
    fields:
      - TaskName
      - SubjectUserName
- question: Were scheduled-task registry keys written on this host around the alert time, and do they correspond to the alerting task?
  context: Registering a scheduled task writes the task definition into the Task Scheduler registry tree (the Tasks and Tree keys under Schedule\TaskCache). These registry writes persist the task and can reveal a task that was created through an API or removed from the on-disk task store. Correlate the written key paths with the task name from the command line to confirm the task is materially registered, not just attempted.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\'
      condition: selection
    fields:
      - TargetObject
      - Image
- question: When is the task scheduled to run, and has the payload already executed?
  context: A one-time task set for 00:00 fires at the next midnight, so the payload may not have run yet at alert time, or it may have already executed if the alert was reviewed after midnight. Scheduled tasks execute as children of the Task Scheduler service. Checking process creation under the scheduler after the task creation reveals whether the payload ran and what it spawned.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\svchost.exe'
        ParentCommandLine|contains: 'Schedule'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is the scheduled task still registered on the system?
  context: Persistence is only effective if the task still exists, and some operators delete a task after it executes to reduce forensic artifacts. Confirming the task is still present on the host determines whether the mechanism is active and requires remediation, or whether it has already run and been cleaned up. Verify the specific task name from the command line directly on the host or via endpoint tooling.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: When this host has previously fired this midnight one-time-task pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even routine maintenance can produce midnight tasks. This query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern has historically run here rather than generic schtasks usage. A new parent process, an unexpected account, or a first-time appearance of the pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|contains: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_cli:
        CommandLine|contains:
        - wscript
        - vbscript
        - cscript
        - 'wmic '
        - wmic.exe
        - regsvr32.exe
        - powershell
        - \AppData\
      selection_time:
        CommandLine|contains|all:
        - once
        - 00:00
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this midnight one-time-task pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this specific firing pattern rather than generic schtasks usage. Many hosts firing the same pattern points to scripted deployment or vendor automation; a single host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|contains: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_cli:
        CommandLine|contains:
        - wscript
        - vbscript
        - cscript
        - 'wmic '
        - wmic.exe
        - regsvr32.exe
        - powershell
        - \AppData\
      selection_time:
        CommandLine|contains|all:
        - once
        - 00:00
      condition: all of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|contains: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_cli:
        CommandLine|contains:
        - wscript
        - vbscript
        - cscript
        - 'wmic '
        - wmic.exe
        - regsvr32.exe
        - powershell
        - \AppData\
      selection_time:
        CommandLine|contains|all:
        - once
        - 00:00
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|contains: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_cli:
        CommandLine|contains:
        - wscript
        - vbscript
        - cscript
        - 'wmic '
        - wmic.exe
        - regsvr32.exe
        - powershell
        - \AppData\
      selection_time:
        CommandLine|contains|all:
        - once
        - 00:00
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user created similar tasks or ran tooling on other hosts in the same window, the scope of the activity may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|contains: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_cli:
        CommandLine|contains:
        - wscript
        - vbscript
        - cscript
        - 'wmic '
        - wmic.exe
        - regsvr32.exe
        - powershell
        - \AppData\
      selection_time:
        CommandLine|contains|all:
        - once
        - 00:00
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Was schtasks.exe executed from its expected System32 path?
  context: A binary running from a non-standard path (outside System32 or SysWOW64) may have been copied or renamed to evade path-based allowlists or to masquerade as a system utility. The detection matches on the Image name and OriginalFileName, so a renamed copy could still fire; confirming the on-disk path and original filename distinguishes the genuine system utility from a relocated copy.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Were other proxy-execution or script-host LOLBins used on this host recently for the same objective?
  context: The task's action invokes a script host or proxy-execution binary, and operators who use one such binary often use several. Finding regsvr32, mshta, rundll32, wmic, or similar binaries performing related actions on the host around the same time strengthens the case that the scheduled task is part of an execution chain rather than an isolated maintenance entry.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\rundll32.exe'
          - '\wmic.exe'
          - '\wscript.exe'
          - '\cscript.exe'
          - '\msbuild.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations such as the Startup folder or scheduled-task definition paths on this host?
  context: File-based persistence bypasses command-line detection entirely. Dropping an executable or script into a Startup folder or a path referenced by a registry Run key achieves persistence without invoking schtasks at all. Operators frequently stack a scheduled task with a parallel file-drop mechanism, so checking for drops in the same window reveals whether this is part of a broader persistence effort.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
