name: Installation of TeamViewer Desktop
id: dc318194-a363-463c-82f6-45033ab2ff06
description: |
  Detects creation of TeamViewer_Desktop.exe, the main component dropped when the TeamViewer
  remote-desktop tool is installed. TeamViewer is legitimate remote-support software, so this event
  is routine when IT deploys or a user installs it for sanctioned support; it is also a common
  adversary move, since remote access and remote monitoring tools are frequently installed
  post-compromise as an alternate command-and-control channel and are often permitted by application
  control because they are used for real support work. Installers of this kind typically register a
  Windows service for persistence and establish a long-lived outbound connection to vendor
  infrastructure. Investigate whether the tool is authorized on this host, what process installed it
  and from where, whether it was executed and began beaconing, whether it spawned interactive child
  processes, whether it established persistence, and how widely the same activity appears.
type: detection
detection_id: 9711de76-5d4f-4c50-a94f-21e4e8f8384d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the created file match the TeamViewer_Desktop.exe path this rule detects?
  context: >-
    Before investing investigation time, confirm the alert is a true positive by reviewing the exact
    file path, the operation performed (created, renamed, or deleted), and the responsible process
    against the rule's criteria. The rule fires when a file whose path ends in \TeamViewer_Desktop.exe
    is written, which corresponds to the TeamViewer remote-desktop component landing on disk. Confirm
    the path and the writing process before continuing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to install remote access software?
  context: >-
    Sanctioned IT deployment or a user installing an approved support tool can trigger this detection.
    Knowing whether the account and host function are consistent with installing remote-desktop
    software is often the fastest way to separate routine deployment from an attacker-staged or
    shadow-IT install. User attribution is present on roughly 94% of endpoint file events; when it is a
    machine account or missing, judge by the writing process and the host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is TeamViewer on the organization's approved remote access software list?
  context: >-
    Organizations typically sanction a specific set of remote-support tools and treat the rest as
    unexpected. Any remote access or remote monitoring tool not on the approved list, even well-known
    commercial software like TeamViewer, may represent shadow IT or attacker-deployed persistent
    access, and should be checked regardless of the tool's reputation because application control often
    permits these tools by default.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a current helpdesk ticket or support session that explains this TeamViewer install?
  context: >-
    Legitimate remote-support installs usually correlate with an active support ticket, a scheduled
    maintenance window, or a user request. If no support context exists for this host at this time, the
    tool may have been installed by an actor for persistent access or by a user circumventing controls.
    Match the install time against change and support records.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this the genuine TeamViewer binary, or a renamed or trojanized file using the same name?
  context: >-
    The filename alone does not prove the file is the real tool. Confirm the identity of the dropped
    file by checking its size, digital signature and signer, version resource, and embedded strings
    against a known-good TeamViewer_Desktop.exe. A binary carrying this name but unsigned, signed by an
    unexpected party, or of anomalous size may be a decoy or a repackaged payload rather than the
    vendor's software; retrieve the file from its on-disk path for this comparison.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If this binary has executed, what is its hash and does it have known threat-intel detections?
  context: >-
    A file's hash is recorded when it runs, not when it is written, so file-creation events carry no
    hash. This query looks for the binary executing by its filename and reads its hash; submit that
    value to reputation and threat-intel sources to determine whether it is the known-good vendor
    build, a known-bad sample, or previously unseen. If the file is present but has not executed,
    retrieve it from its on-disk path and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
- question: What process created TeamViewer_Desktop.exe, and what launched that process?
  context: >-
    The file event carries the writing process's identifiers, so pivot by its process GUID to read the
    installer's own image, full command line, and parent. A signed vendor installer or msiexec launched
    interactively by explorer.exe fits a normal deployment; a copy dropped by a script host, a browser,
    an archive tool, or an unsigned binary, or one installing from a user-writable or temporary path
    rather than a standard program directory, points to the tool being staged programmatically. The
    install path and parent chain distinguish a sanctioned rollout from an attacker-driven drop.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Is the file still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives both urgency and next steps. A binary still on disk can be
    retrieved, hashed, and analyzed; one deleted or renamed shortly after creation suggests a staging
    step, an aborted install, or cleanup, and shifts the investigation toward what executed in between.
    Read the operation type to see whether the file persisted, was replaced, or was removed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was TeamViewer_Desktop.exe executed after it was created, and with what command line?
  context: >-
    An installed remote-desktop binary only becomes an access channel once it runs. Correlating the
    file creation to a later execution on the same host reveals whether the tool progressed from
    delivery to running, and how soon. The launch command line can show unattended or silent-mode
    switches and assigned identifiers, which distinguish an interactive user launch from an automated
    or scripted start. A short gap between install and execution is consistent with hands-on operation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
- question: Did the TeamViewer binary spawn interactive child processes such as command shells?
  context: >-
    Once a remote session is active, an operator can drive interactive control through the tool,
    which surfaces as command interpreters, script hosts, or file-management utilities spawned as
    children of the remote-desktop process. Legitimate remote support may open a shell during a
    sanctioned session, so weigh these children against whether an approved support session was
    running. cmd.exe, powershell.exe, or reconnaissance utilities launched under this parent point to
    interactive use of the channel rather than passive installation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: What external endpoints did the TeamViewer binary connect to after it ran?
  context: >-
    Remote-desktop tools establish outbound sessions to vendor relay servers or cloud infrastructure.
    Connections to the vendor's own infrastructure are expected for a sanctioned install, while
    connections to unfamiliar addresses or unrelated hosting suggest the tool is pointed at
    attacker-controlled relay infrastructure. These tools use configurable or non-standard high ports
    in addition to their defaults, so evaluate the destination address and hosting rather than the port
    alone; sustained long-lived sessions are the beaconing pattern to look for.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: Was a Windows service or autorun entry created for the remote access tool on this host?
  context: >-
    Remote monitoring and management installers typically register a Windows service so the tool
    survives reboot and runs without a logged-on user, and attacker-deployed variants may instead use
    Run or RunOnce autorun keys. Registry writes to a service key named for the tool or to a
    Run/RunOnce location around the install time indicate persistence was established. A service that
    starts automatically is what keeps a remote access channel available across reboots; confirm the
    entry against the expected install behavior for an approved deployment.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        TargetObject|contains:
          - '\Services\TeamViewer'
          - '\CurrentVersion\Run'
          - '\CurrentVersion\RunOnce'
      condition: selection and selection_persist
    fields:
      - TargetObject
      - Details
      - Image
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    An installer drops many files, so the breadth, paths, and extensions of the writing process's other
    file activity distinguish a normal multi-file install landing under a standard program directory
    from a payload staging output in unusual locations. Enumerate what else the process wrote to see
    whether this is a routine software install or a drop that also placed helpers, scripts, or
    configuration in user-writable or temporary paths.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- always_include: true
  question: Has this user installed TeamViewer before, and does that history fit their role?
  context: >-
    The query mirrors the rule's pattern scoped to this user, returning the user's 90-day history of
    producing this specific TeamViewer install event, aggregated by host. A user who has never
    installed this tool before is more notable than one who does so as part of their role, such as an
    IT support technician. Weigh the count and the hosts against whether installing remote-support
    software is part of this account's normal duties.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith: \TeamViewer_Desktop.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this install pattern here or across the environment, or is it new?
  context: >-
    When the install fires under a service or machine account, user identity does not attribute the
    action, so the meaningful pivot is the launch mechanism. The query mirrors the rule's pattern scoped
    to the writing process's program, returning the 90-day history of that program producing this
    TeamViewer install, aggregated by host. A program that already accounts for many prior installs is
    deployment or management automation; a new or rare program for this activity is the deviation worth
    chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith: \TeamViewer_Desktop.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the environment around the time of the install?
  context: >-
    Tracking the user's activity across all hosts in a tight window reveals whether the install is
    isolated or part of broader hands-on activity, such as installing the same tool on several
    endpoints or running other tooling. If the same account drove similar activity on multiple hosts,
    the scope may be larger than this one install. When the alert fires under a service or machine
    account, this user-scoped view returns routine agent telemetry and the parent-driven fleet view is
    the meaningful pivot instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did the same program-driven install pattern fire on other hosts in the same window?
  context: >-
    Under a service or machine account, asking what else the user did returns agent-telemetry noise, so
    the meaningful question is whether the same launch mechanism installed the tool elsewhere. The query
    mirrors the rule's pattern scoped to the writing program, fleet-wide, in the alert window. Multiple
    hosts in the same window points to a scheduled or pushed rollout; a single host points to a
    host-local trigger such as a hands-on operator or a one-off user install.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith: \TeamViewer_Desktop.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this install?
  context: >-
    Installing a remote access tool is often a means to an end rather than an isolated event. Earlier
    detections on the same host, such as initial execution, defense tampering, credential access, or
    reconnaissance, may reveal the stages that preceded the install and help place it within a larger
    sequence. A remote access channel established after prior suspicious activity carries more weight
    than one appearing on an otherwise quiet host.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
