name: Periodic Backup For System Registry Hives Enabled
id: df3b4aa9-c00e-4c22-ae9d-e35474712e07
description: |
  Detects a registry write that sets the EnablePeriodicBackup DWORD (under
  \Control\Session Manager\Configuration Manager) to 1. Enabling this value tells Windows to copy the
  system registry hives to C:\Windows\System32\config\RegBack on restart and to create a RegIdleBackup
  scheduled task for later backups. Automatic periodic backup has been off by default since Windows 10
  version 1803, so an explicit enable is deliberate. Legitimate uses exist (administrators recovering
  the legacy backup behavior), but the security concern is that RegBack produces readable copies of the
  otherwise-locked SAM, SECURITY, and SYSTEM hives, which contain password hashes and the boot key and
  can be extracted offline. Investigate what set the value and how, whether RegBack was subsequently
  populated, whether the backed-up hives were read, copied, or exfiltrated, and whether the value was
  reverted afterward.
type: detection
detection_id: 973ef012-8f1a-4c40-93b4-7e659a5cd17f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting registry write set EnablePeriodicBackup to the enable value (DWORD 1)?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a
    value whose path ends in \Control\Session Manager\Configuration Manager\EnablePeriodicBackup is
    written AND the data is DWORD (0x00000001), which turns the legacy periodic hive backup on. Review
    the exact TargetObject and Details on the triggering event to confirm both the value name and the
    enable data. Automatic backup to RegBack has been disabled by default since Windows 10 version 1803,
    so an explicit enable is a deliberate configuration change.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to enable periodic registry-hive backup?
  context: >-
    Re-enabling RegBack is an uncommon administrative or troubleshooting action, so knowing whether the
    writing account and host function match any sanctioned change is the fastest way to separate a
    legitimate recovery action from credential staging. User attribution is present on roughly 94% of
    endpoint registry events; when it is a machine account or SYSTEM, pivot on the writing process
    (Image) instead, since service-driven and scripted writes frequently run under a non-interactive
    principal.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Why is enabling EnablePeriodicBackup a security-relevant change?
  context: >-
    Setting this DWORD to 1 makes Windows copy the system registry hives (SAM, SECURITY, SYSTEM,
    SOFTWARE, DEFAULT) into C:\Windows\System32\config\RegBack on the next restart and registers a
    RegIdleBackup scheduled task to maintain them. The live hives are normally locked, so readable
    backup copies give offline access to credential material: SAM and SECURITY hold password hashes and
    cached secrets, and SYSTEM holds the boot key needed to decrypt them. Confirming the key path and
    writing process establishes whether this is a genuine backup need or the setup step for offline
    credential extraction.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What data was written to the value, and does it enable or disable periodic backup?
  context: >-
    The Details field is a DWORD flag: 0x00000001 turns periodic hive backup on and 0x00000000 turns it
    off. Confirm the written data is the enable value rather than a reset to disabled, and note the side
    effect the enable triggers - a RegIdleBackup scheduled task under \Microsoft\Windows\Registry that
    manages subsequent backups on restart and idle. Details is populated on roughly 79% of registry
    modifications and should be present for this DWORD value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What process set this value, and what launched it?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to read
    its Image, full command, and parent. A reg.exe add, a PowerShell Set-ItemProperty, or a Group Policy
    client-side extension writing this value looks different from a script host such as wscript.exe or
    mshta.exe, or an unsigned binary, making the change. The parent chain distinguishes a deliberate
    administrator or management action from a programmatically staged change.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: After this change, were the system hive files written to the RegBack folder?
  context: >-
    The enable takes effect on the next restart, when Windows writes copies of the hives into
    C:\Windows\System32\config\RegBack and the RegIdleBackup task manages later backups. File creations
    under the config\RegBack path confirm the readable hive copies now exist on disk, which is the
    precondition for offline credential extraction. Absence over the window may mean no restart has
    occurred yet, so the value remaining enabled still leaves the backup primed.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\config\RegBack\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did any process read or copy the backed-up registry hives after the backup ran?
  context: >-
    The SAM, SECURITY, and SYSTEM copies in RegBack hold the password hashes, cached secrets, and boot
    key. A process whose command line references the RegBack path - a file copy, reg save, esentutl, or a
    collection utility - is the credential-collection step that turns the readable backups into a
    portable credential set. The command line reveals which hives were targeted and where they were
    written.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
          - '\config\RegBack'
          - '\RegBack\'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: Were copies of the registry hive files created outside the RegBack folder?
  context: >-
    Staging for exfiltration typically duplicates the hive files into a working directory, user profile,
    or share. File writes producing SAM-, SECURITY-, or SYSTEM-named files anywhere other than the
    config\RegBack path indicate the backups were copied out for collection rather than left in place.
    Compare the destination path and writing process to judge whether the copies were staged for removal.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith:
          - '\SAM'
          - '\SECURITY'
          - '\SYSTEM'
      filter_regback:
        TargetFilename|contains: '\config\RegBack\'
      condition: selection and not filter_regback
    fields:
      - TargetFilename
      - Image
- question: Were archiving or encryption tools run on this host that could package the collected hive data?
  context: >-
    Before exfiltration, collected hives are often compressed and password-protected so their contents
    resist inspection. Archive or encryption invocations near the change - rar, 7z, or gpg, especially
    with password or header-encryption flags - suggest the copied hives were packaged for removal.
    Password or header encryption on an archive of hive files is a stronger indication of deliberate
    credential theft than an unprotected copy.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_pkg:
      - Image|endswith:
          - '\rar.exe'
          - '\7z.exe'
          - '\7za.exe'
          - '\gpg.exe'
      - CommandLine|contains:
          - ' -hp'
          - ' -p'
          - '--passphrase'
          - '-mhe'
      condition: selection and selection_pkg
    fields:
      - Image
      - CommandLine
- question: Was the EnablePeriodicBackup value later changed again on this host?
  context: >-
    Registry key or value deletions are not observable in this telemetry, so durability is judged from
    the value's re-modification history rather than from a delete event. A later write flipping the DWORD
    back to 0 shortly after readable hives were obtained can indicate cleanup to hide the change, while
    the value remaining 1 leaves periodic hive backup active for future restarts. Compare the Details
    values written to this key over the following window.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Has this value been modified before on this host?
  context: >-
    EnablePeriodicBackup should change rarely and only through deliberate action, so a history with no
    prior writes makes this a first-time enable and raises its weight. A pattern of periodic writes to
    the same value points instead to a management or configuration process. Compare the historical
    Details values to see whether the enable data was set before or whether this is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this value enabled on other hosts in the environment?
  context: >-
    The same change across many hosts suggests a Group Policy setting or a broad deployment; the same
    change confined to one host suggests a targeted action. Compare the Details values and writing
    process across hosts to see whether they all set the enable value and whether the writer is
    consistent, which separates a management-driven rollout from repeated hands-on use of the technique.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor staging credential collection often makes several changes in the same session - disabling
    protections, adjusting policy keys, or adding persistence. Clustering the registry writes on this
    host in a short window around the alert reveals the full scope of changes and which process made
    them. The triggering value appears in the results; the signal is what else was modified and by which
    process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Aggregating process activity in a tight window around the alert surfaces what led up to the change
    and what ran immediately after. Novel parent-child pairs stand out at low counts against high-count
    routine telemetry, which is what points to the tool that set the value and any collection or
    packaging actions that followed.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - credential access, reconnaissance, or defense tampering - may
    reveal the stages that preceded this change and help reconstruct the timeline. Enabling readable hive
    backups is typically a means to a credential-access end, so prior alerts help place this change
    within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
