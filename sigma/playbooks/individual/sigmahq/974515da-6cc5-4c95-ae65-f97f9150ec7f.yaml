name: Disable Microsoft Defender Firewall via Registry
id: 4e93f372-b8ee-47ce-9464-3001c7777a5f
description: |
  Detects a registry write that disables the Microsoft Defender Firewall for a profile by
  setting an EnableFirewall value to 0 (DWORD 0x00000000) under
  HKLM\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy. The rule
  fires when the TargetObject path contains the FirewallPolicy key AND ends in \EnableFirewall
  AND the written value data is DWORD (0x00000000), which turns the host firewall off for the
  domain, private, or public profile. Legitimate changes usually come from a management agent,
  a Group Policy push, or an administrator during a sanctioned change; malicious use disables
  the firewall to open the host to inbound access, enable command-and-control, or clear the way
  for lateral movement and exfiltration. Investigate which profile was disabled, which process
  and account made the change and what launched it, whether the firewall is still off, whether
  new connectivity to sensitive service ports followed, and whether other defense tampering or
  configuration changes happened in the same session.
type: detection
detection_id: 974515da-6cc5-4c95-ae65-f97f9150ec7f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting registry write set a firewall EnableFirewall value to 0 (DWORD 0x00000000)?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires
    when a TargetObject under
    HKLM\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy ends in
    \EnableFirewall AND the written Details data is DWORD (0x00000000). Review the exact
    TargetObject and Details on the triggering event to confirm the firewall was set to disabled
    rather than to any other value. The final path segment before \EnableFirewall names the
    profile that was turned off (DomainProfile, StandardProfile for private, or PublicProfile).
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify Microsoft Defender Firewall policy?
  context: >-
    Host firewall settings are normally changed by a management agent, a Group Policy client, or
    an administrator during a sanctioned change window, not by an ordinary user or an unexpected
    account. Knowing whether the writing account and host function match a known administrator or
    an approved maintenance window is often the fastest way to separate routine administration
    from tampering. User attribution is present on roughly 94% of endpoint registry events; when
    it is a machine account or SYSTEM, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which firewall profile's EnableFirewall value was modified, and why is this key a security-relevant location?
  context: >-
    The FirewallPolicy subtree holds the on/off state for each firewall profile, so the exact
    path names what was affected: DomainProfile\EnableFirewall, StandardProfile\EnableFirewall
    (the private profile), or PublicProfile\EnableFirewall. A value of 0 disables the firewall
    for that profile; the public profile is the most exposed on untrusted networks. Confirming
    the precise key and the writing process establishes that this is host firewall tampering
    rather than an unrelated SharedAccess edit.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value data was written to the EnableFirewall key, and does it disable the firewall?
  context: >-
    For these firewall keys the Details field is a DWORD; 0 (0x00000000) turns the profile's
    firewall off and 1 turns it on. Confirm the written value is 0 to establish the firewall was
    disabled rather than re-enabled or set to another state. Details is present on roughly 79% of
    registry modifications and should be populated for this DWORD value; if it is absent, judge
    the change from the key path and the writing process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Which firewall profile was disabled and what command performed the change?
  context: >-
    The registry event names the profile, and the writing process's command line reveals how the
    change was made - reg.exe writing EnableFirewall directly, a PowerShell Set-ItemProperty or
    Set-NetFirewallProfile call, or netsh advfirewall. Identifying the specific profile and the
    method determines impact and remediation: disabling the public profile exposes the host on
    untrusted networks, while disabling all three removes host firewalling entirely. Whether the
    change was scoped to one profile or widened across profiles matters for how much exposure was
    introduced.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process wrote this value, and what launched that process?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to
    read its Image, full command, and parent. A firewall-disable driven by a management agent, a
    Group Policy client, or an administrative console has an expected parent lineage; the same
    write launched from an Office application, a script host such as wscript.exe or mshta.exe, or
    an unsigned binary points to tampering staged programmatically. The parent chain distinguishes
    a sanctioned configuration change from a scripted or hands-on one.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Is the Microsoft Defender Firewall currently restored, or is the host still unprotected?
  context: >-
    Tampering may be temporary (for a specific action) or left in place. Checking the current
    state of the affected firewall profile reveals whether the host remains exposed. If the
    firewall is still off for any profile, that profile should be re-enabled before further
    investigation. Current state is best confirmed from the endpoint's firewall status or the
    management console; the query re-displays the change command for reference.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: After this write, was the firewall re-enabled or was the value changed again on this host?
  context: >-
    Registry key or value deletions are not observable in this telemetry, so durability is judged
    from the key's re-modification history rather than from a delete event. A later write that
    sets EnableFirewall back to 1 indicates the firewall was re-enabled - either by an
    administrator undoing the change or by an attacker briefly disabling it for one action - while
    the value staying at 0 leaves the profile unprotected. Compare the Details values written to
    this key over the following window to see whether the firewall was restored.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: After the firewall was disabled, did new connections to sensitive service ports appear on this host?
  context: >-
    Disabling the host firewall is a means to an end: it opens the host to inbound access and
    removes a control on outbound traffic. Connections to sensitive service ports shortly after
    the change - RDP (3389), SMB (445), WinRM (5985/5986), or SSH (22) - that are inconsistent
    with normal administration point to the exposure being used for remote access or lateral
    movement. The direction field distinguishes new inbound connections reaching this host from
    outbound connections it initiated. If no such connections appear, the disable may be a
    precursor still waiting to be used.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: What activity occurred on this host after the firewall was disabled?
  context: >-
    A firewall is disabled to enable something that would otherwise be blocked or noticed -
    inbound remote access, tool download, credential access, or lateral movement. Aggregating
    process activity in the window after the change surfaces what the disable enabled. Novel
    binaries or parent-child pairs appearing shortly after the firewall went off are the activity
    to focus on; correlate them with the new connectivity to sensitive ports.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense tampering actions performed on this host?
  context: >-
    An actor who disables the firewall often disables several controls in the same operation -
    stopping the firewall service, turning off Defender real-time monitoring, clearing event logs,
    or deleting shadow copies - to maximize coverage. Finding multiple tampering commands from the
    same user or parent process near this change indicates a deliberate defense-impairment step
    rather than an isolated firewall edit. The query excludes the firewall registry write itself
    to surface the other tampering.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Were other registry modifications made on this host in the same window?
  context: >-
    An actor who disables the firewall by registry often makes other configuration changes in the
    same session - additional firewall or SharedAccess edits, Defender policy keys, or persistence
    keys such as Run/RunOnce or Services. Clustering the registry writes on this host in a short
    window around the alert reveals the full scope of changes and which process made them. The
    triggering key appears in the results; the signal is what else was modified and by which
    process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Firewall tampering rarely happens in isolation. Aggregating process activity in a tight window
    around the alert surfaces what led up to the registry change and what ran immediately after.
    Novel parent-child pairs stand out at low counts against high-count routine telemetry, which
    is what points to the tool that made the change and any follow-on actions taken once the
    firewall was off.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Has this firewall EnableFirewall key been modified before on this host?
  context: >-
    Firewall profile state should change rarely and only through deliberate action, so a history
    with no prior writes makes this a first-time change and raises its weight. A history of
    periodic writes - for example a management agent that reasserts firewall policy on a schedule -
    points instead to routine configuration. Compare the historical Details values to see whether
    the firewall has been toggled here before or whether this disable is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same firewall key disabled on other hosts in the environment?
  context: >-
    The same EnableFirewall=0 write across many hosts suggests a Group Policy change or a broad
    tool run; the same write confined to one host suggests a targeted action. Compare the Details
    values and writing process across hosts to see whether they all disable the firewall and
    whether one management process is responsible, which separates a fleet-wide policy change from
    hands-on tampering on a single host.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, execution of scripting tools, or other
    defense tampering - may reveal the stages that preceded the firewall change and help
    reconstruct the timeline. Disabling the firewall is typically a step within a larger operation,
    so prior alerts help place this change in sequence and indicate how far the activity has
    progressed.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Disabling the firewall to enable remote access is frequently paired with establishing a
    foothold. Scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions
    created by schtasks.exe, sc.exe, reg.exe, bitsadmin.exe, or wmic.exe near the firewall change
    indicate the tampering was part of a broader intrusion rather than an isolated configuration
    edit.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
