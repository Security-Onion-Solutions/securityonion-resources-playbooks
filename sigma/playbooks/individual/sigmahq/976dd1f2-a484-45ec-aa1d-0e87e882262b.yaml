name: Potential Persistence Via CHM Helper DLL
id: dca71cc5-b146-407b-b71f-af3b3b97cef8
description: |
  Detects a registry write to the HtmlHelp Author "Location" value under
  Software\Microsoft\HtmlHelp Author (or the WOW6432Node view of the same key). The value
  data is a path to a DLL that Windows help infrastructure loads whenever an old-style
  compiled HTML help (.chm) file is opened, which makes writing this key a user-initiated,
  non-destructive persistence mechanism: the planted DLL runs in the context of the process
  that opens the help file. Legitimate software rarely touches this key, so investigate which
  DLL path was written, which process wrote it and what launched that process, whether the
  referenced DLL was dropped on disk, whether the help viewer subsequently ran and loaded it,
  and whether the value was later reverted or re-modified.
type: detection
detection_id: 976dd1f2-a484-45ec-aa1d-0e87e882262b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting registry write set the HtmlHelp Author "Location" value under the Software\Microsoft or WOW6432Node key?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a
    value whose path contains \Software\Microsoft\HtmlHelp Author\Location or its
    \Software\WOW6432Node\Microsoft\HtmlHelp Author\Location equivalent is written. Review the exact
    TargetObject and the value data on the triggering event to confirm this is the HtmlHelp Author
    Location value and not an unrelated key. On a clean host this key is essentially never written, so
    any value here is the setup step of the CHM helper DLL persistence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify the HtmlHelp Author "Location" registry value?
  context: >-
    The HtmlHelp Author Location value has no routine reason to change through normal software use, so
    knowing whether the writing account and host function match any sanctioned change is the fastest way
    to separate testing or administrative activity from persistence being staged. User attribution is
    present on roughly 94% of endpoint registry events; when it is a machine account or missing, pivot
    on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which HtmlHelp Author value was written, and why is this key a code-execution persistence location?
  context: >-
    The Location value under Software\Microsoft\HtmlHelp Author holds a DLL path that the help
    infrastructure loads whenever an old-style compiled HTML help (.chm) file is opened. A DLL planted
    here therefore runs in the context of the process that opens the help file, without any scheduled
    task, service, or Run key. Confirming the exact key path and the writing process establishes that
    this is the CHM helper DLL location rather than an unrelated edit, and sets up decoding the DLL path
    written into the value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What DLL path was written to the HtmlHelp Author "Location" value?
  context: >-
    The Details field holds the DLL path that will be loaded when a .chm file is opened. Read it: a path
    into a user-writable or temporary location (AppData, Temp, ProgramData, a user profile) or a
    filename that does not correspond to a known product component points to a planted payload rather
    than a legitimate help component. That path becomes a lead for confirming whether the DLL exists on
    disk and whether it was loaded. Details is present on roughly 79% of registry modifications and
    should be populated for this string value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote this value, and what launched that process?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to read
    its Image, full command, and parent. A reg.exe, powershell.exe, or cmd.exe write launched from an
    Office application, a script host such as wscript.exe or mshta.exe, a browser, or an unsigned binary
    points to persistence being staged programmatically rather than a deliberate administrator edit. The
    parent chain distinguishes a scripted implant from an interactive console action.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: After this write, did the compiled HTML help viewer run on this host, which would load the configured DLL?
  context: >-
    The persistence is user-initiated: the planted DLL loads only when a .chm file is opened through the
    help viewer (hh.exe). Execution of hh.exe on this host after the registry write is the point at which
    the configured DLL would be loaded and the payload would run. The trigger is user-driven and may
    happen well after the write, so the window is deliberately wide; absence of hh.exe execution means
    the persistence is primed but has not yet fired.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\hh.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is the DLL referenced by the Location value present on disk, dropped by the writing process or its children?
  context: >-
    The persistence is only effective if the DLL named in the Location value actually exists at that path.
    Correlating file activity by the registry-writing process and its children surfaces whether that
    process wrote the referenced DLL in the same session, which confirms the mechanism is armed and
    identifies the payload on disk. The file-write event carries no hash; if the DLL is present, hash it
    from a later execution or retrieve it for a reputation lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: After this write, was the Location value reverted to a benign path or changed again?
  context: >-
    Registry key or value deletions are not observable in this telemetry, so durability is judged from
    the value's re-modification history rather than from a delete event. A later write that changes the
    Location value back to an empty or legitimate path indicates the entry was cleaned up, while the value
    remaining a path to a suspicious DLL leaves the persistence primed to run the next time a .chm file is
    opened. Compare the Details values written over the following window.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor establishing persistence often makes other configuration changes in the same session -
    additional autostart keys, security policy edits, or further association hijacks. Clustering the
    registry writes on this host in a short window around the alert reveals the full scope of changes and
    which process made them. The triggering key appears in the results; the signal is what else was
    modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has the HtmlHelp Author "Location" value been modified before on this host?
  context: >-
    This value should change rarely, if ever, through normal use, so a history with no prior writes makes
    this a first-time change and raises its weight. A history of periodic writes to the same value points
    instead to a management process or a repeatedly run tool. Compare the historical Details values to see
    whether the same DLL path was set before or whether this modification is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same HtmlHelp Author value modified on other hosts in the environment?
  context: >-
    The same write across many hosts suggests a broad tool run or a mis-scoped deployment; the same write
    confined to one host suggests targeted persistence. Compare the Details values across hosts to see
    whether they all reference the same DLL path and whether the writing process is consistent, which
    separates a single hands-on operation from repeated use of the same technique across the environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Persistence writes rarely happen in isolation. Aggregating process activity in a tight window around
    the alert surfaces what led up to the registry write and what ran immediately after it. Novel
    parent-child pairs stand out at low counts against high-count routine telemetry, which is what points
    to the tool that staged the persistence and any follow-on actions taken in the same session.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, execution of scripting tools, or defense
    tampering - may reveal the stages that preceded this change and help reconstruct the timeline.
    Persistence is typically established after an initial foothold, so prior alerts help place this
    registry write within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Attackers rarely rely on a single persistence mechanism. After establishing one foothold, they
    commonly install backups using different techniques - scheduled tasks, services, registry Run keys,
    BITS jobs, or WMI subscriptions created by schtasks.exe, sc.exe, reg.exe, bitsadmin.exe, or wmic.exe.
    Multiple persistence installations in the same timeframe indicate intentional stacking rather than an
    isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely - dropping an executable or script
    into a Startup folder or a path referenced by a registry Run key achieves persistence without
    invoking schtasks, sc, or reg. File writes to these locations near the HtmlHelp Author write indicate
    the actor established a parallel persistence mechanism on disk alongside the CHM helper DLL entry.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Does the user or an administrator recall making this HtmlHelp Author change?
  context: >-
    The HtmlHelp Author Location value has no routine reason to change, so direct confirmation from the
    account owner is a fast way to resolve the alert. If a developer or an administrator testing help
    tooling set the value, that closes it; if no one recalls the action, the account may be compromised or
    the change was made by automated tooling, and the investigation should continue into the writing
    process and whether the referenced DLL landed on disk.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
