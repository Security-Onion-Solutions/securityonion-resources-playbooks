name: FakeUpdates/SocGholish Activity
id: 72d2ae15-2e69-4b51-874f-d62d6f1642a4
description: |
  This rule fires only when every condition holds together: wscript.exe is the parent, the parent command line
  references a .js file inside a .zip under \AppData\Local\Temp whose name carries a browser string (Chrome, Edge,
  Firefox, Opera, Brave, or Vivaldi), and the child process is cmd.exe, powershell.exe, or pwsh.exe. That combination
  matches the FakeUpdates/SocGholish delivery pattern and the wider drive-by technique behind it (T1189 drive-by
  compromise into T1204.002 user execution into T1059.007 JavaScript): a compromised or malicious website presents a
  fake browser or plugin update prompt, the user downloads an archive containing a script, and the script host runs it
  as a loader stage that typically precedes further tooling such as reconnaissance, a second-stage download, or
  persistence.
  The user is a participant in this chain rather than a bystander, so what the user was doing and what site they were on
  are load-bearing evidence here. Some genuine software updaters do drive script hosts, so the investigation should
  establish what started wscript.exe, where the archive came from, what the script actually fetched or executed, and
  what ran on the host afterward.
type: detection
detection_id: 97805087-93ab-4203-b5cb-287cda6aecaa
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does this event match the rule's full pattern — wscript.exe running a .js from a browser-named update archive
    in Temp, spawning a command shell?
  context: >-
    All four conditions must hold together for this rule to fire: the parent is wscript.exe, the parent command line
    contains \AppData\Local\Temp and .zip and update and .js, that same command line carries one of Chrome, Edge,
    Firefox, Opera, Brave, or Vivaldi, and the child is cmd.exe, powershell.exe, or pwsh.exe. Read the full
    ParentCommandLine and confirm each element is present before spending further time.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
  answer_sources:
  - alert
  - process_creation
- question: Was the user prompted to install a browser or plugin update around this time, and does this host use a script
    host for software updates?
  context: >-
    This technique requires the user to download and open the file, so the user's recollection is direct evidence. Ask
    what site they were on, whether an update prompt appeared, and whether they believed they were updating a browser or
    a plugin. Separately, establish whether any sanctioned updater on this host legitimately drives wscript.exe from a
    temporary directory.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - organizational_knowledge
  - manual_review
  - asset_inventory
- question: What started wscript.exe, and is that launcher consistent with a browser download the user opened?
  context: >-
    The natural lineage for this pattern is browser to download to script host. A browser as the grandparent points to
    the file being opened straight from the download prompt; explorer.exe points to the user opening it from a Downloads
    or Temp folder; an archiver process points to the .zip being extracted first. A service, scheduled task, or another
    script host as the grandparent points somewhere other than a user-driven download and changes the investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other child processes did this same wscript.exe instance spawn?
  context: >-
    A loader stage rarely launches a single shell. Other children of the same script-host instance show the rest of the
    operation - additional interpreters, native reconnaissance binaries, or copy and archive utilities. The count and
    variety of siblings distinguish a single scripted action from a staged sequence.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Retrieve the .js file named in the parent command line and read its content — what does the script fetch or
    execute?
  context: >-
    The script is the payload, and the command line only names it. Extract the .js path from the parent command line,
    recover the file from the Temp directory or the archive, and read or deobfuscate it in a safe environment. Identify
    the URLs or domains it contacts, the data it sends, what it writes to disk, and what it hands to the shell. That
    content, not the redisplayed command line, is what tells the analyst whether this is an updater or a loader.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - safe_environment
  - manual_review
  - external_threat_intel
- question: Was the shell command encoded or obfuscated? What does it decode to?
  context: >-
    Script-host loader stages usually hand the shell a compact instruction rather than a readable script. Look for
    -EncodedCommand or -enc base64, string concatenation, backtick escaping, and variable substitution, and decode it.
    Download cradles such as Net.WebClient.DownloadString, IEX(IWR(...)), Start-BitsTransfer, and
    [Reflection.Assembly]::Load are common at this stage - record the payload source URL and what gets executed or
    written.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Did PowerShell script block logging capture the full script content?
  context: >-
    Event ID 4104 records the deobfuscated script content PowerShell actually executed, which is the ground truth when
    the command line is encoded or when the shell was handed a one-liner by the script host. Script block text longer
    than a few hundred characters at this point in the chain generally means a full second-stage script was passed in
    rather than a short update command. If PowerShell operational logs are not ingested in this environment, treat zero
    results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
  answer_sources:
  - powershell_script_block
- question: Were PowerShell security controls bypassed or weakened before this execution?
  context: >-
    Loader stages commonly weaken controls before fetching a payload. Execution policy bypass (-ExecutionPolicy Bypass,
    -ep bypass), AMSI patching (AmsiUtils, amsiInitFailed), real-time monitoring changes (Set-MpPreference,
    DisableRealtimeMonitoring), and engine downgrade (-Version 2, -v 2) all appear on the command line and are visible in
    the hour before the alert. Finding them places this execution inside a prepared sequence rather than an isolated
    event.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Which process wrote the update archive and the .js file into the Temp directory, and was it a browser?
  context: >-
    The download is the origin of this chain, and the writing process names the delivery path. A browser writing the .zip
    into \AppData\Local\Temp is consistent with a drive-by fake-update prompt; an archiver writing the .js next to it is
    consistent with the user extracting the archive. A different writer - another script host, a mail client, a
    collaboration client - points to a different delivery route. Note the file names and timestamps, since the gap
    between the write and the alert measures how long the user hesitated.
  range: -4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\AppData\Local\Temp'
      selection_ext:
        TargetFilename|endswith:
          - '.zip'
          - '.js'
          - '.jse'
      condition: selection and selection_ext
    fields:
      - TargetFilename
      - Image
      - User
  answer_sources:
  - file_event
- question: Which scripting and .NET modules did processes on this host load around the alert?
  context: >-
    Module loads corroborate what the command line only implies. jscript.dll, vbscript.dll, and wshom.ocx confirm the
    script host actually interpreted a script rather than being started and abandoned. clr.dll, clrjit.dll, and
    System.Management.Automation.dll loading into a process that is not powershell.exe indicate PowerShell hosted through
    .NET automation, which produces no powershell.exe command line to read. amsi.dll loading and then the process
    continuing without further AMSI activity is worth noting alongside any bypass strings. Rare or never-before-seen
    assemblies in this window are the ones worth pulling.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|contains:
          - '\jscript.dll'
          - '\vbscript.dll'
          - '\wshom.ocx'
          - '\System.Management.Automation'
          - '\clr.dll'
          - '\clrjit.dll'
          - '\amsi.dll'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
      - Signature
  answer_sources:
  - process_creation
- question: Did the script host or the shell it spawned make outbound network connections around the alert?
  context: >-
    A loader stage exists to reach a server. Outbound connections from wscript.exe or from the shell it spawned identify
    the second-stage source or the tasking channel; check the destination addresses and ports against reputation and
    against what this host normally contacts. No connections from these processes points either to the payload having
    been fetched by a different process or to the chain being interrupted before it completed.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\wscript.exe'
          - '\cmd.exe'
          - '\powershell.exe'
          - '\pwsh.exe'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
  - external_threat_intel
- question: What else did a script host launch on this host in the hours after the alert?
  context: >-
    This execution is a foothold stage that typically precedes further tooling. Widening past the alerting instance to
    every script-host child over the following hours shows whether the chain progressed into reconnaissance (whoami,
    net, nltest, systeminfo), credential access, archive staging, or a scheduled task or run-key write. An empty result
    over this window is meaningful in itself.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the user's 90-day history of
    this specific firing pattern rather than generic use of a shell. A user who has never produced it is the normal case
    for this technique, since it depends on a one-off download. Repeated history for the same user points instead toward
    a sanctioned updater that drives a script host from a temporary directory, which is worth identifying by name.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \wscript.exe
        ParentCommandLine|contains|all:
        - \AppData\Local\Temp
        - .zip
        - update
        - .js
        ParentCommandLine|contains:
        - Chrome
        - Edge
        - Firefox
        - Opera
        - Brave
        - Vivaldi
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Has this script host historically driven the rule's pattern on this host or across the environment, or is it
    new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute the behavior and the launch
    mechanism is the meaningful pivot. The query mirrors the rule's selection structure scoped to the alerting parent
    process, so the result is the 90-day history of this script host driving this specific pattern. A new or rare parent
    for this pattern is the deviation worth chasing; a parent already accounting for a large prior count is vendor or OS
    automation.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \wscript.exe
        ParentCommandLine|contains|all:
        - \AppData\Local\Temp
        - .zip
        - update
        - .js
        ParentCommandLine|contains:
        - Chrome
        - Edge
        - Firefox
        - Opera
        - Brave
        - Vivaldi
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether the same person ran comparable activity on more than
    one endpoint, which for a download-driven technique usually means they opened the file more than once or on more than
    one machine. If the alert fired under a machine account or a service principal, this query returns agent telemetry
    rather than an answer and the parent-scoped view is the one to read.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to
    this host?
  context: >-
    Under a service principal a user-scoped network view returns agent telemetry, so the meaningful question is whether
    the same launch mechanism fired elsewhere. The query mirrors the rule's selection structure scoped to the alerting
    parent process, fleet-wide, in the alert window. Several hosts in the same window points to a pushed or scheduled
    trigger, or to multiple users landing on the same compromised site; a single host points to a host-local trigger.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \wscript.exe
        ParentCommandLine|contains|all:
        - \AppData\Local\Temp
        - .zip
        - update
        - .js
        ParentCommandLine|contains:
        - Chrome
        - Edge
        - Firefox
        - Opera
        - Brave
        - Vivaldi
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating every parent-child pair on the host in the alert window collapses routine agent telemetry into high-count
    rows and leaves novel pairs standing out at low counts. Look for the browser process that preceded the download, the
    archiver that extracted it, and any interpreter, reconnaissance, or persistence activity that appeared alongside the
    script host. Timing matters as much as content - activity outside working hours or outside a maintenance window
    weakens an updater explanation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host help place this execution in a timeline. For a download-driven chain the useful
    precursors are browser-related detections, archive or script drops, and any defense-tampering activity, since those
    would mean the sequence began before the script host ran.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
