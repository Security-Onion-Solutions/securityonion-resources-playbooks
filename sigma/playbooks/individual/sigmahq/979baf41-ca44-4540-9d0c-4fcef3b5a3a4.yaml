name: Potential File Extension Spoofing Using Right-to-Left Override
id: 3e83f33a-bc35-477c-aff5-44bc6ee243fe
description: |
  Detects a file whose name contains a right-to-left override control character (U+202E) together with a
  reversed executable extension token. RTLO flips the display order of the characters that follow it, so an
  executable can be made to appear as though it carries a document or media extension while Windows still
  resolves and runs the real extension. The rule fires only when both conditions hold: the RTLO character AND
  one of the reversed extension strings (for example gpj., fdp., xcod.) are present in the same filename.
  Filenames written in genuine right-to-left languages can occasionally include the character, so the
  investigation should confirm the true file type behind the spoofed extension, determine how the file arrived
  and whether it executed, and establish whether the writing account and host normally produce such files.
type: detection
detection_id: 979baf41-ca44-4540-9d0c-4fcef3b5a3a4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting filename contain a right-to-left override character together with a reversed executable extension?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires only when the
    filename contains both a right-to-left override control character (stored as the raw U+202E byte, the
    escaped form, or the literal character) AND one of the reversed extension tokens such as gpj., fdp., or
    xcod. Review the exact TargetFilename and the responsible process on the triggering event. RTLO can also
    appear URL-encoded (%E2%80%AE) or as other byte-encoded forms, so if the displayed name looks ordinary,
    inspect the raw filename bytes rather than the rendered text.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to create or receive files with reversed-extension filenames?
  context: >-
    Legitimate right-to-left language filenames can include the override character, and some localized
    environments produce them routinely. Knowing whether the writing account and host function are consistent
    with such filenames is often the fastest way to separate a benign localized name from a deliberate spoof.
    User attribution is present on roughly 94% of endpoint file events; when the account is a machine account
    or SYSTEM, judge by the writing process and host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What is the true file type and content behind the spoofed extension?
  context: >-
    The RTLO character reverses the displayed order of the trailing characters, so the visible extension is not
    the one Windows executes. Retrieve the file and determine its real type from its content and header (a PE
    executable, script, shortcut, or an actual document) rather than trusting the rendered name. For an
    executable or script, inspect for obfuscation, encoded strings, embedded URLs or IP addresses, and known
    malicious string patterns. Content retrieval is a manual step from the endpoint or an isolated environment.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If this file executed, what is its real identity and hash, and does it have known detections?
  context: >-
    File-creation events carry no hash; the hash is recorded when the file runs. This query looks for the
    disguised file executing by its on-disk name and reads its identity fields. Compare the Image path against
    OriginalFileName from the PE metadata, which still reflects the real tool even when the on-disk name is
    spoofed. Submit the hash to threat intelligence to determine whether it is known malicious, benign, or
    previously unseen, and note when the execution occurred relative to the file write to gauge how quickly the
    spoofed file was run. If the file is present but has not executed, retrieve it from its on-disk path and
    hash it manually.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - OriginalFileName
      - Hashes
- question: Which process created this file, and how did it arrive on the host?
  context: >-
    The file event carries the writing process's identifiers but no command line, so pivot by ProcessGuid to
    the writing process to read its Image, full command, and parent. The writer distinguishes the delivery
    mechanism: a browser or download utility points to a web download, an archive tool to extraction from an
    attachment or package, and explorer.exe or a remote-access tool to a manual or lateral copy. Files spoofed
    with RTLO most often arrive from untrusted sources such as browser downloads or email attachments, so the
    parent chain of the writer helps confirm whether the origin is trusted.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: After the spoofed file executed, what child processes did it spawn on this host?
  context: >-
    The purpose of the spoof is to have a user run an executable they believe is a document. If the disguised
    file ran, the processes it spawned reveal its actual objective - a script host, a command interpreter,
    reconnaissance utilities, or a network connection. Listing children of the spoofed file on this host after
    the alert shows whether execution progressed into follow-on activity or the file was opened and abandoned.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is the file still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives both urgency and next steps. A payload still on disk can be
    retrieved, hashed, and analyzed; a file deleted seconds after creation suggests anti-forensic cleanup or a
    self-deleting dropper and shifts the investigation to what executed in between. The operation type on each
    later event for this path shows whether the file was created, modified, renamed, or removed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A process that drops one spoofed file often drops several - a dropper unpacking components, an archive tool
    extracting a bundle, or staging output. The breadth, paths, and extensions of the writing process's other
    file activity distinguish a single artifact from a batch and enumerate what else needs review. The alert's
    file event carries the writing process's identifiers, so this covers the writer and its direct children.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has this file been seen before on this host?
  context: >-
    A file that has never appeared on a host is more suspicious than one that is part of normal operations.
    First-time appearance of a reversed-extension filename should be checked even when the displayed name seems
    benign. Zero or very low historical counts indicate a new or unusual file for this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Is this same file present on any other hosts in the environment?
  context: >-
    The same spoofed filename appearing on multiple hosts points to a distribution campaign or a phishing run
    with a shared attachment; confinement to a single host points to a targeted or opportunistic delivery.
    Where the file is present on several hosts, compare the writing process and arrival timeline to characterize
    how it spread.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- always_include: true
  question: Has this user previously produced the rule's reversed-extension pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user - the result is the user's 90-day
    history of files matching the RTLO-plus-reversed-extension pattern (not generic file activity), aggregated
    by host. A user who has never produced this pattern is more suspicious than one who does so regularly; weigh
    the count against the user's role and whether they work in a right-to-left language environment where the
    character can appear legitimately.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_rtlo_unicode:
        TargetFilename|contains:
        - \u202e
        - '[U+202E]'
        - "\u202E"
      selection_extensions:
        TargetFilename|contains:
        - 3pm.
        - 4pm.
        - cod.
        - fdp.
        - ftr.
        - gepj.
        - gnp.
        - gpj.
        - ism.
        - lmth.
        - nls.
        - piz.
        - slx.
        - tdo.
        - vsc.
        - vwm.
        - xcod.
        - xslx.
        - xtpp.
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this writing process historically produced the rule's pattern on this host or across the environment, or is it new for this activity?
  context: >-
    When the alert fires under a service principal or machine account, user identity does not attribute
    behavior. The meaningful pivot is the writing mechanism: the query mirrors the rule's selection structure
    scoped to the alerting program, so the result is the 90-day history of this process driving this
    specific reversed-extension pattern. A new or rare writer for this pattern is the deviation worth chasing; a
    process that already accounts for many prior events is likely vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_rtlo_unicode:
        TargetFilename|contains:
        - \u202e
        - '[U+202E]'
        - "\u202E"
      selection_extensions:
        TargetFilename|contains:
        - 3pm.
        - 4pm.
        - cod.
        - fdp.
        - ftr.
        - gepj.
        - gnp.
        - gpj.
        - ism.
        - lmth.
        - nls.
        - piz.
        - slx.
        - tdo.
        - vsc.
        - vwm.
        - xcod.
        - xslx.
        - xtpp.
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether the same account was active on multiple
    endpoints in the same window, which points to lateral movement or a broader compromise. If the same user
    triggered activity on several hosts, the scope may be larger than the single alerting endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same writer-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, asking what else the user did across the network returns agent-telemetry noise,
    because every host runs the same service accounts constantly. The meaningful question is whether the same
    writing mechanism produced the reversed-extension pattern elsewhere: the query mirrors the rule's selection
    structure scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts in the same
    window points to a pushed or scheduled process; a single host points to a host-local delivery.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_rtlo_unicode:
        TargetFilename|contains:
        - \u202e
        - '[U+202E]'
        - "\u202E"
      selection_extensions:
        TargetFilename|contains:
        - 3pm.
        - 4pm.
        - cod.
        - fdp.
        - ftr.
        - gepj.
        - gnp.
        - gpj.
        - ism.
        - lmth.
        - nls.
        - piz.
        - slx.
        - tdo.
        - vsc.
        - vwm.
        - xcod.
        - xslx.
        - xtpp.
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity in a tight window around the file write
    surfaces what led up to the spoofed file appearing and what ran immediately after. Novel parent-child pairs
    stand out at low counts against high-count routine telemetry, which is what points to the tool that
    delivered the file and any follow-on execution.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - phishing indicators, script execution, or reconnaissance - may reveal
    the stages that preceded this file write and help reconstruct the timeline. A spoofed file is typically a
    delivery or execution step, so prior alerts help place it within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
