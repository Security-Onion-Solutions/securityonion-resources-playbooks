name: Suspicious Screensaver Binary File Creation
id: 3c0bcd92-2c57-4ffb-b4a4-4a063fc2eb43
description: |
  Detects the creation of a Portable Executable with a .scr (screensaver) extension, excluding a
  small set of known-legitimate screensavers (the Kindle and Norton client binaries, and the
  TiWorker-written uwfservicingscr.scr). A .scr file is an ordinary PE that Windows runs after a
  configurable period of user inactivity when the HKCU\Control Panel\Desktop screensaver settings
  point at it, which makes a dropped .scr a low-touch persistence and privilege-escalation vector.
  Legitimate screensavers ship with software installs and land in system directories; a .scr written
  into a user-writable path by a script host or an unexpected process, then wired up through the
  screensaver registry values, is the pattern this rule surfaces. Investigate what the file actually
  is, which process wrote it and what launched that process, whether the screensaver registry
  configuration was changed to reference it, whether it executed, and whether the same file appears
  elsewhere.
type: detection
detection_id: 97aa2e88-555c-450d-85a6-229bcd87efb8
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the created file end in .scr, and is it not one of the known-legitimate screensavers?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a
    file whose name ends in .scr is created AND the writing process is not one of the excluded
    legitimate producers (Kindle.exe, the Norton ccSvcHst.exe client, or TiWorker.exe writing
    uwfservicingscr.scr). Review the exact TargetFilename, the operation type, and the responsible
    process on the triggering event. Any .scr written outside those known cases is a candidate
    screensaver-persistence artifact.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to create a .scr screensaver binary?
  context: >-
    Screensaver files are normally delivered by software installers, not created ad hoc by users or
    scripts. Knowing whether the writing account and host function are consistent with any sanctioned
    screensaver deployment is often the fastest way to separate a legitimate install from a planted
    persistence file. User attribution is present on roughly 94% of endpoint file events; when it is a
    machine account or missing, judge by the writing process and the host's role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this .scr file a real screensaver binary or a renamed or malicious executable?
  context: >-
    A .scr file is a PE; the extension does not guarantee it is a screensaver. Retrieve the file and
    examine it: check its size, digital signature, embedded strings, imports, and packer signatures,
    and compare against a known-good screensaver from the same vendor. A file placed in a user-writable
    or temporary directory, unsigned, or exporting no screensaver entry point is more consistent with a
    payload wearing a .scr extension than with a legitimate screensaver. Content retrieval is a manual
    step against the on-disk path or an endpoint console.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If this .scr executed, what is its hash and does it have known threat-intel detections?
  context: >-
    A file's hash is recorded when it runs, not when it is written, so this looks for the screensaver
    binary executing by its name and reads the hash from the execution event; submit that hash to
    reputation or internal threat-intel sources to judge whether it is known malicious, benign, or
    previously unseen. Because a screensaver runs after user inactivity through the registry
    configuration, its appearance here also confirms the persistence fired. If the file is present but
    has not executed, retrieve it from its on-disk path and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
- question: What process created this .scr file, and what launched that process?
  context: >-
    The file event carries no command line, so pivot by ProcessGuid to the writing process to read its
    Image, full command, and parent chain. Legitimate screensavers are written by installers and
    software-update services running under predictable parents. A .scr written by a script host such as
    wscript.exe, powershell.exe, or mshta.exe, by an Office application, or by an unsigned binary points
    to the file being staged programmatically rather than delivered by a normal install, and the parent
    chain distinguishes a scripted drop from a deliberate administrative action.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Was the screensaver registry configuration changed on this host to point at this or another binary?
  context: >-
    A dropped .scr only runs as persistence once the HKCU\Control Panel\Desktop values are set to invoke
    it: SCRNSAVE.EXE names the screensaver binary, ScreenSaveActive enables it, and ScreenSaveTimeOut
    sets the inactivity delay before it launches. This lists recent modifications to those values on the
    host so the analyst can see whether the SCRNSAVE.EXE value now references the dropped file and which
    process made the change. A registry edit to these values close in time to the .scr write ties the
    file drop to an execution trigger; the writing process (reg.exe, powershell.exe, or another editor)
    is itself a signal.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\Control Panel\Desktop\SCRNSAVE.EXE'
          - '\Control Panel\Desktop\ScreenSaveActive'
          - '\Control Panel\Desktop\ScreenSaveTimeOut'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Is the .scr file still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives both urgency and next steps. A screensaver binary still on
    disk can be retrieved, hashed, and analyzed; a .scr deleted seconds after creation suggests
    anti-forensic cleanup or a self-staging dropper and shifts the investigation toward what executed in
    between. Interpret the operation type on each event: a deletion shortly after creation is the
    cleanup signature.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A process that drops one suspicious file often drops several - a dropper unpacking components, a tool
    staging output, or a payload alongside its screensaver launcher. The breadth, paths, and extensions
    of the writing process's other file activity distinguish a single artifact from a staging operation
    and enumerate what else needs review. This covers the writer and its direct children, since droppers
    often delegate the actual writes.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has this .scr file been seen before on this host?
  context: >-
    A screensaver file that has never appeared on a host is more suspicious than one that is part of a
    normal software install. Zero or very low historical counts indicate a first-time or rare drop of
    this specific file; a steady history points to a legitimately installed screensaver. Weigh the count
    against whether a matching software deployment is expected on this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Is this same .scr file present on any other hosts in the environment?
  context: >-
    The same screensaver file appearing on multiple hosts may indicate a broad tool run, a mis-scoped
    deployment, or lateral distribution of a persistence payload; the file confined to one host suggests
    a targeted drop. Compare the writing process across hosts to see whether the distribution looks like
    managed software or repeated hands-on staging.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- always_include: true
  question: Has this user previously produced the rule's screensaver-creation pattern, and does that history fit their role?
  context: >-
    This mirrors the rule's own selection scoped to the alerting user, so the result is the user's
    90-day history of producing this specific .scr-creation pattern rather than generic file activity,
    aggregated by host. A user who has never produced this pattern is more suspicious than one who does
    so regularly through a known workflow; weigh the count against the user's role and typical software.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith: .scr
      filter_generic:
        Image|endswith:
        - \Kindle.exe
        - \Bin\ccSvcHst.exe
      filter_tiworker:
        Image|endswith: \TiWorker.exe
        TargetFilename|endswith: \uwfservicingscr.scr
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven the screensaver-creation pattern, or is the program new for this activity?
  context: >-
    When the alert fires under a service or machine account, user identity does not attribute the
    behavior; the meaningful pivot is the launch mechanism. This mirrors the rule's selection scoped to
    the alerting program, so the result is the 90-day history of this program driving this specific
    .scr-creation pattern, aggregated by host. A new or rare program for this pattern is the deviation
    worth chasing; a program that already accounts for thousands of prior events is vendor or OS
    automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith: .scr
      filter_generic:
        Image|endswith:
        - \Kindle.exe
        - \Bin\ccSvcHst.exe
      filter_tiworker:
        Image|endswith: \TiWorker.exe
        TargetFilename|endswith: \uwfservicingscr.scr
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the environment around the time of the alert?
  context: >-
    Tracking the user's activity across all hosts in the alert window reveals whether the screensaver
    drop is isolated or part of broader hands-on activity. If the same user triggered similar or related
    activity on multiple hosts, the scope of the operation may be larger than this one file. When the
    alert fires under a service or machine account, this view returns agent-telemetry noise and the
    parent-driven view is the meaningful answer.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven screensaver pattern fire on other hosts in the same window, or is it isolated to this host?
  context: >-
    Under a service or machine account, asking what else the user did returns constant agent telemetry.
    The meaningful question is whether the same launch mechanism produced this pattern elsewhere: this
    mirrors the rule's selection scoped to the alerting program, fleet-wide, in the alert window.
    Multiple hosts in the same window points to scheduled or pushed automation dropping the file; a
    single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith: .scr
      filter_generic:
        Image|endswith:
        - \Kindle.exe
        - \Bin\ccSvcHst.exe
      filter_tiworker:
        Image|endswith: \TiWorker.exe
        TargetFilename|endswith: \uwfservicingscr.scr
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity in a tight window around the file
    drop surfaces what led up to it and what ran immediately after. Novel parent-child pairs stand out at
    low counts against high-count routine telemetry, which is what points to the tool that staged the
    screensaver file and any follow-on actions.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, execution of scripting tools, or defense
    tampering - may reveal the stages that preceded this file drop and help reconstruct the timeline.
    Screensaver persistence is typically a means to regain or retain execution, so prior alerts help
    place this drop within a larger sequence rather than treating it as a standalone event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    A screensaver .scr is one file-based persistence mechanism; attackers commonly stack several. Files
    written to a Startup folder or to a path referenced by a registry Run key achieve persistence without
    invoking schtasks, sc, or reg, so file writes to these locations near the .scr drop indicate the same
    activity established a parallel foothold on disk that a screensaver-only check would miss.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
