name: Service Security Descriptor Tampering Via Sc.EXE
id: ee7150ca-01d5-4034-9ce2-1863fafcfe25
description: |
  Detects sc.exe invoked with the sdset subcommand, which writes a new security descriptor (SDDL) to a Windows service. The rule fires when the process is sc.exe (by image name or original filename) AND the command line contains sdset. This is the mechanism used to hide a service from enumeration tools by denying the List-Children right to Interactive Users, Service logon, and Built-in Administrators, or to loosen a service descriptor so a non-admin can start or modify a privileged service. Legitimate use exists (administrators occasionally repair service permissions), so the investigation should decode the SDDL, identify which service was retargeted, confirm whether the service is running and under what account, and determine whether the change was authorized.
type: detection
detection_id: 98c5aeef-32d5-492f-b174-64a691896d25
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line show sc.exe running the sdset subcommand against a service?
  context: Confirm the alert is a true positive by reviewing the exact command line. The rule fires when the process is sc.exe (matched by image name or original filename) and the command line contains sdset, which writes a new security descriptor to a named service. Read the full command line to confirm both the sdset verb and the target service name are present.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to modify service security descriptors?
  context: Editing a service security descriptor with sc.exe sdset is an administrative action normally limited to a small set of operators on servers or managed endpoints. If the account or host has no role in service administration, the activity is harder to explain as routine maintenance.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Decode the SDDL string passed to sdset - which principals are denied access and which rights are involved?
  context: The security descriptor in the sdset command line is the payload of this technique. A Deny ACE of the form (D;;...;;;IU), (D;;...;;;SU), or (D;;...;;;BA) that removes the List-Children (LC) right hides the service from services.exe, Get-Service, and sc query. An Allow ACE granting start or write rights to Everyone (WD) or Authenticated Users (AU) loosens the descriptor so a non-admin can control a privileged service. Identify the target service name, the denied principals, and the rights in each ACE to determine whether this hides or loosens the service.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - Image
      - User
- question: Which service was created or modified, and what binary does it execute?
  context: The descriptor change targets a named service. Resolve that service to its installation record to read the binary path it executes, its start type, and the account it runs under. A binary placed in a world-writable directory such as C:\Users\Public or C:\Windows\Temp, or one masquerading as a legitimate service name, is the persistence payload and should be analyzed directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: system
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 7045
      condition: selection
    fields:
      - ServiceName
      - ImagePath
      - StartType
      - AccountName
- question: Is the target service currently running, and what account is it using?
  context: A service whose descriptor was tampered may already be running and hidden, or may be set to start on demand and waiting. Run sc query and sc qc against the target service name on the host to confirm whether the persistence is active. A service running as LocalSystem has full system privileges; a specific user account indicates the access level the operator had.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were the service's registry keys modified around the same time, and do ImagePath or ServiceDll point to an unexpected binary?
  context: A service descriptor change frequently accompanies modification of the service's configuration under HKLM\SYSTEM\CurrentControlSet\Services. Review registry-set events on this host for changes to ImagePath, ServiceDll, FailureCommand, or Parameters subkeys of service entries near the alert time. A path written into a non-standard directory, or a ServiceDll loading from a user-writable location, indicates the descriptor change is part of execution-flow hijack rather than a benign permission repair.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Services\'
      selection_keys:
        TargetObject|endswith:
          - '\ImagePath'
          - '\ServiceDll'
          - '\FailureCommand'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: What process spawned sc.exe and is that parent chain expected?
  context: The parent process reveals how sc.exe was invoked. Service administration normally runs under an interactive administrator shell, a deployment agent, or services.exe. A parent such as a web server worker, an Office application, or a script host (wscript.exe, mshta.exe) indicates the descriptor change followed exploitation or a malicious script rather than routine maintenance.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously run sc.exe sdset, what parents and users normally drive it, and does the current alert fit that pattern?
  context: The query mirrors the rule's selection structure scoped to this host, so the parent and user distribution reflects how the sdset pattern specifically has run here rather than generic sc.exe usage. A new parent process, an unexpected user account, or a first-time appearance of the pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \sc.exe
      - OriginalFileName: sc.exe
      selection_cli:
        CommandLine|contains: sdset
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Was sc.exe executed from its expected System32 or SysWOW64 path?
  context: sc.exe run from outside System32 or SysWOW64 may have been copied or renamed to evade path-based allowlists or to ship a tampered build. Compare the image path and the original filename - a sc.exe running from a user temp or download directory is more suspicious than one in the system directory.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host run the sc.exe sdset pattern over the past 90 days, and what command-line structures are typical?
  context: A descriptor-tampering pattern with no prior history on a host is more suspicious than one seen regularly under stable automation. The query mirrors the rule's selection structure scoped to this host, so the count reflects the sdset pattern specifically rather than all sc.exe usage. The command-line projection lets you compare typical descriptor strings against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \sc.exe
      - OriginalFileName: sc.exe
      selection_cli:
        CommandLine|contains: sdset
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- question: Were other persistence or defense-evasion LOLBins used on this host recently?
  context: Operators who tamper with a service descriptor often pair it with other built-in tools for persistence and evasion - schtasks, reg, at, netsh, wevtutil, bcdedit, or vssadmin. Finding several of these performing related actions in the same window strengthens the case that the sdset call is part of an intentional foothold rather than an isolated administrative edit.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\reg.exe'
          - '\netsh.exe'
          - '\wevtutil.exe'
          - '\bcdedit.exe'
          - '\vssadmin.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \sc.exe
      - OriginalFileName: sc.exe
      selection_cli:
        CommandLine|contains: sdset
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \sc.exe
      - OriginalFileName: sc.exe
      selection_cli:
        CommandLine|contains: sdset
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar service or persistence activity on several hosts, the scope of the operation may be larger than this one alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \sc.exe
      - OriginalFileName: sc.exe
      selection_cli:
        CommandLine|contains: sdset
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led to the descriptor change and what followed it - reconnaissance, privilege escalation, or additional persistence installation. Novel parent-child process pairs at low counts are what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - defense tampering, reconnaissance, credential access - may reveal the attack stages that preceded the descriptor change and help reconstruct the timeline. Service hiding is typically a late-stage persistence step, so prior execution or exploitation alerts are especially relevant.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host?
  context: Attackers rarely rely on a single persistence mechanism. After hiding or retargeting a service, they commonly install backup footholds using scheduled tasks, registry Run keys, BITS jobs, or WMI subscriptions. Multiple persistence installations in the same timeframe indicate intentional stacking rather than an isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
