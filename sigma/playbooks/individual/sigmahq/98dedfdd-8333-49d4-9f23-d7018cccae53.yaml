name: Enable LM Hash Storage - ProcCreation
id: 7e2c4a91-5d3b-4f6a-8c1e-9a0b2d4e6f81
description: |
  Detects a command line that writes the NoLMHash value under HKLM\System\CurrentControlSet\Control\Lsa to 0, which re-enables Windows storage of the weak LAN Manager hash of account passwords in the local SAM and Active Directory. The rule fires when a command line contains all of the registry path fragment, the NoLMHash value name, and the data value 0 together. Legitimate writes of this value almost always set it to 1 to harden a host; setting it back to 0 weakens credential protection and is most often seen when an operator with administrative access wants future password changes to ship a crackable LM hash for offline cracking. Determine which process wrote the value, under what identity and parent chain, whether the change was authorized, and what other credential-access or defense-weakening activity occurred around it.
type: detection
detection_id: 98dedfdd-8333-49d4-9f23-d7018cccae53
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line write NoLMHash to 0 under the Lsa control key?
  context: Before investing investigation time, confirm the alert is a true positive by reading the exact command line. The rule fires only when the command contains all three fragments together — the registry path \System\CurrentControlSet\Control\Lsa, the value name NoLMHash, and the data value 0. Confirm the write sets the value to 0 (re-enabling LM hash storage) rather than to 1 (the hardening direction), since a value of 1 would not have fired this rule.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to change credential-protection registry settings?
  context: Legitimate writes of NoLMHash are typically pushed through Group Policy and set the value to 1 to harden a host. A manual command-line write that sets it to 0 is unusual for most users. Knowing whether this account and host normally manage Lsa security settings is often the fastest way to separate an authorized hardening reversal from operator activity following a compromise.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What process spawned the command that wrote this value, and what started that parent?
  context: The parent chain reveals how the registry write was invoked. A write launched from an interactive shell an operator was driving, an unsigned binary, or an unexpected scripting host points toward hands-on-keyboard activity, while a legitimate change is more likely to descend from a deployment or management tool. Tracing the parent's own origin separates an authorized administrative change from a write driven by an intruder's tooling.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did the same parent spawn around this time?
  context: If the parent that launched this registry write also spawned credential-dumping, reconnaissance, or other registry-tweaking children, that strongly suggests orchestrated operator activity rather than an isolated configuration change. Multiple suspicious siblings from the same parent within a short window reveal the full scope of what that parent was doing.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What exact registry value name and data were written, and does the target resolve to the NoLMHash value under Lsa?
  context: Reading the structured registry fields confirms the analyst is looking at a write to HKLM\System\CurrentControlSet\Control\Lsa\NoLMHash and shows the data value written. A value of 0 re-enables on-disk LM hash storage, making harvested SAM and directory hashes far easier to crack offline; a value of 1 is the hardening direction. Confirm the value name and data so the disposition is based on the actual registry effect rather than the command-line text alone.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Were other registry modifications made on this host in the same session?
  context: An operator who re-enables LM hash storage often makes adjacent registry changes — for example flipping DisableRestrictedAdmin to 0 to enable pass-the-hash over RDP, weakening other Lsa protections, or disabling security tooling. Finding a cluster of command-line registry writes in the same window reveals whether this single value flip was part of a broader credential-access and defense-weakening effort.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- question: When this host has previously written NoLMHash to 0, what parents and users normally drove that activity, and does the current alert fit that pattern?
  context: The query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution reflects how this specific NoLMHash write pattern has historically run here rather than generic reg.exe usage. A new parent process, an unexpected user account, or a first-ever appearance of this pattern on the host is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains|all:
        - \System\CurrentControlSet\Control\Lsa
        - NoLMHash
        - ' 0'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains|all:
        - \System\CurrentControlSet\Control\Lsa
        - NoLMHash
        - ' 0'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains|all:
        - \System\CurrentControlSet\Control\Lsa
        - NoLMHash
        - ' 0'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the same account was active on multiple endpoints. If this user re-enabled LM hash storage here and also touched other hosts in the same window, the scope of the activity — and any potential compromise of the account — may be broader than this single registry write.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains|all:
        - \System\CurrentControlSet\Control\Lsa
        - NoLMHash
        - ' 0'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the surrounding process activity reveals what led to this registry write and what followed it. Look for credential dumping (reg save of SAM/SYSTEM/SECURITY hives, LSASS access), reconnaissance, or additional registry tampering that would place this NoLMHash change inside a larger credential-access sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts written NoLMHash to 0 in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this exact NoLMHash write pattern rather than generic reg.exe usage. Many hosts writing the same value points to a scripted deployment or, more concerning, a credential-access operation moving across the environment; one host or a small unrelated set points to isolated manual activity. Use the host distribution to calibrate scope and severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains|all:
        - \System\CurrentControlSet\Control\Lsa
        - NoLMHash
        - ' 0'
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the attack stages that preceded this registry write. Re-enabling LM hash storage is usually a setup step for offline cracking of harvested hashes, so prior alerts around hive theft or LSASS access help reconstruct the timeline and intent.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Is a direct command-line registry write consistent with how this organization normally manages security policy?
  context: Most organizations manage Lsa security settings such as NoLMHash through Group Policy rather than direct reg.exe writes, and the hardening direction sets the value to 1. A manual command-line write that sets it to 0 may indicate an operator bypassing normal tooling, or an administrator taking a shortcut. Understanding the normal procedure for credential-protection policy helps distinguish the two.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
