name: VMMap Signed Dbghelp.DLL Potential Sideloading
id: 0dbb1e9f-9337-40e6-9bfa-384cf7f94969
description: |
  Detects the Sysinternals VMMap process (vmmap.exe or vmmap64.exe) loading a code-signed
  dbghelp.dll from the non-canonical C:\Debuggers directory. dbghelp.dll normally resides in
  System32; older VMMap builds automatically loaded it from C:\Debuggers, which made that path a
  DLL search-order sideloading target. The rule fires when all conditions hold together: the
  loading process ends in \vmmap.exe or \vmmap64.exe, the loaded module path contains
  C:\Debuggers\dbghelp.dll, and the module reports as signed. Because the rule matches even a
  signed module, a genuinely-signed Microsoft dbghelp relocated to that path can produce a benign
  hit, while a signed-but-substituted or attacker-staged dbghelp planted in C:\Debuggers is the
  sideloading concern. Investigate which process loaded the module, who staged the DLL in
  C:\Debuggers and when, the module's signer and hash reputation, whether the load is new to this
  host, and what vmmap ran or spawned around the load.
type: detection
detection_id: 98ffaed4-aec2-4e04-9b07-31492fe68b3d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the loaded module match what this rule detects — a signed dbghelp.dll from C:\Debuggers loaded by vmmap?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires only when all three
    conditions hold together: the loading process ends in \vmmap.exe or \vmmap64.exe, the loaded
    module path contains C:\Debuggers\dbghelp.dll, and the module reports as signed. Review the exact
    ImageLoaded path, the Signed status, and the loading Image against those criteria. dbghelp.dll
    belongs in System32; a load from C:\Debuggers is the non-canonical search path older VMMap builds
    used and that a sideloaded module would exploit. DLL loads carry signing status and a hash on the
    load event, so this can be confirmed directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
- question: Is this user and host expected to run VMMap and load debugging libraries?
  context: >-
    VMMap is a virtual-memory analysis utility used by developers and administrators for
    troubleshooting, not a tool that runs on most endpoints during normal operations. Knowing whether
    the account and host function match legitimate diagnostic use is often the fastest way to separate
    a routine debugging session from a sideloading attempt that abuses the tool to execute a planted
    library. User attribution is present on most endpoint events; when it is a machine account or
    missing, pivot on the loading process instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What modules did this vmmap process load, and are any from non-canonical paths, unsigned, or from user-writable directories?
  context: >-
    The full set of modules a process loads reveals whether the dbghelp.dll load is an isolated
    relocation or part of a broader search-order hijack. dbghelp.dll's canonical directory is System32;
    a load from C:\Debuggers means the file resolved from a directory that is not the expected system
    path. Look for additional modules loaded from C:\Debuggers, %TEMP%, AppData, ProgramData, or the
    application's own directory, and for any unsigned modules where signed ones are expected — those
    are the stronger sideloading signals. C:\Debuggers is not a canonical DLL directory, so any module
    resolving from there warrants review.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: What is the signer, hash, and reputation of the dbghelp.dll loaded from C:\Debuggers?
  context: >-
    Module reputation distinguishes a routine relocated library from a substituted one. Because this
    rule only fires on signed modules, a genuinely-signed Microsoft dbghelp staged in C:\Debuggers may
    still be benign, but a signed-but-tampered module, one signed by an unexpected authority, or one
    whose hash matches known loader tooling is the sideloading concern. Compare the Signature subject
    and SignatureStatus against a legitimate Microsoft dbghelp, and pivot the Hashes value to threat
    intelligence. A SignatureStatus other than Valid, or a signer that is not the expected Microsoft
    identity, elevates the module above a simple relocation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What process spawned this vmmap instance, and is that parent chain expected?
  context: >-
    The image-load event carries no command line or parent lineage, so pivot by ProcessGuid to the
    vmmap process's own record to read its command line and parent. A vmmap launched interactively from
    explorer.exe or a console during a diagnostic session is consistent with legitimate use; a vmmap
    started by a script host such as wscript.exe or mshta.exe, an Office application, or an unsigned
    binary points to the tool being driven programmatically to trigger the sideload. The parent chain
    separates a hands-on troubleshooting session from an automated abuse of the binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Has this dbghelp.dll been loaded on this host before, and under which processes?
  context: >-
    A first-time module load is a stronger anomaly than a recurring one. If the same dbghelp.dll from
    this path has been loaded repeatedly by vmmap on this host over the past 90 days, the current load
    is probably routine diagnostic activity. If this is the first occurrence, or the module has only
    been loaded by unrelated processes historically, the load is anomalous and the staging of the file
    in C:\Debuggers deserves closer review.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: When this host previously fired the rule's pattern, what programs and users drove it, and does the current alert fit?
  context: >-
    Even a legitimate diagnostic tool can be abused. This query mirrors the rule's exact
    selection — the same C:\Debuggers\dbghelp.dll load by a signed vmmap — scoped to this host,
    so the resulting program and user distribution reflects how this specific firing pattern has
    historically run here, not generic VMMap usage. A new acting program process, an unexpected
    account, or a first-ever occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|contains: C:\Debuggers\dbghelp.dll
        Image|endswith:
        - \vmmap.exe
        - \vmmap64.exe
        Signed: 'true'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: What child processes did this vmmap instance spawn afterward?
  context: >-
    A sideloaded library executes inside the loading process, so the processes vmmap spawns after the
    load reveal the actual impact. Legitimate VMMap use spawns few or no children; unexpected children
    such as cmd.exe, powershell.exe, or a dropped binary point to code running under cover of the
    signed tool. Reviewing what vmmap launched on this host in the following window ties the module load
    to any post-load execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Which process created the dbghelp.dll in C:\Debuggers on this host, and is the file still present?
  context: >-
    Search-order hijacking begins with the library being planted in the directory the trusted process
    will resolve from, and that drop is usually made by a separate process before the tool ever runs.
    Finding the file-creation event for this dbghelp.dll shows which process and account staged it and
    when, distinguishing an installer or legitimate debugging-tools deployment from an attacker dropping
    a module into C:\Debuggers to be sideloaded. The current path resolving from C:\Debuggers rather
    than System32 is what makes the writing process the key lead.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: Were DLL search-order or module-injection registry keys modified on this host around the alert?
  context: >-
    Beyond dropping a library on a search path, DLL hijacking can be reinforced through registry keys
    that redirect or inject modules — KnownDLLs entries, the AppInit_DLLs value, and Image File
    Execution Options entries. Modifications to these keys near the alert indicate the sideload is part
    of a broader effort to control which libraries trusted processes load, rather than an isolated file
    relocation. The triggering load leaves no registry trace itself, so a match here is a distinct,
    corroborating signal.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_dll_keys:
        TargetObject|contains:
          - '\Session Manager\KnownDLLs'
          - '\Windows\AppInit_DLLs'
          - '\Image File Execution Options\'
      condition: selection and selection_dll_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: Have other hosts fired the rule's pattern in the past week, and does the distribution look like automation or one-off activity?
  context: >-
    This query mirrors the rule's exact selection — the C:\Debuggers\dbghelp.dll load by a signed vmmap
    — with no host scope, giving a fleet-wide count of this specific firing pattern rather than generic
    VMMap usage. Many hosts showing the same pattern points to a deployed debugging-tools layout or
    vendor automation that stages dbghelp under C:\Debuggers; a single host or a small unrelated set
    points to targeted or hands-on activity. Use the host spread and parent consistency to calibrate
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|contains: C:\Debuggers\dbghelp.dll
        Image|endswith:
        - \vmmap.exe
        - \vmmap64.exe
        Signed: 'true'
      condition: selection
    fields:
    - host.name
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity in a tight window around the module
    load surfaces what led up to it and what ran immediately after. Novel parent-child pairs stand out
    at low counts against high-count routine telemetry, which is what points to the tooling that staged
    the sideloaded library or acted on the execution it produced.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — reconnaissance, execution of scripting tools, or defense
    tampering — may reveal the stages that preceded this load and help reconstruct the timeline. DLL
    sideloading is typically a means to run code under a trusted process, so prior alerts help place
    this module load within a larger sequence rather than treating it as an isolated event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely — dropping an executable or script
    into a Startup folder or a path referenced by a registry Run key achieves persistence without
    invoking scheduling or service tools. Sideloading a library into a trusted process is one execution
    primitive; file writes to these persistence locations near the load indicate the operation also
    established a parallel foothold on disk.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Were process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Attackers rarely rely on a single foothold. After gaining execution through a sideloaded library,
    they commonly install backup persistence using scheduled tasks, services, registry Run keys, BITS
    jobs, or WMI subscriptions. Executions of schtasks.exe, sc.exe, reg.exe, bitsadmin.exe, or wmic.exe
    near the module load indicate the sideload was leveraged to establish persistence rather than being
    an isolated diagnostic action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Does the user or an administrator recall running VMMap on this host?
  context: >-
    VMMap is an interactive diagnostic tool, so direct confirmation from the account owner is a fast
    way to resolve the alert. If a developer or administrator was troubleshooting memory usage and
    happened to run a build of VMMap that loads dbghelp from C:\Debuggers, that closes it; if no one
    recalls running the tool, the account may be compromised or the execution was automated, and the
    investigation should continue into the loading process and who staged the module.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this activity align with normal work hours and maintenance windows?
  context: >-
    Legitimate diagnostic and debugging work typically occurs during business hours or scheduled
    maintenance. A signed tool sideloading a library at an unusual time — outside the user's working
    hours or with no maintenance window in effect — is more suspicious than the same activity during a
    documented troubleshooting session. Confirm whether the host's local time and the account's normal
    schedule are consistent with hands-on diagnostic use.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
