name: New BgInfo.EXE Custom VBScript Registry Configuration
id: 96f00bef-2f13-4a96-bf62-05e6b52b3382
description: |
  Detects a registry write under \Software\Winternals\BGInfo\UserFields\ whose value data begins with 4, the
  BgInfo field type that supplies a custom field from a VBScript. BgInfo is a signed Sysinternals utility, and it
  evaluates that script itself, in its own process, every time it runs, so the setting turns a Microsoft-signed
  binary into a launcher for whatever script the value names. IT teams genuinely deploy BgInfo with custom script
  fields through group policy and login scripts, so the setting alone is not the finding; determine which script
  was configured, whether it sits somewhere the organization controls, who wrote the value, and whether the same
  field is configured across the fleet as a managed rollout or only on this host.
type: detection
detection_id: 992dd79f-dde8-4bb0-9085-6350ba97cfb3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the alerting write target a BgInfo UserFields value, and does its data begin with the VBScript field type?
  context: >-
    The rule fires on one condition with two parts that must both hold, a key path containing
    \Software\Winternals\BGInfo\UserFields\ and value data starting with 4, which is the field type BgInfo reads as
    a custom VBScript rather than a built-in system attribute. Confirm both, then read the rest of the value data,
    which names the script. The signer columns describe the writing process and are not a verdict; BgInfo is a
    genuinely signed utility, so read them for coherence with the key instead, a Sysinternals or deployment binary
    writing this field is self-consistent, a script host or an unrelated binary writing it is not.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - registry_event
- question: Is this user and host expected to configure a custom BgInfo script field?
  context: >-
    A custom BgInfo field backed by a script is normal when IT builds and distributes it, so the account and the host
    carry more weight than the setting. A desktop-engineering account or a build or deployment host writing this value
    fits routine practice; an ordinary user account, a server outside the desktop estate, or a host that receives its
    configuration only from policy does not. User attribution is present on most endpoint registry events; when it is
    a machine account or missing, judge from the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What launched the process that configured this BgInfo script field?
  context: >-
    The registry event names the writing process but not what started it. Looking that process up by its own
    identifier returns its parent, which separates a managed chain such as a login script under userinit.exe or a
    configuration agent applying policy from an interactive shell, a script host, or an Office application. Registry
    telemetry does not carry the writing process's parent, so this pivot into process telemetry is the only way to
    see it. Filtering the usual registry tools out of view would hide exactly the distinction this rule turns on, so
    read the lineage rather than allowlisting regedit.exe or msiexec.exe.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other processes did the process that configured this field spawn?
  context: >-
    Configuring a script-backed BgInfo field is a setup step, and the session that performs it often also stages the
    script, copies BgInfo, or tests the result. Listing the children the writing process launched shows whether this
    was an isolated configuration change or one step in a longer sequence. Note this shows what the writing process
    started, not what started alongside it, because registry events do not record the writing process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Was this BgInfo script field part of a documented deployment or change?
  context: >-
    A custom BgInfo field that IT built usually leaves a record, a change entry, a package in the distribution system,
    or a group policy object that names the script. A record that also names the same script file and the same
    location closes this quickly; a record describing a different script, or naming no script at all, does not.
    Answer this from change and deployment systems rather than from the alert.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: Which UserFields entry was configured, and does the writing process plausibly own this setting?
  context: >-
    The segment of the key path after UserFields\ is the display name of the custom field, and the field type in the
    value data decides how BgInfo produces its content, with type 4 meaning it runs a VBScript in its own process on
    every execution. That gives this location a persistence-like effect without a Run key or a service. The judgment
    is whether the vendor behind the writing process plausibly owns this setting, a Sysinternals or deployment-tool
    binary is coherent, a script host or an unrelated signed utility is not. Trusted signing holds for nearly every
    alerting process and is not exculpatory on its own.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - registry_event
- question: What script does the value data name, and is it local, on a UNC or network share, or in a user-writable directory?
  context: >-
    The value data is the payload here. Past the leading type marker it carries the script BgInfo will evaluate,
    either as a path or as inline content, and BgInfo runs it inside the signed binary rather than handing it to a
    script host. A script under a controlled deployment share is the common benign case; a UNC path to an unfamiliar
    server, a path under Temp, AppData, ProgramData, or a user profile, or content that reaches out to the network or
    launches a shell puts execution under the signed binary outside administrative control. Value data is recorded on
    most registry modifications but not all, so if it is absent, recover the configured script from the file BgInfo
    later reads or from the deployment package.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
  answer_sources:
  - registry_event
  - manual_review
- question: Who is able to write to the location holding the configured script, and is that location a share BgInfo reads from on every run?
  context: >-
    BgInfo re-reads its configured script each time it executes, so the file, not the registry value, is the durable
    control point. If the script lives on a share that ordinary users, a broad group, or a service account can write
    to, a single edit to that one file changes what runs everywhere BgInfo is deployed, and no further registry
    activity is needed. Establish the effective permissions on the path, who last modified the file, and whether the
    share is one the organization publishes deployment content from. Answer this from file-share permissions and
    deployment documentation rather than from the alert.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: Were other registry modifications made on this host around the same time?
  context: >-
    A configuration write that belongs to a deployment arrives alongside the rest of that deployment's registry
    activity and under the same account. A write that arrives alone, or next to autostart, service, or
    security-policy changes from the same process inside the same window, points at a hands-on session rather than a
    packaged install. The triggering key appears in these results; the signal is what else was written beside it,
    including any other UserFields entries configured in the same pass.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
  answer_sources:
  - registry_event
- question: Did the process that configured this field, or its children, also write the script file to disk?
  context: >-
    The configured field only produces execution if the script exists where the value points, so establishing whether
    the same session staged that file locally determines whether the setting is live and what BgInfo would evaluate on
    its next run. Correlating file activity by the writing process and its children catches the drop that usually
    lands in the same session as the registry write. If the script sits on a share instead, expect no local write here
    and pursue the share instead. File-write events carry no hash; if a script or binary is present, hash it from a
    later execution or retrieve it for a reputation lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Did BgInfo run after this field was configured, and did it start any child processes?
  context: >-
    The setting takes effect the next time BgInfo executes, which on a deployed setup is at logon and in a hands-on
    session may be seconds after the write. BgInfo evaluates the configured VBScript inside its own process, so a run
    that produces no child process is normal and is not evidence the script did nothing. A child under BgInfo, such as
    a shell, a script host, a transfer utility, or an unfamiliar binary, is the case worth pursuing, because it means
    the script reached outside the interpreter. Zero BgInfo executions in this window means the field has not been
    read yet, not that it is inert.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_run:
        Image|endswith:
          - '\bginfo.exe'
          - '\bginfo64.exe'
      selection_child:
        ParentImage|endswith:
          - '\bginfo.exe'
          - '\bginfo64.exe'
      condition: selection and (selection_run or selection_child)
    fields:
      - Image
      - CommandLine
      - ParentImage
  answer_sources:
  - process_creation
  - registry_event
- question: Did wscript.exe or cscript.exe run on this host around the configuration change?
  context: >-
    BgInfo hosts the VBScript engine itself, so the configured script normally executes with no script-host process at
    all, and the absence of wscript.exe or cscript.exe here does not clear the field. Their presence is what informs
    the picture, either because the same script was also tested or run directly through a script host while it was
    being set up, or because the session that configured the field was already running scripted tooling. Compare any
    script path on these command lines against the path configured in the registry value.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_scripthost:
        Image|endswith:
          - '\wscript.exe'
          - '\cscript.exe'
      condition: selection and selection_scripthost
    fields:
      - CommandLine
      - ParentImage
      - User
  answer_sources:
  - process_creation
- question: Did BgInfo open network connections from this host after the field was configured?
  context: >-
    A script path on a UNC or remote share makes BgInfo fetch the script over the network on every run, and the script
    it evaluates can itself reach out, so the connections BgInfo opens name the servers actually involved. Connections
    to a file server inside the deployment scope support the routine reading; connections to an unfamiliar internal
    host, a workstation-range address, or an external address do not, and an external destination from a
    wallpaper-rendering utility has no ordinary explanation. No connections at all is consistent with a script held
    locally.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_proc:
        Image|endswith:
          - '\bginfo.exe'
          - '\bginfo64.exe'
      condition: selection and selection_proc
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
- question: Has this BgInfo field been configured on this host before, and was it set to the same value?
  context: >-
    A value written repeatedly with identical data is a login script or policy reapplying a stable configuration. A
    first-ever write, or a write that changes a long-stable value to point at a different script, is the case worth
    explaining, and a value that changes repeatedly while the field name stays fixed suggests the script reference is
    being swapped. Registry value deletion is not recorded by endpoint telemetry, so judge whether the setting was
    reverted from this modification history rather than from any removal event.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
  answer_sources:
  - registry_event
- question: Which other hosts have a script-backed BgInfo field configured, and do they all point at the same script?
  context: >-
    Fleet distribution is the strongest discriminator for this setting, because one script referenced by many hosts is
    a single file that executes everywhere BgInfo runs. Many hosts carrying the same field and the same script,
    written by the same process, reads as a policy or login-script rollout, and the follow-up is confirming who
    controls that one file. This host carrying a field no other host has, or pointing at a script the rest of the
    fleet does not use, narrows the question to who configured this host differently and from where. The query matches
    any UserFields entry whose data marks it as script-backed, not only the field name from this alert; value data is
    absent on a minority of registry modifications, so treat this as a floor rather than a complete census.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|contains: \Software\Winternals\BGInfo\UserFields\
        Details|startswith: '4'
      condition: selection
    fields:
      - host.name
      - TargetObject
      - Image
      - Details
  answer_sources:
  - registry_event
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Aggregating process starts around the write collapses routine agent and service noise into high-count rows while
    novel parent-child pairs stand out at low counts. Look at what preceded the write, an interactive shell, a script
    host, a remote-management binary, and what followed it, since a configuration change reads differently depending
    on the session it sits in.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host help place this configuration write in a sequence. Reconnaissance, credential
    access, or defense tampering ahead of it changes what the write likely represents; a quiet timeline before it
    supports the routine-deployment reading.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Were other persistence mechanisms installed on this host around the same time?
  context: >-
    A script-backed BgInfo field re-executes on every BgInfo run without an autostart entry of its own, which makes it
    a foothold that ordinary autostart review does not surface. Operators who take one foothold commonly add backups
    through different techniques, scheduled tasks, services, registry autostarts, BITS jobs, or WMI subscriptions.
    Several persistence tools running in the same window indicate stacking rather than an isolated configuration
    change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
