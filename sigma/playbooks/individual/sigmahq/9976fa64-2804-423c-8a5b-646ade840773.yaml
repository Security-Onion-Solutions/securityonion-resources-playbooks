name: Suspicious Outbound SMTP Connections
id: 7ff672c3-3baf-4f11-8267-4f653c386d1e
description: |
  Detects an outbound network connection to a common SMTP port (25, 587, 465, or 2525) that a
  process initiated (egress) where the initiating process is NOT one of the recognized mail
  clients or mail-server binaries: Thunderbird, Outlook, the packaged Outlook/HxTsr host, and the
  Exchange Server executables are all excluded. Normal mail flows through those clients or the mail
  server; a scripting host, utility, or line-of-business process opening a direct SMTP connection is
  the anomaly, and is a common way to exfiltrate data over an unencrypted non-C2 protocol by
  attaching a file or staged archive to a message. Investigate which process opened the connection
  and what it was configured to send, what data was staged or attached, where the mail was destined,
  whether the destination and process are normal for this host, and whether the pattern appears on
  other hosts.
type: detection
detection_id: 9976fa64-2804-423c-8a5b-646ade840773
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Do the destination and port match a suspicious outbound SMTP connection, and which process initiated it?
  context: >-
    Confirm the alert by reviewing the destination IP, the destination port (25, 587, 465, or 2525),
    the direction, and the initiating process against the rule's criteria. The rule fires only when a
    process other than a recognized mail client or mail-server binary opens the outbound SMTP
    connection, so identifying that initiating process is the first triage step.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Initiated
- question: Is this user and host expected to send mail directly over SMTP without a mail client?
  context: >-
    Legitimate mail flows go through mail clients or the mail server, both of which the rule excludes.
    A general-purpose host or account opening an SMTP connection from a scripting or utility process is
    unusual, so knowing whether the user role and host function include any sanctioned direct-SMTP
    automation (monitoring agents, backup notifiers, line-of-business apps) is often the fastest way to
    separate a true positive from routine operations.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the process that opened the SMTP connection, and what does its command line show it was doing?
  context: >-
    The network event names the initiating process but not its full command line. Pivot to the process
    record to read the command that ran — a Send-MailMessage call, a script invoking an SMTP library, or
    a utility with a mail-server argument reveals whether this was a deliberate direct-SMTP send and what
    it was configured to transmit.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What is the SMTP destination, and what do DNS, WHOIS, and threat intel reveal about it?
  context: >-
    Investigate the destination address the connection was made to: reverse DNS, registration age,
    whether it is a known mail provider or an unfamiliar host, and any threat-intel hits. Mail sent to a
    recognized corporate relay differs sharply from mail pushed to a recently registered or
    attacker-controlled endpoint. Reputation lookups are manual — check passive DNS and WHOIS on the
    destination IP.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - DestinationPort
- question: What files did the initiating process read or stage before the outbound SMTP send?
  context: >-
    SMTP exfiltration commonly attaches a file or a staged archive to the message. Files the sending
    process touched around the connection — documents, spreadsheets, archives, or broad wildcard
    collections — indicate what data may have left the host and which business units are affected. The
    working directory of the process often reveals the data source location.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: Was the outgoing data compressed, encrypted, or password-protected before it was sent?
  context: >-
    Attackers frequently archive and encrypt data before exfiltration so its contents cannot be
    inspected in transit. Look in the sending command for archive or encryption flags (-p, -hp,
    --passphrase, -c, -e) or a reference to an already-encrypted attachment. Encrypted outbound content
    is a stronger indicator of deliberate theft than plain attachments; note that some tools accept a
    password via stdin, which will not appear in the command line.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Where was the data staged or written on disk before or after the SMTP send?
  context: >-
    Direct-SMTP exfiltration usually stages data locally first — an archive built in a temp or working
    directory, then attached and sent. Files the initiating process wrote around the connection reveal
    the staging path and whether the same data was also copied elsewhere, which helps scope the
    exposure. Pair this with the outbound-connection evidence to reconstruct the collection-to-send path.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
      - Image
- question: What launched the process that opened the SMTP connection, and is that parent chain expected?
  context: >-
    The network event carries no command line for the initiating process, so pivot by ProcessGuid to its
    process record to read the parent image and command line. A process that should never send mail
    directly — an Office application, a script host such as wscript.exe or mshta.exe, or an unsigned
    binary — spawning the SMTP-initiating process points to macro-driven or scripted exfiltration rather
    than a sanctioned automation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Does this host normally connect to this destination over SMTP?
  context: >-
    First-time connections to a mail destination are more suspicious than routine traffic to an
    established relay. A history showing zero or very few prior connections to this address marks it as
    new infrastructure for this host rather than a regular business correspondent.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
- question: Does this host normally run the process that initiated the SMTP connection?
  context: >-
    A sending process that has never run on this host, or runs only rarely, raises the weight of the
    alert. A process that executes routinely points to established automation, though its historical use
    should still be checked against whether it has previously opened outbound SMTP rather than only local
    activity. Zero or very low counts indicate first-time or rare execution.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: What other processes did the SMTP-initiating process spawn afterward?
  context: >-
    The children of the sending process reveal its broader activity — additional data collection,
    further network tools, or cleanup. Unexpected children such as archiving utilities, additional
    interpreters, or credential-access tools indicate the SMTP send was one step in a larger operation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Exfiltration rarely happens in isolation. Aggregating process activity in a tight window around the
    connection surfaces what led up to the send and what followed; novel parent-child pairs stand out at
    low counts against routine high-count telemetry and point to the staging or collection steps.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: When this host has previously fired this SMTP pattern, which processes and users drove it, and does the current alert fit?
  context: >-
    The query mirrors the rule's selection — outbound SMTP on these ports, excluding recognized mail
    clients and servers — scoped to this host. The resulting program and user distribution shows which
    executables have historically initiated this firing pattern here. A new initiating process, an
    unexpected account, or a first-ever occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        DestinationPort:
        - 25
        - 587
        - 465
        - 2525
        Initiated: 'true'
      filter_clients:
        Image|endswith:
        - \thunderbird.exe
        - \outlook.exe
      filter_mailserver:
        Image|startswith: C:\Program Files\Microsoft\Exchange Server\
      filter_outlook:
        Image|startswith: C:\Program Files\WindowsApps\microsoft.windowscommunicationsapps_
        Image|endswith: \HxTsr.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_*) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts fired this SMTP pattern in the past week, and does the distribution look like automation or isolated activity?
  context: >-
    The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this
    outbound-SMTP pattern rather than generic mail traffic. Many hosts showing the same pattern points to
    a shared script, agent, or misconfigured application; a single host or a small unrelated set points
    to targeted or hands-on activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        DestinationPort:
        - 25
        - 587
        - 465
        - 2525
        Initiated: 'true'
      filter_clients:
        Image|endswith:
        - \thunderbird.exe
        - \outlook.exe
      filter_mailserver:
        Image|startswith: C:\Program Files\Microsoft\Exchange Server\
      filter_outlook:
        Image|startswith: C:\Program Files\WindowsApps\microsoft.windowscommunicationsapps_
        Image|endswith: \HxTsr.exe
      condition: selection and not 1 of filter_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — collection, defense tampering, or credential access — may
    reveal the stages that preceded the outbound send and help reconstruct the timeline. Exfiltration is
    typically a late-stage action, so preceding alerts often show how the data was gathered.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: How many outbound SMTP connections did this process make, and to how many distinct destinations?
  context: >-
    A single legitimate notification produces one or a few connections to one relay; bulk exfiltration or
    beacon-style sending produces repeated connections or fan-out to multiple destinations. Counting this
    process's SMTP connections and distinct destination addresses gauges the volume and whether the
    pattern resembles a one-off message or sustained transfer.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        DestinationPort:
        - 25
        - 587
        - 465
        - 2525
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
