name: Tap Installer Execution
id: fd721d9b-8370-4dcc-be1e-58d851c90c79
description: |
  Detects execution of tapinstall.exe, the command-line installer for the OpenVPN-family TAP virtual network adapter, when
  it runs from a path other than the bundled Avast SecureLine VPN, OpenVPN Connect, or ProtonVPN driver directories. The rule
  fires when the Image path ends in tapinstall.exe AND none of those three vendor path filters match. Installing a TAP adapter
  creates a virtual network interface, which is routine for VPN clients, virtualisation platforms, and container or subsystem
  networking, and is also the setup step for a tunnel that carries traffic outside the monitored network path (T1572, T1090,
  T1048). The adapter alone is not the finding: determine which product installed it, whether software installation was expected
  on this host and from this account, and whether the host then sent traffic to an endpoint it does not normally reach.
type: detection
detection_id: 99793437-3e16-439b-be0f-078782cf953d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the alerting process match what this rule detects — an Image path ending in tapinstall.exe outside the three
    filtered vendor driver directories?
  context: >-
    The rule keys on the Image path only; there are no command-line criteria. Confirm the process really is tapinstall.exe
    and note the full path it ran from, because the path is what excluded it from the Avast SecureLine, OpenVPN Connect, and
    ProtonVPN filters. A copy under an installer temp directory, a user profile, or a product directory not on the filter list
    is the normal way this rule fires and does not by itself mean the install was unauthorised.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
  answer_sources:
  - alert
  - process_creation
- question: Is software installation expected on this host, and is this user expected to install network drivers here?
  context: >-
    Installing a TAP adapter requires administrative rights and loads a driver, so it is a deliberate act by someone holding
    that right. A laptop where the user installs their own VPN client is a different picture from a server or kiosk that suddenly
    gains a virtual network interface. Check the account against its role and check for a change ticket or a managed software
    deployment covering this host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What exactly did the TAP installer do — was it installing an adapter, removing one, or enumerating existing devices?
  context: >-
    tapinstall.exe is a rebuilt devcon and takes a verb plus a hardware ID (install with an .inf path and a hwid such as tap0901
    or wintun, remove, removeall, status, find). The verb tells you whether an interface was added, and the hwid and .inf path
    identify the driver package and therefore the product. The CurrentDirectory frequently points at the extracted installer
    payload, which locates the wider install on disk.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: Is the alerting binary a genuine, signed TAP installer, or a renamed or repackaged copy?
  context: >-
    The rule matches on file name, so any copy named tapinstall.exe fires it and a copy renamed to anything else evades it.
    Compare OriginalFileName and the file hash against the vendor's published installer, and check the code signature. An unsigned
    binary, a signature from a signer unrelated to any deployed VPN or virtualisation product, or an OriginalFileName that
    disagrees with the on-disk name all move this from a product install toward an operator-supplied tool.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - OriginalFileName
      - Hashes
      - Image
      - CurrentDirectory
  answer_sources:
  - process_creation
  - external_threat_intel
  - manual_review
- question: What process launched the TAP installer, and does that parent identify a recognised VPN or virtualisation product?
  context: >-
    The parent chain is the fastest route to "which product installed this". A vendor setup executable, an msiexec-hosted install,
    or a managed software-deployment agent points at a deployed product; a shell, script host, remote-management tool, or an
    office application spawning the installer points at an operator-driven install. Note the parent's own path and command
    line, not just its name.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What files did the TAP installer write to this host?
  context: >-
    The written files identify the driver package: an .inf, .cat, and .sys under the driver store, plus any staged copy the
    installer extracted first. The install path and file names name the product more reliably than the process path does, and
    a package staged from a user-writable or temp directory rather than a product directory is worth following back to how
    it got there.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
  answer_sources:
  - process_creation
- question: What driver did this install place on the host, and who signed it?
  context: >-
    A TAP adapter is a kernel driver, so the load event carries the signer and signature status that the process event does
    not. A driver signed by a VPN or virtualisation vendor that the organisation actually deploys resolves this quickly; an
    unsigned driver, an unknown signer, or a signature status other than valid is the point where the install stops looking
    like product behaviour. Compare the driver path against the install path the installer wrote to.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - ImageLoaded
      - Signature
      - SignatureStatus
      - Signed
      - Hashes
  answer_sources:
  - process_creation
  - edr_console
- question: After the adapter was installed, did this host send traffic to an endpoint it does not normally reach?
  context: >-
    The point of a virtual adapter is to carry traffic, so the traffic that follows is the evidence, not the install. Look
    for egress from a process that is not part of a recognised deployed VPN client, connections to an unfamiliar destination
    or a non-standard port, and sustained volume — a single connection moving tens of megabytes outbound, roughly 50MB or
    more, is worth reading closely, as is transfer outside the hours this host normally works. Traffic that stops appearing
    in network telemetry after the adapter appears is the same finding seen from the other side.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      filter_system:
        Image|endswith:
        - \svchost.exe
        - \services.exe
        - \lsass.exe
        - \wininit.exe
        - \MsMpEng.exe
      condition: selection and not filter_system
    fields:
      - Image
      - DestinationIp
      - DestinationPort
  answer_sources:
  - network_connection
  - organizational_knowledge
- question: Has this host run a TAP installer before, and under which accounts?
  context: >-
    A host that installs or reinstalls a TAP adapter periodically is running a VPN client that updates itself. Zero prior executions
    over 90 days means this is the first virtual adapter this host has gained, which is the case worth pursuing. The account
    breakdown separates a product updater running under a service principal from a person installing something.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and
    does the current alert fit that pattern?
  context: >-
    The query mirrors the rule's selection and its vendor-path filters, scoped to this host, so the parent and user distribution
    reflects how this specific pattern has run here rather than generic TAP usage. A parent that has driven this install before
    is product behaviour repeating; a parent or account new to this pattern on a host that otherwise has a settled install
    history is the deviation to chase.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \tapinstall.exe
      filter_optional_avast:
        Image|contains:
        - :\Program Files\Avast Software\SecureLine VPN\
        - :\Program Files (x86)\Avast Software\SecureLine VPN\
      filter_optional_openvpn:
        Image|contains: :\Program Files\OpenVPN Connect\drivers\tap\
      filter_optional_protonvpn:
        Image|contains: :\Program Files (x86)\Proton Technologies\ProtonVPNTap\installer\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_optional_*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection and vendor-path filters scoped to this user, so the result is their 90-day history
    of this specific install pattern across hosts, not generic tool usage. A user who installs TAP adapters routinely is likely
    a network or endpoint administrator, or someone whose VPN client updates on their own machine. A user with no such history,
    or one whose role does not include installing drivers, is the account to ask about.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \tapinstall.exe
      filter_optional_avast:
        Image|contains:
        - :\Program Files\Avast Software\SecureLine VPN\
        - :\Program Files (x86)\Avast Software\SecureLine VPN\
      filter_optional_openvpn:
        Image|contains: :\Program Files\OpenVPN Connect\drivers\tap\
      filter_optional_protonvpn:
        Image|contains: :\Program Files (x86)\Proton Technologies\ProtonVPNTap\installer\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this parent process historically driven the rule's pattern on this host or across the environment, or is the
    parent new for this activity?
  context: >-
    Driver installs frequently run under SYSTEM or a machine account via an installer service, and then the user field attributes
    nothing. The launch mechanism is the pivot that still works: this counts the 90-day history of this parent driving this
    install pattern, by host. A parent already accounting for installs across many hosts is a deployed product or a management
    agent; a parent new to this pattern is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \tapinstall.exe
      filter_optional_avast:
        Image|contains:
        - :\Program Files\Avast Software\SecureLine VPN\
        - :\Program Files (x86)\Avast Software\SecureLine VPN\
      filter_optional_openvpn:
        Image|contains: :\Program Files\OpenVPN Connect\drivers\tap\
      filter_optional_protonvpn:
        Image|contains: :\Program Files (x86)\Proton Technologies\ProtonVPNTap\installer\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    An install that is part of a person setting up a VPN client sits alongside browser and installer activity on their own
    machine. The same account driving process activity on several hosts in the same window, particularly on hosts that account
    does not normally touch, changes the scope of the question from one endpoint to an identity.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this
    host?
  context: >-
    Under a service principal, asking what else the user did returns agent telemetry from every host. Whether the same launch
    mechanism fired elsewhere in the same window is the answer that carries information: several hosts at once points to a
    scheduled or pushed VPN rollout, while a single host installing a virtual adapter on its own is the case that needs an
    explanation.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \tapinstall.exe
      filter_optional_avast:
        Image|contains:
        - :\Program Files\Avast Software\SecureLine VPN\
        - :\Program Files (x86)\Avast Software\SecureLine VPN\
      filter_optional_openvpn:
        Image|contains: :\Program Files\OpenVPN Connect\drivers\tap\
      filter_optional_protonvpn:
        Image|contains: :\Program Files (x86)\Proton Technologies\ProtonVPNTap\installer\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating parent-child pairs around the alert separates the install from its surroundings. An install wrapped in setup
    executables, msiexec, and driver-signing helpers reads as a product installation. The same install preceded or followed
    by remote-management tooling, archiving utilities, credential tooling, or a script host is a different sequence and sets
    the priority for the rest of the investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent
    automation or one-off activity?
  context: >-
    This mirrors the rule's selection and vendor-path filters fleet-wide, so the count is of this pattern rather than of TAP
    usage in general. A managed VPN rollout shows up as many hosts firing on a schedule with the same parent, which explains
    the alert. One host, or a small set with no common parent, is the distribution that keeps the question open, and that difference
    is evidence in its own right rather than background.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \tapinstall.exe
      filter_optional_avast:
        Image|contains:
        - :\Program Files\Avast Software\SecureLine VPN\
        - :\Program Files (x86)\Avast Software\SecureLine VPN\
      filter_optional_openvpn:
        Image|contains: :\Program Files\OpenVPN Connect\drivers\tap\
      filter_optional_protonvpn:
        Image|contains: :\Program Files (x86)\Proton Technologies\ProtonVPNTap\installer\
      condition: selection and not 1 of filter_optional_*
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host reframe the install. Remote access tooling, defense tampering, or credential access
    preceding a new virtual network interface describes a sequence in which the adapter is the tunnel step; nothing preceding
    it, on a host whose owner installs their own software, describes a VPN client. Read the earlier alerts for what stage they
    represent, not just their severity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
