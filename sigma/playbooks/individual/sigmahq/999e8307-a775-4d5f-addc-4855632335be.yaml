name: Potential BlackByte Ransomware Activity
id: 3eddadca-3847-4cf1-9bf1-485d3c0661d2
description: |
  Detects command-line patterns used by BlackByte ransomware across its different operations. The rule fires when EITHER an
  executable running from C:\Users\Public\ is invoked with a ' -single ' argument, OR any command line contains one of four
  operational strings: a del against C:\Windows\System32\Taskmgr.exe, a ';Set-Service -StartupType Disabled $' fragment, an
  inline base64/Unicode decode construct passed to powershell -command, or a loop that starts wordpad.exe with /p. Those
  strings correspond, respectively, to the ransomware binary's per-infection launch flag, removal of the operator's monitoring
  tools, disabling of a security service, an obfuscated payload decode step, and a printer-harassment loop. The investigation
  should establish which branch fired, decode what the command actually did, determine whether shadow copies, backups and the
  recovery environment were inhibited and whether encryption has begun, and check whether the same pattern reached other hosts.
type: detection
detection_id: 999e8307-a775-4d5f-addc-4855632335be
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: >-
    Does the alerting event match either branch of this rule — an executable under C:\Users\Public\ invoked with ' -single ',
    or a command line carrying one of the rule's four listed strings?
  context: >-
    Confirm the alert against the rule's detection criteria before investing investigation time, and note WHICH branch fired,
    because it changes what the rest of the investigation weighs. A match on the C:\Users\Public\ plus ' -single ' branch means
    the alerting process is the suspected ransomware binary itself, running from a user-writable path, and the token after
    ' -single ' is a per-infection identifier rather than a file path or a flag. A match on the command-line-string branch means
    a single operational step ran — a system-binary deletion, a service disable, an inline base64 decode, or a print loop — and
    the alerting process is more likely a shell or interpreter than the encryptor.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: >-
    Is this user and host expected to run executables from C:\Users\Public\, or to delete system binaries and disable services
    from the command line?
  context: >-
    Legitimate administrative activity can trigger many detections, and both branches of this rule have thin benign
    equivalents: software packaged into C:\Users\Public\ by an installer, or a build or support script that removes a system
    utility and turns off a service. Knowing whether the user's role and the host's function support either explanation is
    usually the fastest way to separate routine operations from an intrusion.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Which files did the alerting process and its direct children create or remove, and are those files still on disk?
  context: >-
    The rule's command lines reference concrete on-disk artifacts — an executable staged under C:\Users\Public\ and the
    C:\Windows\System32\Taskmgr.exe binary targeted for deletion. This query correlates file activity to the alerting process
    and its direct children by process lineage, so it shows what was written, copied, or removed. Anything still on disk can be
    hashed and submitted for reputation analysis or content review; a deleted system binary has to be restored from a
    known-good source, and a staged executable that has since vanished points to a self-cleanup step.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What recovery-inhibiting commands were executed on this host, and did shadow copies, backups, and the recovery environment survive them?
  context: >-
    Recovery destruction is normally chained: shadow copies deleted through vssadmin or WMI, boot recovery disabled through
    bcdedit, backup catalogs removed through wbadmin, the recovery environment turned off through reagentc. This query surfaces
    all of those command forms on the host over the following 24 hours, which shows the intended scope. Process telemetry only
    proves a command was issued, not that it succeeded — verify the current state directly on the host with vssadmin list
    shadows, bcdedit /enum, reagentc /info, and wbadmin get versions, and confirm offline, tape, or cloud backup status through
    the backup system itself.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\reagentc.exe'
          - '\diskshadow.exe'
      selection_cmdline:
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'recoveryenabled'
          - 'bootstatuspolicy'
          - 'delete catalog'
          - 'delete systemstatebackup'
          - 'boot.ini'
          - 'winre.wim'
          - '/disable'
      condition: selection and (selection_recovery or selection_cmdline)
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
  - edr_console
- question: What other destructive or recovery-inhibiting actions occurred on this host?
  context: >-
    Ransomware execution chains several destructive steps together rather than issuing one: shadow copy deletion, recovery
    disabling, security-service stops, permission changes, and event-log clearing. This aggregation over the half hour either
    side of the alert shows which of those utilities ran and under which account, which separates a scripted sequence from an
    isolated administrative command. If the same parent drove all of them, the sequence was automated rather than typed.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_destructive:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\cipher.exe'
          - '\fsutil.exe'
          - '\icacls.exe'
          - '\takeown.exe'
          - '\attrib.exe'
          - '\sc.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\powershell.exe'
          - '\taskkill.exe'
      condition: selection and selection_destructive
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: Are there signs of file encryption, ransom notes, or ransomware binary execution on this host?
  context: >-
    Recovery-inhibiting actions typically precede file encryption by minutes, so the half hour after the alert is where the
    encryptor appears if it is going to. This query lists processes running outside the standard system paths in that window,
    which is where a binary staged in a user-writable directory, a renamed .tmp copy of it, or a shell launching one would
    surface. Pair it with a check for ransom-note files, mass file renames, and unfamiliar file extensions through file
    telemetry or the endpoint tooling to establish whether encryption has started and how far it has progressed.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_known:
        Image|startswith:
          - 'C:\Program Files'
          - 'C:\Windows\System32\svchost'
          - 'C:\Windows\System32\wbem'
      condition: selection and not filter_known
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: Is this same detection firing on other hosts in the environment?
  context: >-
    The same execution sequence is often pushed to many hosts at once or in rapid succession, so the count of hosts carrying
    this detection in the surrounding hour sets the containment boundary. The first-to-last detection interval shows how the
    activity spread and whether it is still spreading. A single host points to a host-local trigger; several hosts point to
    distribution through a shared mechanism such as a script, a scheduled task, or a management channel.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
  answer_sources:
  - process_creation
  - alert
- question: What exactly did the alerting command do? Decode its arguments and identify which operational step it performed.
  context: >-
    The full command line carries the operation. On the ' -single ' branch, the token that follows the flag is a per-infection
    identifier, not a path or a switch. On the string branch, read the specific step out of the command — a del against a
    System32 binary removes a monitoring tool the operator does not want used; a ';Set-Service -StartupType Disabled $'
    fragment turns a service off across reboots; the [System.Text.Encoding]::Unicode.GetString([System.Convert]::FromBase64String(
    construct decodes an inline base64 payload that has to be decoded before it can be read; a loop starting wordpad.exe /p
    prints a file repeatedly. This query is scoped to the host and to the rule's own command-line patterns rather than to the
    binary name, because these patterns are driven through cmd.exe, which is far too common to scope on. Multiple rows mean the
    steps were run as one scripted sequence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_pattern:
        CommandLine|contains:
          - ' -single '
          - 'del C:\Windows\System32\Taskmgr.exe'
          - ';Set-Service -StartupType Disabled $'
          - 'powershell -command "$x =[System.Text.Encoding]::Unicode.GetString([System.Convert]::FromBase64String('
          - ' do start wordpad.exe /p '
      condition: selection and selection_pattern
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What does the base64 string inside the PowerShell decode construct resolve to, and what does the decoded command execute?
  context: >-
    The rule matches an inline construct that reads a base64 literal, converts it to Unicode text, and hands the result to
    powershell -command for execution. The wrapper is readable but the payload is not, so extract the base64 literal from the
    alerting command line and decode it to Unicode to see what actually ran. Decoded content at this stage typically stops a
    security service, removes a scheduled task, or deletes shadow copies through WMI. Treat the decoded text, not the wrapper,
    as the description of the action taken.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Did PowerShell script block logging capture the full script content?
  context: >-
    Event ID 4104 records the deobfuscated script content PowerShell actually executed, which is ground truth when the command
    line contains only a base64 literal wrapped in a decode construct. It also captures follow-on script activity that never
    reached a command line at all, such as WMI-driven shadow-copy deletion. If PowerShell operational logs are not ingested in
    this environment, treat zero results as a visibility gap rather than evidence that nothing ran, and fall back to decoding
    the base64 literal out of the alerting command line by hand.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
  answer_sources:
  - powershell_script_block
- question: Were PowerShell security controls bypassed or weakened before this execution?
  context: >-
    Security controls are normally weakened before a payload runs, not after. The rule's own ';Set-Service -StartupType
    Disabled $' fragment is one form of that; this query looks for the adjacent forms in the preceding hour — AMSI patching,
    execution-policy bypass, real-time monitoring being turned off through Set-MpPreference, and version-2 downgrade to escape
    logging. Finding these establishes the ordering of the sequence and identifies which controls were already off by the time
    the alerting command ran.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Which processes on this host made outbound network connections around the alert, and how many distinct destinations did each contact?
  context: >-
    Impact-stage activity is usually paired with network activity: command-and-control, data staged and uploaded before
    encryption, or a burst of connections to many destinations. The connecting process is frequently not the alerting binary,
    because code injected into an ordinary signed process makes its connections under that process's identity, so review every
    non-standard image in the result rather than only the one named in the alert. A high count of distinct destination
    addresses from one process, or a sustained connection rate to a single address, are the two patterns worth separating. This
    query keeps only outbound connections and excludes the Program Files, svchost, and wbem system paths so that routine
    service traffic does not dominate the result.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      filter_known:
        Image|startswith:
          - 'C:\Program Files'
          - 'C:\Windows\System32\svchost'
          - 'C:\Windows\System32\wbem'
      condition: selection and not filter_known
    fields:
      - Image
      - DestinationIp
      - DestinationPort
  answer_sources:
  - network_connection
  - process_creation
- question: >-
    When this host has previously produced the rule's pattern, what parents and users drove that activity, and does the current
    alert fit that history?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution
    reflects how the rule's specific firing pattern — not generic command-shell usage — has historically run here. For a
    detection this narrow the expected answer is an empty result, which makes the current alert the first occurrence. If rows
    do come back, a new parent process or an unexpected account against an otherwise stable history is the deviation worth
    chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        Image|startswith: C:\Users\Public\
        CommandLine|contains: ' -single '
      selection_2:
        CommandLine|contains:
        - del C:\Windows\System32\Taskmgr.exe
        - ;Set-Service -StartupType Disabled $
        - powershell -command "$x =[System.Text.Encoding]::Unicode.GetString([System.Convert]::FromBase64String(
        - ' do start wordpad.exe /p '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the user's 90-day history of the
    rule's specific firing pattern rather than generic use of a command shell, aggregated by host. A user who has never
    produced this pattern is a different situation from one who does so regularly; weigh the count against the user's role and
    their normal toolset. Note that this pivot loses meaning when the alert fires under a machine account or a built-in service
    identity.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        Image|startswith: C:\Users\Public\
        CommandLine|contains: ' -single '
      selection_2:
        CommandLine|contains:
        - del C:\Windows\System32\Taskmgr.exe
        - ;Set-Service -StartupType Disabled $
        - powershell -command "$x =[System.Text.Encoding]::Unicode.GetString([System.Convert]::FromBase64String(
        - ' do start wordpad.exe /p '
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: >-
    Has this parent process historically driven the rule's pattern on this host or across the environment, or is the parent new
    for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute behavior, and the meaningful pivot becomes
    the launch mechanism. The query mirrors the rule's selection structure scoped to the alerting parent process, so the result
    is the 90-day history of that parent driving this specific pattern rather than generic parent-and-binary co-occurrence. A
    new or rare parent for this pattern is the deviation worth chasing; a parent already accounting for thousands of prior
    events is vendor or operating-system automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        Image|startswith: C:\Users\Public\
        CommandLine|contains: ' -single '
      selection_2:
        CommandLine|contains:
        - del C:\Windows\System32\Taskmgr.exe
        - ;Set-Service -StartupType Disabled $
        - powershell -command "$x =[System.Text.Encoding]::Unicode.GetString([System.Convert]::FromBase64String(
        - ' do start wordpad.exe /p '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the account's activity across every host, rather than only the alerting one, shows whether the operator moved
    laterally or worked several endpoints at once. The same account driving comparable activity on multiple hosts widens the
    containment boundary. When the alert fires under a machine account or a built-in service identity this result is dominated
    by routine agent telemetry and the parent-driven view is the one that carries signal.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, asking what else the user did across the network returns agent telemetry, because every host
    runs system-owned agents constantly. The launch mechanism is the meaningful pivot instead: this query mirrors the rule's
    selection structure scoped to the alerting parent process, fleet-wide, within the alert window. Multiple hosts in the same
    window point to a scheduled or pushed sequence; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        Image|startswith: C:\Users\Public\
        CommandLine|contains: ' -single '
      selection_2:
        CommandLine|contains:
        - del C:\Windows\System32\Taskmgr.exe
        - ;Set-Service -StartupType Disabled $
        - powershell -command "$x =[System.Text.Encoding]::Unicode.GetString([System.Convert]::FromBase64String(
        - ' do start wordpad.exe /p '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: >-
    Have other hosts produced the rule's pattern in the past week, and does the cross-host distribution look like consistent
    automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the rule's
    firing pattern over the past week rather than generic usage of a command shell. Many hosts producing the same pattern
    points to scripted deployment or vendor automation; one host, or a small unrelated set, points to hands-on operator
    activity. Unlike the alert-based cross-host view, this reaches back through raw process telemetry and therefore also covers
    the period before the detection was in place.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        Image|startswith: C:\Users\Public\
        CommandLine|contains: ' -single '
      selection_2:
        CommandLine|contains:
        - del C:\Windows\System32\Taskmgr.exe
        - ;Set-Service -StartupType Disabled $
        - powershell -command "$x =[System.Text.Encoding]::Unicode.GetString([System.Convert]::FromBase64String(
        - ' do start wordpad.exe /p '
      condition: 1 of selection_*
    fields:
    - host.name
  answer_sources:
  - process_creation
