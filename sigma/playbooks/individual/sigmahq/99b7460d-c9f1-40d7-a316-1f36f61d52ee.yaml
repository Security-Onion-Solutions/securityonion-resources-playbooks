name: Cscript/Wscript Uncommon Script Extension Execution
id: 5125dfab-9eed-4a13-ba3c-e84448901844
description: |
  Detects the Windows script hosts cscript.exe or wscript.exe running a file whose extension is
  not a script extension (.csv, .dat, .doc, .gif, .jpeg, .jpg, .png, .ppt, .txt, .xls, .xml). The
  rule fires when the process is identified as a script host either by its OriginalFileName
  (wscript.exe, cscript.exe) or by an image path ending in \wscript.exe or \cscript.exe, and its
  command line contains one of those extensions. The script hosts run whatever VBScript or JScript
  content a file holds regardless of what the file is named, so an unusual extension is a way to
  get script content past extension-based application control and past a reviewer scanning file
  names, not a technical requirement of the execution. Script hosts also have routine enterprise
  use — logon scripts, vendor installers, management agents — so the investigation turns on the
  file extension, its path, and what the script did, not on the interpreter itself.
type: detection
detection_id: 99b7460d-c9f1-40d7-a316-1f36f61d52ee
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: >-
    Does the alerting command line contain one of the flagged file extensions, and was the script
    host matched on its OriginalFileName or on its image path?
  context: >-
    The rule fires when a process is identified as a Windows script host by either of two branches
    — OriginalFileName of wscript.exe or cscript.exe, or an image path ending in \wscript.exe or
    \cscript.exe — and its command line contains one of .csv, .dat, .doc, .gif, .jpeg, .jpg, .png,
    .ppt, .txt, .xls, or .xml. Note which branch matched, because it changes what the rest of the
    investigation weighs: an OriginalFileName match whose image path is outside System32 or
    SysWOW64 means the host binary was copied or renamed, making the path and origin questions
    load-bearing, while an image-path match under System32 leaves the extension and the script
    file itself as the whole of the finding. Confirm the extension belongs to the file being
    executed rather than appearing incidentally in an unrelated argument.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: >-
    Is this user and host expected to run scripts through cscript.exe or wscript.exe, and is the
    time of the execution consistent with that activity?
  context: >-
    Script hosts are routine on many estates — logon scripts, vendor installers, management
    agents, and packaged line-of-business tooling all invoke them. What is not routine is a script
    file carrying a document, image, or data extension. Establish whether this account and this
    host have a reason to run scripts at all, and whether the execution falls inside a maintenance
    or patching window or outside the hours the account normally works, since off-hours execution
    under an interactive account narrows the set of benign explanations.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: >-
    Which file did the script host execute, where does that file live, and was an engine forced on
    the command line?
  context: >-
    Read the full command line and the working directory to recover the exact file passed to the
    host. A file under a user profile, a temp directory, a download folder, or a UNC or web path
    is a different finding from one under a managed application directory. Because the extension
    is not a script extension, the host either relied on a registry engine mapping or was told
    which engine to use with a //E: argument, so note that argument if present. Other arguments
    worth recovering are //B (suppress dialogs and errors), //T (timeout), and any parameters
    passed through to the script itself. The query returns script-host executions on this host in
    the same window that carry one of the flagged extensions, so a multi-step operation split
    across sequential invocations stays visible.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      selection_extension:
        CommandLine|contains:
          - .csv
          - .dat
          - .doc
          - .gif
          - .jpeg
          - .jpg
          - .png
          - .ppt
          - .txt
          - .xls
          - .xml
      condition: selection and selection_extension
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: >-
    Is the command line or the script it points at encoded or obfuscated, and what operation does
    the decoded content perform?
  context: >-
    A file that hides script content behind a document or image extension is often obfuscated
    inside as well. In VBScript, reconstruct Chr() chains and string concatenation; in JScript,
    reconstruct String.fromCharCode() calls and eval() or unescape() wrappers. Watch for base64,
    hex, URL-encoding, and environment-variable substitution on the command line itself, and for
    long unbroken high-entropy strings, which are what an entropy threshold would score. Decode
    until the content is readable, then identify what it does — download cradle, in-memory loader,
    credential access, or data staging — and collect any file paths or hosts it names for
    follow-up.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned the script host, and is that parent chain expected?
  context: >-
    The parent identifies how the script was invoked. A document application such as Word or
    Excel, mshta.exe, a browser, an email client, or an archive utility as the parent points at
    delivery through a document or download rather than at administration. explorer.exe points at
    a user opening the file directly, and svchost.exe or a task engine points at a scheduled task
    or service, which should correspond to a known job. Walk one level further up where the
    immediate parent is generic, and note the parent's own command line, which often names the
    document or archive the script came from.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: >-
    Which scripting engine modules did the script host load, and do they identify the file's
    content as VBScript or JScript?
  context: >-
    The extension does not determine what the file contains — the engine module the host loads
    does. vbscript.dll identifies VBScript content and jscript.dll or jscript9.dll identifies
    JScript, which confirms the file with the document or image extension held script code.
    scrrun.dll (the FileSystemObject and Dictionary runtime) points at file read/write or copy
    activity from inside the script, wshom.ocx points at shell object use such as launching
    further processes or writing environment or shortcut data, and msxml3.dll points at XML
    parsing or HTTP requests from inside the script. If module-load telemetry is not collected in
    this environment, treat an empty result as a visibility gap rather than evidence no engine
    loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
        ImageLoaded|endswith:
          - \vbscript.dll
          - \jscript.dll
          - \jscript9.dll
          - \scrrun.dll
          - \wshom.ocx
          - \msxml3.dll
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
  answer_sources:
  - process_creation
- question: What child processes did the script host spawn afterward?
  context: >-
    The processes a script launches show what it was for. A packaging or installer script
    typically spawns msiexec.exe or a vendor binary; script content delivered through a document
    commonly spawns powershell.exe, cmd.exe, certutil.exe, rundll32.exe, or regsvr32.exe to
    continue execution. The query pivots on the alerting process identifier, so it returns only
    children of this script host instance rather than every script-host child on the machine.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: >-
    When this host has previously fired the rule's pattern, what parents and users normally drive
    that activity, and does the current alert fit that pattern?
  context: >-
    Some estates do run script files with non-script extensions as part of packaged tooling. The
    query mirrors the rule's selection structure scoped to this host, so the parent and user
    distribution it returns reflects how this specific pattern has run here over the past two
    weeks rather than generic script-host usage. A parent or account that has never driven this
    pattern before is the deviation worth chasing; a stable parent with a steady count points at
    packaged automation that can be confirmed with the owning team.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName:
        - wscript.exe
        - cscript.exe
      - Image|endswith:
        - \wscript.exe
        - \cscript.exe
      selection_extension:
        CommandLine|contains:
        - .csv
        - .dat
        - .doc
        - .gif
        - .jpeg
        - .jpg
        - .png
        - .ppt
        - .txt
        - .xls
        - .xml
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this account, so the result is this
    user's 90-day history of running script files with non-script extensions, aggregated by host.
    An account that has never produced this pattern is a different starting point from one that
    produces it on a schedule. Weigh the count and host spread against the account's role — a
    packaging or deployment account with a long history across many hosts reads differently from a
    standard user account with a single event.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName:
        - wscript.exe
        - cscript.exe
      - Image|endswith:
        - \wscript.exe
        - \cscript.exe
      selection_extension:
        CommandLine|contains:
        - .csv
        - .dat
        - .doc
        - .gif
        - .jpeg
        - .jpg
        - .png
        - .ppt
        - .txt
        - .xls
        - .xml
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: >-
    Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: >-
    When the alert fires under SYSTEM, a service account, or a computer account, the user name
    attributes nothing and the launch mechanism is the meaningful pivot. The query mirrors the
    rule's selection structure scoped to the alerting parent process, so the result is the 90-day
    history of that parent driving this specific pattern, aggregated by host. A parent that
    already accounts for this pattern on many hosts is vendor or platform automation; a parent
    that is new for this pattern is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName:
        - wscript.exe
        - cscript.exe
      - Image|endswith:
        - \wscript.exe
        - \cscript.exe
      selection_extension:
        CommandLine|contains:
        - .csv
        - .dat
        - .doc
        - .gif
        - .jpeg
        - .jpg
        - .png
        - .ppt
        - .txt
        - .xls
        - .xml
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the account's activity across all hosts in the alert window shows whether the script
    execution sits inside a wider session — file access, remote execution, or the same tooling
    running on other machines. Activity on several hosts in a short window widens the scope of the
    investigation beyond the alerting endpoint. If the alert fired under a service principal, this
    view returns platform and agent activity in volume and the parent-scoped view is the one that
    carries the answer.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: >-
    Did this same parent-driven pattern fire on other hosts in the same window, or is the activity
    isolated to this host?
  context: >-
    Under a service principal, asking what else the account did across the network returns the
    agent and platform telemetry every host generates constantly. The question that carries
    information is whether the same launch mechanism produced this pattern elsewhere: the query
    mirrors the rule's selection structure scoped to the alerting parent process, fleet-wide, in
    the alert window. Several hosts in the same window points at scheduled or pushed automation; a
    single host points at a trigger local to this machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName:
        - wscript.exe
        - cscript.exe
      - Image|endswith:
        - \wscript.exe
        - \cscript.exe
      selection_extension:
        CommandLine|contains:
        - .csv
        - .dat
        - .doc
        - .gif
        - .jpeg
        - .jpg
        - .png
        - .ppt
        - .txt
        - .xls
        - .xml
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating every process start on the host in a 30-minute window around the alert collapses
    repetitive agent telemetry into high-count rows and leaves novel parent-child pairs standing
    out at low counts. That is what to scan for — a document application or archive tool starting
    shortly before the script host, reconnaissance commands, or persistence tooling starting
    shortly after. The window also anchors the timing of the execution relative to whatever else
    the machine was doing.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host help place the script execution in a sequence. A delivery
    or download detection before it supports a document-borne origin; reconnaissance, defense
    tampering, or credential access after it marks the stages that followed. Reading the alert
    timeline together reconstructs more of the activity than the script execution alone shows.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: >-
    Have other hosts fired the rule's pattern in the past week, and does the cross-host
    distribution look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result counts
    fleet-wide firings of this specific pattern rather than general script-host usage. Many hosts
    running it points at scripted deployment or vendor automation that can be confirmed and tuned;
    one host, or a small set with no obvious relationship, points at operator-driven activity.
    Compare the host list against the parent and command-line consistency seen elsewhere in the
    investigation to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName:
        - wscript.exe
        - cscript.exe
      - Image|endswith:
        - \wscript.exe
        - \cscript.exe
      selection_extension:
        CommandLine|contains:
        - .csv
        - .dat
        - .doc
        - .gif
        - .jpeg
        - .jpg
        - .png
        - .ppt
        - .txt
        - .xls
        - .xml
      condition: all of selection_*
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Were any other proxy-execution or download LOLBins used on this host recently?
  context: >-
    Script content that runs from a mis-extensioned file rarely stops there — the same objective
    is commonly pursued with other signed binaries that execute code or fetch payloads, such as
    mshta.exe, rundll32.exe, regsvr32.exe, certutil.exe, bitsadmin.exe, or curl.exe. Several of
    these running on the same host within a day, especially under the same parent chain or
    account, describes a sequence rather than an isolated execution. Compare their command lines
    against the file paths and hosts recovered from the script content.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\wmic.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\hh.exe'
          - '\ie4uinit.exe'
          - '\infdefaultinstall.exe'
          - '\installutil.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\diskshadow.exe'
          - '\dnscmd.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\xwizard.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Was the script host executed from its expected path?
  context: >-
    cscript.exe and wscript.exe ship in System32 and SysWOW64. A script host running from a user
    profile, a temp directory, or an application folder was copied there, and a copy that also
    carries a different file name is why the rule matches on OriginalFileName as well as image
    path — the metadata still reads wscript.exe or cscript.exe even when the file on disk does
    not. Compare Image against OriginalFileName: a mismatch means the binary was renamed, which
    combined with a mis-extensioned script file describes two layers of name-based evasion.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
  answer_sources:
  - process_creation
- question: >-
    How often has this host fired the rule's LOLBin pattern over the past 90 days, and what
    command-line structures are typical?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the 90-day count
    reflects this specific pattern rather than general script-host usage, and the command-line
    projection shows how it normally looks here. No prior history means this is the first time
    this host has run a script file with a non-script extension. A recurring pattern with stable
    command lines — the same file name, path, and arguments each time — points at packaged
    tooling, and the alerting command line can be compared against it directly to see whether the
    file, its directory, or its arguments changed.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName:
        - wscript.exe
        - cscript.exe
      - Image|endswith:
        - \wscript.exe
        - \cscript.exe
      selection_extension:
        CommandLine|contains:
        - .csv
        - .dat
        - .doc
        - .gif
        - .jpeg
        - .jpg
        - .png
        - .ppt
        - .txt
        - .xls
        - .xml
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
  answer_sources:
  - process_creation
