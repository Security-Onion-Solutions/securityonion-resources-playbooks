name: Deny Service Access Using Security Descriptor Tampering Via Sc.EXE
id: a0d4e4b3-b2d8-4e6e-9d4f-352774717683
description: |
  Detects sc.exe sdset commands that write a Deny ACE (D;) targeting critical trustees (Interactive Users, Service logon, Built-in Administrators, Local System, or Everyone) into a service security descriptor. The rule fires only when the sc.exe binary, the sdset + D; tokens, and a critical-trustee token all appear together in the command line. Denying List-Children/Query rights to these principals makes a service unenumerable by services.exe, Get-Service, WMI, and sc query while it keeps running and autostarting across reboots, so this is most often used to hide a persistence service. Legitimate use is rare; investigation should confirm which service was modified, what binary it runs, whether a change was authorized, and whether the modification accompanied service creation or other persistence activity.
type: detection
detection_id: 99cf1e02-00fb-4c0d-8375-563f978dfd37
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the sc.exe command line contain an sdset operation that writes a Deny ACE against a critical trustee?
  context: Confirm the alert is a true positive before investing investigation time. The rule fires when the command line includes sdset together with a Deny ACE token (D;) and at least one critical-trustee alias (IU, SU, BA, SY, or WD). Read the full command line and confirm the SDDL string applies a Deny ACE to one of those principals rather than a benign permission change.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to modify service security descriptors with sc.exe sdset?
  context: Editing a service DACL to deny enumeration rights is not routine administration. Knowing whether the account and host function normally perform service configuration changes is often the fastest way to separate an authorized maintenance action from operator activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Was there a change ticket, maintenance window, or documented approval for this service security descriptor change?
  context: Service descriptor modifications that deny enumeration to administrators are high-impact and would normally be documented. A corresponding ticket suggests authorized hardening or troubleshooting; absence of one when policy requires it shifts the disposition toward unauthorized activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What service was the descriptor change applied to, and what binary does that service execute?
  context: The sc.exe command line names the target service, but the service install event carries the structured binary path, start type, and account. Attackers hide services that run a malicious binary, often placed in world-writable directories or masquerading as a legitimate service. Identify the service named in the sdset command line, then review its configured binary path and account.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: system
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 7045
      condition: selection
    fields:
      - ServiceName
      - ImagePath
      - StartType
      - AccountName
- question: Is the targeted service currently running, and what account is it using?
  context: A service whose DACL was modified to deny enumeration keeps running and autostarting even though Get-Service, WMI, and sc query return nothing for it. Because normal tools cannot list it, the analyst must check the candidate service name directly on the host. A service running as LocalSystem has full system privileges; the running account indicates the access level the persistence holds.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were the registry keys under the service control set modified around the time of this command?
  context: Service configuration and DACL changes are reflected under HKLM\System\CurrentControlSet\Services. Registry events for the modified service — Start, ImagePath, ObjectName, or the Security subkey holding the descriptor — corroborate the command-line activity and reveal whether the service was newly created or an existing one was altered, even if the structured service-install event is not captured.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\System\CurrentControlSet\Services\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Did a service install event fire on this host for the targeted service in the surrounding window?
  context: Windows records service installation in the Security log independently of command-line tooling. Pairing the sc.exe sdset activity with a service install event confirms whether the descriptor was tampered immediately after the service was created — a strong signal of deliberate hiding — versus modification of a long-standing service. The install record also surfaces the binary path and account configured for the service.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4697
      condition: selection
    fields:
      - ServiceName
      - ServiceFileName
      - ServiceAccount
      - SubjectUserName
- question: What process spawned sc.exe, and is that parent chain expected for service administration?
  context: The parent process reveals how sc.exe was invoked. Legitimate service changes are usually driven by interactive admin sessions, management consoles, or deployment tooling. An unusual parent — a script host, Office application, or a process running from a user-writable path — points to scripted or operator-driven invocation rather than routine administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Was sc.exe executed from its expected System32 or SysWOW64 path?
  context: sc.exe run from a non-standard path may indicate the binary was copied or renamed to evade path-based allowlists. A sc.exe invoked from a user temp or profile directory is more suspicious than one in System32. Compare the Image path and OriginalFileName from the alerting event.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired the sc.exe sdset Deny-ACE pattern over the past 90 days, and what command-line structures are typical?
  context: A service-descriptor Deny-ACE pattern with no prior history on a host is more suspicious than one seen regularly under stable administration. The query mirrors the rule's selection structure scoped to this host, so the count reflects the rule's specific firing pattern rather than generic sc.exe usage. The CommandLine projection lets the analyst compare typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_sc:
      - Image|endswith: \sc.exe
      - OriginalFileName: sc.exe
      selection_sdset:
        CommandLine|contains|all:
        - sdset
        - D;
      selection_trustee:
        CommandLine|contains:
        - ;IU
        - ;SU
        - ;BA
        - ;SY
        - ;WD
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_sc:
      - Image|endswith: \sc.exe
      - OriginalFileName: sc.exe
      selection_sdset:
        CommandLine|contains|all:
        - sdset
        - D;
      selection_trustee:
        CommandLine|contains:
        - ;IU
        - ;SU
        - ;BA
        - ;SY
        - ;WD
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_sc:
      - Image|endswith: \sc.exe
      - OriginalFileName: sc.exe
      selection_sdset:
        CommandLine|contains|all:
        - sdset
        - D;
      selection_trustee:
        CommandLine|contains:
        - ;IU
        - ;SU
        - ;BA
        - ;SY
        - ;WD
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around the time of the alert?
  context: Tracking the account's activity across all hosts reveals lateral movement or coordinated changes on multiple endpoints. If the same user drove similar service-tampering or persistence activity elsewhere, the scope of the operation is larger than this one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_sc:
      - Image|endswith: \sc.exe
      - OriginalFileName: sc.exe
      selection_sdset:
        CommandLine|contains|all:
        - sdset
        - D;
      selection_trustee:
        CommandLine|contains:
        - ;IU
        - ;SU
        - ;BA
        - ;SY
        - ;WD
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the surrounding process activity reveals what led to this event and what followed, and whether the service-hiding action is part of a larger sequence. Look for reconnaissance, service creation, privilege escalation, or additional persistence mechanisms.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access, or service creation — may reveal the attack stages that preceded the descriptor change and help reconstruct the timeline. Service hiding usually follows the installation of the service it conceals.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: Attackers rarely rely on a single persistence mechanism. After hiding a service, they commonly install backup footholds using different techniques — scheduled tasks, registry Run keys, BITS jobs, or WMI subscriptions. Multiple persistence installations in the same timeframe indicate intentional stacking rather than isolated administration.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
