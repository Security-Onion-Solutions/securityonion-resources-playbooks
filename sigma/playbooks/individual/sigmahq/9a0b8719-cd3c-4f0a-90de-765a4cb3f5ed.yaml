name: Microsoft VBA For Outlook Addin Loaded Via Outlook
id: 55a97517-1e0d-4c12-be29-a56012ae0860
description: |
  Detects outlook.exe loading outlvba.dll, the Microsoft VBA for Outlook add-in that hosts the
  Outlook macro (VBA) runtime. Both conditions must match: the loading process path ends in
  \outlook.exe AND the loaded module path ends in \outlvba.dll. On most endpoints Outlook never
  loads the VBA runtime, so this load indicates the macro subsystem was activated -- benign when a
  user legitimately runs an Outlook VBA macro, but also the observable signal of macro-based
  persistence, where the per-user VbaProject.OTM macro store is replaced with an attacker macro that
  runs inside outlook.exe on each start and can execute commands, spawn child processes, or beacon
  outbound. Investigation should confirm the load and the module's signature and hash, determine
  whether the macro store or a payload was written to disk, check whether outlook.exe spawned command
  interpreters or script hosts or made unusual outbound connections, and establish whether this is the
  first such load on the host and whether other hosts show the same pattern.
type: detection
detection_id: 9a0b8719-cd3c-4f0a-90de-765a4cb3f5ed
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting event show outlvba.dll loaded by outlook.exe, matching the rule's detection?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires when a module whose path
    ends in \outlvba.dll is loaded by a process whose path ends in \outlook.exe. Review the exact
    ImageLoaded path and the loading Image on the triggering event. The library load event carries the
    module's code-signature status and hash directly, so a genuine Microsoft-signed outlvba.dll from the
    Office install directory is the expected form; a copy loaded from a user-writable path or with a
    broken signature is the signal to escalate, and that reputation check follows in the module-signing
    question.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Is this user and host expected to run Outlook VBA macros?
  context: >-
    Most Outlook users never enable or run VBA macros, so the macro runtime loading is unusual for a
    typical mailbox. Knowing whether this account and host function match a sanctioned use of Outlook
    macros -- a developer building a custom Outlook add-in, or an IT-deployed macro -- is often the
    fastest way to separate routine activity from a macro backdoor. User attribution is present on
    roughly 94% of endpoint events; when it is a machine account or missing, pivot on the loading
    process context instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What other modules did outlook.exe load around this time, and are any from non-canonical paths, unsigned, or user-writable directories?
  context: >-
    The full set of modules outlook.exe loaded tells the operator's story beyond the single VBA runtime
    load. Look for DLLs loaded from %TEMP%, AppData, ProgramData, or Public (side-loading), unsigned
    modules where signed ones are expected, and system DLL names loaded from non-system paths
    (search-order hijacking). A macro backdoor running inside Outlook may pull in additional helper
    modules; those loads, scoped to this process instance, reveal what the macro brought in.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: What is the signing status, hash, and reputation of the loaded outlvba.dll?
  context: >-
    Module reputation distinguishes the genuine Microsoft VBA add-in from a masqueraded or side-loaded
    copy. A validly Microsoft-signed outlvba.dll loaded from the Office install directory is consistent
    with legitimate macro use; an unsigned module with the outlvba.dll name, a broken or distrusted
    signature, or a load from a user-writable path is a masquerading indicator. Take the module hash and
    check it against threat intelligence. Signature statuses to watch are Unsigned, Expired, Distrusted,
    and Invalid (tampered).
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What caused Outlook to activate its VBA runtime -- a received message with macro content or macro persistence configured on the host?
  context: >-
    Outlook loads the VBA add-in when the macro subsystem is invoked, which can follow a message or
    document that carries macro content, or a persistent macro store configured to load on boot. The
    query returns how outlook.exe itself was launched (parent process and command line); the delivery
    or persistence trigger is established by manual review of the mailbox for a recently received
    macro-bearing message and of the Outlook macro-provider configuration. Identifying the source
    enables blocking at the perimeter and searching for other recipients. The provenance of any
    macro-bearing attachment (mark-of-the-web / origin zone) is a manual or endpoint-console review step.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: What child processes did outlook.exe spawn after loading the VBA runtime?
  context: >-
    Outlook rarely spawns child processes during normal mail use, so children appearing after the macro
    runtime loads are the execution signal. A macro backdoor commonly launches a command interpreter or
    script host -- powershell.exe, cmd.exe, wscript.exe, cscript.exe, mshta.exe, rundll32.exe,
    regsvr32.exe, msiexec.exe, curl.exe, or bitsadmin.exe -- to carry out its payload. Any such child of
    outlook.exe, especially one writing files or reaching out to the network, ties the VBA load to
    live code execution. Note the timing between the load and each child spawn.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Was the Outlook VBA macro store (VbaProject.OTM) written, or were files dropped to user-writable paths by outlook.exe or its children?
  context: >-
    Macro-based persistence works by replacing the per-user VbaProject.OTM macro store so the attacker
    macro runs inside outlook.exe on every start; a write to that file is the persistence artifact. The
    query correlates file writes to the alerting outlook.exe process and its direct children by process
    lineage, and separately flags any write to VbaProject.OTM on the host. User-writable staging paths
    to watch are the Outlook Roaming AppData folder, Downloads, Temp, and Desktop; dropped executables
    or script files (exe, scr, dll, js, vbs, bat, cmd, ps1, hta) in those paths point to a payload
    landing on disk. File hashes are not carried on the write event; hash any dropped file from its
    later execution.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      selection_macro:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: '\VbaProject.OTM'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
- question: Has outlvba.dll been loaded on this host before, and under what processes?
  context: >-
    A first-time module load on a host is a stronger anomaly than a recurring one. If outlvba.dll has
    been loaded by outlook.exe repeatedly over the past 90 days, macro use is probably routine on this
    endpoint. If this is the first occurrence, or the DLL has only ever been loaded by different
    processes, the current load is anomalous and raises the weight of the alert.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: When this host has previously loaded the Outlook VBA runtime, what programs and users drove it, and does the current alert fit that pattern?
  context: >-
    Even a legitimate add-in load has a normal profile on a host. This query mirrors the rule's
    exact selection scoped to this host, so the resulting program and user distribution reflects
    how this specific load pattern -- outlook.exe loading outlvba.dll -- has historically run
    here rather than generic Outlook usage. A new acting program, an unexpected user account, or
    a first-ever appearance is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith: \outlook.exe
        ImageLoaded|endswith: \outlvba.dll
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts loaded the Outlook VBA runtime in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: >-
    This query mirrors the rule's exact selection with no host scope, giving a fleet-wide count of the
    same load pattern rather than generic Outlook usage. Many hosts loading outlvba.dll in the same
    window can reflect a macro pushed by management tooling or a mail campaign delivering macro content
    broadly; one host or a small unrelated set points to targeted or hands-on activity. Use the host
    distribution and the parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith: \outlook.exe
        ImageLoaded|endswith: \outlvba.dll
      condition: selection
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity in a tight window around the load
    surfaces what led up to it and what ran immediately after. Novel parent-child pairs stand out at low
    counts against high-count routine telemetry, which is what points to any tool that ran alongside the
    macro activation -- reconnaissance, staging, or a follow-on child of Outlook.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host -- phishing-adjacent activity, execution of scripting tools, or
    defense tampering -- may reveal the stages that preceded this load and help reconstruct the timeline.
    Macro-based execution is often a foothold used to run privileged follow-on actions, so prior alerts
    help place this VBA load within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Did other users or hosts load the Outlook VBA runtime in the same window?
  context: >-
    Macro delivery and macro-based persistence rarely target a single mailbox. Correlating the same
    detection across all hosts shows how many endpoints activated the Outlook macro runtime and which
    users are affected, revealing the breadth of a macro push or a mail campaign and identifying
    additional systems that need the same investigation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this Outlook and Office installation current on security patches and macro-security configuration?
  context: >-
    Macro execution and add-in loading are governed by Office patch level and macro-security settings.
    An out-of-date Outlook or a macro-security policy that permits unsigned or auto-loading macros
    confirms the activation was possible and indicates whether other similarly configured endpoints are
    exposed. Check the installed Office build for recent security updates and confirm whether the
    macro-provider and trust-center settings on this host match the sanctioned baseline.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: What outbound network connections did outlook.exe initiate around the time of the alert?
  context: >-
    A macro backdoor running inside Outlook beacons from the outlook.exe process itself, so outbound
    connections from that process are the egress signal. Outlook legitimately connects to corporate and
    hosted mail infrastructure, so filter those known destinations and CIDRs; a connection to an
    unfamiliar host or a non-mail service from outlook.exe shortly after the VBA runtime loads points to
    command-and-control or exfiltration. Correlate the timing against the load and any child processes
    spawned.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
