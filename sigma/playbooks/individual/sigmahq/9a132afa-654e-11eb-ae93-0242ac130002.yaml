name: PUA - AdFind Suspicious Execution
id: 347baaa4-d486-458f-82c4-670845a84259
description: |
  Detects execution of AdFind with command-line arguments commonly used for Active Directory reconnaissance,
  such as -sc shortcut queries (trustdmp, dclist, dcmodes, adinfo, computers_pwdnotreqd), broad
  objectcategory= LDAP filters, subnet sweeps, and "Domain Admins" group lookups. AdFind is a signed,
  legitimate administrative query tool, so the rule fires on the argument patterns rather than the binary
  itself; the same flags are used both by IT staff for directory troubleshooting and by operators staging
  domain enumeration before lateral movement or credential access. The investigation should determine
  whether the enumeration was run by an expected user from an expected host, whether it was a single
  troubleshooting query or a burst of recon, and what activity preceded and followed it.
type: detection
detection_id: 9a132afa-654e-11eb-ae93-0242ac130002
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line match the AdFind reconnaissance argument patterns this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the
    exact command line against the rule's criteria. The rule fires when one of its AD-recon argument
    patterns is present (for example trustdmp, -sc dclist, objectcategory=, -subnets -f, dcmodes, adinfo,
    or name="Domain Admins"). Note which pattern fired and the full surrounding arguments.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What exactly did this AdFind invocation enumerate? Decode every flag, filter, and -sc shortcut.
  context: The full command line reveals the scope of the directory enumeration. Decode each -sc shortcut
    (trustdmp dumps domain trusts, dclist/dcmodes enumerate domain controllers, computers_pwdnotreqd finds
    accounts with the PASSWD_NOTREQD bit, adinfo returns forest/whoami data) and each objectcategory=
    filter (person, computer, group, organizationalUnit, subnet). Multiple sequential invocations on the
    same host that together sweep users, computers, groups, trusts, and subnets indicate a full domain
    recon pass rather than a single targeted lookup. The query scopes to all matching AdFind-pattern
    executions on this host within +/-5m so the full operation is visible, not just the triggering event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
        - domainlist
        - trustdmp
        - dcmodes
        - adinfo
        - -sc dclist
        - computer_pwdnotreqd
        - objectcategory=
        - -subnets -f
        - name="Domain Admins"
        - '-sc u:'
        - domainncs
        - dompol
        - ' oudmp '
        - subnetdmp
        - gpodmp
        - fspdmp
        - users_noexpire
        - computers_active
        - computers_pwdnotreqd
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is this user expected to run Active Directory enumeration commands?
  context: Network administrators and identity/AD operations staff legitimately run directory queries for
    troubleshooting and audits. Standard users, service accounts, and developers rarely have a reason to
    dump trusts, enumerate all domain computers, or sweep group memberships. The user's role and typical
    behavior baseline determine whether the enumeration is routine or anomalous.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: Is AdFind on the organization's approved software list for this host and user?
  context: AdFind is a free third-party AD query tool, not a built-in Windows utility, and is widely
    classified as a potentially-unwanted application because of its heavy use in pre-ransomware
    reconnaissance. Confirm whether it is sanctioned tooling deployed by IT for directory administration
    or whether it appeared on this host without an approved purpose. An unapproved copy, a renamed binary,
    or a password-protected archive drop point toward operator-staged tooling.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a change ticket, audit task, or support session that explains this directory enumeration?
  context: Legitimate AD enumeration usually correlates with an active troubleshooting ticket, a scheduled
    audit, a migration project, or a documented administrative procedure. If no such context exists for
    this run, the enumeration may be operator reconnaissance staged ahead of lateral movement rather than
    sanctioned administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single directory query may be legitimate troubleshooting, but multiple reconnaissance commands
    in rapid succession -- nltest, net, dsquery, nslookup, csvde/ldifde, whoami, systeminfo -- is a
    signature pattern of post-compromise enumeration. Operators commonly run a batch of these alongside
    AdFind to map users, computers, groups, trusts, and subnets before moving to the next stage. Three or
    more distinct recon binaries within the window typically indicates automated reconnaissance.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: What process spawned this AdFind execution, and is that parent chain expected?
  context: Legitimate directory queries are typically run interactively from cmd.exe or powershell.exe
    spawned by explorer.exe, or from a documented automation script. Enumeration spawned by unusual parents
    -- a batch orchestrator dropped alongside the binary, an Office application, a script interpreter
    (wscript.exe, cscript.exe, mshta.exe), wmiprvse.exe, or wsmprovhost.exe -- indicates automated
    post-exploitation rather than hands-on administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Is the process that ran these AdFind arguments actually adfind.exe, or a renamed or relocated copy?
  context: The rule fires purely on argument patterns, so it matches regardless of the executable name --
    operators frequently rename AdFind to blend with legitimate processes (for example SearchIndex.exe,
    sqlceip.exe, postgres.exe, or csrss.exe) or run it from a user-writable directory. Compare the Image
    name and path against the known-good location and signing chain. A signed binary whose name does not
    match its on-disk metadata, or AdFind running from a temp/download/profile path, points to deliberate
    masquerading rather than sanctioned tooling.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CurrentDirectory
- question: Did this host make LDAP or global-catalog connections to a domain controller around the time of the alert?
  context: AdFind reconnaissance issues LDAP queries against a domain controller, so directory-port
    connections from this host in the alert window corroborate that the enumeration actually reached AD
    and identify which controller was queried. Connections on the LDAP and global-catalog ports (389, 636,
    3268, 3269) from a host that does not normally run AD tooling reinforce the recon disposition; their
    absence may mean the queries were cached, blocked, or directed elsewhere.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 389
          - 636
          - 3268
          - 3269
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: Did directory-service access events fire on a domain controller for this user or host in the alert window?
  context: AdFind's trust and object enumeration reads directory objects, which on an audited domain
    controller surface as directory-service-access events (Event ID 4662). Correlating these with the
    AdFind execution confirms the queries reached AD and reveals which objects -- trusts, the configuration
    or schema partition, privileged groups -- were actually read, distinguishing a narrow troubleshooting
    lookup from a broad sweep. If directory-service auditing is not enabled on the domain controllers,
    treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      service: security
      product: windows
    detection:
      selection:
        EventID: 4662
        SubjectUserName|expand: '%User%'
      condition: selection
    fields:
      - SubjectUserName
      - ObjectName
      - Properties
- question: When this host has previously run this AdFind pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even legitimate AD tooling has a baseline. The query mirrors the rule's selection scoped to this
    host, so the resulting parent/user distribution reflects how this specific enumeration pattern -- not
    generic binary usage -- has historically run here. A new parent process, an unexpected user account, or
    an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - domainlist
        - trustdmp
        - dcmodes
        - adinfo
        - -sc dclist
        - computer_pwdnotreqd
        - objectcategory=
        - -subnets -f
        - name="Domain Admins"
        - '-sc u:'
        - domainncs
        - dompol
        - ' oudmp '
        - subnetdmp
        - gpodmp
        - fspdmp
        - users_noexpire
        - computers_active
        - computers_pwdnotreqd
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts run this AdFind pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of
    this enumeration pattern rather than generic binary usage. Many hosts firing the same pattern points to
    scripted deployment or a vendor/IT audit job; a single host or a small unrelated set points to manual
    operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - domainlist
        - trustdmp
        - dcmodes
        - adinfo
        - -sc dclist
        - computer_pwdnotreqd
        - objectcategory=
        - -subnets -f
        - name="Domain Admins"
        - '-sc u:'
        - domainncs
        - dompol
        - ' oudmp '
        - subnetdmp
        - gpodmp
        - fspdmp
        - users_noexpire
        - computers_active
        - computers_pwdnotreqd
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - domainlist
        - trustdmp
        - dcmodes
        - adinfo
        - -sc dclist
        - computer_pwdnotreqd
        - objectcategory=
        - -subnets -f
        - name="Domain Admins"
        - '-sc u:'
        - domainncs
        - dompol
        - ' oudmp '
        - subnetdmp
        - gpodmp
        - fspdmp
        - users_noexpire
        - computers_active
        - computers_pwdnotreqd
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - domainlist
        - trustdmp
        - dcmodes
        - adinfo
        - -sc dclist
        - computer_pwdnotreqd
        - objectcategory=
        - -subnets -f
        - name="Domain Admins"
        - '-sc u:'
        - domainncs
        - dompol
        - ' oudmp '
        - subnetdmp
        - gpodmp
        - fspdmp
        - users_noexpire
        - computers_active
        - computers_pwdnotreqd
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the enumeration is isolated or part
    of broader movement. If the same user triggered AD recon, lateral execution, or credential access on
    multiple endpoints in the same window, the scope of the activity is larger than this single host. This
    asks what the user did right now across the network, distinct from their long-term baseline.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - domainlist
        - trustdmp
        - dcmodes
        - adinfo
        - -sc dclist
        - computer_pwdnotreqd
        - objectcategory=
        - -subnets -f
        - name="Domain Admins"
        - '-sc u:'
        - domainncs
        - dompol
        - ' oudmp '
        - subnetdmp
        - gpodmp
        - fspdmp
        - users_noexpire
        - computers_active
        - computers_pwdnotreqd
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Discovery activity rarely happens in isolation. Earlier detections on the same host -- initial
    access, defense tampering, or credential access -- may reveal the stages that preceded this enumeration
    and help reconstruct the timeline. Domain recon frequently sits between initial foothold and lateral
    movement, so prior alerts help place this event in the attack sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
