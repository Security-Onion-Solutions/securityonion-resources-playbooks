name: Potential CVE-2022-29072 Exploitation Attempt
id: fca96587-e804-424f-8b88-dc8dc631d00f
description: |
  Detects a command interpreter (cmd.exe, powershell.exe, or pwsh.exe) spawned as a child of the
  7-Zip file manager (7zFM.exe). This is the process relationship associated with CVE-2022-29072, a
  privilege escalation and command execution flaw in 7-Zip through version 21.07 on Windows that is
  reached through the Help > Contents area, where a misconfigured 7z.dll and the bundled 7-zip.chm
  help file allow commands to run in a child process under 7zFM.exe. The rule fires when the parent
  is 7zFM.exe AND the child matches on either of two alternative branches — an image path ending in
  \cmd.exe, \powershell.exe, or \pwsh.exe, or an OriginalFileName of Cmd.Exe, PowerShell.EXE, or
  pwsh.dll — while the command line is non-empty, carries no ' /c ', ' /k ', or ' /r ' switch, and
  does not end in .bat, .cmd, or .ps1, which narrows it to interactive shells rather than scripted
  one-shot invocations. Determine whether a user deliberately reached a shell from the archive
  manager, or whether the help subsystem was used to obtain one that runs at a higher privilege
  level than the signed-in account.
type: detection
detection_id: 9a4ccd1a-3526-4d99-b980-9f9c5d3a6ee3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: >-
    Does the alerting event show 7zFM.exe spawning an interactive command interpreter, and did the
    child match on its image name or on its OriginalFileName?
  context: >-
    Confirm the parent is the 7-Zip file manager and the child is cmd.exe, powershell.exe, or
    pwsh.exe. The child selection has two alternative branches and either one alone fires the rule
    — the image path ending in \cmd.exe, \powershell.exe, or \pwsh.exe, or the OriginalFileName
    being Cmd.Exe, PowerShell.EXE, or pwsh.dll — so note which branch matched. An OriginalFileName
    match where the image name does not fit the list means the binary was renamed, which carries
    more weight than a plain name match on a binary sitting at its normal path. Also confirm the
    command line is non-empty and holds no ' /c ', ' /k ', or ' /r ' switch and no .bat, .cmd, or
    .ps1 ending; the rule excludes those forms to target interactive shells.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - OriginalFileName
  answer_sources:
  - alert
  - process_creation
- question: >-
    Is this user expected to open a command prompt or PowerShell session from inside the 7-Zip file
    manager?
  context: >-
    7-Zip ships no menu action that launches a shell, so this parent-child pair is not part of
    routine archive handling. A developer or administrator may still reach one through a shell
    extension or a tool integration; knowing the user's role and whether the host is a workstation,
    a build machine, or a server is the fastest way to separate that from use of the help subsystem.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is 7zFM.exe expected to spawn a command interpreter, and what started 7-Zip itself?
  context: >-
    The parent-child pair is the core signal for this detection. The 7zFM.exe command line shows
    which archive was open, and its own parent shows how 7-Zip was launched. A user double-clicking
    an archive from explorer.exe reads differently from 7-Zip started by a browser, a mail client,
    or an installer that had just written the archive to disk.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other child processes did this same 7-Zip instance spawn?
  context: >-
    The exploit path for CVE-2022-29072 ends in an embedded psexec invocation (psexec -s cmd.exe)
    that moves execution from the signed-in user to NT AUTHORITY\SYSTEM. Several children from one
    7zFM.exe instance — a shell alongside a service installer, a copied binary, or a second
    interpreter — describes an execution chain rather than one stray process.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What did the shell spawned by 7-Zip actually execute, and what was its working directory?
  context: >-
    The rule removes the ' /c ', ' /k ', and ' /r ' switches and script-file arguments, so the
    alerting command line is typically bare or carries an argument that fits none of those forms
    — read it literally rather than assuming it is empty. The working directory frequently points
    at an extraction path or a temp folder, which ties the shell back to the archive that was open
    in 7-Zip. Scoping is by process identity rather than host-and-binary because cmd.exe and
    powershell.exe run constantly on any Windows host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: >-
    If the child was PowerShell, was the command encoded or obfuscated, and what does it decode to?
  context: >-
    This rule's filters remove the common scripted forms, so a PowerShell child that still fires
    here is interactive or carries arguments that are not a plain script invocation. Check for
    -EncodedCommand or -enc base64, string concatenation, backtick escaping, and variable
    substitution, and decode what is present. A download cradle or an in-memory assembly load
    points to payload delivery rather than a user opening a console.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Did the Windows HTML Help viewer or a 7-Zip help file run on this host around the alert?
  context: >-
    CVE-2022-29072 is reached through 7-Zip's Help > Contents area, where the bundled 7-zip.chm and
    a misconfigured 7z.dll let the HTML Help integration execute commands. An hh.exe process or a
    command line naming a .chm file in the same window corroborates that the help path was used
    rather than an unrelated 7-Zip shell. Absence is not exoneration, since help content can render
    in-process without a separate viewer.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_help:
        - Image|endswith: '\hh.exe'
        - CommandLine|contains:
            - '.chm'
            - '7z.dll'
      condition: selection_host and selection_help
    fields:
      - Image
      - CommandLine
      - ParentImage
  answer_sources:
  - process_creation
- question: Did a privileged logon or a special-privilege assignment occur on this host around the alert?
  context: >-
    The outcome CVE-2022-29072 aims at is a shell running with privileges above those of the
    signed-in user, typically NT AUTHORITY\SYSTEM. Event 4672 records special privileges assigned
    at logon and 4624 records the logon itself, so a SYSTEM or administrator logon landing in the
    same window as a 7-Zip-spawned shell is the privilege transition to confirm. If the Security
    channel is not collected in this environment, read an empty result as a visibility gap rather
    than as evidence no transition occurred.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4672
          - 4624
      condition: selection
    fields:
      - EventID
      - SubjectUserName
      - TargetUserName
      - LogonType
  answer_sources:
  - process_creation
  - manual_review
- question: Did PowerShell script block logging capture the full script content?
  context: >-
    Event ID 4104 records the deobfuscated script content PowerShell actually executes, which is
    ground truth when the alerting command line is bare or encoded. Correlate 4104 events in the
    alert window against the interpreter that 7-Zip spawned. If PowerShell operational logs are not
    ingested in this environment, treat zero results as a visibility gap rather than evidence
    nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
  answer_sources:
  - powershell_script_block
- question: Were PowerShell security controls bypassed or weakened before this execution?
  context: >-
    Execution policy bypasses, AMSI patching, and version-2 downgrades are preparation steps that
    commonly precede a payload. One of them appearing shortly before a shell shows up under the
    archive manager places the shell inside a prepared sequence rather than a user action.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Has 7zFM.exe ever spawned this interpreter on this host before?
  context: >-
    A 90-day count of this exact parent-child pair on the host separates a first-of-its-kind event
    from an established local habit. Zero prior occurrences fits exploitation or a one-off user
    action, while a steady count points at a shell extension or tool integration worth identifying
    by name. This count deliberately includes the scripted invocations the rule filters out, since
    any shell under the archive manager is worth knowing about.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: >-
    Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the
    user's 90-day history of this specific firing pattern rather than generic use of cmd.exe or
    PowerShell, aggregated by host. A user who has never produced it is a different proposition
    from one who does so regularly; weigh the count against their role and typical toolset.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_parent:
        ParentImage|endswith: \7zFM.exe
      selection_img:
      - Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - Cmd.Exe
        - PowerShell.EXE
        - pwsh.dll
      filter_main_extensions_and_flags:
      - CommandLine|contains:
        - ' /c '
        - ' /k '
        - ' /r '
      - CommandLine|endswith:
        - .bat
        - .cmd
        - .ps1
      filter_main_null:
        CommandLine: null
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: >-
    Has 7zFM.exe historically driven the rule's pattern on this host or across the environment, or
    is this launch mechanism new?
  context: >-
    When the alert fires under a service principal, user identity attributes nothing. The launch
    mechanism becomes the meaningful pivot, so this query mirrors the rule's selection structure
    scoped to the alerting parent and returns the 90-day history of 7-Zip driving this exact
    pattern, aggregated by host. A parent already accounting for a large prior count is packaging
    or automation; a new or rare one is the deviation to chase.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_parent:
        ParentImage|endswith: \7zFM.exe
      selection_img:
      - Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - Cmd.Exe
        - PowerShell.EXE
        - pwsh.dll
      filter_main_extensions_and_flags:
      - CommandLine|contains:
        - ' /c '
        - ' /k '
        - ' /r '
      - CommandLine|endswith:
        - .bat
        - .cmd
        - .ps1
      filter_main_null:
        CommandLine: null
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the account across all hosts in the alert window shows whether the activity is confined
    to one workstation or reaches further. Under SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a
    machine account this pivot returns routine agent telemetry, and the parent-scoped fleet view is
    the answer to read instead.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did this same 7-Zip-driven pattern fire on other hosts in the same window?
  context: >-
    Under a service principal, asking what else the user did returns agent telemetry from every
    host. This query instead mirrors the rule's selection structure scoped to the alerting parent,
    fleet-wide, within the alert window. Several hosts at once points at pushed or scheduled
    automation; a single host points at a host-local trigger such as one user opening an archive.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_parent:
        ParentImage|endswith: \7zFM.exe
      selection_img:
      - Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - Cmd.Exe
        - PowerShell.EXE
        - pwsh.dll
      filter_main_extensions_and_flags:
      - CommandLine|contains:
        - ' /c '
        - ' /k '
        - ' /r '
      - CommandLine|endswith:
        - .bat
        - .cmd
        - .ps1
      filter_main_null:
        CommandLine: null
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating parent-child pairs on the host collapses repetitive agent telemetry into high-count
    rows and leaves novel pairs standing out at low counts, which is what to scan for here. Look for
    reconnaissance, service installation, or a second interpreter appearing near the 7-Zip shell.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Is 7-Zip spawning command interpreters on other hosts in the last day?
  context: >-
    A fleet-wide view of the same parent-child pair separates one user's action from something
    arriving with a distributed archive or a packaged 7-Zip build. Several hosts within a day
    suggests a common source file or a deployment, while a single occurrence is more consistent
    with a host-local action.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host can place this event in a sequence, such as an archive
    written to disk, a defense-tampering attempt, or reconnaissance running ahead of it. The alert
    timeline helps reconstruct what led to a shell appearing under the archive manager.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
