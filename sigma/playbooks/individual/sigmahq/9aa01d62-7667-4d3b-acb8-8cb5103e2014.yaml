name: APT27 - Emissary Panda Activity
id: 265a2312-ee47-4792-8ee7-db1177beb812
description: |
  Fires when svchost.exe starts under a launcher that is not the service control manager: either a parent named
  sllauncher.exe, or a parent whose image path lives under \AppData\Roaming\ where the child command line contains -k.
  A genuine service host is started by services.exe from the system directory with a -k argument naming a registered
  service group; a copy launched from a user-writable directory by an unrelated binary is the pattern DLL side-loading
  leaves behind, where a legitimate or renamed host executable is placed next to an attacker-supplied DLL so the loader
  resolves that DLL first and the code runs under a trusted process name. Determine which branch fired, whether the
  svchost.exe image and its parent are the real binaries in their expected locations, which modules the process loaded
  and from where, and whether a service or autostart entry was written to make the launcher durable.
type: detection
detection_id: 9aa01d62-7667-4d3b-acb8-8cb5103e2014
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: >-
    Does this event match one of the rule's two branches — svchost.exe spawned by sllauncher.exe, or svchost.exe
    carrying -k spawned from a parent under \AppData\Roaming\?
  context: >-
    The rule fires when either branch matches on its own, so confirm which one applies before going further. An
    sllauncher.exe parent names the side-loading launcher directly; a parent image under \AppData\Roaming\ combined
    with -k on the child command line means the launcher has been relocated or renamed and its real identity has to
    be established from its image path and signature. The branch that fired also decides how much weight the launcher
    identity questions carry.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: >-
    Is this user and host expected to run a service host process started by something other than the service control
    manager?
  context: >-
    Some installers, updaters and packaged applications legitimately ship a relocated helper that launches a system
    binary from an application directory. Knowing whether this host runs such software, and whether the account is one
    that installs or runs it, is often the fastest way to separate routine packaging from a hijacked execution flow.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this execution part of an authorized penetration test or red team engagement?
  context: >-
    Side-loading launchers and relocated system binaries are routinely used in authorized security assessments, and
    several commercial payload frameworks stage them the same way. Check whether an assessment is active on this host
    or network segment before investing analysis time; an authorized engagement with matching tooling and timing
    resolves the alert without further work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: Is this parent expected to spawn svchost.exe, and what started the parent itself?
  context: >-
    The parent-child relationship is the core signal for this detection, because a real service host has exactly one
    legitimate launcher. Tracing the parent's own origin shows how the launcher arrived and ran — an installer or
    update process, a user double-click from a download directory, or a script interpreter — and the parent command
    line often names the configuration or payload file the launcher was pointed at.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other child processes did the same parent spawn?
  context: >-
    A launcher that side-loads one component frequently starts others in the same window — a second host binary, a
    script interpreter, or a native tool used for reconnaissance. Listing every child of this exact parent instance
    shows whether the alerting process is the whole of the activity or one stage of a sequence.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Which service group did the -k argument name, and is that group actually registered on this host?
  context: >-
    The -k argument selects the service group a real service host loads, and every valid group has a matching value
    under the Svchost key in the registry. A group name that does not exist on the host, or an argument that is
    syntactically present but meaningless, tells you the switch is there to make the process resemble a system service
    rather than to host one, and points the investigation at the loaded module instead of the command line.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: What files did the alerting process write to disk after it started?
  context: >-
    Side-loading chains commonly stage further components next to the launcher — a configuration blob, an encrypted
    payload file, or an additional module. Files written by this process, especially back into the same user-writable
    directory the launcher runs from, show which stage of the chain is executing and give concrete paths to collect
    even after the process exits.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: >-
    Where does the alerting svchost.exe image actually live, and does its working directory match a system service or
    the launcher's own folder?
  context: >-
    Read the full image path and working directory of the alerting process rather than the process name. A real service
    host resolves to the system directory and runs with a system working directory; a side-loaded copy resolves to the
    same user-writable folder as its launcher, which is the folder the loader will search first for the module it
    imports. The working directory is the single field that most directly names where to look for the side-loaded
    component.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: Which modules did the alerting process load, and were any of them loaded from outside the system directories?
  context: >-
    DLL side-loading works by placing a module in the same directory as the host executable so the loader resolves it
    before the copy under the system directories. The load events for this process show which modules were mapped,
    what path each came from, whether it is signed and by whom, and its hash. Establish first which directories are
    valid module sources here and which applications on this host legitimately load modules from non-standard
    locations; against that baseline, a module loaded from a user-writable folder next to the image — or an unsigned
    module whose name also exists under System32 — is the side-loaded component, and its hash is what to compare
    against the known-good copy.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
  - manual_review
- question: Was a module or executable written into a user-writable directory on this host shortly before the process started?
  context: >-
    Side-loading requires both the host binary and its module to be staged on disk before execution, so the write is
    the first observable step of the chain. This looks back 24 hours for .dll and .exe writes into the user-writable
    directories such staging normally uses, and names the process that performed each write. Compare the write times
    against the process start and the module load — a drop landing minutes before the load is the correlation that
    separates staging from an unrelated software installation, while a file written days earlier and only now executed
    points at a dormant foothold.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_ext:
        TargetFilename|endswith:
          - '.dll'
          - '.exe'
      selection_dirs:
        TargetFilename|contains:
          - '\AppData\Roaming\'
          - '\AppData\Local\'
          - '\ProgramData\'
          - '\Users\Public\'
      condition: selection and selection_ext and selection_dirs
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - process_creation
- question: >-
    Was a service entry or autostart value written on this host that points at the launcher or its directory?
  context: >-
    Hijacked execution flow is usually made durable through the registry — a Run value or a service ImagePath naming
    the launcher, or a search-order redirect through AppInit_DLLs or KnownDLLs. Compare what was written against the
    service paths and autostart entries this host is expected to have; a service whose ImagePath resolves to a
    user-writable directory rather than a system directory, or a KnownDLLs entry that was not shipped with the
    operating system, is the persistence half of the chain and needs removal independently of the running process.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\CurrentVersion\Run'
          - '\CurrentControlSet\Services\'
          - '\CurrentVersion\Windows\AppInit_DLLs'
          - '\Session Manager\KnownDLLs'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - process_creation
  - manual_review
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the user's 90-day history
    of this specific firing pattern rather than generic svchost.exe activity, aggregated by host. A user who has never
    produced this pattern is a stronger lead than one who does so regularly; weigh the count against their role and
    the software they are expected to install and run.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_sllauncher:
        ParentImage|endswith: \sllauncher.exe
        Image|endswith: \svchost.exe
      selection_svchost:
        ParentImage|contains: \AppData\Roaming\
        Image|endswith: \svchost.exe
        CommandLine|contains: -k
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: >-
    Has this parent process historically driven the rule's pattern on this host or across the environment, or is the
    parent new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute the behavior and the launch
    mechanism is the meaningful pivot. The query mirrors the rule's selection structure scoped to the alerting parent
    process, so the result is the 90-day history of this parent driving this specific pattern rather than generic
    parent-and-binary co-occurrence. A parent that is new or rare for this pattern is the deviation worth chasing; one
    that already accounts for thousands of prior events is vendor or operating-system automation.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_sllauncher:
        ParentImage|endswith: \sllauncher.exe
        Image|endswith: \svchost.exe
      selection_svchost:
        ParentImage|contains: \AppData\Roaming\
        Image|endswith: \svchost.exe
        CommandLine|contains: -k
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the account's activity across all hosts in the alert window reveals whether the same identity was active
    elsewhere, which distinguishes a single staged foothold from movement across endpoints. If the alert fired under a
    service principal such as SYSTEM or a computer account, this view fills with routine service telemetry and the
    parent-scoped fleet question is the one that answers the same intent.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: >-
    Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this
    host?
  context: >-
    Under a service principal, asking what else the user did network-wide returns routine service telemetry from every
    host. The meaningful question is whether the same launch mechanism fired elsewhere, so the query mirrors the rule's
    selection structure scoped to the alerting parent process, fleet-wide, in the alert window. Multiple hosts in the
    same window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_sllauncher:
        ParentImage|endswith: \sllauncher.exe
        Image|endswith: \svchost.exe
      selection_svchost:
        ParentImage|contains: \AppData\Roaming\
        Image|endswith: \svchost.exe
        CommandLine|contains: -k
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Execution from a staged directory is rarely the first observable step. Earlier detections on the same host — a
    download or archive extraction, defense tampering, or reconnaissance — often name the delivery path and give the
    timeline a starting point. If nothing else fired, the staging step may predate the retention window rather than
    not exist.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    A side-loaded foothold is often backed up with a second mechanism installed through ordinary tooling — a scheduled
    task, a service, a Run key write, or a WMI subscription. Persistence tool executions in the same few hours as the
    detected activity indicate intentional stacking rather than isolated administrative work, and each one is a
    separate item to remove.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Were files dropped to persistence locations (Startup folders, scheduled-task definitions) on this host?
  context: >-
    File-based persistence bypasses command-line detection entirely. Dropping the launcher or a shortcut to it into a
    Startup folder, or writing a scheduled-task definition directly, achieves the same durability without running
    schtasks, sc or reg, so these writes are visible only in file telemetry. A Startup drop that references the same
    directory the launcher runs from ties the two mechanisms together.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
