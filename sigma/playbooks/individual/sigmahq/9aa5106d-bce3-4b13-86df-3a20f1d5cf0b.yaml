name: Forfiles Command Execution
id: d8e1d83f-033f-43e1-9401-dfd2c7f9504c
description: |
  Detects execution of forfiles.exe with the /c flag, where forfiles matches files in a directory and runs a command for each match. The flag is required for legitimate batch processing, but because forfiles spawns an arbitrary command as its own child it is also used to proxy execution of attacker-chosen binaries and bypass application allowlisting. The rule fires when the process image ends in forfiles.exe (or its OriginalFileName is forfiles.exe) AND the command line contains the windash-normalized -c switch. Investigation should establish what command forfiles was told to run, what it actually spawned, and whether this user, host, and parent chain routinely run forfiles this way.
type: detection
detection_id: 9aa5106d-bce3-4b13-86df-3a20f1d5cf0b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the alerting process match forfiles.exe running with the /c command switch?
  context: Confirm the alert is a true positive by reviewing the exact image, original filename, and command line. The rule requires both that the image ends in forfiles.exe (or its OriginalFileName is forfiles.exe) and that the command line carries the -c / /c switch. Read the full command after /c to see which command forfiles was instructed to run for each matched file.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run forfiles for batch processing or administrative scripting?
  context: Legitimate forfiles use is usually scripted batch maintenance run by administrators or scheduled tasks. Knowing whether this user role and host function normally perform command-line file batching is often the fastest way to separate routine automation from proxy-execution abuse.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What command did forfiles run via /c, and what does that command actually do?
  context: The text after /c is the payload forfiles executes for each matched file. Decode it fully — resolve the target binary or script, any nested flags, file paths, alternate-data-stream references (path:stream), and URLs. forfiles is frequently used to launch a chosen executable while breaking simple parent-image heuristics, so the /c argument is where the real intent lives.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned forfiles, and is that parent chain expected?
  context: The parent reveals how forfiles was invoked. Scripted maintenance typically descends from explorer.exe, cmd.exe, a scheduling service, or a deployment agent. Parents such as wscript.exe, mshta.exe, an Office application, or a browser-derived process point toward macro or exploit-driven invocation rather than routine batch processing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did forfiles spawn afterward?
  context: forfiles abuse works by spawning an attacker-chosen process as a child of forfiles.exe, so the children are the actual proxied execution. Children such as cmd.exe, powershell.exe, certutil.exe, rundll32.exe, or an executable from a user-writable path indicate the proxied command did real work; an empty or benign child set suggests the match returned nothing or ran a routine command.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host has previously fired the forfiles /c pattern, what parents and users normally drive it, and does the current alert fit?
  context: The query mirrors the rule's selection structure scoped to this host, so the parent and user distribution reflects how this exact firing pattern has historically run here rather than generic forfiles usage. A new parent process, an unexpected user account, or a first-time appearance of the pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \forfiles.exe
      - OriginalFileName: forfiles.exe
      selection_cli:
        CommandLine|contains|windash: ' -c '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What other tools ran on this host around the same time as the forfiles execution?
  context: Proxy execution rarely stands alone. Activity in the minutes surrounding the forfiles invocation may reveal reconnaissance, download cradles, privilege escalation, or persistence setup that frames whether forfiles was one step in a larger sequence or an isolated batch job.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Have other hosts fired the forfiles /c pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, giving a fleet-wide count of this specific firing pattern rather than generic forfiles usage. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host spread to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \forfiles.exe
      - OriginalFileName: forfiles.exe
      selection_cli:
        CommandLine|contains|windash: ' -c '
      condition: all of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \forfiles.exe
      - OriginalFileName: forfiles.exe
      selection_cli:
        CommandLine|contains|windash: ' -c '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \forfiles.exe
      - OriginalFileName: forfiles.exe
      selection_cli:
        CommandLine|contains|windash: ' -c '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated activity. If the same user triggered similar command-line execution on multiple endpoints, the scope of the activity may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \forfiles.exe
      - OriginalFileName: forfiles.exe
      selection_cli:
        CommandLine|contains|windash: ' -c '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the forfiles execution reveals what led to it and what followed, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, or persistence mechanisms appearing as novel parent-child pairs.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the attack stages that preceded the forfiles execution and help reconstruct the timeline. Proxy execution is often a delivery or staging step that follows initial access.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were any other proxy-execution LOLBins used on this host recently?
  context: Operators who use one proxy-execution LOLBin often use several. If forfiles was used to launch a payload, check whether rundll32, regsvr32, mshta, msbuild, pcalua, installutil, or similar binaries were also used to run arbitrary code on this host. Multiple proxy-execution LOLBins performing the same objective strengthens the case for hands-on activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\wmic.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\installutil.exe'
          - '\ie4uinit.exe'
          - '\xwizard.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was forfiles.exe executed from an expected System32 or SysWOW64 path?
  context: forfiles.exe normally lives in C:\Windows\System32 or C:\Windows\SysWOW64. Execution from a user-writable or non-standard path, or a mismatch between the image path and an OriginalFileName of forfiles.exe, suggests the binary was copied or renamed to evade path-based allowlists.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired the forfiles /c pattern over the past 90 days, and what command-line structures are typical?
  context: A LOLBin pattern with no prior history on a host is more suspicious than one used daily under stable parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects this specific firing pattern rather than generic forfiles usage. The command-line projection lets the analyst compare typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \forfiles.exe
      - OriginalFileName: forfiles.exe
      selection_cli:
        CommandLine|contains|windash: ' -c '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
