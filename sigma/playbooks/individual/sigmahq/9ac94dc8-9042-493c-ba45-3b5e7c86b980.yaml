name: Disable Important Scheduled Task
id: aca31a73-43fe-4d70-acfa-f64d7c11e9e5
description: |
  Detects schtasks.exe disabling built-in protective scheduled tasks — the rule fires when an
  schtasks invocation (Image ends in schtasks.exe or OriginalFileName schtasks.exe) carries a /disable
  switch AND references a sensitive task path such as BitLocker, Windows Defender, Exploit Guard,
  System Restore, Update Orchestrator, Windows Update, or Windows Backup. Legitimately this is rare:
  administrators occasionally disable update or backup tasks during maintenance windows, but disabling
  Defender or BitLocker tasks is almost never routine. Maliciously, turning off these tasks weakens
  recovery and protection ahead of destructive activity, and frequently appears alongside shadow-copy
  deletion, service stops, and log clearing as a ransomware precursor. Determine which protective task
  was targeted, who and what launched the command, whether protection or recovery state actually
  changed, and whether other recovery-inhibiting or destructive actions ran on the host or fleet.
type: detection
detection_id: 9ac94dc8-9042-493c-ba45-3b5e7c86b980
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did schtasks run with /disable against a protected task path such as BitLocker, Defender, Exploit Guard, System Restore, or a backup/update task?
  context: Confirm the alert is a true positive before investing time. The rule fires only when the command line both carries a /disable switch and names one of the protected task paths, so read the exact command line and verify both halves are present rather than a benign schtasks query or an unrelated task.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to disable protective scheduled tasks?
  context: Disabling Defender, BitLocker, or Exploit Guard tasks is almost never routine; disabling update or backup tasks can be legitimate during maintenance. Knowing whether the account and host function fit this action is often the fastest path to separating a sanctioned maintenance window from operator preparation for destruction.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which protective task was disabled, and what were the exact /tn target and switches?
  context: The schtasks command line carries the targeted task name (/tn) and the change action (/change /disable, or /disable). Decode it to identify precisely which protective task was turned off — BitLocker, Defender, Exploit Guard, System Restore (SR), Update Orchestrator, Windows Update, or Windows Backup — since the specific target determines which protection or recovery capability was weakened.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did the protective service or feature behind the disabled task actually change state on this host?
  context: Disabling a scheduled task does not by itself stop a running service, but the targeted tasks back protection and recovery features (Defender, BitLocker, System Restore, backup). Service Control Manager state-change records show whether the corresponding service was also stopped or set to disabled around the same time, which distinguishes a single task tweak from a deliberate teardown of the protection stack.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: system
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 7036
          - 7040
      condition: selection
    fields:
      - ServiceName
      - StartType
      - EventID
- question: What recovery-inhibiting commands were executed on this host?
  context: Disabling System Restore, backup, and update tasks is often one step in a wider recovery-destruction sequence such as deleting shadow copies (vssadmin, wmic), disabling boot recovery (bcdedit), deleting backups (wbadmin), or disabling the Recovery Environment (reagentc). This query surfaces all recovery-inhibiting commands on the host so the full scope is visible. Verify whether each action succeeded by checking system state with vssadmin list shadows, bcdedit /enum, and reagentc /info.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\reagentc.exe'
          - '\diskshadow.exe'
      selection_cmdline:
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'recoveryenabled'
          - 'bootstatuspolicy'
          - 'delete catalog'
          - 'delete systemstatebackup'
          - 'boot.ini'
          - 'winre.wim'
          - '/disable'
      condition: selection and (selection_recovery or selection_cmdline)
    fields:
      - Image
      - CommandLine
- question: What other destructive or recovery-inhibiting actions occurred on this host?
  context: Operators preparing for impact typically chain multiple destructive actions — disabling protection AND deleting shadow copies AND stopping security services AND clearing logs. Finding the complete set of destructive commands around this event reveals whether this is an isolated administrative tweak or part of a destruction playbook.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_destructive:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\cipher.exe'
          - '\fsutil.exe'
          - '\icacls.exe'
          - '\takeown.exe'
          - '\attrib.exe'
          - '\sc.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\powershell.exe'
          - '\taskkill.exe'
      condition: selection and selection_destructive
    fields:
      - Image
      - User
- question: Are there signs of file encryption, ransom notes, or unknown binary execution on this host after the disable?
  context: Recovery-inhibiting actions typically precede file encryption by minutes. Checking for execution of unknown or suspicious binaries shortly after the protective task was disabled determines whether an encryption or destruction payload has already started. Also check for ransom notes (README.txt, HOW_TO_DECRYPT, unusual extensions) via file events or the endpoint console.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_known:
        Image|startswith:
          - 'C:\Program Files'
          - 'C:\Windows\System32\svchost'
          - 'C:\Windows\System32\wbem'
      condition: selection and not filter_known
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: Is this same task-disable activity firing on other hosts in the environment?
  context: Destructive preparation is often pushed across many hosts at once or in rapid succession. Finding this same alert on multiple hosts indicates network-wide execution and sets the scope for containment and incident response.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
- question: What process spawned this schtasks command, and is that parent chain expected?
  context: The parent process reveals how schtasks was invoked. A logon shell or management agent driving routine maintenance looks different from cmd.exe or powershell.exe running a batch script, or an Office or scripting-host parent, which point to scripted or operator-driven disabling. Walk up the tree to see what spawned the parent and what else it spawned.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_cli_disable:
        CommandLine|contains|windash: /disable
      selection_cli_task:
        CommandLine|contains:
        - \Windows\BitLocker
        - \Windows\ExploitGuard
        - \Windows\ExploitGuard\ExploitGuard MDM policy Refresh
        - \Windows\SystemRestore\SR
        - \Windows\UpdateOrchestrator\
        - \Windows\Windows Defender\
        - \Windows\WindowsBackup\
        - \Windows\WindowsUpdate\
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_cli_disable:
        CommandLine|contains|windash: /disable
      selection_cli_task:
        CommandLine|contains:
        - \Windows\BitLocker
        - \Windows\ExploitGuard
        - \Windows\ExploitGuard\ExploitGuard MDM policy Refresh
        - \Windows\SystemRestore\SR
        - \Windows\UpdateOrchestrator\
        - \Windows\Windows Defender\
        - \Windows\WindowsBackup\
        - \Windows\WindowsUpdate\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated action across endpoints. If the same account disabled protective tasks or ran destructive tools on multiple hosts, the scope of compromise may be larger than the alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_cli_disable:
        CommandLine|contains|windash: /disable
      selection_cli_task:
        CommandLine|contains:
        - \Windows\BitLocker
        - \Windows\ExploitGuard
        - \Windows\ExploitGuard\ExploitGuard MDM policy Refresh
        - \Windows\SystemRestore\SR
        - \Windows\UpdateOrchestrator\
        - \Windows\Windows Defender\
        - \Windows\WindowsBackup\
        - \Windows\WindowsUpdate\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Disabling protective tasks rarely happens in isolation. Earlier detections on the same host — reconnaissance, credential access, other defense tampering — may reveal the stages that preceded this event and help reconstruct the timeline leading to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other native persistence or defense-evasion tools used on this host recently?
  context: Operators who disable one protective task usually reach for several native tools — sc, net, reg, bcdedit, vssadmin — to stop services, change configuration, or destroy recovery. Finding multiple such tools running in the same timeframe strengthens the case that this is a deliberate teardown rather than a one-off task tweak.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\sc.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\reg.exe'
          - '\at.exe'
          - '\netsh.exe'
          - '\wevtutil.exe'
          - '\bcdedit.exe'
          - '\vssadmin.exe'
          - '\diskshadow.exe'
          - '\wbadmin.exe'
          - '\reagentc.exe'
          - '\wmic.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was schtasks executed from its expected System32 path, or from an unusual location?
  context: schtasks run from outside System32 or SysWOW64 may be a copied or renamed binary used to evade path-based allowlists. Compare the Image path and OriginalFileName from the alert — an OriginalFileName of schtasks.exe under a non-standard Image path is more suspicious than the in-box binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired this schtasks-disable pattern over the past 90 days, and what command-line structures are typical?
  context: A disable-protective-task pattern with no prior history on a host is more suspicious than one that recurs under stable parents (for example, a managed maintenance job). The query mirrors the rule's selection structure scoped to this host, so the count reflects the rule's specific firing pattern, not generic schtasks usage. The CommandLine projection lets you compare typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_cli_disable:
        CommandLine|contains|windash: /disable
      selection_cli_task:
        CommandLine|contains:
        - \Windows\BitLocker
        - \Windows\ExploitGuard
        - \Windows\ExploitGuard\ExploitGuard MDM policy Refresh
        - \Windows\SystemRestore\SR
        - \Windows\UpdateOrchestrator\
        - \Windows\Windows Defender\
        - \Windows\WindowsBackup\
        - \Windows\WindowsUpdate\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
