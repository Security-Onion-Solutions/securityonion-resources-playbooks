name: Potential Persistence Via Logon Scripts - Registry
id: 9ff6bc12-af3a-4fc5-92cc-ef7bf9c5fa07
description: |
  Detects a registry write to a value named UserInitMprLogonScript, the per-user logon-script
  entry under HKCU\Environment. The value holds a path or command that the logon process runs
  automatically the next time the account logs on, making it a persistence mechanism that also
  re-executes on remote (network/RDP) logons. Legitimate use of this value is rare, so the
  investigation should decode what script or command was configured, confirm which process wrote
  it and what launched that process, determine whether the referenced payload exists on disk and
  ran at the next logon, and check whether the change is confined to this host or spread across
  the environment.
type: detection
detection_id: 9ace0707-b560-49b8-b6ca-5148b42f39fb
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting registry write set a UserInitMprLogonScript value?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when
    a registry value whose path contains UserInitMprLogonScript is written, which is the per-user
    logon-script entry under HKCU\Environment. Review the exact TargetObject and the value data on
    the triggering event to confirm this is a logon-script configuration rather than an unrelated
    Environment key edit, and note the script or command that was set.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to configure a logon script for this account?
  context: >-
    Setting a per-user logon script through the registry is uncommon in routine use; most managed
    logon scripts are delivered through Group Policy, not written directly to HKCU\Environment.
    Knowing whether the writing account and host function match any sanctioned change is often the
    fastest way to separate administrative or testing activity from a persistence attempt. User
    attribution is present on roughly 94% of endpoint registry events; when it is a machine account
    or missing, pivot on the writing process instead. Organizations may focus this judgment on
    accounts with high privilege or remote access.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which UserInitMprLogonScript value was written, and why is this key a persistence location?
  context: >-
    The value UserInitMprLogonScript under HKCU\Environment is read by the logon process and its
    contents are executed automatically whenever the account logs on, including network and remote
    desktop logons. Because the script runs under the user's logon context without further action,
    a value placed here establishes persistence and can also serve lateral re-execution. Confirming
    the exact registry path and the writing process establishes this as the logon-script key rather
    than an unrelated Environment edit and sets up decoding the configured command.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What script path or command was written to the logon-script value?
  context: >-
    The Details field holds the command the logon process will run at the next logon. Decode it: the
    configured value is commonly a path to a batch, script, or executable file, or an inline
    interpreter command such as cmd.exe or powershell.exe with arguments. A path pointing to a
    user-writable or temporary location, or an encoded interpreter command, indicates a planted
    payload rather than a sanctioned script. Known managed logon scripts usually live under domain
    NETLOGON or SYSVOL shares; a local or temporary path here does not match that pattern. Details is
    present on roughly 79% of registry modifications and should be populated for this string value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote the logon-script value, and what launched that process?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to
    read its Image, full command, and parent. A reg.exe, powershell.exe, or cmd.exe write launched
    from an Office application, a browser, a script host such as wscript.exe or mshta.exe, or an
    unsigned binary points to the persistence being staged programmatically rather than a deliberate
    administrator action. The parent chain distinguishes a scripted change from an interactive
    console edit.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Did the configured logon script execute after this value was set?
  context: >-
    A logon script configured through this value runs at the next logon for the account, which may
    be well after the registry write rather than immediately. The query anchors on the written value
    data, so any row is the configured script or command running on this host under the user's logon
    context. Execution of the configured command confirms the persistence is active; a zero over the
    window may simply mean the account has not yet logged on again — the logon-activity question
    covers whether a triggering logon occurred.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|expand: '%Details%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: After this value was set, did the account log on, and by what logon type?
  context: >-
    The configured logon script executes on the next authentication for this account, so a logon
    event after the registry write is the trigger that runs the persistence. The logon type
    distinguishes an interactive session from a remote one - network and remote desktop logons re-run
    the script when the account is used to reach this host from elsewhere, which is the lateral
    re-execution angle of logon-script persistence. If Windows Security logon events are not collected
    in this environment, treat zero results as a visibility gap rather than evidence no logon
    occurred.
  range: +24h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 4624
          - 4648
        TargetUserName|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - LogonType
      - IpAddress
      - EventID
- question: Is the script or executable referenced by the logon-script value present on disk?
  context: >-
    The persistence is only effective if the file the value points to exists at that path. If the
    writing process or one of its children created the referenced script or binary, the mechanism is
    armed and will run at the next logon. The file-write event carries no hash; if the payload is
    present, hash it from a later execution or retrieve it for a reputation lookup. Registry
    durability across reboot is a judgment call - point at the value data and its re-modification
    history rather than expecting a delete event.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: After this write, was the logon-script value changed again or left in place?
  context: >-
    Registry key or value deletions are not observable in this telemetry, so durability is judged
    from the value's re-modification history rather than from a delete event. A value left in place
    stays primed to run the configured command at every subsequent logon; a later write that clears
    or overwrites it may indicate cleanup after the payload ran or a correction. Compare the Details
    values written to this key over the following window to see whether the persistence remains
    active.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Has this logon-script value been modified before on this host?
  context: >-
    The per-user logon-script value should change rarely and only through deliberate action, so a
    history with no prior writes makes this a first-time change and raises its weight. A history of
    periodic writes to the same value points instead to a management process or a repeatedly run
    tool. Compare the historical Details values to see whether a script was configured here before or
    whether this is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this logon-script value modified on other hosts in the environment?
  context: >-
    The same logon-script write across many hosts suggests a policy push, a widely deployed tool, or
    a self-propagating change; the same write confined to one host suggests a targeted persistence
    attempt. Compare the Details values across hosts to see whether they all configure the same script
    and whether the writing process is consistent, which separates a single hands-on operation from
    repeated use of the technique across the environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor who plants logon-script persistence often makes other configuration changes in the same
    session - additional autostart or Run keys, security policy edits, or service changes. Clustering
    the registry writes on this host in a short window around the alert reveals the full scope of
    changes and which process made them. The triggering key appears in the results; the signal is what
    else was modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Persistence rarely lands in isolation. Aggregating process activity in a tight window around the
    alert surfaces what led up to the logon-script write and what ran immediately after it. Novel
    parent-child pairs stand out at low counts against high-count routine telemetry, which is what
    points to the tool that staged the change and any follow-on actions taken in the same session.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, execution of scripting tools, credential
    access, or defense tampering - may reveal the stages that preceded this change and help
    reconstruct the timeline. Logon-script persistence is typically a means to keep access, so prior
    alerts help place this write within a larger sequence rather than treating it as an isolated
    event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Attackers rarely rely on a single persistence mechanism. After configuring a logon script, they
    commonly install backup footholds using different techniques - scheduled tasks, services,
    additional registry keys, BITS jobs, or WMI subscriptions created by schtasks.exe, sc.exe,
    reg.exe, bitsadmin.exe, or wmic.exe near the logon-script write indicate intentional stacking
    rather than an isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely - dropping an executable or
    script into a Startup folder or a path referenced by a registry Run key achieves persistence
    without invoking schtasks, sc, or reg. File writes to these locations near the logon-script change
    indicate a parallel persistence mechanism was established alongside the detected one.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Does the user or an administrator recall configuring a logon script for this account?
  context: >-
    The per-user logon-script value has no routine reason to change, so direct confirmation from the
    account owner or an administrator is a fast way to resolve the alert. If a red-team operator or an
    administrator testing logon automation set the value, that closes it; if no one recalls the
    action, the account may be compromised or the change was made by automated tooling, and the
    investigation should continue into the writing process and any follow-on execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
