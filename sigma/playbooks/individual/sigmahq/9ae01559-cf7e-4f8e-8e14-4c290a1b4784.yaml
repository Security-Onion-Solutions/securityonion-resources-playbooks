name: CredUI.DLL Loaded By Uncommon Process
id: a8496d88-77f3-473d-96f6-065e69c262af
description: |
  Detects credui.dll or wincredui.dll (the Windows credential-prompt UI library) being loaded by a
  process outside the expected set of system and known-application binaries. The rule matches when a
  module ending in \credui.dll or \wincredui.dll, or a module whose PE OriginalFileName is
  credui.dll/wincredui.dll, is loaded, AND the loading process is not one of the allow-listed system
  paths or known applications (explorer.exe, SystemSettings.exe, regedit.exe, Process Explorer, Teams,
  OneDrive, the Opera updater). These exports (CredUIPromptForCredentials, CredUnPackAuthenticationBufferW)
  let a process display a native-looking Windows credential dialog or unpack submitted credentials; a
  script host or unusual binary loading them is consistent with GUI input capture — spoofing a credential
  prompt to phish the interactive user's password, or hooking a credential-handling process to intercept
  entered secrets. Investigate which process loaded the library and its parent chain and command line,
  whether the loaded module is the genuine signed System32 copy or a relocated/renamed one, and whether
  the interactive user's credentials may have been captured and used for follow-on movement.
type: detection
detection_id: 9ae01559-cf7e-4f8e-8e14-4c290a1b4784
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting DLL load match what this rule detects — credui.dll or wincredui.dll loaded by a process outside the allow-listed system and application binaries?
  context: >-
    Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded), its PE
    OriginalFileName, its code-signature status, and the process that loaded it (Image). The rule fires
    when the credential-UI library is loaded AND the loading process is not one of the expected system
    paths or known applications. The decisive field here is the loading process: credui.dll living in
    System32 is normal, but explorer.exe, SystemSettings.exe, regedit.exe, Process Explorer, Teams,
    OneDrive, and the Opera updater are already excluded, so a match means some other binary — often a
    script host — pulled in the credential-prompt API. A DLL load carries its signing status and hash
    directly on the event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - OriginalFileName
      - ImageLoaded
- question: Is this user and host expected to run a process that prompts for Windows credentials through the CredUI API?
  context: >-
    Legitimate software occasionally displays the native Windows credential dialog — installers, remote
    access clients, and some line-of-business tools. Knowing whether the loading process, the user
    account, and the host function are consistent with sanctioned credential-prompting is often the
    fastest way to separate a routine prompt from a spoofed one. If the account is a machine account or
    SYSTEM, pivot the identity questions onto the loading process instead of the user.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What other modules did this process load, and are any .NET assemblies or DLLs from user-writable or non-canonical paths?
  context: >-
    The full set of modules a process loaded tells the operator's story when the load of credui.dll alone
    is ambiguous. A script host that loaded credui.dll alongside .NET runtime assemblies (clr.dll,
    System.Management.Automation) is consistent with PowerShell or .NET code invoking the credential-prompt
    API in memory. Look for modules loaded from %TEMP%, AppData, ProgramData, or Public, for unsigned
    modules where signed ones are expected, and for system DLL names loaded from non-system paths — any of
    which points to a process that is doing more than displaying a routine prompt.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: Is the loaded credui.dll the genuine signed System32 copy, or a relocated or renamed module with the credui.dll OriginalFileName?
  context: >-
    The rule's OriginalFileName selection matches even a copy of credui.dll that was renamed on disk,
    because the PE metadata still reads credui.dll. Compare the ImageLoaded path against the expected
    System32/SysWOW64 location, and check the module's signing status and hash: a genuinely Microsoft-signed
    credui.dll loaded from System32 is routine, while a module carrying the credui.dll OriginalFileName but
    living in a user-writable directory, unsigned, or with an invalid signature is a masquerading or
    side-loading indicator. The module hash enables a reputation lookup against threat intelligence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - ImageLoaded
      - OriginalFileName
      - Hashes
      - Signed
      - SignatureStatus
- question: What credentials was this prompt designed to capture, and does the loading process's command line reveal a spoofed dialog?
  context: >-
    GUI input capture phishes the interactive user directly rather than reading a credential store, so the
    target is whatever account the user types into the dialog — typically their own domain or local logon.
    Pivot to the loading process's command line: script-driven prompts often carry the dialog title and
    caption inline, such as a PromptForCredential call with a title like 'Windows Security Update' or a
    caption mentioning credentials. An inline title spoofing a system prompt is strong evidence of a
    deliberate phishing dialog rather than an application's own authentication flow.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process loaded the credential-UI library, and what launched that process?
  context: >-
    The image_load event names the loading process; pivot by its ProcessGuid to its own creation record to
    read the full command line and its parent. A credui.dll load from a script host such as powershell.exe,
    wscript.exe, or mshta.exe, or from an unsigned binary, launched by an Office application, a browser, or
    another script host, points to the credential prompt being staged programmatically rather than raised
    by a user-facing application. The parent chain distinguishes a scripted capture from an interactive
    action the user initiated.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Did any process on this host run a command line containing credential-prompt strings around the time of the alert?
  context: >-
    Spoofed credential prompts driven from scripts frequently carry their prompt text or the API name
    inline. Searching this host for command lines containing PromptForCredential, CredUIPromptForCredentials,
    CredUnPackAuthenticationBuffer, or dialog captions such as 'Enter your password' or 'CredentialRequired'
    surfaces the scripted invocation even when it is not the process that tripped this alert. Consistent
    results across a short window help confirm a deliberate credential-capture dialog rather than a
    coincidental library load.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
          - 'PromptForCredential'
          - 'CredUIPromptForCredentials'
          - 'CredUnPackAuthenticationBuffer'
          - 'Enter your password'
          - 'CredentialRequired'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: What child processes did the loading process spawn after the credential-UI library was loaded?
  context: >-
    The processes a credential-capturing tool spawns reveal what it did with the harvested secret.
    Legitimate credential prompts rarely spawn children; a script host that loaded credui.dll and then
    launched cmd.exe, powershell.exe, certutil.exe, or a network utility may be staging the captured
    credential for reuse, encoding it for exfiltration, or moving on to the next stage. Listing the
    children of the loading process shows the post-capture activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has credui.dll or wincredui.dll been loaded on this host before, and by which processes?
  context: >-
    A first-time load of the credential-UI library by a given process is a stronger anomaly than a
    recurring one. If the same module has been loaded by the same process binary repeatedly over the past
    90 days, this load is probably routine for that application. If this is the first occurrence, or the
    library has historically only been loaded by the expected system and application binaries and now
    appears under a script host or unusual process, the current load is anomalous.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: When this host has previously matched the rule's pattern, what loading processes and users drove it, and does the current alert fit that history?
  context: >-
    Even a benign application can trip this rule. The query mirrors the rule's full selection and filter
    structure scoped to this host, so the resulting distribution reflects how the rule's specific firing
    pattern — not generic credui.dll usage — has historically run here. A new loading process, an unexpected
    user account, or a first-ever match is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
      - ImageLoaded|endswith:
        - \credui.dll
        - \wincredui.dll
      - OriginalFileName:
        - credui.dll
        - wincredui.dll
      filter_main_generic:
        Image|startswith:
        - C:\Program Files (x86)\
        - C:\Program Files\
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
        - C:\Windows\SystemApps\
      filter_main_full:
        Image:
        - C:\Windows\explorer.exe
        - C:\Windows\ImmersiveControlPanel\SystemSettings.exe
        - C:\Windows\regedit.exe
      filter_optional_opera:
        Image|endswith: \opera_autoupdate.exe
      filter_optional_process_explorer:
        Image|endswith:
        - \procexp64.exe
        - \procexp64a.exe
        - \procexp.exe
      filter_optional_teams:
        Image|startswith: C:\Users\
        Image|contains: \AppData\Local\Microsoft\Teams\
        Image|endswith: \Teams.exe
      filter_optional_onedrive:
        Image|startswith: C:\Users\
        Image|contains: \AppData\Local\Microsoft\OneDrive\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts matched the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection and filter structure with no host scope, so the result is a
    fleet-wide count of the rule's firing pattern rather than generic credui.dll usage. Many hosts loading
    the credential-UI library from the same uncommon process points to a deployed application or vendor
    tool the allow-list has not yet caught; one host or a small unrelated set points to hands-on activity.
    Use the host distribution and the consistency of the loading process to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
      - ImageLoaded|endswith:
        - \credui.dll
        - \wincredui.dll
      - OriginalFileName:
        - credui.dll
        - wincredui.dll
      filter_main_generic:
        Image|startswith:
        - C:\Program Files (x86)\
        - C:\Program Files\
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
        - C:\Windows\SystemApps\
      filter_main_full:
        Image:
        - C:\Windows\explorer.exe
        - C:\Windows\ImmersiveControlPanel\SystemSettings.exe
        - C:\Windows\regedit.exe
      filter_optional_opera:
        Image|endswith: \opera_autoupdate.exe
      filter_optional_process_explorer:
        Image|endswith:
        - \procexp64.exe
        - \procexp64a.exe
        - \procexp.exe
      filter_optional_teams:
        Image|startswith: C:\Users\
        Image|contains: \AppData\Local\Microsoft\Teams\
        Image|endswith: \Teams.exe
      filter_optional_onedrive:
        Image|startswith: C:\Users\
        Image|contains: \AppData\Local\Microsoft\OneDrive\
      condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
    fields:
    - host.name
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after this event?
  context: >-
    A credential captured through a spoofed prompt is typically reused for lateral movement. The query
    returns outbound connections from this host to remote-access ports — 3389 (RDP), 445 (SMB), 5985/5986
    (WinRM), 22 (SSH) — in the hours after the event, with the originating process and user. Two limits to
    keep in mind: a credential exfiltrated and replayed from another machine will not appear here, so also
    review logon events for this account on suspected targets; and if network telemetry is not collected
    from this host, treat zero rows as a visibility gap rather than evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Which account's credentials would this prompt have captured, and does that account have elevated privileges?
  context: >-
    The severity of a spoofed credential prompt depends on the interactive user whose password it would
    harvest. A domain admin or an account with broad access requires escalation; a standard user account
    may only need a password reset and monitoring. Cross-reference the user on the triggering event with
    directory group memberships to determine the blast radius if the credential was entered and captured.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Credential capture rarely happens in isolation. Aggregating process activity in a tight window around
    the alert surfaces what led up to the library load and what ran immediately after. Novel parent-child
    pairs stand out at low counts against high-count routine telemetry, which points to the tool that
    staged the prompt and to any follow-on actions taken once a credential was obtained.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — reconnaissance, script execution, or defense tampering — may
    reveal the stages that preceded this credential-capture attempt and help reconstruct the timeline.
    GUI input capture is often a mid-operation step, so prior alerts help place this library load within a
    larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
