name: Potential COM Object Hijacking Via TreatAs Subkey - Registry
id: 0579b740-6c91-4f11-9961-65f32b158951
description: |
  Detects a registry write that creates or sets a TreatAs subkey under a per-user
  HKU\...\Software\Classes\CLSID\ key, excluding writes made by svchost.exe. TreatAs is a COM
  registry link that redirects any reference to one CLSID into a second CLSID's load path; an
  actor points the hijacked class at a second CLSID they also control whose InprocServer32 (or a
  scrobj.dll ScriptletURL) resolves to a payload DLL or scriptlet. When any process later
  instantiates the original class, the redirected payload loads and runs, giving persistence and,
  because the class may be invoked by higher-integrity or signed host binaries, privilege
  escalation. Legitimate TreatAs linking for backward compatibility is rare, so investigate which
  process wrote the key and what launched it, what CLSID the value redirects to, whether a paired
  second-CLSID InprocServer32 write and a payload DLL landed on the host, whether a COM invoker
  such as rundll32.exe, xwizard.exe, verclsid.exe, or mmc.exe subsequently loaded an unusual DLL,
  and whether the value was later reverted.
type: detection
detection_id: 9b0f8a61-91b2-464f-aceb-0527e0a45020
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting write set a TreatAs subkey under a per-user Classes CLSID key, and was it made by a process other than svchost.exe?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when
    a registry value whose path contains HKU\, Classes\CLSID\, and \TreatAs is written AND the
    writing process is not svchost.exe. Review the exact TargetObject and the writing process on the
    triggering event to confirm the path is a per-user CLSID TreatAs link rather than an unrelated
    Classes edit. A TreatAs default value under a user's Classes\CLSID hive is the setup step of a
    COM link hijack and effectively never occurs through routine use.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to write a TreatAs COM link under the user's Classes hive?
  context: >-
    A TreatAs link under a per-user Classes\CLSID key has no routine reason to be set, so knowing
    whether the writing account and host function match any sanctioned change is the fastest way to
    separate developer, installer, or backward-compatibility activity from a live hijack. User
    attribution is present on roughly 94% of endpoint registry events; when it is a machine account
    or SYSTEM, pivot on the writing process instead, since service-driven writes are attributed to
    the principal that ran them rather than an interactive user. Tuning that isolates which SIDs or
    admin-level accounts are expected to touch these keys is what turns this into a reliable signal.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which CLSID does this TreatAs link belong to, and why is a per-user Classes CLSID a hijack location?
  context: >-
    Keys under HKU\...\Software\Classes\CLSID override the machine-wide HKLM Classes at COM
    resolution time, so a TreatAs value placed in the per-user hive is inherited by any process that
    instantiates that class, including signed system binaries. Confirming the exact CLSID and the
    writing process establishes that this is a COM link hijack rather than an unrelated Classes edit
    and identifies which class instantiation will trigger the redirect. Which specific CLSIDs are
    worth monitoring is environment-dependent, since a small set of applications legitimately link
    classes for compatibility.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What second CLSID does the TreatAs value redirect to?
  context: >-
    The Details field of a TreatAs default value holds the target CLSID GUID that the original class
    is redirected to. Decode it: in a link hijack the second CLSID is one the actor also controls,
    whose InprocServer32 or a scrobj.dll ScriptletURL resolves to the payload. Record the target
    GUID, because the next step is confirming a paired write that points that second CLSID at a DLL
    or scriptlet on disk. Details is present on roughly 79% of registry modifications and should be
    populated for this string GUID value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote the TreatAs value, and what launched that process?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to
    read its Image, full command, and parent lineage. A reg.exe, powershell.exe, rundll32.exe, or
    cmd.exe write launched from an Office application, a browser, a script host such as wscript.exe
    or mshta.exe, or an unsigned binary points to the link being staged programmatically rather than
    a deliberate administrator or installer action. The parent chain distinguishes a scripted hijack
    from an interactive console edit.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Was a paired second-CLSID InprocServer32 or ScriptletURL write made on this host in the same window?
  context: >-
    A TreatAs link only executes a payload if the redirected second CLSID has an InprocServer32
    default (or a scrobj.dll ScriptletURL) pointing at a DLL or scriptlet, and that paired write
    usually lands in the same session as the TreatAs write. Clustering the registry modifications on
    this host in a short window around the alert surfaces that second-CLSID setup along with any
    other Classes hijacks, Run keys, or policy edits made together. The triggering key appears in the
    results; the signal is what else was modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Did the writing process or its children drop a DLL or scriptlet to disk for the redirected CLSID to load?
  context: >-
    The link is only effective if the payload referenced by the second CLSID's InprocServer32 exists
    on disk. Correlating file activity by the registry-writing process and its children reveals
    whether a DLL or a scrobj.dll scriptlet was written in the same session, which confirms the
    hijack is armed and identifies what will execute when the class is instantiated. File-write
    events carry no hash; if a payload is present, hash it from a later execution or retrieve it for
    a reputation lookup. Distinguishing a rare-but-legitimate COM DLL from a suspicious one is an
    environment-specific judgment based on the path and signer.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: After this key change, did a COM invoker binary load an unusual or unsigned DLL on this host?
  context: >-
    Once the TreatAs link is in place, any instantiation of the hijacked class loads the redirected
    payload, and COM host binaries such as rundll32.exe, xwizard.exe, verclsid.exe, and mmc.exe are
    common ways that instantiation is triggered because they resolve and load a CLSID's server DLL.
    Listing DLL loads by these invokers after the write, with the loaded module's path and signature,
    shows whether a payload DLL was actually loaded and whether it is unsigned or signed by an
    unexpected party. The correlation window between the registry write and the load is
    environment-dependent, since persistence can fire the load on any later instantiation.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_com_invoker:
        Image|endswith:
          - '\rundll32.exe'
          - '\xwizard.exe'
          - '\verclsid.exe'
          - '\mmc.exe'
      condition: selection and selection_com_invoker
    fields:
      - Image
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
- question: After this write, was the hijacked CLSID instantiated through a COM invoker process?
  context: >-
    The link takes effect when the original class is instantiated, which frequently happens through a
    signed host binary run with COM arguments - for example verclsid.exe with /S /C and a CLSID,
    rundll32.exe invoking a control panel or shell function, or mmc.exe run with -Embedding to
    suppress its window. Finding one of these invocations after the write ties the registry edit to
    an execution attempt and confirms the redirect was exercised rather than merely staged.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_invoker:
        Image|endswith:
          - '\verclsid.exe'
          - '\rundll32.exe'
          - '\xwizard.exe'
          - '\mmc.exe'
      condition: selection and selection_invoker
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Is this TreatAs key still redirecting, or was the value changed again after the alert?
  context: >-
    Registry key or value deletions are not observable in this telemetry, so durability is judged
    from the key's re-modification history rather than from a delete event. A history with no later
    write leaves the link primed to run the payload the next time the class is instantiated, while a
    later write to the same key may indicate the target CLSID was changed or the link was pointed
    back at a benign value to hide it. Compare the Details values written to this key over the
    following window to see whether the redirect is still active.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Has this TreatAs key been modified before on this host?
  context: >-
    A per-user CLSID TreatAs link should change rarely and only through deliberate action, so a
    history with no prior writes makes this a first-time change and raises its weight. A history of
    periodic writes to the same key points instead to a compatibility shim or a repeatedly run
    management tool. Compare the historical Details values to see whether the same redirect target
    was set before or whether this link is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same TreatAs key modified on other hosts in the environment?
  context: >-
    The same redirect written across many hosts suggests a broad tool run or a mis-scoped
    deployment; the same write confined to one host suggests a targeted hijack. Compare the Details
    values across hosts to see whether they all redirect to the same second CLSID and whether the
    writing process is consistent, which separates a single hands-on operation from repeated use of
    the same technique across the environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A COM link hijack rarely happens in isolation. Aggregating process activity in a tight window
    around the alert surfaces what led up to the registry write and what ran immediately after it.
    Novel parent-child pairs stand out at low counts against high-count routine telemetry, which is
    what points to the tool that staged the hijack and any follow-on actions taken once the redirect
    was in place.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, execution of scripting tools, or defense
    tampering - may reveal the stages that preceded this change and help reconstruct the timeline. A
    COM hijack is typically established to gain persistence or privileged execution, so prior alerts
    help place this registry write within a larger sequence rather than treating it as an isolated
    event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Actors rarely rely on a single persistence mechanism. After establishing a COM link, they
    commonly install backup footholds using different techniques. Scheduled tasks, services,
    registry Run keys, BITS jobs, or WMI subscriptions created by schtasks.exe, sc.exe, reg.exe,
    bitsadmin.exe, or wmic.exe near the registry write indicate intentional stacking of persistence
    rather than an isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Does the user or an administrator recall making this COM class change?
  context: >-
    A TreatAs link under a user's Classes hive has no routine reason to be set, so direct
    confirmation from the account owner is a fast way to resolve the alert. If a developer, an
    installer, or a red-team operator set the value for a compatibility or testing reason, that
    closes it; if no one recalls the action, the account may be compromised or the change was made by
    automated tooling, and the investigation should continue into the writing process and any
    payload dropped for the redirected class.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
