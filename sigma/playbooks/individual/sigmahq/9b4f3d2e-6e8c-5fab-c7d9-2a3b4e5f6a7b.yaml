name: TanStack Supply-Chain Attack Execution Indicators - Windows
id: c8c373a1-d8f1-42b5-8b21-ca0c2cc9856e
description: |
  Detects a JavaScript runtime (bun.exe) executing a script named tanstack_runner.js with the "run" argument, the process
  signature of a supply-chain-poisoned dependency payload delivered through a compromised npm or PyPI package. bun.exe is
  a general-purpose runtime commonly used by developers and CI systems, so its presence alone is not abnormal; this specific
  command-line pattern is what distinguishes the payload invocation. The behavior this pattern is associated with includes
  self-daemonizing execution, credential and cloud-token harvesting, self-copy persistence into developer-tooling
  configuration directories, and exfiltration or self-propagation over an outbound channel. Investigation should confirm
  what installed or triggered the runtime, whether the invoked script and any related dropped files are still on disk,
  and what follow-on process and network activity occurred.
type: detection
detection_id: 9b4f3d2e-6e8c-5fab-c7d9-2a3b4e5f6a7b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the command line show bun.exe running with "run" and "tanstack_runner.js" together, matching this rule's
    detection?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when the process
    image ends in bun.exe and the command line contains both "run" and "tanstack_runner.js". Read the full command line
    and process identity from the triggering event and verify both conditions are actually present.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to run bun.exe (a JavaScript/TypeScript runtime) to execute project or build
    scripts?
  context: bun is routinely invoked by developers, build pipelines, and CI runners, so the presence of the binary alone is
    not diagnostic. Knowing whether this user role and host function normally involve running project dependencies, and
    whether the execution time fits this user's usual working hours, helps separate routine development activity from an
    unexpected invocation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What process spawned bun.exe, and is that parent chain expected for a dependency install or script run?
  context: The parent process shows how the runtime was invoked -- a package manager, a shell, an editor or agent tooling
    process, or a CI job runner all read differently. A parent that is not part of the normal developer or build toolchain
    for this host is the deviation worth chasing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Does the invoked script contain obfuscated logic, such as large dispatch tables or layered decode routines,
    and what does that logic do?
  context: The command line itself carries little beyond the script name, so the operational payload lives inside the
    invoked file. Heavily obfuscated dispatcher patterns and multi-layer decode routines are used to hide credential
    harvesting, environment fingerprinting, and outbound communication logic from casual inspection or simple string
    searches. Pair this with the file-artifact question to retrieve and review the script content directly.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: When and where was tanstack_runner.js written to disk, and is a related router_init.js payload also present?
  context: This pattern's invoking script name and the payload file actually dropped to disk do not always match, so
    check for both filenames when tracing the delivery path. The write location -- a project dependency directory versus
    a temp or profile staging path -- and the process that created the file indicate whether this arrived through a normal
    package install or was staged separately.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
        - tanstack_runner.js
        - router_init.js
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Are tanstack_runner.js and any related router_init.js payload still present on disk for hash and content
    analysis?
  context: If the invoked script or its dropped dependencies are still present, they can be hashed, matched against known
    indicators, and reviewed directly for the obfuscated logic identified in the decode step. If the files have already
    been deleted, treat that as a sign of cleanup rather than evidence nothing happened.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Were self-copy files created in developer-tooling configuration directories such as .claude or .vscode as
    part of this execution?
  context: Dropping copies of the payload into editor and agent configuration directories lets it re-run automatically
    the next time that tool is used or the project folder is opened -- a persistence path independent of typical autorun
    or registry mechanisms. Finding these files corroborates that the runtime execution was the payload rather than a
    routine dependency run.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
        - '\.claude\router_runtime.js'
        - '\.claude\settings.json'
        - '\.claude\setup.mjs'
        - '\.vscode\setup.mjs'
        - '\.vscode\tasks.json'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What child processes did bun.exe spawn afterward?
  context: A tool that only performs a dependency install typically has no further children. Spawned shells, credential
    or secrets-access utilities, or archiving tools shortly after execution point to active harvesting or staging rather
    than a routine build step.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did bun.exe processes on this host make outbound network connections following execution, and to how many
    distinct destinations?
  context: The payload associated with this pattern re-forks itself in the background and reaches out over an outbound
    channel for credential and token exfiltration, including connections to filev2.getsession.org. Because the process
    detaches from its parent, the connection may occur after the visible triggering event; review destinations against
    known-bad infrastructure and correlate the timing with the child-process activity identified separately.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
- question: Did the same alert fire on other hosts, indicating broader exposure to the compromised dependency?
  context: A compromised package published to a shared registry is typically pulled by every developer or build system
    that depends on it, not just one host. Correlating this rule across the environment reveals how many systems installed
    the same dependency and need remediation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Have other hosts run this exact bun.exe/tanstack_runner.js pattern in the past week, and does the cross-host
    distribution look like a widespread dependency compromise or an isolated occurrence?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of
    this specific pattern rather than generic bun.exe usage. Many hosts matching the same pattern points to a shared
    poisoned dependency pulled broadly across the environment; one host or a small unrelated set points to a more isolated
    occurrence.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \bun.exe
        CommandLine|contains|all:
        - run
        - tanstack_runner.js
      condition: selection
    fields:
    - host.name
- question: When this host has previously run this exact bun.exe/tanstack_runner.js pattern, what parents and users
    normally drove it, and does the current alert fit that pattern?
  context: The query mirrors the rule's selection structure scoped to this host -- the resulting parent and user
    distribution reflects how this specific pattern has historically run here, not generic bun.exe usage. A new parent
    process, an unexpected user account, or a break from the established pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \bun.exe
        CommandLine|contains|all:
        - run
        - tanstack_runner.js
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- always_include: true
  question: Has this user previously produced this bun.exe/tanstack_runner.js pattern, and does that history fit their
    role?
  context: The query mirrors the rule's selection structure scoped to this user -- the result is the user's 90-day history
    of this specific pattern, aggregated by host. A user who has never produced this pattern is more suspicious than one
    who does so regularly as part of routine development work; weigh the count against the user's role and typical
    toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \bun.exe
        CommandLine|contains|all:
        - run
        - tanstack_runner.js
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this parent process historically driven this pattern on this host or across the environment, or is the
    parent new for this activity?
  context: When the alert fires under a service or automation account, user identity does not attribute behavior. The
    meaningful pivot is the launch mechanism -- the query mirrors the rule's selection structure scoped to the alerting
    parent process, so the result is the 90-day history of this parent driving this specific pattern. A new or rare
    parent for this pattern is the deviation worth chasing; a parent that already accounts for many prior events is
    routine build or CI automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \bun.exe
        CommandLine|contains|all:
        - run
        - tanstack_runner.js
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the runtime invocation is isolated or part of
    broader hands-on activity across multiple endpoints. The same user producing similar activity on several hosts widens
    the potential exposure.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same parent-driven pattern fire on other hosts in the same window -- is this a coordinated rollout,
    or is the activity isolated to this host?
  context: Under a service or automation account, "what else did this user do" returns unbounded agent and automation
    noise. The meaningful question is whether the same launch mechanism fired elsewhere -- the query mirrors the rule's
    selection structure scoped to the alerting parent process, fleet-wide, in the alert window. Multiple hosts in the
    same window points to a scheduled or pushed job pulling the same dependency; a single host points to a host-local
    trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \bun.exe
        CommandLine|contains|all:
        - run
        - tanstack_runner.js
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led to this execution and
    what followed -- reconnaissance, additional dependency installs, or credential-access tooling that provides broader
    context for the investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- defense tampering, reconnaissance, credential access -- may reveal
    attack stages that preceded this event and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
