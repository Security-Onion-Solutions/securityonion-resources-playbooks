name: Windows Terminal Profile Settings Modification By Uncommon Process
id: ab56a491-0b66-4a48-8918-2fce3f338d2e
description: |
  Detects creation or modification of the Windows Terminal profile configuration file settings.json
  (under AppData\Local\Packages\Microsoft.WindowsTerminal_8wekyb3d8bbwe\LocalState) by one of six
  script-host or command-shell binaries: cmd.exe, cscript.exe, mshta.exe, powershell.exe, pwsh.exe,
  or wscript.exe. Windows Terminal reads this file at launch, so an actor can gain logon persistence by
  adding a custom profile whose commandline runs a payload, pointing defaultProfile at that profile, and
  setting startOnUserLogin to true, so the payload executes whenever the user opens the terminal or logs
  on. Legitimate edits are usually made through the terminal UI or an installer rather than through these
  interpreters, so investigate which process wrote the file and what launched it, decode the profile or
  payload that was added, determine whether the terminal subsequently executed it, and confirm whether the
  change was expected.
type: detection
detection_id: 9b64de98-9db3-4033-bd7a-f51430105f00
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Was the Windows Terminal settings.json modified by one of the uncommon script-host processes this rule flags?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires only when
    BOTH conditions hold: the writing process Image ends in cmd.exe, cscript.exe, mshta.exe, powershell.exe,
    pwsh.exe, or wscript.exe, AND the written file is the Windows Terminal settings.json under
    AppData\Local\Packages\Microsoft.WindowsTerminal_8wekyb3d8bbwe\LocalState. Review the exact TargetFilename
    and the responsible Image on the triggering event to confirm one of these interpreters wrote that file
    rather than the terminal UI or an installer.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify the Windows Terminal profile configuration?
  context: >-
    Users normally change Windows Terminal profiles through the application's settings UI, which writes the
    file itself, not through a command shell or script host. A cmd.exe, powershell.exe, or wscript.exe write
    to settings.json is the preparatory step of a logon-persistence hijack, so knowing whether the writing
    account and host role match any sanctioned automation is the fastest way to separate a developer or
    admin script from an implant. User attribution is present on roughly 94% of endpoint file events; when it
    is a machine account or missing, judge by the writing process and host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What process wrote the settings.json, what command did it run, and what launched it?
  context: >-
    The file event carries no command line, so pivot by ProcessGuid to the writing process to read its Image,
    full command, and parent. This shows exactly how the file was edited, for example a PowerShell
    Set-Content or Invoke-WebRequest -OutFile, or a cmd.exe redirect, and reveals any encoded payload in the
    command. A write launched from an Office application, a browser, another script host, or an unsigned
    binary points to programmatic staging rather than a deliberate administrator edit; the parent chain
    distinguishes a scripted hijack from an interactive console action.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What profile or payload was added to the Windows Terminal settings.json?
  context: >-
    The file content is not carried in telemetry, so retrieve settings.json from the endpoint and read it.
    The persistence method adds a custom profile whose commandline runs a payload (commonly powershell.exe or
    cmd.exe with an inline or encoded command, or a path to a dropped binary), changes defaultProfile to that
    profile's GUID, and sets startOnUserLogin to true. Confirm which of these edits are present and decode any
    command or file path in the added profile; a referenced path becomes a lead for a payload on disk, while
    an inline interpreter command is fileless.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If the writing process was PowerShell, did script block logging capture the script that modified settings.json?
  context: >-
    Windows Event ID 4104 records the deobfuscated script content PowerShell actually executes, even when the
    command line is encoded or obfuscated. If the writer was powershell.exe or pwsh.exe, these events show
    exactly how settings.json was edited and what profile or payload was inserted, providing ground truth that
    bypasses command-line obfuscation. If PowerShell operational logs are not ingested in this environment,
    treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: After this change, did Windows Terminal launch a child process consistent with the modified profile's payload?
  context: >-
    Login-item persistence executes when the user next opens Windows Terminal or logs on with startOnUserLogin
    set, at which point the terminal host process spawns the default profile's commandline. Because a hijacked
    defaultProfile makes every terminal launch run the planted command as the shell, listing children of the
    terminal binary and examining each command reveals whether the payload is running. A child that is not the
    user's normal shell, or a shell running an unexpected command, is the persistence firing; if no interactive
    logon occurred in the window, the payload has not run yet.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith:
          - '\WindowsTerminal.exe'
          - '\wt.exe'
          - '\OpenConsole.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: Was the settings.json reverted, modified again, or left changed after the alert?
  context: >-
    The file's post-alert lifecycle drives next steps. A quick revert to a clean profile after the payload runs
    is anti-forensic cleanup, while the file staying modified leaves persistence primed to fire at the next
    logon or terminal launch. The query returns every operation on this path for the following window so the
    operation type and responsible process for each change are visible; a later write that restores the original
    profile, or a further edit, tells you whether the hijack is still active.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to the Windows Terminal LocalState directory recently, and by which processes?
  context: >-
    The LocalState folder holds settings.json and Windows Terminal's related state. Other recent writes there,
    especially by command shells or script hosts, reveal whether this is an isolated edit or repeated tampering,
    and surface companion files such as a dropped payload or a staged profile fragment. The aggregation groups
    by path and writing process; a single unfamiliar writer across several files in this directory is the
    signal.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\Microsoft.WindowsTerminal_8wekyb3d8bbwe\LocalState\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has this settings.json been modified before on this host?
  context: >-
    A configuration file that changes rarely and only through deliberate action is more suspicious when a
    script host writes it than one that is edited routinely. A history with no prior writes by these
    interpreters makes this a first-time change and raises its weight; a history of periodic writes to the same
    file points instead to a management process or a user's own tooling. Compare the writing processes over the
    window to judge which case this is.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: >-
    Attackers rarely rely on a single persistence mechanism. After establishing one foothold through the
    terminal-profile hijack, they commonly install backup mechanisms using different techniques, such as
    scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions created by schtasks.exe,
    sc.exe, reg.exe, bitsadmin.exe, or wmic.exe. Multiple persistence installations in the same timeframe
    indicate intentional stacking rather than an isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host around the same time?
  context: >-
    File-based persistence bypasses command-line detection entirely, and the terminal-profile hijack is itself
    one such file-based mechanism. Dropping an executable or script into a Startup folder or a path referenced
    by a registry Run key achieves persistence in parallel without invoking schtasks, sc, or reg. File writes to
    these locations near the settings.json edit indicate the actor established an additional foothold on disk.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- always_include: true
  question: Has this user previously produced this rule's activity, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, so the result is the user's 90-day history of
    this specific write (a script host editing the Windows Terminal settings.json), aggregated by host, rather
    than generic use of the interpreter. A user who has never produced this activity is more suspicious than one
    who does so regularly; weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith:
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell.exe
        - \pwsh.exe
        - \wscript.exe
        TargetFilename|endswith: \AppData\Local\Packages\Microsoft.WindowsTerminal_8wekyb3d8bbwe\LocalState\settings.json
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this write, or is the program new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute behavior; the meaningful
    pivot is the launch mechanism. The query mirrors the rule's selection scoped to the alerting program,
    so the result is the 90-day history of this program driving the settings.json write, aggregated by host. A new
    or rare program for this activity is the deviation worth chasing; a program that already accounts for many
    prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith:
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell.exe
        - \pwsh.exe
        - \wscript.exe
        TargetFilename|endswith: \AppData\Local\Packages\Microsoft.WindowsTerminal_8wekyb3d8bbwe\LocalState\settings.json
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the environment around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple
    endpoints. If the same user produced similar activity on several hosts in this window, the scope may be
    larger than one machine. When the alert fires as SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a computer
    account, this user pivot returns agent-telemetry noise; in that case the parent-driven companion question is
    the meaningful answer.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven write fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, asking what else the user did returns agent-telemetry noise because every host
    runs SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism fired
    elsewhere: the query mirrors the rule's selection scoped to the alerting program, fleet-wide, in the
    alert window. Multiple hosts in the same window point to scheduled or pushed automation; a single host points
    to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith:
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell.exe
        - \pwsh.exe
        - \wscript.exe
        TargetFilename|endswith: \AppData\Local\Packages\Microsoft.WindowsTerminal_8wekyb3d8bbwe\LocalState\settings.json
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity in a tight window around the alert surfaces
    what led up to the settings.json write and what ran immediately after it. Novel parent-child pairs stand out
    at low counts against high-count routine telemetry, which is what points to the tool that staged the hijack
    and any actions taken once persistence was in place.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host, such as reconnaissance, execution of scripting tools, or defense
    tampering, may reveal the stages that preceded this change and help reconstruct the timeline. Logon
    persistence is typically established to run privileged or repeated follow-on actions, so prior alerts help
    place this profile edit within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Does the user or an administrator recall making this Windows Terminal profile change?
  context: >-
    The terminal profile has little routine reason to be edited by a command shell or script host, so direct
    confirmation from the account owner is a fast way to resolve the alert. If a developer, a red-team operator,
    or an administrator testing an automation set the value, that closes it; if no one recalls the action, the
    account may be compromised or the change was made by automated tooling, and the investigation should continue
    into the writing process and any logon follow-on.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
