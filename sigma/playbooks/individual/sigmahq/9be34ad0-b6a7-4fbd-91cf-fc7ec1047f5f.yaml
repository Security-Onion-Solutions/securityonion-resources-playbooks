name: UNC2452 Process Creation Patterns
id: e2b154b3-70a7-40ba-b1e8-e7b470849297
description: |
  Fires when any one of five independent process-creation selections matches: either 7z.exe invoked
  with maximum-compression, recursive, password-protected archive flags (`a -mx9 -r0 -p`, or the
  volume-splitting `a -v500m -mx9 -r0 -p` form) on a command line that also names a .zip together
  with a .txt or a .log; or a wscript.exe parent running a .vbs script whose child command line calls
  rundll32.exe against a DLL under C:\Windows with an export name beginning `Tk_`; or a rundll32.exe
  parent whose own command line references a DLL under C:\Windows spawning a `cmd.exe /C` child; or a
  rundll32.exe parent spawning dllhost.exe with an empty command line.
  The archive selections correspond to staging collected data into split, password-protected volumes
  before exfiltration; the rundll32 selections correspond to a script-driven handover in which a DLL
  dropped into a plausible-looking Windows subdirectory is loaded by rundll32.exe and then used to run
  follow-on commands or to occupy a command-line-less child process. Only one branch fires per alert,
  so the investigation starts by identifying which pattern matched, then determines whether the archive
  was an operator-run backup or data staging, and whether the DLL loaded under C:\Windows is a genuine
  Windows component or an unsigned drop placed alongside a real file to blend in.
type: detection
detection_id: 9be34ad0-b6a7-4fbd-91cf-fc7ec1047f5f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Which of the rule's five branches fired, and does the alerting event genuinely match it?
  context: >-
    The rule fires when any one of five independent selections matches, so establish which branch
    produced this alert before going further: either 7z.exe archiving with `a -mx9 -r0 -p` or
    `a -v500m -mx9 -r0 -p` on a command line naming a .zip alongside a .txt or a .log; or a
    wscript.exe parent running a .vbs whose child command line calls rundll32.exe against a DLL
    under C:\Windows with an export beginning `Tk_`; or a rundll32.exe parent whose own command line
    names a DLL under C:\Windows spawning `cmd.exe /C`; or a rundll32.exe parent spawning dllhost.exe
    with an empty command line. The branch decides which downstream questions carry weight: the
    archive branch points the investigation at what was collected and where the .zip went, while the
    rundll32 branches point it at which DLL was loaded and what it was told to run.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to build password-protected archives or to run DLL exports
    through rundll32.exe?
  context: >-
    Backup operators, software packagers, and support staff legitimately run 7z.exe with compression
    and password flags, and installers legitimately call rundll32.exe against system DLLs. Knowing
    whether this account and this machine role routinely do either is often the fastest way to
    separate routine work from staging and loader activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this execution part of an authorized penetration test or red team engagement?
  context: >-
    Both branch families are standard offensive tradecraft that assessment teams reproduce: archiving
    collected files into split, password-protected volumes, and loading a custom DLL through
    rundll32.exe. An active engagement scoped to this host, with matching timing and command lines,
    resolves the alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: What specific operation does the alerting command line carry out?
  context: >-
    The branches represent different capabilities and different follow-up. For the 7z branches, read
    the archive name, the `-p` password, the `-v500m` split size, and the source paths to establish
    what was collected. For the wscript-to-rundll32 branch, read the DLL path under C:\Windows and the
    export name after the comma. For the rundll32-parent branches, the payload is either the `/C`
    command string handed to cmd.exe or an empty-command-line dllhost.exe used as an execution host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Is this parent expected to spawn this child, and what started the parent itself?
  context: >-
    Four of the five branches key on the parent: wscript.exe running a .vbs, or rundll32.exe holding a
    DLL under C:\Windows. Neither is a normal launcher for cmd.exe or for a command-line-less
    dllhost.exe, so tracing the grandparent shows whether the chain began with a user action, an
    installer, or something that dropped and triggered a script. When the archive branch fired, the
    parent instead tells you whether the 7z run came from an interactive shell, a scheduled job, or a
    backup product.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other child processes did the same parent instance spawn?
  context: >-
    A rundll32.exe or wscript.exe parent that produced the alerting child usually produced others. The
    sibling set is where discovery, credential access, and staging commands become visible as a group,
    and where an archive run and a loader run on the same host connect to a single parent instead of
    two unrelated events.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What files did the alerting process write to disk?
  context: >-
    Each branch leaves a characteristic artifact. The archive branches write the .zip (and the .001,
    .002 volume parts when `-v500m` is set) plus the .txt or .log inputs they consumed. The loader
    branches write or read a DLL under a Windows subdirectory, often named to sit alongside a real
    adjacent file so a directory listing looks unremarkable. Listing the process's file activity
    establishes what exists on disk to collect.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: Are the files referenced by this command line still on disk for analysis?
  context: >-
    The archive, its volume parts, and any DLL named on the command line are the collectable evidence
    here. Correlating file activity to the alerting process and its direct children shows whether those
    files were created, still exist, or were removed after use. Anything still present can be hashed,
    submitted for reputation checks, or opened in an isolated environment.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Is any part of the alerting command line encoded, obfuscated, or split across variables?
  context: >-
    None of the five branches require encoding, so the command line is normally readable and the task
    is parsing rather than decoding. Read the `-p` value as a literal password and keep it for opening
    the archive later; read the string after `.dll,` as the export the DLL was told to run; read the
    `/C` string as the command that actually executed. If the text is broken up with carets, quotes, or
    environment-variable substitution, resolve it before judging intent, because that concealment is
    itself part of the finding.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Which DLLs outside the normal system directories did rundll32.exe load on this host around
    the alert, and are they signed?
  context: >-
    The rundll32 branches depend on a DLL that lives under C:\Windows but outside System32, SysWOW64,
    and WinSxS, placed in a subdirectory whose name reads as a genuine Windows component. The load
    event carries the full path, the signing state, and the file hash, so it answers directly what the
    process-creation event only implies. An unsigned or invalidly signed DLL loaded from a Windows
    subdirectory that does not normally host loadable modules is the artifact to collect and hash. If
    module-load telemetry is not collected on this host, treat an empty result as a visibility gap
    rather than evidence that no DLL was loaded.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\rundll32.exe'
        ImageLoaded|startswith: 'C:\Windows\'
      filter_system:
        ImageLoaded|startswith:
          - 'C:\Windows\System32\'
          - 'C:\Windows\SysWOW64\'
          - 'C:\Windows\WinSxS\'
      condition: selection and not filter_system
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: Did PowerShell script block logging capture related script content on this host in the same
    window?
  context: >-
    The alerting command line is not PowerShell, but PowerShell is a common way to reach both branch
    families - driving a remote process create that produces a rundll32 loader child, or scripting the
    collection that a 7z run then archives. Event ID 4104 records deobfuscated script content, so
    script-block events in the same window show whether a scripted stage drove or followed this
    activity. If PowerShell operational logs are not ingested in this environment, an empty result is a
    visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
  answer_sources:
  - powershell_script_block
- question: Were PowerShell security controls bypassed or weakened on this host before this execution?
  context: >-
    Execution-policy bypass, AMSI patching, real-time monitoring changes, and version-2 downgrade
    invocations are the usual precursors to running an unsigned payload, and they are frequently
    combined with an interpreter stage that precedes archiving or DLL loading. Finding one of these in
    the hour before the alert places this event inside a longer sequence rather than on its own.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: How often has this parent binary spawned this child binary on this host over the last 90
    days?
  context: >-
    This counts the parent-child pairing itself rather than the rule's full pattern, which is what
    tells you whether the pairing is novel on this machine. rundll32.exe spawning dllhost.exe or
    cmd.exe, and wscript.exe spawning rundll32.exe, are pairings most endpoints produce rarely or never
    outside of installer activity. A count in the thousands points at packaged software or a management
    agent; zero or a handful means this pairing is new here and the alerting instance is the thing to
    explain.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's five selections scoped to this user, so the result is the user's
    90-day history of this specific firing pattern rather than generic use of 7z.exe or rundll32.exe,
    aggregated by host. A backup or packaging account with a long history of password-protected
    archiving reads differently from an account that has never produced any of these branches before.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_generic_1:
        CommandLine|contains:
        - 7z.exe a -v500m -mx9 -r0 -p
        - 7z.exe a -mx9 -r0 -p
        CommandLine|contains|all:
        - .zip
        - .txt
      selection_generic_2:
        CommandLine|contains:
        - 7z.exe a -v500m -mx9 -r0 -p
        - 7z.exe a -mx9 -r0 -p
        CommandLine|contains|all:
        - .zip
        - .log
      selection_generic_3:
        ParentCommandLine|contains|all:
        - wscript.exe
        - .vbs
        CommandLine|contains|all:
        - rundll32.exe
        - C:\Windows
        - .dll,Tk_
      selection_generic_4:
        ParentImage|endswith: \rundll32.exe
        ParentCommandLine|contains|all:
        - C:\Windows
        - .dll
        CommandLine|contains: 'cmd.exe /C '
      selection_generic_5:
        ParentImage|endswith: \rundll32.exe
        Image|endswith: \dllhost.exe
        CommandLine: ''
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_generic_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Has this parent process historically driven the rule's pattern here, or is the parent new
    for this activity?
  context: >-
    When the alert fires under SYSTEM, a service account, or a computer account, user identity
    attributes nothing and the launch mechanism is the meaningful pivot. The query mirrors the rule's
    five selections scoped to the alerting parent, so the result is the 90-day history of this parent
    driving this pattern rather than generic parent-and-binary co-occurrence. A parent that already
    accounts for thousands of prior events is packaged software or OS automation; a parent that is new
    or rare for this pattern is the deviation to chase.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_generic_1:
        CommandLine|contains:
        - 7z.exe a -v500m -mx9 -r0 -p
        - 7z.exe a -mx9 -r0 -p
        CommandLine|contains|all:
        - .zip
        - .txt
      selection_generic_2:
        CommandLine|contains:
        - 7z.exe a -v500m -mx9 -r0 -p
        - 7z.exe a -mx9 -r0 -p
        CommandLine|contains|all:
        - .zip
        - .log
      selection_generic_3:
        ParentCommandLine|contains|all:
        - wscript.exe
        - .vbs
        CommandLine|contains|all:
        - rundll32.exe
        - C:\Windows
        - .dll,Tk_
      selection_generic_4:
        ParentImage|endswith: \rundll32.exe
        ParentCommandLine|contains|all:
        - C:\Windows
        - .dll
        CommandLine|contains: 'cmd.exe /C '
      selection_generic_5:
        ParentImage|endswith: \rundll32.exe
        Image|endswith: \dllhost.exe
        CommandLine: ''
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_generic_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What else did this user do across the environment around the time of the alert?
  context: >-
    Tracking the account's activity on every host in the alert window shows whether this is confined to
    one machine or part of movement across several. Collection and loader stages are usually preceded
    or followed by discovery and remote-execution commands under the same account. If the alert fired
    under a service principal, expect this to return routine agent activity across the fleet and rely
    on the parent-scoped fleet question instead.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did this same parent-driven pattern fire on other hosts in the same window, or is it
    confined to this host?
  context: >-
    Under a service principal, asking what else the user did returns agent telemetry from every
    machine. The useful question is whether the launch mechanism fired elsewhere: the query mirrors the
    rule's five selections scoped to the alerting parent, fleet-wide, in the alert window. Several
    hosts in the same window points at scheduled or pushed automation; a single host points at a
    host-local trigger, which for the loader branches is the more concerning of the two.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_generic_1:
        CommandLine|contains:
        - 7z.exe a -v500m -mx9 -r0 -p
        - 7z.exe a -mx9 -r0 -p
        CommandLine|contains|all:
        - .zip
        - .txt
      selection_generic_2:
        CommandLine|contains:
        - 7z.exe a -v500m -mx9 -r0 -p
        - 7z.exe a -mx9 -r0 -p
        CommandLine|contains|all:
        - .zip
        - .log
      selection_generic_3:
        ParentCommandLine|contains|all:
        - wscript.exe
        - .vbs
        CommandLine|contains|all:
        - rundll32.exe
        - C:\Windows
        - .dll,Tk_
      selection_generic_4:
        ParentImage|endswith: \rundll32.exe
        ParentCommandLine|contains|all:
        - C:\Windows
        - .dll
        CommandLine|contains: 'cmd.exe /C '
      selection_generic_5:
        ParentImage|endswith: \rundll32.exe
        Image|endswith: \dllhost.exe
        CommandLine: ''
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_generic_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Collection and loader stages sit in the middle of a longer sequence, not at its start. Earlier
    detections on the same host covering event-log or firewall tampering, service manipulation,
    directory enumeration, or credential access indicate which stages preceded this one and help
    reconstruct the timeline the response needs.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
