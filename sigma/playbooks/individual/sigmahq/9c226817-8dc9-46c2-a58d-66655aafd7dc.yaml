name: Modify User Shell Folders Startup Value
id: de8f9f08-5902-4fff-b9c3-36e2ef6c0175
description: |
  Detects a registry write that sets the Startup or Common Startup value under
  HKCU/HKLM ...\CurrentVersion\Explorer\User Shell Folders (or the legacy Shell Folders key) to a
  folder other than the default per-user or all-users startup directory. The rule fires when the
  TargetObject is one of those keys AND the value name ends in \Startup or \Common Startup AND the
  written Details path is populated and does not resolve to the standard
  %USERPROFILE%\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup or
  C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup location. Windows reads these values
  to decide where it looks for startup items, so redirecting them to an attacker-controlled folder
  makes the system auto-run whatever is placed there at every logon or reboot, without any Run key or
  scheduled task. Legitimate changes to these values are rare. Investigate what folder path was
  written, which process wrote it and what launched that process, whether a payload was placed in the
  redirected folder and executed, whether other persistence was installed alongside it, and whether
  the value was reverted afterward.
type: detection
detection_id: 9c226817-8dc9-46c2-a58d-66655aafd7dc
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting write set the Startup or Common Startup value under User Shell Folders to a non-default folder?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a
    value under ...\Explorer\User Shell Folders or ...\Explorer\Shell Folders whose name ends in
    \Startup or \Common Startup is written AND the value data is populated AND it does not point to the
    standard per-user (%USERPROFILE%\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup) or
    all-users (C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup) startup folder. Review the
    exact TargetObject and Details on the triggering event to confirm the value redirects the startup
    location to a non-standard folder rather than restoring or matching the default.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify the User Shell Folders startup values?
  context: >-
    The Startup and Common Startup values under User Shell Folders point at the default startup
    directories and effectively never change through normal use. A user account or process rewriting
    these values to a different folder is the setup step of startup-folder-redirection persistence, so
    knowing whether the writing account and host function match any sanctioned change is the fastest
    way to separate testing or administrative work from a live persistence attempt. User attribution is
    present on roughly 94% of endpoint registry events; when it is a machine account or SYSTEM, pivot on
    the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which User Shell Folders value was written, and why is this key a persistence location?
  context: >-
    The User Shell Folders (and legacy Shell Folders) keys under
    ...\CurrentVersion\Explorer hold the paths Windows uses to locate special folders, including where
    it looks for startup items. Setting the Startup or Common Startup value here relocates the effective
    startup folder, so any executable, script, or shortcut in the new folder runs automatically at the
    next logon or reboot. Confirming the exact value name and writing process establishes that this is a
    startup-folder redirect rather than an unrelated shell-folder edit, and sets up decoding the folder
    path that was written.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What folder path was written to the Startup value, and where does it point?
  context: >-
    The Details field holds the folder Windows will treat as the startup location. Read it: a redirect
    to a user-writable or unusual directory (AppData, ProgramData subfolders, Temp, Public, a profile
    Downloads folder, or any path outside the standard Start Menu\Programs\Startup tree) is the signal,
    because whatever sits in that folder executes at logon. The written path becomes a lead for
    confirming a dropped payload on disk. Details is present on roughly 79% of registry modifications
    and should be populated for this string value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote this value, and what launched that process?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to read
    its Image, full command, and parent. A reg.exe, powershell.exe, or cmd.exe write launched from an
    Office application, a browser, a script host such as wscript.exe or mshta.exe, or an unsigned binary
    points to the redirect being staged programmatically rather than a deliberate administrator action.
    The parent chain distinguishes a scripted persistence step from an interactive console change.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Did any process execute from the redirected startup folder after this change?
  context: >-
    Startup-folder redirection is only effective if something in the new folder runs at logon. The query
    anchors on the folder path read from the written value, so rows are process executions whose Image
    resides under the redirected directory. A process launching from that directory confirms the
    persistence is active and identifies the payload; no such execution yet means the mechanism is primed
    but has not fired, which still warrants removal. If the value was written in an environment-variable
    form (e.g. %USERPROFILE%\...), expand it and search the literal path manually — a zero is expected
    here in that case.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|contains|expand: '%Details%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Was an executable or script placed in the redirected startup folder, and does it survive reboot?
  context: >-
    The redirect only executes something if a payload exists in the folder the value now points to.
    Correlating file activity by the registry-writing process and its children surfaces files the same
    session wrote to that folder - typically an .exe, script, or shortcut that will run at the next logon.
    The file-write event carries no hash; if a payload is present, hash it from a later execution or
    retrieve it for a reputation lookup. Durability across reboot is a judgment call: point to the folder
    contents and the value's re-modification history rather than expecting a delete event.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: After this write, was the Startup value restored to the default folder or changed again?
  context: >-
    Registry key or value deletions are not observable in this telemetry, so durability is judged from the
    value's re-modification history rather than from a delete event. A later write that restores the value
    to the standard Start Menu\Programs\Startup path indicates the redirect was reverted, which can be
    cleanup after the payload ran or a legitimate correction; the value remaining pointed at the
    non-standard folder leaves the persistence primed to run again at the next logon. Compare the Details
    values written to this key over the following window.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Has this Startup value been modified before on this host?
  context: >-
    The User Shell Folders startup values should change rarely and only through deliberate action, so a
    history with no prior writes makes this a first-time change and raises its weight. A history of periodic
    writes to the same value points instead to a management process or a repeatedly run tool. Compare the
    historical Details values to see whether a non-standard folder was set before or whether this redirect
    is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same Startup value modified on other hosts in the environment?
  context: >-
    The same redirect across many hosts suggests a broad tool run, a mis-scoped deployment, or a group
    policy change; the same write confined to one host suggests targeted persistence. Compare the Details
    values across hosts to see whether they all point the startup location at the same folder and whether
    the writing process is consistent, which separates a single hands-on operation from repeated use of the
    same technique across the environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor who redirects the startup folder often makes other configuration changes in the same session -
    Run or RunOnce keys, service entries, Defender or firewall policy edits, or additional shell-folder
    changes. Clustering the registry writes on this host in a short window around the alert reveals the full
    scope of changes and which process made them. The triggering key appears in the results; the signal is
    what else was modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A persistence change rarely happens in isolation. Aggregating process activity in a tight window around
    the alert surfaces what led up to the startup redirect and what ran immediately after it. Novel
    parent-child pairs stand out at low counts against high-count routine telemetry, which is what points to
    the tool that staged the change and any follow-on actions taken in the same session.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, execution of scripting tools, credential access,
    or defense tampering - may reveal the stages that preceded this change and help reconstruct the
    timeline. Startup-folder persistence is usually established after initial access is already in hand, so
    prior alerts help place this redirect within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Attackers rarely rely on a single persistence mechanism. After redirecting the startup folder, they
    commonly install backup footholds using different techniques - scheduled tasks, services, registry Run
    keys, BITS jobs, or WMI subscriptions created by schtasks.exe, sc.exe, reg.exe, bitsadmin.exe, or
    wmic.exe. Multiple persistence installations in the same timeframe indicate intentional stacking rather
    than an isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely - dropping an executable or script into
    a Startup folder or a path referenced by a registry Run key achieves persistence without invoking
    schtasks, sc, or reg. This is the direct companion to a startup-folder redirect: the payload the redirect
    executes is a file placed in the standard or the redirected startup directory. File writes to these
    locations near the alert indicate the payload was staged on disk.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Does the user or an administrator recall making this startup-folder change?
  context: >-
    The User Shell Folders startup values have no routine reason to change, so direct confirmation from the
    account owner is a fast way to resolve the alert. If an administrator or a sanctioned deployment tool set
    the value, that closes it; if no one recalls the action, the account may be compromised or the change was
    made by automated tooling, and the investigation should continue into the writing process, the redirected
    folder contents, and any follow-on execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
