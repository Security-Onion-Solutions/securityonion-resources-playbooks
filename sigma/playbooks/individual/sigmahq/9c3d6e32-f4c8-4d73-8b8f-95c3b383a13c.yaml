name: DNS Query To Katz Stealer Domains
id: dde4399e-b1f1-4c72-b64e-0051a994e5cc
description: |
  Detects a DNS lookup for one of the domains associated with Katz Stealer command-and-control
  infrastructure (katz-panel.com, katz-stealer.com, katzstealer.com, twist2katz.com). The alert
  is a DNS query, not a connection, so it records the domain that was resolved and the process
  that requested it, but not a destination IP. Katz Stealer is an information stealer that
  collects credentials and host data and beacons to attacker-controlled domains over application
  layer protocols, so a query to one of these names points to an infected process attempting to
  reach its C2. Investigate which process made the lookup and whether it is a browser or an
  unexpected background binary, whether the domain resolved and the host then connected to the
  returned IP, what else the process queried or downloaded, and whether other hosts looked up the
  same domain.
type: detection
detection_id: 9c3d6e32-f4c8-4d73-8b8f-95c3b383a13c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the queried domain match one of the known Katz Stealer domains, and which process made the lookup?
  context: >-
    Confirm the alert before investing time. The rule fires when a DNS query name contains one of
    the known Katz Stealer C2 domains (katz-panel.com, katz-stealer.com, katzstealer.com,
    twist2katz.com). Review the exact QueryName on the triggering event and the process that
    issued it. The alert is a lookup, not a connection, so it carries the queried domain and the
    requesting process rather than a destination IP; note whether the query resolved to an
    address.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
- question: Is this host and the process that made the lookup expected to resolve external domains of this kind?
  context: >-
    A DNS lookup for a stealer C2 domain has no legitimate business reason, but knowing the normal
    role of the host and the requesting process is the fastest triage step. A browser resolving
    arbitrary names is routine; a background service binary, a script host, or an unsigned process
    resolving these names is not. If the requesting account is a machine account or SYSTEM, pivot
    on the process image rather than the user.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Did the domain resolve, to what address, and what is the reputation of that domain and IP?
  context: >-
    The alert is a lookup, so establish what it returned and how the infrastructure rates.
    Check whether the query resolved and to which address, and assess the domain and resolved IP
    against registration age, passive DNS history, and threat intelligence. These names are known
    Katz Stealer C2, so a resolution to live infrastructure indicates the host reached a working
    C2 endpoint rather than a sinkholed or dead domain. The resolved address is the pivot for
    confirming an actual connection.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
      - dns.resolved_ip
      - Image
- question: What is the process that made the query, and what is its full command line and working directory?
  context: >-
    A DNS event carries no command line, so pivot by process identity to the process_creation
    record for the requesting process. Read its image path, full command line, and working
    directory to judge whether it is a legitimate browser or a non-standard executable making C2
    lookups. A process running from a user-writable or temporary path, a masqueraded system name,
    or an interpreter launched with an inline or encoded payload points to malware rather than
    normal name resolution. Non-browser, non-system processes making external DNS queries are the
    higher-weight signal here.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: What process launched the process that made this query, and is that parent chain expected?
  context: >-
    The parent lineage reveals how the requesting process was started. A browser launched from
    explorer.exe is routine; a script host such as wscript.exe or mshta.exe, an Office
    application, or an unsigned loader spawning the process points to the lookup being part of a
    malware execution chain. Walking up to the parent's own record shows what invoked it and what
    else that parent spawned.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: After the lookup, did this host connect to the address the domain resolved to?
  context: >-
    A DNS query only proves the host tried to resolve the name; the C2 channel is established only
    if it then connected to the returned address. Pivot to network activity for connections from
    this host to the resolved IP within the window after the lookup. A connection confirms an
    active C2 session and gives the destination port and the connecting process; no connection may
    mean the resolution failed, the address was blocked, or the beacon is pending. Sustained or
    repeated outbound flow to that address, especially with asymmetric outbound volume, indicates
    data staging or exfiltration rather than a single check-in.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dns_resolved_ip%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
- question: What other domains did the requesting process look up, and do any resolve to the same infrastructure?
  context: >-
    A single C2 lookup is often one of several. List the other domains the same process resolved
    in the surrounding window and whether any share the resolved infrastructure. Multiple
    attacker-controlled names from one process, or several names resolving to the same address,
    reveal fallback C2, staged delivery, or a broader beaconing pattern beyond the one domain that
    fired.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - QueryName
      - dns.resolved_ip
- question: Is the requesting process also making high-frequency or long, encoded-subdomain DNS queries consistent with tunneling?
  context: >-
    Application-layer C2 over DNS often carries data in the query itself: long subdomains encoding
    base32 or base64 payloads, and a high rate of lookups in a short interval per process. Count
    the queries this process issued over the window and inspect the query names for abnormal
    length and encoded-looking labels. A burst of algorithmically varied or long-subdomain lookups
    from one process is a DNS-tunneling signal that would carry stolen data out even when the
    resolved IP is never contacted directly. A low, human-paced volume of ordinary-length names
    argues against tunneling.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - QueryName
- question: Has this host queried this domain before, or is this the first lookup?
  context: >-
    A first-time lookup for a domain is more suspicious than a routine, recurring one. A history
    with no prior queries for this name on this host makes the event a new resolution and raises
    its weight; a long history of periodic lookups would instead suggest a persistent infection or
    an established pattern worth dating back to its first occurrence.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: Does this host normally run the process that made the query?
  context: >-
    A process image that has rarely or never run on this host before is more suspicious than one
    that executes routinely. Zero or very low historical counts for the requesting binary point to
    a newly introduced or masqueraded executable rather than an established application making
    ordinary lookups.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: What files or payloads did the requesting process write on this host?
  context: >-
    A process reaching C2 frequently also drops or stages files: additional stealer components,
    collected data bundled for exfiltration, or a follow-on payload. List file creations by the
    same process on this host to see whether the C2 contact was paired with staging on disk.
    Multiple distinct files point to staged delivery or data collection rather than an isolated
    lookup.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
- question: Did other hosts in the environment query this same domain?
  context: >-
    The spread of the lookup informs the response. A single host resolving the domain suggests a
    contained infection; many hosts resolving the same name suggests a shared lure, a common
    dropper, or wider compromise. Compare the querying process across hosts to see whether the
    same binary is responsible everywhere.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - host.name
      - Image
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A C2 lookup rarely happens in isolation. Aggregating process activity in a tight window around
    the alert surfaces what ran before the query and what followed it. Novel parent-child pairs
    stand out at low counts against high-count routine telemetry, which points to the process that
    staged the infection and any actions taken after C2 contact.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - execution of scripting tools, credential access, or
    defense tampering - may reveal the stages that preceded the C2 lookup and help reconstruct the
    timeline. A stealer reaching out to C2 is typically the tail of an execution and collection
    sequence, so prior alerts help place this query within a larger operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
