name: Suspicious Run Key from Download
id: acea881c-0550-4b51-bba8-fe5f18e8a965
description: |
  Detects a registry write that adds an autostart value under a CurrentVersion\Run,
  WOW6432Node\Run, or Policies\Explorer\Run key AND is made by a process whose Image path
  lives in a download or email-attachment staging directory (a browser Downloads folder, an
  Outlook attachment cache, or a Temporary Internet Files location). Both conditions must hold
  for the rule to fire. This is the download-to-persistence pattern: a file that arrived by
  download or email attachment executes and immediately registers itself to run at logon, so
  the payload survives reboots without further user action. The legitimate version is a
  freshly downloaded installer that adds a startup entry; the malicious version is a dropped
  or attachment-delivered payload establishing autostart persistence. Investigate what
  executable path or command the Run value points at, which process wrote it and what launched
  that process, whether the referenced payload landed on disk, whether other persistence or
  registry changes accompanied it, and whether the value stayed in place.
type: detection
detection_id: 9c5037d1-c568-49b3-88c7-9846a5bdc2be
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alert show a Run-key value written by a process running from a download or attachment directory?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires
    only when both halves of its selection match together: the TargetObject is a value under a
    CurrentVersion\Run, WOW6432Node\Run, or Policies\Explorer\Run key, AND the writing process
    Image sits in a download or email-attachment staging path (Downloads, the Outlook attachment
    cache, or Temporary Internet Files). Review the exact TargetObject and writing Image on the
    triggering event to confirm both conditions hold; a Run-key write from an installed
    application directory would not match, and neither would a download-directory process
    touching an unrelated key.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Image
      - TargetObject
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to have a downloaded or attachment-launched process register a startup entry?
  context: >-
    Legitimate downloaded installers do sometimes add Run keys, so knowing whether this user
    role and host function routinely install software from downloads is often the fastest way to
    separate a sanctioned install from a dropped payload establishing persistence. User
    attribution is present on roughly 94% of endpoint registry events; when it is a machine
    account or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Does the user recall downloading, opening, or installing something that would add a startup entry?
  context: >-
    Direct confirmation from the account owner is often the quickest way to resolve the alert. If
    the user recalls running a downloaded installer or opening an emailed attachment that set up
    software, that context can close the alert; if no one recalls the action, the account may be
    compromised or the write came from automated malware, and the investigation should continue
    into the writing process and the value it registered.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which Run key was written, and why is this a known autostart persistence location?
  context: >-
    The CurrentVersion\Run, WOW6432Node\Run, and Policies\Explorer\Run keys each run their listed
    values automatically at user logon, which is why they are among the most common persistence
    locations. Confirming the exact key path and the writing process establishes that this is a
    true autostart entry rather than an unrelated registry edit, and identifies which of the
    startup keys was chosen, since the WOW6432Node and Policies variants are used less often by
    routine software.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What executable path or command was written into the Run key value?
  context: >-
    The value data written to a Run key is the command or binary path that executes at logon.
    Decode it: a path back into the same download or attachment directory, a copy relocated to
    AppData, ProgramData, or Temp, or an inline interpreter command (powershell.exe or cmd.exe
    with an encoded or scripted payload) each point to a dropped payload wiring itself for
    autostart. If it references a file path, that path becomes the lead for confirming a payload
    on disk. Value data is present on roughly 79% of registry modifications and should be
    populated for this string value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote this Run key, where did it run from, and what launched it?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to
    read its Image, full command, and parent. The rule already establishes that the Image sits in
    a download or attachment directory; the parent chain tells you how it got there. An Office
    application, a browser, or a script host such as wscript.exe or mshta.exe launching the
    writing process points to an attachment or download being opened and executing, whereas a
    deliberate installer run from an interactive shell reads differently. Tracing the parent's own
    origin reveals whether the execution chain is user-driven or programmatic.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Is the executable referenced by the Run value present on disk, and does the persistence survive reboot?
  context: >-
    Run-key persistence is only effective if the referenced payload exists at the path written to
    the value. If the writing process dropped a binary into a download, attachment, AppData, or
    Temp path and pointed the Run value at it, confirming that file was created establishes that
    the persistence is armed and identifies what would execute at the next logon. The file-write
    event carries no hash; if the payload is present, hash it from a later execution or retrieve it
    for a reputation lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Does the Run-key modification persist, or was the value changed or removed afterward?
  context: >-
    Registry key and value deletions are not observable in this telemetry, so durability is judged
    from the value's re-modification history rather than from a delete event. If the value remains
    set over the following window, the autostart entry stays primed to run the referenced payload
    at the next logon. A later write that clears or overwrites the value may indicate the payload
    relocated its persistence or that cleanup occurred. Compare the value data written to this key
    across the window.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Has this Run key been modified before on this host?
  context: >-
    First-time modifications to a startup key are more suspicious than routine ones. Some hosts
    see periodic Run-key writes from managed software updates; a key with no prior write history
    makes this a first-time change and raises its weight. Compare the historical value data to see
    whether the same entry has been set before or whether this write is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: When this host previously fired this download-origin Run-key pattern, what processes and users drove it, and does the current alert fit?
  context: >-
    Even routine software occasionally writes Run keys from download directories. The query
    mirrors the rule's selection structure scoped to this host, so the resulting program and
    user distribution reflects how this specific firing pattern has historically run here rather
    than generic Run-key usage. A new writing process, an unexpected user account, or an unusual
    startup key compared with the host's history is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: registry_event
      product: windows
    detection:
      selection:
        Image|contains:
        - \AppData\Local\Packages\Microsoft.Outlook_
        - \AppData\Local\Microsoft\Olk\Attachments\
        - \Downloads\
        - \Temporary Internet Files\Content.Outlook\
        - \Local Settings\Temporary Internet Files\
        TargetObject|contains:
        - \Software\Microsoft\Windows\CurrentVersion\Run
        - \Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Run
        - \Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: What other registry modifications were made on this host in the same window?
  context: >-
    A payload that establishes autostart persistence often makes other configuration changes in
    the same session - additional Run or RunOnce entries, service registrations, or security
    policy edits. Clustering the registry writes on this host in a short window around the alert
    reveals the full scope of the changes and which processes made them. The triggering key appears
    in the results; the signal is what else was modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What process activity occurred on this host around the time of the alert?
  context: >-
    The persistence write rarely happens in isolation. Aggregating process activity in a tight
    window around the alert surfaces what led up to the Run-key write and what ran immediately
    after it, which is where the download or attachment being opened and any follow-on execution
    show up. Novel parent-child pairs stand out at low counts against high-count routine telemetry,
    which is what points to the process that staged the persistence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Were other process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Attackers rarely rely on a single persistence mechanism. After planting a Run key, a payload
    commonly installs backup footholds using scheduled tasks, services, or other registry entries.
    Executions of schtasks.exe, at.exe, sc.exe, reg.exe, bitsadmin.exe, or wmic.exe near the
    Run-key write indicate persistence stacking rather than an isolated startup entry.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely - dropping an executable or
    script into a Startup folder or a path referenced by a registry Run key achieves autostart
    without running additional tools. File writes to these locations near this Run-key write
    indicate the payload established a parallel persistence mechanism on disk alongside the
    registry entry.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Did other hosts fire this same download-origin Run-key pattern in the past week?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of this specific firing pattern rather than generic Run-key usage. Many hosts
    writing Run keys from download or attachment directories in the same window points to a
    packaged installer rollout or a mass-mailed attachment; one host or a small unrelated set
    points to a targeted drop. Use the host distribution and the consistency of the writing
    processes to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: registry_event
      product: windows
    detection:
      selection:
        Image|contains:
        - \AppData\Local\Packages\Microsoft.Outlook_
        - \AppData\Local\Microsoft\Olk\Attachments\
        - \Downloads\
        - \Temporary Internet Files\Content.Outlook\
        - \Local Settings\Temporary Internet Files\
        TargetObject|contains:
        - \Software\Microsoft\Windows\CurrentVersion\Run
        - \Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Run
        - \Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - a downloaded file executing, script host activity, or
    defense tampering - may reveal the stages that preceded this persistence write and help
    reconstruct the timeline. Autostart persistence is typically established after an initial
    payload runs, so prior alerts help place this Run-key write within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
