name: Uncommon Child Process Of Appvlp.EXE
id: c08524d3-d08d-4612-81db-43623d70baba
description: |
  Detects appvlp.exe (the Application Virtualization Utility bundled with Microsoft Office) spawning a child process that is not one of the expected children (rundll32.exe, msoasb.exe, the Skype server, or MSOUC.EXE). appvlp.exe is a trusted, Microsoft-signed binary that can be abused to proxy-execute arbitrary commands or executables, letting an operator run code under a signed parent and bypass Attack Surface Reduction file-path rules. Investigation should determine what the child process is, what it did, how appvlp.exe was invoked, and whether the spawning chain reflects legitimate Office activity or proxy execution of an attacker-supplied payload.
type: detection
detection_id: 9c7e131a-0f2c-4ae0-9d43-b04f4e266d43
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the alerting event show appvlp.exe spawning a child process that is not one of the expected children?
  context: Confirm the alert is a true positive by reviewing the triggering event. The rule fires when a process whose ParentImage ends in appvlp.exe spawns a child, and that child is not rundll32.exe, msoasb.exe, the Skype server binary, or MSOUC.EXE. Note the child Image and its command line, since those drive the rest of the investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: Is this user and host expected to run Office Application Virtualization in a way that spawns this child process?
  context: Legitimate Office usage rarely results in appvlp.exe launching command interpreters, script hosts, or arbitrary executables. Knowing whether the user role and host function involve Office automation or virtualization helps distinguish routine activity from proxy execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did the child process do? Decode its full command line.
  context: appvlp.exe proxy-executes whatever is passed to it, so the child's command line carries the actual payload. Decode any flags, file paths, scripts, or an HTTP/HTTPS URL, and look for command interpreters or download-and-run patterns that indicate the signed parent was used to run attacker-supplied code.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: How was appvlp.exe itself invoked, and what command line did it carry?
  context: The way appvlp.exe was launched shows whether this is normal Office virtualization or deliberate proxy execution. A command line that names a target executable, script, or path passed to appvlp.exe indicates the binary was used as a launcher for attacker-controlled code rather than for application virtualization.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: What spawned appvlp.exe, and is that grandparent chain expected for Office virtualization?
  context: appvlp.exe normally launches from Office components. A grandparent such as an Office application opening a document, a script host (wscript.exe, cscript.exe, mshta.exe), or a command interpreter points to a macro or exploitation chain that reached appvlp.exe to gain a signed launcher.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did the child process make any outbound network connections?
  context: One documented appvlp.exe abuse runs a payload retrieved over the network, and proxy-executed code frequently reaches out to download stages or establish command-and-control. Network connections initiated by the child process help confirm whether the execution pulled or contacted an external resource.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - Initiated
- question: What modules did the child process load, and were any unsigned or loaded from a user-writable path?
  context: Proxy execution through a signed parent is often used to load attacker-supplied DLLs so malicious code inherits the trust of the signed process tree. Modules loaded from temporary or user-writable directories, or modules that are unsigned, indicate that the child process executed externally supplied code rather than a routine Office component.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- question: How often has appvlp.exe spawned this child binary on this host historically?
  context: Some parent-child pairings are routine while others are novel. Because the expected children of appvlp.exe are already excluded by the rule, any historical occurrences of this specific pairing are worth reviewing. Zero or very low counts indicate a first-time or rare spawning relationship.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: What other child processes did appvlp.exe spawn around the same time?
  context: An operator using appvlp.exe as a launcher may run several tools in sequence — reconnaissance, credential access, or additional payloads. Listing all children of appvlp.exe on this host reveals the full scope of activity initiated through the signed parent.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is appvlp.exe spawning this child binary on other hosts in the environment?
  context: The same parent-child pairing appearing on multiple hosts may indicate a phishing wave or a distributed operation reusing appvlp.exe as a launcher. A single occurrence is more likely targeted. Comparing across hosts helps calibrate scope.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \appvlp.exe
      filter_main_generic:
        Image|endswith:
        - :\Windows\SysWOW64\rundll32.exe
        - :\Windows\System32\rundll32.exe
      filter_optional_office_msoasb:
        Image|contains: :\Program Files\Microsoft Office
        Image|endswith: \msoasb.exe
      filter_optional_office_skype:
        Image|contains|all:
        - :\Program Files\Microsoft Office
        - \SkypeSrv\
        Image|endswith: \SKYPESERVER.EXE
      filter_optional_office_msouc:
        Image|contains: :\Program Files\Microsoft Office
        Image|endswith: \MSOUC.EXE
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \appvlp.exe
      filter_main_generic:
        Image|endswith:
        - :\Windows\SysWOW64\rundll32.exe
        - :\Windows\System32\rundll32.exe
      filter_optional_office_msoasb:
        Image|contains: :\Program Files\Microsoft Office
        Image|endswith: \msoasb.exe
      filter_optional_office_skype:
        Image|contains|all:
        - :\Program Files\Microsoft Office
        - \SkypeSrv\
        Image|endswith: \SKYPESERVER.EXE
      filter_optional_office_msouc:
        Image|contains: :\Program Files\Microsoft Office
        Image|endswith: \MSOUC.EXE
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spread across multiple endpoints. If the same user triggered similar activity elsewhere, the scope of compromise may be larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \appvlp.exe
      filter_main_generic:
        Image|endswith:
        - :\Windows\SysWOW64\rundll32.exe
        - :\Windows\System32\rundll32.exe
      filter_optional_office_msoasb:
        Image|contains: :\Program Files\Microsoft Office
        Image|endswith: \msoasb.exe
      filter_optional_office_skype:
        Image|contains|all:
        - :\Program Files\Microsoft Office
        - \SkypeSrv\
        Image|endswith: \SKYPESERVER.EXE
      filter_optional_office_msouc:
        Image|contains: :\Program Files\Microsoft Office
        Image|endswith: \MSOUC.EXE
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: What other process activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led to this event and what followed. Look for reconnaissance, privilege escalation, or persistence mechanisms that accompany proxy execution.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the attack stages that preceded this event and help reconstruct the timeline leading to the proxy execution.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
