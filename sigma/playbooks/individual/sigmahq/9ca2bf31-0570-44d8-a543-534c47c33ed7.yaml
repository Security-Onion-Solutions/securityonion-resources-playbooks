name: Potential DLL Sideloading Of DBGCORE.DLL
id: c65b5982-9e84-43f3-96d1-b4069ba6bacd
description: |
  Detects dbgcore.dll being loaded from a path that is not one of the approved system directories
  and not one of a small set of known-good application locations. This is the signature of DLL
  search-order hijacking (sideloading): a legitimate, often signed executable is made to load an
  attacker-planted dbgcore.dll placed alongside it in a user-writable or non-standard directory,
  so the planted code runs inside the trusted process. The alert fires only when all conditions
  hold at once — the module name ends in dbgcore.dll AND its load path falls outside the approved
  system directories AND outside the excluded known-good locations. Some applications legitimately
  ship their own dbgcore.dll, so investigate the exact load path, the DLL's signature and hash,
  which process loaded it and how that process was launched, which process wrote the DLL to disk
  and when, and whether the same module is loading on other hosts.
type: detection
detection_id: 9ca2bf31-0570-44d8-a543-534c47c33ed7
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting event show dbgcore.dll loaded from a directory outside the approved system paths?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires only when a module ending
    in dbgcore.dll loads AND its path is not one of the approved system directories (System32, SysWOW64,
    Program Files, WinSxS, and similar) AND not one of the excluded known-good application locations.
    Review the exact ImageLoaded path on the triggering event: a dbgcore.dll loaded from an application's
    own directory, a user profile, or another non-system location is the sideload the rule targets. The
    load event also carries the DLL's signature status and the loading process image, which the following
    questions examine.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this host and the application that loaded the DLL expected to run in this context?
  context: >-
    Legitimate software sometimes ships and loads its own dbgcore.dll, so knowing whether the loading
    application and the host function are consistent with sanctioned software is often the fastest way to
    separate a benign bundled DLL from a planted one. A developer workstation running debugging tools is a
    different baseline than a general-purpose endpoint loading dbgcore.dll from a user directory. User
    attribution is present on the load event's owning process; when it resolves to a machine account or
    SYSTEM, pivot on the loading process image instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What modules did the loading process load, and are any from non-canonical paths, unsigned, or from user-writable directories?
  context: >-
    The full set of modules a process loads tells the story of a sideload. For the alerting process, look
    for dbgcore.dll and any sibling DLLs loaded from the application's own directory rather than the system
    path expected for those names, unsigned modules where signed ones are expected, and any modules loaded
    from user-writable locations such as a profile folder, ProgramData, or Public. A system DLL name loaded
    from a non-system path is the search-order hijack; the surrounding module list shows whether more than
    one DLL was planted in the same directory.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: What is dbgcore.dll's signing status, hash, and threat-intel reputation?
  context: >-
    Module reputation distinguishes a routine third-party DLL from a planted one. A genuinely Microsoft-signed
    dbgcore.dll loaded from an unexpected location may still be legitimate, since some installers stage signed
    DLLs; an unsigned module using the dbgcore.dll name with no valid signature is a strong masquerading
    indicator. The load event carries the DLL's hash directly, so compare it against a known-good baseline for
    dbgcore.dll to detect substitution and pivot the hash against threat intelligence to surface known loaders.
    SignatureStatus values to weigh: Valid, Unsigned, Expired, Distrusted, and Invalid.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What process loaded the DLL, how was it launched, and what is its parent chain?
  context: >-
    Sideloading requires the planted DLL to sit next to the executable that loads it, so the loading process,
    its working directory, and its parent are all load-bearing. Pivot by the loading process's own identifier
    to its creation event to read the image path, command line, current directory, and parent. An executable
    running from a user-writable directory, launched by a script host, an archive utility, or an office
    application, points to the trusted binary having been relocated and paired with a planted DLL rather than
    installed normally.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
      - ParentImage
      - ParentCommandLine
- question: Which process wrote dbgcore.dll to disk on this host, and when relative to the load?
  context: >-
    A sideload begins with the DLL being planted next to the loading executable. Identifying the process that
    created dbgcore.dll and the time of that write separates a fresh plant from a DLL that shipped with the
    application: a write moments before the load, performed by an archive tool, a downloader, a script host,
    or an unsigned binary, indicates the module was staged as part of the intrusion. The write also confirms
    the DLL landed on disk and is available for retrieval, hashing, and deeper analysis.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: Were DLL search-order controls modified in the registry on this host around the alert?
  context: >-
    Beyond planting a DLL beside an executable, search-order hijacking can be reinforced by weakening the
    operating system's DLL resolution controls. Modifications to the Session Manager KnownDLLs list,
    SafeDllSearchMode, or CWDIllegalInDllSearch change how and from where processes resolve libraries and can
    make a planted DLL take precedence. Registry writes to these keys near the alert indicate the search-order
    hijack was set up deliberately rather than being an incidental co-located DLL.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\Session Manager\KnownDLLs'
          - '\Session Manager\SafeDllSearchMode'
          - '\Session Manager\CWDIllegalInDllSearch'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: Has dbgcore.dll been loaded from this path on this host before, and under which processes?
  context: >-
    A first-time load of this module from this location is a stronger anomaly signal than a recurring one. If
    the same dbgcore.dll has been loaded by the same application repeatedly over the past 90 days, this load is
    probably routine to that software. If this is the first occurrence, or the module has only ever been loaded
    by entirely different processes, the current load is anomalous and consistent with a newly planted DLL.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Does this host normally run the application that loaded the DLL?
  context: >-
    An executable that has never run on a host is more suspicious than one that runs regularly. If the loading
    application is a relocated copy of a legitimate signed binary staged in a non-standard directory, its
    history on this host is often empty or very low. Zero or near-zero historical counts indicate first-time or
    rare execution and support the sideload reading.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Is dbgcore.dll being loaded from this path on other hosts, and under which processes?
  context: >-
    Cross-host correlation surfaces deployment scope. The same planted module loading on one host could be a
    localized incident; the same module loading across multiple hosts indicates distribution of a shared
    payload or a common staging package. Pay attention to the variety of loading processes: a single
    application loading its own dbgcore.dll is routine, while the same module loading under different or
    unexpected processes on other hosts suggests the sideload is spreading.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity in a tight window around the load surfaces
    what led up to the DLL being planted and loaded and what ran immediately after. Novel parent-child pairs
    stand out at low counts against high-count routine telemetry, which is what points to the tool that staged
    the sideload and any actions the planted code took once running inside the trusted process.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — reconnaissance, execution of scripting or archive tools, or defense
    tampering — may reveal the stages that preceded the DLL being planted and help reconstruct the timeline.
    Sideloading is typically a means to run code stealthily inside a trusted process, so prior alerts help
    place this load within a larger sequence of activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Does the user or an administrator recall installing or running the application that loaded this DLL?
  context: >-
    Direct confirmation from the person behind the account is often the fastest path to legitimacy. If an
    administrator installed or ran a debugging or development tool that ships its own dbgcore.dll, that can
    close the alert; if no one recalls running the loading application, the binary may have been staged by
    automated tooling or an intruder, and the investigation should continue into the writing process and the
    module's signature and hash.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this DLL load align with normal work hours or a maintenance window?
  context: >-
    Legitimate software installs and debugging sessions typically occur during business hours or scheduled
    maintenance windows. A dbgcore.dll load from a non-standard path in the middle of the night, outside any
    documented change window, is more suspicious than the same load during a planned software deployment.
    Weigh the load time against the host's expected usage pattern and any active maintenance activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were process-based persistence mechanisms installed on this host around the DLL load?
  context: >-
    Attackers rarely rely on a single foothold. After running code inside a trusted process via a sideloaded
    DLL, they commonly install backup persistence using scheduled tasks, services, registry Run keys, BITS
    jobs, or WMI subscriptions. Executions of schtasks.exe, at.exe, sc.exe, reg.exe, bitsadmin.exe, or wmic.exe
    near the load indicate the sideload was used to establish persistence rather than being an isolated event.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host around the DLL load?
  context: >-
    File-based persistence bypasses command-line detection entirely — dropping an executable or script into a
    Startup folder or a path referenced by a registry Run key achieves persistence without invoking schtasks,
    sc, or reg. File writes to these locations near the sideloaded DLL load indicate the planted code
    established a parallel persistence mechanism on disk.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
