- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in the alert window reveals lateral movement or
    activity spanning multiple endpoints. If the same user triggered similar downloads or follow-on
    activity on other hosts, the scope of the activity may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
