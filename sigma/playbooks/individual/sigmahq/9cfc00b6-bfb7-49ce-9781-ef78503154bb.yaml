name: Wlrmdr.EXE Uncommon Argument Or Child Process
id: 122fad63-6594-48e0-ae32-12402597adbb
description: |
  Detects potential proxy execution through wlrmdr.exe (Windows Logon Reminder), a Microsoft-signed
  system binary. The rule fires on either of two patterns: wlrmdr.exe spawning any child process, or
  wlrmdr.exe running with the full set of dialog flags (-s -f -t -m -a -u) from a parent that is not
  the legitimate winlogon.exe. The -u flag passes its argument to the ShellExecute API, which lets
  wlrmdr.exe launch an arbitrary binary on the operator's behalf, masking that launch behind a trusted
  signed process. Investigation should confirm which branch fired, decode the command line to identify
  what was launched, and establish whether the parent chain and host context are consistent with
  legitimate logon-reminder activity.
type: detection
detection_id: 9cfc00b6-bfb7-49ce-9781-ef78503154bb
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Did this alert fire because wlrmdr.exe spawned a child process, or because wlrmdr.exe ran with the full dialog flag set from a non-winlogon parent?
  context: |
    Confirm the alert is real and note which branch fired, because that determines what carries
    investigative weight downstream. One branch matches any child process whose parent is wlrmdr.exe;
    the other matches wlrmdr.exe itself (Image or OriginalFileName WLRMNDR.EXE) running with all of
    -s -f -t -m -a -u present and a parent other than winlogon.exe. Read the ParentImage, Image,
    OriginalFileName, and CommandLine on the triggering event to determine which condition matched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to invoke or be parented by wlrmdr.exe?
  context: |
    Legitimate wlrmdr.exe runs are launched by winlogon.exe to display logon reminder dialogs and
    rarely spawn child processes. A user-initiated or scripted invocation of wlrmdr.exe, or wlrmdr.exe
    spawning other binaries, is uncommon on a normal endpoint. Knowing whether this user role and host
    function would plausibly produce this activity is often the fastest triage step.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Decode the full wlrmdr.exe command line — what binary or path does the -u argument point to?
  context: |
    The -u flag hands its argument to the ShellExecute API, so whatever follows -u is the binary or
    document wlrmdr.exe was directed to launch. Decode every flag and resolve the -u target to an
    on-disk path; a path under a user-writable directory, a script, a downloaded payload, or an HTTP/HTTPS
    URL is the operational purpose of this proxy execution. Compare the dialog values in -s -t -m against
    a benign reminder to judge whether they look like real dialog text or filler used to reach -u.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains|windash: '-u '
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What child process did wlrmdr.exe spawn, and what did that child do?
  context: |
    When the parent-process branch fires, the child of wlrmdr.exe is the payload of the proxy execution.
    Identify the child binary, its command line, and its on-disk location. A child that is a script host,
    command interpreter, or a binary in a user-writable path is the activity the trusted parent was used
    to mask. If no child appears, the alert fired on the flag-set branch instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%ParentImage%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - OriginalFileName
- question: Is wlrmdr.exe's own parent expected, and what started that parent?
  context: |
    On a normal endpoint wlrmdr.exe is launched by winlogon.exe. The flag-set branch of this rule
    specifically excludes a winlogon.exe parent, so any other parent is the anomaly. Trace wlrmdr.exe's
    parent and the grandparent that started it to determine whether the chain is a logon-driven sequence
    or an operator-driven one (e.g., a shell, script host, or remote-access tool spawning wlrmdr.exe).
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did the same parent instance spawn around this time?
  context: |
    If wlrmdr.exe was launched by an operator-controlled parent, that parent likely spawned other tools
    too. Examining siblings of wlrmdr.exe from the same parent instance reveals whether wlrmdr.exe was a
    single proxy hop or one step in a broader sequence of reconnaissance, credential access, or staging.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other processes did wlrmdr.exe spawn on this host after the alert?
  context: |
    Beyond the immediate child, wlrmdr.exe may have proxied additional launches. Listing all processes
    parented by wlrmdr.exe on this host reveals the full scope of binaries executed through this trusted
    signed proxy and whether the activity continued after the first detection.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%ParentImage%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What non-OS modules did wlrmdr.exe load around the time of the alert?
  context: |
    Proxy-execution abuse of a signed binary sometimes involves side-loading or loading modules from
    non-standard paths rather than only passing a path to ShellExecute. Reviewing modules loaded by
    wlrmdr.exe — particularly any DLL outside System32 or in a user-writable directory — distinguishes a
    plain ShellExecute relay from a binary that was made to load attacker-supplied code in process. If
    module-load telemetry is not collected in this environment, treat zero results as a visibility gap.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - CommandLine
- question: Did wlrmdr.exe or the process it launched make any outbound network connections?
  context: |
    A signed binary proxying execution may be used to retrieve or beacon to an externally hosted payload.
    Outbound connections from wlrmdr.exe, or from the child it spawned, to an external address point to
    retrieval or command-and-control rather than a local dialog. Connections to enterprise-internal hosts
    are expected for some logon flows; external destinations on this binary are not.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: How often has wlrmdr.exe spawned child processes on this host historically?
  context: |
    On a normal endpoint wlrmdr.exe is launched to show logon reminders and seldom spawns children at
    all. A near-zero historical count of wlrmdr.exe acting as a parent makes the current spawn a novel
    event; a steady prior count would point to a recurring local automation worth identifying.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \wlrmdr.exe
      selection_child_img:
      - Image|endswith: \wlrmdr.exe
      - OriginalFileName: WLRMNDR.EXE
      selection_child_cli_flags_s:
        CommandLine|contains|windash: '-s '
      selection_child_cli_flags_f:
        CommandLine|contains|windash: '-f '
      selection_child_cli_flags_t:
        CommandLine|contains|windash: '-t '
      selection_child_cli_flags_m:
        CommandLine|contains|windash: '-m '
      selection_child_cli_flags_a:
        CommandLine|contains|windash: '-a '
      selection_child_cli_flags_u:
        CommandLine|contains|windash: '-u '
      filter_main_winlogon:
        ParentImage: C:\Windows\System32\winlogon.exe
      filter_main_empty:
        ParentImage:
        - ''
        - '-'
      filter_main_null:
        ParentImage: null
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_parent or (all of selection_child_* and not 1 of filter_main_*)) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \wlrmdr.exe
      selection_child_img:
      - Image|endswith: \wlrmdr.exe
      - OriginalFileName: WLRMNDR.EXE
      selection_child_cli_flags_s:
        CommandLine|contains|windash: '-s '
      selection_child_cli_flags_f:
        CommandLine|contains|windash: '-f '
      selection_child_cli_flags_t:
        CommandLine|contains|windash: '-t '
      selection_child_cli_flags_m:
        CommandLine|contains|windash: '-m '
      selection_child_cli_flags_a:
        CommandLine|contains|windash: '-a '
      selection_child_cli_flags_u:
        CommandLine|contains|windash: '-u '
      filter_main_winlogon:
        ParentImage: C:\Windows\System32\winlogon.exe
      filter_main_empty:
        ParentImage:
        - ''
        - '-'
      filter_main_null:
        ParentImage: null
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_parent or (all of selection_child_* and not 1 of filter_main_*)) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around the time of the alert?
  context: |
    Tracking the user's activity across all hosts in the alert window reveals lateral movement or
    parallel activity on multiple endpoints. If the same user triggered similar proxy-execution or
    follow-on activity elsewhere, the scope is larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \wlrmdr.exe
      selection_child_img:
      - Image|endswith: \wlrmdr.exe
      - OriginalFileName: WLRMNDR.EXE
      selection_child_cli_flags_s:
        CommandLine|contains|windash: '-s '
      selection_child_cli_flags_f:
        CommandLine|contains|windash: '-f '
      selection_child_cli_flags_t:
        CommandLine|contains|windash: '-t '
      selection_child_cli_flags_m:
        CommandLine|contains|windash: '-m '
      selection_child_cli_flags_a:
        CommandLine|contains|windash: '-a '
      selection_child_cli_flags_u:
        CommandLine|contains|windash: '-u '
      filter_main_winlogon:
        ParentImage: C:\Windows\System32\winlogon.exe
      filter_main_empty:
        ParentImage:
        - ''
        - '-'
      filter_main_null:
        ParentImage: null
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_parent or (all of selection_child_* and not 1 of filter_main_*)) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: |
    Alerts rarely occur in isolation. Examining activity around the alert reveals what led to this event
    and what followed — reconnaissance, privilege escalation, or persistence mechanisms launched in the
    same window help establish whether this proxy execution is part of a larger sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: |
    Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may
    reveal the attack stages that preceded this proxy execution and help reconstruct the timeline. The
    sequence of alerts on a host often tells the larger story.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
