name: MMC Executing Files with Reversed Extensions Using RTLO Abuse
id: 3450b366-e391-4a83-8222-2f84ca90c5f1
description: |
  Detects mmc.exe (the Microsoft Management Console) launching a .msc file whose name carries
  one of several reversed extensions (cod, fdp, ftr, lmth, slx, tdo, xcod, xslx, xtpp .msc) — a
  signature of Right-to-Left Override (U+202E) abuse that visually disguises an executable .msc
  as a benign document. The rule fires only when both the binary is mmc.exe (by Image suffix or
  OriginalFileName) AND the command line contains one of the reversed-extension tokens, so a true
  positive almost always means a user double-clicked a spoofed attachment and the OS resolved it
  to an mmc-executed .msc. Investigation should confirm the RTLO filename, trace how the file
  reached the host, decode what mmc executed, and follow the spawned process chain and any egress.
type: detection
detection_id: 9cfe4b27-1e56-48b4-b7a8-d46851c91a44
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line show mmc.exe executing a .msc file with one of the reversed extensions this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when the binary is mmc.exe (by Image suffix or OriginalFileName) and the command line contains a reversed-extension token (cod.msc, fdp.msc, ftr.msc, lmth.msc, slx.msc, tdo.msc, xcod.msc, xslx.msc, or xtpp.msc). Read the raw command line and look for the U+202E override character preceding the reversed token — it renders the filename as a document but executes as a .msc.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to open and execute .msc console files?
  context: Legitimate administrative use of mmc.exe to open standard management consoles is common on admin workstations, but a .msc file with a reversed extension being executed from a user profile path is not routine administration. Knowing whether this user's role and this host's function involve console authoring or management helps separate a misdelivered spoofed attachment from rare-but-real admin activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the actual identity of this binary based on its metadata and hash?
  context: The rule matches mmc.exe by Image suffix or by the OriginalFileName MMC.exe in PE metadata. Compare the on-disk Image path against OriginalFileName to confirm this is the genuine Microsoft console host and not a renamed copy planted to inherit mmc's trust. The signing chain indicates whether it is the Microsoft-signed system binary, and the file hash enables a reputation lookup to rule out a tampered or relocated copy.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: What is the full .msc path mmc.exe executed, and what does the reversed-extension filename decode to?
  context: Decode the command line to recover the true filename behind the RTLO override. The reversed token (e.g. fdp.msc) displays as a document extension once the U+202E character flips the trailing characters — fdp.msc renders as a .pdf-looking name. Note the directory the .msc was loaded from (Downloads, Temp, Desktop, AppData staging point to a delivered file) and whether the .msc is a real console XML or a launcher that pivots into another process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What email, document, or web request delivered the spoofed .msc file?
  context: RTLO-disguised files are a phishing-attachment and drive-by-download delivery technique — the user is tricked by a filename that reads as a document. Identify the parent process and its command line to find what handed off the file (a mail client, browser, archive utility, or chat app), then pivot to mail or web logs to find the sender, attachment name, or download URL so additional recipients can be located.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Is the spoofed .msc file still on disk for analysis?
  context: The reversed-extension .msc referenced in the command line is the delivered payload. If it still exists on disk, it can be hashed, submitted for reputation, and inspected to confirm whether it is a malicious console launcher or a benign misnamed file. The file paths are derived from the alerting command line.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: How did the spoofed .msc file arrive on this host?
  context: A reversed-extension .msc does not appear spontaneously — it was downloaded, extracted from an archive, copied, or dropped by another process. Tracing the file-creation event for that filename reveals the delivery mechanism and the writing process. A creating process such as a browser, mail client, archive tool, or curl points to user-initiated delivery; a dropper or remote-admin tool points to staged or lateral delivery.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What process spawned mmc.exe, and is that parent chain expected for console execution?
  context: The parent of mmc.exe reveals how the console was invoked. User-initiated console launches typically descend from explorer.exe. A parent such as a browser, mail client, archive utility, wscript.exe, or an Office application indicates the .msc was opened straight out of a delivery channel rather than launched deliberately by an administrator.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did mmc.exe spawn after executing the .msc?
  context: A benign console session rarely spawns command interpreters. A spoofed .msc that launches mmc as a proxy commonly chains into cmd.exe, conhost.exe, powershell.exe, wscript.exe, schtasks.exe, or a downloader — the steps that perform the actual objective such as persistence registration or payload retrieval. The children of mmc.exe reveal what the disguised file was really for.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did mmc.exe or its descendant processes make outbound network connections after the .msc executed?
  context: MMC proxy execution of a malicious .msc frequently ends in egress — the spawned chain retrieves a second-stage payload or beacons to operator infrastructure. Outbound connections from mmc.exe or from children it spawned (command interpreters, scripting hosts, curl) are a strong indicator the disguised file's objective was remote retrieval or command-and-control. Correlate the connection time and destination against the spawned process chain.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      filter_known:
        Image|endswith:
          - \svchost.exe
          - \services.exe
          - \lsass.exe
      condition: selection and not filter_known
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: What did the spawned chain do after execution, and did the same reversed-extension .msc fire on other hosts?
  context: The purpose of the RTLO disguise is to get a user to run something they would otherwise avoid. Examining the processes, file operations, and command lines that descend from mmc on this host reveals the actual objective — credential access, persistence, reconnaissance, or staging. The same reversed-extension pattern appearing on other hosts suggests a distributed campaign rather than a single misdelivered file.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did the same reversed-extension .msc detection fire on other users or hosts?
  context: RTLO phishing and download campaigns rarely target a single recipient. Correlating this detection rule across the environment shows how many hosts and users encountered the same spoofed-extension pattern, revealing campaign breadth and additional systems that need the same investigation and containment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_image:
      - Image|endswith: \mmc.exe
      - OriginalFileName: MMC.exe
      selection_commandline:
        CommandLine|contains:
        - cod.msc
        - fdp.msc
        - ftr.msc
        - lmth.msc
        - slx.msc
        - tdo.msc
        - xcod.msc
        - xslx.msc
        - xtpp.msc
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_image:
      - Image|endswith: \mmc.exe
      - OriginalFileName: MMC.exe
      selection_commandline:
        CommandLine|contains:
        - cod.msc
        - fdp.msc
        - ftr.msc
        - lmth.msc
        - slx.msc
        - tdo.msc
        - xcod.msc
        - xslx.msc
        - xtpp.msc
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the spoofed-file execution is isolated or part of broader hands-on activity. If the same user triggered similar activity on multiple endpoints in the same window, the scope of compromise may be larger than the alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_image:
      - Image|endswith: \mmc.exe
      - OriginalFileName: MMC.exe
      selection_commandline:
        CommandLine|contains:
        - cod.msc
        - fdp.msc
        - ftr.msc
        - lmth.msc
        - slx.msc
        - tdo.msc
        - xcod.msc
        - xslx.msc
        - xtpp.msc
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: When this host has previously fired this reversed-extension .msc pattern, what parents and users drove it, and does the current alert fit?
  context: Even legitimate tools can be abused. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern — not generic mmc.exe usage — has historically run here. A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_image:
      - Image|endswith: \mmc.exe
      - OriginalFileName: MMC.exe
      selection_commandline:
        CommandLine|contains:
        - cod.msc
        - fdp.msc
        - ftr.msc
        - lmth.msc
        - slx.msc
        - tdo.msc
        - xcod.msc
        - xslx.msc
        - xtpp.msc
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — reconnaissance, defense tampering, or other delivery activity — may reveal the stages that preceded the spoofed-file execution and help reconstruct the timeline. The sequence of alerts on a host often tells the attack story.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
