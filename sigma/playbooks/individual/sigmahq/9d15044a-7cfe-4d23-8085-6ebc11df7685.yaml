name: Potential Persistence Via Visual Studio Tools for Office
id: ea56de7a-7996-4332-be86-119ee0600145
description: |
  Detects a registry write that registers a Visual Studio Tools for Office (VSTO) add-in or seeds the
  VSTO trusted-inclusion list, made by a process outside the recognized Office installers and updaters.
  The rule fires when a value whose path contains an Office add-in registration key
  (\Software\Microsoft\Office\Outlook|Word|Excel|Powerpoint\Addins\) or the VSTO
  \Software\Microsoft\VSTO\Security\Inclusion\ trusted list is written, AND the writing process is NOT
  Windows Installer, regsvr32, the Office ClickToRun or integrator services, an Office application binary,
  the VSTO installer, or a bundled antivirus add-in registrar. Registering an add-in this way points an
  Office application at an attacker-supplied manifest or DLL that auto-loads at application startup, which
  yields stealth persistence that autoruns-style tools miss; adding a signing certificate's public key to
  the Security\Inclusion list suppresses the consent prompt that normally appears before a VSTO add-in
  installs. Legitimate add-in installs go through the filtered installers, so a direct write by a script
  host or unsigned binary is the signal. Investigate which add-in slot and manifest path were registered,
  which process wrote it and what launched that process, whether the referenced add-in file landed on disk,
  whether an Office application subsequently loaded it and spawned anomalous children, and whether other
  persistence was installed on the host.
type: detection
detection_id: 9d15044a-7cfe-4d23-8085-6ebc11df7685
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting write register an Office add-in or seed the VSTO trusted list from a process outside the known Office installers?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a
    registry value whose path contains an Office add-in registration key (Outlook, Word, Excel, or
    PowerPoint \Addins\) or the VSTO \Security\Inclusion\ trusted list is written, AND the writing process
    is not one of the recognized legitimate registrars: Windows Installer, regsvr32, the Office ClickToRun
    and integrator services, the Office application binaries themselves, the VSTO installer, or a bundled
    antivirus add-in registrar. Review the exact TargetObject and the writing process to confirm the add-in
    was registered outside the normal installation path rather than by an approved installer.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to register Office add-ins or modify the VSTO trusted list?
  context: >-
    Registering an add-in or adding a certificate to the VSTO trusted-inclusion list is normally done by an
    installer or by an administrator deploying approved add-ins, not by an interactive user. Knowing whether
    this account and host have any reason to register add-ins directly is often the fastest way to separate
    a sanctioned deployment from a foothold. User attribution is present on roughly 94% of endpoint registry
    events; when it is a machine account or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which add-in slot or VSTO trusted-list entry was written, and why is this key a persistence location?
  context: >-
    The key path identifies what was registered. A value under
    HKCU\Software\Microsoft\Office\<app>\Addins\<name> (FriendlyName, Description, Manifest, LoadBehavior)
    tells an Office application to load a specific add-in at startup; a LoadBehavior of 0x3 means auto-load
    and connected. A value under HKCU\Software\Microsoft\VSTO\Security\Inclusion\ adds a signing
    certificate's public key to the trusted list, which suppresses the consent prompt that normally appears
    before a VSTO add-in installs. Confirming the exact slot distinguishes add-in registration from
    trusted-list seeding and establishes that this is the VSTO persistence location rather than an unrelated
    Office edit.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value data was written to this add-in key, and does it point at a manifest or payload file?
  context: >-
    Decode the Details field. For an Addins key, the Manifest value points the Office application at the
    add-in's manifest or DLL, commonly a file:/// path into a user-writable directory, and a LoadBehavior of
    3 makes it load automatically; the add-in may reference a .vsto, .dll, .wll, or .xll payload. For a
    Security\Inclusion entry, the value carries the URL and the RSA public key of the signing certificate.
    A file path here becomes a lead for confirming the add-in file on disk; an inline reference without a
    file is the trusted-list bypass step. Details is present on roughly 79% of registry modifications and
    should be populated for these string values.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote this add-in registration, and what launched that process?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to read its
    image, full command, and parent. Because the rule already excludes the legitimate installers, the
    writing process is by construction something else: a script host or interpreter such as powershell.exe
    or cmd.exe, reg.exe, or an unsigned binary writing the add-in keys directly is the pattern that bypasses
    the normal installer and its consent prompt. The parent chain distinguishes a scripted registration from
    a deliberate administrator action.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: After this add-in was registered, did an Office application spawn a scripting engine or other unusual child process?
  context: >-
    A VSTO add-in loads into the Office process at application startup, so its effect becomes visible when
    the Office application spawns a child process. Listing children of the Office application binaries that
    are scripting engines or interpreters (powershell.exe, cmd.exe, mshta.exe, wscript.exe, cscript.exe,
    rundll32.exe, regsvr32.exe) after the add-in was registered shows whether the add-in executed a payload;
    Office applications spawning these binaries is abnormal and ties the registration to code execution. The
    add-in may not load until the next time the application is opened, so an empty result in a short window
    is not conclusive.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith:
          - '\winword.exe'
          - '\excel.exe'
          - '\powerpnt.exe'
          - '\outlook.exe'
          - '\onenote.exe'
          - '\visio.exe'
        Image|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\cmd.exe'
          - '\mshta.exe'
          - '\wscript.exe'
          - '\cscript.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Is the add-in manifest or DLL referenced by the registration present on disk?
  context: >-
    The registration is only effective if the add-in file exists at the path written into the Manifest
    value. Correlating file activity by the registry-writing process and its children surfaces whether the
    add-in manifest or DLL was dropped in the same session, commonly into a user-writable directory. The
    file-write event carries no hash; if the payload is present, hash it from a later execution for a
    reputation lookup. Reboot durability is a judgment call here, since the add-in reloads whenever the
    Office application next starts rather than at boot.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was this add-in registration later overwritten, removed, or left in place?
  context: >-
    Registry value deletions are not observable in this telemetry, so durability is judged from the key's
    re-modification history rather than from a delete event. A later write that overwrites or clears the
    add-in registration indicates the persistence was cleaned up, while the value persisting leaves the
    add-in primed to load on the next Office launch. Compare the Details values written to this key over the
    following window to see whether the registration was reverted or remains active.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Has this add-in registration key been modified before on this host?
  context: >-
    An add-in registration key for a specific add-in name is normally written once at install and then
    rarely changes. A history with no prior writes makes this a first-time registration and raises its
    weight; periodic writes to the same slot point instead to a managed deployment or a repeatedly run tool.
    Compare the historical Details values to see whether this add-in was registered before or whether this
    is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same add-in registration made on other hosts in the environment?
  context: >-
    The same add-in registration across many hosts suggests a managed deployment or a mis-scoped tool; the
    same registration confined to one host suggests a targeted foothold. Compare the Details values and the
    writing process across hosts to see whether they all register the same add-in and whether the writing
    process is consistent, which separates a broad deployment from a single hands-on operation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor who registers a malicious add-in often makes other changes in the same session: additional
    add-in slots for other Office applications, security-setting edits, or persistence keys. Clustering the
    registry writes on this host in a short window around the alert reveals the full scope of the changes and
    which process made them. The triggering key appears in the results; the signal is what else was modified
    and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Add-in registration rarely happens in isolation. Aggregating process activity in a tight window around
    the alert surfaces what led up to the registry write and what ran immediately after it. Novel
    parent-child pairs stand out at low counts against high-count routine telemetry, which is what points to
    the tool that staged the add-in and any follow-on actions.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, execution of scripting tools, or defense tampering
    - may reveal the stages that preceded this registration and help reconstruct the timeline. Add-in
    persistence is typically established after initial access, so prior alerts help place this write within a
    larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Attackers rarely rely on a single persistence mechanism. After registering an add-in, they commonly
    install backups using scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions
    created by schtasks.exe, sc.exe, reg.exe, bitsadmin.exe, or wmic.exe. Persistence tools running near the
    registration indicate intentional stacking rather than an isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely - dropping an executable or script into
    a Startup folder or a path referenced by a registry Run key achieves persistence without invoking
    schtasks, sc, or reg. File writes to these locations near the add-in registration indicate the operation
    established a parallel persistence mechanism on disk.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Was there a change ticket or documented approval for deploying this Office add-in?
  context: >-
    Many organizations require change tickets for software and add-in deployments. A corresponding ticket or
    a documented add-in rollout suggests authorized activity; the absence of one when policy requires it
    suggests the registration was unauthorized. This check can quickly close a false positive or escalate a
    true positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the user or an administrator recall installing or deploying this Office add-in?
  context: >-
    Direct confirmation from the account owner or the administrator responsible for add-in deployment is
    often the fastest path to determining legitimacy. If someone installed or tested an add-in, that closes
    the alert; if no one recalls the action, the account may be compromised or the change was made by
    automated tooling, and the investigation should continue into the writing process and any Office child
    processes.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
