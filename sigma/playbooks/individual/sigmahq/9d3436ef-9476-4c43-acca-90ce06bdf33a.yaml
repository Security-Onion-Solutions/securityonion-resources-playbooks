name: DHCP Callout DLL Installation
id: 9fcb6345-4648-4d18-aa8b-b56e25937d77
description: |
  Detects a registry write to the DHCP Server Callout configuration under
  ...\Services\DHCPServer\Parameters — either CalloutDlls (a local path to a third-party
  callout DLL) or CalloutEnabled (a DWORD that turns the callout mechanism on). The DHCP
  Server service reads these values on start and loads the referenced DLL into its own
  process, executing that code in the SYSTEM context of the service; the callout API exists
  for legitimate DHCP extensions but is configured only rarely and almost never changes on a
  running server. Because activation requires the DLL to be present on a local path (a UNC
  path fails to load) and requires the DHCP service to restart, malicious use of this
  mechanism plants code for persistence and privilege escalation that survives reboot.
  Investigate which value was written and its data, which process performed the write and
  what launched it, whether the referenced DLL is present on disk, whether the DHCP service
  loaded a DLL from a non-standard directory, and whether the change was reverted afterward.
type: detection
detection_id: 9d3436ef-9476-4c43-acca-90ce06bdf33a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting write target the DHCP Server CalloutDlls or CalloutEnabled value?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires
    when a registry value whose path ends in CalloutDlls or CalloutEnabled under
    ...\Services\DHCPServer\Parameters is written. Review the exact TargetObject and value data
    on the triggering event to confirm which of the two callout values was set and that the
    writing process is what you expect. On a running DHCP server these values change rarely and
    only through deliberate configuration, so the write itself is the setup step of the callout
    mechanism.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this host a DHCP server, and is this account expected to change its callout configuration?
  context: >-
    A callout DLL only matters on a machine actually running the DHCP Server role, and the
    callout parameters are set during role deployment or a vendor extension install, not during
    routine operation. Knowing whether this host serves DHCP and whether the writing account and
    process match a sanctioned change is the fastest way to separate a deployment or a red-team
    test from an unauthorized configuration. User attribution is present on roughly 94% of
    endpoint registry events; when it is a machine account or SYSTEM, pivot on the writing process
    instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which callout value was written, and why is the DHCPServer Parameters key a code-execution location?
  context: >-
    The DHCP Server service reads CalloutDlls and CalloutEnabled under
    HKLM\System\CurrentControlSet\Services\DHCPServer\Parameters on start; CalloutDlls names a
    local DLL to load and CalloutEnabled (1) turns the mechanism on. A DLL registered here runs
    inside the DHCP service process in SYSTEM context, which is why the key is a persistence and
    privilege-escalation location rather than an ordinary service setting. Confirming the exact
    value path and writing process establishes that this is the callout configuration and not an
    unrelated edit under the same service key.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What data was written to the callout value, and where does the referenced DLL live?
  context: >-
    Decode the value data. For CalloutDlls the data is a local file path to the DLL that will be
    loaded (the service rejects UNC or CIFS paths, so the payload must sit on a local disk); a
    path under Program Files, ProgramData, Temp, or a user profile is the lead for confirming the
    DLL on disk. For CalloutEnabled the data is a DWORD where 1 enables the mechanism and 0
    disables it. Details is present on roughly 79% of registry modifications and should be
    populated for these string and DWORD values.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote the callout value, and what launched that process?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to
    read its Image, full command, and parent. A write performed by an interactive console tool run
    by an administrator on the DHCP server reads very differently from a write launched by a script
    host such as wscript.exe or mshta.exe, an Office application, or an unsigned binary, which points
    to the callout being configured programmatically. The parent chain distinguishes a deliberate
    administrative change from a scripted implant.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Is the callout DLL referenced by CalloutDlls present on disk, and was it written in the same session?
  context: >-
    The callout mechanism is only effective if the DLL named in CalloutDlls exists at a local path,
    so confirming a file was created at that path determines whether the configuration is live and
    what it would execute when the DHCP service starts. Correlating file activity by the
    registry-writing process and its children often surfaces the DLL drop in the same session as the
    registry write. The file-write event carries no hash; if the DLL is present, hash it from a later
    execution or retrieve it for a reputation lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did the DHCP Server service load a DLL from a non-standard directory after this change?
  context: >-
    The DHCP Server role runs inside svchost.exe, and a configured callout DLL is loaded into that
    process from the local path named in CalloutDlls when the service starts. A legitimate DHCP host
    loads its modules from the system directories, so a DLL loaded by svchost from Program Files,
    ProgramData, a profile path, or another non-standard location is the callout code taking effect.
    Compare any DLL surfaced here against the path decoded from the CalloutDlls value, and check its
    signer and signature status, since a callout DLL used maliciously is typically unsigned or signed
    by an unexpected party.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\svchost.exe'
      filter_system:
        ImageLoaded|contains:
          - '\Windows\System32\'
          - '\Windows\SysWOW64\'
          - '\Windows\WinSxS\'
      condition: selection and not filter_system
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
- question: Was the DHCP Server service restarted after this change, activating the callout?
  context: >-
    The callout DLL is read only when the DHCP Server service starts, so the change does not take
    effect until the service is restarted or the host reboots. A service-control command that stops
    or restarts the DHCP service shortly after the callout value was written indicates the operator
    moved to activate the loaded code rather than leaving a dormant configuration. Look for the DHCP
    service being cycled in the window after the write, and pair this with whether a non-standard DLL
    was subsequently loaded by the service host.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_svc:
        CommandLine|contains: 'dhcp'
      condition: selection and selection_svc
    fields:
      - Image
      - CommandLine
- question: After this write, was the callout configuration reverted or changed again?
  context: >-
    Registry key or value deletions are not observable in this telemetry, so durability is judged
    from the value's re-modification history rather than from a delete event. A later write that
    clears CalloutDlls or sets CalloutEnabled back to 0 indicates the configuration was rolled back,
    which can be legitimate cleanup or an attempt to hide the change after the code was loaded; the
    value remaining set leaves the callout primed to run on every service start. Compare the Details
    values written over the following window.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Has the DHCP callout configuration been modified before on this host?
  context: >-
    The callout parameters should change rarely and only through deliberate action, so a history
    with no prior writes makes this a first-time change and raises its weight. A history of periodic
    writes to the same value points instead to a management process or a vendor extension that is
    reconfigured routinely. Compare the historical Details values to see whether the same DLL path or
    enable flag was set before or whether this configuration is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor who configures a DHCP callout often makes other configuration changes in the same
    session — additional service or persistence keys, or security policy edits to reduce visibility.
    Clustering the registry writes on this host in a short window around the alert reveals the full
    scope of changes and which process made them. The triggering value appears in the results; the
    signal is what else was modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Was the DHCP callout configuration modified on other hosts in the environment?
  context: >-
    The same callout write across several DHCP servers suggests a broad tool run or a mis-scoped
    deployment, while the same write confined to one server suggests a targeted implant. Compare the
    Details values across hosts to see whether they all point at the same DLL path and whether the
    writing process is consistent, which separates a single hands-on operation from repeated use of
    the technique across the environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A callout configuration rarely happens in isolation. Aggregating process activity in a tight
    window around the alert surfaces what led up to the registry write and what ran immediately
    after it. Novel parent-child pairs stand out at low counts against high-count routine telemetry,
    which is what points to the tool that staged the change and any follow-on actions taken once the
    callout was in place.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — reconnaissance, execution of scripting tools, or defense
    tampering — may reveal the stages that preceded this change and help reconstruct the timeline.
    Configuring a callout DLL on a server is typically a means to establish persistent SYSTEM-context
    code, so prior alerts help place this registry write within a larger sequence rather than treating
    it as a standalone event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Attackers rarely rely on a single foothold. After configuring the callout DLL, they commonly
    install backup persistence using different techniques — scheduled tasks, services, registry Run
    keys, BITS jobs, or WMI subscriptions created by schtasks.exe, sc.exe, reg.exe, bitsadmin.exe, or
    wmic.exe. Multiple persistence installations near the callout change indicate intentional stacking
    rather than an isolated configuration action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Was there a change ticket, maintenance window, or documented approval for this DHCP configuration change?
  context: >-
    Server configuration changes, especially to a service extension point that loads code in SYSTEM
    context, typically fall under change control on a production DHCP server. A corresponding ticket
    or a vendor-extension deployment record suggests authorized activity; the absence of one when
    policy requires it suggests the change was unauthorized. This check can quickly close a false
    positive or escalate a true positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
