name: Uncommon System Information Discovery Via Wmic.EXE
id: cc7b2160-f6e8-4da0-a90b-44d03b242e12
description: |
  Detects the WMI command-line utility (wmic.exe) being used to enumerate system information, specifically
  the `LOGICALDISK get Name,Size,FreeSpace` and `os get Caption,OSArchitecture,Version` commands. The rule
  fires when the process is identified as wmic.exe (by description, original filename, or image name) AND the
  command line contains one of those discovery commands. Administrators and inventory scripts occasionally run
  these commands, but the same fingerprint trio (disk, OS, and video-controller enumeration) is a known
  precursor step in information-stealer infection chains that profile a host before staging the next payload.
  Investigation should establish what spawned wmic.exe, whether the user and host normally run this kind of
  enumeration, and whether other reconnaissance or follow-on activity clustered around the same time.
type: detection
detection_id: 9d5a1274-922a-49d0-87f3-8c653483b909
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the wmic.exe command line match one of the discovery commands this rule detects?
  context: Confirm the alert is a true positive by checking that the process is wmic.exe (by description, original
    filename, or image name) AND the command line contains either `LOGICALDISK get Name,Size,FreeSpace` or `os
    get Caption,OSArchitecture,Version`. Both conditions must hold for the rule to fire. Note which of the two
    discovery commands was run.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
      - Description
- question: Is this user and host expected to run wmic.exe system-enumeration commands?
  context: Administrators, help-desk staff, and inventory or monitoring scripts legitimately query disk and OS
    information with wmic. Standard users and workstations that have no such tooling rarely run these commands
    interactively. The user's role and the host's function determine whether this enumeration is routine or
    anomalous.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: What exactly did wmic.exe enumerate? Read the full command line and identify each property requested.
  context: The full command line reveals which system properties were queried. Disk geometry and free space
    (`LOGICALDISK get`) and OS caption/architecture/version (`os get`) are host-profiling primitives. Check
    whether additional wmic invocations on the host queried CPU, GPU/video controller, baseboard, BIOS, or
    memory in the same window — the combination of disk, OS, and video-controller enumeration is a common
    host-fingerprint sequence run before staging a follow-on payload.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this wmic.exe discovery command, and is that parent normal?
  context: Legitimate enumeration is usually launched from cmd.exe or powershell.exe under explorer.exe (an
    interactive user) or from an automation/inventory agent. A wmic discovery command spawned by an Office
    application, a script interpreter (wscript.exe, cscript.exe, mshta.exe), wmiprvse.exe, or an unsigned binary
    in a user-writable path indicates automated post-compromise enumeration rather than administrative use.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Does this host normally run wmic.exe?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. Zero or
    very low historical counts for wmic.exe over the past 90 days indicate first-time or rare execution and
    raise the priority of the alert.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_wmic:
      - Description: WMI Commandline Utility
      - OriginalFileName: wmic.exe
      - Image|endswith: \WMIC.exe
      selection_commands:
        CommandLine|contains:
        - LOGICALDISK get Name,Size,FreeSpace
        - os get Caption,OSArchitecture,Version
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_wmic:
      - Description: WMI Commandline Utility
      - OriginalFileName: wmic.exe
      - Image|endswith: \WMIC.exe
      selection_commands:
        CommandLine|contains:
        - LOGICALDISK get Name,Size,FreeSpace
        - os get Caption,OSArchitecture,Version
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single wmic enumeration command may be legitimate troubleshooting, but multiple reconnaissance
    commands in rapid succession — whoami, ipconfig, net user, systeminfo, nltest — is a signature pattern of
    post-compromise enumeration. The presence of three or more different recon binaries within fifteen minutes
    typically indicates automated reconnaissance run to understand the host before the next attack stage.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context:
    what led to this enumeration, what happened after, and whether it is part of a larger sequence. Novel
    parent-child pairs stand out at low counts against repetitive agent telemetry — look for reconnaissance,
    privilege escalation, or persistence mechanisms.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple
    endpoints. If the same user triggered similar enumeration on multiple hosts, the scope of the activity may be
    larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_wmic:
      - Description: WMI Commandline Utility
      - OriginalFileName: wmic.exe
      - Image|endswith: \WMIC.exe
      selection_commands:
        CommandLine|contains:
        - LOGICALDISK get Name,Size,FreeSpace
        - os get Caption,OSArchitecture,Version
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering,
    credential access, or other reconnaissance — may reveal the attack stages that preceded this enumeration and
    help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: What processes did wmic.exe or its parent spawn afterward?
  context: The processes spawned after enumeration reveal the actual impact. Host fingerprinting commonly
    precedes staging of a follow-on payload — a download cradle, an interpreter writing to a temp directory, or a
    newly dropped executable. Unexpected children such as powershell.exe, cmd.exe, or certutil.exe shortly after
    the discovery commands point to continued post-compromise activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Have other hosts fired this wmic.exe discovery pattern in the past week, and does the cross-host
    distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of this specific discovery pattern (not generic wmic usage). Many hosts firing the same pattern points
    to scripted deployment or inventory automation; one host or a small unrelated set points to manual or
    targeted activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_wmic:
      - Description: WMI Commandline Utility
      - OriginalFileName: wmic.exe
      - Image|endswith: \WMIC.exe
      selection_commands:
        CommandLine|contains:
        - LOGICALDISK get Name,Size,FreeSpace
        - os get Caption,OSArchitecture,Version
      condition: all of selection_*
    fields:
    - host.name
- question: Were any other discovery or download LOLBins used on this host recently?
  context: Attackers who use one living-off-the-land binary often use several. Host fingerprinting via wmic is
    frequently paired with download or proxy-execution LOLBins that stage the next stage. Finding additional
    LOLBins performing reconnaissance or transfer in the same timeframe strengthens the case for malicious
    activity over isolated administration.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\hh.exe'
          - '\ie4uinit.exe'
          - '\infdefaultinstall.exe'
          - '\installutil.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\diskshadow.exe'
          - '\dnscmd.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\xwizard.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was wmic.exe executed from its expected System32 or SysWOW64 path?
  context: A LOLBin executed from a non-standard path (outside System32 or SysWOW64) may have been copied or
    renamed to evade path-based allowlists. A wmic.exe running from a user's temp directory, a download folder,
    or an application's AppData path is more suspicious than one in System32. Compare the Image path against the
    OriginalFileName to confirm the binary was not renamed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired this wmic.exe discovery pattern over the past 90 days, and what
    command-line structures are typical?
  context: A LOLBin pattern with no prior history on a host is more suspicious than one used daily under stable
    parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects this
    specific discovery pattern rather than generic wmic usage. The CommandLine projection lets the analyst
    compare typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_wmic:
      - Description: WMI Commandline Utility
      - OriginalFileName: wmic.exe
      - Image|endswith: \WMIC.exe
      selection_commands:
        CommandLine|contains:
        - LOGICALDISK get Name,Size,FreeSpace
        - os get Caption,OSArchitecture,Version
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
