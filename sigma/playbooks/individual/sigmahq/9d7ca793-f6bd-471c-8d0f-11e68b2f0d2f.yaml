name: Computer System Reconnaissance Via Wmic.EXE
id: 82c5956b-74b8-48a4-ba0e-57eaa9b9a803
description: |
  Detects wmic.exe (matched by image name or original filename) run with the "computersystem" alias, which returns host facts such as the joined domain, logged-on username, manufacturer, and model. This is a quick, native way to profile a machine and is run both by legitimate inventory and support tooling and by operators orienting themselves immediately after gaining access, before moving to credential access or lateral movement. The investigation should decode exactly what the wmic invocation asked for, confirm what spawned it (an interactive shell and a routine admin look very different from wmiprvse.exe driving a remote query), and determine whether this user and host normally run this kind of discovery or whether it sits inside a burst of other reconnaissance.
type: detection
detection_id: 9d7ca793-f6bd-471c-8d0f-11e68b2f0d2f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-03
questions:
- question: Does this match the rule — wmic.exe run with the "computersystem" argument?
  context: Confirm the alert before investing time. The rule fires when the image name ends in wmic.exe (or its original filename is wmic.exe, catching a renamed copy) and the command line contains "computersystem". Read the full command line and confirm the computersystem query, and note whether the operator went further (for example computersystem get domain, or chaining into other classes).
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user expected to run administrative discovery commands?
  context: Network administrators, help desk, and inventory tooling legitimately query computer system facts. Standard users rarely run wmic computersystem by hand. Whether the account is interactive or a service principal also matters — a SYSTEM or computer-account context that suddenly runs ad-hoc discovery is more interesting than a known admin doing inventory.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: What did this wmic invocation actually query, and did it go beyond reading computersystem facts?
  context: Decode the full command line. computersystem get domain / username / model is straightforward host profiling, but the same wmic process can be pointed at other classes or used to execute (wmic process call create) or to reach a remote host (the /node switch). Look for those extensions and for an output redirection to a file or share, which would suggest results were being staged.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this wmic command, and is that a normal pattern?
  context: A wmic computersystem query launched from cmd.exe under explorer.exe (an admin at a console) or from an inventory script is routine. The same query spawned by wmiprvse.exe points to remote WMI execution against this host, and a parent of winword.exe, mshta.exe, wscript.exe, or a PowerShell cradle points to automated post-exploitation enumeration. The parent's own command line tells you which case you are in.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: What child processes did this wmic invocation spawn afterward?
  context: A plain computersystem query rarely spawns children. If wmic was used to execute (process call create) or kicked off follow-on tooling, the children reveal the real intent — a new cmd.exe or powershell.exe, a dropped binary, or further discovery utilities turn a benign-looking inventory query into a step in hands-on activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Do the WMI activity logs show other WMI operations on this host around the alert, especially event subscriptions or remote queries?
  context: >-
    WMIC is one face of WMI; the WMI activity log records the broader picture. Look for
    permanent event subscriptions (filter-to-consumer bindings), which are a WMI persistence
    mechanism — 5861 carries the registered consumer in the CONSUMER column, 5859/5860 carry the
    filter query in Query, and message holds the readable narrative — and for a temporary
    registration whose query arrived from a remote client, which indicates the request came in
    over the network rather than from a local console. If WMI activity logging is not collected
    in this environment, treat the absence as a visibility gap rather than evidence that only the
    single computersystem query ran.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        Channel: 'Microsoft-Windows-WMI-Activity/Operational'
        host.name|expand: '%hostname%'
        EventID:
          - 5859
          - 5860
          - 5861
      condition: selection
    fields:
      - EventID
      - winlog.user_data.CONSUMER
      - winlog.user_data.ESS
      - winlog.user_data.Query
      - winlog.user_data.NamespaceName
      - message
- question: Did other reconnaissance commands run on this host around the same time?
  context: A lone computersystem query may be routine inventory, but several discovery commands in quick succession — whoami, net user, nltest, systeminfo, ipconfig — is the signature of post-compromise orientation. The reference behavior pairs wmic computersystem with whoami and net user as a first-look enumeration set, so a surrounding burst raises the likelihood this query is one step in an intrusion rather than a one-off lookup.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: Were other proxy-execution or download LOLBins used on this host recently?
  context: Operators who lean on one living-off-the-land binary usually use several. Beyond the recon set, look for the proxy-execution and download LOLBins — certutil, rundll32, regsvr32, mshta, bitsadmin, msbuild — that move from orientation to fetching and running a payload. Several of these in the same day on the same host strengthens the case that the computersystem query was an early step rather than isolated administration.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\installutil.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\xwizard.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Were process-based persistence mechanisms installed on this host around this time?
  context: Orientation is often followed by establishing a foothold. After running discovery, operators commonly install persistence with schtasks, sc, reg, at, or bitsadmin — and wmic itself can register an event subscription. Several persistence tool executions clustered around the recon query indicate intentional staging rather than isolated administrative work.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Was wmic.exe executed from its expected System32 / SysWOW64 path?
  context: The rule matches on original filename as well as image name, so a copied or renamed wmic will still fire. A wmic running from a user temp directory, ProgramData, or another non-standard path — rather than System32 or SysWOW64 — suggests the binary was staged to dodge path-based allowlists, which raises the priority of an otherwise routine-looking query.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host run the wmic computersystem pattern over the past 90 days, and what command structures are typical?
  context: A computersystem query with no prior history on a host is more notable than one that runs daily under a stable inventory routine. This mirrors the rule's exact pattern scoped to this host, so the count reflects the rule's specific firing (not all wmic usage), and the command-line projection lets you compare the historical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains: computersystem
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains: computersystem
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains: computersystem
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in a tight window reveals lateral movement or activity spanning multiple endpoints. If the same user ran discovery or other tooling on other hosts in the same window, the scope is larger than a single machine. This pivot is meaningful only when a real user account fired the alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains: computersystem
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts run the wmic computersystem pattern in the past week, and does the distribution look like automation or one-off activity?
  context: This mirrors the rule's pattern with no host scope, giving a fleet-wide count of where the computersystem query fired. Many hosts running it points to scripted inventory or vendor automation; one host or a small unrelated set points to manual operator activity. Use the distribution to judge how unusual this single alert is.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains: computersystem
      condition: all of selection_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, credential access, exploitation of a public-facing service — may reveal the stages that preceded this discovery and help reconstruct the timeline. Discovery commands early in a timeline often mark the transition from initial access to hands-on activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
