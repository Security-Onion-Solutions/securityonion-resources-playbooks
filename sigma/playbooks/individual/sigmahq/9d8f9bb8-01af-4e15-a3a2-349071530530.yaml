name: Suspicious Path In Keyboard Layout IME File Registry Value
id: df243bf8-b856-4536-a260-ff1468a6eb34
description: |
  Detects a registry write that sets an "Ime File" value under a keyboard-layout key (a TargetObject
  containing \Control\Keyboard Layouts\ and Ime File) to a DLL path in a location that legitimate
  input-method editors do not use. The rule fires when the registered path points EITHER to a suspicious
  system or user-writable location (Perflogs, Users\Public, Windows\Temp, an AppData Local or Roaming
  Temp path, or a Temporary Internet directory) OR to a user-profile Favorites, Favourites, or Contacts
  folder. Windows loads the DLL named by an Ime File value into a process when a keyboard-layout change
  is requested, so an attacker who points this value at a controlled DLL gets the operating system to
  load that code on their behalf, a technique used to inject a payload while evading behavioral
  protection; the injected DLL is then commonly used to disable endpoint defenses. Investigate which DLL
  path was registered, which process wrote it and what launched that process, whether that DLL was
  subsequently loaded, and what ran on the host afterward.
type: detection
detection_id: 9d8f9bb8-01af-4e15-a3a2-349071530530
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting registry write set a keyboard-layout Ime File value to a DLL path in a suspicious or user-profile location?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a
    TargetObject containing \Control\Keyboard Layouts\ and the Ime File value name is written AND the
    value data (Details) is a path that lands EITHER in a suspicious system or user-writable location
    (Perflogs, Users\Public, Windows\Temp, an AppData Local or Roaming Temp path, or a Temporary Internet
    directory) OR under a user-profile Favorites, Favourites, or Contacts folder. Note which branch
    fired: legitimate IME DLLs live in system directories, so any of these locations is anomalous, and
    the specific location informs where to look for the dropped DLL on disk.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to register a keyboard-layout input-method (IME) DLL?
  context: >-
    Keyboard-layout Ime File registrations are normally created by language-pack or input-method
    installers, not by an interactive user writing a DLL path into a temp or profile directory. Knowing
    whether the writing account and host function are consistent with any sanctioned software
    installation is often the fastest way to separate a benign install from a payload registration. User
    attribution is present on roughly 94% of endpoint registry events; when it is a machine account or
    missing, pivot on the writing process (Image) instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which keyboard-layout Ime File value was written, and why is this key a code-loading location?
  context: >-
    A value named Ime File under HKLM or HKCU ...\Control\Keyboard Layouts\<layout id> tells Windows which
    DLL to load for that input method. When a keyboard-layout change is requested, the operating system
    loads the DLL named by this value into the requesting process, so the value is effectively a
    request for the OS to load arbitrary code. Confirming the exact layout key and value data establishes
    that this is the IME load path rather than an unrelated registry edit and sets up decoding the DLL
    path that was registered.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What DLL path was written to the Ime File value?
  context: >-
    The Details field holds the DLL path Windows will load for this keyboard layout. Read it to identify
    the exact file and its directory: a path under Perflogs, Users\Public, Windows\Temp, an AppData Temp
    directory, or a user-profile Favorites or Contacts folder is not where a legitimate IME DLL lives.
    That path is the payload to hunt for on disk and to correlate against later DLL-load activity. Details
    is present on roughly 79% of registry modifications and should be populated for this string value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What command registered the Ime File DLL path, and what does it reveal about the operation?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to read
    the full command that set the value. A reg.exe write, a PowerShell registry cmdlet, or a custom
    binary writing the Ime File path each tell a different story about how the payload was staged. IME
    registration is a known way to have the OS load a DLL that then disables endpoint protection, so the
    write command is the entry point to understanding the intended effect.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process wrote this Ime File value, and what launched it?
  context: >-
    Pivoting by ProcessGuid to the writing process's own creation record surfaces its Image, full command,
    and parent lineage. A write launched from a script host such as wscript.exe or mshta.exe, from an
    Office application, or from an unsigned binary in a user-writable directory points to the registration
    being staged programmatically rather than a deliberate administrator or installer action. The parent
    chain distinguishes an automated implant from an interactive console action.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Was the DLL registered as the Ime File subsequently loaded into a process?
  context: >-
    The registration only matters if Windows actually loads the DLL, which happens when a keyboard-layout
    change is requested for that layout. A library-load event for the registered path confirms the
    injection executed; note which process loaded it and whether the DLL is signed. Absence of a load in
    this window does not clear the alert, because the load can occur at any later input-language change;
    widen the range if the value remains registered.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|contains|expand: '%Details%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
      - SignatureStatus
- question: After this write, was the Ime File value changed again or reverted?
  context: >-
    Registry key or value deletions are not observable in this telemetry, so durability is judged from the
    value's re-modification history rather than from a delete event. A later write that restores the value
    to a legitimate handler or replaces the path can indicate cleanup after the DLL loaded, while the
    suspicious path remaining in place leaves the layout primed to load the DLL again on the next
    input-language change. Compare the Details values written to this key over the following window.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Is endpoint protection on this host currently intact, or was it disabled after the IME DLL loaded?
  context: >-
    A DLL loaded through the IME mechanism is frequently used to disable antivirus or endpoint protection
    once it is running in a process. Checking the current protection status through the endpoint
    management console or direct host inspection reveals whether the host remains defended; if protection
    is off or agents have stopped reporting, restore it before continuing. The query redisplays the
    writing command for reference.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What activity occurred on this host after the Ime File DLL was registered?
  context: >-
    Code loaded through the IME feature runs to accomplish something the attacker wants to keep hidden, so
    examining what executed after the registration reveals what the injection was meant to enable. A
    forward-looking window surfaces process creation following the write; aggregating by process and user
    collapses routine agent telemetry so novel executions stand out. Correlate any suspicious execution
    with network connections and file writes in the same window.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense-tampering actions performed on this host?
  context: >-
    An operator who loads a DLL to impair defenses often disables several controls at once, so look for
    log clearing, shadow-copy deletion, recovery or Defender configuration changes, firewall edits, or
    service stops in the surrounding window. The customizable list of security service and process names a
    tuning analytic would exclude maps here to the set of tampering tools and commands being hunted for;
    finding several from the same account or parent indicates multiple controls were targeted together.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Has this keyboard-layout Ime File value been modified before on this host?
  context: >-
    IME registrations from language-pack installs are rare and stable, so a history with no prior writes
    to this value makes the change first-time and raises its weight. A history of periodic writes to the
    same value points instead to a management process or repeatedly run installer. Compare the historical
    Details values to see whether the same path was set before or whether this registration is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same Ime File value modified on other hosts in the environment?
  context: >-
    The same write across many hosts suggests a broad tool run or a mis-scoped deployment, while the same
    write confined to one host suggests targeted activity. Compare the Details values and writing process
    across hosts to see whether they all register the same DLL path, which separates a single hands-on
    operation from repeated use of the same technique across the environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor staging an IME load often makes other configuration changes in the same session - additional
    class or service hijacks, Defender or firewall policy edits, or persistence keys. Clustering the
    registry writes on this host in a short window around the alert reveals the full scope of changes and
    which process made them. The triggering key appears in the results; the signal is what else was
    modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    An IME registration rarely happens in isolation. Aggregating process activity in a tight window around
    the alert surfaces what led up to the registry write and what ran immediately after it. Novel
    parent-child pairs stand out at low counts against high-count routine telemetry, which is what points
    to the tool that staged the registration and any follow-on execution.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, execution of scripting tools, or defense
    tampering - may reveal the stages that preceded this registration and help reconstruct the timeline.
    Staging an OS-driven DLL load is typically a means to run hidden follow-on code, so prior alerts help
    place this registry write within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Loading a DLL through the IME feature is itself a form of code execution at logon-adjacent times, and
    an operator who establishes one foothold commonly installs backups using different techniques.
    Scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions created by schtasks.exe,
    sc.exe, reg.exe, bitsadmin.exe, or wmic.exe near the registration indicate persistence was stacked
    alongside the IME load rather than an isolated action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely - dropping an executable or script
    into a Startup folder or a path referenced by a registry Run key achieves persistence without invoking
    schtasks, sc, or reg. File writes to these locations near the IME registration indicate the loaded
    payload established a parallel persistence mechanism on disk.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
