name: Classes Autorun Keys Modification
id: 8c74cf60-08e7-4784-b911-752dea38aa33
description: |
  Detects a registry write to a Windows Registry Classes key used as an autostart extensibility
  point (ASEP). The rule fires when a TargetObject under \Software\Classes ALSO matches one of the
  known autorun extension points - shell-extension handlers (ContextMenuHandlers, DragDropHandlers,
  CopyHookHandlers, ColumnHandlers, PropertySheetHandlers), CLSID Instance keys, or file-type Open
  commands such as Exefile\Shell\Open\Command\(Default) and the .exe/.cmd associations - while none
  of the known-legitimate writers (drvinst.exe, svchost.exe on lnkfile handlers, empty/null value
  data, or a specific Office CLSID) apply. Modifying these keys registers a DLL handler or command
  that Windows loads or runs automatically when a matching file type is opened or a shell action is
  performed, giving an attacker persistence and, for auto-elevating contexts, privilege escalation.
  Many legitimate installers also populate these keys, so investigate what value was written, which
  process wrote it and what launched that process, whether the referenced DLL or executable landed on
  disk and subsequently ran, whether the change persisted, and whether the same key was modified
  across other hosts.
type: detection
detection_id: 9df5f547-c86a-433e-b533-f2794357e242
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting registry write target a Classes autostart or shell-extension key?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a
    written TargetObject path lives under \Software\Classes AND also matches one of the known
    autostart extension points - a shell-extension handler (ContextMenuHandlers, DragDropHandlers,
    CopyHookHandlers, ColumnHandlers, PropertySheetHandlers), a CLSID Instance key, or a file-type
    Open command such as Exefile\Shell\Open\Command\(Default) - and none of the known-legitimate
    writers apply. Review the exact TargetObject and value data on the triggering event to confirm
    the path is one of these autorun locations rather than an unrelated Classes edit.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify Classes shell-extension or autostart keys?
  context: >-
    Classes autostart keys are normally written only by installers and legitimate software during
    setup, so a user or account writing a shell-extension handler or file-association command outside
    a known deployment is the preparatory move of an ASEP persistence mechanism. Knowing whether the
    writing account and host function match any sanctioned software installation or administrative
    change is often the fastest way to separate routine installer activity from an attacker registering
    a handler. User attribution is present on roughly 94% of endpoint registry events; when it is a
    machine account or SYSTEM, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which Classes autorun key was modified, and why is this key a persistence location?
  context: >-
    The registry path reveals intent. Keys under \Software\Classes that register shell-extension
    handlers (ContextMenuHandlers, DragDropHandlers, ColumnHandlers), CLSID Instance handlers, or
    file-type Open commands are autostart extensibility points: Windows loads the registered DLL or
    runs the registered command automatically when the matching file type is opened or a shell action
    is performed. Confirming the exact key path and writing process establishes which extensibility
    point was targeted and whether the value data points at a DLL handler or an executable command,
    which drives how the payload gets loaded and how to hunt for its execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value was written to this key, and does it reference a DLL, a command, or an executable path?
  context: >-
    The Details field holds what Windows will load or run for this handler. Decode it: shell-extension
    and CLSID Instance keys usually carry a CLSID or a DLL path (an InprocServer32-style handler loaded
    into explorer.exe or the shell), while file-type Open commands carry an executable command line,
    commonly powershell.exe or cmd.exe with an inline or encoded payload, or a path to a dropped binary.
    A DLL or executable path in an unusual location (Temp, AppData, ProgramData, a user profile) becomes
    a lead for confirming a payload on disk; an inline interpreter command points to fileless execution.
    Details is present on roughly 79% of registry modifications and should be populated for this string
    value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote this Classes key, and what launched that process?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to read
    its Image, full command, and parent. A reg.exe, powershell.exe, rundll32.exe, or regsvr32.exe write
    launched from an Office application, a browser, a script host such as wscript.exe or mshta.exe, or an
    unsigned binary points to the handler being registered programmatically rather than by a legitimate
    installer. The parent chain distinguishes a scripted persistence write from an interactive
    administrator action or a signed setup routine.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Did the DLL or command registered in this key subsequently execute on this host?
  context: >-
    A Classes autorun handler only matters if its payload runs. Shell-extension and CLSID handlers load
    their DLL into explorer.exe or the shell the next time the matching file type is browsed or a context
    action is invoked; file-association Open commands run their executable when a file of that type is
    launched. This differs from a child of the writing process because the payload typically fires later,
    at a shell action or logon, invoked by explorer.exe or another host process rather than by the tool
    that wrote the key. The query anchors on the written value data, so any row is the registered
    command or executable actually running. If the value is a DLL handler rather than a command, a zero
    here is expected — the DLL loads silently into explorer.exe, and the disk-presence question is the
    one that establishes whether that payload exists.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|expand: '%Details%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is the DLL or executable referenced by this key present on disk in the same session?
  context: >-
    The handler is only effective if the DLL or executable it points to exists at the referenced path.
    If the value names a file such as C:\Users\Public\handler.dll or an executable in a user-writable
    directory, confirming that the file was created there determines whether the persistence is active
    and what it would load or run. The file-write event carries no hash; if the payload is present, hash
    it from a later execution or retrieve it for a reputation lookup. The query correlates file activity
    by the registry-writing process and its children, since the payload commonly lands in the same
    session as the key modification.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: After this write, was the key restored to its prior value or modified again?
  context: >-
    Registry key or value deletions are not observable in this telemetry, so durability is judged from
    the key's re-modification history rather than from a delete event. A later write that restores the
    handler to its default or removes the registered payload indicates the change was reverted, possibly
    to hide it after the payload loaded; the value remaining a non-default DLL or command leaves the
    extensibility point primed to load or run again on the next matching shell action or file open.
    Compare the Details values written to this key over the following window.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Has this Classes key been modified before on this host?
  context: >-
    Classes autostart keys are normally written once at software installation and then rarely change,
    so a history with no prior writes makes this a first-time modification and raises its weight. A
    history of periodic writes to the same key with the same value data points instead to an installer,
    update process, or management tool that legitimately owns the handler. Compare the historical Details
    values to see whether the current value is new or a repeat of a known configuration.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same Classes key modified on other hosts in the environment?
  context: >-
    The same handler write across many hosts suggests a broad software deployment or a group policy
    push; the same write confined to one host suggests a targeted persistence installation. Compare the
    Details values across hosts to see whether they all register the same DLL or command and whether the
    writing process is consistent, which separates a fleet-wide legitimate change from a single hands-on
    operation or a spreading implant.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor who registers one autostart handler often makes other configuration changes in the same
    session - additional Classes or Run-key entries, security-tool policy edits, or firewall changes.
    Clustering the registry writes on this host in a short window around the alert reveals the full scope
    of what was modified and which process made the changes. The triggering key appears in the results;
    the signal is what else was modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    An autostart handler write rarely happens in isolation. Aggregating process activity in a tight
    window around the alert surfaces what led up to the registry change and what ran immediately after
    it. Novel parent-child pairs stand out at low counts against high-count routine telemetry, which is
    what points to the tool that registered the handler and any follow-on actions taken in the same
    session.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, execution of scripting tools, or defense
    tampering - may reveal the stages that preceded this change and help reconstruct the timeline.
    Registering an autostart handler is typically one step in establishing a foothold, so prior alerts
    help place this write within a larger sequence of activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Attackers rarely rely on a single persistence mechanism. After registering an autostart handler,
    they commonly install backup footholds using different techniques - scheduled tasks, services,
    registry Run keys, BITS jobs, or WMI subscriptions created by schtasks.exe, sc.exe, reg.exe,
    bitsadmin.exe, or wmic.exe. Multiple persistence installations in the same timeframe indicate
    intentional stacking rather than an isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely - dropping an executable or script
    into a Startup folder or a path referenced by a registry Run key achieves persistence without
    invoking schtasks, sc, or reg. File writes to these locations near the Classes-key modification
    indicate the payload established a parallel persistence mechanism on disk alongside the autostart
    handler.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Does the user or an administrator recall making this Classes-key change?
  context: >-
    Classes autostart handlers change through software installation or deliberate administrative action,
    so direct confirmation from the account owner or the responsible team is a fast way to resolve the
    alert. If an administrator installing or configuring software set the value, that closes it; if no
    one recalls the action, the account may be compromised or the change was made by automated tooling,
    and the investigation should continue into the writing process, the referenced payload, and any
    follow-on execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
