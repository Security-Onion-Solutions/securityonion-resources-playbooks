name: Network Connection Initiated To BTunnels Domains
id: da718c6d-72d0-4c4e-9830-ce6b1610fc7d
description: |
  Detects an outbound (initiated) network connection to a BTunnel domain — any destination hostname
  ending in .btunnel.co.in. The rule fires when a connection is initiated from a process on the host
  AND the destination hostname resolves under the btunnel.co.in tunnel service. BTunnel is a
  cross-platform tunneling utility that needs no installation and can forward arbitrary TCP services
  (including RDP and SSH), expose a local port or the local filesystem to the internet, or persist a
  registered subdomain across sessions — capabilities an attacker can abuse for reverse-shell access,
  command-and-control, or data exfiltration that blends in with legitimate developer traffic. Because
  the tool is not inherently malicious, the investigation should determine which process opened the
  tunnel, what local service or data it exposes, whether the use is authorized, and whether the same
  endpoint or tunnel activity appears on other hosts.
type: detection
detection_id: 9e02c8ec-02b9-43e8-81eb-34a475ba7965
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting connection reach a BTunnel domain, and was it initiated outbound from a process on this host?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a
    connection is initiated outbound (egress) AND the destination hostname ends in .btunnel.co.in.
    Review the destination and direction on the triggering event. The destination hostname is recorded
    on only a small fraction of connection events, so anchor on the destination address and corroborate
    the tunnel name through the host's DNS lookups. The connection may have been observed by
    network-level telemetry that carries no process fields; in that case pivot to the host's endpoint
    records to attribute a process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - Initiated
- question: Is this user and host expected to run a tunneling client that reaches external relay infrastructure?
  context: >-
    Legitimate administrative or developer activity can open tunnels for remote support or testing.
    Knowing whether the account and host function are consistent with running a tunneling client is
    often the fastest way to separate sanctioned use from attacker-deployed access. Process and user
    attribution may be absent when the connection was seen only by network-level telemetry; in that
    case attribute the activity through the host's endpoint process records.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is BTunnel on the organization's approved software list for this host?
  context: >-
    Organizations typically sanction a specific set of remote-access and tunneling tools for IT and
    development. A tunneling utility not on that list — even a widely used one — may represent shadow IT
    or attacker-deployed access, and should be checked regardless of the tool's reputation. BTunnel
    registration requires no email verification or identity vetting, which lowers the barrier for
    anonymous, ad-hoc deployment.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there an approved development, testing, or support use case for this tunnel?
  context: >-
    Legitimate tunnel usage usually correlates with an active support ticket, a scheduled maintenance
    window, or a documented development task. If no such context exists for this session, the tunnel may
    have been established for persistent external access or to circumvent egress controls.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What is this BTunnel destination — what do passive DNS, WHOIS, and threat intel show about the endpoint and the tunnel subdomain?
  context: >-
    The specific subdomain under btunnel.co.in identifies the tunnel instance, and the resolved address
    identifies the relay infrastructure. Check passive DNS history, registration age, TLS certificate
    details, and any threat-intel hits on the address. Recently observed infrastructure or a
    first-time-seen tunnel subdomain points to attacker-controlled or ad-hoc endpoints rather than a
    sanctioned service.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - DestinationPort
- question: What did the tunneling client do — which mode and options were on its command line?
  context: >-
    The full command line reveals what the tunnel exposes. BTunnel runs in distinct modes: file exposes
    the local filesystem over the internet, http forwards a local web port, tcp forwards an arbitrary
    TCP service (including RDP on 3389 or SSH on 22), and domain persists a registered subdomain across
    sessions. Decode the mode, the -p port, and the --key API-key argument to establish what local
    service or data was published and how durable the tunnel is.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Did this host resolve a .btunnel.co.in domain, and which process requested the lookup?
  context: >-
    Connection events rarely record the destination hostname, so the DNS lookup is the reliable place to
    confirm the tunnel domain and tie it to the process that requested it. A resolution for a
    btunnel.co.in subdomain establishes the intent to reach the tunnel service, and the resolved address
    links back to the connection destination seen on the alert.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|endswith: .btunnel.co.in
      condition: selection
    fields:
      - QueryName
      - Image
- question: What process launched the tunneling client, and is that parent chain expected?
  context: >-
    The parent process reveals how the tunnel was started. A tunneling client launched from an
    interactive shell or a deliberate installer differs sharply from one spawned by an Office
    application, a script host such as wscript.exe or mshta.exe, or an unsigned binary — the latter
    points to programmatic deployment rather than sanctioned use. Read the connecting process's own
    record to recover its parent and command line.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What external endpoints and ports did the tunneling client connect to?
  context: >-
    Tunneling tools establish outbound connections to relay infrastructure; the destinations reveal
    which relay the tunnel uses and what is being forwarded. Multiple destinations or ports from the
    same client indicate several forwarded services or a fallback relay set. Connections confined to the
    tunnel provider's own infrastructure differ from connections that reach unrelated addresses.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: What destination ports is this connection using, and do they indicate a tunneled service such as RDP or SSH?
  context: >-
    In tcp mode BTunnel forwards arbitrary TCP services, including RDP (3389) and SSH (22), inside the
    tunnel to the relay. A mismatch between the outer tunnel port and the service being encapsulated, or
    a steady long-lived connection, points to protocol tunneling. A large, sustained outbound-to-inbound
    data ratio over the session is the exfiltration-side signal; byte volume is judged from flow records
    rather than the connection event itself, and the volume and asymmetry thresholds that flag it are
    environment-tunable.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - SourcePort
      - Image
      - Initiated
- question: Does this host normally communicate with this destination?
  context: >-
    First-time connections to a tunnel endpoint are more suspicious than routine communication. A
    process that does not normally make outbound connections suddenly reaching external relay
    infrastructure is a first-seen signal; a legitimate web-service destination the host baselines
    against regularly is not. Zero or very low historical counts mark this as a new destination for the
    host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
- question: What other connections to this destination or from this process occurred around the alert, and do they form a steady tunnel or beaconing pattern?
  context: >-
    A single connection may be part of a larger pattern. Repeated connections at regular intervals, or a
    single long-lived session, indicate a persistent tunnel; a burst of connections across many ports
    indicates several forwarded services. Correlating the connection timing within the window
    distinguishes a one-off reach-out from a sustained tunnel.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
      - Initiated
- question: Does this host normally run this tunneling client?
  context: >-
    A tunnel binary that has never been seen on a host is more suspicious than one that runs regularly
    as part of sanctioned support or development. Zero or very low historical counts indicate first-time
    or rare execution and raise the weight of the alert.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: What files did the tunneling client read or write on this host?
  context: >-
    BTunnel's file mode exposes the local filesystem over the tunnel, and any mode can be paired with
    local staging before transfer. Files created or accessed by the tunnel process indicate what data
    was exposed or delivered. Multiple distinct files, or files under sensitive directories, point to
    data collection rather than an incidental connection.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
- question: Do other hosts in the environment connect to this BTunnel destination?
  context: >-
    If only one host reaches this destination, it may be targeted tunnel access. If many hosts connect,
    it may be a sanctioned service or a broader deployment of the same tool. The distribution pattern
    informs the scope of the response and whether this is isolated or environment-wide.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - host.name
      - DestinationPort
      - Image
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity in a tight window around the alert
    surfaces what led up to the tunnel connection and what ran immediately after it. Novel parent-child
    pairs stand out at low counts against routine high-count telemetry, which is what points to the tool
    that opened the tunnel and any follow-on actions.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — reconnaissance, credential access, or defense tampering — may
    reveal the stages that preceded the tunnel connection and help reconstruct the timeline. A tunnel is
    often established to enable follow-on access or exfiltration, so prior alerts help place this
    connection within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
