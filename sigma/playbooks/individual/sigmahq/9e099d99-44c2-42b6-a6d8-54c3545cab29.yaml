name: HackTool - Mimikatz Kirbi File Creation
id: 6c63495e-92ee-4036-8bb4-59fb8bdb7478
description: |
  Detects creation of a file ending in .kirbi or named mimilsa.log, both artifacts of Mimikatz. A .kirbi
  file is an exported Kerberos ticket (TGT or service ticket) written by Mimikatz kerberos/sekurlsa ticket
  operations, and mimilsa.log is the log dropped by the Mimikatz misc::memssp module that captures plaintext
  credentials by registering a malicious Security Support Provider. Either file means Kerberos tickets or
  credentials were extracted from memory for reuse - Pass-the-Ticket, Overpass-the-Hash, or offline
  cracking. These names have no legitimate use, so treat a match as credential theft unless an authorized
  engagement explains it. Investigation should identify the process that wrote the file and what launched it,
  determine which tickets or credentials were captured, assess the exposed accounts, and check for ticket
  reuse and lateral movement.
type: detection
detection_id: 9e099d99-44c2-42b6-a6d8-54c3545cab29
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the created file end in .kirbi or is it named mimilsa.log?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a file
    ending in .kirbi (an exported Kerberos ticket) or named mimilsa.log (the Mimikatz memssp credential log)
    is created. Review the exact TargetFilename and the responsible process. Both names are specific
    Mimikatz output artifacts and effectively never appear through normal operation, so a genuine match is
    the on-disk product of Kerberos ticket theft or SSP credential capture.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this Mimikatz artifact creation part of an authorized penetration test or red team engagement?
  context: >-
    Mimikatz is an offensive credential-access tool that authorized assessments routinely run. Before deeper
    analysis, check whether a penetration test or red team exercise is active on this host or network
    segment during this window. A sanctioned engagement whose scope, host, and timing match resolves the
    alert; the absence of one leaves a probable credential theft that needs full triage.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to produce Kerberos ticket exports or credential logs?
  context: >-
    Exporting Kerberos tickets or dropping a credential log is not part of routine administration on most
    endpoints. Knowing whether the account and host function have any sanctioned reason to run credential
    tooling is often the fastest way to separate a live theft from an explained event. User attribution is
    present on roughly 94% of endpoint file events; when it is a machine account or SYSTEM, judge by the
    writing process and host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What process wrote the file, and what launched that process?
  context: >-
    The file event carries no command line, so pivot by ProcessGuid to the writing process to read its
    Image, full command, and parent lineage. Mimikatz may run as a named executable, be renamed, or be
    reflectively loaded into a signed host process such as rundll32.exe or a PowerShell session, so the
    writer's identity and its parent chain determine whether this was a hands-on-keyboard operation or a
    scripted one. An Office application, script host, or unsigned binary in the parent chain points to the
    tool being staged programmatically.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Which Kerberos tickets or credentials were captured?
  context: >-
    A .kirbi holds an exported Kerberos ticket - a TGT enables Pass-the-Ticket as the ticket's user, while a
    service ticket may have been obtained through Kerberoasting for offline cracking. A mimilsa.log holds
    plaintext credentials captured by a malicious SSP registered in memory. Identify which of the two fired
    and, from the writing process command line, whether the operation targeted a specific user, the current
    session, or all cached tickets. Note a telemetry limit: the memory read against lsass that produced the
    ticket export is not captured as an event here, so the artifact and the writing process are the evidence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which Mimikatz capability was invoked to produce this artifact?
  context: >-
    Mimikatz is multi-purpose, and the artifact points to the module used: .kirbi files come from
    kerberos::list /export, sekurlsa::tickets /export, or a Kerberoast, while mimilsa.log comes from
    misc::memssp registering a credential-capturing SSP. The writing process command line, where present,
    names the module and its arguments; identifying the exact capability determines whether the exposure is
    reusable tickets, cracked service-account passwords, or a persistent plaintext-capture hook on the host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What is the writing binary, and does its hash or loaded module have known threat-intel detections?
  context: >-
    The artifact itself carries no hash on the write event, so identify the process that produced it and
    read the hash from its execution record, then check that hash against reputation and threat intel. If
    the writer is a signed system binary such as rundll32.exe or powershell.exe, the process hash will look
    clean - Mimikatz was loaded into it in memory - so pivot to the modules loaded by that process and its
    command line rather than trusting the process signature.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: Which accounts may be compromised, and do any have elevated privileges?
  context: >-
    The severity depends on whose tickets or credentials were captured. An exported TGT for a domain admin
    or the krbtgt account is a full-domain exposure requiring escalation and, for krbtgt, a double password
    reset; a service ticket for a high-privilege service account enables offline cracking of that account.
    Cross-reference the accounts with sessions on this host and any user named in the writing command against
    directory group memberships to scope the exposure and the required resets.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after the artifact was written?
  context: >-
    Ticket theft is followed by ticket reuse. The query returns outbound connections from this host to
    remote-access ports - 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH) - in the hours after the
    artifact appeared, with the originating process and user for each. Two limits: a stolen .kirbi ticket
    injected and replayed from another machine will not appear here, so also review successful logons for the
    affected accounts on suspected targets, and if network telemetry is not collected treat zero rows as a
    visibility gap rather than proof no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Is the artifact still on disk, or was it deleted or renamed after the alert?
  context: >-
    The artifact's post-alert lifecycle drives next steps. A .kirbi still on disk can be retrieved to
    identify exactly which ticket was exported and for whom; a file deleted or archived shortly after
    creation points to the operator collecting it and cleaning up. A mimilsa.log left in place means the
    malicious SSP is still capturing credentials on every logon and needs removal. Note where the file landed
    and whether it was moved, packed, or deleted.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A credential-theft operation rarely writes just one file - the same process or its children may export
    several tickets, drop additional tooling, or stage an archive of collected material. The breadth, paths,
    and extensions of the writing process's other file activity distinguish a single ticket export from a
    bulk harvest and enumerate what else needs review and preservation before it is exfiltrated.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Credential theft sits in the middle of an intrusion, so the surrounding process activity often shows how
    the actor arrived and what they did next. Aggregating process creations in a tight window around the
    alert collapses routine agent telemetry into high-count rows while novel parent-child pairs stand out at
    low counts - reconnaissance commands, a script host launching the tool, or archiving utilities are the
    kind of low-count neighbors that reveal the wider operation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before the alert?
  context: >-
    Credential theft is usually reached after initial access and often after defense tampering or
    reconnaissance. Earlier detections on the same host - execution of scripting tools, disabling of
    protections, or discovery commands - help reconstruct the stages that led here and place the theft within
    the larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- always_include: true
  question: Has this user produced a .kirbi or mimilsa.log artifact before, and does that history fit their role?
  context: >-
    The query mirrors the rule's own pattern scoped to this user, so the result is the account's 90-day
    history of writing one of these Mimikatz artifacts rather than generic activity. Because the filenames
    have no legitimate use, a history of zero makes this a first-time event and reinforces that it is
    anomalous; any prior occurrences would themselves warrant review. Weigh the result against whether this
    account has any sanctioned reason to run credential tooling.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith:
        - .kirbi
        - mimilsa.log
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program driven a .kirbi or mimilsa.log write before on this host or across the environment?
  context: >-
    When the alert fires under a service or machine account, user identity does not attribute the behavior,
    so the meaningful pivot is the launch mechanism. The query mirrors the rule's pattern scoped to the
    alerting program, giving its 90-day history of driving one of these artifact writes, aggregated by
    host. A new or rare program for this pattern is the deviation to chase; a program already responsible for
    many prior events across hosts points to a recurring tool or automation that should still be explained
    given what the artifact is.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith:
        - .kirbi
        - mimilsa.log
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
