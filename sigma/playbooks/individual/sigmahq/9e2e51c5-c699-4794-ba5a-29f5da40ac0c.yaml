name: Turla Group Commands May 2020
id: 4af17c4c-51c5-4de1-8344-0a333b9c1489
description: |
  Detects process command lines carrying one of a small set of literal operator strings. The rule fires
  when either the command line contains one of three hard-coded fragments -- a `tracert -h 10 yahoo.com`
  connectivity probe, a `.WSqmCons))|iex;` fragment that pipes a decoded registry value into
  Invoke-Expression, or a backtick-split spelling of FromBase64String that defeats plain-string matching
  -- or, on the other branch, the command line both matches a `net use` mount of a docs.live.net cloud
  share and contains an `@aol.co.uk` account name. The two branches describe different stages: in-memory
  execution of a base64 payload staged in a registry value, and mounting consumer cloud storage as a drive
  letter for document transfer. Determine which branch fired, decode what the command line actually
  executes, and establish whether a scheduled task or a registry-staged payload is driving the activity.
type: detection
detection_id: 9e2e51c5-c699-4794-ba5a-29f5da40ac0c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the alerting command line match either of the rule's two literal patterns?
  context: >-
    The rule fires when the command line either contains one of three hard-coded fragments (a tracert
    connectivity probe, a `.WSqmCons))|iex;` registry-payload execution, or a backtick-split spelling of
    FromBase64String) or, on the other branch, both matches a `net use` to a docs.live.net share and
    carries an `@aol.co.uk` account name. Read the exact command line and note which branch fired -- the
    registry/base64 branch directs the investigation toward in-memory loader execution and the registry
    value it reads, while the cloud-mount branch directs it toward outbound document transfer and the
    credential used.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run PowerShell loaders or command-line cloud-storage mounts?
  context: >-
    Both branches of the rule describe operations a normal user session rarely performs from a command
    line. Decoding a registry value into Invoke-Expression is not an interactive administrative habit, and
    mounting a consumer cloud share with `net use` bypasses whatever sanctioned file-transfer path the
    organization uses. Knowing the account role and the host function is usually the fastest way to
    separate a true positive from a scripted build or a developer experiment.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Which operation does the alerting command line perform end to end?
  context: >-
    The literal strings the rule keys on are fragments of longer commands, so the surrounding arguments
    carry the operational detail. For the registry-payload branch, identify the registry hive and value
    being read, the interpreter version requested, and whether the decoded text is piped into
    Invoke-Expression. For the cloud-mount branch, identify the target URL, the drive letter, and the
    account passed with `/u:`. That determines whether the response scope is loader execution or data
    transfer.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Did the alerting process or its direct children write files that are still on disk for analysis?
  context: >-
    Loaders of this form keep most state off disk -- the payload sits in a registry value and the decoded
    script runs in memory -- but working files, staged documents, and encrypted container files are still
    written under temporary directories. Files written by the alerting process or its children are the
    candidates for hashing, content review, or sandbox submission before they are cleaned up.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What command does the alerting invocation execute, and is it the action of a registered scheduled task?
  context: >-
    The rule matches the action string of a command rather than a task-creation command, so the task name,
    trigger, and run-as account are not in the alert. Read the full command line for the payload it
    executes, then determine whether the invocation was launched by the Task Scheduler service or by an
    interactive parent. A recurring task action that decodes a registry value re-establishes execution on
    every trigger, which changes remediation from killing a process to removing a registration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Was the command obfuscated or base64-encoded, and what does it decode to?
  context: >-
    Backtick escaping splits a method name across characters so that a literal search for the method never
    matches while the interpreter still resolves it, and the payload itself is a base64 blob read from a
    registry value rather than passed on the command line. Reconstruct the method name, retrieve the value
    the command references, and base64-decode it to recover the script that actually runs. Decoded content
    typically resolves to a download cradle, an in-memory assembly load, or an injection loader.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Did PowerShell script block logging capture the deobfuscated script content?
  context: >-
    Event ID 4104 records the script text after the interpreter has resolved backtick escaping and
    concatenation, so it shows what executed even though the command line only shows a decode expression.
    That is the ground truth for what the registry-staged payload contained. If PowerShell operational
    logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence
    that nothing ran, and decode the referenced registry value manually instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
  answer_sources:
  - powershell_script_block
- question: Was the registry value that the alerting command line reads and decodes written or updated on this host?
  context: >-
    The registry-payload branch reads a value under the SQMClient telemetry key, base64-decodes it, and
    executes the result, so the payload lives in the registry rather than on disk and survives file-based
    cleanup. A write to that value, or to the CLSID Order value used to hold a per-machine encryption key,
    is the staging step that precedes execution, and the writing process identifies what installed it.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\SOFTWARE\Microsoft\SQMClient\Windows'
          - '\CurrentVersion\Explorer\CLSID\{59031A47-3F72-44A7-80C5-5595FE6B30EE}\Order'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - manual_review
- question: Was a scheduled task registered or modified on this host, and under which account?
  context: >-
    Task registration and update events name the task and the account that created it, neither of which
    the alerting command line carries. A task planted inside a built-in Windows task folder inherits a
    benign-looking name while its action runs an interpreter, so review the task path and the creating
    account rather than the name alone. If these event codes are not audited in this environment, treat
    zero results as a visibility gap rather than evidence that no task exists.
  range: -7d
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4698
          - 4702
      condition: selection
    fields:
      - EventID
      - TaskName
      - SubjectUserName
  answer_sources:
  - manual_review
  - organizational_knowledge
- question: What processes did the Task Scheduler service spawn on this host after the alert?
  context: >-
    Scheduled tasks execute as children of the Task Scheduler service, so its child processes reveal
    whether the alerting activity is on a recurring trigger and what else the same registration launches.
    A repeating interpreter invocation under the scheduler means the payload re-executes without operator
    interaction; a single unrelated set of children means the alerting command was driven some other way.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\svchost.exe'
        ParentCommandLine|contains: 'Schedule'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Were PowerShell security controls bypassed or downgraded on this host before the alerting execution?
  context: >-
    Loaders that decode a payload in memory commonly weaken the interpreter first. Requesting version 2
    of the engine drops script block and module logging entirely, an execution-policy bypass removes
    script gating, and in-process AMSI patching stops the decoded content from being scanned. Precursor
    events of this form on the same host place the alerting command inside a prepared sequence rather
    than an isolated invocation.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Did this host resolve the cloud-storage domain named in the command line, and what is known about that destination?
  context: >-
    The cloud-mount branch names a consumer storage endpoint inside the command line, so the alerting
    process event carries no destination address of its own. A lookup of that domain from this host shows
    the mount was actually attempted rather than typed and abandoned, and the resolving process shows
    whether it ran under the command interpreter or a separate client. Reputation, registration, and
    whether the organization sanctions that storage provider are manual checks -- name resolution only
    proves the lookup happened.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|endswith: 'docs.live.net'
      condition: selection
    fields:
      - QueryName
      - Image
  answer_sources:
  - external_threat_intel
  - manual_review
- question: What else did this user run across the environment around the time of the alert?
  context: >-
    Tracking the account across every host in the alert window shows whether the activity is confined to
    one machine or is being repeated wherever the credential reaches. Recon utilities, credential access,
    or archive tools running under the same account in the same window widen the scope beyond this host.
    If the alert fired under SYSTEM or a machine account this view fills with routine agent telemetry --
    read the parent-driven view instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal the account tells you nothing, so the launch mechanism is the meaningful
    pivot. This counts the rule's own command patterns under the alerting parent process across the whole
    environment inside the alert window. Several hosts at once points to a pushed or scheduled rollout; a
    single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cli_1:
        CommandLine|contains:
        - tracert -h 10 yahoo.com
        - .WSqmCons))|iex;
        - Fr`omBa`se6`4Str`ing
      selection_cli_2:
        CommandLine|re: net\s+use\s+https://docs.live.net
        CommandLine|contains: '@aol.co.uk'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: When this host has previously produced the rule's command patterns, what parents and users drove that activity?
  context: >-
    This mirrors the rule's own selection criteria scoped to this host, so the parent and user
    distribution describes how these specific command patterns have run here rather than how the
    interpreter is used generally. A parent or account that has never driven the pattern before is the
    deviation worth chasing. An empty result means the pattern is new to this host over the window.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cli_1:
        CommandLine|contains:
        - tracert -h 10 yahoo.com
        - .WSqmCons))|iex;
        - Fr`omBa`se6`4Str`ing
      selection_cli_2:
        CommandLine|re: net\s+use\s+https://docs.live.net
        CommandLine|contains: '@aol.co.uk'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's command patterns, and does that history fit their role?
  context: >-
    This counts the rule's own command patterns under the alerting account over 90 days, grouped by host,
    rather than generic use of the interpreter. An account with no prior history of these patterns is
    more interesting than one that produces them routinely as part of a documented job. Weigh the count
    against what the account is provisioned to do.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cli_1:
        CommandLine|contains:
        - tracert -h 10 yahoo.com
        - .WSqmCons))|iex;
        - Fr`omBa`se6`4Str`ing
      selection_cli_2:
        CommandLine|re: net\s+use\s+https://docs.live.net
        CommandLine|contains: '@aol.co.uk'
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: Has this parent process historically driven the rule's command patterns, or is the parent new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute the behavior and the
    launch mechanism does. This counts the rule's own command patterns under the alerting parent process
    over 90 days, grouped by host. A parent that already accounts for a long history of these patterns is
    established automation; a parent that is new for this pattern is the deviation to pursue.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cli_1:
        CommandLine|contains:
        - tracert -h 10 yahoo.com
        - .WSqmCons))|iex;
        - Fr`omBa`se6`4Str`ing
      selection_cli_2:
        CommandLine|re: net\s+use\s+https://docs.live.net
        CommandLine|contains: '@aol.co.uk'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: Have other hosts produced the rule's command patterns in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    This mirrors the rule's selection criteria with no host scope, so the result is an environment-wide
    count of these specific command patterns. Many hosts producing them points to scripted deployment or
    a shared build image; one host or a small unrelated set points to hands-on activity. Use the host
    distribution to calibrate how far the response needs to reach.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cli_1:
        CommandLine|contains:
        - tracert -h 10 yahoo.com
        - .WSqmCons))|iex;
        - Fr`omBa`se6`4Str`ing
      selection_cli_2:
        CommandLine|re: net\s+use\s+https://docs.live.net
        CommandLine|contains: '@aol.co.uk'
      condition: 1 of selection_*
    fields:
    - host.name
  answer_sources:
  - process_creation
