name: Change the Fax Dll
id: af568972-35eb-41b2-b88a-3706943235de
description: |
  Detects a registry write that sets a Fax service device-provider ImageName value (a TargetObject
  under \Software\Microsoft\Fax\Device Providers\ ending in \ImageName) to a DLL path other than the
  legitimate %systemroot%\system32\fxst30.dll. The Windows Fax service (fxssvc.exe) loads the DLL named
  in this value when the service starts, so repointing ImageName at an attacker-controlled DLL yields
  code execution in the service context on the next service restart - a persistence and defense-evasion
  technique. Legitimate changes to this value are rare; investigate what DLL path was written, which
  process wrote it and what launched that process, whether the Fax service subsequently started and
  loaded a non-fxst30 DLL, whether that DLL is present and signed on disk, and whether the value was
  reverted afterward.
type: detection
detection_id: 9e3357ba-09d4-4fbd-a7c5-ad6386314513
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting write target a Fax device-provider ImageName value with a DLL path other than fxst30.dll?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a
    value whose path is under \Software\Microsoft\Fax\Device Providers\ and ends in \ImageName is written
    AND the value data is NOT the legitimate %systemroot%\system32\fxst30.dll handler. Review the exact
    TargetObject on the triggering event to confirm it is a Fax device-provider ImageName value; the DLL
    path itself is decoded in the value-analysis step. On a clean host this value points at fxst30.dll, so
    any other target DLL is the setup step of the Fax service-DLL hijack.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to change a Fax service device-provider DLL path?
  context: >-
    The Fax device-provider ImageName value effectively never changes through normal use, and few
    administrators have reason to repoint it. Knowing whether the writing account and host function match
    any sanctioned change is often the fastest way to separate maintenance or red-team activity from a live
    hijack. User attribution is present on roughly 94% of endpoint registry events; when it is a machine
    account or SYSTEM, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which Fax device-provider value was modified, and why is this key a service-DLL persistence location?
  context: >-
    The key \Software\Microsoft\Fax\Device Providers\<provider>\ImageName holds the path of the DLL the
    Fax service (fxssvc.exe) loads at startup. Because the service runs the DLL named here in its own
    security context, a value placed by a non-Fax process is inherited and executed when the service next
    starts. Confirming the exact key path and writing process establishes that this is the Fax service-DLL
    location rather than an unrelated registry edit, and sets up decoding the written DLL path. This is the
    environment-specific critical-key pattern the technique targets: a service DLL reference used for
    persistence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What DLL path was written to the Fax ImageName value?
  context: >-
    The Details field holds the DLL path fxssvc.exe will load when the Fax service starts. Decode it: the
    legitimate value is %systemroot%\system32\fxst30.dll, so any other path is the payload the technique
    installs. A DLL in a user-writable or temporary location (Temp, AppData, ProgramData, a user profile,
    or a non-system directory) is a strong signal of hijack; a path that mimics a system directory but is
    subtly different warrants the same scrutiny. Details is present on roughly 79% of registry
    modifications and should be populated for this string value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote the Fax registry value, and what launched that process?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to read its
    Image, full command, and parent. A reg.exe, powershell.exe, cmd.exe, or unsigned-binary write launched
    from a script host such as wscript.exe or mshta.exe, an Office application, or a remote-execution tool
    points to the change being staged programmatically rather than a deliberate administrator edit. The
    expected writers of a Fax device-provider value are a very small set (Fax setup components); a writer
    outside that set is the abnormal parent-child lineage the technique produces.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: After this change, did the Fax service (fxssvc.exe) start, which would load the modified DLL?
  context: >-
    The written value does not execute on its own; the Fax service must start for fxssvc.exe to load the
    DLL named in ImageName. An fxssvc.exe start shortly after the registry change - especially one triggered
    by a service restart or a scheduled start rather than an interactive fax operation - indicates the
    hijacked DLL was given the opportunity to load. The service is reported to exit immediately after
    loading the DLL, so a short-lived fxssvc.exe launch in the window after the write is the correlating
    execution signal.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\fxssvc.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: When the Fax service ran, did it load a DLL other than fxst30.dll, and is that DLL signed?
  context: >-
    The hijack completes when fxssvc.exe loads the attacker DLL named in the ImageName value. Listing the
    modules fxssvc.exe loaded on this host, excluding the legitimate fxst30.dll, surfaces the payload
    executing in the service context. Check the signature state of any non-fxst30 DLL: an unsigned module,
    or one signed by an unexpected publisher, loaded from outside system32 corroborates the hijack, whereas
    a Microsoft-signed system module is routine. This is the code-execution stage that turns the registry
    edit into a running payload.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\fxssvc.exe'
      filter_legit:
        ImageLoaded|endswith: '\fxst30.dll'
      condition: selection and not filter_legit
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
- question: Was the DLL referenced by the Fax value written to disk near the registry change, and by which process?
  context: >-
    The persistence only functions if the DLL exists at the path written to ImageName. Correlating file
    activity by the registry-writing process and its children usually surfaces the DLL being dropped in the
    same session as the registry edit. The file-write event carries no hash; if the DLL is present, hash it
    from a later load or execution, or retrieve it for a reputation lookup. Whether the DLL persists on disk
    and whether the value survives reboot together determine if the mechanism is active for the next Fax
    service start.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: After this change, was the Fax value restored to fxst30.dll or modified again?
  context: >-
    Registry key and value deletions are not observable in this telemetry, so durability is judged from the
    value's re-modification history rather than from a delete event. Cleanup is common once the DLL has
    loaded: a later write that restores the value to %systemroot%\system32\fxst30.dll indicates the hijack
    was reverted to hide it, while the value remaining a non-fxst30 path leaves the persistence primed to
    run again the next time the Fax service starts. Compare the Details values written over the following
    window.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Has this Fax ImageName value been modified before on this host?
  context: >-
    The Fax device-provider ImageName value should change rarely and only through deliberate action, so a
    history with no prior writes makes this a first-time change and raises its weight. A history of periodic
    writes to the same value points instead to a management process or a repeatedly run tool. Compare the
    historical Details values to see whether a non-fxst30 path was set before or whether this is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this Fax ImageName value modified on other hosts in the environment?
  context: >-
    The same write across many hosts suggests a broad tool run or a mis-scoped deployment; the same write
    confined to one host suggests targeted activity. Compare the Details values across hosts to see whether
    they all point at the same DLL path and whether the writing process is consistent, which separates a
    single hands-on operation from repeated use of the same technique across the environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other registry modifications were made on this host in the same window?
  context: >-
    A process that repoints a service DLL for persistence often makes other configuration changes in the
    same session - additional service or Run-key edits, security-policy changes, or firewall
    modifications. Clustering the registry writes on this host in a short window around the alert reveals
    the full scope of changes and which process made them. The triggering key appears in the results; the
    signal is what else was modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A service-DLL hijack rarely happens in isolation. Aggregating process activity in a tight window around
    the alert surfaces what led up to the registry write and what ran immediately after it. Novel
    parent-child pairs stand out at low counts against high-count routine telemetry, which is what points to
    the tool that staged the change and any follow-on actions taken once the service loaded the DLL.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, execution of scripting or remote-management
    tools, or defense tampering - may reveal the stages that preceded this change and help reconstruct the
    timeline. A service-DLL persistence edit is typically preceded by the access that made it possible, so
    prior alerts help place this write within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Attackers rarely rely on a single persistence mechanism. Scheduled tasks, services, registry Run keys,
    BITS jobs, or WMI subscriptions created by schtasks.exe, sc.exe, reg.exe, bitsadmin.exe, or wmic.exe
    near the Fax value change indicate the Fax service-DLL hijack is one of several footholds being stacked
    rather than an isolated action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Does the user or an administrator recall making this Fax service configuration change?
  context: >-
    The Fax device-provider ImageName value has no routine reason to change, so direct confirmation from
    the account owner or the responsible team is a fast way to resolve the alert. If an administrator or a
    red-team operator repointed the value during sanctioned work, that closes it; if no one recalls the
    action, the account may be compromised or the change was made by automated tooling, and the
    investigation should continue into the writing process and the follow-on service start.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
