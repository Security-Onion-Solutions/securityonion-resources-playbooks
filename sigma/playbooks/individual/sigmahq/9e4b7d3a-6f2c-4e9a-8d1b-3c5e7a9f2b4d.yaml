name: Potentially Suspicious File Creation by OpenEDR's ITSMService
id: 595efef7-913f-4d8b-b9fd-56f089a1283d
description: |
  Detects OpenEDR's ITSMService.exe (the COMODO/Xcitium Endpoint Manager remote-management agent)
  creating a file whose name ends in an executable, script, or archive extension (.exe, .dll, .ps1,
  .bat, .cmd, .vbs, .vbe, .js, .hta, .scr, .com, .pif, .7z, .rar, .zip). The rule fires only when both
  conditions hold: the writing process is ITSMService.exe AND the created file carries one of those
  extensions. OpenEDR ships as a legitimately signed remote-management agent, but its free trial
  requires no business verification, so an actor can weaponize a signed agent to stage payloads and
  evade application allowlisting; file uploads pushed through the agent surface as ITSMService.exe
  creating files. Investigation should confirm whether the agent is sanctioned on this host, decode and
  reputation-check the dropped file, determine whether it executed, and check for persistence and
  interactive-shell child processes spawned by the agent.
type: detection
detection_id: 9e4b7d3a-6f2c-4e9a-8d1b-3c5e7a9f2b4d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Did OpenEDR's ITSMService.exe create a file with an executable, script, or archive extension on this host?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires only when
    both parts match: the writing process is ITSMService.exe AND the created file's name ends in one of
    the flagged extensions (.exe, .dll, .ps1, .bat, .cmd, .vbs, .vbe, .js, .hta, .scr, .com, .pif, .7z,
    .rar, .zip). Review the exact file path, the operation performed, and the responsible process on the
    triggering event to confirm ITSMService is the writer and the extension is one the rule targets.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this host expected to run OpenEDR, and is the agent dropping executables part of sanctioned IT operations?
  context: >-
    Legitimate OpenEDR file management and software deployment can create executables and scripts, so the
    fastest triage is knowing whether the agent belongs on this host and whether the account and host
    function are consistent with the detected write. ITSMService frequently runs as SYSTEM, so when the
    user is a machine or system account, judge by the host role and whether the agent is authorized rather
    than by user identity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is OpenEDR (COMODO/Xcitium Endpoint Manager) on the organization's approved remote-management software list?
  context: >-
    Organizations typically sanction a small set of remote-management agents for IT support. A legitimately
    signed RMM agent that is not on that list is a concern regardless of its valid signature, because a
    free, unverified trial gives an actor a signed agent that passes application allowlisting. Confirm
    whether OpenEDR is deployed and expected here; an agent installed from a user-writable or temporary
    path, or one no team recognizes, points to attacker-deployed or shadow-IT remote access rather than a
    sanctioned rollout.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there an active helpdesk ticket or maintenance window explaining this OpenEDR remote session?
  context: >-
    Legitimate agent-driven file operations usually correspond to an active support ticket, a scheduled
    maintenance window, or a user request. If no support context accounts for this file drop, the agent may
    be under attacker control or in use to move a payload onto the host outside change control, and the
    investigation should continue into the dropped file and the agent's child processes.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What is the dropped file, and does its content show obfuscation, encoded strings, or known-malware indicators?
  context: >-
    Read and analyze the file's actual content rather than trusting its name. For scripts and text files,
    check for base64 or otherwise encoded strings, embedded URLs or IP addresses, inline interpreter
    commands, and known malware string patterns; for binaries, check imports, embedded strings, packer
    signatures, and signing status. Content retrieval is a manual step against the endpoint or the agent
    console. Obfuscated or encoded payloads dropped through a remote-management agent are consistent with
    staging rather than routine software distribution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If the dropped file has since executed, what is its hash and does threat intelligence flag it?
  context: >-
    A file's hash is recorded when it runs, not when it is written - file-creation events carry no hash.
    This query looks for the dropped file executing by its name and reads the hash from the execution
    event; submit that hash to reputation and sandbox services or internal threat intel to establish
    whether it is known malicious, benign, or previously unseen. If the file is present but has not
    executed, retrieve it from its on-disk path and hash it manually. The gap between the write and any
    execution is itself a signal - immediate execution points to download-and-run.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
- question: What child processes did ITSMService spawn around the alert - interactive shells, ssh-shellhost, cmd, or powershell?
  context: >-
    The agent's interactive remote shell runs as ssh-shellhost.exe spawned by ITSMService.exe, commonly
    launching cmd or powershell under a high-integrity context. Shell or file-manager children of the agent
    around the file drop indicate hands-on-keyboard use rather than automated software distribution, and
    they reveal what the operator did after staging the file. Legitimate agent activity has predictable
    children; unexpected interpreters or reconnaissance binaries are the deviation worth chasing.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other files did ITSMService write or delete around the alert?
  context: >-
    A process that stages one payload often writes several - a dropper unpacking components, a tool staging
    collected data, or an operator pushing multiple files through the agent. The breadth, paths, and
    extensions of the agent's other file activity distinguish a single artifact from a broader staging
    operation and enumerate what else needs review. Writes landing in user-writable or world-writable
    locations such as C:\Users\Public or temporary directories carry more weight than writes into the
    agent's own program directory; software-update directories that are expected for this agent can be set
    aside.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What external endpoints is ITSMService connecting to?
  context: >-
    Remote-management agents establish long-lived outbound connections to relay servers and cloud
    infrastructure. Connections to the vendor's own management infrastructure are expected; connections to
    unfamiliar or custom endpoints suggest the agent is relaying to attacker-controlled infrastructure or
    being used as a tunnel. Separate internal destinations from external ones, weigh external endpoints
    against any vendor support ranges the organization already trusts, and note session duration and volume
    that would indicate an interactive tunnel rather than routine agent check-ins.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: Were autorun or service-persistence registry keys modified on this host around the alert?
  context: >-
    Remote-access tooling frequently establishes persistence so the agent or a dropped payload survives
    reboot - a service entry or an autorun key. Modifications to Run/RunOnce values or service
    configuration keys near the file drop indicate the foothold was made durable rather than being a
    one-off file write. Review which process wrote each key and what command or image path it points to;
    an entry referencing the dropped file or a user-writable path ties the persistence back to this
    activity.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        TargetObject|contains:
          - '\CurrentVersion\Run'
          - '\CurrentVersion\RunOnce'
          - '\Services\'
      condition: selection and selection_persist
    fields:
      - TargetObject
      - Details
      - Image
- question: Is the dropped file still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives both urgency and next steps. A payload still on disk can be
    retrieved, hashed, and analyzed; a file deleted seconds after creation suggests anti-forensic cleanup
    or a self-deleting dropper and shifts the investigation toward what executed in between. Read the
    operation type on each subsequent event on this path to see whether the file was modified, renamed, or
    removed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has a file with this name been created on this host before?
  context: >-
    A file that has never appeared on a host is more suspicious than one that is part of normal operations.
    First-time appearance of an executable or script dropped by the agent should be checked even if the
    name looks benign, while a long history of the same name written by the agent points to routine
    distribution. Compare the historical writers to confirm the agent, and not some other process, is the
    consistent source.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- always_include: true
  question: Has this user account previously produced this ITSMService file-drop pattern, and does that fit their role?
  context: >-
    The query mirrors the rule's exact firing pattern scoped to the alerting user, returning that account's
    90-day history of ITSMService dropping flagged-extension files, aggregated by host. An account that has
    never produced this pattern is more suspicious than one that does so regularly; weigh the count against
    the user's role. When the alert fires under SYSTEM or a machine account - common for a service-run agent
    - user identity does not attribute the behavior, and the parent-process companion question is the
    meaningful pivot.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection_process:
        Image|endswith: \COMODO\Endpoint Manager\ITSMService.exe
      selection_suspicious_extensions:
        TargetFilename|endswith:
        - .7z
        - .bat
        - .cmd
        - .com
        - .dll
        - .exe
        - .hta
        - .js
        - .pif
        - .ps1
        - .rar
        - .scr
        - .vbe
        - .vbs
        - .zip
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this ITSMService file-drop pattern, or is the program new for this activity?
  context: >-
    When the alert fires under a service principal, the launch mechanism attributes the behavior better than
    user identity. This query mirrors the rule's exact firing pattern scoped to the alerting program,
    returning the 90-day history of that program driving this pattern, aggregated by host. A new or rare
    program for this pattern is the deviation worth chasing; a program that already accounts for a large volume
    of prior events is agent or OS automation. Read alongside the user-scoped history - one asks whether this
    account is routine, the other whether this launch mechanism is routine.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection_process:
        Image|endswith: \COMODO\Endpoint Manager\ITSMService.exe
      selection_suspicious_extensions:
        TargetFilename|endswith:
        - .7z
        - .bat
        - .cmd
        - .com
        - .dll
        - .exe
        - .hta
        - .js
        - .pif
        - .ps1
        - .rar
        - .scr
        - .vbe
        - .vbs
        - .zip
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user account do across the network around the alert?
  context: >-
    Tracking the account's activity across all hosts reveals whether this is isolated or spans multiple
    endpoints - the same account triggering similar activity elsewhere widens the scope of compromise. When
    the alert fires as SYSTEM, a machine account, or another service principal, this network-wide user pivot
    returns unbounded agent-telemetry noise; in that case the parent-driven cross-host companion question is
    the meaningful answer.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same ITSMService-driven file-drop pattern fire on other hosts in the alert window - a coordinated rollout or isolated activity?
  context: >-
    Under a service principal, asking what the user did network-wide returns agent-telemetry noise. The
    meaningful question is whether the same launch mechanism fired elsewhere. This query mirrors the rule's
    exact firing pattern scoped to the alerting program, fleet-wide, in the alert window. Multiple
    hosts in the same window point to scheduled or pushed automation - a mass deployment through the agent;
    a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection_process:
        Image|endswith: \COMODO\Endpoint Manager\ITSMService.exe
      selection_suspicious_extensions:
        TargetFilename|endswith:
        - .7z
        - .bat
        - .cmd
        - .com
        - .dll
        - .exe
        - .hta
        - .js
        - .pif
        - .ps1
        - .rar
        - .scr
        - .vbe
        - .vbs
        - .zip
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity in a tight window around the alert
    surfaces what led up to the file drop and what ran immediately after it. Novel parent-child pairs stand
    out at low counts against high-count routine telemetry, which is what points to the operator's other
    tools - reconnaissance, privilege escalation, or persistence staged around the same time.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, execution of scripting tools, defense tampering,
    or credential access - may reveal the stages that preceded this file drop and help reconstruct the
    timeline. Staging a payload through a remote-management agent is typically one step in a longer
    sequence, so prior alerts help place this event within the operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
