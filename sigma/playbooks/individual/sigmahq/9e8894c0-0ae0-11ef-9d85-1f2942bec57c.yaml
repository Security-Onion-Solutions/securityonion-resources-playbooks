name: Suspicious Shell Open Command Registry Modification
id: e7d695ea-e838-4a99-80f2-3c81638ad469
description: |
  Detects a registry write to a *\shell\open\command key whose value data points to a suspicious
  location - a temporary, public, or user-profile directory such as \AppData\Local\Temp, \Users\Public,
  \Windows\Temp, %AppData%, or %Temp% rather than a normal installed-program path. A shell\open\command
  class key defines the command that runs when a file of the associated type is opened. Auto-elevating
  binaries such as eventvwr.exe, computerdefaults.exe, or sdclt.exe read these per-user Classes keys
  before the machine-wide default, so a command planted here runs at high integrity with no consent
  prompt (a User Account Control bypass); the same key can also hijack a file association so that opening
  a file of that type launches an attacker payload (persistence). The rule fires when the shell\open\command
  value is written AND its data references one of the flagged locations. Investigate the value and location
  that was written, the process that wrote it and its parent chain, whether an auto-elevating binary or a
  file-open then spawned a high-integrity child from that location, whether the referenced payload exists
  on disk, and whether the value was reverted afterward.
type: detection
detection_id: 9e8894c0-0ae0-11ef-9d85-1f2942bec57c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting registry write set a shell\open\command value whose data references one of the flagged suspicious locations?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a
    value whose path contains \shell\open\command\ is written AND its data references one of the flagged
    directories - \$Recycle.Bin, \AppData\Local\Temp, \Users\Public, \Windows\Temp, \PerfLogs, and the
    %AppData%/%LocalAppData%/%Temp%/%tmp% environment forms, among others. Review the exact TargetObject
    and Details on the triggering event to confirm the written command points at one of these locations.
    A shell\open\command default that runs a binary from a temporary or public directory rather than an
    installed-program path is the setup step of an association hijack.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify a shell\open\command file-association key?
  context: >-
    A shell\open\command class default should change only through a program install or a deliberate
    administrative action and effectively never through routine user activity. A medium-integrity user
    account writing this per-user Classes key with a value pointing to a temporary or public directory is
    the preparatory move of a UAC bypass or a file-association hijack, so knowing whether the writing
    account and host function match any sanctioned change is the fastest way to separate testing or
    red-team activity from a live technique. User attribution is present on roughly 94% of endpoint
    registry events; when it is a machine account or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Does the user or an administrator recall making this file-association change?
  context: >-
    A shell\open\command association has no routine reason to change to a temporary or public path, so
    direct confirmation from the account owner is a fast way to resolve the alert. If a red-team operator
    or an administrator installing or testing software set the value, that closes it; if no one recalls
    the action, the account may be compromised or the change was made by automated tooling, and the
    investigation should continue into the writing process and any elevated or handler-triggered follow-on.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which shell\open\command key was modified, and why is this class location abused for UAC bypass and file-association hijacking?
  context: >-
    A shell\open\command key under HKCU\Software\Classes or HKCR holds the command that runs when a file
    of the associated type is opened. Per-user Classes entries are read before the machine-wide default,
    so a value placed here by a medium-integrity user is inherited both by auto-elevating binaries that
    open a matching file type and by ordinary file opens. Confirming the exact key path and writing
    process establishes that this is a shell\open\command hijack rather than an unrelated Classes edit,
    and sets up decoding the planted command. The flagged Details locations (temporary, public, and
    profile directories) are where the referenced payload is staged.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What command or payload path was written to the shell\open\command value?
  context: >-
    The Details field holds the command that runs when the association fires. Decode it: the planted value
    is commonly a path to a dropped binary or script in one of the flagged directories, or an inline
    powershell.exe or cmd.exe command with an encoded payload. If it references a file path in a
    temporary, public, or profile directory, that path becomes the lead for confirming a payload on disk;
    if it is an inline interpreter command, the operation may be fileless. Details is present on roughly
    79% of registry modifications and should be populated for this string value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote the shell\open\command value, and what launched that process?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to read
    its Image, full command, and parent. A reg.exe, powershell.exe, or cmd.exe write launched from an
    Office application, a browser, a script host such as wscript.exe or mshta.exe, or an unsigned binary
    points to the association being staged programmatically rather than a deliberate administrator edit.
    The parent chain distinguishes a scripted hijack from an interactive console action.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Was an auto-elevating binary that reads shell\open\command class keys launched after the value was written?
  context: >-
    A UAC bypass completes when an auto-elevating binary opens a file type whose per-user class command
    was hijacked. eventvwr.exe reads the mscfile association, computerdefaults.exe and fodhelper.exe read
    the ms-settings association, and sdclt.exe reads Folder/exefile associations; running one of these
    shortly after the write triggers the planted command at high integrity. A schtasks or direct launch of
    one of these binaries near the write ties the registry edit to an elevation attempt. A negative result
    here does not clear the hijack, because a file-association persistence variant fires when a user opens
    a file of the associated type rather than by launching one of these binaries.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\eventvwr.exe'
          - '\computerdefaults.exe'
          - '\fodhelper.exe'
          - '\sdclt.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: After this write, did a process execute from one of the flagged suspicious locations the value points to?
  context: >-
    When the hijacked association fires - whether through an auto-elevating binary or a user opening a file
    of that type - the handler spawns the payload from the location named in the registry value. Listing
    process executions whose image path lies in one of the flagged directories reveals whether the planted
    command actually ran. The child is often powershell.exe, rundll32.exe, cmd.exe, or a dropped binary
    launched from a temporary, public, or profile path. Match the specific path against the value seen in
    Details, and treat a high-integrity child as confirmation of a successful elevation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|contains:
          - '\$Recycle.Bin\'
          - '\AppData\'
          - '\Contacts\'
          - '\Music\'
          - '\PerfLogs\'
          - '\Photos\'
          - '\Pictures\'
          - '\Users\Public\'
          - '\Videos\'
          - '\Windows\Temp\'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: What action was performed with elevated privileges after this write?
  context: >-
    A UAC bypass is a means to an end - actors elevate to perform actions that require high integrity:
    installing persistence, dumping credentials, tampering with security tools, or accessing protected
    resources. Examining processes running at High or System integrity shortly after the shell\open\command
    write reveals the objective. Correlating the registry write with elevated execution within a tight
    window, on the order of tens of seconds to a few minutes, separates the bypass payload from unrelated
    elevated activity; a longer path or an unsigned binary running elevated raises the weight further.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: Were registry modifications made to set up this UAC bypass?
  context: >-
    Many UAC bypass techniques rely on registry key manipulation - writing a command to a key that an
    auto-elevated process reads and executes. This rule fires on the shell\open\command variant; related
    techniques target HKCU\Software\Classes associations such as ms-settings and mscfile, the Folder and
    exefile handlers, and the DelegateExecute value. Finding the write from a reg.exe, powershell.exe, or
    cmd.exe process confirms the mechanism and reveals the exact command staged for elevated execution.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\reg.exe'
          - '\powershell.exe'
          - '\cmd.exe'
        CommandLine|contains:
          - 'ms-settings'
          - 'mscfile'
          - 'Classes\exefile'
          - 'Classes\Folder'
          - 'Environment'
          - 'Shell\Open\command'
          - 'DelegateExecute'
      condition: selection
    fields:
      - CommandLine
      - Image
- question: Is the executable or script referenced by the shell\open\command value present on disk?
  context: >-
    A file-association hijack is only effective if the payload the value points to exists at that path.
    If the command references a binary or script in a temporary, public, or profile directory, confirming
    that a file was created there by the writing process or its children determines whether the mechanism
    is active and what it would run when the association fires. The file-write event carries no hash; if
    the payload is present, hash it from a later execution or retrieve it for a reputation lookup. Registry
    deletions are not observable here, so persistence durability is judged from the payload on disk and the
    value's re-modification history rather than from a delete event.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor who stages a UAC bypass or an association hijack often makes other configuration changes in
    the same session - additional Classes hijacks for other auto-elevating binaries, Defender or firewall
    policy edits, or Run/RunOnce persistence keys. Clustering the registry writes on this host in a short
    window around the alert reveals the full scope of changes and which process made them. The triggering
    key appears in the results; the signal is what else was modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: After this write, was the shell\open\command value restored to its normal handler or changed again?
  context: >-
    Registry key or value deletions are not observable in this telemetry, so durability is judged from the
    value's re-modification history rather than from a delete event. Cleanup is common immediately after
    the payload runs: a later write that restores the association to its normal handler indicates the
    hijack was reverted to hide it, while the value remaining a command that points to a flagged location
    leaves the association primed to run again the next time that file type is opened. Compare the Details
    values written over the following window.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Has this shell\open\command value been modified before on this host?
  context: >-
    A shell\open\command class default should change rarely and only through deliberate action, so a
    history with no prior writes makes this a first-time change and raises its weight. A history of
    periodic writes to the same value points instead to a management process or a repeatedly run installer.
    Compare the historical Details values to see whether a command pointing to a flagged location was set
    before or whether this is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same shell\open\command value modified on other hosts in the environment?
  context: >-
    The same write across many hosts suggests a broad tool run or a mis-scoped deployment; the same write
    confined to one host suggests a targeted technique. Compare the Details values across hosts to see
    whether they all plant the same command and whether the writing process is consistent, which separates
    a single hands-on operation from repeated use of the same technique across the environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A UAC bypass or association hijack rarely happens in isolation. Aggregating process activity in a tight
    window around the alert surfaces what led up to the shell\open\command write and what ran immediately
    after it. Novel parent-child pairs stand out at low counts against high-count routine telemetry, which
    is what points to the tool that staged the hijack and any high-integrity actions taken once elevation
    succeeded.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Were other privilege escalation techniques attempted on this host?
  context: >-
    Actors who attempt one UAC bypass often try multiple methods until one succeeds, especially if the OS
    version or configuration blocks certain techniques. Finding multiple bypass or privilege-escalation
    detections on the same host in a short window confirms deliberate escalation activity rather than a
    false positive, and defense-tampering or credential-access alerts around the same time point to the
    objective behind the elevation.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, execution of scripting tools, or defense
    tampering - may reveal the stages that preceded this change and help reconstruct the timeline. A UAC
    bypass or association hijack is typically a means to run privileged or persistent follow-on actions, so
    prior alerts help place this shell\open\command write within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
