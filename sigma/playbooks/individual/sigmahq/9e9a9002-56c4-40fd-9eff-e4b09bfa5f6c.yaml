name: DLL Load By System Process From Suspicious Locations
id: 1f4f179d-32ed-4e67-ad8f-61660a7b4daa
description: >-
  Detects a Windows system process (one whose Image begins with C:\Windows\, such as a
  binary under System32 or SysWOW64) loading a DLL located in C:\Users\Public\ or
  C:\PerfLogs\. Both directories are world-writable and are never the legitimate home of a
  system DLL, so a trusted system binary pulling a module from one of them is the signature
  of DLL search-order hijacking or side-loading: an attacker plants a DLL where a trusted
  process will resolve it, and the attacker's code then runs inside a signed, expected
  process, inheriting its trust and blending into normal telemetry. Legitimate loads of this
  form are rare. Determine which system process loaded which module, whether the module is
  signed and reputable, how and by whom the DLL arrived in the writable directory, what the
  loading process did afterward, and whether the artifact was later deleted to remove
  evidence.
type: detection
detection_id: 9e9a9002-56c4-40fd-9eff-e4b09bfa5f6c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Did a process under C:\Windows\ load a DLL located in C:\Users\Public\ or C:\PerfLogs\?
  context: >-
    Confirm the alert is a true positive by reviewing the loading process path (Image) and
    the loaded module path (ImageLoaded) on the triggering event. The rule fires on the
    combination: a system binary whose Image begins with C:\Windows\ that loads a module
    whose path begins with C:\Users\Public\ or C:\PerfLogs\. Both directories are
    world-writable and hold no legitimate system DLLs, so a trusted system process resolving
    a module from either one is the load pattern the rule keys on. The library event carries
    the module's signing status and hash directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Is this user and host expected to run a system process that loads modules from a user-writable directory?
  context: >-
    Legitimate system binaries load their dependencies from system directories, not from
    C:\Users\Public\ or C:\PerfLogs\. Knowing whether this host runs software or an
    administrative workflow that would stage a DLL in one of those locations, and whether the
    account is one that would do so, is often the fastest way to separate an unusual but
    sanctioned deployment from a side-loading attempt. User attribution is present on roughly
    94% of endpoint events; when it is a machine account or SYSTEM, pivot on the loading
    process and its parent instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which modules did the loading process pull in, and which of them came from user-writable or non-canonical paths?
  context: >-
    The full set of modules a process loaded shows whether this is an isolated side-load or
    one of several planted DLLs. Survey every module the loading process pulled in and flag
    those resolved from C:\Users\Public\, C:\PerfLogs\, Temp, AppData, or ProgramData, and
    any system DLL name loaded from a non-system path, which is the search-order-hijack
    signature. A trusted system binary should resolve its dependencies from System32 or
    SysWOW64; a module from a writable directory is the anomaly to chase.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - SignatureStatus
- question: For the DLL loaded from the suspicious path, what is its signing status, hash, and reputation?
  context: >-
    Module reputation separates a relocated but genuinely-signed library from a planted
    malicious one. A validly Microsoft-signed DLL staged in a writable directory may be a
    clumsy deployment, whereas an unsigned module, or one carrying a system DLL name without
    a valid signature, is a strong masquerading and side-loading indicator. SignatureStatus
    values worth noting are Unsigned, Expired, Distrusted, and Invalid. The Hashes field on
    the load event supports a reputation lookup that can identify a known loader; image_load
    events carry the module hash directly, so no execution pivot is needed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What process spawned the loading process, and is that parent chain expected?
  context: >-
    The parent reveals how the loading process was launched. A system binary started along
    its normal service or logon lineage reads very differently from one spawned by a script
    host, an Office application, or an unfamiliar binary in a user-writable directory, any of
    which points to the load being staged programmatically. Walk up the tree from the
    parent's own ParentProcessGuid where a longer lineage is needed; long-running parents such
    as services or shells can start days before the load, which the wider lookup window
    accommodates.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Which process wrote the DLL into the user-writable directory, and when?
  context: >-
    A side-load begins when the DLL is planted in the writable path, and the planting process
    is usually not the system binary that later loads it. Searching file-write events for this
    module name on the host surfaces the dropper -- an archive extractor, a downloader, a
    script host, or an installer -- and the account it ran under. A recent write by an
    unexpected process ties the load to a delivery step; a write that predates the alert by
    weeks may indicate the DLL has sat staged, waiting for the system process to resolve it.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: Is the loaded DLL still on disk, and what other files did the loading process and its children touch?
  context: >-
    If the planted module still exists in C:\Users\Public\ or C:\PerfLogs\, it can be hashed,
    submitted for analysis, or reviewed to determine what it does. This surfaces files written
    or touched by the loading process and its direct children, correlated by process lineage,
    which also reveals payloads, staged output, or additional dropped modules produced once
    the DLL was in place.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was the suspicious DLL deleted from this host after it was loaded?
  context: >-
    Removing the planted module after it has been loaded into memory is a common cleanup step
    that leaves the running process compromised while erasing the on-disk artifact. Searching
    deletion events for this module name on the host shows whether the DLL was removed, and
    which process removed it. A deletion shortly after the load points to deliberate indicator
    removal and raises the priority of capturing the module from memory before it is lost;
    the file persisting on disk keeps direct analysis of the artifact available.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: file_delete
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: Has this module been loaded on this host before, and by which processes?
  context: >-
    A first-time load of this module on this host is a stronger anomaly than a recurring one.
    If the same module path has been loaded repeatedly by the same process over the past 90
    days, the load is likely routine; if this is the first occurrence, or the module has
    historically been loaded only by unrelated processes, the current load stands out.
    Grouping by the loading Image shows which processes account for the history.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: When this host has previously matched the rule's pattern, which programs and users drove it, and does the current alert fit?
  context: >-
    This mirrors the rule's own selection -- a system process under C:\Windows\ loading a module
    from C:\Users\Public\ or C:\PerfLogs\ -- scoped to this host over the past two weeks. The
    resulting program and user distribution shows how this specific pattern has historically run
    here, if at all. A new acting program process, an unfamiliar account, or a first-ever match
    is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: image_load
    detection:
      selection:
        Image|startswith: C:\Windows\
        ImageLoaded|startswith:
        - C:\Users\Public\
        - C:\PerfLogs\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: Are other processes on this host loading modules from C:\Users\Public\ or C:\PerfLogs\?
  context: >-
    An attacker who can write a DLL to a world-writable directory often stages several, and
    multiple processes resolving modules from the same directory points to a broader
    side-loading foothold rather than a single hijacked binary. This lists every module load
    from those directories on the host, regardless of the loading process, so a cluster of
    non-system loaders or a shared planted directory becomes visible.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|startswith:
        - C:\Users\Public\
        - C:\PerfLogs\
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Have other hosts matched the rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    This mirrors the rule's selection with no host scope, so the result is a fleet-wide count
    of the pattern -- a system process loading a module from a writable directory -- rather
    than generic module usage. Many hosts matching the same pattern points to scripted
    deployment or vendor automation that stages files in these directories; one host or a
    small unrelated set points to targeted operator activity. Use the host distribution and
    parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: image_load
    detection:
      selection:
        Image|startswith: C:\Windows\
        ImageLoaded|startswith:
        - C:\Users\Public\
        - C:\PerfLogs\
      condition: selection
    fields:
    - host.name
- question: What child processes did the loading process spawn after the module was loaded?
  context: >-
    Children of the loading process show what the side-loaded code did once it was running
    inside the trusted process. A command interpreter, script host, reconnaissance binary, or
    transfer tool spawned shortly after the load indicates the injected module executed a
    payload, whereas a benign load typically spawns little of note. The loading process here is
    a system binary, so filter its normal children and focus on novel or anomalous spawns.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Were other defense-tampering actions performed on this host around the load event?
  context: >-
    Running attacker code inside a trusted system process is itself a defense-evasion move,
    and it frequently travels with others -- clearing event logs, disabling real-time
    protection, stopping security services, or deleting shadow copies. Finding several such
    actions from the same user or parent within the same window points to a deliberate
    operation to reduce visibility rather than isolated administration.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining activity around the load reveals what led to
    it and what followed -- reconnaissance, privilege escalation, staging, or persistence
    installation. Aggregating by Image and ParentImage collapses routine agent noise into
    high-count rows so that novel parent-child pairs stand out at low counts, which is what
    points to the tooling that staged and used the module.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host -- reconnaissance,
    execution of scripting tools, or defense tampering -- may reveal the stages that preceded
    this load and help reconstruct the timeline. A side-load into a trusted process following
    an earlier delivery or execution alert is a stronger signal than one seen alone.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
