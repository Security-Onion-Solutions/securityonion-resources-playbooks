name: Hiding User Account Via SpecialAccounts Registry Key - CommandLine
id: 56cc68cd-eab8-43eb-9798-30355010c8e5
description: |
  Detects reg.exe adding a value of 0 under HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\SpecialAccounts\UserList,
  which hides the named user account from the Windows logon screen. The rule fires when reg.exe runs with a command line
  that adds a UserList value, includes the add and /v switches, and sets the data to 0 — all conditions together. Legitimate
  administrators occasionally hide service or kiosk accounts this way, but the pattern is also used after creating a local
  account to keep it out of sight; the investigation should determine which account was hidden, who created it, and whether
  the hiding accompanied account creation, defense tampering, or other operator activity on the host.
type: detection
detection_id: 9ec9fb1b-e059-4489-9642-f270c207923d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did reg.exe add a UserList value set to 0 under the SpecialAccounts key as this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive. Review the full command line and verify
    that reg.exe wrote to ...\Winlogon\SpecialAccounts\UserList with the add and /v switches and a data value of 0, and note
    which account name follows the /v switch — that is the account being hidden.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to hide local accounts from the logon screen?
  context: Legitimate administrative activity can trigger this detection — kiosk, service, or built-in accounts are sometimes
    hidden intentionally. Knowing whether this user routinely administers accounts and whether this host is one where such
    changes are expected is often the fastest path to separating true positives from routine operations.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which account name was written to the UserList key, and does that account exist and appear privileged or recently created?
  context: The value name written under SpecialAccounts\UserList is the account being hidden. Identify it, then determine whether
    that account is a known administrative or service account or one that was recently created. An account hidden immediately
    after creation, or one in a privileged group, shifts the disposition toward operator activity rather than routine maintenance.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Was a local user account created on this host around the time the account was hidden?
  context: Hiding an account from the logon screen is commonly paired with creating that account first. A nearby account-creation
    event tying the same account name to the hiding action strongly indicates an operator establishing a concealed foothold.
    If account-management logs are not collected in this environment, treat zero results as a visibility gap rather than evidence
    no account was created.
  range: -1h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4720
      condition: selection
    fields:
      - TargetUserName
      - SubjectUserName
- question: Were other registry modifications made on this host in the same session?
  context: An account-hiding registry edit often comes bundled with other reg.exe changes — enabling RDP, weakening UAC token
    filtering, disabling Defender flags, or adding the account to a group. Finding a cluster of reg.exe writes from the same
    host within a short window reveals the full scope of configuration changes and whether multiple objectives were pursued.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- question: What process spawned reg.exe and is that parent chain expected?
  context: The parent process reveals how reg.exe was invoked. An interactive administrator action usually descends from explorer.exe
    or a console, while a batch toolkit, a remote-execution helper, or a script host (cmd.exe, powershell.exe, wscript.exe)
    spawning reg.exe to hide an account points to scripted operator activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \reg.exe
        CommandLine|contains|all:
        - \SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\SpecialAccounts\UserList
        - add
        - /v
        - /d 0
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \reg.exe
        CommandLine|contains|all:
        - \SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\SpecialAccounts\UserList
        - add
        - /v
        - /d 0
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or actions on multiple endpoints. If the same
    user hid accounts or ran administrative tooling on several hosts in this window, the scope of the activity may be larger
    than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \reg.exe
        CommandLine|contains|all:
        - \SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\SpecialAccounts\UserList
        - add
        - /v
        - /d 0
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to
    the account-hiding edit, what happened after, and whether it is part of a larger sequence. Look for account creation, group
    additions, reconnaissance, or persistence installation nearby.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Account hiding rarely happens in isolation. Earlier detections on the same host — credential access, reconnaissance,
    privilege escalation, or defense tampering — may reveal the attack stages that preceded the account being hidden and help
    reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host?
  context: A hidden local account is itself a persistence and re-entry mechanism, and operators rarely rely on a single one.
    They commonly stack scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions. Multiple persistence
    installations in the same timeframe indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were any other persistence or tamper LOLBins used on this host recently?
  context: Operators who hide an account via reg.exe often pair it with other built-in tools for persistence and evasion —
    schtasks for scheduled tasks, sc for services, netsh for firewall changes, wevtutil for log clearing, or bcdedit for boot
    configuration. Finding several such tools used around the same time strengthens the case for hands-on operator activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\schtasks.exe'
          - '\sc.exe'
          - '\at.exe'
          - '\netsh.exe'
          - '\wevtutil.exe'
          - '\bcdedit.exe'
          - '\vssadmin.exe'
          - '\diskshadow.exe'
          - '\dnscmd.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was reg.exe executed from its expected System32 or SysWOW64 path?
  context: reg.exe run from a non-standard path (a user's temp or download directory, AppData, or ProgramData) may indicate
    the binary was copied or renamed to evade path-based allowlists. Compare the executed Image path and its OriginalFileName
    against the expected Windows system locations.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired the UserList account-hiding pattern over the past 90 days, and what command-line structures are typical?
  context: An account-hiding edit with no prior history on a host is more suspicious than one seen repeatedly under stable parents.
    The query mirrors the rule's selection structure scoped to this host, so the count reflects this specific firing pattern
    rather than generic reg.exe usage. The command-line projection lets the analyst compare typical invocation patterns against
    the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \reg.exe
        CommandLine|contains|all:
        - \SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\SpecialAccounts\UserList
        - add
        - /v
        - /d 0
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - CommandLine
- question: Have other hosts fired the UserList account-hiding pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this
    specific firing pattern rather than generic reg.exe usage. Many hosts firing the same pattern points to scripted deployment
    or imaging; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \reg.exe
        CommandLine|contains|all:
        - \SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\SpecialAccounts\UserList
        - add
        - /v
        - /d 0
      condition: selection
    fields:
    - host.name
