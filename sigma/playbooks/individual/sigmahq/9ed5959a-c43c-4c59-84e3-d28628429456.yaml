name: UAC Bypass Using Iscsicpl - ImageLoad
id: bd270b29-42b1-47cd-895c-98ccc90a6604
description: |
  Detects the iscsicpl.exe User Account Control bypass, in which the 32-bit auto-elevating iSCSI
  Initiator control panel (C:\Windows\SysWOW64\iscsicpl.exe) resolves and loads a module named
  iscsiexe.dll through the user %PATH% search order. The rule fires when iscsicpl.exe loads a file
  ending in \iscsiexe.dll AND that module is loaded from a path outside C:\Windows\ — that is, a
  user-writable directory rather than the system location. Because iscsicpl.exe auto-elevates without
  a consent prompt, a planted iscsiexe.dll runs at high integrity and hands the operator elevated code
  execution. Legitimate loads of this module resolve from the system directory, so a load from a
  writable path is the search-order hijack. Investigate where the loaded module came from, which
  process planted it, what launched iscsicpl.exe, and what ran at high integrity afterward.
type: detection
detection_id: 9ed5959a-c43c-4c59-84e3-d28628429456
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting load show iscsicpl.exe loading iscsiexe.dll from a directory outside C:\Windows?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when the
    32-bit auto-elevating iscsicpl.exe loads a module ending in \iscsiexe.dll AND that module path is
    NOT under C:\Windows\. On a clean system the iSCSI Initiator applet resolves iscsiexe.dll from the
    system directory; a load from a user-writable path is the search-order hijack. Review the Image and
    ImageLoaded on the triggering event to confirm the loaded path is outside the system location. The
    library event carries the module's signing status and hash directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Is this user and host expected to run the iSCSI Initiator control panel (iscsicpl.exe)?
  context: >-
    iscsicpl.exe is the iSCSI Initiator configuration applet and on most endpoints is essentially never
    launched interactively. Knowing whether the account and host role have any reason to open it
    separates an administrator configuring iSCSI storage from a bypass staged to auto-elevate. Where the
    User is a machine account or missing, pivot on the loading process and its parent instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What modules did iscsicpl.exe load in this session, and did any resolve from a user-writable or non-system path?
  context: >-
    The bypass works because the 32-bit binary resolves iscsiexe.dll through the user %PATH% before the
    system directory, so a module planted in %TEMP%, AppData, ProgramData, Public, or another writable
    location loads in its place. List every module the process loaded and flag any whose path is outside
    C:\Windows\ or that carries no valid signature. The planted iscsiexe.dll is the search-order hijack;
    other non-canonical loads may indicate additional side-loading.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: What is the signing status, hash, and reputation of the iscsiexe.dll that was loaded?
  context: >-
    A genuine Microsoft iscsiexe.dll loaded from the system directory is benign; an unsigned or
    unknown-signer module using that filename from a writable path is the masquerading payload. Check the
    code signature and pivot the module hash against threat intelligence to see whether it is a known
    loader. An Unsigned, Expired, Distrusted, or Invalid SignatureStatus on a system-style filename is a
    strong side-loading indicator.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: Which process wrote iscsiexe.dll into the load path, and when did that write occur?
  context: >-
    The load event shows the module being used, not how it arrived. A search-order-hijack bypass requires
    the DLL to be planted in a writable directory on the search path first, usually by a separate dropper,
    script host, or archive extraction shortly before iscsicpl.exe runs. Identifying the writing process
    and the timing ties the elevation attempt to the delivery step and names the account that staged it.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: '\iscsiexe.dll'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: What launched iscsicpl.exe, and is that parent chain expected for this binary?
  context: >-
    The image-load event does not carry the parent, so pivot by the loading process's identifier to its
    own execution record. iscsicpl.exe started by explorer.exe after a user opens the applet is ordinary;
    started by a script host such as wscript.exe, mshta.exe, or powershell.exe, an Office application, or
    an unsigned binary points to the auto-elevation being driven programmatically. The parent chain
    distinguishes a deliberate administrator action from a staged bypass.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Has iscsiexe.dll been loaded on this host before, and by which processes?
  context: >-
    A first-time load of this module on the host is a stronger anomaly than a recurring one. If iscsiexe.dll
    has only ever loaded from the system directory under iscsicpl.exe historically and this load is the
    first from a writable path, the current event is the anomaly. Repeated historical loads from the same
    non-system path would instead suggest a persistent planted module already present on the host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Does this host normally run iscsicpl.exe at all?
  context: >-
    The iSCSI Initiator applet is rarely launched on endpoints that are not configured for iSCSI storage.
    A zero or very low 90-day count means this execution is first-time or rare and raises its weight; a
    host that runs it routinely for storage administration lowers it. Group by user to see which accounts
    have run it before.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has fired this same iscsicpl load pattern before, what programs and users drove it, and does the current alert fit?
  context: >-
    The query mirrors the rule's own selection and filter scoped to this host, so the program
    and user distribution reflects how this specific search-order-hijack pattern — not generic
    iscsicpl usage — has run here. A new acting program process or an unexpected account against
    a previously consistent history is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: image_load
    detection:
      selection:
        Image: C:\Windows\SysWOW64\iscsicpl.exe
        ImageLoaded|endswith: \iscsiexe.dll
      filter:
        ImageLoaded|contains|all:
        - C:\Windows\
        - iscsiexe.dll
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - Image
    - User
- question: What high-integrity processes ran on this host in the 30 minutes after the load?
  context: >-
    A successful iscsicpl bypass yields code execution at high integrity inside an auto-elevated process,
    and the operator's objective follows: installing persistence, dumping credentials, disabling security
    tooling, or reaching protected resources. List processes running at High or System integrity shortly
    after the load and identify any that perform those actions. The integrity-level filter is the tunable
    parameter here; broaden or narrow it to the elevation contexts of interest.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: What child processes did iscsicpl.exe spawn after loading the module?
  context: >-
    The processes iscsicpl.exe starts after the hijacked module loads reveal the payload's actual behavior.
    The legitimate applet does not spawn command interpreters; cmd.exe, powershell.exe, or other tools
    launched by iscsicpl.exe at this point are the injected code executing at high integrity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did the elevated iscsicpl.exe process or its children write any files to disk?
  context: >-
    Code running at high integrity inside the hijacked process frequently drops follow-on tooling,
    payloads, or output. Correlating file writes to the loading process and its direct children surfaces
    artifacts left by the elevated code that can be hashed, submitted for analysis, or reviewed. This is
    distinct from how the loaded module itself arrived on the host.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Were other privilege-escalation techniques attempted on this host around the same time?
  context: >-
    Operators who try one UAC bypass often attempt several until one succeeds, especially across differing
    OS builds. Other bypass or elevation alerts on this host in a tight window around the load confirm
    deliberate escalation rather than an isolated false positive, and reveal which method ultimately worked.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- question: Have other hosts fired this same iscsicpl load pattern in the past week?
  context: >-
    The query mirrors the rule's selection and filter with no host scope, giving a fleet-wide count of this
    specific hijack pattern rather than generic iscsicpl usage. Many hosts firing the same pattern points to
    scripted deployment or a shared tool; a single host or a small unrelated set points to hands-on operator
    activity. Use the host spread to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: image_load
    detection:
      selection:
        Image: C:\Windows\SysWOW64\iscsicpl.exe
        ImageLoaded|endswith: \iscsiexe.dll
      filter:
        ImageLoaded|contains|all:
        - C:\Windows\
        - iscsiexe.dll
      condition: selection and not filter
    fields:
    - host.name
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    The bypass rarely happens in isolation. Aggregating process activity in a tight window around the load
    surfaces what led up to it and what ran immediately after, with novel parent-child pairs standing out at
    low counts against routine telemetry. That is what points to the tool that staged the hijack and any
    actions taken once elevation succeeded.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — reconnaissance, execution of scripting tools, or defense tampering
    — may reveal the stages that preceded the bypass and help reconstruct the timeline. UAC bypass is
    typically a means to run privileged follow-on actions, so prior alerts help place this load in a larger
    sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
