name: Renamed Remote Utilities RAT (RURAT) Execution
id: e5a52425-e41b-4d2e-b075-a8e616c1a2b1
description: |
  Detects a process whose PE Product field is "Remote Utilities" but whose image
  name is NOT one of the canonical Remote Utilities binaries (rutserv.exe,
  rfusclient.exe) -- i.e., a renamed copy of the Remote Utilities remote-management
  tool. Remote Utilities is legitimate remote-administration software; renaming its
  binary defeats name-based detection and is a recurring tradecraft for deploying it
  as an unauthorized remote-access tool while blending in. The rule fires when the
  Product header matches AND the image is not a canonical RU binary, so triage turns
  on establishing the renamed binary's true identity, how it arrived, who is running
  it, and what it did once running.
type: detection
detection_id: 9ef27c24-4903-4192-881a-3adde7ff92a5
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the alerting process carry the "Remote Utilities" Product header while running under a non-canonical image name?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when the PE Product field equals "Remote Utilities" AND the image name is not the canonical rutserv.exe or rfusclient.exe. Review the Product field and the on-disk image name together to confirm the renamed-binary mismatch the rule keys on.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Product
- question: What is the actual identity of this binary based on its metadata and hash?
  context: A renamed binary keeps its original PE metadata. The image path is the name on disk; OriginalFileName and Product reflect the real tool (Remote Utilities). Compare the two to confirm the rename, and use the signing details and hash to determine whether this is the legitimately-signed Remote Utilities tool deployed under a different name or a tampered/novel sample worth deeper analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: How did this renamed Remote Utilities binary arrive on the host?
  context: Renamed binaries do not appear spontaneously -- they are copied, downloaded, or dropped by another process. Tracing the file-creation event for this binary's name reveals the delivery mechanism. The Image field on the file-creation event identifies which process wrote it; a user-writable destination (Downloads, Temp, ProgramData, AppData) points to download or extraction, while a system path may indicate compromise of a privileged process. The canonical install location for Remote Utilities is under Program Files; placement elsewhere is itself a deviation.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What did this renamed Remote Utilities binary do -- decode its command-line arguments and any configuration flags.
  context: The full command line reveals how the remote-access tool was invoked -- silent/unattended install switches, configuration or settings-import flags, a server/host ID to call back to, or a session password set on the command line. Decode every argument to understand whether this is an interactive install or an automated, pre-configured deployment. This query returns all executions of this binary on the host within the window, which for a multi-stage install (service install followed by client launch) may span several sequential invocations.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What did this binary do after execution, and is the same renamed binary present on other hosts?
  context: The purpose of renaming the binary is to evade detection while performing its remote-access function. Examining the child processes, file operations, and outbound connections from the renamed binary reveals its actual objective -- remote control, file transfer, persistence install, or hands-on-keyboard recon. The same renamed binary appearing on multiple hosts points to deliberate distribution rather than an isolated install.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What process spawned this renamed binary, and is that parent chain expected?
  context: The parent process reveals how the tool was launched. A legitimate IT deployment is typically launched from an installer, a management agent, or an interactive shell under explorer.exe. Launch from a script interpreter (wscript.exe, cscript.exe, mshta.exe), an Office application, or a remote-execution surface (wmiprvse.exe, wsmprovhost.exe) points to automated, possibly unauthorized deployment.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Is this user expected to install or run remote-access tooling on this host?
  context: IT staff and managed-services operators legitimately deploy remote-management tools; standard users rarely install Remote Utilities under a renamed binary. The user's role and typical behavior determine whether this is sanctioned remote administration or unauthorized remote access. Confirm whether the account is an administrator, help desk, or a standard user who would have no reason to run this tool.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: Did reconnaissance commands run on this host around the same time?
  context: Remote-access tooling is often a foothold from which an operator enumerates the environment. Multiple reconnaissance commands in rapid succession -- whoami, ipconfig, net user, systeminfo, nltest -- is a signature of post-access enumeration. Their presence near the renamed-binary execution shifts the disposition from a benign remote-support session toward hands-on-keyboard activity.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: What files or directories did this binary touch that could indicate data collection?
  context: Remote-access tooling is frequently used to stage and pull data off a host. The files this binary writes or reads reveal whether it is collecting specific document types, sensitive directories, or broad wildcards. The scope of targeted data determines the severity of potential data loss and which business units may need to be notified.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: Were archive or output files created by this binary that could indicate data staging?
  context: Data staging typically involves writing a local archive or export, then moving it toward an exfiltration path. Checking the files this binary created -- archives, exports, or copies -- reveals whether collected data was staged for transfer. Pair this with outbound network activity from the same host to identify whether staged data left the environment over a cloud upload, removable media, or an external server.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was a session password or encryption applied through this binary's command line?
  context: Remote Utilities can take a session/access password on the command line, and staged archives are often password-protected to defeat content inspection. Command-line flags that set a password or encrypt output indicate deliberate access control or obfuscation. Re-read the alerting command line specifically for password or encryption arguments; note that some tools accept passwords via stdin or a config file, which will not appear in CommandLine.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Product: Remote Utilities
      filter:
        Image|endswith:
        - \rutserv.exe
        - \rfusclient.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Product: Remote Utilities
      filter:
        Image|endswith:
        - \rutserv.exe
        - \rfusclient.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the same account drove remote-access activity on multiple endpoints. If the same user triggered comparable activity elsewhere in the same window, the scope of the access may be larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Product: Remote Utilities
      filter:
        Image|endswith:
        - \rutserv.exe
        - \rfusclient.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: When this host has previously fired this renamed-RU pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even sanctioned remote tooling deployed under a renamed binary can recur on a host. The query mirrors the rule's selection structure scoped to this host, so the resulting parent/user distribution reflects how this specific firing pattern has historically run here -- not generic binary usage. A new parent process, an unexpected user account, or an unusual command-line structure relative to that history is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Product: Remote Utilities
      filter:
        Image|endswith:
        - \rutserv.exe
        - \rfusclient.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this renamed-RU pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this firing pattern rather than generic usage of the binary. Many hosts firing the same pattern points to scripted deployment or managed-services automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Product: Remote Utilities
      filter:
        Image|endswith:
        - \rutserv.exe
        - \rfusclient.exe
      condition: selection and not filter
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- defense tampering, reconnaissance, or credential access -- may reveal the stages that preceded the deployment of this remote-access tool and help reconstruct the full timeline. A renamed remote-access binary appearing after prior suspicious activity points to an operator establishing or re-establishing control.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
