name: Suspicious BitLocker Access Agent Update Utility Execution
id: 247c33dd-60d4-4de8-916d-7d6e1579d839
description: |
  Detects baaupdate.exe (the BitLocker Access Agent Update Utility) spawning a command interpreter,
  script host, or system binary such as bitsadmin.exe, cmd.exe, powershell.exe, rundll32.exe,
  regsvr32.exe, mshta.exe, wmic.exe, or schtasks.exe. baaupdate.exe is not a normal parent for these
  binaries; this parent-child relationship is associated with lateral movement that abuses BitLocker
  DCOM interfaces together with COM hijacking, where a DLL is dropped to a target and triggered through
  a hijacked COM/DCOM interface so code runs inside a trusted signed process or a freshly spawned child.
  Investigation should confirm what command the child ran, what loaded baaupdate.exe, whether a DLL was
  written and loaded around the same time, and whether remote authentication or DCOM activity correlates
  with the spawn.
type: detection
detection_id: 9f38c1db-e2ae-40bf-81d0-5b68f73fb512
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Did baaupdate.exe spawn one of the command interpreters or system binaries this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the
    triggering event. The rule fires when a process whose parent image ends in baaupdate.exe spawns a
    child whose image ends in bitsadmin.exe, cmd.exe, cscript.exe, mshta.exe, powershell_ise.exe,
    powershell.exe, regsvr32.exe, rundll32.exe, schtasks.exe, wmic.exe, or wscript.exe. Verify both the
    parent and the child image against this list.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
- question: Is this user and host expected to be running BitLocker update tooling that spawns these binaries?
  context: Legitimate BitLocker servicing rarely launches command interpreters or LOLBins as children.
    Knowing whether the host is a managed endpoint where BitLocker tooling runs, and whether the user is
    an administrator performing maintenance, is often the fastest way to separate routine operations from
    abuse of the parent process.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What started baaupdate.exe, and is that grandparent chain expected?
  context: The parent-child relationship is the core signal for this detection. baaupdate.exe being driven
    to spawn a command interpreter suggests it was invoked or hijacked rather than running as a routine
    update. Tracing what spawned baaupdate.exe itself reveals whether the chain is a legitimate servicing
    flow or a remote/COM trigger.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did this same baaupdate.exe instance spawn?
  context: If baaupdate.exe spawned the detected child, it may have spawned others. Examining siblings of
    the same parent instance reveals the full scope of activity initiated through this execution chain;
    multiple LOLBin or interpreter children from the same parent points to orchestrated activity.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What did the child binary actually do? Decode its full command line and any arguments.
  context: The triggering event confirms which binary ran, but the operational purpose lives in the
    arguments. Decode any flags, encoded content, file paths, URLs, DLL entry points, or remote targets.
    For proxy-execution binaries such as rundll32.exe and regsvr32.exe, identify the DLL and entry point;
    for bitsadmin.exe identify any transfer source and destination; for powershell.exe decode encoded
    payloads. This query returns every execution of this binary on the host within a few minutes of the
    alert, so multi-step operations that span sequential invocations appear together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Was the child binary executed from its expected system path?
  context: The detected binaries normally live in System32 or SysWOW64. A copy running from a user-writable
    or temp directory may indicate the binary was relocated or renamed to evade path-based allowlists, and
    is more suspicious than the same binary in its standard location.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Does baaupdate.exe on this host normally spawn this child binary?
  context: Some parent-child relationships are routine while others are inherently unusual. baaupdate.exe
    spawning a command interpreter or LOLBin should be rare to nonexistent on a typical host. Zero or very
    low historical counts for this specific parent-child pairing indicate a novel spawning relationship
    worth treating as suspicious.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: Was a DLL written or loaded into a trusted process on this host around the time of the alert?
  context: DCOM-based lateral movement combined with COM hijacking drops a DLL to the target and triggers
    it through a hijacked COM/DCOM interface, often so the code executes inside an already-trusted signed
    process rather than a freshly spawned child. Reviewing module loads from temporary or user-writable
    paths around the alert surfaces the implanted DLL even when no obvious child process was created. If
    module-load telemetry is not collected in this environment, treat zero results as a visibility gap.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_paths:
        ImageLoaded|contains:
          - '\Temp\'
          - '\Users\'
          - '\ProgramData\'
          - '\Windows\Temp\'
      condition: selection and selection_paths
    fields:
      - ImageLoaded
      - Image
- question: Was there a remote logon to this host around the time of the spawn, and from which account and source?
  context: DCOM invocation across hosts authenticates first, so a network or explicit-credential logon
    shortly before the parent process spawned indicates the activity was driven remotely rather than by a
    local user. Network logons (type 3) and explicit-credential logons correlate the remote trigger to an
    account and source address. If Windows Security logs are not collected in this environment, treat zero
    results as a visibility gap.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 4624
          - 4648
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetUserName
      - IpAddress
      - LogonType
      - EventID
- question: What host initiated the remote connection to this system, and is it an expected administrative source?
  context: Lateral movement requires a source and a destination. DCOM uses the RPC endpoint mapper on port
    135 plus dynamic high ports; SMB and remote management ports often accompany it. Identifying the
    originating address reveals whether the connection came from a known admin jump box or an unexpected,
    possibly compromised, source being used as a pivot.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 135
          - 445
          - 5985
          - 5986
          - 3389
      condition: selection
    fields:
      - SourceIp
      - DestinationPort
- question: What processes ran on this host shortly after the spawn, and under which accounts?
  context: Lateral movement is a means to an end. Examining processes that ran in the window after the
    detected execution reveals the operator's objectives on this host -- additional tooling, credential
    access, reconnaissance, or further movement. Grouping by user and image helps separate the relevant
    follow-on activity from routine background processes.
  range: +30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - Image
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \baaupdate.exe
        Image|endswith:
        - \bitsadmin.exe
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell_ise.exe
        - \powershell.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \schtasks.exe
        - \wmic.exe
        - \wscript.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \baaupdate.exe
        Image|endswith:
        - \bitsadmin.exe
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell_ise.exe
        - \powershell.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \schtasks.exe
        - \wmic.exe
        - \wscript.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- defense tampering,
    reconnaissance, credential access, or remote-service activity -- may reveal the stages that preceded
    this execution and help reconstruct the timeline of how the parent came to spawn the child.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: How often has this host fired the baaupdate.exe-to-LOLBin pattern over the past 90 days, and what command-line structures are typical?
  context: A pattern with no prior history on a host is more suspicious than one seen regularly under
    stable conditions. The query mirrors the rule's selection scoped to this host, so the count reflects
    this rule's specific firing pattern rather than generic usage of the child binaries. The command-line
    projection lets the typical invocation patterns be compared against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \baaupdate.exe
        Image|endswith:
        - \bitsadmin.exe
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell_ise.exe
        - \powershell.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \schtasks.exe
        - \wmic.exe
        - \wscript.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - CommandLine
- question: Is the baaupdate.exe-to-child spawning pattern occurring on other hosts in the environment?
  context: The same parent-child relationship appearing on multiple hosts may indicate lateral movement
    across the environment or a coordinated push, while a single occurrence is more likely targeted.
    Enterprise-wide comparison helps calibrate scope and identify additional affected systems.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
