name: Tamper With Sophos AV Registry Keys
id: 05938977-5e0e-44c5-a676-6593f68295b7
description: |
  Detects a registry write that sets a Sophos tamper-protection flag to disabled: a TargetObject
  containing one of the Sophos self-protection settings (SAVEnabled or SEDEnabled under
  Sophos Endpoint Defense\TamperProtection\Config, or Enabled under Sophos\SAVService\TamperProtection)
  written with the value DWORD (0x00000000). A zero turns off the guard that normally prevents the
  antivirus service, its files, and its configuration from being stopped or removed. Sophos may
  legitimately toggle these values during its own updates or maintenance, so confirm whether the
  change was sanctioned. When it is not, disabling endpoint self-protection is typically a precursor
  to running additional tooling, accessing credentials, or carrying out destructive actions that the
  antivirus would otherwise block; investigate which flag was cleared, which process and parent
  performed the write, whether protection was restored afterward, and what activity followed on the
  now-unprotected host.
type: detection
detection_id: 9f4662ac-17ca-43aa-8f12-5d7b989d0101
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Do the registry key path and value data on the alert match a Sophos tamper-protection flag being set to disabled?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a
    registry value whose path contains a Sophos tamper-protection setting (SAVEnabled, SEDEnabled, or
    the SAVService Enabled flag) is written AND the value data is DWORD (0x00000000). Both conditions
    must hold: the key must be one of the Sophos self-protection settings and the value must be zero,
    which turns the corresponding protection off. Review the exact TargetObject and Details on the
    triggering event to confirm.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to change Sophos tamper-protection settings?
  context: >-
    Sophos tamper protection exists to block changes to the antivirus configuration, so a disable write
    should originate only from a sanctioned management action or a documented maintenance task. Knowing
    whether the writing account and host function match any approved change is the fastest way to
    separate legitimate administration from an actor turning off endpoint defenses. User attribution is
    present on roughly 94% of endpoint registry events; when it is a machine account or SYSTEM, pivot on
    the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which Sophos tamper-protection value was modified, and why is this key a defense-evasion location?
  context: >-
    The three keys the rule watches control Sophos self-protection: SAVEnabled and SEDEnabled under
    Sophos Endpoint Defense\TamperProtection\Config, and Enabled under Sophos\SAVService\TamperProtection.
    Setting any of them to zero disables the guard that normally prevents the antivirus service and its
    files from being stopped or removed. Confirming the exact key and the writing process establishes
    that this is a self-protection bypass rather than an unrelated configuration edit.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value was written to the tamper-protection key, and does it disable the protection?
  context: >-
    The Details field carries the value data. DWORD (0x00000000) sets the protection flag to off; a
    non-zero value would leave it enabled. A zero here is the operative change - it removes tamper
    protection so the antivirus service and its configuration can subsequently be stopped, uninstalled,
    or reconfigured. Details is present on roughly 79% of registry modifications and should be populated
    for this DWORD value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Which Sophos control was targeted, and what command or process performed the change?
  context: >-
    Different tamper targets carry different impact. Disabling SAVEnabled or the SAVService Enabled flag
    removes on-access antivirus self-protection; SEDEnabled governs the broader Endpoint Defense guard.
    Pivoting to the writing process shows whether a reg.exe or PowerShell command performed the write
    and what the full command was, which reveals the tool used and whether more than one protection flag
    was cleared in the same action.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process wrote the tamper-protection value, and what launched it?
  context: >-
    The registry event carries no command line of its own, so pivot by ProcessGuid to the writing
    process to read its Image, full command, and parent. A reg.exe, powershell.exe, or cmd.exe write
    launched from a script host, an Office application, an unsigned binary, or a remote-execution parent
    points to the change being staged by an intruder rather than a deliberate administrator action. The
    parent chain distinguishes a scripted disable from an interactive console command.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Is Sophos tamper protection currently restored, or is the host still running with protection disabled?
  context: >-
    The tamper flag may have been cleared briefly for a single action or left off persistently. Checking
    the current state of Sophos protection on the host reveals whether the endpoint remains exposed. If
    tamper protection and the antivirus service are still disabled, the control should be re-enabled
    before further investigation. Current status is confirmed from the endpoint management console or
    direct host inspection rather than from the alert alone.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: After this write, was the tamper-protection value re-enabled or modified again on this host?
  context: >-
    Registry value deletions are not observable in this telemetry, so durability is judged from the key's
    re-modification history rather than from a delete event. A later write that sets the flag back to a
    non-zero value means protection was restored - either by the antivirus itself, by an administrator, or
    by the actor covering their tracks; the flag staying at zero means the host remains unprotected.
    Compare the Details values written to this key over the following window.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What activity occurred on this host after tamper protection was disabled?
  context: >-
    Endpoint defenses are usually disabled to enable an action that would otherwise be blocked or logged -
    running additional tooling, accessing credentials, deploying an implant, or destroying backups.
    Examining process activity in the window immediately after the write reveals what the disable was
    meant to permit. A burst of new processes right after the protection change points to the operation
    the tampering enabled.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense-tampering actions performed on this host?
  context: >-
    An actor who disables one protection often disables several - stopping antivirus or endpoint services,
    clearing event logs, deleting shadow copies, or changing firewall rules to build maximum coverage.
    Finding several tampering actions from the same user or parent process within a short window indicates
    that multiple controls were disabled as part of the same operation rather than an isolated setting
    change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: What other registry modifications were made on this host in the same window?
  context: >-
    Actors who disable antivirus self-protection through the registry frequently make other registry
    changes in the same session - additional tamper or policy edits, service configuration changes, or
    persistence keys. Clustering the registry writes on this host in a short window around the alert
    reveals the full scope of the changes and which process made them. The triggering key appears in the
    results; the signal is what else was modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has this tamper-protection key been modified before on this host?
  context: >-
    Sophos self-protection settings should change rarely and only through the product's own maintenance or
    a sanctioned administrative action, so a history with no prior writes makes this a first-time change and
    raises its weight. A history of periodic writes may instead reflect the antivirus updating its own
    configuration. Compare the historical Details values to see whether the flag has been toggled before or
    whether this disable is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was the same tamper-protection value modified on other hosts in the environment?
  context: >-
    The same disable write across many hosts suggests a broad tool run, a mis-scoped deployment, or lateral
    spread; the same write confined to one host suggests a targeted action. Compare the Details values and
    writing process across hosts to see whether they all clear the same Sophos flag, which separates a single
    operation from repeated use of the technique across the environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Defense tampering rarely happens in isolation. Aggregating process activity in a tight window around the
    alert surfaces what led up to the tamper write and what ran immediately after. Novel parent-child pairs
    stand out at low counts against high-count routine telemetry, which is what points to the tool that
    performed the disable and any follow-on actions.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, credential access, or other defense tampering -
    may reveal the stages that preceded this change and help reconstruct the timeline. Disabling endpoint
    protection is typically a means to an end, so prior alerts help place this write within a larger
    sequence of activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Disabling endpoint protection is frequently paired with establishing a foothold that survives reboot.
    Scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions created by schtasks.exe,
    sc.exe, reg.exe, bitsadmin.exe, or wmic.exe near the tamper write indicate the actor used the
    unprotected window to install persistence rather than acting in isolation.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely - dropping an executable or script into
    a Startup folder or a path referenced by a registry Run key achieves persistence without invoking
    schtasks, sc, or reg. File writes to these locations near the tamper write indicate a payload
    established a persistence mechanism on disk while protection was off.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
