name: Potentially Suspicious ASP.NET Compilation Via AspNetCompiler
id: 5747246f-c460-44c8-8502-fd1c3c30e368
description: |
  Detects execution of the Microsoft-signed aspnet_compiler.exe from a .NET Framework
  directory with a command line that references a user-writable or staging path (Public,
  AppData Temp/Roaming, :\Temp, Windows\Temp, or the Tasks directories). The rule fires
  when ALL of these match together: the Image is a Framework/Framework64/FrameworkArm path
  ending in aspnet_compiler.exe AND the CommandLine contains one of those paths. aspnet_compiler.exe
  is a signed developer utility that can be abused to compile and execute attacker-supplied
  code (a web.config buildProvider that loads a local DLL), giving application-control bypass
  and proxied code execution. Legitimate use is largely confined to developer/build systems;
  off-host invocation pointed at a staging directory is the signal to investigate. The
  investigation should confirm the path the command pointed at, identify the parent that
  launched it, and look for the surrounding chain — a dropped DLL or PE, a spawned child
  process, or outbound network activity.
type: detection
detection_id: 9f50fe98-fe5c-4a2d-86c7-fad7f63ed622
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the alerting aspnet_compiler.exe command point at one of the user-writable or staging paths this rule detects?
  context: Confirm the alert is a true positive before investing time. The rule fires only when the Image is a .NET Framework
    aspnet_compiler.exe AND the command line references a staging path (\Users\Public\, AppData Temp/Roaming, :\Temp, Windows\Temp,
    or the Tasks directories). Review the exact command line and the project/source path it was given to compile.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to compile .NET projects with aspnet_compiler.exe?
  context: aspnet_compiler.exe is a developer/build utility. On a developer workstation or a CI/build server run by a build
    service account, an invocation may be routine; on a general-purpose endpoint or under an interactive user who does no
    .NET development, the same command pointed at a staging directory is the deviation. Knowing the host function and user
    role is often the fastest triage path.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this aspnet_compiler.exe invocation compile? Decode the full command line and identify the source/project path.
  context: The full command line reveals the operation. aspnet_compiler.exe abuse uses a -p (physical/project path) pointing
    at a directory the operator controls and a -v/-f layout; the directory holds a web.config with a buildProvider entry and
    a custom DLL that gets loaded during compilation of a source file. Decode each flag, identify the -p source path, and note
    whether it sits in one of the staging locations the rule matched.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned aspnet_compiler.exe and is that parent chain expected for a build tool?
  context: The parent reveals how the tool was invoked. A build/CI orchestrator, an IDE, or an interactive developer shell
    is the expected launcher; mshta.exe, wscript.exe, an Office application, a web server worker process, or a shell spawned
    from a download is the kind of parent that turns this into proxied code execution rather than a real build.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did aspnet_compiler.exe spawn afterward?
  context: The children reveal the actual impact. A legitimate compile spawns Framework helpers (csc.exe, vbc.exe) and exits;
    abuse frequently leads to high-risk children such as powershell.exe, cmd.exe, rundll32.exe, regsvr32.exe, wscript.exe,
    or mshta.exe being launched from the compiled code. Any such child is a strong reason to treat the compilation as a payload
    delivery step.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did aspnet_compiler.exe load an unsigned or user-writable DLL around the time of the alert?
  context: The documented abuse path tricks aspnet_compiler.exe into loading an attacker-supplied DLL (referenced by a web.config
    buildProvider) during compilation. A module loaded out of a user-writable or staging directory, or one that is unsigned
    or has an invalid signature, is the loaded payload. If image-load (module) telemetry is not collected in this environment,
    treat zero results as a visibility gap rather than evidence nothing loaded.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - SignatureStatus
- question: Was a DLL or PE written into one of the staging paths on this host shortly before or after the alert?
  context: The abuse requires a custom DLL (and a web.config plus a source file) staged in a directory the operator controls,
    and the rule matched the command line against exactly those staging paths. A file write of a .dll, .exe, or .config into
    Public, AppData Temp/Roaming, :\Temp, Windows\Temp, or the Tasks directories around the alert time identifies the dropped
    payload and the directory structure used.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_path:
        TargetFilename|contains:
          - \Users\Public\
          - \AppData\Local\Temp\
          - \AppData\Local\Roaming\
          - :\Temp\
          - :\Windows\Temp\
          - :\Windows\System32\Tasks\
          - :\Windows\Tasks\
      selection_ext:
        TargetFilename|endswith:
          - .dll
          - .exe
          - .config
          - .wtf
      condition: selection_host and selection_path and selection_ext
    fields:
      - TargetFilename
      - Image
      - User
- question: Did this host make outbound network connections shortly after the aspnet_compiler.exe execution?
  context: Proxied execution via a developer utility is often followed by immediate egress — the compiled payload reaching
    out to download a second stage or to call back. Connections in the minutes after the alert, especially to rare or external
    destinations, tie the compilation to a network objective. Exclude known system processes when scanning; focus on connections
    initiated by aspnet_compiler.exe itself or its children.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      filter_system:
        Image|startswith:
          - C:\Windows\System32\
          - C:\Windows\SysWOW64\
      condition: selection and not filter_system
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Does this host normally run aspnet_compiler.exe at all?
  context: A process never seen on a host is more suspicious than one that runs regularly. On a non-developer endpoint the
    historical count for aspnet_compiler.exe should be zero or near-zero; a build server will show steady use. A first-time
    or rare execution paired with a staging-path command line raises the priority.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this rule's staging-path pattern, what parents and users normally drove it, and does the current alert fit?
  context: The query mirrors the rule's full selection (Framework aspnet_compiler.exe with a staging-path command line) scoped
    to this host, so the parent/user distribution reflects how this specific firing pattern has run here before — not generic
    compiler usage. A new parent process, an unexpected user account, or a first-ever match is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains:
        - :\Windows\Microsoft.NET\Framework\
        - :\Windows\Microsoft.NET\Framework64\
        - :\Windows\Microsoft.NET\FrameworkArm\
        - :\Windows\Microsoft.NET\FrameworkArm64\
        Image|endswith: \aspnet_compiler.exe
        CommandLine|contains:
        - \Users\Public\
        - \AppData\Local\Temp\
        - \AppData\Local\Roaming\
        - :\Temp\
        - :\Windows\Temp\
        - :\Windows\System32\Tasks\
        - :\Windows\Tasks\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains:
        - :\Windows\Microsoft.NET\Framework\
        - :\Windows\Microsoft.NET\Framework64\
        - :\Windows\Microsoft.NET\FrameworkArm\
        - :\Windows\Microsoft.NET\FrameworkArm64\
        Image|endswith: \aspnet_compiler.exe
        CommandLine|contains:
        - \Users\Public\
        - \AppData\Local\Temp\
        - \AppData\Local\Roaming\
        - :\Temp\
        - :\Windows\Temp\
        - :\Windows\System32\Tasks\
        - :\Windows\Tasks\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains:
        - :\Windows\Microsoft.NET\Framework\
        - :\Windows\Microsoft.NET\Framework64\
        - :\Windows\Microsoft.NET\FrameworkArm\
        - :\Windows\Microsoft.NET\FrameworkArm64\
        Image|endswith: \aspnet_compiler.exe
        CommandLine|contains:
        - \Users\Public\
        - \AppData\Local\Temp\
        - \AppData\Local\Roaming\
        - :\Temp\
        - :\Windows\Temp\
        - :\Windows\System32\Tasks\
        - :\Windows\Tasks\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or multi-endpoint activity. If the same user
    triggered similar compilation or staging activity on other hosts, the scope is broader than this one alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains:
        - :\Windows\Microsoft.NET\Framework\
        - :\Windows\Microsoft.NET\Framework64\
        - :\Windows\Microsoft.NET\FrameworkArm\
        - :\Windows\Microsoft.NET\FrameworkArm64\
        Image|endswith: \aspnet_compiler.exe
        CommandLine|contains:
        - \Users\Public\
        - \AppData\Local\Temp\
        - \AppData\Local\Roaming\
        - :\Temp\
        - :\Windows\Temp\
        - :\Windows\System32\Tasks\
        - :\Windows\Tasks\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to
    the compilation, what happened after, and whether it is part of a larger sequence. Aggregating by Image and ParentImage
    collapses repetitive agent noise while novel parent-child pairs stand out at low counts.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts fired this rule's staging-path pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, giving a fleet-wide count of this specific firing
    pattern rather than generic aspnet_compiler.exe usage. Many hosts firing the same pattern points to scripted deployment
    or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains:
        - :\Windows\Microsoft.NET\Framework\
        - :\Windows\Microsoft.NET\Framework64\
        - :\Windows\Microsoft.NET\FrameworkArm\
        - :\Windows\Microsoft.NET\FrameworkArm64\
        Image|endswith: \aspnet_compiler.exe
        CommandLine|contains:
        - \Users\Public\
        - \AppData\Local\Temp\
        - \AppData\Local\Roaming\
        - :\Temp\
        - :\Windows\Temp\
        - :\Windows\System32\Tasks\
        - :\Windows\Tasks\
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access, or a download — may
    reveal the stages that preceded the compilation and help reconstruct the timeline. The alert sequence often tells the
    operation's story.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
