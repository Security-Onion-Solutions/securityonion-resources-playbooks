name: HackTool - SharpLDAPmonitor Execution
id: c7cae105-0394-4ea7-be52-bad4a9f7697a
description: |
  Detects execution of SharpLDAPmonitor, a utility that polls a domain controller over LDAP and
  reports live changes to directory objects (creation, deletion, attribute modification). The rule
  fires when EITHER the process image or original filename resolves to SharpLDAPmonitor.exe, OR the
  command line carries all of the tool's authentication flags (/user:, /pass:, /dcip:) together.
  Legitimately the tool is a sysadmin diagnostic, but it is built for operators who want to watch the
  effect of directory tampering, time network poisoning to user logons, or detect account lockout
  during password-spray. Because it is a passive read-only poller, its only signal is the steady,
  repeated LDAP querying pattern itself; the investigation should determine who ran it, against which
  DC, whether the run is authorized, and what other discovery or hands-on activity surrounds it.
type: detection
detection_id: 9f8fc146-1d1a-4dbf-b8fd-dfae15e08541
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does this event match what the rule detects — the SharpLDAPmonitor binary, or a command
    line carrying all three of the /user, /pass, and /dcip flags?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires
    when EITHER the image or original filename is SharpLDAPmonitor.exe, OR the command line contains
    all three of the /user, /pass, and /dcip flags together. Note which branch fired — a rename-to-something-else
    that still carries the three flags is a deliberate evasion attempt and changes how much weight the
    binary-name questions carry downstream.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this SharpLDAPmonitor execution part of an authorized penetration test or red team
    engagement?
  context: LDAP monitoring tools are used in authorized assessments to validate that an exploit changed
    a target attribute or to watch for account lockout during password-spray. Before investing
    investigation time, check whether a pentest or red team exercise is currently active on this host
    or network segment. An authorized engagement with matching tool usage and timing resolves the alert
    without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What target and authentication did the command line specify — which DC via /dcip, which
    account via /user, and any delay, page-size, or search-base tuning?
  context: The tool is driven entirely by its flags. The /dcip flag names the domain controller being
    polled, /user names the account whose credentials are in use, and tuning options like a randomized delay,
    custom page size, or a scoped search base reveal an operator deliberately shaping the poll to avoid
    bursty detection. Decode the full argument set to understand the scope and target of the monitoring.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Across the SharpLDAPmonitor runs on this host in the surrounding window, what was the full
    set of command lines and working directories?
  context: A single logical monitoring session may span multiple sequential invocations as the operator
    retunes the poll (delay, page size, search base) or retargets a different naming context. Pulling
    every execution of the binary on this host within the window shows the full operation rather than
    just the one event that tripped the rule, including the working directory the tool was launched from.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Did SharpLDAPmonitor write a logfile or other output to disk on this host?
  context: The tool supports logfile output, so a successful monitoring run may leave a capture of the
    directory changes it observed on disk. Files written by the tool's process confirm execution and
    reveal what the operator was collecting even after the process exits. Look for output paths under
    the user's profile, temp, or wherever the working directory placed them.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Is this user expected to run domain directory monitoring or LDAP enumeration tooling?
  context: Domain administrators and IT staff legitimately query and watch directory objects for
    troubleshooting, but a standard user or a service account that has no directory-administration role
    polling a DC over LDAP is anomalous. The user's role and typical toolset determine whether this run
    is routine or hands-on-keyboard reconnaissance. The tool can only see attributes the running
    account can read, so the account also bounds what was exposed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: What process spawned SharpLDAPmonitor, and is that parent chain normal for this kind of tool?
  context: A directory-monitoring tool launched from cmd.exe under explorer.exe (an operator opened a
    prompt) reads very differently from one spawned by a script interpreter, a download cradle, or
    wmiprvse.exe / wsmprovhost.exe (remote execution). An unusual parent points to automated
    post-exploitation rather than interactive administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: What spawned the parent process, and what else did that parent launch on this host?
  context: The immediate parent is visible in the alert; walking one level further up reveals how the
    operator arrived on the host. A parent that itself was launched from a remote-execution service,
    a script host, or a freshly written binary, or that also spawned other discovery or credential
    tooling, frames this monitoring run as one stage of a larger operation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single discovery action may be legitimate troubleshooting, but multiple reconnaissance
    commands in rapid succession — whoami, net user, nltest, dsquery, adfind — is a signature of
    post-compromise enumeration. Directory monitoring paired with a burst of native discovery binaries
    indicates an operator mapping the environment before the next stage.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: What child processes did SharpLDAPmonitor spawn afterward?
  context: The tool itself is a passive read-only poller, so it should not spawn additional processes.
    Any children — cmd.exe, powershell.exe, certutil.exe, or other tooling launched from it — would be
    unexpected and point to the operator chaining the monitoring run into further action.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \SharpLDAPmonitor.exe
      - OriginalFileName: SharpLDAPmonitor.exe
      selection_cli:
        CommandLine|contains|all:
        - '/user:'
        - '/pass:'
        - '/dcip:'
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \SharpLDAPmonitor.exe
      - OriginalFileName: SharpLDAPmonitor.exe
      selection_cli:
        CommandLine|contains|all:
        - '/user:'
        - '/pass:'
        - '/dcip:'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning
    multiple endpoints. If the same account triggered directory monitoring or other tooling on several
    hosts, the scope of the operation may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \SharpLDAPmonitor.exe
      - OriginalFileName: SharpLDAPmonitor.exe
      selection_cli:
        CommandLine|contains|all:
        - '/user:'
        - '/pass:'
        - '/dcip:'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the process activity surrounding the alert
    reveals what led to it and what followed — reconnaissance, privilege escalation, credential access,
    or persistence — and whether the directory monitoring is one step in a larger sequence on this host.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: When this host has previously fired the rule's pattern, what parents and users normally
    drive that activity, and does the current alert fit?
  context: The query mirrors the rule's selection structure scoped to this host, so the resulting
    parent/user distribution reflects how the rule's specific firing pattern — not generic binary
    usage — has historically run here. A new parent process, an unexpected account, or an unusual
    command-line structure relative to that history is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \SharpLDAPmonitor.exe
      - OriginalFileName: SharpLDAPmonitor.exe
      selection_cli:
        CommandLine|contains|all:
        - '/user:'
        - '/pass:'
        - '/dcip:'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host
    distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of the rule's firing pattern rather than generic use of the binary. Many hosts
    firing the same pattern points to scripted deployment or vendor automation; one host or a small
    unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \SharpLDAPmonitor.exe
      - OriginalFileName: SharpLDAPmonitor.exe
      selection_cli:
        CommandLine|contains|all:
        - '/user:'
        - '/pass:'
        - '/dcip:'
      condition: 1 of selection_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering,
    reconnaissance, credential access — may reveal the attack stages that preceded the directory
    monitoring and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
