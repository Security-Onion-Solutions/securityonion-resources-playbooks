name: COLDSTEEL RAT Service Persistence Execution
id: ca7fb6ae-051f-4346-a595-7226ade8ee22
description: |
  Detects a process whose Image ends in \svchost.exe AND whose CommandLine ends with one of three
  non-standard service group flags: ' -k msupdate', ' -k msupdate2', or ' -k alg'. Windows starts
  svchost.exe with a -k flag naming a service group defined under the Svchost registry key; the stock
  groups are names like netsvcs, LocalService, NetworkService, and DcomLaunch. COLDSTEEL is a Windows
  remote access tool that runs as a svchost-hosted service, registering its own service group and
  pointing a ServiceDll at its payload, which gives it a resident process that survives reboot and
  executes under a normal-looking system binary. The investigation should establish which service
  registered this group, what binary or DLL path it points at, and what the hosted process did once
  it was running.
type: detection
detection_id: 9f9cd389-cea0-4142-bf1a-a3fd424abedd
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: >-
    Does the alerting svchost.exe command line end with one of the non-standard service group flags
    this rule detects?
  context: >-
    Confirm the alert before investing investigation time. The rule fires only when the Image ends in
    \svchost.exe and the CommandLine ends with ' -k msupdate', ' -k msupdate2', or ' -k alg'. None of
    those three are stock Windows service groups, so read the exact command line and note which of the
    three fired — the group name is the key you will use to find the service that registered it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: >-
    Is this host expected to run a service hosted under a custom svchost service group?
  context: >-
    Legitimate software occasionally registers a svchost-hosted service, but the group name is
    normally one of the stock Windows groups, and third-party services far more often run from their
    own binary than from a svchost group. Establish the host role and the identity the alert fired
    under before treating the group name as evidence either way.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: >-
    What was the full command line of this svchost execution, and did the same service group flags run
    more than once on this host in the alert window?
  context: >-
    The full command line names the service group and any additional switches passed to the service
    host. Repeat executions of the same group in a short window suggest a service that is crashing and
    being restarted by the service control manager, which is common for an injected or partially
    working payload. The query is filtered to the three flags the rule matches, so ordinary svchost
    activity on the host is excluded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|endswith:
          - ' -k msupdate'
          - ' -k msupdate2'
          - ' -k alg'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: >-
    Was a service installed on this host recently, and what binary or DLL path was registered for it?
  context: >-
    A svchost-hosted service must first be installed, which writes a service-install record to the
    System event log naming the service, its image path, its start type, and the account it runs
    under. A service whose ImagePath is svchost.exe with a group name that is not a stock Windows
    group is the registration that produced this execution. A start type of auto-start is what makes
    the persistence survive reboot. If the System channel is not collected in this environment, treat
    zero results as a visibility gap rather than evidence no service was installed.
  range: -7d
  query: |
    aggregation: false
    logsource:
      product: windows
      service: system
    detection:
      selection:
        EventID: 7045
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - ServiceName
      - ImagePath
      - ServiceType
      - StartType
      - AccountName
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: >-
    Was the Svchost service-group registry key or a service ServiceDll value written around the time
    of the alert, and what path was set?
  context: >-
    Registering a custom svchost group requires adding a value under the Svchost key that lists the
    services in the group, and the hosted service itself needs a ServiceDll value under its own
    Parameters key pointing at the DLL svchost will load. Those two writes are the concrete artifacts
    the registration leaves behind, and the ServiceDll value is the payload path. A ServiceDll
    resolving outside System32 — a user-writable directory, ProgramData, or a temp path — is the
    detail to carry into containment.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\Microsoft\Windows NT\CurrentVersion\Svchost\'
          - '\Parameters\ServiceDll'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - manual_review
- question: >-
    Which DLLs did this svchost instance load, and are they signed and resident in expected system
    paths?
  context: >-
    A svchost-hosted service loads its logic from a ServiceDll rather than its own executable, so the
    module list of this specific process is where the payload becomes visible. Loads carry the
    signature status and hash on the load event itself, so an unsigned module, a module signed by an
    unexpected publisher, or a module loaded from outside System32 can be identified and hashed
    directly from these results.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned this svchost instance, and is that parent chain expected?
  context: >-
    A genuine svchost service host is started by the service control manager, so the parent should be
    services.exe. Any other parent means the process was launched directly rather than by the service
    infrastructure, which is a different situation from a registered service starting normally and
    changes what the group name implies.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What child processes did this svchost instance spawn afterward?
  context: >-
    Remote access tools hosted in a service commonly spawn a command interpreter to give the operator
    an interactive command line, and pipe it over a separate network channel. A svchost service host
    spawning cmd.exe, powershell.exe, or rundll32.exe is not part of normal service startup and points
    at hands-on use of the hosted process. The query is anchored on the alerting process, so it returns
    only children of this instance.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: >-
    When this host has previously fired the rule's pattern, what parents and users normally drive that
    activity, and does the current alert fit that pattern?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the resulting parent and
    user distribution reflects how these specific service group flags have historically run here rather
    than generic svchost usage. Because none of the three groups is a stock Windows group, an empty
    result over 14 days means the service group is new to this host, which is the more common outcome
    and points at a recent registration.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \svchost.exe
        CommandLine|endswith:
        - ' -k msupdate'
        - ' -k msupdate2'
        - ' -k alg'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is that
    account's 90-day history of these service group flags, aggregated by host. Service hosts normally
    run as SYSTEM, LOCAL SERVICE, or NETWORK SERVICE; when the alert fires under such an identity the
    account attributes nothing and the launch-mechanism question carries the weight instead. A named
    interactive account here is itself the deviation.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \svchost.exe
        CommandLine|endswith:
        - ' -k msupdate'
        - ' -k msupdate2'
        - ' -k alg'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: >-
    Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute behavior, and the
    meaningful pivot is the launch mechanism. The query mirrors the rule's selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this
    specific pattern. A parent that already accounts for a large volume of prior events is vendor or
    OS automation; a parent that is new for this pattern is the deviation worth chasing.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \svchost.exe
        CommandLine|endswith:
        - ' -k msupdate'
        - ' -k msupdate2'
        - ' -k alg'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the account's activity across all hosts reveals whether the same identity drove similar
    activity on other endpoints, which changes the scope of the investigation. If the alert fired under
    SYSTEM or another service principal, this query returns routine agent and OS telemetry from every
    host that identity touches and the parent-driven variant is the meaningful answer instead.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: >-
    Did this same parent-driven pattern fire on other hosts in the same window, or is the activity
    isolated to this host?
  context: >-
    Under a service principal, asking what else the user did returns agent telemetry from every host,
    because every host runs SYSTEM-owned agents constantly. The useful question is whether the same
    launch mechanism produced this pattern elsewhere. The query mirrors the rule's selection structure
    scoped to the alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same
    window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \svchost.exe
        CommandLine|endswith:
        - ' -k msupdate'
        - ' -k msupdate2'
        - ' -k alg'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Service registration is rarely the first step on a host — something delivered and ran the payload
    first. Aggregating the surrounding process activity by parent and child collapses repetitive agent
    telemetry into single high-count rows while novel parent-child pairs stand out at low counts. Look
    for a loader such as rundll32.exe, an archive or installer execution, or a remote-execution parent
    in the minutes before the service came up.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: >-
    Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution
    look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of these service group flags rather than generic svchost usage. Because the three groups are
    not stock Windows groups, any second host running the same group is a strong scoping signal: it
    means the same service was registered in more than one place, and every host in the result needs
    the same service and ServiceDll checks as the alerting one.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \svchost.exe
        CommandLine|endswith:
        - ' -k msupdate'
        - ' -k msupdate2'
        - ' -k alg'
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Persistence is normally installed after access is already established, so earlier detections on the
    same host often name the delivery or execution step that preceded the service registration. Look
    for exploitation, script execution, or defense tampering in the hours before, and use the earliest
    detection to bound how long the host has been affected.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    A service is one foothold; backup mechanisms using a different technique are commonly installed
    alongside it. Scheduled tasks, additional service registrations via sc.exe, registry Run keys via
    reg.exe, and WMI subscriptions all show up as command-line tool executions in the same window.
    Several persistence installations clustered in the same timeframe indicate intentional stacking
    rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: >-
    Were files dropped to persistence locations (Startup folders, scheduled-task definitions) on this
    host?
  context: >-
    File-based persistence bypasses command-line detection entirely. Dropping an executable or script
    into a Startup folder, or writing a scheduled-task XML definition directly, achieves persistence
    without running schtasks, sc, or reg. File event monitoring captures these drops even when the
    standard persistence tools are avoided, and a drop in the same window as the service registration
    widens the remediation list.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
