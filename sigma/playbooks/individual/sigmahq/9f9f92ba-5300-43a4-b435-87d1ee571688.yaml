name: Diamond Sleet APT Scheduled Task Creation - Registry
id: 454e98ce-b3b3-4509-a453-33988de052e1
description: |
  Detects the registry evidence of a scheduled task being registered under the Task Scheduler
  TaskCache tree with the task name "Windows TeamCity Settings User Interface". The rule fires
  when a TargetObject under \SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree\
  contains that exact task name, so both conditions must hold together. Diamond Sleet uses a
  scheduled task by this name to persist the ForestTiger backdoor (a Forest64.exe binary in
  C:\ProgramData invoked with a hardcoded key argument), re-launching it at every system start
  after exploitation of the JetBrains TeamCity CVE-2023-42793 remote-code-execution vulnerability.
  Legitimate software does not register a task by this name, so the investigation should confirm
  the task action, identify the process that registered it, determine whether the configured
  binary executed, and establish what else the same operation touched on the host.
type: detection
detection_id: 9f9f92ba-5300-43a4-b435-87d1ee571688
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting registry key sit under the TaskCache tree and carry the task name this rule detects?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires only
    when the written TargetObject is under \SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree\
    AND the path contains the task name "Windows TeamCity Settings User Interface" - both parts must
    match. That TaskCache Tree subkey is created when a scheduled task is registered, so its presence
    is the on-disk trace of the task being installed. Review the exact TargetObject and its value data
    on the triggering event to confirm this is the named-task registration and not an unrelated
    TaskCache write.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to register this scheduled task?
  context: >-
    A scheduled task by this name has no legitimate software owner, so a registration on any host is
    inherently unexpected. Knowing which account and host function are behind the write is the fastest
    way to separate a sanctioned change or test from an implant. User attribution is present on roughly
    94% of endpoint registry events; scheduled-task registration is frequently performed under SYSTEM
    or a service account, so when User is a machine account or missing, pivot on the writing process
    instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What exact TaskCache key and value were written, and why is this a persistence location?
  context: >-
    The Task Scheduler stores each registered task under HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache.
    The Tree subkey holds the task's display path and a GUID index; the matching Tasks\{GUID} subkey
    holds the action (the executable and arguments), triggers, and principal. Creating a Tree entry
    here is how a scheduled task achieves persistence that survives reboots and runs on a defined
    trigger. Confirm the exact key path and the writing process so the investigation is anchored on the
    named-task registration rather than an unrelated TaskCache edit.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What does the task's registered value data hold, and where is the executable it runs recorded?
  context: >-
    The Tree subkey value data is typically the task's GUID index and metadata rather than the command
    it runs; the executable path and arguments live in the sibling TaskCache\Tasks\{GUID} Actions value
    and in the task XML under \Windows\System32\Tasks. Read the Details on this event to capture the
    index, then follow the GUID to the Tasks subkey to recover the action. In the Diamond Sleet pattern
    this task runs a Forest64.exe binary from C:\ProgramData with a fixed key argument, so any action
    pointing at ProgramData, Temp, or an unsigned binary is the payload to pursue. Registry key and
    value deletions are not observable in this telemetry, so judge whether the task was later removed
    from the key's re-modification history rather than expecting a delete event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What command did the process that registered this task run?
  context: >-
    The registry event carries no command line, so pivot by the writing process's ProcessGuid to its
    process_creation record. If a schtasks.exe /create invocation registered the task, the /tr argument
    reveals the exact action it will run; if the Task Scheduler service (svchost.exe) or a PowerShell
    cmdlet registered it, the command line is generic and the action must be read from the Tasks\{GUID}
    subkey instead. Identifying the configured executable determines whether this persists a backdoor,
    a defense-tampering command, or a benign program.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process registered this task, and what launched that process?
  context: >-
    Pivot by the writing process's ProcessGuid to its own process_creation record to read its Image,
    full command, and parent. A registration launched from a build-server service account, a PowerShell
    stager, a web-application worker process, or an unsigned binary points to programmatic installation
    following exploitation rather than a deliberate administrator action. Post-exploitation of a
    public-facing application commonly registers persistence from the compromised service's context, so
    the parent chain distinguishes an implant from a routine task creation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Did the binary configured by this task subsequently execute on the host?
  context: >-
    A scheduled task is persistence only if its action runs. The query anchors on Forest64.exe, the
    ForestTiger binary Diamond Sleet configures this task to launch from C:\ProgramData with a
    hardcoded key argument; a row means the persistence fired - at the next trigger, at system start,
    or by hand. A zero can mean the task has not yet fired, or that the operator renamed the payload -
    compare against the executable recovered from the task action, and if it differs, search for that
    image instead.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \Forest64.exe
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is the scheduled-task persistence still present, and are host security controls intact?
  context: >-
    Determine the current state directly on the host: whether the named task still exists and is
    enabled, and whether endpoint protection, logging, and the affected application service are
    operating normally. The backdoor this task persists is known to be followed by credential theft and
    by stopping the exploited application's service, so a task that remains registered or a control that
    is currently disabled leaves the host exposed and should be remediated before deeper investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What activity occurred on this host after the task was registered?
  context: >-
    Persistence is installed to enable follow-on actions. Aggregating process activity in the window
    after the registration surfaces what the foothold enabled - execution of the task's payload,
    credential-access tooling such as LSASS dumping, discovery commands, or additional downloads.
    Correlate this with network connections and file writes in the same window; a burst of new
    parent-child pairs shortly after the task appears points to hands-on activity rather than an
    isolated task creation.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were defense-tampering actions performed on this host?
  context: >-
    Operators who establish persistence frequently also weaken defenses - stopping the exploited
    application's service to lock out other actors, clearing logs, disabling protection, or deleting
    recovery data. This query surfaces log-clearing, shadow-copy deletion, recovery disabling, protection
    disabling, firewall changes, and service-stop commands on the host near the alert. Several such
    actions from the same account or parent process indicate a coordinated hands-on operation rather
    than a single automated task registration.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: What other registry modifications were made on this host in the same window?
  context: >-
    Registering a scheduled task writes several related registry values together - the Tree entry, the
    Tasks\{GUID} action and trigger data, and Boot/Logon or plain-task index entries. Clustering the
    registry writes on this host in a short window recovers the full task definition (including the
    action executable that the Tree value alone does not show) and reveals any parallel configuration
    changes such as Run-key persistence or protection-policy edits. The triggering key appears in the
    results; the signal is what else was written and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has this task's registry key been modified before on this host?
  context: >-
    A TaskCache entry for this task name should never have existed before on a clean host, so a history
    with no prior writes marks this as a first-time registration and raises its weight. A history of
    periodic writes to the same key would instead suggest a recurring management process re-registering
    a task by the same name. Compare the historical value data and writing process to establish whether
    this is new to the host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A persistence installation rarely happens in isolation. Aggregating process activity in a tight
    window around the alert surfaces what led up to the task registration - initial exploitation of the
    public-facing application, payload staging, script execution - and what ran immediately after.
    Novel parent-child pairs stand out at low counts against high-count routine telemetry, which points
    to the tooling behind the registration.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Was this same task registered on other hosts in the environment?
  context: >-
    The same task registration across many hosts points to a widespread campaign or a mis-scoped
    deployment; a registration confined to one host suggests a targeted foothold. Compare the value data
    and writing process across hosts to see whether they all install the same task and action, which
    separates a single hands-on operation from repeated use of the same technique across the fleet.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - exploitation of a public-facing application, execution of
    scripting tools, credential access, or defense tampering - may reveal the stages that preceded this
    persistence and help reconstruct the timeline. Persistence is typically installed after an initial
    foothold is gained, so prior alerts help place this task registration within the larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other persistence mechanisms installed on this host in the same window?
  context: >-
    Operators rarely rely on a single persistence mechanism. Alongside this scheduled task they commonly
    install backups using different techniques - services, registry Run keys, BITS jobs, or WMI
    subscriptions. This query surfaces schtasks.exe, sc.exe, reg.exe, bitsadmin.exe, and wmic.exe
    executions on the host in a wide window, so additional persistence installed before or after the
    task registration becomes visible. Multiple mechanisms from the same timeframe indicate deliberate
    stacking rather than isolated administration.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely - dropping an executable or script
    into a Startup folder or a path referenced by a registry Run key achieves persistence without
    invoking schtasks, sc, or reg. File writes to these locations near the task registration indicate a
    parallel persistence mechanism was established on disk alongside the scheduled task.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
