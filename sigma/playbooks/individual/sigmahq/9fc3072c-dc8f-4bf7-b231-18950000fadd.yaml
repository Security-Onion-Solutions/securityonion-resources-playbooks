name: Potential Recon Activity Using DriverQuery.EXE
id: 7a3ca0fe-6968-40a3-9a8d-ffe9b8a50381
description: |
  Detects driverquery.exe (or a renamed copy whose OriginalFileName is drvqry.exe) launched by a script
  interpreter or signed-binary proxy (cscript, mshta, regsvr32, rundll32, wscript) or by a parent process
  living in a user-writable directory (AppData\Local, Users\Public, Windows\Temp). The rule fires only when
  BOTH conditions hold: the child is driverquery AND the parent is one of these suspicious launchers.
  driverquery enumerates installed device drivers; on its own it is benign IT troubleshooting, but invoked
  through a scripting host or a binary staged in a temp/AppData path it is commonly part of an automated
  post-compromise discovery sweep that profiles the host before the next stage. Investigation should confirm
  the parent chain, decode the full command, and determine whether other reconnaissance ran on the host
  around the same time.
type: detection
detection_id: 9fc3072c-dc8f-4bf7-b231-18950000fadd
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Is the alerting child driverquery.exe (or a binary renamed from drvqry.exe), and was it spawned by a script host or a parent in a user-writable path?
  context: Confirm the alert is a true positive before investing time. The rule requires both halves to match - the child Image ends in driverquery.exe or its OriginalFileName is drvqry.exe, AND the parent is one of cscript, mshta, regsvr32, rundll32, wscript, or a process whose path contains AppData\Local, Users\Public, or Windows\Temp. Review the full event to verify both halves actually hold.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - OriginalFileName
- question: Is this parent expected to spawn driverquery.exe, and what started the parent itself?
  context: The parent-child relationship is the core signal here. Script interpreters and signed-binary proxies do not normally launch driver-enumeration tools, and a parent staged in AppData, Users\Public, or Windows\Temp is itself anomalous. Tracing the parent's own origin (grandparent) shows whether the chain began with a user action or with a script or staged loader.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did the same parent spawn?
  context: If a scripting host or staged loader spawned driverquery, it likely spawned other tools too. Examining siblings of the alerting process reveals the full scope of activity from that parent - multiple discovery or staging children from one parent points to automated orchestration rather than an isolated command.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What exactly did driverquery do? Decode its full command line and any sequential invocations.
  context: The full command line shows the specific enumeration performed - output format flags (/FO CSV, /v for verbose, /SI for signed-driver info) and any output redirection to a temp file the operator collects later. Reviewing every driverquery invocation on the host in a tight window captures multi-step discovery that a single event would miss.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single driver query may be benign troubleshooting, but driverquery alongside whoami, systeminfo, tasklist, net, nltest, or nslookup in rapid succession is a signature of post-compromise enumeration. Attackers profile the host - drivers, accounts, network, running services - before choosing the next stage.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: What process spawned the discovery command, and is that parent normal for it?
  context: Legitimate discovery is typically run from cmd.exe under explorer.exe (a user at a prompt) or from a known automation script. Discovery commands spawned by script interpreters (wscript, cscript, mshta), signed-binary proxies (rundll32, regsvr32), or a binary staged in a user-writable path indicate automated post-exploitation enumeration rather than an admin troubleshooting.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Is this user expected to run administrative discovery commands?
  context: IT staff legitimately run driver and system queries for troubleshooting; standard users rarely need driverquery, nltest, or net user. The user's role and typical toolset determine whether enumerating installed drivers is routine or anomalous for this account.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: driverquery.exe
      - OriginalFileName: drvqry.exe
      selection_parent:
      - ParentImage|endswith:
        - \cscript.exe
        - \mshta.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
      - ParentImage|contains:
        - \AppData\Local\
        - \Users\Public\
        - \Windows\Temp\
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: driverquery.exe
      - OriginalFileName: drvqry.exe
      selection_parent:
      - ParentImage|endswith:
        - \cscript.exe
        - \mshta.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
      - ParentImage|contains:
        - \AppData\Local\
        - \Users\Public\
        - \Windows\Temp\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar discovery on several hosts, the scope of the activity is larger than this one alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: driverquery.exe
      - OriginalFileName: drvqry.exe
      selection_parent:
      - ParentImage|endswith:
        - \cscript.exe
        - \mshta.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
      - ParentImage|contains:
        - \AppData\Local\
        - \Users\Public\
        - \Windows\Temp\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Does this parent process normally spawn driverquery.exe on this host?
  context: Some parent-child relationships are routine while others are inherently suspicious - a script host or a binary staged in a temp/AppData path spawning a driver-enumeration tool is not a normal pairing. Historical frequency of this specific parent-child combination on this host distinguishes routine from anomalous.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: What other activity is associated with this parent process around the same time?
  context: Beyond child processes, the parent may have generated additional process activity nearby. For a script interpreter or staged loader, surrounding executions can reveal the staging, download, or follow-on stages of the same operation.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this parent+driverquery spawning pattern occurring on other hosts?
  context: The same parent-child relationship appearing on multiple hosts may indicate a campaign or a lateral-movement pattern using the same automated discovery sweep. A single occurrence is more likely targeted. Environment-wide comparison helps calibrate scope.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
- question: Does this host normally run driverquery.exe?
  context: A tool that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low historical counts for driverquery on this host indicate first-time or rare execution, raising the weight of the launch-mechanism and timing signals.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led to this event and what followed - reconnaissance, staging, privilege escalation, or persistence. Novel parent-child pairs stand out against the high-count agent and OS telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - defense tampering, initial execution, other reconnaissance - may reveal the attack stages that preceded this driver-enumeration step and help reconstruct the timeline. Discovery is typically a mid-chain action, so prior alerts often mark the initial access or execution that set it up.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
