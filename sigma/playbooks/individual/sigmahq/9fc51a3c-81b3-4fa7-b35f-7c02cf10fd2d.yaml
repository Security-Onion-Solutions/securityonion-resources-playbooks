name: Usage Of Web Request Commands And Cmdlets
id: 558668fc-59eb-433a-bcf9-f016bf6a9bc1
description: |
  Detects a process command line that contains one of the built-in Windows and PowerShell ways to fetch remote content: Invoke-WebRequest and Invoke-RestMethod (and their iwr / irm / wget / curl aliases), Start-BitsTransfer and Resume-BitsTransfer, the [System.Net.WebRequest]::Create .NET call, and the WinHttp.WinHttpRequest COM object. These commands are routine for administrators pulling files from intranet mirrors or scripted installers, but they are also the core of PowerShell download cradles that pull a second-stage payload from an external host into a user-writable path and then execute it. The investigation should decode the command line to recover the source URL and the destination, confirm what process spawned the interpreter, and determine whether this user and host routinely run web-request commands or whether this is first-time activity tied to follow-on execution.
type: detection
detection_id: 9fc51a3c-81b3-4fa7-b35f-7c02cf10fd2d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-03
questions:
- question: Does the command line contain one of the web-request commands or cmdlets this rule detects?
  context: Confirm the alert before investing time. The rule fires when a process command line contains any of Invoke-WebRequest, Invoke-RestMethod, the iwr / irm / wget / curl aliases, Start-BitsTransfer, Resume-BitsTransfer, [System.Net.WebRequest]::create, or WinHttp.WinHttpRequest. Read the full command line and identify which command fired and which interpreter ran it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to download files with command-line tools?
  context: Legitimate administrative scripts, installers, and update routines fetch files with these same commands. Knowing whether this user's role and this host's function include scripted downloads is often the fastest way to separate routine activity from a download cradle. A developer workstation or a build server pulling files is different from a finance laptop running Invoke-WebRequest for the first time.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What did the web-request command actually do? Decode its full command line.
  context: The full command line reveals the operation. Recover the source URL (the -Uri or first positional argument) and the destination path (-OutFile or equivalent), the cmdlet or tool used, and note whether the download is piped straight into execution (for example Invoke-Expression of the response body). Scoping to all web-request commands on this host in the surrounding window captures multi-step sequences where one command fetches a file and a later one runs it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
          - '[System.Net.WebRequest]::create'
          - 'curl '
          - 'Invoke-RestMethod'
          - 'Invoke-WebRequest'
          - ' irm '
          - 'iwr '
          - 'Resume-BitsTransfer'
          - 'Start-BitsTransfer'
          - 'wget '
          - 'WinHttp.WinHttpRequest'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - Image
- question: Is the web-request command encoded or obfuscated, and what download cradle does it resolve to?
  context: These commands are often plain text and readable, in which case the analytical task is to identify the fetch-and-run pattern rather than to base64-decode. Look for the source URL behind Invoke-WebRequest / iwr / wget / curl or Start-BitsTransfer, whether the response is piped into Invoke-Expression for in-memory execution, and what local path a downloaded file lands in. When the command is wrapped in -EncodedCommand, string concatenation, or backtick escaping, decode it first to recover the same details, then check the source URL's reputation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned this interpreter, and is that parent chain expected?
  context: The parent process shows how the web-request command was launched. Interactive admin sessions (explorer.exe) and scheduling services are routine parents; Office applications (winword.exe, excel.exe, outlook.exe), mshta.exe, wscript.exe, or cscript.exe spawning an interpreter that immediately fetches remote content is the macro-to-cradle pattern and is far more suspicious.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did this process make outbound network connections, and to what host or IP?
  context: A download cradle is only meaningful if it actually reaches out. Correlating the alerting process to its network connections recovers the real destination host, IP, and port, which matters when the URL in the command line is built from variables or otherwise obscured. Compare the destination against known-good update and mirror endpoints; an external or newly seen address that the command line did not plainly show is the signal to chase.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - Initiated
- question: Did the alerting process load the .NET HTTP or BITS assemblies that back these web-request commands?
  context: When the command line is obfuscated, the loaded modules are a corroborating signal that the cradle actually ran. PowerShell that performs a BITS transfer loads Microsoft.BackgroundIntelligentTransfer.Management.Interop.dll, and HTTP-based fetches pull in the System.Net.Http / System.Net assemblies. The query is scoped to the alerting process image so the result answers "did this process load these assemblies" rather than "which processes on this host did"; absence is not exoneration, since some fetch paths use already-loaded modules, and where module-load telemetry does not record the alerting process, widen to the host by removing the Image clause.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        ImageLoaded|endswith:
          - '\Microsoft.BackgroundIntelligentTransfer.Management.Interop.dll'
          - '\System.Net.Http.dll'
          - '\System.Net.dll'
          - '\System.Net.Requests.dll'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: What child processes did this process spawn afterward?
  context: The processes spawned after the fetch reveal what the downloaded content did. A web-request command followed by execution of a freshly written file, a new powershell.exe or cmd.exe, rundll32, regsvr32, or an installer is the fetch-then-run chain that separates a payload delivery from a benign file copy.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did PowerShell script block logging capture the full deobfuscated script content?
  context: Windows Event ID 4104 records the deobfuscated script PowerShell actually executed, even when the command line is encoded or built from concatenated strings, giving ground truth about the download logic and any in-memory execution that followed. If PowerShell operational logging is not collected in this environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell security controls bypassed or weakened on this host shortly before this execution?
  context: Attackers commonly weaken PowerShell protections before pulling a payload — patching AMSI, setting an execution-policy bypass, or downgrading to v2 which lacks script block logging. Finding these precursor events in the hour before the web-request command strengthens the case that the download is part of an intrusion rather than routine administration.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: When this host has previously run these web-request commands, what parents and users normally drive that activity, and does the current alert fit?
  context: Even common download commands have a normal pattern on a given host. This mirrors the rule's command pattern scoped to this host, so the resulting parent and user distribution reflects how web-request activity has historically run here — a scheduled task under a service account, an admin in an interactive session, a software-deployment agent. A new parent process, an unexpected user, or an unusual command structure against that baseline is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - '[System.Net.WebRequest]::create'
        - 'curl '
        - Invoke-RestMethod
        - Invoke-WebRequest
        - ' irm '
        - 'iwr '
        - Resume-BitsTransfer
        - Start-BitsTransfer
        - 'wget '
        - WinHttp.WinHttpRequest
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - '[System.Net.WebRequest]::create'
        - 'curl '
        - Invoke-RestMethod
        - Invoke-WebRequest
        - ' irm '
        - 'iwr '
        - Resume-BitsTransfer
        - Start-BitsTransfer
        - 'wget '
        - WinHttp.WinHttpRequest
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - '[System.Net.WebRequest]::create'
        - 'curl '
        - Invoke-RestMethod
        - Invoke-WebRequest
        - ' irm '
        - 'iwr '
        - Resume-BitsTransfer
        - Start-BitsTransfer
        - 'wget '
        - WinHttp.WinHttpRequest
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in a tight window reveals lateral movement or activity spanning multiple endpoints. If the same user fetched content or ran tools on other hosts in the same window, the scope is larger than a single download. This pivot is meaningful only when a real user account fired the alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - '[System.Net.WebRequest]::create'
        - 'curl '
        - Invoke-RestMethod
        - Invoke-WebRequest
        - ' irm '
        - 'iwr '
        - Resume-BitsTransfer
        - Start-BitsTransfer
        - 'wget '
        - WinHttp.WinHttpRequest
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Have other hosts run these web-request commands in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: This mirrors the rule's command pattern with no host scope, giving a fleet-wide count of where these web-request commands fired. Many hosts running the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate how unusual this single alert is.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - '[System.Net.WebRequest]::create'
        - 'curl '
        - Invoke-RestMethod
        - Invoke-WebRequest
        - ' irm '
        - 'iwr '
        - Resume-BitsTransfer
        - Start-BitsTransfer
        - 'wget '
        - WinHttp.WinHttpRequest
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the stages that preceded this event and help reconstruct the timeline that led to the web-request command.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
