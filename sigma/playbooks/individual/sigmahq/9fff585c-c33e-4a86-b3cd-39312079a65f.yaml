name: Taskmgr as LOCAL_SYSTEM
id: 2f2d1679-9c29-406a-8461-f70b2cde8d08
description: |
  Detects taskmgr.exe running under a built-in service identity: the rule fires when the image name ends in
  taskmgr.exe AND the User value contains AUTHORI or AUTORI, the localized substring shared by NT AUTHORITY
  accounts (SYSTEM, LOCAL SERVICE, NETWORK SERVICE). A user cannot reach this state through the normal UI —
  Task Manager inherits the token of whatever launched it, so a service identity implies an existing
  SYSTEM-level primitive: a remote-execution utility run with a service switch, a service or scheduled task
  configured to run as SYSTEM, or a debugger/IFEO substitution on a system binary. The value to an operator is
  mechanical: a SYSTEM-owned Task Manager can terminate processes a user-owned one cannot, can create a dump
  file of a protected process such as lsass.exe from the context menu, and can launch a new process that
  inherits the SYSTEM token — all through the GUI, leaving little or no command-line evidence. IT staff
  troubleshooting from a SYSTEM shell produce the same event, so the investigation turns on the parent
  process: identify what created taskmgr.exe, how that parent obtained SYSTEM, and whether a person or an
  automated mechanism drove it.
type: detection
detection_id: 9fff585c-c33e-4a86-b3cd-39312079a65f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the alerting event show taskmgr.exe running under a built-in service identity?
  context: >-
    The rule requires both conditions together: the image name ends in taskmgr.exe AND the User value contains
    AUTHORI or AUTORI, the substring common to NT AUTHORITY accounts such as SYSTEM, LOCAL SERVICE, and
    NETWORK SERVICE. Confirm both in the event before spending further time — a person opening Task Manager
    normally carries a local or domain account name in this field, and any other value here means the alert
    did not fire on the pattern described.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - User
  answer_sources:
  - alert
  - process_creation
- question: Is this host expected to have someone running Task Manager from a SYSTEM-level context?
  context: >-
    Task Manager cannot elevate itself to a service identity; the account comes from whatever launched it.
    Routine explanations exist — support staff troubleshooting a service or a hung process from a SYSTEM shell,
    an imaging or software-deployment workflow, an administrator using a remote-execution utility with its
    run-as-system switch. Establish from the host owner and any change or ticket record whether such work was
    underway at the alert time, and whether this host is one where that is normal.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this really the Windows Task Manager binary, and does it run from the expected system directory?
  context: >-
    The rule keys on the image basename, which any file can carry. Compare the Image path against the two
    canonical locations, C:\Windows\System32\taskmgr.exe and C:\Windows\SysWOW64\taskmgr.exe — a taskmgr.exe
    running from a user-writable directory is a different investigation than one running from System32.
    Compare the basename against the PE metadata OriginalFileName, which for the genuine binary is Taskmgr.exe
    and which a renamed tool will not match. The hash supports a reputation lookup to separate the shipped OS
    binary from a copied, patched, or unrelated executable wearing the name.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: How did this taskmgr.exe binary arrive on the host, and what wrote it?
  context: >-
    The genuine binary is placed by OS servicing, so file writes of this name normally come from the servicing
    stack or an installer and cluster around update activity. This matches the file name over 30 days rather
    than the exact path, which surfaces every copy, replacement, or drop of a file called taskmgr.exe on the
    host regardless of where it landed. The writing process identifies the delivery mechanism — a download
    tool, an archive extractor, a remote-administration utility, or a manual copy — and a write into a
    user-writable directory means the executing binary is not the one the OS installed.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - process_creation
- question: What did taskmgr.exe spawn after it ran, and did those children inherit the SYSTEM token?
  context: >-
    Task Manager can create processes from its Run-new-task dialog, and a child created there inherits the
    parent's token — that is the usual path from a SYSTEM-owned GUI to a SYSTEM-owned shell. Children such as
    cmd.exe, powershell.exe, or a management console launched here are the operational payoff of the alert and
    give the command-line evidence the GUI itself does not. An empty result does not clear the event: killing a
    protected process or writing a dump file of lsass.exe from the context menu creates no child process at
    all.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What command line launched taskmgr.exe, and did it start once or repeatedly in this window?
  context: >-
    Task Manager accepts almost no arguments, so unlike a command-line tool its command line carries little
    operational meaning — the actions that matter (terminating a protected process, creating a dump file,
    launching a new task) happen in the GUI and leave no argument trail. Two things here are still worth
    reading: the working directory, which usually reflects the shell or service that launched it, and the
    number of starts in the window, since a repeated relaunch pattern is more consistent with scripted or
    automated invocation than with a person opening a window once.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned taskmgr.exe, and does that parent explain how the SYSTEM context was obtained?
  context: >-
    This is where the event is decided, because taskmgr.exe cannot obtain a service identity on its own — the
    parent handed it over. Each parent tells a different story: services.exe or a service host means a service
    started it; a remote-execution utility's service binary means someone ran it with a run-as-system switch
    from another machine; a cmd.exe or powershell.exe already running as SYSTEM means an operator had a SYSTEM
    shell and opened a GUI from it; explorer.exe under a normal user is inconsistent with a service identity
    and points instead at token manipulation or a debugger/IFEO substitution on the binary. Walk one more level
    up from the parent to see what created it. If ParentProcessGuid is not populated on the alert, pivot on
    parent name and start time instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Was a service installed on this host in the hours before the alert that could account for the SYSTEM context?
  context: >-
    Interactive execution as SYSTEM most often comes from a service: remote-execution utilities install a
    temporary service pointing at a dropped binary, start it, and the service process becomes the SYSTEM-owned
    parent. Event 7045 records the service name, the image path, the start type, and the account the service
    runs under. Correlate the installation timestamp against the taskmgr.exe start — an install minutes before,
    with a randomized or unfamiliar service name or an image path in a user-writable or temporary directory,
    identifies the mechanism and often the source host. If System-channel events are not collected in this
    environment, treat an empty result as a visibility gap rather than evidence no service was installed.
  range: -24h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: system
    detection:
      selection:
        EventID: 7045
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - ServiceName
      - ImagePath
      - ServiceType
      - AccountName
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: Does this host normally run Task Manager, and under which accounts?
  context: >-
    This counts every taskmgr.exe execution on the host over 90 days grouped by account, so a high total is
    expected — people open Task Manager routinely and that volume says nothing by itself. The account column is
    the answer: if every historical row is a human account and the alerting one is the only NT AUTHORITY entry,
    the SYSTEM context is new here. Recurring service-identity rows point to an established support or
    automation practice on this host, which reframes the alert as routine rather than novel.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: When this host has previously run Task Manager under a service identity, what parents and users drove it, and does the current alert fit?
  context: >-
    The query mirrors the rule's selection scoped to this host, so the parent and user distribution reflects
    the SYSTEM-context pattern specifically rather than generic Task Manager usage. A parent that recurs across
    the prior two weeks is established local practice — a management agent, a support workflow, a scheduled
    job. A parent appearing only on the alerting event is the deviation worth chasing, and an empty result
    means the host has not produced this pattern at all in that window.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|contains:
        - AUTHORI
        - AUTORI
        Image|endswith: \taskmgr.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Have other hosts run Task Manager under a service identity in the past week, and does the distribution look like practice or one-off activity?
  context: >-
    The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this specific
    pattern rather than the binary's general footprint. Many hosts producing it points to a support or
    deployment practice where working from a SYSTEM shell is normal, which makes the alerting host unremarkable
    and argues for tuning. A single host, or a small unrelated set, points to hands-on activity — read that
    together with the parent process to decide which.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|contains:
        - AUTHORI
        - AUTORI
        Image|endswith: \taskmgr.exe
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Has the alerting account produced this pattern before, and across how many hosts?
  context: >-
    This rule fires under a built-in service identity by construction — the account is what the rule selects
    on — so the account pivot degenerates completely here: it asks whether SYSTEM has previously run Task
    Manager as SYSTEM, which attributes the behavior to nobody. Read only the host spread it returns, as a
    coarse measure of whether the pattern is environment-wide or local to this machine. Identity attribution
    has to come from the parent process and from the logon session that created it, not from this field.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|contains:
        - AUTHORI
        - AUTORI
        Image|endswith: \taskmgr.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: Has this parent process historically driven Task Manager under a service identity here or elsewhere, or is the parent new for this activity?
  context: >-
    Because the account is a service identity on every firing of this rule, the launch mechanism is the
    load-bearing identity pivot and this question carries what the account pivot cannot. It counts 90 days of
    the same parent driving the same pattern, grouped by host. A parent already responsible for a large volume
    across many hosts is management tooling or an OS mechanism; a parent with no prior history is the mechanism
    that arrived with this alert, and identifying how it obtained SYSTEM becomes the investigation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|contains:
        - AUTHORI
        - AUTORI
        Image|endswith: \taskmgr.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did the alerting account run across the environment in the hour around the alert?
  context: >-
    Retained for the case where the alerting account resolves to something attributable, but expect it to
    degenerate here: the account is a built-in service identity, and every host runs service-owned processes
    and management agents continuously, so this typically returns unbounded routine telemetry rather than an
    answer. If the counts are large, read them as noise and rely on the parent-driven fleet question instead.
    If the counts are small enough to read, the surrounding processes still show what the same identity touched
    across hosts in the window.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service identity the account-wide sweep returns agent telemetry, so the meaningful question is
    whether the same launch mechanism fired elsewhere in the alert window. Several hosts within the hour points
    to pushed or scheduled automation, or to an operator working through a list of machines. A single host
    points to a host-local trigger, which for a GUI process usually means a console session or an interactive
    remote session on that machine specifically.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|contains:
        - AUTHORI
        - AUTORI
        Image|endswith: \taskmgr.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating parent/child pairs across the alert window collapses repetitive agent telemetry into high-count
    rows while novel pairs stand out at low counts, which is what to scan for. Look for the tooling that
    accompanies a SYSTEM shell: a service binary in a temporary directory, cmd.exe or powershell.exe under an
    unusual parent, account or process enumeration, and dump or archive utilities. The processes immediately
    before taskmgr.exe often show how the SYSTEM context was established.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Reaching SYSTEM is a step rather than an objective, so this event usually sits inside a sequence. Earlier
    detections for remote service execution, credential access, or defense tampering on the same host place
    this alert in that sequence and often name the primitive that produced the SYSTEM token. An isolated alert
    with a benign parent chain and a support ticket behind it is consistent with troubleshooting instead.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
