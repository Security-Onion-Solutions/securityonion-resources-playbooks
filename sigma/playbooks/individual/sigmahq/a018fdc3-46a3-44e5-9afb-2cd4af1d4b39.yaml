name: Suspicious Execution From Outlook Temporary Folder
id: 7a706785-fbd0-483a-ba2d-6524be35f1e0
description: |
  Outlook extracts an opened attachment into a per-session temporary folder under
  \Temporary Internet Files\Content.Outlook\<random>\ before handing it to the shell, so a
  process whose Image path lies inside that folder means a user opened an emailed attachment
  directly on this host. The rule fires on any process creation whose Image contains that
  folder path, which makes it the clearest available host-side evidence of email-delivered
  execution. Users routinely open legitimate emailed documents, installers, and vendor
  utilities the same way, so the investigation turns on what was executed, whether that file
  type is something a user would normally run from mail, and whether the message was expected
  from a known sender.
type: detection
detection_id: a018fdc3-46a3-44e5-9afb-2cd4af1d4b39
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the executing Image path sit inside an Outlook temporary attachment folder, and what file was run?
  context: >-
    Confirm the Image path contains \Temporary Internet Files\Content.Outlook\ followed by a
    random 8-character subfolder, and read the file name and extension at the end of it. An
    executable, script host payload, shortcut, or macro-enabled document opened straight out
    of that folder is a different investigation from a PDF or plain office document.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to open and run emailed attachments of this type?
  context: >-
    Opening attachments is normal for most users, so the user role and host function are the
    fastest discriminator. A finance workstation running an emailed installer, a developer
    opening a vendor utility, and a kiosk account running a script host from mail carry very
    different weight.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What email delivered this attachment, and was the message expected?
  context: >-
    The parent process and its command line show how the extracted file was launched. An
    outlook.exe parent means the user double-clicked the attachment inside the mail client; an
    explorer.exe parent means the file was saved or dragged out first. Trace the message
    itself in the mail platform for the sender, subject, and attachment name so the message can
    be pulled and other recipients identified.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - manual_review
  - edr_console
- question: Did other users receive and open the same attachment?
  context: >-
    Mail delivering a payload rarely reaches one mailbox. Counting the same rule firing across
    other hosts and users over the last day shows how many people opened an attachment from
    the same delivery and identifies additional systems that need the same review.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - alert
- question: Is the mail client that extracted this attachment fully patched?
  context: >-
    The parent application identifies which mail client build extracted and launched the file.
    An out-of-date Outlook or Office install widens the outcome beyond a user-initiated open,
    since attachment-handling and preview-pane flaws allow the extracted file to be launched
    with less user interaction than a double-click.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
  answer_sources:
  - asset_inventory
  - edr_console
- question: What did the attachment actually do when it ran? Decode its full command line and working directory.
  context: >-
    Read every argument passed to the extracted file and the directory it ran from. Arguments
    pointing at a second file in the same temporary folder, a copy or move to a persistent
    location, an outbound URL, or an interpreter flag describe the operation the attachment
    performs rather than the fact that it launched.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What launched the extracted file, and what spawned that parent?
  context: >-
    Retrieve the parent event to see the launching application and its own lineage. An
    outlook.exe parent under explorer.exe is the ordinary user-open path. A parent that is
    itself a script host, an office application spawning an interpreter, or a process started
    by another attachment points at an automated open rather than a user double-click.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What files were written into the Outlook temporary folders on this host before the execution?
  context: >-
    Every attachment a user opens is extracted to disk first, so the file writes into
    \Content.Outlook\ list what arrived by mail and when. Compare the write time of the
    executed file against its execution time to see whether it ran immediately on open or
    later, and look for sibling files extracted from the same message. File writes carry no
    hash, so identify the dropped path here and pick the hash up from the execution event.
    Prioritise executable and script extensions (.exe, .js, .vbs, .scr, .docm, .xlsm) over
    ordinary documents.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: \Temporary Internet Files\Content.Outlook\
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
  answer_sources:
  - file_event
  - manual_review
- question: Did the file launched from the Outlook temporary folder make outbound connections?
  context: >-
    An emailed document or utility that reaches out on execution is retrieving a second stage
    or checking in. Review the destinations, ports, and direction for the extracted binary
    over the hours after it ran, and treat any egress to an address outside the organisation's
    known infrastructure as the pivot for the next stage.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
- question: What child processes did the extracted file spawn afterward?
  context: >-
    The children reveal what the attachment did beyond starting. A document viewer or
    installer has predictable children; command interpreters, script hosts, certutil, or
    living-off-the-land binaries spawned by a file that came out of a mailbox describe
    post-execution activity that continues past the open.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Has this host run this file before?
  context: >-
    A file name that has never executed on this host over the last 90 days is a first-time
    open. A file name with a long history is more likely a recurring vendor utility or
    routinely redistributed document that users open from mail every cycle.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: When this host has previously executed files from Outlook temporary folders, what parents and users drove that, and does this alert fit?
  context: >-
    The query mirrors the rule's selection scoped to this host, so the parent and user
    distribution reflects how attachment execution has historically run here rather than
    generic binary usage. A host where several users routinely open attachments this way reads
    differently from one where this is the first occurrence, and a new parent for the pattern
    is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains: \Temporary Internet Files\Content.Outlook\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Have other hosts executed files from Outlook temporary folders in the past week, and how is that spread across the fleet?
  context: >-
    The query mirrors the rule's selection with no host scope, giving a fleet-wide count of
    attachment execution. A steady spread across many hosts is the ordinary background of
    users opening mail and helps calibrate what normal looks like here. A tight cluster of
    hosts appearing in a short window points at one delivery reaching several mailboxes.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains: \Temporary Internet Files\Content.Outlook\
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Has this user opened attachments straight out of the mail client before, and does that fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, so the result is their 90-day
    history of executing files from Outlook temporary folders, aggregated by host. A user who
    does this weekly is a different proposition from one who has never done it; weigh the
    count against their role and how much external mail they handle.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains: \Temporary Internet Files\Content.Outlook\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: Has this parent process historically driven attachment execution here, or is the parent new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute the
    behaviour and the launch mechanism is the meaningful pivot. The query mirrors the rule's
    selection scoped to the alerting parent, so the result is the 90-day history of that
    parent extracting and launching attachments. A parent that already accounts for thousands
    of prior events is a mail client doing its ordinary job; a new or rare parent for this
    pattern is the deviation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains: \Temporary Internet Files\Content.Outlook\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across every host in the alert window shows whether the open
    was an isolated action or the start of a sequence, and whether the same account is active
    on more than one endpoint. If the alert fired under SYSTEM or a machine account this
    returns agent telemetry rather than user behaviour, and the parent-anchored view is the
    meaningful answer.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: Did the same parent-driven attachment execution fire on other hosts in the same window?
  context: >-
    Under a service principal the user-wide view returns agent noise, so the useful question
    is whether the same launch mechanism fired elsewhere at the same time. The query mirrors
    the rule's selection scoped to the alerting parent, fleet-wide, inside the alert window.
    Several hosts in the same hour points at one message reaching multiple mailboxes; a single
    host points at a local open.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains: \Temporary Internet Files\Content.Outlook\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating process activity on the host in the surrounding window collapses routine
    agent telemetry into high-count rows and leaves novel parent-child pairs standing out at
    low counts. That is where a second stage launched from the same message, a persistence
    write, or reconnaissance run after the open will appear.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
