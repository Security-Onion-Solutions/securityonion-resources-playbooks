name: Process Monitor Driver Creation By Non-Sysinternals Binary
id: 80144d13-4a38-4e26-a384-2e93fe05413b
description: |
  Detects a file whose path contains "procmon" and ends in .sys being written by a process other than
  procmon.exe, procmon64.exe, or procmon64a.exe. Process Monitor extracts its own Microsoft-signed kernel
  driver to disk and loads it to capture system activity, so the driver itself is legitimate and its
  signature is the premise rather than the finding — what the rule surfaces is that something else put it
  there. That happens when a renamed or repackaged copy of Process Monitor runs, when a troubleshooting or
  monitoring product bundles the driver, or when a tool extracts the signed driver to obtain kernel-level
  capability without shipping a driver of its own. The investigation should establish which binary wrote the
  driver, where that binary came from and what launched it, whether the driver went on to load and under
  what service, and whether this user and host have a reason to be running Process Monitor at all.
type: detection
detection_id: a05baa88-e922-4001-bc4d-8738135f27de
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the written file match the Process Monitor driver pattern, and which process created it?
  context: >-
    The rule fires on one combination — a file path containing "procmon" that ends in .sys, written by any
    process whose name is not procmon.exe, procmon64.exe, or procmon64a.exe. Confirm the path really is the
    driver and read the responsible process before going further. The signer columns describe the writing
    process, not the driver; read them for coherence with a tool that would legitimately carry the Process
    Monitor driver rather than as a verdict.
  range: +/-5m
  answer_sources:
  - alert
  - file_event
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to run Process Monitor or a tool that carries its driver?
  context: >-
    Process Monitor is a routine troubleshooting tool for administrators, developers, and support staff, and
    several monitoring or diagnostic products bundle its driver. A host whose role includes that kind of work,
    under a user who does it, is a very different starting point from a workstation with no such history. When
    the user is a machine or service account, judge by the writing process and the host's function instead.
  range: +/-5m
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which binary wrote the driver, and what launched that binary?
  context: >-
    The writing process is the finding here — the driver is Microsoft-signed either way, so identity and origin
    of the writer carry the investigation. Retrieving the writer's own start event gives its full path, command
    line, and parent. A copy of Process Monitor that was renamed still behaves like Process Monitor and will
    show its own operator-driven parent; a dropper, an installer, or a script host that extracted the driver
    shows a parent that has nothing to do with interactive troubleshooting.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What else did this binary run on this host around the write, and from what working directory?
  context: >-
    All invocations of this binary on the host in the surrounding minutes show the full operation rather than the
    single moment the driver landed. Read the arguments for what the tool was asked to do, and read the working
    directory for where it was staged from — a path under a user profile, a temporary directory, or a removable
    or network location tells a different story than an installed program directory.
  range: +/-5m
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is the written file the genuine Process Monitor driver, or a different driver using its name?
  context: >-
    The rule keys on the filename pattern, not on the file's contents, so the first thing to settle is whether the
    bytes on disk are the Sysinternals driver. Retrieve the file and check its size, its digital signature and
    signer, its version resources, and its strings against a known-good copy of the Process Monitor driver. A file
    that merely borrows the name to blend in with an expected artifact is a different situation from the real
    signed driver being extracted by an unexpected writer.
  range: +/-5m
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did the driver actually load into the kernel, and what hash and signer does the load event report?
  context: >-
    A driver written but never loaded is a staging artifact; a driver that loaded is running code in the kernel and
    changes both urgency and next steps. Driver load events carry the hash, signer, and signature status of the
    image, so this is where the file's identity is confirmed against a known-good Process Monitor driver hash. If
    no load appears, the driver is still on disk and can be retrieved and hashed directly.
  range: +/-1h
  answer_sources:
  - external_threat_intel
  - edr_console
  query: |
    aggregation: false
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: Was a service registered on this host to load the driver, and how is it configured?
  context: >-
    A kernel driver reaches the kernel through a service, so the service installation record is the follow-on to a
    driver being dropped. The record names the service, the image path it points at, its start type, and the
    account that registered it. Process Monitor registers a demand-start service and removes it when it exits; a
    driver service configured to start at boot, pointing at a path outside the drivers directory, or carrying a name
    unrelated to the tool, describes an intent to keep kernel access rather than to troubleshoot. No installation
    record in this window means the driver was written but not loaded through a fresh registration.
  range: +4h
  answer_sources:
  - organizational_knowledge
  - manual_review
  query: |
    aggregation: false
    logsource:
      product: windows
      service: system
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 7045
      condition: selection
    fields:
      - ServiceName
      - ImagePath
      - StartType
      - AccountName
- question: Did any account exercise sensitive privileges on this host around the driver write?
  context: >-
    Loading a kernel driver requires the load-driver privilege, and the point of obtaining kernel access is usually
    what follows it — a token or privilege the account did not previously hold. Special-privilege assignments in the
    window around the write show which logon sessions held load-driver, debug, or take-ownership rights and under
    which account. An assignment to the same account that wrote the driver corroborates a deliberate driver install;
    an assignment to an account that has no administrative role on this host is the deviation to pursue. If this
    channel is not collected in this environment, treat zero results as a visibility gap rather than evidence.
  range: +/-1h
  answer_sources:
  - manual_review
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4672
      condition: selection
    fields:
      - SubjectUserName
      - SubjectLogonId
      - PrivilegeList
- question: Is the driver still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's later lifecycle drives both urgency and next steps. A driver still on disk can be retrieved, hashed,
    and compared against a known-good copy. Process Monitor cleans up its own driver on exit, so a deletion shortly
    after the write is consistent with a normal tool run finishing — but it is equally consistent with cleanup after
    a load, which is why the deletion is only meaningful alongside whether the driver loaded in between.
  range: +4h
  answer_sources:
  - file_event
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A process that extracts a bundled driver usually extracts more than the driver — a main executable, configuration,
    a payload, or output files. The breadth and location of the writer's other file activity separates a self-contained
    diagnostic tool unpacking itself into a temporary directory from a dropper staging multiple components, and
    enumerates what else needs review. Volume alone is not the signal; where the writes land is.
  range: +/-30m
  answer_sources:
  - file_event
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has this driver file been written on this host before?
  context: >-
    A host where the Process Monitor driver has been written repeatedly over the past ninety days is a host where
    someone troubleshoots, and the writing processes in that history establish what normally puts it there. Zero or
    very low counts make this a first appearance on the host. Weigh the count against the writers it groups by,
    not against the number alone.
  range: -90d
  answer_sources:
  - file_event
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Is the same driver file being written on other hosts in the environment?
  context: >-
    The same driver appearing across many hosts in a short period points to a deployment, a management tool, or a
    packaged agent that carries it — the writing process in those results names it. A single host stands out against
    that background and keeps the question local. The result groups hosts and writers together, which distinguishes a
    fleet-wide rollout from repeated activity in one place.
  range: -24h
  answer_sources:
  - file_event
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- question: Does this host normally run the binary that wrote the driver?
  context: >-
    Historical executions of the writing binary on this host, grouped by the account that ran it, show whether the
    program belongs here. A program that has run regularly for months under an administrator account is part of the
    host's normal tooling; a program with no history before today arrived for this activity, which shifts the question
    to how it got onto the host.
  range: -90d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Has this user previously produced this pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's own criteria scoped to this user, so the result is their ninety-day history of
    writing a Process Monitor driver from a non-Sysinternals binary, grouped by host. A user who does this regularly
    across several hosts is likely support or engineering staff whose work involves the tool; a user with no such
    history is the deviation. Weigh the count against what the account's role would explain.
  range: -90d
  always_include: true
  answer_sources:
  - process_creation
  - organizational_knowledge
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|contains: \procmon
        TargetFilename|endswith: .sys
      filter_main_process_explorer:
        Image|endswith:
        - \procmon.exe
        - \procmon64.exe
        - \procmon64a.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this program produced this pattern before on this host or across the environment, or is it new for this activity?
  context: >-
    When the write happens under SYSTEM or a machine account, user identity attributes nothing, and a file event carries
    no parent to pivot on. The acting program is the meaningful pivot: this is the ninety-day history of THIS program
    writing a Process Monitor driver, grouped by host. A packaged agent or monitoring product that already accounts for
    thousands of prior writes across the fleet is vendor automation; a program that is new or rare for this pattern is
    what to chase.
  range: -90d
  always_include: true
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|contains: \procmon
        TargetFilename|endswith: .sys
      filter_main_process_explorer:
        Image|endswith:
        - \procmon.exe
        - \procmon64.exe
        - \procmon64a.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around this time?
  context: >-
    The account's activity on every host in the surrounding hour places the driver write in context. An administrator
    troubleshooting one machine stays local and looks like diagnostic work that matches the ticket they hold; the same
    account touching several hosts in the same window describes movement. When the alert fires under SYSTEM or a machine
    account this returns routine agent telemetry from across the fleet — read the acting-program questions instead.
  range: +/-1h
  always_include: true
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same program produce this pattern on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    The query mirrors the rule's criteria scoped to the writing program, fleet-wide, in the alert window. Several hosts
    producing the same write within the same hour points at scheduled or pushed automation — a management task, an agent
    update, a packaged tool rollout. A single host points at something triggered locally, which keeps the question on how
    the program arrived and who ran it.
  range: +/-1h
  always_include: true
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|contains: \procmon
        TargetFilename|endswith: .sys
      filter_main_process_explorer:
        Image|endswith:
        - \procmon.exe
        - \procmon64.exe
        - \procmon64a.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Obtaining kernel-level capability is rarely the first step. Earlier detections on the same host — defense tampering,
    credential access, reconnaissance, or a download and staging sequence — reconstruct what preceded the driver landing
    on disk and help decide whether this is a support engineer's tool or one stage of a longer sequence. An otherwise
    quiet host makes routine administrative use the more economical explanation.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
