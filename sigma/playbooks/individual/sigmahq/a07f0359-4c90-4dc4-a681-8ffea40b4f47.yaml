name: Service Binary in Suspicious Folder
id: 4fbb918e-c248-421e-a9b4-e1c2c46cf255
description: |
  Detects a registry write under HKLM\System\CurrentControlSet\Services\ that ties a Windows
  service to a world-writable staging directory. The rule fires when EITHER a service's Start
  value is set with a boot/system/auto start-type by a process that is itself running from a
  suspicious folder (\Users\Public\, \Perflogs\, \ADMIN$\, \Temp\), OR a service's ImagePath
  value is set to a binary path that lives inside one of those folders, while excluding known
  benign installer writes. Service binaries normally live in Program Files or system32 and are
  configured by installers or service-control tooling, so a service pointed at a transient
  user-writable directory is a common persistence and defense-evasion pattern. Investigate which
  service and value were written, the process and account that wrote it, whether the referenced
  binary landed on disk and executed, and whether the change was a documented deployment.
type: detection
detection_id: a07f0359-4c90-4dc4-a681-8ffea40b4f47
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting write configure a service Start value from a suspicious folder, or point a service ImagePath into one?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires on a
    write under HKLM\System\CurrentControlSet\Services\ that matches EITHER of two patterns: a
    value ending in \Start set to a boot/system/auto start-type by a process running from
    \Users\Public\, \Perflogs\, \ADMIN$\, or \Temp\, OR a value ending in \ImagePath whose data
    points to a binary inside one of those folders. Review the exact TargetObject, the Details
    value, and the writing Image on the triggering event, and note which branch fired - the
    ImagePath branch names the service binary directly, while the Start branch keys off the
    location of the writing process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Image
      - TargetObject
      - Details
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to create or reconfigure Windows services under CurrentControlSet\Services?
  context: >-
    Service configuration is normally performed by installers, service-control tooling, or
    deployment systems under an administrative or SYSTEM context, not by ad-hoc processes running
    from temporary directories. Knowing whether the writing account and host function match a
    sanctioned service deployment is often the fastest way to separate routine software
    installation from persistence staging. User attribution is present on roughly 94% of endpoint
    registry events; when it is a machine account or SYSTEM, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which service and value were modified, and why is a Services key a persistence and defense location?
  context: >-
    Keys under HKLM\System\CurrentControlSet\Services\ define every Windows service: the ImagePath
    value is the binary the Service Control Manager launches, and the Start value sets whether the
    service starts at boot, on demand, or automatically. Writing either value creates or
    reconfigures a service that survives reboot and can run under SYSTEM, which is why these keys
    are a durable persistence and privilege mechanism. Confirming the exact service name and value
    establishes whether this is a genuine service definition or an adjacent unrelated edit, and
    sets up decoding the data written.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What data was written to this Services value, and does it name a binary in a suspicious folder?
  context: >-
    The Details field holds what determines the service's behavior. For an ImagePath write it is
    the command line the Service Control Manager will execute - decode it to recover the binary
    path and any arguments, and confirm whether it resolves into \Users\Public\, \Perflogs\,
    \ADMIN$\, or \Temp\. For a Start write it is a DWORD start-type (0x0 boot, 0x1 system, 0x2
    auto) that sets how early and how automatically the service runs. If the data references an
    executable path, that path becomes the lead for confirming a payload on disk. Details is
    present on roughly 79% of registry modifications and should be populated for these string and
    DWORD values.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote this service configuration, and what launched that process?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to
    read its Image, full command, and parent. Legitimate service creation is typically driven by
    msiexec.exe, an installer, or service-control tooling launched from a management context; a
    write driven by a process running from a user-writable folder, or launched from a script host
    such as wscript.exe or mshta.exe, an Office application, or an unsigned binary, points to the
    service being staged programmatically rather than through a sanctioned deployment. The parent
    chain distinguishes a scripted implant from a deliberate administrative action.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: After this write, did any binary in a suspicious folder execute on this host?
  context: >-
    A service configuration only matters once the referenced binary runs, whether the Service
    Control Manager starts it or the operator launches it directly. This query lists processes on
    this host whose Image resolves into \Users\Public\, \Perflogs\, \ADMIN$\, or \Temp\ in the
    window after the write, surfacing the service binary or its payload executing. A services.exe
    parent on such a process confirms the Service Control Manager started it as a service; check
    the executing binary's signature and lineage, since a service payload running from a transient
    directory is rarely legitimately signed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_suspicious_paths:
        Image|contains:
          - '\Users\Public\'
          - '\Perflogs\'
          - '\ADMIN$\'
          - '\Temp\'
      condition: selection and selection_suspicious_paths
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Was the referenced service binary written to disk, and is it still present?
  context: >-
    A service pointed at a suspicious folder is only an active persistence mechanism if the binary
    exists at that path. Correlating file activity by the registry-writing process and its
    children reveals whether the payload was dropped in the same session as the service write and
    where it landed. The file-write event carries no hash; if the payload is present, hash it from
    a later execution or retrieve it for a reputation lookup. Absence of the file suggests either a
    staged-but-incomplete implant or that the binary was written by a different process worth
    tracing.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Does this service configuration persist, or was the value modified again afterward?
  context: >-
    Registry key and value deletions are not observable in this telemetry, so durability is judged
    from the value's re-modification history rather than from a delete event. A service left
    configured with a boot/system/auto start-type and an ImagePath in a transient folder stays
    primed to run on every reboot. A later write that repoints ImagePath elsewhere, changes the
    start-type, or restores a benign value indicates the configuration was altered - possibly
    cleanup after the payload ran. Compare the Details values written to this key over the
    following window.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor who stages a service for persistence often makes other configuration changes in the
    same session - additional service definitions, Run keys, or Defender and firewall policy edits.
    Clustering the registry writes on this host in a short window around the alert reveals the full
    scope of changes and which process made them. The triggering Services key appears in the
    results; the signal is what else was modified and by which process, since persistence plus
    tamper edits landing together indicate a hands-on session or an installer-style implant.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has this service key been modified before on this host?
  context: >-
    Service definitions change rarely and usually only during software installation or updates, so
    a history with no prior writes to this key makes this a first-time change and raises its
    weight. A history of periodic writes to the same service points instead to a management process
    or a repeatedly run installer. Compare the historical Details values to see whether the same
    ImagePath or start-type was set before or whether this configuration is new to the host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: When this host has previously fired this service-staging pattern, what programs and users drove it, and does this alert fit?
  context: >-
    Even legitimate deployment tools can occasionally write services from unusual locations.
    This query mirrors the rule's own selection - a Services Start or ImagePath write tied to a
    suspicious folder - scoped to this host, so the resulting program and user distribution
    reflects how this specific firing pattern has historically run here rather than generic
    service activity. A new acting program process, an unexpected account, or a first-time
    appearance of the pattern is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection_service_start:
        TargetObject|startswith: HKLM\System\CurrentControlSet\Services\
        TargetObject|endswith: \Start
        Image|contains:
        - \Users\Public\
        - \Perflogs\
        - \ADMIN$\
        - \Temp\
        Details:
        - DWORD (0x00000000)
        - DWORD (0x00000001)
        - DWORD (0x00000002)
      selection_service_imagepath:
        TargetObject|startswith: HKLM\System\CurrentControlSet\Services\
        TargetObject|endswith: \ImagePath
        Details|contains:
        - \Users\Public\
        - \Perflogs\
        - \ADMIN$\
        - \Temp\
      filter_optional_avast:
        Image|contains|all:
        - \Common Files\
        - \Temp\
      filter_optional_mbamservice:
        TargetObject|endswith: \CurrentControlSet\Services\MBAMInstallerService\ImagePath
        Details|endswith: \AppData\Local\Temp\MBAMInstallerService.exe"
        Image: C:\Windows\system32\services.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts fired this service-staging pattern in the past week, and does the distribution look like automation or one-off activity?
  context: >-
    This query mirrors the rule's selection with no host scope, giving a fleet-wide count of the
    service-staging pattern rather than generic service usage. Many hosts firing the same pattern
    points to a scripted deployment or a mis-scoped installer that drops service binaries into a
    shared temporary path; one host or a small unrelated set points to targeted, hands-on activity.
    Use the cross-host distribution and the consistency of the writing process to calibrate
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection_service_start:
        TargetObject|startswith: HKLM\System\CurrentControlSet\Services\
        TargetObject|endswith: \Start
        Image|contains:
        - \Users\Public\
        - \Perflogs\
        - \ADMIN$\
        - \Temp\
        Details:
        - DWORD (0x00000000)
        - DWORD (0x00000001)
        - DWORD (0x00000002)
      selection_service_imagepath:
        TargetObject|startswith: HKLM\System\CurrentControlSet\Services\
        TargetObject|endswith: \ImagePath
        Details|contains:
        - \Users\Public\
        - \Perflogs\
        - \ADMIN$\
        - \Temp\
      filter_optional_avast:
        Image|contains|all:
        - \Common Files\
        - \Temp\
      filter_optional_mbamservice:
        TargetObject|endswith: \CurrentControlSet\Services\MBAMInstallerService\ImagePath
        Details|endswith: \AppData\Local\Temp\MBAMInstallerService.exe"
        Image: C:\Windows\system32\services.exe
      condition: 1 of selection_* and not 1 of filter_optional_*
    fields:
    - host.name
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A service being staged for persistence rarely happens in isolation. Aggregating process
    activity in a tight window around the alert surfaces what led up to the service write and what
    ran immediately after it. Novel parent-child pairs stand out at low counts against high-count
    routine telemetry, which is what points to the tool that dropped or configured the service and
    any follow-on actions once it ran.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, execution of scripting tools, credential
    access, or defense tampering - may reveal the stages that preceded this service write and help
    reconstruct the timeline. Service persistence is commonly established after an initial foothold
    is gained, so prior alerts help place this configuration change within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Attackers rarely rely on a single persistence mechanism. After configuring a service, they
    commonly install backup footholds using different techniques - scheduled tasks, additional
    services, registry Run keys, BITS jobs, or WMI subscriptions. Executions of schtasks.exe,
    sc.exe, reg.exe, bitsadmin.exe, or wmic.exe near the service write indicate intentional
    stacking of persistence rather than an isolated administrative change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely - dropping an executable or
    script into a Startup folder or a path referenced by a registry Run key achieves persistence
    without invoking service-control tooling. File writes to these locations near the service
    configuration indicate a parallel persistence mechanism was established on disk alongside the
    service.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Was this service deployment covered by a change ticket, maintenance window, or documented approval?
  context: >-
    Many organizations require change tickets for installing or reconfiguring services, especially
    those that run at boot or under SYSTEM. A corresponding ticket or an active maintenance window
    suggests authorized software deployment; absence of one when policy requires it, particularly
    for a service binary staged in a temporary directory, suggests the change was unauthorized.
    This check can quickly close a false positive or escalate a true positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the user or an administrator recall installing or reconfiguring this service?
  context: >-
    Direct confirmation from the account owner or the responsible administrator is often the
    fastest path to determining legitimacy. If an administrator or a deployment process installed
    the service, that closes the alert; if no one recalls the action, the account may be
    compromised or the change was made by automated tooling, and the investigation should continue
    into the writing process, the referenced binary, and any follow-on execution. For a machine or
    SYSTEM context, ask whether the team responsible for the affected service recalls initiating
    the change.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
