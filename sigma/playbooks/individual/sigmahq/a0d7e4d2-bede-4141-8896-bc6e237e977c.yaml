- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate
    context: what led to this download, what happened after, and whether it is part of a larger
    sequence. Look for reconnaissance, privilege escalation, or persistence mechanisms appearing as
    novel parent-child pairs at low counts.'
