name: Registry Enumeration via WMI Stdregprov
id: 95af94d7-e6ad-4e19-bc6c-9d792faa1ae4
description: |
  Detects wmic.exe invoking the WMI StdRegProv class's read methods -- EnumKey, EnumValues, CheckAccess, GetStringValue, GetDWORDValue, GetBinaryValue, GetQWORDValue, GetExpandedStringValue, GetMultiStringValue, or GetSecurityDescriptor -- to enumerate or read Windows registry keys and values. StdRegProv is a built-in WMI provider that gives full registry read access without launching reg.exe or regedit.exe, so this pattern can reflect reconnaissance for configuration data, credentials, or installed software while sidestepping detections scoped to conventional registry-query tools. The same methods are also used by legitimate administration, inventory, and configuration-management scripting. The investigation should determine which hive, key, and value the call targeted, whether the user and host routinely perform this kind of query, whether the invocation or its parent process took other actions, and whether the activity is isolated or part of a broader reconnaissance or automation pattern.
type: detection
detection_id: a0e417e2-2fa1-40da-b6d2-e094cd5e1191
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the command line show wmic.exe calling a StdRegProv read method?
  context: >-
    The rule fires only when the command line references stdregprov, includes call, and names one of the read
    methods -- EnumKey, EnumValues, CheckAccess, or a Get*Value/GetSecurityDescriptor variant. Confirm the exact
    method invoked and the process identity before investing further analysis time; a command line missing any of
    these elements does not match what the rule detects.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user or host expected to enumerate the registry through WMI?
  context: >-
    Administrators and inventory or configuration-management scripts legitimately use StdRegProv to read registry
    values without launching reg.exe. Knowing whether the user's role and the host's function are consistent with
    scripted registry queries is often the fastest way to separate routine administration from reconnaissance. When
    the alert fires under SYSTEM, a service account, or a computer account, user attribution will not help --
    prefer the launch-mechanism questions instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What registry hive, key path, and value did the StdRegProv call target?
  context: >-
    The full command line carries the method name and its arguments -- the hive constant, key path, and, for
    Get*Value calls, the value name being read. Decoding these identifies exactly what configuration data,
    credential-adjacent value, or software-inventory location was queried. Recon-relevant targets include
    installed-software uninstall keys, CurrentVersion branches, and security or logon-policy settings. Multiple
    sequential wmic invocations on this host within the window may together enumerate a whole key tree rather than
    a single value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Did the WMI-Activity operational channel record a provider load around this call?
  context: >-
    Invoking a WMI class method causes the hosting provider to start, which the WMI-Activity
    operational channel records as a provider-start event (5857) independent of process
    telemetry. A provider event lining up with the alerting command corroborates that the
    StdRegProv method actually executed — the ProviderName and HostProcess columns show which
    provider loaded and in which host process, and message carries the readable narrative. Hosts
    that do not ship the WMI-Activity channel return no data here, so treat zero results as a
    visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: wmi
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 5857
      condition: selection
    fields:
      - EventID
      - winlog.user_data.ProviderName
      - winlog.user_data.HostProcess
      - message
- question: Did wmic.exe make outbound connections consistent with remote WMI execution?
  context: >-
    StdRegProv methods can be invoked against a remote system over DCOM or WinRM by adding a target node to the
    same wmic call, without changing the command pattern this rule detects. Outbound connections from the wmic.exe
    process to the RPC endpoint mapper (port 135), a dynamic RPC port, or WinRM (5985/5986) indicate the registry
    read was aimed at another host rather than the local system. Weigh the number of distinct destinations reached
    -- a single consistent target reads differently from many hosts contacted in the same window. No outbound
    connections support a local-only read.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: What process spawned wmic.exe, and is this a normal pattern for this host?
  context: >-
    Legitimate registry queries through wmic are typically launched from an interactive console, a scheduled task,
    or a management agent. wmic spawned by a script host (wscript.exe, cscript.exe, mshta.exe), a command
    interpreter driven by a remote session, or an Office application points to automated or hands-on reconnaissance
    rather than routine administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Did other reconnaissance commands run on this host around the same time?
  context: >-
    A single registry query may be routine troubleshooting, but multiple discovery commands in rapid succession --
    whoami, systeminfo, net user, nltest -- is a signature pattern of post-compromise enumeration. Attackers commonly
    run these commands to understand their environment before moving to the next stage.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: Were any registry values modified on this host in the same session?
  context: >-
    Registry enumeration through WMI often precedes or accompanies a write -- the actor reads a key to confirm a
    setting, product install, or configuration path, then modifies it directly or stages a related change through
    reg.exe or regedit.exe. Registry writes clustered near the enumeration reveal whether the activity moved from
    discovery into tampering.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- question: When this host has previously run this exact StdRegProv enumeration pattern, what parents and users
    drove it, and does the current alert fit that history?
  context: >-
    The query mirrors the rule's selection structure scoped to this host -- the resulting parent and user
    distribution reflects how this specific StdRegProv read pattern, not generic wmic usage, has historically run
    here. A new parent process, an unexpected user account, or an unusual command-line structure is the deviation
    worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains|all:
        - stdregprov
        - call
        CommandLine|contains:
        - CheckAccess
        - EnumKey
        - EnumValues
        - GetBinaryValue
        - GetDWORDValue
        - GetExpandedStringValue
        - GetMultiStringValue
        - GetQWORDValue
        - GetSecurityDescriptor
        - GetStringValue
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user -- the result is the user's 90-day
    history of this specific StdRegProv read pattern, not generic use of wmic, aggregated by host. A user who has
    never produced this pattern is more suspicious than one who does so regularly; weigh the count against the
    user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains|all:
        - stdregprov
        - call
        CommandLine|contains:
        - CheckAccess
        - EnumKey
        - EnumValues
        - GetBinaryValue
        - GetDWORDValue
        - GetExpandedStringValue
        - GetMultiStringValue
        - GetQWORDValue
        - GetSecurityDescriptor
        - GetStringValue
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this parent process historically driven the rule's pattern on this host or across the environment,
    or is the parent new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute behavior. The meaningful pivot
    is the launch mechanism: the query mirrors the rule's selection structure scoped to the alerting parent process,
    so the result is the 90-day history of this parent driving this specific pattern, not generic parent+binary
    co-occurrence. A new or rare parent for this pattern is the deviation worth chasing; a parent that already
    accounts for thousands of prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains|all:
        - stdregprov
        - call
        CommandLine|contains:
        - CheckAccess
        - EnumKey
        - EnumValues
        - GetBinaryValue
        - GetDWORDValue
        - GetExpandedStringValue
        - GetMultiStringValue
        - GetQWORDValue
        - GetSecurityDescriptor
        - GetStringValue
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints.
    If the same user triggered similar activity on multiple hosts, the scope of the reconnaissance may be larger
    than a single system.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same parent-driven pattern fire on other hosts in the same window -- i.e., is this a
    coordinated automation rollout, or is the activity isolated to this host?
  context: >-
    Under a service principal, "what else did this user do across the network" returns agent-telemetry noise
    (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same launch mechanism
    fired elsewhere: the query mirrors the rule's selection structure scoped to the alerting parent process,
    fleet-wide, in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a
    single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains|all:
        - stdregprov
        - call
        CommandLine|contains:
        - CheckAccess
        - EnumKey
        - EnumValues
        - GetBinaryValue
        - GetDWORDValue
        - GetExpandedStringValue
        - GetMultiStringValue
        - GetQWORDValue
        - GetSecurityDescriptor
        - GetStringValue
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look
    like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the
    rule's firing pattern, not generic usage of wmic. Many hosts firing the same pattern points to scripted
    deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the
    host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains|all:
        - stdregprov
        - call
        CommandLine|contains:
        - CheckAccess
        - EnumKey
        - EnumValues
        - GetBinaryValue
        - GetDWORDValue
        - GetExpandedStringValue
        - GetMultiStringValue
        - GetQWORDValue
        - GetSecurityDescriptor
        - GetStringValue
      condition: all of selection_*
    fields:
    - host.name
- question: Were other tools used to enumerate the registry on this host recently?
  context: >-
    Attackers who use WMI for registry reconnaissance often pair it with, or fall back to, other enumeration paths
    -- reg.exe query operations, regedit.exe automation, or PowerShell registry cmdlets such as Get-ItemProperty
    and Get-ChildItem against the Registry provider. Finding several of these methods used for the same objective
    strengthens the case for deliberate configuration or credential reconnaissance over a one-off administrative
    check.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
          - '\powershell.exe'
          - '\pwsh.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was wmic.exe executed from its expected system path?
  context: >-
    wmic.exe normally runs from System32\wbem. A copy running from a temp, profile, or staging directory under a
    name that does not match its OriginalFileName indicates the binary was relocated to evade path-based controls,
    which is a stronger reconnaissance-tool-staging signal than a StdRegProv call alone.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host run this exact StdRegProv pattern over the past 90 days, and what command-line
    structures are typical?
  context: >-
    A StdRegProv read pattern with no prior history on a host is more suspicious than one used daily under stable
    parents. The query mirrors the rule's selection structure scoped to this host, so the resulting count reflects
    the rule's specific firing pattern, not generic usage of wmic. The CommandLine projection lets the analyst
    compare typical invocation patterns -- which methods and keys are normally queried -- against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains|all:
        - stdregprov
        - call
        CommandLine|contains:
        - CheckAccess
        - EnumKey
        - EnumValues
        - GetBinaryValue
        - GetDWORDValue
        - GetExpandedStringValue
        - GetMultiStringValue
        - GetQWORDValue
        - GetSecurityDescriptor
        - GetStringValue
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Registry reconnaissance often follows an initial foothold. Earlier detections on this host -- defense
    tampering, script execution, or other discovery activity -- may reveal how access to run this query was
    obtained and help reconstruct the attack timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
