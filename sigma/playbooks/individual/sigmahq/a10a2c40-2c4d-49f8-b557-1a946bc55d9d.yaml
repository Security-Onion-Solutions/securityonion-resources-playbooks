name: Uncommon File Created In Office Startup Folder
id: 454ae7ff-62ff-4f9b-8156-3188ac191ee9
description: |
  Detects the creation of a file with an uncommon extension in a Microsoft Office application
  startup folder - either the per-user Word Startup folder (a path containing
  \Microsoft\Word\STARTUP) or the Excel XLSTART folder (a path containing \Microsoft\Excel\XLSTART),
  as well as the Program Files Office STARTUP and XLSTART locations. The rule fires when a file lands
  in one of those folders AND its extension is not one of the standard Office document, template, or
  add-in extensions (.docm, .dotm, .xll, .xlsm, and similar) AND the writing process is not an Office
  binary itself (winword.exe, excel.exe, or OfficeClickToRun.exe). Files placed in these folders are
  loaded automatically the next time Word or Excel starts, and any macros or add-in code they carry
  run automatically when the location is trusted, which makes the folders an autorun-on-launch
  persistence location. Because Office's own processes are excluded, a match means a non-Office
  process dropped a file with an unusual extension into an autoload path. Investigate what the file
  is, which process created it and what launched that process, whether it was subsequently executed,
  and whether the same file appears on other hosts.
type: detection
detection_id: a10a2c40-2c4d-49f8-b557-1a946bc55d9d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Was a file with an uncommon extension created in a Word Startup or Excel XLSTART folder by a process other than Office itself?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires on
    either of two branches - a file created in a path containing \Microsoft\Word\STARTUP, or one in a
    path containing \Microsoft\Excel\XLSTART (and the equivalent Program Files Office STARTUP/XLSTART
    locations) - when the extension is not a standard Office format and the creating process is not
    winword.exe, excel.exe, or OfficeClickToRun.exe. Review the exact TargetFilename, its extension,
    and the responsible process on the triggering event, and note which of the two folders fired, as
    that determines whether Word or Excel is the application set to auto-load the file.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to write files into an Office application startup folder?
  context: >-
    Legitimate additions to a Word Startup or Excel XLSTART folder are usually made by an
    administrator installing an add-in or by the Office installer, not by an arbitrary user process.
    Knowing whether the writing account and host function match a sanctioned add-in deployment is the
    fastest way to separate managed configuration from an unexpected drop. User attribution is present
    on roughly 94% of endpoint file events; when it is a machine account or missing, judge by the
    writing process and the host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What is the content of the file dropped into the startup folder?
  context: >-
    The file itself carries the answer to whether this is a benign add-in or a malicious autoload
    payload. Retrieve it from its on-disk path and examine the content: for scripts and templates,
    check for macros, base64 or otherwise encoded strings, embedded URLs or IP addresses, and known
    malicious string patterns; for binaries and add-ins, check imports, embedded strings, packer
    signatures, and signing status. A template or add-in placed here executes any macro code it
    contains when the Office application next launches, so the content determines what would run.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If this file has executed, what is its hash and does it have known threat-intel detections?
  context: >-
    A file's hash is recorded when it runs, not when it is written, so file-creation events carry no
    hash. This query looks for the dropped file executing as a process and reads its hash; submit that
    hash to a reputation or threat-intelligence source to determine whether it is known malicious,
    benign, or previously unseen. An Office add-in loaded by winword.exe or excel.exe may not appear
    as its own process - if the file is present but has not executed, retrieve it from its on-disk path
    and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
- question: What process created this file, and what launched that process?
  context: >-
    The file event carries the responsible process's identifiers but not its command line or parent,
    so pivot by ProcessGuid to the writing process's own record to read its Image, full command line,
    and parent lineage. Because Office binaries are excluded by the rule, the writer is something else
    - a script host such as wscript.exe or mshta.exe, an installer, a copy operation, or an unsigned
    binary. A scripted or unexpected parent chain points to the drop being staged programmatically
    rather than an administrator installing an add-in by hand.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A process that drops one file into an autoload folder often touches several - staging a template
    plus a payload, unpacking components, or writing to multiple persistence locations at once. The
    breadth, paths, and extensions of the writing process's other file activity distinguish a single
    add-in drop from a wider staging operation and enumerate what else needs review. The alert's file
    event carries the process identifiers, so the correlation covers the writer and its direct children.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to the Office startup folders recently, and by which processes?
  context: >-
    The Word Startup and Excel XLSTART folders have a small set of processes that legitimately write
    there - chiefly the Office installer and add-in deployment tooling. Other recent arrivals in the
    same folders reveal whether this is an isolated drop or a location under active use, and which
    other files belong to the same activity. A single unfamiliar writer across several files in these
    autoload paths is the signal to follow.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - '\Microsoft\Word\STARTUP'
          - '\Microsoft\Excel\XLSTART'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Was this file executed after it was created?
  context: >-
    A file may appear in a file event when created and later in process telemetry when executed.
    Correlating across those log types reveals whether the dropped file progressed from delivery to
    execution as its own process. For a template or add-in that runs inside an Office application, the
    execution may instead show as macro-driven child processes of winword.exe or excel.exe rather than
    the file running directly, so weigh the absence of a direct execution against that path.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
- question: Has this file been seen before on this host?
  context: >-
    A file that has never been seen on a host is more suspicious than one that is part of normal
    operations. First-time appearance of a file in an Office startup folder, even with a benign-looking
    name, should be checked. Zero or very low historical counts indicate a new or unusual file; a
    history of periodic writes points instead to a management process or a repeatedly deployed add-in.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Is this file present on any other hosts in the environment?
  context: >-
    Finding the same file in Office startup folders across multiple hosts may indicate a distributed
    add-in push or the same technique applied at scale; finding it on only one host suggests a targeted
    drop. Compare where the file appears and which process wrote it on each host to separate a
    consistent deployment from repeated hands-on activity. For a file with a generic name, corroborate
    with the content or hash rather than the filename alone.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- question: Does this host normally run the process that created the file?
  context: >-
    A process that has never been seen on a host is more suspicious than one that runs regularly. Zero
    or very low historical counts for the writing binary indicate first-time or rare execution, which
    weighs toward the drop being unexpected rather than routine. If the writer is a common script host
    or utility, weigh the count against how often it legitimately writes to Office autoload folders
    rather than how often it runs at all.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- always_include: true
  question: Has this user produced the rule's pattern before, and does that history fit their role?
  context: >-
    This query mirrors the rule's selection structure scoped to the alerting user, so the result is
    the user's 90-day history of this specific pattern - a non-Office process dropping an uncommon-extension
    file into an Office startup folder - aggregated by host, not generic file activity. A user who has
    never produced this pattern is more suspicious than one who does so regularly; weigh the count
    against the user's role and whether they administer Office add-ins.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection_word_paths:
      - TargetFilename|contains: \Microsoft\Word\STARTUP
      - TargetFilename|contains|all:
        - \Office
        - \Program Files
        - \STARTUP
      filter_exclude_word_ext:
        TargetFilename|endswith:
        - .docb
        - .docm
        - .docx
        - .dotm
        - .mdb
        - .mdw
        - .pdf
        - .wll
        - .wwl
      selection_excel_paths:
      - TargetFilename|contains: \Microsoft\Excel\XLSTART
      - TargetFilename|contains|all:
        - \Office
        - \Program Files
        - \XLSTART
      filter_exclude_excel_ext:
        TargetFilename|endswith:
        - .xll
        - .xls
        - .xlsm
        - .xlsx
        - .xlt
        - .xltm
        - .xlw
      filter_main_office_click_to_run:
        Image|contains: :\Program Files\Common Files\Microsoft Shared\ClickToRun\
        Image|endswith: \OfficeClickToRun.exe
      filter_main_office_apps:
        Image|contains:
        - :\Program Files\Microsoft Office\
        - :\Program Files (x86)\Microsoft Office\
        Image|endswith:
        - \winword.exe
        - \excel.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (((selection_word_paths and not filter_exclude_word_ext) or (selection_excel_paths and not filter_exclude_excel_ext)) and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven the rule's pattern, or is the program new for this activity?
  context: >-
    When the alert fires under a machine or service account, user identity does not attribute the
    behavior, so the meaningful pivot is the launch mechanism. This query mirrors the rule's selection
    structure scoped to the alerting program, giving the 90-day history of that program driving
    this specific drop pattern rather than generic program activity. A new or rare program for this
    pattern is the deviation worth chasing; a program that already accounts for many prior events is
    deployment tooling or an installer.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection_word_paths:
      - TargetFilename|contains: \Microsoft\Word\STARTUP
      - TargetFilename|contains|all:
        - \Office
        - \Program Files
        - \STARTUP
      filter_exclude_word_ext:
        TargetFilename|endswith:
        - .docb
        - .docm
        - .docx
        - .dotm
        - .mdb
        - .mdw
        - .pdf
        - .wll
        - .wwl
      selection_excel_paths:
      - TargetFilename|contains: \Microsoft\Excel\XLSTART
      - TargetFilename|contains|all:
        - \Office
        - \Program Files
        - \XLSTART
      filter_exclude_excel_ext:
        TargetFilename|endswith:
        - .xll
        - .xls
        - .xlsm
        - .xlsx
        - .xlt
        - .xltm
        - .xlw
      filter_main_office_click_to_run:
        Image|contains: :\Program Files\Common Files\Microsoft Shared\ClickToRun\
        Image|endswith: \OfficeClickToRun.exe
      filter_main_office_apps:
        Image|contains:
        - :\Program Files\Microsoft Office\
        - :\Program Files (x86)\Microsoft Office\
        Image|endswith:
        - \winword.exe
        - \excel.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (((selection_word_paths and not filter_exclude_word_ext) or (selection_excel_paths and not filter_exclude_excel_ext)) and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether the drop is isolated or part of
    broader multi-host activity by the same account. If the same user triggered similar activity on
    several hosts in the same window, the scope of the operation is larger than one endpoint. When the
    alert fires under a service or machine account, this pivot returns agent-telemetry noise and the
    parent-driven fleet check is the meaningful view.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window?
  context: >-
    Under a service or machine account, asking what else the user did returns telemetry from every
    host running that account and drowns the signal, so the meaningful question is whether the same
    launch mechanism fired elsewhere. This query mirrors the rule's selection structure scoped to the
    alerting program, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection_word_paths:
      - TargetFilename|contains: \Microsoft\Word\STARTUP
      - TargetFilename|contains|all:
        - \Office
        - \Program Files
        - \STARTUP
      filter_exclude_word_ext:
        TargetFilename|endswith:
        - .docb
        - .docm
        - .docx
        - .dotm
        - .mdb
        - .mdw
        - .pdf
        - .wll
        - .wwl
      selection_excel_paths:
      - TargetFilename|contains: \Microsoft\Excel\XLSTART
      - TargetFilename|contains|all:
        - \Office
        - \Program Files
        - \XLSTART
      filter_exclude_excel_ext:
        TargetFilename|endswith:
        - .xll
        - .xls
        - .xlsm
        - .xlsx
        - .xlt
        - .xltm
        - .xlw
      filter_main_office_click_to_run:
        Image|contains: :\Program Files\Common Files\Microsoft Shared\ClickToRun\
        Image|endswith: \OfficeClickToRun.exe
      filter_main_office_apps:
        Image|contains:
        - :\Program Files\Microsoft Office\
        - :\Program Files (x86)\Microsoft Office\
        Image|endswith:
        - \winword.exe
        - \excel.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (((selection_word_paths and not filter_exclude_word_ext) or (selection_excel_paths and not filter_exclude_excel_ext)) and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Is the file still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives both urgency and next steps. A payload still on disk can be
    retrieved, hashed, and analyzed; a file deleted seconds after creation suggests anti-forensic
    cleanup or a self-deleting dropper and shifts the investigation toward what executed in between.
    Interpret the operation type on each event - a deletion shortly after creation is the cleanup
    signature, while a rename may indicate the file was moved into its final autoload name.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity in a tight window around the alert
    surfaces what led up to the file drop and what ran immediately after it. Novel parent-child pairs
    stand out at low counts against high-count routine telemetry, which is what points to the tool that
    staged the drop and any follow-on execution once the file was in place.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, execution of scripting tools, or defense
    tampering - may reveal the stages that preceded this drop and help reconstruct the timeline.
    Dropping an autoload file into an Office startup folder is a persistence step, so prior alerts help
    place it within a larger sequence of activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
