name: Suspicious Advpack Call Via Rundll32.EXE
id: da3ea0aa-d507-4298-aad4-567e84dd5879
description: |
  Detects rundll32.exe invoking advpack.dll via an obfuscated ordinal call to reach the RegisterOCX function,
  which can proxy-execute an arbitrary command supplied as an argument. The rule fires when all of the following match:
  the process is rundll32 (Image, OriginalFileName, or a rundll32 reference on the command line) AND the command line
  references advpack AND the command line uses an ordinal form (a positive ordinal #+ with 12, or a negative-number ordinal
  #- that the conversion routine resolves back to 12). Naming the function by ordinal instead of by name is an evasion
  intended to obscure the RegisterOCX call. Investigation should determine what command the call was set up to launch,
  what parent invoked rundll32, and whether the host or user has any legitimate history of this pattern.
type: detection
detection_id: a1473adb-5338-4a20-b4c3-126763e2d3d3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: "Does the command line show rundll32 calling advpack by ordinal (a positive #+ with 12, or a #- negative-number ordinal)?"
  context: >-
    Before investing investigation time, confirm the alert is a true positive. Review the full command line for the
    advpack reference together with an ordinal call form — a positive ordinal containing "#+" and 12, or a negative-number
    ordinal beginning with "#-" that resolves back to 12 — and note the argument that follows the ordinal, since that
    argument is the command RegisterOCX is set up to launch.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run rundll32 with ordinal-based DLL function calls?
  context: Legitimate administrative activity can trigger this detection, but calling advpack by ordinal rather than by the
    RegisterOCX name is uncommon outside of deliberate obfuscation. Knowing whether this user role and host function ever
    involve hand-built rundll32 invocations is often the fastest way to separate a true positive from routine operations.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What command was advpack's RegisterOCX call set up to launch, and what does the full rundll32 argument string decode to?
  context: The full command line reveals the action taken. Identify the advpack/ordinal portion, then read the argument that
    follows the ordinal — that argument is passed to RegisterOCX and is the command the call proxy-executes. Note any file
    path, script, or secondary binary named there, and whether the ordinal uses the positive (#+ 12) or negative (#-) form.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this rundll32 instance, and is that parent chain expected?
  context: The parent process reveals how rundll32 was invoked. Expected parents for ordinary rundll32 usage are predictable
    (explorer.exe for user actions, services.exe for service-hosted work). Parents such as a script host, an Office
    application, or a shell launched from an email or browser context point toward macro- or exploit-driven execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Does this host normally run rundll32.exe?
  context: rundll32.exe is a routine system binary, so raw execution counts are high almost everywhere; what matters is the
    baseline this query establishes for later comparison against the ordinal-advpack pattern. Use it together with the
    rule-pattern history question to judge whether the specific firing is novel for this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's ordinal-advpack pattern, what parents and users drove it, and does the current alert fit?
  context: Even a routine binary can be abused. The query mirrors the rule's selection structure scoped to this host, so the
    resulting parent and user distribution reflects how this specific firing pattern — not generic rundll32 usage — has run
    here before. A new parent process, an unexpected user account, or a first-ever occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      - CommandLine|contains: rundll32
      selection_cli_dll:
        CommandLine|contains: advpack
      selection_cli_ordinal:
      - CommandLine|contains|all:
        - '#+'
        - '12'
      - CommandLine|contains: '#-'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did this rundll32 instance spawn afterward?
  context: The argument passed to RegisterOCX is proxy-executed, so any process launched by this rundll32 instance is the
    actual payload of the call. Children such as cmd.exe, powershell.exe, certutil.exe, or an unsigned binary from a
    user-writable path indicate post-exploitation activity rather than benign DLL handling.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other tools ran on this host around the same time?
  context: Proxy-execution rarely stands alone. Activity surrounding this event may reveal reconnaissance, privilege
    escalation, persistence installation, or staging of a payload that the advpack call was used to launch, giving broader
    context to the investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      - CommandLine|contains: rundll32
      selection_cli_dll:
        CommandLine|contains: advpack
      selection_cli_ordinal:
      - CommandLine|contains|all:
        - '#+'
        - '12'
      - CommandLine|contains: '#-'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      - CommandLine|contains: rundll32
      selection_cli_dll:
        CommandLine|contains: advpack
      selection_cli_ordinal:
      - CommandLine|contains|all:
        - '#+'
        - '12'
      - CommandLine|contains: '#-'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If
    the same user triggered similar activity on more than one host, the scope of the event may be larger than the single
    alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      - CommandLine|contains: rundll32
      selection_cli_dll:
        CommandLine|contains: advpack
      selection_cli_ordinal:
      - CommandLine|contains|all:
        - '#+'
        - '12'
      - CommandLine|contains: '#-'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to
    this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege
    escalation, or persistence mechanisms near the alert time.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the
    stages that preceded this proxy-execution and help reconstruct the timeline. The sequence of prior alerts often shows
    how the operator reached the point of launching an obfuscated rundll32 call.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired the rule's ordinal-advpack pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, producing a fleet-wide count of this specific
    firing pattern rather than generic rundll32 usage. Many hosts firing the same pattern points to scripted deployment or
    vendor automation; a single host or a small unrelated set points to manual operator activity. Use the host distribution
    to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      - CommandLine|contains: rundll32
      selection_cli_dll:
        CommandLine|contains: advpack
      selection_cli_ordinal:
      - CommandLine|contains|all:
        - '#+'
        - '12'
      - CommandLine|contains: '#-'
      condition: all of selection_*
    fields:
    - host.name
- question: Were any other proxy-execution LOLBins used on this host recently?
  context: Operators who reach code execution through one proxy-execution binary often use several. If rundll32 was used to
    launch a command via advpack, check whether regsvr32, mshta, msbuild, installutil, msiexec, or similar binaries were
    also used to run arbitrary code. Multiple such binaries performing the same objective strengthens the case for malicious
    activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
          - '\installutil.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was rundll32.exe executed from an expected path, or from a copied or renamed location?
  context: rundll32 executed from outside System32 or SysWOW64 may indicate the binary was copied or renamed to evade
    path-based allowlists. Confirm the executable path and OriginalFileName from the alert event — a rundll32 running from a
    user temp or profile directory is more notable than one in System32.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired the rule's ordinal-advpack pattern over the past 90 days, and what command-line structures are typical?
  context: An ordinal-advpack pattern with no prior history on a host is more notable than one used regularly under stable
    parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects this specific
    firing pattern rather than generic rundll32 usage. The command-line projection lets the analyst compare typical
    invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      - CommandLine|contains: rundll32
      selection_cli_dll:
        CommandLine|contains: advpack
      selection_cli_ordinal:
      - CommandLine|contains|all:
        - '#+'
        - '12'
      - CommandLine|contains: '#-'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
