name: Moriya Rootkit File Created
id: 5e1d8ce6-dde9-4e76-aaa7-b43275ab27fc
description: |
  Detects creation of the file MoriyaStreamWatchmen.sys in C:\Windows\System32\drivers, the
  kernel-mode driver component of the Moriya rootkit. Moriya is a passive backdoor whose driver uses
  Windows Filtering Platform callouts to inspect inbound packets and hand attacker traffic to a
  user-mode agent, opening a covert channel that spawns cmd.exe for command execution and can start a
  reverse shell on a trigger packet. Placing a .sys file in the drivers directory is the setup for a
  kernel-mode service, so the file drop rarely occurs alone: it is normally accompanied by a service
  registration under HKLM\System\CurrentControlSet\Services that points at the driver, plus a
  user-mode agent DLL. Legitimate creation of this exact filename does not occur; investigate what
  wrote the driver and what launched that process, whether a kernel service was registered to load it,
  whether the driver is signed, and whether the file is still on disk or was removed to hide it.
type: detection
detection_id: a1507d71-0b60-44f6-b17c-bf53220fdd88
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Was the file MoriyaStreamWatchmen.sys created in the System32 drivers directory on this host?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires on a
    single fixed path: creation of MoriyaStreamWatchmen.sys in C:\Windows\System32\drivers. Review the
    exact TargetFilename, the operation performed, and the responsible process on the triggering event.
    This filename has no legitimate use, so a genuine creation event is the kernel-driver drop stage of
    the rootkit rather than a benign administrative action.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this host and the writing account expected to drop a kernel driver into the System32 drivers directory?
  context: >-
    Writing a .sys file to the drivers directory is a privileged operation normally performed only by
    the operating system, signed installers, or driver management tooling. Knowing whether the host
    role and the responsible account match any sanctioned driver deployment is the fastest way to
    separate a genuine install from the rootkit drop. User attribution is present on roughly 94% of
    endpoint file events; when the account is SYSTEM or a machine account, judge by the writing process
    and host function instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the dropped .sys file the Moriya driver, and is it signed?
  context: >-
    The filename alone is a strong lead, but confirm the artifact by retrieving it from disk and
    examining it. Check the digital signature and signing chain: a legitimate kernel driver is
    Microsoft- or vendor-signed, while the Moriya driver is an unsigned or anomalously signed
    kernel-mode binary. Look at embedded strings and imports for Windows Filtering Platform callout
    routines and named-pipe or cmd.exe references that indicate the covert-channel backdoor. This
    content check distinguishes the real driver from an unrelated or decoy file with a matching name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Was a kernel-mode service registered to load this driver, and under what account and start type?
  context: >-
    A driver in the drivers directory only runs once a kernel-mode service is registered to load it, so
    the service-installation record is the persistence half of this activity. The installation event
    carries the service name, the ImagePath pointing at the driver, the start type, and the account. A
    rarely seen service name pointing at MoriyaStreamWatchmen.sys, an auto or boot start type, and a
    LocalSystem account together indicate a kernel driver being wired to load persistently rather than
    a routine signed-driver install.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: system
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 7045
      condition: selection
    fields:
      - ServiceName
      - ImagePath
      - StartType
      - AccountName
- question: Was a Services registry key created that references this driver as its image path?
  context: >-
    Kernel drivers are wired to load through HKLM\System\CurrentControlSet\Services, where a service
    subkey holds an ImagePath value pointing at the .sys file, a Type marking it a kernel driver, and a
    Start value controlling when it loads. A registry write whose value data references
    MoriyaStreamWatchmen.sys is the service-registration step that makes the driver load on boot. This
    is a distinct evidence source from the service-installation event and captures the wiring even when
    the driver is registered directly through the registry rather than through service-control tooling.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Details|contains: 'MoriyaStreamWatchmen'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What is the driver's hash, and does threat intelligence flag it as known malicious?
  context: >-
    File-creation events carry no hash, and a kernel driver loads in kernel space rather than running
    as a user-mode process, so it does not appear in process-execution telemetry. Retrieve the driver
    from its on-disk path, hash it, and submit that hash to threat intelligence to confirm whether it
    matches the known Moriya driver, a variant, or a previously unseen sample. The query checks whether
    this path ever ran as a user-mode process on the host; a driver normally returns nothing here,
    which itself confirms the file is a kernel component to be hashed from disk.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
- question: Which process wrote the driver, and what launched that process?
  context: >-
    The file event records the responsible process, so pivot by its ProcessGuid to the
    process-creation record to read its full command line and parent chain. A driver written by
    rundll32.exe, a script host such as wscript.exe or mshta.exe, a webshell-hosted worker process, or
    an unsigned binary points to the drop being staged by an intrusion rather than a signed installer
    or the servicing stack. The parent chain distinguishes a scripted rootkit install from a legitimate
    driver deployment.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Is the driver still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives both urgency and next steps. A driver still on disk can be
    retrieved, hashed, and analyzed; a file deleted or renamed shortly after creation suggests
    anti-forensic cleanup once the kernel service loaded it, and shifts the investigation to what the
    service and its user-mode agent did in between. Interpret the operations returned to see whether
    the driver was removed, replaced, or left in place primed to load again.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A process that drops a rootkit driver usually drops more than one component - a user-mode agent
    DLL, a loader, custom scanners, or a service helper. The breadth, paths, and extensions of the
    writing process's other file activity distinguish a single artifact from a staged toolset and
    enumerate what else needs review. Watch for additional writes into system directories, temporary
    paths, or web-server roots that belong to the same operation.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to the System32 drivers directory recently, and by which processes?
  context: >-
    The drivers directory has a small set of processes that legitimately write there - the servicing
    stack, signed installers, and driver management tooling. Other recent arrivals in the same
    directory reveal whether this is an isolated drop or a location under active use, and whether an
    unfamiliar writer placed additional .sys files alongside the rootkit driver. A single unexpected
    writer touching multiple driver files is the signal to pull forward.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\System32\drivers\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has this driver file been seen before on this host?
  context: >-
    A file that has never appeared on a host is more suspicious than one that is part of normal
    operations. The Moriya driver filename should never have a prior history on a clean system, so zero
    or very low historical counts confirm this is a first-time appearance. Any prior sightings would
    reframe the timeline toward an earlier compromise or a repeatedly run installer.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Is this driver present on any other hosts in the environment?
  context: >-
    Finding the same driver on multiple hosts points to lateral movement or a coordinated deployment of
    the rootkit; a single-host appearance points to a targeted install. Compare the writing process
    across any hosts that return results to see whether the drop is consistent, which separates a
    hands-on operation from repeated use of the same tooling across the environment. Public-facing
    servers are common early targets for this passive backdoor.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- always_include: true
  question: Has the account on this event previously produced this driver-creation pattern, and does that history fit its role?
  context: >-
    The query mirrors the rule's detection scoped to this account, returning its 90-day history of
    creating this exact driver path, aggregated by host. Because this filename has no legitimate use,
    any prior history for the account is itself notable rather than reassuring, and a first-ever
    occurrence is consistent with a fresh install. Weigh the result against whether the account is a
    human administrator, a service principal, or a machine account, since driver drops under a machine
    account point to service-driven rather than interactive activity.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename: C:\Windows\System32\drivers\MoriyaStreamWatchmen.sys
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this driver-creation pattern, or is the program new for this activity?
  context: >-
    When the alert fires under a service principal or machine account, the account name does not
    attribute behavior; the meaningful pivot is the launch mechanism. The query mirrors the rule's
    detection scoped to the alerting program, returning the 90-day history of this program
    creating this driver path. A new or rare program for this activity is the deviation worth chasing,
    while a program that already accounts for prior events would indicate an established servicing or
    management path rather than an intrusion.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename: C:\Windows\System32\drivers\MoriyaStreamWatchmen.sys
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this account do across the environment around the time of the alert?
  context: >-
    Tracking the account's activity across all hosts in the alert window reveals whether the same
    identity drove parallel activity on other endpoints, which would widen the scope of the
    compromise. If the same account touched multiple hosts around this time, the rootkit drop may be
    one step in a broader hands-on operation rather than an isolated event.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven driver creation fire on other hosts in the same window, or is it isolated to this host?
  context: >-
    Under a service principal, asking what else the account did returns agent-telemetry noise, since
    system-owned processes run constantly on every host. The meaningful question is whether the same
    launch mechanism produced this driver creation elsewhere in the alert window. Multiple hosts point
    to a pushed or scripted rollout of the rootkit; a single host points to a host-local install driven
    by a hands-on operator.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename: C:\Windows\System32\drivers\MoriyaStreamWatchmen.sys
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    A kernel-driver drop is a late stage that follows initial access and privilege escalation. Earlier
    detections on the same host - a webshell on a public-facing server, reconnaissance commands,
    credential access, or defense tampering - may reveal the stages that led to the rootkit install and
    help reconstruct the timeline. Prior alerts place this driver creation within the larger intrusion
    rather than treating it in isolation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Attackers rarely rely on a single foothold. Alongside a kernel-driver service, operators commonly
    install backup persistence using different techniques - scheduled tasks, additional services,
    registry Run keys, BITS jobs, or WMI subscriptions - created by schtasks.exe, sc.exe, reg.exe,
    bitsadmin.exe, or wmic.exe. Multiple persistence installations in the same timeframe indicate
    deliberate stacking around the rootkit rather than an isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
