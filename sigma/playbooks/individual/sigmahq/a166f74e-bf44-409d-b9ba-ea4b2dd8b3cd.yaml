name: Macro Enabled In A Potentially Suspicious Document
id: 0daea073-fd57-41ff-98d9-9b7a2a94faf7
description: |
  Detects a registry write to an Office Trusted Documents TrustRecords value where the recorded
  document path sits in a potentially suspicious location. Office writes a TrustRecord under
  HKCU\Software\Microsoft\Office\<version>\<program>\Security\Trusted Documents\TrustRecords when a
  user opens a document and clicks Enable Content or Enable Editing; the value name is the document
  path and the value data encodes what was trusted (a trailing FF FF FF 7F marks that macros were
  enabled). The rule fires only when the TargetObject contains BOTH the TrustRecords marker AND a
  location that legitimate documents rarely load from - a browser download cache (INetCache), a temp
  folder, PerfLogs, the Public profile, or an external drive - which is the registry footprint of a
  user enabling macros in a document delivered by phishing or removable media. Legitimate hits occur
  when someone deliberately trusts a document staged in one of these paths. Investigate which Office
  application and document are involved, what the application spawned once the macro was enabled,
  whether a payload was written to disk, and whether persistence or other configuration changes
  followed.
type: detection
detection_id: a166f74e-bf44-409d-b9ba-ea4b2dd8b3cd
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting registry write record a trusted document whose path is in a suspicious location?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires only
    when the TargetObject contains the ...\Security\Trusted Documents\TrustRecords marker AND the
    document path embedded in the value name resolves to a location such as a browser download cache
    (INetCache), a Temp folder, PerfLogs, the Public profile, or an external drive. Review the exact
    TargetObject on the triggering event and confirm both parts are present - a TrustRecord for a
    document loaded from one of these paths is the registry footprint of a user enabling content in a
    document that did not arrive through a normal, trusted channel.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to open and trust macro-enabled documents from these locations?
  context: >-
    Legitimate users do occasionally enable content in a document staged in a temp folder or on an
    external drive, so knowing whether this account and host routinely handle documents from download
    caches, removable media, or shared paths is often the fastest way to separate ordinary work from a
    phishing open. The writing process is the Office application itself; User attribution is present on
    roughly 94% of endpoint registry events, so the account that clicked Enable Content is usually
    visible here. When it is a machine account or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which Office application and document does this TrustRecord belong to, and why is this location notable?
  context: >-
    The TargetObject path names the Office program (Word, Excel, PowerPoint) under the Office version
    hive and carries the trusted document path as the value name. Confirming the exact key establishes
    which application recorded the trust and which document was opened, and the suspicious sub-path -
    INetCache implies a browser download, a Temp folder implies an email attachment opened in place,
    Public or an external drive implies shared or removable-media delivery - points at how the document
    reached the host. Monitored registry paths vary by environment; the notable fact here is that a
    Trusted Documents entry was created for a non-standard load location.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What does the trust record value data indicate - were macros enabled or only editing trusted?
  context: >-
    The Details value data on a TrustRecords entry encodes what the user trusted. A trailing four bytes
    of FF FF FF 7F indicates macros were enabled for the document, whereas other trailing values
    indicate only that protected-view editing was allowed. Decoding the value data therefore
    distinguishes a document that merely left protected view from one whose macros were authorized to
    run. Details is present on roughly 79% of registry modifications; if it is absent for a binary
    value, treat the enablement as unconfirmed and rely on what the Office application spawned.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What Office application wrote this trust record, and what launched that application?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to read
    its Image, full command, and parent. The writer should be an Office application such as winword.exe,
    excel.exe, or powerpnt.exe; its parent tells you how the document was opened - explorer.exe or an
    email client for a user double-click, versus a browser or a script host for a more automated open.
    An unexpected writer or an abnormal parent lineage reframes the trust record from a routine document
    open into a delivered payload being activated.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: After the document was trusted, what child processes did the Office application spawn?
  context: >-
    Enabling macros lets the document's code run inside the Office application's process, so the
    immediate signal of malicious intent is what that application spawned next. Listing the child
    processes of the writing process reveals whether the Office application launched an interpreter or
    living-off-the-land binary - powershell.exe, cmd.exe, wscript.exe, mshta.exe, rundll32.exe,
    regsvr32.exe - which is the macro payload executing. An Office application spawning any of these
    shortly after the trust record was written ties the enabled macro to code execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did the Office application or its macro-spawned processes write any executable or script files to disk?
  context: >-
    A macro frequently drops a payload - an executable, script, or DLL - before or instead of running
    an inline command, and that dropped file is what establishes a foothold beyond the current process.
    Correlating file activity by the writing Office process and its children surfaces any files written
    in the same session, which can be reputation-checked or hashed from a later execution. The file-write
    event carries no hash; if a payload is present, hash it from the process that later runs it. Files in
    a temp, AppData, or Public path are the common landing spots.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Does this trust record remain in place, meaning the document will run macros without prompting again?
  context: >-
    A TrustRecords entry persists, so once a document is trusted its macros run on every subsequent open
    with no warning - the trust itself is a lightweight persistence and re-execution primitive.
    Registry key or value deletions are not observable in this telemetry, so durability is judged from
    the key's re-modification history rather than from a delete event: a later write that changes or
    removes the value suggests cleanup, while the value remaining primed leaves the document set to run
    macros silently the next time it is opened. Compare the value data written over the following window.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Has this document trust record been written before on this host?
  context: >-
    Each TrustRecord value name is the specific document path, so a history with no prior writes means
    this is the first time this document was trusted on the host and raises its weight. A prior write to
    the same value indicates the document has been opened and trusted before, which points toward a
    recurring or familiar file rather than a fresh delivery. Compare the historical value data to see
    whether macros were enabled on an earlier open as well.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same document trusted on other hosts in the environment?
  context: >-
    The same document path trusted across multiple hosts points to a document distributed to many users
    - the hallmark of a phishing campaign or a mis-scoped file share - whereas a trust record confined
    to one host suggests a single recipient. Comparing the writing application and value data across
    hosts shows whether the same document was opened and macros enabled elsewhere, which sets the scope
    of the exposure beyond the alerting host.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An enabled macro often makes further configuration changes in the same session - disabling security
    features, adding Run keys or other persistence, or weakening Office macro-security settings.
    Clustering the registry writes on this host in a short window around the alert reveals the full scope
    of changes and which process made them. The triggering trust record appears in the results; the
    signal is what else was modified and whether the same or a spawned process made those changes.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Were process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Macro execution is commonly the first stage of an intrusion, followed by establishing a foothold.
    Scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions created by
    schtasks.exe, sc.exe, reg.exe, bitsadmin.exe, or wmic.exe near the trust record indicate the enabled
    macro was used to install persistence rather than being an isolated document open. Group the results
    by tool and command to see which mechanisms were established.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A malicious document open rarely happens in isolation. Aggregating process activity in a tight
    window around the alert surfaces what led up to the trust record - the document being opened - and
    what ran immediately after it. Novel parent-child pairs stand out at low counts against high-count
    routine telemetry, which is what points to macro-spawned tooling and any hands-on follow-on activity.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, script-host execution, or defense tampering -
    may reveal the stages that preceded this document being trusted and help reconstruct the timeline.
    A macro-enabled document is often the initial-access step, so prior alerts help place this trust
    record within a larger sequence and indicate whether the host was already under investigation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Does the user recall opening this document and choosing to enable its content?
  context: >-
    Direct confirmation from the account owner is a fast way to resolve the alert. If the user recalls
    receiving the document, opening it, and deliberately clicking Enable Content, get the delivery
    context - who sent it and why. If the user does not recall the document or was socially engineered
    into enabling macros, the account may be compromised or the open was the entry point of an intrusion,
    and the investigation should continue into what the Office application spawned.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this document open align with the user's normal work hours?
  context: >-
    A document opened and trusted during the user's normal working hours is more consistent with routine
    activity than the same open at an unusual hour for that account. Timing that falls outside the user's
    typical pattern, or that coincides with a wave of similar documents across the environment, raises
    the likelihood that the open was driven by a phishing message rather than deliberate work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
