- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining activity around the alert reveals what led to this
    event and what followed: reconnaissance, privilege escalation, or persistence. Aggregating by
    Image and ParentImage collapses repetitive agent telemetry into high-count rows while novel
    parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts fired this spaceless-flag pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of this spaceless-flag pattern rather than generic cmd.exe usage. Many hosts
    firing the same pattern points to scripted deployment or vendor automation; one host or a small
    unrelated set points to manual operator activity. Use the host distribution and parent
    consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains:
        - cmd.exe/c
        - \cmd/c
        - '"cmd/c'
        - cmd.exe/k
        - \cmd/k
        - '"cmd/k'
        - cmd.exe/r
        - \cmd/r
        - '"cmd/r'
      selection2:
        CommandLine|contains:
        - /cwhoami
        - /cpowershell
        - /cschtasks
        - /cbitsadmin
        - /ccertutil
        - /kwhoami
        - /kpowershell
        - /kschtasks
        - /kbitsadmin
        - /kcertutil
      selection3:
