name: HackTool - WinRM Access Via Evil-WinRM
id: bfc908e6-8c03-449e-ba6f-ca4acd281658
description: |
  Detects ruby.exe running with the command-line flags -i, -u, and -p together, the signature invocation pattern of Evil-WinRM, a Ruby-based interactive WinRM/PSRP client used for remote access and post-exploitation. The flags map to a target host (-i), a username (-u), and a password (-p), so a match means an operator on this host is opening an authenticated remote management session to another system. Ruby is rarely present on Windows endpoints, and the tool supports pass-the-hash, Kerberos, in-memory .NET/DLL loading, Donut shellcode injection, and AMSI/ETW bypass, so the investigation should determine the target and credentials used, whether the session is authorized, and what was done over it.
type: detection
detection_id: a197e378-d31b-41c0-9635-cfdf1c1bb423
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line show ruby.exe running with the -i, -u, and -p flags together?
  context: Confirm the alert is a true positive by reviewing the exact command line and process details. The rule fires when the Image ends in ruby.exe and the command line contains all three of -i (target host or IP), -u (username), and -p (password). Read the full argument list to recover the target, the account, and any additional flags such as -S (SSL), -H (NTLM hash for pass-the-hash), -r (Kerberos realm), or -s/-e (script and executable load directories).
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to open remote WinRM management sessions with a Ruby-based client?
  context: Ruby is not part of a default Windows install and a Ruby WinRM client is not a standard administrative tool; native remote management uses PowerShell Remoting or winrs. A user with no administrative or red-team role, or a host that is not an operator workstation or jump box, running this is harder to explain as routine work. Knowing the expected role is often the fastest way to separate an authorized engagement from intrusion activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this Evil-WinRM execution part of an authorized penetration test or red team engagement?
  context: Evil-WinRM is a standard offensive toolkit component used in authorized security assessments. Before investing further analysis, check whether a penetration test or red team exercise is currently active on this host or network segment. An authorized engagement whose scope, source host, and timing match this activity resolves the alert without deeper investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What target, account, and authentication material did this Evil-WinRM invocation use?
  context: The full command line reveals the operation. Decode -i to the target host or IP, -u to the username, and -p to the password; then check for the higher-risk flags -H (NTLM hash, indicating pass-the-hash), -r and --spn (Kerberos), -S/-c/-k (SSL with client certificate), and -s/-e (directories of PowerShell scripts and .NET binaries staged for in-memory loading). The presence of -H or -s/-e shifts the session from a simple login toward credential reuse and in-memory tooling.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Which Evil-WinRM capability was invoked -- a plain remote shell, pass-the-hash, Kerberos auth, or in-memory loading?
  context: Evil-WinRM is multi-purpose. The flags distinguish a simple password login (-p) from pass-the-hash (-H), Kerberos ticket use (-r/--spn), and staging of in-memory payloads via the script (-s) and executable (-e) load directories that feed Invoke-Binary, Dll-Loader, Donut-Loader, and Bypass-4MSI. Which capability was used determines the scope of potential compromise and the required response.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did this ruby.exe process write Evil-WinRM artifacts such as downloaded files, log files, or staged payloads to disk?
  context: Evil-WinRM leaves characteristic artifacts on the operator host. Logging via -l writes session log files under the user profile, the upload/download commands move files between local and remote, and the -s/-e directories hold PowerShell scripts and .NET binaries staged for in-memory loading. Files written by this process confirm what was transferred or staged even after the process exits.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What remote logon to the target host accompanied this session, and is the account a non-admin or service account that should not be using WinRM?
  context: An Evil-WinRM session authenticates to the target over WinRM/PSRP, which generates remote logon events (4624 network logon, often with 4648 explicit-credential logon) on the target. Correlate the account and source against the connection to confirm the session reached the target and to scope the user. A non-administrator, a service account, or an account not on the list of identities expected to use WinRM is a stronger signal than a known administrator from a known jump box. If Security logon events are not collected in this environment, treat absent results as a visibility gap rather than evidence the session failed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 4624
          - 4648
        LogonType: 3
      condition: selection
    fields:
      - TargetUserName
      - IpAddress
      - LogonType
      - host.name
- question: What host initiated this WinRM connection, and is it an expected administrative source?
  context: Lateral movement requires a source and a destination. Identifying the originating host shows whether the WinRM session came from a known admin jump box, a routine operator workstation, or an unexpected system that may itself be compromised and used as a pivot. Connections on the WinRM ports (5985/5986) from an unrecognized source are the ones worth chasing.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 5985
          - 5986
      condition: selection
    fields:
      - SourceIp
      - DestinationPort
- question: What authentication method did this session use -- a password, an NTLM hash for pass-the-hash, or a Kerberos ticket?
  context: The authentication method reveals how access was obtained. Evil-WinRM supports a plain password (-p), an NTLM hash for pass-the-hash (-H), and Kerberos via an imported ccache (-r/--spn). Pass-the-hash and pass-the-ticket bypass the need for a cleartext password and point to prior credential theft; legitimate credential use suggests the operator already holds valid passwords. The command line and the matching remote logon type together identify which path was used.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
      - CommandLine
- question: What processes were spawned on the target host shortly after this WinRM session was established?
  context: Lateral movement is a means to an end. Over WinRM/PSRP, remote commands run as children of wsmprovhost.exe on the target, so processes appearing under that parent shortly after the session opened reveal the operator's objectives -- reconnaissance, tool deployment, credential access, or data collection. The tight window after access keeps the focus on activity attributable to this session.
  range: +30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - Image
- question: Has this user account connected to other hosts using remote-access tooling?
  context: Operators rarely stop at one target. If the same account is running remote-access and lateral-movement tooling against multiple systems, the scope of compromise is larger. A single account reaching many hosts within a short window indicates active lateral movement rather than an isolated administrative task.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_lateral:
        Image|endswith:
          - '\psexec.exe'
          - '\psexec64.exe'
          - '\mstsc.exe'
          - '\ssh.exe'
          - '\plink.exe'
          - '\wmic.exe'
          - '\ruby.exe'
          - '\winrs.exe'
      condition: selection and selection_lateral
    fields:
      - host.name
      - Image
- question: When this host has previously fired this Evil-WinRM pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even a rare tool can have an established niche use such as a sanctioned operator workstation. This query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution reflects how the rule's specific firing pattern has historically run here. A new parent process, an unexpected account, or a first-ever appearance is the deviation worth chasing, and an empty history makes this a first-time event on the host.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \ruby.exe
        CommandLine|contains|all:
        - '-i '
        - '-u '
        - '-p '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this Evil-WinRM pattern in the past week, and does the cross-host distribution look like consistent automation or one-off operator activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this specific firing pattern rather than generic ruby.exe usage. Many hosts firing the same pattern can point to a sanctioned testing tool or scripted deployment; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate how isolated this is.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \ruby.exe
        CommandLine|contains|all:
        - '-i '
        - '-u '
        - '-p '
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \ruby.exe
        CommandLine|contains|all:
        - '-i '
        - '-u '
        - '-p '
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \ruby.exe
        CommandLine|contains|all:
        - '-i '
        - '-u '
        - '-p '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user drove remote-access or post-exploitation activity on other hosts in the same window, the scope of the operation may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \ruby.exe
        CommandLine|contains|all:
        - '-i '
        - '-u '
        - '-p '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as credential access, defense tampering, or reconnaissance, may reveal the stages that preceded this remote session and help reconstruct the timeline. Lateral movement typically follows credential theft, so a preceding credential-access alert strengthens the case that this session is part of an intrusion.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
