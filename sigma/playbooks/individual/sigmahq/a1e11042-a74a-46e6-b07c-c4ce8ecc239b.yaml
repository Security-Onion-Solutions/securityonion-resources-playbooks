name: Potential Persistence Via Event Viewer Events.asp
id: 469696af-9f42-4c87-8f37-81511fde0f89
description: |
  Detects a registry write to the Event Viewer redirection values under
  HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Event Viewer\ - specifically
  MicrosoftRedirectionProgram or MicrosoftRedirectionURL - set to something other than the
  known-legitimate defaults (the built-in HelpCtr.exe program, its default command line, the
  default go.microsoft.com fwlink URL, or an empty value). These values control what runs when a
  user clicks a link rendered in an event log entry: MicrosoftRedirectionProgram points directly at
  an executable (optionally with attacker-chosen arguments), and MicrosoftRedirectionURL can be set
  to a file:// path to a local binary. Redirecting either to an attacker-controlled program yields
  persistence that fires when an analyst or user opens Event Viewer and follows a link, executing the
  configured command in the user's context. Legitimate changes to these values are rare; investigate
  what executable or URL was written, which process wrote it and what launched that process, whether
  the referenced payload exists on disk and later executed, whether the value was reverted afterward,
  and whether other configuration or persistence changes landed in the same session.
type: detection
detection_id: a1e11042-a74a-46e6-b07c-c4ce8ecc239b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting registry write set an Event Viewer redirection value to a non-default value?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a
    value whose path ends in \Microsoft\Windows NT\CurrentVersion\Event Viewer\MicrosoftRedirectionProgram
    or \MicrosoftRedirectionURL is written AND the value data is not one of the known-legitimate
    defaults (the built-in HelpCtr.exe program and its default command line, the default
    go.microsoft.com fwlink URL, or an empty value). Review the exact TargetObject and Details on the
    triggering event to confirm the written value is a non-default program or URL rather than a routine
    reset to the shipped default.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify Event Viewer redirection settings?
  context: >-
    The Event Viewer redirection values point at the built-in help program and effectively never change
    through normal use. A user or service account writing a non-default program or URL here is the setup
    step of link-click persistence, so knowing whether the writing account and host function match any
    sanctioned change is the fastest way to separate administration or testing from a live persistence
    attempt. User attribution is present on roughly 94% of endpoint registry events; when it is a machine
    account or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which Event Viewer redirection value was written, and why is this key a persistence location?
  context: >-
    The Event Viewer redirection values under HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Event
    Viewer\ decide what runs when a user clicks a link inside an event log entry: MicrosoftRedirectionProgram
    is executed directly, and MicrosoftRedirectionURL can reference a local binary through a file:// path.
    Confirming the exact value name, its data, and the writing process establishes that this is the Event
    Viewer redirection abuse rather than an unrelated edit, and sets up decoding the configured payload.
    The set of monitored redirection paths is environment-dependent, so note which specific value under
    this key fired.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What executable, URL, or command was written to the redirection value?
  context: >-
    The Details field holds what the redirection will invoke when a link is followed. Decode it: a
    MicrosoftRedirectionProgram value is commonly a path to an executable (optionally with attacker-chosen
    command-line arguments, potentially chaining a living-off-the-land binary), while a MicrosoftRedirectionURL
    value may be a file:// path to a local binary rather than an https help link. If it references a file
    path, that path becomes a lead for confirming a payload on disk and for hunting its later execution.
    Details is present on roughly 79% of registry modifications and should be populated for this string
    value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote the redirection value, and what launched that process?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to read its
    Image, full command, and parent. A reg.exe, powershell.exe, cmd.exe, or wmic write launched from an
    Office application, a browser, a script host such as wscript.exe or mshta.exe, or an unsigned binary
    points to the persistence being staged programmatically rather than a deliberate administrator edit. An
    allowlist of registry-editing tools that are legitimate in this environment helps decide whether this
    writing process and its parent chain are expected; an unsigned executable or an abnormal parent-child
    lineage performing the write raises the weight of the alert.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the process that wrote this value go on to launch?
  context: >-
    An actor who scripts the redirection write often performs other actions from the same process in the
    same session - dropping the payload, editing additional keys, or launching follow-on tooling. Listing
    the child processes of the writing process reveals the full scope of what that process did beyond the
    registry edit. Multiple unexpected children from the same writing process point to automated staging
    rather than a single manual edit.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is the executable referenced by the redirection value present on disk, and did the writing process drop it?
  context: >-
    Link-click persistence only works if the executable named in the redirection value exists at that path.
    Correlating file activity by the writing process and its children shows whether a payload was dropped in
    the same session as the registry write. The file-write event carries no hash; if the referenced payload
    is present, hash it from a later execution or retrieve it for a reputation lookup. If the value points at
    an existing living-off-the-land binary rather than a dropped file, no drop will appear here and the
    binary path itself is the lead.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did the executable configured in the redirection value subsequently run on this host?
  context: >-
    This persistence fires when a user opens Event Viewer and follows a link, so the payload may execute well
    after the registry write rather than immediately. The query anchors on the written Details value, so a
    matching execution confirms the redirection was triggered and the configured command ran; a zero within
    the window means no one has followed an event-log link yet. If the write set MicrosoftRedirectionURL to a
    file:// form, the literal value may not appear in a command line - a zero is expected then, so strip the
    file:// prefix and search for the referenced binary path directly.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|expand: '%Details%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: After this write, was the redirection value reverted to the default or changed again?
  context: >-
    Registry key or value deletions are not observable in this telemetry, so durability is judged from the
    key's re-modification history rather than from a delete event. A later write that restores the value to
    the built-in HelpCtr.exe program or the default go.microsoft.com URL indicates the change was reverted,
    while the value remaining a non-default program or URL leaves the redirection primed to run the next time
    Event Viewer is opened and a link is followed. Compare the Details values written to this key over the
    following window.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Has this Event Viewer redirection value been modified before on this host?
  context: >-
    The redirection values should change rarely and only through deliberate action, so a history with no
    prior writes makes this a first-time change and raises its weight. A history of periodic writes to the
    same value points instead to a management process or a repeatedly run tool. Compare the historical
    Details values to see whether a non-default program or URL was set before or whether this is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same redirection value modified on other hosts in the environment?
  context: >-
    The same write across many hosts suggests a broad tool run or a mis-scoped deployment; the same write
    confined to one host suggests a targeted persistence attempt. Compare the Details values across hosts to
    see whether they all set the same program or URL and whether the writing process is consistent, which
    separates a single hands-on operation from repeated use of the technique across the environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor who sets one persistence key often makes other configuration changes in the same session -
    additional autostart or association keys, Defender or firewall policy edits, or other redirection
    values. Clustering the registry writes on this host in a short window around the alert reveals the full
    scope of changes and which process made them. The triggering key appears in the results; the signal is
    what else was modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Persistence is rarely established in isolation. Aggregating process activity in a tight window around the
    alert surfaces what led up to the redirection write and what ran immediately after it. Novel parent-child
    pairs stand out at low counts against high-count routine telemetry, which is what points to the tool that
    staged the change and any follow-on actions.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, execution of scripting tools, credential access, or
    defense tampering - may reveal the stages that preceded this change and help reconstruct the timeline.
    Persistence is typically established after an initial foothold, so prior alerts help place this redirection
    write within a larger sequence of activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Attackers rarely rely on a single persistence mechanism. After establishing one foothold, they commonly
    install backup mechanisms using different techniques. Scheduled tasks, services, registry Run keys, BITS
    jobs, or WMI subscriptions created by schtasks.exe, sc.exe, reg.exe, bitsadmin.exe, or wmic.exe near the
    redirection write indicate intentional stacking of persistence rather than an isolated change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely - dropping an executable or script into a
    Startup folder or a path referenced by a registry Run key achieves persistence without invoking schtasks,
    sc, or reg. File writes to these locations near the redirection change indicate a parallel persistence
    mechanism was established on disk alongside the Event Viewer redirection.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Does the user or an administrator recall making this Event Viewer redirection change?
  context: >-
    The Event Viewer redirection values have no routine reason to change, so direct confirmation from the
    account owner is a fast way to resolve the alert. If a red-team operator or an administrator testing a
    tool set the value, that closes it; if no one recalls the action, the account may be compromised or the
    change was made by automated tooling, and the investigation should continue into the writing process and
    any later payload execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
