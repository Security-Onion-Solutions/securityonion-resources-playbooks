name: DriverQuery.EXE Execution
id: ac8e914d-39e7-4b84-8e16-519d499142f0
description: |
  Detects execution of driverquery.exe (or a renamed binary whose OriginalFileName is drvqry.exe), a built-in utility
  that enumerates installed device drivers. It is a legitimate troubleshooting and inventory tool, but the same enumeration
  is commonly run during the automated discovery phase of an intrusion to profile a host before the next stage. The rule
  fires when the binary or its original filename matches AND the parent is not one of a set of script-host or
  user-writable-path launchers already covered by other detections. Investigation should determine whether this is an
  administrator or automated inventory task, or post-compromise reconnaissance running alongside other discovery commands.
type: detection
detection_id: a20def93-0709-4eae-9bd2-31206e21e6b2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Is the executed binary driverquery.exe, or a renamed binary whose OriginalFileName is drvqry.exe?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the triggering event. The
    rule matches when the image ends in driverquery.exe OR the OriginalFileName is drvqry.exe (catching a renamed copy), and
    the parent is not one of the excluded script-host or user-writable-path launchers. Confirm which condition matched and
    whether the binary name and original filename agree.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: What were the full command-line arguments passed to driverquery, and what did the invocation enumerate?
  context: The full command line reveals the specific enumeration. Look for output-format flags (/fo csv, /fo table), signed-driver
    filters (/si), verbose mode (/v), or remote-host targeting (/s, /u, /p) that points the query at another machine. Output
    redirected to a file in a temp or user-writable directory is consistent with discovery output being staged for later
    collection.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is this user expected to run device-driver enumeration on this host?
  context: Network administrators and IT staff legitimately run driverquery for troubleshooting and inventory. Standard users
    and service accounts rarely enumerate installed drivers. The user's role and typical behavior determine whether this is
    routine maintenance or anomalous discovery.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: What process spawned driverquery, and is that parent expected to launch discovery commands?
  context: Legitimate discovery is typically run from cmd.exe or powershell.exe under an interactive explorer.exe session, or
    from an inventory script. Driver enumeration spawned by Office applications, script interpreters, wmiprvse.exe (WMI remote
    execution), or wsmprovhost.exe (WinRM remote execution) points to automated post-exploitation enumeration rather than a
    human running a command.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: What child processes did driverquery spawn afterward on this host?
  context: Driver enumeration is a read-only operation and does not normally spawn children. Processes launched in close
    sequence after it — additional discovery binaries, a shell, an encoder, or a download cradle — reveal whether this single
    command was part of a larger automated reconnaissance and execution chain.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single driver-enumeration command may be legitimate troubleshooting, but multiple discovery commands in rapid
    succession — systeminfo, tasklist, net, nltest, nslookup, whoami — is a signature of post-compromise enumeration where
    an operator profiles the host before the next stage. Three or more distinct recon binaries within the window typically
    indicates automated reconnaissance.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to
    the driver enumeration, what happened after, and whether it is part of a larger sequence. Look for reconnaissance,
    credential access, privilege escalation, or persistence being established nearby.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: driverquery.exe
      - OriginalFileName: drvqry.exe
      filter_main_other:
      - ParentImage|endswith:
        - \cscript.exe
        - \mshta.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
      - ParentImage|contains:
        - \AppData\Local\
        - \Users\Public\
        - \Windows\Temp\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: driverquery.exe
      - OriginalFileName: drvqry.exe
      filter_main_other:
      - ParentImage|endswith:
        - \cscript.exe
        - \mshta.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
      - ParentImage|contains:
        - \AppData\Local\
        - \Users\Public\
        - \Windows\Temp\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated activity across multiple
    endpoints. If the same user triggered similar discovery on several hosts, the scope of the activity may be larger than
    this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: driverquery.exe
      - OriginalFileName: drvqry.exe
      filter_main_other:
      - ParentImage|endswith:
        - \cscript.exe
        - \mshta.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
      - ParentImage|contains:
        - \AppData\Local\
        - \Users\Public\
        - \Windows\Temp\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Does this host normally run driverquery?
  context: A binary that has never run on a host is more suspicious than one that runs regularly through scheduled inventory
    or support work. Zero or very low historical counts over the baseline window indicate first-time or rare execution on
    this machine.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this rule's pattern, what parents and users normally drive that activity, and
    does the current alert fit that pattern?
  context: Even routine tools can be abused. The query mirrors the rule's selection structure scoped to this host, so the
    resulting parent/user distribution reflects how the rule's specific firing pattern — not generic driverquery usage — has
    historically run here. A new parent process, an unexpected user account, or an unusual launch pattern is the anomaly worth
    chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: driverquery.exe
      - OriginalFileName: drvqry.exe
      filter_main_other:
      - ParentImage|endswith:
        - \cscript.exe
        - \mshta.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
      - ParentImage|contains:
        - \AppData\Local\
        - \Users\Public\
        - \Windows\Temp\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, credential access, or
    other reconnaissance — may reveal the attack stages that preceded the driver enumeration and help reconstruct the full
    timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like
    consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the
    rule's firing pattern rather than generic driverquery usage. Many hosts firing the same pattern points to scripted
    deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host
    distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: driverquery.exe
      - OriginalFileName: drvqry.exe
      filter_main_other:
      - ParentImage|endswith:
        - \cscript.exe
        - \mshta.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
      - ParentImage|contains:
        - \AppData\Local\
        - \Users\Public\
        - \Windows\Temp\
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
