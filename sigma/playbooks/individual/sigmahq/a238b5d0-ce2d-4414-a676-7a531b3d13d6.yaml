name: ETW Trace Evasion Activity
id: 2545f55e-3d8d-40ab-b719-a19727a1ae16
description: |
  Detects command-line activity that clears or disables Event Tracing for Windows (ETW) trace sessions or
  event logs, a logging-evasion technique that suppresses telemetry before or during other activity. The rule
  fires when a command line matches EITHER a wevtutil log-clear pattern (cl /Trace or clear-log /Trace),
  OR a wevtutil log-disable pattern (sl /e:false or set-log /e:false), OR an ephemeral logman provider removal
  (logman update trace ... --p ... -ets), OR a PowerShell autologger tamper (Remove-EtwTraceProvider, or
  Set-EtwTraceProvider with 0x11) — any single branch is sufficient. Legitimate administrators occasionally
  disable a noisy channel or clear a log during maintenance; the same commands are used to blind logging
  before payload execution, credential access, or impact so determine which trace/log was targeted, whether
  the control was restored, and what ran on the host afterward.
type: detection
detection_id: a238b5d0-ce2d-4414-a676-7a531b3d13d6
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line match an ETW trace or event-log clear/disable pattern this rule detects?
  context: >-
    Confirm the alert is a true positive before investing investigation time. The rule fires when the command
    line matches any one of several independent branches: a wevtutil clear (cl /Trace or clear-log /Trace),
    a wevtutil disable (sl /e:false or set-log /e:false), an ephemeral logman provider removal (logman update
    trace ... --p ... -ets), or a PowerShell autologger tamper (Remove-EtwTraceProvider, or Set-EtwTraceProvider
    with 0x11). Note which branch fired — a clear destroys existing events, a disable or provider removal stops
    future collection, and that distinction determines the rest of the investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to clear or disable event logging or ETW trace sessions?
  context: >-
    Legitimate log maintenance and channel tuning are usually performed by a small set of administrators or
    automation on specific hosts. A user role or host function that has no operational reason to touch ETW
    providers or clear trace logs raises the priority; a known maintenance window on an admin workstation lowers
    it. This is often the fastest path to separating routine operations from evasion.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which specific event log or ETW trace provider was cleared or disabled?
  context: >-
    Decode the command line to identify the exact target. wevtutil cl/clear-log on a /Trace channel destroys
    that channel's existing events; sl /e:false disables a channel going forward; logman update trace ... --p
    removes a provider from a running session with no file, registry, or event-log artifact; Set-EtwTraceProvider
    -Property 0x11 swaps the autologger flag to IGNORE_KEYWORD_0 to silence keyword-0 providers such as
    PowerShell. The targeted log or provider determines what evidence may now be missing and what to reconstruct
    from other sources.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned the tool that issued this command, and is that parent chain expected?
  context: >-
    The parent process reveals how the clear/disable command was invoked. Interactive administration typically
    descends from explorer.exe or a console shell; ETW tampering driven by an attacker often descends from a
    script host (wscript.exe, mshta.exe), an Office application, an unexpected service, or a remote-execution
    parent. An unusual parent for log-clearing activity is the deviation worth chasing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously fired this ETW/log-tamper pattern, what parents and users normally drove it, and does this alert fit?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the parent/user distribution reflects
    how this specific clear/disable pattern has historically run here — not generic command-interpreter usage. A
    new parent process, an unexpected user account, or a first-time appearance of the pattern on this host marks
    the current alert as a deviation rather than routine maintenance.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_clear_1:
        CommandLine|contains|all:
        - cl
        - /Trace
      selection_clear_2:
        CommandLine|contains|all:
        - clear-log
        - /Trace
      selection_disable_1:
        CommandLine|contains|all:
        - sl
        - /e:false
      selection_disable_2:
        CommandLine|contains|all:
        - set-log
        - /e:false
      selection_disable_3:
        CommandLine|contains|all:
        - logman
        - update
        - trace
        - --p
        - -ets
      selection_pwsh_remove:
        CommandLine|contains: Remove-EtwTraceProvider
      selection_pwsh_set:
        CommandLine|contains|all:
        - Set-EtwTraceProvider
        - '0x11'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this ETW/log-tamper pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, giving a fleet-wide count of this
    clear/disable pattern rather than generic binary usage. Many hosts firing the same pattern points to scripted
    deployment or a maintenance job; one host or a small unrelated set points to manual operator activity. Use the
    host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_clear_1:
        CommandLine|contains|all:
        - cl
        - /Trace
      selection_clear_2:
        CommandLine|contains|all:
        - clear-log
        - /Trace
      selection_disable_1:
        CommandLine|contains|all:
        - sl
        - /e:false
      selection_disable_2:
        CommandLine|contains|all:
        - set-log
        - /e:false
      selection_disable_3:
        CommandLine|contains|all:
        - logman
        - update
        - trace
        - --p
        - -ets
      selection_pwsh_remove:
        CommandLine|contains: Remove-EtwTraceProvider
      selection_pwsh_set:
        CommandLine|contains|all:
        - Set-EtwTraceProvider
        - '0x11'
      condition: 1 of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_clear_1:
        CommandLine|contains|all:
        - cl
        - /Trace
      selection_clear_2:
        CommandLine|contains|all:
        - clear-log
        - /Trace
      selection_disable_1:
        CommandLine|contains|all:
        - sl
        - /e:false
      selection_disable_2:
        CommandLine|contains|all:
        - set-log
        - /e:false
      selection_disable_3:
        CommandLine|contains|all:
        - logman
        - update
        - trace
        - --p
        - -ets
      selection_pwsh_remove:
        CommandLine|contains: Remove-EtwTraceProvider
      selection_pwsh_set:
        CommandLine|contains|all:
        - Set-EtwTraceProvider
        - '0x11'
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_clear_1:
        CommandLine|contains|all:
        - cl
        - /Trace
      selection_clear_2:
        CommandLine|contains|all:
        - clear-log
        - /Trace
      selection_disable_1:
        CommandLine|contains|all:
        - sl
        - /e:false
      selection_disable_2:
        CommandLine|contains|all:
        - set-log
        - /e:false
      selection_disable_3:
        CommandLine|contains|all:
        - logman
        - update
        - trace
        - --p
        - -ets
      selection_pwsh_remove:
        CommandLine|contains: Remove-EtwTraceProvider
      selection_pwsh_set:
        CommandLine|contains|all:
        - Set-EtwTraceProvider
        - '0x11'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether log/ETW tampering was an isolated action or part
    of broader hands-on activity. If the same user triggered similar evasion or follow-on execution on multiple
    endpoints, the scope of the operation is larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_clear_1:
        CommandLine|contains|all:
        - cl
        - /Trace
      selection_clear_2:
        CommandLine|contains|all:
        - clear-log
        - /Trace
      selection_disable_1:
        CommandLine|contains|all:
        - sl
        - /e:false
      selection_disable_2:
        CommandLine|contains|all:
        - set-log
        - /e:false
      selection_disable_3:
        CommandLine|contains|all:
        - logman
        - update
        - trace
        - --p
        - -ets
      selection_pwsh_remove:
        CommandLine|contains: Remove-EtwTraceProvider
      selection_pwsh_set:
        CommandLine|contains|all:
        - Set-EtwTraceProvider
        - '0x11'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Is the targeted log or ETW trace session currently restored, or is collection still suppressed?
  context: >-
    Tampering may be temporary or persistent. A cleared log loses its prior events permanently, but a disabled
    channel (sl /e:false) or a removed autologger provider stays off until re-enabled — and an ephemeral logman
    removal reverts on reboot. Verify the current collection status of the targeted channel or provider; if it is
    still disabled, restore it before further investigation so new activity is captured.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What activity occurred on this host after logging or ETW collection was suppressed?
  context: >-
    Logging is suppressed to hide what comes next — payload execution, credential access, or impact that would
    otherwise be logged. Examine process activity in the window immediately following the clear/disable command. A
    gap in the targeted telemetry followed by new process creation points to the activity the tampering was meant
    to conceal, and may need to be reconstructed from network and file-event sources that were not suppressed.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense-tampering actions performed on this host?
  context: >-
    Operators who suppress one logging channel often disable several controls — stopping Defender, clearing
    additional event logs, deleting shadow copies, or changing the firewall — to maximize coverage. Finding
    multiple tampering events from the same user or parent in the same window indicates a deliberate operation
    rather than a single maintenance action.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Were ETW autologger or WMI registry keys modified on this host around the time of the alert?
  context: >-
    Persistent ETW tampering edits the autologger configuration under the WMI Autologger registry path — removing
    a provider GUID or flipping a provider's EnableProperty to IGNORE_KEYWORD_0 (0x11) so a channel stays silent
    across reboots. The PowerShell branch of this alert (Remove-EtwTraceProvider / Set-EtwTraceProvider) writes
    exactly these keys, but the same effect can be achieved by direct registry edits that the command-line rule
    will not catch. Correlating registry modifications to the Autologger or WMI keys in the same window confirms
    whether the suppression was made persistent.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\Control\WMI\Autologger\'
          - '\WINEVT\Channels\'
          - '\WINEVT\Publishers\'
      condition: selection_host and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
      - User
- question: Did the Security event log get cleared or the audit policy changed on this host around the alert?
  context: >-
    Clearing the Security log emits Event 1102 (audit log cleared) and audit-policy changes emit Event 4657/4719;
    these are the native records of indicator removal that survive even when the command-line process record is
    itself suppressed. Checking the Security channel directly catches log-clearing and audit-policy tampering that
    the process-based detection may miss, and shows whether authentication and access evidence for this window was
    destroyed. If Security-channel events are not ingested in this environment, treat zero results as a visibility
    gap rather than evidence nothing happened.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_events:
        EventID:
          - 1102
          - 4657
          - 4719
      condition: selection_host and selection_events
    fields:
      - EventID
      - SubjectUserName
      - ProcessName
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Logging evasion rarely happens in isolation. Earlier detections on the same host — reconnaissance, credential
    access, privilege escalation, or other defense tampering — may reveal the stages that preceded this event and
    help reconstruct the timeline. Suppressing telemetry is commonly an immediate precursor to a hands-on action
    the operator wants to hide.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were process-based persistence mechanisms installed on this host around the alert?
  context: >-
    After suppressing telemetry, operators frequently install persistence under reduced visibility so the foothold
    survives reboot and remains hidden from the channel that was just disabled. Scheduled tasks, services, registry
    Run keys, BITS jobs, or WMI subscriptions created in the same window — especially from the same parent or user
    — indicate intentional stacking rather than isolated administration.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
