name: RDP Sensitive Settings Changed to Zero
id: 93842664-bf80-44f5-91d0-17606de65641
description: |
  Detects a registry write that sets one of three Terminal Services / Remote Desktop security
  values -- fDenyTSConnections, fSingleSessionPerUser, or UserAuthentication -- to DWORD
  (0x00000000) under the Terminal Server control keys. Setting fDenyTSConnections to zero turns on
  inbound Remote Desktop, fSingleSessionPerUser to zero permits multiple concurrent sessions under a
  single account (the configuration behind live-session hijacking and shadowing), and
  UserAuthentication to zero removes the Network Level Authentication requirement so pre-authentication
  and weaker clients can reach the logon screen. These changes relax remote-access controls to
  establish or broaden interactive access; legitimate changes usually come from group policy or a
  documented server-commissioning task, so investigate which process wrote the value and what launched
  it, whether RDP was subsequently used, whether other security settings changed in the same session,
  and whether the value was later reverted.
type: detection
detection_id: a2863fbc-d5cb-48d5-83fb-d976d4b1743b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting registry write set one of the monitored RDP terminal-server settings to DWORD 0?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a
    value whose path ends in \fDenyTSConnections, \fSingleSessionPerUser, or \UserAuthentication is
    written with data DWORD (0x00000000). Review the exact TargetObject and Details on the triggering
    event to confirm which of the three settings was set to zero, because the specific setting
    determines which remote-access protection was weakened and which downstream questions carry the
    most weight. Note which value fired.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify RDP terminal-server settings?
  context: >-
    Legitimate changes to these values are usually pushed by group policy or made during a sanctioned
    server-configuration task. A user account interactively writing fDenyTSConnections,
    fSingleSessionPerUser, or UserAuthentication on a host that is not being commissioned for remote
    access is the preparatory move for enabling or hijacking RDP. User attribution is present on roughly
    94% of endpoint registry events; when it is a machine account or SYSTEM, pivot on the writing
    process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which RDP setting was changed, and why is this key a remote-access control?
  context: >-
    These values live under HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server and its
    WinStations\RDP-Tcp subkey. fDenyTSConnections gates whether the host accepts Remote Desktop at all,
    fSingleSessionPerUser controls whether one account may hold multiple simultaneous sessions, and
    UserAuthentication enforces Network Level Authentication. Confirming the exact key and the writing
    process establishes which remote-access control was relaxed rather than an unrelated Terminal Server
    edit, and sets up decoding the value that was written.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What does setting this value to zero do to the host's remote-access posture?
  context: >-
    A DWORD of 0 disables the protection each value represents: fDenyTSConnections=0 turns on inbound
    Remote Desktop, UserAuthentication=0 removes the Network Level Authentication requirement so
    pre-authentication and weaker clients can reach the logon screen, and fSingleSessionPerUser=0 allows
    concurrent sessions under a single account, the setting that permits shadowing or hijacking a live
    session. Read the Details value to confirm it is zero and map it to the specific weakening. Details
    is present on roughly 79% of registry modifications and should be populated for this DWORD value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote this value, and what launched that process?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to read
    its Image, full command, and parent. A reg.exe, powershell.exe, cmd.exe, or wmic.exe write launched
    from a script host, a remote-execution service, or an unsigned binary points to the change being
    made programmatically rather than a deliberate administrator edit at the console. The parent chain
    and whether the writing image is signed distinguish a scripted change from an interactive one.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: After this change, did the host begin accepting Remote Desktop connections?
  context: >-
    Enabling or weakening these settings only matters if RDP is then used. Connections involving the
    Remote Desktop port on this host after the write confirm the change took effect and that a remote
    session was established or attempted; the direction field separates inbound sessions to this host
    from outbound. Correlate the timing of the first such connection with the registry write to tie the
    configuration change to actual remote access.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort: 3389
      condition: selection
    fields:
      - SourceIp
      - DestinationIp
      - Initiated
- question: Has this RDP setting been modified before on this host?
  context: >-
    Terminal Server security values change rarely and usually only when a host is commissioned for
    remote access, so a history with no prior writes makes this a first-time change and raises its
    weight. A history of periodic writes to the same value points instead to a management process or
    imaging routine. Compare the historical Details values to see whether the setting was previously set
    to zero or whether this is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this setting later restored to its secure value or changed again?
  context: >-
    Registry key and value deletions are not observable in this telemetry, so durability is judged from
    the value's re-modification history rather than a delete event. A later write that returns the value
    to 1, re-enabling the protection, suggests the change was temporary or reverted to hide it, while the
    value remaining zero leaves remote access enabled or Network Level Authentication disabled going
    forward. Compare the Details values written to this key over the following window.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same RDP setting changed on other hosts in the environment?
  context: >-
    The same change across many hosts suggests a group-policy push or a broad configuration script; the
    same change confined to one host suggests targeted enablement of remote access. Compare the Details
    values and writing processes across hosts to separate a fleet-wide management action from a single
    hands-on operation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor who relaxes RDP controls often makes other configuration changes in the same session --
    disabling Defender or firewall rules, adding accounts to remote-access groups, or setting
    persistence keys. Clustering the registry writes on this host in a short window around the alert
    reveals the full scope of changes and which process made them. The triggering key appears in the
    results; the signal is what else was modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Aggregating process activity in a tight window around the alert surfaces what led up to the settings
    change and what ran immediately after it. Novel parent-child pairs stand out at low counts against
    high-count routine telemetry, which is what points to the tool that made the change and to any
    follow-on remote-access or persistence tooling.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host -- reconnaissance, credential access, or defense tampering --
    may reveal the stages that preceded this change and help reconstruct the timeline. Weakening RDP
    controls is often a means to establish or broaden access, so prior alerts help place this change
    within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Enabling remote access is frequently paired with establishing a durable foothold. Scheduled tasks,
    services, registry Run keys, BITS jobs, or WMI subscriptions created by schtasks.exe, sc.exe,
    reg.exe, bitsadmin.exe, or wmic.exe near the settings change indicate the same operation installed
    persistence rather than making an isolated configuration edit.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Was there a change ticket, maintenance window, or documented approval for enabling or changing RDP on this host?
  context: >-
    Enabling Remote Desktop or altering Terminal Server security settings is typically a controlled
    change. A corresponding ticket or maintenance window suggests authorized commissioning of remote
    access; absence of one when policy requires it suggests the change was unauthorized. This check can
    quickly close a false positive or escalate a true positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the administrator or host owner recall enabling or changing RDP on this system?
  context: >-
    Direct confirmation from the person responsible for the host is often the fastest way to resolve the
    alert. If an administrator was commissioning the host for remote support, that closes it; if no one
    recalls the change, the account may be compromised or the change was made by automated tooling, and
    the investigation should continue into the writing process and any subsequent remote access.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this change align with normal work hours or a maintenance window?
  context: >-
    Legitimate remote-access configuration usually happens during business hours or a scheduled
    maintenance window. A change to these settings outside those times, or on a host that is not normally
    administered remotely, is more suspicious than the same change during documented work. Check the
    host's timezone and the account's normal working pattern.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
