name: Suspicious Driver Install by pnputil.exe
id: d0e5dad8-e063-428b-8a48-6f2f2e578926
description: |
  Detects pnputil.exe invoked with a driver-install subcommand (-i, /install, -a, /add-driver) and an .inf path. pnputil.exe is a Microsoft-signed, admin-only utility, and legitimate driver installs happen during OS imaging or printer/driver deployment by IT. The same command stages a signed-but-vulnerable kernel driver into the Driver Store as part of Bring-Your-Own-Vulnerable-Driver tradecraft, after which the driver is loaded as a service to obtain kernel-memory-write primitives that disable protections. Investigation should confirm the .inf source path, the driver's signer, who launched the install, and whether a kernel-driver service install or driver load followed.
type: detection
detection_id: a2ea3ae7-d3d0-40a0-a55c-25a45c87cac1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did pnputil.exe run with a driver-install subcommand (/add-driver, /install, -i, -a) and an .inf path?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line. The rule fires when the pnputil.exe image runs with a driver-install flag and an .inf reference present together. Note the full .inf path — a Driver Store or system path differs sharply from a user-writable %TEMP%, %APPDATA%, %PUBLIC%, or UNC path in what it implies.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to install drivers via pnputil.exe?
  context: Driver installation is normally an IT or imaging activity tied to specific admins, build hosts, or printer-deployment workflows. A pnputil.exe driver install from a standard user account, a workstation that is not a build or print host, or an identity with no driver-management role is far more likely to be a true positive than the same action on an imaging host run by a desktop engineer.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is the parent that launched pnputil.exe expected, and what started that parent?
  context: The parent-child relationship is the core attribution signal. A legitimate install typically descends from an interactive admin shell, a management agent, or a deployment tool; a pnputil.exe spawned by a script host, an Office application, an unsigned binary, or a remote-execution helper points to operator-driven BYOVD staging. Trace the parent's own origin (grandparent) to see whether the chain reaches a user action or an exploitation entry point.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did the same parent spawn around this time?
  context: If the parent that launched pnputil.exe also spawned other processes, those siblings reveal the wider operation. BYOVD staging frequently pairs the driver install with sc.exe or a service-control call to load the driver, plus reconnaissance or a payload launcher from the same parent. Multiple related children from one parent indicates orchestrated activity rather than a one-off install.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What exactly did this pnputil.exe install do? Decode the full command line, .inf path, and flags.
  context: The full command line reveals the specific driver-install action. Identify the .inf path and whether it sits in a user-writable location (%TEMP%, %APPDATA%, %PUBLIC%, %USERPROFILE%, or a UNC share) versus a vendor or imaging path. Note whether /install (immediate device matching), /subdirs, or /reboot were present, since these expand the operation. A wildcard *.inf or a bulk path suggests mass staging rather than a single targeted driver.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - -i
        - /install
        - -a
        - /add-driver
        - '.inf'
        Image|endswith: \pnputil.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - -i
        - /install
        - -a
        - /add-driver
        - '.inf'
        Image|endswith: \pnputil.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or parallel activity on multiple endpoints. If the same identity drove driver installs or other staging on several hosts in this window, the scope of the operation may be larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - -i
        - /install
        - -a
        - /add-driver
        - '.inf'
        Image|endswith: \pnputil.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Does this host normally run pnputil.exe driver installs?
  context: A driver install on a host that has never run pnputil.exe is more suspicious than one on a build or imaging host where it runs regularly. Zero or very low historical counts over the window indicate first-time or rare execution on this endpoint.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: What processes did pnputil.exe spawn, and what ran on this host immediately after the install?
  context: After a driver is staged into the Driver Store, the next step in BYOVD activity is loading it as a kernel service — commonly via sc.exe create/start or a service-control call — followed by the payload that uses the kernel primitive. Unexpected children of pnputil.exe, or sc.exe and service-installer activity right after the install, reveal the actual impact of the driver staging.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Was a kernel-driver service registry entry created on this host around the install?
  context: A driver staged via pnputil.exe persists as a service under HKLM\SYSTEM\CurrentControlSet\Services\<driver>, where ServiceType for a kernel driver is 1. A service registry entry created near the install time — especially for an unfamiliar driver name with an ImagePath pointing at a freshly staged .sys — is the persistence artifact that confirms the driver was wired in to load at boot or on demand. Correlate the writer process and timing with the pnputil.exe event.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\System\CurrentControlSet\Services\'
        TargetObject|endswith:
          - '\Type'
          - '\ImagePath'
          - '\Start'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the install reveals what led up to it and what followed — driver harvesting, service creation, reconnaissance, or a payload launch. Novel parent-child pairs stand out at low counts against the high-count repetitive agent telemetry, and that contrast is what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: When this host previously fired this driver-install pattern, what parents and users drove it, and does the current alert fit?
  context: Even legitimate driver installs recur. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern — not generic pnputil.exe usage — has historically run here. A new parent process, an unexpected user account, or an unusual command-line structure against that history is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - -i
        - /install
        - -a
        - /add-driver
        - '.inf'
        Image|endswith: \pnputil.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this driver-install pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this firing pattern rather than generic pnputil.exe usage. Many hosts firing the same pattern points to scripted driver deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - -i
        - /install
        - -a
        - /add-driver
        - '.inf'
        Image|endswith: \pnputil.exe
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access, or exploitation — may reveal the attack stages that preceded the driver install and help reconstruct the timeline. The sequence of alerts often tells the story of how the operator reached the point of staging a kernel driver.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
