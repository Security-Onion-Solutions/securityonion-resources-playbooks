name: Potential SolidPDFCreator.DLL Sideloading
id: 9d29293c-283b-4926-836d-90faf75c7251
description: |
  Detects a module named SolidPDFCreator.dll being loaded when that load is NOT the legitimate
  signed SolidPDFCreator.exe loading the DLL from its canonical SolidDocuments install directory
  under Program Files. The rule fires when the DLL-load selection matches AND the known-good
  loading-process-plus-path filter does not. This is the DLL search-order hijacking pattern:
  an adversary places an attacker-supplied DLL named after one a signed application loads, then
  runs a copy of that signed binary from a user-writable location so it loads the malicious DLL
  beside it and executes code under a trusted, signed process. Legitimate loads come from the
  installed application directory; investigate the exact load path and signature, where the
  loading binary lives and what launched it, whether the DLL is still on disk for analysis, and
  whether autostart persistence (a Run key or scheduled task pointing at the relocated binary)
  was staged alongside it.
type: detection
detection_id: a2edbce1-95c8-4291-8676-0d45146862b3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Was SolidPDFCreator.dll loaded from outside the signed application's install directory, and by which process?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when
    a module named SolidPDFCreator.dll is loaded AND the load is not the legitimate signed
    SolidPDFCreator.exe loading it from its canonical SolidDocuments directory under Program Files
    (or the x86 path). Review the exact ImageLoaded path, the loading process, and the module
    signature. A copy of the DLL loaded from a user-writable directory, or loaded by a process
    other than the installed SolidPDFCreator.exe, is the search-order hijack the rule targets.
    DLL loads carry the module hash and signing status directly on the load event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this user and host expected to run SolidPDFCreator and load this module?
  context: >-
    SolidPDFCreator is legitimate PDF software; a host and user that routinely run it loading the
    DLL from the installed location is likely benign. The same module loaded on a host with no
    installed copy, or under an unexpected account, is more consistent with a sideloaded DLL riding
    a relocated signed binary. Knowing whether the account and host function match expected use is
    often the fastest path to separating routine software activity from staged execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What modules did this process load, and did any come from a non-canonical or user-writable path?
  context: >-
    The set of modules a process loads reveals search-order hijacking. The legitimate
    SolidPDFCreator.dll ships in C:\Program Files\SolidDocuments\SolidPDFCreator\ (or the x86 path);
    a copy loaded from %TEMP%, AppData, ProgramData, a Public directory, or any other user-writable
    location is a strong sideloading signal. Look also for other unsigned modules loaded from
    directories where signed ones are expected. The canonical install directory is the allowed-path
    baseline against which every loaded module should be judged.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For the loaded SolidPDFCreator.dll, what are its signing status, hash, and reputation?
  context: >-
    Module reputation separates a genuine third-party DLL from a sideloaded one. The legitimate
    SolidPDFCreator.dll carries a valid vendor signature; an unsigned copy, one with an invalid or
    distrusted signature, or one whose hash is unknown to threat intelligence is a masquerading
    indicator. Comparing the loaded module's hash against a known-good baseline of the legitimate
    DLL detects substitution. DLL loads carry the hash and signing status directly on the load
    event, so no separate execution lookup is needed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: Where does the loading process live on disk, and what was its full command line?
  context: >-
    A legitimately installed SolidPDFCreator.exe runs from its SolidDocuments directory under
    Program Files. The sideloading pattern runs a copy of the signed binary from a user-writable
    location, such as a Public or AppData path, so it loads the attacker-supplied DLL beside it via
    search order. The loading process's own path, command line, and working directory show whether
    the signed binary was relocated and how it was invoked. This query returns executions of the
    loading binary on this host in the window, not just the triggering event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned the binary that loaded this module, and is that parent chain expected?
  context: >-
    The parent reveals how the loading binary was launched. A signed application started from its
    installer or from explorer.exe by a user is routine; the same binary launched from a
    scheduled-task engine, a Run-key autostart, a script host such as wscript.exe or mshta.exe, or
    an otherwise unusual parent points to automated execution set up for persistence. Walk up the
    chain to see what invoked the relocated binary and whether that lineage fits normal use.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Has SolidPDFCreator.dll been loaded on this host before, and by which processes?
  context: >-
    A first-time module load is a stronger anomaly than a recurring one. If this DLL has been
    loaded repeatedly by the installed SolidPDFCreator.exe over the past 90 days, the load is
    probably routine. If this is the first occurrence, or the DLL has only ever been loaded by
    different or unexpected processes, the current load is anomalous and consistent with a newly
    planted module.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Is SolidPDFCreator.dll being loaded on other hosts, especially under unexpected loading processes?
  context: >-
    Cross-host correlation shows deployment scope. The DLL loaded on a single host may be a
    localized incident; the same module loaded across several hosts points to wider distribution or
    a shared toolkit. Pay attention to the variety of loading processes - a single expected parent
    is benign, while the same DLL loaded by relocated or unexpected binaries on other hosts suggests
    the sideloading was replicated across the environment.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Sideloading rarely happens in isolation. Aggregating process activity in a tight window around
    the load surfaces what dropped or launched the relocated binary and what ran after it. Novel
    parent-child pairs stand out at low counts against high-count routine telemetry, which is what
    points to the staging tool and any follow-on actions. The tight window also anchors the timing
    correlation between the DLL drop, any registry change, and the module load.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - file drops, scripting-tool execution, or defense
    tampering - may reveal the stages that preceded the sideloaded module load and help reconstruct
    the timeline. Sideloading is typically a means to run and persist a payload, so prior alerts
    help place this load within a larger sequence of activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Is the sideloaded SolidPDFCreator.dll still on disk for analysis, and what wrote it?
  context: >-
    If the module is still present it can be hashed, submitted for analysis, or compared against the
    legitimate DLL. Correlating file writes to the loading process and its children can also reveal
    whether the same operation dropped the DLL alongside the relocated binary. The load event
    carries a hash directly, so even a since-deleted module can be pivoted on by hash.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What registry Run-key persistence was written on this host around the alert, and does any value point at a user-writable path?
  context: >-
    Search-order hijacking is commonly paired with autostart persistence - a Run or RunOnce value is
    written that launches the relocated signed binary at logon, which in turn reloads the sideloaded
    DLL. Review Run-key writes on this host for values pointing at SolidPDFCreator.exe or at any
    executable under a Public, AppData, or other user-writable directory. The registry event carries
    no command line, so pivot to the writing process by its identifier for attribution.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_run:
        TargetObject|contains:
          - '\CurrentVersion\Run'
          - '\CurrentVersion\RunOnce'
      condition: selection and selection_run
    fields:
      - TargetObject
      - Details
      - Image
- question: Were process-based persistence mechanisms installed on this host around the alert?
  context: >-
    Attackers rarely rely on a single foothold. Scheduled tasks, services, Run keys, BITS jobs, or
    WMI subscriptions created by schtasks.exe, sc.exe, reg.exe, bitsadmin.exe, or wmic.exe near the
    sideloaded load indicate the DLL execution was backed by persistence rather than being isolated.
    A scheduled task or Run key launching the relocated signed binary is a common pairing with this
    technique.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host around the alert?
  context: >-
    File-based persistence bypasses command-line detection - dropping an executable or script into a
    Startup folder, or a file into a path referenced by a Run key, achieves persistence without
    invoking schtasks, sc, or reg. File writes to these locations near the sideloaded load indicate
    a parallel persistence mechanism was staged on disk alongside the relocated binary and its DLL.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Does the user or an administrator recall installing or running SolidPDFCreator from this location?
  context: >-
    SolidPDFCreator is legitimate software, so direct confirmation from the account owner is a fast
    way to resolve the alert. If someone installed or ran it - even from a non-standard directory -
    that context may close the alert; if no one recalls it, the relocated signed binary and its DLL
    are more likely attacker-staged, and the investigation should continue into what launched the
    binary and what persisted afterward.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this module load align with normal work hours or a software deployment window?
  context: >-
    Legitimate software installs and updates typically land during business hours or a scheduled
    deployment. A signed binary appearing in a user-writable location and loading its DLL outside
    those windows - overnight, on a weekend, with no corresponding deployment - is more consistent
    with attacker staging than routine software activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
