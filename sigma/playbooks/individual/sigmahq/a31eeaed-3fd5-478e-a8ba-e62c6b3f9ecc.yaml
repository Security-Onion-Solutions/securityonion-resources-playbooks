name: Raccine Uninstall
id: 82eef155-b250-4708-9ab1-baa975526757
description: |
  Detects command lines that remove Raccine, a free anti-ransomware tool that registers itself as a debugger for shadow-copy
  and recovery binaries and kills malicious parent process trees. The rule fires when EITHER a taskkill targeting
  RaccineSettings.exe runs, OR a reg delete removes the "Raccine Tray" Run key, OR a schtasks /DELETE removes the
  "Raccine Rules Updater" scheduled task. Legitimate context is an administrator decommissioning the tool; the malicious
  context is an operator stripping ransomware protection before deploying impact, since removing Raccine restores the
  attacker's ability to delete shadow copies and disable recovery. Determine whether the removal was authorized, what else
  the same user or host did around the removal, and whether shadow-copy or recovery tampering followed.
type: detection
detection_id: a31eeaed-3fd5-478e-a8ba-e62c6b3f9ecc
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line match one of the Raccine removal actions this rule detects?
  context: Confirm the alert is a true positive before investing time. The rule fires on EITHER a taskkill of
    RaccineSettings.exe, OR a reg delete of the "Raccine Tray" Run key, OR a schtasks /DELETE of the "Raccine Rules
    Updater" task. Read the exact command line and note which of the three branches fired — the branch determines which
    downstream questions carry weight, since a Run-key delete and a task delete touch different persistence surfaces.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to uninstall or remove anti-ransomware tooling?
  context: Removing a security control is a routine administrative action on a managed workstation but an unexpected one on
    a server or a user endpoint where the tool was centrally deployed. Knowing whether the user role and host function are
    consistent with decommissioning Raccine is often the fastest way to separate authorized cleanup from operator activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which Raccine component was removed — the running tray process, the Run-key autostart, or the update task?
  context: Each removal branch strips a different part of the tool. Killing RaccineSettings.exe stops the running tray
    process; deleting the "Raccine Tray" Run key prevents it from relaunching at logon; deleting the "Raccine Rules
    Updater" task halts rule updates. Read the command line to identify which component was targeted, since a full
    uninstall touches all three and a partial removal may indicate a targeted disable of just the protection that blocks
    the operator's next step.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is Raccine still installed and enforcing, or has it been fully removed from this host?
  context: A single command may be one step of a multi-command uninstall. Check whether the Raccine debugger registry
    entries, the tray process, and the update task are still present. If Raccine is fully removed, shadow-copy deletion and
    recovery-disable commands that it previously intercepted will now run unimpeded, so the protection state directly
    affects how urgently recovery artifacts must be verified.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What activity occurred on this host after Raccine was removed?
  context: Removing anti-ransomware protection is preparatory — it restores the ability to delete shadow copies, disable
    recovery, or run encoded PowerShell that Raccine would otherwise have killed. Examining process creation in the window
    immediately after the removal reveals what the removal was meant to enable. Watch specifically for vssadmin, wmic,
    bcdedit, wbadmin, or diskshadow invocations touching shadow storage or recovery state.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense-tampering actions performed on this host in the same window?
  context: An operator who removes one control often removes several. Beyond the Raccine removal, look for log clearing,
    shadow-copy deletion, recovery-disable, firewall changes, or service stops from the same user or parent process. The
    deployment-specific tuning of which service and process names count as security-critical varies per environment, so
    treat any termination of AV, EDR, or backup-related processes in this window as part of the same operation.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: What process spawned the removal command, and is that parent chain expected?
  context: The parent reveals how the removal was invoked. An interactive shell launched from explorer.exe under an
    administrator is consistent with manual decommissioning; a parent such as a remote-execution service, a scripting host,
    or an unexpected automation chain points to scripted or remote operator activity. Walk up from the parent to see what
    launched it and what else it spawned.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously fired this Raccine-removal pattern, what parents and users drove it, and does the
    current alert fit?
  context: The query mirrors the rule's three removal branches scoped to this host, so the resulting parent/user
    distribution reflects how the removal pattern specifically has run here — not generic taskkill, reg, or schtasks usage.
    A removal driven by a new parent process, an unexpected user account, or an unusual command structure is the deviation
    worth chasing; a recurring administrative pattern points to routine maintenance.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains|all:
        - 'taskkill '
        - RaccineSettings.exe
      selection2:
        CommandLine|contains|all:
        - reg.exe
        - delete
        - Raccine Tray
      selection3:
        CommandLine|contains|all:
        - schtasks
        - /DELETE
        - Raccine Rules Updater
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Were the Raccine debugger registry entries or the Run-key autostart modified directly through registry edits?
  context: Raccine installs itself through Image File Execution Options "Debugger" values that redirect shadow-copy and
    recovery binaries to raccine.exe, plus a "Raccine Tray" Run key for the tray process. A complete removal deletes those
    registry entries; an operator may edit the registry directly rather than going through the documented uninstall, which
    would not always surface in process command lines. Checking registry-set events for changes to the Image File Execution
    Options debugger paths and the Run key confirms whether the protection mechanism itself was dismantled.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_paths:
        TargetObject|contains:
          - '\Image File Execution Options\'
          - '\CurrentVersion\Run\Raccine'
      condition: selection_host and selection_paths
    fields:
      - TargetObject
      - Details
      - Image
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains|all:
        - 'taskkill '
        - RaccineSettings.exe
      selection2:
        CommandLine|contains|all:
        - reg.exe
        - delete
        - Raccine Tray
      selection3:
        CommandLine|contains|all:
        - schtasks
        - /DELETE
        - Raccine Rules Updater
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains|all:
        - 'taskkill '
        - RaccineSettings.exe
      selection2:
        CommandLine|contains|all:
        - reg.exe
        - delete
        - Raccine Tray
      selection3:
        CommandLine|contains|all:
        - schtasks
        - /DELETE
        - Raccine Rules Updater
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around the time of the removal?
  context: Tracking the user's activity across all hosts reveals whether the removal was an isolated administrative action
    or one step in broader activity. If the same user triggered similar removals or tampering on multiple hosts, the scope
    is larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains|all:
        - 'taskkill '
        - RaccineSettings.exe
      selection2:
        CommandLine|contains|all:
        - reg.exe
        - delete
        - Raccine Tray
      selection3:
        CommandLine|contains|all:
        - schtasks
        - /DELETE
        - Raccine Rules Updater
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Aggregating process activity around the removal reveals what led to it and what
    followed — reconnaissance, privilege escalation, or staging that provides broader context. Novel parent-child pairs
    standing out at low counts against high-count routine noise are what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before the removal?
  context: Earlier detections on the same host — reconnaissance, credential access, or other defense tampering — may reveal
    the attack stages that preceded the removal and help reconstruct the timeline. A removal of anti-ransomware protection
    that follows credential access or lateral movement reads very differently from one that stands alone.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired this Raccine-removal pattern in the past week, and does the distribution look like
    automation or one-off activity?
  context: The query mirrors the rule's three removal branches with no host scope, so the result is a fleet-wide count of
    the removal pattern rather than generic binary usage. Many hosts firing the same pattern points to a scripted
    deployment or an administrator decommissioning the tool fleet-wide; one host or a small unrelated set points to manual
    operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains|all:
        - 'taskkill '
        - RaccineSettings.exe
      selection2:
        CommandLine|contains|all:
        - reg.exe
        - delete
        - Raccine Tray
      selection3:
        CommandLine|contains|all:
        - schtasks
        - /DELETE
        - Raccine Rules Updater
      condition: 1 of selection*
    fields:
    - host.name
- question: Were other process-based persistence mechanisms installed or removed on this host around the same time?
  context: Operators who strip a protection's scheduled task and Run key often touch other persistence surfaces in the same
    operation — additional scheduled tasks, services, registry Run keys, or BITS jobs. Multiple persistence changes from the
    same timeframe indicate intentional staging rather than an isolated, authorized uninstall.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
