name: Potential Raspberry Robin Dot Ending File
id: db4f448a-f2ee-43c3-84f1-3bfbf850a362
description: |
  Detects a process command line containing a backslash-preceded file name of 1-32 alphanumeric
  characters, a 1-6 character extension, and then a trailing dot immediately followed by a space,
  a double quote, or a single quote — for example a reference written as \payload.dll. rather than
  \payload.dll. A single selection carries the whole detection, so any command line matching that
  pattern fires the rule. The trailing dot is stripped by the Win32 path layer before the file is
  opened, so the referenced file resolves identically with or without it; the dot changes nothing
  operationally and only defeats naive string or extension matching and quick human review of the
  command line. That makes it an artifact of tooling evasion rather than a technical requirement,
  and the Raspberry Robin worm's proxy-execution chain carries it as a consistent trait. Legitimate
  software rarely writes paths this way, but installers, build scripts, and string-concatenating
  wrappers can emit a stray dot, so the investigation should determine which binary consumed the
  path, what file the path resolves to, whether the invocation sits in a proxy-execution chain, and
  whether the environment has produced this pattern before.
type: detection
detection_id: a35c97c8-d9c4-4c89-a3e7-533dc0bcb73a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: >-
    Does the command line reference a file path whose name ends in a trailing dot before a space or
    a quote?
  context: >-
    Before investing investigation time, confirm the pattern is really present in the event. Read
    the full command line and find the backslash-preceded file name, its 1-6 character extension,
    and the dot that follows the extension and sits immediately before a space, a double quote, or
    a single quote. Record the binary that was invoked and the exact path text, including the dot,
    for the rest of the investigation. A path that has an extension but no trailing dot before its
    delimiter is a false match and can be closed here.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: >-
    Is this user and host expected to run commands that reference file paths written with a
    trailing dot?
  context: >-
    Legitimate administrative activity can trigger many detections. Installer packages, build
    tooling, and scripts that concatenate a path with a separator can emit a stray dot after the
    extension, and such wrappers are usually tied to a known role or a known host function. Decide
    whether this account and this machine are a place where that software runs at all before
    treating the pattern as operator activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: >-
    Which binary consumed the dot-terminated path, and what file does that path actually resolve to?
  context: >-
    Strip the trailing dot to get the real target, then determine what the invoked binary was asked
    to do with it — load it as a module, register it, execute it, or read it as data. The working
    directory matters as well, because a relative or short path resolves against it. Note whether
    the target sits on removable or network media, in a user-writable directory such as the roaming
    profile or the shared program data tree, or under a randomly named folder, and whether the
    extension is one the consuming binary would normally accept.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - Image
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned this command, and is that parent chain expected?
  context: >-
    The parent process reveals how the command was invoked. A path handed to a binary by a shell,
    a script host, an installer service, or a removable-media shortcut points at very different
    origins than the same path handed over by a build agent or a management tool. If the parent is
    itself a proxy-execution binary, walk one more level up to find what started it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: >-
    Did any of the common proxy-execution binaries run on this host around the alert, and do they
    link into the same chain as the alerting command?
  context: >-
    Command lines carrying a dot-terminated module path are typically produced by a chain that
    passes execution between signed system binaries so the payload never runs under its own name.
    msiexec.exe, rundll32.exe, odbcconf.exe, regsvr32.exe, control.exe, dllhost.exe, and
    fodhelper.exe are the binaries most often used that way — fodhelper.exe additionally
    auto-elevates without a consent prompt. Compare the parent and child relationships in the
    results to see whether these executions form one sequence or are unrelated routine activity.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - \msiexec.exe
          - \rundll32.exe
          - \odbcconf.exe
          - \regsvr32.exe
          - \control.exe
          - \dllhost.exe
          - \fodhelper.exe
      condition: selection
    fields:
      - Image
      - ParentImage
      - CommandLine
  answer_sources:
  - process_creation
- question: What child processes did the alerting process spawn afterward?
  context: >-
    The processes spawned after the command reveal its actual effect. A path-consuming binary that
    goes on to launch a script host, another proxy-execution binary, or a process with no arguments
    at all is doing more than reading a file. The query is anchored on the alerting process
    instance, so the results are its direct children rather than every execution of the same binary.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: >-
    Was a Run or RunOnce value written under the user hive on this host around the alert, and where
    does it point?
  context: >-
    The worm family associated with this command-line pattern persists through a RunOnce value in
    the user hive that points at a randomly named binary with an uncommon extension in the roaming
    profile or the shared program data tree, and it rewrites the value after each sign-in launch
    removes it. Repeated modification of the same value, or a value naming a binary in a
    user-writable directory, is the signal here; value removal itself is not observable, so judge
    cleanup by the re-modification history and by whether the referenced payload executes.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - \Software\Microsoft\Windows\CurrentVersion\Run\
          - \Software\Microsoft\Windows\CurrentVersion\RunOnce\
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - process_creation
  - manual_review
- question: Did the alerting process write any files to disk, and where did they land?
  context: >-
    A path-consuming proxy-execution step often stages or unpacks its next component before handing
    control on. The query follows the alerting process instance rather than the host, so the results
    are the files this specific execution wrote. File writes carry no hash, so to reputation-check
    anything interesting here, take the written path and look for a later process execution from it,
    where the hash is recorded.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating every process execution on the host in the
    surrounding window collapses routine agent and service telemetry into a few high-count rows,
    while novel parent and child pairs stand out at low counts. Scan for the low-count rows that
    sit next to the alerting command in time.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: >-
    When this host has previously produced dot-terminated file references on a command line, what
    parents and users drove that activity, and does the current alert fit that history?
  context: >-
    The query mirrors the rule's selection scoped to this host, so the resulting parent and user
    distribution reflects how this specific pattern has historically been produced here rather than
    generic process activity. A recurring installer or build parent with a steady user account is a
    tuning candidate; a new parent, an unexpected account, or no history at all is the deviation
    worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|re: \\[a-zA-Z0-9]{1,32}\.[a-zA-Z0-9]{1,6}\.[ "']{1}
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: >-
    Have other hosts produced dot-terminated file references on a command line in the past week, and
    does the cross-host distribution look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of
    this exact pattern. Many hosts producing it points to a packaged product or a scripted
    deployment that emits the stray dot; one host or a small unrelated set points to activity driven
    on those machines specifically. Use the host distribution to calibrate how much of this is
    environmental.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|re: \\[a-zA-Z0-9]{1,32}\.[a-zA-Z0-9]{1,6}\.[ "']{1}
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Has this user previously produced this command-line pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, so the result is the user's 90-day
    history of this specific pattern aggregated by host, not their generic process activity. An
    account that has never produced it before deserves more weight than one that produces it on a
    schedule; weigh the count against the person's role and normal toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|re: \\[a-zA-Z0-9]{1,32}\.[a-zA-Z0-9]{1,6}\.[ "']{1}
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: >-
    Has this parent process historically driven this command-line pattern, or is the parent new for
    this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute the behavior
    and the meaningful pivot is the launch mechanism. The query mirrors the rule's selection scoped
    to the alerting parent process, so the result is the 90-day history of this parent producing
    this pattern, aggregated by host. A parent that already accounts for thousands of prior events
    is vendor or operating-system automation; a new or rare parent for this pattern is the
    deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|re: \\[a-zA-Z0-9]{1,32}\.[a-zA-Z0-9]{1,6}\.[ "']{1}
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did this user do across the environment around this time?
  context: >-
    Tracking the account's activity across all hosts in the surrounding hour shows whether the same
    identity was active on more than one machine. Several hosts showing the same working pattern in
    the window widens the scope; a single host keeps it local. When the alert fires under a machine
    account or a built-in service identity, this view returns routine agent telemetry and the
    parent-anchored view is the one that answers the question.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: >-
    Did this same parent-driven pattern fire on other hosts in the same window, or is the activity
    isolated to this host?
  context: >-
    Under a service principal, asking what else the user did returns agent telemetry from every
    host, so the meaningful question is whether the same launch mechanism fired elsewhere. The query
    mirrors the rule's selection scoped to the alerting parent process, fleet-wide, in the alert
    window. Multiple hosts in the same window points to scheduled or pushed automation; a single
    host points to a local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|re: \\[a-zA-Z0-9]{1,32}\.[a-zA-Z0-9]{1,6}\.[ "']{1}
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host — removable-media
    execution, proxy execution through signed system binaries, consent-prompt bypass, or persistence
    writes — may reveal the stages that preceded this command and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
