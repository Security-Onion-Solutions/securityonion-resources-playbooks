name: Potential Signing Bypass Via Windows Developer Features
id: 60d9db61-e6d8-4d2b-a65a-ae522a94b0f6
description: |
  Detects SystemSettingsAdminFlows.exe (or a process with that OriginalFileName) running with a command line that contains
  TurnOnDeveloperFeatures together with DeveloperUnlock or EnableSideloading. The rule fires only when the binary, the
  TurnOnDeveloperFeatures flag, and one of the developer-feature options are all present. Enabling Developer Mode or
  application sideloading relaxes signing requirements and lets a host install untrusted application packages, so the
  investigation should establish who made this change, whether it was a sanctioned developer or IT action, and whether
  untrusted package installation or other suspicious activity followed.
type: detection
detection_id: a383dec4-deec-4e6e-913b-ed9249670848
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did SystemSettingsAdminFlows.exe run with TurnOnDeveloperFeatures and either DeveloperUnlock or EnableSideloading?
  context: Before investing investigation time, confirm the alert is a true positive. The rule requires all three together —
    the SystemSettingsAdminFlows.exe binary (or that OriginalFileName), the TurnOnDeveloperFeatures flag, and one of the
    DeveloperUnlock or EnableSideloading options. Review the exact command line and process details against these criteria.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to enable Developer Mode or application sideloading?
  context: Legitimate developer workstations and IT-managed devices may enable these features intentionally. Knowing whether
    the user role and host function involve application development or LOB package deployment is often the fastest way to
    distinguish a sanctioned change from a signing-bypass attempt on a system that has no business installing untrusted packages.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did SystemSettingsAdminFlows.exe do? Decode the full command line and identify which developer feature was toggled.
  context: The full command line reveals whether Developer Mode (DeveloperUnlock) or application sideloading (EnableSideloading)
    was enabled, and whether both were set in one invocation. Each option relaxes signing enforcement differently — sideloading
    is what permits installing non-Store application packages. Decode every flag and option to understand the exact change made.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned SystemSettingsAdminFlows.exe and is that parent chain expected?
  context: The parent process reveals how the developer-feature change was invoked. A user-driven settings change typically
    descends from explorer.exe or the Settings app; an unexpected parent such as a script host, a remote-management tool, or
    a command shell suggests the change was made programmatically rather than through the normal UI.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Does this host normally run SystemSettingsAdminFlows.exe?
  context: A process that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low
    historical counts for this binary on this host indicate first-time or rare execution, which raises the priority of the
    developer-feature change.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even routine tools can be abused. The query mirrors the rule's selection structure scoped to this host — the resulting
    parent/user distribution reflects how this specific developer-feature pattern has historically run here, not generic use
    of the binary. A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \SystemSettingsAdminFlows.exe
      - OriginalFileName: SystemSettingsAdminFlows.EXE
      selection_flag:
        CommandLine|contains: TurnOnDeveloperFeatures
      selection_options:
        CommandLine|contains:
        - DeveloperUnlock
        - EnableSideloading
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did SystemSettingsAdminFlows.exe spawn afterward?
  context: The processes spawned after the developer-feature change reveal its actual impact. Of particular interest is
    package-installation activity — application-installer or PowerShell processes invoking Add-AppxPackage — that would follow
    once sideloading is enabled. Unexpected children such as cmd.exe, powershell.exe, or download utilities point to
    post-change operator activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other tools ran on this host around the same time?
  context: A developer-feature change rarely stands alone in an intrusion. Activity surrounding it may reveal package staging,
    download of an untrusted installer, reconnaissance, or persistence installation that provides broader context for whether
    this change was benign configuration or attack preparation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this
    developer-feature pattern, not generic use of the binary. Many hosts firing the same pattern points to scripted deployment
    or imaging automation; one host or a small unrelated set points to manual activity. Use the host distribution and
    parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \SystemSettingsAdminFlows.exe
      - OriginalFileName: SystemSettingsAdminFlows.EXE
      selection_flag:
        CommandLine|contains: TurnOnDeveloperFeatures
      selection_options:
        CommandLine|contains:
        - DeveloperUnlock
        - EnableSideloading
      condition: all of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \SystemSettingsAdminFlows.exe
      - OriginalFileName: SystemSettingsAdminFlows.EXE
      selection_flag:
        CommandLine|contains: TurnOnDeveloperFeatures
      selection_options:
        CommandLine|contains:
        - DeveloperUnlock
        - EnableSideloading
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \SystemSettingsAdminFlows.exe
      - OriginalFileName: SystemSettingsAdminFlows.EXE
      selection_flag:
        CommandLine|contains: TurnOnDeveloperFeatures
      selection_options:
        CommandLine|contains:
        - DeveloperUnlock
        - EnableSideloading
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints. If
    the same user enabled developer features or staged packages on multiple hosts, the scope of the activity may be larger
    than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \SystemSettingsAdminFlows.exe
      - OriginalFileName: SystemSettingsAdminFlows.EXE
      selection_flag:
        CommandLine|contains: TurnOnDeveloperFeatures
      selection_options:
        CommandLine|contains:
        - DeveloperUnlock
        - EnableSideloading
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to
    this developer-feature change, what happened after, and whether it is part of a larger sequence. Look for download of an
    untrusted installer, package deployment, reconnaissance, or persistence mechanisms.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or
    delivery of an untrusted package — may reveal the attack stages that preceded the developer-feature change and help
    reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
