name: Unusual Child Process of dns.exe
id: 8fdd63bf-8eaf-4163-bfdb-cd4ff5f84f28
description: |
  Detects the Windows DNS Server service binary, dns.exe, spawning a child process
  other than the benign conhost.exe exclusion. dns.exe runs as SYSTEM and has no
  routine reason to launch interactive tools, so any unexpected child is the artifact
  of memory-corruption exploitation against the DNS service — the SIGRed (CVE-2020-1350)
  pattern, where a malicious DNS response yields SYSTEM-level code execution. Common
  follow-on children are built-in discovery utilities and proxy-execution LOLBins used
  to stage a second-stage payload, or werfault.exe if the service crashed. The
  investigation should identify the child, reconstruct what it and any siblings did,
  check whether the host is patched, and look for the network and follow-on activity
  that typically surrounds exploitation of an internet-reachable DNS server.
type: detection
detection_id: a4e3d776-f12e-42c2-8510-9e6ed1f43ec3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the alert match the rule — dns.exe spawning a child process that is not conhost.exe?
  context: Before investing investigation time, confirm the parent is the Windows DNS
    Server binary dns.exe and the child is something other than the excluded conhost.exe.
    Note the child's image, command line, and integrity level. A child such as
    whoami.exe, powershell.exe, mshta.exe, regsvr32.exe, rundll32.exe, or cmd.exe running
    as SYSTEM is the exploitation signal; werfault.exe instead points to a DNS service
    crash, which is the denial-of-service variant of the same vulnerability.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: Is this host a DNS server, and is any process legitimately expected to be launched by the DNS service?
  context: The rule fires only on hosts running the Windows DNS Server role, which is
    typically a domain controller or dedicated DNS server. dns.exe has essentially no
    legitimate reason to spawn interactive tools, so the host's function and whether any
    sanctioned automation could explain the child are the fastest way to separate a true
    positive from a rare benign exclusion. Note whether this falls inside normal business
    hours or a documented maintenance window, as off-hours execution by a service account
    raises suspicion.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What inbound DNS request or network activity reached the DNS service immediately before this child was spawned?
  context: Exploitation of the DNS service is driven by a crafted inbound DNS response or
    query that triggers memory corruption in dns.exe; the spawned child is the result of
    that exploitation. Identifying the source address and the request that preceded the
    child execution enables blocking at the perimeter and reveals whether the DNS server
    is reachable from untrusted networks. Inbound DNS traffic to the service is examined
    from network telemetry and DNS server logs around the alert time.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Did the same DNS service exploitation pattern fire on other DNS servers?
  context: An attacker probing one DNS server commonly targets others reachable by the same
    path, and a wormable DNS vulnerability can propagate server to server. Correlating this
    detection across all hosts reveals how many DNS servers exhibited an unexpected child
    process and identifies additional systems that need investigation and patching.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this DNS server patched against the CVE-2020-1350 (SIGRed) DNS Server remote code execution vulnerability?
  context: This pattern models exploitation of a wormable remote code execution flaw in the
    Windows DNS Server that affects Server 2003 through 2019 and yields SYSTEM-level
    execution. Confirming the host's patch level distinguishes exploitation of the known
    vulnerability from a different code path and shows whether other DNS servers in the
    environment carry the same exposure. Check the installed updates against the July 2020
    DNS Server security fix.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: What did the spawned child process do? Decode its command line and working directory.
  context: The child process is the payload of the exploitation, so its full command line
    reveals the operator's immediate objective. Decode any encoded content, flags, file
    paths, or URLs. Discovery utilities such as whoami.exe, netstat.exe, systeminfo.exe,
    or tasklist.exe indicate host enumeration after gaining SYSTEM, while proxy-execution
    LOLBins such as mshta.exe, regsvr32.exe, or rundll32.exe usually carry a second-stage
    download-and-run.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What other child processes did the DNS service spawn around the same time?
  context: After gaining SYSTEM through the DNS service, operators frequently launch several
    tools in sequence — discovery, credential access, then download-and-run of a follow-on
    payload. Listing every child of dns.exe on this host within the surrounding window
    reveals the full scope of activity staged through the exploited service rather than the
    single child that tripped the alert.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Were abnormal outbound network connections made by the DNS service or its child process around the alert?
  context: SYSTEM-level code execution through the DNS service is typically followed by
    outbound connections to retrieve a second stage or establish command-and-control.
    Connections initiated by dns.exe or its spawned child to external addresses — outside
    the normal zone-transfer and forwarder peers a DNS server talks to — are the network
    artifact of exploitation. Review destination addresses and ports for anything that
    does not match expected DNS peering.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      filter:
        Image|endswith:
          - '\dns.exe'
          - '\svchost.exe'
      condition: selection and not filter
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Has the DNS service ever spawned this child binary on this host before?
  context: dns.exe spawning anything other than conhost.exe is anomalous by design, so the
    historical frequency of this specific parent-child pairing is a strong discriminator. A
    zero or near-zero count over the baseline window confirms a novel spawning relationship
    consistent with exploitation; a non-trivial count points toward a benign pattern that
    should be added as an exclusion.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \dns.exe
      filter:
        Image|endswith: \conhost.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \dns.exe
      filter:
        Image|endswith: \conhost.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: What else did this account do across the environment around this time?
  context: Tracking the owning account's activity across all hosts in the surrounding window
    reveals lateral movement or coordinated activity beyond this one server. If the same
    account triggered similar process activity elsewhere, the scope is larger than a single
    DNS server.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \dns.exe
      filter:
        Image|endswith: \conhost.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Surveying activity around the alert reveals what
    led to the child execution and what followed — reconnaissance, credential access, or
    persistence staged from the SYSTEM foothold. Aggregating by process and parent collapses
    repetitive agent telemetry into high-count rows while novel parent-child pairs stand out
    at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same DNS server — reconnaissance against the service,
    abnormal network connections, or registry and file modifications — may reveal the stages
    that preceded this child execution and help reconstruct the timeline. Abnormal network
    connections, registry or file modifications, and other host alerts in the surrounding
    window are the leading indicators to correlate with this event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
