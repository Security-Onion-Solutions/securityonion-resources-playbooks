name: Suspicious RazerInstaller Explorer Subprocess
id: 37459a15-2eb1-4552-b30b-a13f92c197b6
description: |
  Detects a child process spawned by RazerInstaller.exe that runs at System integrity and does not live under
  C:\Windows\Installer\Razer\Installer\. The installer is launched by plug-and-play when a Razer device is attached and runs
  as LOCAL SYSTEM; one of its dialogs lets the user browse for a different installation folder, and that picker can hand the
  user an Explorer window or a shell that inherits the installer's SYSTEM token. The normal case is a user genuinely choosing
  an install path, so the investigation should establish what the SYSTEM-integrity child actually was, whether someone was at
  the console when it appeared, and what that child went on to do — file writes, registry writes, account creation, or further
  processes. The technique is publicly documented and simple to reproduce, so a curious user experimenting with a plugged-in
  device is as plausible as a deliberate local privilege-escalation attempt.
type: detection
detection_id: a4eaf250-7dc1-4842-862a-5e71cd59a167
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Did RazerInstaller.exe spawn this child at System integrity, and does the child run from outside the Razer installer
    directory?
  context: >-
    The rule fires only when all of its criteria hold together: the parent Image ends in \RazerInstaller.exe, the child's
    IntegrityLevel is System (recorded either as the label System or as the SID S-1-16-16384 — the same value in two
    notations), and the child's Image does not start with C:\Windows\Installer\Razer\Installer\. That last clause is the
    rule's allow-list for the installer's own helper binaries, so a child that survives it is running with a SYSTEM token from
    a path the installer does not normally use. Confirm the parent and integrity level on the alerting event before going
    further.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - IntegrityLevel
  answer_sources:
  - alert
  - process_creation
- question: Is a Razer device installation expected on this host, and is this user expected to be installing hardware drivers
    here?
  context: The installer starts when a Razer device is connected, which means someone with physical or console access to the
    machine initiated it. Establishing whether a peripheral install is plausible for this host and this person — a workstation
    where the user picks their own mouse versus a server or kiosk where no one should be plugging in devices — is usually the
    fastest way to separate a routine install from a deliberate attempt to obtain a SYSTEM shell.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What was the RazerInstaller process itself — where did it run from, and what launched it?
  context: The installer normally arrives through device installation handled by the plug-and-play service, so its own parent
    and path tell you whether this was a stock installer invoked by hardware attachment or a copy staged and run from a
    user-writable location. The parent event is retrieved by its process identifier, so it may have started well before the
    alert.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
  answer_sources:
  - process_creation
- question: What exactly is the SYSTEM-integrity child — its full command line and working directory?
  context: The discriminator is what the child actually is. An installer helper or an Explorer window opened on a folder-picker
    path is the benign reading; a command interpreter, script host, or a binary run from a user-writable directory is not.
    The working directory often names the folder the picker was pointed at, which shows where the user navigated before the
    child appeared. This query returns every execution of this binary on the host in the surrounding window, so the alerting
    event may appear alongside unrelated runs of the same name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What did the SYSTEM-integrity child go on to launch, and did those descendants also run at System integrity?
  context: A privilege inheritance only matters if it was used. Children of the alerting process carry the same token, so
    command interpreters, account-management binaries, or dropped executables appearing beneath it are the difference between
    a dialog that was opened and closed and a SYSTEM shell that was worked from. The rule's own documented benign case is an
    Explorer window with no interesting children.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
  answer_sources:
  - process_creation
  - edr_console
- question: What other child processes did RazerInstaller.exe spawn on this host?
  context: The installer legitimately spawns helper binaries from its own directory during a real install; those are filtered
    out of the alert but are useful corroboration that an install genuinely ran. Several unfiltered children, or children
    appearing long after the install would have completed, points at repeated use of the folder picker rather than a single
    install pass.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What files did the SYSTEM-integrity child write around the time of the alert?
  context: A process holding a SYSTEM token can write to locations a standard user cannot — service directories, system
    paths, startup locations, or a staged binary later executed with elevation. File writes attributed to this process are
    the clearest evidence that the inherited privilege was exercised rather than merely obtained. File writes carry no hash;
    if a dropped path is interesting, pivot to the later execution of that path to obtain hash and signature data.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - ProcessGuid
  answer_sources:
  - file_event
  - edr_console
- question: Did the SYSTEM-integrity child modify the registry, and do those keys affect trust, services, or startup?
  context: Registry writes made under a SYSTEM token reach hives a standard user cannot modify — service definitions,
    machine-wide startup keys, and trust-provider or certificate stores among them. Writes to those areas turn a transient
    dialog into a durable change. Value deletion is not observable in this telemetry, so judge cleanup by later
    re-modification of the same key rather than by an absent delete event.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetObject
      - Details
  answer_sources:
  - edr_console
  - manual_review
- question: Who was logged on interactively at this host around the time of the alert?
  context: >-
    This technique requires someone at the machine, or at a console session on it, because the installer is triggered by
    attaching a device and the picker dialog needs to be driven by hand. An interactive or cached-interactive logon (types 2
    and 11) close to the alert names the person who was in a position to do that, which matters more here than tracing a
    remote account. If Security channel events are not collected in this environment, treat an empty result as a visibility
    gap rather than evidence that nobody was present.
  range: -24h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 4624
        LogonType:
          - 2
          - 11
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetUserName
      - LogonType
      - WorkstationName
  answer_sources:
  - active_directory
  - organizational_knowledge
- question: Has RazerInstaller.exe spawned this child binary on this host before?
  context: A first-time pairing between the installer and this particular child suggests something other than the routine
    install path the vendor software follows. A long history of the same pairing on this host points instead at recurring
    device installs or a vendor update cycle that regularly reaches the folder picker.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Is this installer-to-child pattern occurring on other hosts?
  context: The same pairing on several hosts in a short period suggests a hardware rollout or a software deployment reaching
    the same dialog everywhere, which lowers the weight of any single fire. A pairing confined to one host keeps the focus on
    that host and whoever had access to it.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's 90-day history of
    SYSTEM-integrity children of the installer outside the installer directory, aggregated by host. A user who has never
    produced this pattern is a different proposition from one who installs peripherals routinely; weigh the count against
    whether device installation is part of their normal work.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \RazerInstaller.exe
        IntegrityLevel:
        - System
        - S-1-16-16384
      filter_main_razer:
        Image|startswith: C:\Windows\Installer\Razer\Installer\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Has this parent process historically driven the rule's pattern on this host or across the environment, or is the
    parent new for this activity?
  context: 'The alert fires under a SYSTEM-integrity child, so user identity frequently does not attribute the behavior and
    the meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped to the alerting
    parent process, giving the 90-day history of this installer driving this specific pattern. A parent that already accounts
    for a long run of prior events reads as a recurring install or update cycle; a parent that is new for this pattern is the
    deviation worth chasing.'
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \RazerInstaller.exe
        IntegrityLevel:
        - System
        - S-1-16-16384
      filter_main_razer:
        Image|startswith: C:\Windows\Installer\Razer\Installer\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What else did this user do across the environment around this time?
  context: Tracking the user's activity across all hosts around the alert shows whether the console session that drove the
    installer dialog was part of a wider pass over several machines. If the alert fired under SYSTEM or a machine account,
    this pivot returns service and agent telemetry rather than human activity, and the parent-anchored view is the meaningful
    answer instead.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this
    host?
  context: 'Under a service principal, asking what else the user did returns agent telemetry rather than an answer, because
    every host runs SYSTEM-owned agents constantly. The useful question is whether the same launch mechanism fired elsewhere:
    the query mirrors the rule''s selection structure scoped to the alerting parent process, fleet-wide, in the alert window.
    Multiple hosts in the same window points at a coordinated hardware or software rollout; a single host points at a
    host-local trigger and whoever was at that machine.'
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \RazerInstaller.exe
        IntegrityLevel:
        - System
        - S-1-16-16384
      filter_main_razer:
        Image|startswith: C:\Windows\Installer\Razer\Installer\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: 'Aggregating every parent-child pairing on the host in the window around the alert collapses routine agent and
    service telemetry into a few high-count rows and leaves novel pairings standing out at low counts. That is what to scan
    for here: reconnaissance, account manipulation, or persistence appearing next to the installer activity, which would
    reframe a folder picker as a step rather than the whole event.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host help place this event in a sequence. Local privilege escalation is generally a
    step toward something else, so preceding reconnaissance or credential access changes the reading, while an otherwise
    quiet host supports the interpretation that someone simply plugged in a device.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
