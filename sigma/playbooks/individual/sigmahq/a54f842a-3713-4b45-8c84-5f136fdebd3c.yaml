name: New PortProxy Registry Entry Added
id: 6989f75e-69b8-480f-b8b9-712a87b3ca4b
description: |
  Detects a write to the Windows PortProxy configuration under
  SYSTEM\CurrentControlSet\Services\PortProxy\v4tov4\tcp, the registry location that stores native
  IPv4-to-IPv4 port-forwarding rules. The value name encodes the listen address and port and the
  value data encodes the connect address and port; the IP Helper service (iphlpsvc, hosted in
  svchost.exe -k netsvcs) reads this configuration and creates the listener that bridges traffic
  between the two. The rule fires whenever such a value is written, whether by netsh interface
  portproxy add, by reg.exe writing the value directly, or by code that writes the key and signals
  iphlpsvc. Legitimate uses exist (WSL2 or container network bridge scripts, some KVM software, and
  sanctioned administrative access on jump hosts), but the same mechanism is used to pivot into
  segmented networks and to tunnel RDP and other services past firewalls. Investigate what listen
  and connect mapping was configured, which process wrote it and what launched that process, whether
  the proxy actually carried traffic, and whether the rule persists or was torn down.
type: detection
detection_id: a54f842a-3713-4b45-8c84-5f136fdebd3c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting write target the PortProxy v4tov4 tcp key that stores port-forwarding rules?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a
    value is written under SYSTEM\CurrentControlSet\Services\PortProxy\v4tov4\tcp. Review the exact
    TargetObject on the triggering event to confirm the path is the PortProxy port-forwarding
    location and that the value name carries a listen address and port. Any write here defines a new
    forwarding rule, so confirming the path is the first step before decoding what it forwards.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this host and user expected to configure Windows port forwarding?
  context: >-
    Native port forwarding via PortProxy is administrative and rare on workstations; on some jump or
    management hosts it is used for sanctioned access. Knowing whether the writing account and host
    function match any expected forwarding activity is often the fastest way to separate routine
    administration from an actor staging a pivot. User attribution is present on roughly 94% of
    endpoint registry events; when it is a machine account or SYSTEM, pivot on the writing process
    instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What forwarding rule does this PortProxy value define, and why is this key a port-forwarding location?
  context: >-
    The key SYSTEM\CurrentControlSet\Services\PortProxy\v4tov4\tcp holds IPv4-to-IPv4 forwarding
    rules. The value name is the listen address and port and the value data is the connect address
    and port; the IP Helper service reads this and opens a listener that bridges the two. Confirming
    the exact key and writing process establishes that this is a live forwarding rule rather than an
    unrelated Services edit, and a connect port such as 3389 (RDP) or a listen address of 0.0.0.0
    that accepts connections from any source indicates external-facing exposure of an internal
    service.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Decode the mapping - what are the listen and connect addresses and ports?
  context: >-
    The value name follows the format listen_ip/listen_port and the Details field holds the value
    data in the format connect_ip/connect_port as a string. Decode both to read exactly what is being
    forwarded where: a connect port of 3389 exposes RDP, a connect address on an internal subnet
    indicates a pivot into a segmented network, and a listen address of 0.0.0.0 accepts inbound
    sessions from anywhere. Details is present on roughly 79% of registry modifications and should be
    populated for this string value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote the PortProxy value, and what launched it?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to
    read its Image, full command, and parent. The value can be written by netsh interface portproxy
    add, by reg.exe writing the value directly, or by a custom binary that writes the key and signals
    the IP Helper service, and the direct-write paths exist specifically to avoid the netsh keyword
    string. A write launched from a script host, an Office application, or an unsigned binary points
    to programmatic staging rather than a deliberate administrator action; the parent chain
    distinguishes the two.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Did the configured proxy carry traffic to the connect address after the rule was written?
  context: >-
    Writing the registry value alone does not start forwarding; the IP Helper service (iphlpsvc,
    under svchost.exe -k netsvcs) creates the listener and, once activated by a service parameter
    change or a reboot, opens an outbound connection to the configured connect address and port.
    The query is anchored on svchost.exe because iphlpsvc-forwarded traffic is emitted by that
    hosting process; match the DestinationIp and DestinationPort columns against the connect_ip and
    connect_port decoded from the value data. A svchost.exe connection to that exact pair in the
    window after the write is the proxy carrying traffic. Absence of matching traffic can mean the
    rule was staged but not yet activated.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \svchost.exe
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - Initiated
- question: What host initiated inbound connections to the forwarded port, and is it an expected administrative source?
  context: >-
    A pivot host running portproxy listens on the configured port and forwards inbound sessions to an
    internal destination, commonly RDP on 3389. Identifying the source of inbound connections on the
    listen or other forwarding ports reveals whether the pivot is used by a known administrative jump
    box or by an unexpected source. Match the results against the specific listen port decoded from
    the value; the port list here covers common forwarding and remote-service ports, including the
    well-known proxy ports 1080, 8080, and 4444.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
          - 135
          - 1080
          - 8080
          - 4444
      condition: selection
    fields:
      - SourceIp
      - DestinationPort
- question: Has this user account moved to other hosts using remote-access or lateral-movement tools?
  context: >-
    An actor who sets up a forwarding pivot often uses it to reach further into the environment.
    Finding the same user account running psexec, mstsc, ssh, plink, or wmic across multiple
    hosts in a short window indicates active lateral movement rather than an isolated
    configuration change. If the writing account is SYSTEM or a machine account this user pivot
    degenerates, so corroborate with host-based and source-address correlation. If this alert
    fired under SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a machine account (name ending in $),
    this query intentionally returns nothing — a user pivot on a service principal matches every
    host's background automation, not an actor; assess movement through the host- and program-
    scoped questions instead.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_lateral:
        Image|endswith:
        - \psexec.exe
        - \psexec64.exe
        - \mstsc.exe
        - \ssh.exe
        - \plink.exe
        - \wmic.exe
      filter_svcprin_builtin:
        User:
        - SYSTEM
        - LOCAL SERVICE
        - NETWORK SERVICE
      filter_svcprin_machine:
        User|endswith: $
      condition: (selection and selection_lateral) and not 1 of filter_svcprin_*
    fields:
    - host.name
    - Image
- question: Is Windows port forwarding authorized for use on this host?
  context: >-
    Native port forwarding through PortProxy and the IP Helper service is rarely part of a standard
    workstation or server build. Some administrative or jump hosts use it for sanctioned access, so
    check whether this host's role and change-management records permit a forwarding rule.
    Unauthorized forwarding is a common pivot and covert-relay setup regardless of the mechanism
    being native to Windows, so a rule with no approved use case should be treated as unexpected.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a change ticket or maintenance window that explains this port-forwarding rule?
  context: >-
    Legitimate forwarding configuration usually maps to a documented administrative task, a network
    change, or a development or container-bridge setup. If no ticket or approved use case covers this
    rule, the configuration may have been placed to establish covert access into an internal service.
    Correlate the timing of the write with recorded change activity for this host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the forwarding rule persist, or was the PortProxy value changed again afterward?
  context: >-
    PortProxy configuration is stored in the registry and survives reboots, so it stays live until it
    is removed. Registry key and value deletions are not observable in this telemetry, so durability
    is judged from the key's re-modification history rather than from a delete event. A later write
    that clears or overwrites the value suggests the operator tore down the proxy after use, while an
    unchanged value leaves the forwarding rule active. Compare the Details values written over the
    following window.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor staging a pivot often makes adjacent configuration changes in the same session, such as
    firewall policy edits to permit the listen port, additional PortProxy entries, or persistence
    keys. Clustering the registry writes on this host in a short window around the alert reveals the
    full scope of changes and which process made them. The triggering key appears in the results; the
    signal is what else was modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    The configuration write rarely happens in isolation. Aggregating process activity in a tight
    window around the alert surfaces what led up to the write and what ran immediately after, such as
    a netsh or reg invocation, an sc.exe parameter change that activates the IP Helper service, or a
    remote-access session. Novel parent-child pairs stand out at low counts against high-count
    routine telemetry, which is what points to the tool that staged the forwarding rule.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Has the PortProxy key been modified before on this host?
  context: >-
    Forwarding rules should change rarely and only through deliberate action, so a history with no
    prior writes makes this a first-time configuration and raises its weight. A history of periodic
    writes points instead to a management process or a repeatedly run bridge script. Compare the
    historical Details values to see whether the same mapping was set before or whether this rule is
    new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same PortProxy value modified on other hosts in the environment?
  context: >-
    The same forwarding rule across many hosts suggests a management push or a widely deployed bridge
    tool; the same rule confined to one host suggests a targeted pivot. Compare the Details values
    across hosts to see whether they define the same listen-to-connect mapping and whether the
    writing process is consistent, which separates a single hands-on operation from broad deployment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host, such as reconnaissance, credential access, or execution of
    remote-access tooling, may reveal the stages that preceded setting up the pivot and help
    reconstruct the timeline. Setting up a forwarding rule is typically a means to reach or relay to
    other systems, so prior alerts help place this write within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
