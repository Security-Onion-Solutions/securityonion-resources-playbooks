name: Exchange PowerShell Cmdlet History Deleted
id: 3605dbe7-aeba-4442-8a38-58a79ee84066
description: |
  Detects deletion of an Exchange Server PowerShell cmdlet-history log — an on-disk text file under
  \Logging\CmdletInfra\LocalPowerShell\Cmdlet\ whose name contains _Cmdlet_ (for example
  powershell.exe_<PID>_Cmdlet_YYYYMMDDHH-N). These files record one row per Exchange Management Shell
  cmdlet execution (authenticated user, cmdlet, parameters, result) and are independent of the live
  event logs, so they are a primary source for reconstructing mailbox exports, inbox-forwarding rules,
  and role-assignment changes after an incident. The rule fires when the TargetFilename both starts with
  that path and contains _Cmdlet_, so removal of this file is an indicator-removal / anti-forensic signal.
  Log rotation can delete old files legitimately, so the investigation should determine what was removed,
  which process removed it and how it was launched, whether the audit trail was recreated or can be
  recovered, and what other destructive or evasive activity accompanied it.
type: detection
detection_id: a55349d8-9588-4c5a-8e3b-1925fe2a4ffe
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the deleted file match an Exchange PowerShell cmdlet-history log, and which process removed it?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires on a file
    deletion whose path starts with \Logging\CmdletInfra\LocalPowerShell\Cmdlet\ and whose name contains
    _Cmdlet_. Review the exact TargetFilename, the operation (this query returns every operation on the
    path so the deletion event and its type are visible), and the responsible process to confirm a cmdlet
    audit-log file was deleted rather than an unrelated write to the directory.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to delete Exchange cmdlet-history logs?
  context: >-
    Removal of Exchange forensic logs is normally done only by log rotation or a deliberate maintenance
    action, so knowing whether the responsible account and host role fit any sanctioned cleanup is the
    fastest way to separate routine housekeeping from evidence destruction. User attribution is present on
    roughly 94% of endpoint file events; when it is a machine account, SYSTEM, or missing, judge by the
    deleting process and the host function instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What was removed — the Exchange cmdlet audit trail being destroyed, or a routine log rotation?
  context: >-
    The alert is a deletion, so the file's contents can no longer be read from disk; the investigative value
    is in what was removed and why. The Exchange cmdlet-history log records every Exchange Management Shell
    cmdlet that ran on the server, including mailbox exports, inbox-forwarding-rule changes, and management
    role assignments — deleting it destroys the record of exactly that activity. Judge whether the deleting
    process and timing look like the Exchange service rotating old files versus an interactive or scripted
    removal aimed at hiding recent actions.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_delete
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What command performed the deletion, and did it target the cmdlet logs alone or a broader set of forensic artifacts?
  context: >-
    The file event carries no command line, so pivot by the responsible process to read the full command it
    ran. Decode it to establish scope: a single Remove-Item or del against one cmdlet log is narrower than a
    wildcard sweep of the whole \Logging\CmdletInfra\ tree or a script that also clears event logs and shadow
    copies. The breadth of the deletion command is the difference between one file being tidied up and the
    server's forensic record being wiped.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process performed the deletion, and what launched it?
  context: >-
    Pivot by the responsible process identifier to its own process record to read its image, full command,
    and parent. A deletion driven by explorer.exe or an administrator's interactive shell reads differently
    from one launched by a web-server worker, a script host such as wscript.exe or mshta.exe, or an unsigned
    binary. The parent chain distinguishes hands-on maintenance from a programmatic anti-forensic step run as
    part of a larger operation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Did this cmdlet-history log exist before the deletion, and can its contents be recovered?
  context: >-
    A deletion event carries no hash, and a text audit log leaves no execution record to fall back on, so
    recovery depends on other copies. Prior file events show whether and when Exchange created this file, which
    fixes the window the destroyed log would have covered. On-disk recovery paths are Volume Shadow Copies,
    server backups, and the recycle bin; the cmdlet content itself may also survive in independent PowerShell
    logging. Treat the log as gone from disk and pursue those copies rather than assuming the file is still present.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did PowerShell script block logging independently record the Exchange Management Shell cmdlets the deleted history would have contained?
  context: >-
    Script block logging (Event ID 4104) records the cmdlet and script content PowerShell actually executes and
    is written to a channel separate from the on-disk cmdlet-history file, so it can preserve the very activity
    the deleted log recorded — mailbox exports, inbox-forwarding-rule changes, role assignments — even after the
    on-disk trail is destroyed. Look backward over the days preceding the deletion for Exchange cmdlets run in the
    management shell. If PowerShell operational logs are not ingested in this environment, treat zero results as a
    visibility gap rather than evidence nothing ran.
  range: -7d
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Was this exact log file restored after the deletion, or did the gap persist?
  context: >-
    The file's post-deletion lifecycle separates rotation from destruction. Under normal operation Exchange keeps
    writing new cmdlet-history files, so a same-path recreation or a restore from backup argues for benign cleanup,
    while a persistent gap with no return of the file points to deliberate removal. Because rotation produces
    new files under fresh PID and timestamp names rather than reusing this exact name, whether the directory keeps
    receiving new logs is answered by the directory-activity question; here the focus is on this specific file
    reappearing.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What did the deleting process do next — was this part of a broader cleanup or destructive sequence?
  context: >-
    A single log deletion rarely stands alone. Anti-forensic removal is often followed by more of the same from
    the same process: clearing additional logs, deleting shadow copies, disabling recovery, or running the impact
    payload. The query is anchored on the deleting process image, returning both further launches of that binary
    and the children it spawned; wevtutil, vssadmin, or wmic rows here mark an evidence-destruction sequence in
    progress rather than a one-off file removal.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_same:
        host.name|expand: '%hostname%'
        Image|expand: '%Image%'
      selection_child:
        host.name|expand: '%hostname%'
        ParentImage|expand: '%Image%'
      condition: 1 of selection_*
    fields:
      - Image
      - CommandLine
- question: What activity occurred on this host after the cmdlet history was destroyed?
  context: >-
    Forensic logs are removed to hide something. Examining what ran on the host immediately after the deletion
    can reveal the activity the removal was meant to conceal — further mailbox or configuration changes,
    credential access, or lateral movement. A gap in one log source followed by process creation in that window
    points to actions taken under reduced visibility.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other log-clearing or anti-forensic actions performed on this host?
  context: >-
    An actor who deletes one forensic log often removes several. On an Exchange server the parallel targets are
    the Windows Security and MSExchangeManagement event logs, IIS logs, and Volume Shadow Copies. Finding
    wevtutil, Clear-EventLog, vssadmin, or similar removal commands from the same user or parent process in the
    surrounding window indicates multiple evidence sources were cleared in one operation rather than an isolated
    file deletion.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\fsutil.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'clear-eventlog'
          - 'delete shadows'
          - 'delete catalog'
          - 'usn deletejournal'
          - 'remove-item'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Were registry-based logging or audit configurations modified on this host around the deletion?
  context: >-
    Indicator removal spans files and the registry. Attackers who destroy on-disk logs frequently also weaken the
    settings that would record future activity — PowerShell transcription and module logging, event-log channel
    configuration, audit policy under the LSA key, or ETW autologger sessions. Registry key deletion is not
    observable in this telemetry, so a change shows up as a modification to these keys; a write to a logging or
    audit path by the same actor near the deletion signals the visibility reduction was deliberate.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_logging:
        TargetObject|contains:
          - '\PowerShell\'
          - '\WINEVT\'
          - '\Services\EventLog\'
          - '\Control\Lsa\'
          - '\Autologger\'
      condition: selection and selection_logging
    fields:
      - TargetObject
      - Image
      - User
- question: What else was written to or deleted from the Exchange cmdlet-log directory recently, and by which processes?
  context: >-
    The rule pins one directory — \Logging\CmdletInfra\LocalPowerShell\Cmdlet\ — which under normal operation is
    written and rotated only by Exchange itself. Other recent arrivals or removals in the same directory reveal
    whether a single file was deleted or the whole audit trail was cleared, and whether a process other than the
    Exchange service touched it. A single unfamiliar writer or a burst of deletions across many cmdlet logs is the
    signal that the record was wiped rather than rotated.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\Logging\CmdletInfra\LocalPowerShell\Cmdlet\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Indicator removal typically follows the activity it is meant to hide. Earlier detections on the same host —
    reconnaissance, credential access, mailbox or configuration abuse, or other defense tampering — may reveal the
    stages that preceded the deletion and help reconstruct the timeline the destroyed log would otherwise have
    documented.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- always_include: true
  question: Has this user previously produced the rule's deletion pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, so the result is the user's 90-day history of
    deleting Exchange cmdlet-history logs specifically, aggregated by host — not their general file activity. A
    user who has never produced this pattern is more notable than one who does so regularly; weigh the count
    against whether the account is an Exchange administrator or service identity with a reason to remove these logs.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_delete
      product: windows
    detection:
      selection:
        TargetFilename|startswith: \Logging\CmdletInfra\LocalPowerShell\Cmdlet\
        TargetFilename|contains: _Cmdlet_
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this deletion pattern on this host or across the environment, or is the program new for this activity?
  context: >-
    When the alert fires under a service principal or machine account, user identity does not attribute the
    action; the meaningful pivot is the launch mechanism. The query mirrors the rule's selection scoped to the
    alerting program, so the result is the 90-day history of that program driving this specific deletion
    pattern. A new or rare program for this pattern is the deviation worth chasing; a program already responsible
    for thousands of prior events is Exchange maintenance or scheduled housekeeping.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_delete
      product: windows
    detection:
      selection:
        TargetFilename|startswith: \Logging\CmdletInfra\LocalPowerShell\Cmdlet\
        TargetFilename|contains: _Cmdlet_
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts in the surrounding window reveals whether the deletion was an
    isolated act or one step in broader activity spanning multiple endpoints. If the same account was active on
    other hosts at the same time, the scope of the investigation widens beyond this server.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven deletion pattern fire on other hosts in the same window, or is it isolated to this host?
  context: >-
    Under a service principal, asking what else the user did across the network returns agent-telemetry noise
    because every host runs SYSTEM-owned processes constantly. The meaningful question is whether the same launch
    mechanism produced this deletion elsewhere: the query mirrors the rule's selection scoped to the alerting
    program, fleet-wide, in the alert window. Multiple hosts point to scheduled or pushed automation; a
    single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_delete
      product: windows
    detection:
      selection:
        TargetFilename|startswith: \Logging\CmdletInfra\LocalPowerShell\Cmdlet\
        TargetFilename|contains: _Cmdlet_
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
