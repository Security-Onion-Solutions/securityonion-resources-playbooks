name: Suspicious Usage Of Active Directory Diagnostic Tool (ntdsutil.exe)
id: 9dd6bf30-02e4-404f-8d10-e3822108f3b1
description: |
  Detects execution of ntdsutil.exe with command-line patterns used to expose the Active Directory
  database (ntds.dit) for offline reading. The rule fires when the binary is ntdsutil.exe (by Image or
  OriginalFileName) AND its command line either contains both "snapshot" and "mount " (mounting a Volume
  Shadow Copy of the AD volume) or contains "ac", " i", and " ntds" together (activating the ntds instance
  before snapshot work). Legitimate context is a domain administrator restoring or inspecting AD snapshots;
  the malicious context is an operator mounting a snapshot of the live AD volume so the ntds.dit credential
  store can be read offline without touching the running AD DS service, typically followed by exposing the
  mount via a directory-server tool and extracting hashes. Determine whether the activity was authorized,
  which AD database files or shadow copies were touched, and whether credential use or lateral movement
  followed.
type: detection
detection_id: a58353df-af43-4753-bad0-cd83ef35eef5
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line match the ntdsutil snapshot/mount or activate-instance pattern this rule detects?
  context: Confirm the alert is a true positive before investing time. The rule fires when the binary is
    ntdsutil.exe AND the command line either combines "snapshot" with "mount " or combines "ac", " i", and
    " ntds". Read the exact command line and the OriginalFileName, and note which branch fired and what snapshot
    GUID or instance was referenced, since that determines whether a shadow copy of the AD volume was actually
    mounted.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run AD database snapshot or instance-activation operations?
  context: ntdsutil snapshot and instance-activation operations are normally run by a domain administrator on a
    domain controller, and require an elevated context. The same activity on a non-DC, or by an account that is
    not a recognized AD administrator or backup operator, is far more likely to be operator activity than routine
    maintenance. Knowing whether the user role and host function are consistent with AD database management is
    often the fastest way to separate authorized work from credential theft.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Was NTDS.dit accessed, and was a shadow copy of the AD volume mounted to read it offline?
  context: ntdsutil snapshot/mount exposes the volume containing ntds.dit and its log files as a read-only copy,
    which is the credential store for the entire domain. Read the full command line to confirm whether a snapshot
    was created, listed, or mounted, and which GUID or index was referenced. A mount of the AD volume is the step
    that makes every domain credential readable offline without stopping the live AD DS service, so confirming it
    determines that the whole domain's account hashes may be exposed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were ntds.dit, its log files, or a mounted shadow-copy path written or copied on this host around the alert?
  context: A snapshot/mount of the AD volume exposes ntds.dit so it can be read or copied off the live database.
    File-creation events touching the NTDS directory, ntds.dit, the EDB log files, or a freshly mounted
    shadow-copy path show whether the database was actually read out rather than just enumerated. Volume Shadow
    Copy creation immediately before these accesses is the temporal pairing that distinguishes a credential dump
    from a benign snapshot listing. If file events are not collected on domain controllers in this environment,
    treat zero results as a visibility gap rather than evidence nothing was copied.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_paths:
        TargetFilename|contains:
          - '\NTDS\'
          - 'ntds.dit'
          - '\HarddiskVolumeShadowCopy'
      condition: selection_host and selection_paths
    fields:
      - TargetFilename
      - Image
      - User
- question: What process spawned ntdsutil.exe, and is that parent chain expected?
  context: The parent reveals how ntdsutil was invoked. Interactive administration from explorer.exe or a console
    launched by an administrator is consistent with manual maintenance; a parent such as a scripting host, a
    remote-execution service, a batch file, or an unexpected automation chain points to scripted or remote
    operator activity. Walk up from the parent to see what launched it and what else it spawned in the same
    session.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did ntdsutil.exe spawn afterward, and was a directory-server or copy tool launched?
  context: Mounting a snapshot only exposes the data; reading it out requires a follow-on step. Watch for
    dsamain.exe exposing the mounted snapshot as a read-only LDAP server, or copy/archive tools moving ntds.dit
    or the mounted volume off the host. Children such as cmd.exe, powershell.exe, or robocopy.exe spawned by
    ntdsutil after a mount indicate the operator proceeded from exposure to extraction.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Which domain accounts may be exposed, and do any have elevated privileges?
  context: A mounted snapshot of ntds.dit exposes the password hashes of every account in the domain, including
    Domain Admins, Enterprise Admins, the krbtgt account, and service accounts. Exposure of krbtgt enables Golden
    Ticket forgery, so this activity should be treated as a potential full-domain credential compromise until
    scoped. Cross-reference the account that ran the tool and the domain's privileged group memberships to decide
    escalation and whether a krbtgt reset is warranted.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: When this host has previously fired this ntdsutil snapshot pattern, what parents and users drove it, and does the current alert fit?
  context: Even legitimate AD maintenance uses ntdsutil. The query mirrors the rule's selection structure scoped
    to this host, so the resulting parent/user distribution reflects how this specific snapshot/activate pattern
    has historically run here — not generic ntdsutil usage. A new parent process, an unexpected user account, or
    an unusual command-line structure is the deviation worth chasing; a recurring administrative or backup pattern
    points to routine work.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \ntdsutil.exe
      - OriginalFileName: ntdsutil.exe
      selection_cli:
      - CommandLine|contains|all:
        - snapshot
        - 'mount '
      - CommandLine|contains|all:
        - ac
        - ' i'
        - ' ntds'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \ntdsutil.exe
      - OriginalFileName: ntdsutil.exe
      selection_cli:
      - CommandLine|contains|all:
        - snapshot
        - 'mount '
      - CommandLine|contains|all:
        - ac
        - ' i'
        - ' ntds'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \ntdsutil.exe
      - OriginalFileName: ntdsutil.exe
      selection_cli:
      - CommandLine|contains|all:
        - snapshot
        - 'mount '
      - CommandLine|contains|all:
        - ac
        - ' i'
        - ' ntds'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around the time of the alert?
  context: Tracking the user's activity across all hosts reveals whether the snapshot operation was an isolated
    administrative action or one step in broader activity. If the same user triggered reconnaissance, credential
    access, or remote execution on other domain controllers or member servers in this window, the scope is larger
    than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \ntdsutil.exe
      - OriginalFileName: ntdsutil.exe
      selection_cli:
      - CommandLine|contains|all:
        - snapshot
        - 'mount '
      - CommandLine|contains|all:
        - ac
        - ' i'
        - ' ntds'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Aggregating process activity around the snapshot operation reveals
    what led to it and what followed — reconnaissance, privilege escalation, directory-server exposure, or staging
    of the extracted database. Novel parent-child pairs standing out at low counts against high-count routine
    noise are what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — reconnaissance, defense tampering, or other credential access —
    may reveal the attack stages that preceded the snapshot operation and help reconstruct the timeline. An
    ntds.dit exposure that follows initial access and privilege escalation on the same domain controller reads
    very differently from one that stands alone.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired this ntdsutil snapshot pattern in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count
    of this snapshot/activate pattern rather than generic ntdsutil usage. Many hosts firing the same pattern points
    to a scripted backup or maintenance process; one host or a small unrelated set points to manual operator
    activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \ntdsutil.exe
      - OriginalFileName: ntdsutil.exe
      selection_cli:
      - CommandLine|contains|all:
        - snapshot
        - 'mount '
      - CommandLine|contains|all:
        - ac
        - ' i'
        - ' ntds'
      condition: all of selection_*
    fields:
    - host.name
