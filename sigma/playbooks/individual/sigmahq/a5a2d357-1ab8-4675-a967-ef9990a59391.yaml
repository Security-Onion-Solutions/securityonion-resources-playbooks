name: LSASS Process Memory Dump Files
id: 05712c73-ea6b-4b92-b7ae-0b70e3ce00ec
description: |
  Detects creation of a file whose name matches one of the well-known LSASS memory-dump artifacts -
  either a fixed name used by public dumping tools (lsass.dmp, PPLBlade.dmp, NotLSASS.zip, nanodump
  output, and similar) or a name that combines an lsass reference with a dump extension. A dump of
  lsass.exe memory is the on-disk product of credential theft: the file can be parsed offline to recover
  cached passwords, NTLM hashes, and Kerberos tickets for every account with a session on the host. These
  names have no legitimate purpose on a normal endpoint, so treat a match as a probable credential dump
  unless an authorized engagement or a sanctioned crash-capture explains it. Investigation should identify
  the process that wrote the file and what launched it, confirm LSASS was the source, assess which accounts
  are exposed, and check for preceding defense tampering and subsequent lateral movement.
type: detection
detection_id: a5a2d357-1ab8-4675-a967-ef9990a59391
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the created file match one of the known LSASS memory-dump name patterns?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a
    created file matches any one of several dump-artifact patterns - EITHER a fixed known name such as
    lsass.dmp, PPLBlade.dmp, NotLSASS.zip, rustive.dmp, or an lsass .rar/.zip archive; OR a name
    containing lsass_2 / lsassdmp / lsassdump; OR a name that contains both an lsass reference and a .dmp
    extension together; OR an SQLDmpr...mdmp; OR a nanodump / proc_ dump. Note which pattern fired and
    review the exact TargetFilename and responsible process - each of these is a name used to hold dumped
    LSASS memory.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to produce an LSASS memory dump file?
  context: >-
    Writing an LSASS memory dump is not part of routine administration on most endpoints. Knowing whether
    the account and host function have any sanctioned reason to capture process memory - a rare, deliberate
    troubleshooting capture or an approved forensic acquisition - is often the fastest way to separate a
    live credential theft from an explained event. User attribution is present on roughly 94% of endpoint
    file events; when it is a machine account or SYSTEM, judge by the writing process and host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What process wrote the dump file, and what launched that process?
  context: >-
    The file event carries no command line, so pivot by ProcessGuid to the writing process to read its
    Image, full command, and parent lineage. Dumpers take many forms - a standalone tool, a signed LOLBIN
    such as rundll32.exe invoking comsvcs.dll MiniDump, task manager, procdump, or code injected into an
    unrelated host process - so the writer may be a trusted binary while the intent is malicious. An Office
    application, script host, or unsigned binary in the parent chain points to the dump being staged
    programmatically rather than by an administrator running a sanctioned capture.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Was LSASS memory the source of this dump, and by what method?
  context: >-
    These filenames hold a minidump of lsass.exe, so the targeted credential store is LSASS memory - which
    holds cached passwords, NTLM hashes, and Kerberos tickets for accounts with sessions on the host.
    Access is typically obtained by opening a full-access handle (0x1F0FFF) to lsass.exe and reading its
    memory, sometimes with direct system calls to evade user-mode hooks. Note a telemetry limit: the
    cross-process handle access and memory read that produced the dump are not captured as events in this
    environment, so the dump file and the writing process are the evidence that the read occurred rather
    than a handle-open record.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What is the writing binary, and does its hash or loaded module have known threat-intel detections?
  context: >-
    The dump file itself carries no hash on the write event, so identify the process that produced it and
    read the hash from its execution record, then check that hash against reputation and threat intel. If
    the writer is a signed system binary such as rundll32.exe or taskmgr.exe, the process hash will look
    clean - the dumping capability is the loaded module or the arguments, so pivot to the modules loaded by
    that process and its command line rather than trusting the process signature.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: Were LSA protection or credential-caching registry settings changed on this host around the dump?
  context: >-
    LSASS dumping is frequently preceded by weakening the protections that limit what the dump yields.
    Setting WDigest UseLogonCredential to 1 forces plaintext credentials back into memory, and clearing the
    RunAsPPL or LsaCfgFlags values disables LSA protection and Credential Guard so an ordinary handle can
    read lsass. A modification of any of these keys near the dump indicates the actor tuned the host for a
    richer credential harvest and raises the severity of what was captured.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|endswith:
          - '\Control\Lsa\RunAsPPL'
          - '\Control\Lsa\LsaCfgFlags'
          - '\SecurityProviders\WDigest\UseLogonCredential'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: Which accounts may be compromised, and do any have elevated privileges?
  context: >-
    An LSASS dump exposes the credentials of every account with a session on the host at the time - the
    logged-on user, accounts running services, and any admin who authenticated recently. The severity
    depends on their privilege: domain admin, enterprise admin, or broad service-account credentials
    require incident escalation and password resets, while a single standard user is a narrower exposure.
    Cross-reference the accounts active on this host against directory group memberships to scope the reset.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after the dump?
  context: >-
    Credential theft is typically followed by lateral movement using the stolen credentials. The query
    returns outbound connections from this host to remote-access ports - 3389 (RDP), 445 (SMB/PsExec),
    5985/5986 (WinRM), 22 (SSH) - in the hours after the dump, with the originating process and user for
    each. Two limits: credentials replayed from another machine will not appear here, so also review
    successful logons for these accounts on suspected targets, and if network telemetry is not collected
    from this host treat zero rows as a visibility gap rather than proof no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Is the dump file still on disk, or was it deleted or renamed after the alert?
  context: >-
    The dump's post-alert lifecycle drives next steps. A dump still on disk can be retrieved to confirm
    which accounts it contains and to hash for correlation; a file deleted or archived shortly after
    creation points to the operator collecting it and cleaning up, which shifts focus to what left the host.
    Several of the matched patterns are already archives (.rar/.zip), so watch for the raw dump being
    compressed and then removed - note where the file landed and whether it was moved, packed, or deleted.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A credential-dumping operation rarely writes just one file - the same process or its children may stage
    additional dumps, output logs, an archive of collected material, or tooling. The breadth, paths, and
    extensions of the writing process's other file activity distinguish a single artifact from a collection
    in progress and enumerate what else needs review and preservation before it is exfiltrated.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other process activity occurred on this host around the time of the dump?
  context: >-
    Credential dumping sits in the middle of an intrusion, so the surrounding process activity often shows
    how the actor arrived and what they did next. Aggregating process creations in a tight window around the
    alert collapses routine agent telemetry into high-count rows while novel parent-child pairs stand out at
    low counts - reconnaissance commands, a script host launching the dumper, or archiving utilities are the
    kind of low-count neighbors that reveal the wider operation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before the dump?
  context: >-
    A credential dump is usually a means to an end, reached after initial access and often after defense
    tampering or reconnaissance. Earlier detections on the same host - execution of scripting tools,
    disabling of protections, or discovery commands - help reconstruct the stages that led here and place
    the dump within the larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- always_include: true
  question: Has this user produced an LSASS dump artifact before, and does that history fit their role?
  context: >-
    The query mirrors the rule's own pattern scoped to this user, so the result is the account's 90-day
    history of writing one of these dump artifacts rather than generic activity. Because the filenames have
    no legitimate use, a history of zero makes this a first-time event and reinforces that it is anomalous;
    any prior occurrences would themselves warrant review. Weigh the result against whether this account has
    any sanctioned reason to run memory-dumping tools.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection_1:
        TargetFilename|endswith:
        - \Andrew.dmp
        - \Coredump.dmp
        - \lsass.dmp
        - \lsass.rar
        - \lsass.zip
        - \NotLSASS.zip
        - \PPLBlade.dmp
        - \rustive.dmp
      selection_2:
        TargetFilename|contains:
        - \lsass_2
        - \lsassdmp
        - \lsassdump
      selection_3:
        TargetFilename|contains|all:
        - \lsass
        - .dmp
      selection_4:
        TargetFilename|contains: SQLDmpr
        TargetFilename|endswith: .mdmp
      selection_5:
        TargetFilename|contains:
        - \nanodump
        - \proc_
        TargetFilename|endswith: .dmp
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program driven an LSASS dump artifact write before on this host or across the environment?
  context: >-
    When the alert fires under a service or machine account, user identity does not attribute the behavior,
    so the meaningful pivot is the launch mechanism. The query mirrors the rule's pattern scoped to the
    alerting program, giving its 90-day history of driving one of these dump-artifact writes,
    aggregated by host. A new or rare program for this pattern is the deviation to chase; a program already
    responsible for many prior events across hosts points to a recurring tool or automation that should
    still be explained given what the artifact is.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection_1:
        TargetFilename|endswith:
        - \Andrew.dmp
        - \Coredump.dmp
        - \lsass.dmp
        - \lsass.rar
        - \lsass.zip
        - \NotLSASS.zip
        - \PPLBlade.dmp
        - \rustive.dmp
      selection_2:
        TargetFilename|contains:
        - \lsass_2
        - \lsassdmp
        - \lsassdump
      selection_3:
        TargetFilename|contains|all:
        - \lsass
        - .dmp
      selection_4:
        TargetFilename|contains: SQLDmpr
        TargetFilename|endswith: .mdmp
      selection_5:
        TargetFilename|contains:
        - \nanodump
        - \proc_
        TargetFilename|endswith: .dmp
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the environment around the time of the dump?
  context: >-
    Tracking the account's activity across all hosts in a tight window reveals whether the credential theft
    is isolated or part of movement across several endpoints. If the same account drove activity on multiple
    hosts around this time, the scope of compromise is larger. When the alert fires under SYSTEM or a machine
    account this view returns agent-telemetry noise - the parent-pattern questions are the meaningful pivot
    in that case.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven dump pattern fire on other hosts in the same window?
  context: >-
    Under a service principal, cross-host user activity is noise, so the meaningful question is whether the
    same launch mechanism produced a dump artifact elsewhere at the same time. The query mirrors the rule's
    pattern scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts in the
    same window points to scheduled or pushed tooling sweeping credentials across the estate; a single host
    points to a host-local operation.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection_1:
        TargetFilename|endswith:
        - \Andrew.dmp
        - \Coredump.dmp
        - \lsass.dmp
        - \lsass.rar
        - \lsass.zip
        - \NotLSASS.zip
        - \PPLBlade.dmp
        - \rustive.dmp
      selection_2:
        TargetFilename|contains:
        - \lsass_2
        - \lsassdmp
        - \lsassdump
      selection_3:
        TargetFilename|contains|all:
        - \lsass
        - .dmp
      selection_4:
        TargetFilename|contains: SQLDmpr
        TargetFilename|endswith: .mdmp
      selection_5:
        TargetFilename|contains:
        - \nanodump
        - \proc_
        TargetFilename|endswith: .dmp
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
