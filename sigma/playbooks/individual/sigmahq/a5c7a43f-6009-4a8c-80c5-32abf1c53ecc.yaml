name: Microsoft Office Protected View Disabled
id: 7af919d7-80ff-4906-a8bf-db3ba22e327d
description: |
  Detects a registry write under the Office security policy path
  (\SOFTWARE\Microsoft\Office\...\Security\ProtectedView\) that weakens the Protected View
  sandbox. Protected View opens documents from the internet, email attachments, unsafe locations,
  and intranet shares in a read-only container that blocks macros and embedded objects. The rule
  fires when EITHER a Disable* value (DisableAttachementsInPV, DisableInternetFilesInPV,
  DisableIntranetCheck, DisableUnsafeLocationsInPV) is set to 1 OR an enable* value
  (enabledatabasefileprotectedview, enableforeigntextfileprotectedview) is set to 0 — both
  directions turn a protection off. Disabling Protected View is a defense-evasion step that removes
  the sandbox before a malicious document is opened, so investigate which setting was changed, which
  process wrote it and what launched that process, whether an Office application subsequently spawned
  a child process, and whether the setting was later restored.
type: detection
detection_id: a5c7a43f-6009-4a8c-80c5-32abf1c53ecc
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting registry write disable a Microsoft Office Protected View setting?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a
    value under \SOFTWARE\Microsoft\Office\...\Security\ProtectedView\ is written that weakens the
    sandbox, matching EITHER of two branches: a DisableAttachementsInPV, DisableInternetFilesInPV,
    DisableIntranetCheck, or DisableUnsafeLocationsInPV value set to DWORD 0x00000001, OR an
    enabledatabasefileprotectedview or enableforeigntextfileprotectedview value set to DWORD
    0x00000000. Both directions turn a protection off. Review the exact TargetObject and Details on
    the triggering event and note which branch fired, because the setting name determines which
    document class now opens outside the sandbox.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify Office Protected View policy keys?
  context: >-
    Protected View policy is normally managed by administrators or group policy, not toggled
    interactively by end users during routine work. Knowing whether the writing account and host
    function match a sanctioned configuration change is the fastest way to separate an approved policy
    edit or red-team test from an evasion step staged ahead of a malicious document. User attribution
    is present on roughly 94% of endpoint registry events; when it is a machine account or missing,
    pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which Protected View setting was modified, and why is this key a defense-evasion location?
  context: >-
    The ProtectedView subkey under the Office security policy controls whether documents from the
    internet, email attachments, unsafe locations, or intranet open in a read-only sandbox that blocks
    active content. Setting a Disable* value to 1 or an enable* value to 0 removes that sandbox for the
    corresponding document class, so the next document of that class opens with macros and embedded
    objects able to run. Confirming the exact key and writing process establishes this is a Protected
    View policy edit rather than an unrelated Office setting, and identifies which document class was
    exposed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value was written to the Protected View key, and does it disable the sandbox?
  context: >-
    The Details field holds the DWORD written. For the Disable* value names, 0x00000001 turns the
    protection off; for the enable* value names, 0x00000000 turns it off. Either way the effect is the
    same — the corresponding Protected View check no longer applies and that document class opens
    unsandboxed. Details is present on roughly 79% of registry modifications and should be populated
    for this DWORD. A value that instead re-enables the protection would not have triggered the rule.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What command wrote this Protected View setting, and was a command-line tool used to disable it?
  context: >-
    The registry event carries no command line, so pivot to the writing process to see how the value
    was set. A reg.exe or powershell.exe invocation that writes the ProtectedView value directly,
    launched from a script host or an Office application, points to programmatic tampering rather than
    a user changing a setting through the application interface. The writing process command line also
    confirms which specific setting and value were written.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process wrote the value, and what launched that process?
  context: >-
    The registry event records the writing process by ProcessGuid; pivot to its process_creation
    record to read the Image and parent lineage. An Office application parent such as winword.exe or
    excel.exe, or a script host such as wscript.exe or mshta.exe, indicates a document or macro made
    the change; an unsigned binary or an unexpected parent points to malware. reg.exe or powershell.exe
    launched from explorer.exe is more consistent with a deliberate administrative edit.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - ParentImage
      - ParentCommandLine
- question: After Protected View was disabled, did an Office application spawn a child process on this host?
  context: >-
    Disabling Protected View has one practical purpose — to let the next document run active content
    without the sandbox. The payoff is an Office application (winword.exe, excel.exe, powerpnt.exe,
    outlook.exe) opening a document and spawning a child such as powershell.exe, cmd.exe, wscript.exe,
    mshta.exe, or an arbitrary binary. A child of an Office process shortly after the registry change
    ties the evasion to document-borne execution and is the strongest sign the disable was used.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_office:
        ParentImage|endswith:
          - '\winword.exe'
          - '\excel.exe'
          - '\powerpnt.exe'
          - '\outlook.exe'
          - '\msaccess.exe'
      condition: selection and selection_office
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: What activity occurred on this host after Protected View was disabled?
  context: >-
    Disabling a document protection is preparation, not the objective, so examine what ran in the
    window after the change. Aggregating process activity surfaces novel parent-child pairs at low
    counts against routine high-count telemetry, which is what points to the payload the evasion was
    meant to enable. Correlate any new process activity with file writes and network connections in the
    same window.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Is Protected View currently re-enabled on this host, or is it still disabled?
  context: >-
    The tampering may be temporary or persistent. Confirm the current state of the Protected View
    policy through direct host or endpoint inspection: if it remains disabled, documents in the
    affected class still open outside the sandbox and the setting should be restored before the host is
    returned to service. Registry value deletions are not observable in this telemetry, so current
    state is established by inspecting the live host rather than by a delete event.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: After this write, was the Protected View value restored, or does it stay disabled?
  context: >-
    Registry value deletions are not observable here, so durability is judged from the key's
    re-modification history rather than from a delete event. A later write that restores the protection
    suggests the change was temporary — flipped off to open one document, then reverted to reduce
    suspicion. The value staying in its protection-off state leaves that document class exposed for
    every future open. Compare the Details values written to this key over the following window.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Has this Protected View key been modified before on this host?
  context: >-
    Protected View policy is normally set once by administration or group policy and then left
    unchanged, so a history with no prior writes makes this a first-time change and raises its weight.
    Regular writes of the same value across the window point instead to a management process or a
    repeatedly applied policy. Compare the historical Details values to see whether the protection-off
    state was set before or whether this is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this Protected View setting changed on other hosts in the environment?
  context: >-
    The same change across many hosts suggests a group policy rollout or a mis-scoped administrative
    action; the same change confined to one host suggests targeted evasion ahead of a document
    delivered to that user. Compare the Details values and the writing process across hosts to separate
    a fleet-wide policy from a single hands-on change.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor preparing a host for document execution often makes several changes together — disabling
    other Office macro or content protections, adding Trusted Locations, or editing Defender or
    firewall policy. Clustering the registry writes on this host in a short window reveals the full
    scope of changes and which process made them. The triggering key appears in the results; the signal
    is what else was modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Were other defense-tampering actions performed on this host?
  context: >-
    Actors who weaken one protection often weaken several — clearing event logs, disabling Defender,
    stopping security services, or changing firewall rules alongside the Office setting. Finding
    multiple tampering actions from the same user or parent process in the same window indicates a
    deliberate effort to reduce defenses before follow-on activity rather than an isolated setting edit.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity in a tight window around the change
    surfaces what led up to the registry edit and what ran immediately after it. Novel parent-child
    pairs stand out at low counts against routine high-count telemetry, which points to the tool that
    made the change or the document activity it enabled.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — phishing-document handling, script execution, or other
    defense tampering — may reveal the stages that preceded this change and help reconstruct the
    timeline. Disabling a document protection is usually a means to an end, so prior alerts help place
    this change within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were process-based persistence mechanisms installed on this host in the same window?
  context: >-
    If the disabled protection allowed a malicious document to execute, the follow-on payload commonly
    establishes a foothold. Scheduled tasks, services, registry Run keys, BITS jobs, or WMI
    subscriptions created by schtasks.exe, sc.exe, reg.exe, bitsadmin.exe, or wmic.exe near the change
    indicate the evasion led to persistence rather than being an isolated setting edit.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
