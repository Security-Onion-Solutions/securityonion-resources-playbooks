name: MERCURY APT Activity
id: f7273875-1f06-4402-b574-97bf38b3f954
description: |
  Detects a process_creation command line that contains both the argument string `-exec bypass -w 1 -enc`
  and a fixed base64 substring that decodes from UTF-16LE to `Start-Job -ScriptBlock {(saps ("p` — an
  execution-policy bypass with a hidden window, carrying an encoded payload that immediately wraps a
  Start-Process call inside a background job. Both substrings must be present in the same command line
  for the rule to fire; the encoded fragment is a literal prefix match against the base64 blob, so it
  matches only payloads whose first characters are that exact script text.
  Background jobs launched from an encoded, window-hidden PowerShell command are a common way to detach
  a second process from the alerting shell so the child survives the parent exiting and no console is
  drawn. The same argument combination is also produced by commodity loaders, packaged installers, and
  some management tooling, so the investigation should decode the full payload, identify what the
  Start-Process call actually launches, establish whether this parent and user routinely produce this
  pattern here, and determine what the spawned child did afterward.
type: detection
detection_id: a62298a3-1fe0-422f-9a68-ffbcbc5a123d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Does the alerting command line contain both the `-exec bypass -w 1 -enc` argument string and the
    encoded payload prefix the rule matches?
  context: >-
    The rule requires both substrings in the same command line. Confirm the literal argument string is
    present (execution policy bypass, window style 1, encoded command) and that the base64 blob begins
    with the fixed fragment that decodes to a Start-Job wrapper around a Start-Process call. A command
    line carrying only the bypass arguments, or an encoded blob with a different opening, is not what
    this rule fires on.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run encoded, window-hidden PowerShell that launches background jobs?
  context: >-
    Packaged software installers, endpoint management agents, and developer tooling all emit encoded
    PowerShell with an execution-policy bypass. Knowing whether this host runs such tooling and whether
    this account is the one that normally drives it is usually the fastest way to separate routine
    automation from operator activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this execution part of an authorized penetration test or red team engagement?
  context: >-
    Encoded PowerShell launchers with an execution-policy bypass are standard payload delivery for
    commercial and open-source offensive frameworks used in authorized assessments. Check whether an
    assessment is active on this host or network segment before investing further analysis time; matching
    scope and timing resolves the alert.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: Did PowerShell write any files to disk on this host in the hour after the alert?
  context: >-
    A background job that calls Start-Process usually needs something to run — a dropped script, an
    archive, or a staged binary. Files written by PowerShell in the window after the alert show what the
    payload placed on disk and give a path to pivot on for later execution. Results cover PowerShell file
    activity on this host generally, not only the alerting process, so correlate timestamps against the
    alert.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: What does the base64 payload after `-enc` decode to, and what does the Start-Process call launch?
  context: >-
    The `-enc` argument takes base64-encoded UTF-16LE text. Decode the full blob rather than the matched
    prefix alone — the rule only anchors on the opening `Start-Job -ScriptBlock {(saps ("p` fragment, and
    everything of investigative value follows it. `saps` is the Start-Process alias, so identify the exact
    target it launches, its arguments, and any URL, path, or further encoded layer inside the job body.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Did PowerShell script block logging capture the deobfuscated script content?
  context: >-
    Event ID 4104 records the script text PowerShell actually compiled, including the body of a job's
    script block after the encoding layer is stripped. That is ground truth for what ran and is worth
    reading even when the command line has already been decoded, because a job body can build further
    strings at runtime. Very short script blocks may be filtered by a configured length threshold; if
    4104 events are not collected in this environment, treat zero results as a visibility gap rather than
    evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
  answer_sources:
  - powershell_script_block
- question: Were other PowerShell security controls weakened on this host in the hour before this execution?
  context: >-
    The alerting command line carries its own execution-policy bypass, but the arguments in it do not
    cover AMSI patching, real-time monitoring changes, or an engine downgrade to version 2. Prior events
    matching those patterns in the hour before the alert indicate the environment was prepared before the
    payload ran, which changes how the encoded job body should be read.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: What process launched this PowerShell instance, and is that parent a normal launcher for it?
  context: >-
    The parent explains how the encoded command was delivered. Installers, management agents, and
    scheduled-task hosts are routine launchers of bypassed PowerShell. Office applications, mshta.exe,
    wscript.exe, a browser, or a web-server or application-server process are not, and a parent of that
    kind moves the question from packaging to delivery. Long-running parents can start hours or days
    before the alert, so the lookup window is intentionally wide.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What modules did the alerting PowerShell process load, and were any unsigned or loaded from a user-writable path?
  context: >-
    PowerShell hosts the .NET runtime, so an encoded payload that reflects assemblies into memory leaves
    its trace in module loads rather than in child processes. System.Management.Automation and the core
    framework assemblies are expected on every run; assemblies loaded from a user profile, temp, or
    ProgramData path, or unsigned modules with no recognizable publisher, indicate the job body pulled in
    code beyond the stock engine. If module-load telemetry is not collected on this host, treat zero
    results as a visibility gap.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
  answer_sources:
  - process_creation
  - manual_review
- question: What child processes did the alerting PowerShell process spawn?
  context: >-
    The decoded payload's opening call is a Start-Process invocation inside a background job, so the
    children of the alerting process are the point of the whole command. Identify what was launched, with
    what arguments, and whether the child is itself an interpreter, a downloader, or a binary running
    from a user-writable path. A job launched this way keeps running after the parent shell exits, so the
    window extends well past the alert.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating parent-child pairs around the alert window collapses routine agent telemetry into
    high-count rows and leaves novel pairs standing out at low counts. Look for reconnaissance,
    credential access, or persistence work adjacent to the execution. If the activity falls outside
    normal working or maintenance hours for this host, that narrows the routine-automation explanation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host help place this execution in a sequence — exploitation of a
    public-facing service, defense tampering, or reconnaissance preceding execution all change how a
    detached background job should be read. An isolated alert with no prior detections points toward
    packaging or automation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: >-
    When this host has previously produced the rule's command-line pattern, what parents and users drove
    it, and does the current alert fit that history?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the resulting parent and
    user distribution reflects how this specific command-line pattern has run here before, not generic
    PowerShell usage. A recurring parent and account point to packaged software reproducing the same
    encoded launcher; a new parent or an unexpected account is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - -exec bypass -w 1 -enc
        - UwB0AGEAcgB0AC0ASgBvAGIAIAAtAFMAYwByAGkAcAB0AEIAbABvAGMAawAgAHsAKABzAGEAcABzACAAKAAiAHAA
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's command-line pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is a 90-day
    history of this account producing this exact pattern, aggregated by host. An account that has never
    produced it is a different proposition from one that produces it on a schedule across many hosts.
    Weigh the count against the user's role and the tooling they are expected to run.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - -exec bypass -w 1 -enc
        - UwB0AGEAcgB0AC0ASgBvAGIAIAAtAFMAYwByAGkAcAB0AEIAbABvAGMAawAgAHsAKABzAGEAcABzACAAKAAiAHAA
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: >-
    Has this parent process historically driven the rule's command-line pattern, or is the parent new for
    this activity?
  context: >-
    When the alert fires under SYSTEM, a service account, or a computer account, user identity attributes
    nothing. The launch mechanism is the meaningful pivot: this query mirrors the rule's selection
    structure scoped to the alerting parent, giving a 90-day history of that parent producing this
    pattern, aggregated by host. A parent already accounting for a large volume of prior events is
    vendor or operating-system automation; a parent new to this pattern is the deviation.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - -exec bypass -w 1 -enc
        - UwB0AGEAcgB0AC0ASgBvAGIAIAAtAFMAYwByAGkAcAB0AEIAbABvAGMAawAgAHsAKABzAGEAcABzACAAKAAiAHAA
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What else did this user do across the environment around this time?
  context: >-
    Tracking the account's process activity across all hosts in the alert window shows whether the
    execution was isolated or one point in movement between endpoints. The same account producing
    interpreter or remote-execution activity on several hosts in a short window is a different scope than
    a single host. When the alert fires under a service principal this view returns routine agent
    telemetry and the launch-mechanism view is the meaningful one.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did this same parent-driven pattern fire on other hosts in the same window?
  context: >-
    This query mirrors the rule's selection structure scoped to the alerting parent process, fleet-wide,
    across the alert window. Several hosts producing the pattern in the same window points to scheduled
    or pushed automation reaching many endpoints at once; a single host points to a host-local trigger
    and keeps the investigation focused there.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - -exec bypass -w 1 -enc
        - UwB0AGEAcgB0AC0ASgBvAGIAIAAtAFMAYwByAGkAcAB0AEIAbABvAGMAawAgAHsAKABzAGEAcABzACAAKAAiAHAA
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: >-
    Have other hosts produced the rule's command-line pattern in the past week, and does the cross-host
    distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of this exact pattern rather than of PowerShell generally. Because the match includes a fixed
    encoded prefix, a wide host distribution means the identical payload opening is being reproduced
    across the estate — consistent with a packaged product or a pushed script. A single host or a small
    unrelated set points to operator-driven execution.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - -exec bypass -w 1 -enc
        - UwB0AGEAcgB0AC0ASgBvAGIAIAAtAFMAYwByAGkAcAB0AEIAbABvAGMAawAgAHsAKABzAGEAcABzACAAKAAiAHAA
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
