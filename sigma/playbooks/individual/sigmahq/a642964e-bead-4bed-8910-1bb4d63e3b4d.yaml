name: HackTool - Mimikatz Execution
id: 255790b8-1f10-4224-934d-58c62de1ee9a
description: |
  Detects command lines containing well-known Mimikatz arguments — either a tool name (DumpCreds, mimikatz),
  a Mimikatz function name (::skeleton, ::memssp, ::multirdp, and similar), or a Mimikatz module prefix
  (sekurlsa::, lsadump::, kerberos::, dpapi::, crypto::, token::, privilege::, process::, rpc::, vault::).
  The rule fires when ANY one of those three pattern groups appears, so a single matching string is enough.
  Mimikatz and its derivatives dump credentials from LSASS memory, the SAM/SECURITY hives, LSA secrets, cached
  domain credentials, and Active Directory via DCSync, and also forge Kerberos tickets and tamper with
  authentication. Legitimate sightings are almost always authorized penetration tests or red-team exercises;
  outside those, treat it as hands-on credential theft. The investigation should confirm which capability was
  invoked, which credential store was targeted, which accounts may now be exposed, and whether stolen
  credentials were already used for lateral movement.
type: detection
detection_id: a642964e-bead-4bed-8910-1bb4d63e3b4d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line contain a Mimikatz tool name, function name, or module prefix?
  context: >-
    Confirm the alert is a true positive by reading the exact command line. The rule fires when the command
    line contains EITHER a tool name (DumpCreds, mimikatz) OR a Mimikatz function name (for example ::skeleton,
    ::memssp, ::multirdp, ::printnightmare) OR a module prefix (sekurlsa::, lsadump::, kerberos::, dpapi::,
    crypto::, token::, privilege::, process::, rpc::, vault::). Note which of the three branches matched —
    a module prefix points to live credential dumping, a function name points to a specific tampering or
    persistence module, and the bare tool names may also appear in unrelated text. The matched branch patterns
    which downstream questions carry the most weight.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this Mimikatz execution part of an authorized penetration test or red team engagement?
  context: >-
    Mimikatz is a standard tool in authorized security assessments. Before investing investigation time, check
    whether a pentest or red-team exercise is active on this host or network segment. An authorized engagement
    with matching tool usage, operator, and timing resolves the alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run credential-dumping tooling?
  context: >-
    Credential dumping is almost never part of normal user or service activity. Knowing whether the user role
    (security tester, sysadmin) and host function (admin jump box, DC) plausibly involve this tooling is often
    the fastest way to separate an authorized assessment from genuine theft.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which Mimikatz module or capability was invoked?
  context: >-
    Mimikatz is multi-purpose. The module prefix or function name in the command line reveals the capability:
    sekurlsa:: dumps LSASS memory, lsadump:: covers SAM / LSA secrets / cached creds / DCSync, kerberos::
    forges or injects tickets, dpapi:: unprotects DPAPI blobs, token::/privilege:: handle impersonation and
    privilege requests, and function names like ::skeleton (Skeleton Key), ::memssp (malicious SSP), or
    ::multirdp (concurrent RDP) indicate authentication tampering or persistence. The specific module
    determines the scope of compromise and the required response.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which credential stores were targeted by the invoked modules?
  context: >-
    Different Mimikatz modules target different stores, and each implies a different blast radius. sekurlsa::
    targets LSASS memory (interactive and service logon secrets); lsadump::sam / lsadump::secrets / lsadump::cache
    target the local SAM, LSA secrets, and cached domain credentials; lsadump::dcsync replicates domain account
    hashes from a DC (krbtgt replication enables Golden Tickets); vault:: targets the Windows Vault. Identify
    every store named in the command line to determine which accounts may be compromised and what remediation
    is needed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did the process running Mimikatz, or a process it spawned, write a file to this host around the time of the alert?
  context: >-
    Elastic Defend has no cross-process handle telemetry, so the sekurlsa:: in-memory LSASS read the
    original question targeted cannot be confirmed directly on this platform; a zero-row result is a
    visibility gap, not proof nothing was read. Re-anchoring on the Mimikatz process and its children for
    any file write is the closest available substitute, and it is broader than the dedicated hive/dump
    filename check elsewhere in this playbook, since it also catches output written under an unexpected
    name or path.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Were SAM, SYSTEM, or SECURITY hives saved to disk, or memory dump files written, on this host?
  context: >-
    Module-based dumping (lsadump::sam) and offline workflows leave file artifacts: reg save of HKLM\SAM,
    HKLM\SYSTEM, and HKLM\SECURITY (all three are needed to extract hashes offline), or LSASS memory dumps
    written to staging paths such as %TEMP%, C:\Windows\Temp, or C:\Users\Public. The presence of these files
    — especially all three hives together or a .dmp alongside the alert — confirms credential-theft intent and
    identifies what was staged for exfiltration.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_hives:
        TargetFilename|endswith:
          - '\SAM'
          - '\SYSTEM'
          - '\SECURITY'
          - '.save'
          - '.hive'
      selection_dumps:
        TargetFilename|contains:
          - '.dmp'
          - 'lsass'
      condition: selection and (selection_hives or selection_dumps)
    fields:
      - TargetFilename
      - Image
- question: Did directory replication (DCSync) activity occur from an account or host that is not a domain controller?
  context: >-
    The lsadump::dcsync module abuses the directory replication service to pull account hashes from a DC
    without touching LSASS. Legitimate replication comes only from domain controllers and from accounts that
    hold replication rights, so a replication request sourced from a workstation or a normal user account is
    the anomaly. Tune the expected accounts to those that legitimately replicate. If directory-service auditing
    is not collected, treat zero results as a visibility gap rather than evidence DCSync did not happen.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 4662
        Properties|contains:
          - '1131f6aa-9c07-11d1-f79f-00c04fc2dcd2'
          - '1131f6ad-9c07-11d1-f79f-00c04fc2dcd2'
          - '89e95b76-444d-4c62-991a-0facbeda640c'
      condition: selection
    fields:
      - SubjectUserName
      - SubjectLogonId
      - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_tools_name:
        CommandLine|contains:
        - DumpCreds
        - mimikatz
      selection_function_names:
        CommandLine|contains:
        - ::aadcookie
        - ::detours
        - ::memssp
        - ::mflt
        - ::ncroutemon
        - ::ngcsign
        - ::printnightmare
        - ::skeleton
        - ::preshutdown
        - ::mstsc
        - ::multirdp
      selection_module_names:
        CommandLine|contains:
        - 'rpc::'
        - 'token::'
        - 'crypto::'
        - 'dpapi::'
        - 'sekurlsa::'
        - 'kerberos::'
        - 'lsadump::'
        - 'privilege::'
        - 'process::'
        - 'vault::'
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_tools_name:
        CommandLine|contains:
        - DumpCreds
        - mimikatz
      selection_function_names:
        CommandLine|contains:
        - ::aadcookie
        - ::detours
        - ::memssp
        - ::mflt
        - ::ncroutemon
        - ::ngcsign
        - ::printnightmare
        - ::skeleton
        - ::preshutdown
        - ::mstsc
        - ::multirdp
      selection_module_names:
        CommandLine|contains:
        - 'rpc::'
        - 'token::'
        - 'crypto::'
        - 'dpapi::'
        - 'sekurlsa::'
        - 'kerberos::'
        - 'lsadump::'
        - 'privilege::'
        - 'process::'
        - 'vault::'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around the time of this alert?
  context: >-
    Tracking the user's activity across all hosts in the alert window reveals lateral movement or staging on
    other endpoints. If the same user triggered process activity on multiple hosts, the scope of compromise
    may be larger than the alerting host. If the alert fired under a service or machine account, this pivot
    returns agent-telemetry noise — read the parent+binary cross-host view instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_tools_name:
        CommandLine|contains:
        - DumpCreds
        - mimikatz
      selection_function_names:
        CommandLine|contains:
        - ::aadcookie
        - ::detours
        - ::memssp
        - ::mflt
        - ::ncroutemon
        - ::ngcsign
        - ::printnightmare
        - ::skeleton
        - ::preshutdown
        - ::mstsc
        - ::multirdp
      selection_module_names:
        CommandLine|contains:
        - 'rpc::'
        - 'token::'
        - 'crypto::'
        - 'dpapi::'
        - 'sekurlsa::'
        - 'kerberos::'
        - 'lsadump::'
        - 'privilege::'
        - 'process::'
        - 'vault::'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: When this host has previously fired this Mimikatz pattern, what parents and users normally drive it, and does the current alert fit?
  context: >-
    Even on a host where credential tooling is occasionally legitimate, the parent process and user that drive
    it tend to be consistent. The query mirrors the rule's selection scoped to this host, so the resulting
    parent/user distribution reflects how this specific pattern has historically run here. A new parent
    process, an unexpected user account, or a first-ever appearance is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_tools_name:
        CommandLine|contains:
        - DumpCreds
        - mimikatz
      selection_function_names:
        CommandLine|contains:
        - ::aadcookie
        - ::detours
        - ::memssp
        - ::mflt
        - ::ncroutemon
        - ::ngcsign
        - ::printnightmare
        - ::skeleton
        - ::preshutdown
        - ::mstsc
        - ::multirdp
      selection_module_names:
        CommandLine|contains:
        - 'rpc::'
        - 'token::'
        - 'crypto::'
        - 'dpapi::'
        - 'sekurlsa::'
        - 'kerberos::'
        - 'lsadump::'
        - 'privilege::'
        - 'process::'
        - 'vault::'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Are known Mimikatz file artifacts present on this host after the alert?
  context: >-
    Mimikatz leaves characteristic on-disk artifacts even after the process exits: LSASS dump files (.dmp),
    exported Kerberos tickets (.kirbi), and saved registry hive copies (SAM/SYSTEM/SECURITY .save files).
    Their presence confirms execution and reveals what was staged for offline extraction. Pair this with the
    hive/dump-file question to build the full picture of what was written.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - '.dmp'
          - '.kirbi'
          - '.save'
          - 'lsass'
          - 'mimi'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Which accounts may be compromised, and do any have elevated privileges?
  context: >-
    The severity of this event depends on the privilege level of the exposed accounts. If LSASS was dumped,
    every account with an active logon session on this host is potentially exposed; if DCSync ran, the
    replicated domain accounts (especially Domain Admin, Enterprise Admin, krbtgt, and service accounts) are
    exposed. Cross-reference the affected accounts with directory group memberships — domain admin or krbtgt
    exposure requires incident escalation and credential rotation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Have other hosts fired this Mimikatz pattern in the past week, and does the spread look like automation or isolated activity?
  context: >-
    The query mirrors the rule's selection with no host scope, returning a fleet-wide count of this
    credential-dumping pattern rather than generic binary usage. Many hosts firing the same pattern points to
    scripted deployment or a sanctioned assessment sweep; one host or a small unrelated set points to manual
    operator activity. Use the host distribution to calibrate how broadly to respond.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_tools_name:
        CommandLine|contains:
        - DumpCreds
        - mimikatz
      selection_function_names:
        CommandLine|contains:
        - ::aadcookie
        - ::detours
        - ::memssp
        - ::mflt
        - ::ncroutemon
        - ::ngcsign
        - ::printnightmare
        - ::skeleton
        - ::preshutdown
        - ::mstsc
        - ::multirdp
      selection_module_names:
        CommandLine|contains:
        - 'rpc::'
        - 'token::'
        - 'crypto::'
        - 'dpapi::'
        - 'sekurlsa::'
        - 'kerberos::'
        - 'lsadump::'
        - 'privilege::'
        - 'process::'
        - 'vault::'
      condition: 1 of selection_*
    fields:
    - host.name
