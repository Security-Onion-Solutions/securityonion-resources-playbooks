name: Network Connection Initiated By Eqnedt32.EXE
id: c3f4ba48-dc0f-46df-aee0-1a0661b756f3
description: |
  Detects an outbound network connection initiated by eqnedt32.exe, the Microsoft Office Equation
  Editor. eqnedt32.exe is an out-of-process OLE server that renders equation objects opened from an
  Office document; it has no legitimate reason to touch the network. An outbound connection from it is
  a reliable sign that a crafted document exploited a memory-corruption vulnerability in the Equation
  Editor (the CVE-2017-11882 / CVE-2018-0802 class) and the resulting shellcode is beaconing to, or
  pulling a next stage from, attacker infrastructure. The rule fires whenever the initiating Image ends
  in \eqnedt32.exe. Investigate the destination, which document and Office parent launched the Equation
  Editor, whether the application was unpatched, whether eqnedt32.exe dropped a file or spawned a child
  process, and whether the same pattern appears on other hosts.
type: detection
detection_id: a66bc059-c370-472c-a0d7-f8fd1bf9d583
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Did eqnedt32.exe initiate an outbound network connection, and to what destination and port?
  context: >-
    Confirm the alert before investing time. The rule fires when the process that initiated a network
    connection is the Office Equation Editor (Image ending in \eqnedt32.exe). Review the exact
    destination address, port, and direction on the triggering event. Equation Editor is an OLE
    rendering helper that never connects out in normal use, so an outbound connection from it is the
    exploitation of the Equation Editor manifesting as network activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - Image
- question: Is eqnedt32.exe expected to make outbound network connections on this host?
  context: >-
    The Equation Editor is an out-of-process OLE server used only to render equation objects inside
    Office documents; it has no update, telemetry, or licensing function that would explain a network
    connection. Because the behavior is anomalous for every user and host, the question is less about
    role than about confirming there is no local automation or testing that legitimately drives the
    Equation Editor to the network. Knowing the account and host function still helps distinguish a
    controlled test from a live document exploit.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What Office document opened the Equation Editor that then connected out?
  context: >-
    Equation Editor exploitation begins with a document containing a malicious embedded equation object,
    usually delivered as an email attachment or a downloaded file. eqnedt32.exe is spawned via OLE by the
    hosting Office application, so the parent process and its command line identify the opening
    application and often the document path. Recovering the document enables blocking it at the perimeter
    and searching for other recipients who received the same file.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Is this Office and Equation Editor installation patched against the known Equation Editor RCEs?
  context: >-
    The network connection is the payload of a memory-corruption exploit in eqnedt32.exe. The widely
    weaponized Equation Editor flaws are CVE-2017-11882 and CVE-2018-0802; a build predating those fixes
    (or an installation where the standalone eqnedt32.exe component was never patched or removed)
    confirms the exploitation was possible and flags other similarly unpatched hosts as at risk. Patch
    status also separates exploitation of a known CVE from a newer bug.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: Did the same detection fire for other users or hosts?
  context: >-
    A malicious document is rarely sent to a single recipient. Correlating this detection across the
    environment shows whether the same Equation Editor exploitation is firing on other hosts, which
    reveals the breadth of the delivery and identifies additional systems that opened the document and
    may need investigation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the destination eqnedt32.exe connected to?
  context: >-
    Investigate the destination address: passive DNS and resolution history, registration age, TLS
    certificate details, and known threat intelligence. Recently registered domains, self-signed
    certificates, or infrastructure with known bad reputation point to attacker-controlled endpoints and
    a beacon or next-stage download. Endpoint network events rarely carry the resolved hostname, so
    resolve the address by pivoting to the host's DNS lookups (QueryName that maps to this address) to
    recover the domain behind it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - DestinationPort
- question: What child processes did eqnedt32.exe spawn after the connection?
  context: >-
    The Equation Editor legitimately spawns no child processes. After a successful exploit, the shellcode
    commonly launches a post-exploitation process directly from eqnedt32.exe. Any child here is
    significant, and known launchers such as powershell.exe, cmd.exe, wscript.exe, mshta.exe,
    rundll32.exe, regsvr32.exe, msiexec.exe, curl.exe, or an arbitrary dropped binary are the payload
    executing. Listing every child of eqnedt32.exe on this host is deliberately broad because narrowing
    to a fixed launcher list would hide a novel one.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did eqnedt32.exe write any files to disk?
  context: >-
    Equation Editor writes no files in normal operation, so a file created by eqnedt32.exe is the exploit
    dropping a next stage to disk. Payloads land most often in user-writable locations - the Downloads
    folder, %TEMP%, %APPDATA%, OneDrive-synced directories, or Office startup folders - and a dropped
    path becomes a lead for the executing process and its hash on the later execution event. The query
    lists every file written by eqnedt32.exe on this host rather than filtering to specific directories,
    since any write by this process is abnormal.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - User
- question: Has this host communicated with this destination before?
  context: >-
    A first-time connection to the destination is more suspicious than routine traffic. A history with no
    prior connections marks the destination as new infrastructure for this host and raises the weight of
    the alert, while an established history points to a known service - although any connection reaching
    it through the Equation Editor process remains anomalous regardless of the destination's history.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
- question: Does this host normally run the Equation Editor at all?
  context: >-
    Equation Editor only launches when a user opens a document containing an embedded equation object. A
    host with no history of running eqnedt32.exe makes even the process launch unusual and suggests the
    document was crafted to invoke the component. Low historical counts grouped by user show how rarely
    equation objects are opened here, which frames how out of place this activity is.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously shown eqnedt32.exe network connections, what programs and users drove them?
  context: >-
    The query mirrors the rule's pattern - network connections initiated by eqnedt32.exe - scoped to this
    host over the recent past. Because the Equation Editor should never connect out, any prior firings
    are themselves noteworthy: a recurring user account behind the connections points to a repeatedly
    opened malicious document or a persistent lure, while an empty result confirms this is the first time
    the pattern has appeared here. Connection events carry no parent lineage - pivot to eqnedt32.exe's
    process-creation event to see what document host launched it.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        Image|endswith: \eqnedt32.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Exploitation rarely happens in isolation. Aggregating process activity in a tight window around the
    alert surfaces what led up to the document being opened and what ran immediately after the connection.
    Novel parent-child pairs stand out at low counts against high-count routine telemetry, which is what
    points to the delivery of the document and any hands-on-keyboard or automated follow-on once the
    payload executed.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - phishing indicators, suspicious Office child processes, or
    reconnaissance - may reveal the stages that preceded this connection and help reconstruct the
    timeline. Client-side exploitation is typically an early foothold, so prior and subsequent alerts
    place this event within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts shown eqnedt32.exe network connections in the past week, and does the distribution look like a campaign or a single target?
  context: >-
    The query mirrors the rule's pattern with no host scope, giving a fleet-wide count of eqnedt32.exe
    network connections. Many hosts firing the same pattern points to a malicious document distributed
    across the environment; one host or a small unrelated set points to a targeted or single-recipient
    delivery. Use the host distribution to calibrate severity and scope the response.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        Image|endswith: \eqnedt32.exe
      condition: selection
    fields:
    - host.name
