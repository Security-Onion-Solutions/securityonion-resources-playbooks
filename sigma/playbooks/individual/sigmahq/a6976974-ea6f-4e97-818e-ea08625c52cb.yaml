name: Potential RipZip Attack on Startup Folder
id: b418842d-bbac-422f-ad0f-659b47d85cc0
description: |
  Detects explorer.exe writing a shortcut into a user's Startup folder whose file name carries the
  folder-shortcut class marker {0AFACED1-E828-11D1-9187-B532F1E9575D}. This pattern is consistent with
  a crafted archive that, when extracted through Windows Explorer, drops a malicious .lnk into the
  Startup folder so a referenced backdoor launches automatically at the next logon - a boot-or-logon
  autostart persistence technique. The rule fires only when both the Startup-folder path and the
  folder-shortcut marker are present in a file written by explorer.exe. Legitimate software rarely
  installs autostart shortcuts by way of a user extracting an archive, so investigate what archive
  Explorer extracted, where the shortcut points, whether the referenced payload has executed, and
  whether the same host or user shows other autostart persistence.
type: detection
detection_id: a6976974-ea6f-4e97-818e-ea08625c52cb
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Did explorer.exe write a shortcut carrying the folder-shortcut marker into a Startup folder?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires only when
    both conditions hold together: the written file path is under \Microsoft\Windows\Start Menu\Programs\Startup
    AND the file name contains the folder-shortcut class marker .lnk.{0AFACED1-E828-11D1-9187-B532F1E9575D},
    with explorer.exe as the writing process. Review the exact TargetFilename and responsible process on the
    triggering event to confirm both the Startup-folder location and the marker are present.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to have a Startup shortcut created by extracting an archive?
  context: >-
    Legitimate autostart shortcuts are normally installed by software installers, not by a user extracting
    an archive through Explorer. Knowing whether the account and host function are consistent with someone
    receiving and opening an archived shortcut is often the fastest way to separate a benign user action from
    a delivered payload. User attribution is present on roughly 94% of endpoint file events; when it is a
    machine account or missing, judge by the host role and the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What launched the explorer.exe instance that wrote this shortcut, and is that lineage a genuine interactive session?
  context: >-
    The file event carries no command line or parent for the writing process, so pivot by ProcessGuid to the
    explorer.exe process record to read its parent and command line. A normal interactive shell is launched by
    userinit.exe at logon; an explorer.exe started by an unexpected parent, or running from a non-standard path,
    points to a masquerading writer rather than the real shell extracting an archive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What does the dropped shortcut point to when it runs at logon?
  context: >-
    The investigative value of the shortcut is its target: a .lnk placed in Startup executes its embedded
    command at the next logon, and for this technique it redirects to a backdoor. File-event telemetry records
    the write but not the shortcut's internal target, so retrieve the .lnk from its on-disk path and parse it -
    read the target path, arguments, working directory, and icon location. A target pointing at an interpreter,
    a script, or a binary in a user-writable directory is the payload reference to run down next.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: After this drop, did explorer.exe launch a child process at logon, and what is its hash and reputation?
  context: >-
    A Startup shortcut is executed by explorer.exe when the user next logs on, so the referenced payload appears
    as an explorer.exe child. File writes carry no hash, but the execution event does - list explorer.exe children
    on this host after the drop and read their Image path and hash, then submit that hash to threat intelligence
    to judge whether the launched binary is known malicious, benign, or previously unseen. If the payload has not
    yet run, retrieve the target named by the shortcut from disk and hash it manually.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\explorer.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - Hashes
- question: What other files did the writing process create or delete around the alert?
  context: >-
    An archive extraction usually lands more than one file - the malicious shortcut plus the payload it points to,
    or an entire unpacked folder. Listing the writing process's other file activity in a tight window shows what
    else the extraction produced and where those files landed, which distinguishes a single stray shortcut from a
    full payload drop and enumerates the additional artifacts that need review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to this Startup folder recently, and by which processes?
  context: >-
    The Startup folder is an autostart location that only a small set of processes should ever write to, and
    normally through installers rather than Explorer extractions. Other recent arrivals in the same folder reveal
    whether this is an isolated drop or a location under active use, and which other shortcuts or files belong to
    the same activity. A single unfamiliar writer placing files here is the signal.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\Microsoft\Windows\Start Menu\Programs\Startup\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Is the dropped shortcut still on disk, or was it deleted or renamed after the alert?
  context: >-
    The shortcut's post-alert lifecycle drives next steps. A shortcut still in the Startup folder can be retrieved,
    parsed for its target, and preserved as evidence; a shortcut deleted or renamed shortly after creation points to
    cleanup or a self-removing dropper and shifts the focus to what executed in between. Compare the file operations
    on this path over the following window.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has this shortcut been written to this host before, or is this its first appearance?
  context: >-
    A file that has never been seen on a host is more suspicious than one that recurs as part of normal operations.
    A Startup shortcut with this name and marker appearing for the first time is consistent with a fresh delivery;
    a history of the same file being written points instead to a repeatedly run tool or a recurring management action.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: When this host has produced this Startup-shortcut drop before, what programs and users drove it, and does the current alert fit that history?
  context: >-
    Even a benign-looking write can be abused. This query mirrors the rule's selection scoped to
    this host, so the resulting program and user distribution reflects how this specific
    Startup- shortcut drop has historically occurred here - not generic Explorer activity. A new
    acting program process, an unexpected user account, or a first-time occurrence is the
    deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains|all:
        - \Microsoft\Windows\Start Menu\Programs\Startup
        - .lnk.{0AFACED1-E828-11D1-9187-B532F1E9575D}
        Image|endswith: \explorer.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- always_include: true
  question: Has this user produced this Startup-shortcut drop before, and does that history fit their role?
  context: >-
    This query mirrors the rule's selection scoped to this user, so the result is the user's 90-day history of this
    specific Startup-shortcut drop, aggregated by host - not generic use of Explorer. A user who has never produced
    this drop is more suspicious than one who does so regularly; weigh the count against the user's role and whether
    they routinely extract archives that place items in Startup.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains|all:
        - \Microsoft\Windows\Start Menu\Programs\Startup
        - .lnk.{0AFACED1-E828-11D1-9187-B532F1E9575D}
        Image|endswith: \explorer.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this Startup-shortcut drop, or is the program new for this activity?
  context: >-
    When the alert fires under a service or machine account, user identity does not attribute the behavior, so the
    meaningful pivot is the launch mechanism. This query mirrors the rule's selection scoped to the alerting program, giving the 90-day history of that program driving this specific drop. A new or rare program for this
    activity is the deviation to chase; a program that already accounts for many prior events is vendor or OS
    automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains|all:
        - \Microsoft\Windows\Start Menu\Programs\Startup
        - .lnk.{0AFACED1-E828-11D1-9187-B532F1E9575D}
        Image|endswith: \explorer.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the environment around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether the same account triggered related activity on
    other endpoints. If the user who received this drop was active on multiple hosts in the same window, the scope
    of the incident may be broader than a single machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven drop fire on other hosts in the same window, or is it isolated to this host?
  context: >-
    Under a service or machine account, asking what else the user did returns agent-telemetry noise, so the meaningful
    question is whether the same launch mechanism fired elsewhere. This query mirrors the rule's selection scoped to
    the alerting program, fleet-wide, in the alert window. Multiple hosts in the same window point to pushed or
    scheduled automation; a single host points to a host-local trigger such as one user opening an archive.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains|all:
        - \Microsoft\Windows\Start Menu\Programs\Startup
        - .lnk.{0AFACED1-E828-11D1-9187-B532F1E9575D}
        Image|endswith: \explorer.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Have other hosts produced this Startup-shortcut drop in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    This query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this specific
    Startup-shortcut drop rather than generic Explorer usage. Many hosts producing the same drop points to a scripted
    deployment or a mis-scoped tool; one host or a small unrelated set points to a delivered payload opened by an
    individual user. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains|all:
        - \Microsoft\Windows\Start Menu\Programs\Startup
        - .lnk.{0AFACED1-E828-11D1-9187-B532F1E9575D}
        Image|endswith: \explorer.exe
      condition: selection
    fields:
    - host.name
- question: Does the user recall receiving or extracting an archive that placed a shortcut in their Startup folder?
  context: >-
    This technique depends on a user extracting a crafted archive through Explorer, so direct confirmation from the
    account owner is a fast way to resolve the alert. If the user recently unpacked a downloaded or emailed archive,
    that identifies the delivery vector and the archive to collect; if they recall no such action, the drop may have
    been produced by automated malware and the investigation should continue into the writing process and the
    shortcut's target.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were registry Run or RunOnce autostart entries also created on this host around the same time?
  context: >-
    Boot-or-logon autostart persistence spans both the Startup folder detected here and the registry Run/RunOnce keys.
    An actor who plants a Startup shortcut frequently stacks a registry autostart as a backup, so checking for Run or
    RunOnce writes in the same window shows whether the persistence is layered across mechanisms and surfaces the
    process and payload behind any additional entry.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - \CurrentVersion\Run
          - \CurrentVersion\RunOnce
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Were files dropped to other autostart locations (additional Startup folders, scheduled-task definitions) on this host?
  context: >-
    File-based persistence bypasses command-line detection entirely - dropping an executable or script into a Startup
    folder or a path referenced by a registry Run key achieves persistence without invoking scheduling tools. Beyond
    the shortcut this rule detected, other file drops to autostart locations near the alert indicate the actor
    established parallel persistence on disk.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
