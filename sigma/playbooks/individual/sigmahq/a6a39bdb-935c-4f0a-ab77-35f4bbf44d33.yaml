name: Potentially Suspicious Powershell Script Execution From Temp Folder
id: 342b291b-57a3-482d-a0d2-649c20c03742
description: |
  Detects powershell.exe or pwsh.exe running with a command line that references a temporary
  directory (\Windows\Temp, %TEMP%, %TMP%, %LocalAppData%\Temp, the per-user AppData Local/Roaming
  Temp paths, or Temporary Internet Files), while excluding several known-benign patterns such as
  VS Code elevation, Amazon EC2 system-profile scripts, output-redirection cmdlets, and Chocolatey
  installer invocations from msiexec. Temporary directories are a common staging location for
  downloaded or dropped scripts because they are user-writable and routinely cleaned, so running a
  script from there can be legitimate (installers, IT automation, build tooling) or can be a loader
  staging a payload before execution. Investigation should confirm what the script does, how
  PowerShell was invoked and by what parent, whether security controls were weakened first, and
  whether this firing pattern is routine for the host, user, and fleet.
type: detection
detection_id: a6a39bdb-935c-4f0a-ab77-35f4bbf44d33
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the PowerShell command line reference a temporary directory the way this rule detects?
  context: Confirm the alert is a true positive before investing investigation time. The rule fires
    when powershell.exe or pwsh.exe runs with a command line containing a temp path such as
    \Windows\Temp, %TEMP%, %TMP%, %LocalAppData%\Temp, or the AppData Local/Roaming Temp folders,
    and none of the benign exclusions (VS Code elevation, EC2 system-profile scripts, output
    redirection, Chocolatey installer) apply. Read the exact command line and resolve which temp
    path matched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to run PowerShell scripts from a temporary directory?
  context: Legitimate installers, IT automation, and build tooling routinely execute scripts from
    temp paths, so the user role and host function often settle disposition fastest. A
    general-purpose workstation owned by a developer or admin running build steps from %TEMP% reads
    very differently from a server or a non-technical user's endpoint where script execution from a
    temporary folder has no routine explanation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Was the command encoded or obfuscated? What does it decode to?
  context: Attackers frequently use PowerShell's -EncodedCommand (-enc) parameter or string
    concatenation, backtick escaping, and variable substitution to hide what the script does.
    Base64-encoded commands are the most common form. Decode the command line and identify the
    payload — a download cradle (IEX(IWR(...)), Net.WebClient.DownloadString), an in-memory .NET
    assembly load, or a reverse shell. Resolve any source URL and what gets fetched or executed,
    and check where the temp-folder script came from.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What did PowerShell do across this host in the surrounding window, beyond the single triggering invocation?
  context: The triggering event shows one command line, but a temp-staged script often runs as part
    of a short sequence of PowerShell invocations that together form one operation — a bootstrap
    that dot-sources a dropped .ps1, a download step, then execution. This query returns every
    powershell.exe / pwsh.exe execution on the host within the window so the full operation is
    visible, not just the one event the rule matched. Decode each command line's flags, file paths,
    and any encoded content.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Did PowerShell script block logging capture the full script content?
  context: Event ID 4104 (script block logging) records the deobfuscated script content PowerShell
    actually executed, even when the command line is encoded or the real logic lives in a dropped
    .ps1 referenced only by path. This is ground truth about what ran from the temp folder. If
    PowerShell operational logs are not ingested in this environment, treat zero results as a
    visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell security controls bypassed or weakened before this execution?
  context: Attackers often disable or bypass PowerShell security controls before running a payload.
    Common techniques include AMSI bypass (patching amsi.dll in memory), execution policy changes
    (Set-ExecutionPolicy or -ep bypass), constrained language mode escape, and downgrade attacks
    (powershell.exe -Version 2, which lacks logging). Finding these precursor events on the host
    strengthens the case that the temp-folder script is malicious.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: What process spawned this PowerShell instance and is that parent chain expected?
  context: The parent process reveals how PowerShell was invoked. Legitimate temp-folder script runs
    usually have predictable parents — explorer.exe for interactive use, an installer or msiexec for
    setup, a scheduler or automation agent. Unusual parents like office applications, mshta.exe,
    wscript.exe, or a browser point to a macro or a downloaded loader launching the script.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even routine temp-folder PowerShell can be abused. The query mirrors the rule's selection
    structure scoped to this host — the resulting parent/user distribution reflects how this
    specific firing pattern has historically run here, not generic PowerShell usage. A new parent
    process, an unexpected user account, or an unusual command-line structure against that history is the
    anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        CommandLine|contains:
        - \Windows\Temp
        - \Temporary Internet
        - \AppData\Local\Temp
        - \AppData\Roaming\Temp
        - '%TEMP%'
        - '%TMP%'
        - '%LocalAppData%\Temp'
      filter_optional_vscode:
        CommandLine|contains: -WindowStyle hidden -Verb runAs
      filter_optional_amazon_ec2:
        CommandLine|contains: \Windows\system32\config\systemprofile\AppData\Local\Temp\Amazon\EC2-Windows\
      filter_optional_generic:
        CommandLine|contains:
        - ' >'
        - Out-File
        - ConvertTo-Json
      filter_optional_chocolatey_installer:
        ParentImage:
        - C:\Windows\System32\Msiexec.exe
        - C:\Windows\SysWOW64\Msiexec.exe
        Image|endswith: \powershell.exe
        CommandLine|contains|all:
        - -NoProfile -ExecutionPolicy Bypass -Command
        - AppData\Local\Temp\
        - Install-Chocolatey.ps1
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_optional_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did this PowerShell instance spawn afterward?
  context: The processes a script spawns reveal its actual impact. A benign installer script may
    spawn nothing or only expected setup helpers; a loader staged from temp often spawns cmd.exe,
    additional powershell.exe instances, certutil.exe, or network-facing binaries for the next
    stage. Unexpected children point toward post-exploitation rather than routine automation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        CommandLine|contains:
        - \Windows\Temp
        - \Temporary Internet
        - \AppData\Local\Temp
        - \AppData\Roaming\Temp
        - '%TEMP%'
        - '%TMP%'
        - '%LocalAppData%\Temp'
      filter_optional_vscode:
        CommandLine|contains: -WindowStyle hidden -Verb runAs
      filter_optional_amazon_ec2:
        CommandLine|contains: \Windows\system32\config\systemprofile\AppData\Local\Temp\Amazon\EC2-Windows\
      filter_optional_generic:
        CommandLine|contains:
        - ' >'
        - Out-File
        - ConvertTo-Json
      filter_optional_chocolatey_installer:
        ParentImage:
        - C:\Windows\System32\Msiexec.exe
        - C:\Windows\SysWOW64\Msiexec.exe
        Image|endswith: \powershell.exe
        CommandLine|contains|all:
        - -NoProfile -ExecutionPolicy Bypass -Command
        - AppData\Local\Temp\
        - Install-Chocolatey.ps1
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        CommandLine|contains:
        - \Windows\Temp
        - \Temporary Internet
        - \AppData\Local\Temp
        - \AppData\Roaming\Temp
        - '%TEMP%'
        - '%TMP%'
        - '%LocalAppData%\Temp'
      filter_optional_vscode:
        CommandLine|contains: -WindowStyle hidden -Verb runAs
      filter_optional_amazon_ec2:
        CommandLine|contains: \Windows\system32\config\systemprofile\AppData\Local\Temp\Amazon\EC2-Windows\
      filter_optional_generic:
        CommandLine|contains:
        - ' >'
        - Out-File
        - ConvertTo-Json
      filter_optional_chocolatey_installer:
        ParentImage:
        - C:\Windows\System32\Msiexec.exe
        - C:\Windows\SysWOW64\Msiexec.exe
        Image|endswith: \powershell.exe
        CommandLine|contains|all:
        - -NoProfile -ExecutionPolicy Bypass -Command
        - AppData\Local\Temp\
        - Install-Chocolatey.ps1
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated
    activity across multiple endpoints. If the same user triggered similar PowerShell or
    temp-staging activity on other hosts in the same window, the scope of compromise may be larger
    than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        CommandLine|contains:
        - \Windows\Temp
        - \Temporary Internet
        - \AppData\Local\Temp
        - \AppData\Roaming\Temp
        - '%TEMP%'
        - '%TMP%'
        - '%LocalAppData%\Temp'
      filter_optional_vscode:
        CommandLine|contains: -WindowStyle hidden -Verb runAs
      filter_optional_amazon_ec2:
        CommandLine|contains: \Windows\system32\config\systemprofile\AppData\Local\Temp\Amazon\EC2-Windows\
      filter_optional_generic:
        CommandLine|contains:
        - ' >'
        - Out-File
        - ConvertTo-Json
      filter_optional_chocolatey_installer:
        ParentImage:
        - C:\Windows\System32\Msiexec.exe
        - C:\Windows\SysWOW64\Msiexec.exe
        Image|endswith: \powershell.exe
        CommandLine|contains|all:
        - -NoProfile -ExecutionPolicy Bypass -Command
        - AppData\Local\Temp\
        - Install-Chocolatey.ps1
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of this firing pattern, not generic PowerShell usage. Many hosts firing the
    same temp-folder pattern points to scripted deployment or vendor automation; one host or a small
    unrelated set points to manual operator activity. Use the host distribution and parent/binary
    consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        CommandLine|contains:
        - \Windows\Temp
        - \Temporary Internet
        - \AppData\Local\Temp
        - \AppData\Roaming\Temp
        - '%TEMP%'
        - '%TMP%'
        - '%LocalAppData%\Temp'
      filter_optional_vscode:
        CommandLine|contains: -WindowStyle hidden -Verb runAs
      filter_optional_amazon_ec2:
        CommandLine|contains: \Windows\system32\config\systemprofile\AppData\Local\Temp\Amazon\EC2-Windows\
      filter_optional_generic:
        CommandLine|contains:
        - ' >'
        - Out-File
        - ConvertTo-Json
      filter_optional_chocolatey_installer:
        ParentImage:
        - C:\Windows\System32\Msiexec.exe
        - C:\Windows\SysWOW64\Msiexec.exe
        Image|endswith: \powershell.exe
        CommandLine|contains|all:
        - -NoProfile -ExecutionPolicy Bypass -Command
        - AppData\Local\Temp\
        - Install-Chocolatey.ps1
      condition: selection and not 1 of filter_optional_*
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals the
    immediate context — what led to the PowerShell run, what happened after, and whether it is part
    of a larger sequence. Aggregating by parent/child process collapses repetitive agent noise into
    high-count rows while novel parent-child pairs stand out at low counts; look there for
    reconnaissance, privilege escalation, or persistence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense
    tampering, reconnaissance, credential access — may reveal the attack stages that preceded this
    event and help reconstruct the full timeline leading up to the temp-folder script execution.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
