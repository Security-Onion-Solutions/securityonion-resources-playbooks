name: RemoteFXvGPUDisablement Abuse Via AtomicTestHarnesses
id: 4799c034-45aa-4e0b-bf18-45e86e27d4b0
description: |
  Detects a command line containing the AtomicTestHarnesses function name
  Invoke-ATHRemoteFXvGPUDisablementCommand (or its truncated prefix). This
  harness drives RemoteFXvGPUDisablement.exe, a signed Windows binary, into
  loading attacker-supplied PowerShell through module load-order hijacking,
  so trusted-binary execution proxies untrusted code. Legitimate appearances
  are almost always red-team or detection-engineering exercises; outside that
  context the string indicates an operator testing or using signed-binary
  proxy execution. Investigation should confirm the exact command, identify
  who and what launched it, decode the payload the harness was pointed at,
  and determine whether the activity is an authorized test or an intrusion.
type: detection
detection_id: a6fc3c46-23b8-4996-9ea2-573f4c4d88c5
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line contain the Invoke-ATHRemoteFXvGPUDisablementCommand harness call this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reading the exact command line on the
    triggering event and checking that it contains the harness function name (Invoke-ATHRemoteFXvGPUDisablementCommand or its
    truncated form Invoke-ATHRemoteFXvGPUDisableme). The rule fires when that string appears anywhere in the command line.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run signed-binary proxy execution test harnesses?
  context: The harness is a detection-engineering and red-team tool. Knowing whether the user role and host function fit that
    activity is often the fastest path to disposition. A purpose-built test host or a security engineer's workstation makes
    an authorized exercise plausible; a general user endpoint or server makes the string far harder to explain.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the full command line of the harness call, and what payload or arguments was it pointed at?
  context: The full command line reveals what the harness was instructed to do. Decode any flags, inline script, file paths,
    or remote locations passed to the function, since RemoteFXvGPUDisablement.exe loads whatever PowerShell the harness stages
    for module load-order hijacking. The arguments distinguish a benign default test invocation from one wired to deliver a
    real follow-on payload.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
        - Invoke-ATHRemoteFXvGPUDisablementCommand
        - Invoke-ATHRemoteFXvGPUDisableme
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Was RemoteFXvGPUDisablement.exe executed on this host, and what command line and working directory did it run with?
  context: The harness abuses the signed binary RemoteFXvGPUDisablement.exe to proxy execution. Confirming the binary actually
    ran, and reading its command line and working directory, shows whether the load-order hijack reached the stage where the
    signed binary loaded the staged module. A working directory under a user-writable or temporary path where the planted
    module would sit is the artifact that ties the harness call to real proxy execution.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
      - User
- question: What process spawned this harness call, and is that parent chain expected?
  context: The parent process reveals how the harness was invoked. An interactive powershell.exe under explorer.exe fits a
    person running a test by hand; parents such as a remote-management agent, a scripting host, an Office application, or a
    scheduled-task host suggest the call was delivered or automated rather than run deliberately.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did this command spawn afterward?
  context: The processes spawned after the harness call reveal its actual impact. A default test typically self-reports and
    exits; spawned cmd.exe, powershell.exe, certutil.exe, or network-capable utilities point to a payload running through the
    proxied execution and warrant tracing the follow-on activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did RemoteFXvGPUDisablement.exe or the launching command make any outbound network connections around the alert time?
  context: Signed-binary proxy execution is frequently used to retrieve or beacon to externally hosted code. An outbound
    connection from the signed binary itself, or from the process that ran the harness, is unusual for a binary that normally
    has no network role and points to payload retrieval or command-and-control rather than a self-contained local test.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: When this host has previously matched this harness pattern, what parents and users normally drove it, and does the current alert fit?
  context: The query mirrors the rule's command-line selection scoped to this host, so the parent and user distribution reflects
    how this specific harness pattern has historically run here rather than generic PowerShell usage. A new parent process,
    an unexpected user account, or a first-ever appearance is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains:
        - Invoke-ATHRemoteFXvGPUDisablementCommand
        - Invoke-ATHRemoteFXvGPUDisableme
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains:
        - Invoke-ATHRemoteFXvGPUDisablementCommand
        - Invoke-ATHRemoteFXvGPUDisableme
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains:
        - Invoke-ATHRemoteFXvGPUDisablementCommand
        - Invoke-ATHRemoteFXvGPUDisableme
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or testing spread across multiple endpoints.
    If the same user triggered similar activity on multiple hosts, the scope of the exercise or the intrusion may be larger
    than the single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains:
        - Invoke-ATHRemoteFXvGPUDisablementCommand
        - Invoke-ATHRemoteFXvGPUDisableme
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Have other hosts matched this harness pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's command-line selection with no host scope, so the result is a fleet-wide count of this
    harness pattern. Many hosts matching the same pattern points to a scripted or scheduled exercise rolled out broadly; one
    host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains:
        - Invoke-ATHRemoteFXvGPUDisablementCommand
        - Invoke-ATHRemoteFXvGPUDisableme
      condition: selection
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to
    this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation,
    persistence, or additional testing tooling.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or
    credential access — may reveal the stages that preceded this event and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
