name: Firewall Rule Update Via Netsh.EXE
id: 05e5039d-9e70-4b9d-9455-ef11a608f10c
description: |
  Detects netsh.exe (or a binary whose OriginalFileName is netsh.exe) running with a command line that contains both
  ' firewall ' and ' set ', the pattern used to change properties of an existing Windows Firewall rule or profile. The
  rule fires only when both conditions match: the image is netsh.exe AND the command line carries both the firewall and
  set tokens. netsh is a Microsoft-signed network-configuration utility that administrators and software installers
  legitimately use to manage firewall policy, but the same set verb can also weaken host protections — opening a port,
  re-enabling a disabled rule group, or loosening a profile to allow inbound access for a payload. Investigation should
  confirm the exact command line and which firewall setting changed, identify what spawned netsh.exe, determine whether
  the change weakened the host, and check whether this user, host, and parent chain routinely manage firewall policy.
type: detection
detection_id: a70dcb37-3bee-453a-99df-d0c683151be6
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line show netsh.exe changing a firewall setting with the firewall and set tokens?
  context: Confirm the alert is a true positive by reviewing the exact command line and process details. The rule fires
    only when the image is netsh.exe (or its OriginalFileName is netsh.exe) AND the command line contains both ' firewall '
    and ' set '. Read the full command to see which firewall context, profile, or rule the set verb targets, and note the
    exact value being changed so downstream questions can follow it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to manage Windows Firewall policy from the command line?
  context: Legitimate firewall changes are normally driven by administrators, configuration-management tooling, or
    software installers on systems where firewall policy is managed locally. Knowing whether the user role and host
    function involve network or endpoint administration is often the fastest path to distinguishing routine policy
    maintenance from an attempt to loosen host protections.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did netsh.exe change? Decode the command line and identify the firewall setting that was set.
  context: The full command line reveals the specific change. Identify the context (advfirewall, firewall, or interface),
    the profile or rule group being modified, and the new value — for example a rule group re-enabled or disabled, a
    profile state flipped, an allowed program added, or logging turned off. Loosening a profile, enabling an inbound rule,
    or disabling firewall logging weakens host protection more than a routine policy tweak. Because firewall management can
    span several sequential netsh invocations, this host-scoped view may show more than the single triggering command.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned netsh.exe and is that parent chain expected?
  context: The parent process reveals how netsh.exe was invoked. Legitimate firewall management is typically launched by a
    command shell an administrator is using, configuration-management agents, or an installer. Parents such as office
    applications, script hosts, mshta.exe, or a remote-access tool suggest the change came from a document, macro, or
    operator activity rather than routine administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did netsh.exe spawn afterward?
  context: The processes spawned after the firewall change reveal the broader activity. Legitimate firewall management
    spawns little or nothing; a firewall change followed by a command shell, a script host, or download or remote-access
    tooling suggests the change was clearing a path for further activity such as inbound access to a payload.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the firewall change reveals the immediate context:
    what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance,
    privilege escalation, persistence installation, or staging of further tooling.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: When this host has previously fired this netsh firewall-set pattern, what parents and users normally drive it,
    and does the current alert fit?
  context: Even routine tools can be abused. The query mirrors the rule's selection structure scoped to this host — the
    resulting parent and user distribution reflects how the rule's specific firing pattern (not generic netsh usage) has
    historically run here. A new parent process, an unexpected user account, or an unusual command-line structure is the
    deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - ' firewall '
        - ' set '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this netsh firewall-set pattern in the past week, and does the cross-host distribution
    look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the
    rule's firing pattern rather than generic netsh usage. Many hosts firing the same pattern points to scripted
    deployment or configuration-management automation; one host or a small unrelated set points to manual operator
    activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - ' firewall '
        - ' set '
      condition: all of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - ' firewall '
        - ' set '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - ' firewall '
        - ' set '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints.
    If the same user triggered similar activity on more than one host, the scope may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - ' firewall '
        - ' set '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — reconnaissance, credential access, or
    other defense-tampering activity — may reveal the stages that preceded this firewall change and help reconstruct the
    full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was netsh.exe executed from its expected System32 or SysWOW64 path?
  context: netsh.exe executed from a non-standard path (outside System32 or SysWOW64) may indicate the binary was copied or
    renamed to evade path-based allowlists. Compare the Image path against OriginalFileName — a file whose OriginalFileName
    is netsh.exe but whose path or name differs from the expected system location points to a relocated or renamed copy.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired the netsh firewall-set pattern over the past 90 days, and what command-line
    patterns are typical?
  context: A LOLBin pattern with no prior history on a host is more suspicious than one used daily under stable parents.
    The query mirrors the rule's selection structure scoped to this host, so the count reflects the rule's specific firing
    pattern rather than generic netsh usage. The command-line projection lets the analyst compare typical invocation
    patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - ' firewall '
        - ' set '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- question: Were any other persistence or defense-tampering LOLBins used on this host recently?
  context: Operators who use one native utility to weaken or reconfigure a host often use several. If netsh.exe changed
    firewall policy, check whether sc, reg, schtasks, wevtutil, bcdedit, vssadmin, or similar binaries were also used to
    alter services, scheduled tasks, logging, or recovery on the same host. Finding multiple persist or tamper LOLBins
    around the same time strengthens the case for hands-on operator activity rather than a one-off policy change.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\sc.exe'
          - '\reg.exe'
          - '\schtasks.exe'
          - '\at.exe'
          - '\wevtutil.exe'
          - '\bcdedit.exe'
          - '\vssadmin.exe'
          - '\diskshadow.exe'
          - '\dnscmd.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
