name: HackTool - RemoteKrbRelay Execution
id: 068c5c24-c0f9-4887-af38-b1be114b4176
description: |
  Detects execution of RemoteKrbRelay, a remote Kerberos relaying framework, by matching either the binary name/OriginalFileName
  or one of several command-line attack-mode signatures. The rule fires when EITHER the image/OriginalFileName matches the
  tool OR any one of its attack-mode flag combinations is present (the required relay trigger flags, an RBCD write, a
  computer/user-object addition, a credential change, group-membership manipulation, or an SMB relay). Legitimate occurrences
  are essentially limited to authorized penetration tests and red-team engagements; outside that context, execution points to
  an attempt to coerce and relay machine-account Kerberos authentication to a domain controller or AD CS for privilege
  escalation. Investigation should confirm which attack mode fired, identify the relay target and victim, and determine whether
  any account manipulation or lateral movement followed.
type: detection
detection_id: a7664b14-75fb-4a50-a223-cb9bc0afbacf
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the alerting process match RemoteKrbRelay either by binary name/OriginalFileName or by one of its attack-mode
    command-line signatures?
  context: The rule fires when at least one of several independent conditions matches — the image ends in RemoteKrbRelay.exe
    or its OriginalFileName is RemoteKrbRelay.exe, OR the required relay flags (-clsid, -target, -victim) are present, OR an
    RBCD signature (-rbcd with -cn/--computername), OR a credential change (-chp with -chpPass/-chpUser), OR group-membership
    manipulation (-addgroupmember with -group/-groupuser), OR an SMB relay (-smb/--smbkeyword with interactive/secrets/service-add).
    Read the full command line and note which branch fired, because that determines which downstream questions carry weight.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run a Kerberos relaying tool?
  context: RemoteKrbRelay is an offensive AD-attack utility with no routine administrative use. Knowing whether the user role
    and host function (for example, a security tester's workstation or a sanctioned testing segment) are consistent with running
    relay tooling is often the fastest way to separate authorized testing from an intrusion.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this RemoteKrbRelay execution part of an authorized penetration test or red team engagement?
  context: RemoteKrbRelay, like Rubeus or Mimikatz, is used in authorized security assessments. Check whether a pentest or red
    team exercise is currently active on this host or network segment. An authorized engagement with matching tool usage and
    timing resolves the alert without further analysis; the absence of one shifts the disposition toward a live intrusion.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which attack mode of RemoteKrbRelay was invoked?
  context: The framework is multi-purpose. The command-line flags reveal which capability ran — -rbcd sets Resource-Based
    Constrained Delegation for an attacker-controlled machine account, -adcs enrolls a machine certificate, -shadowcred writes
    a KeyCredentialLink, -AddComputer/-AddUser create AD objects, -addgroupmember manipulates group membership, -chp changes
    a credential, and -smb relays to SMB. Each mode determines the scope of potential compromise and the required response.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which relay target and victim were specified, and what SPN or service was the relayed authentication aimed at?
  context: The -target value names the system the coerced Kerberos authentication is relayed to (typically a domain controller),
    and -victim names the machine whose authentication is coerced (often an AD CS server). The -clsid flag selects the DCOM
    trigger used to force authentication. Identifying target and victim determines which machine accounts and services may be
    compromised and what remediation is needed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did anomalous Kerberos service-ticket requests appear around this event — bursts of TGS requests, RC4 (etype 0x17)
    tickets, or requests targeting high-privilege service accounts?
  context: Relay and ticket-theft activity correlates with anomalous TGS request patterns in domain authentication logs (Event
    ID 4769). A short burst of service-ticket requests from one account, downgraded RC4 encryption where the environment normally
    uses AES, or requests for SPNs that the account never normally touches are the ticket-side anomalies that confirm the
    Kerberos abuse. If Security channel events are not ingested in this environment, treat zero results as a visibility gap
    rather than evidence nothing happened.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 4769
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetUserName
      - ServiceName
      - TicketEncryptionType
- question: Did the RemoteKrbRelay process, or a child it spawned, write a file to this host around the time of this event?
  context: Elastic Defend has no cross-process handle telemetry, so a direct check for LSASS memory access
    - the original question's intent - cannot be answered here; this query returning nothing is a visibility
    gap, not proof no ticket material was read. RemoteKrbRelay's core technique is a network-level Kerberos
    relay rather than a local memory dump, so this file-write check on the process and its children is a
    weaker, secondary signal - it catches only a helper process shelling out to save relayed material
    locally, and should be weighed alongside the Kerberos ticket-request and network-connection questions
    elsewhere in this playbook.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Which machine or user accounts may be compromised, and do any have elevated or delegation-relevant privileges?
  context: The severity depends on the privilege level of the affected accounts. A relayed machine-account authentication against
    a domain controller, an RBCD write, or a created computer object can yield domain-level impact and requires escalation;
    review the relay target, victim, and any -cn computer name against Active Directory group memberships and delegation
    settings. Service accounts and machine accounts with broad access are frequent targets.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Did the RemoteKrbRelay process write any files to the host during or after execution?
  context: Relay tooling can drop output such as obtained certificates, ticket files, or logs. File creation events from the
    tool's process confirm execution and reveal the scope of activity even after the process has exited. Examine any files
    written under user-writable or temp directories for certificate, ticket, or credential output.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \RemoteKrbRelay.exe
      - OriginalFileName: RemoteKrbRelay.exe
      selection_cli_required:
        CommandLine|contains|all:
        - ' -clsid '
        - ' -target '
        - ' -victim '
      selection_cli_attack_smb:
        CommandLine|contains|all:
        - '-smb '
        - '--smbkeyword '
        CommandLine|contains:
        - interactive
        - secrets
        - service-add
      selection_cli_attack_rbcd_main:
        CommandLine|contains: '-rbcd '
      selection_cli_attack_rbcd_options:
        CommandLine|contains:
        - '-cn '
        - '--computername '
      selection_cli_attack_changepass:
        CommandLine|contains: '-chp '
        CommandLine|contains|all:
        - '-chpPass '
        - '-chpUser '
      selection_cli_attack_addgrpname:
        CommandLine|contains|all:
        - '-addgroupmember '
        - '-group '
        - '-groupuser '
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_img or selection_cli_required or all of selection_cli_attack_rbcd_* or selection_cli_attack_changepass or selection_cli_attack_addgrpname or selection_cli_attack_smb) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \RemoteKrbRelay.exe
      - OriginalFileName: RemoteKrbRelay.exe
      selection_cli_required:
        CommandLine|contains|all:
        - ' -clsid '
        - ' -target '
        - ' -victim '
      selection_cli_attack_smb:
        CommandLine|contains|all:
        - '-smb '
        - '--smbkeyword '
        CommandLine|contains:
        - interactive
        - secrets
        - service-add
      selection_cli_attack_rbcd_main:
        CommandLine|contains: '-rbcd '
      selection_cli_attack_rbcd_options:
        CommandLine|contains:
        - '-cn '
        - '--computername '
      selection_cli_attack_changepass:
        CommandLine|contains: '-chp '
        CommandLine|contains|all:
        - '-chpPass '
        - '-chpUser '
      selection_cli_attack_addgrpname:
        CommandLine|contains|all:
        - '-addgroupmember '
        - '-group '
        - '-groupuser '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_img or selection_cli_required or all of selection_cli_attack_rbcd_* or selection_cli_attack_changepass or selection_cli_attack_addgrpname or selection_cli_attack_smb) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or staged activity across multiple endpoints.
    If the same user triggered relay or other AD-attack activity on multiple hosts, the scope of the operation may be larger
    than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \RemoteKrbRelay.exe
      - OriginalFileName: RemoteKrbRelay.exe
      selection_cli_required:
        CommandLine|contains|all:
        - ' -clsid '
        - ' -target '
        - ' -victim '
      selection_cli_attack_smb:
        CommandLine|contains|all:
        - '-smb '
        - '--smbkeyword '
        CommandLine|contains:
        - interactive
        - secrets
        - service-add
      selection_cli_attack_rbcd_main:
        CommandLine|contains: '-rbcd '
      selection_cli_attack_rbcd_options:
        CommandLine|contains:
        - '-cn '
        - '--computername '
      selection_cli_attack_changepass:
        CommandLine|contains: '-chp '
        CommandLine|contains|all:
        - '-chpPass '
        - '-chpUser '
      selection_cli_attack_addgrpname:
        CommandLine|contains|all:
        - '-addgroupmember '
        - '-group '
        - '-groupuser '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_img or selection_cli_required or all of selection_cli_attack_rbcd_* or selection_cli_attack_changepass or selection_cli_attack_addgrpname or selection_cli_attack_smb) and _pb_scope
    fields:
    - host.name
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and
    does the current alert fit that pattern?
  context: Even tooling used for sanctioned testing has a baseline. The query mirrors the rule's selection structure scoped to
    this host — the resulting parent/user distribution reflects how the rule's specific firing pattern has historically run
    here. A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \RemoteKrbRelay.exe
      - OriginalFileName: RemoteKrbRelay.exe
      selection_cli_required:
        CommandLine|contains|all:
        - ' -clsid '
        - ' -target '
        - ' -victim '
      selection_cli_attack_smb:
        CommandLine|contains|all:
        - '-smb '
        - '--smbkeyword '
        CommandLine|contains:
        - interactive
        - secrets
        - service-add
      selection_cli_attack_rbcd_main:
        CommandLine|contains: '-rbcd '
      selection_cli_attack_rbcd_options:
        CommandLine|contains:
        - '-cn '
        - '--computername '
      selection_cli_attack_changepass:
        CommandLine|contains: '-chp '
        CommandLine|contains|all:
        - '-chpPass '
        - '-chpUser '
      selection_cli_attack_addgrpname:
        CommandLine|contains|all:
        - '-addgroupmember '
        - '-group '
        - '-groupuser '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_img or selection_cli_required or all of selection_cli_attack_rbcd_* or selection_cli_attack_changepass or selection_cli_attack_addgrpname or selection_cli_attack_smb) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent
    automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the rule's
    firing pattern rather than generic binary usage. Many hosts firing the same pattern points to a sanctioned testing rollout
    or automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \RemoteKrbRelay.exe
      - OriginalFileName: RemoteKrbRelay.exe
      selection_cli_required:
        CommandLine|contains|all:
        - ' -clsid '
        - ' -target '
        - ' -victim '
      selection_cli_attack_smb:
        CommandLine|contains|all:
        - '-smb '
        - '--smbkeyword '
        CommandLine|contains:
        - interactive
        - secrets
        - service-add
      selection_cli_attack_rbcd_main:
        CommandLine|contains: '-rbcd '
      selection_cli_attack_rbcd_options:
        CommandLine|contains:
        - '-cn '
        - '--computername '
      selection_cli_attack_changepass:
        CommandLine|contains: '-chp '
        CommandLine|contains|all:
        - '-chpPass '
        - '-chpUser '
      selection_cli_attack_addgrpname:
        CommandLine|contains|all:
        - '-addgroupmember '
        - '-group '
        - '-groupuser '
      condition: selection_img or selection_cli_required or all of selection_cli_attack_rbcd_* or selection_cli_attack_changepass or selection_cli_attack_addgrpname or selection_cli_attack_smb
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — reconnaissance, coercion attempts, defense
    tampering, or other credential access — may reveal the attack stages that preceded the relay and help reconstruct the full
    timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
