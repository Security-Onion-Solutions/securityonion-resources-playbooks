name: Bad Opsec Defaults Sacrificial Processes With Improper Arguments
id: ec5c314f-0242-4067-9589-64b4c1a57fb0
description: |
  Detects a Microsoft-signed binary — WerFault.exe, rundll32.exe, regsvcs.exe, regasm.exe, or regsvr32.exe — launched with a command line that contains nothing but the binary name, i.e. with no arguments. The rule fires when EITHER of these binaries runs argument-free (one of several selection groups), AND the parent is not one of two known browser-installer patterns. Each of these binaries normally requires an argument to do real work (a DLL, an assembly, an entrypoint); running them bare is the default behavior of fork-and-run tooling that spawns a sacrificial process and injects a capability into it without supplying the arguments the binary would normally carry. Investigation should confirm the command line truly has no arguments, identify the parent that launched it, and determine whether the process subsequently made external network connections, loaded an unexpected DLL, or spawned post-exploitation children — the signals that separate an injection host from a benign quirk.
type: detection
detection_id: a7c3d773-caef-227e-a7e7-c2f13c622329
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did one of the signed binaries (WerFault, rundll32, regsvcs, regasm, or regsvr32) run with a command line containing only its own name and no arguments?
  context: Confirm the alert is real before investing time. The rule fires when EITHER WerFault.exe, rundll32.exe, regsvcs.exe, regasm.exe, OR regsvr32.exe runs with a command line equal to just the binary name — no DLL, no assembly, no entrypoint, no flags. Note which binary fired and confirm the command line is genuinely argument-free; these binaries normally require an argument to do useful work, so a bare invocation is the anomaly.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to run argument-free signed binaries like rundll32 or regasm as part of normal operations?
  context: Legitimate software installers and some maintenance routines occasionally invoke these binaries, but an argument-free invocation outside a software-deployment context is unusual on most endpoints. Knowing whether the user role and host function involve installer or developer activity is often the fastest way to separate routine operations from injection.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the full command line of the alerting binary, and is it truly empty of arguments or does it carry hidden parameters?
  context: The full command line confirms whether the binary was launched with nothing but its own name (the fork-and-run default) or whether arguments are present that the alert truncated. Decode any flags, assembly paths, DLL names, or entrypoints. A genuinely argument-free invocation of these binaries does no legitimate work — they exist to load a DLL, register an assembly, or report a fault, none of which happen without arguments.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this binary, and is that parent chain expected for an argument-free invocation?
  context: The parent reveals how the binary was invoked. Fork-and-run tooling spawns the sacrificial binary from whatever process is hosting the implant, so parents like cmd.exe, powershell.exe, or an unrelated user-mode process are notable. Legitimate argument-free invocations are rare and usually trace to installers; the two browser-installer parents the rule already filters are the known benign cases.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_werfault:
        Image|endswith: \WerFault.exe
        CommandLine|endswith: WerFault.exe
      selection_rundll32:
        Image|endswith: \rundll32.exe
        CommandLine|endswith: rundll32.exe
      selection_regsvcs:
        Image|endswith: \regsvcs.exe
        CommandLine|endswith: regsvcs.exe
      selection_regasm:
        Image|endswith: \regasm.exe
        CommandLine|endswith: regasm.exe
      selection_regsvr32:
        Image|endswith: \regsvr32.exe
        CommandLine|endswith: regsvr32.exe
      filter_optional_edge_update:
        ParentImage|contains: \AppData\Local\Microsoft\EdgeUpdate\Install\{
        Image|endswith: \rundll32.exe
        CommandLine|endswith: rundll32.exe
      filter_optional_chromium_installer:
        ParentImage|contains:
        - \AppData\Local\BraveSoftware\Brave-Browser\Application\
        - \AppData\Local\Google\Chrome\Application\
        ParentImage|endswith: \Installer\setup.exe
        ParentCommandLine|contains: '--uninstall '
        Image|endswith: \rundll32.exe
        CommandLine|endswith: rundll32.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_werfault:
        Image|endswith: \WerFault.exe
        CommandLine|endswith: WerFault.exe
      selection_rundll32:
        Image|endswith: \rundll32.exe
        CommandLine|endswith: rundll32.exe
      selection_regsvcs:
        Image|endswith: \regsvcs.exe
        CommandLine|endswith: regsvcs.exe
      selection_regasm:
        Image|endswith: \regasm.exe
        CommandLine|endswith: regasm.exe
      selection_regsvr32:
        Image|endswith: \regsvr32.exe
        CommandLine|endswith: regsvr32.exe
      filter_optional_edge_update:
        ParentImage|contains: \AppData\Local\Microsoft\EdgeUpdate\Install\{
        Image|endswith: \rundll32.exe
        CommandLine|endswith: rundll32.exe
      filter_optional_chromium_installer:
        ParentImage|contains:
        - \AppData\Local\BraveSoftware\Brave-Browser\Application\
        - \AppData\Local\Google\Chrome\Application\
        ParentImage|endswith: \Installer\setup.exe
        ParentCommandLine|contains: '--uninstall '
        Image|endswith: \rundll32.exe
        CommandLine|endswith: rundll32.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar argument-free invocations on multiple hosts, the scope of the operation may be larger than the single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_werfault:
        Image|endswith: \WerFault.exe
        CommandLine|endswith: WerFault.exe
      selection_rundll32:
        Image|endswith: \rundll32.exe
        CommandLine|endswith: rundll32.exe
      selection_regsvcs:
        Image|endswith: \regsvcs.exe
        CommandLine|endswith: regsvcs.exe
      selection_regasm:
        Image|endswith: \regasm.exe
        CommandLine|endswith: regasm.exe
      selection_regsvr32:
        Image|endswith: \regsvr32.exe
        CommandLine|endswith: regsvr32.exe
      filter_optional_edge_update:
        ParentImage|contains: \AppData\Local\Microsoft\EdgeUpdate\Install\{
        Image|endswith: \rundll32.exe
        CommandLine|endswith: rundll32.exe
      filter_optional_chromium_installer:
        ParentImage|contains:
        - \AppData\Local\BraveSoftware\Brave-Browser\Application\
        - \AppData\Local\Google\Chrome\Application\
        ParentImage|endswith: \Installer\setup.exe
        ParentCommandLine|contains: '--uninstall '
        Image|endswith: \rundll32.exe
        CommandLine|endswith: rundll32.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: When this host has previously fired this rule's pattern, what parents and users normally drove it, and does the current alert fit?
  context: Even argument-free invocations can be routine on some hosts (a recurring installer or updater). The query mirrors the rule's selection structure scoped to this host, so the resulting parent/user distribution reflects how this specific firing pattern has historically run here. A new parent process, an unexpected user account, or an unusual launch pattern is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_werfault:
        Image|endswith: \WerFault.exe
        CommandLine|endswith: WerFault.exe
      selection_rundll32:
        Image|endswith: \rundll32.exe
        CommandLine|endswith: rundll32.exe
      selection_regsvcs:
        Image|endswith: \regsvcs.exe
        CommandLine|endswith: regsvcs.exe
      selection_regasm:
        Image|endswith: \regasm.exe
        CommandLine|endswith: regasm.exe
      selection_regsvr32:
        Image|endswith: \regsvr32.exe
        CommandLine|endswith: regsvr32.exe
      filter_optional_edge_update:
        ParentImage|contains: \AppData\Local\Microsoft\EdgeUpdate\Install\{
        Image|endswith: \rundll32.exe
        CommandLine|endswith: rundll32.exe
      filter_optional_chromium_installer:
        ParentImage|contains:
        - \AppData\Local\BraveSoftware\Brave-Browser\Application\
        - \AppData\Local\Google\Chrome\Application\
        ParentImage|endswith: \Installer\setup.exe
        ParentCommandLine|contains: '--uninstall '
        Image|endswith: \rundll32.exe
        CommandLine|endswith: rundll32.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did this binary spawn afterward?
  context: The processes spawned by the binary reveal its actual impact. A genuine argument-free invocation of these binaries spawns nothing meaningful, so child processes — especially cmd.exe, powershell.exe, or other tooling — point to an injected capability executing post-exploitation actions rather than the binary doing its named job.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did this binary make any external network connections shortly after it launched?
  context: A sacrificial process holding an injected capability frequently reaches out to external command-and-control. WerFault, rundll32, regasm, regsvcs, and regsvr32 have no reason to make outbound connections when run argument-free, so an external connection from this process — correlated by ProcessGuid within a few minutes of launch — is a high-value signal that the bare invocation is hosting injected code. Filter out known-good internal infrastructure to surface genuinely external destinations.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
        Initiated: 'true'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: What DLLs or modules did this binary load after it started, and are any unsigned or loaded from a user-writable path?
  context: When these binaries run argument-free as injection targets, the loaded module set is what matters — rundll32 and regsvr32 normally map a specified DLL, regasm and regsvcs load a named assembly, and none of that happens without arguments. An unsigned module, a module loaded from a user-writable directory such as a user profile or temp path, or an unexpected .NET runtime load points to code mapped into the process rather than normal operation.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- question: Did this binary or its parent write any files to disk around the time of the alert, such as a DLL or assembly in a user-writable directory?
  context: Argument-free abuse of these binaries often pairs with a payload staged on disk — a DLL, a .NET assembly, or a script dropped into a user-writable directory such as a user profile, temp, or public path before being loaded or injected. File writes scoped to this host's relevant directories around the alert time help locate the staged payload and tie it to the process.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - Image
      - TargetFilename
      - EventType
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining process activity around the alert reveals what led to this event and what happened after — reconnaissance, privilege escalation, persistence installation, or data staging that provides broader context. Novel parent-child pairs at low counts are what to scan for against the routine high-count agent telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this firing pattern rather than generic usage of the binaries. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_werfault:
        Image|endswith: \WerFault.exe
        CommandLine|endswith: WerFault.exe
      selection_rundll32:
        Image|endswith: \rundll32.exe
        CommandLine|endswith: rundll32.exe
      selection_regsvcs:
        Image|endswith: \regsvcs.exe
        CommandLine|endswith: regsvcs.exe
      selection_regasm:
        Image|endswith: \regasm.exe
        CommandLine|endswith: regasm.exe
      selection_regsvr32:
        Image|endswith: \regsvr32.exe
        CommandLine|endswith: regsvr32.exe
      filter_optional_edge_update:
        ParentImage|contains: \AppData\Local\Microsoft\EdgeUpdate\Install\{
        Image|endswith: \rundll32.exe
        CommandLine|endswith: rundll32.exe
      filter_optional_chromium_installer:
        ParentImage|contains:
        - \AppData\Local\BraveSoftware\Brave-Browser\Application\
        - \AppData\Local\Google\Chrome\Application\
        ParentImage|endswith: \Installer\setup.exe
        ParentCommandLine|contains: '--uninstall '
        Image|endswith: \rundll32.exe
        CommandLine|endswith: rundll32.exe
      condition: 1 of selection_* and not 1 of filter_optional_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the attack stages that preceded an injection host and help reconstruct the timeline. Argument-free sacrificial-process execution is typically a mid-chain action, so prior alerts often carry the story of how the operator got here.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
