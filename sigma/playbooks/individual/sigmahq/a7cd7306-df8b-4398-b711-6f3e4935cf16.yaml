name: Potential CVE-2022-26809 Exploitation Attempt
id: 076eab93-c999-4a38-950b-aa757be87f37
description: |
  Detects any process spawned by the Windows RPC service host - svchost.exe launched with the
  '-k RPCSS' service group - regardless of what the child binary is. CVE-2022-26809 is an
  unauthenticated remote code execution vulnerability in the Windows RPC runtime (rpcrt4.dll)
  that is reachable over the RPC endpoint mapper on TCP 135 and over SMB on TCP 445; code
  delivered through it runs inside the RPC service, so a child process under the RPC service
  host is the downstream consequence the sensor can see, not the exploit attempt itself.
  This is a heuristic and it cannot confirm exploitation: the RPC service host legitimately
  spawns children under normal operation (werfault.exe after a service fault is the documented
  benign case). The investigation should establish what the child process is and what it did,
  whether the host is patched against the CVE, whether inbound RPC or SMB traffic preceded the
  spawn, and whether other hosts produced the same pattern in the same window.
type: detection
detection_id: a7cd7306-df8b-4398-b711-6f3e4935cf16
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the alerting event show a child process spawned by svchost.exe running with the
    '-k RPCSS' service group?
  context: >-
    The rule fires on the parent only - ParentImage exactly C:\Windows\System32\svchost.exe and a
    ParentCommandLine containing '-k RPCSS'. It places no constraint on the child binary, so
    confirming the alert means confirming the parent, and judging the child is left to the analyst.
    A werfault.exe child is the known benign case, recorded in the rule's own false positives.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is a child process under the RPC service host expected for this host's role and this
    account?
  context: >-
    The RPC service runs as SYSTEM, so any process it spawns starts as SYSTEM and the account on
    the alert is a mechanical consequence of that, not an attribution. What matters is whether the
    host's function explains an RPC service child at all - a print server, a fault-reporting
    handler, or a management agent that drives RPC-hosted services can produce one routinely.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this host patched against CVE-2022-26809 in the Windows RPC runtime?
  context: >-
    CVE-2022-26809 has been patched since April 2022, so patch state changes what this alert can
    mean. On a patched host the RPC runtime is not exploitable through this path and the child
    process almost certainly has an ordinary explanation; on an unpatched or long-unrebooted host
    the path is open and the child process needs a full account. Check the installed rpcrt4.dll
    version and the host's update history rather than assuming either outcome.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
  answer_sources:
  - asset_inventory
  - edr_console
- question: What inbound RPC or SMB request could have driven this execution?
  context: >-
    There is no email or document vector here. Exploitation of the RPC runtime is remote and
    unauthenticated, delivered as a crafted RPC call to the endpoint mapper on TCP 135 or over SMB
    on TCP 445, so the delivery vector is a network request from another machine. Check perimeter
    and host firewall logs for inbound 135/445 sessions from sources that have no business reaching
    this host, and note the source address for scoping.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - manual_review
  - edr_console
- question: Have other hosts produced this same RPC service spawn pattern in the last 24 hours?
  context: >-
    A remotely reachable RPC vulnerability can be driven against many hosts from a single source,
    and the same automation that reaches one host usually reaches its neighbours. Several hosts
    producing this pattern inside the same window points to scanning or automated exploitation
    against the environment; a single host points to a host-local cause such as a service fault.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - alert
- question: What exactly did the child process do? Decode its full command line and working
    directory.
  context: >-
    The rule does not constrain the child, so the child's own command line carries most of the
    investigative weight. Read the arguments for what the process was actually asked to do -
    interpreter invocations, encoded content, file paths written or read, host or account
    enumeration. A werfault.exe child carries a process ID and fault parameters and nothing else,
    which is the benign profile; an interpreter or a recon binary with an operational command line
    is not.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What modules did the alerting child process load, and are any of them unsigned or from
    an unexpected path?
  context: >-
    Code that arrives through a service exploit frequently pulls in modules the normal version of
    that process never loads, and a module written to a user-writable or temporary directory does
    not belong in a SYSTEM service child. DLL load events carry the signature and hash fields
    directly, so signer, signature status, and hash can be checked without pivoting to a separate
    execution event.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - process_creation
  - manual_review
- question: What other processes were spawned under svchost.exe on this host in the hours around
    the alert?
  context: >-
    Code running inside a service host tends to launch more than one thing - enumeration, then a
    payload, then a persistence step. The parent scope available here resolves to svchost.exe,
    which hosts most Windows services, so this returns children of every svchost instance on the
    host and not only the RPC service group; read ParentCommandLine on each row to separate the
    '-k RPCSS' children from routine service activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: Was there inbound RPC or SMB traffic to this host around the alert, and did the child
    process make network connections of its own?
  context: >-
    Exploitation arrives over the network, so an inbound session to TCP 135 or TCP 445 shortly
    before the spawn is real corroboration, and its source address is the next thing to scope. The
    second branch covers the other end of the chain - a child process that reaches outward on its
    own is behaving like a payload rather than a fault handler. Absence of inbound sessions from an
    unexpected source weakens the exploitation reading considerably.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection_inbound:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 135
          - 445
      selection_child:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection_inbound or selection_child
    fields:
      - SourceIp
      - DestinationIp
      - DestinationPort
      - Initiated
      - Image
  answer_sources:
  - network_connection
- question: Was a Windows service installed on this host around the time of the alert?
  context: >-
    Execution obtained inside a service host is commonly converted into a service of its own,
    because a service survives reboot and runs as SYSTEM without further work. Security event 4697
    records the service name, the binary path, and the account that installed it. A service whose
    binary sits outside System32 or under a user-writable or temporary directory, or one installed
    by an account that never installs services, is the entry to pursue.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 4697
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - ServiceName
      - ServiceFileName
      - SubjectUserName
  answer_sources:
  - process_creation
  - manual_review
- question: Were any service registry keys created or modified on this host around the alert?
  context: >-
    Service installation and service hijacking both land in the CurrentControlSet Services subtree,
    and a registry write there followed closely by execution is the correlation the service
    execution technique turns on. Look at which service key changed, what binary path or ServiceDll
    value was written, and which process wrote it - a change made by the RPC service child rather
    than by an installer or a management agent is the case that matters.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: \SYSTEM\CurrentControlSet\Services\
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - process_creation
  - manual_review
- question: Has this host run this child binary under svchost.exe before over the last 90 days?
  context: >-
    A child binary that svchost.exe has launched routinely on this host for months is part of how
    the machine works, and volume alone will usually identify it. Zero or a handful of prior
    executions means the pairing is new. The parent scope here resolves to svchost.exe as a whole
    rather than the RPC service group specifically, so a high count establishes the binary is a
    normal service child without proving the RPC service group launched it before.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- always_include: true
  question: Has this account previously produced the rule's RPC service spawn pattern, and does
    that history fit the account?
  context: >-
    The query mirrors the rule's own selection scoped to this account, so the result is the
    account's 90-day history of this specific pattern rather than generic activity, aggregated by
    host. Because the RPC service runs as SYSTEM the account will usually be SYSTEM or a machine
    account, in which case a large count reflects normal service operation across the fleet and
    tells you little; read this alongside the parent-scoped history, which attributes the launch
    mechanism instead of the identity.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage: C:\Windows\System32\svchost.exe
        ParentCommandLine|contains: -k RPCSS
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this parent process historically driven the rule's pattern on this host or across
    the environment, or is the parent new for this activity?
  context: >-
    When the alert fires under SYSTEM, identity does not attribute behaviour and the launch
    mechanism does. The query mirrors the rule's selection scoped to the alerting parent process,
    so the result is the 90-day history of the RPC service host driving this pattern, aggregated by
    host. A parent already accounting for thousands of prior events is OS or vendor automation; a
    parent that has never driven this pattern before is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage: C:\Windows\System32\svchost.exe
        ParentCommandLine|contains: -k RPCSS
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this account do across the environment around this time?
  context: >-
    Tracking the account across all hosts in the alert window shows whether the activity stayed
    local or moved. If the alert fired under SYSTEM, a machine account, or LOCAL/NETWORK SERVICE,
    this returns the ordinary background of every SYSTEM-owned agent in the environment and should
    be read as a wide summary rather than a lead; the parent-scoped fleet view answers the same
    intent without that noise.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same parent-driven pattern fire on other hosts in the same window?
  context: >-
    The query mirrors the rule's selection scoped to the alerting parent process, fleet-wide,
    within the alert window. Because the underlying vulnerability is remotely reachable and
    unauthenticated, one source can drive it against many hosts at once, so multiple hosts here
    points to scanning, automated exploitation, or a pushed automation change rather than a
    host-local trigger. A single host points to something that started on this machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage: C:\Windows\System32\svchost.exe
        ParentCommandLine|contains: -k RPCSS
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating process activity by binary and parent around the alert collapses repetitive agent
    telemetry into single high-count rows and leaves novel parent-child pairs standing out at low
    counts. Look for enumeration, credential access, or persistence steps that started near the
    alert, and for other service hosts spawning children they do not normally spawn.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Remote exploitation of a service is usually preceded by something visible - scanning, an
    authentication burst, or an earlier reachability probe from the same source. Earlier detections
    on this host help reconstruct whether this spawn is the end of a sequence that began off-host,
    or an isolated event with a local explanation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
