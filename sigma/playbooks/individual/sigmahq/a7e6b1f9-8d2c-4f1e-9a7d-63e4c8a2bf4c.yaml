name: Kapeka Backdoor Loaded Via Rundll32.EXE
id: a418e55a-840f-4573-8bad-ff9e2dcec6dd
description: |
  Detects rundll32.exe loading a DLL with a ".wll" extension (a five-to-six-letter base name masquerading
  as a Microsoft Word Add-In) from a :\ProgramData or a user \AppData\Local\ path. This is the load step of
  the Kapeka backdoor: a dropper stages the backdoor DLL on disk and executes it through rundll32.exe as
  system-binary proxy execution, so the malicious code runs inside a signed Microsoft binary rather than a
  standalone process. Legitimate Word add-ins do not run through rundll32 from these paths, so the load
  itself is the signal. Investigate the module's signature and hash, what process wrote it to disk and what
  launched rundll32, whether rundll32 then made outbound connections or spawned children, and how widely the
  same load pattern appears across the environment.
type: detection
detection_id: a7e6b1f9-8d2c-4f1e-9a7d-63e4c8a2bf4c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alert show rundll32.exe loading a .wll module from a ProgramData or user AppData\Local path?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires only when all criteria hold at
    once: the loading process (Image) ends in rundll32.exe, the loaded module (ImageLoaded) sits under
    :\ProgramData or \AppData\Local\, AND its name matches a five-to-six-letter base with a .wll extension.
    Review the exact module path and the loading process on the triggering event. A .wll is a Word add-in
    extension; rundll32 loading one from these staging paths does not occur through normal Office use, so a
    match here is the backdoor load itself. DLL load events carry the module hash and signing status directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Is this user and host expected to have rundll32.exe load a .wll add-in from ProgramData or AppData?
  context: >-
    Legitimate administrative or application activity can trip many detections, but a Word add-in executing
    through rundll32 from a staging path is not a routine operation for any account. Knowing whether the user
    role and host function have any sanctioned reason for this behavior is the fastest way to separate a rare
    but benign case from a live backdoor load. User attribution is present on roughly 94% of endpoint events;
    when it is a machine account or SYSTEM, pivot on the loading process and its parent instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What modules did rundll32.exe load, and are any from ProgramData or AppData, unsigned, or posing as an Office add-in?
  context: >-
    The full set of modules a process maps tells the operator's story when the invocation alone is opaque.
    Look for modules loaded from %ProgramData%, AppData, or other user-writable directories, unsigned modules
    where signed ones are expected, and a system-style or Office-style filename loaded from a non-standard
    path. The .wll base name is randomized to look like a legitimate Word add-in; confirm which path it loaded
    from and whether any additional payload modules accompanied it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
- question: For the loaded .wll module, what is its signing status, hash, and threat-intel reputation?
  context: >-
    Module reputation separates a routine third-party DLL from a staged backdoor. The loader DLL is typically
    unsigned or carries an invalid or untrusted signature despite a Microsoft-add-in-style name, which is a
    strong masquerading indicator. Take the module hash from the load event and check it against threat
    intelligence; a known-bad hash confirms the backdoor, and an unknown hash on an unsigned module from a
    staging path still warrants isolation and deeper analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - SignatureStatus
      - Signed
- question: What was rundll32.exe's full command line, and which module and export or entrypoint did it invoke?
  context: >-
    The load event carries no command line, so pivot by ProcessGuid to the rundll32 process record and read
    its full invocation. The command line shows the exact module path passed to rundll32 and the export or
    ordinal entrypoint it was told to run, which reveals how the backdoor is launched and confirms the .wll
    path seen on the load. An entrypoint or ordinal that runs a DLL from a staging path is the proxy-execution
    mechanism this rule detects.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What launched rundll32.exe, and what document or delivery step led to it?
  context: >-
    The Kapeka loader is dropped and run by an earlier stage, so the parent of rundll32 points back toward the
    delivery. A parent such as an Office application, a script host like wscript.exe or mshta.exe, an archive
    tool, or an unsigned dropper indicates the module was staged and executed programmatically rather than by a
    deliberate administrator action. Read the parent image and its command line, then trace the delivery
    artifact (an opened attachment, a downloaded file, or a script) from the parent to find the entry point.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Was the loaded .wll module written to disk on this host, and by which process?
  context: >-
    rundll32 loads the module but does not create it; a separate dropper writes the .wll to the ProgramData or
    AppData staging path first. Finding the file-write event for this exact module path identifies the dropper
    process and ties the load back to how the backdoor landed on disk. The writing process and its lineage are
    the next pivot for scoping the intrusion, since the dropper often also establishes persistence or stages
    additional payloads.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
- question: Are the module and any files touched by rundll32.exe or its children still on disk for analysis?
  context: >-
    Preserving the backdoor DLL and any follow-on files it writes enables hashing, sandbox submission, and
    content review before cleanup removes them. This correlates file activity to the rundll32 process and its
    direct children by process lineage, surfacing files the backdoor stages after it loads. If the .wll or its
    dropped artifacts are still present, capture them for analysis promptly, since active backdoors commonly
    delete their own components.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did rundll32.exe make outbound network connections after loading the module?
  context: >-
    Kapeka is a command-and-control backdoor, so once the DLL is mapped into rundll32 the process may begin
    beaconing to an operator. Outbound connections from rundll32 to external destinations, especially to raw IP
    addresses or newly seen domains, corroborate that the loaded module is an active backdoor rather than an
    inert file. rundll32 has little legitimate reason to initiate external egress; focus on external
    destinations and note the ports and direction.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: What child processes did rundll32.exe spawn after loading the module?
  context: >-
    The processes a loader spawns reveal its actual impact. An early-stage backdoor commonly launches
    reconnaissance, credential-access, or additional execution tooling such as cmd.exe, powershell.exe, or
    other living-off-the-land binaries once it is running. Legitimate rundll32 usage has predictable, sparse
    children; unexpected child processes shortly after this load point to hands-on-keyboard follow-on activity
    driven through the backdoor.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this .wll module been loaded on this host before, and under which processes?
  context: >-
    A first-time module load is a stronger anomaly than a recurring one. If this exact module path has no load
    history on the host, the current load is new and raises its weight. A history of loads under an unrelated
    set of processes, or under rundll32 with no legitimate add-in tooling installed, points to a planted
    module rather than a sanctioned one. Zero or very low historical counts indicate first or rare execution.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: When this host has previously matched this rule's load pattern, what programs and users drove it, and does the current alert fit?
  context: >-
    Even a rare pattern can have a benign precedent on a given host. This query mirrors the
    rule's selection scoped to this host, so the resulting program and user distribution
    reflects how this specific rundll32 .wll-load pattern has historically run here rather than
    generic rundll32 usage. A new acting program process, an unexpected account, or a first-ever
    occurrence for this pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith: \rundll32.exe
        ImageLoaded|contains:
        - :\ProgramData
        - \AppData\Local\
        ImageLoaded|re: '[a-zA-Z]{5,6}\.wll'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts matched this rule's load pattern in the past week, and does the spread look like deployment or one-off activity?
  context: >-
    This query mirrors the rule's selection with no host scope, giving a fleet-wide count of the exact
    rundll32 .wll-load pattern rather than generic rundll32 usage. Many hosts matching the same pattern points
    to scripted or automated deployment of the loader across the environment; a single host or a small
    unrelated set points to a targeted intrusion. Use the host distribution and parent consistency to
    calibrate scope and severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith: \rundll32.exe
        ImageLoaded|contains:
        - :\ProgramData
        - \AppData\Local\
        ImageLoaded|re: '[a-zA-Z]{5,6}\.wll'
      condition: selection
    fields:
    - host.name
- question: Did this rule fire on other hosts, indicating broader deployment of the loader?
  context: >-
    A loader delivered to one host is rarely delivered to only one. Correlating this same detection across all
    hosts shows how many systems loaded the backdoor and which users were involved, revealing the breadth of
    the operation and identifying additional systems that need containment and investigation. Clustered fires
    across multiple hosts in a short window point to a coordinated push rather than an isolated event.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A backdoor load rarely happens in isolation. Aggregating process activity in a tight window around the
    alert surfaces what led up to the load and what ran immediately after. Novel parent-child pairs stand out
    at low counts against high-count routine telemetry, which is what points to the dropper that staged the
    module and any follow-on tooling executed once the backdoor was running.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host, such as reconnaissance, credential access, or defense tampering, may
    reveal the stages that preceded the backdoor load and help reconstruct the timeline. A loader is usually
    a mid-chain event; prior alerts help place this load within the larger operation and identify the initial
    foothold.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
