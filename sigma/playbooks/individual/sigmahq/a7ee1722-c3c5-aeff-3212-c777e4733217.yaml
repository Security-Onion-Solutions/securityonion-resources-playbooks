name: Disable Windows Defender AV Security Monitoring
id: e9b488b3-7469-4544-a88b-37ceb6276e6f
description: |
  Detects attempts to disable Windows Defender real-time protection, either by running powershell.exe or pwsh.exe with the -DisableBehaviorMonitoring $true or -DisableRuntimeMonitoring $true switches, or by running sc.exe to stop, delete, or set the WinDefend service to disabled. Disabling endpoint protection is a defense-evasion step that typically precedes payload execution, credential access, or impact actions that protection would otherwise block or log. Investigation should confirm which branch fired, identify who and what drove the change, determine whether protection is currently restored, and look for the activity the tampering was meant to enable.
type: detection
detection_id: a7ee1722-c3c5-aeff-3212-c777e4733217
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does this event match the Defender-tampering pattern the rule detects, and which branch fired?
  context: Confirm the alert is a true positive by reviewing the exact command line and binary. The rule fires on either of two distinct branches - powershell.exe or pwsh.exe carrying -DisableBehaviorMonitoring $true or -DisableRuntimeMonitoring $true, or sc.exe carrying WinDefend together with stop, delete, or config plus start=disabled. Note which branch fired, because the downstream questions that carry weight differ - PowerShell-flag tampering points to interactive or scripted operator activity, while the sc.exe service path points to direct service manipulation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to change Windows Defender configuration or stop the WinDefend service?
  context: Legitimate administrative activity can trigger this detection. A small number of older development tool installers were historically known to disable Defender to improve performance, which is not a recommended practice but does occur. Knowing whether the user role and host function include endpoint-protection administration is often the fastest path to distinguishing routine maintenance from operator tampering.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What specific Defender protection or service state was changed by this command?
  context: Decode the full command line to identify the exact change. The PowerShell branch flips behavior or runtime monitoring off; the sc.exe branch stops, deletes, or sets the WinDefend service start type to disabled. Stopping leaves the service installed but inactive, deleting removes it entirely, and setting start=disabled prevents it from starting on the next boot. The specific action determines remediation - re-enabling a flag differs from re-registering a removed service.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is Windows Defender real-time protection currently restored, or is the host still unprotected?
  context: Tampering may be temporary for a single action or persistent. Check the current state of the WinDefend service and the behavior and runtime monitoring settings on the host. If monitoring is still off or the service is stopped, deleted, or set to disabled, protection should be restored before further investigation continues, since the host remains exposed in the meantime.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned the tool that disabled Defender, and is that parent chain expected?
  context: The parent process reveals how the command was invoked. Operator-driven tampering is often launched from an interactive shell, a remote-management agent, or a script host such as wscript.exe or mshta.exe, while routine maintenance tends to run under predictable management tooling. Walk up from the immediate parent to see what spawned it and what else that parent launched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Was the disabling command encoded or obfuscated, and what does it decode to?
  context: The PowerShell branch can be wrapped in -EncodedCommand or -enc base64, or hidden with backtick escaping, string concatenation, and variable substitution so the -DisableBehaviorMonitoring or -DisableRuntimeMonitoring intent is not visible in plain text. Decoding the command reveals the actual operation and whether the Defender change was a single action or part of a larger script that also fetched or executed a payload. This applies only to the PowerShell branch; the sc.exe branch carries its arguments in clear text.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the full deobfuscated content of the disabling command?
  context: Script block logging records the deobfuscated script content that PowerShell actually executes, even when the command line is encoded or obfuscated. This provides ground truth about what ran on the PowerShell branch, bypassing any wrapping. If PowerShell operational logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: What activity occurred on this host after Defender protection was disabled?
  context: Protection is disabled for a reason - to run malware, dump credentials, or perform other actions that would otherwise be blocked or logged. Examining process creation in the window immediately after the change reveals what the tampering was meant to enable. A gap in monitoring followed by new process activity in that window points to the operation the analyst should reconstruct.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense tampering actions performed on this host around the same time?
  context: Operators who disable one control often disable several - stopping Defender alongside clearing event logs, deleting shadow copies, or changing firewall rules to maximize coverage. Finding multiple tampering events from the same user or parent process indicates several controls were targeted in one operation rather than an isolated administrative change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Did process termination, service stoppage, and registry or configuration edits cluster together in the same short window on this host?
  context: Impair-defenses activity is most convincing when several signals land close together - the AV or EDR service stopping, the disabling command running, and configuration or registry edits all within a short correlation window. Tight clustering points to a single deliberate operation; isolated events spread over hours are more consistent with unrelated maintenance. Review the surrounding process activity to judge how tightly these signals correlate.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: When this host has previously fired this Defender-tampering pattern, what parents and users normally drove it, and does the current alert fit?
  context: Even routine administration can match this pattern. This query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern - not generic powershell.exe or sc.exe usage - has historically run here. A new parent process, an unexpected account, or a previously unseen command structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_pwsh_binary:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_pwsh_cli:
        CommandLine|contains:
        - -DisableBehaviorMonitoring $true
        - -DisableRuntimeMonitoring $true
      selection_sc_binary:
      - Image|endswith: \sc.exe
      - OriginalFileName: sc.exe
      selection_sc_tamper_cmd_stop:
        CommandLine|contains|all:
        - stop
        - WinDefend
      selection_sc_tamper_cmd_delete:
        CommandLine|contains|all:
        - delete
        - WinDefend
      selection_sc_tamper_cmd_disabled:
        CommandLine|contains|all:
        - config
        - WinDefend
        - start=disabled
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_pwsh_* or (selection_sc_binary and 1 of selection_sc_tamper_*)) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_pwsh_binary:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_pwsh_cli:
        CommandLine|contains:
        - -DisableBehaviorMonitoring $true
        - -DisableRuntimeMonitoring $true
      selection_sc_binary:
      - Image|endswith: \sc.exe
      - OriginalFileName: sc.exe
      selection_sc_tamper_cmd_stop:
        CommandLine|contains|all:
        - stop
        - WinDefend
      selection_sc_tamper_cmd_delete:
        CommandLine|contains|all:
        - delete
        - WinDefend
      selection_sc_tamper_cmd_disabled:
        CommandLine|contains|all:
        - config
        - WinDefend
        - start=disabled
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_pwsh_* or (selection_sc_binary and 1 of selection_sc_tamper_*)) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_pwsh_binary:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_pwsh_cli:
        CommandLine|contains:
        - -DisableBehaviorMonitoring $true
        - -DisableRuntimeMonitoring $true
      selection_sc_binary:
      - Image|endswith: \sc.exe
      - OriginalFileName: sc.exe
      selection_sc_tamper_cmd_stop:
        CommandLine|contains|all:
        - stop
        - WinDefend
      selection_sc_tamper_cmd_delete:
        CommandLine|contains|all:
        - delete
        - WinDefend
      selection_sc_tamper_cmd_disabled:
        CommandLine|contains|all:
        - config
        - WinDefend
        - start=disabled
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_pwsh_* or (selection_sc_binary and 1 of selection_sc_tamper_*)) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated action on multiple endpoints. If the same user disabled protection or ran similar tooling on more than one host, the scope of the activity is larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_pwsh_binary:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_pwsh_cli:
        CommandLine|contains:
        - -DisableBehaviorMonitoring $true
        - -DisableRuntimeMonitoring $true
      selection_sc_binary:
      - Image|endswith: \sc.exe
      - OriginalFileName: sc.exe
      selection_sc_tamper_cmd_stop:
        CommandLine|contains|all:
        - stop
        - WinDefend
      selection_sc_tamper_cmd_delete:
        CommandLine|contains|all:
        - delete
        - WinDefend
      selection_sc_tamper_cmd_disabled:
        CommandLine|contains|all:
        - config
        - WinDefend
        - start=disabled
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_pwsh_* or (selection_sc_binary and 1 of selection_sc_tamper_*)) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired this Defender-tampering pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this firing pattern rather than generic usage of powershell.exe or sc.exe. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_pwsh_binary:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_pwsh_cli:
        CommandLine|contains:
        - -DisableBehaviorMonitoring $true
        - -DisableRuntimeMonitoring $true
      selection_sc_binary:
      - Image|endswith: \sc.exe
      - OriginalFileName: sc.exe
      selection_sc_tamper_cmd_stop:
        CommandLine|contains|all:
        - stop
        - WinDefend
      selection_sc_tamper_cmd_delete:
        CommandLine|contains|all:
        - delete
        - WinDefend
      selection_sc_tamper_cmd_disabled:
        CommandLine|contains|all:
        - config
        - WinDefend
        - start=disabled
      condition: all of selection_pwsh_* or (selection_sc_binary and 1 of selection_sc_tamper_*)
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - reconnaissance, credential access, or other defense-evasion steps - may reveal the attack stages that preceded the Defender change and help reconstruct the full timeline. Disabling protection is frequently one step in a sequence rather than a standalone event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
