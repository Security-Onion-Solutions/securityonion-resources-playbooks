name: Use Of The SFTP.EXE Binary As A LOLBIN
id: cd75f52c-9768-4c8f-b790-17b423824d38
description: |
  Detects sftp.exe (the OpenSSH client shipped with Windows) invoked with the
  -D flag pointing at a local path, which causes sftp.exe to launch the
  referenced executable as its SFTP server subsystem. The rule fires when the
  process Image ends in sftp.exe AND the command line contains ' -D ..' or
  ' -D C:\'. This is a proxy-execution pattern: a Microsoft-signed binary is
  used to start an attacker-chosen executable, so process ancestry attributes
  the activity to sftp.exe rather than the payload. Legitimate use is rare;
  investigate which executable was launched, the parent that spawned sftp.exe,
  and whether the host normally runs this pattern.
type: detection
detection_id: a85ffc3a-e8fd-4040-93bf-78aff284d801
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line show sftp.exe invoked with a -D flag pointing at a local executable path?
  context: Confirm the alert is a true positive by reading the exact command line and process details. The rule fires when the Image ends in sftp.exe and the command line contains ' -D ..' or ' -D C:\'. The path that follows -D is the executable sftp.exe will start as its subsystem; note its full path and name.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to run sftp.exe with a -D subsystem argument?
  context: Interactive SFTP use normally connects to a remote host and does not pass -D with a local path. Knowing whether the user role and host function involve OpenSSH file transfers helps distinguish routine activity from proxy execution of an unrelated binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What executable does the -D argument point to, and what is the full command sftp.exe ran?
  context: The -D value is the path sftp.exe launches as its SFTP server subsystem -- the actual payload of the proxy-execution pattern. Decode the full command line and identify the referenced executable, its directory, and any arguments. A path under a user-writable or temporary directory, or a renamed binary, raises the concern that this is operator-supplied rather than a real SFTP server.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Does the -D argument reference a URL, script path, DLL entrypoint, or other content not characteristic of a legitimate SFTP server binary?
  context: Proxy-execution abuse uses the trusted binary's arguments to point at attacker-controlled content. Examine the argument for indicators such as an HTTP/HTTPS URL, a scripting host invocation, a path to a DLL entrypoint, or an executable in a staging directory. Legitimate sftp.exe usage targets a remote endpoint, not a local executable supplied via -D.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \sftp.exe
        CommandLine|contains:
        - ' -D ..'
        - ' -D C:\'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Confirm the executable launched via -D -- check its file size, hash, signing status, and strings to determine whether it is a known tool or a renamed or planted binary.
  context: The path referenced by -D is the executable sftp.exe started. Retrieve that file and analyze its content -- signing chain, embedded strings, imports, and packer signatures. A signed, recognized utility is a different disposition than an unsigned or renamed binary sitting in a user-writable directory. Content retrieval requires manual collection from the endpoint.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What is the hash of the executable launched via -D, and does threat intel flag it?
  context: The -D flag makes sftp.exe launch the binary at the path it points to, so that program runs as a child of sftp.exe and its hash is recorded at execution. This returns what sftp.exe spawned (and its siblings) with their hashes -- the -D target appears here; submit its hash to VirusTotal, Hybrid Analysis, or internal threat intel to determine whether it is a known tool, a living-off-the-land binary, or an unrecognized payload. If the target did not run because the launch failed it will not appear -- retrieve it from the -D path and hash it by hand (see the evidence-preservation step).
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      selection_siblings:
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: 1 of selection_*
    fields:
      - Image
      - Hashes
- question: Is the executable referenced by -D still present on disk for analysis?
  context: If the -D-referenced executable still exists on disk, it can be hashed, submitted for analysis, or reviewed directly. If it has been removed, file-event records may still capture its prior existence and the process that wrote it.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process spawned sftp.exe and is that parent chain expected?
  context: The parent process reveals how sftp.exe was invoked. A launch from explorer.exe or a terminal during interactive use differs from a launch by a script host, an Office application, or another LOLBIN. An unexpected parent for an OpenSSH client invoked with a local -D path points toward scripted or operator-driven proxy execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Across this host, which parent processes have launched sftp.exe, and does the alerting parent stand out as unusual for this binary?
  context: Proxy-execution abuse often shows an unexpected parent-child relationship -- a signed binary spawned by something that does not normally launch it. Profiling the parents of sftp.exe on this host establishes the routine launch mechanisms so the alerting parent can be judged against them.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ParentImage
- question: What child processes did sftp.exe spawn afterward?
  context: The processes started by sftp.exe reveal the actual effect of the -D invocation. The referenced executable, and anything it launches in turn -- cmd.exe, powershell.exe, certutil.exe, or other tooling -- show whether this was a benign subsystem start or the entry point of a longer execution chain.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run sftp.exe at all?
  context: A binary that has never been seen on a host is more notable than one that runs regularly. Zero or very low historical counts for sftp.exe indicate first-time or rare execution, which sharpens the concern that the -D invocation is not part of routine operations.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously run sftp.exe with a -D local path, what parents and users drove it, and does the current alert fit that pattern?
  context: The query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern -- not generic sftp.exe usage -- has historically run here. A new parent process, an unexpected user, or an unusual command structure relative to that history is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \sftp.exe
        CommandLine|contains:
        - ' -D ..'
        - ' -D C:\'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \sftp.exe
        CommandLine|contains:
        - ' -D ..'
        - ' -D C:\'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \sftp.exe
        CommandLine|contains:
        - ' -D ..'
        - ' -D C:\'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity elsewhere, the scope of the activity may be larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \sftp.exe
        CommandLine|contains:
        - ' -D ..'
        - ' -D C:\'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Have other hosts run sftp.exe with a -D local path in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this firing pattern rather than generic sftp.exe usage. Many hosts running the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \sftp.exe
        CommandLine|contains:
        - ' -D ..'
        - ' -D C:\'
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- defense tampering, reconnaissance, or credential access -- may reveal the stages that preceded this event and help reconstruct the timeline around the proxy execution.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
