name: Potential APT FIN7 Related PowerShell Script Created
id: df2ef4dc-45e4-4945-bca2-2d0722a3ebbd
description: |
  Detects the creation of a PowerShell script file whose name ends in _64refl.ps1 or is exactly
  host_ip.ps1 - naming conventions associated with FIN7 tooling. The _64refl.ps1 suffix matches the
  FIN7 POWERTRASH reflective loader, which loads an embedded PE payload into memory, and host_ip.ps1
  matches a FIN7 host-discovery script that resolves collected IP addresses to hostnames. Legitimate
  scripts rarely carry these exact names, so the investigation should read the script content, establish
  which process wrote it and what launched that process, confirm whether PowerShell actually executed it,
  and look for other FIN7 companion scripts on this host and the same file across other hosts.
type: detection
detection_id: a88d9f45-ec8a-4b0e-85ee-c9f6a65e9128
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the created file name match the FIN7 PowerShell script patterns this rule detects?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a file
    is created whose name ends in _64refl.ps1 or is exactly host_ip.ps1. Review the triggering event's
    TargetFilename, the operation type, and the process that wrote it to confirm the file name matches one
    of these patterns rather than an incidental collision. Note which of the two patterns fired, because a
    _64refl.ps1 write points at the reflective-loader stage while host_ip.ps1 points at the host-discovery
    stage, and that distinction guides which follow-on activity to expect.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to create a PowerShell script with this name?
  context: >-
    Legitimate automation and administration can drop scripts, but a script named for a FIN7 reflective
    loader or host-discovery tool has no routine business reason to appear. Knowing whether the writing
    account and the host function are consistent with any sanctioned scripting activity is often the
    fastest way to separate a red-team exercise or a build process from an intrusion. User attribution is
    present on roughly 94% of endpoint file events; when the writer is a machine account or SYSTEM, judge
    by the writing process and the host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this script drop part of an authorized penetration test or red team engagement?
  context: >-
    Offensive tooling and reflective loaders are also used in sanctioned security assessments. Before
    deeper analysis, check whether a penetration test or red team exercise is active on this host or
    network segment with matching timing. An authorized engagement that accounts for the script creation
    resolves the alert without further work; the absence of one keeps the intrusion hypothesis open.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What is in this script - is it a reflective loader, a host-discovery routine, or something else?
  context: >-
    Read the script's actual content rather than relying on the file name. A _64refl.ps1 file typically
    carries an obfuscated reflective loader that decodes an embedded PE and runs it in memory, while
    host_ip.ps1 typically resolves collected IP addresses to hostnames as reconnaissance. Look for base64
    or otherwise encoded blocks, in-memory assembly loading, embedded payloads, and network or credential
    logic. File-creation events carry no script body, so retrieve the file from its on-disk path or read
    the executed content from PowerShell operational logging.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did PowerShell script block logging capture the deobfuscated content of this script?
  context: >-
    Script block logging (Event ID 4104) records the deobfuscated script content PowerShell actually
    executed, even when the on-disk file is obfuscated or encoded. For a reflective loader this exposes the
    embedded payload staging that the file body hides, and for a discovery script it exposes the exact
    hosts and addresses enumerated. If PowerShell operational logs are not ingested in this environment,
    treat zero results as a visibility gap rather than evidence the script never ran, and fall back to
    reading the file from disk.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: What process wrote this script, and what launched that process?
  context: >-
    The file event carries the writing process's identifiers, so pivot by its parent to see how the drop
    was initiated. A script written by powershell.exe, cmd.exe, or a database or backup service process,
    launched in turn from an exploited server process, an unusual scripting host, or an unsigned binary,
    points to the file being staged programmatically rather than a deliberate administrator action. FIN7
    intrusions have staged such scripts from a compromised server process executing a shell command, so the
    parent chain separates a scripted drop from an interactive one.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Was this script actually executed by PowerShell after it was created?
  context: >-
    A script on disk is a delivered artifact; execution is what turns it into activity. Correlate the
    created file name against PowerShell command lines on this host to see whether powershell.exe was
    invoked to run it after the write. Execution of a reflective loader means an in-memory payload may
    already be running, which raises urgency and shifts the investigation toward what that payload did.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection
    fields:
      - CommandLine
      - Image
      - ParentImage
- question: What other files did the responsible process write or delete around this alert?
  context: >-
    A process that drops one FIN7 script often drops several - additional loaders, discovery scripts, a
    sideload chain, or an encoded payload staged alongside it. The breadth, paths, and names of the writing
    process's other file activity distinguish a single artifact from a toolkit being staged and enumerate
    what else needs review. The correlation covers the writer and its direct children, since droppers often
    delegate the remaining writes.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Are other FIN7 companion scripts present on this host?
  context: >-
    FIN7 activity involving these script names has appeared alongside sibling scripts - a port-check script
    such as 445.ps1, a persistence dropper such as gup18.ps1, and additional _64refl.ps1 loader variants -
    dropped in the same operation. Searching this host for those other file names confirms whether the
    single detected file is part of a broader toolkit staging and reveals which process wrote each one, even
    if the original writing process has exited.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - '445.ps1'
          - 'gup18.ps1'
          - '_64refl.ps1'
          - 'host_ip.ps1'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Is the script still on disk, or was it deleted or renamed after the alert?
  context: >-
    The script's post-alert lifecycle drives both urgency and next steps. A file still on disk can be
    retrieved, hashed, and analyzed; a file deleted seconds after creation suggests anti-forensic cleanup or
    a self-deleting stager and shifts the investigation to what executed in the interval. Review the file's
    creation, modification, rename, and deletion events over the following window and interpret them by
    operation type.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has a script with this name been seen before on this host?
  context: >-
    A script that has never appeared on a host is more suspicious than one that is part of routine
    operations, even when the name looks innocuous. A first-time appearance of a file matching a FIN7
    loader or discovery name raises its weight, while a history of recurring writes to the same name points
    toward a management process or a repeatedly run tool worth identifying.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Was a file with this name created on any other hosts in the environment?
  context: >-
    The same script name appearing on multiple hosts may indicate lateral movement or deliberate
    distribution, which fits an operator transferring tooling over administrative shares. If the file is
    confined to one host it may be a targeted staging point; if it spans several, establish the distribution
    order and timeline to trace how the tooling propagated. Compare the writing process across hosts to see
    whether the same mechanism placed it each time.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- always_include: true
  question: Has this user previously produced the rule's file-creation pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, so the result is the user's 90-day history
    of creating files matching these FIN7 script names, aggregated by host - not their general file
    activity. A user who has never produced this pattern is more suspicious than one who does so routinely;
    weigh the count against the account's role and expected toolset. Combine this with knowledge of whether
    the account belongs to an administrator, a service, or a standard user.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
      - TargetFilename|endswith: _64refl.ps1
      - TargetFilename: host_ip.ps1
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven the rule's file-creation pattern, or is the program new for this activity?
  context: >-
    When the alert fires under a service or machine account, user identity does not attribute the behavior,
    so the meaningful pivot is the launch mechanism. The query mirrors the rule's selection scoped to the
    alerting program, giving the 90-day history of this program producing these script names rather
    than generic program activity. A new or rare program for this pattern is the deviation worth chasing; a
    program that already accounts for many prior events is more likely established automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
      - TargetFilename|endswith: _64refl.ps1
      - TargetFilename: host_ip.ps1
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the account's activity across all hosts in the alert window reveals whether the script drop is
    isolated or part of broader movement. If the same user triggered related activity on multiple endpoints,
    the scope of compromise is larger and lateral movement is likely in progress. This asks what the account
    did right now across the network, as distinct from its long-run baseline.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven file-creation pattern fire on other hosts in the same window?
  context: >-
    Under a service or machine account, asking what else the user did returns agent-telemetry noise, so the
    meaningful question is whether the same launch mechanism produced these script names elsewhere in the
    alert window. The query mirrors the rule's selection scoped to the alerting program, fleet-wide.
    Multiple hosts in the same window points to pushed or scheduled automation - benign or malicious - while
    a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
      - TargetFilename|endswith: _64refl.ps1
      - TargetFilename: host_ip.ps1
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity in a tight window around the script
    creation surfaces what led up to the drop and what ran immediately after it. Novel parent-child pairs
    stand out at low counts against high-count routine telemetry, which is what points to the tooling that
    staged the script and any reconnaissance, credential access, or execution that followed.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - exploitation of an internet-facing service, reconnaissance,
    execution of scripting tools, or credential access - may reveal the stages that preceded this script
    drop and help reconstruct the timeline. A dropped loader or discovery script is usually a mid-chain
    step, so prior alerts help place it within a larger sequence and establish how access was obtained.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
