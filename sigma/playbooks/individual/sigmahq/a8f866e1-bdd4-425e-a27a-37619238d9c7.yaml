name: Potential Hidden Directory Creation Via NTFS INDEX_ALLOCATION Stream
id: 63022e4c-d7db-4543-ae6c-0e72ec34ba48
description: |
  Detects creation of a file-system object whose path contains the ::$INDEX_ALLOCATION stream
  specifier. On NTFS, $INDEX_ALLOCATION is the default stream type of a directory, and the
  "name::$INDEX_ALLOCATION" syntax creates a directory through the alternate-stream mechanism,
  bypassing the permission check that normal directory creation performs and producing a directory
  that is hidden from Explorer and the plain dir command yet fully usable when referenced by its
  full stream path. There is essentially no routine administrative reason to create directories
  this way, so the pattern is used to stage payloads and tooling in a location that standard
  file-browsing does not reveal. Investigate which process and command created the hidden
  directory, what its parent chain was, what was written into or executed from the location, and
  whether the same technique appears elsewhere on the host or across the environment.
type: detection
detection_id: a8f866e1-bdd4-425e-a27a-37619238d9c7
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting file event show a path containing the ::$INDEX_ALLOCATION stream specifier?
  context: >-
    Before investing investigation time, confirm the alert is a true positive by reviewing the exact
    file path and the responsible process. The rule fires when a created path contains the
    ::$INDEX_ALLOCATION stream syntax, which on NTFS creates a directory hidden from Explorer and the
    plain dir listing. Confirm the path carries that stream suffix and note the operation and the
    creating process; a normal directory creation never uses this syntax.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to create directories using NTFS stream syntax?
  context: >-
    Creating a directory through the name::$INDEX_ALLOCATION stream mechanism has no routine
    administrative use, so knowing whether the writing account and host function are consistent with
    any sanctioned activity is often the fastest way to separate red-team or research testing from a
    live intrusion. If legitimate alternate-stream usage by a system or security tool is a known
    baseline in this environment, that context belongs here. User attribution is present on roughly
    94% of endpoint file events; when the account is a machine account or missing, judge by the
    writing process and host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What command created the hidden directory? Decode the creating process's command line.
  context: >-
    The file event carries no command line, so pivot by the creating process identifier to its
    process record and read the full command. The stream-creation is commonly performed with a shell
    mkdir of the form "name::$INDEX_ALLOCATION" or an equivalent CreateDirectory API call, so the
    command line and working directory reveal exactly what was created and where. If the creating
    process is a graphical shell with no meaningful command line, rely on the file path itself and the
    process lineage rather than the command text.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process created the directory, and what launched that process?
  context: >-
    The parent chain distinguishes a scripted or exploited creation from a deliberate hands-on action.
    A creation launched from a script host such as wscript.exe, cscript.exe, or mshta.exe, from an
    Office application, from a browser, or from an unsigned binary points to the hidden directory being
    staged programmatically, whereas an interactive command shell started by a signed management tool
    reads differently. Monitoring is often tuned to treat interpreters like powershell.exe, cmd.exe,
    and wscript.exe as the higher-interest creating parents for this behavior.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - ParentImage
      - ParentCommandLine
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A process that creates a hidden staging directory usually goes on to populate it. The breadth,
    paths, and extensions of the creating process's other file activity reveal what was placed inside
    the hidden location and whether this is a single artifact or a batch of staged tooling and data.
    Sensitive file types such as executables, scripts, or archives appearing in the same burst are the
    payload that the hidden directory was created to conceal, and each becomes its own lead.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What did the creating process spawn after the hidden directory was created?
  context: >-
    Hiding a directory has value only if something is later run from it, so correlating the creation
    with the creating process's subsequent child processes strengthens or weakens the malicious reading.
    A child that executes from the staged location, an interpreter that reads content out of it, or an
    archiving or transfer tool launched moments later ties the concealment to an active operation. The
    forward window captures execution that follows the staging step.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: Is the hidden directory still on disk, or was it removed after the alert?
  context: >-
    The post-alert lifecycle of the hidden directory drives next steps. A staging location still present
    can be enumerated, its contents retrieved and analyzed; a directory removed shortly after creation
    points to anti-forensic cleanup and shifts the focus to what was written and executed in the interval.
    Review the file operations on this path in the window after the alert and note the operation type and
    responsible process.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has a directory been created via the ::$INDEX_ALLOCATION stream syntax before on this host?
  context: >-
    This concealment technique should be rare-to-absent in normal operation, so a history with no prior
    stream-syntax directory creations makes this a first-time event and raises its weight. A recurring
    history of the same pattern points instead to a tool or process that repeatedly uses it, which reframes
    the alert toward identifying that source. Whether the environment enables this detection broadly is a
    tuning choice; the historical count shows how common the behavior actually is here.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '::$index_allocation'
      condition: selection
    fields:
      - TargetFilename
      - Image
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, so the result is the user's 90-day history
    of creating directories via the stream syntax specifically, not generic file activity. A user who has
    never produced this pattern is more notable than one who does so regularly; weigh the count against the
    user's role and typical toolset. Combine with organizational knowledge about whether the account has any
    reason to use alternate-stream directory tricks.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|contains: '::$index_allocation'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven the rule's pattern on this host or across the environment, or is the program new for this activity?
  context: >-
    When the alert fires under a service or machine account, user identity does not attribute the behavior;
    the meaningful pivot is the launch mechanism. This query mirrors the rule's selection scoped to the
    alerting program, so the result is the 90-day history of that program creating stream-syntax
    directories. A new or rare program for this pattern is the deviation worth chasing; a program that already
    accounts for many prior events is more likely automation or a management tool.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|contains: '::$index_allocation'
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Was a directory created via the same stream syntax on other hosts in the environment?
  context: >-
    The same stream-syntax directory creation appearing across several hosts suggests a broadly run tool or
    a deliberate distribution rather than a one-off; confined to a single host it reads as targeted staging.
    Compare the paths and creating processes across hosts to see whether they share a common origin, which
    separates repeated use of the technique across the environment from an isolated hands-on action.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains: '::$index_allocation'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- always_include: true
  question: What else did this user do across the network around the time of the alert?
  context: >-
    Tracking the account's activity across all hosts in a tight window reveals whether the hidden-directory
    creation is part of broader hands-on activity or an isolated event. If the same user drove notable
    activity on multiple endpoints around this time, the scope of the investigation is larger than one host.
    When the alert fires under a service or machine account this view is dominated by routine agent activity,
    so the parent-driven fleet view is the meaningful companion answer.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service or machine account, asking what else the user did returns routine agent noise, so the
    meaningful question is whether the same launch mechanism produced this pattern elsewhere at the same time.
    The query mirrors the rule's selection scoped to the alerting program, fleet-wide, in the alert
    window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points
    to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|contains: '::$index_allocation'
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Concealment steps rarely happen in isolation. Aggregating process activity in a tight window around the
    alert surfaces what led up to the hidden-directory creation and what ran immediately after it. Novel
    parent-child pairs stand out at low counts against high-count routine telemetry, which is what points to
    the tool that staged the directory and any follow-on execution.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, execution of scripting tools, or defense tampering -
    may reveal the stages that preceded this concealment step and help reconstruct the timeline. Hiding a
    staging directory is usually a means to protect follow-on tooling, so prior alerts help place this event
    within a larger sequence rather than treating it as a standalone action.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
