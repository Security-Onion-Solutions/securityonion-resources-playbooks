name: Suspicious Service DACL Modification Via Set-Service Cmdlet
id: 4419d9d0-2d34-4da4-a7c7-46eb467c2843
description: |
  Detects use of the PowerShell 7 Set-Service cmdlet with the -SecurityDescriptorSddl (-sd) flag to rewrite a
  Windows service's DACL using an SDDL string that references well-known SID constants (IU, SU, BA, SY, WD).
  Modifying a service DACL can grant non-administrative principals control of a service, or strip enumeration
  and stop rights so the service becomes hidden yet keeps running and auto-starting across reboots. Legitimate
  hardening or deployment tooling occasionally sets service descriptors, so the investigation should determine
  which service was targeted, which trustees and rights the SDDL grants or denies, and whether the change was
  authorized.
type: detection
detection_id: a95b9b42-1308-4735-a1af-abb1c5e6f5ac
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line show a Set-Service call with a security-descriptor flag and an SDDL string containing well-known SID constants?
  context: Confirm the alert is a true positive before investing further. The rule fires only when all parts match together. The process is pwsh.exe (or has the pwsh.dll original filename), the command line carries -SecurityDescriptorSddl or -sd, and it includes Set-Service together with a D;; DACL fragment and at least one of the SID constants IU, SU, BA, SY, or WD. Read the full command line and verify every part is present.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to modify Windows service security descriptors from the command line?
  context: Rewriting a service DACL is an administrative action normally limited to a small set of operators or deployment systems. Knowing whether the account and host function are consistent with service-hardening work is often the fastest way to separate a true positive from sanctioned maintenance.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Was there a change ticket, maintenance window, or documented approval for modifying this service's security descriptor?
  context: Persistence and security-configuration changes such as service DACL edits usually require an approval record. A corresponding ticket suggests authorized hardening or deployment; absence of one when policy requires it points toward unauthorized modification. This check can quickly close a false positive or escalate a true one.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which service was targeted, and what trustees and rights does the SDDL string grant or deny?
  context: The Set-Service command line carries the target service name and the full SDDL string. Parse the SDDL to identify each ACE - whether it is an Allow (A) or Deny (D) entry, which SID constant it applies to (WD Everyone, AU Authenticated Users, BU Built-in Users, IU Interactive, SU Service, BA Built-in Administrators, SY LocalSystem), and which rights it sets. Allow entries that grant control to low-trust principals indicate a privilege grant; deny entries that strip stop and delete rights from administrators and interactive users indicate an attempt to hide the service while keeping it running.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - Image
      - User
- question: Was the command encoded or obfuscated, or was the SDDL string assembled to evade the literal pattern?
  context: PowerShell payloads may hide intent with -EncodedCommand (-enc) base64, string concatenation, backtick escaping, or variable substitution. The SDDL argument can also be built from pieces rather than passed as a literal. Decode any encoding and resolve any concatenation so the actual service name, trustees, and rights being applied are visible in plain text.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Was the service registry key under HKLM CurrentControlSet Services modified on this host around the alert time?
  context: A service security descriptor is persisted in the service's registry key (the Security value) and the service start type lives in the Start value under HKLM\System\CurrentControlSet\Services. Registry modifications to these keys around the alert time corroborate the DACL change and can reveal start-type changes that make the service auto-start. If registry event collection is not enabled in this environment, treat zero results as a visibility gap rather than evidence nothing changed.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\CurrentControlSet\Services\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Did the Security log record a service object permissions change or service installation on this host around the alert time?
  context: The Security log records service object security changes (Event 4670, permissions on an object were changed) and new service installations (Event 4697). A 4670 entry naming a service object directly corroborates the DACL rewrite, and any nearby 4697 indicates a newly created service that the modification may be hiding. If the Security log is not collected from this host, treat zero results as a visibility gap.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4670
          - 4697
      condition: selection
    fields:
      - EventID
      - SubjectUserName
      - ObjectName
      - ProcessName
- question: Is the targeted service still present, currently running, and under what account, given the DACL may now hide it from normal enumeration?
  context: After a DACL change a service may keep running and auto-starting while becoming invisible to standard enumeration. On the host, attempting to stop the service by name distinguishes a non-existent service (object-not-found) from a present-but-hidden one (access-denied). Confirm whether the service is running, its start type, and the account it runs under - a service running as LocalSystem holds full system privileges.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the full script that performed the service modification?
  context: Script block logging (Event ID 4104) records the deobfuscated script content PowerShell actually executed, even when the command line is encoded or assembled at runtime. This provides ground truth about the service name and SDDL applied. If PowerShell operational logs are not ingested in this environment, treat the absence of these events as a visibility gap.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: What process spawned pwsh.exe, and is that parent chain expected for service administration?
  context: The parent process reveals how pwsh.exe was invoked. Interactive administration typically descends from explorer.exe or a console host; service-descriptor edits launched from remote-execution frameworks, Office applications, or scripting hosts like wscript.exe or mshta.exe point toward operator activity rather than routine maintenance.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit?
  context: Even legitimate tools can be abused. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific service-DACL pattern has historically run here. A new parent process, an unexpected account, or a first-ever appearance of the pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \pwsh.exe
      - OriginalFileName: pwsh.dll
      selection_sddl_flag:
        CommandLine|contains:
        - '-SecurityDescriptorSddl '
        - '-sd '
      selection_set_service:
        CommandLine|contains|all:
        - 'Set-Service '
        - D;;
        CommandLine|contains:
        - ;;;IU
        - ;;;SU
        - ;;;BA
        - ;;;SY
        - ;;;WD
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \pwsh.exe
      - OriginalFileName: pwsh.dll
      selection_sddl_flag:
        CommandLine|contains:
        - '-SecurityDescriptorSddl '
        - '-sd '
      selection_set_service:
        CommandLine|contains|all:
        - 'Set-Service '
        - D;;
        CommandLine|contains:
        - ;;;IU
        - ;;;SU
        - ;;;BA
        - ;;;SY
        - ;;;WD
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \pwsh.exe
      - OriginalFileName: pwsh.dll
      selection_sddl_flag:
        CommandLine|contains:
        - '-SecurityDescriptorSddl '
        - '-sd '
      selection_set_service:
        CommandLine|contains|all:
        - 'Set-Service '
        - D;;
        CommandLine|contains:
        - ;;;IU
        - ;;;SU
        - ;;;BA
        - ;;;SY
        - ;;;WD
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or action across multiple endpoints. If the same user triggered similar activity on several hosts, the scope of the change may be broader than a single service.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \pwsh.exe
      - OriginalFileName: pwsh.dll
      selection_sddl_flag:
        CommandLine|contains:
        - '-SecurityDescriptorSddl '
        - '-sd '
      selection_set_service:
        CommandLine|contains|all:
        - 'Set-Service '
        - D;;
        CommandLine|contains:
        - ;;;IU
        - ;;;SU
        - ;;;BA
        - ;;;SY
        - ;;;WD
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, giving a fleet-wide count of this specific service-DACL pattern rather than generic pwsh.exe usage. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \pwsh.exe
      - OriginalFileName: pwsh.dll
      selection_sddl_flag:
        CommandLine|contains:
        - '-SecurityDescriptorSddl '
        - '-sd '
      selection_set_service:
        CommandLine|contains|all:
        - 'Set-Service '
        - D;;
        CommandLine|contains:
        - ;;;IU
        - ;;;SU
        - ;;;BA
        - ;;;SY
        - ;;;WD
      condition: all of selection_*
    fields:
    - host.name
- question: Were other process-based persistence mechanisms installed on this host around the alert time?
  context: Attackers rarely rely on a single persistence mechanism. Alongside a service-DACL change they commonly install backup footholds via scheduled tasks, additional services, registry Run keys, BITS jobs, or WMI subscriptions. Multiple persistence installations in the same timeframe indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
