name: Windows Defender Exclusions Added - Registry
id: 4b9514d7-8566-4d2b-8991-5ff415a183fd
description: |
  Detects a registry write under the Windows Defender Exclusions key
  (a TargetObject containing \Microsoft\Windows Defender\Exclusions), which registers a path,
  process, file extension, or IP address that Windows Defender will no longer scan. Adding an
  exclusion is a supported administrative operation, but it is also a common defense-impairment
  step: an attacker who can exclude a directory or a binary carves out a blind spot where a payload
  can be dropped and executed without antivirus inspection. Legitimate exclusions are usually set by
  management tooling or a known administrator and are stable over time; investigate exactly what was
  excluded, which process and account wrote the value, whether the exclusion is still in place,
  whether anything subsequently executed from or was written to the excluded location, and whether
  other defensive controls were tampered with in the same window.
type: detection
detection_id: a982fc9c-6333-4ffb-a51d-addb04e8b529
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting registry write add an entry under the Windows Defender Exclusions key?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a
    value is written to a key path containing \Microsoft\Windows Defender\Exclusions - the subkey
    (Paths, Processes, Extensions, TemporaryPaths, or IpAddresses) names the exclusion type and the
    excluded item itself is usually the value name carried in TargetObject. Review the exact
    TargetObject and Details on the triggering event to confirm a new exclusion entry was created
    rather than an unrelated Defender configuration change.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify Windows Defender exclusions?
  context: >-
    Defender exclusions are normally managed centrally by security tooling or set by a small set of
    administrators, and rarely change through routine end-user activity. Knowing whether the writing
    account and host function match a sanctioned management process is often the fastest way to
    separate an approved exclusion from an attacker carving out an unscanned location. User attribution
    is present on roughly 94% of endpoint registry events; when the value is written by a machine
    account or SYSTEM, pivot on the writing process instead of the user.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What exactly was excluded, and which Defender exclusion category does the key path name?
  context: >-
    The registry path reveals intent. Under \Microsoft\Windows Defender\Exclusions the immediate subkey
    is the exclusion category - Paths (a directory or file), Processes (a process image name),
    Extensions (a file type), TemporaryPaths, or IpAddresses - and the excluded item is the value name.
    A path exclusion for a user-writable directory such as Temp, AppData, ProgramData, or a Public
    folder, or a process exclusion for a scripting host, is a stronger evasion signal than an exclusion
    for a vendor install directory. Confirm the exact key, the excluded value, and the writing process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What is the excluded path, process, or extension, and does it point at attacker-controlled content?
  context: >-
    Decode the excluded item from the value name in TargetObject and the value data in Details. A path
    or process exclusion that names a specific dropped binary, a staging directory the attacker
    controls, or a broad location like the whole of C:\ or a user profile root defeats scanning exactly
    where a payload would land. Details on Defender exclusion entries is typically a DWORD marker rather
    than meaningful data, so the excluded item itself carried in the key path is the primary indicator.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process and command added the Defender exclusion?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to read
    its full command. Exclusions are commonly added with reg.exe writing the value directly, with
    powershell.exe running Add-MpPreference or Set-MpPreference with an -Exclusion parameter, or through
    WMI or the Defender management API. The command reveals the full set of items excluded in one call
    and whether the invocation looks like sanctioned administration or scripted evasion staged alongside
    other activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process wrote the exclusion, and what launched that process?
  context: >-
    Pivot by ProcessGuid to the writing process's own creation record to read its Image, command line,
    and parent. A reg.exe or powershell.exe write launched by an interactive administrator console reads
    very differently from the same write spawned by an Office application, a script host such as
    wscript.exe or mshta.exe, or an unsigned binary. The parent chain distinguishes a deliberate
    administrative change from an exclusion planted programmatically as part of an intrusion.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Is the exclusion still active, or has it been removed and Defender scanning restored?
  context: >-
    An exclusion may be transient - added just long enough to run a payload and then removed - or left
    in place for durable evasion. Checking the current Defender configuration reveals whether the
    excluded path, process, or extension is still unscanned. If the exclusion remains, the host has a
    standing blind spot that should be closed before further investigation, and the excluded location
    should be scanned directly.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What executed on this host after the exclusion was added, especially from the excluded location?
  context: >-
    An exclusion is added for a reason - to let a payload run or be written where Defender will not
    inspect it. Examining process activity in the window after the exclusion reveals what the blind spot
    enabled. Focus on executions whose Image sits under an excluded path, matches an excluded process
    name, or uses an excluded extension, since those are precisely the events scanning would otherwise
    have flagged. Aggregating post-write activity separates the routine baseline from novel processes
    that appeared once the exclusion was in place.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Has this exclusion entry been re-written or is it a first-time, persistent change?
  context: >-
    Registry key and value deletions are not observable in this telemetry, so whether the exclusion was
    later cleaned up is judged from the key's re-modification history rather than from a delete event. A
    single write with no prior or subsequent activity on the entry indicates a durable exclusion left in
    place; repeated writes to the same entry point to tooling that sets it each run. Compare the
    modification history of this exclusion value over a longer window to judge persistence.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Were other defense-tampering actions performed on this host around the same time?
  context: >-
    An actor who adds a Defender exclusion often disables several controls at once - stopping the
    Defender service, disabling real-time monitoring, clearing event logs, deleting shadow copies, or
    changing firewall rules - to maximize coverage. Finding multiple tampering commands from the same
    user or parent process in a short window indicates a coordinated effort to blind defenses rather
    than an isolated administrative exclusion.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'Set-MpPreference'
          - 'advfirewall'
          - 'stop'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: What other registry modifications were made on this host in the same window?
  context: >-
    Attackers who add one exclusion often make other registry changes in the same session - additional
    exclusion entries, Defender policy keys such as DisableAntiSpyware, persistence Run keys, or service
    configuration. Clustering the registry writes on this host in a short window around the alert reveals
    the full scope of configuration changes and which process made them. The triggering exclusion appears
    in the results; the signal is what else was modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has this Defender exclusion entry been set before on this host?
  context: >-
    Defender exclusion entries should change rarely and only through deliberate management, so a history
    with no prior writes to this entry makes it a first-time change and raises its weight. A history of
    periodic writes to the same exclusion points instead to a management process or a repeatedly run
    tool. Compare the historical values to see whether this exclusion existed before or is newly added.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same exclusion added on other hosts in the environment?
  context: >-
    The same exclusion appearing across many hosts suggests a management policy or a mis-scoped
    deployment; the same exclusion confined to one host suggests a targeted action. Compare the writing
    process across hosts to see whether a consistent management tool set it everywhere or whether a
    hands-on operation added it on this host alone, which separates sanctioned configuration from a
    localized evasion step.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Defense tampering rarely happens in isolation. Aggregating process activity in a tight window around
    the alert surfaces what led up to the exclusion write and what ran immediately after it. Novel
    parent-child pairs stand out at low counts against high-count routine telemetry, which is what points
    to the tool that added the exclusion and any payload that ran once the blind spot was in place.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, credential access, or execution of scripting
    tools - may reveal the stages that preceded this change and help reconstruct the timeline. Adding a
    Defender exclusion is typically a preparatory step for running a payload, so prior alerts help place
    this exclusion within a larger sequence and indicate how the actor reached the point of modifying
    defenses.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Carving out an unscanned location is frequently paired with establishing a foothold there. Scheduled
    tasks, services, registry Run keys, BITS jobs, or WMI subscriptions created by schtasks.exe, sc.exe,
    reg.exe, bitsadmin.exe, or wmic.exe near the exclusion write indicate the exclusion was set up to
    protect a persistent payload rather than being an isolated configuration change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely - dropping an executable or script
    into a Startup folder or a path referenced by a registry Run key achieves persistence without
    invoking schtasks, sc, or reg. File writes to these locations near the exclusion write indicate the
    actor established a parallel persistence mechanism on disk, and such a drop landing inside an excluded
    path would also evade scanning.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
