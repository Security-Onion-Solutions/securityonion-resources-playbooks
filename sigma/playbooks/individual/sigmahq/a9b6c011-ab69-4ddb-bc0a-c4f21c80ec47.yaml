name: Potential Attachment Manager Settings Associations Tamper
id: da3606dc-b9eb-489b-85eb-326822ef83fd
description: |
  Detects a registry write under the Windows Attachment Manager Associations policy path
  (...\CurrentVersion\Policies\Associations\) that lowers the default risk assigned to downloaded or
  received files. The rule fires when selection_main matches AND at least one value branch matches:
  EITHER DefaultFileTypeRisk is set to the DWORD 0x00006152 (24914, "open low-risk files without a
  prompt"), OR LowRiskFileTypes is set to a list that includes executable and script extensions
  (.zip, .rar, .exe, .bat, .com, .cmd, .reg, .msi, .htm, .html). Both branches suppress the
  Mark-of-the-Web "this file came from another computer" warning so attacker-delivered files run
  without prompting, a defense-impairment and trust-control-subversion action. Legitimate changes to
  these policy keys are rare. Investigate which value was written, the writing process and its parent,
  whether other download-protection or security settings were weakened in the same window, and whether
  risky file types were executed afterward.
type: detection
detection_id: a9b6c011-ab69-4ddb-bc0a-c4f21c80ec47
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting registry write lower Attachment Manager file-type risk, either by setting DefaultFileTypeRisk or by adding executable extensions to LowRiskFileTypes?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a
    value under ...\CurrentVersion\Policies\Associations\ is written AND one of two branches matches:
    EITHER the path ends in DefaultFileTypeRisk with data DWORD (0x00006152), OR the path ends in
    LowRiskFileTypes with data containing executable and script extensions (.exe, .bat, .com, .cmd,
    .reg, .msi and similar). Review the exact TargetObject and Details on the triggering event and note
    which branch fired, because the branch determines what the change actually weakened. On a clean host
    these policy values effectively never change, so either write is the setup step of a
    Mark-of-the-Web bypass.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify Windows Attachment Manager or file-download risk policy?
  context: >-
    The Attachment Manager Associations policy values control how downloaded and received files are
    risk-classified and effectively never change through normal use. Knowing whether the writing account
    and host function match any sanctioned configuration change is the fastest way to separate approved
    hardening or testing from a live defense-impairment action. User attribution is present on roughly
    94% of endpoint registry events; when it is a machine account or SYSTEM, pivot on the writing process
    instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which Attachment Manager value was written, and why is this key a Mark-of-the-Web bypass location?
  context: >-
    The keys under ...\CurrentVersion\Policies\Associations\ govern the Windows download-risk model.
    DefaultFileTypeRisk set to 0x00006152 (24914) means low-risk files open without a prompt, and
    LowRiskFileTypes lists the extensions treated as low risk. Placing executable and script extensions
    on that list, or lowering the default risk, tells the shell to skip the "came from another computer"
    warning and the Zone.Identifier prompt for those types. Confirming the exact value name, its data,
    and the writing process establishes that this is the Attachment Manager tamper surface rather than
    an unrelated policy edit.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value data was written, and which protection does it disable?
  context: >-
    Decode the Details field. For the DefaultFileTypeRisk branch the data is the DWORD 0x00006152 (24914),
    the LOW_RISK_FILES_OPEN_WITHOUT_PROMPT setting that removes the open-warning for low-risk types. For
    the LowRiskFileTypes branch the data is a semicolon-delimited extension list; the presence of .exe,
    .bat, .com, .cmd, .reg, or .msi marks executable and script formats as low risk so they open without
    the Mark-of-the-Web prompt. Details is present on roughly 79% of registry modifications and should be
    populated for these value writes.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Does the lowered Attachment Manager setting persist afterward, or was it restored?
  context: >-
    Registry key and value deletions are not observable in this telemetry, so durability is judged from
    the value's re-modification history rather than from a delete event. If the lowered value remains in
    place, the download-risk protection stays weakened and attacker-delivered files continue to open
    without a prompt. A later write that restores the original risk setting suggests the change was
    reverted to hide it after its purpose was served. Compare the Details values written to this key over
    the following window.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What process wrote this value, and what launched that process?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to read
    its Image, full command, and parent. A reg.exe, powershell.exe, or cmd.exe write launched from a
    batch script, an Office application, a script host such as wscript.exe or mshta.exe, or an unsigned
    binary points to the policy being changed programmatically rather than through a deliberate
    administrator action. The parent chain distinguishes a scripted tamper from an interactive console
    edit.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: After these protections were lowered, were script or installer files of the now-permitted types launched on this host?
  context: >-
    The payoff of weakening the Attachment Manager risk model is that downloaded script and installer
    files open without the Mark-of-the-Web warning. Execution of .bat, .cmd, .hta, .js, .vbs, .reg, or
    .msi content on this host shortly after the policy change may be the delivered payload running under
    the newly lowered protection. Correlate the timing of these launches with the registry write to see
    whether the tamper enabled a follow-on execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_types:
        CommandLine|contains:
          - '.bat'
          - '.cmd'
          - '.hta'
          - '.js'
          - '.vbs'
          - '.reg'
          - '.msi'
      condition: selection and selection_types
    fields:
      - Image
      - CommandLine
      - User
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor who weakens one protection setting often makes several configuration changes in the same
    session, such as autostart, firewall, or security-policy edits alongside the attachment-manager
    change. Clustering the registry writes on this host in a short window around the alert reveals the
    full scope of the changes and which process made them. The triggering key appears in the results; the
    signal is what else was modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Were other Mark-of-the-Web or Attachment Manager protection settings modified on this host around the same time?
  context: >-
    The same defense-evasion objective frequently sets sibling knobs on the same protection surface -
    HideZoneInfoOnProperties and SaveZoneInformation under the Attachments policy, and other
    DefaultFileTypeRisk, LowRiskFileTypes, ModRiskFileTypes, or HighRiskFileTypes values under
    Associations. Each of these lowers the download-risk classification or suppresses the zone/Mark-of-
    the-Web prompt. Several of them set together in a short window strengthens the case that this was a
    deliberate takedown of download protections rather than an isolated edit.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_paths:
        TargetObject|contains:
          - '\Policies\Associations\'
          - '\Policies\Attachments\'
      condition: selection and selection_paths
    fields:
      - TargetObject
      - Details
      - Image
- question: Around this change, did the process tree run commands that stop or remove security services or disable protections?
  context: >-
    Lowering the Attachment Manager risk model is one defense-impairment action, and it commonly appears
    alongside others. Checking whether security services were stopped or removed, or whether antivirus
    real-time protection was altered, in the same window shows whether this is an isolated policy edit or
    part of broader defense tampering on the host. The command-line filters target service-control,
    task-kill, and real-time-protection changes performed by the process tree around the alert.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_cmd:
        CommandLine|contains:
          - 'sc stop'
          - 'sc delete'
          - 'net stop'
          - 'taskkill'
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
      condition: selection and selection_cmd
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Has this Attachment Manager value been modified before on this host?
  context: >-
    The Associations policy values should change rarely and only through deliberate action, so a history
    with no prior writes makes this a first-time change and raises its weight. A history of periodic
    writes of the same value points instead to a management process or a repeatedly run configuration
    tool. Compare the historical Details values to see whether this risk setting was lowered before or
    whether this is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same Attachment Manager value modified on other hosts in the environment?
  context: >-
    The same write across many hosts suggests a broad tool run or a mis-scoped policy deployment; the
    same write confined to one host suggests targeted tampering. Compare the Details values across hosts
    to see whether they all lower the risk setting the same way and whether the writing process is
    consistent, which separates a single hands-on operation from repeated use of the technique across the
    environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A defense-impairment change rarely happens in isolation. Aggregating process activity in a tight
    window around the alert surfaces what led up to the registry write and what ran immediately after it.
    Novel parent-child pairs stand out at low counts against high-count routine telemetry, which is what
    points to the tool that made the change and any actions taken once protections were lowered.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, execution of scripting tools, or other defense
    tampering - may reveal the stages that preceded this change and help reconstruct the timeline.
    Weakening download protections is typically a means to let a delivered payload run, so prior alerts
    help place this registry write within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
