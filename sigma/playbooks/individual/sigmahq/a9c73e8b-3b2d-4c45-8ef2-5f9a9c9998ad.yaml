name: MMC Loading Script Engines DLLs
id: 45a863e0-4438-47e6-98fd-e2fea8b232b6
description: |
  Detects the Microsoft Management Console (mmc.exe) loading a scripting-engine library
  (vbscript.dll, jscript.dll, or jscript9.dll). mmc.exe is a trusted, signed system binary
  that normally hosts management snap-ins and has no routine reason to load a script engine, so
  this module load is the observable footprint of running embedded VBScript or JScript inside a
  trusted process to bypass application control or evade defenses. It fires when the loading
  process ends in \mmc.exe AND the loaded module ends in one of the three script-engine DLLs.
  The pattern is characteristic of crafted .msc console files that carry embedded script and
  redirect execution into the script host from within mmc.exe. Investigate which .msc file mmc
  opened and from where, which modules it loaded and their signature and hash, whether an
  obfuscated script decoded to a download or loader, what mmc spawned or connected to afterward,
  and whether the activity is new to this host and fleet.
type: detection
detection_id: a9c73e8b-3b2d-4c45-8ef2-5f9a9c9998ad
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the loaded module match what this rule detects — mmc.exe loading a script-engine DLL, with the module path, signature, and loading process confirmed?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires when a process
    ending in \mmc.exe loads a module ending in \vbscript.dll, \jscript.dll, or \jscript9.dll.
    Review the exact loaded module path (ImageLoaded), its code-signature status, and that the
    loading process really is mmc.exe. DLL loads carry a hash and signing status on the load
    event, so the signature can be judged directly here. A canonical script engine loaded from
    the System32 path by mmc.exe is the pattern; the follow-on questions establish whether the
    reason for that load is benign.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Is this user and host expected to run the Microsoft Management Console in a way that loads a script engine?
  context: >-
    Legitimate MMC operations and third-party snap-ins can occasionally pull in a scripting
    library, so knowing whether the account and host function fit routine administrative use is
    often the fastest way to separate a benign console session from script-engine abuse. A
    non-admin user, a service account, or a host with no management role loading a script engine
    through mmc.exe is harder to explain. When the user field is a machine account or missing,
    pivot to the loading process and its parent for attribution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What .msc console file did mmc.exe open, and is that path a standard system console or a user-staged file?
  context: >-
    The full mmc.exe command line reveals which .msc console file was opened and from where.
    Standard consoles live under System32 and Program Files; a .msc launched from a user-writable
    or network location — Users, AppData, Downloads, Desktop, or a UNC path — is the staging step
    of console-file proxy execution. Decode the command line and note the .msc name and directory,
    and any /a or -Embedding flags. This query returns mmc.exe executions on the host in the
    window, which for a multi-step operation may span more than the single triggering invocation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What modules did mmc.exe load around this event, and are any from non-canonical paths, unsigned, or from user-writable directories?
  context: >-
    The full set of modules mmc.exe loaded tells the operator's story. Beyond the script engine
    the rule fired on, look for additional DLLs loaded from %TEMP%, AppData, ProgramData, or Public
    (a side-loading signal), unsigned modules where signed ones are expected, and script or
    COM-related components activated on behalf of a non-baseline CLSID. A script engine loaded
    alongside modules from unusual paths points to embedded-script execution rather than a normal
    snap-in. Confirm the loading process by ProcessGuid so the module list is scoped to this mmc
    instance.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For the script engine and any other suspicious modules mmc.exe loaded, what is the signing status, hash, and reputation?
  context: >-
    Module reputation separates a routine signed library from a side-loaded or tampered one. A
    genuinely Microsoft-signed script engine loaded from the System32 path is expected for the
    console host itself; an unsigned or invalidly signed module, or a Microsoft-named DLL loaded
    from a non-system path, is a masquerading or search-order-hijack signal. A signed process
    loading an unsigned module (a signed-to-unsigned transition) is worth flagging. Use the hash
    to pivot against threat intelligence, since known loaders reuse the same modules.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: Is the script carried in the .msc file or its command line encoded or obfuscated, and what does it decode to?
  context: >-
    Loading vbscript.dll or jscript.dll means embedded script ran inside mmc.exe, and that script
    is commonly obfuscated to hide its intent. Crafted console files carry the script inside the
    .msc XML rather than on the command line, using res:// and javascript:eval() patterns,
    Chr()/String.fromCharCode() character chains, or environment-variable substitution; high
    entropy in the console file is itself a signal. Reconstruct the string and identify the
    operation — a download cradle, an in-memory loader, or a reverse shell. The command line
    retrieved here names the .msc file; retrieve that file for content analysis where the command
    line alone is opaque.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the .msc console file or any dropped payload still on disk for analysis?
  context: >-
    If the console file mmc.exe opened, or a payload it or its children wrote, is still present,
    it can be hashed, submitted to a sandbox, or reviewed for the embedded script. This query
    correlates file writes to the mmc process and its direct children by process lineage, which
    surfaces the .msc file, any staged loader, and forensic side-artifacts such as a temporary
    redirect file written under the user's browser cache during the redirection step.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What files did mmc.exe or its children write to user-writable or network locations around this event?
  context: >-
    Console-file proxy execution stages its inputs and outputs in writable directories: the .msc
    file itself under Users, AppData, Downloads, or Desktop; a temporary redirect artifact under
    the browser cache during the redirection step; and any payload the embedded script fetches or
    drops. Scoping file writes by the mmc process lineage and filtering to user-writable and
    network paths isolates the staging activity from the console's routine reads. Files landing in
    these locations tie the module load to a staged operation rather than an administrator opening
    a system console.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      selection_paths:
        TargetFilename|contains:
          - '\Users\'
          - '\AppData\'
          - '\Downloads\'
          - '\Desktop\'
          - '\INetCache\'
          - '\Temp\'
      condition: (selection_self or selection_child) and selection_paths
    fields:
      - TargetFilename
      - Image
- question: What process launched mmc.exe, and is that parent chain expected?
  context: >-
    The image_load event carries no parent detail, so pivot by ProcessGuid to the mmc.exe
    process record to read its parent. A legitimate console launch is typically started by
    explorer.exe for a user action or by a management service. mmc.exe spawned by an Office
    application, a browser, a script host such as wscript.exe or mshta.exe, or an unsigned binary
    points to the console being opened programmatically as part of an intrusion rather than by an
    administrator.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What child processes did mmc.exe spawn after loading the script engine?
  context: >-
    A normal console session rarely spawns child processes. Embedded-script execution inside
    mmc.exe frequently launches a script host, cmd.exe, powershell.exe, or a dropped binary to
    carry out the next stage. Listing the children of this mmc process reveals whether the module
    load led to hands-on execution and what that execution was. Unexpected children shortly after
    the load tie the script engine to post-exploitation activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did mmc.exe make any outbound network connections around this event?
  context: >-
    mmc.exe hosting embedded script can reach out to retrieve a second-stage payload or contact a
    controller, which a routine console session does not do. Scoping network connections to this
    mmc process surfaces any destinations it contacted; external destinations outside approved
    ranges are the ones worth chasing, while connections to internal management endpoints may be
    expected for a genuine snap-in. Correlate any destination here with the decoded script content
    and with a DNS lookup for the same host to confirm the connection completed.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - Initiated
- question: Does this host normally run the Microsoft Management Console?
  context: >-
    A console host that runs mmc.exe regularly for legitimate administration is a weaker signal
    than one where it has never or rarely appeared. Zero or very low historical counts over the
    window indicate first-time or unusual use, which raises the weight of a script-engine load.
    Grouping by user shows which accounts drive the console's normal use on this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Has this script-engine DLL been loaded on this host before, and under what processes?
  context: >-
    A first-time load of the script engine on this host is a stronger anomaly than a recurring
    one. If the same library has been loaded by the same processes repeatedly over the window,
    the current load is more likely routine; if this is the first occurrence, or the library has
    historically been loaded only by entirely different processes, the load by mmc.exe stands out.
    The list of loading processes shows whether mmc.exe is a normal consumer of this library here.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: When this host has previously fired this rule's pattern, what programs and users normally drove it, and does the current alert fit?
  context: >-
    Even a trusted console can be abused. This query mirrors the rule's selection — mmc.exe
    loading one of the script-engine DLLs — scoped to this host, so the resulting program and
    user distribution reflects how this exact firing pattern has run here historically, not
    generic console usage. A new acting program process, an unexpected account, or a first-ever
    occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith: \mmc.exe
        ImageLoaded|endswith:
        - \vbscript.dll
        - \jscript.dll
        - \jscript9.dll
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    This query mirrors the rule's selection with no host scope, giving a fleet-wide count of
    mmc.exe loading a script engine rather than generic console usage. Many hosts firing the same
    pattern points to a scripted deployment or a management tool that legitimately drives script
    engines through the console; one host or a small unrelated set points to hands-on operator
    activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith: \mmc.exe
        ImageLoaded|endswith:
        - \vbscript.dll
        - \jscript.dll
        - \jscript9.dll
      condition: selection
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity in a tight window around the
    load surfaces what led up to the console being opened and what ran immediately after. Novel
    parent-child pairs stand out at low counts against high-count routine telemetry, which is what
    points to the tooling that staged the console file and to any follow-on execution once the
    script ran.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — reconnaissance, phishing-adjacent execution, or defense
    tampering — may reveal the stages that preceded this console-file execution and help
    reconstruct the timeline. Proxy execution through a trusted binary is usually a means to run a
    payload, so prior alerts help place this module load within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
