name: AMSI Disabled via Registry Modification
id: 8b2667d2-594f-406e-86de-035aef9175b7
description: |
  Detects a registry write that sets the AmsiEnable value under HKCU\Software\Microsoft\Windows Script\Settings
  to DWORD 0, which disables the Antimalware Scan Interface for the affected scripting host. The rule fires
  when the TargetObject path ends in \Software\Microsoft\Windows Script\Settings\AmsiEnable AND the written
  value data is DWORD (0x00000000). Because this key lives in the current-user hive, a non-privileged user or
  a compromised process can create it without elevation; with AMSI disabled, scripts and commands run through
  the affected host are no longer submitted to installed antimalware for scanning, which is a common precursor
  to executing obfuscated or malicious PowerShell and script payloads. Investigate which process wrote the
  value and its parent chain, what ran on the host after AMSI was disabled, whether the value was restored,
  and whether other defense-tampering or persistence actions accompanied it.
type: detection
detection_id: aa37cbb0-da36-42cb-a90f-fdf216fc7467
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Do the registry key and value data match the AMSI-disable pattern this rule detects?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a value
    whose path ends in \Software\Microsoft\Windows Script\Settings\AmsiEnable is written AND the value data is
    DWORD (0x00000000). Review the exact TargetObject and Details on the triggering event to confirm the
    AmsiEnable value was set to 0. On a clean host this value is normally absent or set to 1, so a write
    establishing 0 in the current-user hive is the AMSI-disable action itself.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to disable AMSI through the Windows Script AMSI setting?
  context: >-
    Legitimate software rarely writes AmsiEnable=0; the value is almost always set by a user or process
    deliberately turning off script scanning. Knowing whether the writing account and host function match any
    sanctioned change - a developer or security tester toggling AMSI, for instance - is the fastest way to
    separate authorized activity from an evasion attempt. User attribution is present on roughly 94% of
    endpoint registry events; when it is a machine account or SYSTEM, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which AMSI registry value was modified, and why is this a known evasion location?
  context: >-
    The value HKCU\Software\Microsoft\Windows Script\Settings\AmsiEnable controls whether the Antimalware Scan
    Interface scans content for the affected scripting host. Setting it to 0 in the per-user hive disables that
    scanning without requiring elevation, which is why it is a well-known AMSI-bypass location rather than a
    routine configuration key. Confirming the exact path and the writing process establishes that this is the
    AMSI toggle and not an unrelated Windows Script settings edit.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value was written to the AmsiEnable key, and what does that value do to script scanning?
  context: >-
    A DWORD of 0 written to this value disables the Antimalware Scan Interface for the affected scripting host,
    so content executed through it is no longer submitted to installed antimalware before it runs; a value of 1
    or an absent value leaves scanning enabled. Decoding the exact Details confirms the write establishes the
    disabled state rather than re-enabling or setting an unrelated value. Details is present on roughly 79% of
    registry modifications and should be populated for this DWORD value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Which security control did this registry write disable, and what command performed the write?
  context: >-
    This write disables AMSI, removing script and content scanning for the affected host - the immediate impact
    is that obfuscated or malicious scripts run without being scanned. Pivoting to the writing process by its
    ProcessGuid shows the full command that set the value, which reveals whether it was a direct reg.exe edit, a
    PowerShell Set-ItemProperty call, or a script-host action, and whether the same command performed additional
    changes.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process wrote the AmsiEnable value, and what launched that process?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to read its
    Image, full command, and parent. A write launched from an Office application, a browser, a script host such
    as wscript.exe or mshta.exe, or an unsigned binary points to AMSI being disabled programmatically as part of
    a payload delivery chain rather than a deliberate administrator or developer action. The parent chain
    distinguishes a scripted evasion step from an interactive console change.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Is AMSI currently restored on this host, or does the AmsiEnable value remain 0?
  context: >-
    Disabling AMSI may be momentary - set to 0 just long enough to run a payload, then reverted - or left in
    place. The host stays without script scanning for as long as the value remains 0, so determining the current
    state establishes whether the exposure is ongoing and whether the value should be restored before further
    work. Registry value deletions are not observable in this telemetry, so judge the current state from the
    key's later re-modification history and from direct host inspection rather than from a delete event.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What activity occurred on this host after AMSI was disabled?
  context: >-
    AMSI is typically disabled to allow a specific payload to run without being scanned, so the processes that
    execute immediately afterward are often the reason for the tampering. Aggregating process activity in the
    window following the write surfaces script hosts, encoded PowerShell, or newly dropped binaries that ran
    while scanning was off. A burst of scripting-host or interpreter activity right after the value was set
    points to the payload the evasion was meant to protect.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense-tampering actions performed on this host?
  context: >-
    Attackers who disable one control often disable several - turning off AMSI alongside stopping antimalware
    services, clearing event logs, or deleting shadow copies. Finding multiple tampering actions from the same
    user or parent process in a short window indicates a broader defense-evasion effort rather than an isolated
    setting change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor disabling AMSI through the registry frequently makes other configuration changes in the same
    session - removing AMSI provider registrations, editing antimalware or firewall policy keys, or adding
    persistence keys. Clustering the registry writes on this host in a short window around the alert reveals the
    full scope of the changes and which process made them. The triggering AmsiEnable key appears in the results;
    the signal is what else was modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Was the AmsiEnable value changed again after this write, and does it remain disabled?
  context: >-
    Registry value deletions are not observable in this telemetry, so durability is judged from the key's
    re-modification history rather than from a delete event. A later write restoring the value to 1 indicates
    AMSI was re-enabled - common cleanup once a payload has run - while the value remaining 0 leaves script
    scanning off on the host. Compare the Details values written to this key over the following window to see
    whether the disabled state persisted.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Has the AmsiEnable value been modified before on this host?
  context: >-
    The AMSI script setting should change rarely and only through deliberate action, so a history with no prior
    writes makes this a first-time change and raises its weight. A history of periodic writes might point to a
    recurring tool or a management process that toggles the setting. Compare the historical Details values to see
    whether AMSI has been disabled here before or whether this is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was the AmsiEnable value modified on other hosts in the environment?
  context: >-
    The same AMSI-disable write across many hosts suggests a broad tool run or scripted deployment; the same
    write confined to one host suggests targeted activity. Compare the Details and writing process across hosts
    to see whether they all disable AMSI the same way, which separates a single hands-on operation from repeated
    use of the technique across the environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Disabling AMSI rarely happens in isolation. Aggregating process activity in a tight window around the alert
    surfaces what led up to the registry write and what ran immediately after it. Novel parent-child pairs stand
    out at low counts against high-count routine telemetry, which is what points to the tool that disabled AMSI
    and any payload that ran once scanning was off.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, credential access, or other defense tampering - may
    reveal the stages that preceded this change and help reconstruct the timeline. Disabling AMSI is usually a
    means to run script payloads undetected, so prior alerts help place this write within a larger sequence of
    activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Disabling AMSI to run a payload is frequently followed by establishing a foothold. Scheduled tasks, services,
    registry Run keys, BITS jobs, or WMI subscriptions created by schtasks.exe, sc.exe, reg.exe, bitsadmin.exe,
    or wmic.exe near the AMSI-disable write indicate the evasion was a step toward installing persistence rather
    than an isolated action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
