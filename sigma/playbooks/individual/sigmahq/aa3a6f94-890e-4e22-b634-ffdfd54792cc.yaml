name: Suspicious Binary In User Directory Spawned From Office Application
id: cb6c4cec-088e-4da1-92ed-d6daec78db48
description: |
  Detects a Microsoft Office suite application (Word, Excel, PowerPoint, Publisher, Visio, Access, or the
  Equation Editor) spawning an executable that lives under C:\users\, excluding Teams.exe. The rule fires when
  the parent Image ends in one of the Office binaries AND the child Image starts with C:\users\ AND ends in
  .exe AND is not Teams.exe. Office applications open documents that users receive by email, chat, or download;
  a document with a malicious macro or embedded object can write a payload into a user-writable directory and
  launch it, which is exactly this parent-child pattern. Legitimate add-ins and user-installed tooling occasionally
  produce the same lineage, so confirm what document opened, what the child executable is and where it came from,
  whether it carries a mark-of-the-web from a download, and whether this parent-child pairing is routine for this
  user and host.
type: detection
detection_id: aa3a6f94-890e-4e22-b634-ffdfd54792cc
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did an Office application spawn an executable from a user directory, and which Office app and child binary were involved?
  context: >-
    Confirm the alert is a true positive by reviewing the exact parent and child. The rule fires when the parent
    Image ends in WINWORD.EXE, EXCEL.EXE, POWERPNT.exe, MSPUB.exe, VISIO.exe, MSACCESS.exe, or EQNEDT32.exe AND
    the child Image starts with C:\users\ AND ends in .exe AND is not Teams.exe. Note which Office application is
    the parent and the full path of the child executable, since an executable dropped into a user profile path by
    a document handler is the core signal here.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
- question: Is this user and host expected to launch user-directory executables from an Office application?
  context: >-
    Some workflows legitimately drive Office to launch helper executables -- a sanctioned add-in, a line-of-business
    macro, or a user-installed tool staged under the profile. Knowing whether this host's role and the acting user
    routinely produce Office-spawned executables from a user directory is often the fastest way to separate
    sanctioned automation from a malicious document.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What document or email attachment caused the Office application to spawn this executable?
  context: >-
    Initial access through an Office application typically begins with a document delivered by email, chat, or a
    download link, carrying a malicious macro or embedded object. Identifying the specific document -- its filename
    and how it reached the user -- enables blocking at the perimeter and finding other recipients. Read the parent
    command line for the opened document path, and correlate against mail and web gateway records for the delivery.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Is this Office application expected to spawn this child, and what opened the document that started it?
  context: >-
    An Office application spawning an executable from a user directory is the core signal for this detection.
    Tracing the parent's own origin shows whether the chain is legitimate -- a user double-clicked a document that
    triggered a sanctioned add-in -- or whether the document was opened from a mail handler or download path and
    its macro launched the child. Read the parent and grandparent command lines for the document path and the
    application that delivered it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did the same Office application instance spawn around the same time?
  context: >-
    A malicious document often launches more than one process -- a dropper, then a script host, then the payload.
    Examining the other children of the same Office application instance reveals the full scope of what the document
    executed. host.name is included as a fallback because ParentProcessGuid may be unavailable.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What exactly did the spawned executable do? Decode its full command line.
  context: >-
    The child's command line reveals the operation the document launched. Decode any flags, file paths, URLs, or
    encoded content. A payload dropped into a user profile path may invoke a script host, a download cradle, or a
    second-stage loader; read the arguments to identify what it operated on and where it pulled from. This view
    scopes to executions of this binary on this host in a tight window so multi-step invocations are visible together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Does the spawned executable carry a mark-of-the-web indicating it was downloaded from outside the host?
  context: >-
    When a file arrives from the internet or another zone, the handler records a Zone.Identifier alternate data
    stream marking its origin. An executable launched from a user directory that carries a download mark-of-the-web
    was almost certainly delivered rather than locally produced, which strongly aligns with a document-borne payload.
    The endpoint agent records this stream write as an ordinary file-creation event, with the Zone.Identifier stream
    name appended to the file path rather than as a separate stream-hash record — there is no hash or content field
    on it, so this confirms the mark's presence and the writing process, not what the file contains. MOTW writes are
    comparatively sparse fleet-wide, so this looks across a wide window.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%Image%'
      selection_motw:
        TargetFilename|contains: ':Zone.Identifier'
      condition: selection and selection_motw
    fields:
      - TargetFilename
      - Image
- question: Is the spawned executable still on disk for analysis?
  context: >-
    The executable dropped into the user directory is the payload. Checking whether it still exists on disk enables
    hash lookups, reputation checks, and sandbox submission. File-creation events for the same path also reveal which
    process wrote it -- the Office application itself, a script host it spawned, or a separate dropper.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did the spawned executable make any outbound network connections, and to where?
  context: >-
    A document-delivered payload commonly reaches out immediately to pull a second stage or establish
    command-and-control. An outbound connection from the child executable shortly after it started indicates the
    document drove a download or remote interaction rather than a self-contained local action. Compare any
    destination against known-good update and management endpoints.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Were other users or hosts hit by the same Office-spawned execution pattern?
  context: >-
    Phishing campaigns rarely target a single user. If one document spawned an executable from an Office
    application, others likely received the same lure. Searching for the same rule firing across other hosts reveals
    campaign breadth and identifies additional systems that need investigation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is the Office application up to date with security patches?
  context: >-
    Some initial-access chains exploit known vulnerabilities in Office to achieve code execution rather than relying
    on macro consent. An unpatched Office installation confirms exploitation was possible and indicates whether other
    similarly unpatched systems are at risk. Patch status also helps distinguish exploitation of a known CVE from
    macro-driven execution the user enabled.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith:
        - \WINWORD.EXE
        - \EXCEL.EXE
        - \POWERPNT.exe
        - \MSPUB.exe
        - \VISIO.exe
        - \MSACCESS.exe
        - \EQNEDT32.exe
        Image|startswith: C:\users\
        Image|endswith: .exe
      filter:
        Image|endswith: \Teams.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith:
        - \WINWORD.EXE
        - \EXCEL.EXE
        - \POWERPNT.exe
        - \MSPUB.exe
        - \VISIO.exe
        - \MSACCESS.exe
        - \EQNEDT32.exe
        Image|startswith: C:\users\
        Image|endswith: .exe
      filter:
        Image|endswith: \Teams.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around the time of the alert?
  context: >-
    Tracking the user's activity across all hosts in the alert window reveals whether this is isolated or part of
    broader hands-on activity. The same user triggering similar Office-spawned execution on multiple hosts widens
    the scope of what needs review.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith:
        - \WINWORD.EXE
        - \EXCEL.EXE
        - \POWERPNT.exe
        - \MSPUB.exe
        - \VISIO.exe
        - \MSACCESS.exe
        - \EQNEDT32.exe
        Image|startswith: C:\users\
        Image|endswith: .exe
      filter:
        Image|endswith: \Teams.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: Did this same rule fire on other hosts in the past 24 hours, and does the cross-host pattern look like coordinated automation or an isolated detection?
  context: >-
    A rule that fires across many hosts on the same day is often tracking a sanctioned add-in or a pushed lure
    reaching many recipients, while a rule that fires on one host alone is the deviation worth chasing. This view
    counts how many hosts produced this detection in the window so the cross-host pattern is visible at a glance.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host -- reconnaissance, credential access,
    defense tampering -- may reveal the stages that preceded the document-driven execution and help reconstruct the
    timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
