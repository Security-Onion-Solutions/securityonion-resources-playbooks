name: Lace Tempest Cobalt Strike Download
id: 1b3406b8-e265-4b5b-8dc0-14656a423fe4
description: |
  Detects a PowerShell command line that contains both the flag sequence `-nop -w hidden -c IEX ((new-object net.webclient).downloadstring(`
  and the literal `/a')`. Both substrings must be present in the same command line. This is a download cradle: PowerShell
  starts with no profile and a hidden window, retrieves the content of a remote URI ending in `/a` as a string, and passes
  it straight to Invoke-Expression, so the fetched script runs in memory and no payload file is written to disk. The `/a`
  URI path is the default staging endpoint used by Cobalt Strike's PowerShell stager, which allocates and runs beacon
  shellcode inside the PowerShell process. Legitimate software distribution and administration rarely combine profile
  suppression, a hidden window, and in-memory execution of remote content in one line, though the same one-liner is a
  standard payload delivery step in licensed red-team and penetration-test tooling. The investigation should extract the
  URL from the command line, determine what launched PowerShell, establish whether the host actually reached the remote
  endpoint, and check whether repeated callbacks to that destination or follow-on process activity occurred.
type: detection
detection_id: aa5b0a40-ed88-46aa-9fdc-0337b379ca9d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the command line contain both `-nop -w hidden -c IEX ((new-object net.webclient).downloadstring(` and a URI
    ending in `/a`?
  context: The rule requires both substrings in the same command line, so confirm both are present before investing further
    time. A command line that fetches remote content into Invoke-Expression while suppressing the profile and the window
    is the pattern being matched; read the full string as recorded, including the URL inside the parentheses.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to fetch and execute remote script content through PowerShell?
  context: Some build servers, packaging hosts, and administrative workstations legitimately run install one-liners that pull
    scripts from an internal web server. Knowing whether this account and this machine have that function is often the fastest
    way to separate routine operations from delivery of an external payload.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this Cobalt Strike stager execution part of an authorized penetration test or red team engagement?
  context: Cobalt Strike is commercially licensed and this exact one-liner is the product's default PowerShell staging
    command, so a sanctioned assessment is a realistic explanation. Check whether an engagement is active against this host
    or network segment and whether its start time, scope, and operator infrastructure match the alert. A confirmed engagement
    with matching timing and destination resolves the alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: Which staging capability was invoked — an in-memory string download, or a variant that writes a payload to disk?
  context: The download cradle family has several forms and they leave different evidence. `downloadstring` piped to IEX
    executes the fetched script in memory and leaves no payload file, so disk-based artifact hunting will come up empty by
    construction; `downloadfile` or an `Out-File` redirection would place a payload on disk instead. Read the method name and
    any output redirection in the command line to decide which evidence trail exists.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Did the alerting PowerShell process write any files to disk in the hour after the alert?
  context: An in-memory cradle writes no payload file, so the expected result here is little or nothing, and an empty result
    is consistent with the pattern rather than evidence the command failed. Files that do appear — a second-stage binary, a
    script under a temp or public directory, a configuration file — indicate the fetched script did more than load shellcode
    and give a path to retrieve and hash.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: What URL does the cradle fetch — extract the scheme, host, port, and URI path from inside the downloadstring call.
  context: The string inside the parentheses is the actionable pivot. Record the host or IP, the port (staging commonly rides
    80 or 443 but any port may be set), and the full URI path; the trailing `/a` is the stager endpoint, and adjacent paths
    such as `/b` serve the 64-bit variant. This query returns every command line on the host in the surrounding window that
    carries the same cradle pattern, so a second staging attempt or a paired 32/64-bit fetch appears alongside the alerting
    one.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
        - -nop -w hidden -c IEX ((new-object net.webclient).downloadstring(
        - /a')
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned this PowerShell instance, and is that parent expected to launch shells?
  context: The parent identifies how the command was delivered. A shell launched by a web or application server process, a
    Java or scripting-engine parent, an Office application, or a remote-execution service points to server-side exploitation
    or a web shell rather than a person at a keyboard; explorer.exe, a management agent, or a deployment service points to
    interactive or administrative use. Follow the parent's own parent when the immediate one is itself a shell.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Did the alerting process actually reach the remote endpoint, and what destination address and port did it connect
    to?
  context: The command line proves the fetch was attempted, not that it succeeded — a blocked egress path, a sinkholed
    destination, or a dead server produces the same command line with no payload. Outbound connections attributed to this
    process confirm delivery and give the destination address to check against reputation data and to pivot on across the
    fleet. If endpoint network telemetry is not collected in this environment, treat an empty result as a visibility gap
    rather than proof the transfer failed.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
  - external_threat_intel
- question: What child processes did the alerting PowerShell instance spawn afterward?
  context: A stager that loads beacon shellcode into its own process often produces no children at all, so an empty result
    does not close the investigation. Children that do appear — a further shell, a copied system binary, a rundll32 or
    msiexec instance, discovery utilities — indicate the fetched script progressed to hands-on activity, and each child's
    image and hash become the next pivot.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - Hashes
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: Delivery is one step in a sequence. Aggregating the parent-child pairs seen in the surrounding window collapses
    routine agent telemetry into a few high-count rows and leaves novel pairs standing out at low counts — reconnaissance
    utilities, credential tooling, archive creation, or a service-hosted process spawning shells are what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
- question: Does this host normally run PowerShell download cradles that fetch remote content over the web client?
  context: This is the wider cradle family rather than the exact string the rule matched — any command line pulling remote
    content through the .NET web client or the built-in web request cmdlets. On a host where package bootstrapping or
    internal tooling uses these one-liners routinely, the count is high and the alerting event needs to be judged on its
    destination and parent; a count of zero or near zero over 90 days makes this a first-of-its-kind execution here.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
        - net.webclient
        - downloadstring(
        - downloadfile(
        - invoke-webrequest
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and
    does the current alert fit that pattern?
  context: The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution
    reflects how this specific cradle pattern has run here before, not generic PowerShell usage. A prior history under a
    deployment parent and a service account reads differently from a first occurrence under a web server process. Deviations
    from the established parent and account are the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - -nop -w hidden -c IEX ((new-object net.webclient).downloadstring(
        - /a')
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user, returning their 90-day history of this exact
    cradle pattern aggregated by host. An account that has never produced it is a different proposition from one that runs it
    on a schedule; weigh the count and host spread against the account's function. Where the alert fires under a service or
    machine account, user identity attributes nothing and the launch-mechanism history carries the answer instead.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - -nop -w hidden -c IEX ((new-object net.webclient).downloadstring(
        - /a')
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this parent process historically driven the rule's pattern on this host or across the environment, or is the
    parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior and the launch mechanism
    is the meaningful pivot: the query mirrors the rule''s selection structure scoped to the alerting parent process, giving
    the 90-day history of this parent driving this exact pattern. A parent that already accounts for a large volume of prior
    events is automation; a parent that has never driven it before is the deviation worth chasing.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - -nop -w hidden -c IEX ((new-object net.webclient).downloadstring(
        - /a')
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the account's activity across every host in the surrounding hour reveals whether the same identity was
    active elsewhere, which distinguishes a single compromised endpoint from movement across several. Under a service or
    machine account this query returns routine agent telemetry in volume and the parent-scoped view is the one that answers
    the question.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this
    host?
  context: 'Under a service principal, asking what else the user did network-wide returns agent noise from every host. The
    question that separates automation from operator activity is whether the same launch mechanism produced this pattern
    elsewhere: the query mirrors the rule''s selection structure scoped to the alerting parent process, fleet-wide, in the
    alert window. Several hosts in the same window points to a pushed or scheduled rollout; a single host points to a
    host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - -nop -w hidden -c IEX ((new-object net.webclient).downloadstring(
        - /a')
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like
    consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this
    exact cradle pattern rather than generic PowerShell usage. Several hosts firing it points to scripted deployment or a
    staged rollout across the estate; one host or a small unrelated set points to manual operator activity. Compare the
    destinations in those command lines — a shared URL across hosts identifies common infrastructure to block and hunt on.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - -nop -w hidden -c IEX ((new-object net.webclient).downloadstring(
        - /a')
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: In-memory staging is a delivery step, and what precedes it locates the entry point. Earlier detections for web
    shell or server-process child spawning, exploitation of an internet-facing service, or defense tampering reconstruct how
    execution was obtained; later ones for injection, credential access, or log clearing show where it went.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
