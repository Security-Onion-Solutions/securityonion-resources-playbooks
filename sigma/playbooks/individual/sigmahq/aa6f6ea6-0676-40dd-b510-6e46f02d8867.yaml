name: Local File Read Using Curl.EXE
id: 1fda3950-c364-4386-a854-919ef5f0c8ce
description: |
  Detects execution of curl.exe (matched by image name or original file name) with a CommandLine containing the file:/// protocol handler, which directs curl to read a local file from disk rather than transfer data over a network. Both conditions must be present for the rule to fire. curl.exe is a built-in Windows binary, and the file:// handler is a documented feature, so legitimate scripting and troubleshooting can produce this pattern; malicious use leverages curl as a living-off-the-land binary to stage, copy, or read sensitive local files while blending in with an allowed binary. Investigation should confirm the exact file path being read, the user and parent that invoked curl, whether the binary ran from an expected path, and whether other living-off-the-land binaries performed related actions on the host.
type: detection
detection_id: aa6f6ea6-0676-40dd-b510-6e46f02d8867
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line match what this rule detects — curl.exe invoked with a file:/// protocol path?
  context: Confirm the alert is a true positive by reviewing the exact command line and process details. The rule requires both that the binary resolves to curl.exe (by image name or original file name) and that the command line contains the file:/// handler. Read the full command line to identify which local file path follows file:/// and whether the binary name or original file name matched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to read local files with curl.exe?
  context: Legitimate scripting, automated provisioning, and manual troubleshooting can call curl with the file:// handler. Knowing whether the user role and host function routinely use command-line transfer tools to read files from disk is often the fastest way to separate routine activity from operator misuse.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What local file did curl.exe read, and what other arguments were on the command line?
  context: The full command line reveals the specific file being read after file:/// and any additional options such as output redirection (-o/-O), upload (-T), or header manipulation. Identify the exact path and assess whether it points to sensitive material like credential stores, configuration files, or other users' data. This query returns curl.exe executions on the host within a few minutes of the alert, so sequential invocations that form one operation are visible together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: 'file:///'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned curl.exe and is that parent chain expected?
  context: The parent process reveals how curl was invoked. Interactive use under explorer.exe or a shell differs from invocation by a script host, an Office application, or another tool, which may indicate scripted or exploited execution. Walk up the chain to see what spawned the parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Was curl.exe executed from an expected path such as System32 or SysWOW64?
  context: A living-off-the-land binary executed from a non-standard path, such as a user profile or temp directory, may have been copied or renamed to evade path-based allowlists. Compare the Image path against the original file name to confirm whether this is the system-shipped curl.exe in its expected location or a relocated copy.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: What child processes did curl.exe spawn afterward?
  context: The processes spawned after curl ran reveal its operational impact. A file read followed by execution of cmd.exe, powershell.exe, or another interpreter may indicate the read file was used to drive further action rather than for benign inspection.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run curl.exe?
  context: A binary that has rarely or never run on a host is more notable than one that runs regularly. Zero or very low historical counts over the window indicate first-time or rare execution of curl on this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the curl file:/// pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even common tools can be abused. This query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how the rule's specific firing pattern has historically run here. A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \curl.exe
      - OriginalFileName: curl.exe
      selection_cli:
        CommandLine|contains: file:///
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \curl.exe
      - OriginalFileName: curl.exe
      selection_cli:
        CommandLine|contains: file:///
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \curl.exe
      - OriginalFileName: curl.exe
      selection_cli:
        CommandLine|contains: file:///
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity on other hosts, the scope of the activity may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \curl.exe
      - OriginalFileName: curl.exe
      selection_cli:
        CommandLine|contains: file:///
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led to the event and what followed, and whether it is part of a larger sequence. Look for reconnaissance, staging, or other file-access activity surrounding the curl execution.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as reconnaissance, defense tampering, or credential access, may reveal the stages that preceded this event and help reconstruct the timeline. The alert sequence on a host often tells the larger story.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were any other download or transfer LOLBins used on this host recently?
  context: Operators who use one living-off-the-land binary to move or read files often use several. If curl read a local file, check whether certutil, bitsadmin, esentutl, or cabinet-extraction tools were also used to stage, copy, or transfer data. Multiple such binaries performing related actions strengthens the case for malicious activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\hh.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: How often has this host fired the curl file:/// pattern over the past 90 days, and what command-line structures are typical?
  context: A living-off-the-land pattern with no prior history on a host is more notable than one used regularly under stable parents. This query mirrors the rule's selection structure scoped to this host, so the count reflects the rule's specific firing pattern rather than generic curl usage. The command-line projection lets the analyst compare typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \curl.exe
      - OriginalFileName: curl.exe
      selection_cli:
        CommandLine|contains: file:///
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
