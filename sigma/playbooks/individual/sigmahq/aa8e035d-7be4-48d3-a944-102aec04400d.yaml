name: Suspicious Extrac32 Execution
id: a4c1c90f-f9fa-4d34-b192-a1bbf3c83ffc
description: |
  Detects extrac32.exe, the signed Microsoft CAB-extraction utility, invoked with a command line that references a .cab archive together with copy/overwrite or UNC switches (/C, /Y, or a UNC path). This pattern repurposes extrac32 as a signed proxy to fetch or copy a payload over SMB or WebDAV, an alternative to certutil or bitsadmin download cradles. Modern administration uses expand or Add-AppxPackage instead, so an extrac32 invocation matching this pattern is worth confirming and tracing to the file it pulled or copied. The rule fires when all of the lolbin, archive, and option selections match together.
type: detection
detection_id: aa8e035d-7be4-48d3-a944-102aec04400d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line invoke extrac32.exe with a .cab reference and the /C, /Y, or UNC switches the rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the full command line against the rule's criteria, which require all three to be present together — the extrac32 identity, a .cab reference, and a copy/overwrite switch (/C or /Y) or a UNC path. Note the source and destination operands; a colon in the destination indicates extraction into an NTFS alternate data stream rather than a plain copy or download.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run extrac32.exe to copy or fetch files?
  context: Legitimate administrative activity can trigger this detection, but extrac32 is rarely used in modern administration for downloads or copies. Knowing whether the user role and host function involve CAB handling, driver installation, or packaging is often the fastest path to distinguishing a routine operation from a signed-binary proxy abuse.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this extrac32 invocation do? Decode the source and destination operands and the switches.
  context: The full command line reveals whether extrac32 copied from a local path, fetched from a UNC or WebDAV location, or wrote into an NTFS alternate data stream. Resolve the source operand (local path versus \\server\share UNC), the destination operand (a plain path, or a path with a colon designating a stream name such as host.txt:hidden.exe), and the switches (/C copy-only, /Y overwrite without prompt). The destination operand is the path the analyst pivots on to confirm the transfer.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned extrac32.exe and is that parent chain expected?
  context: The parent process reveals how extrac32 was invoked. Driver-install and packaging contexts (printer-driver installers, Windows Update components) are the usual legitimate parents. A parent such as cmd.exe, powershell.exe, mshta.exe, wscript.exe, or an Office application outside a CAB-handling context points toward operator-driven or scripted abuse.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Is the file extrac32 copied or fetched still on disk for analysis?
  context: If the command references a destination file (a downloaded or copied payload, or content written into an alternate data stream), checking whether it still exists on disk enables deeper analysis — hash lookups, sandbox submission, or content review. Resolve the destination operand from the command line, including any stream name after a colon.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was extrac32.exe executed from its expected System32 or SysWOW64 path?
  context: extrac32.exe normally lives at C:\Windows\System32\extrac32.exe or C:\Windows\SysWOW64\extrac32.exe. Execution from a user-writable or non-standard path may indicate the binary was copied or renamed to evade path-based allowlists. Compare the Image path against the OriginalFileName to spot a relocated or renamed copy.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Did extrac32.exe open a network connection to an external or remote destination around the time of the alert?
  context: When the command line carries a UNC path or WebDAV target, extrac32 reaches across the network to fetch the source file. A process-initiated connection to an external address or an internal file server confirms the transfer left the host's local disk and identifies the remote endpoint to scope and block. If network telemetry is not collected for this host, treat zero results as a visibility gap rather than evidence no connection occurred.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Did a file actually appear at the destination path after the extrac32 command ran?
  context: An extrac32 copy or fetch command does not guarantee the file arrived. Network errors, a missing WebClient service for WebDAV, blocked shares, or security controls may have stopped the transfer. Confirming file creation at the destination path establishes whether the activity progressed past the delivery stage.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What file did extrac32 produce, and can you retrieve and analyze it?
  context: extrac32 extracts content from a CAB to a destination file — the extracted file is data on disk, and file-creation events carry no hash. Retrieve it from the path below, inspect its content, and hash it manually for a reputation lookup. Files extracted into an alternate data stream are not visible in a normal directory listing and must be enumerated explicitly. If an extracted binary was later executed, its hash is also on its process event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - EventType
- question: What other file activity occurred in the destination directory?
  context: A fetch or copy operation often lands multiple files in the same staging directory, or the retrieved file triggers further writes such as extraction or additional downloads. Examining directory-level file activity reveals the broader scope of the delivery and any follow-on payloads written alongside the alerting file.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What child processes did extrac32.exe spawn afterward?
  context: A plain copy or extraction leaves no children. Processes spawned by extrac32 — or by the file it just delivered — would indicate the transfer fed directly into execution. Watch for cmd.exe, powershell.exe, rundll32.exe, or the fetched binary itself running shortly after.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_lolbas:
      - CommandLine|contains: extrac32.exe
      - Image|endswith: \extrac32.exe
      - OriginalFileName: extrac32.exe
      selection_archive:
        CommandLine|contains: .cab
      selection_options:
        CommandLine|contains:
        - /C
        - /Y
        - ' \\\\'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_lolbas:
      - CommandLine|contains: extrac32.exe
      - Image|endswith: \extrac32.exe
      - OriginalFileName: extrac32.exe
      selection_archive:
        CommandLine|contains: .cab
      selection_options:
        CommandLine|contains:
        - /C
        - /Y
        - ' \\\\'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user drove similar transfer or tooling activity on other hosts, the scope of the operation may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_lolbas:
      - CommandLine|contains: extrac32.exe
      - Image|endswith: \extrac32.exe
      - OriginalFileName: extrac32.exe
      selection_archive:
        CommandLine|contains: .cab
      selection_options:
        CommandLine|contains:
        - /C
        - /Y
        - ' \\\\'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: How often has this host fired the extrac32 copy-or-fetch pattern over the past 90 days, and what command-line structures are typical?
  context: An extrac32 abuse pattern with no prior history on a host is more suspicious than one used regularly under stable parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects the rule's specific firing pattern rather than generic extrac32 usage. The command-line projection lets the analyst compare typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_lolbas:
      - CommandLine|contains: extrac32.exe
      - Image|endswith: \extrac32.exe
      - OriginalFileName: extrac32.exe
      selection_archive:
        CommandLine|contains: .cab
      selection_options:
        CommandLine|contains:
        - /C
        - /Y
        - ' \\\\'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- question: Were any other download or transfer LOLBins used on this host recently?
  context: Operators who use one signed download proxy often use several. If extrac32 was used to fetch or copy a payload, check whether certutil, bitsadmin, curl, esentutl, expand, makecab, or replace were also used for the same objective. Finding multiple transfer LOLBins in the same window strengthens the case for deliberate tooling rather than incidental use.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\hh.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the stages that preceded a signed-binary transfer and help reconstruct the full timeline leading to this event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
