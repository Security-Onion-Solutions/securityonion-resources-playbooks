name: Suspicious Use of PsLogList
id: fb8c1169-c8fe-43fe-8def-1637e4bf5324
description: |
  Detects the PsLogList utility (psloglist.exe / psloglist64.exe, or a renamed copy carrying that OriginalFileName) reading the Security, Application, or System event log with dump and filter flags such as -d, -x, -s, -c, or -g. Reading the Security log in particular surfaces account and logon records, so this is commonly used during account discovery to enumerate users and recent administrative logons. Legitimate administrators and audit tooling also use PsLogList, so the investigation should determine which log was targeted, who ran it and from what parent, and whether the surrounding activity looks like routine log review or post-compromise enumeration.
type: detection
detection_id: aae1243f-d8af-40d8-ab20-33fc6d0c55bc
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line match what this rule detects — psloglist reading the Security, Application, or System log with a dump or filter flag?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when the process is psloglist by name or OriginalFileName AND the command line names one of the event logs (security, application, system) AND carries one of the flags -d, -x, -s, -c, or -g. Confirm all three conditions are present in the actual command line, and note which log was targeted — the Security log is the most account-relevant.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: What exactly did psloglist do? Decode the full command line, including which log was read and what dump or filter flags were applied.
  context: The full command line reveals the specific action. Identify which event log was named (security, application, system), and decode the flags — -d limits to a number of days, -s produces single-line CSV-style output suited to parsing, -x dumps extended detail, -c clears the log after reading, -g exports to a file. The -c flag is destructive and shifts the disposition toward indicator removal rather than pure discovery. The host+binary scope shows whether multiple psloglist invocations ran in sequence against several logs.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is the alerting binary genuinely PsLogList, or a renamed copy whose internal name still reports as psloglist.exe?
  context: The rule matches on either the on-disk name (psloglist.exe / psloglist64.exe) or the embedded OriginalFileName of psloglist.exe. A file renamed to something innocuous but still carrying that OriginalFileName is a masquerading signal, since operators rename Sysinternals tools to blend in. Compare the Image path and file name against the OriginalFileName, since a mismatch, or a copy living in a user-writable or staging directory, raises the suspicion that this is not routine administrative use.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CurrentDirectory
- question: What process spawned psloglist, and is this a normal pattern?
  context: Legitimate log review is typically run from cmd.exe or powershell.exe spawned by explorer.exe (an administrator at a console) or from a known automation or audit script. Discovery commands spawned by unusual parents — Office applications, script interpreters such as wscript.exe or mshta.exe, wmiprvse.exe (remote WMI execution), or wsmprovhost.exe (remote WinRM) — point to automated post-exploitation enumeration rather than hands-on administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Is this user expected to read and export event logs from the command line?
  context: Administrators, help desk, and audit tooling legitimately read event logs for troubleshooting and compliance. Standard users rarely export the Security log with a command-line dumper. The user's role and typical behavior baseline determine whether this is routine log review or anomalous enumeration; a non-administrative or service account reading the Security log is the more suspicious case.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: psloglist.exe
      - Image|endswith:
        - \psloglist.exe
        - \psloglist64.exe
        - \psloglist64a.exe
      selection_cli_eventlog:
        CommandLine|contains:
        - ' security'
        - ' application'
        - ' system'
      selection_cli_flags:
        CommandLine|contains|windash:
        - ' -d'
        - ' -x'
        - ' -s'
        - ' -c'
        - ' -g'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: psloglist.exe
      - Image|endswith:
        - \psloglist.exe
        - \psloglist64.exe
        - \psloglist64a.exe
      selection_cli_eventlog:
        CommandLine|contains:
        - ' security'
        - ' application'
        - ' system'
      selection_cli_flags:
        CommandLine|contains|windash:
        - ' -d'
        - ' -x'
        - ' -s'
        - ' -c'
        - ' -g'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Does this host normally run PsLogList?
  context: A binary that has never run on a host is more suspicious than one that runs regularly. Zero or very low historical counts over the past 90 days indicate first-time or rare execution of the event-log dumper on this endpoint, which is more consistent with operator activity than with established audit routine.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit?
  context: Even common tools can be abused. This query mirrors the rule's full selection — psloglist by name or OriginalFileName, an event-log name, and a dump or filter flag — scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern has historically run here rather than generic binary usage. A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: psloglist.exe
      - Image|endswith:
        - \psloglist.exe
        - \psloglist64.exe
        - \psloglist64a.exe
      selection_cli_eventlog:
        CommandLine|contains:
        - ' security'
        - ' application'
        - ' system'
      selection_cli_flags:
        CommandLine|contains|windash:
        - ' -d'
        - ' -x'
        - ' -s'
        - ' -c'
        - ' -g'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did psloglist spawn afterward?
  context: The processes spawned after a discovery tool reveal its actual impact. PsLogList itself rarely spawns children during normal log review, so any cmd.exe, powershell.exe, certutil.exe, or archive utility launched from it in the hours after the alert may indicate the operator parsing, staging, or exfiltrating the dumped log contents as part of a larger enumeration effort.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single log-dump may be legitimate troubleshooting, but multiple reconnaissance commands in rapid succession — whoami, net user, nltest, dsquery, tasklist — is a signature pattern of post-compromise enumeration. Account discovery via the event log is often paired with native account and domain enumeration tools as the operator builds a picture of users and privileges before the next stage.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, credential access, privilege escalation, or staging activity surrounding the event-log dump.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or enumeration spanning multiple endpoints. If the same user ran event-log dumps or related discovery on several hosts in the same window, the scope of the activity is broader than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: psloglist.exe
      - Image|endswith:
        - \psloglist.exe
        - \psloglist64.exe
        - \psloglist64a.exe
      selection_cli_eventlog:
        CommandLine|contains:
        - ' security'
        - ' application'
        - ' system'
      selection_cli_flags:
        CommandLine|contains|windash:
        - ' -d'
        - ' -x'
        - ' -s'
        - ' -c'
        - ' -g'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: This query mirrors the rule's full selection with no host scope, so the result is a fleet-wide count of the firing pattern rather than generic usage of the binary. Many hosts firing the same pattern points to scripted deployment or audit automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent and binary consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: psloglist.exe
      - Image|endswith:
        - \psloglist.exe
        - \psloglist64.exe
      selection_cli_eventlog:
        CommandLine|contains:
        - ' security'
        - ' application'
        - ' system'
      selection_cli_flags:
        CommandLine|contains|windash:
        - ' -d'
        - ' -x'
        - ' -s'
        - ' -c'
        - ' -g'
      condition: all of selection_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, initial access, or credential access — may reveal the attack stages that preceded this event and help reconstruct the timeline. Account discovery via the event log frequently follows initial foothold and precedes lateral movement.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
