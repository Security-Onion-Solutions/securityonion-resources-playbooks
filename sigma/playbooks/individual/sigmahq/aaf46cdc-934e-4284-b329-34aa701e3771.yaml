name: Uncommon Child Process Of BgInfo.EXE
id: d71bcfa4-cb08-4886-bfda-3e587563f9f9
description: |
  Detects a process spawned by bginfo.exe or bginfo64.exe, the SysInternals
  Background Information utility. BgInfo is a Microsoft-signed binary that parses
  .bgi configuration files, which can embed VBScript that BgInfo evaluates inline -
  so a signed, often allow-listed binary can proxy arbitrary script execution
  without a separate cscript.exe or wscript.exe in the process tree. BgInfo is not
  present on default Windows installs and must be deployed, so its presence as a
  parent of an unexpected child is itself notable; a child such as a command
  interpreter, script host, or network tool points to script-proxy abuse, while a
  benign GUI or display helper may be routine for a deployment that uses BgInfo for
  logon banners. The investigation should identify the spawned child and its
  command line, recover the .bgi file BgInfo read and where it came from, determine
  whether BgInfo loaded a scripting engine, and establish whether the user, host,
  and parent-child pairing are expected.
type: detection
detection_id: aaf46cdc-934e-4284-b329-34aa701e3771
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Is the parent of the alerting process bginfo.exe or bginfo64.exe?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires when a process is spawned with a parent image ending in
    bginfo.exe or bginfo64.exe. Read the parent image of the alerting event together
    with the alerting process image and command line shown in the alert. A child that
    is a command interpreter, script host, or network or download tool is consistent
    with BgInfo proxying script execution; a display or GUI helper may be routine for
    a logon-banner deployment.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: Is this user and host expected to run BgInfo and the process it spawned?
  context: BgInfo is commonly deployed to display system information as a desktop or
    logon banner, so it can be routine on managed workstations. It is not a default
    Windows component and a given account may never invoke it directly. Knowing
    whether the acting account and the host function involve a BgInfo deployment is
    often the fastest way to separate a routine logon banner from a signed binary
    being used to proxy script execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What was BgInfo's own command line, and which .bgi configuration file did
    it read?
  context: BgInfo's command line names the .bgi configuration file it parsed, and the
    .bgi is where embedded VBScript lives. Read the parent command line for a .bgi
    path and for flags such as /popup and /nolicprompt that suppress the interface
    during automated evaluation. The location of the .bgi matters - a path under a
    user-writable directory or a UNC or WebDAV share is the operator-controlled input
    that drives what BgInfo executes, whereas a fixed path under a managed deployment
    directory is more consistent with a sanctioned configuration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: What did the alerting child process actually do? Decode its full command
    line.
  context: The spawned child carries the operation that BgInfo's inline VBScript
    launched. Decode every argument - flags, file paths, URLs, and any base64,
    hex, character-concatenation, or environment-variable substitution. VBScript
    proxied through BgInfo commonly builds a download cradle, a reverse shell, or a
    secondary loader, so the decoded child command line reveals the actual intent
    rather than the benign-looking parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Did BgInfo load a scripting-engine module such as vbscript.dll or
    scrrun.dll around the time of the alert?
  context: When BgInfo evaluates VBScript embedded in a .bgi file it loads a scripting
    engine into its own process, leaving no separate script-host process in the tree.
    A module load of vbscript.dll or scrrun.dll by bginfo.exe is direct evidence that
    the binary ran script inline rather than merely rendering desktop information.
    Absence of such a load points toward BgInfo behaving as a normal display utility;
    if image-load events are not collected in this environment, treat zero results as
    a visibility gap rather than evidence no script ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ParentProcessGuid%'
        ImageLoaded|endswith:
          - \vbscript.dll
          - \scrrun.dll
          - \vbscript.dll.mui
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: What .bgi or script files did BgInfo read or write, and where do they
    live?
  context: The .bgi configuration file is the operator-controlled input that decides
    what BgInfo executes, and an accompanying .vbs may sit alongside it. File access
    to a .bgi or script file from a user-writable directory, a temporary path, or a
    UNC or WebDAV share is the load-bearing artifact - it shows where the executed
    content came from and whether it was stageable by a non-administrator. Recover the
    file so its embedded VBScript can be reviewed; if file events are not collected
    here, fall back to the .bgi path named on BgInfo's command line.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith:
          - .bgi
          - .vbs
          - .vbe
          - .wsf
      condition: selection
    fields:
      - Image
      - TargetFilename
      - User
- question: Did BgInfo or its child process make outbound network connections, or read
    its configuration from a remote share?
  context: A .bgi file can be served from a UNC or WebDAV path, so BgInfo itself may
    reach out to a remote share to fetch the configuration it evaluates, and the
    proxied script frequently opens its own outbound connection for a download cradle
    or command channel. Network activity from a signed system utility or its child to
    an external or unexpected internal address is a strong pivot. Identify the remote
    address and whether it is a known-good deployment share or an operator-controlled
    endpoint.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      filter_local:
        DestinationIp|cidr:
          - 127.0.0.0/8
          - ::1/128
      condition: selection and not filter_local
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: What other child processes did this BgInfo instance spawn?
  context: A signed binary used to proxy execution may launch more than one process -
    reconnaissance, credential access, or a follow-on stage in sequence. Examining
    every child of this BgInfo instance reveals whether the alerting process was a
    single proxied command or one step in a chain. Multiple unrelated children from a
    display utility is not expected behavior.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has bginfo.exe spawned this child binary on this host before?
  context: A parent-child pairing that has never been seen on a host is more notable
    than one that recurs. A BgInfo deployment that drives a display banner has a
    narrow and stable set of child processes, if any; a first-time or rare child
    binary spawned by BgInfo on this host points to a novel use of the binary rather
    than its sanctioned configuration.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith:
        - \bginfo.exe
        - \bginfo64.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith:
        - \bginfo.exe
        - \bginfo64.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether the
    proxied execution was isolated or part of activity spanning multiple endpoints. If
    the same user triggered similar BgInfo-driven activity on other hosts, the scope
    of the incident is larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith:
        - \bginfo.exe
        - \bginfo64.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Is BgInfo spawning this child binary on other hosts across the fleet, and
    does the distribution look like consistent automation or one-off activity?
  context: The same BgInfo-to-child pairing appearing across many hosts points to a
    managed deployment that runs a banner or a shared .bgi by design; one host or a
    small unrelated set points to manual operator activity. A domain-wide BgInfo
    configuration applied to every desktop can be weaponized at scale by injecting
    VBScript into the shared .bgi, so a wide distribution does not by itself clear the
    activity - pair it with whether the .bgi content and source are trusted.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    BgInfo execution reveals what led to it and what followed - the process that
    staged the .bgi, reconnaissance, or follow-on execution the proxied script
    launched. Novel parent-child pairs at low counts are what to scan for against the
    high-count noise of routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - reconnaissance, credential access, or
    defense tampering - may reveal the attack stages that preceded the proxied
    execution and help reconstruct the full timeline. Proxying script through a signed
    binary is often one step in a sequence, so prior alerts give the context for why
    BgInfo was used to run code here.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Is the alerting child's command line or the .bgi-embedded script encoded or
    obfuscated, and what does it decode to?
  context: 'Content proxied through BgInfo is frequently hidden from casual inspection.
    Common encodings: base64, hex, URL-encoding, VBScript Chr() chains and string
    concatenation, and environment-variable substitution. Decoding reveals the actual
    intent - a download cradle, a reverse shell, credential theft, or an in-memory
    loader. Reconstruct any Chr() chain or concatenated string in the VBScript, and
    decode any encoded argument on the spawned child''s command line, iterating
    through multiple layers until the payload is readable.'
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
