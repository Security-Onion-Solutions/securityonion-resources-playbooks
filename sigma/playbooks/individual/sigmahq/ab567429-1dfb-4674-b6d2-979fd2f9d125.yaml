name: Internet Explorer DisableFirstRunCustomize Enabled
id: 1fe010f6-6de9-4acc-b5b6-f60d8cec893b
description: |
  Detects a registry write that sets the Internet Explorer DisableFirstRunCustomize value under
  ...\Microsoft\Internet Explorer\Main to DWORD 1 or 2 by a process other than the expected system
  binaries (explorer.exe, ie4uinit.exe) and known benign installers. The rule fires when the selection
  matches AND none of the excluded writing processes match. This value suppresses the Internet Explorer
  first-run/welcome wizard, which lets a script or automation drive Internet Explorer without an
  interactive prompt blocking it. The setting is written legitimately during Windows and Internet
  Explorer setup and by some software installers, but it is also set by tooling that scripts or weakens
  Internet Explorer - frequently alongside other Internet Explorer security-setting changes (Enhanced
  Security configuration, zone maps, default-browser or home-page checks) - as a precursor to using the
  browser for automated command-and-control or to suppress user-facing prompts. Investigate which process
  wrote the value and what launched it, whether other Internet Explorer settings changed in the same
  session, whether Internet Explorer was subsequently launched or automated, and whether the change is new
  to this host.
type: detection
detection_id: ab567429-1dfb-4674-b6d2-979fd2f9d125
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting write set DisableFirstRunCustomize to DWORD 1 or 2 from a process other than the expected system binaries?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a value
    whose path ends in \Microsoft\Internet Explorer\Main\DisableFirstRunCustomize is set to DWORD
    (0x00000001) or DWORD (0x00000002) AND the writing process is not one of the expected sources
    (explorer.exe, ie4uinit.exe) or the known benign installers the rule filters out. Review the exact
    TargetObject and Details on the triggering event to confirm the value data and that the write did not
    come from an excluded process. Both DWORD values suppress the first-run wizard, so either one satisfies
    the rule.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify Internet Explorer configuration settings?
  context: >-
    Legitimate administrative activity and software installers can set this value, so knowing whether the
    writing account and host function are consistent with a sanctioned change is often the fastest way to
    separate routine setup from suspicious tampering. A general user account or an unexpected host writing
    this key outside of an install or imaging window is more notable than a management process doing so.
    User attribution is present on roughly 94% of endpoint registry events; when it is a machine account or
    missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which Internet Explorer value was written, and why is this an evasion-relevant location?
  context: >-
    The key ...\Microsoft\Internet Explorer\Main\DisableFirstRunCustomize controls whether Internet
    Explorer runs its first-run/welcome wizard the first time the browser is opened after install.
    Suppressing that wizard removes an interactive prompt that would otherwise block a script from silently
    driving the browser, which is why the value is often set as a preparatory step before Internet Explorer
    is automated. Confirming the exact path and the writing process establishes that this is the
    first-run-suppression setting rather than an unrelated Internet Explorer edit, and sets up decoding the
    value data.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What DWORD value was written, and what does it mean?
  context: >-
    The Details field holds the value data. Both DWORD (0x00000001) and DWORD (0x00000002) disable the
    Internet Explorer first-run customization wizard; the two values differ only in which first-run flow is
    suppressed, and either one produces the same practical effect of removing the interactive prompt.
    Confirm which value was set - a non-default DWORD here means the wizard was deliberately turned off,
    which is what allows unattended or scripted use of the browser. Details is present on roughly 79% of
    registry modifications and should be populated for this value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote this value, and what launched that process?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to read its
    Image, full command, and parent. A write from a script host such as wscript.exe, cscript.exe, or
    mshta.exe, from powershell.exe or cmd.exe, or from an unsigned binary launched by an Office application
    or a browser points to the setting being staged programmatically rather than a deliberate administrator
    edit or an installer. The parent chain distinguishes scripted tampering from routine setup.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What else did the process that wrote this value spawn?
  context: >-
    A process that sets this value to enable silent browser automation often goes on to launch the browser,
    a scripting host, or additional tooling. Listing the child processes of the writing process reveals
    whether it drove Internet Explorer, dropped a payload, or ran further commands as part of the same
    operation. Novel children such as iexplore.exe, mshta.exe, rundll32.exe, or an unsigned binary tie the
    registry edit to what the operation actually did next.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did this value persist, or was it re-modified afterward?
  context: >-
    Registry key or value deletions are not observable in this telemetry, so durability is judged from the
    value's re-modification history rather than from a delete event. A value that is set once and left in
    place keeps the first-run wizard suppressed and the browser primed for unattended use; a later write
    that restores the default or changes the value again may indicate cleanup or an installer sequence.
    Compare the Details values written to this key over the following window to see whether the setting held
    and which process touched it.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was Internet Explorer subsequently launched or automated on this host?
  context: >-
    Suppressing the first-run wizard has practical value only if the browser is then used, so checking
    whether iexplore.exe ran after the setting was written establishes whether the change took effect. An
    Internet Explorer launch whose parent is a script host, an Office application, or svchost.exe - rather
    than an interactive user shell - indicates the browser was driven programmatically, which is the purpose
    the first-run suppression enables. If no launch appears, the setting may have been staged ahead of later
    use.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\iexplore.exe'
      condition: selection
    fields:
      - ParentImage
      - CommandLine
      - User
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor who weakens one browser or security setting often makes several changes in the same session.
    Clustering the registry writes on this host in a short window around the alert reveals the full scope of
    the configuration changes and which process made them. The triggering key appears in the results; the
    signal is what else was modified - additional browser settings, security-policy edits, or persistence
    keys landing together point to a hands-on session or an installer-style implant rather than an isolated
    edit.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Were other Internet Explorer Main or Internet Settings keys modified on this host around the same time?
  context: >-
    The first-run-suppression value is commonly one of a set of Internet Explorer settings changed together
    to weaken the browser and enable unattended use - for example Enhanced Security configuration, zone
    maps, home-page or default-browser checks, and other values under Internet Explorer\Main. Finding
    several Internet Explorer configuration keys modified by the same process in a short window is a stronger
    indication of deliberate browser tampering than this single value on its own. Compare the value data and
    writing process across the matching keys.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_ie:
        TargetObject|contains:
          - '\Internet Explorer\Main\'
          - '\Internet Settings\Zones\'
          - '\Internet Settings\ZoneMap\'
      condition: selection and selection_ie
    fields:
      - TargetObject
      - Details
      - Image
- question: Does this host normally run the process that wrote this value?
  context: >-
    A writing process that has never been seen on this host, or is seen only rarely, is more notable than
    one that runs regularly as part of setup or management. Historical frequency of the writing binary over
    a long window helps calibrate whether this change came from an established process on the host or from
    something new. Zero or very low counts indicate first-time or rare execution.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Has this Internet Explorer value been modified before on this host?
  context: >-
    A value that has changed before on this host - during imaging, an install, or routine management - is
    less notable than a first-time change. A history with no prior writes makes this a new modification and
    raises its weight, while a history of periodic writes points to a management process or an installer.
    Compare the historical Details values to see whether the same value was set before or whether this write
    is unique to this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same value modified on other hosts in the environment?
  context: >-
    The same write across many hosts suggests a broad tool run, a group-policy change, or a mis-scoped
    deployment; the same write confined to one host suggests targeted activity. Compare the Details values
    and writing process across hosts to see whether they all set the value the same way, which separates a
    single hands-on operation from a management change rolling out across the environment. False positives
    from group policy and user settings are expected here.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Configuration tampering rarely happens in isolation. Aggregating process activity in a tight window
    around the alert surfaces what led up to the registry write and what ran immediately after it. Novel
    parent-child pairs stand out at low counts against high-count routine telemetry, which is what points to
    the tool that made the change and any follow-on actions such as browser automation or payload
    execution.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, execution of scripting tools, or other defense
    tampering - may reveal the stages that preceded this change and help reconstruct the timeline. Weakening
    a browser setting is typically a means to a later objective, so prior alerts help place this registry
    write within a larger sequence rather than treating it as a standalone event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
