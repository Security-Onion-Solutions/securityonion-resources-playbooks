name: Disable Macro Runtime Scan Scope
id: 9001a84b-329f-4d9d-9c89-aaa0d391e818
description: |
  Detects a registry write that sets the MacroRuntimeScanScope value under the Office Common\Security
  key to DWORD 0x00000000, which turns off runtime scanning of enabled Office macros. That setting is
  what allows the Antimalware Scan Interface to inspect the behavior of a running VBA macro even when
  the macro source is heavily obfuscated; setting it to 0 removes that inspection so an obfuscated or
  polymorphic macro payload can execute without a runtime verdict. Legitimate changes to this value are
  rare and normally arrive through policy or an administrator, so investigate which process wrote it and
  what launched that process, whether other Office macro-security settings were weakened in the same
  session, whether an Office application subsequently spawned script interpreters, and whether the value
  remained disabled or was reverted.
type: detection
detection_id: ab871450-37dc-4a3a-997f-6662aa8ae0f1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting write set the MacroRuntimeScanScope value under Office Common\Security to DWORD 0x00000000?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a value
    whose path contains \SOFTWARE\, \Microsoft\Office\ and \Common\Security and ends in
    \MacroRuntimeScanScope is written AND the value data is DWORD (0x00000000). Review the exact
    TargetObject and Details on the triggering event to confirm both the key path and the zero value data.
    A value of 0 fully disables runtime macro scanning, so this is the setting being turned off rather than
    tightened.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to change Office macro-security policy?
  context: >-
    The MacroRuntimeScanScope value effectively never changes through normal end-user activity and is
    usually managed centrally when it changes at all. Knowing whether the writing account and host function
    match a sanctioned configuration change is the fastest way to separate managed policy or testing from a
    live attempt to weaken macro defenses. User attribution is present on roughly 94% of endpoint registry
    events; when it is a machine account or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which Office security value was written, and why is this key an AMSI-evasion location?
  context: >-
    The MacroRuntimeScanScope value under the Office Common\Security key controls whether the Antimalware
    Scan Interface receives the behavior log a running macro produces. Setting it to 0 stops that runtime
    inspection, so a macro can reach high-risk API calls without producing a scan verdict. Confirming the
    exact path and writing process establishes that this is the macro-runtime-scanning control rather than
    an unrelated Office setting, and sets up decoding the value data.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value data was written, and what state does it put macro runtime scanning in?
  context: >-
    The Details field holds the DWORD written to MacroRuntimeScanScope. A value of 0 disables runtime
    scanning entirely, whereas the enabled states scan macros in low-trust or all documents. A write of 0
    is a deliberate downgrade of the protection, not a routine toggle. Details is present on roughly 79% of
    registry modifications and should be populated for this DWORD value; read it to confirm the setting was
    set to the fully-disabled state.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote this value, and what launched that process?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to read its
    Image, full command, and parent. A reg.exe or regedit.exe import, a powershell.exe or cmd.exe write, or
    a write coming from an Office application or a script host such as wscript.exe or mshta.exe points to
    the setting being changed programmatically rather than through a deliberate administrator action. The
    parent chain distinguishes a scripted downgrade from an interactive console change or a policy client.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Were other Office macro-security settings weakened on this host around the same time?
  context: >-
    Disabling runtime macro scanning is often one of several settings changed together to clear a path for
    a macro payload - enabling all macros through VBAWarnings, granting programmatic access to the VBA
    object model through AccessVBOM, or disabling protected view. Listing writes to these Office security
    value names on this host shows whether macro defenses were downgraded as a group, which points to a
    deliberate effort rather than a single incidental change.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Microsoft\Office\'
      selection_values:
        TargetObject|endswith:
          - '\VBAWarnings'
          - '\AccessVBOM'
          - '\MacroRuntimeScanScope'
          - '\DisableInternetFilesInPV'
          - '\BlockContentExecutionFromInternet'
      condition: selection and selection_values
    fields:
      - TargetObject
      - Details
      - Image
- question: After this write, did an Office application spawn script interpreters or other suspicious children on this host?
  context: >-
    The payoff of disabling runtime macro scanning is a macro that executes without a scan verdict, and a
    macro reaches external effect by spawning a child process. Office applications spawning powershell.exe,
    cmd.exe, wscript.exe, cscript.exe, mshta.exe, rundll32.exe, or regsvr32.exe shortly after the setting
    was disabled is the behavior the removed protection would otherwise have inspected. Such a child chain
    ties the configuration change to macro execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_office_parent:
        ParentImage|endswith:
          - '\winword.exe'
          - '\excel.exe'
          - '\powerpnt.exe'
          - '\outlook.exe'
          - '\mspub.exe'
          - '\msaccess.exe'
      selection_child:
        Image|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\cmd.exe'
          - '\wscript.exe'
          - '\cscript.exe'
          - '\mshta.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
      condition: selection and selection_office_parent and selection_child
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Does the setting remain disabled, or was the value later changed again on this host?
  context: >-
    Registry key or value deletions are not observable in this telemetry, so durability is judged from the
    value's re-modification history rather than from a delete event. A later write that restores
    MacroRuntimeScanScope to an enabled state indicates the change was reverted, possibly to hide it once a
    macro had run, while the value staying at 0 leaves runtime scanning off for every macro opened
    afterward. Compare the Details values written to this key over the following window.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Has this MacroRuntimeScanScope value been modified before on this host?
  context: >-
    Office macro-security policy should change rarely and only through deliberate action, so a history with
    no prior writes makes this a first-time change and raises its weight. A history of periodic writes of
    the same value points instead to a management process or a repeatedly run configuration tool. Compare
    the historical Details values to see whether the setting was disabled before or whether this is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same value modified on other hosts in the environment?
  context: >-
    The same write across many hosts suggests a policy rollout or a broadly run tool; the same write
    confined to one host suggests a targeted downgrade. Compare the Details values and the writing process
    across hosts to see whether they all disable runtime scanning the same way, which separates a managed
    or mis-scoped policy change from repeated hands-on use of the technique across the environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor who weakens one security setting often makes other configuration changes in the same session -
    additional policy edits, persistence keys, or defense-tampering values. Clustering the registry writes
    on this host in a short window around the alert reveals the full scope of changes and which process made
    them. The triggering key appears in the results; the signal is what else was modified and by which
    process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Weakening macro defenses rarely happens in isolation. Aggregating process activity in a tight window
    around the alert surfaces what led up to the registry write and what ran immediately after it. Novel
    parent-child pairs stand out at low counts against high-count routine telemetry, which is what points to
    the tool that changed the setting and to any payload that ran once scanning was off.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, execution of scripting tools, or other defense
    tampering - may reveal the stages that preceded this change and help reconstruct the timeline. Disabling
    macro runtime scanning is a preparatory move for macro-based execution, so prior alerts help place this
    write within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Does the user or an administrator recall making this Office macro-security change?
  context: >-
    The MacroRuntimeScanScope value has no routine reason to change, so direct confirmation from the account
    owner or the responsible administrator is a fast way to resolve the alert. If a sanctioned configuration
    change, a software deployment, or authorized testing set the value, that closes it; if no one recalls
    the action, the account may be compromised or the change was made by automated tooling, and the
    investigation should continue into the writing process and any macro execution that followed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
