name: Suspicious Redirection to Local Admin Share
id: 74fb4728-512e-4596-adbb-ecd20d00dc85
description: |
  Detects a command line that redirects output (using the > operator) into the local ADMIN$ share on the
  loopback address, addressed as either \\127.0.0.1\admin$\ or \\localhost\admin$\. Writing command output
  to the local admin share over loopback is the canonical output-collection pattern of remote-execution
  tooling that runs commands on a host and captures their stdout/stderr to a file on the same host's
  ADMIN$ share, so the machine serves as both the execution target and the output drop. The rule fires only
  when both a redirection operator and an admin-share loopback path appear in the same command line.
  Investigation should determine what command was being run, what process launched it, whether the launch
  mechanism resembles remote service or task execution, and whether the redirected output was followed by
  data collection or movement.
type: detection
detection_id: ab9e3b40-0c85-4ba1-aede-455d226fd124
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line redirect output into the local ADMIN$ share on the loopback address?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact
    command line. The rule fires only when the command line contains both a redirection operator and a
    loopback admin-share path (\\127.0.0.1\admin$\ or \\localhost\admin$\). Confirm both elements are present
    and read what is being executed and where its output is being written.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to write command output to the local admin share over loopback?
  context: Legitimate administrative scripting rarely redirects output into the loopback ADMIN$ share; this
    addressing form is most associated with remote-execution tooling rather than interactive use. Knowing
    whether the user role and host function involve remote administration or automated command execution is
    often the fastest path to distinguishing a true positive from routine operations.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What command was being executed, and what output was redirected into the admin share?
  context: The full command line reveals the actual operation. Decode the portion before the redirection
    operator to identify what command or binary was run (an enumeration command, a credential tool, a
    stager), and read the admin-share target path including any filename pattern. A timestamped or
    pseudo-random filename under admin$ is consistent with automated stdout capture by remote-execution
    tooling. The query returns command lines on this host that wrote to the loopback admin share in the
    surrounding window, which may include sequential commands that together form one operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_redirect:
        CommandLine|contains: '>'
      selection_share:
        CommandLine|contains:
        - \\\\127.0.0.1\\admin$\\
        - \\\\localhost\\admin$\\
      selection_host:
        host.name|expand: '%hostname%'
      condition: selection_redirect and selection_share and selection_host
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this command, and is that parent chain consistent with remote execution?
  context: The parent process reveals how the command was invoked. Output redirection to the loopback admin
    share is closely tied to remote service and task execution mechanisms, so parents such as services.exe,
    a transient service host, wmiprvse.exe, or a scheduling host point toward remotely driven execution
    rather than interactive use. Walk up the tree to see what spawned the parent and what else it launched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Does an anomalous parent-child relationship around this command suggest remotely driven execution?
  context: Output capture to the loopback admin share is the stdout-collection leg of remote-execution
    frameworks that create a transient service or scheduled task to run a command and write its results back
    to admin$. Look on this host for command interpreters or tools spawned by a newly created or short-lived
    service host, by a WMI provider host, or by a task scheduler engine in the alert window. Such parents,
    rather than explorer.exe or a logged-on user's shell, indicate the command did not originate from
    interactive local use.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - ParentImage
      - Image
- question: When this host previously fired this redirection pattern, what parents and users drove it, and does the current alert fit?
  context: Even routine automation can write to admin shares. The query mirrors the rule's selection
    structure scoped to this host, so the resulting parent and user distribution reflects how this specific
    redirection pattern has historically run here rather than generic command usage. A new parent process,
    an unexpected account, or a first-time appearance of the pattern is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_redirect:
        CommandLine|contains: '>'
      selection_share:
        CommandLine|contains:
        - \\\\127.0.0.1\\admin$\\
        - \\\\localhost\\admin$\\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this redirection pattern in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of this redirection pattern rather than generic command usage. Many hosts firing the
    same pattern points to scripted deployment or a management tool that uses admin-share output capture;
    a single host or a small unrelated set points to manual operator activity. Use the host distribution to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_redirect:
        CommandLine|contains: '>'
      selection_share:
        CommandLine|contains:
        - \\\\127.0.0.1\\admin$\\
        - \\\\localhost\\admin$\\
      condition: all of selection_*
    fields:
    - host.name
- question: What other commands ran on this host around the same time?
  context: Output capture to the admin share commonly accompanies a sequence of remotely issued commands
    such as host and account enumeration, credential access, or staging. Activity surrounding the detected
    command may reveal those adjacent stages and provide broader context for the investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What file was written to the admin share, and was the redirected output then collected or moved?
  context: The redirection target names a file under the loopback ADMIN$ share, which on disk maps into the
    Windows directory of the same host. That file holds the captured command output. Look for creation of
    that file and for any subsequent read, copy, archive, or outbound transfer from the host, since
    redirected enumeration or credential output is often gathered and then moved off the host. The scope of
    what was written and where it went determines the severity of potential data loss.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: 'ADMIN$'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did this command run outside the host's normal working hours or in a tight automated burst?
  context: Remote-execution output capture is frequently driven by an operator or a script in a short
    sequence, and after-hours timing on a host that is normally idle then is a meaningful deviation. Compare
    the event timestamp against the host's typical active window and check whether the surrounding admin-share
    redirections cluster into a tight burst rather than spreading across normal business activity.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_redirect:
        CommandLine|contains: '>'
      selection_share:
        CommandLine|contains:
        - \\\\127.0.0.1\\admin$\\
        - \\\\localhost\\admin$\\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_redirect:
        CommandLine|contains: '>'
      selection_share:
        CommandLine|contains:
        - \\\\127.0.0.1\\admin$\\
        - \\\\localhost\\admin$\\
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_redirect:
        CommandLine|contains: '>'
      selection_share:
        CommandLine|contains:
        - \\\\127.0.0.1\\admin$\\
        - \\\\localhost\\admin$\\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or repeated execution
    across endpoints. If the same user drove similar admin-share redirection on multiple hosts, the scope of
    the operation may be larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_redirect:
        CommandLine|contains: '>'
      selection_share:
        CommandLine|contains:
        - \\\\127.0.0.1\\admin$\\
        - \\\\localhost\\admin$\\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led to this
    event and what happened after, and whether it is part of a larger sequence. Look for reconnaissance,
    privilege escalation, or persistence mechanisms surrounding the redirected command.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as defense
    tampering, reconnaissance, or credential access, may reveal the stages that preceded this event and help
    reconstruct the full timeline of the activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
