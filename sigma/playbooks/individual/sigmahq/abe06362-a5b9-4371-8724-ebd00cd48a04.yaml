name: Potential Exploitation of RCE Vulnerability CVE-2025-33053
id: dd388d5f-1dd3-419e-8687-61922edb1214
description: >-
  Detects a process named route.exe, netsh.exe, makecab.exe, dxdiag.exe, ipconfig.exe or explorer.exe
  spawned by iediagcmd.exe or CustomShellHost.exe, running from outside System32/SysWOW64, where
  either the child's image path or its working directory points at a remote location — a path
  beginning with a UNC prefix, or a path containing the WebDAV redirector marker \DavWWWRoot\.
  CVE-2025-33053 lets an attacker control the working directory of one of these built-in utilities
  (typically through an internet shortcut file whose WorkingDirectory points at a remote WebDAV
  server); the utility then resolves a helper binary by search order and runs an attacker-supplied
  file of the same name from the remote path instead of the System32 original, so a trusted,
  signed launcher executes remote code. The investigation should determine which branch of the
  remote-path condition fired, whether the remote location is attacker-controlled or a known
  internal share, what the executed file actually is and did, and whether the host carries the
  patch for this CVE — a patched host points toward a failed attempt or a false positive rather
  than execution.
type: detection
detection_id: abe06362-a5b9-4371-8724-ebd00cd48a04
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Did iediagcmd.exe or CustomShellHost.exe spawn one of the six named binaries from outside
    System32, with either the image path or the working directory on a UNC or WebDAV location?
  context: >-
    Confirm all three parts before investing time — the parent is iediagcmd.exe or
    CustomShellHost.exe, the child is one of route.exe, netsh.exe, makecab.exe, dxdiag.exe,
    ipconfig.exe or explorer.exe, and the child is not under C:\Windows\System32\ or
    C:\Windows\SysWOW64\. The remote-path part fires on any ONE of four alternative branches, and
    which one fired changes what the alert means. If Image starts with a UNC prefix or contains
    \DavWWWRoot\, the executed file itself was fetched from the remote location and the search-order
    redirect completed — questions about the file's identity and its child processes carry the
    weight. If only CurrentDirectory is remote, the working directory was redirected but the binary
    that ran may still be a local copy, so the payload may not have landed. Record the branch and
    the full remote path.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CurrentDirectory
  answer_sources:
  - alert
  - process_creation
- question: What started iediagcmd.exe or CustomShellHost.exe, and was its working directory set by the caller?
  context: >-
    Neither utility is a routine launcher for these binaries, so the parent's own origin is the
    load-bearing detail. This CVE is driven from the caller side — an internet shortcut file, a
    script, or a command line that starts the utility with WorkingDirectory pointing at a remote
    WebDAV server. A grandparent such as a browser, mail client, explorer.exe following a
    double-clicked .url file, or a script interpreter points at user-delivered content; a
    grandparent that is an IT management agent points at packaged administration. The parent's own
    command line often carries the argument set that selects the search-order path.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other child processes did the same parent instance spawn?
  context: >-
    The exploited utility performs its own normal work as well, so it may spawn several children in
    one run. Additional children from the same parent instance separate the one redirected helper
    from the utility's legitimate helpers, and show whether more than one search-order slot was
    taken. Children beyond the six named binaries — a shell, a script host, an unfamiliar
    executable — indicate the executed file went on to stage further work.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Is this user and host expected to run Internet Explorer diagnostics or shell-host tooling against a remote share?
  context: >-
    iediagcmd.exe is an Internet Explorer network diagnostics utility and CustomShellHost.exe is a
    kiosk/custom-shell launcher; neither is common in day-to-day use, and running either with a
    working directory on a remote share is rarer still. A support engineer reproducing a browser
    problem or a kiosk build being tested from a deployment share are plausible benign answers. Also
    establish whether this host has the CVE-2025-33053 update installed — on a patched host the
    working-directory redirect does not resolve to the remote file, which points toward a failed
    attempt rather than execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Did the alerting process or its direct children write any files to disk?
  context: >-
    Files written by the executed binary or its children are the artifacts available for hashing,
    review, or detonation. Loaders delivered this way commonly write a decoy document to open in
    front of the user, a staged second-stage payload, or a log/keystroke file under a temp
    directory. This correlates writes to the alerting process and its direct children only, not to
    grandchildren or unrelated writers.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What arguments did the executed binary receive, and what working directory did it run from?
  context: >-
    The command line and working directory together describe the operation. The real System32
    utilities take a well-known argument set (route print, netsh interface show, ipconfig /all); an
    argument set that does not fit the name it is running under, or an empty command line where the
    name normally takes parameters, indicates the file is not the utility it is imitating. The
    working directory is the remote path the caller supplied and identifies the server and share the
    file came from. This is scoped to all runs of this binary name on the host in the window, which
    also surfaces any legitimate System32 run of the same name for comparison.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: Is the executed file actually the Microsoft utility its filename claims to be?
  context: >-
    The rule's six names — route.exe, netsh.exe, makecab.exe, dxdiag.exe, ipconfig.exe,
    explorer.exe — are all genuine Windows binaries under System32, and the whole point of
    search-order redirection is that an attacker-supplied file inherits the trust of a familiar
    name. Take the hash of the file that actually ran and check its reputation, and check the
    signature: the System32 originals are Microsoft-signed, while a file staged on a remote share
    under the same name is typically unsigned or signed by an unrelated party. A hash that does not
    match the known-good binary for this Windows build means the name is borrowed, not inherited.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Hashes
      - Image
  answer_sources:
  - process_creation
  - external_threat_intel
- question: What modules did the executed process load, and were any unsigned or loaded from the remote path?
  context: >-
    Module loads describe what the executed file is built to do in a way its command line does not.
    Loaders delivered through search-order redirection commonly map core system libraries manually
    to avoid the normal load path, and pull their own supporting DLLs from the same remote directory
    the executable came from. Unsigned modules, modules loaded from a UNC or \DavWWWRoot\ path, and
    an unusually small or unusually broad module set for the name the process is running under are
    all worth recording. If module-load telemetry is not collected in this environment, treat zero
    results as a visibility gap rather than evidence nothing loaded.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
  answer_sources:
  - process_creation
  - edr_console
- question: Did the WebDAV redirector cache any remote files locally on this host?
  context: >-
    When a process executes a file over WebDAV, the redirector materializes the content into a local
    cache directory before it runs, which leaves a local copy of a remotely hosted file even though
    the process image path points at the remote server. Those cached paths, and any path containing
    the \DavWWWRoot\ marker, are where the delivered file can be recovered for hashing and analysis
    after the remote server goes offline. The literal path fragments are matched directly rather
    than derived from the alert, so this returns cache activity from any process on the host, not
    only the alerting one.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_dav:
        TargetFilename|contains:
          - '\Tfs_DAV\'
          - '\DavWWWRoot\'
          - '\WebDAV\'
      condition: selection and selection_dav
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
- question: Which remote server did this host reach for the file, and is that destination internal or external?
  context: >-
    The remote path in the alert names a server; this shows whether the host actually connected to
    it and over what channel. WebDAV over HTTP/HTTPS uses ports 80 and 443 and the connection is
    usually made by the WebDAV client service rather than by the utility itself, so do not expect
    the alerting process name on the connection; a plain UNC path instead uses port 445. Separate
    internal file-server ranges, which suggest a deployment share, from destinations outside the
    organization's address space, which indicate remotely hosted content. Resolve the destination
    address and check its reputation and registration age.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 80
          - 443
          - 445
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
  answer_sources:
  - network_connection
  - external_threat_intel
- question: If a further payload was executed, what is its hash — and is it known to threat intelligence?
  context: >-
    The hash needed for a reputation lookup or detonation is recorded when a file runs, not when it
    is written — file-creation events carry no hash in this telemetry. This returns the processes
    that the executed binary and its siblings under the same parent spawned, with their executable
    hashes; for a loader that fetches and runs a second stage, that is the payload. If the payload
    was run later by an unrelated process it will not appear here — recover the file from the
    on-disk path surfaced by the WebDAV cache question and hash it manually.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      selection_siblings:
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: 1 of selection_*
    fields:
      - Image
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: Has this parent spawned this child binary on this host before?
  context: >-
    iediagcmd.exe spawning route.exe or netsh.exe, and CustomShellHost.exe spawning explorer.exe,
    do occur legitimately — that is precisely why these utilities are usable for search-order
    redirection. The 90-day history separates a pairing the host produces routinely from one
    appearing for the first time. Compare the working directories in the results: a history of the
    same pairing running from local paths, with only today's run pointing at a remote location,
    isolates the deviation to the path rather than to the pairing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CurrentDirectory
  answer_sources:
  - process_creation
- question: Is this parent-child spawning pattern occurring on other hosts?
  context: >-
    The same utility spawning the same binary across several hosts distinguishes a delivery attempt
    reaching multiple recipients from a single targeted host. Where a shortcut file or link is
    distributed to a group, several hosts produce the pairing within a short window. A pairing that
    appears broadly and constantly across the fleet instead suggests an application or management
    task that uses these utilities routinely, which reframes the alerting run as a path anomaly on
    one host.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CurrentDirectory
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of this specific remote-path execution pattern, not generic use of the six
    binaries, aggregated by host. A user who has never produced this pattern is the more interesting
    case; a user who produces it regularly is likely working with an application or a support
    workflow that drives these utilities from a share. Weigh the count against the user's role.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage:
        - C:\Program Files\internet explorer\iediagcmd.exe
        - C:\Windows\System32\CustomShellHost.exe
      selection_child_current_dir:
      - CurrentDirectory|startswith: \\\\
      - CurrentDirectory|contains: \DavWWWRoot\
      - Image|contains: \DavWWWRoot\
      - Image|startswith: \\\\
      selection_child_img:
        Image|endswith:
        - \route.exe
        - \netsh.exe
        - \makecab.exe
        - \dxdiag.exe
        - \ipconfig.exe
        - \explorer.exe
      filter_main_system:
        Image|startswith:
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Has this parent process historically driven the rule's pattern on this host or across the environment, or is the parent new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute the behavior;
    the launch mechanism does. The query mirrors the rule's selection structure scoped to the
    alerting parent, so the result is the 90-day history of this utility driving this remote-path
    execution pattern, not generic parent-and-binary co-occurrence. A parent that is new or rare for
    this pattern is the deviation worth chasing; a parent already accounting for a long history of
    such events points to an application or operating-system workflow that uses these utilities from
    a share by design.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage:
        - C:\Program Files\internet explorer\iediagcmd.exe
        - C:\Windows\System32\CustomShellHost.exe
      selection_child_current_dir:
      - CurrentDirectory|startswith: \\\\
      - CurrentDirectory|contains: \DavWWWRoot\
      - Image|contains: \DavWWWRoot\
      - Image|startswith: \\\\
      selection_child_img:
        Image|endswith:
        - \route.exe
        - \netsh.exe
        - \makecab.exe
        - \dxdiag.exe
        - \ipconfig.exe
        - \explorer.exe
      filter_main_system:
        Image|startswith:
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts around the alert shows whether the activity is
    confined to this endpoint. Delivery of a shortcut or link to one recipient normally produces
    activity on the one host they use; the same account driving comparable activity on several hosts
    at once points at credential use beyond the recipient. If the alert fired under SYSTEM or
    another service principal, this returns routine service telemetry and the parent-scoped view of
    the same window is the meaningful answer.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, asking what else the user did across the network returns routine
    service telemetry from every host. The meaningful question is whether the same launch mechanism
    fired elsewhere: the query mirrors the rule's selection structure scoped to the alerting parent,
    fleet-wide, in the alert window. Several hosts in the same window points to a pushed or
    scheduled trigger, or to a link delivered to multiple recipients; a single host points to a
    host-local trigger.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage:
        - C:\Program Files\internet explorer\iediagcmd.exe
        - C:\Windows\System32\CustomShellHost.exe
      selection_child_current_dir:
      - CurrentDirectory|startswith: \\\\
      - CurrentDirectory|contains: \DavWWWRoot\
      - Image|contains: \DavWWWRoot\
      - Image|startswith: \\\\
      selection_child_img:
        Image|endswith:
        - \route.exe
        - \netsh.exe
        - \makecab.exe
        - \dxdiag.exe
        - \ipconfig.exe
        - \explorer.exe
      filter_main_system:
        Image|startswith:
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Remote code execution through a trusted utility is an entry point, not an end state. Earlier
    detections on the same host may show the delivery step that preceded it, and detections in the
    same window or shortly after may show what followed — reconnaissance, credential access,
    persistence, or movement to other systems. The alert timeline reconstructs the sequence around
    this event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
