name: Invoke-Obfuscation Via Use MSHTA
id: 43d83ffc-5b79-4b61-88fd-9f463ee85140
description: |
  Detects a command line that builds and runs an obfuscated mshta one-liner of
  the form produced by the Invoke-Obfuscation MSHTA transform: it uses set to
  stage environment variables, chains with &&, then invokes mshta with a
  vbscript:CreateObject(...).Run(...) payload that calls (window.close) to dismiss
  the dialog. The rule fires only when set, &&, mshta, vbscript:createobject, .run,
  and (window.close) all appear in the same command line, so the trigger is a
  single self-contained launcher rather than a bare mshta call. The construction
  uses mshta as a script-proxy host to run inline VBScript, which in turn typically
  spawns an obfuscated PowerShell payload while the closing window hides the
  activity from the user. Legitimate use of this exact pattern is rare; the
  investigation should decode the staged command and the proxied script, recover
  any payload it launches or drops, and establish whether the user, host, and
  parent chain are consistent with sanctioned automation.
type: detection
detection_id: ac20ae82-8758-4f38-958e-b44a3140ca88
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line stage variables with set, chain with &&, and invoke
    mshta with a vbscript:createobject().run() payload that closes the window?
  context: Before investing investigation time, confirm the alert is a true positive
    by reviewing the exact command line. The rule fires only when set, &&, mshta,
    vbscript:createobject, .run, and (window.close) all appear together, so verify
    every element is present rather than a bare mshta invocation. The set and &&
    sequence stages variables that the mshta payload later expands, and the
    (window.close) call dismisses the dialog so the activity runs without a visible
    window.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to launch mshta with an inline VBScript
    payload from a command line?
  context: mshta running an inline vbscript:createobject payload assembled from
    staged variables is not a pattern that legitimate administration produces, and
    most accounts and hosts never invoke mshta this way. Knowing whether the acting
    account and the host function involve any sanctioned automation that drives mshta
    is often the fastest way to separate a rare legitimate launcher from operator
    activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this obfuscated mshta launcher part of an authorized penetration test
    or red team engagement?
  context: Offensive tooling, including the Invoke-Obfuscation framework that
    produces this exact mshta one-liner, is used in authorized security assessments.
    Before investing investigation time, check whether a penetration test or red team
    exercise is currently active on this host or network segment. An authorized
    engagement with matching tooling and timing resolves the alert without further
    analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What does this command actually do once the staged variables are
    expanded into the mshta payload?
  context: Decode the full command line. Resolve every set assignment and substitute
    the variables into the mshta argument to reconstruct the real vbscript:createobject
    payload that ran, since the obfuscation transform deliberately splits the payload
    across variables to defeat string matching. Identify which object the script
    creates (commonly WScript.Shell), what the .Run call executes, and whether that
    inner command is itself an encoded or obfuscated PowerShell invocation. The
    query scopes to this host's mshta launcher activity in the surrounding window so
    sequential staging commands are visible together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
        - mshta
        - vbscript:createobject
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What command does the mshta VBScript proxy run, and is that inner payload
    encoded or obfuscated?
  context: The vbscript:createobject(...).Run() call is a proxy that launches a
    second command, frequently an obfuscated or base64-encoded PowerShell invocation
    carrying the actual payload such as a download cradle, a reverse shell, or
    in-memory loading of a .NET assembly. Extract the string passed to .Run, then
    decode any -EncodedCommand or -enc argument, reverse any backtick escaping,
    string concatenation, or variable substitution, and identify the source URL and
    what gets executed. The window-close call exists to hide this proxied execution
    from the user.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did mshta load a scripting-engine module such as vbscript.dll or
    scrrun.dll around the time of the alert?
  context: When mshta evaluates the inline vbscript:createobject payload it loads a
    script engine into its own process, leaving no separate cscript.exe or
    wscript.exe in the tree. A module load of vbscript.dll, scrrun.dll, or jscript.dll
    by mshta.exe is direct evidence that the binary executed script inline rather
    than rendering an HTML application. If image-load events are not collected in
    this environment, treat zero results as a visibility gap rather than evidence no
    script ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \mshta.exe
        ImageLoaded|endswith:
          - \vbscript.dll
          - \scrrun.dll
          - \jscript.dll
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - ProcessGuid
- question: What process spawned this command, and is that parent chain expected?
  context: The parent process reveals how the obfuscated launcher was invoked. A
    command-shell one-liner driven by explorer.exe during interactive use differs
    sharply from one launched by an Office application, a script host such as
    wscript.exe or cscript.exe, or a freshly written executable, which are common
    precursors to scripted execution. Walk up the tree to see what spawned the
    parent and what else it spawned before treating an unusual parent as the anomaly.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did this launcher spawn afterward?
  context: The processes spawned after the launcher reveal its actual impact. The
    mshta proxy commonly spawns mshta.exe and then powershell.exe or another
    interpreter carrying the real payload, and a successful operation may continue
    into reconnaissance, credential access, or a follow-on loader. Scope to the same
    host and the alerting process to see the execution that followed the obfuscated
    command.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did PowerShell script block logging capture the deobfuscated content of
    the proxied payload?
  context: When the mshta VBScript proxy launches PowerShell, Windows Event ID 4104
    records the deobfuscated script content that PowerShell actually executed, even
    when the launching command line is staged and obfuscated. This provides ground
    truth about what ran, bypassing the variable-splitting and string concatenation
    the transform applied. If PowerShell operational logs are not ingested in this
    environment, treat the absence of results as a visibility gap rather than
    evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Did the proxied script write a payload to disk, and is that file still
    available for analysis?
  context: The .Run call frequently drops or retrieves a payload before executing it,
    landing in user-writable staging locations such as the user profile Temp folder,
    C:\Users\Public, or ProgramData. Checking whether such a file still exists
    enables deeper analysis through hash lookups, sandbox submission, or content
    review. If file events are not collected here, fall back to any output or path
    named in the decoded mshta payload.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: When this host has previously fired this obfuscated mshta pattern, what
    parents and users normally drove it, and does the current alert fit that pattern?
  context: Even when a pattern recurs on a host, the parent and user distribution
    behind it is what distinguishes routine from anomalous. This query mirrors the
    rule's own selection scoped to this host, so the resulting parent and user
    distribution reflects how this specific firing pattern has run here historically.
    A new parent process, an unexpected user account, or an unusual command-line
    pattern relative to that history is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - set
        - '&&'
        - mshta
        - vbscript:createobject
        - .run
        - (window.close)
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this obfuscated mshta pattern in the past week, and
    does the cross-host distribution look like consistent automation or one-off
    activity?
  context: This query mirrors the rule's selection with no host scope, returning a
    fleet-wide count of the firing pattern rather than generic mshta usage. Many
    hosts firing the same staged-and-obfuscated pattern points to a scripted
    deployment; one host or a small unrelated set points to manual operator activity.
    Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - set
        - '&&'
        - mshta
        - vbscript:createobject
        - .run
        - (window.close)
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - set
        - '&&'
        - mshta
        - vbscript:createobject
        - .run
        - (window.close)
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - set
        - '&&'
        - mshta
        - vbscript:createobject
        - .run
        - (window.close)
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around the time of the
    alert?
  context: Tracking the user's activity across all hosts reveals lateral movement or
    activity spanning multiple endpoints. If the same user drove similar activity on
    more than one host in this window, the scope of the operation may be larger than
    a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - set
        - '&&'
        - mshta
        - vbscript:createobject
        - .run
        - (window.close)
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert
    reveals what led to this event, what happened after, and whether it is part of a
    larger sequence. Look for reconnaissance, privilege escalation, persistence, or
    data staging surrounding the obfuscated launcher. Novel parent-child pairs at low
    counts are what to scan for against the high-count noise of routine system
    processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- defense tampering, reconnaissance,
    credential access -- may reveal the stages that preceded this event and help
    reconstruct the timeline. An obfuscated proxy launcher that follows earlier
    suspicious activity reads very differently from one that appears in isolation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
