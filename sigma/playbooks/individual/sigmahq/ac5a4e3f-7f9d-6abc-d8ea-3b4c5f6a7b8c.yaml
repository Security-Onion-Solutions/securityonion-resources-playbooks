name: TanStack Supply-Chain Attack DNS Indicators
id: 6cb4ff2a-278f-4b3b-a133-d6613a7ab284
description: |
  Detects DNS lookups for either of two attacker-controlled domains tied to a compromised open-source
  package install: git-tanstack.com, a domain registered shortly before use that hosted a secondary
  payload, or filev2.getsession.org, a decentralized file-transfer endpoint used to exfiltrate harvested
  credentials over a peer-to-peer protocol. The rule fires on EITHER branch, not both together, and the
  branch that matched points to a different stage of the same operation — the git-tanstack.com branch
  indicates secondary-payload retrieval, and the filev2.getsession.org branch indicates exfiltration of
  collected credentials and tokens. Both domains are fixed indicators specific to this compromise, so
  there is no legitimate reason for the lookup; the investigation should identify which process issued
  the query and how it was invoked, whether the lookup resolved and the host went on to connect, what
  credential material or files the process accessed beforehand, and whether the same process or domain
  pattern appears elsewhere in the environment.
type: detection
detection_id: ac5a4e3f-7f9d-6abc-d8ea-3b4c5f6a7b8c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the queried domain match git-tanstack.com or filev2.getsession.org, and which process issued the lookup?
  context: |
    The rule fires on EITHER branch — a lookup for git-tanstack.com or a lookup for filev2.getsession.org
    — not both together. Confirm the exact queried domain and note which branch matched: git-tanstack.com
    is associated with secondary-payload delivery, filev2.getsession.org with exfiltration, and the branch
    that fired determines which downstream questions carry the most investigative weight.
  range: +/-5m
  answer_sources:
  - alert
  - dns_query
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
- question: Is this user or host expected to run tooling that installs or updates open-source packages?
  context: |
    Package-install and build tooling routinely resolves external domains, but the two domains this rule
    flags are attacker infrastructure with no legitimate purpose. The relevant question is whether this
    host and account normally run package-install, build, or CI tooling at all, since that is the delivery
    surface a compromised dependency depends on. The same lookup on a host with no development or build
    role is a stronger signal than on a build server or developer workstation.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is the queried domain malicious, and did the lookup resolve?
  context: |
    The alert is a DNS lookup, not a connection, so the domain itself is the object of investigation.
    Both flagged domains are fixed indicators — a recently registered domain hosting a payload, and a
    file-transfer endpoint used for exfiltration — rather than shared or ambiguous infrastructure. Check
    whether the lookup actually resolved and, if so, treat that as the precondition for whatever the
    matched branch implies: payload retrieval or credential transmission.
  range: +/-5m
  answer_sources:
  - external_threat_intel
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: What did the DNS-querying process execute? Decode its command line and working directory.
  context: |
    The DNS event names the querying process but not its arguments. The full command line shows how the
    process was invoked — as a package-manager lifecycle step, a directly executed interpreter, or a
    background process detached from its parent — and may reference a payload path or source-repository
    identifier tied to the compromised dependency. This query returns every invocation of the binary in
    the window, capturing an install-then-run sequence as one operation.
  range: +/-5m
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process launched the DNS-querying process, and is that launch chain expected?
  context: |
    Compromised package installs typically run through a package manager's install or build lifecycle, so
    the expected parent is a shell, a package-manager process, or an editor/IDE task runner — and the
    payload frequently detaches from that parent immediately after launch to keep running after the
    parent exits. An unexpected parent, such as a document application, a script host invoked outside any
    build step, or a scheduler, points away from a routine install and toward a different delivery path.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Did this host establish an outbound connection to the address this domain resolved to?
  context: |
    A DNS lookup alone does not confirm contact with attacker infrastructure — the host has to actually
    connect to the resolved address for payload retrieval or data transmission to happen. This checks for
    outbound connections to the specific address this lookup returned, in the window following the query.
    A connection here corroborates that the branch which fired actually completed; its absence may mean
    the connection was blocked or has not happened yet.
  range: +1h
  answer_sources:
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dns_resolved_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Initiated
      - Image
- question: What other files did this process create on this host?
  context: |
    A process that reaches a secondary-payload domain, or that stages harvested material for
    transmission, often writes supporting files locally — dropped scripts, hook files placed in developer
    tooling directories that re-trigger the payload on later activity, or a fetched archive. Multiple
    distinct files beyond what a normal install produces points to staged delivery or persistence rather
    than a single benign lookup.
  range: -24h
  answer_sources:
  - file_event
  - network_connection
  query: |
    aggregation: true
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: What files did this process create or write to on this host?
  context: |
    Credential-harvesting payloads bundled with compromised packages commonly enumerate environment
    variables and local configuration for cloud, CI, and secrets-manager credentials, then write locally —
    copies of themselves in developer-tooling directories, including hook files that re-trigger on later
    activity. A sweep that stays entirely in memory will not appear here; corroborate with the process's
    command line and outbound connections.
  range: +/-5m
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: Where did the collected data go after collection — pair file activity with outbound connections?
  context: |
    After a credential sweep or secondary-payload retrieval, a process either writes output locally before
    sending it, or transmits directly without staging a file. Checking file creation from this process in
    the hour following the alert, alongside outbound connections in the same window, distinguishes a
    local-staging step from a direct transmission and shows whether anything was subsequently moved.
  range: +1h
  answer_sources:
  - file_event
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
      - Image
- question: Was the transmitted data obfuscated or encoded rather than sent as plain text?
  context: |
    This class of payload is known to route collected material over transport layers built to resemble
    ordinary encrypted messaging traffic, and to apply string-level obfuscation to values before they leave
    the process, rather than relying on a conventional password-protected archive. The command line rarely
    shows this directly; look instead for encoding/decoding references or flags suggesting a bundled or
    minified payload.
  range: +/-30d
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does this host normally run this process?
  context: |
    Runtime interpreters and package-manager processes are common on developer and CI hosts but rare on
    other roles. Zero or very low historical counts for this specific binary on this host indicate
    first-time or rare execution, which raises the weight of the DNS lookup it made.
  range: -90d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Has this host queried this domain before?
  context: |
    The two domains this rule flags are fixed indicators tied to a specific compromise, not
    general-purpose infrastructure, so there should be no legitimate baseline of prior lookups. A
    non-zero history on this host would be unusual and worth separate scrutiny; a zero count is the
    expected pattern for a first-time malicious lookup.
  range: -90d
  answer_sources:
  - dns_query
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: What other domains did this process query in the surrounding window?
  context: |
    A credential-harvesting payload distributed through a compromised package frequently attempts
    multiple external contacts — reachability checks, secondary-payload hosts, and exfiltration
    destinations — in a short window. A burst of additional external domain lookups from the same process
    corroborates activity beyond the single flagged domain and may surface infrastructure this rule's
    fixed indicator list does not yet cover.
  range: +/-1h
  answer_sources:
  - dns_query
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: What other process activity occurred on this host around the time of the alert?
  context: |
    Alerts rarely occur in isolation. Surveying activity around the DNS lookup reveals what led to it —
    typically a package install or build step — and what followed, such as additional tooling execution.
    Aggregating by process and parent collapses repetitive background telemetry into high-count rows
    while novel process pairs stand out at low counts, which is what to scan for.
  range: +/-15m
  answer_sources:
  - process_creation
  - file_event
  - registry_event
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other hosts in the environment query this same domain?
  context: |
    Because this domain is a fixed malicious indicator rather than shared legitimate infrastructure, any
    other host that queried it is independently exposed to the same compromised dependency. Wide fan-out
    across many hosts in a short window points to a compromised package landing broadly across the fleet
    at install time, rather than a single targeted host.
  range: -7d
  answer_sources:
  - dns_query
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: |
    Earlier detections on the same host — package-manager or build-tool anomalies, defense tampering, or
    credential-access alerts — may reveal the install and execution stages that preceded this DNS lookup
    and help order the timeline.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
