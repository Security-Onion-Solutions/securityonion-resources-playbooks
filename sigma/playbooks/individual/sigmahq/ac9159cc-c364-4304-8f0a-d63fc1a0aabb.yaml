name: ClickOnce Trust Prompt Tampering
id: 437e5609-2b7f-4dbe-b9cd-3a96e072059e
description: |
  Detects a registry write that sets a ClickOnce trust-prompt zone value to "Enabled" under
  \SOFTWARE\MICROSOFT\.NETFramework\Security\TrustManager\PromptingLevel\ (the value name ending in a
  security zone such as \Internet, \UntrustedSites, \LocalIntranet, \MyComputer, or \TrustedSites). Each
  zone can be set to Enabled, AuthenticodeRequired, or Disabled; setting a zone to Enabled lets a ClickOnce
  .NET application delivered from that zone install and run after a simple prompt instead of requiring an
  Authenticode-signed identity, lowering the bar for application-install-based delivery. Legitimate changes
  to these zone values are rare and usually pushed by policy; investigate which zone was set to Enabled,
  which process wrote it and what launched that process, whether a ClickOnce application subsequently
  installed or ran on the host, whether other trust or security settings were changed in the same session,
  and whether the value was later restored to a hardened setting.
type: detection
detection_id: ac9159cc-c364-4304-8f0a-d63fc1a0aabb
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting write set a ClickOnce trust-prompt zone to Enabled under the PromptingLevel key?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a value
    whose path contains \SOFTWARE\MICROSOFT\.NETFramework\Security\TrustManager\PromptingLevel\ and ends in a
    security zone (\Internet, \LocalIntranet, \MyComputer, \TrustedSites, or \UntrustedSites) is written AND
    the value data is Enabled. Review the exact TargetObject and Details on the triggering event to confirm
    which zone was set and that the data is Enabled rather than AuthenticodeRequired or Disabled. Note which
    zone fired: Internet and UntrustedSites lowered to Enabled are the highest-value settings for internet
    delivery, since they let an unsigned ClickOnce app install after a plain prompt.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify ClickOnce trust-prompt zone settings?
  context: >-
    The TrustManager PromptingLevel zone values effectively never change through normal end-user activity and
    are usually set by a hardening policy, not by hand. A user account writing this key is a signal to check
    whether the writing account and host function match any sanctioned change, which is often the fastest way
    to separate policy or testing activity from tampering that lowers install trust. User attribution is
    present on roughly 94% of endpoint registry events; when it is a machine account or missing, pivot on the
    writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which trust-prompt zone was changed, and why is this key a trust-control weakening location?
  context: >-
    The PromptingLevel key holds one REG_SZ value per security zone, each set to Enabled, AuthenticodeRequired,
    or Disabled. A hardened configuration sets internet-facing zones (Internet, UntrustedSites) to
    AuthenticodeRequired or Disabled so that unsigned ClickOnce apps cannot install; setting a zone to Enabled
    reverses that and permits install-on-prompt for apps delivered from that zone. Confirming the exact zone
    value and the writing process establishes that this is a trust-control change rather than an unrelated
    .NETFramework key edit, and frames the rest of the investigation around what that lowered zone now allows.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What zone value was written and what does setting it to Enabled permit?
  context: >-
    The Details field carries the zone setting the write applied. Enabled means the user is prompted to install
    or run any ClickOnce app from that zone regardless of signature; AuthenticodeRequired restricts prompting to
    Authenticode-signed apps with a known identity; Disabled removes the install option entirely. Read the zone
    name from TargetObject together with the Enabled data to determine which delivery path was opened - an
    Internet or UntrustedSites zone set to Enabled is the configuration that lets an internet-hosted, unsigned
    ClickOnce package install after a simple prompt. Details is present on roughly 79% of registry modifications
    and should be populated for this string value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote this zone value, and what launched that process?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to read its
    Image, full command, and parent. A reg.exe, powershell.exe, or cmd.exe write, or one made by an unsigned
    binary or a script host such as wscript.exe or mshta.exe, points to the change being staged programmatically
    rather than a deliberate administrator edit. Legitimate registry-configuration tools such as regedit.exe or
    an installer running under msiexec.exe are the expected writers; an unexpected parent or an unsigned writer
    with abnormal lineage is the signal that this trust-prompt change was not routine.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Did a ClickOnce application install or run on this host after the zone was set to Enabled?
  context: >-
    Lowering a trust-prompt zone is preparatory; the effect is realized when a ClickOnce app is delivered and
    launched. The ClickOnce runtime host dfsvc.exe downloads the deployment into
    C:\Users\<user>\AppData\Local\Apps\2.0\<random>\ and spawns the host assembly as its child, so execution of
    dfsvc.exe or of a binary under an Apps\2.0 path shortly after the write indicates the lowered zone was
    exercised. The query lists ClickOnce execution artifacts on this host after the write; a ClickOnce launch
    close to the zone change ties the trust-prompt tampering to an actual install.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_clickonce:
        - Image|endswith: '\dfsvc.exe'
        - ParentImage|endswith: '\dfsvc.exe'
        - Image|contains: '\AppData\Local\Apps\2.0\'
      condition: selection and selection_clickonce
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: After this write, was the zone value restored to a hardened setting or changed again?
  context: >-
    Registry key or value deletions are not observable in this telemetry, so durability is judged from the key's
    re-modification history rather than from a delete event. A later write returning the zone to
    AuthenticodeRequired or Disabled indicates the change was reverted, which can mean a temporary install window
    was opened and then closed to reduce the footprint; the value remaining Enabled leaves the zone primed to
    accept further installs. Compare the Details values written to this key over the following window to see
    whether the lowered setting persisted.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Were other registry modifications made on this host in the same window?
  context: >-
    An actor who lowers one trust-prompt zone often changes related settings in the same session - other
    PromptingLevel zones set to Enabled, SmartScreen or Defender policy edits, or persistence keys. Clustering the
    registry writes on this host in a short window around the alert reveals the full scope of the configuration
    changes and which process made them. The triggering value appears in the results; the signal is what else was
    modified and by which process, particularly other security or trust settings weakened together.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has this trust-prompt zone value been modified before on this host?
  context: >-
    The PromptingLevel zone values change rarely and typically only through a policy push, so a history with no
    prior writes makes this a first-time change and raises its weight. A history of periodic writes setting the
    same value points instead to a configuration-management process. Compare the historical Details values to see
    whether this zone was already Enabled or whether the lowering is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same zone value modified on other hosts in the environment?
  context: >-
    The same change across many hosts suggests a policy or deployment push; the same change confined to one host
    suggests a targeted weakening of install trust. Compare the Details values and writing process across hosts to
    see whether they all set the zone to Enabled and whether the writer is consistent, which separates a
    fleet-wide configuration change from a single hands-on action on one host.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A trust-prompt change rarely happens in isolation. Aggregating process activity in a tight window around the
    alert surfaces what led up to the write and what ran immediately after it. Novel parent-child pairs stand out
    at low counts against high-count routine telemetry, which is what points to the tool that made the change and
    to any ClickOnce or follow-on execution once the zone was lowered.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, execution of scripting tools, or defense tampering - may
    reveal the stages that preceded this change and help reconstruct the timeline. Lowering install trust is often
    a means to deliver a payload, so prior alerts help place this trust-prompt change within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was there a change ticket, hardening rollback, or documented approval for this trust-prompt change?
  context: >-
    Many organizations require change tickets for security-configuration changes, and trust-control settings such
    as the ClickOnce prompting level are typically managed by policy rather than ad hoc. A corresponding ticket or
    a known application-compatibility exception suggests authorized activity; absence of one when policy requires
    it suggests the change was unauthorized. This check can quickly close false positives or escalate true
    positives.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this method of changing the trust-prompt setting consistent with how your organization manages it?
  context: >-
    Organizations that manage ClickOnce trust normally push the PromptingLevel zone values through group policy or
    a configuration-management tool rather than by direct registry edits on an endpoint. A hand-run reg.exe,
    powershell.exe, or regedit.exe change to this key may indicate an administrator taking a shortcut, or an actor
    bypassing managed tooling. Understanding how these settings are normally deployed helps distinguish the two.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the user or an administrator recall changing the ClickOnce trust-prompt setting?
  context: >-
    The trust-prompt zone values have no routine reason to change, so direct confirmation from the account owner is
    a fast way to resolve the alert. If an administrator or a packaging team set the value to support installing a
    specific application, that closes it; if no one recalls the action, the account may be compromised or the
    change was made by automated tooling, and the investigation should continue into the writing process and any
    ClickOnce execution that followed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Lowering install trust to deliver an application is frequently paired with establishing a foothold. Scheduled
    tasks, services, registry Run keys, BITS jobs, or WMI subscriptions created by schtasks.exe, sc.exe, reg.exe,
    bitsadmin.exe, or wmic.exe near the trust-prompt change indicate the change was part of a broader intrusion
    rather than an isolated setting edit.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
