name: Potential CVE-2023-36874 Exploitation - Fake Wermgr.Exe Creation
id: 67bb69cd-0a66-4ddc-b72d-3e5dbf6f6699
description: |
  Detects the creation of a file named wermgr.exe outside the legitimate Windows system, servicing, and
  update-staging directories (System32, SysWOW64, WinSxS, servicing\LCU, and the update/download caches).
  CVE-2023-36874 is a local privilege-escalation flaw in the Windows Error Reporting (WER) service: an actor
  plants a look-alike wermgr.exe at an attacker-controlled path and uses filesystem redirection so the
  privileged WER service resolves and executes the planted binary, running attacker code at high integrity -
  commonly to spawn a privileged interpreter such as cmd.exe or powershell.exe, or to register a privileged
  scheduled task. The genuine wermgr.exe only ever runs from the excluded system paths, so a wermgr.exe
  created anywhere else is the planted payload. Investigate what the file actually is, which process created
  it and what launched that process, whether it subsequently executed, what else was dropped alongside it,
  and whether the activity is isolated to this host.
type: detection
detection_id: ad0960eb-0015-4d16-be13-b3d9f18f1342
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Was a file named wermgr.exe created outside the legitimate Windows system and servicing directories?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a file whose
    name ends in \wermgr.exe is created AND its path is not one of the excluded legitimate locations
    (System32, SysWOW64, WinSxS, servicing\LCU, and the update-staging caches). Review the exact TargetFilename
    and the responsible process on the triggering event to confirm the file landed in a non-system directory.
    The genuine wermgr.exe only ever appears in those excluded paths, so a copy created elsewhere is the tell
    for the CVE-2023-36874 planting step.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to create a wermgr.exe in a non-system directory?
  context: >-
    Legitimate software effectively never drops a binary named wermgr.exe outside the Windows system and
    servicing paths, so knowing whether the writing account and host function match any sanctioned activity is
    the fastest way to separate a red-team or maintenance action from a live privilege-escalation attempt.
    User attribution is present on roughly 94% of endpoint file events; when it is a machine account or SYSTEM,
    judge by the writing process and the host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the created wermgr.exe the legitimate Windows binary or a planted look-alike?
  context: >-
    The genuine wermgr.exe is a signed Microsoft binary that lives in System32/SysWOW64. A copy dropped into a
    non-system directory for CVE-2023-36874 is a planted payload masquerading under that name. Retrieve the file
    from its on-disk path and compare it against the real binary - file size, embedded strings, imports, packer
    signatures, and signing status. Exploit payloads for this CVE are frequently packed and unsigned, and aim to
    spawn a privileged interpreter or a scheduled task once the WER service executes them.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What process created the fake wermgr.exe, and what was its full command line?
  context: >-
    The file event carries the responsible process identifiers but no command line, so pivot by ProcessGuid to
    the creating process to read its Image, full command, and working directory. A copy or move operation from a
    scripting host, an unsigned binary dropped over a remote session, or a custom exploit executable points to
    the planting being staged programmatically. The command line and current directory often reveal the source
    path the payload was copied from and the target path chosen to sit in the WER redirection.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: If the planted wermgr.exe executed, what is its hash and does it have known threat-intel detections?
  context: >-
    A file's hash is recorded when it runs, not when it is written, so file-creation events carry no hash. This
    query looks for a wermgr.exe executing from this host and reads its hash; submit that hash to threat
    intelligence to determine whether it is known malicious, benign, or previously unseen. Exploit binaries for
    this CVE are often repacked to produce fresh low-fidelity hashes, so an unknown hash does not clear the file.
    If the planted binary is present but has not executed, retrieve it from its on-disk path and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
- question: What launched the process that created this file, and is that parent chain expected?
  context: >-
    Pivoting to the writing process's own record surfaces its parent Image and parent command line, which reveal
    how the drop was invoked. A parent such as an Office application, a script host like wscript.exe or mshta.exe,
    a remote-session shell, or an unsigned binary points to the planting being driven by exploitation or a
    delivered dropper rather than an interactive administrator action. The parent chain distinguishes a scripted
    exploit from a routine copy.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Was the planted wermgr.exe executed after it was created?
  context: >-
    The exploit completes when the privileged WER service resolves the redirected path and runs the planted
    wermgr.exe at high integrity. Correlating the file creation with a later process_creation for wermgr.exe on
    this host reveals whether the payload progressed from delivery to execution and what command it carried. An
    execution of wermgr.exe from a non-system path, or one spawning a privileged interpreter or scheduled task,
    ties the drop to the elevation attempt.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
- question: Is the planted wermgr.exe still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives both urgency and next steps. A payload still on disk can be retrieved,
    hashed, and analyzed; a wermgr.exe deleted seconds after creation suggests anti-forensic cleanup or a
    self-removing dropper and shifts the investigation to what executed in between. Interpret the EventType on the
    following operations - a deletion shortly after creation is the cleanup signature.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A process that plants one look-alike binary often drops several - the exploit staging its payload, a helper,
    and any redirection or trigger artifacts. The breadth, paths, and extensions of the writing process's other
    file activity distinguish a single planted file from a broader staging operation and enumerate what else needs
    review. The correlation covers the writing process and its direct children, since droppers often delegate the
    write.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has a wermgr.exe been created before on this host at this path?
  context: >-
    The genuine wermgr.exe is placed by Windows servicing into system paths, not created ad hoc elsewhere, so a
    history with no prior creation of this file on this host makes the appearance a first-time event and raises
    its weight. A recurring history of the same creation may instead point to a management process or a
    repeatedly run tool. Zero or very low counts indicate a new and unusual file.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- always_include: true
  question: Has this user previously produced this wermgr.exe-creation pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, so the result is the user's 90-day history of the
    specific pattern the rule fires on - a wermgr.exe created outside the excluded system paths - aggregated by
    host, rather than generic file activity. A user who has never produced this pattern is more suspicious than
    one who does so regularly; weigh the count against the user's role and whether they perform any legitimate
    servicing or imaging work. When the alert fires under a machine or service account, the parent-process
    history is the meaningful pivot instead.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: \wermgr.exe
      filter_main_locations:
        TargetFilename|contains:
        - :\$WINDOWS.~BT\NewOS\
        - :\$WinREAgent\
        - :\Windows\servicing\LCU\
        - :\Windows\System32\
        - :\Windows\SysWOW64\
        - :\Windows\WinSxS\
        - :\WUDownloadCache\
        - :\Windows\SoftwareDistribution\Download\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has the process that created this file historically driven the same wermgr.exe pattern, or is the program new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute the behavior; the meaningful
    pivot is the launch mechanism. The query mirrors the rule's selection scoped to the alerting program,
    so the result is the 90-day history of this program driving the specific wermgr.exe-outside-system-paths
    pattern, aggregated by host. A new or rare program for this pattern is the deviation worth chasing; a program
    that already accounts for many prior events is servicing or OS automation resolving into an excluded path.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: \wermgr.exe
      filter_main_locations:
        TargetFilename|contains:
        - :\$WINDOWS.~BT\NewOS\
        - :\$WinREAgent\
        - :\Windows\servicing\LCU\
        - :\Windows\System32\
        - :\Windows\SysWOW64\
        - :\Windows\WinSxS\
        - :\WUDownloadCache\
        - :\Windows\SoftwareDistribution\Download\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts in a tight window reveals whether the same account triggered
    related activity on multiple endpoints, which would widen the scope of compromise. If the same user was
    active on several hosts around the alert, the planting may be part of a broader hands-on operation rather
    than an isolated event. When the alert fires under SYSTEM or a machine account this view returns agent
    telemetry noise, and the parent-driven fleet view is the meaningful answer.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven wermgr.exe pattern fire on other hosts in the same window?
  context: >-
    Under a service principal, a user-wide network view returns constant agent-telemetry noise, so the meaningful
    question is whether the same launch mechanism produced the pattern elsewhere. The query mirrors the rule's
    selection scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts in the same
    window points to scheduled or pushed automation; a single host points to a host-local trigger such as a
    hands-on exploitation attempt.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: \wermgr.exe
      filter_main_locations:
        TargetFilename|contains:
        - :\$WINDOWS.~BT\NewOS\
        - :\$WinREAgent\
        - :\Windows\servicing\LCU\
        - :\Windows\System32\
        - :\Windows\SysWOW64\
        - :\Windows\WinSxS\
        - :\WUDownloadCache\
        - :\Windows\SoftwareDistribution\Download\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Is a planted wermgr.exe present on any other hosts in the environment?
  context: >-
    Finding the same look-alike wermgr.exe on multiple hosts may indicate lateral movement or coordinated
    exploitation across endpoints. If the file is only on one host, it may be a targeted attempt; if it appears on
    many hosts, determine the distribution pattern and timeline. Match on the file name across hosts and compare
    the writing process and paths to see whether the same technique is being reused environment-wide.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    The planting rarely happens in isolation. Aggregating process activity in a tight window around the alert
    surfaces what led up to the file creation and what ran immediately after it - including any privileged
    interpreter or scheduled-task creation that the WER service execution would produce. Novel parent-child pairs
    stand out at low counts against high-count routine telemetry, which is what points to the exploitation
    tooling and any elevated follow-on.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, credential access, or delivery of tooling over a remote
    session - may reveal the stages that preceded this planting and help reconstruct the timeline. A local
    privilege-escalation attempt is typically a means to run privileged follow-on actions, so prior alerts help
    place this file creation within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
