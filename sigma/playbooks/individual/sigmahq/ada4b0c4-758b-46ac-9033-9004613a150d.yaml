name: Modify Group Policy Settings
id: dd605e65-33d7-46c1-a2e7-f3fa91933ed2
description: |
  Detects reg.exe modifying values under the local Group Policy path
  \SOFTWARE\Policies\Microsoft\Windows\System, where the command line also references one of
  the Group Policy refresh-timer values (GroupPolicyRefreshTime / GroupPolicyRefreshTimeDC and
  their offset variants) or a SmartScreen value (EnableSmartScreen, ShellSmartScreenLevel). The
  rule fires only when all three conditions hold together: a reg.exe (or a binary whose original
  name is reg.exe) invocation, the policy path, and one of the named values. Legitimate context
  includes administrators or management tooling tuning policy refresh intervals or SmartScreen
  posture. Malicious context is policy modification used to weaken protections (lowering or
  disabling SmartScreen) or to alter how and when policy is reapplied, which can entrench other
  changes; the investigation should determine which value was set, what it was set to, who set it,
  and whether the change is part of a broader sequence of policy or registry tampering.
type: detection
detection_id: ada4b0c4-758b-46ac-9033-9004613a150d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line match what this rule detects — a reg.exe write to the System policy path that also names a Group Policy refresh-timer or SmartScreen value?
  context: Before investing investigation time, confirm the alert is a true positive. Review the
    exact command line and process details and verify that all three conditions hold together
    the binary is reg.exe (or has original name reg.exe), the command line references
    \SOFTWARE\Policies\Microsoft\Windows\System, and it names one of the refresh-timer values
    (GroupPolicyRefreshTime, GroupPolicyRefreshTimeDC, GroupPolicyRefreshTimeOffset,
    GroupPolicyRefreshTimeOffsetDC) or a SmartScreen value (EnableSmartScreen, ShellSmartScreenLevel).
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to modify Group Policy registry settings?
  context: Legitimate administrative activity can trigger this detection. Group Policy refresh and
    SmartScreen values are normally managed by administrators, domain management tooling, or
    configuration baselines. Knowing whether the user role and host function (for example a
    domain controller, an admin workstation, or a management server) are consistent with editing
    policy values is often the fastest path to distinguishing routine tuning from tampering.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What specific value under the System policy key was set, and what data was written?
  context: The exact value name and data determine the effect. A refresh-timer value
    (GroupPolicyRefreshTime and its DC/offset variants) changes how frequently policy is reapplied;
    a very large or zero interval can slow or suppress reapplication so that other unauthorized
    changes are not overwritten. EnableSmartScreen set to 0 disables the SmartScreen reputation
    check, and ShellSmartScreenLevel set to Warn (rather than Block) downgrades it from blocking
    to advisory. Read the value name and its data to determine whether protection was weakened or
    policy reapplication was altered.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Did this host run Group Policy management tooling around this time, such as PowerShell GPO cmdlets or the policy GUI?
  context: reg.exe is one route to the same setting; an actor or administrator may instead use
    PowerShell GPO cmdlets (Set-GPRegistryValue, New-GPOImmediateTask, Set-GPPrefRegistryValue),
    the Group Policy Management Console, or gpedit. Finding these tools running near the alert
    clarifies whether the reg.exe write was a one-off edit or part of a managed policy change, and
    whether immediate-task creation (a common privilege-execution path) accompanied it.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_gpo:
        CommandLine|contains:
          - 'Set-GPRegistryValue'
          - 'New-GPOImmediateTask'
          - 'Set-GPPrefRegistryValue'
          - 'New-GPO'
          - 'Set-GPLink'
          - 'gpedit'
          - 'gpme.msc'
          - 'gpmc.msc'
      condition: selection and selection_gpo
    fields:
      - Image
      - CommandLine
      - User
- question: Were directory-service or SYSVOL object changes recorded on this host around the same time?
  context: Group Policy modification commonly leaves directory-side evidence object modifications
    to policy containers under CN=Policies,CN=System and writes to SYSVOL policy files such as
    GptTmpl.inf, ScheduledTasks.xml, or Registry.pol. These appear in security audit events
    (directory object modified, handle/object access) rather than in process telemetry. Correlating
    a local reg.exe policy edit with directory or SYSVOL object changes in the same window helps
    establish whether the change was confined to one host or propagated into shared policy. If
    security audit events are not collected in this environment, treat zero results as a visibility
    gap rather than evidence nothing happened.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 5136
          - 5137
          - 4663
          - 4670
          - 4656
      condition: selection
    fields:
      - EventID
      - ObjectName
      - SubjectUserName
- question: Were other registry modifications made on this host in the same session?
  context: An actor who edits one policy value often edits several for example weakening SmartScreen
    while also altering policy refresh timing and disabling protections elsewhere. Finding a cluster
    of reg.exe write operations (add, delete, import) from the same host within a short window
    reveals the full scope of the configuration changes and whether multiple objectives were pursued.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- question: What process spawned this reg.exe, and is that parent chain expected?
  context: The parent process reveals how reg.exe was invoked. Legitimate policy edits often
    descend from interactive administrative shells, management agents, or configuration tooling.
    Parents such as mshta.exe, wscript.exe, an Office application, or an unexpected interactive
    shell may indicate the policy change followed exploitation or a malicious script rather than a
    planned administrative action.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did this reg.exe activity spawn afterward?
  context: reg.exe itself does little beyond writing the registry, so the processes that run
    immediately after on the same host help reveal the operator's intent. Follow-on cmd.exe,
    powershell.exe, certutil.exe, or scheduling tools shortly after a policy edit suggest the
    change was one step in a larger sequence rather than an isolated configuration tweak.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host has previously fired the rule's pattern, what parents and users normally drove it, and does the current alert fit that pattern?
  context: Even routine tools are abused. This query mirrors the rule's selection structure scoped
    to this host, so the resulting parent and user distribution reflects how this specific policy-edit
    pattern (not generic reg.exe use) has historically run here. A new parent process, an unexpected
    user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_reg:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_path:
        CommandLine|contains: \SOFTWARE\Policies\Microsoft\Windows\System
      selection_key:
        CommandLine|contains:
        - GroupPolicyRefreshTimeDC
        - GroupPolicyRefreshTimeOffsetDC
        - GroupPolicyRefreshTime
        - GroupPolicyRefreshTimeOffset
        - EnableSmartScreen
        - ShellSmartScreenLevel
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_reg:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_path:
        CommandLine|contains: \SOFTWARE\Policies\Microsoft\Windows\System
      selection_key:
        CommandLine|contains:
        - GroupPolicyRefreshTimeDC
        - GroupPolicyRefreshTimeOffsetDC
        - GroupPolicyRefreshTime
        - GroupPolicyRefreshTimeOffset
        - EnableSmartScreen
        - ShellSmartScreenLevel
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_reg:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_path:
        CommandLine|contains: \SOFTWARE\Policies\Microsoft\Windows\System
      selection_key:
        CommandLine|contains:
        - GroupPolicyRefreshTimeDC
        - GroupPolicyRefreshTimeOffsetDC
        - GroupPolicyRefreshTime
        - GroupPolicyRefreshTimeOffset
        - EnableSmartScreen
        - ShellSmartScreenLevel
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity
    spanning multiple endpoints. If the same user made similar policy or registry changes on
    several hosts in this window, the scope of the change is larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_reg:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_path:
        CommandLine|contains: \SOFTWARE\Policies\Microsoft\Windows\System
      selection_key:
        CommandLine|contains:
        - GroupPolicyRefreshTimeDC
        - GroupPolicyRefreshTimeOffsetDC
        - GroupPolicyRefreshTime
        - GroupPolicyRefreshTimeOffset
        - EnableSmartScreen
        - ShellSmartScreenLevel
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host defense
    tampering, reconnaissance, credential access, or privilege escalation may reveal the stages
    that preceded a policy modification and help reconstruct the full timeline. Policy edits that
    weaken protections often follow an initial foothold.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was reg.exe executed from its expected System path?
  context: A binary whose original name is reg.exe but which runs from outside System32 or SysWOW64
    may have been copied or renamed to evade path-based allowlists. reg.exe running from a user's
    temp or profile directory is more suspicious than one in the standard system path. The rule
    also matches on OriginalFileName, so a renamed copy still triggers the original-name branch.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired the rule's policy-edit pattern over the past 90 days, and what command-line structures are typical?
  context: A policy-edit pattern with no prior history on a host is more suspicious than one used
    regularly under stable parents. This query mirrors the rule's selection structure scoped to
    this host, so the count reflects the rule's specific firing pattern (not generic reg.exe use).
    The command-line projection lets the analyst compare typical invocation patterns including which
    policy value was usually set against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_reg:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_path:
        CommandLine|contains: \SOFTWARE\Policies\Microsoft\Windows\System
      selection_key:
        CommandLine|contains:
        - GroupPolicyRefreshTimeDC
        - GroupPolicyRefreshTimeOffsetDC
        - GroupPolicyRefreshTime
        - GroupPolicyRefreshTimeOffset
        - EnableSmartScreen
        - ShellSmartScreenLevel
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
