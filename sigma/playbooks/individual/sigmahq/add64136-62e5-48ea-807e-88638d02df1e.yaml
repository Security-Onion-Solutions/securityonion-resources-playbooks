name: Fsutil Suspicious Invocation
id: e4e6acc1-bdb8-45a0-b146-0f09f729f094
description: |
  Detects fsutil.exe invoked with USN change journal verbs (deletejournal, createjournal,
  setZeroData) that alter or destroy the NTFS volume-wide record of file creations, deletions,
  and modifications. The rule fires when the process is fsutil.exe (by image name or original
  file name) AND the command line contains one of those verbs. Deleting or shrinking the USN
  journal is an anti-forensics step that wipes the change history DFIR relies on to reconstruct
  file activity, and is commonly chained with recovery destruction during impact operations; the
  same verbs also have legitimate administrative and backup-tooling uses. Determine which verb ran,
  against which volume, who launched it, and whether file deletion, recovery inhibition, or other
  tampering surrounds it.
type: detection
detection_id: add64136-62e5-48ea-807e-88638d02df1e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line show fsutil run with deletejournal, createjournal, or setZeroData?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires
    only when the process is fsutil.exe (by image name or original file name) and the command line
    contains deletejournal, createjournal, or setZeroData. Confirm both the binary identity and the
    exact verb, and note the target volume.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run fsutil against the USN change journal?
  context: Legitimate administrative activity, backup tooling, and storage maintenance scripts can
    invoke these verbs. Knowing whether the user role and host function involve volume or journal
    maintenance is often the fastest path to distinguishing routine operations from anti-forensics.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which USN journal action was taken, and against which volume?
  context: The three verbs differ in impact. deletejournal disables and erases the volume-wide change
    history (anti-forensics). createjournal can resize the journal in place, and a small max size
    effectively truncates history. setZeroData zeroes file data ranges, destroying file content.
    Decode the full command line to identify the verb, the target volume path, and any size or range
    parameters, since these determine investigation priority and what evidence may already be gone.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned fsutil and is that parent chain expected?
  context: The parent process reveals how fsutil was invoked. Storage-maintenance and backup workflows
    have predictable parents; an interactive shell, a script host, or an unexpected application parent
    points to hands-on-keyboard or scripted operation rather than scheduled maintenance.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously fired this fsutil pattern, what parents and users normally
    drive it, and does the current alert fit?
  context: Even routine tooling can be abused. This query mirrors the rule's selection scoped to this
    host, so the parent and user distribution reflects how this specific firing pattern has historically
    run here rather than generic fsutil usage. A new parent, an unexpected account, or a first-time
    occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \fsutil.exe
      - OriginalFileName: fsutil.exe
      selection_cli:
        CommandLine|contains:
        - deletejournal
        - createjournal
        - setZeroData
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What file deletion activity occurred on this host in the window around the journal change?
  context: Deleting or shrinking the USN journal destroys the volume-wide record of file deletions
    that investigation relies on. This is an aggregated survey of file-delete events in the
    surrounding window, grouped by deleting image and user so routine churn collapses into high
    counts; the signal is an unexpected image or account carrying a burst of deletions before the
    journal change takes hold. Sparse or absent results after the journal action may itself reflect
    the lost visibility the action was meant to create.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_delete
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were registry keys associated with execution history or persistence deleted on this host
    around the same time?
  context: Indicator removal often pairs file-system history destruction with deletion of registry
    artifacts that record execution or maintain footholds. Registry value and key deletions in the
    surrounding window may show the same operator clearing additional evidence alongside the journal
    action.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventType: DeleteValue
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Were Windows event logs cleared on this host around the time of the journal change?
  context: Wiping the file-system change journal and clearing the Windows event logs are parallel
    indicator-removal steps that frequently occur together. A security log cleared event (1102) in the
    surrounding window indicates broader evidence destruction and that authentication and audit history
    may be gone. If security event collection is not in place in this environment, treat zero results
    as a visibility gap rather than evidence nothing happened.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 1102
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - host.name
      - SubjectUserName
      - EventID
- question: What activity occurred on this host after the USN journal was altered?
  context: Operators destroy file-system history for a reason, to hide what follows or what already
    ran. Examining process activity immediately after the journal change reveals what the action was
    meant to conceal or enable. Because the change destroys later deletion evidence, correlate process
    creation in this window with surviving file and network events.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense tampering actions performed on this host?
  context: An operator who wipes the file-system change journal often disables or clears several
    controls in the same operation, stopping protection services, clearing logs, and deleting recovery
    data to maximize coverage. Finding multiple tampering events from the same user or parent process
    indicates a coordinated indicator-removal step rather than isolated maintenance.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: What recovery-inhibiting commands were executed on this host?
  context: 'Journal destruction frequently sits alongside recovery inhibition in impact operations:
    deleting shadow copies (vssadmin, wmic), disabling boot recovery (bcdedit), deleting backups
    (wbadmin), and disabling the Windows Recovery Environment (reagentc). This query surfaces recovery-inhibiting
    commands on the host, revealing the full scope of recovery destruction. Verify whether each action
    succeeded by checking system state (vssadmin list shadows, bcdedit /enum, reagentc /info).'
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\reagentc.exe'
          - '\diskshadow.exe'
      selection_cmdline:
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'recoveryenabled'
          - 'bootstatuspolicy'
          - 'delete catalog'
          - 'delete systemstatebackup'
          - 'boot.ini'
          - 'winre.wim'
          - '/disable'
      condition: selection and (selection_recovery or selection_cmdline)
    fields:
      - Image
      - CommandLine
- question: What other destructive or recovery-inhibiting actions occurred on this host?
  context: 'Impact operations typically chain multiple destructive actions: deleting shadow copies,
    disabling recovery, stopping security services, and clearing event logs. Finding the complete set
    of destructive command-line tools used on the host distinguishes a broader destruction sequence
    from an isolated journal-maintenance action.'
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_destructive:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\cipher.exe'
          - '\fsutil.exe'
          - '\icacls.exe'
          - '\takeown.exe'
          - '\attrib.exe'
          - '\sc.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\powershell.exe'
          - '\taskkill.exe'
      condition: selection and selection_destructive
    fields:
      - Image
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \fsutil.exe
      - OriginalFileName: fsutil.exe
      selection_cli:
        CommandLine|contains:
        - deletejournal
        - createjournal
        - setZeroData
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \fsutil.exe
      - OriginalFileName: fsutil.exe
      selection_cli:
        CommandLine|contains:
        - deletejournal
        - createjournal
        - setZeroData
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning
    multiple endpoints. If the same user triggered similar activity on several hosts, the scope of the
    operation may be larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \fsutil.exe
      - OriginalFileName: fsutil.exe
      selection_cli:
        CommandLine|contains:
        - deletejournal
        - createjournal
        - setZeroData
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Indicator removal rarely happens in isolation. Earlier detections on the same host, such as
    execution, credential access, or recovery inhibition, may reveal the stages that preceded the
    journal change and help reconstruct the full timeline before the surviving evidence thins out.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired this fsutil pattern in the past week, and does the cross-host
    distribution look like automation or one-off activity?
  context: This query mirrors the rule's selection with no host scope, so the result is a fleet-wide
    count of this firing pattern rather than generic fsutil usage. Many hosts firing the same pattern
    points to scripted deployment or vendor automation; one host or a small unrelated set points to
    manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \fsutil.exe
      - OriginalFileName: fsutil.exe
      selection_cli:
        CommandLine|contains:
        - deletejournal
        - createjournal
        - setZeroData
      condition: all of selection_*
    fields:
    - host.name
