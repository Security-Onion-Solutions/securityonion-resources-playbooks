name: Suspicious Debugger Registration Cmdline
id: 742b4811-d3e8-4be6-b052-6277642774e9
description: |
  Detects a command line that references the Image File Execution Options (IFEO) registry path together with the name of a Windows accessibility or logon-screen helper binary (sethc.exe, utilman.exe, osk.exe, magnify.exe, narrator.exe, displayswitch.exe, atbroker.exe, HelpPane.exe). Registering a Debugger value under an IFEO key for one of these binaries replaces the helper invoked from the lock screen with an attacker-chosen program, so that triggering the accessibility feature (e.g. pressing Shift five times) yields a SYSTEM-context command prompt without authenticating. Legitimate IFEO use targeting these specific binaries is rare; investigate which Debugger value was set, what parent and user performed the write, whether the referenced payload exists on disk, and whether the registration survives reboot.
type: detection
detection_id: ae215552-081e-44c7-805f-be16f975c8a2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line reference both the Image File Execution Options path and an accessibility or logon-screen binary?
  context: Confirm the alert is a true positive by reviewing the exact command line. The rule fires only when the command line contains the IFEO path fragment '\CurrentVersion\Image File Execution Options\' AND one of the accessibility binaries (sethc.exe, utilman.exe, osk.exe, magnify.exe, narrator.exe, displayswitch.exe, atbroker.exe, HelpPane.exe). Verify both elements are present and read the Debugger value being set.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to register IFEO debugger entries for accessibility binaries?
  context: Registering a debugger for a logon-screen accessibility helper is almost never routine administration. Knowing whether this user role and host function ever involve IFEO configuration of these specific binaries is often the fastest way to separate a true positive from rare legitimate debugging or imaging activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What process spawned the command that wrote the IFEO entry, and what started that parent?
  context: The parent-child relationship reveals how the registration was invoked. Tracing the parent's own origin shows whether the write came from an interactive administrator action or from an unexpected chain such as a script host, Office application, or remote-execution tool spawning a registry-writing command.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Which accessibility binary's IFEO key was targeted and what Debugger value was registered for it?
  context: The registry write linked to this process reveals intent. Identify which accessibility binary's Image File Execution Options key was targeted and the exact Debugger value data — the program that will run in place of the helper. A value pointing at cmd.exe, powershell.exe, or another interactive or LOLBin executable indicates a logon-screen backdoor; an unfamiliar path indicates the planted payload to analyze further. If registry write events are not collected in this environment, parse the same key path and value from the alerting command line instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Were other registry-writing commands run on this host in the same window?
  context: An actor who plants one IFEO debugger often makes related configuration changes — additional IFEO keys, Run keys for persistence, or security-tool settings. Surfacing other registry write operations from this host in a short window reveals whether this was an isolated change or part of a broader configuration tampering effort.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - 'Set-ItemProperty'
          - 'New-ItemProperty'
      condition: selection and selection_reg
    fields:
      - CommandLine
- question: Does the registered Debugger executable exist on disk, and what is it?
  context: The IFEO redirect only fires if the program named in the Debugger value is present at that path. Identify the executable or script path from the Debugger value data, then verify whether that file exists on disk and analyze its hash. A planted payload in a user-writable or unusual location confirms an active logon-screen backdoor; cmd.exe at the system path confirms the classic direct-to-SYSTEM-shell variant.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Was an alternate data stream attached to any accessibility binary on this host around the alert time?
  context: Besides IFEO redirection, accessibility helpers can be hijacked by writing a payload into an alternate data stream attached to the binary itself. The endpoint agent records this as an ordinary file-creation event, with the stream name appended after a colon in the file path (for example \sethc.exe:StreamedFileState) — there is no stream hash recorded, so this establishes the write and the writing process, not the stream's contents. A hit on sethc.exe, utilman.exe, osk.exe, or the other helpers indicates binary-tampering activity occurring alongside or instead of the registry redirect.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_targets:
        TargetFilename|contains:
          - '\sethc.exe:'
          - '\utilman.exe:'
          - '\osk.exe:'
          - '\magnify.exe:'
          - '\narrator.exe:'
          - '\displayswitch.exe:'
          - '\atbroker.exe:'
          - '\HelpPane.exe:'
      condition: selection and selection_targets
    fields:
      - TargetFilename
      - Image
- question: What other child processes did the same parent spawn?
  context: If the parent that launched the registry write also spawned other processes, those siblings reveal the wider scope of activity from that parent. Multiple registry, download, or execution children from one parent in a short window points to orchestrated activity rather than an isolated administrative command.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host previously fired this IFEO-registration pattern, what parents and users drove it, and does the current alert fit?
  context: The query mirrors the rule's selection — the IFEO path fragment plus an accessibility binary name — scoped to this host. The resulting parent and user distribution reflects how this specific firing pattern has historically run here, if at all. A new parent process, an unexpected user account, or a first-time appearance of the pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains: \CurrentVersion\Image File Execution Options\
      selection2:
        CommandLine|contains:
        - sethc.exe
        - utilman.exe
        - osk.exe
        - magnify.exe
        - narrator.exe
        - displayswitch.exe
        - atbroker.exe
        - HelpPane.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains: \CurrentVersion\Image File Execution Options\
      selection2:
        CommandLine|contains:
        - sethc.exe
        - utilman.exe
        - osk.exe
        - magnify.exe
        - narrator.exe
        - displayswitch.exe
        - atbroker.exe
        - HelpPane.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains: \CurrentVersion\Image File Execution Options\
      selection2:
        CommandLine|contains:
        - sethc.exe
        - utilman.exe
        - osk.exe
        - magnify.exe
        - narrator.exe
        - displayswitch.exe
        - atbroker.exe
        - HelpPane.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated activity on multiple endpoints. If the same user triggered registry or persistence activity on several hosts, the scope of the compromise may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains: \CurrentVersion\Image File Execution Options\
      selection2:
        CommandLine|contains:
        - sethc.exe
        - utilman.exe
        - osk.exe
        - magnify.exe
        - narrator.exe
        - displayswitch.exe
        - atbroker.exe
        - HelpPane.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the registry write reveals the immediate context: what led to it, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, credential access, or additional persistence mechanisms in the surrounding window.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the attack stages that preceded the IFEO registration and help reconstruct the full timeline leading up to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired this IFEO-registration pattern in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this specific firing pattern rather than generic registry usage. Many hosts firing the same pattern points to scripted deployment or imaging automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains: \CurrentVersion\Image File Execution Options\
      selection2:
        CommandLine|contains:
        - sethc.exe
        - utilman.exe
        - osk.exe
        - magnify.exe
        - narrator.exe
        - displayswitch.exe
        - atbroker.exe
        - HelpPane.exe
      condition: all of selection*
    fields:
    - host.name
- question: Were other process-based persistence mechanisms installed on this host?
  context: Attackers rarely rely on a single persistence mechanism. Alongside an IFEO logon-screen backdoor, they commonly install backup footholds using scheduled tasks, services, Run keys, BITS jobs, or WMI subscriptions. Multiple persistence installations in the same timeframe indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
