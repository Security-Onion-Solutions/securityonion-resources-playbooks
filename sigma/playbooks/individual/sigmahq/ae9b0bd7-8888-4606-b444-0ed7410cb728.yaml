name: Writing Of Malicious Files To The Fonts Folder
id: 72d94347-274b-4c31-9f4e-4ab962f65fd4
description: |
  Detects command-line activity that writes an executable or script file into C:\Windows\Fonts\.
  The rule fires when a command line combines a file-writing verb (echo, copy, type, file createnew, or cacls)
  AND the C:\Windows\Fonts\ path AND an executable or script extension. The Fonts folder is writable and
  executable without administrator privileges, so it is occasionally abused to stage payloads in a directory
  that normally holds only legitimate system files; investigation should determine what file was written,
  what it is, and whether the staging is part of a broader foothold.
type: detection
detection_id: ae9b0bd7-8888-4606-b444-0ed7410cb728
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line write an executable or script into C:\Windows\Fonts\ using a file-writing
    verb?
  context: Confirm the alert is a true positive by reviewing the exact command line. The rule fires only when
    all three conditions hold together — a file-writing verb (echo, copy, type, file createnew, or cacls),
    the C:\Windows\Fonts\ path, and an executable or script extension (.exe, .dll, .bat, .ps, .vbs, and
    similar). Read the command to confirm the target file and the operation performed against it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to write executable files into the Windows Fonts directory?
  context: Legitimate software installation, font management, and administrative scripting rarely place
    executables or scripts directly into C:\Windows\Fonts\. Knowing whether the user role and host function
    are consistent with writing files into a system directory is often the fastest path to distinguishing a
    true positive from routine operations.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this command do? Decode the full command line, the target file path, and the
    operation performed.
  context: The full command line reveals the specific action taken. Identify which verb wrote the file (echo
    appends content, copy/type move existing data, file createnew creates an empty file, cacls/icacls adjusts
    permissions), the exact destination filename and extension under C:\Windows\Fonts\, and any source the
    content was drawn from. A permissions-modification verb against a path suggests the file already exists
    and is being locked down rather than freshly written.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What is the file that was written into the Fonts folder, and what does its content reveal?
  context: Retrieve and analyze the file referenced in the command line. For scripts and text files, check
    for base64 encoding, obfuscated strings, embedded http or https URLs, IP addresses, or interpreter
    commands. For binaries, check imports, embedded strings, packer signatures, and signing status. The
    file extension named in the command line indicates what to expect, but the actual content determines
    whether this is a benign artifact or a staged payload.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did anything execute from the Windows Fonts folder, and what is its hash?
  context: The Fonts folder allows execution without admin rights, which is why malware is staged there -- and
    a file's hash is recorded when it runs, not when cmd writes it. This looks on the host for any process
    whose image path is under C:\Windows\Fonts\ and reads its hash; legitimate software does not run from
    Fonts, so any hit is high-signal. Submit the hash to VirusTotal, Hybrid Analysis, or internal threat
    intel. If the dropped file is a script (.bat, .ps1, .vbs) it runs through an interpreter rather than as a
    process from Fonts and will not appear here -- retrieve it from the Fonts path and hash it by hand (see
    the content-decode and evidence-preservation steps).
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|contains: '\Windows\Fonts\'
      condition: selection
    fields:
      - Image
      - Hashes
- question: Is the file written into the Fonts folder still on disk for analysis?
  context: If the file referenced by the command line still exists, it can be hashed, submitted for
    reputation analysis, or reviewed directly. If it has already been deleted, the file event and command
    line may be the only surviving record of what was staged. Files placed in C:\Windows\Fonts\ persist
    across reboots and run from that location, so a file that is still present is available for full analysis.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process spawned this command interpreter, and is that parent chain expected?
  context: The parent process reveals how the command was invoked. Interactive administration typically
    descends from explorer.exe or a terminal; automation descends from a service or scheduled task host.
    Parents such as script hosts, Office applications, or a self-extracting archive launcher point toward
    automated or scripted delivery rather than a human at a keyboard.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What did this command interpreter execute after writing the file?
  context: The processes spawned afterward reveal the actual impact of the staging. A file written into the
    Fonts folder and then executed, or followed by permission-lockdown commands, scheduled-task creation, or
    service installation, indicates the write was a setup step in a larger sequence rather than an isolated
    action.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host has previously fired this Fonts-folder write pattern, what parents and users drove
    it, and does the current alert fit that pattern?
  context: The query mirrors the rule's selection structure scoped to this host, so the resulting parent and
    user distribution reflects how this specific firing pattern has historically run here, not generic command
    interpreter usage. A new parent process, an unexpected user account, or an unusual command-line structure
    against the Fonts folder is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_1:
        CommandLine|contains:
        - echo
        - copy
        - type
        - file createnew
        - cacls
      selection_2:
        CommandLine|contains: C:\Windows\Fonts\
      selection_3:
        CommandLine|contains:
        - .sh
        - .exe
        - .dll
        - .bin
        - .bat
        - .cmd
        - .js
        - .msh
        - .reg
        - .scr
        - .ps
        - .vb
        - .jar
        - .pl
        - '.inf'
        - .cpl
        - .hta
        - .msi
        - .vbs
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this Fonts-folder write pattern in the past week, and does the cross-host
    distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of this specific firing pattern. Many hosts firing the same pattern points to scripted deployment or
    vendor automation; one host or a small unrelated set points to manual operator activity. Use the host
    distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_1:
        CommandLine|contains:
        - echo
        - copy
        - type
        - file createnew
        - cacls
      selection_2:
        CommandLine|contains: C:\Windows\Fonts\
      selection_3:
        CommandLine|contains:
        - .sh
        - .exe
        - .dll
        - .bin
        - .bat
        - .cmd
        - .js
        - .msh
        - .reg
        - .scr
        - .ps
        - .vb
        - .jar
        - .pl
        - '.inf'
        - .cpl
        - .hta
        - .msi
        - .vbs
      condition: all of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_1:
        CommandLine|contains:
        - echo
        - copy
        - type
        - file createnew
        - cacls
      selection_2:
        CommandLine|contains: C:\Windows\Fonts\
      selection_3:
        CommandLine|contains:
        - .sh
        - .exe
        - .dll
        - .bin
        - .bat
        - .cmd
        - .js
        - .msh
        - .reg
        - .scr
        - .ps
        - .vb
        - .jar
        - .pl
        - '.inf'
        - .cpl
        - .hta
        - .msi
        - .vbs
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_1:
        CommandLine|contains:
        - echo
        - copy
        - type
        - file createnew
        - cacls
      selection_2:
        CommandLine|contains: C:\Windows\Fonts\
      selection_3:
        CommandLine|contains:
        - .sh
        - .exe
        - .dll
        - .bin
        - .bat
        - .cmd
        - .js
        - .msh
        - .reg
        - .scr
        - .ps
        - .vb
        - .jar
        - .pl
        - '.inf'
        - .cpl
        - .hta
        - .msi
        - .vbs
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate
    context — what led to this write, what happened after, and whether it is part of a larger sequence. Look
    for reconnaissance, permission modification, persistence installation, or additional file staging in the
    same window.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access,
    initial access over a remote session — may reveal the attack stages that preceded the file staging and
    help reconstruct the full timeline. File-hiding tradecraft in a system directory often follows an initial
    foothold rather than starting it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host?
  context: Attackers rarely rely on a single persistence mechanism. After staging a file in an unusual
    location, they commonly install backup mechanisms using different techniques — scheduled tasks, services,
    registry Run keys, BITS jobs, or WMI subscriptions. Multiple persistence installations in the same
    timeframe indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations such as the Startup folder or scheduled-task definition paths on this
    host?
  context: File-based persistence bypasses command-line detection entirely. Dropping an executable or script
    into the Startup folder or a path referenced by a registry Run key achieves persistence without invoking
    standard persistence tools. File event monitoring captures these drops, which can run in parallel to the
    Fonts-folder staging that triggered this alert.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Was there a change ticket, maintenance window, or documented approval for writing this file into
    the Fonts folder?
  context: Many organizations require change tickets for system modifications. Writing an executable into a
    protected system directory is an unusual operation; a corresponding ticket suggests authorized activity,
    while the absence of one when policy requires it suggests the action was unauthorized. This check can
    quickly close a false positive or escalate a true positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this activity align with normal work hours and maintenance windows?
  context: Legitimate system changes typically occur during business hours or scheduled maintenance windows.
    Writing files into a system directory at an unusual hour, or outside any documented maintenance window, is
    more suspicious than the same activity during a planned change. Check whether the local host time was
    reasonable and whether a maintenance window covered it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
