name: CobaltStrike Load by Rundll32
id: bd9b7398-7b1c-476d-b130-4f4bb6a7cf26
description: |
  Detects rundll32.exe invoked with a command line that references a .dll and ends in a StartW export entrypoint
  (' StartW' or ',StartW'). This pattern matches the default DLL Beacon loading convention used by Cobalt Strike,
  where rundll32 proxies execution of an attacker-supplied DLL through a trusted signed Windows binary. The rule
  fires only when both the rundll32 identity (Image, OriginalFileName, or command-line reference) AND the .dll +
  StartW parameter pattern are present. Legitimate software occasionally exports StartW, so the investigation should
  confirm the loaded DLL's location, signature, and origin, reconstruct the parent chain, and check for the DLL
  load and outbound network activity that a staged Beacon would produce.
type: detection
detection_id: ae9c6a7c-9521-42a6-915e-5aaa8689d529
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line invoke rundll32 against a .dll and end in a StartW entrypoint?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when the
    process is rundll32 (by Image, OriginalFileName, or a rundll32 reference in the command line) AND the command
    line both contains .dll and ends in ' StartW' or ',StartW'. Read the exact command line and note which DLL path
    is being passed and whether the StartW export is the terminal argument.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run rundll32 against a DLL with a StartW entrypoint?
  context: Legitimate administrative or installer activity can pass DLLs to rundll32, but the StartW export
    convention is uncommon outside the Cobalt Strike DLL Beacon. Knowing whether the user role and host function
    plausibly involve this kind of execution is often the fastest path to separating a true positive from routine
    operations.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this rundll32 DLL load part of an authorized penetration test or red team engagement?
  context: The StartW DLL-loading convention is a default offensive-tooling artifact and is used in authorized
    security assessments. Before deeper analysis, check whether a pentest or red team exercise is currently active
    on this host or network segment. An authorized engagement with matching tool usage and timing resolves the
    alert without further work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which DLL and export entrypoint were passed to rundll32?
  context: The specific DLL path and export name reveal what is actually being loaded. Identify the full DLL path,
    whether it lives in a user-writable or non-standard directory, and whether the terminal export is StartW or a
    further-obfuscated ordinal. The DLL path and entrypoint determine the scope of potential compromise and the
    next pivot.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What is the full rundll32 command line, and what DLL path and arguments did it carry?
  context: The full command line reveals the specific DLL being mapped and any additional arguments after the
    export name. Decode the DLL path, resolve any environment-variable expansion, and note whether the path points
    to a system directory, a user profile, a temp location, or a network share. Multiple rundll32 invocations close
    in time may together form one logical staging operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: .dll
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this rundll32 and is that parent chain expected?
  context: The parent process reveals how rundll32 was invoked. Loads driven by explorer.exe, services.exe, or a
    known installer differ sharply from loads spawned by a command shell, a script host such as wscript.exe or
    mshta.exe, or an Office application. A spawning chain rooted in a shell or scripting host points toward
    operator-driven or macro-driven execution rather than software behavior.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Was the DLL passed to rundll32 actually loaded into the rundll32 process, and is it signed?
  context: A rundll32 command line referencing a DLL is only the invocation; the load event confirms the module was
    mapped into memory and exposes its on-disk path and signature state. An unsigned DLL, or one loaded from a user
    profile, temp directory, or other user-writable location, is the anomaly worth chasing. If image-load telemetry
    is not collected in this environment, treat zero results as a visibility gap rather than evidence nothing
    loaded, and fall back to the on-disk DLL path from the command line.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- question: Did this rundll32 process make outbound network connections after loading the DLL?
  context: A staged DLL Beacon typically reaches out to a command-and-control endpoint shortly after it is mapped.
    Outbound connections from rundll32 — especially to an external address on a web or alternate port — corroborate
    that the loaded DLL is a network-capable payload rather than a benign helper. If network telemetry for this
    process is not collected, treat zero results as a visibility gap.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Did this rundll32 process create files or named-pipe artifacts on the host?
  context: A loaded Beacon leaves characteristic artifacts — named pipes used for internal communication, dropped
    secondary payloads, or staging files. Files written by the rundll32 process after the load confirm hands-on
    activity and reveal the scope even if the original process has exited.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What child processes did this rundll32 spawn afterward?
  context: A DLL Beacon commonly spawns or injects into follow-on processes for post-exploitation — command shells,
    powershell.exe, or discovery binaries. Processes spawned by this rundll32 reveal its actual impact;
    rundll32 legitimately spawning little or nothing, versus spawning a shell, sharply changes the disposition.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host previously fired this rundll32-StartW pattern, what parents and users drove it, and does
    the current alert fit?
  context: Even trusted binaries can be abused. The query mirrors the rule's selection structure scoped to this
    host, so the resulting parent and user distribution reflects how this specific firing pattern — not generic
    rundll32 usage — has historically run here. A new parent process, an unexpected user account, or an unusual
    command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_rundll:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      - CommandLine|contains:
        - rundll32.exe
        - 'rundll32 '
      selection_params:
        CommandLine|contains: .dll
        CommandLine|endswith:
        - ' StartW'
        - ',StartW'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_rundll:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      - CommandLine|contains:
        - rundll32.exe
        - 'rundll32 '
      selection_params:
        CommandLine|contains: .dll
        CommandLine|endswith:
        - ' StartW'
        - ',StartW'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_rundll:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      - CommandLine|contains:
        - rundll32.exe
        - 'rundll32 '
      selection_params:
        CommandLine|contains: .dll
        CommandLine|endswith:
        - ' StartW'
        - ',StartW'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spread across
    multiple endpoints. If the same user triggered similar activity on other hosts, the scope of the operation may
    be larger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_rundll:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      - CommandLine|contains:
        - rundll32.exe
        - 'rundll32 '
      selection_params:
        CommandLine|contains: .dll
        CommandLine|endswith:
        - ' StartW'
        - ',StartW'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired this rundll32-StartW pattern in the past week, and does the distribution look
    like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count
    of this specific firing pattern rather than generic rundll32 usage. Many hosts firing the same pattern points
    to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator
    activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_rundll:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      - CommandLine|contains:
        - rundll32.exe
        - 'rundll32 '
      selection_params:
        CommandLine|contains: .dll
        CommandLine|endswith:
        - ' StartW'
        - ',StartW'
      condition: all of selection*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering,
    reconnaissance, credential access, or initial-access tooling — may reveal the stages that preceded this DLL
    load and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
