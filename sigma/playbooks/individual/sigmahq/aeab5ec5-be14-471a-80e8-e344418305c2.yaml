name: Potential PlugX Activity
id: 35aa9721-d5b2-480b-ad6c-5c6eb695c12b
description: |
  Fires when a process whose file name matches one of twelve legitimate utilities historically abused for DLL side-loading
  (CamMute.exe, chrome_frame_helper.exe, dvcemumanager.exe, Gadget.exe, hcc.exe, hkcmd.exe, Mc.exe, MsMpEng.exe, msseces.exe,
  OInfoP11.exe, OleView.exe, rc.exe) executes from a directory outside that binary's expected install location. The rule is an
  OR across twelve independent binary-and-path pairs: either CamMute.exe running from outside the Lenovo Communication(s)
  Utility directories, or chrome_frame_helper.exe from outside the Chrome application directory, or MsMpEng.exe from outside
  the Windows Defender / Microsoft Security Client / AntiMalware directories, and so on for each remaining binary — any single
  pair matching is enough to fire. Only one pair fires at a time, so the first triage step is to identify which binary and
  which missing install path produced the alert.
  The alerting executable is normally a genuine, signed vendor or Microsoft file, so its signature is the premise of the
  technique rather than a finding: under T1574.001 an actor relocates the signed binary to a directory they control and places
  a malicious DLL with the name the binary loads by search order beside it, so execution of the trusted binary loads attacker
  code (T1036 masquerading is the companion effect). The PlugX family is the canonical user of this pattern, but the technique
  is generic. Investigation should establish the exact path the binary ran from, which DLLs it loaded and whether they are
  unsigned or signed by an unexpected publisher, what wrote the executable and its neighbours into that directory, and whether
  a service or autorun entry was registered to reload the pair at boot.
type: detection
detection_id: aeab5ec5-be14-471a-80e8-e344418305c2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the alerting process match one of the rule's binary-and-path pairs — a known-good utility running from outside
    its expected install directory?
  context: >-
    The rule checks twelve independent pairs and fires if any one of them matches: the file name ends in one of CamMute.exe,
    chrome_frame_helper.exe, dvcemumanager.exe, Gadget.exe, hcc.exe, hkcmd.exe, Mc.exe, MsMpEng.exe, msseces.exe, OInfoP11.exe,
    OleView.exe or rc.exe, AND the full path does not contain that binary's known install directory (Lenovo Communication(s)
    Utility, Google\Chrome\application, Microsoft Device Emulator, Windows Media Player, HTML Help Workshop, System32/SysNative/SysWow64,
    Visual Studio / SDK / Windows Kit, Windows Defender / Microsoft Security Client / AntiMalware, Microsoft Security Center /
    Client / Essentials, Common Files\Microsoft Shared, Windows Resource Kit, Microsoft.NET). Read the full Image path and note
    which name fired and which expected directory is missing — that pair determines which vendor's install layout is the correct
    baseline for the rest of the investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run this utility from a non-standard directory?
  context: Some environments genuinely relocate these binaries — a portable SDK checkout, a developer build tree, a software
    packaging staging area, or a vendor installer that unpacks to a temporary directory. Knowing the host's function and the
    user's role is often the fastest way to separate that from a relocated signed binary placed there to load an attacker DLL.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Does the timing of this execution align with normal work hours and maintenance windows?
  context: A relocated copy of one of these utilities running during a documented software packaging, imaging, or SDK build
    window is a different proposition from the same execution overnight on a workstation with no build activity. Check the
    host's local time, the user's normal working hours, and whether any scheduled job or deployment was due to run.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - asset_inventory
- question: What exact path did this binary run from, and what command line and working directory did it use?
  context: This rule is path-driven rather than argument-driven, so the directory is the payload-bearing detail. Note the parent
    directory, then treat it as the directory of interest for the rest of the investigation — side-loading requires the malicious
    DLL to sit in the binary's own directory or in an earlier search-order location. A working directory that differs from the
    executable's directory can indicate the binary was launched by a script or loader rather than by a user.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - Image
  answer_sources:
  - process_creation
  - manual_review
- question: Which DLLs did the alerting process load, and were any of them unsigned or signed by an unexpected publisher?
  context: The relocated executable is genuine and signed; the DLL beside it is the payload, so the loaded modules are where
    the technique is actually visible. Compare each loaded module's directory against the executable's directory — a module
    loaded from the same non-standard directory, especially one that is unsigned or whose signer does not match the executable's
    vendor, is the side-loaded library. Record its hash for reputation lookup. Alternate-data-stream provenance marks are not
    collected in this pipeline, so module signature and hash are the available substitute for judging where the DLL came from;
    an endpoint console or manual disk review can supply stream metadata if needed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - edr_console
  - external_threat_intel
  - manual_review
- question: When was this executable written to that directory, and which process wrote it?
  context: A signed vendor binary does not relocate itself. Identifying the write event gives both the staging time and the
    writing process — an archive utility, a browser download, a script interpreter, or a remote-access agent each point at a
    different delivery path. Use the write timestamp as the window for correlating the DLL drop, and pivot on the writing
    process to see what else it placed in the same directory.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
      - ProcessGuid
  answer_sources:
  - file_event
  - process_creation
- question: Was a service or autorun registry entry created on this host around this execution?
  context: Loaders that rely on side-loading typically register the relocated host binary as a service or an autorun entry so
    the pair reloads at boot without the operator returning. Check whether any Run, RunOnce, or Services value written in this
    window references the alerting binary's directory. Registry value deletion is not observable here, so judge cleanup by
    re-modification history rather than by absence of the key.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\CurrentVersion\Run'
          - '\CurrentVersion\RunOnce'
          - '\CurrentControlSet\Services\'
          - '\ControlSet001\Services\'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: What process spawned this binary and is that parent chain expected?
  context: These utilities have narrow legitimate launchers — a vendor service, an installer, a build script, or explorer.exe
    for the interactive cases. A parent such as a script host, an archive tool, an office application, or a shell launched from
    a temporary directory points at delivery rather than at the vendor's own product. Walk further up the tree if the immediate
    parent is itself generic.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What child processes did this binary spawn afterward?
  context: Once a loader DLL is executing inside the trusted process, its actions appear as children of that process. Legitimate
    copies of these utilities have predictable and usually empty child sets; command interpreters, script hosts, credential
    tooling, or archive utilities spawned by them reflect the loaded module's activity rather than the vendor binary's.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and
    does the current alert fit that pattern?
  context: The query mirrors the rule's selection structure scoped to this host, so the resulting parent/user distribution
    reflects how this specific relocated-binary pattern has historically run here rather than generic use of the binary. A host
    that regularly produces the pattern under a build service or packaging account has a tuning story; a first occurrence, a new
    parent, or an unexpected account is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cammute:
        Image|endswith: \CamMute.exe
      filter_cammute:
        Image|contains:
        - \Lenovo\Communication Utility\
        - \Lenovo\Communications Utility\
      selection_chrome_frame:
        Image|endswith: \chrome_frame_helper.exe
      filter_chrome_frame:
        Image|contains: \Google\Chrome\application\
      selection_devemu:
        Image|endswith: \dvcemumanager.exe
      filter_devemu:
        Image|contains: \Microsoft Device Emulator\
      selection_gadget:
        Image|endswith: \Gadget.exe
      filter_gadget:
        Image|contains: \Windows Media Player\
      selection_hcc:
        Image|endswith: \hcc.exe
      filter_hcc:
        Image|contains: \HTML Help Workshop\
      selection_hkcmd:
        Image|endswith: \hkcmd.exe
      filter_hkcmd:
        Image|contains:
        - \System32\
        - \SysNative\
        - \SysWow64\
      selection_mc:
        Image|endswith: \Mc.exe
      filter_mc:
        Image|contains:
        - \Microsoft Visual Studio
        - \Microsoft SDK
        - \Windows Kit
      selection_msmpeng:
        Image|endswith: \MsMpEng.exe
      filter_msmpeng:
        Image|contains:
        - \Microsoft Security Client\
        - \Windows Defender\
        - \AntiMalware\
      selection_msseces:
        Image|endswith: \msseces.exe
      filter_msseces:
        Image|contains:
        - \Microsoft Security Center\
        - \Microsoft Security Client\
        - \Microsoft Security Essentials\
      selection_oinfo:
        Image|endswith: \OInfoP11.exe
      filter_oinfo:
        Image|contains: \Common Files\Microsoft Shared\
      selection_oleview:
        Image|endswith: \OleView.exe
      filter_oleview:
        Image|contains:
        - \Microsoft Visual Studio
        - \Microsoft SDK
        - \Windows Kit
        - \Windows Resource Kit\
      selection_rc:
        Image|endswith: \rc.exe
      filter_rc:
        Image|contains:
        - \Microsoft Visual Studio
        - \Microsoft SDK
        - \Windows Kit
        - \Windows Resource Kit\
        - \Microsoft.NET\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (( selection_cammute and not filter_cammute ) or ( selection_chrome_frame and not filter_chrome_frame ) or ( selection_devemu and not filter_devemu ) or ( selection_gadget and not filter_gadget ) or ( selection_hcc and not filter_hcc ) or ( selection_hkcmd and not filter_hkcmd ) or ( selection_mc and not filter_mc ) or ( selection_msmpeng and not filter_msmpeng ) or ( selection_msseces and not filter_msseces ) or ( selection_oinfo and not filter_oinfo ) or ( selection_oleview and not filter_oleview ) or ( selection_rc and not filter_rc )) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
