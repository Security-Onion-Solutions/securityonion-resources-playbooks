- question: Were other process-based persistence mechanisms installed on this host?
  context: Side-loading gives execution under a trusted binary, but it still needs something to start that binary at boot or
    logon. Scheduled tasks, services, Run-key writes, BITS jobs, and WMI subscriptions created in the same window are the
    parallel mechanisms to look for, and several installed together reflect deliberate stacking rather than an isolated
    administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
