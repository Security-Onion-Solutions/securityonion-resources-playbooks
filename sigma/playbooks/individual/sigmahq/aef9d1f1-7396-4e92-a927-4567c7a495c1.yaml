name: Suspicious Git Clone
id: 82070ce4-0516-4ce0-a9c9-3d7358d5b1a4
description: |
  Detects git.exe (or git-remote-https.exe, or a renamed binary whose OriginalFileName is git.exe) invoked to clone a
  remote repository when the command line also carries a security-research keyword such as exploit, CVE-, proxyshell,
  log4shell, eternalblue, RemoteCodeExecution, or ProofOfConcept. All three conditions must hold together: the git binary,
  a clone (or git-remote-https) operation, and at least one suspicious keyword. Cloning exploit or proof-of-concept
  repositories is routine for security researchers, penetration testers, and developers patching against a CVE, but the
  same pattern appears when an operator stages offensive tooling on a host. Determine who ran it, what repository was
  fetched, and whether the host went on to build or execute the cloned code.
type: detection
detection_id: aef9d1f1-7396-4e92-a927-4567c7a495c1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line show a git clone (or git-remote-https) operation carrying a security-research keyword?
  context: Confirm the alert is a true positive by reviewing the exact command line. The rule fires only when the git binary,
    a clone or git-remote-https operation, AND a suspicious keyword (exploit, CVE-, proxyshell, log4shell, eternalblue,
    RemoteCodeExecution, ProofOfConcept, and similar) are all present together. Read the cloned repository URL or path and
    note which keyword matched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to clone exploit or proof-of-concept repositories?
  context: Security researchers, penetration testers, vulnerability-management teams, and developers patching a CVE all
    legitimately clone exploit or PoC repositories. Knowing whether the user role and host function include security research
    or development is often the fastest path to distinguishing routine work from an operator staging offensive tooling.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What repository was cloned, and what does the full git command line reveal?
  context: The full command line reveals the target of the clone. Read the repository URL or path, the destination directory,
    and any additional git flags. Identify which security-research keyword matched and whether the repository name points
    to a specific exploit, CVE, or proof-of-concept project. This scope returns all git executions on this host within the
    window, which can surface follow-on git operations (checkout, submodule update) that belong to the same logical action.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned git, and is that parent chain expected?
  context: The parent process reveals how git was invoked. Interactive use from a shell or an IDE terminal is routine for
    developers and researchers. A parent such as a script host, an Office application, or a remote-management agent points
    to scripted or operator-driven invocation rather than hands-on developer work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Does this host normally run git?
  context: A host that has never run git is more notable than a developer workstation where git runs constantly. Zero or
    very low historical counts indicate first-time or rare execution and raise the weight of the matched keyword.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive it, and does the
    current alert fit that pattern?
  context: Even routine developer hosts can be misused. This query mirrors the rule's full selection (git binary AND clone
    or git-remote-https AND a security-research keyword) scoped to this host, so the resulting parent and user distribution
    reflects how this specific firing pattern has historically run here. A new parent process, an unexpected user account,
    or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \git.exe
        - \git-remote-https.exe
      - OriginalFileName: git.exe
      selection_cli:
        CommandLine|contains:
        - ' clone '
        - 'git-remote-https '
      selection_keyword:
        CommandLine|contains:
        - exploit
        - Vulns
        - vulnerability
        - RemoteCodeExecution
        - Invoke-
        - CVE-
        - poc-
        - ProofOfConcept
        - proxyshell
        - log4shell
        - eternalblue
        - eternal-blue
        - MS17-
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did git spawn afterward?
  context: Cloning code is reconnaissance; the next step is often to build or run it. Child processes such as a compiler,
    a script interpreter, msbuild, python, or a shell shortly after the clone indicate the cloned exploit code was executed
    or compiled rather than merely fetched and reviewed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other tools ran on this host around the same time?
  context: Reconnaissance rarely occurs alone. Activity surrounding the clone may reveal additional download tools, archive
    utilities, build chains, or follow-on execution that places the fetched exploit code in a larger operational context.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like
    consistent automation or one-off activity?
  context: This query mirrors the rule's full selection with no host scope, so the result is a fleet-wide count of the
    rule's firing pattern rather than generic git usage. Many hosts cloning the same kind of keyword-bearing repositories
    points to a sanctioned research or CI/CD process; one host or a small unrelated set points to manual operator activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \git.exe
        - \git-remote-https.exe
      - OriginalFileName: git.exe
      selection_cli:
        CommandLine|contains:
        - ' clone '
        - 'git-remote-https '
      selection_keyword:
        CommandLine|contains:
        - exploit
        - Vulns
        - vulnerability
        - RemoteCodeExecution
        - Invoke-
        - CVE-
        - poc-
        - ProofOfConcept
        - proxyshell
        - log4shell
        - eternalblue
        - eternal-blue
        - MS17-
      condition: all of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \git.exe
        - \git-remote-https.exe
      - OriginalFileName: git.exe
      selection_cli:
        CommandLine|contains:
        - ' clone '
        - 'git-remote-https '
      selection_keyword:
        CommandLine|contains:
        - exploit
        - Vulns
        - vulnerability
        - RemoteCodeExecution
        - Invoke-
        - CVE-
        - poc-
        - ProofOfConcept
        - proxyshell
        - log4shell
        - eternalblue
        - eternal-blue
        - MS17-
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \git.exe
        - \git-remote-https.exe
      - OriginalFileName: git.exe
      selection_cli:
        CommandLine|contains:
        - ' clone '
        - 'git-remote-https '
      selection_keyword:
        CommandLine|contains:
        - exploit
        - Vulns
        - vulnerability
        - RemoteCodeExecution
        - Invoke-
        - CVE-
        - poc-
        - ProofOfConcept
        - proxyshell
        - log4shell
        - eternalblue
        - eternal-blue
        - MS17-
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the clone was an isolated action or part of broader
    movement. If the same user fetched keyword-bearing repositories or ran offensive tooling on multiple endpoints, the
    scope may be larger than a single workstation.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \git.exe
        - \git-remote-https.exe
      - OriginalFileName: git.exe
      selection_cli:
        CommandLine|contains:
        - ' clone '
        - 'git-remote-https '
      selection_keyword:
        CommandLine|contains:
        - exploit
        - Vulns
        - vulnerability
        - RemoteCodeExecution
        - Invoke-
        - CVE-
        - poc-
        - ProofOfConcept
        - proxyshell
        - log4shell
        - eternalblue
        - eternal-blue
        - MS17-
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the clone reveals what led to it and what followed —
    additional download tools, build activity, or execution of the fetched code — and whether it is part of a larger
    sequence on this host.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — reconnaissance, defense tampering, or credential access — may reveal the
    stages that preceded the clone and help reconstruct the timeline. The alert sequence often tells the operational story.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
