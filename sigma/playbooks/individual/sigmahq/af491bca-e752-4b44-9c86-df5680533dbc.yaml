name: Finger.EXE Execution
id: 19982686-f711-44a2-975f-40593bb11f95
description: |
  Detects execution of finger.exe, an old TCP/IP Finger client present on modern Windows that queries a remote
  Finger daemon for user information. Because the client writes the remote response to stdout, it can be repurposed
  as a file downloader, command-execution channel, and lightweight command-and-control transport: the attacker-controlled
  user token in a query carries an encoded request, the response is redirected to disk, and base64 payloads are
  reconstructed with certutil. Legitimate use is now rare, so the investigation should determine what the finger
  command actually did, whether a payload landed on disk, and whether outbound activity or follow-on tooling indicates
  ingress tool transfer rather than benign administrative testing.
type: detection
detection_id: af491bca-e752-4b44-9c86-df5680533dbc
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Was the alerting process finger.exe, identified by its original filename or its image path?
  context: Confirm the alert is a true positive before investing investigation time. The rule fires when a process
    either reports an original filename of finger.exe or runs from an image path ending in finger.exe, so a renamed
    copy still matches. Review the full command line and image details against that criterion.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Is this user and host expected to run the finger client?
  context: Legitimate finger use is rare on modern Windows, and the utility is normally absent from day-to-day
    administration. Knowing whether the user role and host function plausibly involve querying a remote Finger
    daemon is often the fastest way to separate routine testing from abuse.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did the finger command do? Decode the query target and any output redirection.
  context: The full command line reveals the operation. The token before the @ in a finger query is attacker-controlled
    and is used to encode download or exfil requests, while a redirection to a file writes the remote response to disk.
    Decode the user token, the remote host, and any redirection target to understand whether this was a benign lookup
    or a staged transfer.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned finger.exe and is that parent chain expected?
  context: The parent process reveals how the client was invoked. Document automation and macro-driven payloads
    commonly launch finger.exe from office applications, script hosts such as wscript.exe or mshta.exe, or a
    command shell, whereas a direct interactive launch from a console looks different. An unexpected parent points
    toward exploitation or a malicious document.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What outbound network connections did finger.exe make, and were they to external addresses or on the
    Finger port?
  context: The Finger protocol uses TCP port 79, which is often blocked outbound, so abuse frequently splices it to
    another port using a port-proxy rule. Outbound connections from finger.exe to an external address, or to TCP 79,
    indicate a transfer or command-and-control attempt rather than a local lookup. Distinguish internal destinations
    from external ones to gauge whether data left the environment.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - Initiated
- question: What child processes did finger.exe activity lead to afterward?
  context: A finger download is rarely the end of the chain. Reconstructing a redirected payload typically involves
    stripping a banner and decoding base64, so look for follow-on use of more, certutil with a decode argument, or a
    command shell, as well as execution of any reconstructed binary. Unexpected children are evidence the transfer
    progressed to execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is a file written by this activity still on disk for analysis?
  context: When the finger response is redirected to a file, the resulting payload or decoded binary may remain on
    disk. Checking whether referenced files still exist enables hash lookups, sandbox submission, or content review.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did the transfer succeed? Check for file creation at the destination path.
  context: A finger command does not guarantee a file was written. The redirection may have produced an empty or
    partial file, or the remote host may not have responded. Confirming file creation at the target path establishes
    whether the activity moved past the delivery stage.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What did finger write to disk, and can you decode and analyze it?
  context: Finger transfers carry base64 text that is redirected to a file and later decoded into a binary — so
    the on-disk file is text, not the payload itself, and file-creation events carry no hash anyway. Retrieve the
    file from the path below, decode it to reconstruct the binary (which differs from the on-disk text), then hash
    that for a reputation lookup or detonate it. If the reconstructed payload was executed, its hash is also on its
    process event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other file activity occurred in the same directory as the written file?
  context: Operators often stage multiple files in one directory, and a reconstructed payload may trigger further
    writes during decoding or extraction. Examining directory-level file activity reveals the broader scope of the
    delivery, including a base64 text file alongside its decoded binary.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Does this host normally run finger.exe?
  context: A process that has never been seen on a host is more suspicious than one that runs regularly. Given how
    rare legitimate finger use is, zero or very low historical counts strongly indicate first-time or anomalous execution.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that
    activity, and does the current alert fit that pattern?
  context: Even rare tools can have a benign local pattern. The query mirrors the rule's selection scoped to this host,
    so the resulting parent and user distribution reflects how this specific firing pattern has historically run here.
    A new parent process, an unexpected user account, or an unusual command structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - OriginalFileName: finger.exe
      - Image|endswith: \finger.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look
    like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this firing pattern.
    Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated
    set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - OriginalFileName: finger.exe
      - Image|endswith: \finger.exe
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - OriginalFileName: finger.exe
      - Image|endswith: \finger.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - OriginalFileName: finger.exe
      - Image|endswith: \finger.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple
    endpoints. If the same user triggered similar activity on several hosts, the scope of the operation may be larger
    than a single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - OriginalFileName: finger.exe
      - Image|endswith: \finger.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — reconnaissance, defense tampering,
    or staging — may reveal the attack stages that preceded an ingress tool transfer and help reconstruct the full
    timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
