name: Microsoft Excel Add-In Loaded From Uncommon Location
id: 220da9d3-9f0e-4766-8a74-5e4b278614c0
description: |
  Detects excel.exe loading an Excel add-in (.xll) from a user-writable or otherwise uncommon
  location - Desktop, Downloads, Perflogs, Temp, Users\Public, or Windows\Tasks. The rule fires
  when the loading process ends in \excel.exe AND the loaded module path contains one of those
  directories AND ends in .xll. An .xll is a native DLL that Excel loads and executes; legitimate
  add-ins normally live under Program Files or a managed add-in path, so a load from a download or
  temp directory is a known malicious-file delivery pattern where a user opens a delivered .xll and
  Excel runs it, frequently followed by a spawned helper process and outbound network activity.
  Investigate whether the module is unsigned, how it reached disk, what delivered it, whether Excel
  spawned a child process or reached out to the network afterward, and whether the same add-in or
  pattern appears on other hosts.
type: detection
detection_id: af4c4609-5755-42fe-8075-4effb49f5d44
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the loaded module match what this rule detects - an .xll add-in loaded by Excel from a user-writable location?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires when excel.exe loads
    a module whose path ends in .xll AND sits under a user-writable or uncommon directory (Desktop,
    Downloads, Perflogs, Temp, Users\Public, or Windows\Tasks). Review the exact ImageLoaded path,
    its code-signature status, and that the loading process is genuinely excel.exe. A .xll is a native
    DLL, so the load event carries the module's signing status and hash directly - a signed add-in
    from a managed path is routine, an unsigned .xll from a download or temp folder is the setup step
    of add-in abuse.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Is this user and host expected to load third-party Excel add-ins from a download or temp location?
  context: >-
    Legitimate add-in deployment is typically managed and installs to Program Files or an
    administrator-controlled add-in path, not to a per-user download or temp directory. Knowing
    whether this account and host function match any sanctioned add-in use is often the fastest way
    to separate an approved plugin or a developer test from a delivered malicious file. Image-load
    events carry the loading user on most endpoints; when the account is a machine account or missing,
    pivot on the loading process instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the full path of the loaded .xll, and is it from a user-writable directory or unsigned?
  context: >-
    The module Excel loaded tells the story the alert summarizes. Look at whether the .xll sits under
    Downloads, Temp, Desktop, Users\Public, Perflogs, or Windows\Tasks - all user-writable staging
    directories a delivered file lands in - and whether it is unsigned or carries a mismatched signer.
    A native add-in DLL loaded from one of these locations, rather than a managed add-in path, is the
    core behavior this rule flags; the signing status and hash on the load event set up reputation
    analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: What is the .xll add-in's signing status, hash, and threat-intel reputation?
  context: >-
    Module reputation separates a routine third-party add-in from a delivered malicious one. An
    unsigned .xll, or one carrying a Microsoft-style filename with no valid signature, is a strong
    masquerading signal; a genuinely signed add-in from a known publisher may still be legitimate even
    from an unusual path. Use the SignatureStatus values - Valid, Unsigned, Expired, Distrusted,
    Invalid - to weight the load, and pivot the hash to threat intelligence to surface known loaders.
    Maintain a trusted-signer allow list so benign publisher add-ins do not repeatedly draw attention.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What document, email attachment, or download delivered this add-in and launched Excel?
  context: >-
    A malicious .xll is typically delivered as an email attachment or a web download and then opened
    by the user, at which point Excel loads it. Reviewing the parent process and its command line
    shows how Excel was invoked - directly on an opened .xll, from a mail client, or from a browser
    download folder - and the document or file name involved. That name and origin enable blocking at
    the perimeter and searching for other recipients. Download-origin metadata such as a
    mark-of-the-web zone marker is not queryable here and must be checked on the host or in the mail
    or web gateway.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: How did the .xll file reach disk - what process wrote it, and when?
  context: >-
    The add-in had to be written to the user-writable location before Excel loaded it. Correlating the
    file write of this exact .xll surfaces the process that staged it - a browser, mail client, archive
    utility, or script host - which distinguishes a user-initiated download from a file dropped by
    another process already running on the host. The gap between the write time and the load time also
    indicates whether the user opened it immediately or the file sat staged for a while.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did Excel or its child processes write any payload files to disk that are still present for analysis?
  context: >-
    Add-in abuse commonly stages a second-stage payload - a masqueraded executable dropped to a temp
    path, a decoded script, or a downloaded binary - written by Excel or a process it spawned.
    Correlating file writes to the loading process and its direct children shows what landed on disk
    and whether it is still present for hashing, sandboxing, or content review. A file that spawned a
    child process is a lead for the follow-on execution.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What child processes did Excel spawn after loading the add-in?
  context: >-
    A native add-in runs arbitrary code inside Excel, and the common next step is Excel spawning a
    helper process. Legitimate add-ins rarely launch command interpreters or script hosts; a child
    such as powershell.exe, cmd.exe, wscript.exe, cscript.exe, mshta.exe, rundll32.exe, regsvr32.exe,
    or msiexec.exe - or a masqueraded binary running from a temp path, sometimes with a benign-looking
    extension - points to post-load execution. Review the children of excel.exe on this host in the
    window after the load.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did the Excel process reach out to the network after loading the add-in?
  context: >-
    A loaded add-in frequently makes an immediate outbound connection - a DNS lookup and HTTP(S)
    request to retrieve or contact a second stage. Outbound connections initiated by excel.exe shortly
    after the load, especially to external addresses outside normal update or telemetry destinations,
    tie the add-in to command-and-control or payload retrieval. Correlate the destination and timing
    with any child process the load spawned, and maintain an egress allow list for known corporate
    update and content-delivery endpoints so routine traffic does not obscure the signal.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Has this specific .xll add-in been loaded on this host before, and under what processes?
  context: >-
    A first-time module load on a host is a stronger anomaly than a recurring one. If the same .xll has
    been loaded by excel.exe repeatedly over the past 90 days, this load is probably a routine add-in;
    if this is the first occurrence, or the file name has only appeared under unrelated processes, the
    current load stands out. Compare the loading processes to confirm the add-in is not part of a
    normal, recurring workflow.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: When this host has previously fired this add-in-load pattern, what programs and users normally drive it, and does the current alert fit?
  context: >-
    Even a location that occasionally sees add-ins can have a normal profile. This query mirrors
    the rule's exact selection - excel.exe loading a .xll from the flagged directories - scoped
    to this host, so the resulting program and user distribution reflects how this specific
    pattern has run here historically, not generic Excel usage. A new acting program process, an
    unexpected user account, or a first-ever occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith: \excel.exe
        ImageLoaded|contains:
        - \Desktop\
        - \Downloads\
        - \Perflogs\
        - \Temp\
        - \Users\Public\
        - \Windows\Tasks\
        ImageLoaded|endswith: .xll
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts loaded an .xll from these locations in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    This query mirrors the rule's selection with no host scope, giving a fleet-wide count of the same
    add-in-load pattern rather than generic Excel usage. Many hosts loading a .xll from these
    directories in a short window points to a spreading delivery campaign or a mis-scoped software
    push; one host or a small unrelated set points to a targeted or one-off delivery. Use the host
    distribution and the consistency of the add-in name to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith: \excel.exe
        ImageLoaded|contains:
        - \Desktop\
        - \Downloads\
        - \Perflogs\
        - \Temp\
        - \Users\Public\
        - \Windows\Tasks\
        ImageLoaded|endswith: .xll
      condition: selection
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity in a tight window around the load
    surfaces what led up to it and what ran immediately after. Novel parent-child pairs stand out at
    low counts against high-count routine telemetry, which is what points to a helper process launched
    by the add-in or to reconnaissance and staging that accompanied the delivery.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - a suspicious download, script execution, or reconnaissance -
    may reveal the stages that preceded the add-in load and help reconstruct the delivery timeline. A
    malicious add-in is usually one step in a chain, so prior alerts help place this load within a
    larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Did the same add-in-load pattern fire on other users or systems?
  context: >-
    Delivery of a malicious document or add-in rarely targets a single user. If one account loaded a
    delivered .xll, others may have received the same file. Correlating this detection across all hosts
    reveals the breadth of the delivery and identifies additional systems that need investigation and
    the same containment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this Excel installation patched, and are add-in trust settings configured to block untrusted .xll files?
  context: >-
    Add-in loading is governed by Office trust settings; an environment that permits unsigned or
    unmanaged add-ins to load lets a delivered .xll run with no prompt. Confirming the Office build is
    current and that add-in and macro trust policies restrict untrusted add-ins indicates whether this
    load was possible by design and whether other similarly configured hosts are exposed to the same
    delivery.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
