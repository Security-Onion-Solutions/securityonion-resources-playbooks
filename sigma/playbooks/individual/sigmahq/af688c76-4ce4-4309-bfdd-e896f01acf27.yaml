name: Grixba Malware Reconnaissance Activity
id: 35cf5f60-a32a-4518-b3b4-27fae937324f
description: |
  Detects a process whose command line simultaneously carries all four argument groups of a purpose-built
  enumeration tool: a mode flag (-m / -mode, space- or colon-delimited), an input flag (-i / -input), a scan
  mode value (scan / scanall), and an input-scope option (:f / :r / :s or the bare f / r / s equivalents). No
  binary name is pinned — the rule fires purely on the argument structure, so a renamed or newly compiled copy
  still matches, and identifying which binary actually ran is part of triage. Tools with this argument profile
  inventory installed software, running services, security products, open ports, and reachable network devices,
  and they are run after an operator already has a foothold, to decide what to do next. Legitimate cause is
  narrow: inventory and asset-management utilities do enumerate installed software with similar flags, and the
  looser tokens in the last group (' f ', ' r ', ' s ') can be met incidentally by unrelated command lines.
  Determine which binary ran and from where, what it was asked to enumerate, where it wrote its results, whether
  those results left the host, and what preceded the execution on this host.
type: detection
detection_id: af688c76-4ce4-4309-bfdd-e896f01acf27
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Does the command line carry all four required argument groups — a mode flag, an input flag, a scan value,
    and an input-scope option?
  context: >-
    The rule requires all four groups to be present in the same command line; each group is satisfied by any one
    of its token variants (for example the mode group by '-m ', '-mode ', '-m:' or '-mode:'). Read the exact
    command line and confirm each group is met by a real argument rather than by an incidental substring — the
    last group's bare ' f ', ' r ' and ' s ' tokens match ordinary text, so a command line that satisfies the
    rule only through one of those is the most likely false positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: What did this tool enumerate — decode the mode, the input target, and the scope option.
  context: >-
    What the operator asked the tool to inventory is the highest-value read on this alert, because it says what
    they are preparing for. The mode value separates a targeted scan from a full sweep ('scanall'), the input
    flag names the host list or target file the run was pointed at, and the scope option selects which classes
    of data are collected — commonly installed software, running services, installed security products, backup
    agents, and remote-access tooling. Tools of this type also accept encoded argument blobs, so an argument
    that looks like base64 should be decoded rather than skipped. The query returns every execution of this
    binary on the host in the window, because these tools are frequently run several times with different scope
    options that together form one enumeration pass.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What binary actually ran, where was it launched from, and does its identity match its file name?
  context: >-
    The rule pins no Image, so the binary is unknown until read from the event. Enumeration tools of this class
    are commonly dropped into world-writable staging directories and given file names and version metadata that
    impersonate legitimate software — including security-vendor utilities — so the file name alone is not an
    identity. Compare the on-disk name against OriginalFileName and the signature, note the directory it ran
    from, and check the hash against reputation sources. A sanctioned inventory or vulnerability scanner will
    live in a managed install path and be signed by the vendor that ships it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
      - CurrentDirectory
  answer_sources:
  - process_creation
  - external_threat_intel
  - asset_inventory
- question: What process spawned this enumeration tool, and is that parent a normal launcher for it?
  context: >-
    An enumeration run started from an interactive shell under explorer.exe, or from a management agent, reads
    differently from one started by a script interpreter, a remote-execution service host such as wmiprvse.exe
    or wsmprovhost.exe, or an injected process. Because reconnaissance is preparation rather than the objective,
    the parent is the first step backward toward how the operator obtained execution on this host. The parent
    command line often carries the staging path or the encoded argument that the tool was handed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What spawned the parent process, and what else did that parent launch?
  context: >-
    This walks one level further back than the immediate parent, to the process that created it. An alert on
    enumeration means an operator was already resident on the host, so the ancestry is where the access story
    starts — a remote-access service, a scripting host, or a process launched from a downloads directory each
    point at a different initial vector. Sibling processes from the same parent show whether enumeration was one
    step of a scripted sequence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Is this user expected to run inventory or scanning tools on this host?
  context: >-
    Asset-management and vulnerability-scanning work is normally done by a small, known set of accounts, from a
    small set of management hosts, on a schedule. A standard user account, a newly created local administrator,
    or a service account that has no inventory role producing an enumeration run is the deviation. Weigh the
    account against its role and against whether any inventory activity was scheduled for this window.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
  answer_sources:
  - organizational_knowledge
  - asset_inventory
- question: Did other reconnaissance commands run on this host around the same time?
  context: >-
    A packaged enumeration tool is usually not the only survey an operator runs. Native discovery binaries in
    the same window — nltest.exe and net.exe for domain and trust structure, adfind.exe or csvde.exe for
    directory enumeration, quser.exe and tasklist.exe for local state — indicate the enumeration is one part of
    a wider survey rather than an isolated invocation. Three or more distinct discovery binaries inside fifteen
    minutes is a rate no interactive troubleshooting produces.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: Did the alerting process connect out to multiple destinations or ports, and how wide was the fan-out?
  context: >-
    Network service discovery shows up as one process opening many short-lived connections to a range of
    destination addresses or ports in a short window — a useful working threshold is a rising count of unique
    destination IPs or ports within roughly 60 seconds. Count the distinct destinations and ports this process
    reached: a handful of addresses fits a targeted check, while a sweep across a subnet or across service ports
    (445, 135, 139, 3389, 5985) is a scan, and it maps the operator's next move. If endpoint network telemetry
    is not collected for this host, treat an empty result as a visibility gap rather than evidence the process
    made no connections.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
  answer_sources:
  - network_connection
- question: What files did this process write, and where were the enumeration results stored?
  context: >-
    Enumeration output only becomes useful once it is written down, so the result file is the concrete artifact
    the run leaves behind. Tools of this class write inventories to CSV, text, or database files, typically into
    the same staging directory the binary was launched from or into a world-writable path. Recover the file and
    read it — it states exactly what the operator now knows about the environment. The written path is also the
    thing to look for in any later archiving or transfer activity.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetFilename
  answer_sources:
  - file_event
  - manual_review
- question: What child processes did this tool spawn afterward?
  context: >-
    Children of the enumeration process reveal whether it did more than read state. Command interpreters,
    archiving utilities, and file-transfer tooling launched from it indicate the results are being staged or
    moved off the host; service-control or security-product management binaries indicate the survey has already
    turned into action against defenses. The four-hour window covers an operator working through the results at
    human pace.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating every parent-child pair on the host in the surrounding window collapses routine agent telemetry
    into a few high-count rows and leaves novel pairs standing out at low counts. That is what to scan for:
    remote-access tooling, credential access, and staging or archiving utilities appearing alongside the
    enumeration run place it inside a sequence rather than treating it as a standalone event.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    An operator running an inventory tool already had execution on the host, so what fired earlier is where the
    access came from. Look for remote-access, exploitation, or credential-access detections in the preceding
    hours, and for detections on the process that turned out to be the ancestry of this run. The order of the
    earlier alerts reconstructs the sequence that led here.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the user's 90-day
    history of this specific argument pattern rather than generic use of any binary, aggregated by host. An
    account that has produced this pattern regularly across many hosts is doing inventory work; an account
    producing it for the first time is the deviation. Weigh the count against the user's role and typical
    toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_mode_flag:
        CommandLine|contains:
        - '-m '
        - '-mode '
        - '-m:'
        - '-mode:'
      selection_input_flag:
        CommandLine|contains:
        - '-i '
        - '-input '
        - '-i:'
        - '-input:'
      selection_scan_value:
        CommandLine|contains:
        - 'scan '
        - 'scanall '
      selection_input_options:
        CommandLine|contains:
        - ':f '
        - ':r '
        - ':s '
        - ' f '
        - ' r '
        - ' s '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: >-
    Has this parent process historically driven the rule's pattern on this host or across the environment, or is
    the parent new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute the behavior and the
    meaningful pivot is the launch mechanism. The query mirrors the rule's selection structure scoped to the
    alerting parent process, so the result is the 90-day history of this parent driving this argument pattern.
    A parent that already accounts for thousands of prior events is inventory or management automation; a parent
    that is new for this pattern is the deviation to chase.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_mode_flag:
        CommandLine|contains:
        - '-m '
        - '-mode '
        - '-m:'
        - '-mode:'
      selection_input_flag:
        CommandLine|contains:
        - '-i '
        - '-input '
        - '-i:'
        - '-input:'
      selection_scan_value:
        CommandLine|contains:
        - 'scan '
        - 'scanall '
      selection_input_options:
        CommandLine|contains:
        - ':f '
        - ':r '
        - ':s '
        - ' f '
        - ' r '
        - ' s '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the account's activity across all hosts in the surrounding hour shows whether the enumeration is
    confined to this host or the account is working across several. The same account producing tool activity on
    multiple endpoints in one window widens the scope of what has to be reviewed. If the alert fired under
    SYSTEM or another service principal, this result is dominated by routine agent telemetry and the
    parent-driven pattern question is the meaningful read instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: >-
    Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to
