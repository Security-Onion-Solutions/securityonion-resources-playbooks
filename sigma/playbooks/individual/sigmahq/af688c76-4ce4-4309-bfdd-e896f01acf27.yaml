- question: >-
    Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like
    consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of
    this argument pattern. The distribution is diagnostic here: an operator surveying one host is a different
    situation from the same tool appearing across many. Many hosts with a consistent parent and binary points to
    scripted inventory deployment; a small unrelated set, or hosts that share nothing but a subnet, points to
    manual operator activity and defines the set of hosts to review.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
