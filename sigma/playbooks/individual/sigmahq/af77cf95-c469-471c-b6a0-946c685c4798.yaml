name: Proxy Execution Via Wuauclt.EXE
id: 601a4156-8251-470c-bd2f-3d14c572213a
description: |
  Detects the Windows Update client binary wuauclt.exe invoked with both the
  /UpdateDeploymentProvider and /RunHandlerComServer arguments, which causes the
  Microsoft-signed process to load an arbitrary DLL and invoke a registered COM
  handler from it — effectively proxying code execution through a trusted binary.
  Legitimate update-agent use of this argument pair is rare and limited to
  specific update-deployment infrastructure paths, several of which the rule
  excludes; an invocation that points at a DLL outside those well-known paths has
  no routine endpoint use. Determine which DLL was loaded, where it lives, how
  wuauclt.exe was launched, and what the process did afterward.
type: detection
detection_id: af77cf95-c469-471c-b6a0-946c685c4798
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the wuauclt.exe command line contain both /UpdateDeploymentProvider and /RunHandlerComServer, and which DLL path does it point at?
  context: Confirm the alert is a true positive by reviewing the exact command line and process details. The rule fires only when the binary resolves to wuauclt.exe (by Image or OriginalFileName) AND the command line contains both UpdateDeploymentProvider and RunHandlerComServer, excluding a short list of known update-deployment DLL paths. Read the DLL path argument carefully — note whether it lives under System32 or points somewhere user-writable or unusual.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run the Windows Update client with a deployment-provider argument?
  context: Legitimate use of this argument pair is confined to specific update-deployment and managed-device infrastructure scenarios. On a typical endpoint the Windows Update client never runs with a caller-supplied DLL path. Knowing whether this host has an update-management role and whether the acting user performs that kind of administration is often the fastest way to separate a true positive from sanctioned tooling.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What DLL did wuauclt.exe load, and where does that DLL path resolve?
  context: The full command line reveals the operational intent. The argument following /UpdateDeploymentProvider is the path to the DLL that the signed Windows Update process is being told to load and execute a COM handler from. Decode the full path — a DLL outside %SystemRoot%\System32, in a user-writable directory, or with a lookalike directory name is the operative signal; the COM handler is invoked regardless of the DLL's location.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: 'UpdateDeploymentProvider'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Did wuauclt.exe load the DLL named on its command line, and is that DLL signed and located where expected?
  context: Proxy execution through this binary completes when the signed Windows Update process loads the attacker-named DLL into its address space. Pivot to module-load telemetry for this process to confirm the DLL load and to read its signature status and on-disk path. An unsigned module, a module outside System32, or one whose path matches a lookalike directory name confirms the abuse; if module-load events are not collected in this environment, treat zero results as a visibility gap and fall back to the on-disk path read from the command line.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- question: What process spawned wuauclt.exe, and is that parent chain expected for the Windows Update client?
  context: On a healthy system the Windows Update client is launched by the update service or scheduled maintenance, not by interactive or scripting parents. A parent such as explorer.exe driven by a startup-folder shortcut, an Office application, mshta.exe, wscript.exe, or a recently dropped binary points to operator-driven or persistence-driven invocation rather than routine update activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did wuauclt.exe spawn afterward?
  context: The COM handler loaded through this technique can carry out arbitrary actions, including spawning further processes. Children such as cmd.exe, powershell.exe, certutil.exe, rundll32.exe, or a newly written binary indicate post-exploitation activity following the DLL load; the Windows Update client has no legitimate reason to spawn interactive shells or download utilities.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did wuauclt.exe make outbound network connections around the time of the alert, and to where?
  context: Proxy execution through a signed binary is frequently paired with payload retrieval or command-and-control over the trusted process, so connections appear to originate from the Windows Update client. Review the destinations the process contacted and compare them against known update endpoints. Connections to addresses outside the organization's update infrastructure, or to a single external host repeatedly, point to retrieval or beaconing rather than update traffic. If network telemetry for this host is not collected, treat zero results as a visibility gap.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Does this host normally run wuauclt.exe with a deployment-provider argument?
  context: A process invocation that has never been seen on a host is more suspicious than one that recurs. The Windows Update client itself runs routinely, so the meaningful baseline is whether this specific argument-driven invocation has any history here. Zero or very low historical counts of the proxy-execution pattern indicate a first-time or rare event worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: 'UpdateDeploymentProvider'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this proxy-execution pattern, what parents and users drove it, and does the current alert fit that pattern?
  context: Even an update-management host that legitimately uses this argument pair has a stable pattern to that activity. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern has historically run here. A new parent process, an unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wuauclt.exe
      - OriginalFileName: wuauclt.exe
      selection_cli:
        CommandLine|contains|all:
        - UpdateDeploymentProvider
        - RunHandlerComServer
      filter_main_generic:
        CommandLine|contains: ' /UpdateDeploymentProvider UpdateDeploymentProvider.dll '
      filter_main_wuaueng:
        CommandLine|contains: ' wuaueng.dll '
      filter_main_uus:
        CommandLine|contains:
        - :\Windows\UUS\Packages\Preview\amd64\updatedeploy.dll /ClassId
        - :\Windows\UUS\amd64\UpdateDeploy.dll /ClassId
      filter_main_winsxs:
        CommandLine|contains|all:
        - :\Windows\WinSxS\
        - '\UpdateDeploy.dll /ClassId '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this proxy-execution pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this specific firing pattern rather than generic Windows Update activity. Many hosts firing the same pattern points to a managed update-deployment workflow; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wuauclt.exe
      - OriginalFileName: wuauclt.exe
      selection_cli:
        CommandLine|contains|all:
        - UpdateDeploymentProvider
        - RunHandlerComServer
      filter_main_generic:
        CommandLine|contains: ' /UpdateDeploymentProvider UpdateDeploymentProvider.dll '
      filter_main_wuaueng:
        CommandLine|contains: ' wuaueng.dll '
      filter_main_uus:
        CommandLine|contains:
        - :\Windows\UUS\Packages\Preview\amd64\updatedeploy.dll /ClassId
        - :\Windows\UUS\amd64\UpdateDeploy.dll /ClassId
      filter_main_winsxs:
        CommandLine|contains|all:
        - :\Windows\WinSxS\
        - '\UpdateDeploy.dll /ClassId '
      condition: all of selection_* and not 1 of filter_main_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wuauclt.exe
      - OriginalFileName: wuauclt.exe
      selection_cli:
        CommandLine|contains|all:
        - UpdateDeploymentProvider
        - RunHandlerComServer
      filter_main_generic:
        CommandLine|contains: ' /UpdateDeploymentProvider UpdateDeploymentProvider.dll '
      filter_main_wuaueng:
        CommandLine|contains: ' wuaueng.dll '
      filter_main_uus:
        CommandLine|contains:
        - :\Windows\UUS\Packages\Preview\amd64\updatedeploy.dll /ClassId
        - :\Windows\UUS\amd64\UpdateDeploy.dll /ClassId
      filter_main_winsxs:
        CommandLine|contains|all:
        - :\Windows\WinSxS\
        - '\UpdateDeploy.dll /ClassId '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wuauclt.exe
      - OriginalFileName: wuauclt.exe
      selection_cli:
        CommandLine|contains|all:
        - UpdateDeploymentProvider
        - RunHandlerComServer
      filter_main_generic:
        CommandLine|contains: ' /UpdateDeploymentProvider UpdateDeploymentProvider.dll '
      filter_main_wuaueng:
        CommandLine|contains: ' wuaueng.dll '
      filter_main_uus:
        CommandLine|contains:
        - :\Windows\UUS\Packages\Preview\amd64\updatedeploy.dll /ClassId
        - :\Windows\UUS\amd64\UpdateDeploy.dll /ClassId
      filter_main_winsxs:
        CommandLine|contains|all:
        - :\Windows\WinSxS\
        - '\UpdateDeploy.dll /ClassId '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or staged actions across multiple endpoints. If the same user triggered similar activity on more than one host, the scope of the activity may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wuauclt.exe
      - OriginalFileName: wuauclt.exe
      selection_cli:
        CommandLine|contains|all:
        - UpdateDeploymentProvider
        - RunHandlerComServer
      filter_main_generic:
        CommandLine|contains: ' /UpdateDeploymentProvider UpdateDeploymentProvider.dll '
      filter_main_wuaueng:
        CommandLine|contains: ' wuaueng.dll '
      filter_main_uus:
        CommandLine|contains:
        - :\Windows\UUS\Packages\Preview\amd64\updatedeploy.dll /ClassId
        - :\Windows\UUS\amd64\UpdateDeploy.dll /ClassId
      filter_main_winsxs:
        CommandLine|contains|all:
        - :\Windows\WinSxS\
        - '\UpdateDeploy.dll /ClassId '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, persistence installation, or staging near the alert time.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, credential access, or persistence — may reveal the stages that preceded this event and help reconstruct the full timeline that led to proxy execution through a signed binary.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
