name: New Agent Skills Installation Attempt Via Node.EXE
id: 6d9f77c5-35dc-4263-ad1d-97dc7823f2bf
description: |
  Detects node.exe, identified by Image or OriginalFileName, executing npx-cli.js with a command line
  that contains npx-cli.js together with the skills-install pattern ('skills ' and ' add '), the
  mechanism that fetches and installs a reusable instruction package ("agent skill") into an AI
  coding-agent's skill directory from an arbitrary, uncurated git source. Installing skills is routine
  on hosts configured for AI-assisted development, but the fetched package can carry embedded shell
  commands that execute automatically the moment the agent next loads the skill, before any human or
  model review of its content, making the install command the entry point for credential theft, data
  exfiltration, or self-propagation to other hosts reachable through existing trust relationships.
  Investigation should confirm the installation source and target agent, review the installed skill's
  own content for embedded commands, and check for anomalous process or module activity around node.exe
  in the period after installation.
type: detection
detection_id: afa71271-6a97-4e47-810f-83120fb1a4ce
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the command line confirm node.exe running npx-cli.js with a skills-install command?
  context: >-
    Confirm the alert is a true positive before investing analysis time. The rule fires only when the
    process is identified as node.exe, by Image or OriginalFileName, AND the command line contains
    npx-cli.js together with the skills-install pattern ('skills ' and ' add '). Review the full command
    line and process identity from the triggering event, since a routine 'npx skills add' run during
    normal development work also matches this pattern.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to install AI agent skills as part of normal work?
  context: >-
    Skill installation is routine on a developer workstation or CI host configured for AI-assisted
    coding tooling, and unusual on a general-purpose workstation or server with no such workflow.
    Knowing whether this user's role and this host's function are consistent with installing agent
    tooling is often the fastest way to separate expected activity from an unexpected or unauthorized
    installation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What exactly did this npx skills command install? Decode the source, target agent, and flags.
  context: >-
    The full command line reveals the skill's source, an owner/repo shorthand or a git URL, which agent
    directories it was pushed into, and whether non-interactive or forced-install flags were set. A
    source with no clear ownership, or a repository unrelated to this host's normal tooling, is the
    detail that most changes the read of this alert. Multiple sequential invocations on this host within
    the window may together form one logical install operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: Is any part of the install command encoded or obfuscated, and what does it decode to?
  context: >-
    The 'npx skills add' command line itself is rarely encoded, but the installed skill's own setup
    instructions frequently hide their actual behavior inside encoded shell content that runs the
    moment the skill loads, before any review of what it does. Decode any encoded arguments on the
    alerting command line, and treat the installed skill's own content, not just this command, as
    needing the same scrutiny.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: What modules did node.exe load for this process, and are any unsigned or from a non-canonical path?
  context: >-
    Confirms node.exe itself has not been side-loaded with an unsigned or unexpected module as part of a
    compromised toolchain. A routine Node.js runtime loads Microsoft system libraries and its own
    bundled components; a module loaded from a user-writable directory such as AppData or Temp, or one
    lacking a valid signature, is the anomaly worth chasing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
  answer_sources:
  - image_load
  - manual_review
- question: What skill files were written to disk, and to which agent directory were they installed?
  context: >-
    Installing a skill writes a SKILL.md and any bundled files to a predictable per-agent directory on
    disk. Locating the written files enables direct review of their content, the actual instructions and
    any embedded commands the agent will execute the next time it loads the skill, which the install
    command line alone does not show.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What process spawned node.exe for this install, and is that parent chain expected?
  context: >-
    The parent process shows how the install was invoked. An interactive terminal or IDE task launched
    by the user is the ordinary path; invocation by a script host, a remote-management tool, or an
    unattended service parent is harder to reconcile with a deliberate developer action and fits an
    operator or automated process performing the install instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Does this host normally run node.exe?
  context: >-
    A Node.js runtime that has never been seen on this host is more suspicious than one that runs
    regularly as part of established development or build tooling. Zero or very low historical counts
    indicate first-time or rare execution and raise the weight of this specific install.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: When this host has previously run the rule's skill-install pattern, what parents and users typically drove it, and does this alert fit?
  context: >-
    The query mirrors the rule's own selection structure scoped to this host, so the resulting parent
    and user distribution reflects how this specific 'npx skills add' pattern has run here before, not
    generic Node.js usage. A new parent process, an unfamiliar user account, or a command-line structure
    that departs from the established pattern is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \node.exe
      - OriginalFileName: node.exe
      selection_cli:
        CommandLine|contains|all:
        - npx-cli.js
        - 'skills '
        - ' add '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: What processes did node.exe spawn on this host after the skill install?
  context: >-
    If the installed skill is later loaded and its embedded commands execute, the resulting activity
    typically runs as a child of the same Node-based tooling. Look for command interpreters, network
    utilities such as curl or an SSH client, or unfamiliar binaries spawned after the install that were
    not part of the triggering event itself.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What other tools ran on this host around the time of the install?
  context: >-
    Skill installation is sometimes one step in a larger sequence: repository cloning, package-manager
    activity, or other development tooling running nearby. Activity surrounding the install provides
    context for whether this is routine development work or part of a broader automated or scripted
    sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Has this user previously run the rule's skill-install pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's own selection structure scoped to this user, so the result is the
    user's 90-day history of this specific 'npx skills add' pattern, aggregated by host. A user who has
    never installed a skill this way is more suspicious than one who does so regularly as part of their
    normal development work; weigh the count against the user's role.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \node.exe
      - OriginalFileName: node.exe
      selection_cli:
        CommandLine|contains|all:
        - npx-cli.js
        - 'skills '
        - ' add '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this parent process historically driven the rule's skill-install pattern on this host or elsewhere, or is it new for this activity?
  context: >-
    When the alert fires under a service or non-interactive principal, user identity does not attribute
    the behavior. The meaningful pivot is the launch mechanism: the query mirrors the rule's selection
    structure scoped to the alerting parent process, showing the 90-day history of that parent driving
    this specific pattern. A new or rare parent is the deviation worth chasing; a parent already
    accounting for many prior events points to vendor or build automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \node.exe
      - OriginalFileName: node.exe
      selection_cli:
        CommandLine|contains|all:
        - npx-cli.js
        - 'skills '
        - ' add '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts in a tight window shows whether this install is
    isolated or part of broader activity, such as installing the same skill on multiple systems or other
    unrelated tooling changes.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same parent-driven install pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service or non-interactive principal, tracking user activity network-wide returns noise from
    routine automation. The meaningful question is whether the same launch mechanism produced this
    install elsewhere: the query mirrors the rule's selection scoped to the alerting parent process,
    fleet-wide, in the alert window. Multiple hosts in the same window points to a scripted or pushed
    rollout; a single host points to a host-local action.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \node.exe
      - OriginalFileName: node.exe
      selection_cli:
        CommandLine|contains|all:
        - npx-cli.js
        - 'skills '
        - ' add '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the install?
  context: >-
    Alerts rarely occur in isolation. Activity surrounding the install, what led to it and what
    followed, helps determine whether this is a standalone developer action or part of a larger
    sequence. Aggregating by parent and child image collapses repetitive telemetry so novel process
    pairs stand out.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Have other hosts run the rule's skill-install pattern in the past week, and does the distribution look like consistent automation or isolated activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, giving a fleet-wide count of
    this specific install pattern rather than generic Node.js usage. Many hosts matching the same
    pattern points to a scripted rollout or a shared onboarding process; one host or a small unrelated
    set points to a manual, one-off installation.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \node.exe
      - OriginalFileName: node.exe
      selection_cli:
        CommandLine|contains|all:
        - npx-cli.js
        - 'skills '
        - ' add '
      condition: all of selection_*
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    A skill install is sometimes one step in a longer chain. Earlier detections on the same host,
    reconnaissance, credential access, or defense tampering, may reveal how the host reached this point,
    or may later correlate with what follows the install to reveal a broader sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
