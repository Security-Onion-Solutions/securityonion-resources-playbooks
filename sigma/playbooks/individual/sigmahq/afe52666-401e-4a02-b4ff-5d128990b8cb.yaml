name: Suspicious Greedy Compression Using Rar.EXE
id: c2f36207-45fd-4ca5-8fc2-054f248b29f6
description: |
  Detects rar.exe (or a command-line RAR binary) building a password-protected, recursive archive from a system folder or a folder commonly used for staging, such as Recycle Bin, PerfLogs, Temp, Public, or the Windows directory. The rule fires when the archive-creation flags (-hp and -r together) and a staging-folder path are both present, AND either the binary is named rar.exe or the command line carries the archive-add syntax. Legitimate backup and packaging jobs can match, so the investigation should determine what data was selected, whether header encryption was applied to hide filenames, and whether this archiving fits the user, host, and parent process that produced it.
type: detection
detection_id: afe52666-401e-4a02-b4ff-5d128990b8cb
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line show a recursive, password-protected RAR archive built from a system or staging folder, and which branch identified the RAR binary?
  context: Confirm the alert before investing time. The rule fires when the recursive and header-encryption flags appear together with a staging-folder path, AND the RAR binary was identified by either its rar.exe filename or the archive-add command syntax. Note which branch matched, because a binary identified only by command syntax (renamed or relocated rar) is more suspicious than one running as rar.exe.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - Description
- question: Is this user and host expected to create password-protected RAR archives from system or staging folders?
  context: Backup operators, packaging pipelines, and IT staff legitimately compress data, but archiving from Recycle Bin, PerfLogs, Temp, Public, or the Windows directory with header encryption is rarely a routine workflow. Whether the user role and host function fit this operation is often the fastest path to a disposition.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this RAR invocation do? Decode the full command line, including the source paths, switches, and archive name.
  context: The full command line reveals which folders were swept, the archive output path, the compression level, and any password or header-encryption flags. Decode each switch to understand whether this is a targeted collection of specific data or a broad recursive sweep of a staging directory.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains|all:
        - ' -hp'
        - ' -r '
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What files or directories were selected for archiving?
  context: 'The command-line arguments reveal what data was targeted: specific file types, sensitive directories such as finance or HR shares or source code, or broad wildcards indicating bulk collection. The scope of targeted data determines the severity of potential data loss and which business units need to be notified.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: What encryption or password flags were applied to the archive, and was header encryption used to hide filenames?
  context: This rule already requires the -hp flag, which encrypts both archive contents and the filename headers so the names inside the archive cannot be inspected. Confirm whether -hp is present, whether a password was supplied inline or passed via stdin or a config file, and what compression level was set. Header encryption being deliberately applied to staged data is a stronger indicator of malicious collection than an unprotected archive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Where was the archive written, and was it moved or copied after creation?
  context: Data staging typically creates an archive locally, then moves it to a staging location or sends it out. Checking for the .rar output file and any subsequent move or copy on the same host reveals the staging or exfiltration path, whether the data went to cloud storage, removable media, or an external destination. Pair this with outbound network connections from the host in the same window.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process spawned this RAR binary, and is that parent chain expected?
  context: The parent process reveals how the archiving was invoked. User-driven compression often descends from explorer.exe or a shell the operator opened; scheduled backups descend from the task scheduler or a service. A parent such as a script host, an Office application, or a remote-access tool points to automated or operator-driven collection rather than a routine backup job.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Does this host normally run a command-line RAR binary?
  context: A RAR binary that has never run on a host is more suspicious than one that runs regularly as part of a backup or packaging workflow. Zero or very low historical counts over the baseline window indicate first-time or rare execution.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously matched this archiving pattern, what parents and users normally drove it, and does the current alert fit that pattern?
  context: Even legitimate compression tools can be abused. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern has historically run here, not generic RAR usage. A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_opt_1:
      - Image|endswith: \rar.exe
      - Description: Command line RAR
      selection_opt_2:
        CommandLine|contains:
        - '.exe a '
        - ' a -m'
      selection_cli_flags:
        CommandLine|contains|all:
        - ' -hp'
        - ' -r '
      selection_cli_folders:
        CommandLine|contains:
        - ' ?:\\\*.'
        - ' ?:\\\\\*.'
        - ' ?:\$Recycle.bin\'
        - ' ?:\PerfLogs\'
        - ' ?:\Temp'
        - ' ?:\Users\Public\'
        - ' ?:\Windows\'
        - ' %public%'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_opt_* and all of selection_cli_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did this RAR binary spawn afterward?
  context: The processes spawned by an archiving tool reveal its actual impact. A packaging job typically spawns nothing further; an operator workflow may follow archive creation with a transfer or upload utility, a shell, or a cleanup command. Secondary execution after collection is a chain stage worth confirming.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other tools ran on this host around the same time?
  context: Collection rarely occurs in isolation. Activity surrounding the archiving may reveal reconnaissance, credential access, or transfer utilities that together form a staging-and-exfiltration sequence and provide broader context for the investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_opt_1:
      - Image|endswith: \rar.exe
      - Description: Command line RAR
      selection_opt_2:
        CommandLine|contains:
        - '.exe a '
        - ' a -m'
      selection_cli_flags:
        CommandLine|contains|all:
        - ' -hp'
        - ' -r '
      selection_cli_folders:
        CommandLine|contains:
        - ' ?:\\\*.'
        - ' ?:\\\\\*.'
        - ' ?:\$Recycle.bin\'
        - ' ?:\PerfLogs\'
        - ' ?:\Temp'
        - ' ?:\Users\Public\'
        - ' ?:\Windows\'
        - ' %public%'
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_opt_* and all of selection_cli_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_opt_1:
      - Image|endswith: \rar.exe
      - Description: Command line RAR
      selection_opt_2:
        CommandLine|contains:
        - '.exe a '
        - ' a -m'
      selection_cli_flags:
        CommandLine|contains|all:
        - ' -hp'
        - ' -r '
      selection_cli_folders:
        CommandLine|contains:
        - ' ?:\\\*.'
        - ' ?:\\\\\*.'
        - ' ?:\$Recycle.bin\'
        - ' ?:\PerfLogs\'
        - ' ?:\Temp'
        - ' ?:\Users\Public\'
        - ' ?:\Windows\'
        - ' %public%'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_opt_* and all of selection_cli_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or collection spread across multiple endpoints. If the same user triggered similar archiving on multiple hosts, the scope of potential data loss may be larger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_opt_1:
      - Image|endswith: \rar.exe
      - Description: Command line RAR
      selection_opt_2:
        CommandLine|contains:
        - '.exe a '
        - ' a -m'
      selection_cli_flags:
        CommandLine|contains|all:
        - ' -hp'
        - ' -r '
      selection_cli_folders:
        CommandLine|contains:
        - ' ?:\\\*.'
        - ' ?:\\\\\*.'
        - ' ?:\$Recycle.bin\'
        - ' ?:\PerfLogs\'
        - ' ?:\Temp'
        - ' ?:\Users\Public\'
        - ' ?:\Windows\'
        - ' %public%'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_opt_* and all of selection_cli_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger collection sequence. Look for reconnaissance, credential access, or transfer utilities running near the archiving.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as reconnaissance, credential access, or defense tampering, may reveal the attack stages that preceded the archiving and help reconstruct the full timeline. Collection is often a late stage in a multi-step operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
