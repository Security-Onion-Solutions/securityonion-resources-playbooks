name: Potential Signing Bypass Via Windows Developer Features - Registry
id: bc81d7fc-af26-49d4-9e46-f2ad1f1fc327
description: |
  Detects a registry write that enables Windows developer features - Developer Mode or app
  sideloading - by setting AllowAllTrustedApps or AllowDevelopmentWithoutDevLicense to DWORD
  0x00000001 under either the CurrentVersion\AppModelUnlock key or the
  Policies\Microsoft\Windows\Appx policy path. The rule fires only when the value data equals 1
  (the feature being turned on). With these features enabled a host will install packaged
  applications (APPX/MSIX) that did not come from the Microsoft Store, so an operator who flips
  the toggle can then deploy a signed-but-untrusted or self-signed package that runs outside the
  Store trust chain. On developer and IT-managed workstations this is a legitimate configuration;
  on a standard user endpoint it is a preparatory step for sideloading untrusted software.
  Investigate which flag was set and to what value, which process wrote it and what launched that
  process, whether a packaged application was subsequently installed or executed, whether the same
  change appeared on other hosts, and whether the setting was reverted afterward.
type: detection
detection_id: b110ebaf-697f-4da1-afd5-b536fa27a2c1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting registry write enable a developer feature by setting the sideloading value to 1?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires only
    when a value whose path ends in \AllowAllTrustedApps or \AllowDevelopmentWithoutDevLicense - under
    either \Microsoft\Windows\CurrentVersion\AppModelUnlock or \Policies\Microsoft\Windows\Appx\ - is
    written AND the data equals DWORD (0x00000001). A value of 1 turns the feature on; a 0 would be
    disabling it and does not match. Review the exact TargetObject and Details on the triggering event
    to confirm one of these flags was set to 1.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to enable Developer Mode or app sideloading?
  context: >-
    Enabling developer features is routine on a developer workstation or through a managed deployment
    but out of place on a standard user endpoint, so knowing whether the writing account and host
    function match any sanctioned use is the fastest way to separate legitimate configuration from a
    setup for untrusted-package delivery. User attribution is present on roughly 94% of endpoint
    registry events; when it is a machine account or SYSTEM (common for policy-driven writes), pivot on
    the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which developer-feature flag was set, and why does this location control package trust?
  context: >-
    The specific path determines the mechanism. A value under \Microsoft\Windows\CurrentVersion\AppModelUnlock
    is the per-machine Developer Mode / trusted-app toggle exposed in Settings, while a value under
    \Policies\Microsoft\Windows\Appx\ is the equivalent policy control usually driven by group policy or
    MDM. \AllowAllTrustedApps permits installing any signed package outside the Store, and
    \AllowDevelopmentWithoutDevLicense removes the developer-license requirement. Confirming the exact
    key and writing process establishes which control was relaxed and whether it arrived as an
    interactive toggle or a policy push.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value was written to this key and does it turn the feature on?
  context: >-
    The Details field carries the value data. DWORD (0x00000001) enables the developer feature; a 0
    would disable it. Because the rule only fires on 1, this event represents the feature being switched
    on. Confirm the value data and note which of the two flags it set - allowing all trusted apps versus
    removing the development-license requirement - since that determines what kind of package the host
    will now accept. Details is present on roughly 79% of registry modifications and should be populated
    for this DWORD value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote this value, and what launched that process?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to read
    its Image, full command, and parent. An interactive change appears as the settings host or a
    management agent; a reg.exe, powershell.exe, or cmd.exe write launched from a script host such as
    wscript.exe or mshta.exe, an Office application, or an unsigned binary points to the toggle being
    flipped programmatically rather than by an administrator. The parent chain distinguishes a scripted
    enablement from a deliberate configuration action.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Does this host normally run the process that made this change?
  context: >-
    A process that regularly reconfigures this host is different from one seen for the first time. A
    management agent or settings host with a long history is consistent with sanctioned change, whereas
    a scripting or command-line tool with little or no prior presence writing this policy value points to
    ad hoc enablement. Zero or very low counts indicate first-time or rare execution of the writing
    process on this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Does this setting persist, or was it later reverted to disabled?
  context: >-
    Registry key and value deletions are not observable in this telemetry, so durability is judged from
    the value's re-modification history rather than from a delete event. If the DWORD stays at 1 the host
    remains primed to accept untrusted packages; a later write returning the same value to 0 indicates the
    feature was turned back off, which is common when an operator enables sideloading only long enough to
    install a package and then reverts the toggle to reduce its footprint. Compare the Details values
    written to this key over the following window.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: After this change, was a packaged application installed or run from the WindowsApps location on this host?
  context: >-
    Enabling sideloading has a payoff only if an untrusted package is then deployed. Sideloaded and
    installed packages land in %ProgramFiles%\WindowsApps\, and the App Installer runs from the same
    location, so process execution from that path shortly after the toggle indicates the relaxed trust
    was used to bring a package onto the host. Correlate the timing and the executing user with the
    registry change to judge whether the enablement led to an actual installation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_pkg:
        Image|contains: '\WindowsApps\'
      condition: selection and selection_pkg
    fields:
      - Image
      - CommandLine
      - User
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An operator preparing a host to run untrusted software often makes several changes in one session -
    relaxing package trust alongside disabling protections, adding a persistence key, or editing policy.
    Clustering the registry writes on this host in a short window around the alert reveals the full scope
    of the configuration changes and which process made them. The triggering key appears in the results;
    the signal is what else was modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has this developer-feature value been modified before on this host?
  context: >-
    A developer feature that has never been enabled on this host makes this a first-time change and
    raises its weight, while a history of periodic writes to the same value points to a developer machine
    or a management process that toggles it routinely. Compare the historical Details values to see
    whether the feature was set on before or whether this enablement is new to the host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same developer-feature value modified on other hosts in the environment?
  context: >-
    The same enablement across many hosts suggests a group-policy or MDM rollout of Developer Mode, while
    the same change confined to one host suggests a targeted setup for sideloading. Compare the Details
    values and the writing process across hosts to see whether the change is a consistent managed
    deployment or a one-off on this endpoint, which separates a fleet configuration from hands-on
    activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Enabling sideloading rarely happens in isolation. Aggregating process activity in a tight window
    around the alert surfaces what led up to the registry change and what ran immediately after it. Novel
    parent-child pairs stand out at low counts against high-count routine telemetry, which is what points
    to the tool that flipped the toggle and to any package-deployment or download activity that followed.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - phishing-payload execution, script-host activity, or defense
    tampering - may reveal the stages that preceded this change and help reconstruct the timeline.
    Relaxing package trust is often a means to run delivered software, so prior alerts help place this
    enablement within a larger sequence rather than treating it as an isolated setting change.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Does the user or an administrator recall enabling Developer Mode or app sideloading on this host?
  context: >-
    Developer features have a legitimate reason to be enabled on developer and test machines, so direct
    confirmation from the account owner or the responsible administrator is a fast way to resolve the
    alert. If a developer turned on Developer Mode or a managed deployment set the policy, that closes it;
    if no one recalls the change and the host is a standard user endpoint, the account may be compromised
    or the toggle was flipped by automated tooling, and the investigation should continue into the
    writing process and any package that was subsequently installed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
