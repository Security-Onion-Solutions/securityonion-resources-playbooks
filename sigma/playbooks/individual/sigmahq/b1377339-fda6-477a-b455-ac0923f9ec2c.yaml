name: Remote Access Tool - AnyDesk Piped Password Via CLI
id: 045b8c49-7b63-4822-ba6b-bb23eb774641
description: |
  Detects a command shell piping a password into a remote access tool's unattended-access setup via the '--set-password' flag, using the 'echo <password> | <tool>.exe --set-password' pattern run through 'cmd /c'. Setting an unattended-access password from the command line is essentially never part of legitimate interactive enterprise use; it is the scripted way an operator pre-stages persistent, password-protected remote control of a host. The investigation should confirm the exact command, establish whether the remote access tool is approved and supported by an active ticket, identify where the tool binary lives and what it connects to, and determine whether the activity is isolated or part of a wider rollout.
type: detection
detection_id: b1377339-fda6-477a-b455-ac0923f9ec2c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line show a password being piped into a remote access tool's --set-password flag?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when a single command line contains all of '/c ', 'echo ', and '.exe --set-password' together, which is the 'echo <password> | <tool>.exe --set-password' unattended-access setup pattern. Read the full command line and confirm those elements are present and that the target executable is a remote access tool rather than an unrelated program that happens to accept a '--set-password' argument.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to configure unattended remote access from the command line?
  context: Legitimate administrative activity can trigger this detection, but scripted password-set of a remote access tool is rare even for IT staff. Knowing whether the user role is a remote-support or administrative function and whether the host is one where such tooling is normally configured is often the fastest way to separate sanctioned setup from operator-staged persistence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the full command, and which executable and password value were passed to --set-password?
  context: The full command line reveals exactly which binary received the password and what that password was. Identify the target executable name and path after the pipe, and capture the password string set, since a hardcoded or reused password is itself an indicator. Scoping is by the '--set-password' command-line pattern on this host rather than by the cmd.exe binary, which is far too common for host-wide binary scoping.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: '.exe --set-password'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this command shell, and is that parent chain expected?
  context: The parent of the command shell shows how the password-set was invoked. A parent like explorer.exe or a support agent suggests interactive or sanctioned setup, while parents such as a script host, an Office application, a downloaded installer, or another remote access tool point to scripted or attacker-driven staging. The expected parent for this activity varies by environment, so compare against what normally launches administrative shells on this host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously fired this --set-password pattern, what parents and users drove it, and does the current alert fit?
  context: Even sanctioned remote-support tooling leaves a baseline. The query mirrors the rule's selection scoped to this host, so the parent and user distribution reflects how this specific password-set pattern has historically run here rather than generic shell usage. A new parent process, an unexpected user account, or a first-ever appearance of this pattern on the host is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - '/c '
        - 'echo '
        - .exe --set-password
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Where does the remote access tool binary live on disk, and was it written to a canonical install directory or a user-writable or temporary path?
  context: Remote access tools have well-known install directories under Program Files; the same binary dropped into a temp, ProgramData, or user-writable path is a strong sign of attacker staging rather than a sanctioned install. Pull recent writes of the named executable and compare the write path against the vendor's canonical install locations. A binary written shortly before the password-set, or placed outside approved paths, raises the priority of the alert.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: '.exe'
      filter_main:
        TargetFilename|contains: '\anydesk'
      condition: selection and filter_main
    fields:
      - host.name
      - TargetFilename
      - Image
      - User
- question: What external endpoint does the remote access tool connect to, and is it the vendor's infrastructure or a custom address?
  context: Remote access tools establish outbound connections to relay or cloud infrastructure. Connections to the vendor's documented endpoints are expected, while connections to unfamiliar addresses, or on configurable high ports rather than the standard service ports, suggest a self-hosted relay or attacker infrastructure. Use the destination address and port to judge whether egress matches the legitimate vendor service or points somewhere unusual.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: Is this remote access tool on the organization's approved software list?
  context: Organizations typically sanction a single remote access tool for IT support. Any other remote access tool, even well-known commercial software, may represent shadow IT or attacker-deployed persistence and should be checked regardless of the tool's reputation. Confirm whether this specific tool is approved for use in this environment at all.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a current helpdesk ticket or support session explaining this remote access setup?
  context: Legitimate remote access tool usage typically correlates with an active support ticket, a scheduled maintenance window, or a documented user request. If no support context exists for configuring unattended access on this host, the tool may have been set up by an attacker for persistent access or by a user circumventing controls.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: After the password was set, did the remote access tool spawn interactive child processes such as a shell or file manager?
  context: A remote access tool used for hands-on control commonly spawns command shells, script hosts, or file-management processes as the operator works. Children like cmd.exe, powershell.exe, or file-transfer utilities under the tool indicate an active session rather than a dormant install. Their absence does not clear the host, but their presence confirms the tool was driven interactively after the password was set.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|contains: '\anydesk'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - '/c '
        - 'echo '
        - .exe --set-password
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - '/c '
        - 'echo '
        - .exe --set-password
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or staging on multiple endpoints. If the same user configured remote access or ran related tooling on several hosts in this window, the scope of the operation may be larger than a single machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - '/c '
        - 'echo '
        - .exe --set-password
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the surrounding activity reveals what led to the password-set and what followed it. Look for reconnaissance, credential access, the install of the remote access tool itself, or other staging that places this event in a larger sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal the attack stages that preceded the remote access setup. The alert timeline often shows whether this password-set was the entry point or one step in an ongoing intrusion.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired this --set-password pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this password-set pattern rather than generic shell usage. Many hosts firing the same pattern points to a scripted or vendor-driven deployment, while one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate how broadly to respond.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - '/c '
        - 'echo '
        - .exe --set-password
      condition: selection
    fields:
    - host.name
