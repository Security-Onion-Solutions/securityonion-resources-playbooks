name: Office Macro File Creation From Suspicious Process
id: 5c75cd64-6333-4791-b8a6-0e70c0d93bcb
description: |
  Detects creation of a macro-enabled Microsoft Office file (.docm, .dotm, .xlsm, .xltm, .potm, .pptm)
  where the creating process, OR its parent, is a Windows script host or proxy-execution binary
  (cscript.exe, mshta.exe, regsvr32.exe, rundll32.exe, wscript.exe). This pattern fits the
  spearphishing-attachment chain: a delivered script or proxy binary writes a weaponized document to
  disk as a staging or self-propagation step, rather than a user saving a document from an Office
  application. Legitimate automation occasionally generates Office documents this way, so investigate
  what the script host executed, what launched it, the content and origin of the written file, whether
  a payload followed on disk or over the network, and whether the same pattern appears on other hosts.
type: detection
detection_id: b1c50487-1967-4315-a026-6491686d860e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Did a script-host or proxy binary create a macro-enabled Office file on this host?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when the
    written file name ends in a macro-enabled Office extension (.docm, .dotm, .xlsm, .xltm, .potm, .pptm)
    AND either the creating process image or its parent image ends in cscript.exe, mshta.exe,
    regsvr32.exe, rundll32.exe, or wscript.exe. Review the exact TargetFilename and the creating Image
    on the triggering event, and note whether the script host is the writer itself or its parent, because
    that distinction changes which lineage question carries weight. A macro document written by a script
    interpreter is a staging move, not a normal document save.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to have a script host write macro-enabled Office documents?
  context: >-
    Legitimate automation and build tooling occasionally produce Office documents through scripting, so
    knowing whether the account and host function match any sanctioned process is often the fastest way
    to separate routine automation from a weaponized-document drop. Judge by the writing process and host
    role: a workstation where a user opens documents has no routine reason for wscript.exe or rundll32.exe
    to author a .xlsm file. User attribution is present on roughly 94% of endpoint file events; when it is
    a machine account or missing, attribute by the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What did the script-host process do? Decode its command line.
  context: >-
    The file event carries no command line, so pivot by ProcessGuid to the writing process's own execution
    record and read its full command. For cscript.exe, wscript.exe, or mshta.exe the command line shows the
    script file or inline payload that was run; for regsvr32.exe or rundll32.exe it shows the DLL or scriptlet
    and its entry point. Decode any encoded strings, embedded paths, or URLs to establish what the script host
    actually executed that led to the macro file being written.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What is inside the created macro-enabled Office file?
  context: >-
    This is content analysis of the written document, distinct from a hash or reputation lookup. Retrieve the
    file from its on-disk path and inspect the embedded VBA project for auto-executing macros (AutoOpen,
    Document_Open, Workbook_Open), obfuscated or base64-encoded strings, embedded URLs or IP addresses,
    Shell or WScript.Shell calls, and file-write operations that stage a secondary payload. The point is to
    understand what the document does when opened, not merely whether it is known. Content retrieval is a
    manual or endpoint-side step; the query locates the write event and the responsible process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If a payload dropped by this document executed, what is its hash and does threat intel know it?
  context: >-
    File-creation events carry no hash, and a macro document is opened by an Office application rather than
    run as a process, so reputation is judged from what the macro spawns. If the macro wrote and executed a
    secondary file (a common pattern is a script host writing a .jse or .vbs and then shelling it), that
    payload's hash appears on its execution event - submit it to threat intel to determine whether it is
    known malicious, benign, or previously unseen. For the document itself, retrieve it from the on-disk path
    and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: What launched the script host, and what document or email delivered it?
  context: >-
    Initial access via a weaponized attachment typically begins with a phishing email or a downloaded
    document that runs a macro or script, which in turn drops further files. Pivot by ProcessGuid to the
    writing process to read its parent image and parent command line: an Office application parent
    (winword.exe, excel.exe, outlook.exe) points to a macro-triggered drop and names the document to hunt
    in mail logs; a browser or archive-tool parent points to a downloaded lure. Identifying the delivery
    vector enables blocking at the perimeter and searching for other recipients.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Did the involved script-host or proxy processes make outbound connections after the file was written?
  context: >-
    The spearphishing-attachment chain commonly ends in outbound network activity - the script host or a
    payload it drops reaches out to retrieve a second stage or to establish command-and-control. Listing
    egress connections initiated by the script-host and proxy binaries on this host shortly after the macro
    file was written reveals whether the document drop was followed by network retrieval, and surfaces the
    destination addresses and ports to check against threat intel and to block. Correlate the connection
    timestamps against the file-creation time.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        Image|endswith:
          - '\cscript.exe'
          - '\mshta.exe'
          - '\regsvr32.exe'
          - '\rundll32.exe'
          - '\wscript.exe'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A process that drops one weaponized document often drops several - a dropper unpacking components, a
    script staging a secondary payload, or a self-propagating macro touching multiple templates. The breadth,
    paths, and extensions of the writing process's other file activity (and that of its direct children)
    distinguish a single artifact from a staging operation in progress and enumerate what else needs review.
    The correlation covers both the writer and any child process it delegated writes to.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Is the macro file still on disk, or was it deleted or renamed after the alert?
  context: >-
    The document's post-alert lifecycle drives both urgency and next steps. A weaponized file still on disk
    can be retrieved, hashed, and analyzed; a file deleted seconds after creation suggests anti-forensic
    cleanup or a self-deleting stager and shifts the investigation to what executed in between. The query
    returns the full lifecycle of this path over the following window - interpret the operation type to
    tell a durable drop from a transient stage.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was this script host or proxy binary executed from its expected system path?
  context: >-
    Script hosts and proxy binaries run from System32 or SysWOW64 under normal conditions. The same binary
    executing from a user profile, Temp, ProgramData, or another writable directory suggests it was copied
    or renamed to evade path-based allowlists, which raises the weight of the alert. Compare the Image path
    and OriginalFileName from the writing process's execution record against the expected system location.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Were other proxy-execution or download LOLBins used on this host recently?
  context: >-
    Actors who use one living-off-the-land binary to stage a document often use several - a proxy-execution
    binary to run a scriptlet, a download utility to pull the next stage. Finding additional proxy-execution
    or download LOLBins active on this host in the same period strengthens the case that the macro drop is
    part of a coordinated execution chain rather than an isolated event. The detected script hosts are
    excluded from the list to surface the complementary tools.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- always_include: true
  question: Has this user previously produced this macro-write pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the user's 90-day
    history of this specific pattern - a script host or its parent writing a macro-enabled Office file - not
    generic use of the binaries, aggregated by host. A user who has never produced this pattern is more
    notable than one who does so regularly; weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_cmd:
      - Image|endswith:
        - \cscript.exe
        - \mshta.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
      - ParentImage|endswith:
        - \cscript.exe
        - \mshta.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
      selection_ext:
        TargetFilename|endswith:
        - .docm
        - .dotm
        - .xlsm
        - .xltm
        - .potm
        - .pptm
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this macro-write pattern, or is the program new for it?
  context: >-
    When the alert fires under a service principal or machine account, user identity does not attribute
    behavior; the meaningful pivot is the launch mechanism. The query mirrors the rule's selection structure
    scoped to the alerting program, so the result is the 90-day history of this program driving this
    specific macro-write pattern, aggregated by host. A new or rare program for this pattern is the deviation
    worth chasing; a program that already accounts for thousands of prior events is vendor or platform
    automation. This is paired with the user-scoped baseline and answers a different question - whether the
    launch mechanism is routine.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_cmd:
      - Image|endswith:
        - \cscript.exe
        - \mshta.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
      - ParentImage|endswith:
        - \cscript.exe
        - \mshta.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
      selection_ext:
        TargetFilename|endswith:
        - .docm
        - .dotm
        - .xlsm
        - .xltm
        - .potm
        - .pptm
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the environment around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether the macro drop is isolated or part of
    activity spanning multiple endpoints. If the same account triggered process execution or file writes on
    other hosts in the same window, the scope of compromise may be larger than the alerting host. When the
    alert fires under a service principal, this pivot returns agent-telemetry noise and the parent-scoped
    fleet question is the meaningful read instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven macro-write pattern fire on other hosts in the same window?
  context: >-
    Under a service principal, asking what else the user did returns agent-telemetry noise, so the meaningful
    question is whether the same launch mechanism fired elsewhere. The query mirrors the rule's selection
    structure scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts in the
    same window points to scheduled or pushed automation - or a phishing wave that reached many users at once;
    a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_cmd:
      - Image|endswith:
        - \cscript.exe
        - \mshta.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
      - ParentImage|endswith:
        - \cscript.exe
        - \mshta.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
      selection_ext:
        TargetFilename|endswith:
        - .docm
        - .dotm
        - .xlsm
        - .xltm
        - .potm
        - .pptm
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Were other users or systems targeted by the same delivery vector?
  context: >-
    Weaponized-attachment campaigns rarely target a single user. If one endpoint saw a script host write a
    macro document, others likely did too. Correlating the same detection across all hosts reveals campaign
    breadth and identifies additional systems that need investigation, grouped by host and user to show how
    many were affected.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host - reconnaissance, execution of
    scripting tools, or defense tampering - may reveal the stages that preceded this document drop and help
    reconstruct the timeline. A macro-write from a script host is often a mid-chain staging step, so prior
    alerts help place it within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
