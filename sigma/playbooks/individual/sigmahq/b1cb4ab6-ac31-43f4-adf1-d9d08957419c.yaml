    fleet-wide count of the rule's firing pattern rather than generic use of the binary. Many
    hosts firing the same pattern points to scripted or scheduled assessment; one host or a small
    unrelated set points to manual operator activity. Use the host distribution and parent
    consistency to calibrate severity.
