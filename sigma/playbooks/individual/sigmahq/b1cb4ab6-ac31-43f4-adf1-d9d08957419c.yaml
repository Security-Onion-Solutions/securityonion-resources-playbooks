name: PUA - PingCastle Execution
id: 2a473ed8-4594-4a11-8c37-bf02bdc32348
description: |
  Detects execution of PingCastle, a command-line Active Directory security-assessment
  tool that crawls a forest over LDAP plus a handful of RPC/SMB calls and produces HTML
  risk reports. The rule fires when a process is identified as PingCastle by known file
  hash, an Image ending in PingCastle.exe, an OriginalFileName or Product of PingCastle,
  or distinctive command-line flags such as --healthcheck, --scanner, or --no-enum-limit.
  PingCastle runs as a low-privilege domain user and is frequently used legitimately by
  administrators, but it also gives an operator a one-shot map of the AD attack surface,
  so the investigation should determine whether this run is sanctioned assessment work or
  unauthorized pre-attack reconnaissance.
type: detection
detection_id: b1cb4ab6-ac31-43f4-adf1-d9d08957419c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the alerting process match what this rule detects for PingCastle?
  context: Before investing investigation time, confirm the alert is a true positive. Check
    whether the process is identified as PingCastle by file hash, an Image ending in
    PingCastle.exe, an OriginalFileName or Product of PingCastle, or a command line carrying
    --healthcheck, --scanner, or --no-enum-limit. A renamed binary that still carries the
    internal PingCastle name or hash will match even when the on-disk filename differs.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
      - Hashes
      - Product
- question: Is this user and host expected to run Active Directory assessment tooling?
  context: Legitimate AD security audits are typically run by a small set of administrators
    or security staff from known management hosts. A run from a general-purpose workstation,
    a server with no audit role, or a user account with no AD-administration responsibility
    is harder to explain as routine assessment work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is PingCastle on the organization's approved software list for this environment?
  context: Many organizations sanction a specific AD-assessment tool for periodic audits and
    treat anything else as shadow IT. Confirm whether PingCastle is approved for use here and,
    if so, whether its use is restricted to designated assessment hosts and accounts. An
    unapproved copy, or an approved tool run outside its sanctioned context, should be checked
    regardless of the tool's reputation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a scheduled audit, change ticket, or support session that explains this run?
  context: Legitimate AD assessment usually correlates with a scheduled audit window, a change
    ticket, or a documented engagement. If no such record exists for this host and account,
    the run may be unauthorized reconnaissance against the directory rather than sanctioned work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What exactly did PingCastle do? Decode the full command line and identify which checks ran.
  context: The command line reveals the scope of the assessment. Distinguish a broad healthcheck
    (--healthcheck, --level Full, --server pointing at a domain controller) from targeted host
    scanners (--scanner localadmin, nullsession, zerologon, spooler, share, smb) and from
    enumeration that lifts default result caps (--no-enum-limit). The combination of flags and
    the targeted server indicate how much of the directory or which hosts were probed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned PingCastle and is that parent chain expected?
  context: The parent process reveals how the tool was invoked. An interactive launch from
    explorer.exe or a console reflects hands-on use; invocation from a script host, a remote
    execution service, or an unexpected automation parent suggests the run was driven by
    something other than a local administrator at the keyboard.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What network destinations did PingCastle connect to from this host?
  context: PingCastle reaches a domain controller over LDAP plus a handful of RPC/SMB calls,
    and scanner checks touch the hosts being assessed. The set of destinations shows which
    directory servers and endpoints were probed and whether the breadth of targets matches a
    sanctioned audit or a wider sweep of the environment. If network telemetry is not collected
    for this host, infer targets from the --server value and scanner arguments in the command line.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: What child processes did PingCastle spawn afterward?
  context: An assessment run that only reads the directory and writes a report has predictable,
    limited children. Child processes such as cmd.exe, powershell.exe, or certutil.exe spawned
    from the tool point to post-reconnaissance hands-on activity rather than a self-contained audit.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other tools ran on this host around the same time?
  context: Reconnaissance rarely stands alone. Activity surrounding the assessment may reveal
    other discovery tooling, credential access, or staging that places this run inside a larger
    operation rather than a one-off audit.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - defense tampering, initial execution, or other
    discovery activity - may reveal the stages that preceded this assessment and help reconstruct
    the timeline. AD reconnaissance run after a foothold is established carries different weight
    than an isolated audit.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Does this host normally run PingCastle?
  context: A host that has never run PingCastle is harder to explain than one that runs it on a
    regular audit cadence. Zero or very low historical counts indicate first-time or rare
    execution and shift the run toward unsanctioned reconnaissance.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even a sanctioned assessment tool has a normal launch profile on a host. The query
    mirrors the rule's selection scoped to this host, so the resulting parent and user
    distribution reflects how the rule's specific firing pattern has run here before. A new
    parent process, an unexpected account, or an unusual command-line structure is the deviation
    worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Hashes|contains:
