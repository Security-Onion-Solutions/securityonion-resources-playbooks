name: RDP to HTTP or HTTPS Target Ports
id: ae646df3-1334-43dd-b58a-ff3a3d048aaa
description: |
  Detects an svchost.exe process initiating an outbound network connection from source port 3389
  (the port the Windows Remote Desktop service listens on) to a destination on TCP port 80 or 443.
  On a normal host the RDP service accepts inbound sessions on 3389 and never originates traffic to
  web ports, so this source-port/destination-port mismatch is the signature of reverse RDP tunneling:
  RDP is wrapped inside connections to ports that egress firewalls routinely permit, letting an operator
  reach the desktop from outside or relay a session out of the network without opening 3389. The same
  pattern also supports lateral movement, where a tunneled RDP path is used to pivot between hosts.
  Investigate what the external destination is, whether an inbound RDP session drove the outbound relay,
  which account and process own the connection, and whether the activity is sanctioned tunneling or an
  unauthorized channel.
type: detection
detection_id: b1e5da3b-ca8e-4adf-915c-9921f3d85481
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the connection match the rule -- svchost.exe initiating an outbound flow from source port 3389 to destination port 80 or 443?
  context: >-
    Confirm the alert before investing time. The rule fires only when all conditions hold together: the
    process is svchost.exe, the connection is outbound (initiated by this host), the source port is 3389,
    and the destination port is 80 or 443. Review the exact destination, the destination port, the
    direction, and the initiating image on the triggering event. A genuine RDP listener accepts inbound
    sessions on 3389 and does not originate outbound traffic to web ports, so a match on all four fields
    is the reverse-tunnel setup rather than ordinary remote-desktop use.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - Image
      - DestinationPort
      - Initiated
      - SourcePort
- question: Is this host and account expected to originate remote-desktop traffic to external web ports?
  context: >-
    Legitimate administrative RDP is inbound to 3389, not outbound from it, and almost never targets port
    80 or 443. Knowing whether this host has a sanctioned role that would relay or tunnel RDP -- a jump
    box, a remote-support relay, an approved tunneling arrangement -- and whether the owning account is
    consistent with that role is often the fastest way to separate a maintenance channel from an
    unauthorized one. The owning account on an svchost network connection is frequently a service
    principal (SYSTEM, NETWORK SERVICE); when it is, judge the host role and the process lineage rather
    than the user alone.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the external destination this RDP traffic is reaching?
  context: >-
    Resolve and characterize the destination address: passive DNS and resolution history, registration
    age, hosting provider, TLS certificate details, and any threat-intelligence hits. A tunnel that
    terminates at a recently registered domain, a low-reputation hosting range, or a known relay endpoint
    points to attacker-controlled infrastructure, while a destination inside a sanctioned management or
    cloud range points to authorized tunneling. Reputation lookups are manual; the query retrieves the
    connection details to anchor them. Destination hostname is populated on only a small fraction of
    endpoint network events because name resolution is logged separately, so lean on the address and
    pivot through resolution history when the hostname is blank.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - DestinationPort
- question: Is RDP being tunneled over a web port to evade port-based egress filtering?
  context: >-
    Carrying the RDP protocol on a connection whose destination port is 80 or 443 hides it from controls
    that allow outbound web traffic while blocking 3389 -- the port mismatch itself is the evasion. The
    source port of 3389 tells you the payload is a remote-desktop stream rather than a browser request to
    the same port. Tunneled desktop sessions tend to be sustained and bidirectional, unlike a short web
    fetch; where byte-volume fields are available, an asymmetric sent-versus-received ratio reinforces
    that a session is being relayed rather than a page loaded. Confirm the direction and port pairing, and
    treat a persistent 3389-to-web flow as an encapsulated channel until proven otherwise.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
        SourcePort: 3389
      condition: selection
    fields:
      - DestinationPort
      - Initiated
      - Image
- question: Is outbound RDP tunneling sanctioned on this host, and does an approved arrangement cover it?
  context: >-
    Organizations that permit any RDP tunneling usually restrict it to named relay hosts or specific
    administrative arrangements. Relaying a remote-desktop session out over a web port from a host with no
    such role -- even using built-in components rather than a third-party tool -- may represent shadow IT
    or an operator-established channel. Any tunneling path not on the sanctioned list should be checked
    regardless of how ordinary the underlying process looks, and admin whitelists for legitimate tunneling
    tools are what separate an approved channel from an unauthorized one.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a current helpdesk ticket, maintenance window, or user request explaining this remote session?
  context: >-
    Sanctioned remote access usually maps to an active support ticket, a scheduled maintenance window, or
    a user request. If no support context exists for a session that is relaying RDP out to a web port, the
    channel may have been established for persistent external access or to move between hosts without
    authorization. Match the timing and the host against change and support records.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What external endpoints has this host reached from the RDP service over the surrounding window?
  context: >-
    A single flagged flow may be one leg of a longer relay. Listing the outbound connections this host
    made around the alert reveals whether the destination is a stable single relay, a rotating set of
    addresses, or a mix that includes both the tunnel and unrelated traffic. A consistent endpoint on port
    80 or 443 that receives repeated RDP-sourced connections is the tunnel target; scattered or short-lived
    destinations may indicate probing for a working egress path.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: Is the process that owns this connection a genuine service-hosted svchost.exe with the expected parent and command line?
  context: >-
    The registry- and service-hosting binary svchost.exe is normally launched by services.exe with a
    -k service-group argument, and the RDP service runs inside one of those groups. Pivot to the owning
    process's own creation record to read its parent and command line: an svchost.exe not spawned by
    services.exe, running from a non-system directory, or missing its -k group argument is a masqueraded
    binary abusing the name, which recasts the connection from a tunnel through a real service to malware
    posing as one.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Did an inbound remote-access session reach this host on the RDP port before it began relaying outbound?
  context: >-
    Reverse RDP tunneling typically has two legs: a client reaches this host's remote-desktop port, and
    the host relays the session out over the web port. Identifying inbound connections to this host on RDP
    and other remote-service ports shows whether a real session drove the outbound relay and where it came
    from -- a known jump box, an unexpected internal host, or an external address. If no inbound RDP
    session is present, the source port of 3389 may be spoofed by a tunneling tool rather than a genuine
    desktop connection.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 445
          - 135
          - 3389
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - SourceIp
      - DestinationPort
- question: Were there interactive remote-desktop logons or session events on this host around the time of the connection?
  context: >-
    The network view shows the tunnel; the security channel shows whether a remote-desktop logon actually
    occurred. Remote interactive logons (logon type 10) and remote session connect/disconnect events place
    a user and a source address on this host and let you correlate a real RDP session with the outbound
    relay. A tunnel with no corresponding logon suggests the port pairing is being used purely as a covert
    channel, while a logon from an unexpected account or address ties the desktop session to the tunnel.
    If security logs are not collected in this environment, treat zero results as a visibility gap rather
    than proof no session occurred.
  range: -6h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      scope:
        host.name|expand: '%hostname%'
      selection_logon:
        EventID: 4624
        LogonType: 10
      selection_session:
        EventID:
          - 4778
          - 4779
      condition: scope and (selection_logon or selection_session)
    fields:
      - TargetUserName
      - IpAddress
      - LogonType
      - EventID
- question: What processes ran on this host in the window after the connection was established?
  context: >-
    A tunneled RDP path is a means to act on the host: once a session is relayed in, an operator runs
    commands, deploys tools, or reaches further systems. Reviewing process activity in the window after the
    connection reveals what the session was used for. Interactive remote-desktop activity commonly appears
    under explorer.exe, and command interpreters or reconnaissance and transfer utilities such as cmd.exe,
    powershell.exe, or certutil.exe launched shortly afterward are the follow-on actions worth chasing.
  range: +30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - Image
- question: Has the account tied to this activity used remote-access tooling to reach other hosts recently?
  context: >-
    Operators rarely stop at one system. If the account associated with this host is also
    running remote-desktop or remote-execution tooling against other hosts within a short
    window, the scope of compromise is wider than a single tunnel. A spread of such tool use
    across many hosts by one account points to active movement through the environment rather
    than an isolated relay. If this alert fired under SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or
    a machine account (name ending in $), this query intentionally returns nothing — a user
    pivot on a service principal matches every host's background automation, not an actor;
    assess movement through the host- and program-scoped questions instead.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_lateral:
        Image|endswith:
        - \psexec.exe
        - \psexec64.exe
        - \mstsc.exe
        - \ssh.exe
        - \plink.exe
        - \wmic.exe
      filter_svcprin_builtin:
        User:
        - SYSTEM
        - LOCAL SERVICE
        - NETWORK SERVICE
      filter_svcprin_machine:
        User|endswith: $
      condition: (selection and selection_lateral) and not 1 of filter_svcprin_*
    fields:
    - host.name
    - Image
- question: Does this host normally communicate with this destination?
  context: >-
    A first-time connection to the destination is more suspicious than routine communication with it.
    Establishing whether this host has reached this address before, and on what ports, helps separate a
    newly stood-up tunnel endpoint from an address the host talks to as part of normal operation. Zero or
    very low prior counts mark the destination as new for this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
- question: When this host has previously produced RDP-to-web-port connections, what programs and accounts drove them, and does the current alert fit that pattern?
  context: >-
    The query mirrors the rule's exact firing pattern scoped to this host, so the resulting
    program and account distribution reflects how this specific 3389-to-web-port behavior has
    run here historically rather than generic svchost activity. Expect the Image column to show
    svchost.exe itself; a recurring, consistent account suggests a long-standing sanctioned
    relay, while an unexpected account or a first appearance of the pattern is the deviation
    worth chasing. Connection events carry no parent lineage - pivot to the svchost instance's
    start event if lineage matters.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        Image|endswith: \svchost.exe
        Initiated: 'true'
        SourcePort: 3389
        DestinationPort:
        - 80
        - 443
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    A tunnel rarely stands alone. Aggregating process activity in a tight window around the connection
    surfaces what led up to it and what ran immediately after. Novel parent-child pairs stand out at low
    counts against the high-count routine telemetry, which is what points to the tooling that established
    the channel and any actions taken once the session was relayed.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts produced the same RDP-to-web-port pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's firing pattern with no host scope, giving a fleet-wide count of the same
    3389-to-web-port behavior rather than generic svchost usage. Many hosts producing the identical pattern
    points to a scripted relay or a mis-scoped deployment; one host or a small unrelated set points to
    hands-on operator activity. Use the host spread and the consistency of the parent to calibrate how far
    the channel reaches.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        Image|endswith: \svchost.exe
        Initiated: 'true'
        SourcePort: 3389
        DestinationPort:
        - 80
        - 443
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host -- reconnaissance, credential
    access, or defense tampering -- may reveal the stages that preceded the tunnel and help reconstruct the
    timeline. A relayed RDP path is typically established to reach or act on the host, so prior alerts help
    place this connection within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
