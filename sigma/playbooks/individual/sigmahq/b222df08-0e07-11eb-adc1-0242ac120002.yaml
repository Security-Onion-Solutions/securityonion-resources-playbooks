name: Invoke-Obfuscation CLIP+ Launcher
id: 69a2e13e-ec6f-45f5-a0d9-8dbdf4aa9eee
description: |
  Detects an obfuscated command shell invocation that combines a cmd.exe conditional execution chain (&& with /c or /r) with a PowerShell clipboard class reference and the -f format operator, a pattern produced by the CLIP+ launcher transform of a PowerShell obfuscation framework. The rule fires only when a single command line contains all of the format-operator and clipboard markers AND a cmd.exe execution switch, so legitimate matches are rare. Investigation should decode the full command line, identify the PowerShell payload the launcher reconstructs and executes, and confirm whether the activity is an authorized assessment or an operator running obfuscated execution.
type: detection
detection_id: b222df08-0e07-11eb-adc1-0242ac120002
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line combine a cmd.exe execution switch with the clipboard class reference and the -f format operator?
  context: Confirm the alert is a true positive by reviewing the exact command line. The rule fires only when one command line contains cmd, &&, the clipboard class reference, and -f together AND a /c or /r switch. Verify all of these markers are present in the same command rather than coincidentally split across unrelated arguments.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run obfuscated cmd-to-PowerShell launchers?
  context: Legitimate administrative scripting rarely chains a clipboard class reference and the -f format operator through a cmd.exe conditional. Knowing whether the user role and host function involve scripted automation or developer tooling is often the fastest way to separate a true positive from an unusual but sanctioned workflow.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this launcher execution part of an authorized penetration test or red team engagement?
  context: Obfuscation launchers of this kind are bundled into offensive PowerShell tooling used in authorized assessments. Before investing investigation time, check whether a penetration test or red team exercise is currently active on this host or network segment. An authorized engagement with matching timing and tooling resolves the alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What does the full command line do once the obfuscation is reconstructed? Decode the cmd chain and the PowerShell it launches.
  context: The command line reveals the actual operation. Decode the cmd.exe conditional chain, then reconstruct the PowerShell payload that the -f format operator and clipboard class reference assemble at runtime. The clip pattern typically rebuilds a string from format placeholders and pipes it into PowerShell, so decode the format arguments to recover the real cmdlets, URLs, or in-memory loader the launcher runs.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
        - '&&'
        - 'clipboard]::'
        - -f
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What PowerShell payload does the launcher reconstruct, and what does it do when executed?
  context: This launcher hides its payload behind string formatting and a clipboard class reference rather than presenting readable cmdlets. Reconstruct the string the -f format operator assembles to recover the real command, then identify what it does -- a download cradle fetching a remote URL, an in-memory .NET assembly load, or a reverse shell. The reconstructed payload, not the obfuscated wrapper, is what determines impact.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which obfuscation transform and payload behavior does this launcher invoke?
  context: Obfuscation frameworks offer many transforms and can wrap any payload. The specific format placeholders, clipboard reconstruction, and the reconstructed cmdlets reveal which capability was used -- a download cradle, credential access, or in-memory execution -- which determines the scope of potential compromise and the required response.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned this command shell and is that parent chain expected?
  context: The parent process reveals how the launcher was invoked. Interactive use under explorer.exe differs from an Office application, mshta.exe, wscript.exe, or a browser child spawning the cmd chain, which points to a macro, script-host delivery, or a phishing payload. Walk up from the parent to see what else it spawned.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Were PowerShell security controls bypassed or weakened before this execution?
  context: Operators often disable or bypass PowerShell protections before running an obfuscated payload. Common precursors include AMSI patching, execution policy bypass flags, downgrade to PowerShell v2 which lacks modern logging, and Defender preference changes. Finding these in the hour before the launcher fired strengthens the case for malicious activity.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the deobfuscated script content?
  context: Script block logging records the deobfuscated script content PowerShell actually executes, even when the launcher's command line is wrapped in format-operator obfuscation. This provides ground truth about what ran, bypassing the clipboard reconstruction. If PowerShell operational logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Did a non-PowerShell process load the PowerShell automation assemblies around the time of this alert?
  context: Obfuscation launchers can drive PowerShell indirectly by loading the management automation assemblies into a host process instead of spawning powershell.exe, which evades command-line-only detection. Module load events showing System.Management.Automation or System.Management.Automation.ni loaded by cmd.exe, a script host, or another unexpected process indicate .NET-hosted PowerShell execution worth correlating with this launcher.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|contains:
          - 'System.Management.Automation'
          - 'System.Automation'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - ProcessGuid
- question: Were files created on this host by the command shell process after the launcher fired?
  context: An obfuscated launcher that runs a download cradle or in-memory loader often drops staging files, decoded payloads, or output to disk. Checking for files written by the spawning process confirms execution and reveals the scope of activity even if the original process has exited.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Are any files referenced or dropped by the decoded command still on disk for analysis?
  context: If the reconstructed payload references a file -- a downloaded script, decoded output, or staged binary -- checking whether it still exists enables deeper analysis through hash lookups, sandbox submission, or content review. The file paths come from the decoded command line rather than a literal field in the alert.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: When this host has previously fired this launcher pattern, what parents and users normally drove it, and does the current alert fit?
  context: The query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution reflects how this specific launcher pattern -- not generic cmd.exe usage -- has historically run here. A new parent process, an unexpected user account, or a first-ever appearance of the pattern on this host is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - cmd
        - '&&'
        - 'clipboard]::'
        - -f
        CommandLine|contains:
        - /c
        - /r
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - cmd
        - '&&'
        - 'clipboard]::'
        - -f
        CommandLine|contains:
        - /c
        - /r
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - cmd
        - '&&'
        - 'clipboard]::'
        - -f
        CommandLine|contains:
        - /c
        - /r
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar execution on multiple hosts, the scope of the operation may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - cmd
        - '&&'
        - 'clipboard]::'
        - -f
        CommandLine|contains:
        - /c
        - /r
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired this launcher pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this launcher pattern rather than generic cmd.exe usage. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - cmd
        - '&&'
        - 'clipboard]::'
        - -f
        CommandLine|contains:
        - /c
        - /r
      condition: selection
    fields:
    - host.name
