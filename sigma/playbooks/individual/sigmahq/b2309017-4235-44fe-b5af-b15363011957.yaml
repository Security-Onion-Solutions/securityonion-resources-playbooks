name: Uncommon Child Process Of Defaultpack.EXE
id: 53b9dd8a-7f0c-462f-99ad-7e0713665921
description: |
  Detects when DefaultPack.exe spawns a child process. DefaultPack.exe is a Microsoft-signed binary that ships
  alongside certain software downloads and can be used to launch other programs with command-line arguments,
  making it a proxy for executing arbitrary binaries while inheriting the trust of a signed parent. The rule fires
  on the parent-child relationship alone, so the investigation centers on what child was launched, how it was
  invoked, what it loaded or connected to, and whether this spawning pattern is normal for the host.
type: detection
detection_id: b2309017-4235-44fe-b5af-b15363011957
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Is the parent process of the alerting event DefaultPack.exe?
  context: Confirm the alert is a true positive by reviewing the triggering event and verifying the parent
    process path ends in DefaultPack.exe. The child process identity from this event drives the rest of the
    investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: Is this user and host expected to run DefaultPack.exe and have it launch other programs?
  context: DefaultPack.exe is installed when a user leaves a default-search-provider option checked during certain
    software installs, so it appears on ordinary endpoints but rarely spawns child processes during normal use.
    Knowing whether this host and user routinely run it helps separate a benign installer artifact from proxy
    execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the child process and what did its command line do? Decode any flags, paths, or URLs.
  context: DefaultPack.exe accepts a child command via a switch and passes arguments through to the launched
    program, so the child's full command line shows the operational intent. Decode any encoded content, script
    paths, DLL entrypoints, or an HTTP/HTTPS URL passed to the child.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: What spawned DefaultPack.exe itself, and was that parent chain expected?
  context: The grandparent reveals how DefaultPack.exe came to run. A launch from explorer.exe or an installer is
    consistent with ordinary software setup, while a launch from a script interpreter, an Office application, or a
    remote-access tool points to the proxy being driven by another stage of activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: What modules did the child process load, and were any unsigned or loaded from a user-writable path?
  context: Proxy execution through a signed binary is often used to load an externally supplied payload into the
    launched child. Modules loaded from user-writable directories or modules without a valid signature are the
    artifact that distinguishes a benign program launch from a malicious DLL or stager being executed under the
    child.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
      - Signature
- question: Did the child process make any network connections, and to what destinations?
  context: A program launched through the signed proxy may retrieve a payload or establish command-and-control.
    Outbound connections from the child — especially to external addresses or on uncommon ports — indicate the
    proxied program is fetching or communicating with remote infrastructure rather than performing local-only work.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Does DefaultPack.exe normally spawn this child binary on this host?
  context: Some parent-child pairs are routine, but DefaultPack.exe launching another program is uncommon outside
    of its initial install behavior. A zero or very low historical count for this specific parent-child pairing
    marks it as a novel spawning relationship worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: What other child processes did DefaultPack.exe spawn on this host?
  context: A proxy binary may be used to launch several programs in sequence — reconnaissance, credential access,
    or follow-on payloads. Listing every child of DefaultPack.exe reveals the full scope of what was launched
    through this execution path beyond the one that triggered the alert.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is DefaultPack.exe spawning this same child binary on other hosts?
  context: The same parent-child pairing appearing across multiple hosts can indicate a software-deployment
    artifact or a repeated proxy-execution pattern pushed to many endpoints. A single occurrence is more likely
    targeted or host-local.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \DefaultPack.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \DefaultPack.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple
    endpoints. If the same user triggered similar activity elsewhere, the scope may be larger than this single
    host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \DefaultPack.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining process activity around the alert reveals what led to this
    event and what followed, and whether it is part of a larger sequence such as reconnaissance, privilege
    escalation, or persistence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may
    reveal the stages that preceded this event and help reconstruct the timeline leading up to the proxy
    execution.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
