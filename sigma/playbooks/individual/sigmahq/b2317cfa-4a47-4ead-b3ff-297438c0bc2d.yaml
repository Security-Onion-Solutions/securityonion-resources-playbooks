name: HackTool - SharpView Execution
id: 2196d737-5495-4827-a4cf-d500332ced3c
description: |
  Detects execution of SharpView, a .NET port of the PowerView Active Directory reconnaissance framework. The rule fires when a process has the original file name or image name SharpView.exe, or when its command line contains any of the framework's discovery method names (Get-Domain*, Find-*, Get-Net*, Invoke-Kerberoast, and similar). Because SharpView resolves its methods through .NET at runtime rather than through PowerShell, it enumerates domain users, groups, computers, trusts, shares, sessions, and ACLs from a single C# binary that script-block logging does not capture. Legitimate use is largely limited to authorized penetration tests and red-team engagements; outside that context this binary's presence on a workstation indicates hands-on-keyboard enumeration that typically precedes lateral movement, credential access, or privilege escalation. Determine which capability was invoked, whether the user and host are expected to run offensive tooling, and what discovery, network, or follow-on activity surrounds the execution.
type: detection
detection_id: b2317cfa-4a47-4ead-b3ff-297438c0bc2d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does this process match SharpView by name, original file name, or PowerView method on the command line?
  context: Confirm the alert is a true positive before investing time. The rule fires when the original file name or image name is SharpView.exe, or when the command line contains a PowerView discovery method such as Get-DomainController, Find-LocalAdminAccess, or Invoke-Kerberoast. Review the image, original file name, and full command line against these criteria; a renamed binary still matches on the method name passed as its first argument.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this SharpView execution part of an authorized penetration test or red team engagement?
  context: SharpView is an offensive Active Directory reconnaissance tool used in authorized security assessments. Before further analysis, check whether a penetration test or red team exercise is currently active on this host or network segment. An authorized engagement with matching tool usage and timing resolves the alert without deeper investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run Active Directory enumeration tooling?
  context: Domain administrators and IT staff legitimately enumerate AD objects for troubleshooting and inventory, but they almost always do so with native tools rather than a ported offensive framework. A standard user or a server with no administrative function running SharpView is anomalous. The user's role and the host function determine whether this enumeration is routine or hands-on-keyboard reconnaissance.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: What exactly did SharpView enumerate? Decode the method name and its arguments on the command line.
  context: The command line names the specific PowerView method invoked and its parameters. Decode the subcommand to understand which objects were targeted - Get-DomainController and Get-DomainTrust map domain and trust topology, Get-NetSession and Get-NetLoggedOn enumerate remote sessions, Invoke-Kerberoast requests service tickets for offline cracking, and Add-DomainObjectAcl or Set-DomainObject write to directory ACLs. The scope of the query reveals what the operator was looking for and which protocols the host will have generated.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Which SharpView capability was invoked, and does it read or write directory objects?
  context: SharpView is multi-purpose. Most methods are read-only enumeration (Get-Domain*, Find-*, Get-Net*), but a subset performs writes or credential-relevant actions - Add-DomainObjectAcl and Set-DomainObject modify directory ACLs and object attributes, Invoke-Kerberoast and Get-DomainSPNTicket request service tickets, and Invoke-UserImpersonation changes the calling thread's identity. The specific method determines the scope of potential compromise and the required response.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned SharpView, and is that parent chain expected?
  context: A ported offensive binary is typically launched in-memory from a C2 framework's execute-assembly loader, so the parent is frequently a host process or a script interpreter rather than an interactive shell. A parent of explorer.exe or cmd.exe started by an analyst is consistent with manual testing, while parents such as wmiprvse.exe, wsmprovhost.exe, powershell.exe, rundll32.exe, or an Office application indicate remote or staged execution worth escalating.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Has this host run SharpView before?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low historical counts indicate first-time or rare execution. Because SharpView is purpose-built for AD reconnaissance and has no routine administrative use, any prior history on a normal workstation is itself worth examining.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this SharpView pattern, what parents and users normally drove it, and does the current alert fit?
  context: The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern has historically run here rather than generic binary usage. A new parent process, an unexpected user account, or an unusual command-line structure relative to that history is the anomaly worth chasing.
