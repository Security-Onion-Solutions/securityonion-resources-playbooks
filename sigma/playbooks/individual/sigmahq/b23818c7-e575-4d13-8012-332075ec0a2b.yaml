name: Register New IFiltre For Persistence
id: 405f3bbc-5cf6-482b-8c68-1ad0e905c24e
description: |
  Detects a registry write that registers a new IFilter for Windows Search. An IFilter is a DLL
  associated with a file extension; the search indexer loads it as LOCALSYSTEM when a file of that
  extension is indexed, which makes IFilter registration a deferred, file-triggered persistence and
  code-execution mechanism. The rule fires when EITHER a file-extension key under Software\Classes
  registers a PersistentHandler value, OR a CLSID is registered under PersistentAddinsRegistered for
  the IFilter category GUID {89BCB740-6119-101A-BCB7-00DD010655AF} — while the writing process is not a
  standard system binary (under System32 or Program Files) and the handler is not one of the known
  default IFilter CLSIDs. Legitimate IFilters are normally registered by the OS or by software
  installers; investigate which handler CLSID and DLL were registered, which process wrote the keys and
  what launched it, whether the referenced DLL is unsigned or in an unusual location, whether the search
  indexer subsequently loaded it, and whether other persistence was staged in the same session.
type: detection
detection_id: b23818c7-e575-4d13-8012-332075ec0a2b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting registry write register a new IFilter, either an extension PersistentHandler or a CLSID PersistentAddinsRegistered entry?
  context: >-
    Before investing investigation time, confirm the alert is a true positive and note which branch
    fired. The rule matches EITHER a write whose path contains \SOFTWARE\Classes\. together with
    \PersistentHandler (a file extension being pointed at a persistent handler CLSID), OR a write whose
    path contains \SOFTWARE\Classes\CLSID together with
    \PersistentAddinsRegistered\{89BCB740-6119-101A-BCB7-00DD010655AF} (a handler CLSID being registered
    as an IFilter for the search category GUID). It fires only when the writing process is not a binary
    under System32 or Program Files and the handler is not a known default IFilter CLSID. Review the exact
    TargetObject and Details on the triggering event; the branch that fired tells you whether you start
    from an extension mapping or from a handler-CLSID registration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to register IFilters or persistent handlers for file extensions?
  context: >-
    Registering an IFilter is an administrative, install-time action that writes machine-wide keys under
    HKLM\Software\Classes and normally happens only when software that adds a new indexable file type is
    installed. A user account or an interactive session registering a handler outside of a software
    deployment is the preparatory step of this persistence. User attribution is present on roughly 94% of
    endpoint registry events; when it is a machine account or SYSTEM, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which IFilter registration key was written, and why is this a persistence location?
  context: >-
    Two registry footprints establish an IFilter. A file-extension key such as Software\Classes\.ext\PersistentHandler
    maps an extension to a persistent-handler CLSID, and a Software\Classes\CLSID\{handler}\PersistentAddinsRegistered\{89BCB740-6119-101A-BCB7-00DD010655AF}
    key lists that CLSID as an IFilter for the search category. A third key, Software\Classes\CLSID\{handler}\InProcServer32,
    points at the DLL on disk. Confirming which of these the alert wrote, and the handler CLSID it names,
    establishes that this is an IFilter registration rather than an unrelated Classes edit and sets up
    locating the backing DLL.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value was written to this key, and which handler CLSID or extension does it name?
  context: >-
    The Details field carries the payload of the registration. For an extension PersistentHandler write it
    is the handler CLSID the extension is being mapped to; for a PersistentAddinsRegistered write it is the
    IFilter category association. Decode it to recover the handler CLSID, which is the pivot to the DLL path
    held in that CLSID's InProcServer32 key. Details is present on roughly 79% of registry modifications and
    should be populated for this string value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Which DLL does the registered handler CLSID point at, and is it unsigned or in an unusual location?
  context: >-
    The executable code behind an IFilter is the DLL named in the handler CLSID's InProcServer32 default
    value, which is written near the extension and category-registration keys. Surfacing InProcServer32
    writes on this host around the alert recovers the DLL path so it can be assessed: a DLL under a system
    or vendor directory signed by a known publisher is consistent with legitimate software, while an
    unsigned DLL in a user-writable path such as Temp, AppData, or ProgramData is consistent with a planted
    filter that will run as LOCALSYSTEM when a matching file is indexed.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\InProcServer32'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What process wrote the IFilter keys, and what launched that process?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to read its
    Image, full command, and parent lineage. Legitimate IFilter registration is typically performed by an
    installer or by regsvr32.exe invoked by a signed setup process. A registration written by regsvr32.exe,
    rundll32.exe, powershell.exe, or cmd.exe launched from a script host such as wscript.exe or mshta.exe,
    from an Office application, or from an unsigned binary points to the persistence being staged
    programmatically rather than through a deliberate software install.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other registry modifications were made on this host in the same window?
  context: >-
    A complete IFilter registration writes several keys together - the extension PersistentHandler mapping,
    the handler CLSID, its InProcServer32 DLL path, and the PersistentAddinsRegistered category entry - so
    the triggering key is usually one of a cluster. Grouping registry writes on this host in a short window
    reveals the full set of keys the same process created and whether additional persistence or security
    changes landed alongside them. The triggering key appears in the results; the signal is what else was
    modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Was a DLL or executable dropped on disk by the registering process, and is the IFilter payload present?
  context: >-
    An IFilter is only effective if the DLL named in the handler's InProcServer32 value exists at that path.
    This checks whether the process that wrote the registration keys, or its child processes, created files
    in the same session. The DLL is often delivered by a separate step, so also confirm the InProcServer32
    path directly on disk. The file-write event carries no hash; if the DLL is present, hash it from a later
    load or retrieve it for a reputation lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did the Windows Search indexer host processes load a registered filter DLL, indicating the persistence executed?
  context: >-
    An IFilter DLL runs when the search indexer loads it as LOCALSYSTEM to index a file of the associated
    extension, so execution is deferred and may occur long after registration - whenever a matching file
    first appears. Listing the modules loaded by the indexer host processes (SearchIndexer.exe,
    SearchProtocolHost.exe, SearchFilterHost.exe) on this host lets the analyst check whether the DLL from
    the InProcServer32 path is among them and whether it is unsigned, which confirms the filter actually
    fired rather than merely being registered.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\SearchIndexer.exe'
          - '\SearchProtocolHost.exe'
          - '\SearchFilterHost.exe'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - SignatureStatus
- question: After this write, were the IFilter registration keys modified again or their value changed?
  context: >-
    Registry key or value deletions are not observable in this telemetry, so durability is judged from the
    key's re-modification history rather than from a delete event. A history with no later writes leaves the
    registration standing and primed to load the DLL the next time a matching file is indexed. A later write
    that changes the handler CLSID or restores a default value may indicate the registration was reverted to
    hide it. Compare the Details values written to this key over the following window.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Has this IFilter registration key been modified before on this host?
  context: >-
    IFilter registrations change rarely and normally only when software adding a new indexable file type is
    installed, so a history with no prior writes to this key makes this a first-time change and raises its
    weight. A history of periodic writes tied to a known application or update process points instead to
    legitimate software management. Compare the historical Details and writing process to see whether this
    handler was set before or is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same IFilter key registered on other hosts in the environment?
  context: >-
    The same registration across many hosts suggests a software deployment or a mis-scoped push; the same
    registration confined to one host suggests a targeted implant. Compare the Details values and writing
    process across hosts to see whether they all name the same handler CLSID and DLL, which separates a
    single hands-on operation from broad legitimate or malicious distribution of the same filter.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    IFilter registration rarely happens in isolation. Aggregating process activity in a tight window around
    the alert surfaces what led up to the registration - a download, an archive extraction, a script host -
    and what ran immediately after. Novel parent-child pairs stand out at low counts against high-count
    routine telemetry, which is what points to the tool that staged the filter.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, execution of scripting tools, or defense tampering
    - may reveal the stages that preceded this registration and help reconstruct the timeline. Persistence is
    usually established after an initial foothold, so prior alerts help place this IFilter registration within
    a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Attackers rarely rely on a single persistence mechanism. After registering an IFilter, they commonly
    install backup footholds using scheduled tasks, services, registry Run keys, BITS jobs, or WMI
    subscriptions created by schtasks.exe, sc.exe, reg.exe, bitsadmin.exe, or wmic.exe. Persistence tooling
    running near the registration indicates intentional stacking rather than an isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely - dropping an executable or script into a
    Startup folder or a path referenced by a registry Run key achieves persistence without invoking schtasks,
    sc, or reg. File writes to these locations near the IFilter registration indicate a parallel persistence
    mechanism was established on disk alongside the search-indexer foothold.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Does an administrator or the software owner recall registering this IFilter?
  context: >-
    IFilter registration outside of a software install has no routine reason to occur, so direct confirmation
    from the account owner or the team that manages this host is a fast way to resolve the alert. If an
    administrator installed a product that adds a new indexable file type, that closes it; if no one recalls
    the action, the account may be compromised or the registration was made by automated tooling, and the
    investigation should continue into the registered DLL and the writing process.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
