name: Use of TTDInject.exe
id: ac0a09b8-db3a-401a-af47-39a32897e1e7
description: |
  Detects execution of ttdinject.exe, the Time Travel Debugging injector shipped with Windows 1809 and newer and the
  underlying call behind tttracer.exe. The rule fires when a process image ends in ttdinject.exe or carries the original
  file name TTDInject.EXE. As a trusted, signed developer utility, ttdinject.exe can be abused to launch an arbitrary
  executable as a child process, proxying execution through a binary that defenders may treat as benign. Legitimate use is
  largely confined to debugging and build/developer hosts; the investigation should determine whether this host and user
  are an expected context for the tool, what it was launched to do, and what it spawned, loaded, wrote, or contacted.
type: detection
detection_id: b27077d6-23e6-45d2-81a0-e2b356eea5fd
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the alerting process match ttdinject.exe either by image name or by original file name?
  context: Confirm the alert is a true positive by reviewing the triggering event. The rule matches when the process image
    ends in ttdinject.exe or when the original file name is TTDInject.EXE; the latter catches a renamed copy. Note the full
    image path - the expected locations are System32 and SysWOW64. The launched program named by a /Launch or /ClientParams
    argument is decoded in the command-line question.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Is this user and host an expected context for running a Time Travel Debugging utility?
  context: Legitimate use of ttdinject.exe is largely confined to debugging and software development. A developer or build
    host running it under an engineer account is routine; the same tool on a general-purpose workstation, server, or under
    an account with no development role is the deviation worth chasing. Confirm whether this host is a known developer or
    build system and whether the user normally performs debugging work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What program was ttdinject.exe launched to run, and what do its full command-line arguments specify?
  context: The full command line reveals the operation. ttdinject.exe proxies execution of another binary - the path after
    /Launch or /launch names the program it was asked to run, and /ClientParams or /ClientScenario controls how the trace
    is recorded, including the log file path. Decode every argument to identify the launched executable and where its output
    is written. Running ttdinject.exe to launch a program requires administrator privileges, so the operation already implies
    an elevated context.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned ttdinject.exe and is that parent chain expected?
  context: The parent process reveals how the tool was invoked. Invocation from a debugger, an IDE, or a build orchestrator
    fits legitimate developer use. A parent such as a script host, an Office application, an email client, or a shell launched
    from a download directory points toward proxy execution rather than debugging. Walk up the parent chain to see what
    started the parent and what else it spawned.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did ttdinject.exe spawn, and are any of them command interpreters or scripting hosts?
  context: The whole point of proxy execution is to start another program through the trusted utility. Child processes such
    as powershell.exe, cmd.exe, rundll32.exe, regsvr32.exe, wscript.exe, or mshta.exe spawned by ttdinject.exe are high-risk
    in this context and indicate the tool was used to run something rather than to debug an existing program. Identify each
    child binary and its command line.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did ttdinject.exe or its children write a new executable to a user-writable path on this host?
  context: Proxy execution is often paired with dropping a payload first and then running it. Look for new executable or
    script files written under user-writable locations such as the public profile, temp, or roaming application data
    directories around the time of the alert. A new binary in one of these paths that ttdinject.exe or a child then launched
    ties the file drop to the execution. Scope the search to the file paths and directories associated with the alerting
    activity rather than all file events on the host.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - User
      - EventType
- question: Did ttdinject.exe load any DLLs from user-writable or atypical paths?
  context: Trusted developer utilities are sometimes abused to load attacker-supplied code as a module. A DLL loaded by
    ttdinject.exe from a user-writable or unusual location - rather than from System32 or a signed product directory - is
    worth verifying for signing status and origin. Loads of unsigned or invalidly signed modules from such paths are the
    deviation to flag. If image-load telemetry is not collected in this environment, treat zero results as a visibility gap
    rather than evidence nothing loaded.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Image
  answer_sources:
  - image_load
  - manual_review
- question: Did ttdinject.exe or the program it launched make any outbound network connections shortly after execution?
  context: Proxy execution that immediately reaches out to a remote host suggests the launched program is fetching a stage
    or beaconing rather than performing local debugging. Examine outbound connections from ttdinject.exe and its children in
    the window after the alert, paying attention to rare or previously unseen destinations. Time correlation between the
    utility execution and the first egress - typically within zero to thirty minutes - strengthens the link.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
  answer_sources:
  - network_connection
  - manual_review
- question: Does this host normally run ttdinject.exe?
  context: A process never before seen on a host is more suspicious than one that runs regularly. Zero or very low historical
    counts over the trailing window indicate first-time or rare execution and argue against routine debugging activity on
    this system.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and
    does the current alert fit that pattern?
  context: Even a tool that appears occasionally can be abused. This query mirrors the rule's selection scoped to this host,
    so the resulting parent and user distribution reflects how the rule's specific firing pattern has historically run here -
    not generic binary usage. A new parent process, an unexpected user account, or an unusual command-line structure is the
    anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
      - Image|endswith: ttdinject.exe
      - OriginalFileName: TTDInject.EXE
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
      - Image|endswith: ttdinject.exe
      - OriginalFileName: TTDInject.EXE
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
      - Image|endswith: ttdinject.exe
      - OriginalFileName: TTDInject.EXE
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints.
    If the same user triggered similar activity on more than one host, the scope of the activity may be larger than a single
    alert suggests.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
      - Image|endswith: ttdinject.exe
      - OriginalFileName: TTDInject.EXE
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like
    consistent automation or one-off activity?
  context: This query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of the rule's
    firing pattern rather than generic usage of the binary. Many hosts firing the same pattern points to scripted deployment
    or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution
    and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
      - Image|endswith: ttdinject.exe
      - OriginalFileName: TTDInject.EXE
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host - defense tampering, reconnaissance, or
    credential access - may reveal the stages that preceded this event and help reconstruct the timeline that led to proxy
    execution through a trusted utility.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
