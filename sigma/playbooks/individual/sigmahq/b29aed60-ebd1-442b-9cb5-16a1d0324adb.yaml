name: Wow6432Node CurrentVersion Autorun Keys Modification
id: 980a4b8d-49e2-4a03-b144-beace9fdfcd1
description: |
  Detects a registry write to a 32-bit-on-64-bit (Wow6432Node) autostart extensibility point under
  SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion. The rule fires when a TargetObject contains
  the Wow6432Node CurrentVersion base AND one of the known autorun key names -- Run, RunOnce, RunOnceEx,
  RunServices, RunServicesOnce, ShellServiceObjectDelayLoad, or an Explorer shell-extension key
  (ShellServiceObjects, ShellIconOverlayIdentifiers, ShellExecuteHooks, SharedTaskScheduler, Browser
  Helper Objects). Values placed here run automatically at logon or when Explorer and other shell
  components start, which is why these keys are a common persistence location. Legitimate installers and
  updaters write these keys constantly, so the rule excludes many known-good writers (runtime installers,
  msiexec, Office ClickToRun, Edge, Dropbox, Discord, antivirus repair, and others); a write that
  survives those filters is worth review. Investigate what value was written, which process wrote it and
  what launched that process, whether a referenced payload landed on disk and executed at the next logon
  or reboot, whether the value was later changed again, and whether other persistence was staged in the
  same session.
type: detection
detection_id: b29aed60-ebd1-442b-9cb5-16a1d0324adb
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting write target a Wow6432Node CurrentVersion autorun key?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a
    registry value is written whose TargetObject contains the SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion
    base AND one of the autorun key names (Run, RunOnce, RunOnceEx, RunServices, ShellServiceObjectDelayLoad,
    or an Explorer shell-extension key such as Browser Helper Objects or ShellIconOverlayIdentifiers).
    Review the exact TargetObject and Details on the triggering event to confirm which autorun key was set
    and that the writing process is not one of the known-good installers the rule already excludes.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify autorun keys under the Wow6432Node CurrentVersion path?
  context: >-
    Autorun keys are written routinely by 32-bit installers and updaters but rarely by interactive users
    or ad-hoc tooling, so knowing whether the writing account and host function match a sanctioned software
    deployment is often the fastest way to separate a routine install from a persistence write. User
    attribution is present on roughly 94% of endpoint registry events; when it is a machine account or
    SYSTEM (common for service-driven installs), pivot on the writing process instead of the account.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which autorun key and value name were written, and why is this a persistence location?
  context: >-
    The exact key determines what executes and when. A value under Run or RunServices runs at every logon
    or service start; RunOnce and RunOnceEx run once at the next logon (RunOnceEx can also load a DLL via a
    Depend subkey, a placement some triage tools do not display). Shell-extension keys (Browser Helper
    Objects, ShellIconOverlayIdentifiers, ShellServiceObjectDelayLoad) load a COM object into Explorer or
    other shell hosts. Confirming the specific key, the value name, and the writing process establishes
    what code will run and rules out an unrelated CurrentVersion edit.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What binary path, command, or CLSID was written to the autorun value?
  context: >-
    The Details field holds what the key will execute. For Run/RunOnce keys it is typically a path to an
    executable or script, sometimes with arguments or an inline interpreter command; for shell-extension
    keys it is usually a CLSID that resolves to a registered DLL. Decode it and note whether the path points
    to a user-writable or unusual location (Temp, AppData, ProgramData, Public) rather than a signed vendor
    directory. If it references a file path, that path becomes a lead for confirming a payload on disk.
    Details is present on roughly 79% of registry modifications and should be populated for this string value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote this autorun key, and what launched that process?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to read its
    Image, full command, and parent. A legitimate install shows a signed installer or updater under
    msiexec.exe or a vendor setup binary; a reg.exe, powershell.exe, or cmd.exe write launched from an
    Office application, a script host such as wscript.exe or mshta.exe, or an unsigned binary points to the
    autorun value being staged programmatically rather than by an installer. The parent chain distinguishes
    a scripted persistence write from a normal software deployment.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: After the autorun value was set, did the configured payload execute on this host?
  context: >-
    Autorun persistence is only active if the referenced binary or script actually runs. Because the value
    executes at the next logon or reboot rather than immediately, the query anchors on the path recorded in
    the Details value: any row is the configured command actually launching. An execution confirms the
    persistence took effect; a zero within the window means it is primed to run at a future logon. If the
    value stores an environment-variable or shortened form of the path, expand it and search the literal
    path manually — a zero is expected here in that case.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|expand: '%Details%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Was the executable or script referenced by the autorun value created on disk in the same session?
  context: >-
    Autorun persistence is only effective if the payload named in the value exists at that path. If the value
    points to a binary under a user-writable directory, confirming that the writing process or its children
    dropped a file there determines whether the persistence is armed and what it would execute. The
    file-write event carries no hash; if the payload is present, hash it from a later execution or retrieve it
    for a reputation lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: After this write, was the autorun value changed again or overwritten on this host?
  context: >-
    Registry key and value deletions are not observable in this telemetry, so durability is judged from the
    key's re-modification history rather than from a delete event. A later write that replaces the value with
    a benign or installer-set path can indicate the entry was reverted to hide it, while the value persisting
    unchanged leaves the autorun primed to run at every logon or startup. Compare the Details values written
    to this key over the following window to see whether the entry was cleaned up, updated, or left in place.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Has this autorun key been modified before on this host?
  context: >-
    A first-time write to this key carries more weight than a routine change. Some autorun keys are touched
    on every software update by the same installer, while a key that has no prior modification history is a
    new persistence entry. Compare the historical Details values to see whether the same value has been set
    before by a known installer or whether this write is unique to this event.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same autorun key modified on other hosts in the environment?
  context: >-
    The same write across many hosts suggests a software rollout or a mis-scoped deployment; the same write
    confined to one host suggests a targeted persistence entry. Compare the Details values and the writing
    process across hosts to see whether they all set the same value from the same installer or whether one
    host stands out with a different payload, which separates broad legitimate activity from a single
    hands-on operation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor who sets one autorun key often makes other configuration changes in the same session -
    additional Run or shell-extension keys, security-policy edits, or service configuration. Clustering the
    registry writes on this host in a short window around the alert reveals the full scope of the changes and
    which process made them. The triggering key appears in the results; the signal is what else was modified
    and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Persistence writes rarely happen in isolation. Aggregating process activity in a tight window around the
    alert surfaces what led up to the autorun write and what ran immediately after it. Novel parent-child
    pairs stand out at low counts against high-count routine telemetry, which is what points to the tool that
    staged the persistence and any follow-on actions.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, execution of scripting tools, or defense tampering
    - may reveal the stages that preceded this change and help reconstruct the timeline. Autostart
    persistence is typically established to survive reboots after an initial foothold, so prior alerts help
    place this write within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Attackers rarely rely on a single persistence mechanism. After setting an autorun value, they commonly
    install backup footholds using different techniques - scheduled tasks, services, or BITS jobs created by
    schtasks.exe, sc.exe, reg.exe, bitsadmin.exe, or wmic.exe. Multiple persistence installations in the same
    timeframe indicate intentional stacking rather than an isolated software change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely - dropping an executable or script into a
    Startup folder or a path referenced by a registry Run key achieves persistence without invoking schtasks,
    sc, or reg. File writes to these locations near the autorun write indicate the payload also established a
    parallel persistence mechanism on disk.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Does the user or an administrator recall installing software or making this autorun change?
  context: >-
    Direct confirmation from the account owner or the administrator responsible for the host is a fast way to
    resolve the alert. If the change came from a documented software install or a maintenance action, that
    closes it; if no one recalls the action and no install was underway, the account may be compromised or the
    write was made by automated tooling, and the investigation should continue into the writing process and
    any dropped payload.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
