name: Using SettingSyncHost.exe as LOLBin
id: 2aa16aba-0485-4810-a2c8-09969e6267b3
description: |
  Detects settingsynchost.exe spawning a child process whose Image does NOT live under
  C:\Windows\System32\ or C:\Windows\SysWOW64\, where the parent command line contains
  cmd.exe /c together with RoamDiag.cmd and -outputpath. settingsynchost.exe can extract
  a batch file from its own resources, write it to a temporary location, and execute it;
  that batch in turn invokes several OS utilities by name without full paths, so an
  attacker who drops a malicious binary named after one of those utilities can have it
  executed through the trusted parent — a search-order / path-interception hijack. The
  investigation should determine whether the child binary is a legitimate system utility
  that happens to live outside the system directories or an attacker-planted file riding
  the trusted parent chain.
type: detection
detection_id: b2ddd389-f676-4ac4-845a-e00781a48e5f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Did settingsynchost.exe spawn a child binary located outside System32/SysWOW64 with a RoamDiag.cmd / -outputpath parent command line?
  context: Confirm the alert is a true positive before investing further. The rule fires when the parent command line contains cmd.exe /c together with RoamDiag.cmd and -outputpath AND the child process Image does not begin with C:\Windows\System32\ or C:\Windows\SysWOW64\. Read the full ParentCommandLine and the child Image and verify both conditions hold; a child binary running from a system directory would not have triggered this rule.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentCommandLine
      - Image
- question: Is this user and host expected to run diagnostic or settings-sync tooling that extracts and executes batch helpers?
  context: Legitimate diagnostic workflows can invoke settingsynchost.exe with these switches. Knowing whether the user role and host function are consistent with running settings-sync diagnostics is often the fastest way to separate routine activity from a path-interception hijack.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What spawned settingsynchost.exe, and is that grandparent chain expected?
  context: The parent-child relationship is the core signal for this detection. Tracing the origin of the cmd.exe /c RoamDiag.cmd parent reveals whether the chain began with a user action, a scheduled or pushed task, or an unexpected process such as a script interpreter or remote-access tool — the latter pointing to operator-driven abuse of the trusted binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Decode the parent command line — what diagnostic script and output path did it specify?
  context: The parent command line carries the cmd.exe /c RoamDiag.cmd and -outputpath arguments. Decode the full argument list to identify the exact script name, the output path it was told to use, and any additional switches. The extracted batch invokes several OS utilities by name without full paths (for example wevtutil, makecab, reg, ipconfig), so the output and working directory indicate where a hijacking binary could be planted to be picked up by name.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: What exactly did the hijacked child binary do? Decode its command line and working directory.
  context: The child binary runs from a non-system directory through the trusted parent chain. Decode its full command line, flags, and working directory to determine what action it performed. Scoping to the child Image on this host within a short window captures any sequential invocations that together form a single operation rather than only the triggering event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Was the child binary, or a data stream attached to it, written to that path shortly before it ran?
  context: A search-order hijack requires the attacker to plant a binary named after a legitimate utility (or attach a payload as a stream on an existing file) in a directory that is not normally write-protected, then have it executed by name. The endpoint agent records both plain file writes and alternate-data-stream writes as ordinary file-creation events, with any stream name appended to the path in TargetFilename — there is no stream hash recorded, so this establishes the write and the writing process, not file contents. A hit shortly before the process started supports a deliberate drop-then-run sequence rather than a long-installed utility.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Was a file write to the child binary's path correlated in time with its execution on this host?
  context: Path-interception hijacks pair a recent file write of the malicious binary with its subsequent execution. A file creation event for the binary's path occurring minutes before the process started — rather than days or weeks earlier as part of a software install — supports a deliberate drop-then-run sequence. The correlation window between the write and the execution is the discriminator.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other child processes did the same settingsynchost.exe parent spawn?
  context: If the parent chain spawned the detected child, it may have spawned other processes too. Examining siblings of the same parent reveals the full scope of activity initiated through the trusted binary — multiple non-system children from the same parent points to orchestrated abuse rather than a one-off.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has settingsynchost.exe spawned this child binary on this host before?
  context: Some parent-child pairings are routine; this specific combination — settingsynchost.exe driving the RoamDiag diagnostic batch to launch a binary outside the system directories — is unusual. Zero or very low historical counts for this parent-child pairing indicate a novel spawning relationship worth treating as the deviation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: Does this host normally run the child binary from this non-system path?
  context: A binary that has never run on this host, or runs only from a non-standard directory, is more suspicious than one that runs regularly from its expected install location. Zero or very low historical counts indicate first-time or rare execution consistent with a planted file.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      system_utility:
        Image|startswith:
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
      parent_is_settingsynchost:
        ParentCommandLine|contains|all:
        - cmd.exe /c
        - RoamDiag.cmd
        - -outputpath
      _pb_scope:
        User|expand: '%User%'
      condition: (not system_utility and parent_is_settingsynchost) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      system_utility:
        Image|startswith:
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
      parent_is_settingsynchost:
        ParentCommandLine|contains|all:
        - cmd.exe /c
        - RoamDiag.cmd
        - -outputpath
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (not system_utility and parent_is_settingsynchost) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity on several hosts in the same window, the scope of the activity may be larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      system_utility:
        Image|startswith:
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
      parent_is_settingsynchost:
        ParentCommandLine|contains|all:
        - cmd.exe /c
        - RoamDiag.cmd
        - -outputpath
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (not system_utility and parent_is_settingsynchost) and _pb_scope
    fields:
    - host.name
- question: Is this settingsynchost.exe spawning pattern occurring on other hosts?
  context: The same parent-child relationship appearing on multiple hosts may indicate a broader operation or a repeated technique rather than a one-off. Enterprise-wide comparison helps calibrate the scope and identify additional affected hosts.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
- question: Were files dropped to persistence locations (Startup folders, scheduled-task definitions) on this host?
  context: Path interception that hijacks a trusted parent chain is often paired with a separate, more durable persistence mechanism. Dropping an executable or script into a Startup folder or a path referenced by a registry Run key achieves persistence without running standard persistence tools, and file-event monitoring captures these drops even when the attacker avoids schtasks, sc, or reg.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — reconnaissance, file drops, defense tampering, or credential access — may reveal the stages that preceded this execution and help reconstruct the timeline leading to the hijack.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
