name: Uncommon Connection to Active Directory Web Services
id: d958ae59-ed49-47b5-b820-abe34737a6a5
description: |
  Detects an initiated (outbound) network connection to TCP port 9389 - the Active Directory
  Web Services (ADWS) endpoint on domain controllers - from a process that is NOT one of the
  allow-listed AD management binaries (the AD Administrative Center dsac.exe, PowerShell 7 or
  Windows PowerShell, or the Microsoft Monitoring Agent). ADWS is the web-service protocol
  behind the Active Directory PowerShell module (Get-ADUser, Get-ADComputer, etc.); because its
  on-the-wire traffic differs from raw LDAP, an operator can enumerate domain accounts, groups,
  computers, and ACLs over ADWS from a compromised host and evade detections keyed to LDAP query
  volume. The rule fires when all of these hold: the connection is initiated, the destination
  port is 9389, and the connecting process is none of the allow-listed binaries. Investigate what
  process made the connection and how it was launched, whether that process performed bulk
  directory enumeration, whether other reconnaissance ran on the host, and whether the destination
  is an expected domain controller.
type: detection
detection_id: b3ad3c0f-c949-47a1-a30e-b0491ccae876
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Was this an initiated connection to port 9389 from a process outside the allow-listed AD management binaries?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires only
    when all conditions hold together: the connection is initiated (outbound), the destination port
    is 9389 (Active Directory Web Services), AND the connecting process is none of the allow-listed
    binaries (dsac.exe, PowerShell 7 or Windows PowerShell, the Microsoft Monitoring Agent). Review
    the exact destination IP, the port, the direction, and the initiating process on the triggering
    event. A connection to 9389 from an ordinary user application, a script host, or an unsigned
    binary is the pattern the rule is built to surface.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Initiated
- question: Is this user and host expected to query Active Directory over ADWS?
  context: >-
    Legitimate ADWS traffic comes from administrators and IT tooling running the AD PowerShell
    module or the AD Administrative Center. Standard user workstations and service hosts rarely have
    a reason to open TCP 9389 to a domain controller. Knowing whether the connecting account and the
    host function are consistent with sanctioned AD administration is often the fastest way to
    separate routine directory management from post-compromise enumeration. User attribution is
    present on most endpoint process events; when it resolves to a machine account or SYSTEM, pivot
    on the connecting process and its parent instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the process that connected to ADWS, and what did its command line do?
  context: >-
    The network event names the connecting process; pivot to its process record on this host to read
    the full command line and working directory. Decode any arguments that request bulk directory
    object retrieval, name a specific domain controller, build a local object cache, or specify
    output paths for dumped directory data. Native AD tooling and the PowerShell AD cmdlets have
    predictable, narrow argument patterns; a purpose-built collector typically carries flags for
    cache-building, BloodHound-style dumping, or object-count splitting. This scopes to executions of
    the same binary on this host in a tight window, so multi-step invocations that together form one
    collection run appear side by side.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is the destination a known domain controller running ADWS, and is this process expected to reach it?
  context: >-
    ADWS runs on every domain controller by default, so the destination should resolve to a
    legitimate DC in the environment. Confirm the destination IP maps to a known domain controller
    rather than an unexpected or newly stood-up host, and check whether the connecting process has any
    business reason to talk to that DC over 9389. The resolved hostname on the network event is
    sparsely populated because name resolution is a separate event; when it is blank, correlate the
    destination IP against the asset inventory and directory records to identify the DC, and note that
    an ADWS connection to a host that is not a recognized domain controller is itself anomalous.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - DestinationPort
- question: What process spawned the connecting process, and is this a normal pattern?
  context: >-
    Legitimate AD queries are typically driven by an interactive administrator - the AD module or
    Administrative Center launched from an interactive shell or explorer.exe. The connecting process
    spawned by an unusual parent - a script host such as wscript.exe, cscript.exe, or mshta.exe, an
    Office application, a PowerShell download cradle, wmiprvse.exe (WMI remote execution), or
    wsmprovhost.exe (WinRM remote execution) - points to automated or remotely driven enumeration
    rather than hands-on-keyboard administration. The parent lineage distinguishes a scripted
    collection run from a deliberate console action.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: In what session and integrity level did the connecting process run?
  context: >-
    The execution context separates an administrator working interactively from code running under a
    service, a remote-execution session, or an injected context. The session identifier ties the
    process to a logon; an interactive administrator session is consistent with sanctioned AD tooling,
    while a network or service logon, a non-interactive session, or an elevated integrity level under
    an unexpected account is consistent with enumeration driven from a foothold. Compare the integrity
    level and logon session against what a routine AD query from this account would produce.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - IntegrityLevel
      - LogonId
- question: Did other reconnaissance commands run on this host around the same time?
  context: >-
    A single directory query may be legitimate troubleshooting, but multiple reconnaissance commands
    in rapid succession is a signature pattern of post-compromise enumeration. For account and domain
    discovery, watch especially for net.exe, net1.exe, nltest.exe, dsquery.exe, adfind.exe, csvde.exe,
    ldifde.exe, and setspn.exe, and for PowerShell AD cmdlets (Get-ADUser, Get-ADComputer,
    Get-ADGroup) or PowerView functions appearing in command lines. Three or more distinct recon
    binaries within a short window typically indicates automated enumeration surrounding the ADWS
    connection.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: What child processes did the connecting process spawn afterward?
  context: >-
    The processes spawned by the connecting binary reveal what the operation did after reaching ADWS.
    Enumeration is often followed by staging or export - writing collected directory data, launching
    archiving utilities, or invoking additional tooling. Unexpected children such as cmd.exe,
    powershell.exe, or an archiver spawned by the connecting process point to collection and staging
    rather than an isolated query.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally communicate with this destination?
  context: >-
    A first-time connection from this host to this destination is more suspicious than routine
    communication. Most workstations never open ADWS to a domain controller; a host with no prior
    history of reaching this destination on any port, or specifically on 9389, points to new or
    unusual behavior. Zero or very low historical counts indicate the ADWS connection is not part of
    this host's normal traffic to that DC.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
- question: Does this host normally run the connecting binary?
  context: >-
    A process that has never been seen on this host is more suspicious than one that runs regularly.
    Zero or very low historical counts for the connecting binary indicate first-time or rare
    execution, which raises the weight of the ADWS connection. A history of routine execution by an
    IT or administrative account points instead to sanctioned tooling; the account distribution over
    the window helps make that call.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously connected to ADWS from a non-allow-listed process, what programs and users drove it, and does this alert fit that pattern?
  context: >-
    Even in environments where some non-standard ADWS traffic is expected, the connecting
    program and user account behind it tend to be consistent. This query mirrors the rule's
    exact firing pattern scoped to this host, so the resulting program and user distribution
    reflects how this specific pattern - not generic AD tooling - has historically run here. A
    new connecting executable, an unexpected user account, or a first-ever occurrence is the
    deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        Initiated: true
        DestinationPort: 9389
      filter_main_dsac:
        Image: C:\Windows\system32\dsac.exe
      filter_main_ms_monitoring_agent:
        Image: C:\Program Files\Microsoft Monitoring Agent\
      filter_main_powershell:
        Image|startswith:
        - C:\Program Files\PowerShell\7\pwsh.exe
        - C:\Program Files\PowerShell\7-preview\pwsh.ex
        - C:\Windows\System32\WindowsPowerShell\
        - C:\Windows\SysWOW64\WindowsPowerShell\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts connected to ADWS from a non-allow-listed process in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    This query mirrors the rule's firing pattern with no host scope, so the result is a fleet-wide
    count of the same pattern rather than generic ADWS usage. Many hosts firing the same pattern
    points to a scripted deployment or a vendor tool that legitimately uses ADWS from a
    non-allow-listed binary; a single host or a small unrelated set points to targeted, hands-on
    enumeration. Use the host distribution and the consistency of the connecting binary to calibrate
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        Initiated: true
        DestinationPort: 9389
      filter_main_dsac:
        Image: C:\Windows\system32\dsac.exe
      filter_main_ms_monitoring_agent:
        Image: C:\Program Files\Microsoft Monitoring Agent\
      filter_main_powershell:
        Image|startswith:
        - C:\Program Files\PowerShell\7\pwsh.exe
        - C:\Program Files\PowerShell\7-preview\pwsh.ex
        - C:\Windows\System32\WindowsPowerShell\
        - C:\Windows\SysWOW64\WindowsPowerShell\
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Enumeration rarely happens in isolation. Aggregating process activity in a tight window around the
    alert surfaces what led up to the ADWS connection and what ran immediately after. Novel
    parent-child pairs stand out at low counts against high-count routine telemetry, which is what
    points to the tool that drove the enumeration and any follow-on staging, lateral movement, or
    persistence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - defense tampering, credential access, or other
    reconnaissance - may reveal the stages that preceded this connection and help reconstruct the
    timeline. Account and domain enumeration is typically a mid-attack step taken from an established
    foothold, so prior alerts help place the ADWS connection within a larger sequence rather than
    treating it as a standalone event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: >-
    Did domain controllers log directory-service access or account-enumeration events for this account around
    the connection?
  context: >-
    ADWS is a SOAP front end to the same directory data that LDAP serves, so enumeration through it is
    recorded on the domain controller rather than on the connecting host. Event 4662 records directory-service
    object access; 4798 and 4799 record local group and security-group membership enumeration. Scoping on the
    account rather than the host is deliberate — the events land on the DC, not on the machine that opened the
    port 9389 connection. Results here separate a client tool reading a handful of objects from bulk
    enumeration of users, groups, or the domain structure. These events require directory-service auditing to
    be enabled; no results is a visibility gap rather than evidence that nothing was read.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      service: security
      product: windows
    detection:
      selection:
        EventID:
          - 4662
          - 4798
          - 4799
        SubjectUserName|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - ObjectDN
