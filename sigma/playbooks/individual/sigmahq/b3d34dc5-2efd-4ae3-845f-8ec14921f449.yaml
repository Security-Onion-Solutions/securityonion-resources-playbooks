name: Browser Started with Remote Debugging
id: ddd0c749-04a2-4f68-9f71-4265531eeca9
description: |
  Detects a browser process started with a remote-debugging command line — either a Chromium-based browser launched
  with a ' --remote-debugging-' flag, or firefox.exe launched with ' -start-debugger-server'. A remote-debugging
  endpoint exposes the running browser's DevTools/debug protocol over a local socket, which an attacker can drive to
  enumerate cookies, dump saved credentials and password-manager vaults, and act inside the victim's authenticated
  sessions without the user's password. Legitimate uses exist (developer debugging, automated UI testing such as
  Selenium drivers), so the investigation should determine whether the launch was operator-driven credential theft or
  expected automation, and whether anything subsequently connected to the debug endpoint.
type: detection
detection_id: b3d34dc5-2efd-4ae3-845f-8ec14921f449
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did this browser launch with a remote-debugging flag — either a Chromium ' --remote-debugging-' option or
    firefox.exe with ' -start-debugger-server'?
  context: Confirm the alert is a true positive before investing time. The rule fires when EITHER branch matches — a
    Chromium-based browser carrying a ' --remote-debugging-' command-line option, OR firefox.exe carrying
    ' -start-debugger-server'. Note which branch fired and read the full command line — the specific port, profile, and
    headless flags determine what an attached client could reach.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to launch browsers with remote-debugging enabled?
  context: Remote-debugging launches are normal for developers and for automated UI-testing frameworks but unusual on
    ordinary user workstations and on servers. Knowing whether the user's role and the host's function involve browser
    debugging or test automation is often the fastest way to separate expected activity from operator-driven
    credential theft.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What does the full debug command line reveal about the targeted browser session — which port, profile, and
    headless or session-restore flags were set?
  context: The credential store reached through this technique is the browser's own session — cookies, saved passwords,
    and password-manager vault pages decrypted in the live session, none of which requires the user's master password.
    Decode the command line for the debug port (default 9222), any --profile-directory / profile selection that points
    at a specific user's data, and headless or --restore-last-session flags that hide the activity from the user.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned this browser, and is that parent expected to launch browsers with debugging enabled?
  context: The parent reveals how the debug launch was driven. A browser started directly by explorer.exe under an
    interactive user looks different from one spawned by a script host, a shell, or an unfamiliar automation binary.
    Legitimate test-automation tooling (for example Selenium WebDriver hosts) is a known benign parent for
    debug-enabled browsers — confirm whether this parent is a sanctioned automation driver or an unexpected launcher.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: After the debug endpoint opened, what local or remote connections were made to the debug port on this host?
  context: A remote-debugging launch only exposes the browser; the credential theft happens when a client connects to
    the debug socket (commonly port 9222) and drives the DevTools/debug protocol. Connections to that port — from
    localhost via a separate tool, or remotely through a tunnel — confirm the endpoint was actually used rather than
    merely enabled. If network telemetry for loopback or short-lived connections is not collected in this environment,
    treat sparse results as a visibility gap rather than evidence nothing connected.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 9222
          - 9223
          - 9229
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - Initiated
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Whose browser session and credentials are exposed, and does that account have elevated or broad access?
  context: The severity depends on whose session was reachable. The technique operates as the logged-in user, so the
    exposed cookies, saved passwords, and vault entries belong to that account. Cross-reference the user against
    directory group memberships — an admin, a service-desk account, or a user with access to sensitive web
    applications raises the impact substantially over a standard user.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What browser-profile or credential-store files did this browser process touch around the alert?
  context: Driving a browser over its debug protocol reads from the on-disk profile — cookie databases, login-data
    stores, and extension data for password managers. File activity by this browser process around the alert shows
    which profile and which credential stores were in play, which determines whose saved data is exposed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: Were cookie, credential, or session dumps written to disk after the debug session, and where?
  context: Tools that drive the debug protocol commonly serialize harvested cookies and credentials to a local file
    (JSON cookie dumps, name:value:domain lists) before moving them off-host. File writes by the browser or a
    companion tool on this host after the debug launch reveal whether data was staged for exfiltration and where it
    landed.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: When this host has previously launched a browser with remote debugging, what parents and users normally
    drove it, and does the current alert fit that pattern?
  context: Even debug-enabled launches can be routine on a developer or test host. This query mirrors the rule's
    selection structure scoped to this host, so the resulting parent/user distribution reflects how this specific
    firing pattern — not generic browser usage — has historically run here. A new parent process, an unexpected user
    account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_chromium_based:
        CommandLine|contains: ' --remote-debugging-'
      selection_firefox:
        Image|endswith: \firefox.exe
        CommandLine|contains: ' -start-debugger-server'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_chromium_based:
        CommandLine|contains: ' --remote-debugging-'
      selection_firefox:
        Image|endswith: \firefox.exe
        CommandLine|contains: ' -start-debugger-server'
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_chromium_based:
        CommandLine|contains: ' --remote-debugging-'
      selection_firefox:
        Image|endswith: \firefox.exe
        CommandLine|contains: ' -start-debugger-server'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the credential theft is part of broader
    movement. If the same user triggered similar activity on multiple endpoints, the scope of compromise may extend
    beyond this host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_chromium_based:
        CommandLine|contains: ' --remote-debugging-'
      selection_firefox:
        Image|endswith: \firefox.exe
        CommandLine|contains: ' -start-debugger-server'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance,
    or other credential-access activity — may reveal the stages that preceded the debug-enabled launch and help
    reconstruct the timeline leading up to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts launched a browser with remote debugging in the past week, and does the cross-host
    distribution look like consistent automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of
    the rule's firing pattern rather than generic browser usage. Many hosts firing the same pattern points to scripted
    deployment or test automation; one host or a small unrelated set points to manual operator activity. Use the host
    distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_chromium_based:
        CommandLine|contains: ' --remote-debugging-'
      selection_firefox:
        Image|endswith: \firefox.exe
        CommandLine|contains: ' -start-debugger-server'
      condition: 1 of selection_*
    fields:
    - host.name
