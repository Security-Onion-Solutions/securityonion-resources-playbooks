name: Suspicious Binaries and Scripts in Public Folder
id: 71adbd05-7e8c-4f45-8382-52a754380d5a
description: |
  Detects the creation of a file with an executable or scripting extension (.bat, .dll, .exe, .hta,
  .js, .ps1, .vbe, .vbs) under C:\Users\Public\. The rule fires when a written path both contains
  :\Users\Public\ AND ends in one of those extensions. The Public profile is world-writable and shared
  across all local users, which makes it a common staging location for downloaded payloads, dropped
  helper scripts, and files positioned for lateral movement or later execution. Legitimate deployment of
  binaries to Public happens but is uncommon, so the investigation should establish which process wrote
  the file and what launched that process, what the file actually contains, whether it was executed or
  reached out to the network, and how far the same artifact or the same drop pattern has spread across
  the environment.
type: detection
detection_id: b447f7de-1e53-4cbf-bfb4-f1f6d0b04e4e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting file write land in the Public folder with a flagged executable or script extension, and which process created it?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires only when
    the written path both sits under :\Users\Public\ AND ends in one of .bat, .dll, .exe, .hta, .js, .ps1,
    .vbe, or .vbs. Review the exact TargetFilename, the operation performed (creation, rename, deletion),
    and the responsible process to confirm a script or binary was actually dropped into the shared Public
    profile rather than an unrelated file being touched.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to drop executables or scripts into the Public folder?
  context: >-
    Software deployment and packaging tools occasionally stage binaries in Public, so knowing whether the
    writing account and host role match a sanctioned process is often the fastest way to separate routine
    activity from a live drop. Most user and workstation accounts have no reason to write .exe, .dll, or
    script files to the shared Public profile. User attribution is present on roughly 94% of endpoint file
    events; when the account is a machine account or SYSTEM, judge by the writing process and host function
    instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What does this file contain, and does its content show obfuscation or known malicious indicators?
  context: >-
    File-creation events record that a file was written but not what is inside it, so retrieve the artifact
    from its on-disk path and analyze the content. For scripts (.bat, .ps1, .vbs, .vbe, .js, .hta), look
    for base64 or otherwise encoded strings, embedded URLs or IP addresses, download-and-execute cradles,
    and known malware string patterns. For binaries (.exe, .dll), review imports, embedded strings, packer
    signatures, and signing status to judge whether it is a legitimate relocated tool or a payload.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What was the full command line of the process that wrote this file into Public?
  context: >-
    The file event carries the writing process identifiers, so pivot by ProcessGuid to read its command
    line and working directory. The command reveals how the file arrived: a download utility fetching it
    from a remote host (for example certutil, bitsadmin, curl, or a PowerShell web request writing an
    -OutFile), an archive tool unpacking it, or an interpreter writing it inline. A benign relocation looks
    like a copy or an installer; a remote fetch straight into Public is the delivery step of a dropper.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: If this file has executed, what is its hash and does it carry known AV or threat-intel detections?
  context: >-
    A file's hash is recorded when it runs, not when it is written, so file-creation events carry no hash.
    This query looks for the dropped file executing by matching its filename as the running Image and reads
    the process hash; submit that hash to reputation and threat-intel sources to determine whether it is
    known malicious, benign, or previously unseen. If the file is present but has not executed, retrieve it
    from its Public path and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
- question: What launched the process that wrote this file into Public?
  context: >-
    Identifying the parent of the writing process establishes the delivery vector. A user-facing application
    parent that should rarely drop executables into Public - a browser (chrome.exe, msedge.exe, firefox.exe),
    an Office application (winword.exe, excel.exe, powerpnt.exe), a PDF reader (acrord32.exe), an archive
    tool (7zFM.exe, winrar.exe), or explorer.exe - points to a user opening a download, attachment, or
    extracted archive. Check the parent command line for the source document, archive, or URL, which enables
    searching for other recipients and blocking the origin.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Was this file executed after it was dropped into Public?
  context: >-
    A dropped file matters most once it runs. Correlate by the dropped filename to see whether it later
    appears as a running process, which reveals progression from delivery to execution. Executable and
    script drops in Public are frequently run by a living-off-the-land interpreter or launcher shortly after
    creation; for a .dll, also check whether it was loaded by another process rather than run directly. The
    interval between the write and any execution frames how far the activity has advanced.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
- question: Did the writing process or its child processes make outbound network connections after the drop?
  context: >-
    User-execution chains commonly end with immediate outbound traffic from the same process lineage - a
    fetch of a second-stage payload or a check-in to attacker infrastructure. This query returns connections
    initiated by the process that wrote the file and by its direct children. Focus on egress to external
    destinations and set aside connections to corporate update, CDN, and proxy endpoints. If the dropped
    file was executed under a different parent, pivot on that execution's own process identifiers once it is
    identified to see the payload's own connections.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - Initiated
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A process that drops one suspicious file often drops several - a dropper unpacking components, a tool
    staging output, or ransomware touching many paths. The breadth, paths, and extensions of the writing
    process's other file activity distinguish a single relocated binary from a staging burst in progress and
    enumerate what else needs review. The correlation covers the writer and its direct children, since
    droppers often delegate the writes.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to the Public folder recently, and by which processes?
  context: >-
    The Public profile is world-writable and shared across users, so it accumulates drops from any process
    that can reach it. Other recent arrivals in the same location reveal whether this is an isolated write
    or a directory under active staging, and which processes are responsible. A single unfamiliar writer
    across many files in Public is the signal; compare against the small set of installers or management
    tools that legitimately write there.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\Users\Public\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Is the file still in Public, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives both urgency and next steps. A payload still on disk can be
    retrieved, hashed, and analyzed; a file deleted seconds after creation suggests anti-forensic cleanup or
    a self-deleting dropper and shifts the investigation to what executed in between. Read the operation type
    on the following events to tell a durable artifact from a transient stage.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has this file been seen before on this host?
  context: >-
    A file that has never appeared on a host is more suspicious than one that is part of normal operations.
    First-time appearance of an executable or script in Public should be checked even when the filename
    looks benign, since droppers frequently reuse innocuous or system-like names. Zero or very low historical
    counts point to a new artifact; a recurring write points to a management process or a repeatedly run tool.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- always_include: true
  question: Has this user previously produced this Public-folder drop pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's own selection scoped to this user - the result is the user's 90-day history
    of dropping flagged executables and scripts into Public, aggregated by host, not their generic file
    activity. A user who has never produced this pattern is more suspicious than one who does so routinely;
    weigh the count against the user's role and typical toolset. A developer or administrator who regularly
    stages tools may explain it, while a standard user account producing it for the first time does not.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains: ':\Users\Public\'
        TargetFilename|endswith:
        - .bat
        - .dll
        - .exe
        - .hta
        - .js
        - .ps1
        - .vbe
        - .vbs
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this Public-folder drop pattern, or is the program new for this activity?
  context: >-
    When the alert fires under a machine account or SYSTEM, user identity does not attribute behavior and the
    launch mechanism is the meaningful pivot. The query mirrors the rule's selection scoped to the alerting
    program, so the result is the 90-day history of this program driving this specific drop pattern,
    aggregated by host. A new or rare program for this pattern is the deviation worth chasing; a program that
    already accounts for thousands of prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains: ':\Users\Public\'
        TargetFilename|endswith:
        - .bat
        - .dll
        - .exe
        - .hta
        - .js
        - .ps1
        - .vbe
        - .vbs
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or coordinated activity on
    multiple endpoints. If the same account staged files or ran tools on several hosts in the same window,
    the scope of the activity is larger than a single drop. When the alert fires under a machine account or
    SYSTEM, this pivot returns agent-telemetry noise across the fleet; in that case the parent-driven
    fleet-wide view is the meaningful answer.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven drop pattern fire on other hosts in the same window?
  context: >-
    Under a machine account or SYSTEM, asking what else the user did returns noise, so the meaningful question
    is whether the same launch mechanism produced this drop pattern elsewhere. The query mirrors the rule's
    selection scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts in the
    same window point to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains: ':\Users\Public\'
        TargetFilename|endswith:
        - .bat
        - .dll
        - .exe
        - .hta
        - .js
        - .ps1
        - .vbe
        - .vbs
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host - reconnaissance, defense
    tampering, credential access, or execution of scripting tools - may reveal the stages that preceded this
    drop and help reconstruct the timeline. A payload staged in Public is often one step in a longer sequence,
    so prior alerts help place this write within it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Did this same detection fire on other hosts or for other users recently?
  context: >-
    Delivery of a staged payload rarely targets a single system. Correlating the same detection across the
    environment shows how many hosts and users produced the same Public-folder drop, which separates a
    one-off from a coordinated push and identifies additional systems that need investigation. Compare the
    affected hosts and accounts to judge whether the activity is spreading.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
