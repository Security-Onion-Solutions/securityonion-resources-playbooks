name: Load Of RstrtMgr.DLL By A Suspicious Process
id: d61542dd-0a6b-4603-a440-a9a881536def
description: |
  Detects a process running from a user-writable location loading the Windows Restart Manager
  library (RstrtMgr.dll). Restart Manager is a legitimate component that installers and updaters
  use to close applications holding locks on files that need to be replaced. The same API sequence
  is abused by ransomware and wiper malware to enumerate and forcibly terminate the processes and
  services locking target files - including security and backup agents - immediately before mass
  file encryption or destruction. The rule fires when the module load (ImageLoaded ending in
  \RstrtMgr.dll, or an OriginalFileName of RstrtMgr.dll) occurs from a process whose Image lives
  in a suspicious directory: EITHER a system-wide user-writable path such as PerfLogs, the Public
  profile, or a Temporary Internet folder, OR a per-user Favorites, Favourites, or Contacts folder.
  A signed installer loading this library from Program Files is routine; an unsigned or unknown
  binary loading it from one of these staging directories is not. Investigate what the loading
  executable is, what else it loaded and spawned, whether recovery was inhibited or files encrypted,
  and whether the same pattern is firing on other hosts.
type: detection
detection_id: b48492dc-c5ef-4572-8dff-32bc241c15c8
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting event show RstrtMgr.dll being loaded by a process running from a user-writable directory?
  context: >-
    Confirm the alert is a true positive before investing time. The rule requires two conditions
    together: the loaded module is the Restart Manager library (ImageLoaded ending in \RstrtMgr.dll,
    or OriginalFileName RstrtMgr.dll), AND the loading process (Image) runs from a suspicious
    location - EITHER a system-wide user-writable path such as PerfLogs, the Public profile, or a
    Temporary Internet folder, OR a per-user Favorites, Favourites, or Contacts folder. Note which
    of the two folder branches matched, because it tells you where the loading binary was staged and
    directs the origin and signature questions that follow. A signed setup program loading this DLL
    from Program Files would not fire; a binary running from one of these staging paths is the point.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - ImageLoaded
- question: Is this user and host expected to run a program from this location that uses Restart Manager?
  context: >-
    Restart Manager is normally invoked by installers, updaters, and servicing tools running from
    trusted program directories. A process launched from a user-writable staging path using this
    library is out of pattern for most endpoints. Knowing whether the account and host function match
    any sanctioned software deployment or maintenance activity is often the fastest way to separate a
    legitimate install from staged malware. When the account is a machine account or SYSTEM, pivot on
    the loading process and its parent rather than the user.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What other modules did this process load, and are any from user-writable paths, unsigned, or non-Microsoft?
  context: >-
    The full set of modules a process loads describes its capability when the process itself is opaque.
    Restart Manager alone is a legitimate DLL, so the signal is what accompanies it: DLLs loaded from
    the same staging directory or from AppData, Temp, ProgramData, or Public; system DLL names loaded
    from non-system paths (search-order hijacking); and unsigned modules where signed ones are expected.
    A binary that pairs the Restart Manager load with side-loaded or unsigned modules is behaving like a
    packaged tool rather than a serviced application.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: What is the loading executable itself - its full path, hash, and command line - and does it match a known malware sample?
  context: >-
    The Restart Manager DLL is a genuine Microsoft library, so reputation work belongs on the process
    that loaded it, not the DLL. Pivoting to the process record surfaces the loading binary's hash for a
    threat-intelligence lookup, its full command line, and its working directory. A hash flagged as a
    known ransomware or wiper loader, or an executable with a random or masquerading name running from a
    staging directory, confirms the load is malicious rather than a servicing operation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - Hashes
      - CommandLine
      - CurrentDirectory
- question: What process spawned the loading executable, and is that parent chain expected?
  context: >-
    The parent process reveals how the binary was launched. Legitimate servicing tools have predictable
    parents such as explorer.exe for user actions or services.exe and msiexec.exe for installs. A binary
    in a staging directory launched by a script host such as wscript.exe or mshta.exe, an Office
    application, a browser, or an unsigned dropper points to the load being staged programmatically as
    part of an intrusion rather than a routine install.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What child processes did the loading executable spawn afterward?
  context: >-
    The processes a tool spawns reveal its actual impact. After loading Restart Manager, a malicious
    process commonly reaches for recovery-inhibiting and service-control utilities (vssadmin.exe,
    wmic.exe, bcdedit.exe, sc.exe, net.exe, taskkill.exe) or launches an interpreter to run a script.
    Children spawned by this process on this host tie the module load to whatever destructive or
    tampering actions came next.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has RstrtMgr.dll been loaded on this host before, and by which processes?
  context: >-
    A first-time load of this library on a host is a stronger anomaly than a recurring one. If Restart
    Manager has historically been loaded only by installers and update services from trusted paths, and
    the current loader is a new binary from a staging directory, the load stands out. If the same DLL is
    loaded routinely across many processes here, the environment uses it as part of normal servicing and
    the alert weight is lower.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: When this host has previously fired this rule's pattern, what programs and users drove it, and does the current alert fit?
  context: >-
    Even a legitimate servicing tool can occasionally match a broad path pattern. This query
    mirrors the rule's own selection - a Restart Manager load from one of the flagged staging
    directories - scoped to this host, so the resulting program and user distribution reflects
    how this specific firing pattern has run here historically, not generic library usage. A new
    acting program process, an unexpected account, or a first-ever occurrence is the deviation
    worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection_img:
      - ImageLoaded|endswith: \RstrtMgr.dll
      - OriginalFileName: RstrtMgr.dll
      selection_folders_1:
        Image|contains:
        - :\Perflogs\
        - :\Users\Public\
        - \Temporary Internet
      selection_folders_2:
      - Image|contains|all:
        - :\Users\
        - \Favorites\
      - Image|contains|all:
        - :\Users\
        - \Favourites\
      - Image|contains|all:
        - :\Users\
        - \Contacts\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_img and 1 of selection_folders_*) and _pb_scope
    fields:
    - Image
    - User
- question: What recovery-inhibiting commands ran on this host after the module load?
  context: >-
    Operators who load Restart Manager to unlock files before encryption typically chain recovery
    destruction: deleting shadow copies (vssadmin, wmic), disabling boot recovery (bcdedit), deleting
    backups (wbadmin), and disabling the recovery environment (reagentc). This query surfaces those
    commands on the host in the window after the alert, revealing the full scope of recovery destruction.
    Verify whether each action succeeded by checking system state directly - list shadow copies, review
    boot configuration, and confirm backup catalog and recovery-environment status.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\reagentc.exe'
          - '\diskshadow.exe'
      selection_cmdline:
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'recoveryenabled'
          - 'bootstatuspolicy'
          - 'delete catalog'
          - 'delete systemstatebackup'
          - 'boot.ini'
          - 'winre.wim'
          - '/disable'
      condition: selection and (selection_recovery or selection_cmdline)
    fields:
      - Image
      - CommandLine
- question: Are there signs of file encryption, ransom notes, or unknown binary execution on this host?
  context: >-
    Terminating processes that lock files is a pre-encryption step, so file encryption or destruction
    often follows within minutes. Look for unknown or suspicious executables running from temp or
    user-writable paths after the load, processes with high file I/O consistent with an encryption or
    overwrite loop, and interpreters launching unknown binaries. Non-standard or randomly generated
    file extensions and newly created ransom-note files are the confirming artifacts; check file-creation
    activity for mass renames and note-file drops. The query filters out common system paths to surface
    the suspicious executables.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_known:
        Image|startswith:
          - 'C:\Program Files'
          - 'C:\Windows\System32\svchost'
          - 'C:\Windows\System32\wbem'
      condition: selection and not filter_known
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: What other destructive, service-stopping, or defense-tampering actions occurred on this host?
  context: >-
    Because Restart Manager terminates the processes and services locking target files through its API
    rather than through a command line, the effect on security and backup tooling shows up as stopped
    services and killed processes, not as a tampering command on the alerting event. Operators also chain
    explicit destruction - stopping security services (sc, net, taskkill), changing file permissions
    (icacls, takeown), and clearing logs. Finding the complete set of these commands around the load
    reveals whether this is an isolated action or part of a scripted impact sequence; a shared parent
    across the commands points to automated execution.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_destructive:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\cipher.exe'
          - '\fsutil.exe'
          - '\icacls.exe'
          - '\takeown.exe'
          - '\attrib.exe'
          - '\sc.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\powershell.exe'
          - '\taskkill.exe'
      condition: selection and selection_destructive
    fields:
      - Image
      - User
- question: Were security-tool or recovery-related registry keys modified on this host around the alert?
  context: >-
    Disabling defenses through the registry is a parallel path to killing processes: turning off
    real-time protection, tampering with a security service's Start value or Image File Execution
    Options, or editing exclusion and policy keys. Restart Manager also records its session under a
    RestartManager key, but the investigative value here is nearby edits to Defender, service, and
    policy keys that would blind or weaken the host during the impact phase. Registry deletions are not
    observable in this telemetry, so judge tampering from the modifications recorded here.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_targets:
        TargetObject|contains:
          - '\Windows Defender\'
          - '\Windows Advanced Threat Protection\'
          - '\Policies\Microsoft\Windows Defender'
          - '\Image File Execution Options\'
          - '\SecurityHealth'
          - '\CurrentControlSet\Services\'
      condition: selection and selection_targets
    fields:
      - TargetObject
      - Details
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity in a tight window around the load
    surfaces what led up to it and what ran immediately after. Novel parent-child pairs stand out at low
    counts against high-count routine telemetry, which is what points to the tool that staged the binary
    and any reconnaissance, escalation, or impact actions that bracket the load.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, credential access, or defense tampering - may
    reveal the stages that preceded this load and help reconstruct the timeline. A pre-encryption tool
    load is usually late in an intrusion, so prior alerts often mark how the host was reached and what
    was staged before impact.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Is this same detection firing on other hosts in the environment?
  context: >-
    Impact activity often executes across many hosts at once or in rapid succession. Searching for the
    same rule firing on other hosts determines whether this is a single machine or a coordinated push,
    which sets the scope for containment and incident response. Many hosts firing in a short window
    points to network-wide execution and should raise the response tier; the first-to-last timing shows
    the spread pattern.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    This query mirrors the rule's own selection with no host scope, so the result is a fleet-wide count
    of the specific firing pattern - a Restart Manager load from one of the flagged staging directories -
    rather than generic library usage. Many hosts loading the DLL from the same staging path suggests a
    scripted deployment or a spreading operation; one host or a small unrelated set points to a targeted
    or manual action. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection_img:
      - ImageLoaded|endswith: \RstrtMgr.dll
      - OriginalFileName: RstrtMgr.dll
      selection_folders_1:
        Image|contains:
        - :\Perflogs\
        - :\Users\Public\
        - \Temporary Internet
      selection_folders_2:
      - Image|contains|all:
        - :\Users\
        - \Favorites\
      - Image|contains|all:
        - :\Users\
        - \Favourites\
      - Image|contains|all:
        - :\Users\
        - \Contacts\
      condition: selection_img and 1 of selection_folders_*
    fields:
    - host.name
- question: Were process-based persistence mechanisms installed on this host in the same window?
  context: >-
    A process that reaches the impact stage often also establishes or relies on a foothold. Scheduled
    tasks, services, registry Run keys, BITS jobs, or WMI subscriptions created by schtasks.exe, sc.exe,
    reg.exe, bitsadmin.exe, or wmic.exe near the load indicate persistence was stacked alongside the
    destructive activity rather than the load being an isolated event.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
