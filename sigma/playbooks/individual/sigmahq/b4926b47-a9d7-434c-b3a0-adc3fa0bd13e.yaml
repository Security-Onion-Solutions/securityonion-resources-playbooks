name: Suspicious Double Extension Files
id: 8559dd87-68de-4279-8011-91e1ea35b76e
description: |
  Detects creation of a file whose name uses a deceptive double extension: a benign-looking first
  extension (a document, image, or media type such as .pdf, .doc, .jpg, or .mp4) followed by an
  executable or container extension (.exe, .iso, .rar, .svg, .zip), or a name ending directly in
  .rar.exe or .zip.exe. Because Windows hides known file extensions by default, a file named
  invoice.pdf.exe presents to the user as invoice.pdf while remaining an executable. The rule fires
  when EITHER a name embeds one of the document/media extensions AND ends in an executable or
  container extension, OR the name ends in .rar.exe or .zip.exe, excluding Linux icon paths under
  /usr/share/icons/. This naming is a common lure in phishing and dropper delivery; investigate what
  the file actually is, which process wrote it and what launched that process, whether it went on to
  execute, and whether the same file reached other hosts.
type: detection
detection_id: b4926b47-a9d7-434c-b3a0-adc3fa0bd13e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the created file's name use a deceptive double extension matching this rule?
  context: >-
    Before investing investigation time, confirm the alert is a true positive by reviewing the exact
    TargetFilename, the operation performed, and the responsible process on the triggering event. The
    rule fires when EITHER the name embeds a document or media extension (such as .pdf., .doc., .jpg.,
    or .mp4.) AND ends in an executable or container extension (.exe, .iso, .rar, .svg, .zip), OR the
    name ends directly in .rar.exe or .zip.exe, and the path is not a Linux icon under
    /usr/share/icons/. Note which branch fired: an embedded-extension name like report.pdf.exe is the
    classic hidden-extension lure, while a .rar.exe or .zip.exe name spoofs an archive. The unpinned
    file query returns every operation on this path so the creation event and its EventType are visible.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to create a file with this name and extension?
  context: >-
    Legitimate software and users rarely produce a name that embeds a document extension inside an
    executable one; packaging tools, installers, and developers almost never write invoice.pdf.exe or
    archive.zip.exe. Knowing whether the writing account and host function match any sanctioned activity
    is often the fastest way to separate a benign edge case from a phishing drop. User attribution is
    present on roughly 94% of endpoint file events; when it is a machine account or missing, judge by the
    writing process and host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What is this file actually, and does its real format match the final executable extension?
  context: >-
    Read and analyze the file's actual content rather than trusting its name. A file that presents as a
    document but is structured as a PE executable, script, or archive confirms the masquerade. For
    binaries, check imports, embedded strings, packer signatures, and signing status; for scripts and
    text, check for base64 or otherwise encoded strings, embedded URLs, and known malware string
    patterns. Content-level analysis requires manual retrieval of the file from the endpoint; the query
    locates the file event so the on-disk path is known.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What process created this file, and what launched that process?
  context: >-
    The file event carries no command line, so pivot by ProcessGuid to the writing process to read its
    Image, full command line, and parent. A browser, mail client, archive extractor, or script host such
    as wscript.exe, mshta.exe, or powershell.exe writing a double-extension file points to phishing
    delivery or a dropper unpacking a payload; a deliberate packaging or developer action has a benign
    lineage. The parent chain distinguishes a scripted drop from an interactive user action.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: If this file has executed, what is its hash and does it have known threat-intel detections?
  context: >-
    A file's hash and its embedded PE OriginalFileName are recorded when it runs, not when it is written,
    because file-creation events carry no hash. Match the file executing by its name, then compare the
    OriginalFileName against the deceptive on-disk name to expose the true identity, and submit the hash
    to threat intelligence to determine whether it is known malicious, benign, or previously unseen. If
    the file is present but has not executed, retrieve it from its on-disk path and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - OriginalFileName
      - CommandLine
      - Hashes
- question: Was this file executed after it was created?
  context: >-
    A dropped double-extension file that progresses from delivery to execution escalates the incident.
    Correlating the creation event to a later process_creation for the same file name reveals whether the
    file was run and with what command line; the file may also surface in image_load if it was loaded as
    a DLL. The interval between creation and execution is the correlation window that ties delivery to
    activation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
- question: Is the file still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives both urgency and next steps. A payload still on disk can be
    retrieved, hashed, and analyzed; a file deleted seconds after creation suggests anti-forensic cleanup
    or a self-deleting dropper and shifts the investigation to what executed in between. Interpret the
    result by EventType: a deletion shortly after creation is the cleanup signature.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A process that drops one double-extension file often drops several: a dropper unpacking components, a
    tool staging output, or a phishing payload writing a decoy document alongside the executable. The
    breadth, paths, and extensions of the writing process's other file activity distinguish a single
    artifact from a staged payload and enumerate what else needs review. Look at where the writes land,
    not only how many there are.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has this file been seen before on this host?
  context: >-
    A file that has never appeared on a host is more suspicious than one that is part of normal
    operations, even when the name seems benign. Zero or very low historical counts for this file name
    indicate a first-time appearance; a recurring history points to an established process or a repeatedly
    delivered lure.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Is this file present on any other hosts in the environment?
  context: >-
    The same double-extension file on multiple hosts may indicate a mass phishing wave, deliberate
    distribution, or lateral movement; a file confined to one host suggests a targeted delivery.
    Comparing where the same file name appears and which process wrote it separates a single delivery from
    repeated use of the same lure across the environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- always_include: true
  question: Has this user produced this double-extension drop pattern before, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the user's
    90-day history of this specific double-extension drop pattern rather than generic file activity,
    aggregated by host. A user who has never produced this pattern is more suspicious than one who does so
    regularly; weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_gen:
        TargetFilename|endswith:
        - .exe
        - .iso
        - .rar
        - .svg
        - .zip
        TargetFilename|contains:
        - .doc.
        - .docx.
        - .gif.
        - .jpeg.
        - .jpg.
        - .mp3.
        - .mp4.
        - .pdf.
        - .png.
        - .ppt.
        - .pptx.
        - .rtf.
        - .svg.
        - .txt.
        - .xls.
        - .xlsx.
      selection_exe:
        TargetFilename|endswith:
        - .rar.exe
        - .zip.exe
      filter_icons_linux:
        TargetFilename|startswith: /usr/share/icons/
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this double-extension drop pattern, or is the program new for this activity?
  context: >-
    When the alert fires under a service or machine account, user identity does not attribute the
    behavior; the meaningful pivot is the launch mechanism. The query mirrors the rule's selection
    structure scoped to the alerting program, so the result is the 90-day history of this program
    driving this specific pattern rather than generic program-and-file co-occurrence. A new or rare program
    for this pattern is the deviation worth chasing; a program that already accounts for many prior events
    is routine automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_gen:
        TargetFilename|endswith:
        - .exe
        - .iso
        - .rar
        - .svg
        - .zip
        TargetFilename|contains:
        - .doc.
        - .docx.
        - .gif.
        - .jpeg.
        - .jpg.
        - .mp3.
        - .mp4.
        - .pdf.
        - .png.
        - .ppt.
        - .pptx.
        - .rtf.
        - .svg.
        - .txt.
        - .xls.
        - .xlsx.
      selection_exe:
        TargetFilename|endswith:
        - .rar.exe
        - .zip.exe
      filter_icons_linux:
        TargetFilename|startswith: /usr/share/icons/
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (1 of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts in the alert window reveals whether the same account
    triggered related activity on multiple endpoints, which would widen the scope of the incident. This
    is distinct from the user's historical baseline: it asks what the account did right now across the
    network rather than how often it produces this pattern.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven drop pattern fire on other hosts in the same window?
  context: >-
    Under a service or machine account, asking what the account did network-wide returns agent-telemetry
    noise, so the meaningful question is whether the same launch mechanism fired elsewhere. The query
    mirrors the rule's selection structure scoped to the alerting program, fleet-wide, in the
    alert window. Multiple hosts in the same window points to scheduled or pushed automation, or a
    coordinated delivery; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_gen:
        TargetFilename|endswith:
        - .exe
        - .iso
        - .rar
        - .svg
        - .zip
        TargetFilename|contains:
        - .doc.
        - .docx.
        - .gif.
        - .jpeg.
        - .jpg.
        - .mp3.
        - .mp4.
        - .pdf.
        - .png.
        - .ppt.
        - .pptx.
        - .rtf.
        - .svg.
        - .txt.
        - .xls.
        - .xlsx.
      selection_exe:
        TargetFilename|endswith:
        - .rar.exe
        - .zip.exe
      filter_icons_linux:
        TargetFilename|startswith: /usr/share/icons/
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (1 of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity in a tight window around the file drop
    surfaces what led up to it and what ran immediately after. Novel parent-child pairs stand out at low
    counts against high-count routine telemetry, which is what points to the tool that delivered or
    unpacked the file and any follow-on execution.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, script execution, or defense tampering - may
    reveal the stages that preceded this file drop and help reconstruct the timeline. A masqueraded file
    is often one step in a phishing or dropper sequence, so prior alerts help place this creation event
    within a larger operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
