name: Diamond Sleet APT Process Activity Indicators
id: e345f2b9-46ce-4b56-a164-0119eb8c1261
description: |
  Detects a process whose command line contains one hardcoded 16-character string. The string is a
  symmetric key that a backdoor accepts as its only argument and uses to decrypt a paired
  configuration file sitting next to it on disk, which holds the command-and-control addresses the
  implant then calls out to. The rule places no constraint on the executable, its path, or its
  parent, so anything carrying the string fires it — the original implant under any filename, a
  scheduled task relaunching it at boot, or a scanner, hunting script, or detection test that merely
  echoes the published indicator. Investigation should establish which binary received the argument
  and where it came from, whether a configuration or payload file was read alongside it, and whether
  network callback or follow-on execution occurred.
type: detection
detection_id: b5495d8d-24ad-4a44-8caf-ceae9a07a5c2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the alerting command line contain the literal key string, and was it passed as an argument to an executable?
  context: >-
    The rule matches one hardcoded 16-character string anywhere in a command line, with no constraint
    on the binary, its path, or its parent. Confirm the string appears as a parameter handed to a
    process rather than as search text inside a scanning, grep-style, or documentation command that
    only references the indicator.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run a binary that takes an opaque key string as its argument?
  context: >-
    A key passed on the command line is an unusual parameter form for routine administration, but it
    does appear in licensing utilities, backup and archive tooling, and in-house automation. Knowing
    whether this host runs such software, and whether this account normally launches it, is often the
    fastest path to separating a true positive from routine operations.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this execution part of an authorized penetration test, detection-validation run, or indicator hunt?
  context: >-
    The matched string is a published indicator, so it circulates in threat-intel feeds, atomic
    detection tests, and hunting scripts. A validation harness that launches a dummy binary with the
    string, or a hunting tool that carries the string in its own command line, both fire this rule.
    Check for an active engagement, a scheduled detection test, or an analyst-driven sweep on this
    host or network segment before investing further analysis time.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: Which binary received the key argument, and where on disk does it live?
  context: >-
    The rule constrains nothing but the argument, so the executable name and its directory are the
    first discriminators. A small binary running from a staging directory such as C:\ProgramData or
    C:\Windows\Temp, under an arbitrary or system-sounding name, with the key as its sole parameter,
    matches the implant pattern the string belongs to. A security product, script interpreter, or
    text-search utility carrying the string as data is the more common benign explanation. Record the
    full path and argument order for the file and network questions that follow.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: What files did the alerting binary read or write on this host after it started?
  context: >-
    A binary invoked with a decryption key reads the material it is meant to decrypt, typically a
    paired file in its own directory with a random or GUID-like name and no extension, and may write
    decrypted output or staging files nearby. That file access is what the key argument is for, and
    its presence separates real key use from a process that merely carries the string as text. If the
    binary has already exited, the file artifacts left in the directory are the durable evidence.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: What was the full command line and working directory of every invocation carrying this key string on the host?
  context: >-
    The rule fires on the string alone, so the surrounding command line is where the meaning is. Read
    the argument order and any additional flags, note the working directory, and check whether the
    same key was handed to more than one executable or to the same executable repeatedly. Repeated
    invocations from a fixed directory point to a resident component being relaunched; a single
    invocation from a user profile or download directory points to a one-off run.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: ' uTYNkfKxHiZrx3KJ'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned the alerting binary, and is that parent chain expected?
  context: >-
    The parent reveals how the invocation was staged. A task-scheduler or service-host parent means
    the binary is being relaunched by a persistence mechanism rather than run by hand, which changes
    the response from a single-process question to a persistence-removal one. A script interpreter or
    remote-management parent means the invocation was pushed from somewhere else. explorer.exe means
    a user launched it directly.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What child processes did the alerting binary spawn afterward?
  context: >-
    Once a configuration is decrypted, the operational behavior follows: a decrypted config commonly
    drives network callback, and the launching component may spawn a separate process to carry the
    traffic or to run discovery commands. Children such as command interpreters, script hosts, or
    unfamiliar binaries from the same directory indicate the run progressed past configuration
    loading. No children at all is consistent with either a self-contained component or a run that
    failed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity in the alert window collapses
    routine agent telemetry into high-count rows and leaves novel parent-child pairs standing out at
    low counts. Look for the staging that precedes a keyed component starting — a download, an
    archive extraction, a task registration — and for the discovery or credential-access commands
    that commonly follow one.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- always_include: true
  question: What else did this user run across the environment around this time?
  context: >-
    Tracking the account across all hosts in the alert window shows whether the activity is confined
    to this endpoint or the same account is active elsewhere. If the alert fired under SYSTEM, a
    machine account, or another service principal, this returns routine agent telemetry and the
    launch-mechanism questions carry the answer instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did the same parent-driven pattern fire on other hosts in the same window?
  context: >-
    Under a service principal, user identity does not attribute behavior; the launch mechanism does.
    This query mirrors the rule's selection scoped to the alerting parent process, fleet-wide, in the
    alert window. Several hosts in the same window points to a scheduled or pushed rollout; a single
    host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: ' uTYNkfKxHiZrx3KJ'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
      - host.name
  answer_sources:
  - process_creation
- question: Has this host run this binary before, outside the alerting execution?
  context: >-
    This counts executions of the alerting executable on this host over 90 days regardless of
    arguments, so it answers whether the file is resident software or first-seen. It measures the
    binary's own history, not the rule's string pattern. A first execution of a binary from a staging
    directory carries more weight than the argument alone; a binary that has run for months under the
    same account is more likely installed software that happens to carry the indicator string.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: When this host has previously produced this key string in a command line, what parents and users drove it?
  context: >-
    The query mirrors the rule's selection scoped to this host, so the resulting parent and user
    distribution reflects the rule's specific firing pattern rather than generic binary usage. A
    recurring parent and account means the string is part of something installed here — a scanner
    signature file, a test harness — and the current alert is another instance of it. No prior history
    means this is the first time the pattern has appeared on the host.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: ' uTYNkfKxHiZrx3KJ'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
      - ParentImage
      - User
  answer_sources:
  - process_creation
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this account, giving a 90-day history of the
    pattern for this user aggregated by host. An account that has never produced it before is worth
    more attention than one that produces it routinely — routine production usually means the user
    operates the tooling that carries the indicator. Weigh the count against the account's role and
    normal toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: ' uTYNkfKxHiZrx3KJ'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
      - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this parent process historically driven the rule's pattern, or is the parent new for this activity?
  context: >-
    When the alert fires under a service principal, the meaningful pivot is the launch mechanism
    rather than the account. This query mirrors the rule's selection scoped to the alerting parent
    process across 90 days, aggregated by host. A parent that already accounts for a long history of
    this pattern is automation; a parent that is new for it is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: ' uTYNkfKxHiZrx3KJ'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
      - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    A component started with a decryption key is rarely the first stage. Earlier detections on the
    same host — remote code execution against an internet-facing service, script-driven downloads
    into a staging directory, task registration, credential access — reconstruct how the binary
    arrived and reveal whether the operation had already progressed before this alert.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Have other hosts produced this key string in the past week, and does the cross-host distribution look like automation or isolated activity?
  context: >-
    The query mirrors the rule's selection with no host scope, giving a fleet-wide count of the
    pattern. Many hosts producing the same string points to something deployed everywhere — a
    scanner, an indicator-check script, a test harness — and reframes the alert as tooling rather
    than intrusion. One host or a small unrelated set points to operator activity and sets the
    containment boundary.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: ' uTYNkfKxHiZrx3KJ'
      condition: selection
    fields:
      - host.name
  answer_sources:
  - process_creation
