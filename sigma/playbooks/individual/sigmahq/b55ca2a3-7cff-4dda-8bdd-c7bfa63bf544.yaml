name: DNS Query Tor .Onion Address - Sysmon
id: 9d155649-7fd0-4e3b-9ab7-b745eac374f5
description: |
  Detects a DNS lookup from a Windows host for a Tor hidden-service address — a name ending in
  .onion, one of the tor2web HTTP gateways (for example .onion.to, .tor2web.org), or a known
  Tor gateway host. Resolving such a name means a process on the host is attempting to reach the
  Tor network, either through a local Tor client or through a tor2web gateway that fronts onion
  sites for an ordinary browser with no Tor client installed. Anonymity routing is used to
  obscure command-and-control destinations and to move data past egress controls, but it also
  appears with privacy-tool testing and researcher activity, so the investigation identifies the
  querying process and its lineage, whether the lookup resolved and led to an outbound
  connection, the ports and cadence of any resulting traffic, and how widely the same name is
  seen across the environment.
type: detection
detection_id: b55ca2a3-7cff-4dda-8bdd-c7bfa63bf544
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the queried domain match a Tor hidden-service or tor2web suffix this rule flags, and which process issued the lookup?
  context: >-
    Confirm the alert from the exact queried name (QueryName) and the process that issued it. The
    rule fires when a lookup ends in .onion, a tor2web gateway suffix such as .onion.to or
    .tor2web.org, or a named Tor gateway host. A raw .onion name resolved through a local Tor
    client and a tor2web variant reached from an ordinary browser are different access paths, so
    note which suffix matched and whether the querying program is a Tor client, a browser, or an
    unexpected binary. Confirm whether the lookup resolved to an address.
  range: +/-5m
  answer_sources:
  - alert
  - dns_query
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
- question: Is this user and host expected to reach Tor hidden services or use anonymity routing?
  context: >-
    Most enterprise hosts have no reason to resolve a Tor address. A developer, a security
    researcher, or a privacy-tooling tester may do so deliberately, and that role is the fastest
    way to separate sanctioned use from an implant reaching anonymity infrastructure for
    command-and-control. Whether the lookup ran under an interactive user or a service or SYSTEM
    context also matters, since unattended tasking retrieval tends to run without a logged-on
    user.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What Tor address was queried, did it resolve, and does the specific name carry threat intelligence?
  context: >-
    The alert is a DNS lookup, not yet a connection, so start with the name itself. A raw .onion
    address is an opaque hidden-service identifier that carries no public reputation and never
    resolves through ordinary DNS, whereas a tor2web gateway name does resolve, to the gateway
    operator's infrastructure rather than to the onion site. Check whether the lookup returned an
    address (dns.resolved_ip) and look up any resolved address and the gateway name in threat
    intelligence and passive DNS, then determine from the querying process whether the host then
    established a connection.
  range: +/-5m
  answer_sources:
  - external_threat_intel
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: What program issued the Tor lookup, and what do its command line and working directory show?
  context: >-
    The querying process is the center of this investigation. A dedicated Tor client (tor.exe) or
    a Tor Browser build of Firefox running from its bundle path fits deliberate anonymity use; a
    script interpreter, a document application, or a binary running from a user-writable directory
    resolving an onion name points at implant tooling using Tor to hide its C2. The command line
    reveals arguments such as configured hidden-service or SOCKS options and any embedded onion
    address. If the alert carried only the DNS event, identify the program here and pull its
    executions on this host.
  range: +/-5m
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned the querying program, and is that parent chain expected?
  context: >-
    The parent lineage shows how the querying program came to run. A Tor client or browser started
    by explorer.exe or a service manager fits an installed application; the same lookup coming from
    a process launched by an Office application, a script host such as wscript.exe or mshta.exe, or
    a scheduled task is the delivery-and-execution lineage that precedes covert C2. The DNS event
    carries no parent identifier, so this pivots on the querying process's own ProcessGuid to
    retrieve its process_creation record with the parent image and command line.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - ParentImage
      - ParentCommandLine
- question: Is Tor or any anonymity or proxy-routing software approved for use on this host?
  context: >-
    Organizations that permit anonymity routing at all typically restrict it to a named set of
    hosts and roles. A Tor client, a Tor Browser bundle, or any proxy-routing utility on a host
    outside that set is shadow IT or attacker-deployed tooling regardless of the software's
    reputation, and should be treated as unauthorized until a specific sanctioned use is confirmed.
    Establish whether reaching Tor infrastructure from this host is permitted before weighing the
    rest of the evidence.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there an approved business or administrative use case for reaching Tor hidden services from this host?
  context: >-
    Legitimate anonymity-routing use usually maps to a documented purpose — privacy research, a
    penetration-testing engagement, or a specific application that routes over Tor by design. If no
    ticket, maintenance window, or approved use case explains the lookup, the more likely reading
    is that a process is using Tor to obscure a command-and-control destination or to move data
    past egress monitoring. Match the timing and the querying account against change and support
    records.
  range: +/-30d
  answer_sources:
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What external endpoints did the querying process connect to after resolving the Tor address?
  context: >-
    A resolved tor2web gateway name is followed by a real outbound connection to the gateway, and a
    local Tor client connects onward to guard and relay nodes; a raw .onion lookup that never
    resolves produces no direct connection to the hidden service but may still show the client
    reaching relays. Reviewing the destinations the querying process contacted around the lookup
    shows whether the host actually reached anonymity infrastructure and which addresses it used —
    anchoring on the process rather than any single destination, since the resolver address in the
    DNS event is not the C2 endpoint.
  range: +/-15m
  answer_sources:
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: Did the querying process make repeated outbound connections over ports commonly used by Tor and proxy tools?
  context: >-
    Anonymity routing leaves a distinctive traffic footprint: a local Tor client opens a SOCKS
    proxy on 9050 and maintains sustained encrypted sessions to relays, and proxy tooling favors
    ports such as 1080, 8080, and 4444, while Tor egress to guard nodes commonly rides 443 and
    8443 and cannot be isolated by port alone. Aggregating the querying process's connections over
    the proxy-specific ports shows whether the traffic is a persistent relay session rather than a
    one-off lookup; a steady cadence over these ports weighs toward an established covert channel.
  range: +/-1h
  answer_sources:
  - network_connection
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        DestinationPort:
          - 9050
          - 1080
          - 8080
          - 4444
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
- question: Has this host queried this Tor address or gateway before?
  context: >-
    A lookup that appears for the first time at the alert marks when the host began reaching this
    anonymity endpoint and anchors the timeline. A history of the same name resolving regularly
    over the preceding weeks points instead at an installed tool or a standing workflow — still
    worth the authorization check, but not an emerging channel. The querying process shown over
    time indicates whether the same program has been responsible throughout.
  range: -90d
  answer_sources:
  - dns_query
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: What other domains did the querying process resolve, and do they show a beaconing or gateway-rotation pattern?
  context: >-
    A single Tor lookup may be one of many. The querying process's full set of resolutions in the
    surrounding window reveals whether it is cycling through multiple tor2web gateways or hidden
    services, or interleaving onion lookups with other external names — a burst of algorithmically
    varied or gateway-rotating domains from one process is a beaconing and resilience pattern
    rather than a single deliberate visit. Anchor on the process to see everything it looked up,
    not just the flagged name.
  range: +/-1h
  answer_sources:
  - dns_query
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: Did other hosts in the environment query this same Tor address or gateway?
  context: >-
    The distribution across hosts informs the response. A single host resolving the name suggests
    targeted or hands-on activity; the same uncommon onion or gateway name appearing on several
    hosts suggests shared tooling, a common lure, or wider compromise, and each of those hosts
    needs the same querying-process and authorization checks. Anchor fleet scope on the queried
    name rather than any resolved address, since gateway operators share front-end addresses
    across unrelated sites.
  range: -7d
  answer_sources:
  - dns_query
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Does this host normally run the program that issued the lookup?
  context: >-
    A program that has executed regularly on this host for months supports an installed-tool
    reading of the activity; a binary appearing for the first time around the alert points at fresh
    tooling that resolved a Tor address on its first run. The user grouping shows whether it runs
    under the interactive user or a service context, which feeds the expected-usage judgment.
  range: -90d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregated parent-child process pairs in a tight window around the lookup place it in its
    surrounding sequence — a dropper or script host before it, discovery commands or payload
    execution after it. Novel low-count pairs stand out against repetitive agent telemetry and
    point to the tool that reached the anonymity network and anything it did next.
  range: +/-15m
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — delivery artifacts, script-interpreter execution,
    persistence creation, or defense tampering — may capture how the querying program arrived and
    what it did before reaching for anonymity infrastructure. Command-and-control over Tor is
    typically a late stage, so prior alerts help place this lookup within the larger sequence.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
