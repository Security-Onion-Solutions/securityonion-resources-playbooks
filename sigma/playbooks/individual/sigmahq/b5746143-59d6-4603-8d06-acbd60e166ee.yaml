name: Uncommon Child Process Of AddinUtil.EXE
id: 1cbb9ec2-43a9-4a73-92ac-c1ea33b72db9
description: |
  Detects an uncommon child process spawned by addinutil.exe, the .NET Add-In deployment cache updating utility. The rule
  fires when addinutil.exe is the parent AND the child process is not one of the benign helpers conhost.exe or werfault.exe.
  addinutil.exe is a Microsoft-signed binary on recommended block lists; it can be coerced into proxy execution by pointing
  an -AddInRoot or -PipelineRoot flag at a working directory containing a crafted AddIns.store file, which is deserialized via
  BinaryFormatter and runs the embedded payload. Legitimate invocations run from the .NET Framework directories and spawn no
  general child processes, so any unexpected child is the artifact worth explaining. Investigate the parent command line for
  user-controlled add-in roots, decode what the child process did, and confirm whether this user and host legitimately run
  add-in cache maintenance.
type: detection
detection_id: b5746143-59d6-4603-8d06-acbd60e166ee
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did addinutil.exe spawn this child process, and is the child something other than conhost.exe or werfault.exe?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when the parent image
    ends in addinutil.exe AND the child is not the benign conhost.exe or werfault.exe helpers. Review the triggering event to
    verify the parent is genuinely addinutil.exe and identify exactly which child binary was launched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: Is this user and host expected to run add-in cache maintenance via addinutil.exe?
  context: Legitimate addinutil.exe use is rare and typically tied to Office add-in deployment from the .NET Framework
    directories. Knowing whether the user role and host function involve add-in management is often the fastest way to separate
    routine maintenance from coerced proxy execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What was the full command line of the parent addinutil.exe, and did it point an add-in root at a user-controlled
    directory?
  context: The parent command line reveals how addinutil.exe was invoked. Proxy execution is triggered by an -AddInRoot or
    -PipelineRoot flag whose path resolves to a user-writable directory (Desktop, Downloads, Temp, Public, Windows\Temp)
    or to "." with a matching working directory. Legitimate runs resolve under C:\Windows\Microsoft.NET\Framework, Framework64,
    or WinSxS. Decode the flags and the resolved path; a user-controlled add-in root is the configuration that loads and runs
    the crafted AddIns.store payload.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: What exactly did the child process do? Decode its command-line arguments.
  context: The child process is the payload that addinutil.exe proxied into execution. Decode every flag, parameter, encoded
    content, file path, and URL in its command line to determine the operational purpose. Multi-command tooling may span
    several sequential invocations on the host that together form one logical operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%ParentImage%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: Did the addinutil.exe command line carry an -AddInRoot or -PipelineRoot flag resolving to a user-writable path?
  context: Proxy execution through addinutil.exe depends on an add-in root that points at attacker-controlled content. The
    suspicious argument patterns are -AddInRoot, -PipelineRoot, and their "." variants combined with a working directory
    under Desktop, Downloads, Temp, Public, or Windows\Temp. Legitimate add-in roots live under the .NET Framework
    directories. Confirm whether this invocation matches the abuse pattern across recent executions on the host.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_binary:
        Image|endswith: \addinutil.exe
      selection_flags:
        CommandLine|contains:
          - '-AddInRoot:'
          - '-PipelineRoot:'
      condition: selection_binary and selection_flags
    fields:
      - CommandLine
      - CurrentDirectory
      - host.name
- question: What modules did addinutil.exe load, and do they show .NET deserialization or unexpected assemblies for this
    binary?
  context: Coerced add-in loading drives addinutil.exe through System.AddIn.Hosting.AddInStore.ReadCache, which instantiates
    BinaryFormatter and deserializes the AddIns.store contents — equivalent to running the payload as a binary. Loaded
    modules can reveal serialization assemblies or gadget DLLs that a benign cache update would never pull in. If image-load
    telemetry is not collected in this environment, treat zero results as a visibility gap rather than evidence nothing loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%ParentImage%'
      condition: selection
    fields:
      - ImageLoaded
      - CommandLine
- question: Did addinutil.exe initiate any network connections around the time of the alert?
  context: A legitimate add-in cache update does not reach the network. Outbound connections from addinutil.exe point to a
    payload that retrieves remote content or establishes command-and-control after deserialization. Review the destinations
    and whether they correspond to enterprise infrastructure or to an external, unexpected endpoint.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%ParentImage%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Does addinutil.exe normally spawn this child binary on this host?
  context: Legitimate addinutil.exe runs perform cache maintenance and do not launch general child processes, so any
    parent-child pairing here is inherently uncommon by the rule's design. Historical frequency of addinutil.exe spawning
    this specific child distinguishes a never-before-seen relationship from a recurring local pattern worth a baseline
    explanation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: What other child processes did this addinutil.exe instance spawn?
  context: An operator using addinutil.exe as a proxy launcher may chain several tools — reconnaissance, credential access,
    or lateral movement — from the same parent. Enumerating every child of this addinutil.exe reveals the full scope of
    activity initiated through the proxy execution chain rather than just the one child that tripped the rule.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other activity is associated with this addinutil.exe process around the same time?
  context: Beyond child processes, the addinutil.exe instance may have produced file events or network activity tied to the
    crafted AddIns.store payload. Activity clustered around the same window helps reconstruct what the proxy execution
    actually accomplished and whether it staged additional artifacts.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \addinutil.exe
      filter_main_werfault:
        Image|endswith:
        - :\Windows\System32\conhost.exe
        - :\Windows\System32\werfault.exe
        - :\Windows\SysWOW64\werfault.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \addinutil.exe
      filter_main_werfault:
        Image|endswith:
        - :\Windows\System32\conhost.exe
        - :\Windows\System32\werfault.exe
        - :\Windows\SysWOW64\werfault.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If
    the same user triggered similar activity on other hosts, the scope of the operation may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \addinutil.exe
      filter_main_werfault:
        Image|endswith:
        - :\Windows\System32\conhost.exe
        - :\Windows\System32\werfault.exe
        - :\Windows\SysWOW64\werfault.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Is this addinutil.exe parent-child spawning pattern occurring on other hosts?
  context: The same addinutil.exe parent spawning the same child across multiple hosts may indicate a coordinated operation
    or a pushed payload rather than an isolated event. A single occurrence is more likely targeted or local. Environment-wide
    comparison helps calibrate scope.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to
    this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege
    escalation, or persistence mechanisms in the surrounding window.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the attack
    stages that preceded this event and help reconstruct the full timeline leading up to the proxy execution.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
