name: PowerShell Profile Modification
id: a39aba32-fd4b-4650-afef-2eecea607887
description: |
  Detects the creation or modification of a PowerShell profile script (profile.ps1 or
  Microsoft.PowerShell_profile.ps1) in one of the known per-user or machine-wide profile locations.
  A PowerShell profile is a script that runs automatically every time a PowerShell session starts
  (unless launched with -NoProfile), so writing to one is a durable, low-friction persistence and
  privilege-escalation foothold: whatever the profile contains executes under the identity and
  integrity of the next shell to start, including elevated administrator sessions. Legitimate
  changes happen when a user or administrator customizes their shell, but they are infrequent and
  usually deliberate. Investigate what was written into the profile, which process wrote it and what
  launched that process, whether PowerShell subsequently started and loaded the profile, and whether
  the modification is a first-time change for this host and account.
type: detection
detection_id: b5b78988-486d-4a80-b991-930eff3ff8bf
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the created or modified file path match one of the known PowerShell profile locations?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a
    file whose path ends in a known PowerShell profile name is created or modified - the per-user
    Documents profile (Microsoft.PowerShell_profile.ps1 or profile.ps1 under WindowsPowerShell or
    PowerShell), the PowerShell 7 install profile, or the machine-wide v1.0 profile. Review the exact
    TargetFilename and the responsible process on the triggering event to confirm the write landed in
    a genuine profile path rather than an unrelated file that merely resembles one.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to create or modify a PowerShell profile?
  context: >-
    Profile edits are infrequent and usually deliberate, so knowing whether the writing account and
    host role are consistent with routine shell customization is often the fastest way to separate an
    administrator tailoring their environment from an actor planting persistence. User attribution is
    present on roughly 94% of endpoint file events; when it is a machine account or SYSTEM, judge by
    the writing process and the host function instead. The identity that owns the profile also matters
    for impact - a profile written into a location loaded by an elevated session extends whatever it
    contains to administrator integrity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the profile still on disk, or was it modified again, deleted, or renamed after the alert?
  context: >-
    The profile's post-alert lifecycle drives next steps. A profile still on disk can be retrieved and
    its contents read and hashed; a profile that is repeatedly rewritten suggests staging or tampering,
    and one deleted or renamed shortly after the write can indicate a script that seeded a payload and
    then cleaned up. Because the profile is meant to persist, an untouched profile that remains in place
    is itself the persistence artifact and should be captured before any remediation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What was written into the profile? Read its content for auto-run commands, loaded modules, and external program launches.
  context: >-
    The profile's content is the payload - it runs on every shell start. Retrieve the file and read it:
    look for encoded or obfuscated strings, download cradles, in-memory .NET loading, references to
    dropped binaries, Import-Module of unusual or user-writable module paths, and launches of external
    programs. A profile that quietly imports a module from a non-standard directory or spawns a helper
    process is the persistence mechanism, even when each individual line looks benign. File-write events
    do not carry content, so retrieve the file from its on-disk path or the endpoint console to inspect it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What process wrote the profile, and what launched that process?
  context: >-
    The file event carries no command line, so pivot by ProcessGuid to the writing process to read its
    Image, full command, and parent. A profile written by a text editor or a PowerShell session a user
    is actively working in points to routine customization; a write by an unexpected script host such
    as wscript.exe or mshta.exe, an Office application, an unsigned binary, or a PowerShell process
    launched from one of those, points to the profile being seeded programmatically. The parent chain
    distinguishes a hands-on edit from an automated persistence step.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Did PowerShell start on this host after the profile was modified, and under what user context did it run?
  context: >-
    Persistence via a profile fires the next time PowerShell starts, because the shell loads the profile
    automatically unless it is launched with the -NoProfile flag. Listing PowerShell and pwsh launches
    on this host in the hours after the write shows whether the profile has already been loaded and
    executed, and the launching user reveals the integrity at which it ran - a profile loaded by an
    elevated or SYSTEM session runs its content at that privilege, which is the privilege-escalation path
    for this technique. Correlating the launch time against the modification time establishes whether the
    persistence has been triggered yet.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
      condition: selection
    fields:
      - CommandLine
      - User
      - ParentImage
- question: If a PowerShell command wrote the profile, was that command encoded or obfuscated, and what does it decode to?
  context: >-
    When the profile is seeded by a PowerShell command rather than an interactive editor, the writing
    command line often hides its intent with -EncodedCommand (-enc) base64, string concatenation,
    backtick escaping, or variable substitution. Decoding the responsible process's command line reveals
    what actually assembled and wrote the profile - a download of remote content, an inline here-string,
    or a copy from a staging path. If the writer was not PowerShell, this shows the non-PowerShell command
    that performed the write instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the profile's content or the script that modified it?
  context: >-
    Script block logging records the deobfuscated script content PowerShell actually executes, even when
    a command line is encoded. It can capture both the script that wrote the profile and the profile
    itself being run when a later session loads it, giving ground truth about what ran independent of any
    on-disk obfuscation. If PowerShell operational logs are not ingested in this environment, treat zero
    results as a visibility gap rather than evidence that nothing ran, and fall back to reading the
    profile file directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell security controls bypassed or weakened before the profile was modified?
  context: >-
    Actors frequently disable or weaken PowerShell protections before establishing persistence. Common
    precursors include AMSI bypass (patching amsi.dll in memory), execution policy changes
    (Set-ExecutionPolicy or -ep bypass), and downgrade to PowerShell v2, which lacks modern logging.
    Finding these events on the host shortly before the profile write strengthens the case that the
    modification is part of a deliberate operation rather than routine customization.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: Has this PowerShell profile been created or modified before on this host?
  context: >-
    A profile path that has never been written on a host makes this a first-time change and raises its
    weight; a history of periodic writes to the same profile points instead to a management process, a
    provisioning script, or a user who routinely maintains their shell. The count and cadence of prior
    modifications to this exact profile path put the current write in context.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, so the result is the user's 90-day
    history of writing to a PowerShell profile path (not generic file activity), aggregated by host. A
    user who has never produced this pattern is more suspicious than one who does so regularly; weigh the
    count against whether shell customization fits the account's role and typical duties.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith:
        - \Microsoft.PowerShell_profile.ps1
        - \PowerShell\profile.ps1
        - \Program Files\PowerShell\7-preview\profile.ps1
        - \Program Files\PowerShell\7\profile.ps1
        - \Windows\System32\WindowsPowerShell\v1.0\profile.ps1
        - \WindowsPowerShell\profile.ps1
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this profile-write pattern on this host or across the environment, or is the program new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute the behavior; the
    meaningful pivot is the launch mechanism. The query mirrors the rule's selection scoped to the
    alerting program, so the result is the 90-day history of that program driving profile writes
    (not generic use of the binary). A new or rare program for this pattern is the deviation
    worth chasing; a program that already accounts for many prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith:
        - \Microsoft.PowerShell_profile.ps1
        - \PowerShell\profile.ps1
        - \Program Files\PowerShell\7-preview\profile.ps1
        - \Program Files\PowerShell\7\profile.ps1
        - \Windows\System32\WindowsPowerShell\v1.0\profile.ps1
        - \WindowsPowerShell\profile.ps1
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether the profile write is an isolated action
    or part of broader movement. If the same account triggered similar activity on multiple endpoints in
    the same window, the scope of compromise may be larger than this one host. When the alert fires under
    SYSTEM, a service principal, or a computer account, this cross-network user view returns routine
    agent telemetry - the parent-driven view is the meaningful answer in that case.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven profile-write pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, asking what else the user did network-wide returns agent-telemetry noise,
    because every host runs SYSTEM-owned agents constantly. The meaningful question is whether the same
    launch mechanism wrote profiles elsewhere: the query mirrors the rule's selection scoped to the
    alerting program, fleet-wide, in the alert window. Multiple hosts in the same window points to
    scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith:
        - \Microsoft.PowerShell_profile.ps1
        - \PowerShell\profile.ps1
        - \Program Files\PowerShell\7-preview\profile.ps1
        - \Program Files\PowerShell\7\profile.ps1
        - \Windows\System32\WindowsPowerShell\v1.0\profile.ps1
        - \WindowsPowerShell\profile.ps1
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other files did the process that modified the profile write or delete around the alert?
  context: >-
    A process that seeds a profile often touches other files too - dropping a module the profile imports,
    staging a payload the profile launches, or writing a marker file. The breadth, paths, and extensions
    of the writing process's other file activity distinguish a single edit from a staging operation and
    enumerate what else needs review, particularly files landing in module directories or user-writable
    locations the profile could reference.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to the PowerShell profile and module directories on this host recently?
  context: >-
    A PowerShell profile can import modules and dot-source scripts from the profile and module
    directories, so other recent arrivals in those locations may be components the profile pulls in at
    shell start. Reviewing what else was written under the WindowsPowerShell and PowerShell directories,
    and by which processes, reveals whether this is an isolated profile edit or a directory under active
    staging - a single unfamiliar writer across several files there is the signal.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - '\WindowsPowerShell\'
          - '\PowerShell\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host - reconnaissance, execution of
    scripting tools, credential access, or defense tampering - may reveal the stages that preceded the
    profile write and help reconstruct the timeline. Persistence is usually established to protect access
    already gained, so prior alerts help place this modification within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other persistence mechanisms installed on this host around the same time?
  context: >-
    Actors rarely rely on a single persistence mechanism. After establishing a profile foothold, they
    commonly add backups using different techniques - scheduled tasks, services, registry Run keys, BITS
    jobs, or WMI subscriptions. Persistence tool executions clustered near the profile modification
    indicate intentional stacking rather than an isolated shell edit, and enumerate the other footholds
    that need to be removed.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
