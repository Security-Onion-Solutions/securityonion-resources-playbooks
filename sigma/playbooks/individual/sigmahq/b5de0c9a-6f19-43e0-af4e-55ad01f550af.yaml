name: Unsigned DLL Loaded by Windows Utility
id: 7e2e4b4c-9b44-48b1-8d1f-5d1b7f93e10b
description: |
  Detects a Windows system utility (InstallUtil, RegAsm, RegSvcs, regsvr32, or rundll32) loading a
  DLL that is unsigned or carries an untrusted, chained, expired, or otherwise invalid signature, after
  excluding known-good signed modules and expected installer/assembly paths. These signed, trusted
  binaries are commonly abused to proxy-execute attacker code: a legitimate utility maps a malicious
  DLL into memory (rundll32 entrypoint, regsvr32 scriptlet, .NET assembly registration) so the payload
  runs under the cover of a trusted process. The same utilities also legitimately load third-party
  modules, so the investigation should determine what module was loaded, its origin and signing status,
  what command line drove the load, which process and parent launched the utility, whether the module
  was recently dropped to disk or fetched over the network, and whether the loading process spawned
  further children.
type: detection
detection_id: b5de0c9a-6f19-43e0-af4e-55ad01f550af
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the loaded module match what this rule detects — an unsigned or untrusted DLL loaded by one of these Windows utilities?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires when a utility whose Image
    ends in \InstallUtil.exe, \RegAsm.exe, \RegSvcs.exe, \regsvr32.exe, or \rundll32.exe loads a module
    AND that module is not signed-and-trusted (Signed is not true, or SignatureStatus is not one of the
    trusted/valid states) AND the load does not match a known-good installer or .NET assembly path. Review
    the exact ImageLoaded path, its Signed/SignatureStatus values, and the loading Image on the triggering
    event. DLL load events carry the module's signing status and hash directly, so this confirmation can be
    made from the alert itself.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Is this user and host expected to run this utility in a way that loads third-party DLLs?
  context: >-
    Legitimate administrative activity, installers, and developer tooling routinely invoke these utilities
    and can load non-Microsoft modules. Knowing whether the account and host function are consistent with
    the detected behavior is often the fastest way to separate a sanctioned action from proxy execution of
    attacker code. If the account is a machine account or SYSTEM, pivot on the loading process and its
    parent rather than on the user.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What DLL, scriptlet, or .NET assembly did the utility load, and is it from a non-canonical path, user-writable directory, or a scriptlet extension?
  context: >-
    The module the utility mapped into memory tells the operator's story when the command line alone is
    opaque. Look for a DLL loaded from %TEMP%, AppData, ProgramData, or Public (a strong side-loading
    signal), a system DLL name loaded from a non-system path (search-order hijacking), a scriptlet
    extension such as .sct or .ocx loaded by regsvr32, or an entrypoint DLL invoked by rundll32 from an
    uncommon folder. Review the loaded module path against where that module is normally expected to live.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For the loaded module, what is its signing status, hash, and threat-intel reputation?
  context: >-
    Module reputation distinguishes a routine third-party DLL from a side-loaded malicious one. A genuinely
    signed DLL loaded from an unexpected location may still be legitimate (some installers stage signed
    DLLs), while an unsigned module carrying a Microsoft-style filename with no valid signature is a strong
    masquerading indicator. Signature states of Unsigned, errorChaining, errorExpired, and errorCode point
    to an untrusted module. The Hashes field surfaces the module's hash for a reputation lookup that can
    surface known malware loaders.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What were the full command-line arguments passed to the utility that loaded the module?
  context: >-
    The command line reveals how the utility was driven and what it was told to load. Decode the arguments:
    a rundll32 invocation names an entrypoint DLL and function, regsvr32 /i or /u references a scriptlet or
    DLL to register, and arguments containing URLs, script paths, javascript:, or paths under user-writable
    directories indicate proxy execution rather than routine registration. Compare the referenced module or
    entrypoint against the loaded module already identified. This query scopes to executions of this binary
    on this host within the window, which for multi-step tooling may span more than the single triggering
    invocation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process launched this utility, and is that parent chain expected?
  context: >-
    The parent process reveals how the utility was invoked. Legitimate usage often has predictable parents
    (explorer.exe for user actions, services.exe or an installer for system activity). Unusual parents such
    as an Office application, wscript.exe, mshta.exe, or an unsigned binary in a user-writable path point to
    the utility being used as an execution proxy rather than for administration. This pivots by ProcessGuid
    to the utility's own creation record to read its parent and full command line.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - ParentImage
      - ParentCommandLine
      - CommandLine
- question: Was the loaded module recently written to disk on this host, and by which process?
  context: >-
    Side-loaded and proxy-executed DLLs are typically dropped to disk shortly before the load, often into a
    user-writable directory such as ProgramData, Public, or an AppData subfolder. Finding the file-write
    event for this module identifies the process that placed it (the dropper), when it landed, and whether
    the writing process differs from the utility that loaded it. A module that was written moments before it
    was loaded by a signed utility is a strong side-loading signal; a module present for months is more
    likely a legitimate third-party component.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: What child processes did this utility spawn after loading the module?
  context: >-
    The processes a proxy-execution utility spawns reveal the payload's actual impact. Legitimate
    registration or installer activity has predictable children; abuse often spawns cmd.exe, powershell.exe,
    certutil.exe, or other post-exploitation tooling shortly after the module is loaded. This lists
    processes whose parent is the loading utility instance on this host in the hours after the load.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did the process that loaded the module make outbound network connections around the time of the load?
  context: >-
    These utilities are used both to fetch a payload before loading it and to beacon out afterward — a
    signed utility retrieving a DLL from a remote host, then the loaded module contacting external
    infrastructure. Network connections initiated by the loading process, especially to external addresses,
    tie the module load to a delivery or command-and-control channel. The Initiated direction distinguishes
    outbound (egress) connections from inbound ones.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: Has this specific module been loaded on this host before, and under what processes?
  context: >-
    A first-time module load on a host is a stronger anomaly signal than a recurring one. If the same module
    has been loaded by the same utility repeatedly over the past 90 days, this load is probably a routine
    third-party component. If this is the first occurrence, or the module has only ever been loaded by
    entirely different processes, the current load is anomalous. This also reflects the environment's
    baseline of which DLLs these utilities are expected to load.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: When this host has previously fired this rule's pattern, what programs and users normally drive it, and does the current alert fit?
  context: >-
    Even common utilities can be abused. The query mirrors the rule's full selection and filter
    structure scoped to this host, so the resulting program and user distribution reflects how
    this rule's specific firing pattern — a utility loading an untrusted module — has
    historically run here, not generic use of the binary. A new acting program process, an
    unexpected user account, or a first-ever occurrence of this pattern on the host is the
    anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: image_load
    detection:
      selection:
        Image|endswith:
        - \InstallUtil.exe
        - \RegAsm.exe
        - \RegSvcs.exe
        - \regsvr32.exe
        - \rundll32.exe
      filter_main_signed:
        Signed: 'true'
      filter_main_sig_status:
        SignatureStatus:
        - errorChaining
        - errorCode_endpoint
        - errorExpired
        - trusted
        - Valid
      filter_main_signed_null:
        Signed: null
      filter_main_signed_empty:
        Signed:
        - ''
        - '-'
      filter_main_sig_status_null:
        SignatureStatus: null
      filter_main_sig_status_empty:
        SignatureStatus:
        - ''
        - '-'
      filter_main_windows_installer:
        Image:
        - C:\Windows\SysWOW64\rundll32.exe
        - C:\Windows\System32\rundll32.exe
        ImageLoaded|startswith: C:\Windows\Installer\
        ImageLoaded|endswith:
        - .tmp-\Microsoft.Deployment.WindowsInstaller.dll
        - .tmp-\Avira.OE.Setup.CustomActions.dll
      filter_main_assembly:
        Image|startswith:
        - C:\Windows\SysWOW64\
        - C:\Windows\System32\
        - C:\Windows\Microsoft.NET\Framework64
        Image|endswith: \RegAsm.exe
        ImageLoaded|endswith: .dll
        ImageLoaded|startswith: C:\Windows\assembly\NativeImages
      filter_optional_klite_codec:
        Image:
        - C:\Windows\SysWOW64\regsvr32.exe
        - C:\Windows\System32\regsvr32.exe
        ImageLoaded|startswith:
        - C:\Program Files (x86)\K-Lite Codec Pack\
        - C:\Program Files\K-Lite Codec Pack\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - Image
    - User
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity in a tight window around the load
    surfaces what led up to it and what ran immediately after. Novel parent-child pairs stand out at low
    counts against high-count routine telemetry, which is what points to the tool that staged the module and
    any follow-on actions once it executed. Look for reconnaissance, privilege escalation, or persistence in
    the surrounding window.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — reconnaissance, defense tampering, credential access, or delivery
    of a payload — may reveal the stages that preceded this module load and help reconstruct the timeline.
    Proxy execution of an untrusted DLL is frequently a stage in a longer sequence, so prior alerts help
    place this load within a larger operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was this utility executed from its expected system path?
  context: >-
    These utilities normally run from System32 or SysWOW64. A copy running from a user's temp directory,
    ProgramData, or another user-writable path may indicate the binary was relocated or renamed to evade
    path-based allowlists and to place it alongside a malicious DLL for side-loading. Compare the Image path
    and OriginalFileName against the expected system location.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Were any other proxy-execution LOLBins used on this host recently?
  context: >-
    Attackers who use one proxy-execution binary often use several. If regsvr32 or rundll32 loaded an
    untrusted module, check whether mshta, msbuild, cmstp, msiexec, or other binaries capable of running
    arbitrary code were also used in the same timeframe. Finding multiple proxy-execution LOLBins performing
    the same objective strengthens the case for malicious activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: How often has this host fired this rule's pattern over the past 90 days, and what command-line structures are typical?
  context: >-
    A utility-loads-untrusted-module pattern with no prior history on a host is more suspicious than one
    seen regularly under stable parents. The query mirrors the rule's full selection and filter structure
    scoped to this host, so the count reflects this rule's specific firing pattern rather than generic use of
    the binary. The CommandLine projection lets typical invocation patterns be compared against the alerting
    one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: image_load
    detection:
      selection:
        Image|endswith:
        - \InstallUtil.exe
        - \RegAsm.exe
        - \RegSvcs.exe
        - \regsvr32.exe
        - \rundll32.exe
      filter_main_signed:
        Signed: 'true'
      filter_main_sig_status:
        SignatureStatus:
        - errorChaining
        - errorCode_endpoint
        - errorExpired
        - trusted
        - Valid
      filter_main_signed_null:
        Signed: null
      filter_main_signed_empty:
        Signed:
        - ''
        - '-'
      filter_main_sig_status_null:
        SignatureStatus: null
      filter_main_sig_status_empty:
        SignatureStatus:
        - ''
        - '-'
      filter_main_windows_installer:
        Image:
        - C:\Windows\SysWOW64\rundll32.exe
        - C:\Windows\System32\rundll32.exe
        ImageLoaded|startswith: C:\Windows\Installer\
        ImageLoaded|endswith:
        - .tmp-\Microsoft.Deployment.WindowsInstaller.dll
        - .tmp-\Avira.OE.Setup.CustomActions.dll
      filter_main_assembly:
        Image|startswith:
        - C:\Windows\SysWOW64\
        - C:\Windows\System32\
        - C:\Windows\Microsoft.NET\Framework64
        Image|endswith: \RegAsm.exe
        ImageLoaded|endswith: .dll
        ImageLoaded|startswith: C:\Windows\assembly\NativeImages
      filter_optional_klite_codec:
        Image:
        - C:\Windows\SysWOW64\regsvr32.exe
        - C:\Windows\System32\regsvr32.exe
        ImageLoaded|startswith:
        - C:\Program Files (x86)\K-Lite Codec Pack\
        - C:\Program Files\K-Lite Codec Pack\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - CommandLine
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's full selection and filter structure with no host scope, so the result is a
    fleet-wide count of this rule's firing pattern rather than generic use of the binary. Many hosts firing
    the same pattern points to scripted deployment or vendor automation loading the same module; one host or
    a small unrelated set points to targeted or manual activity. Use the host distribution to calibrate
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: image_load
    detection:
      selection:
        Image|endswith:
        - \InstallUtil.exe
        - \RegAsm.exe
        - \RegSvcs.exe
        - \regsvr32.exe
        - \rundll32.exe
      filter_main_signed:
        Signed: 'true'
      filter_main_sig_status:
        SignatureStatus:
        - errorChaining
        - errorCode_endpoint
        - errorExpired
        - trusted
        - Valid
      filter_main_signed_null:
        Signed: null
      filter_main_signed_empty:
        Signed:
        - ''
        - '-'
      filter_main_sig_status_null:
        SignatureStatus: null
      filter_main_sig_status_empty:
        SignatureStatus:
        - ''
        - '-'
      filter_main_windows_installer:
        Image:
        - C:\Windows\SysWOW64\rundll32.exe
        - C:\Windows\System32\rundll32.exe
        ImageLoaded|startswith: C:\Windows\Installer\
        ImageLoaded|endswith:
        - .tmp-\Microsoft.Deployment.WindowsInstaller.dll
        - .tmp-\Avira.OE.Setup.CustomActions.dll
      filter_main_assembly:
        Image|startswith:
        - C:\Windows\SysWOW64\
        - C:\Windows\System32\
        - C:\Windows\Microsoft.NET\Framework64
        Image|endswith: \RegAsm.exe
        ImageLoaded|endswith: .dll
        ImageLoaded|startswith: C:\Windows\assembly\NativeImages
      filter_optional_klite_codec:
        Image:
        - C:\Windows\SysWOW64\regsvr32.exe
        - C:\Windows\System32\regsvr32.exe
        ImageLoaded|startswith:
        - C:\Program Files (x86)\K-Lite Codec Pack\
        - C:\Program Files\K-Lite Codec Pack\
      condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
    fields:
    - host.name
