name: Potential Goopdate.DLL Sideloading
id: 073baa02-0b8c-452f-a895-53f380edac72
description: |
  Detects a process loading a DLL named goopdate.dll from a location other than the standard
  Program Files install paths and other than the known Google/Dropbox updater temporary
  directories. goopdate.dll is a legitimate Google Update component that the signed
  googleupdate.exe loads through the normal DLL search order; the rule fires when the module is
  loaded but NOT from Program Files AND NOT from the recognized updater temp paths, which is the
  signature of an attacker planting a malicious goopdate.dll next to a copy of the trusted,
  commonly-allowlisted updater in a user-writable directory so their code runs under it (DLL
  side-loading, T1574.001). Legitimate loads come from Program Files; a load from AppData,
  ProgramData, Temp, or another non-standard path is the side-loading signal. Investigate the
  exact module path, its signature and hash, what process loaded it and what launched that
  process, whether the DLL was recently written to disk, and whether service or autostart
  persistence and other hosts show the same module.
type: detection
detection_id: b6188d2f-b3c4-4d2c-a17d-9706e0851af0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the loaded module match what this rule detects — a goopdate.dll loaded from a non-standard path?
  context: >-
    Confirm the alert is a true positive by reviewing the exact module path on the load event.
    The rule fires when a module whose path ends in \goopdate.dll is loaded AND the path is not
    under Program Files and not under the recognized Google/Dropbox updater temporary
    directories. A load from AppData, ProgramData, Temp, or another user-writable location is the
    side-loading signal, because the legitimate component is loaded from the Program Files install
    tree. DLL load events carry the module's signing status and hash directly, so note both while
    confirming the path.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this host expected to run this updater and load goopdate.dll from this location?
  context: >-
    A genuine Google Update deployment loads goopdate.dll from its Program Files install tree, so
    a load from a user-writable path is unusual for a managed endpoint. Knowing whether this host
    runs Google Update at all, and whether an install or update was expected here, is often the
    fastest way to separate a real side-load from a sanctioned but relocated install. When the
    load process runs as a machine account or SYSTEM, pivot on the loading process and its parent
    rather than the user.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What modules did the loading process load, and are any from user-writable paths, unsigned, or from non-canonical directories?
  context: >-
    The full set of modules a process loads tells the story of a side-load. Look for the
    goopdate.dll load itself alongside any other DLLs pulled from %TEMP%, AppData, ProgramData, or
    Public, and for unsigned modules sitting in directories where signed ones are expected. A
    signed updater that loads a DLL by its expected name but from its own working directory rather
    than the system or install path is the classic search-order hijack this rule targets. Scoping
    to the loading process shows every module it pulled in around the alert.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For the goopdate.dll that loaded, what is its signing status, hash, and threat-intel reputation?
  context: >-
    Module reputation distinguishes a relocated-but-legitimate Google Update component from a
    side-loaded malicious one. The genuine component is signed by Google; an unsigned goopdate.dll,
    or one signed by an unexpected or invalid signer, loaded from a user-writable path is a strong
    masquerading indicator. The load event carries the module hash, so pivot it against threat
    intelligence to surface known loaders. Signature statuses to weigh: Valid may still be
    legitimate, while Unsigned, Expired, Distrusted, or Invalid on a system-style DLL name point to
    substitution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What is the full path and command line of the process that loaded goopdate.dll, and does the binary run from a non-standard location?
  context: >-
    The loading process is the host of the side-load. A copy of the signed updater executable
    running from AppData, Temp, ProgramData, or another user-writable directory — rather than from
    its Program Files install path — is itself the tell, because side-loading works by placing the
    trusted binary and the malicious DLL together in an attacker-controlled folder. Read the
    process image path, working directory, and command line to establish where the binary lives
    and how it was invoked.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: What launched the process that loaded goopdate.dll, and is that parent chain expected?
  context: >-
    The parent process reveals how the loading binary was started. A genuine updater is typically
    launched by services.exe, an update scheduler, or an installer; a copy of it started from an
    Office application, a script host such as wscript.exe or mshta.exe, a browser download
    directory, or an unsigned dropper points to the binary being staged by an intrusion rather than
    a real update. Pivot on the loading process to read its own image, command line, and immediate
    parent, and walk further up if the parent is itself unexpected.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Is the goopdate.dll still on disk, and which process wrote it to this location?
  context: >-
    Side-loading requires the malicious DLL to be written to disk next to the trusted binary before
    it is loaded, so correlating file writes to the loading process and its direct children shows
    when and by what the module was dropped. A recent write of goopdate.dll into a user-writable
    directory by an installer, archive utility, or script ties the load to a staging step and yields
    the on-disk file for hashing and deeper analysis. If the file is still present, preserve it for
    signature and sandbox review.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has goopdate.dll been loaded on this host before, and under which processes?
  context: >-
    A first-time load of this module on a host is a stronger anomaly than a recurring one. If the
    same DLL has been loaded repeatedly by the same install-path updater over the past 90 days, this
    load is probably routine relocation or a benign update. If this is the first occurrence, or the
    module has only ever been loaded from the Program Files tree and now loads from a user-writable
    path, the current load is anomalous and warrants the signature and lineage checks.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Were service or DLL-redirection registry keys modified on this host around the time of the load?
  context: >-
    DLL side-loading is frequently paired with a persistence mechanism and, at times, with registry
    redirection that forces a trusted process to prefer an attacker DLL. Modifications to service
    keys under CurrentControlSet\Services (a binary path pointing outside the standard install tree),
    to the Session Manager KnownDLLs list, or to App Paths near the load indicate the side-load was
    used to establish a foothold rather than being an isolated event. Compare the value data and the
    writing process for keys touched in the same window.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\Services\'
          - '\Session Manager\KnownDLLs'
          - '\App Paths\'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    A side-load rarely happens in isolation. Aggregating process activity in a tight window around
    the load surfaces what led up to it — an installer or archive extraction that staged the binary
    and DLL — and what ran immediately after, such as a spawned child running under the trusted
    process. Novel parent-child pairs stand out at low counts against high-count routine telemetry,
    which is what points to the staging tool and any follow-on execution.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Is this same goopdate.dll being loaded on other hosts, especially under unexpected processes?
  context: >-
    Cross-host correlation surfaces deployment scope. The same module loaded from a user-writable
    path on one host could be a localized incident; the same load across multiple hosts indicates a
    distributed intrusion or a shared staging package. Pay attention to the variety of loading
    processes — a single module loaded only by its expected updater is one story, while the same
    module loaded by different or unexpected processes on other hosts suggests wider spread.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — reconnaissance, execution of scripting or archive tools,
    or defense tampering — may reveal the stages that preceded the side-load and help reconstruct
    the timeline. Side-loading is typically a means to run code under a trusted process, so prior
    alerts help place this load within a larger sequence rather than treating it as a standalone
    event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Does the user or an administrator recall installing or updating the application that loaded this module?
  context: >-
    Direct confirmation from the account owner or the team that manages this endpoint is often the
    fastest way to resolve the alert. If someone installed or repaired a Google Update-based
    application, or a packaging or test process relocated the updater, that can explain a load from
    a non-standard path; if no one recalls the action, the account may be compromised or the load
    was driven by automated tooling, and the investigation should continue into the writing process
    and follow-on execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this activity align with normal work hours and maintenance windows?
  context: >-
    Legitimate software installs and updates usually occur during business hours or scheduled
    maintenance windows. A module loaded from a user-writable path outside those windows — late at
    night, on a weekend, with no corresponding maintenance activity — is more suspicious than the
    same load during a documented update. Weigh the host's role and timezone and whether any
    scheduled deployment would explain the timing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Attackers rarely rely on a single foothold. After running code through a side-loaded DLL, they
    commonly install backup persistence using scheduled tasks, services, registry Run keys, BITS
    jobs, or WMI subscriptions. Executions of schtasks.exe, sc.exe, reg.exe, bitsadmin.exe, or
    wmic.exe near the load indicate the side-load was used to entrench rather than being an isolated
    event, and the specific commands show what was installed.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely — dropping an executable or
    script into a Startup folder or a path referenced by a registry Run key achieves persistence
    without invoking schtasks, sc, or reg. File writes to these locations near the side-load
    indicate the code that ran under the trusted process established a parallel persistence
    mechanism on disk, which the module-load and registry checks alone would not surface.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
