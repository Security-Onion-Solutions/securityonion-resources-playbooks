name: Directory Service Restore Mode(DSRM) Registry Value Tampering
id: 6c285536-88cd-4b6e-9cc0-7d58071eadca
description: |
  Detects a modification to the DsrmAdminLogonBehavior value under
  HKLM\System\CurrentControlSet\Control\Lsa on a domain controller, where the value is set to
  something other than the default DWORD 0. This value governs whether the Directory Services
  Restore Mode (DSRM) local Administrator account - created during DC promotion with a rarely
  rotated password - can authenticate outside of DSRM boot mode: a value of 1 permits its use when
  the local AD DS service is stopped, and 2 permits normal logon, including over the network.
  Because the DSRM account's password is static and its hash can be replayed, enabling normal logon
  provides a persistent, privileged authentication path on the DC that survives the loss of an
  attacker's domain credentials. Investigate what value was set, which process and account set it,
  whether credential-dumping activity preceded it, and whether the DSRM account was subsequently
  used for authentication or lateral movement.
type: detection
detection_id: b61e87c0-50db-4b2e-8986-6a2be94b33b0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting registry write set DsrmAdminLogonBehavior to a value other than the default 0?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a
    value whose path ends in \Control\Lsa\DsrmAdminLogonBehavior is written AND the value data is
    something other than the default DWORD 0. Review the exact TargetObject and Details on the
    triggering event to confirm the written value is 1 (DSRM account usable when the local AD DS
    service is stopped) or 2 (DSRM account usable for normal logon), either of which departs from
    the DSRM-only default.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this host a domain controller, and is this account expected to modify DSRM logon policy?
  context: >-
    The DsrmAdminLogonBehavior value exists on domain controllers and effectively never changes
    through normal operation. Knowing whether the host is a DC and whether the writing account and
    its role match any sanctioned DC hardening or recovery task is often the fastest way to separate
    an authorized change from persistence staging. User attribution is present on roughly 94% of
    endpoint registry events; when it is a machine account or missing, pivot on the writing process
    instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which value was written under Control\Lsa, and why is DsrmAdminLogonBehavior a security-relevant location?
  context: >-
    The DsrmAdminLogonBehavior value under the LSA key controls whether the DSRM local Administrator
    account - a full local administrator on the DC, separate from any domain account - can
    authenticate outside of DSRM boot mode. The value should not exist, or should be 0, in a clean
    state. Confirming the exact key path and the writing process establishes that this is the DSRM
    logon-policy value rather than an unrelated LSA edit, and sets up decoding the value data.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What DWORD value was written, and what DSRM logon behavior does it enable?
  context: >-
    The Details field holds the DWORD written to the value. A value of 1 lets the DSRM Administrator
    account log on when the local AD DS service is stopped; a value of 2 lets it log on normally,
    including authenticating over the network like an ordinary local account. The value 2 is the
    setting that opens the account to network pass-the-hash reuse, so decoding the exact data
    determines how far the logon restriction was relaxed. Details is present on roughly 79% of
    registry modifications and should be populated for this DWORD value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote this value, and what launched that process?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to
    read its Image, full command, and parent. A reg.exe, powershell.exe, or cmd.exe write launched
    from a remote-administration tool, a script host, or an unsigned binary points to the change
    being staged programmatically rather than a deliberate administrator edit at the console. The
    parent chain distinguishes a scripted modification from an interactive management action.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Which account does this change enable, and was its password hash likely obtained beforehand?
  context: >-
    Relaxing DSRM logon behavior is only useful to an attacker who already holds the DSRM local
    Administrator account's NTLM hash, which is stored in the DC's local SAM and is extracted by
    dumping SAM or LSA secrets. This registry change is the enabling step; the credential store at
    stake is the local SAM on this DC. The query shows the writing command for context - cross-
    reference for any prior local credential-dumping activity on this host, which would indicate the
    DSRM hash was already captured before the logon path was opened.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: After this write, was DsrmAdminLogonBehavior reverted to 0 or changed again?
  context: >-
    Registry key or value deletions are not observable in this telemetry, so durability is judged
    from the value's re-modification history rather than from a delete event. A later write that
    restores the value to 0 indicates the change was reverted, possibly to hide it after the DSRM
    account was used, while the value remaining 1 or 2 leaves the privileged logon path primed for
    reuse. Compare the Details values written to this key over the following window.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Has DsrmAdminLogonBehavior been modified before on this host?
  context: >-
    This value should change rarely, if ever, and only through deliberate action, so a history with
    no prior writes makes this a first-time change and raises its weight. A history of periodic
    writes to the same value points instead to a management process or a repeatedly run recovery
    tool. Compare the historical Details values to see whether a non-default value was set before or
    whether this is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this value modified on other domain controllers in the environment?
  context: >-
    The same modification across multiple domain controllers may reflect a management change or a
    misconfiguration pushed broadly; the same modification confined to one DC suggests a targeted
    action. Compare the Details values across hosts to see whether they all set the same value and
    whether the writing process is consistent, which separates a single hands-on operation from
    repeated use of the technique across the environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor who relaxes DSRM logon policy often makes other configuration changes in the same
    session - additional LSA or authentication-package edits, audit or logging policy changes, or
    persistence keys. Clustering the registry writes on this host in a short window around the alert
    reveals the full scope of changes and which process made them. The triggering value appears in
    the results; the signal is what else was modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Aggregating process activity in a tight window around the alert surfaces what led up to the
    registry change and what ran immediately after it. Novel parent-child pairs stand out at low
    counts against high-count routine telemetry, which is what points to the tool that made the
    change and any credential-access or account-manipulation activity taken alongside it.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Opening the DSRM logon path typically follows the theft of the DSRM account's hash, so earlier
    detections on the same DC - credential dumping, LSA or SAM access, or reconnaissance - may reveal
    the stages that preceded this change and help reconstruct the timeline. A prior credential-access
    alert immediately before this registry write is a strong sign the two are part of one operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after this event?
  context: >-
    Enabling DSRM logon is typically followed by using the account to authenticate. The query returns
    outbound connections from this host to remote-access ports -- 3389 (RDP), 445 (SMB), 5985/5986
    (WinRM), 22 (SSH) -- in the hours after the event; the originating Image and User show what drove
    each connection. Two limits to keep in mind -- a DSRM hash replayed from another machine against
    this DC will not appear here (review this DC's authentication events for the local Administrator
    account), and the query requires network telemetry from this host; if that is not collected,
    treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Which accounts may be compromised, and do any have elevated privileges?
  context: >-
    The DSRM local Administrator account is a full administrator on the domain controller, and control
    of a DC provides a path to the entire domain. If this change was made by an attacker, treat the
    DSRM account as compromised and evaluate what domain-level access the DC itself confers. Cross-
    reference the writing account and any accounts recently active on this host against directory group
    memberships to gauge the blast radius.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were other persistence mechanisms installed on this host in the same window?
  context: >-
    The DSRM logon change is itself a persistence mechanism, and attackers rarely rely on a single
    foothold. Scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions created
    by schtasks.exe, sc.exe, reg.exe, bitsadmin.exe, or wmic.exe near this change indicate the actor
    stacked additional persistence rather than acting in isolation.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Does an administrator recall making this DSRM logon-policy change?
  context: >-
    The DsrmAdminLogonBehavior value has no routine reason to change, so direct confirmation from the
    DC administrators is a fast way to resolve the alert. If an administrator was performing DC
    recovery or a documented hardening task, that may explain it; if no one recalls the action, the
    account may be compromised or the change was made by automated tooling, and the investigation
    should continue into the writing process and any use of the DSRM account.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Was there a change ticket, maintenance window, or documented approval for this change?
  context: >-
    Changes to domain controller security configuration, especially values affecting account logon
    behavior, are typically governed by change control. A corresponding ticket or maintenance window
    suggests authorized DC hardening or recovery work; absence of one when policy requires it suggests
    the change was unauthorized. This check can quickly close a false positive or escalate a true
    positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
