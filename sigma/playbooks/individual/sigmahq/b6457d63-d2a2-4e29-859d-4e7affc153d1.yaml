name: Potential Discovery Activity Via Dnscmd.EXE
id: a5c385e3-5c22-4340-a1ce-df7529faa5bb
description: |
  Detects dnscmd.exe invoked with read-only enumeration verbs (/enumrecords, /enumzones, /ZonePrint, /info) used to
  enumerate the DNS zones and records of a domain. The rule fires when the Image ends in \dnscmd.exe AND the command line
  contains one of these discovery switches. dnscmd is a legitimate DNS server administration utility, so DNS admins and IT
  automation can trigger it during routine troubleshooting; the same enumeration verbs are also the canonical primitive for
  host-based DNS discovery, where an operator maps AD-integrated zones, service-account hostnames, and trust delegations
  before moving to the next stage. Determine whether the user and host are expected to administer DNS, whether the parent
  chain and surrounding activity look like routine administration or post-compromise enumeration, and whether other discovery
  or LOLBin activity accompanied it.
type: detection
detection_id: b6457d63-d2a2-4e29-859d-4e7affc153d1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line show dnscmd.exe run with a DNS enumeration switch (/enumrecords, /enumzones, /ZonePrint, or /info)?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and
    process details. The rule fires only when the Image ends in \dnscmd.exe AND the command line contains one of the read-only
    enumeration verbs, so confirm which switch was present and against which DNS server or zone it was aimed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user expected to run DNS server administration and enumeration commands?
  context: Network and DNS administrators legitimately run dnscmd enumeration verbs for troubleshooting, and membership in the
    DnsAdmins group is enough to use them without Domain Admin. Standard users and service accounts rarely have any reason to
    enumerate DNS zones or records. The user's role and typical behavior baseline determine whether this is routine administration
    or anomalous discovery.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: What exactly did this dnscmd invocation enumerate? Decode the full command line.
  context: The full command line reveals which server, zone, and node were targeted and which enumeration verb was used.
    /enumzones lists every zone, /enumrecords <zone> <node> dumps records, /ZonePrint dumps an entire zone, and /info reads
    server or registry-backed configuration. Note the target server (an IP/FQDN/hostname argument, or omitted for the local
    server) and whether the same host issued a sequence of these commands that together form a broader discovery sweep.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this dnscmd command, and is that parent chain normal?
  context: Legitimate DNS administration is typically run from cmd.exe or powershell.exe spawned by explorer.exe (an admin opened
    a console) or from a management automation script. dnscmd launched by unusual parents -- Office applications, script
    interpreters like wscript.exe/cscript.exe/mshta.exe, wmiprvse.exe (WMI remote execution), or wsmprovhost.exe (WinRM) --
    points to automated post-exploitation enumeration rather than hands-on administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single DNS enumeration command may be legitimate troubleshooting, but multiple reconnaissance commands in rapid
    succession -- nltest, nslookup, net, dsquery, adfind alongside dnscmd -- is a signature pattern of post-compromise
    enumeration. Three or more distinct recon binaries within fifteen minutes typically indicates automated discovery before
    the operator moves to the next stage.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: Does this host normally run dnscmd.exe?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. On a DNS server, dnscmd
    may appear routinely; on a workstation or a server that does not host DNS, it should be rare or absent. Zero or very low
    historical counts indicate first-time or rare execution.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \dnscmd.exe
      selection_cli:
        CommandLine|contains:
        - /enumrecords
        - /enumzones
        - /ZonePrint
        - /info
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \dnscmd.exe
      selection_cli:
        CommandLine|contains:
        - /enumrecords
        - /enumzones
        - /ZonePrint
        - /info
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated activity across multiple
    endpoints. If the same user triggered DNS enumeration or other discovery on multiple hosts in the same window, the scope of
    the activity may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \dnscmd.exe
      selection_cli:
        CommandLine|contains:
        - /enumrecords
        - /enumzones
        - /ZonePrint
        - /info
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to
    this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege
    escalation, persistence, or staging that accompanied the DNS enumeration.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- defense tampering, credential access, or other reconnaissance -- may reveal
    the attack stages that preceded this DNS enumeration and help reconstruct the timeline. A discovery command that follows
    initial access or credential theft reads very differently from an isolated administrative action.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: What child processes did dnscmd spawn afterward?
  context: The processes spawned by a tool reveal its actual impact. dnscmd enumeration is typically a leaf action with no
    children, so unexpected child processes -- cmd.exe, powershell.exe, certutil.exe, or other tooling -- spawned by dnscmd on
    this host suggest the binary was used as part of a scripted chain rather than standalone administration.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Were any other discovery or persistence LOLBins used on this host recently?
  context: Operators who use one LOLBin for discovery often use several. dnscmd's enumeration verbs sit alongside other native
    discovery and persistence primitives -- nltest, dsquery, adfind for AD enumeration, or schtasks, reg, sc, netsh for
    follow-on persistence. Finding multiple LOLBins working toward the same objective on this host strengthens the case for
    deliberate operator activity over isolated administration.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\wmic.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\hh.exe'
          - '\ie4uinit.exe'
          - '\infdefaultinstall.exe'
          - '\installutil.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\diskshadow.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\xwizard.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was dnscmd.exe executed from its expected System32 or SysWOW64 path?
  context: dnscmd legitimately lives in C:\Windows\System32\Dnscmd.exe and C:\Windows\SysWOW64\Dnscmd.exe. A dnscmd.exe running
    from a user's temp directory, a download folder, or any non-standard path may indicate the binary was copied or renamed to
    evade path-based allowlists. Compare the Image path and OriginalFileName against the expected system locations.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired the dnscmd enumeration pattern over the past 90 days, and what command-line structures are typical?
  context: A LOLBin pattern with no prior history on a host is more suspicious than one used daily under stable parents. The
    query mirrors the rule's selection structure scoped to this host, so the count reflects the rule's specific firing pattern
    (dnscmd with the enumeration verbs) rather than generic dnscmd usage. The CommandLine projection lets you compare typical
    invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \dnscmd.exe
      selection_cli:
        CommandLine|contains:
        - /enumrecords
        - /enumzones
        - /ZonePrint
        - /info
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- question: Have other hosts fired the dnscmd enumeration pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the
    rule's firing pattern rather than generic dnscmd usage. Many hosts firing the same pattern points to scripted deployment or
    a monitoring/automation product enumerating DNS; one host or a small unrelated set points to manual operator activity. Use
    the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \dnscmd.exe
      selection_cli:
        CommandLine|contains:
        - /enumrecords
        - /enumzones
        - /ZonePrint
        - /info
      condition: all of selection_*
    fields:
    - host.name
