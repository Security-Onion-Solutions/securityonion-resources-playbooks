name: Running Chrome VPN Extensions via the Registry 2 VPN Extension
id: db7f6bd2-508b-49f4-9edc-54049da6b408
description: |
  Detects a registry write that force-installs a Chrome VPN browser extension through Chrome's
  enterprise extension policy. The rule fires when a value is written under a Chrome Extensions
  policy key (TargetObject contains \Google\Chrome\Extensions AND ends in update_url) AND the
  extension identifier in the key path matches one of a large set of known VPN extension IDs.
  Writing an update_url value under HKLM\Software\Wow6432Node\Google\Chrome\Extensions\<extension_id>
  points Chrome at the Web Store update service and causes it to silently install and enable the
  named extension on the next policy refresh; the write requires administrative rights. A VPN
  extension installed this way provides an external remote-access channel and can be used for
  persistence or to bypass network egress controls. Legitimate deployments of browser extensions
  are normally pushed through managed group policy, so investigate which extension was forced,
  which process and account wrote the key, whether Chrome subsequently applied the policy, whether
  outbound connections consistent with tunneling followed, and whether the same write appeared on
  other hosts.
type: detection
detection_id: b64a026b-8deb-4c1d-92fd-98893209dff1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting registry write set an update_url under a Chrome Extensions policy key for a known VPN extension?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires only
    when both conditions hold: the written path is under a Chrome Extensions policy key and ends in
    update_url, AND the extension identifier embedded in the key path matches one of the known VPN
    extension IDs. Review the exact TargetObject on the triggering event to confirm the key sits
    under \Google\Chrome\Extensions, ends in update_url, and names a VPN extension - the combination
    is the force-install setup step.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to configure Chrome extension force-install policy?
  context: >-
    Browser extension policy is normally managed centrally and effectively never set by writing this
    key by hand. An account writing an update_url under the Chrome Extensions policy hive on an
    endpoint is the preparatory move of a force-install, so knowing whether the writing account and
    host function match any sanctioned management activity is the fastest way to separate an approved
    deployment from an unauthorized one. User attribution is present on roughly 94% of endpoint
    registry events; when it is a machine account or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which Chrome Extensions policy key was written, and why is this a force-install location?
  context: >-
    The key HKLM\Software\Wow6432Node\Google\Chrome\Extensions\<extension_id>\update_url tells Chrome
    to fetch and silently install the named extension from the Web Store on the next policy refresh.
    The extension identifier is the sub-key name in the path, so the TargetObject alone reveals which
    extension is being forced. Confirming the exact path and the writing process establishes that this
    is the enterprise force-install mechanism rather than an unrelated Chrome setting, and sets up
    decoding which VPN extension and update source were configured.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which VPN extension was forced and where does the update_url point?
  context: >-
    The extension identifier is the sub-key name in the TargetObject path, and the Details field holds
    the update_url value Chrome will use to install it - typically the Chrome Web Store update service.
    Decode both: the identifier maps to a specific VPN provider extension, and the update source shows
    whether Chrome is being pointed at the official store or an attacker-controlled host. A VPN
    extension forced this way tunnels browser traffic through the provider and can bypass egress
    monitoring. Details is present on roughly 79% of registry modifications and should be populated for
    this string value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote this policy key, and what launched that process?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to read
    its Image, full command, and parent chain. Writing under HKLM requires administrative rights; a
    reg.exe, powershell.exe, or cmd.exe write launched from a script host such as wscript.exe or
    mshta.exe, an Office application, or an unsigned binary points to the force-install being staged
    programmatically rather than performed through a management tool. The parent chain distinguishes a
    scripted install from a deliberate administrative action.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: After this write, was Chrome run on this host so the force-install policy would apply?
  context: >-
    A force-install policy only takes effect when Chrome next launches or refreshes policy and pulls
    the extension from the configured update_url. Checking whether chrome.exe ran on this host after
    the registry write indicates whether the forced VPN extension was actually installed and enabled
    rather than merely staged. If Chrome did not run, the extension is configured but not yet active.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\chrome.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: Does this policy value persist, or was it later reverted or overwritten?
  context: >-
    Registry key and value deletions are not observable in this telemetry, so durability is judged from
    the key's re-modification history rather than from a delete event. A later write that clears or
    changes this update_url indicates the force-install was reverted, possibly to hide it after the
    extension installed, while the value remaining in place leaves the extension pinned so Chrome
    reinstalls it even if a user removes it. Compare the Details values written to this key over the
    following window.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Has this Chrome Extensions policy key been modified before on this host?
  context: >-
    Extension force-install policy on a managed endpoint should change rarely and only through
    deliberate action, so a history with no prior writes makes this a first-time change and raises its
    weight. A history of periodic writes to the same key points instead to an established management
    process. Compare the historical Details values to see whether the same update_url was set before or
    whether this is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same Chrome extension policy key modified on other hosts in the environment?
  context: >-
    The same force-install across many hosts suggests a broad policy push or a mis-scoped deployment;
    the same write confined to one host suggests a targeted install. Compare the Details values and the
    writing process across hosts to see whether they all force the same extension from the same update
    source, which separates a single hands-on operation from a fleet-wide policy or a repeated technique
    across the environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor who forces one extension often makes other configuration changes in the same session -
    forcing additional extensions, disabling browser security policies, editing proxy settings, or
    adding persistence keys. Clustering the registry writes on this host in a short window around the
    alert reveals the full scope of changes and which process made them. The triggering key appears in
    the results; the signal is what else was modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A policy-based force-install rarely happens in isolation. Aggregating process activity in a tight
    window around the alert surfaces what led up to the registry write and what ran immediately after
    it. Novel parent-child pairs stand out at low counts against high-count routine telemetry, which is
    what points to the tool that staged the write and any follow-on actions taken once the extension
    was configured.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, execution of scripting tools, credential
    access, or defense tampering - may reveal the stages that preceded this change and help
    reconstruct the timeline. Installing an external remote-access channel is often a step toward
    maintaining access, so prior alerts help place this force-install within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: After the extension was forced, did this host make outbound connections consistent with VPN or proxy tunneling?
  context: >-
    A VPN browser extension routes traffic through the provider's servers, so once the forced extension
    is active the host typically establishes new outbound sessions to a small set of external endpoints
    that were not seen before. Reviewing chrome.exe outbound destinations after the write shows whether
    the external remote-access channel was actually used. Compare the destinations against approved VPN
    endpoints and expected destination geographies; a dominant new external endpoint that is not on the
    approved list indicates tunneling is live. Destination hostnames are sparse in this telemetry, so
    resolve unfamiliar addresses through DNS lookup records if a name is needed.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\chrome.exe'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
- question: Was there a change ticket or documented approval to deploy this browser extension?
  context: >-
    Many organizations deploy approved browser extensions through managed policy and record the change.
    A corresponding ticket or documented approval suggests the force-install was a sanctioned
    deployment; the absence of one when policy requires it suggests the extension was installed without
    authorization. This check can quickly close a benign deployment or escalate an unauthorized one.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does an administrator recall forcing this browser extension on this host?
  context: >-
    Direct confirmation from the responsible administrator is often the fastest path to legitimacy. If
    an administrator or a red-team operator forced the extension as part of testing or an approved
    rollout, that closes the alert; if no one recalls the action, the account may be compromised or the
    change was made by automated tooling, and the investigation should continue into the writing
    process and any outbound tunneling.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were other persistence mechanisms installed on this host in the same window?
  context: >-
    Attackers rarely rely on a single foothold. After configuring an external remote-access channel,
    they commonly add backup persistence using different techniques - scheduled tasks, services,
    registry Run keys, BITS jobs, or WMI subscriptions. Executions of schtasks.exe, sc.exe, reg.exe,
    bitsadmin.exe, or wmic.exe near the force-install indicate the write was part of a broader effort to
    establish and maintain access rather than an isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
