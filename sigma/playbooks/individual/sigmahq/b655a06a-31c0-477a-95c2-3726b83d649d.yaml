name: Suspicious Userinit Child Process
id: 56e33801-aa64-421a-9fb2-fd8f13f659ff
description: |
  Detects a process whose parent is userinit.exe but which is not one of the
  expected userinit children. At logon, winlogon.exe launches userinit.exe, which
  normally spawns the user shell (explorer.exe) and then exits; it may also run
  domain logon scripts from the netlogon share. The rule fires when userinit.exe
  spawns a child whose Image does not end in explorer.exe, whose OriginalFileName
  is not explorer.exe, whose command line is not the standard Explorer invocation,
  and whose command line does not reference a netlogon path. An unexpected child of
  userinit is a known foothold for execution and persistence — a hijacked Userinit
  registry value, a logon-time loader, or code running in the userinit context to
  gain a logon-session foothold. The investigation should confirm which child fired,
  decode what it did, trace how userinit was started, and determine whether the
  child loaded planted modules or reached into other processes.
type: detection
detection_id: b655a06a-31c0-477a-95c2-3726b83d649d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Is the parent userinit.exe, and is the child something other than explorer.exe or a netlogon logon script?
  context: Confirm the alert is real before investing time. The parent Image should end in
    userinit.exe. The child should not be explorer.exe (by Image, OriginalFileName, or the
    standard Explorer command line) and its command line should not reference a netlogon
    path — those are the expected logon children the rule filters out. Note the exact child
    Image and command line; the rest of the investigation pivots on what that child is.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: Is this user and host expected to run this child binary at logon under userinit?
  context: A child of userinit runs in the logon path of whoever is signing in. An
    administrator or IT-managed host running a known logon helper is far less concerning
    than the same binary appearing under a standard user or in an environment with no logon
    automation. Knowing whether the account and host normally see logon-time custom
    execution is often the fastest way to separate a sanctioned helper from a hijack.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What did the userinit child do? Decode its command-line arguments, flags, and any file paths or encoded content.
  context: The full command line of the child reveals the action taken in the logon context.
    Decode any flags, encoded payloads, script paths, or downloaded files. A child running
    from a user-writable or temporary directory, invoking a script host, or carrying an
    encoded command is the operational payload; the userinit parentage is only how it gained
    a logon-session foothold.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What started userinit.exe itself, and is that chain the normal winlogon logon path?
  context: userinit.exe is normally launched by winlogon.exe during an interactive logon and
    exits quickly after starting the shell. Tracing what spawned this userinit instance shows
    whether it sits on a genuine logon (winlogon parent) or was launched out of band by
    another process to abuse the userinit context. A userinit whose parent is not winlogon, or
    that runs long after the logon, is itself an anomaly.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: What modules did the userinit child load, and were any unsigned or loaded from a user-writable or non-standard path?
  context: Injection and loader behavior frequently surface as a module loaded from outside
    the normal system directories. Reviewing the DLLs the child loaded distinguishes a clean
    binary from one that side-loaded a planted module or mapped attacker code into its own
    address space. A module under a user profile, a temporary directory, or any user-writable
    path, or an unsigned module loaded by a binary that should only load system libraries, is
    the artifact worth chasing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
- question: Did the userinit child call any injection-capable APIs — writing into another process's memory, queueing an APC, or installing a global hook?
  context: WriteProcessMemory, QueueUserAPC, and SetWindowsHookEx are the API calls behind
    remote-thread injection, APC-queue injection, and hook-based injection. A userinit child
    that invokes one of these against another process is not a benign logon helper — it is
    staging code inside a second process. The target named in the resulting event, combined
    with the process's own command line, shows what it was trying to reach.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.executable|endswith|expand: '%Image%'
        event.dataset: endpoint.events.api
        process.Ext.api.name:
          - WriteProcessMemory
          - QueueUserAPC
          - SetWindowsHookEx
      condition: selection
    fields:
      - process.executable
      - process.Ext.api.name
      - Image
- question: What other processes did userinit spawn on this host around the logon, and did any besides explorer.exe appear?
  context: A normal userinit spawns explorer.exe and exits. Surfacing every child of userinit
    in the surrounding window shows whether this alert is a single anomalous child or one of
    several, which would indicate a logon-time loader launching multiple stages. Children other
    than explorer.exe, or repeated userinit spawns, point to deliberate use of the logon path.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: \userinit.exe
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Was the Userinit registry value modified on this host before the alert?
  context: The set of programs userinit runs at logon is governed by a registry value under
    the Winlogon key. Appending a binary to that value is a classic logon persistence
    mechanism — the added program then runs as a child of userinit on every logon. A
    process-creation write to that value through reg.exe, cmd, or PowerShell shortly before
    the alert ties the anomalous child to a deliberate persistence change. If registry-set
    events are not ingested in this environment, this process-creation view catches only the
    writes performed through command-line tools.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\reg.exe'
          - '\cmd.exe'
          - '\powershell.exe'
          - '\pwsh.exe'
        CommandLine|contains:
          - 'Winlogon'
          - 'Userinit'
      condition: selection
    fields:
      - CommandLine
      - Image
- question: What did this user do next on this host after the alert?
  context: Follow-on activity reveals what the logon-context foothold was used for. Look for
    privilege escalation, persistence installation, credential access, data collection, or
    lateral movement by the same user in the hours after the detected child ran.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other launches of this child binary on this host followed in the next four hours, and does the parent or command line change?
  context: Under a service principal, "what did this user do next" is unbounded. A more focused
    follow-on for automation-driven alerts is to track repeat invocations of the same binary on
    the same host. Routine logon helpers repeat with stable parents and command-line structures; a
    deviation in parent or command line in the follow-on window is the signal worth chasing.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ParentImage
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \userinit.exe
      filter_main_netlogon:
        CommandLine|contains: \netlogon\
      filter_main_explorer:
      - Image|endswith: \explorer.exe
      - OriginalFileName: explorer.exe
      - CommandLine: C:\Windows\Explorer.EXE
      filter_main_null:
        Image: null
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \userinit.exe
      filter_main_netlogon:
        CommandLine|contains: \netlogon\
      filter_main_explorer:
      - Image|endswith: \explorer.exe
      - OriginalFileName: explorer.exe
      - CommandLine: C:\Windows\Explorer.EXE
      filter_main_null:
        Image: null
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around this time?
  context: Tracking the account's activity across all hosts in the surrounding window reveals
    lateral movement or coordinated activity on multiple endpoints. If the same user triggered
    similar logon-time activity elsewhere, the scope is larger than this one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \userinit.exe
      filter_main_netlogon:
        CommandLine|contains: \netlogon\
      filter_main_explorer:
      - Image|endswith: \explorer.exe
      - OriginalFileName: explorer.exe
      - CommandLine: C:\Windows\Explorer.EXE
      filter_main_null:
        Image: null
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Are there other alerts for this user on other hosts?
  context: If the same user triggered alerts on multiple hosts, the activity may extend beyond a
    single endpoint. Check for lateral movement patterns or credential abuse across the
    environment. If the user field is unavailable in alert data, fall back to process activity
    scoped by user.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        user.name|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
- question: Did this same rule fire on other hosts in the past 24 hours, and does the cross-host pattern look like coordinated automation or an isolated detection?
  context: Under a service principal the user is omnipresent, so "alerts for this user" is
    meaningless. The triage-useful question is whether this detection fires on multiple hosts. A
    rule firing across many hosts on the same day is probably tracking a pushed logon script or
    deployed package; a rule firing on one host alone is the deviation worth chasing.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Surveying activity around the alert reveals what led
    to the logon-time execution and what followed — reconnaissance, persistence, or escalation.
    Aggregating by process and parent collapses repetitive agent telemetry into high-count rows
    while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense
    tampering, reconnaissance, or credential access — may reveal the stages that preceded this
    event and help reconstruct the timeline leading up to the logon-context execution.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
