name: Potential Persistence Via Powershell Search Order Hijacking - Task
id: 53fecc63-18c9-4851-993d-0cd3f1d15ca8
description: |
  Detects PowerShell launched by the Task Scheduler service (svchost.exe -k netsvcs -s Schedule) where the
  command line ends with a stealth flag such as -windowstyle hidden, -w hidden, -ep bypass, or -noni instead
  of an explicit script or command. This pattern is associated with PowerShell command-resolution search-order
  hijacking: a script named after a built-in cmdlet (for example Get-Variable.ps1) is dropped into a
  user-writable directory that sits early in PATH, so a scheduled task running powershell with only a built-in
  cmdlet name silently executes the attacker script while the task command line looks innocuous. Investigate
  whether the scheduled task and its triggering command are legitimate, whether a cmdlet-named script was
  dropped into a PATH directory, and whether the task fires automatically to re-establish a foothold.
type: detection
detection_id: b66474aa-bd92-4333-a16c-298155b120df
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Was this PowerShell process spawned by the Task Scheduler service and does its command line end with a hidden-window or bypass flag?
  context: Confirm the alert is a true positive before investing time. The rule fires when the parent is svchost.exe running with -k netsvcs and -s Schedule and the PowerShell command line ends with one of ' -windowstyle hidden', ' -w hidden', ' -ep bypass', or ' -noni'. Verify the parent command line shows the Schedule service and that the child command line ends with a stealth flag rather than an explicit script path or command.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - CommandLine
- question: Is this user and host expected to run scheduled tasks that launch hidden PowerShell?
  context: Legitimate administrative automation can launch PowerShell from scheduled tasks, but a stealth-flagged invocation with no visible script is unusual for most environments. Knowing whether this host runs maintenance automation and whether the account is a service or admin identity is often the fastest way to separate routine jobs from attacker persistence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is the Task Scheduler service expected to launch hidden PowerShell here, and what registered the task?
  context: The parent is svchost.exe hosting the Schedule service, so the immediate parent is always the scheduler. The investigative weight is on the task itself — which task fired, who registered it, and whether its execution is a documented job. A scheduled task that runs powershell with only a hidden-window flag and a built-in cmdlet name is the search-order-hijack pattern, where the real payload is a cmdlet-named script resolved from PATH rather than anything visible on the command line.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did this same Task Scheduler service instance spawn around this time?
  context: The scheduler service launches every triggered task, so its other children reveal which tasks fired alongside this PowerShell invocation. Multiple stealth or persistence-related children from the same scheduler instance in a short window suggest several scheduled jobs activating together rather than a single isolated task.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What exactly does this PowerShell command line run, and does it reference a built-in cmdlet name with no explicit script path?
  context: Decode the full command line. Identify the cmdlet or command being invoked, the hidden-window or bypass flags, and whether any explicit script path is present. A command that names only a built-in cmdlet (Get-Variable, Get-Date, Set-Variable, Out-Default, Format-Table, and similar) with no module or script path is the signature of search-order hijacking, because PowerShell will resolve that name to a same-named .ps1 found earlier in PATH before the built-in cmdlet.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Has the Task Scheduler service launched other PowerShell or stealth processes after this task, and on what cadence?
  context: The trigger schedule determines when this persistence reactivates. Tasks set to run at logon or boot fire on next restart; recurring tasks may have already executed many times. Processes spawned by the scheduler service after task creation show whether the payload has run and how often.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\svchost.exe'
        ParentCommandLine|contains: 'Schedule'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is the scheduled task that launched this PowerShell still registered on the host?
  context: Persistence is only active if the task still exists. Some operators delete the task after execution to reduce forensic artifacts. Confirming the task is still registered, by querying the task store on the host or via endpoint tooling, determines whether the mechanism is live and requires removal. Use the decoded command line to identify the task name to look up.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the command encoded or obfuscated, and what does it resolve to?
  context: PowerShell can hide intent with -EncodedCommand (-enc), string concatenation, backtick escaping, or variable substitution. In the search-order-hijack pattern the command line is deliberately plain (a bare built-in cmdlet name), so the real payload is not on the command line at all but in a same-named .ps1 resolved from a PATH directory. If the command line is plain, treat the referenced cmdlet name as the lookup key and find the .ps1 that PowerShell would resolve to before the built-in cmdlet. If it is encoded, decode it to reveal download cradles, reverse shells, or in-memory .NET execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the actual script content this task executed?
  context: Script block logging (Event ID 4104) records the deobfuscated script PowerShell actually ran, even when the command line shows only a bare cmdlet name. For search-order hijacking this is the ground truth, because it captures the contents of the hijacking .ps1 that the command line never reveals. If PowerShell operational logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell security controls bypassed or weakened around this execution?
  context: One of the flags this rule fires on is -ep bypass, an execution-policy bypass. Operators frequently pair stealth invocations with broader control-weakening, such as AMSI bypass, real-time monitoring changes, or a downgrade to PowerShell v2 which lacks modern logging. Finding these precursor or concurrent actions strengthens the case for malicious activity.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: Was a script named after a built-in cmdlet dropped into a user-writable PATH directory such as WindowsApps?
  context: Search-order hijacking works by writing a .ps1 named exactly like a built-in cmdlet into a directory that appears early in the user's PATH, most commonly %LOCALAPPDATA%\Microsoft\WindowsApps. That folder is intended for store-app stubs, so legitimate software does not drop .ps1 files there. A cmdlet-named script in WindowsApps or another user-writable PATH directory is the persistence payload the task silently executes; check the writing process and signing chain to identify what dropped it.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: '.ps1'
      selection_paths:
        TargetFilename|contains:
          - '\WindowsApps\'
      condition: selection and selection_paths
    fields:
      - TargetFilename
      - Image
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        ParentImage: C:\WINDOWS\System32\svchost.exe
        ParentCommandLine|contains|all:
        - -k netsvcs
        - -s Schedule
        CommandLine|endswith:
        - ' -windowstyle hidden'
        - ' -w hidden'
        - ' -ep bypass'
        - ' -noni'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        ParentImage: C:\WINDOWS\System32\svchost.exe
        ParentCommandLine|contains|all:
        - -k netsvcs
        - -s Schedule
        CommandLine|endswith:
        - ' -windowstyle hidden'
        - ' -w hidden'
        - ' -ep bypass'
        - ' -noni'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user account do across the network around this time?
  context: Tracking the account's activity across all hosts can reveal lateral movement or a wider footprint. If the same account triggered similar scheduled-task or PowerShell activity on multiple endpoints in the alert window, the scope of compromise may be larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        ParentImage: C:\WINDOWS\System32\svchost.exe
        ParentCommandLine|contains|all:
        - -k netsvcs
        - -s Schedule
        CommandLine|endswith:
        - ' -windowstyle hidden'
        - ' -w hidden'
        - ' -ep bypass'
        - ' -noni'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Persistence rarely appears in isolation. Earlier detections on the same host, such as initial execution, defense tampering, or reconnaissance, may reveal the stages that led to this scheduled task being created and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur alone. Examining surrounding activity reveals what led to this scheduled task firing and what followed it, including file drops, follow-on execution, or additional persistence mechanisms. Novel parent-child pairs stand out at low counts against routine high-count agent telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
