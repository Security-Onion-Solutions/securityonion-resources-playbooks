name: CMSTP Execution Registry Event
id: dc492e2a-ae99-4f48-a197-d03ef2c34676
description: |
  Detects a registry modification whose key path contains \cmmgr32.exe, the object the
  Microsoft Connection Manager Profile Installer (CMSTP) writes when a connection profile is
  registered. On a clean endpoint this registration is infrequent and tied to deliberate profile
  installs. The CMSTP COM user-account-control bypass produces the same registration as a side
  effect: an auto-elevating COM surrogate runs an attacker-supplied INF at high integrity, which
  registers a cmmgr32.exe profile object and can spawn a high-integrity child with no consent
  prompt. The signed, on-disk cmstp.exe can also be driven with an INF that fetches and runs a
  remote scriptlet. Investigate what value was written, which process wrote it and what launched
  that process, whether cmstp.exe ran with an INF or scriptlet payload, whether a high-integrity
  child spawned, whether payload files were staged, whether outbound connections followed, and
  whether the registration persisted.
type: detection
detection_id: b6d235fc-1d38-4b12-adbe-325f06728f37
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting registry write target a cmmgr32.exe Connection Manager profile object?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when
    a registry key path containing \cmmgr32.exe is written, regardless of the value data. Review the
    exact TargetObject, its value data, and the writing process on the triggering event. The profile
    installer registers cmmgr32.exe objects during connection-profile setup, and the auto-elevating
    COM interface performs the same registration when it runs an INF at high integrity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to install Connection Manager profiles?
  context: >-
    Legitimate CMSTP profile installs are rare in modern enterprise environments, so knowing whether
    the writing account and host function match any sanctioned activity is often the fastest way to
    separate an administrative action from an elevation bypass. The bypass performs the write under
    an auto-elevating surrogate, so the account is frequently a machine account or SYSTEM; when User
    attribution is a machine account or missing, pivot on the writing process instead. User is present
    on roughly 94% of endpoint registry events.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which cmmgr32.exe registry value was written, and why is this a CMSTP abuse location?
  context: >-
    The profile installer registers cmmgr32.exe objects such as ProfileInstallPath during connection
    setup, and the auto-elevating COM interface performs the same registration as a side effect of
    running an attacker INF at high integrity. Confirming the exact key path, value data, and writing
    process establishes this as the CMSTP registration artifact rather than an unrelated edit. Known-good
    profile entries for sanctioned installs can be treated as a baseline to suppress; anything outside
    that set is the signal.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value data was written to the cmmgr32.exe object?
  context: >-
    Decode the Details field. A profile install path such as C:\ProgramData\Microsoft\Network\Connections\Cm
    is expected for a normal registration, whereas an unusual path, an executable or scriptlet reference,
    or encoded content indicates the object is being used to stage code. If Details references a file path,
    that path becomes a lead for confirming a payload on disk. Details is present on roughly 79% of registry
    modifications.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote this registry object, and what launched it?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to read
    its Image, full command, and parent. A COM surrogate process, cmstp.exe, or a script host such as
    wscript.exe or mshta.exe writing this object points to the COM auto-elevation or an INF-driven install
    rather than a deliberate administrator action. The parent chain distinguishes a scripted operation
    from an interactive console action.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: How was CMSTP invoked on this host — through cmstp.exe with an INF payload or the auto-elevating COM interface?
  context: >-
    cmstp.exe is a signed Microsoft binary, and being signed and on-disk by default lets it pass weakly
    configured application allowlists. Run as cmstp.exe /s against an INF, it executes a local or remote
    scriptlet the INF references through an UnregisterOCXSection that calls scrobj.dll. The COM path invokes
    the auto-elevating CMSTPLUA and CMLUAUTIL interfaces directly through a surrogate, with the interface
    CLSID visible in the surrogate command line. Decode the arguments for INF or scriptlet paths, remote
    URLs, or the COM CLSID; suppress the known signed profile-install usage and focus on anything else.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cmstp:
        host.name|expand: '%hostname%'
        Image|endswith: '\cmstp.exe'
      selection_com:
        host.name|expand: '%hostname%'
        CommandLine|contains:
          - '3E5FC7F9-9A51-4367-9063-A120244FBEC7'
          - '3E000D72-A845-4CD9-BD83-80C07C3B881F'
      condition: selection_cmstp or selection_com
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Were INF, SCT, or DLL payload files written to this host before the registration?
  context: >-
    CMSTP abuse commonly stages a weaponized INF that carries a RunPreSetupCommandSection or an
    UnregisterOCXSection, a local or remote .SCT scriptlet, or a DLL that the profile install loads.
    File creation of these types near the registration, especially under user-writable locations such
    as Temp, AppData, ProgramData, or Public, is the drop that precedes execution. Tune the suspicious-INF
    match to suppress known-safe profile files. File writes carry no hash, so pivot a dropped path to its
    later execution to obtain reputation on the payload.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith:
          - '.inf'
          - '.sct'
          - '.dll'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did cmstp.exe make outbound network connections while running the profile install?
  context: >-
    In the fetch-and-execute method, cmstp.exe reaches out to a remote host to pull the scriptlet or a
    second-stage payload referenced by the INF; an outbound egress connection from the profile installer
    is not part of a normal local install. Connections to sanctioned enterprise domains or address ranges
    can be treated as a baseline to suppress, leaving external destinations as the signal. Destination
    hostname is sparsely recorded on connection events, so anchor on the destination address and port and
    pivot to name resolution separately if a domain is needed.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\cmstp.exe'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Did the profile installer or its COM surrogate perform process-injection API calls?
  context: >-
    The COM auto-elevation this bypass uses is a handle-open against a target process to run code at high
    integrity, and that read-side handle access is not recorded in endpoint telemetry, so it is a known
    visibility gap. This query surfaces the injection-side write primitives — memory writes, queued APCs,
    and hook installs — that an operator may issue after elevating. Absence of these calls does not rule
    out the COM elevation itself; correlate with the high-integrity child process instead.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        event.dataset: endpoint.events.api
        process.Ext.api.name:
          - WriteProcessMemory
          - QueueUserAPC
          - SetWindowsHookEx
      condition: selection
    fields:
      - Image
      - process.Ext.api.name
- question: After the registration, did the writing process spawn a high-integrity child process?
  context: >-
    The COM auto-elevation completes when the surrogate spawns a child, commonly cmd.exe or powershell.exe,
    at high integrity with no consent prompt. Listing children of the writing process in the window after
    the registration reveals whether elevation succeeded and what ran. A non-installer child such as a
    command interpreter shortly after the write ties the registration to the elevation attempt.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: Does the cmmgr32.exe registration persist, or was the object re-modified afterward?
  context: >-
    Registry key and value deletions are not observable in this telemetry, so durability is judged from
    the object's re-modification history rather than from a delete event. A registration written and then
    overwritten or reverted shortly after suggests transient use to trigger the elevation, while a value
    that remains is a durable profile object. Compare the value data written to this object over the
    following window.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Has this cmmgr32.exe object been modified before on this host?
  context: >-
    Connection-profile registrations are infrequent on a typical endpoint, so a history with no prior
    writes makes this a first-time change and raises its weight. A history of periodic writes to the same
    object points instead to a management process or a repeatedly run profile tool. Compare the historical
    value data to see whether the same value was set before or whether this is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same registry object modified on other hosts in the environment?
  context: >-
    The same registration across many hosts suggests a broad profile deployment or a policy push; the same
    write confined to one host suggests targeted CMSTP abuse. Compare the value data and the writing process
    across hosts to see whether they all register the same object consistently or whether this host stands
    apart.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor who abuses CMSTP for elevation often makes other configuration changes in the same session,
    such as additional class hijacks for other auto-elevating binaries, security-tool or firewall policy
    edits, or persistence keys. Clustering the registry writes on this host in a short window around the
    alert reveals the full scope of changes and which process made them. The triggering object appears in
    the results; the signal is what else was modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A proxy-execution bypass rarely happens in isolation. Aggregating process activity in a tight window
    around the alert surfaces what led to the registration and what ran immediately after it. Novel
    parent-child pairs stand out at low counts against high-count routine telemetry, which is what points
    to the tool that staged the abuse and any elevated follow-on.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host, such as execution of scripting tools, reconnaissance, or defense
    tampering, may reveal the stages that preceded this registration and help reconstruct the timeline. A
    CMSTP bypass is typically a means to run privileged follow-on actions, so prior alerts help place this
    write within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
