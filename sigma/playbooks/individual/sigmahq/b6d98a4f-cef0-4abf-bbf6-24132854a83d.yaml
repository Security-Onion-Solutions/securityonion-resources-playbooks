name: Remote Access Tool - GoToAssist Execution
id: 509b246e-9787-4fb4-8446-175ac28a38b1
description: |
  Detects execution of the GoToAssist / GoTo Opener remote access agent, identified by process metadata where the Description or Product is "GoTo Opener" or the Company is "LogMeIn, Inc." Any one of those metadata signatures matching triggers the rule. Remote access and remote-support software like this is legitimately used by IT help desks, but the same tools are used to establish interactive command-and-control channels and persistent access into a network. Investigation should determine whether the execution corresponds to a sanctioned support session, what external infrastructure the agent connects to, whether it persists across reboots, and whether it spawned interactive child processes consistent with hands-on remote control.
type: detection
detection_id: b6d98a4f-cef0-4abf-bbf6-24132854a83d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the process metadata match the GoTo Opener / LogMeIn signatures this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when any one of the process metadata fields matches — Description is "GoTo Opener", Product is "GoTo Opener", or Company is "LogMeIn, Inc." Review the Company, Description, and Product values on the triggering event against those signatures and note which one matched, since a renamed or repackaged binary that carries the metadata is a stronger signal than a clean vendor-signed install.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Company
      - Description
      - Product
- question: Is this user and host expected to run remote access support software?
  context: Legitimate remote-support activity is usually limited to specific users (help-desk staff, the host's own user during a support call) and specific hosts. Knowing whether the user role and host function are consistent with running a remote access agent is often the fastest path to distinguishing a sanctioned support session from attacker-deployed or shadow-IT remote access.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is GoToAssist / GoTo Opener on the organization's approved remote access software list?
  context: Organizations typically sanction a single remote access or remote-support tool for IT use. A remote access tool not on that list — even well-known commercial software — may represent shadow IT or attacker-deployed persistent access. The tool's commercial reputation does not authorize it; only its presence on the approved list does.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a current helpdesk ticket or scheduled support session explaining this remote access?
  context: Legitimate use of a remote-support agent normally correlates with an open support ticket, a scheduled maintenance window, or a user-initiated request. If no support context exists for this session, the agent may have been installed by an operator for persistent access or by a user circumventing controls.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What did the GoTo Opener process do? Decode its full command line and working directory.
  context: The full command line reveals how the agent was launched and which session or relay parameters it carries. Decode any flags, session identifiers, configuration paths, or URLs. The query returns all executions of this binary on the host within a few minutes of the alert, which captures a multi-step launch sequence (downloader stub launching the full agent) rather than a single event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned the GoTo Opener agent, and is that parent chain expected?
  context: The parent process reveals how the agent was invoked. A launch from explorer.exe or a browser download stub is consistent with an interactive user starting a support session; a launch from a script host, an Office application, or an unexpected service is more consistent with automated or operator-driven deployment. Expected parents vary by environment, so compare against what normally launches support tooling here.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What external endpoint does the GoTo Opener agent connect to, and on what port?
  context: Remote access agents establish outbound sessions to vendor relay infrastructure, cloud endpoints, or operator-controlled servers. Connections to the vendor's documented support infrastructure are expected; connections to unrelated or unusual addresses are not. Remote access software also uses configurable or non-standard high ports outside the usual web ports — for example ports such as 7070 or 5650 — so review the destination port alongside the address. Session duration and a sustained, low-volume connection pattern are consistent with an interactive control channel.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: What child processes did the GoTo Opener agent spawn afterward?
  context: An interactive remote control session is observable as child processes spawned by the agent. Command interpreters (cmd.exe, powershell.exe), file-management utilities, or reconnaissance binaries spawned by the remote access parent indicate hands-on-keyboard activity through the session rather than a passive idle connection. A support agent that only waits for an operator typically spawns few or no children.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What files did the remote access agent write to disk, and were any dropped into user-writable or temporary locations?
  context: Installation or first use of a remote access tool leaves files on disk — the agent executable, configuration, and session state. Agents or services that execute from user-writable or temporary directories rather than a standard installation path are a deviation worth chasing, since legitimate vendor installs land in protected program directories. Review what the agent wrote and where.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was a service or autorun entry created on this host around the time of the alert that would relaunch a remote access agent?
  context: Remote access tools establish persistence by registering a service or an autorun entry so the channel survives reboots and logoffs. Service installation and autorun-creation events on this host in the window around the alert indicate the tool was set up for durable access rather than a one-time interactive session. Review the parent process and command line behind any such service or service-control activity.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_service:
        CommandLine|contains:
          - 'sc create'
          - 'sc config'
          - 'New-Service'
          - 'schtasks /create'
          - 'reg add'
          - '\CurrentVersion\Run'
          - 'svchost'
      condition: selection_host and selection_service
    fields:
      - Image
      - CommandLine
      - User
- question: Does this host normally run the GoTo Opener agent?
  context: An agent that has never been seen on a host is more suspicious than one that runs regularly as part of sanctioned support. Zero or very low historical counts over the trailing window indicate first-time or rare execution, which strengthens the case for treating this as operator-deployed access.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even a sanctioned support tool has a normal usage pattern. The query mirrors the rule's metadata selection scoped to this host, so the resulting parent/user distribution reflects how this specific firing pattern has historically run here rather than generic binary usage. A new parent process, an unexpected user account, or an unusual launch pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: GoTo Opener
      - Product: GoTo Opener
      - Company: LogMeIn, Inc.
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: GoTo Opener
      - Product: GoTo Opener
      - Company: LogMeIn, Inc.
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: GoTo Opener
      - Product: GoTo Opener
      - Company: LogMeIn, Inc.
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in the surrounding window reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity on several hosts, the scope of the remote access may be larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: GoTo Opener
      - Product: GoTo Opener
      - Company: LogMeIn, Inc.
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to the agent launch, what happened after, and whether it is part of a larger sequence. Aggregating by parent and child binary collapses repetitive telemetry into high-count rows while novel parent-child pairs stand out at low counts.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: 'Earlier detections on the same host may reveal the stages that preceded the remote access execution. Look for patterns: reconnaissance or credential access followed by tool deployment, or defense tampering followed by establishment of an interactive channel. The alert timeline helps reconstruct how the access was obtained.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
