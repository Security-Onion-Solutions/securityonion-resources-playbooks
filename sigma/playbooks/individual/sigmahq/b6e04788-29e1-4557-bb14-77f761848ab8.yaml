name: Potentially Suspicious File Download From File Sharing Domain Via PowerShell.EXE
id: b63aa23f-17cc-4f4c-a695-57e93a401546
description: |
  Detects powershell.exe or pwsh.exe invoking a download cmdlet (.DownloadString(, .DownloadFile(, Invoke-WebRequest, iwr, wget) against a known file-sharing or paste/CDN domain. The rule fires only when all three conditions hold together: the binary is PowerShell, the command line references one of the listed sharing domains, and a download primitive is present. Legitimate use exists (developers pulling scripts from a paste/CDN, IT automation fetching tooling), but these domains are also common staging points for second-stage payloads delivered through PowerShell download cradles. Investigation should establish what was fetched, whether it landed on disk, what spawned PowerShell, and whether security controls were weakened beforehand.
type: detection
detection_id: b6e04788-29e1-4557-bb14-77f761848ab8
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line show PowerShell fetching from a file-sharing domain with a download cmdlet?
  context: Confirm the alert is a true positive. The rule fires only when PowerShell (powershell.exe or pwsh.exe) AND a listed file-sharing or paste/CDN domain AND a download primitive (.DownloadString(, .DownloadFile(, Invoke-WebRequest, iwr, wget) all appear together in one command line. Read the exact command line and verify all three elements are present, and note which domain and which download primitive fired.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to download files from external sharing domains via PowerShell?
  context: Legitimate administrative or developer activity can pull scripts and tooling from paste sites and CDNs. Knowing whether this user's role and this host's function involve command-line downloads from external sharing domains is often the fastest way to separate routine work from a delivery attempt.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What did this PowerShell download command do? Decode the full command line, the source URL, and the destination.
  context: Decode every argument of the alerting command line. Identify the full source URL on the sharing domain, the download primitive used, the local destination path, and whether the fetched content is executed inline (for example a download-and-run cradle) or only saved. The query scopes to PowerShell download invocations on this host within the window so a multi-step fetch-then-execute sequence is visible together rather than as a single isolated event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains:
          - .DownloadString(
          - .DownloadFile(
          - 'Invoke-WebRequest '
          - 'iwr '
          - 'wget '
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Was the command encoded or obfuscated, and what does the download cradle decode to?
  context: PowerShell download cradles are frequently wrapped in -EncodedCommand (-enc) base64, string concatenation, backtick escaping, or variable substitution to hide the source URL and the executed payload. Decode any encoding to recover the actual fetch-and-run logic. For readable cradles such as IEX(IWR(...)) or Net.WebClient.DownloadString, identify the source URL being fetched and executed and check its reputation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the full deobfuscated download script?
  context: Script block logging records the deobfuscated script content PowerShell actually executed, even when the command line is encoded or obfuscated. This gives ground truth on the download URL and any follow-on execution. If PowerShell operational logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell or endpoint security controls bypassed or weakened before this download?
  context: Operators often disable or bypass protections before running a download cradle. Common precursors include AMSI bypass, execution-policy changes (-ExecutionPolicy Bypass or -ep bypass), real-time monitoring changes via Set-MpPreference, and PowerShell version-2 downgrade to evade logging. Finding these before the download strengthens the case for malicious activity.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: What is the content of the downloaded file? Check for obfuscation, encoded strings, and known malware indicators.
  context: Read and analyze the fetched file's actual content. For scripts and text payloads check for base64 encoding, obfuscated strings, embedded URLs or IPs, and known malware string patterns. For binaries check imports, embedded strings, packer signatures, and signing status. This content analysis answers what is in the file, separate from any hash-reputation lookup. Retrieval typically requires pulling the file from the endpoint.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Is the downloaded file still on disk for analysis?
  context: If the command references a downloaded payload or output file, checking whether it still exists on disk enables deeper analysis such as hash lookups, sandbox submission, or content review. A missing file may indicate cleanup or in-memory-only execution.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was the download successful? Check for file creation at the destination.
  context: A download command does not guarantee the file was retrieved. Network errors, blocked URLs, or security controls may have stopped the transfer. Confirming file creation at the target path establishes whether the activity progressed past the delivery stage.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: If the downloaded payload was executed, what is its hash for a threat-intelligence check?
  context: The hash for a reputation lookup is recorded when the payload runs, not when PowerShell fetches it from the file-sharing domain — file-creation events carry no hash. If the same command ran it, the payload is a child or sibling of the alerting process, so this query returns those processes with their executable hashes. If it executed in memory (IEX) or was run later by an unrelated process, this returns nothing — review script-block logging, or retrieve the file from disk and hash it manually.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      selection_siblings:
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: 1 of selection_*
    fields:
      - Image
      - Hashes
      - Hashes
- question: What other file activity occurred in the download target directory?
  context: Download cradles often pull multiple files into the same staging directory, or the fetched file triggers further writes such as extraction, decompression, or additional downloads. Examining directory-level file activity reveals the broader scope of the delivery operation.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process spawned this PowerShell instance, and is that parent chain expected?
  context: The parent process reveals how PowerShell was invoked. User-driven downloads usually descend from explorer.exe or a terminal; downloads launched by an unusual parent such as a server process, an Office application, mshta.exe, wscript.exe, or an exploited service point toward delivery through another foothold. The parent is visible in the alert, so also consider what spawned the parent and what else the parent launched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: This counts fleet-wide firings of the rule's exact pattern (PowerShell plus a listed sharing domain plus a download primitive), not generic PowerShell use. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_websites:
        CommandLine|contains:
        - anonfiles.com
        - cdn.discordapp.com
        - ddns.net
        - dl.dropboxusercontent.com
        - ghostbin.co
        - glitch.me
        - gofile.io
        - hastebin.com
        - mediafire.com
        - mega.nz
        - onrender.com
        - pages.dev
        - paste.ee
        - pastebin.com
        - pastebin.pl
        - pastetext.net
        - pixeldrain.com
        - privatlab.com
        - privatlab.net
        - send.exploit.in
        - sendspace.com
        - storage.googleapis.com
        - storjshare.io
        - supabase.co
        - temp.sh
        - transfer.sh
        - trycloudflare.com
        - ufile.io
        - w3spaces.com
        - workers.dev
      selection_download:
        CommandLine|contains:
        - .DownloadString(
        - .DownloadFile(
        - 'Invoke-WebRequest '
        - 'iwr '
        - 'wget '
      condition: all of selection_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host such as defense tampering, reconnaissance, or credential access may reveal the stages that preceded this download and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_websites:
        CommandLine|contains:
        - 0x0.st
        - anonfiles.com
        - bashupload.com
        - cdn.discordapp.com
        - chunk.io
        - ddns.net
