name: DLL Search Order Hijackig Via Additional Space in Path
id: c1b597a1-f43f-4f70-b3bd-30efb3ca5d20
description: |
  Detects a DLL written into a directory whose name imitates a Windows system folder but carries an
  extra space before the trailing backslash - a path beginning C:\Windows \, C:\Program Files \, or
  C:\Program Files (x86) \. Windows resolves these look-alike directories as distinct filesystem
  locations, so an attacker who copies an auto-elevating or otherwise trusted system binary into the
  mock directory and drops a same-named DLL beside it can force that binary to load the attacker DLL
  through the normal search order, gaining execution under a trusted or higher-integrity process.
  Legitimate software effectively never creates these trailing-space system-folder look-alikes;
  investigate what wrote the DLL and what launched it, whether the DLL is signed and what it contains,
  whether a trusted binary subsequently loaded it, and whether the same artifact appears elsewhere in
  the environment.
type: detection
detection_id: b6f91281-20aa-446a-b986-38a92813a18f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Was a .dll written into a system-folder look-alike directory whose name carries an extra space before the backslash?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a
    file ending in .dll is created under a path that begins C:\Windows \, C:\Program Files \, or
    C:\Program Files (x86) \ - a directory name that imitates a real system folder but inserts a space
    before the trailing backslash so Windows treats it as a separate location. Review the exact
    TargetFilename and the responsible process on the triggering event to confirm both the mock-directory
    prefix and the .dll extension are present.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to write DLLs into system-folder paths?
  context: >-
    Legitimate installation and servicing writes DLLs into the real C:\Windows and C:\Program Files
    trees, never into a trailing-space look-alike of them. Knowing whether the writing account and host
    role match any sanctioned software deployment is often the fastest way to separate a packaging or
    build artifact from a staged hijack. When the user is a machine or service account, judge by the
    writing process and the host function instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What does this DLL contain, and is it signed?
  context: >-
    Read the on-disk file: check its exports, imports, embedded strings, packer signatures, and code
    signature. A planted hijack DLL commonly exports only the handful of functions the target binary
    imports and forwards or stubs the rest, and is frequently unsigned or self-signed rather than
    carrying the signature of the system library it impersonates. File-creation events carry no hash, so
    content and signing must be read from the on-disk artifact or from the later module-load event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: When this DLL is loaded, what is its hash and signature status, and is it known malicious?
  context: >-
    A file-creation event records no hash, but a DLL carries its hash and code-signature fields on the
    module-load event. Read the hash from a load of this file and submit it to threat intelligence, and
    compare it against the legitimate same-named system DLL to detect substitution - a mismatch between
    the loaded module and the genuine library of that name is the substitution signal. Check whether the
    module is signed and by which authority; an unsigned or unexpectedly signed module loading from a
    mock directory is the hijack payload.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What process wrote this DLL, and what launched that process?
  context: >-
    The file event carries the writing process's identifier, so pivot to its process_creation record to
    read the full command line and parent lineage. A DLL dropped into a trailing-space mock directory by
    a script host such as wscript.exe, mshta.exe, or powershell.exe, by a child of an Office application,
    or by an unsigned binary points to a staged hijack rather than a routine installer. The parent chain
    distinguishes a scripted operation from a deliberate interactive action.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Did a process load this DLL after it was written, and which process was it?
  context: >-
    The hijack fires when a binary in the mock directory loads the planted DLL through the normal search
    order. The loading process's Image reveals whether a signed or auto-elevating system binary picked
    up the DLL - the hijack succeeding under a trusted process - or whether nothing has loaded it yet.
    Correlate the load time against the write to establish the file-creation to module-load window;
    applications expected to load libraries from non-standard directories (development tools, some
    packaged software) temper suspicion, while a trusted system binary loading from a look-alike path
    does not.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - ProcessGuid
      - ImageLoaded
- question: Were registry keys that influence DLL loading modified on this host around the alert?
  context: >-
    DLL hijacking has registry-based variants that redirect or force library loads without the
    filesystem trick - modifications to KnownDLLs, AppInit_DLLs, the search PATH, or per-application App
    Paths achieve a comparable outcome and may accompany a mock-directory drop as a parallel or backup
    mechanism. Key and value deletions are not observable in this telemetry, so judge from the
    modification history; an unexpected write to any of these keys near the DLL drop widens the scope of
    the operation.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\Session Manager\KnownDLLs'
          - '\Windows\AppInit_DLLs'
          - '\Session Manager\Environment\Path'
          - '\App Paths\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Has a DLL with this name been written to this host before?
  context: >-
    A file that has never appeared on a host is more suspicious than one that is part of normal
    operations. First appearance of the planted DLL raises its weight; a same-named DLL with prior
    history only in legitimate locations may indicate the attacker chose a name that mirrors a real
    system library. Zero or very low prior writes to the mock path is the first-time signal.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Was a DLL with this name written on other hosts in the environment?
  context: >-
    The same artifact appearing on multiple hosts points to a distribution or tooling rollout; confined
    to one host it points to a targeted operation. Compare the writing process and the target paths
    across hosts to see whether they all plant the same DLL through the same mechanism, which separates a
    single hands-on operation from repeated use of the technique across the environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- question: What other files did the process that dropped this DLL write or delete around the alert?
  context: >-
    A process that stages a hijack often writes several files - a copied auto-elevating system binary to
    run alongside the DLL, additional libraries, or a loader. The breadth, paths, and extensions of the
    writing process's other file activity, including that of its direct children, distinguish a single
    dropped artifact from a fuller staging operation and enumerate what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to these mock system directories on this host, and by which processes?
  context: >-
    A trailing-space look-alike of a system folder is not a normal filesystem location, so any file
    written under one belongs to the same activity. Other arrivals in these directories - additional
    DLLs, a copied auto-elevating system binary, or a loader - reveal whether this is an isolated drop or
    a directory under active use, and the writing process across those files identifies the tool that
    staged the hijack.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - 'C:\Windows \'
          - 'C:\Program Files \'
          - 'C:\Program Files (x86) \'
      condition: selection
    fields:
      - TargetFilename
      - Image
- always_include: true
  question: Has this user written DLLs to these mock system directories before, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, so the result is the user's 90-day
    history of this specific firing pattern - DLLs written to a trailing-space system-folder look-alike -
    aggregated by host, not their generic use of any tool. A user who has never produced this pattern is
    more suspicious than one who does so regularly; weigh the count against the user's role and typical
    toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith:
        - C:\Windows \
        - C:\Program Files \
        - C:\Program Files (x86) \
        TargetFilename|endswith: .dll
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this DLL-drop pattern, or is the program new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute behavior, so the
    meaningful pivot is the launch mechanism. The query mirrors the rule's selection scoped to the
    alerting program, giving the 90-day history of this program driving this specific pattern. A
    new or rare program for this pattern is the deviation worth chasing; a program that already accounts
    for many prior events is more likely vendor or operating-system automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith:
        - C:\Windows \
        - C:\Program Files \
        - C:\Program Files (x86) \
        TargetFilename|endswith: .dll
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the account's activity across all hosts reveals whether the DLL drop is isolated or part of
    wider hands-on-keyboard action. If the same user triggered similar activity on multiple endpoints in
    the same window, the scope of the operation may be larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven DLL-drop pattern fire on other hosts in the same window?
  context: >-
    Under a service principal, network-wide user activity returns agent-telemetry noise, so the
    meaningful question is whether the same launch mechanism fired elsewhere. The query mirrors the
    rule's selection scoped to the alerting program, fleet-wide, in the alert window. Multiple
    hosts in the same window points to scheduled or pushed automation; a single host points to a
    host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith:
        - C:\Windows \
        - C:\Program Files \
        - C:\Program Files (x86) \
        TargetFilename|endswith: .dll
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A hijack drop rarely happens in isolation. Aggregating process activity in a tight window around the
    alert surfaces what led up to the DLL write and what ran immediately after it. Novel parent-child
    pairs stand out at low counts against high-count routine telemetry, which is what points to the tool
    that staged the drop and to any binary launched to load the planted library.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Is this DLL still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives both urgency and next steps. A DLL still on disk can be
    retrieved, hashed, and analyzed; a file deleted or renamed shortly after creation suggests
    anti-forensic cleanup once the target binary loaded it, and shifts the investigation toward what
    executed in between. Interpret the operation type on each subsequent event for this path.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Were files dropped to Startup or scheduled-task locations on this host around the alert?
  context: >-
    Search-order hijacking gives execution under a trusted process; attackers frequently pair it with a
    separate autostart foothold so access survives independently. Dropping an executable or script into a
    Startup folder or a path referenced by a registry Run key achieves persistence without invoking
    schtasks, sc, or reg. File writes to these locations near the DLL drop indicate a parallel
    persistence mechanism established on disk.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
