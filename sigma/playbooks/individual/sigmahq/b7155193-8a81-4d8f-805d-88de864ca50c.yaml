name: UNC2452 PowerShell Pattern
id: 073a5559-0edc-439b-a010-8732ffe25c98
description: |
  Detects a command line that either pairs `Invoke-WMIMethod win32_process -name create -argumentlist`
  with `rundll32 c:\windows`, or pairs `wmic /node:` with `process call create "rundll32 c:\windows`.
  Each branch requires both of its strings together, and either branch alone fires the rule. Both are the
  same operation expressed through different clients: Windows Management Instrumentation is used to create
  a process — normally on a remote machine named by `-ComputerName` or `/node:` — and that process is
  rundll32 executing an exported function from a DLL staged under C:\Windows. WMI process creation is a
  standard remote-administration mechanism (T1047), and rundll32 is a signed system binary, so the
  combination gives execution on another host without copying an EXE or creating a service; the DLL path
  under C:\Windows lets the payload sit among operating-system files. Legitimate remote administration and
  software deployment do use WMI process creation, but rarely to run rundll32 against a DLL in a Windows
  subdirectory. The investigation should establish which branch fired, which remote host was named, what
  DLL and export were passed to rundll32, whether that DLL is signed and known, and whether the same
  command pattern reached other hosts.
type: detection
detection_id: b7155193-8a81-4d8f-805d-88de864ca50c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Does the command line contain either the `Invoke-WMIMethod win32_process` create pattern or the
    `wmic /node:` process-call-create pattern, launching rundll32 from a C:\Windows path?
  context: >-
    The rule has two independent branches and each requires both of its strings together. One branch needs
    `Invoke-WMIMethod win32_process -name create -argumentlist` and `rundll32 c:\windows` in the same
    command line; the other needs `wmic /node:` and `process call create "rundll32 c:\windows`. Note which
    branch fired, because it tells you which client issued the call and where to look next — the
    Invoke-WMIMethod branch means a PowerShell session made the WMI call and PowerShell script block
    evidence is available, while the wmic branch means wmic.exe made it and no PowerShell record exists.
    Either branch names a target machine and a DLL plus export, which the remaining questions build on.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this WMI remote process creation part of an authorized penetration test or red team engagement?
  context: >-
    Remote process creation through WMI is a routine step in authorized security assessments and in some
    administrative tooling. Before investing investigation time, check whether an assessment is active on
    this host or network segment. An authorized engagement whose scope and timing match the alert resolves
    it without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: Is this user and host expected to create processes on remote systems via WMI?
  context: >-
    WMI process creation against a named remote machine is normally issued from administrative
    workstations, management servers, or deployment infrastructure by accounts that hold remote-admin
    rights. A general-purpose workstation or a standard user account issuing it is a deviation worth
    following. Knowing the host's function and the account's role is often the fastest way to separate
    routine administration from unexpected activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Which remote machine was named, and which DLL path and export function were passed to rundll32?
  context: >-
    The command line carries three specifics that determine the scope of the investigation. The
    `-ComputerName` value or the `/node:` value names the machine where the process is created, which is a
    second host to examine. The DLL path after `rundll32` is the payload location — record the full path
    and file name. The token after the DLL path is the export that gets called; loaders commonly borrow
    innocuous-looking export names from open-source projects so the argument reads like a normal API call.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Is the DLL referenced in the command line still on disk for analysis?
  context: >-
    The command line names a DLL path under C:\Windows. If that file is still present it can be hashed,
    submitted for analysis, or reviewed directly. This query surfaces file activity by the alerting process
    and its direct children, which shows whether the process itself staged or removed files locally; the
    DLL named for a remote target must be checked on that remote machine at the path from the command line.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Was any part of this command encoded or obfuscated, and what does the full argument list read as once decoded?
  context: >-
    The strings the rule matches are plain text, so the WMI call itself is already readable, but the
    surrounding invocation frequently is not. Check whether the command arrived through `-EncodedCommand`
    or `-enc`, whether backticks, string concatenation, or variable substitution were used to assemble the
    DLL path or export name, and whether the argument list itself contains a second encoded layer. Work the
    command down to plain text before judging it, and record the resolved DLL path, export, and target
    machine.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: What is inside the DLL named on the command line — is it a loader, and what does the named export do?
  context: >-
    Retrieve the DLL from the path in the command line and analyze the content rather than the name. Check
    the export table for the function the command calls, look at imports, section entropy, and embedded
    strings for packing or an encrypted blob, and see whether the file is built from a modified copy of a
    legitimate open-source project — a technique that produces a plausible export list around a small
    amount of added code. This query lists the alerting process and any children it spawned locally so the
    paths and working directories are together in one view; the file content itself has to be pulled from
    the endpoint.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - CommandLine
      - Image
      - CurrentDirectory
  answer_sources:
  - manual_review
  - safe_environment
  - external_threat_intel
- question: Which DLLs did rundll32 load on this host around the alert, and is the one named in the command signed and known?
  context: >-
    A DLL carries its hash and signature data on the load event, so a load record answers both what ran and
    whether it is known. Match the loaded path against the path in the command line, then check the
    signature status and submit the hash to threat intel. Legitimate DLLs under C:\Windows are almost
    always Microsoft-signed; an unsigned or third-party-signed DLL in a Windows subdirectory is the
    deviation. If the command named a remote machine, rundll32 executed there and this host-scoped query
    returns only local rundll32 loads — run the equivalent check on the named target.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\rundll32.exe'
        ImageLoaded|startswith: 'C:\Windows\'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - external_threat_intel
  - manual_review
- question: Which remote systems did the alerting process connect to, and on which ports?
  context: >-
    Remote WMI process creation is a network operation — the client contacts the target over DCOM on TCP
    135 and then a dynamically assigned high port, and related tooling often uses TCP 445 alongside it.
    The connections made by the alerting process confirm whether the call actually reached the machine
    named on the command line, and reveal any additional targets contacted in the same window that the
    single alerting command line does not show.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
      - Image
  answer_sources:
  - network_connection
- question: Did the WMI service on this host also record provider loads or event-subscription activity around the alert?
  context: >-
    The WMI-Activity operational channel records provider loads (5857) and the registration of temporary
    (5860) and permanent (5861) event subscriptions. Process creation through the Win32_Process provider
    and subscription-based persistence use the same service, so a host where an operator is driving WMI
    execution is worth checking for subscriptions left behind under `\root\subscription`. Subscription
    registrations here are a persistence finding independent of this alert. This channel is not shipped by
    every host, so treat zero results as a possible visibility gap rather than confirmation that no WMI
    activity occurred.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: wmi
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 5857
          - 5860
          - 5861
      condition: selection
    fields:
      - EventID
      - winlog.user_data.ProviderName
      - winlog.user_data.CONSUMER
      - winlog.user_data.Query
      - message
  answer_sources:
  - manual_review
- question: Did PowerShell script block logging capture the full script that issued the WMI call?
  context: >-
    Windows Event ID 4104 records the deobfuscated script content PowerShell actually executes, so it shows
    the resolved DLL path, export, and target machine even when the command line was encoded, and it shows
    the surrounding script — loops over host lists, credential objects, and any follow-up cmdlets — that a
    single command line does not. This is the highest-value evidence for the Invoke-WMIMethod branch. The
    wmic branch does not run through PowerShell and will not produce 4104 events. If PowerShell operational
    logs are not ingested in this environment, zero results mean the events were not collected rather than
    that no script ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
  answer_sources:
  - powershell_script_block
- question: >-
    When this host has previously produced this WMI-plus-rundll32 command pattern, what parents and users
    drove it, and does the current alert fit that history?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user
    distribution reflects how this specific command pattern has historically run here rather than generic
    WMI or PowerShell usage. A deployment tool or a management agent that already produces this pattern
    regularly is a different finding from a first occurrence. A new parent process, an unexpected account,
    or a first-ever appearance is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cli_1:
        CommandLine|contains|all:
        - Invoke-WMIMethod win32_process -name create -argumentlist
        - rundll32 c:\windows
      selection_cli_2:
        CommandLine|contains|all:
        - 'wmic /node:'
        - process call create "rundll32 c:\windows
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: >-
    Have other hosts produced this command pattern in the past week, and does the cross-host distribution
    look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, giving a fleet-wide count of this
    specific WMI-plus-rundll32 pattern rather than the generic footprint of PowerShell or wmic. Many hosts
    producing the identical pattern points to scripted deployment or vendor automation. One host, or a small
    set of hosts with no administrative relationship, points to operator-driven activity — and because each
    command names a remote target, a handful of sources can still reach a much larger set of machines. Use
    the host distribution together with parent and user consistency to calibrate the response.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cli_1:
        CommandLine|contains|all:
        - Invoke-WMIMethod win32_process -name create -argumentlist
        - rundll32 c:\windows
      selection_cli_2:
        CommandLine|contains|all:
        - 'wmic /node:'
        - process call create "rundll32 c:\windows
      condition: 1 of selection_*
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Has this user previously produced this command pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the account's
    90-day history of this specific WMI-plus-rundll32 pattern rather than generic use of PowerShell or
    wmic, aggregated by host. An account that has never produced it before is a different finding from a
    deployment account that produces it weekly. Weigh the count and host spread against the account's role
    and whether remote administration is part of it.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cli_1:
        CommandLine|contains|all:
        - Invoke-WMIMethod win32_process -name create -argumentlist
        - rundll32 c:\windows
      selection_cli_2:
        CommandLine|contains|all:
        - 'wmic /node:'
        - process call create "rundll32 c:\windows
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: >-
    Has this parent process historically driven this command pattern here or elsewhere, or is the parent
    new for this activity?
  context: >-
    When the alert fires under SYSTEM, a service account, or a computer account, the user field does not
    attribute the behavior and the launch mechanism is the meaningful pivot. The query mirrors the rule's
    selection structure scoped to the alerting parent process, giving the 90-day history of that parent
    driving this pattern, aggregated by host. A parent that already accounts for large volumes across many
    hosts is management or vendor automation; a parent that is new for this pattern, or one that is not a
    normal launcher of remote-administration commands at all, is the deviation worth chasing.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cli_1:
        CommandLine|contains|all:
        - Invoke-WMIMethod win32_process -name create -argumentlist
        - rundll32 c:\windows
      selection_cli_2:
        CommandLine|contains|all:
        - 'wmic /node:'
        - process call create "rundll32 c:\windows
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the account's activity across all hosts in the alert window shows whether the WMI call was an
    isolated action or one step in a sequence — reconnaissance, credential access, or execution on other
    machines. Because this rule fires on a command that acts on a remote target, an account appearing on
    several hosts in the same window changes the scope of the investigation. When the alert fires under a
    service principal this returns broad agent telemetry rather than an actor's activity.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did this same parent-driven command pattern fire on other hosts in the same window?
  context: >-
    Under a service principal, asking what else the user did returns agent telemetry from every host rather
    than an actor's trail. The launch mechanism answers the question instead. The query mirrors the rule's
    selection structure scoped to the alerting parent process, fleet-wide, within the alert window. Several
    hosts in the same window points to scheduled or pushed automation; a single host points to a host-local
    trigger and, given that each command names a remote target, to an operator working from that host.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cli_1:
        CommandLine|contains|all:
        - Invoke-WMIMethod win32_process -name create -argumentlist
        - rundll32 c:\windows
      selection_cli_2:
        CommandLine|contains|all:
        - 'wmic /node:'
        - process call create "rundll32 c:\windows
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Remote execution normally sits in the middle of a sequence rather than at its start — an account has to
    be obtained and a target list built before a machine is named on a WMI command line. Earlier detections
    on this host covering credential access, discovery of hosts or domain objects, or defense tampering
    place this event in that sequence and identify the stages to reconstruct. An empty result keeps the
    alert as a single unexplained event rather than clearing it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
