name: Potential Russian APT Credential Theft Activity
id: 29993970-f483-422a-8b20-d9ffd2fa8dc2
description: |
  Detects command lines that either recursively copy a domain controller's SYSVOL share with xcopy
  (`/S /E /C /Q /H` against a `\\...\sysvol\` UNC path) or run an AD Explorer snapshot that writes a
  `.snp` file into a user's Downloads folder. Either action collects credential-bearing or directory
  data into files that can be carried off the host: SYSVOL holds Group Policy Preferences XML whose
  `cpassword` attribute is recoverable with a published static key, plus logon scripts that frequently
  embed service or mapped-drive account passwords, while an AD Explorer snapshot is an offline copy of
  directory objects and attributes. Both commands also appear in backup, migration, and authorized
  audit work, so the investigation should establish which branch fired, whether the activity was
  sanctioned, what the destination path actually holds, whether the collected data left the host, and
  which accounts need rotation.
type: detection
detection_id: b83f5166-9237-4b5e-9cd4-7b5d52f4d8ee
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the command line match either the SYSVOL copy branch or the AD Explorer snapshot branch of this rule?
  context: >-
    Confirm the alert against the two branches this rule matches, and note which one fired, because the
    branch decides where the rest of the investigation looks. The first branch needs an xcopy command
    carrying both `xcopy /S /E /C /Q /H \\` and `\sysvol\` together, meaning a recursive, quiet copy of
    a domain controller's policy replication share. The second needs `adexplorer -snapshot ""` against
    `c:\users\` together with `\downloads\` and `.snp`, meaning an Active Directory snapshot written to
    a user's Downloads folder. Either branch alone fires the rule. A SYSVOL fire points the work at
    Group Policy files and logon scripts that may carry embedded passwords; an AD Explorer fire points
    it at an offline copy of directory objects, group memberships, and attributes.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this SYSVOL copy or AD Explorer snapshot part of an authorized assessment, migration, or directory audit?
  context: >-
    Both commands are routine in sanctioned work. AD Explorer snapshots are a standard directory
    inventory and change-comparison technique, administrators copy SYSVOL for backup and migration, and
    both appear in penetration tests and red team engagements. Check whether an engagement, migration,
    or audit covering this host and account is active and whether its timing matches; a scoped
    engagement with matching tooling resolves the alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: Is this user and host expected to bulk-copy a domain controller's SYSVOL share or snapshot Active Directory?
  context: >-
    Domain administrators, backup operators, and directory-audit tooling all read SYSVOL and enumerate
    the directory as part of normal operations. Knowing whether this account's role and this host's
    function are consistent with that activity is usually the fastest path to separating routine
    administration from collection. A workstation account with no directory-management duties producing
    either command is a different finding from the same command on an administrative jump host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Which capability was invoked, and what scope did the arguments request?
  context: >-
    The arguments determine how much was collected. `xcopy /S /E /C /Q /H` copies subdirectories
    including empty ones, copies hidden and system files, continues past errors, and suppresses console
    output; pointed at a `\\<dc>\sysvol\` UNC path that means the whole policy tree, Group Policy
    Preferences XML and logon scripts included. `adexplorer -snapshot ""` with an empty server argument
    targets the currently joined domain and writes the full snapshot to the `.snp` path given on the
    command line. Record the exact source share or domain and the exact destination path.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Which credential store was targeted, and which credentials would be exposed by what was collected?
  context: >-
    Neither branch touches LSASS memory or the SAM database. SYSVOL holds Group Policy Preferences XML
    (Groups.xml, Services.xml, ScheduledTasks.xml, DataSources.xml, Drives.xml, Printers.xml) whose
    `cpassword` attribute is encrypted with a published static key and therefore recoverable by anyone
    holding the file, plus logon and mapped-drive scripts that often embed service account passwords in
    cleartext. An AD Explorer snapshot holds directory objects and their attributes offline, including
    group membership and any attribute used to store a secret. Read the source path from the command to
    establish which domain and which policy tree was in reach, and list the accounts whose passwords
    would need rotation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - file_event
- question: Which credential-bearing files were written to this host, and what do they contain?
  context: >-
    A copy or snapshot only matters once the files land. This looks for the file names that carry
    secrets: Group Policy Preferences XML, which stores a `cpassword` attribute recoverable with a
    published key, and the `.snp` AD Explorer snapshot, which holds directory objects and attributes
    offline. Retrieve the files from the paths returned and read them. Any `cpassword` value present in
    Preferences XML should be treated as recovered, and every attribute in a snapshot should be treated
    as read. The file name is the anchor here, so a copy that renamed its output will not appear.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_scope:
        host.name|expand: '%hostname%'
      artifact_snapshot:
        TargetFilename|endswith: '.snp'
      artifact_gpp:
        TargetFilename|endswith:
          - '\Groups.xml'
          - '\Services.xml'
          - '\ScheduledTasks.xml'
          - '\DataSources.xml'
          - '\Drives.xml'
          - '\Printers.xml'
      condition: selection_scope and 1 of artifact_*
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
- question: Is the referenced file still on disk for analysis?
  context: >-
    The command names a destination path. Confirming the files still exist enables direct review --
    reading `cpassword` values out of Preferences XML, or opening the snapshot to see which directory
    data it holds. This lists file operations by the alerting process and its direct children, so it
    also shows the size of the collection for the SYSVOL branch. Absence of the destination matters too:
    a file created and then removed shortly afterward suggests the collection was moved off the host.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What process spawned this command, and is that parent chain expected for an administrative copy or snapshot?
  context: >-
    The parent reveals how the command was invoked. An administrator working interactively usually
    descends from explorer.exe or a console session; a backup or audit product descends from services.exe
    or its own scheduler. A remote-execution service, a script host, or an office application as parent
    indicates the command was driven by something other than a person at that keyboard. Parent process
    identifiers are not populated on every alert; if this returns nothing, read the parent from the alert
    itself and walk upward from there.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Which accounts may be compromised, and do any have elevated privileges?
  context: >-
    Exposure here follows what the collected data holds, not the account that ran the command.
    Cross-reference every account named in recovered Preferences XML or logon scripts against directory
    group memberships; treat any account whose password appears in the policy tree as exposed and
    schedule rotation, starting with service accounts, whose passwords are commonly reused across many
    hosts. A directory snapshot exposes structure, group membership, and attributes rather than
    passwords, which tells the operator what to target next rather than granting access directly.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - active_directory
  - organizational_knowledge
- question: Did any account whose credentials could have been recovered from this data log on afterward?
  context: >-
    Collected credentials get used, and the authentication is the evidence that closes the loop.
    Explicit-credential logons (4648) and successful logons (4624) from this host in the hours after the
    event show which accounts were exercised and from where. A logon under an account that appears in the
    copied policy tree, or under a service account that does not normally authenticate interactively, is
    the concrete link between collection and use. Credentials replayed from a different machine will not
    appear here, so check the same event codes on suspected destinations for those accounts. If the
    Security channel is not collected from this host, treat zero rows as a visibility gap.
  range: +4h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 4624
          - 4648
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetUserName
      - SubjectUserName
      - LogonType
      - IpAddress
  answer_sources:
  - active_directory
  - manual_review
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after this event?
  context: >-
    Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH) --
    in the hours after the event; the originating Image and User show what drove each connection. Note
    that the SYSVOL branch itself runs over 445 to the domain controller, so separate that connection
    from movement to other destinations. Two limits to keep in mind -- credentials exfiltrated and
    replayed from another machine will not appear here, and the query depends on network-connection
    telemetry being collected from this host; where it is not, treat zero rows as a visibility gap rather
    than as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
  answer_sources:
  - network_connection
- question: When this host has previously produced the rule's pattern, what parents and users drove it, and does this alert fit?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the resulting parent and
    user distribution reflects how this specific pattern -- a SYSVOL bulk copy or an AD Explorer snapshot
    -- has historically run here, not generic use of a copy utility. A recurring parent and a stable
    account point to a backup or audit routine. A parent that has never driven this pattern, or an
    account with no prior history of it, is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_xcopy:
        CommandLine|contains|all:
        - xcopy /S /E /C /Q /H \\\\
        - \sysvol\
      selection_adexplorer:
        CommandLine|contains|all:
        - adexplorer -snapshot "" c:\users\
        - \downloads\
        - .snp
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user and aggregated by host, so the
    result is the account's 90-day history of SYSVOL bulk copies and AD Explorer snapshots rather than
    its generic command usage. A directory administrator or backup operator with a steady history is a
    different finding from an account producing this pattern for the first time. Weigh the count against
    what the role actually requires.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_xcopy:
        CommandLine|contains|all:
        - xcopy /S /E /C /Q /H \\\\
        - \sysvol\
      selection_adexplorer:
        CommandLine|contains|all:
        - adexplorer -snapshot "" c:\users\
        - \downloads\
        - .snp
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Has this parent process historically driven the rule's pattern here or elsewhere, or is the parent new for this activity?
  context: >-
    When the alert fires under SYSTEM, a machine account, or another service principal, user identity
    does not attribute the behavior and the launch mechanism does. The query mirrors the rule's selection
    structure scoped to the alerting parent process, so the result is the 90-day history of that parent
    driving this specific pattern rather than generic parent-and-binary co-occurrence. A parent that
    already accounts for a long run of prior events is vendor or operating-system automation; a parent
    that is new to this pattern is the deviation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_xcopy:
        CommandLine|contains|all:
        - xcopy /S /E /C /Q /H \\\\
        - \sysvol\
      selection_adexplorer:
        CommandLine|contains|all:
        - adexplorer -snapshot "" c:\users\
        - \downloads\
        - .snp
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
- question: What else did this account do across the environment around this time?
  context: >-
    Collection from a policy tree or the directory usually sits inside a wider session -- enumeration
    before it, staging or transfer after. Tracking the account across all hosts in the surrounding hour
    shows whether the activity is confined to this host or spans several, which sets the scope of the
    investigation. If the alert fired under a service principal, expect this to return agent telemetry
    rather than operator activity, and rely on the parent-driven view instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  always_include: true
  answer_sources:
  - process_creation
- question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, an account-wide sweep returns agent telemetry rather than operator
    activity, because every host runs SYSTEM-owned agents constantly. The meaningful question is whether
    the same launch mechanism fired elsewhere: the query mirrors the rule's selection structure scoped to
    the alerting parent process, fleet-wide, in the alert window. Several hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_xcopy:
        CommandLine|contains|all:
        - xcopy /S /E /C /Q /H \\\\
        - \sysvol\
      selection_adexplorer:
        CommandLine|contains|all:
        - adexplorer -snapshot "" c:\users\
        - \downloads\
        - .snp
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of SYSVOL bulk copies and AD Explorer snapshots over the week rather than generic utility
    usage. Many hosts producing the same pattern points to a deployed backup or audit job; one host, or a
    small unrelated set, points to manual operator activity. Use the host distribution and the
    consistency of the parents to calibrate scope.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_xcopy:
        CommandLine|contains|all:
        - xcopy /S /E /C /Q /H \\\\
        - \sysvol\
      selection_adexplorer:
        CommandLine|contains|all:
        - adexplorer -snapshot "" c:\users\
        - \downloads\
        - .snp
      condition: 1 of selection_*
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Collecting policy data or a directory snapshot sits late in a sequence rather than at its start;
    something had to put the operator on this host with this account first. Earlier detections on the
    same host -- remote execution, privilege escalation, defense tampering, or reconnaissance -- indicate
    how they arrived and under which identity, which is what sets the backward scope of the
    investigation and determines which other accounts and hosts need review.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
