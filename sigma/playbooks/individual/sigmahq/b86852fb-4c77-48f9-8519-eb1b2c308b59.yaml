name: Potential Persistence Via AppCompat RegisterAppRestart Layer
id: a39122b2-43a5-45e6-b3e4-160b32cf7be6
description: |
  Detects a value written under the AppCompatFlags\Layers key whose value data contains
  REGISTERAPPRESTART. This compatibility layer makes the application compatibility engine
  register the target application with the Restart Manager via the RegisterApplicationRestart
  API, so Windows relaunches that application automatically after a crash, an update, or a
  reboot. The effect is a restart mechanism for an executable that leaves no Run key, service,
  or scheduled task behind. The value NAME under the Layers key is the full path of the
  application the layer applies to, and the key exists both per-user under HKCU and
  machine-wide under HKLM; the value data is a space-separated list of layer tokens, so other
  layers such as RUNASADMIN may be set on the same application in the same write. Some
  software and administrators set compatibility layers for genuine compatibility reasons, so
  the investigation should establish which application the layer targets, which process wrote
  the value, whether the target executable is one the environment expects, and whether that
  application subsequently ran.
type: detection
detection_id: b86852fb-4c77-48f9-8519-eb1b2c308b59
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the registry value sit under the AppCompatFlags\Layers key with REGISTERAPPRESTART in its value data?
  context: >-
    The rule fires only when both conditions hold together — the key path contains
    \SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Layers\ AND the value data
    contains REGISTERAPPRESTART. Confirm both in the triggering event, and read the value name
    at the end of the key path, which is the full path of the application the layer applies to.
    The signer columns say who published the writing process; read them for coherence with the
    application being registered rather than as a verdict, since nearly every alerting process
    is trusted-signed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - registry_event
- question: Is this user and host expected to set application compatibility layers?
  context: >-
    Compatibility layers are normally set by an installer, by an administrator working through
    the Compatibility tab of an executable's properties, or by a management tool pushing a
    known application fix. A layer set under an ordinary user's context on a workstation with
    no compatibility-remediation role is a different situation from the same write on a host
    running legacy line-of-business software. User attribution is present on roughly 94% of
    endpoint registry events; when it resolves to a machine account or SYSTEM, pivot on the
    writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What launched the process that wrote this compatibility layer value?
  context: >-
    The registry event names the writing process but not its lineage. Looking that process up
    by its own identifier returns the parent that started it, which separates an installer or
    a management agent applying a documented application fix from an interactive shell, a
    script host, or an Office application launched by a macro. Registry telemetry does not
    carry the acting process's parent, so this pivot to its own start event is the only way to
    recover it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other processes did the process that wrote this layer value spawn?
  context: >-
    A process that registers an application for automatic restart rarely stops there. Listing
    the children it launched shows whether the write was an isolated configuration change or
    one step in a longer sequence — dropping the target executable, running it once by hand, or
    installing an additional restart mechanism. Note this shows what the acting process
    started, not what started alongside it, because registry events do not record the acting
    process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Was this compatibility change part of a documented deployment or remediation?
  context: >-
    Genuine compatibility layers are usually applied as part of packaging a legacy application
    or remediating a known crash, and that work normally leaves a ticket, a package
    definition, or a management-tool record naming the application. A layer registering an
    application for automatic restart with no corresponding record is worth escalating. The
    query redisplays the alerting event only; the answer comes from change records.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: Does the timing of this registry write align with normal work hours or a maintenance window?
  context: >-
    Application packaging and compatibility remediation are business-hours or
    maintenance-window activities on most estates. Check the host's local time for the write
    and compare it against the user's normal working hours and any scheduled software
    deployment. Timing alone settles nothing, but a compatibility layer applied outside any
    window on a host with no packaging role narrows where to look next. The query redisplays
    the alerting event only.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - asset_inventory
- question: Which application does this Layers value apply to, and is that application one the environment expects to run?
  context: >-
    The AppCompatFlags\Layers key stores one value per application, and the value name is the
    full path of the executable the layer applies to. That path is the discriminating detail —
    a layer on a vendor-installed legacy application under Program Files is a routine
    compatibility fix, while a layer on an executable in a user-writable location such as
    AppData, ProgramData, Public, or a temp directory means the technique is being used to
    keep an unmanaged binary running. A per-user write lands under HKCU and needs no
    privileges; a machine-wide write lands under HKLM and requires administrative rights.
    Judge whether the writing process's signer plausibly owns the application named in the
    value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - registry_event
- question: Which compatibility layers are set in this value, and what do they do to the target application?
  context: >-
    The value data is a space-separated list of layer tokens, commonly opening with a tilde
    marker. REGISTERAPPRESTART makes the compatibility engine call RegisterApplicationRestart
    for the application, so Windows relaunches it after a crash, an update, or a reboot.
    Because the tokens are a list, one write can set more than one layer — RUNASADMIN forces
    an elevation prompt, and other tokens alter how the application loads. Read every token in
    the data, not just the one that matched, since the additional layers describe the rest of
    what was configured for that executable. Unlike binary-valued registry entries, this data
    is string data and is recorded on the event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
  answer_sources:
  - registry_event
  - manual_review
- question: Were other registry modifications made on this host in the same session?
  context: >-
    An operator who configures one compatibility layer often makes several changes in the same
    session — layers on additional executables, an autostart value, or a security setting
    change. Grouping every registry modification on the host in the window by key path and
    writing process shows what else landed alongside this write. The triggering key appears in
    the results; the signal is what accompanies it. If the host is registry-noisy, narrow to
    the writing process from the alert or to the AppCompatFlags, Run, Services, and Policies
    hive paths.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
  answer_sources:
  - registry_event
- question: Is the application named in the Layers value present on disk, and was it written in this same session?
  context: >-
    The layer only has an effect if the executable named in the value name exists at that
    path. Correlating file activity by the writing process and its children shows whether the
    target executable was dropped in the same session as the registry write, which is the
    difference between a compatibility fix applied to installed software and a restart
    mechanism configured for a binary that arrived moments earlier. File-write events carry no
    hash; if the executable is present, hash it from a later execution or retrieve it for a
    reputation lookup. Registry value deletion is not observable in endpoint telemetry, so
    judge whether the layer is still in force from the key's re-modification history rather
    than expecting a removal event.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Has this Layers value been written before on this host?
  context: >-
    Compatibility layers are set once when an application is packaged or remediated and then
    left alone, so this key path should have a short and stable history. No prior history for
    this application means the layer is new. Repeated writes of the same value data point at
    software that re-applies its own configuration, while a value data string that changes
    over time — especially one that gains tokens — means the layer set was edited rather than
    installed. Compare the writing process across the history as well.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
  answer_sources:
  - registry_event
- question: Did the application registered for restart run on this host after the layer was set?
  context: >-
    The layer has no effect until the target application runs and then terminates or the host
    restarts, at which point Windows relaunches it. The targeted executable path lives in the
    value NAME of the modified key rather than in a field a query can expand, so this is an
    aggregated survey of process launches grouped by image and parent: read the path from the
    value name, find that image in the results, and check its parent. A relaunch driven by the
    Restart Manager comes from the operating system's own restart path rather than from the
    user or the original launcher, and that is what distinguishes an active restart
    registration from an ordinary manual start.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - registry_event
- question: Was a custom shim database installed on this host around the time of the registry write?
  context: >-
    The AppCompatFlags hive backs the whole application compatibility framework, and the
    RegisterAppRestart layer is its lightest-weight abuse — it needs no shim database file at
    all. The heavier form of the same technique installs a custom .sdb database with
    sdbinst.exe, which registers under the Custom and InstalledSDB subkeys and can patch a
    target application's behavior at load time. Finding sdbinst.exe activity in the same
    window means more than a compatibility layer was configured, and the command line names
    the .sdb path. A .sdb registered without sdbinst.exe having run is a stronger finding
    still, because it means the registration bypassed the built-in installer. Correlating the
    registry modification with installer execution within a window of a few hours is the
    intended pairing here.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\sdbinst.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - User
  answer_sources:
  - process_creation
- question: Did any process on this host load a module from the AppPatch custom shim directories?
  context: >-
    Where a compatibility layer only changes how Windows treats an application, a custom shim
    database can inject a DLL into the target application when it loads. Those modules are
    installed under the Windows AppPatch directories, and a load from the Custom subdirectories
    is the point at which attacker code actually enters the target process. Check the signer
    and publisher of anything returned here — genuine compatibility fixes ship signed by
    Microsoft or by the application's vendor, and an unsigned module or one signed by an
    unrelated party under AppPatch is the injection stage of this technique. If module-load
    telemetry is not collected in this environment, treat zero results as a visibility gap
    rather than evidence that nothing loaded.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|contains:
          - '\AppPatch\Custom\'
          - '\AppPatch\AppPatch64\Custom\'
      condition: selection
    fields:
      - ImageLoaded
      - Image
      - Signed
      - Signature
  answer_sources:
  - process_creation
  - manual_review
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Aggregating process starts by executable and parent around the write collapses routine
    agent and service telemetry into high-count rows and leaves novel parent-child pairs
    standing out at low counts. That is what to scan for — a script host, an archive utility,
    or a remote-access tool appearing near the registry write points at how the layer came to
    be set, and gives the surrounding activity that the registry event alone does not carry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Was this same Layers value set on other hosts in the environment?
  context: >-
    The same compatibility layer on the same application path across many hosts usually means
    a management tool, a package, or a group policy applied the fix fleet-wide, which is a very
    different situation from one host carrying it alone. Compare the writing process and the
    value data across the hosts returned — a consistent writer and identical value data
    indicate a deployment, while the same key path written by different processes or with
    different layer sets does not. A single host means the change was local to it.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
  answer_sources:
  - registry_event
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    A restart registration is an unusual foothold precisely because it is quiet, and operators
    who reach for a quiet mechanism commonly install a conventional one as backup. This
    surfaces every persistence tool execution on the host in a window of several hours,
    grouped by tool and command, so scheduled tasks, services, autorun values, and BITS jobs
    created near the compatibility write are visible together. Several mechanisms configured
    in the same timeframe indicate deliberate stacking rather than an isolated administrative
    change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host help place this write in a sequence. Persistence is
    configured after access is obtained, so execution, defense tampering, or credential access
    alerts in the preceding hours suggest which stage this write belongs to and where the
    timeline starts. An otherwise quiet host makes the compatibility change the first
    observable event, which changes where the investigation looks next.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
