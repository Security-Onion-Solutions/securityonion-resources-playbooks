name: File Download From IP Based URL Via CertOC.EXE
id: d373804e-ca55-466a-a734-40a0feb56654
description: |
  Detects certoc.exe invoked with the -GetCACAPS flag against an IP-based URL, a documented way to use this signed system binary to download arbitrary files. The rule fires only when all of three conditions hold: the process is certoc.exe (by Image or OriginalFileName), the command line contains an IP-literal URL, and the command line contains -GetCACAPS. certoc.exe is a legitimate certificate utility, so its presence alone is benign; the IP-literal URL plus the download flag is the combination that indicates the binary is being used as a download proxy. Determine what was fetched, whether the file landed on disk, what spawned certoc.exe, and what ran before and after.
type: detection
detection_id: b86f6dea-0b2f-41f5-bdcc-a057bd19cd6a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line show certoc.exe run with -GetCACAPS against an IP-based URL?
  context: Confirm the alert is a true positive by reviewing the exact command line and process identity. The rule requires all three to be present at once -- the process resolves to certoc.exe (by Image or OriginalFileName), the command line contains an IP-literal URL, and the command line contains the -GetCACAPS download flag. Verify all three are present rather than a benign certificate operation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to download files via command-line certificate tooling?
  context: Legitimate administrative activity can trigger this detection. certoc.exe is a certificate utility; routine certificate work does not normally pull files from raw IP addresses with -GetCACAPS. Knowing whether the user role and host function involve certificate or download automation is often the fastest way to separate a true positive from routine operations.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What was the full certoc.exe command line, and what IP-based URL and destination did it target?
  context: The full command line reveals the download target. Decode the IP-literal URL after -GetCACAPS to identify the remote host and any path or filename, and note any local destination path. This binary downloads text-formatted content (scripts, configuration, webshells), so the URL contents and any resulting file are the substance of the operation. The query returns every certoc.exe execution on this host within the window so sequential invocations that form one operation are visible.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Did certoc.exe open a network connection to the IP address in the command line?
  context: The download flag in the command line indicates intent; a matching outbound connection from certoc.exe confirms the transfer was attempted. certoc.exe is not a routine network client, so any external connection it initiates is itself notable. Correlate the destination address and port here with the IP literal seen in the command line to confirm the fetch reached the network.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - Initiated
- question: Is the downloaded file still on disk for analysis?
  context: certoc.exe with -GetCACAPS writes the retrieved content to disk. If that file still exists, it can be hashed, submitted for analysis, or reviewed directly. The destination path is derived from the command line, so scope file events to the paths certoc.exe touched on this host.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was the download successful? Check for file creation at the destination.
  context: A download command does not guarantee the file was retrieved. Network errors, blocked addresses, or security controls may have prevented the transfer. Confirming file creation at the destination path established from the command line establishes whether the activity progressed past the delivery stage.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: If the file CertOC downloaded was executed, what is its hash and reputation?
  context: The hash for a reputation lookup is recorded when the payload runs, not when certoc.exe writes it to disk — file-creation events carry no hash. certoc only fetches; if the file is a payload run by the same shell, it appears as a child or sibling of the alerting process here with its hash. If certoc instead side-loaded the file as a DLL, check its load event (dll.hash); if it was run later by an unrelated process, retrieve it from disk and hash it manually.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      selection_siblings:
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: 1 of selection_*
    fields:
      - Image
      - Hashes
- question: What other file activity occurred in the target directory?
  context: Downloaded content often lands beside additional files -- further downloads, extracted archives, or staged tooling. Examining file activity in the same directory, excluding the file certoc.exe itself wrote, reveals the broader scope of the delivery operation and uncommon drop locations such as world-writable public paths.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process spawned certoc.exe, and is that parent chain expected?
  context: The parent process reveals how certoc.exe was invoked. A download via this binary launched from explorer.exe or an administrative console differs from one launched by a script host, office application, or another living-off-the-land binary. An unusual parent for a certificate utility points toward scripted or hands-on misuse rather than routine certificate work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did certoc.exe spawn afterward?
  context: A downloaded file is only the delivery stage; what runs next reveals impact. Child processes of certoc.exe -- or execution of the file it just wrote -- can show the payload being launched. Unexpected children such as command interpreters or script hosts indicate the download progressed into execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run certoc.exe?
  context: A binary that has never run on a host is more notable than one that runs regularly. Zero or very low historical counts over the baseline window indicate first-time or rare execution of certoc.exe here, which raises the weight of this alert.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host previously fired this same certoc.exe download pattern, what parents and users drove it, and does the current alert fit?
  context: Even legitimate tools can be abused. The query mirrors the rule's full selection -- certoc.exe with an IP-literal URL and -GetCACAPS -- scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern has run here before. A new parent process, an unexpected account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certoc.exe
      - OriginalFileName: CertOC.exe
      selection_ip:
        CommandLine|re: ://[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}
      selection_cli:
        CommandLine|contains: -GetCACAPS
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certoc.exe
      - OriginalFileName: CertOC.exe
      selection_ip:
        CommandLine|re: ://[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}
      selection_cli:
        CommandLine|contains: -GetCACAPS
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certoc.exe
      - OriginalFileName: CertOC.exe
      selection_ip:
        CommandLine|re: ://[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}
      selection_cli:
        CommandLine|contains: -GetCACAPS
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user drove similar download or certificate-tool activity on several hosts, the scope of the activity may be larger than this one alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certoc.exe
      - OriginalFileName: CertOC.exe
      selection_ip:
        CommandLine|re: ://[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}
      selection_cli:
        CommandLine|contains: -GetCACAPS
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Activity rarely happens in isolation. Earlier detections on the same host -- defense tampering, reconnaissance, credential access -- may reveal the stages that preceded this download and help reconstruct the timeline leading up to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
