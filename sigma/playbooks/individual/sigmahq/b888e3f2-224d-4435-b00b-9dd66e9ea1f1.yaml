name: Uncommon Extension In Keyboard Layout IME File Registry Value
id: 6f847a69-bb17-4ac1-8ee4-3ca04a0687d2
description: |
  Detects a registry write that sets an "Ime File" value under a Control\Keyboard Layouts key to a
  path that does NOT end in .ime. A keyboard-layout Input Method Editor entry normally names a .ime
  module; the rule fires when the value points at something else (commonly a .dll). The abuse pattern
  registers a DLL path under the "Ime File" value, then sends a language-change request so the operating
  system itself loads that DLL into a target process (frequently explorer.exe) through the IME layer,
  achieving injection without the process directly calling an injection API. Loading a module by way of
  the OS defeats behavioral-protection products that watch for direct injection, and the loaded module is
  typically used to disable or evade security tooling. Legitimate changes to a keyboard-layout IME File
  value are rare. Investigate the registered path, the process that wrote it and its parent chain,
  whether the referenced module was subsequently loaded into a running process, whether the value
  persists or was reverted, and what other configuration changes or defense-tampering activity accompanied
  the write.
type: detection
detection_id: b888e3f2-224d-4435-b00b-9dd66e9ea1f1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting write set an Ime File value under a Keyboard Layouts key to a path that does not end in .ime?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a
    registry path contains both Control\Keyboard Layouts\ and Ime File AND the written value data does NOT
    end in .ime. A legitimate keyboard-layout IME entry names a .ime module, so a value pointing at a .dll
    or any other extension is the setup step of the IME-based module load. Review the exact TargetObject
    and Details on the triggering event to confirm the registered path is a non-.ime file.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify a keyboard-layout IME File registry value?
  context: >-
    Keyboard-layout IME File values are set by input-method installers and effectively never change
    through normal interactive use. Knowing whether the writing account and host function match any
    sanctioned language-pack or IME deployment is the fastest way to separate a routine installation from
    an attempt to register a module for OS-driven loading. User attribution is present on roughly 94% of
    endpoint registry events; when it is a machine account or SYSTEM, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which Keyboard Layouts Ime File value was written, and why is this an evasion location?
  context: >-
    The Ime File value under a Control\Keyboard Layouts key tells the input-method subsystem which module
    to load for a keyboard layout. When a language-change request is issued, the operating system loads the
    module named here into the requesting process, so a DLL registered in this value is loaded by the OS
    rather than by a direct injection call, which evades behavioral protection that watches for injection.
    Confirming the exact key and writing process establishes that this is the IME File load location rather
    than an unrelated keyboard-layout edit, and sets up decoding the registered path.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What path was written to the Ime File value, and what module does it reference?
  context: >-
    The Details field holds the path the input-method subsystem will load. Decode it: a legitimate value
    names a .ime module shipped with a language pack, while the abuse pattern registers a .dll, often in a
    user-writable or temporary location such as AppData, ProgramData, or a system directory using a random
    name. If the value references a DLL, that path becomes the module to hunt for as a loaded image; the
    file extension and directory are the first indicators of malicious intent. Details is present on
    roughly 79% of registry modifications and should be populated for this string value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: How was the Ime File value written, and does the writing command reveal a staged defense-evasion payload?
  context: >-
    The registered module is loaded by the OS to run inside a trusted process, a step that is typically
    used to disable or blind security tooling once the module executes. The writing process's full command
    line reveals how the value was staged - a direct reg.exe write, a script host, or a custom binary that
    set the value programmatically and may go on to trigger the language-change request that forces the
    load. Reading the command that performed the write establishes whether this was a deliberate
    configuration action or an automated staging step.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process wrote this value, and what launched that process?
  context: >-
    The registry event carries no command line or parent, so pivot by ProcessGuid to the writing process
    to read its Image, full command, and parent chain. A write launched from a script host such as
    wscript.exe or mshta.exe, an Office application, a browser child, or an unsigned binary points to the
    IME File registration being staged programmatically rather than a deliberate administrator or installer
    action. The parent lineage distinguishes an installer-driven language-pack change from a scripted
    module registration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Was the module registered in this value subsequently loaded into a running process?
  context: >-
    The registration only matters if the module is actually loaded. When a language-change request is
    issued, the operating system loads the path named in the Ime File value into the requesting process,
    commonly explorer.exe. This query surfaces image loads on the host whose module path matches the
    registered value, confirming whether the DLL executed inside a process. If it returns nothing, the load
    may not have been triggered yet, image-load telemetry may be absent, or the stored path format may
    differ from the loaded path - in that case search recent module loads for the DLL file name from the
    Details value directly.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|contains|expand: '%Details%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Does the Ime File value still reference the non-.ime path, or was it changed again after the write?
  context: >-
    Registry key or value deletions are not observable in this telemetry, so durability is judged from the
    value's re-modification history rather than from a delete event. A later write that restores the value
    to a legitimate .ime module indicates the registration was reverted to hide it after the module loaded,
    while the value remaining a non-.ime path leaves it primed to load the module again on the next
    language-change request. Compare the Details values written to this key over the following window to
    determine the current state.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Is the registered module still able to load, or has the malicious value been removed and the module contained?
  context: >-
    The tampering enabled by this technique persists as long as the non-.ime path remains registered and
    the module stays on disk. Checking the current state of the value and whether the referenced module
    file is still present reveals whether the host remains exposed to the OS-driven load. If the value
    still points at the module and the file is intact, the registration should be removed and the module
    quarantined before further investigation. This is confirmed by direct host inspection and endpoint
    tooling rather than logs alone.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process activity occurred on this host after the value was written?
  context: >-
    A module loaded through the IME layer typically executes to disable defenses, dump credentials, or run
    payloads that would otherwise be blocked. Examining process activity in the window after the write
    reveals what the loaded module went on to do, including any child processes spawned from the process
    the module was injected into. Aggregating by process surfaces novel activity that stands out against
    routine telemetry in the post-write window.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor who registers an IME File module often makes other configuration changes in the same session -
    driver service key creation, device-enumeration edits to hijack a trusted service, or additional
    autostart and policy changes. Clustering the registry writes on this host in a short window around the
    alert reveals the full scope of changes and which process made them. The triggering key appears in the
    results; the signal is what else was modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Were other defense-tampering actions performed on this host?
  context: >-
    A module loaded to evade protection is frequently paired with direct tampering - stopping or
    reconfiguring security services, clearing event logs, deleting shadow copies, or disabling recovery.
    Finding several tampering actions from the same user or parent process near the registration indicates
    a coordinated effort to blind defenses rather than an isolated configuration change. The query surfaces
    common tampering tool invocations on the host in the surrounding window.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Has this Ime File value been modified before on this host?
  context: >-
    A keyboard-layout IME File value should change rarely and only when a language pack or input method is
    installed, so a history with no prior writes makes this a first-time change and raises its weight. A
    history of periodic writes to the same value points instead to a management process or a repeatedly run
    installer. Compare the historical Details values to see whether a non-.ime path was ever set before or
    whether this is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same Ime File value modified on other hosts in the environment?
  context: >-
    The same write across many hosts suggests a broad tool run or a mis-scoped deployment; the same write
    confined to one host suggests targeted activity. Compare the Details values across hosts to see whether
    they all register the same module path and whether the writing process is consistent, which separates a
    single hands-on operation from repeated use of the same technique across the environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    The registration rarely happens in isolation. Aggregating process activity in a tight window around the
    alert surfaces what led up to the write and what ran immediately after it. Novel parent-child pairs
    stand out at low counts against high-count routine telemetry, which points to the tool that staged the
    IME File registration and any actions taken once the module loaded.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, execution of scripting tools, or other defense
    tampering - may reveal the stages that preceded this change and help reconstruct the timeline. Loading
    a module through the IME layer is usually a means to run privileged or evasive follow-on actions, so
    prior alerts help place this registration within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were process-based persistence mechanisms installed on this host in the same window?
  context: >-
    A module loaded to evade defenses is often accompanied by establishing a foothold. Scheduled tasks,
    services, registry Run keys, BITS jobs, or WMI subscriptions created by schtasks.exe, sc.exe, reg.exe,
    bitsadmin.exe, or wmic.exe near the registration indicate the operation was used to install persistence
    rather than being an isolated action. Service creation is especially relevant, since IME-based loading
    is commonly paired with a hijacked or newly created driver service.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely - dropping an executable or script into
    a Startup folder or a path referenced by a registry Run key achieves persistence without invoking
    schtasks, sc, or reg. File writes to these locations near the IME File registration indicate the loaded
    module established a parallel persistence mechanism on disk, alongside the OS-driven load the registry
    value provides.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
