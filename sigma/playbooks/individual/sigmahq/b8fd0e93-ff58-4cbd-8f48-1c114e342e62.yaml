name: Windows Binaries Write Suspicious Extensions
id: 3341a07e-f2a3-4d84-8fc7-8de4fcc06003
description: |
  Detects a Windows system binary writing a file with an extension it has no role in producing. The rule fires when
  either a core session/logon binary (csrss.exe, lsass.exe, RuntimeBroker.exe, sihost.exe, smss.exe, wininit.exe,
  winlogon.exe) creates a file ending in .bat, .dll, .exe, .hta, .iso, .ps1, .txt, .vbe or .vbs, or a host-process
  binary (dllhost.exe, rundll32.exe, svchost.exe) creates a file ending in .bat, .hta, .iso, .ps1, .vbe or .vbs, with
  known-good writes (AppLocker policy tests, machine startup script staging, Clipchamp and PowerShell Preview app
  packages) excluded. Code running inside a trusted system process — injected into it, or a separate process
  impersonating its name — inherits that process's identity and signing on disk, so a payload staged this way is
  attributed to a Microsoft-signed binary rather than to the tool that produced it. The investigation needs to
  establish which branch fired, whether the writing process is the genuine system binary running from its canonical
  path with its expected lineage, what the written file contains, and whether it subsequently executed.
type: detection
detection_id: b8fd0e93-ff58-4cbd-8f48-1c114e342e62
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Do the written file's extension and the creating process match either branch of what this rule detects?
  context: >-
    Confirm the alert before investing time. One branch requires a core session or logon binary (csrss.exe, lsass.exe,
    RuntimeBroker.exe, sihost.exe, smss.exe, wininit.exe, winlogon.exe) writing a .bat, .dll, .exe, .hta, .iso, .ps1,
    .txt, .vbe or .vbs file; the other requires dllhost.exe, rundll32.exe or svchost.exe writing a .bat, .hta, .iso,
    .ps1, .vbe or .vbs file. Both legs of a branch must hold together — the process and the extension. Note which
    branch fired: the session/logon binaries have no role in producing any of these files, so that branch is
    self-contained, while dllhost.exe, rundll32.exe and svchost.exe write files routinely and the extension is the
    only discriminator, which makes the file's content and its later execution the load-bearing follow-ups. The signer
    columns describe the acting process; read them for coherence with the file being written, not as a verdict.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - file_event
- question: Is this user and host expected to see a system binary create a script or executable at this path?
  context: >-
    The account on a file event written by a system process is usually SYSTEM or a machine account, which attributes
    nothing on its own; in that case judge by the writing process and the host's role instead. A build server, a
    software distribution point, or a host running a management agent that stages scripts through a service host has a
    different normal than a user workstation where dllhost.exe writing a .ps1 outside the excluded policy-test path has
    no routine explanation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is the writing process the genuine system binary, and where on disk does it actually live?
  context: >-
    The rule matches the writer by filename only, so a process named winlogon.exe or svchost.exe running from
    anywhere other than System32 or SysWOW64 satisfies the same condition. Retrieving the writer's own start event
    exposes its full Image path, the OriginalFileName recorded in the PE header, and its hash. A mismatch between the
    on-disk name and OriginalFileName, or a canonical system name running from a user-writable directory, identifies
    an impostor rather than the OS component. If the path and metadata are genuine, the file write instead points at
    code running inside a legitimate system process, and the hash of the writer is of no further use — submit it for
    reputation only to confirm it is the stock binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: Has a file with this name been written on this host before, and which processes placed it there?
  context: >-
    Files do not appear spontaneously — they are copied, extracted, downloaded, or written by an installer or a
    service. Thirty days of prior arrivals of the same filename on this host, with the process responsible for each
    one, separate a recurring staging pattern from a first-ever appearance. A filename that arrives on every update
    cycle under the same writer is packaging; a first write by a system process that has never produced it is the
    arrival worth tracing.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - process_creation
- question: Is the file still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives the next steps. A file still on disk can be retrieved, hashed, and read; a
    file deleted seconds after creation is the signature of a self-removing dropper or cleanup, and moves the question
    to what ran in the interval. Interpret the results by operation type — creation, modification, rename, deletion —
    on this path over the four hours after the alert.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What was the writing process actually running, and what launched it?
  context: >-
    A file event carries no command line or parent, so the writer's own start event has to be retrieved to read them.
    For rundll32.exe the command line names the DLL and exported function being executed; for dllhost.exe it carries
    the COM CLSID being hosted; for svchost.exe the -k group names the service set. The parent is equally
    discriminating — smss.exe launches csrss.exe, wininit.exe and winlogon.exe, and services.exe launches svchost.exe,
    so an interactive or script-host parent for any of those names contradicts the identity the writer claims.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: What is in the file that was written?
  context: >-
    Retrieve and read the file. For .bat, .ps1, .vbs, .vbe and .hta content, look for base64 blobs, string
    concatenation and escape padding, embedded URLs or IP literals, download cradles, and calls that re-launch an
    interpreter. For .exe and .dll content, look at imports, embedded strings, packer artifacts, and signing status.
    For .iso content, check what the image contains — container files are used to carry a payload past
    origin-marking. Content analysis needs manual retrieval from the endpoint; this query returns the write event and
    the path to collect from.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
- question: If this file has executed, what is its hash — and does it have known AV or threat intel detections?
  context: >-
    A hash is recorded when a file runs, not when it is written, so the file event itself carries none. This query
    looks for the written file executing, either directly as a process image or as an argument to an interpreter, and
    reads the hash from that event; submit it for reputation to establish whether the file is known malicious, known
    benign, or unseen. On an interpreter match the hash belongs to powershell.exe, cmd.exe, wscript.exe or mshta.exe
    rather than to the script — retrieve the script from its on-disk path and hash it directly. A file that was
    written but never executed will not appear here at all.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A process that stages one file often stages several — an unpacker laying down components, a loader writing a
    script and the payload it calls, or a tool collecting output. The correlation follows the writing process and its
    direct children, so the breadth, the directories the writes land in, and the mix of extensions show whether this
    is one artifact or a set. svchost.exe and dllhost.exe write constantly as part of servicing and COM work, so
    volume alone means nothing here — read where the writes land and which of them share the alerting file's
    directory.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: What did the writing process launch afterward, and does that lineage fit the binary it claims to be?
  context: >-
    Children reveal what the process was for. A payload staged by a system process is frequently launched by that same
    process or by something it spawns, so an interpreter, a script host, or the written file itself appearing as a
    child ties the drop to execution. The expected children are narrow and known — winlogon.exe starts userinit.exe and
    dwm.exe, svchost.exe starts service processes — and cmd.exe, powershell.exe, wscript.exe, mshta.exe or rundll32.exe
    under any of these names is outside that set.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: When this host has previously produced the rule's pattern, which processes and users drove it, and does the current alert fit that history?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the resulting distribution reflects how
    this specific pattern — a listed system binary writing a listed extension, minus the excluded known-good writes —
    has actually run here over two weeks. A recurring writer and user pairing that already accounts for most of the
    history points at local software or a management agent that the exclusions do not cover; a first occurrence, a new
    writer, or a new account is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_generic:
        Image|endswith:
        - \csrss.exe
        - \lsass.exe
        - \RuntimeBroker.exe
        - \sihost.exe
        - \smss.exe
        - \wininit.exe
        - \winlogon.exe
        TargetFilename|endswith:
        - .bat
        - .dll
        - .exe
        - .hta
        - .iso
        - .ps1
        - .txt
        - .vbe
        - .vbs
      selection_special:
        Image|endswith:
        - \dllhost.exe
        - \rundll32.exe
        - \svchost.exe
        TargetFilename|endswith:
        - .bat
        - .hta
        - .iso
        - .ps1
        - .vbe
        - .vbs
      filter_main_AppLockerPolicyTest:
        Image: C:\Windows\System32\dllhost.exe
        TargetFilename|contains|all:
        - :\Users\
        - \AppData\Local\Temp\__PSScriptPolicyTest_
        TargetFilename|endswith: .ps1
      filter_main_script_gpo_machine:
        Image: C:\Windows\system32\svchost.exe
        TargetFilename|contains|all:
        - C:\Windows\System32\GroupPolicy\DataStore\
        - \sysvol\
        - \Policies\
        - \Machine\Scripts\Startup\
        TargetFilename|endswith:
        - .ps1
        - .bat
      filter_main_clipchamp:
        Image: C:\Windows\system32\svchost.exe
        TargetFilename|contains|all:
        - C:\Program Files\WindowsApps\Clipchamp
        - .ps1
      filter_main_powershell_preview:
        Image:
        - C:\Windows\system32\svchost.exe
        - C:\Windows\SysWOW64\svchost.exe
        TargetFilename|startswith:
        - C:\Program Files\WindowsApps\Microsoft.PowerShellPreview
        - C:\Program Files (x86)\WindowsApps\Microsoft.PowerShellPreview
        TargetFilename|endswith: .ps1
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - Image
    - User
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  always_include: true
  context: >-
    The query mirrors the rule's selection structure scoped to this account, so the result is that account's 90-day
    history of this specific pattern across all hosts, not its generic use of the binaries. An account that has never
