        TargetFilename|contains|all:
        - C:\Program Files\WindowsApps\Clipchamp
        - .ps1
      filter_main_powershell_preview:
        Image:
        - C:\Windows\system32\svchost.exe
        - C:\Windows\SysWOW64\svchost.exe
        TargetFilename|startswith:
        - C:\Program Files\WindowsApps\Microsoft.PowerShellPreview
        - C:\Program Files (x86)\WindowsApps\Microsoft.PowerShellPreview
        TargetFilename|endswith: .ps1
      condition: 1 of selection_* and not 1 of filter_main_*
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host supply the stages that preceded the write. Execution from a document handler,
    a script interpreter with an encoded payload, or credential access before this event changes what the file write
    means and where the timeline starts. The absence of earlier alerts is also informative — it makes the writing
    process's own lineage the only available account of how the code got there.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
