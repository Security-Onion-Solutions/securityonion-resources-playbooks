name: Forest Blizzard APT - File Creation Activity
id: 2f81ba9c-68f2-4028-ad82-e7b8d2348972
description: |
  Detects the creation of files under C:\ProgramData that match the staging artifacts of the GooseEgg
  post-compromise tool attributed to Forest Blizzard. The rule fires when EITHER a file is written into a
  vendor DriverStore-style path (a \prnms003.inf_ or \prnms009.inf_ file under a ProgramData vendor \v
  folder such as Microsoft\v, Adobe\v, Intel\v, NVIDIA\v) OR a file is written under C:\ProgramData whose
  name matches one of the launcher artifacts (.save, doit.bat, execute.bat, servtask.bat) or is a wayzgoose
  DLL. Many products legitimately write to ProgramData, but these specific batch scripts, .save files, and
  the wayzgoose DLL are not normal application output. Investigate what the file contains, which process
  wrote it and what launched that process, whether the drop progressed to execution, whether the associated
  COM-hijack registry keys and scheduled-task persistence were installed, and whether the same pattern
  appears on other hosts.
type: detection
detection_id: b92d1d19-f5c9-4ed6-bbd5-7476709dc389
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the created file path match one of the ProgramData drop patterns this rule detects?
  context: >-
    Before investing investigation time, confirm the alert is a true positive and note which branch fired.
    The rule matches when a file is created under C:\ProgramData that EITHER lands in a vendor DriverStore-style
    path (a \prnms003.inf_ or \prnms009.inf_ file under a vendor \v folder such as Microsoft\v, Adobe\v,
    Intel\v, NVIDIA\v) OR is one of the launcher artifacts (.save, doit.bat, execute.bat, servtask.bat) or a
    wayzgoose DLL. Review the exact TargetFilename and the responsible process against these criteria. The
    branch that fired matters downstream: a batch or wayzgoose-DLL drop points at the launcher stage, while a
    prnms .inf file points at the DriverStore redirect stage.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to write files into these ProgramData locations?
  context: >-
    Installers and vendor agents legitimately write under ProgramData, but the artifacts this rule matches
    (staging batch scripts, .save files, a wayzgoose DLL, or prnms .inf files placed in a vendor \v path) are
    not routine application output. Knowing whether the writing account and host role are consistent with any
    sanctioned software deployment is often the fastest way to separate a routine write from a tool drop. User
    attribution is present on roughly 94% of endpoint file events; when it is a machine account or SYSTEM,
    judge by the writing process and the host's function instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this file drop part of an authorized penetration test or red team engagement?
  context: >-
    Offensive tooling can stage payloads and helper scripts into ProgramData during a sanctioned assessment.
    Before deeper analysis, check whether a penetration test or red team exercise is active on this host or
    network segment. An authorized engagement with matching artifact names and timing resolves the alert
    without further work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What is in the dropped file — is it the expected staging component, or something else?
  context: >-
    Retrieve and inspect the file's actual content. For the batch artifacts (doit.bat, execute.bat,
    servtask.bat) read the script body: the launcher scripts write and schedule servtask.bat, which saves and
    compresses registry hives for credential theft. For a wayzgoose DLL or a .save binary, check strings,
    imports, packer signatures, and signing status. Confirm whether this is a real component of the tooling or
    a benign file that coincidentally matches the path. Content retrieval requires pulling the file from the
    endpoint or an EDR console.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If this file has executed, what is its hash and does it have known AV or threat-intel detections?
  context: >-
    A file's hash is recorded when it runs, not when it is written (file-creation events carry no hash). This
    query looks for the dropped artifact executing and reads its hash; submit that to a reputation service or
    internal threat intel to determine whether it is known malicious, benign, or previously unseen. The GooseEgg
    binaries and the batch scripts execute shortly after being dropped; if the file is present but has not run,
    retrieve it from its on-disk path and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
- question: What process wrote this file, and what launched that process?
  context: >-
    The file event carries the writing process's identifier but no command line, so pivot by ProcessGuid to
    that process's own record for its Image, full command line, and parent. A script host such as wscript.exe
    or mshta.exe, an unsigned binary, or an unexpected parent points at a programmatic drop rather than a
    routine install. GooseEgg is delivered by a batch launcher that writes these files, so the writing process
    and its parent chain identify the delivery mechanism.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Was the dropped file executed after it was created?
  context: >-
    A dropped batch script or binary only becomes dangerous once it runs. Correlating the file creation with a
    later process_creation for the same path reveals whether the drop progressed from delivery to execution.
    The launcher scripts execute servtask.bat and the GooseEgg binary shortly after writing them, so execution
    of one of these paths within the following hours is a strong progression signal.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
- question: Is the file still on disk, or was it deleted or renamed after the alert?
  context: >-
    The dropped file's post-alert lifecycle drives both urgency and next steps. A staging script or binary
    still on disk can be retrieved, hashed, and analyzed; a file deleted seconds after creation suggests
    anti-forensic cleanup or a self-deleting stager and shifts the investigation toward what executed in
    between. Interpret the results by operation type: a deletion shortly after creation is the cleanup
    signature.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    The launcher drops several files together — batch scripts, a .save file, the wayzgoose DLL, and a GooseEgg
    binary. Enumerating everything the writing process and its direct children touched in a short window
    distinguishes a single artifact from the full staging set and lists what else needs review. The breadth,
    paths, and extensions of the other writes reveal whether this is an isolated drop or a delivery in
    progress.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to ProgramData recently, and by which processes?
  context: >-
    Many installers and vendor agents write to ProgramData, so volume alone is not suspicion — the signal is
    an unfamiliar writing process placing staging artifacts. Recent arrivals in ProgramData from the same
    process reveal whether this is an isolated drop or a location under active staging, and which other files
    belong to the same activity. The aggregation groups by path and writing process so a single unfamiliar
    writer across several files stands out.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\ProgramData\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Were the COM-hijack registry keys associated with this tooling created on this host?
  context: >-
    Alongside the file drops, the tool registers a rogue CLSID as a COM server pointing at the wayzgoose DLL and
    creates a custom protocol handler that references that CLSID. These registry writes are a distinct stage of
    the same operation. Finding the rogue CLSID Server value or the rogue protocol handler on this host
    corroborates the tooling and shows the COM hijack was installed. Registry key or value deletions are not
    observable in this telemetry, so judge cleanup from the key's re-modification history rather than from a
    delete event.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '{026CC6D7-34B2-33D5-B551-CA31EB6CE345}'
          - '\PROTOCOLS\Handler\rogue'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: Were process-based persistence mechanisms installed on this host around the drop?
  context: >-
    Staging a foothold is frequently followed by establishing persistence. This tooling installs a scheduled
    task that runs servtask.bat at a recurring interval. Scheduled tasks, services, registry Run keys, BITS
    jobs, or WMI subscriptions created by schtasks.exe, sc.exe, reg.exe, bitsadmin.exe, or wmic.exe near the
    file drop indicate the operation moved from staging to persistence rather than being an isolated write.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Has this file been seen before on this host?
  context: >-
    A file that has never appeared on a host is more suspicious than one that is part of normal operations.
    Zero or very low historical counts for this path mark it as a first-time drop. These staging artifacts
    should not recur through routine software activity, so any prior appearances are worth explaining.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- always_include: true
  question: Has this user produced this ProgramData drop pattern before, and does that history fit their role?
  context: >-
    The query mirrors the rule's file-creation pattern scoped to this user — the result is the user's 90-day
    history of producing these specific ProgramData artifacts (not generic file activity), aggregated by host.
    A user who has never produced this pattern is more suspicious than one who does so regularly; weigh the
    count against the account's role and typical function. When the alert fires under SYSTEM or a machine
    account, user identity does not attribute the behavior and the parent-process history is the meaningful
    pivot.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_programdata_driver_store:
        TargetFilename|startswith:
        - C:\ProgramData\Microsoft\v
        - C:\ProgramData\Adobe\v
        - C:\ProgramData\Comms\v
        - C:\ProgramData\Intel\v
        - C:\ProgramData\Kaspersky Lab\v
        - C:\ProgramData\Bitdefender\v
        - C:\ProgramData\ESET\v
        - C:\ProgramData\NVIDIA\v
        - C:\ProgramData\UbiSoft\v
        - C:\ProgramData\Steam\v
        TargetFilename|contains:
        - \prnms003.inf_
        - \prnms009.inf_
      selection_programdata_main:
        TargetFilename|startswith: C:\ProgramData\
      selection_programdata_files_1:
        TargetFilename|endswith:
        - .save
        - \doit.bat
        - \execute.bat
        - \servtask.bat
      selection_programdata_files_2:
        TargetFilename|contains: \wayzgoose
        TargetFilename|endswith: .dll
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_programdata_driver_store or (selection_programdata_main and 1 of selection_programdata_files_*)) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program driven the ProgramData drop pattern before on this host or across the environment?
  context: >-
    When the alert fires under a service principal, user identity does not attribute behavior; the launch
    mechanism does. The query mirrors the rule's file-creation pattern scoped to the alerting program,
    so the result is the 90-day history of this program producing these specific artifacts (not generic
    program-and-path co-occurrence). A new or rare program for this pattern is the deviation worth chasing; a
    program that already accounts for thousands of prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_programdata_driver_store:
        TargetFilename|startswith:
        - C:\ProgramData\Microsoft\v
        - C:\ProgramData\Adobe\v
        - C:\ProgramData\Comms\v
        - C:\ProgramData\Intel\v
        - C:\ProgramData\Kaspersky Lab\v
        - C:\ProgramData\Bitdefender\v
        - C:\ProgramData\ESET\v
        - C:\ProgramData\NVIDIA\v
        - C:\ProgramData\UbiSoft\v
        - C:\ProgramData\Steam\v
        TargetFilename|contains:
        - \prnms003.inf_
        - \prnms009.inf_
      selection_programdata_main:
        TargetFilename|startswith: C:\ProgramData\
      selection_programdata_files_1:
        TargetFilename|endswith:
        - .save
        - \doit.bat
        - \execute.bat
        - \servtask.bat
      selection_programdata_files_2:
        TargetFilename|contains: \wayzgoose
        TargetFilename|endswith: .dll
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection_programdata_driver_store or (selection_programdata_main and 1 of selection_programdata_files_*)) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the environment around the time of the drop?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or multi-host staging. If the same
    account produced related activity on other endpoints in the same window, the scope of compromise may be
    larger than one host. When the alert fires as SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a machine account,
    this user-scoped view returns agent-telemetry noise and the parent-driven fleet check is the meaningful
    answer.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven drop pattern fire on other hosts in the same window — a coordinated rollout, or isolated to this host?
  context: >-
    Under a service principal, "what else did this user do" returns agent-telemetry noise because every host
    runs SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism produced
    these artifacts elsewhere: the query mirrors the rule's file-creation pattern scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts in the same window points to scheduled or pushed
    automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_programdata_driver_store:
        TargetFilename|startswith:
        - C:\ProgramData\Microsoft\v
        - C:\ProgramData\Adobe\v
        - C:\ProgramData\Comms\v
        - C:\ProgramData\Intel\v
        - C:\ProgramData\Kaspersky Lab\v
        - C:\ProgramData\Bitdefender\v
        - C:\ProgramData\ESET\v
        - C:\ProgramData\NVIDIA\v
        - C:\ProgramData\UbiSoft\v
        - C:\ProgramData\Steam\v
        TargetFilename|contains:
        - \prnms003.inf_
        - \prnms009.inf_
      selection_programdata_main:
        TargetFilename|startswith: C:\ProgramData\
      selection_programdata_files_1:
        TargetFilename|endswith:
        - .save
        - \doit.bat
        - \execute.bat
        - \servtask.bat
      selection_programdata_files_2:
        TargetFilename|contains: \wayzgoose
        TargetFilename|endswith: .dll
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection_programdata_driver_store or (selection_programdata_main and 1 of selection_programdata_files_*)) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host — exploitation, privilege
    escalation, or credential access — may reveal the stages that preceded this drop. This is a post-compromise
    tool deployed after initial access and a Print Spooler privilege-escalation exploit, so prior alerts help
    place this file creation within the larger operation and reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
