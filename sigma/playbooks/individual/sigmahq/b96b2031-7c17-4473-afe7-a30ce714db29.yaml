name: Use of FSharp Interpreters
id: 7a3d30b8-c487-48f1-be02-77f474679482
description: |
  Detects execution of the F# interactive interpreters fsi.exe and fsianycpu.exe, identified by Image name
  or OriginalFileName. Both are Microsoft-signed binaries bundled with Visual Studio and the .NET SDK and can
  execute arbitrary .NET code from an .fsx/.fsscript file or interactively, which makes them an application
  allowlist (WDAC) bypass: a signed interpreter runs attacker F# even when unsigned code is denied. On a
  developer workstation this is routine; on a non-developer host it is an unusual execution path. Investigate
  what code the interpreter ran, what parent launched it, what it spawned afterward, and whether the host and
  user have any legitimate F# development context.
type: detection
detection_id: b96b2031-7c17-4473-afe7-a30ce714db29
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Is the alerting process fsi.exe or fsianycpu.exe by image name or original file name?
  context: Confirm the alert is a true positive before investing time. The rule fires when the Image ends in \fsi.exe or \fsianycpu.exe, or the OriginalFileName is fsi.exe or fsianycpu.exe. The OriginalFileName check catches a renamed interpreter, so verify both the on-disk name and the original file name to confirm an F# interpreter actually executed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Is this user and host expected to run F# interpreters?
  context: F# interpreters are developer tooling. On a workstation belonging to a software engineer who works in .NET, fsi.exe is routine; on a server, a non-developer endpoint, or a kiosk it is unusual and worth scrutiny. Knowing the host function and whether the account is a developer identity is often the fastest way to separate legitimate development from allowlist-bypass abuse.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What code did the interpreter run? Decode the command line and identify any script path or inline F#.
  context: The full command line reveals what the interpreter executed. fsi.exe and fsianycpu.exe accept an .fsx or .fsscript path to run, can take inline F# via --exec or --use, and run an interactive session when given no script. Identify the script file path (then examine its contents and origin), any inline code, and any flags. F# can call into unmanaged code and invoke PowerShell, so the script is where the real action lives, not the interpreter invocation itself.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned the interpreter and is that parent chain expected?
  context: The parent process reveals how the interpreter was launched. A developer session typically shows explorer.exe, a Visual Studio process, a terminal, or a build tool as the parent. Parents such as a browser, an email client, an Office application, mshta.exe, wscript.exe, or a script downloaded to a temp directory point to delivery of the interpreter as an allowlist-bypass payload rather than development.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did the interpreter spawn afterward?
  context: The processes spawned by the interpreter reveal its actual impact. Legitimate F# development rarely shells out; an interpreter spawning cmd.exe, powershell.exe, certutil.exe, rundll32.exe, or network-capable binaries suggests the F# script is a launcher or download cradle for post-exploitation rather than ordinary code execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run F# interpreters?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. On a developer workstation fsi.exe may show a steady history; on a host with zero or very low prior counts, this execution is first-time or rare and the interpreter has no obvious development reason to be present.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously run the F# interpreters, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even legitimate development tooling can be abused. This query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution reflects how the interpreters have actually run here, not generic binary usage. A new parent process, an unexpected account, or a first-ever appearance is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \fsi.exe
        - \fsianycpu.exe
      - OriginalFileName:
        - fsi.exe
        - fsianycpu.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts run the F# interpreters in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: This query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of the same firing pattern rather than generic usage. Many hosts running the interpreters points to a development team or a build/CI fleet where F# tooling is expected; a single host or a small unrelated set points to manual operator activity that does not fit a development footprint. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \fsi.exe
        - \fsianycpu.exe
      - OriginalFileName:
        - fsi.exe
        - fsianycpu.exe
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \fsi.exe
        - \fsianycpu.exe
      - OriginalFileName:
        - fsi.exe
        - fsianycpu.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \fsi.exe
        - \fsianycpu.exe
      - OriginalFileName:
        - fsi.exe
        - fsianycpu.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user account do across the network around this time?
  context: Tracking the account's activity across all hosts can reveal lateral movement or a wider footprint. If the same account triggered similar interpreter or other tool activity on multiple endpoints in the alert window, the scope of compromise may be larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \fsi.exe
        - \fsianycpu.exe
      - OriginalFileName:
        - fsi.exe
        - fsianycpu.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Execution via a signed interpreter rarely appears in isolation. Earlier detections on the same host, such as initial access, defense tampering, or reconnaissance, may reveal the stages that preceded this interpreter run and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur alone. Examining surrounding activity reveals what led to the interpreter running and what followed it, including file drops, follow-on execution, or reconnaissance. Novel parent-child pairs stand out at low counts against routine high-count agent telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
