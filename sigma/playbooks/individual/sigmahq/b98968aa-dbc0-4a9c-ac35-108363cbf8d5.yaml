name: WINEKEY Registry Modification
id: 20f0d46d-ed7a-46b8-a2f5-42ebf4875d85
description: |
  Detects a write to the per-user Run key value HKCU\Software\Microsoft\Windows\CurrentVersion\Run\Backup Mgr,
  a registry autostart entry used by the WINEKEY / CORKBOT backdoor (also tracked as BazarLoader / BazarBackdoor /
  Team9) for persistence at user logon. The rule fires when any value named "Backup Mgr" is set under the
  CurrentVersion\Run key; on a normal system there is no legitimate "Backup Mgr" autostart entry, so the write is
  the persistence-installation step that points logon execution at a backdoor binary. Investigate what path or
  command the value points to, which process wrote it and what launched that process, whether the referenced
  payload landed on disk and subsequently executed, whether additional persistence or configuration changes were
  made in the same session, and whether the value was later re-modified.
type: detection
detection_id: b98968aa-dbc0-4a9c-ac35-108363cbf8d5
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting registry write set a "Backup Mgr" value under the CurrentVersion\Run key?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a value whose
    path ends in Software\Microsoft\Windows\CurrentVersion\Run\Backup Mgr is written. Review the exact TargetObject
    and value data (Details) on the triggering event to confirm the "Backup Mgr" Run-key entry was set and to read
    the path or command it points to. There is no standard software that creates a "Backup Mgr" autostart entry,
    so any value here is the persistence-installation step.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to add a logon autostart entry under the Run key?
  context: >-
    Legitimate software installs Run-key autostart entries under its own product name, not "Backup Mgr", and end
    users rarely write to this key directly. Knowing whether the writing account and host function match any
    sanctioned deployment is the fastest way to separate a packaging or management action from backdoor persistence.
    User attribution is present on roughly 94% of endpoint registry events; when it is a machine account or missing,
    pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which Run-key value was written, and why is this a persistence location?
  context: >-
    The key HKCU\Software\Microsoft\Windows\CurrentVersion\Run holds commands that run automatically each time the
    user logs on. A value placed here executes its configured path or command at every logon with the user's rights,
    which is why it is a common autostart persistence location. Confirming the exact key path and writing process
    establishes that this is the Run-key autostart used by the backdoor rather than an unrelated registry edit, and
    sets up decoding the value data.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What path or command was written to the "Backup Mgr" value?
  context: >-
    The Details field holds what the Run key will execute at the next logon. Decode it: the value typically points
    to a backdoor executable dropped into a user-writable directory such as AppData, ProgramData, or Temp, or to an
    interpreter command that loads a payload. If it references a file path, that path becomes the lead for confirming
    the payload on disk and for tracking its later execution. Details is present on roughly 79% of registry
    modifications and should be populated for this string value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote the Run-key value, and what launched that process?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to read its Image,
    full command, and parent. A reg.exe, powershell.exe, cmd.exe, or unfamiliar binary write launched from a
    script host such as wscript.exe or mshta.exe, an Office application, or a loader dropped in a user directory
    points to programmatic persistence installation rather than a deliberate administrator edit. The parent chain
    distinguishes a scripted implant from an interactive console action.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Is the executable or script referenced by the Run-key value present on disk?
  context: >-
    Run-key persistence is only effective if the referenced payload exists at the path written into the value.
    Correlating file activity by the writing process and its children surfaces whether a binary was dropped in the
    same session at the path the value points to, which determines whether the persistence is live and what it
    would execute at next logon. The file-write event carries no hash; if the payload is present, hash it from a
    later execution or retrieve it for a reputation lookup. Reboot survival is a judgment call from the value data
    and its re-modification history rather than a delete event, which this telemetry does not emit.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did the payload configured in the Run key subsequently execute on this host?
  context: >-
    Run-key entries execute their configured command at the next user logon, so confirming whether that binary
    actually ran establishes that the persistence is active and the backdoor payload started. The query anchors on
    the path read from the value data, so any row is the configured command launching; a match confirms the
    autostart fired, while a zero means the persistence is primed but has not run — expected until the user's next
    logon. If the value stores an environment-variable form of the path, expand it and search the literal path
    manually.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|expand: '%Details%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: After this write, was the "Backup Mgr" value changed again or restored?
  context: >-
    Registry key or value deletions are not observable in this telemetry, so durability is judged from the value's
    re-modification history rather than from a delete event. A later write that changes or clears the value may
    indicate cleanup or an update to a new payload path, while the value persisting unchanged leaves the autostart
    primed to run at every logon. Compare the Details values written to this key over the following window to see
    whether the entry was maintained, updated, or reverted.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Has this Run-key value been modified before on this host?
  context: >-
    A "Backup Mgr" autostart entry should never appear through normal use, so a history with no prior writes makes
    this a first-time change and raises its weight. A history of periodic writes to the same value would instead
    point to a management process or a repeatedly run tool. Compare the historical Details values to see whether a
    payload path was set before or whether this is new to the host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same Run-key value modified on other hosts in the environment?
  context: >-
    The same "Backup Mgr" write across many hosts suggests the backdoor was deployed broadly or via lateral
    movement; the same write confined to one host suggests a targeted or early-stage foothold. Compare the Details
    values across hosts to see whether they all plant the same payload path and whether the writing process is
    consistent, which separates a single hands-on operation from repeated use of the same technique across the
    environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor who installs one persistence mechanism often makes other configuration changes in the same session -
    additional Run or service keys, Winlogon or startup edits, or defense and firewall policy changes. Clustering
    the registry writes on this host in a short window around the alert reveals the full scope of changes and which
    process made them. The triggering key appears in the results; the signal is what else was modified and by which
    process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Persistence installation rarely happens in isolation. Aggregating process activity in a tight window around the
    alert surfaces what led up to the Run-key write and what ran immediately after it. Novel parent-child pairs
    stand out at low counts against high-count routine telemetry, which is what points to the loader that installed
    the persistence and to any follow-on tooling.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - phishing-borne execution, script-host activity, reconnaissance, or
    defense tampering - may reveal the stages that preceded this persistence write and help reconstruct the
    timeline. Loader-installed Run-key persistence commonly follows an initial execution foothold, so prior alerts
    help place this change within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Backdoors of this family rarely rely on a single foothold; the Run-key entry is often paired with scheduled
    tasks, services, BITS jobs, or Winlogon edits installed as backup mechanisms. Scheduled tasks, services,
    registry writes, BITS jobs, or WMI subscriptions created by schtasks.exe, sc.exe, reg.exe, bitsadmin.exe, or
    wmic.exe near the "Backup Mgr" write indicate intentional stacking of persistence rather than an isolated action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely - dropping an executable or script into a
    Startup folder or a path referenced by a registry Run key achieves persistence without invoking schtasks, sc,
    or reg. File writes to these locations near the "Backup Mgr" write indicate the loader established a parallel
    persistence mechanism on disk alongside the Run-key entry.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Does the user or an administrator recall installing this autostart entry?
  context: >-
    A "Backup Mgr" Run-key entry has no routine reason to exist, so direct confirmation from the account owner is a
    fast way to resolve the alert. If an administrator or a sanctioned tool set the value, that closes it; if no one
    recalls the action, the account may be compromised or the change was made by automated malware, and the
    investigation should continue into the writing process, the referenced payload, and any follow-on execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
