name: HackTool - Inveigh Execution
id: f79d18ab-422c-43cf-9218-ea8334786ffa
description: |
  Detects execution of Inveigh, a cross-platform .NET LLMNR/NBT-NS/mDNS/DNS spoofing and
  network machine-in-the-middle tool used to provoke and capture NetNTLM authentication for
  offline cracking or SMB relay. The rule fires when a process is identified as Inveigh by its
  image name, OriginalFileName, embedded Description, or a command line carrying its spoofer
  and sniffer switches. Outside of an authorized penetration test or red-team engagement,
  Inveigh on an endpoint points to hands-on credential-access activity; the investigation should
  confirm the tool's capability that ran, determine which credentials and protocols were
  targeted, and look for follow-on use of any captured credentials.
type: detection
detection_id: b99a1518-1ad5-4f65-bc95-1ffff97a8fd0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does this process match Inveigh by image, original filename, embedded description, or its spoofer/sniffer command-line switches?
  context: >-
    Confirm the alert is a true positive before investing time. The rule matches when any one of
    several identifiers is present: an Image ending in Inveigh.exe, an OriginalFileName of
    Inveigh.exe or Inveigh.dll, an embedded Description of "Inveigh", or a CommandLine containing
    one of the spoofer/sniffer flags (-SpooferIP, -ReplyToIPs, -ReplyToDomains, -ReplyToMACs,
    -SnifferIP). Note which identifier fired — a renamed binary caught only by OriginalFileName or
    Description behaves differently than one caught by its command line.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
      - Description
- question: Is this user and host expected to run a network credential-capture tool like Inveigh?
  context: >-
    Inveigh is an offensive credential-access tool, not routine administrative software. A
    security tester or pentest host may legitimately run it; a general workstation or server
    running it is far more concerning. Knowing whether the user role and host function fit
    offensive tooling is often the fastest way to separate sanctioned testing from intrusion.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this Inveigh execution part of an authorized penetration test or red team engagement?
  context: >-
    Inveigh is commonly used in authorized security assessments to demonstrate LLMNR/NBT-NS
    poisoning and NetNTLM relay exposure. Before deeper analysis, check whether a pentest or red
    team exercise is currently active on this host or network segment. An authorized engagement
    with matching tooling, host, and timing resolves the alert without further investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which Inveigh capability was invoked — which spoofers, sniffers, and reply filters were set on the command line?
  context: >-
    Inveigh's command line reveals which protocols it poisoned and how it was scoped. Spoofer and
    sniffer flags (-SpooferIP, -SnifferIP) enable LLMNR/NBT-NS/mDNS/DNS response spoofing and
    packet capture; reply filters (-ReplyToIPs, -ReplyToDomains, -ReplyToMACs) narrow which
    targets receive poisoned responses, which often indicates a deliberate, targeted operation
    rather than broad opportunistic capture. The presence of HTTPS, LDAP, WebDAV, or DHCPv6/ICMPv6
    options widens the set of credentials and relay paths the tool could harvest.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What credentials and protocols did Inveigh target for capture?
  context: >-
    Inveigh captures NetNTLM (v1/v2) challenge-response authentication off the wire by poisoning
    name-resolution requests and listening on SMB, HTTP/HTTPS, LDAP, WebDAV, and proxy-auth
    channels. Identify from the command line which protocols and listeners were enabled and which
    targets the reply filters allowed — this determines which account hashes were likely captured
    (workstation, server, or service accounts) and whether the captured material supports offline
    cracking, SMB relay, or LDAP relay. Captured hashes are written to an output file in the tool's
    working directory by default.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did the Inveigh process write capture or output files to disk on this host?
  context: >-
    Inveigh writes captured NetNTLM hashes and console logs to a file in its working directory by
    default, with a configurable filename prefix and output directory. File-creation events from
    the Inveigh process confirm that capture actually occurred and reveal where the harvested
    credentials were stored, which matters for cleanup and for estimating how many accounts were
    exposed even if the process has already exited.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process spawned Inveigh, and is that parent chain expected?
  context: >-
    The parent process shows how Inveigh was launched. An interactive shell, a remote-execution
    parent (PsExec service, WMI, WinRM), or a script host points to hands-on or scripted operator
    activity; launch from a known testing harness on a sanctioned host is more benign. Walk up the
    chain to see what spawned the parent and whether the same parent launched other tooling.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Which accounts may have had their NetNTLM hashes captured, and do any have elevated privileges?
  context: >-
    The severity depends on which accounts authenticated through the poisoned name resolution and
    were captured. Domain admin, server, or service-account hashes require incident escalation and
    credential rotation; a single low-privilege workstation account is lower impact. Cross-reference
    the host's network segment and the accounts that would resolve names through it against directory
    group memberships to scope exposure.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \Inveigh.exe
      - OriginalFileName:
        - \Inveigh.exe
        - \Inveigh.dll
      - Description: Inveigh
      - CommandLine|contains:
        - ' -SpooferIP'
        - ' -ReplyToIPs '
        - ' -ReplyToDomains '
        - ' -ReplyToMACs '
        - ' -SnifferIP'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \Inveigh.exe
      - OriginalFileName:
        - \Inveigh.exe
        - \Inveigh.dll
      - Description: Inveigh
      - CommandLine|contains:
        - ' -SpooferIP'
        - ' -ReplyToIPs '
        - ' -ReplyToDomains '
        - ' -ReplyToMACs '
        - ' -SnifferIP'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts in the alert window reveals lateral movement or
    coordinated activity across multiple endpoints. If the same user triggered credential-access or
    other tooling on multiple hosts, the scope of the operation is larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \Inveigh.exe
      - OriginalFileName:
        - \Inveigh.exe
        - \Inveigh.dll
      - Description: Inveigh
      - CommandLine|contains:
        - ' -SpooferIP'
        - ' -ReplyToIPs '
        - ' -ReplyToDomains '
        - ' -ReplyToMACs '
        - ' -SnifferIP'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: When this host previously fired the Inveigh pattern, what parents and users drove it, and does the current alert fit that pattern?
  context: >-
    Even sanctioned tools can be abused. This count mirrors the rule's own selection scoped to this
    host, so the resulting parent/user distribution reflects how the rule's specific firing pattern
    — not generic binary usage — has historically run here. A new parent process, an unexpected user
    account, or an unusual command-line structure relative to prior firings is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \Inveigh.exe
      - OriginalFileName:
        - \Inveigh.exe
        - \Inveigh.dll
      - Description: Inveigh
      - CommandLine|contains:
        - ' -SpooferIP'
        - ' -ReplyToIPs '
        - ' -ReplyToDomains '
        - ' -ReplyToMACs '
        - ' -SnifferIP'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the Inveigh pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    This count mirrors the rule's selection with no host scope, giving a fleet-wide count of the
    rule's firing pattern rather than generic binary usage. Many hosts firing the same pattern points
    to scripted deployment or sanctioned testing automation; one host or a small unrelated set points
    to manual operator activity. Use the host distribution and parent/binary consistency to calibrate
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \Inveigh.exe
      - OriginalFileName:
        - \Inveigh.exe
        - \Inveigh.dll
      - Description: Inveigh
      - CommandLine|contains:
        - ' -SpooferIP'
        - ' -ReplyToIPs '
        - ' -ReplyToDomains '
        - ' -ReplyToMACs '
        - ' -SnifferIP'
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Credential-access tooling rarely happens in isolation. Earlier detections on the same host —
    initial access, defense tampering, reconnaissance, or privilege escalation — may reveal the
    attack stages that preceded Inveigh and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
