name: PowerShell Get-Clipboard Cmdlet Via CLI
id: 79ac0493-e443-49e8-818f-e77acefcfaa1
description: |
  Detects the PowerShell Get-Clipboard cmdlet appearing on a process command line, which reads whatever text the
  interactive user currently has on their clipboard and writes it to the pipeline or stdout. Clipboard contents
  frequently hold passwords, recovery keys, tokens, and copied sensitive data, so reading them is a lightweight
  collection step that often follows execution and precedes staging or exfiltration. Legitimate use exists (scripts
  and developers occasionally read the clipboard), so the investigation should establish how PowerShell was launched,
  which user and parent drove it, whether the session was interactive, and what happened to the captured data afterward.
type: detection
detection_id: b9aeac14-2ffd-4ad3-b967-1354a4e628c3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line contain the Get-Clipboard cmdlet as the rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command
    line that fired. The rule matches any command line containing the string Get-Clipboard, so verify the cmdlet is
    actually present and note whether it is a bare interactive read or part of a larger pipeline that stages or sends
    the captured text elsewhere.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to read the clipboard from PowerShell?
  context: Legitimate administrative scripting and developer activity can read the clipboard, but most users never
    invoke Get-Clipboard directly. Knowing whether the user role and host function are consistent with command-line
    clipboard access is often the fastest path to distinguishing routine operations from collection activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this PowerShell invocation do beyond reading the clipboard? Decode the full command line.
  context: The full command line reveals whether Get-Clipboard was a standalone read or one stage of a larger
    operation. Decode any flags, encoding, file paths, or pipeline that captures the clipboard text and writes it to a
    file, sends it over the network, or passes it to another command. A bare Get-Clipboard is far less concerning than
    one piped into Out-File, Invoke-WebRequest, or a base64 conversion.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Was the command encoded or obfuscated? What does it decode to?
  context: Get-Clipboard is plain text, but it is often embedded inside an -EncodedCommand (-enc) payload or obfuscated
    with backticks, concatenation, or variable substitution to hide the surrounding collection or exfiltration logic.
    Base64-encoded commands are the most common form. Decoding reveals the actual script -- where the captured
    clipboard text is sent, whether it is written to disk, and whether a download cradle or in-memory execution
    accompanies it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the full Get-Clipboard script content?
  context: Script block logging records the deobfuscated script content PowerShell actually executed, even when the
    command line is encoded or obfuscated. This provides ground truth about what ran around the clipboard read,
    bypassing attacker obfuscation. If PowerShell operational logs are not ingested in this environment, treat zero
    results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
        ScriptBlockText|contains: Get-Clipboard
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: What process spawned this PowerShell session and is that parent chain expected?
  context: The parent process reveals how PowerShell was invoked. Interactive clipboard reads are normally parented by
    explorer.exe or a legitimate console host. Parents such as control.exe, mshta.exe, wscript.exe, or an Office
    application -- especially as a high-integrity child of a UAC bypass chain -- point to a session that gained
    execution outside normal user interaction before reaching the clipboard.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously fired the Get-Clipboard pattern, what parents and users normally drive that
    activity, and does the current alert fit that pattern?
  context: Even ordinary clipboard reads can be abused. The query mirrors the rule's selection scoped to this host, so
    the resulting parent and user distribution reflects how the Get-Clipboard firing pattern has historically run
    here. A new parent process, an unexpected user account, or a non-interactive session is the deviation worth
    chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: Get-Clipboard
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Did this PowerShell session or any process it spawned write a file consistent with the captured clipboard text being staged to disk?
  context: The handle open that a program makes against the clipboard-owning window to read its contents is not
    observable in this environment's telemetry -- there is no process-access or handle-access channel here, so a
    zero result below is not proof that only the Get-Clipboard cmdlet touched the clipboard. What is observable is
    what the session did with the text afterward. Reviewing files written by this process or its children shows
    whether the read was staged to disk under a second mechanism alongside the cmdlet call.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What child processes did this PowerShell session spawn afterward?
  context: The processes spawned after the clipboard read reveal what was done with the captured text. A clipboard
    read followed by cmd.exe, certutil.exe, curl.exe, or a network-capable utility suggests the collected data was
    staged or sent onward; a read with no children is more consistent with interactive use.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Was the captured clipboard text written to a file or staged for later collection on this host?
  context: Clipboard reads used for collection commonly redirect the captured text to a file (Out-File, Set-Content,
    redirection) before it is archived or exfiltrated. The query is anchored on the alerting PowerShell binary, so
    rows are files that process touched in the window; writes into user-writable or staging paths show the clipboard
    contents were persisted to disk and where, which determines the scope of potential data loss. A zero means the
    capturing process itself wrote nothing observable — the text may still have left through the pipeline to another
    process.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: Were PowerShell security controls bypassed or weakened before this clipboard read?
  context: Operators often disable or bypass PowerShell protections before running collection logic. Common patterns
    include AMSI bypass (patching amsi.dll in memory), execution policy changes (Set-ExecutionPolicy or -ep bypass),
    constrained language mode escape, and downgrade to PowerShell v2 (which lacks logging). Finding these precursor
    events on the host strengthens the case that the clipboard read was part of malicious activity.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: Get-Clipboard
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: Get-Clipboard
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or collection spanning multiple
    endpoints. If the same user triggered similar activity on other hosts, the scope of compromise may be larger than
    a single clipboard read.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: Get-Clipboard
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the clipboard read reveals the immediate
    context -- what led to this event, what happened after, and whether it is part of a larger sequence. Look for
    reconnaissance, privilege escalation, persistence, or staging that surrounds the collection step.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts run Get-Clipboard in the past week, and does the cross-host distribution look like
    consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of the
    Get-Clipboard firing pattern. Many hosts firing the same pattern points to scripted deployment or vendor
    automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: Get-Clipboard
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- defense tampering, reconnaissance, credential access, or execution
    -- may reveal the attack stages that preceded the clipboard read and help reconstruct the full timeline. Collection
    of clipboard data often follows initial execution and access, so prior alerts here are the precursor signal.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
