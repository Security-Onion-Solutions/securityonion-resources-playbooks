name: Potential Network Sniffing Activity Using Network Tools
id: 2028009d-bff6-42be-94d0-0753b0165b0d
description: |
  Detects execution of packet-capture tools by matching EITHER tshark.exe with an interface-selection flag (-i) OR windump.exe by name. Either branch alone satisfies the rule. These tools place a network interface into capture mode to read traffic in transit, which administrators use to troubleshoot connectivity and which an operator can use to passively collect credentials, session tokens, or other data crossing the wire. Determine whether the capture was started by an expected user and parent, what interface and filter were specified, and whether the activity sits alongside reconnaissance, privilege changes, or follow-on use of captured data.
type: detection
detection_id: ba1f7802-adc7-48b4-9ecb-81e227fddfd5
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the alerting event match either the tshark capture pattern or the windump pattern this rule detects?
  context: >-
    Confirm the alert is a true positive before investing further. The rule fires when EITHER tshark.exe ran with an
    interface-selection flag (-i) OR windump.exe ran by name. Note which branch fired: the tshark branch carries an explicit
    capture-interface argument worth reading, while the windump branch matches on binary name alone. Review the full Image
    path and CommandLine against these criteria.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to run packet-capture tools?
  context: >-
    Network and IT staff legitimately run capture utilities for troubleshooting; standard users and most servers do not.
    Knowing whether the user role and host function are consistent with packet capture is often the fastest way to separate
    routine administration from passive data collection by an operator.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What interface and capture filter did the command specify, and could the traffic expose credentials?
  context: >-
    Read the full command line to determine what was captured. For the tshark branch the -i argument names the target
    interface and any capture or display filter narrows the traffic; an unfiltered capture on a busy segment can record
    authentication exchanges, session tokens, and cleartext protocols. For the windump branch, examine the BPF expression and
    any output-file (-w) argument that would write captured packets to disk for later extraction. The scope of the capture
    determines which credentials or data may be exposed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned this capture tool and is that parent chain expected?
  context: >-
    The parent process reveals how the capture was launched. Interactive administration usually shows explorer.exe or a shell
    as the parent; capture tools spawned by script interpreters (wscript.exe, mshta.exe), Office applications, or remote-execution
    services such as wmiprvse.exe point to automated or operator-driven collection rather than hands-on troubleshooting.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did this capture tool spawn afterward?
  context: >-
    A capture tool that spawns command interpreters, archivers, or transfer utilities suggests the captured data is being
    processed or exfiltrated rather than read interactively. Unexpected children (cmd.exe, powershell.exe, certutil.exe, compression
    utilities) indicate the capture is one stage of a larger operation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run this capture tool?
  context: >-
    A capture binary that has never run on this host is more suspicious than one that runs regularly for monitoring. Zero or
    very low counts over the baseline window indicate first-time or rare execution and raise the priority of the other questions.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit?
  context: >-
    Even routine capture tools can be abused. The query mirrors the rule's EITHER-tshark-OR-windump selection scoped to this
    host, so the resulting parent and user distribution reflects how this specific firing pattern has historically run here.
    A new parent process, an unexpected account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_tshark:
        Image|endswith: \tshark.exe
        CommandLine|contains: -i
      selection_windump:
        Image|endswith: \windump.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, giving a fleet-wide count of this firing pattern
    rather than generic usage of the binaries. Many hosts firing the same pattern points to scripted deployment or monitoring
    automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent
    consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_tshark:
        Image|endswith: \tshark.exe
        CommandLine|contains: -i
      selection_windump:
        Image|endswith: \windump.exe
      condition: 1 of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_tshark:
        Image|endswith: \tshark.exe
        CommandLine|contains: -i
      selection_windump:
        Image|endswith: \windump.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_tshark:
        Image|endswith: \tshark.exe
        CommandLine|contains: -i
      selection_windump:
        Image|endswith: \windump.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether the capture is isolated or part of broader hands-on activity.
    If the same user triggered similar activity on multiple hosts, the scope of the operation may be larger than this single
    alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_tshark:
        Image|endswith: \tshark.exe
        CommandLine|contains: -i
      selection_windump:
        Image|endswith: \windump.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining activity around the capture event reveals what led to it and what followed,
    and whether it is part of a larger sequence. Look for reconnaissance, privilege changes, or staging of captured data.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, or privilege escalation — may reveal the attack
    stages that preceded the capture and help reconstruct the timeline. Promiscuous-mode capture often follows initial access
    and discovery.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Which accounts or services could have credentials exposed in the captured traffic, and do any have elevated privileges?
  context: >-
    The severity of a capture depends on what crosses the monitored segment. Authentication to domain controllers, administrative
    shares, or service endpoints can expose privileged credentials and warrants escalation; a capture on an isolated workstation
    segment may only need monitoring. Identify which accounts and services route traffic through the captured interface.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did other reconnaissance commands run on this host around the same time?
  context: >-
    A single capture may be legitimate troubleshooting, but capture alongside multiple reconnaissance commands in rapid
    succession — whoami, ipconfig, net, arp, netstat, nbtstat — is a signature of post-compromise enumeration. Network discovery
    binaries are especially relevant here because an operator maps the segment before or while capturing it.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: What process spawned the capture command, and is this a normal pattern?
  context: >-
    Capture tools launched from cmd.exe under explorer.exe or from a known automation script are typically administrative.
    Capture commands spawned by Office applications, script interpreters (wscript.exe, cscript.exe, mshta.exe), wmiprvse.exe,
    or wsmprovhost.exe indicate automated or remote post-exploitation rather than interactive troubleshooting.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
