name: Potential WinAPI Calls Via CommandLine
id: f7cbbd98-7f15-4a1e-8f2c-27ed982e8200
description: |
  Detects a process command line that contains the names of WinAPI functions (for example CreateRemoteThread, WriteProcessMemory, OpenProcess, VirtualAlloc, MiniDumpWriteDump) or low-level module names (kernel32, ntdll, secur32, Advapi32). This pattern is produced by tools that invoke native API functions directly through command-line parameters, which lets an operator perform process injection, token manipulation, memory dumping, or thread creation without a purpose-built binary on disk. Legitimate developer tooling, telemetry agents, and a small set of vendor binaries can also pass these strings on the command line, so the investigation determines what the invoked functions actually do, which process and user produced the command, and whether the activity is isolated or part of a sequence. The rule fires when the command line matches one of the WinAPI names and neither the MpCmdRun.exe nor the CompatTelRunner.exe known-benign filter applies.
type: detection
detection_id: ba3f5c1b-6272-4119-9dbd-0bc8d21c2702
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Which WinAPI function names appear in the alerting command line, and which process emitted it?
  context: Confirm the alert is a true positive by reviewing the exact command line against the rule's criteria. The rule fires when the command line contains any of the WinAPI function or module names (such as CreateRemoteThread, WriteProcessMemory, OpenProcess, VirtualAlloc, MiniDumpWriteDump, kernel32, ntdll) and neither the MpCmdRun.exe nor the CompatTelRunner.exe benign filter matches. Note which functions are present, because the set of functions named hints at the intended operation (memory write plus remote thread points to injection; token functions point to privilege manipulation; MiniDumpWriteDump points to credential dumping).
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run a process that passes WinAPI function names on the command line?
  context: Legitimate developer tooling, build automation, and a few telemetry or vendor utilities can pass these strings on the command line. Knowing whether the user role and host function are consistent with low-level API invocation is often the fastest way to separate a true positive from routine developer or administrative activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What does the full command line do? Decode the WinAPI function arguments and identify the intended operation.
  context: The full command line reveals which native API functions were requested and with what arguments. Decode the function names, handles, addresses, target process identifiers, and any encoded or pointer arguments to determine the operation. Memory allocation plus a write plus a thread-creation call indicates process injection; token functions such as DuplicateTokenEx, ImpersonateLoggedOnUser, or AdjustTokenPrivileges indicate privilege or impersonation manipulation; MiniDumpWriteDump indicates a memory dump of another process.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What is the executable that emitted this command line, and is the binary signed and located in an expected directory?
  context: The rule matches on command-line content rather than on a specific binary, so the executing process can be anything that forwards these arguments. Native API invocation through command-line parameters is characteristic of a generic launcher that runs arbitrary functions without a dedicated tool on disk. Identify the Image path, signing status, and original file name; an unsigned binary, a renamed system utility, or an executable in a user-writable directory (such as a temp, downloads, or public path) is the deviation worth chasing, while a known developer or vendor tool in its install path is consistent with legitimate use.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Did the alerting process load low-level native API modules such as ntdll.dll or kernel32.dll around the time of the command?
  context: Direct native API invocation depends on loading the modules that export those functions. Module-load events for ntdll.dll, kernel32.dll, advapi32.dll, or secur32.dll from the process that ran the command corroborate that the named functions were actually resolved and called, rather than merely appearing as harmless text. An unsigned or unusual module loaded immediately before the API calls strengthens the case for injection or in-memory tradecraft. If module-load events are not collected in this environment, treat zero results as a visibility gap rather than evidence nothing loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter:
        ImageLoaded|endswith:
          - \ntdll.dll
          - \kernel32.dll
          - \kernelbase.dll
          - \advapi32.dll
          - \secur32.dll
      condition: selection and filter
    fields:
      - Image
      - ImageLoaded
- question: Did the alerting process, or a process it spawned, write a memory-dump artifact consistent with OpenProcess/MiniDumpWriteDump being used against another process?
  context: OpenProcess, ReadProcessMemory, and MiniDumpWriteDump operate against a target process through a process
    handle, and that handle-open itself is not observable in this environment -- there is no process-access
    telemetry here, so a zero result below does not prove no other process was accessed. What is observable is the
    resulting artifact -- MiniDumpWriteDump and equivalent dumping techniques write the captured memory to a file on
    disk. A dump-style file written by this process or a child, especially one named after or sized like an lsass.exe
    dump, is the corroborating evidence that the named API calls reached a target process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process spawned the process that issued the WinAPI command, and is that parent chain expected?
  context: The parent process reveals how the command was invoked. A predictable parent (explorer.exe for interactive use, a build or developer tool for legitimate native-API work) is consistent with benign activity, while an unusual parent such as a script host (wscript.exe, cscript.exe), mshta.exe, an Office application, or a shell launched from a remote-access path points to exploitation or operator-driven execution. Walk up the tree from the immediate parent to see what launched it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did this process spawn afterward?
  context: The processes spawned after the WinAPI command reveal its actual impact. Native API invocation that precedes a spawned cmd.exe, powershell.exe, certutil.exe, or an unexpected payload binary indicates post-exploitation, whereas no children or only benign children is consistent with a self-contained operation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host has previously fired this WinAPI command-line pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even legitimate developer or vendor tooling can produce these command lines. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how the rule's specific firing pattern has historically run here, not generic process activity. A new parent process, an unexpected user account, or an unusual command-line structure relative to that history is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - AddSecurityPackage
        - AdjustTokenPrivileges
        - Advapi32
        - CloseHandle
        - CreateProcessWithToken
        - CreatePseudoConsole
        - CreateRemoteThread
        - CreateThread
        - CreateUserThread
        - DangerousGetHandle
        - DuplicateTokenEx
        - EnumerateSecurityPackages
        - FreeHGlobal
        - FreeLibrary
        - GetDelegateForFunctionPointer
        - GetLogonSessionData
        - GetModuleHandle
        - GetProcAddress
        - GetProcessHandle
        - GetTokenInformation
        - ImpersonateLoggedOnUser
        - kernel32
        - LoadLibrary
        - memcpy
        - MiniDumpWriteDump
        - ntdll
        - OpenDesktop
        - OpenProcess
        - OpenProcessToken
        - OpenThreadToken
        - OpenWindowStation
        - PtrToString
        - QueueUserApc
        - ReadProcessMemory
        - RevertToSelf
        - RtlCreateUserThread
        - secur32
        - SetThreadToken
        - VirtualAlloc
        - VirtualFree
        - VirtualProtect
        - WaitForSingleObject
        - WriteInt32
        - WriteProcessMemory
        - ZeroFreeGlobalAllocUnicode
      filter_optional_mpcmdrun:
        Image|endswith: \MpCmdRun.exe
        CommandLine|contains: GetLoadLibraryWAddress32
      filter_optional_compatTelRunner:
        ParentImage|endswith: \CompatTelRunner.exe
        CommandLine|contains:
        - FreeHGlobal
        - PtrToString
        - kernel32
        - CloseHandle
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_optional_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
