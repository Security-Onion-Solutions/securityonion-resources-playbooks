name: Potentially Suspicious DLL Registered Via Odbcconf.EXE
id: b16185d3-9f25-4ca8-ba2c-2e53ac757109
description: |
  Detects odbcconf.exe invoked with the REGSVR action against a module whose path does not carry a .dll extension. odbcconf.exe is a Microsoft-signed ODBC configuration utility; its REGSVR action calls DllRegisterServer in the named module, equivalent to regsvr32.exe, and requires only user privileges. Renaming the payload so it lacks a .dll extension is a defense-evasion move to slip past extension-based controls while proxying execution through a trusted binary. Legitimate ODBC driver registration almost always targets a real .dll, so the investigation should confirm the registered module, identify what spawned odbcconf.exe, and look for the loaded module and any follow-on process or network activity.
type: detection
detection_id: ba4cfc11-d0fa-4d94-bf20-7c332c412e76
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line show odbcconf.exe running the REGSVR action against a module without a .dll extension?
  context: Confirm the alert is a true positive by reviewing the exact command line and process details. The rule fires when Image ends in odbcconf.exe (or OriginalFileName is odbcconf.exe) AND the command line contains 'REGSVR ' AND the command line does not contain '.dll'. Verify all three conditions hold and read the registered module path.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to register ODBC drivers with odbcconf.exe?
  context: Legitimate ODBC driver registration is normally done by installers, packaging tools, or administrators on systems that host database connectivity. A user or host with no database-tooling role running odbcconf.exe REGSVR by hand is harder to explain and shifts the disposition toward proxy execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What module path did the REGSVR action target, and what does the full command line reveal?
  context: The full command line names the module odbcconf.exe was told to register. Decode the path and any switches — /S silent mode suppresses prompts and errors, and a module path pointing into a user-writable location (AppData, Temp, Public) or carrying a non-.dll extension such as .txt is the abuse pattern. Note whether a response file (/F) was used, which hides the directive from the command line.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned odbcconf.exe and is that parent chain expected?
  context: The parent process reveals how odbcconf.exe was invoked. Driver installation is typically launched by installers or administrative tooling. Parents such as mshta.exe, wscript.exe, powershell.exe, or an Office application point to a script-driven or exploitation chain rather than routine ODBC configuration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What modules did odbcconf.exe load shortly after this execution, and are any unsigned or in user-writable paths?
  context: The REGSVR action calls DllRegisterServer in the targeted module, so the loaded module is the payload regardless of its file extension. Review the modules odbcconf.exe loaded around this execution for unsigned binaries, modules outside System32/SysWOW64, or modules in user-writable directories. If image-load telemetry is not collected in this environment, treat zero results as a visibility gap and confirm the module from the command-line path instead.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- question: What child processes did odbcconf.exe spawn afterward?
  context: A registered module can launch follow-on activity. Child processes such as cmd.exe, powershell.exe, regsvr32.exe, certutil.exe, or rundll32.exe spawning from odbcconf.exe indicate the loaded module executed post-exploitation steps rather than performing routine ODBC configuration.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did odbcconf.exe make any network connections after this execution?
  context: A module loaded through the REGSVR action may beacon or pull a second-stage payload. odbcconf.exe is not normally a network-connecting process, so any outbound connection in the window after execution is worth correlating against the loaded module and the parent chain to reconstruct the timeline.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Does this host normally run odbcconf.exe?
  context: A binary that has never run on a host is more suspicious than one that runs regularly. Zero or very low historical counts for odbcconf.exe indicate first-time or rare execution, which weighs against a routine driver-configuration explanation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this odbcconf REGSVR pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even Microsoft-signed tools get abused. The query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution reflects how this specific REGSVR-without-.dll pattern has historically run here rather than generic odbcconf usage. A new parent process, an unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \odbcconf.exe
      - OriginalFileName: odbcconf.exe
      selection_cli:
        CommandLine|contains: 'REGSVR '
      filter_main_dll_ext:
        CommandLine|contains: .dll
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this odbcconf REGSVR pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this REGSVR-without-.dll pattern rather than generic odbcconf usage. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \odbcconf.exe
      - OriginalFileName: odbcconf.exe
      selection_cli:
        CommandLine|contains: 'REGSVR '
      filter_main_dll_ext:
        CommandLine|contains: .dll
      condition: all of selection_* and not 1 of filter_main_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \odbcconf.exe
      - OriginalFileName: odbcconf.exe
      selection_cli:
        CommandLine|contains: 'REGSVR '
      filter_main_dll_ext:
        CommandLine|contains: .dll
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \odbcconf.exe
      - OriginalFileName: odbcconf.exe
      selection_cli:
        CommandLine|contains: 'REGSVR '
      filter_main_dll_ext:
        CommandLine|contains: .dll
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints. If the same user triggered similar activity on multiple hosts, the scope of the operation may be larger than this one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \odbcconf.exe
      - OriginalFileName: odbcconf.exe
      selection_cli:
        CommandLine|contains: 'REGSVR '
      filter_main_dll_ext:
        CommandLine|contains: .dll
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, or persistence mechanisms.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the attack stages that preceded this event and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
