name: Sofacy Trojan Loader Activity
id: e01b53f9-c088-43ff-b590-f4f3d3b1bca7
description: |
  Detects rundll32.exe invoked against a file under the user's LocalAppData directory (a command line
  containing %LOCALAPPDATA% or \AppData\Local\) where the arguments either pass a .dat file to the DLL
  entry point or end in an ordinal call of the form .dll #1, .dll" #1, or .dll",#1 — with anything under
  \AppData\Local\Temp\ excluded. This is a loader launch pattern: a signed Microsoft binary is used to map
  a DLL that lives in a user-writable directory and to call its first export, so the payload never needs a
  process image of its own. Installers and vendor helpers do occasionally stage DLLs under LocalAppData and
  invoke them by ordinal, so the investigation should establish what the DLL is, which process wrote it to
  disk, whether it is signed, and whether rundll32 subsequently made network connections or spawned children.
type: detection
detection_id: ba778144-5e3d-40cf-8af9-e28fb1df1e20
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Does the command line show rundll32.exe pointed at a path under the user's LocalAppData directory,
    either passing a .dat file to the entry point or ending in an ordinal #1 call?
  context: >-
    The rule requires rundll32.exe plus a LocalAppData path, and then one of two alternative argument
    branches. Note which branch fired. A command line containing `.dat",` means a .dat data file was handed
    to the DLL entry point; a command line ending in `.dll #1`, `.dll" #1`, or `.dll",#1` means rundll32 was
    told to call the DLL's first exported ordinal by number rather than by name. Record the full DLL path
    from the command line — every later step anchors on it. Command lines under \AppData\Local\Temp\ are
    excluded by the rule, so the file is staged in a persistent user directory rather than a scratch folder.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run rundll32.exe against a DLL stored under the user's LocalAppData directory?
  context: >-
    Some packaged applications and update agents install per-user components under LocalAppData and launch
    them through rundll32.exe. Whether the account and the machine role fit that kind of software is often
    the fastest way to separate routine vendor behavior from an unexpected load.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this rundll32 execution part of an authorized penetration test or red team engagement?
  context: >-
    Proxying a DLL through rundll32.exe with an ordinal entry point is a common execution method in offensive
    tooling as well as in commodity loaders. If an assessment is active on this host or network segment,
    matching the DLL path and timing against the engagement scope can resolve the alert without further work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: What DLL path and entry point did rundll32 load, and what arguments were passed to it?
  context: >-
    Read the command line apart into its three parts: the DLL path, the entry point (an ordinal number such
    as #1, or an exported function name), and any trailing arguments such as a .dat file. The .dat file, when
    present, is usually the loader's configuration or an encrypted second stage rather than a document. This
    view covers every rundll32 invocation on the host in the surrounding window, so sequential loads that make
    up one operation appear together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: Which DLLs from the user's LocalAppData directory did rundll32 map into memory, and are they signed?
  context: >-
    The command line names a path, but the load event confirms the DLL was actually mapped and carries the
    signature and hash the process telemetry does not. An unsigned DLL, or one signed by a party unrelated to
    the software that is supposed to own that directory, is the deviation to pursue. The hash on the load
    event can be checked against reputation sources directly.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        ImageLoaded|contains: '\AppData\Local\'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: What process spawned rundll32, and is that parent chain expected?
  context: >-
    The parent identifies how the load was triggered. Installers, update services, and explorer.exe are
    routine launchers. A parent such as a document handler, a script host, an archive utility, or a binary
    that itself lives under a user-writable directory points at a dropper that staged the DLL and then invoked
    it. Also look at what else the parent spawned around the same moment.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Which process wrote DLL or .dat files into this host's LocalAppData directory, and when?
  context: >-
    rundll32 only executes the payload; something else placed it on disk. Match the DLL path recorded from
    the alerting command line against the writes listed here to identify the dropper and the staging time. A
    write that arrives moments before the load, from a browser, mail client, archive tool, or script host, is
    a different finding from a file laid down weeks earlier by a vendor installer. The \AppData\Local\Temp\
    subtree is excluded to mirror the rule's own carve-out.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\AppData\Local\'
        TargetFilename|endswith:
          - .dll
          - .dat
      filter_temp:
        TargetFilename|contains: '\AppData\Local\Temp\'
      condition: selection and not filter_temp
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
  answer_sources:
  - file_event
  - process_creation
- question: What files did rundll32 write on this host after the DLL was loaded?
  context: >-
    Once the DLL is mapped, its file activity is attributed to rundll32.exe. Loaders commonly write staging
    or configuration data next to themselves, into per-user cache directories, or into browser data folders,
    and those files persist after the process exits. The set of paths written tells you whether the load did
    installation work, data collection, or nothing observable at all.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: What child processes did rundll32 spawn afterward?
  context: >-
    A DLL running under rundll32 can do its work entirely in-process, so an empty result is not by itself
    exoneration. When children do appear — command interpreters, script hosts, certutil, or a binary from a
    user-writable path — they show the loaded code moving on to a next stage and give you a new process to
    follow.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Did rundll32 make outbound connections on this host around the time of the alert, and to which addresses and ports?
  context: >-
    A loader's purpose is usually to retrieve or report to a remote endpoint, and that traffic is attributed
    to rundll32.exe rather than to the DLL. Repeated connections to one address, or connections on 443 to an
    address with no matching enterprise service, are worth resolving against the destination's ownership.
    Resolved hostnames are recorded on separate lookup events, so anchor on the address and pivot to DNS
    activity if a name is needed.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
  - external_threat_intel
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    The load sits inside a sequence. Aggregating process and parent pairs on the host collapses routine agent
    telemetry into high-count rows and leaves novel pairings visible at low counts. Look for the delivery step
    before the load and for discovery or persistence work after it.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
- question: >-
    When this host has previously produced this same rundll32 load pattern, which parents and users drove it,
    and does the current alert fit that history?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the parent and user distribution
    reflects how this specific LocalAppData ordinal-load pattern has run here rather than generic rundll32
    usage. A recurring installer or update parent with a consistent user is a different picture from a first
    appearance under a new parent.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_path:
        Image|endswith: \rundll32.exe
        CommandLine|contains:
        - '%LOCALAPPDATA%'
        - \AppData\Local\
      selection_extensions:
      - CommandLine|contains: .dat",
      - CommandLine|endswith:
        - '.dll #1'
        - '.dll" #1'
        - .dll",#1
      filter_main_exclude_temp:
        CommandLine|contains: \AppData\Local\Temp\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: >-
    Have other hosts produced this same rundll32 load pattern in the past week, and does the cross-host
    distribution look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, giving a fleet-wide count of this
    specific pattern rather than of rundll32 generally. Many hosts firing the same pattern points to packaged
    software or a deployment that stages DLLs under LocalAppData; one host, or a small unrelated set, points
    to activity driven per-host. Use the distribution to calibrate how far the investigation needs to reach.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_path:
        Image|endswith: \rundll32.exe
        CommandLine|contains:
        - '%LOCALAPPDATA%'
        - \AppData\Local\
      selection_extensions:
      - CommandLine|contains: .dat",
      - CommandLine|endswith:
        - '.dll #1'
        - '.dll" #1'
        - .dll",#1
      filter_main_exclude_temp:
        CommandLine|contains: \AppData\Local\Temp\
      condition: all of selection_* and not 1 of filter_main_*
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Has this user previously produced this rundll32 load pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the user's 90-day
    history of this specific pattern rather than generic rundll32 usage, aggregated by host. A user who has
    never produced it before deserves more attention than one who does so routinely; weigh the count against
    what software that person is expected to run. If the alert fired under a service or machine account, this
    view attributes nothing and the launch-mechanism view is the meaningful one.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_path:
        Image|endswith: \rundll32.exe
        CommandLine|contains:
        - '%LOCALAPPDATA%'
        - \AppData\Local\
      selection_extensions:
      - CommandLine|contains: .dat",
      - CommandLine|endswith:
        - '.dll #1'
        - '.dll" #1'
        - .dll",#1
      filter_main_exclude_temp:
        CommandLine|contains: \AppData\Local\Temp\
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: >-
    Has this parent process historically driven this rundll32 load pattern on this host or across the
    environment, or is the parent new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute the behavior; the launch
    mechanism does. The query mirrors the rule's selection structure scoped to the alerting parent, so the
    result is the 90-day history of that parent driving this specific pattern, aggregated by host. A parent
    already accounting for thousands of prior events is software automation; a parent that is new to this
    pattern is the deviation worth chasing.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_path:
        Image|endswith: \rundll32.exe
        CommandLine|contains:
        - '%LOCALAPPDATA%'
        - \AppData\Local\
      selection_extensions:
      - CommandLine|contains: .dat",
      - CommandLine|endswith:
        - '.dll #1'
        - '.dll" #1'
        - .dll",#1
      filter_main_exclude_temp:
        CommandLine|contains: \AppData\Local\Temp\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What else did this user do across the network around this time?
  context: >-
    Following the account across every host shows whether the same person was active elsewhere in the same
    window, which bounds how far the staging and execution reached. If the alert fired under a service or
    machine account, expect this view to return routine agent telemetry and read the launch-mechanism view
    instead.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: >-
    Did this same parent-driven load pattern fire on other hosts in the same window, or is the activity
    isolated to this host?
  context: >-
    Under a service principal the network-wide user view returns agent noise, so the useful question is
    whether the same launch mechanism produced the same pattern elsewhere. The query mirrors the rule's
    selection structure scoped to the alerting parent, fleet-wide, in the alert window. Several hosts in the
    same window points to scheduled or pushed software; a single host points to a host-local trigger.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_path:
        Image|endswith: \rundll32.exe
        CommandLine|contains:
        - '%LOCALAPPDATA%'
        - \AppData\Local\
      selection_extensions:
      - CommandLine|contains: .dat",
      - CommandLine|endswith:
        - '.dll #1'
        - '.dll" #1'
        - .dll",#1
      filter_main_exclude_temp:
        CommandLine|contains: \AppData\Local\Temp\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    A loader launch is rarely the first observable step. Earlier detections covering delivery, script
    execution, or defense tampering on the same host help place this load in a sequence and identify where
    the staged DLL came from.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
