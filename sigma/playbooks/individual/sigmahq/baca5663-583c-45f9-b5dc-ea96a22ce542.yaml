name: Sticky Key Like Backdoor Usage - Registry
id: ed6b478b-da0a-4a30-859a-0e72c59b614b
description: |
  Detects a registry write that sets a Debugger value under an Image File Execution Options (IFEO)
  key for a built-in Windows accessibility binary — sethc.exe, utilman.exe, osk.exe, Magnify.exe,
  Narrator.exe, DisplaySwitch.exe, atbroker.exe, or HelpPane.exe. The rule fires when the
  TargetObject ends in one of these IFEO Debugger paths. An IFEO Debugger entry tells Windows to
  launch the named program instead of the target binary, so setting the Debugger for an
  accessibility feature to cmd.exe (or another payload) means that invoking that feature at the
  locked logon screen — for example pressing Shift five times for sethc.exe or the ease-of-access
  hotkeys for the others — launches the debugger as SYSTEM under winlogon.exe with no
  authentication. This is a combined persistence and privilege-escalation backdoor; legitimate
  Debugger entries on accessibility binaries are effectively nonexistent. Investigate which
  accessibility key was set and to what command, which process wrote it and what launched that
  process, whether the debugger subsequently executed as SYSTEM, whether a payload landed on disk,
  and whether the value was later reverted.
type: detection
detection_id: baca5663-583c-45f9-b5dc-ea96a22ce542
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting write set a Debugger value on an accessibility binary's IFEO key?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when
    the written key path ends in an Image File Execution Options Debugger entry for one of the
    built-in accessibility binaries (sethc.exe, utilman.exe, osk.exe, Magnify.exe, Narrator.exe,
    DisplaySwitch.exe, atbroker.exe, HelpPane.exe). Review the exact TargetObject and the value data
    on the triggering event: a Debugger entry on any of these binaries redirects the accessibility
    feature to run the named command, and there is no routine reason for one to exist.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify Image File Execution Options debugger keys?
  context: >-
    IFEO Debugger keys are a developer and debugging facility that is essentially never configured on
    accessibility binaries in normal operations. Knowing whether the writing account and host
    function correspond to any sanctioned debugging or software-deployment activity is the fastest
    way to separate a rare legitimate change from a backdoor being planted. User attribution is
    present on roughly 94% of endpoint registry events; when it is a machine account or SYSTEM, pivot
    on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which accessibility binary's IFEO Debugger key was set, and why is this a hijack location?
  context: >-
    The specific key path names the accessibility feature that has been backdoored — sethc.exe is the
    Sticky Keys handler reachable by pressing Shift five times, utilman.exe is the ease-of-access
    button, and osk.exe, Magnify.exe, Narrator.exe, DisplaySwitch.exe, atbroker.exe, and HelpPane.exe
    are the other logon-screen-accessible tools. A Debugger value under any of their IFEO keys tells
    Windows to run that command in place of the feature, so identifying the exact key establishes
    which accessibility trigger now yields code execution, and the value data determines what runs.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What command was written to the Debugger value, and what will it launch?
  context: >-
    The Details field holds the command Windows will run when the accessibility feature is invoked.
    Decode it: the classic backdoor sets the Debugger to cmd.exe, yielding a SYSTEM command prompt at
    the logon screen, but the value can equally point at powershell.exe with an inline or encoded
    payload or at a dropped binary. A path outside System32 becomes a lead for confirming a payload on
    disk; a built-in interpreter means the backdoor is fileless. Details is present on roughly 79% of
    registry modifications and should be populated for this string value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote this Debugger value, and what launched that process?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to
    read its Image, full command, and parent. A reg.exe, powershell.exe, or cmd.exe write launched
    from a script host such as wscript.exe or mshta.exe, an Office application, a remote-access tool,
    or an unsigned binary points to the backdoor being planted programmatically rather than a
    deliberate administrator action. The parent chain distinguishes a scripted implant from an
    interactive console session.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: After the Debugger value was set, did the accessibility binary's debugger execute as SYSTEM?
  context: >-
    The backdoor fires when the accessibility feature is next invoked at the logon screen, which may
    be well after the registry write. When it does, Windows launches the Debugger command with the
    accessibility binary path as its argument, so the debugger process (commonly cmd.exe or
    powershell.exe) runs under winlogon.exe in the SYSTEM context. This query lists processes that
    reference an accessibility binary in their command line but are not the accessibility binary
    itself; a winlogon.exe parent and a SYSTEM user on such a process confirm the backdoor executed.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_ref:
        CommandLine|contains:
          - '\sethc.exe'
          - '\utilman.exe'
          - '\osk.exe'
          - '\Magnify.exe'
          - '\Narrator.exe'
          - '\DisplaySwitch.exe'
          - '\atbroker.exe'
          - '\HelpPane.exe'
      filter_self:
        Image|endswith:
          - '\sethc.exe'
          - '\utilman.exe'
          - '\osk.exe'
          - '\Magnify.exe'
          - '\Narrator.exe'
          - '\DisplaySwitch.exe'
          - '\atbroker.exe'
          - '\HelpPane.exe'
      condition: selection and selection_ref and not filter_self
    fields:
      - Image
      - CommandLine
      - ParentImage
      - User
- question: If the Debugger value references a file on disk, was that payload written and does it still exist?
  context: >-
    When the Debugger value points at a built-in interpreter such as cmd.exe the backdoor is fileless,
    but when it points at a path outside System32 that executable has to exist for the backdoor to
    run. Correlating file activity by the writing process and its children finds a payload dropped in
    the same session as the registry write. The file-write event carries no hash; if the payload is
    present, hash it from a later execution or retrieve it for a reputation lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was the Debugger value later removed, reverted, or changed again on this host?
  context: >-
    Registry key and value deletions are not observable in this telemetry, so durability is judged
    from the key's re-modification history rather than from a delete event. A later write that clears
    or overwrites the Debugger value indicates the backdoor was pulled or updated, while the value
    persisting leaves the accessibility feature primed to run the planted command on every future
    logon. Compare the value data written to this key over the following window.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Has this accessibility IFEO Debugger key been modified before on this host?
  context: >-
    An IFEO Debugger entry on an accessibility binary should never change through normal use, so a
    history with no prior writes makes this a first-time change and raises its weight. A history of
    periodic writes to the same key would instead point to a debugging or management process worth
    identifying. Compare the historical value data to see whether a Debugger command was ever set here
    before or whether this is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same accessibility Debugger key modified on other hosts in the environment?
  context: >-
    The same write across many hosts suggests a broad tool run or a mis-scoped deployment, while the
    same write confined to one host suggests a targeted backdoor. Compare the value data across hosts
    to see whether they all plant the same command and whether the writing process is consistent,
    which separates a single hands-on operation from repeated use of the technique across the
    environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor who plants an accessibility backdoor often makes other configuration changes in the same
    session — additional IFEO Debugger entries on other accessibility binaries, Defender or firewall
    policy edits, or Run-key and service persistence. Clustering the registry writes on this host in a
    short window around the alert reveals the full scope of changes and which process made them. The
    triggering key appears in the results; the signal is what else was modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    The registry write rarely happens in isolation. Aggregating process activity in a tight window
    around the alert surfaces what led up to the key being set and what ran immediately after. Novel
    parent-child pairs stand out at low counts against high-count routine telemetry, which is what
    points to the tool that planted the backdoor and to any reconnaissance or staging around it.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — reconnaissance, execution of scripting tools, credential
    access, or defense tampering — may reveal the stages that preceded this change and help
    reconstruct the timeline. Planting an accessibility backdoor is typically a step toward persistent
    SYSTEM access, so prior alerts help place this write within a larger sequence of activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Attackers rarely rely on a single persistence mechanism. Scheduled tasks, services, registry Run
    keys, BITS jobs, or WMI subscriptions created by schtasks.exe, sc.exe, reg.exe, bitsadmin.exe, or
    wmic.exe near the accessibility Debugger write indicate the backdoor is one of several footholds
    being stacked rather than an isolated change. Multiple persistence installations in the same
    timeframe point to a hands-on session rather than routine administration.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely — dropping an executable or script
    into a Startup folder or a path referenced by a registry Run key achieves persistence without
    invoking schtasks, sc, or reg. File writes to these locations near the accessibility backdoor
    indicate a parallel persistence mechanism was established on disk alongside the IFEO Debugger
    entry.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Does an administrator recall setting a debugger on this accessibility binary?
  context: >-
    An IFEO Debugger entry on an accessibility binary has no routine reason to exist, so direct
    confirmation from the responsible team is a fast way to resolve the alert. If an administrator or
    red-team operator set the value while testing debugging or accessibility behavior, that closes it;
    if no one recalls the action, the account may be compromised or the change was made by automated
    tooling, and the investigation should continue into the writing process and any SYSTEM-context
    execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
