name: Shai-Hulud 2.0 Malicious NPM Package Installation
id: be1647c1-ec6e-4f28-9e99-d70a9eef683f
description: |
  Detects node.exe running an npm install invocation — `install` or ` i ` on the command line — whose
  command line also names one of a fixed list of package-and-version strings published during the
  Shai-Hulud 2.0 npm supply-chain compromise. Both conditions must hold, so the alert means an affected
  package version was named explicitly on an install command line; an install that resolves the same
  version transitively from a manifest or lockfile does not carry the string and will not fire, which
  makes a single alert a floor on exposure rather than a complete picture. Compromised packages of this
  class run credential-collection code from preinstall/postinstall lifecycle scripts, reading npm and
  source-control tokens, SSH keys, cloud credentials from local configuration files, environment
  variables, and instance metadata services, then reuse stolen publishing tokens to publish further
  affected versions. The investigation should establish whether lifecycle scripts were allowed to run,
  what the install process and its children did, where it connected, and which credentials were reachable
  from this host or build runner.
type: detection
detection_id: bae7c70b-8569-44e9-accf-b30073da8a5d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the alerting command line show node.exe running an npm install that names one of the package-and-version strings this rule lists?
  context: >-
    The rule fires only when both conditions hold — the process is node.exe with `install` or ` i ` on the
    command line, and that same command line contains one of a fixed list of package-and-version strings.
    Read the full command line and record which package and version was named, because that string is what
    the rest of the investigation keys on.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to install npm packages?
  context: >-
    node.exe running package installs is routine on developer workstations and build runners, and unusual
    almost everywhere else. Establish which population this host belongs to before anything else: on a
    workstation or runner the install itself is expected and the discriminator is what the install did,
    while on a general-purpose endpoint the invocation is already out of pattern.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What invoked this install, and was it a human action or an automated build step?
  context: >-
    The parent process and its command line usually carry the npm invocation itself and the project
    directory, and show whether the caller was an interactive shell, an editor, or a pipeline agent. That
    separates a developer who typed a package name from a build step replaying a manifest, and it names the
    project whose dependency tree needs review.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - manual_review
  - edr_console
- question: Which version of the named package is pinned in this project, and has it been rolled back to a build published before the affected versions appeared?
  context: >-
    Remediation for an affected package version is pinning or rolling back to a build published before the
    compromised versions were released. The same version commonly remains pinned in lockfiles, container
    images, and other projects on the same host, so the rollback check extends beyond the directory the
    install ran in.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Did this same detection fire on other hosts or for other users in the last 24 hours?
  context: >-
    An affected package version reaches every host that installs it, so the same detection firing across
    several hosts usually reflects a shared project or pipeline rather than unrelated events. The host and
    account breakdown shows how many systems installed an affected version and therefore need the same
    credential review.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - alert
- question: What did this node.exe invocation actually do, and were install lifecycle scripts allowed to run?
  context: >-
    The command line carries the package and version, the install flags, and the working directory that
    identifies the project. Credential-collection code in this class of package runs from preinstall and
    postinstall lifecycle scripts, so whether the invocation carried a flag disabling those scripts
    determines whether the payload executed at all. The working directory names the project whose
    dependency tree pulled the package in.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned the npm client, and is that parent chain expected on this host?
  context: >-
    The process above the npm invocation shows whether the install was reached through an interactive
    session or through an automated build agent. Build agents run installs continuously, so on a runner the
    parent chain is expected and the investigation moves to what the install executed; on a workstation an
    install driven by a scheduler, a remote-execution parent, or a script host is a different question.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What files did the install process write outside the package tree?
  context: >-
    A package install writes into the project's node_modules directory as a matter of course. Writes from
    the same process to locations outside that tree — user profile paths, temporary directories, startup
    directories, shell profiles, or workflow definitions under a source-control directory — are the install
    doing something other than unpacking a package. The query excludes node_modules paths so the remainder
    is readable; monitored install locations in this environment (program directories, ProgramData,
    %LOCALAPPDATA%) deserve the closest reading.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      filter_package_tree:
        TargetFilename|contains: \node_modules\
      condition: selection and not filter_package_tree
    fields:
      - TargetFilename
  answer_sources:
  - file_event
  - manual_review
- question: Which native modules did the install process load, and are they signed by publishers this environment accepts?
  context: >-
    Package installs build and load native modules, and some of those modules read local credential stores.
    Reviewing what the install process loaded, and whether each module's signature status matches the
    publishers normally allowed here, shows whether the install pulled in code that reaches beyond the
    package tree. An unsigned module, or one signed by a publisher outside the allow-list, is worth
    identifying by path.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
  answer_sources:
  - process_creation
  - manual_review
- question: What child processes did node.exe spawn on this host after the install?
  context: >-
    Lifecycle scripts execute as children of the install — shells, further node processes, package
    managers, container clients, cloud command-line tools. Credential collection and container escape in
    this class of package run from those children, so a child invoking a shell, a container client with a
    host filesystem mount, or a cloud CLI is the payload rather than a build step. Correlate the install,
    the files it wrote, and any outbound connections within roughly a 90-minute window; the query uses four
    hours so staged or retried steps stay visible.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Did the install process write any registry values?
  context: >-
    An npm package install has no reason to write to the registry. Any value written by the install
    process, particularly under a Run key or an environment-variable path, is the install doing something
    other than unpacking a package, and the target key and data identify what. Value deletion is not
    observable in most endpoint telemetry, so read an empty result as absence of writes rather than proof
    nothing was left behind.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
  answer_sources:
  - manual_review
- question: Where did the install process connect outbound, and were those destinations only package registry endpoints?
  context: >-
    A normal install talks to a package registry and nothing else. Credential-collection code in this class
    of package sends collected secrets to an external endpoint and reuses stolen publishing tokens against
    the registry to publish further affected versions, so the destinations worth separating are the
    registry and enterprise proxy or cache endpoints, instance metadata addresses, and everything else.
    Resolve destination addresses to their owners rather than relying on a destination hostname field,
    which is populated by a separate lookup event and is usually absent.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
  answer_sources:
  - network_connection
  - external_threat_intel
- question: Which credentials were reachable from this host or build runner at the time of the install, and have they been rotated?
  context: >-
    Payloads in this class read npm and source-control tokens, SSH keys, cloud credentials from local
    configuration files, environment variables, and instance metadata services. Those secrets work from
    anywhere once copied, so isolating the host does not contain them — enumerate what this host or runner
    held and rotate it, including any publishing token that could republish packages this account
    maintains. Build runners are often ephemeral, so the on-host evidence may already be gone while the
    exposure remains.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - asset_inventory
  - manual_review
- question: How routinely does node.exe run on this host, and under which accounts?
  context: >-
    A 90-day count separates a developer workstation or build runner, where node.exe runs constantly, from
    a host where it is rare or new. Where there is no install history the invocation itself is the finding;
    where installs run all day the count is expected and the investigation rests on what this install
    executed. The account breakdown shows whether the install ran under a human account or a build service
    account.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: What else did this user run across the environment around this time?
  context: >-
    Dependency installs for the same project frequently run under one account on several machines. Tracking
    the account across hosts in a one-hour window shows whether an affected package version was installed
    in more than one place. When the alert fires under a service or machine account this view returns
    routine automation volume, and the parent-process view of the same window is the meaningful one.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did the same parent process drive node.exe executions on other hosts in this window?
  context: >-
    When the install runs from a build agent or a service, the parent process is the attributing identity
    rather than the account name. Aggregating node.exe executions under the same parent across hosts shows
    whether one pipeline definition pulled dependencies onto several runners. A parent that exists only on
    this host, such as an interactive shell, returns this host alone, which is itself informative.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \node.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: selection and _pb_scope
    fields:
      - host.name
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating processes and their parents over a 15-minute window collapses routine build and agent
    volume into high-count rows while novel parent-child pairs stand out at low counts. Around an install,
    the pairs worth reading are shells, container clients, cloud command-line tools, and archive utilities
    under a node.exe parent.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host can show how the affected package version arrived — a repository
    clone, a pipeline run, or a prior install of the same dependency tree. On a build runner, prior alerts
    also indicate whether the runner had already handled other affected projects in the same session.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
