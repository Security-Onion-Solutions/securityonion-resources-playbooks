name: Office Autorun Keys Modification
id: 01e7b0af-8f27-432d-adfd-4ca44d02ad5b
description: |
  Detects modification of Microsoft Office add-in registry keys used as autostart extensibility points (ASEP). The rule fires
  when a registry value is written whose TargetObject path contains an Office root (\Software\Microsoft\Office or its
  Wow6432Node equivalent) AND an application Add-ins subpath (Word, Excel, Outlook, PowerPoint, OneNote, Access), and the
  write is not one of the known add-in installers, Office ClickToRun, VSTO, or antivirus components. Adversaries register
  malicious add-ins here so their code loads whenever the corresponding Office application starts; many legitimate add-ins
  use the same keys, so the investigation determines whether the writing process, value data, and timing are consistent with
  an approved add-in deployment or with attacker-installed persistence.
type: detection
detection_id: baecf8fb-edbf-429f-9ade-31fc3f22b970
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Do the registry key path and value data match the Office add-in autostart pattern this rule detects?
  context: Confirm the alert is a true positive by reviewing the exact key path (TargetObject) against the rule's criteria -- an
    Office root path combined with an application Add-ins subpath, carrying non-empty value data written by a process outside
    the known add-in installer list. Note the writing process and value data so the rest of the investigation can judge whether
    the add-in registration is legitimate.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to register or modify Office add-ins?
  context: Office add-in keys are written during legitimate add-in installs and updates. Knowing whether the account and host
    normally install Office extensions -- an end-user workstation with a supported plugin versus an unrelated server -- is
    often the fastest way to separate a routine deployment from attacker persistence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What specific Office add-in key and value were modified, and is this a known persistence location?
  context: Office application Add-ins keys are an autostart extensibility point -- whatever add-in is registered here loads
    when the corresponding Office application launches. The exact subkey (which application, which add-in ProgID) and the value
    data determine what will execute. Treat this as a persistence-relevant location and read the value data to see what add-in
    is being registered.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value data is being written to this add-in key, and does it reference a file path, CLSID, or LoadBehavior setting?
  context: The value data reveals what the add-in registration points to -- a ProgID or CLSID that resolves to a DLL, a friendly
    name, or a LoadBehavior DWORD that controls whether the add-in auto-loads. A value referencing a binary in a user-writable
    location (Temp, AppData, ProgramData) or an unfamiliar CLSID warrants more scrutiny than a value matching a known vendor
    add-in.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote this Office add-in key, and what started that process?
  context: The writing process and its parent reveal how the add-in was registered. A registration performed by an Office
    installer, msiexec, or a management agent is routine; one performed by a script host, an Office application spawning a
    shell, or a process launched from a user-writable path suggests the add-in was installed outside normal software deployment.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Were other registry modifications made on this host in the same session?
  context: Attackers who register a malicious add-in often make additional registry changes in the same session -- disabling
    protection settings, adding a Run key, or registering the add-in's CLSID under Classes. Registry changes from the same
    writing process within a short window reveal the full scope of the configuration changes and whether multiple objectives
    were pursued.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Is the add-in's referenced executable or DLL present on disk, and does the registration survive reboot?
  context: An Office add-in registration only executes code if the referenced binary or script exists at the path the registration
    resolves to. Correlating file activity from the registering process and its children shows whether the payload was dropped
    in the same session. The file-write event carries no hash; if the payload is present, hash it from a later execution or
    retrieve it for a reputation lookup. Judge reboot persistence from the value data and the key's later modification history
    rather than from any delete event.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other process activity occurred on this host around the time of the add-in registration?
  context: Examining process activity in the minutes around the registry write reveals what led to the add-in registration
    and what followed -- a document opening, a script host launching, or a download utility running. Novel parent-child pairs
    stand out against routine background process noise.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Was there a change ticket, deployment, or documented approval for this Office add-in?
  context: Many organizations deploy Office add-ins through managed software distribution and record it. A corresponding change
    record suggests an authorized add-in rollout; absence of one when policy requires it suggests the registration was made
    outside normal deployment.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this add-in registration align with normal work hours or a maintenance window?
  context: Legitimate add-in installs typically occur during business hours or scheduled software-deployment windows. A registration
    written outside those windows, or on a host that is not normally administered at that time, is more suspicious than the
    same change during a documented rollout.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Has this Office add-in key been modified before on this host?
  context: A first-time modification to an add-in key is more notable than a routine one. Some add-in keys are rewritten on
    every Office update; a key that has never been touched before and suddenly receives a value stands out. Compare historical
    value data to see whether the same registration recurs or this write is unique.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this Office add-in key modified on other hosts in the environment?
  context: The same add-in registration across many hosts often indicates a managed deployment or a legitimate software rollout;
    a modification isolated to this host may be targeted. Comparing the value data across hosts distinguishes a fleet-wide
    install from a one-off registration.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Were other process-based persistence mechanisms installed on this host?
  context: Attackers rarely rely on a single persistence mechanism. Alongside an add-in registration they commonly install
    backups using scheduled tasks, services, or registry Run keys. Persistence-tool executions clustered in the same timeframe
    indicate intentional stacking rather than an isolated add-in install.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations such as the Startup folder or scheduled-task definition paths on this host?
  context: File-based persistence bypasses registry-key detection entirely. Dropping an executable or script into a Startup
    folder or a path referenced by a Run key achieves autostart without touching the add-in keys. File monitoring captures
    these drops even when the add-in registration is only one part of the activity.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- defense tampering, reconnaissance, or credential access -- may reveal the
    stages that preceded the add-in registration and help reconstruct the timeline. Persistence is often established after
    an initial foothold.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
