name: Potential Credential Dumping Attempt Using New NetworkProvider - CLI
id: 77e82d2b-557f-4eb4-83a1-9e742f699ce7
description: |
  Detects command-line activity that registers a new Windows network provider by writing under
  HKLM\System\CurrentControlSet\Services\<name>\NetworkProvider, the same mechanism the NPPSpy
  technique abuses to capture cleartext logon credentials. A malicious network-provider DLL is
  called via NPLogonNotify during every interactive, RDP, or network logon and receives the user's
  plaintext password. Legitimate uses are rare and limited to vendor or OS installers registering
  their own provider (RDPNP, LanmanWorkstation, WebClient, and a few known products); investigation
  should determine which service name and provider DLL were registered, whether the writer is a
  trusted installer, and whether logon-time credential capture or follow-on lateral movement occurred.
type: detection
detection_id: baef1ec6-2ca9-47a3-97cc-4cf2bda10b77
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line register a new network provider under the CurrentControlSet Services key?
  context: Confirm the alert is a true positive by reviewing the exact command line. The rule fires when
    a single command references both \System\CurrentControlSet\Services\ and \NetworkProvider, the
    registry location where a network-provider DLL is registered. Verify the full path being written and
    the provider name before investing further investigation time.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to register Windows network providers?
  context: Registering a network provider is an administrative action that is almost never performed
    interactively outside of software installation. If the user role is not a software installer or
    OS-deployment account and the host is not in an active build or imaging state, the action is
    unexpected and raises the priority of the investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What provider name and DLL path were registered, and is the DLL a known trusted provider?
  context: The command writes a ProviderPath value naming the DLL that Windows will load at logon. Decode
    the full command line to extract the service name and the DLL path. A DLL under C:\Windows\System32
    or %TEMP% with an unfamiliar name, or any name outside the known set (RDPNP, LanmanWorkstation,
    WebClient, and a small number of vendor products such as GoogleDriveFS), indicates a planted
    credential-capture provider rather than a legitimate one.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What specific registry key and value were written, and does it set a ProviderPath DLL or alter the provider order?
  context: The registry write reveals intent. A ProviderPath value under
    HKLM\System\CurrentControlSet\Services\<name>\NetworkProvider registers a DLL that runs at logon; a
    write to ...\Control\NetworkProvider\Order\ProviderOrder (or HwOrder) inserts the new provider into
    the active dispatch chain. Both together complete the credential-capture setup. The TargetObject and
    Details fields show the exact key path and value data written.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Were other registry modifications made on this host in the same session, especially to ProviderOrder?
  context: Registering a credential-capture provider requires more than one write — the DLL is registered
    under the service key AND the provider name is appended to the ProviderOrder (or HwOrder) list so the
    chain calls into it at logon. Finding clustered registry writes from the same host within a short
    window reveals whether the full setup was completed and whether other persistence or evasion keys were
    touched at the same time.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - 'ProviderOrder'
          - 'Set-ItemProperty'
          - 'New-ItemProperty'
      condition: selection and selection_reg
    fields:
      - CommandLine
- question: What process spawned this command and is that parent chain expected?
  context: The parent process reveals how the registration was launched. A logon-script, deployment-agent,
    or installer parent is consistent with legitimate provider setup; parents such as mshta.exe,
    wscript.exe, an Office application, or an interactive shell launched from an unusual location point to
    operator activity or malicious scripting.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit?
  context: Even legitimate provider registration recurs in predictable ways. The query mirrors the rule's
    selection scoped to this host, so the resulting parent and user distribution reflects how this exact
    NetworkProvider-registration pattern has run here before. A new parent process, an unexpected user
    account, or a first-time appearance of the pattern is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - \System\CurrentControlSet\Services\
        - \NetworkProvider
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of the
    NetworkProvider-registration pattern rather than generic CLI usage. Many hosts firing the same pattern
    points to scripted deployment or vendor automation; one host or a small unrelated set points to manual
    operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - \System\CurrentControlSet\Services\
        - \NetworkProvider
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - \System\CurrentControlSet\Services\
        - \NetworkProvider
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - \System\CurrentControlSet\Services\
        - \NetworkProvider
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across
    multiple endpoints. If the same user triggered comparable registry or credential-access activity on
    multiple hosts, the scope of the operation may be larger than this single registration.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - \System\CurrentControlSet\Services\
        - \NetworkProvider
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate
    context: what led to the registration, what happened after, and whether it is part of a larger
    sequence. Look for reconnaissance, the DLL drop, privilege escalation, or additional persistence
    mechanisms.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering,
    reconnaissance, or other credential-access activity — may reveal the attack stages that preceded the
    provider registration and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Which accounts log on to this host, and do any have elevated privileges?
  context: A network-provider DLL captures the cleartext password of every account that logs on to the
    host while it is registered, so exposure scales with who uses the machine. If domain admins, service
    accounts, or other privileged identities log on interactively or over RDP to this host, treat their
    credentials as potentially captured and escalate accordingly.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Was a new DLL written to disk on this host shortly before the provider registration?
  context: A NetworkProvider credential capture requires a provider DLL on disk that the ProviderPath value
    points to. A DLL created under C:\Windows\System32, %TEMP%, or a user-writable path shortly before the
    registration, especially one that is unsigned or signed by an unfamiliar publisher, is the payload that
    will receive cleartext passwords at logon. Correlate the dropped file path with the ProviderPath value
    written to the registry.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: '.dll'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
