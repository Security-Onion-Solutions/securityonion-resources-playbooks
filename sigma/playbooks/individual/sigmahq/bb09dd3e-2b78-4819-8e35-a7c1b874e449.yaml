name: HackTool - Inveigh Execution Artefacts
id: d9b8dcf0-86bc-4fc9-8c6a-8ff015e69fd0
description: |
  Detects Inveigh artefacts written to disk. Inveigh is a Windows LLMNR/NBNS/mDNS/DHCPv6 spoofing and NTLM
  credential-capture and SMB-relay tool; the rule fires when its binaries (Inveigh.exe/.dll/.ps1, Inveigh-Relay.ps1)
  or its output files (Inveigh-NTLMv2.txt, Inveigh-NTLMv1.txt, Inveigh-Cleartext.txt, Inveigh-*Users.txt,
  Inveigh-Log.txt, Inveigh-FormInput.txt) appear on a host. The binaries indicate the tool was staged; the
  capture-output files indicate credentials were actually harvested. Determine whether an authorized engagement
  explains it, which capture files exist, how the tool was launched, whether it relayed captured authentication to
  internal targets, and how far the artefacts spread.
type: detection
detection_id: bb09dd3e-2b78-4819-8e35-a7c1b874e449
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the file path and creating process match an Inveigh artefact?
  context: >-
    Confirm the alert is a true positive by reviewing the exact file name, the operation performed
    (created/renamed/deleted), and the writing process. The rule matches Inveigh's own file names — its binaries
    (Inveigh.exe/.dll/.ps1, Inveigh-Relay.ps1) and its capture-output files (Inveigh-NTLMv2.txt, Inveigh-NTLMv1.txt,
    Inveigh-Cleartext.txt, Inveigh-*Users.txt, Inveigh-Log.txt, Inveigh-FormInput.txt). Which name fired determines
    whether the tool was merely staged or has already produced captured credentials.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to run a network credential-capture tool?
  context: >-
    A LLMNR/NBNS/mDNS responder and NTLM-relay tool has almost no legitimate purpose outside sanctioned security
    testing. Knowing whether the user role and host function fit that activity is the fastest way to separate an
    authorized assessment from an intrusion. When the writing account is a machine or service account, judge by the
    writing process and the host's role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this Inveigh execution part of an authorized penetration test or red team engagement?
  context: >-
    Inveigh is used in authorized internal assessments to demonstrate LLMNR/NBNS poisoning and NTLM-relay exposure.
    Before investing analysis time, check whether a pentest or red team exercise is active on this host or network
    segment. An authorized engagement with matching tooling, host, and timing resolves the alert without further work;
    absence of one on a production host makes captured-credential output a live credential-access incident.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which Inveigh capability was invoked — passive sniffing, active spoofing, or NTLM relay?
  context: >-
    Inveigh is multi-purpose: it can passively sniff, actively spoof LLMNR/NBNS/mDNS/DHCPv6 to coerce authentication,
    and relay captured NTLM to other SMB servers (Inveigh-Relay). The command line and which script or binary ran
    reveal which mode was active, which determines the blast radius — passive capture yields crackable hashes, while
    active relay can authenticate to other hosts directly. Inveigh-Relay.ps1 or relay-related switches point to the
    most severe path.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the dropped file the real Inveigh tool or a renamed or decoy binary — check size, signing, and strings?
  context: >-
    For the binaries (Inveigh.exe/.dll/.ps1), confirm the artefact is the genuine tool rather than a look-alike:
    check the on-disk size, digital signature status, and characteristic strings (the startup banner "Inveigh"
    with version and PID, listener flags, and the fixed output-file naming). For the .txt output files, read the
    contents directly — the NTLM/Cleartext files list captured credentials with source IPs and account names.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If the Inveigh binary executed, what is its hash and does it have known AV or threat-intel detections?
  context: >-
    A file's hash is recorded when it runs, not when it is written (file-creation events carry no hash). This query
    looks for the Inveigh binary executing and reads its hash; submit that to reputation and threat-intel services to
    confirm identity and pull any prior sightings. If only the .txt output files are present and no binary executed
    here, the tool likely ran from memory or from a script host — pivot to the launching process and retrieve the
    on-disk binary for manual hashing.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
- question: Which Inveigh output files exist on this host, and do the captured-credential files show harvested accounts?
  context: >-
    Inveigh writes a fixed set of files as it runs. The presence of Inveigh-NTLMv2.txt, Inveigh-NTLMv1.txt,
    Inveigh-Cleartext.txt, or the -*Users.txt files means credentials were actually captured, not merely that the
    tool was staged — every account and host listed in them should be treated as exposed and considered for a
    credential reset. Enumerate all Inveigh files created by the responsible process to gauge how long it ran and
    what it collected.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Have Inveigh artefacts been written on this host before?
  context: >-
    A first-time appearance of these file names is more suspicious than a recurring one. Zero or very low history
    indicates a new intrusion or a one-off test; a recurring pattern may point to a lab, a training host, or a
    scheduled assessment. Compare the writing process across occurrences to see whether the launch mechanism is
    consistent.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Are Inveigh artefacts present on any other hosts in the environment?
  context: >-
    The same tool file names on multiple hosts point to a broader operation or deliberate distribution; a single host
    points to a targeted or host-local run. Because Inveigh poisons name resolution on the local segment, its presence
    on several hosts in the same subnet can mean multiple capture points. Compare the writing process and timeline
    across hosts to reconstruct how it spread.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- question: What process spawned the tool, and is that parent chain expected?
  context: >-
    The parent process reveals how Inveigh was launched — an interactive shell, a script host (powershell.exe running
    Inveigh.ps1), a remote-execution service, or an Office/scripting parent that suggests delivery through a lure.
    Tracing the parent's own origin distinguishes a hands-on operator session from an automated or pushed execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What internal or external endpoints did the Inveigh process connect to, and do they look like SMB relay targets?
  context: >-
    Passive capture produces crackable hashes, but Inveigh-Relay forwards captured NTLM authentication to other SMB
    servers to authenticate as the victim. Outbound connections from the tool's process — especially to internal hosts
    on SMB (445) — indicate relay targets that may have been accessed directly. Map each destination to decide which
    additional hosts need review.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A tool process that writes one artefact usually writes several — capture output, session state, logs, or staged
    components. The full breadth of the process's file activity and its direct children enumerates what else the tool
    produced and whether anything was staged for follow-on use. This surfaces capture files whose names differ from the
    one that fired.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- always_include: true
  question: Has this user previously produced Inveigh artefacts, and does that history fit their role?
  context: >-
    The query mirrors the rule's file-name pattern scoped to this user, returning their 90-day history of producing
    Inveigh artefacts (not generic file activity), aggregated by host. A user who has never produced this pattern is
    more suspicious than one who does so regularly as part of a sanctioned testing role. Weigh the count against the
    account's normal function.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith:
        - \Inveigh-Log.txt
        - \Inveigh-Cleartext.txt
        - \Inveigh-NTLMv1Users.txt
        - \Inveigh-NTLMv2Users.txt
        - \Inveigh-NTLMv1.txt
        - \Inveigh-NTLMv2.txt
        - \Inveigh-FormInput.txt
        - \Inveigh.dll
        - \Inveigh.exe
        - \Inveigh.ps1
        - \Inveigh-Relay.ps1
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven Inveigh artefacts on this host or across the environment, or is it new for this activity?
  context: >-
    When the alert fires under a service or machine account, user identity does not attribute the behavior; the launch
    mechanism does. The query mirrors the rule's file-name pattern scoped to the alerting program, returning the
    90-day history of that program producing this pattern. A new or rare program for these artefacts is the deviation
    worth chasing; a program that already accounts for many prior events is more likely a testing harness or automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith:
        - \Inveigh-Log.txt
        - \Inveigh-Cleartext.txt
        - \Inveigh-NTLMv1Users.txt
        - \Inveigh-NTLMv2Users.txt
        - \Inveigh-NTLMv1.txt
        - \Inveigh-NTLMv2.txt
        - \Inveigh-FormInput.txt
        - \Inveigh.dll
        - \Inveigh.exe
        - \Inveigh.ps1
        - \Inveigh-Relay.ps1
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether the credential-capture run is isolated or part of a
    wider hands-on operation — reconnaissance, lateral movement, or additional tooling on other endpoints. If the same
    account produced activity on multiple hosts in the same window, the scope of compromise is larger than this one
    alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven pattern produce Inveigh artefacts on other hosts in the same window?
  context: >-
    Under a service or machine account, a user-wide network sweep returns agent-telemetry noise. The meaningful question
    is whether the same launch mechanism fired elsewhere: the query mirrors the rule's file-name pattern scoped to the
    alerting program, fleet-wide, in the alert window. Multiple hosts point to pushed or scheduled distribution;
    a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith:
        - \Inveigh-Log.txt
        - \Inveigh-Cleartext.txt
        - \Inveigh-NTLMv1Users.txt
        - \Inveigh-NTLMv2Users.txt
        - \Inveigh-NTLMv1.txt
        - \Inveigh-NTLMv2.txt
        - \Inveigh-FormInput.txt
        - \Inveigh.dll
        - \Inveigh.exe
        - \Inveigh.ps1
        - \Inveigh-Relay.ps1
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Credential capture rarely starts a chain. Earlier detections on the same host — initial access, defense tampering,
    or reconnaissance — may reveal how the operator reached the point of deploying a poisoning tool and help reconstruct
    the timeline. The sequence of alerts often tells the story better than any single event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Are the Inveigh files still on disk, or were they deleted or renamed after the alert?
  context: >-
    The artefacts' post-alert lifecycle drives next steps. Capture-output files still on disk can be retrieved to
    enumerate exactly which credentials were harvested; binaries still present can be hashed and analyzed. Files
    deleted shortly after creation indicate anti-forensic cleanup and shift the focus to what was captured and relayed
    before removal.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
