name: PowerShell Core DLL Loaded Via Office Application
id: e2ff52f6-75e4-4716-89a7-5e82e2398633
description: |
  Detects an Office application (excel.exe, mspub.exe, outlook.exe, onenote.exe, onenoteim.exe, powerpnt.exe, or winword.exe) loading the PowerShell automation DLL (System.Management.Automation.Dll or its native-image .ni.Dll). The rule fires only when both conditions match together: the loading process is an Office binary AND the loaded module is the PowerShell engine library. This pattern means PowerShell is being hosted in-memory inside the Office process rather than by launching powershell.exe, which is a common way malicious macros and document exploits run PowerShell without spawning a visible interpreter. Legitimate add-ins occasionally host the runtime, so the investigation should confirm what the hosted engine executed, how the Office process was launched, and whether any payload was written or child processes were spawned.
type: detection
detection_id: bb2ba6fb-95d4-4a25-89fc-30bb736c021a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the loaded module match what this rule detects — the PowerShell automation DLL loaded by an Office application?
  context: >-
    Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded) and the process that loaded it
    against the rule's criteria. The rule fires only when both parts match together: the loading Image ends in an Office
    binary (excel.exe, mspub.exe, outlook.exe, onenote.exe, onenoteim.exe, powerpnt.exe, winword.exe) AND the ImageLoaded
    path contains System.Management.Automation.Dll or System.Management.Automation.ni.Dll. The library event carries the
    module's signing status and hash directly, so verify those on the load event itself.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Is this user and host expected to run PowerShell hosted inside an Office application?
  context: >-
    Legitimate Office add-ins and enterprise automation occasionally host the PowerShell runtime in-process, so knowing
    whether this user role and host function normally do so is often the fastest way to separate a benign add-in from a
    malicious macro. A general-purpose workstation user opening a document that hosts PowerShell is far more suspicious
    than a known automation account on a build or reporting server.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What other modules did this Office process load around the alert, and are any from user-writable or non-canonical paths?
  context: >-
    The full set of modules the Office process loaded tells the operator's story when there is no command line to read.
    Look for .NET assemblies loaded from %TEMP%, AppData, ProgramData, or Public (in-memory or side-loaded execution),
    unsigned modules where signed ones are expected, and system DLL names resolved from non-system directories
    (search-order hijacking). Alongside System.Management.Automation.Dll, a macro-driven cradle frequently pulls in
    additional .NET or native modules to stage its payload.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For the PowerShell automation DLL and any other loaded module of interest, what is the signing status, hash, and reputation?
  context: >-
    Module reputation distinguishes a routine framework DLL from a side-loaded malicious one. A genuinely Microsoft-signed
    System.Management.Automation.Dll from the GAC or a framework directory is expected; the same filename unsigned or
    resolved from a user-writable path is a masquerading indicator. SignatureStatus values to watch are Unsigned, Expired,
    Distrusted, and Invalid. The Hashes field gives a value to pivot against threat intelligence for known loaders.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What launched this Office process, and can the hosted PowerShell payload be decoded?
  context: >-
    Because PowerShell is hosted in-memory inside the Office process, there is no powershell.exe command line carrying an
    -EncodedCommand blob to read. The Office process command line typically reveals the document that was opened, which is
    the entry point for a malicious macro. The deobfuscated script the hosted engine actually ran is recovered from script
    block logging rather than from a process command line; use the document path here to locate and preserve the source
    file for content review.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the script content the hosted engine executed?
  context: >-
    Script block logging (Event ID 4104) records the deobfuscated script content the PowerShell engine runs, and it is
    emitted by the engine itself regardless of the host process — so it captures PowerShell hosted inside an Office
    application even though no powershell.exe was launched. This is the ground truth for what actually ran here. If
    PowerShell operational logs are not ingested in this environment, treat zero results as a visibility gap rather than
    evidence nothing executed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: What process spawned this Office application, and is that parent chain expected?
  context: >-
    The parent process reveals how the document was opened. Interactive use normally shows explorer.exe (a user
    double-clicking a file) or a mail or browser client following a link. An Office application spawned by an unexpected
    parent — a script host, a scheduled task, or another automation binary — points to programmatic document opening
    rather than a user, which changes how the hosted PowerShell should be read.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What child processes did this Office application spawn after loading the PowerShell engine?
  context: >-
    Hosted PowerShell commonly reaches out to the operating system by spawning child processes. Office applications
    normally spawn very few children, so cmd.exe, powershell.exe, wscript.exe, rundll32.exe, certutil.exe, or unfamiliar
    binaries under an Office parent are strong post-exploitation signals. Review each child's command line for download
    cradles, persistence, or credential access.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did the Office process or its children write files to disk that are still available for analysis?
  context: >-
    Macro and document-exploit chains frequently drop a payload, a decoded script, or a staging file before or during
    execution. Correlating file writes to the alerting Office process and its direct children by process lineage shows
    what landed on disk and whether it is still present for hashing, sandbox submission, or content review.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Were PowerShell security controls bypassed or weakened around this execution?
  context: >-
    In-memory PowerShell hosted by Office frequently pairs with an AMSI bypass so the loaded script evades scanning.
    Look for AMSI patching references (AmsiUtils, amsiInitFailed), realtime-protection changes (Set-MpPreference,
    DisableRealtimeMonitoring), execution-policy bypass flags, and version-downgrade attempts on this host in the hour
    around the alert. These precursors strengthen the case that the hosted engine ran attacker-controlled code.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: Has the PowerShell automation DLL been loaded on this host before, and by which processes?
  context: >-
    A first-time load of System.Management.Automation.Dll by an Office application is a stronger anomaly than a recurring
    one. If the DLL has historically loaded only under powershell.exe, dotnet, or known PowerShell-hosting services, an
    Office process loading it now stands out. If the same Office binary has hosted the runtime repeatedly over the past 90
    days, a benign add-in is the more likely explanation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: When this host previously fired the rule's pattern, what programs and users drove it, and does the current alert fit?
  context: >-
    Even legitimate add-ins can host PowerShell inside Office. This query mirrors the rule's
    exact selection scoped to this host, so the resulting program and user distribution reflects
    how this specific firing pattern has historically run here rather than generic Office usage.
    A new acting program process, an unexpected user account, or a first-ever occurrence is the
    deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith:
        - \excel.exe
        - \mspub.exe
        - \outlook.exe
        - \onenote.exe
        - \onenoteim.exe
        - \powerpnt.exe
        - \winword.exe
        ImageLoaded|contains:
        - \System.Management.Automation.Dll
        - \System.Management.Automation.ni.Dll
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating the surrounding process activity by parent-child pairing collapses
    routine agent telemetry into high-count rows while novel parent-child combinations stand out at low counts. Look for
    reconnaissance, privilege escalation, persistence, or staging that provides broader context for the hosted-PowerShell
    event.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts fired the rule's pattern in the past week, and does the distribution look like automation or one-off activity?
  context: >-
    This query mirrors the rule's selection with no host scope, giving a fleet-wide count of the same Office-hosts-
    PowerShell pattern rather than generic Office usage. Many hosts firing the same pattern points to a shared add-in or
    deployed automation; one host or a small unrelated set points to targeted document activity. Use the host
    distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith:
        - \excel.exe
        - \mspub.exe
        - \outlook.exe
        - \onenote.exe
        - \onenoteim.exe
        - \powerpnt.exe
        - \winword.exe
        ImageLoaded|contains:
        - \System.Management.Automation.Dll
        - \System.Management.Automation.ni.Dll
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the attack
    stages that preceded document execution and help reconstruct the timeline. A document that hosts PowerShell is often
    an initial-access stage, so preceding alerts can reframe it as part of a multi-stage operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
