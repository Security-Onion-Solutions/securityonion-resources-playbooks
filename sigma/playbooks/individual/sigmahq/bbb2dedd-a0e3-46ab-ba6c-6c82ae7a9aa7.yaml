name: HAFNIUM Exchange Exploitation Activity
id: f36d04db-162c-44d5-bc15-8b5ce3b9bfc1
description: |
  Detects a set of post-exploitation command-line behaviors reported on compromised Exchange servers. The rule fires when
  any single one of ten independent branches matches: either an attrib command that applies hidden, system and read-only
  attributes to an .aspx file; or a schtasks command referencing VSPerfMon, or a process image under \ProgramData\VSPerfMon\;
  or Opera_browser.exe spawned by services.exe or svchost.exe; or Opera_browser.exe running from Users\Public\opera\; or a
  "vssadmin list shadows" command redirected to a Temp\__output file; or makecab.exe combining inetpub\wwwroot\ with .dmp.zip;
  or makecab.exe referencing Microsoft\Exchange Server\, compressionmemory, or .gif; or a " -t7z " archive written under
  C:\Programdata\pst ending in \it.zip; or rundll32 using \comsvcs.dll with Minidump, "full " and \inetpub\wwwroot; or a
  command line naming Windows\Temp\xx.bat, Windows\WwanSvcdcs, or Windows\Temp\cw.exe. Together these branches cover web-shell
  concealment, credential dumping into the web root, archive staging and exfiltration through IIS-served paths, and
  scheduled-task persistence registered under Microsoft-looking task names. Legitimate matches are unlikely; each branch
  encodes a specific tool-and-path combination rather than generic use of a system binary. The investigation should establish
  which branch matched, decode the full command line, identify the file artifacts it created or referenced, and determine
  whether adjacent stages of the same operation are present on the host.
type: detection
detection_id: bbb2dedd-a0e3-46ab-ba6c-6c82ae7a9aa7
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Which of the rule's alternative branches does this event match, and is that match substantive rather than incidental?
  context: >-
    The rule fires when any single one of ten independent branches matches, so the first task is identifying which one.
    Either the command line combines attrib with " +h ", " +s ", " +r " and .aspx; or it names schtasks together with
    VSPerfMon, or the image sits under \ProgramData\VSPerfMon\; or Opera_browser.exe was spawned by services.exe or
    svchost.exe; or Opera_browser.exe ran from Users\Public\opera\; or "vssadmin list shadows" wrote to a Temp\__output
    file; or makecab.exe combined inetpub\wwwroot\ with .dmp.zip; or makecab.exe referenced Microsoft\Exchange Server\,
    compressionmemory, or .gif; or a " -t7z " archive was written under C:\Programdata\pst ending in \it.zip; or rundll32
    used \comsvcs.dll with Minidump, "full " and \inetpub\wwwroot; or the command line named Windows\Temp\xx.bat,
    Windows\WwanSvcdcs, or Windows\Temp\cw.exe. Record which branch fired — it determines which of the remaining questions
    carry weight. The scheduled-task questions matter for the VSPerfMon and WwanSvcdcs branches, the archive and file-output
    questions for the makecab and 7-Zip branches, and the hash and artifact questions for the Opera_browser.exe, xx.bat and
    cw.exe branches.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this host an Exchange or IIS server, and is this account expected to run this kind of command on it?
  context: >-
    Every branch of this rule encodes tooling aimed at a mail or web server — Exchange installation paths, the IIS web root,
    shadow-copy listings, and archive staging. A match on a general-purpose workstation means something different from a
    match on an internet-facing Exchange server, and an account that is not an administrator or a service identity for that
    role narrows the question quickly.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this execution part of an authorized penetration test or red team exercise emulating Exchange post-exploitation?
  context: >-
    The command patterns this rule encodes are reproduced by assessment teams that emulate published Exchange
    post-exploitation tradecraft, and by tabletop or purple-team exercises run against a staged server. An active engagement
    whose scope covers this host and whose timing matches the alert resolves it without further analysis; confirm the scope
    document rather than the tester's word.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: Is this parent expected to spawn this child, and what started the parent itself?
  context: >-
    Post-exploitation of a web application surfaces as command execution under the web server worker process or a shell it
    launched, so a chain rooted in an IIS worker, a service host, or a chain of nested command interpreters points at
    execution through a web shell rather than at an administrator at a console. Walk one level up from the parent — its own
    parent and command line show whether the chain begins in a server process or in an interactive session.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other child processes did this same parent instance spawn?
  context: >-
    The behaviors this rule covers are usually driven by a batch script that runs several stages back to back — registry
    hive saves for credentials, network discovery, archive creation, and task registration — all under one parent. Listing
    the parent's other children shows whether the alerting command is one step of a scripted sequence or an isolated
    invocation.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Which operational capability did this command perform? Decode every argument in the command line.
  context: >-
    Each branch of this rule maps to a distinct capability, and the arguments say which one ran. Attribute changes on an
    .aspx file conceal a web shell in a served directory. A comsvcs.dll MiniDump call writes process memory — typically
    LSASS — to a chosen path. A makecab invocation with compressiontype, compressionmemory and cabinetnametemplate produces
    a cabinet renamed to an image extension so it can be retrieved over HTTP. A 7-Zip command with " -t7z " packages
    collected mail or files. Read the output path in the arguments; it is the artifact to chase next.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Which files did this process or its direct children write, and are they still on disk?
  context: >-
    The command lines in this rule name concrete output paths — cabinet files in the web root, memory dumps under
    Windows\Temp, archives under C:\Programdata\pst, batch scripts. Correlating file activity to the alerting process and
    its children by process lineage shows what actually landed on disk, which is what can still be hashed, retrieved and
    reviewed. Cleanup batches often delete these artifacts hours later, so a deletion record here is itself part of the
    timeline.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: If a scheduled task was created, what task name, target command, schedule and run-as account does the command line specify?
  context: >-
    Read the /TN, /TR, /SC and /RU arguments. Task names registered under the \Microsoft\Windows\ namespace are chosen to
    blend with built-in tasks, and a /TR that points at a batch file or executable under Windows\Temp is the persistence
    payload. A /RU of system means the task runs with full local privilege regardless of who created it, and a /SC once with
    a late /ST is a delayed one-shot rather than durable persistence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Did the Task Scheduler service launch anything on this host after the alert, and does it correspond to the alerting command?
  context: >-
    Registered tasks execute as children of the Task Scheduler service, so processes appearing under it after the alert
    reveal whether the payload has already run. Correlating the registration time against the first scheduler-spawned
    execution establishes the interval between trigger definition and execution; a run within minutes points at a one-shot
    task, while nothing within the window means the trigger has not yet fired and the payload can still be examined before
    it does.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\svchost.exe'
        ParentCommandLine|contains: 'Schedule'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Was a scheduled task registered, updated or deleted on this host, and under which account?
  context: >-
    Task registration is recorded independently of the command line that produced it, which both confirms the task exists
    and catches tasks created without schtasks.exe. Event 4698 records the registration and the full task definition, 4702
    an update, and 4699 a deletion — a 4698 followed by a 4699 is the signature of a task installed, fired, and removed to
    reduce artifacts. The subject account distinguishes an administrator registering a task from a service or SYSTEM context
    doing so. If Security-channel task events are not collected in this environment, treat an empty result as a visibility
    gap rather than as evidence no task was registered.
  range: -24h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4698
          - 4699
          - 4702
      condition: selection
    fields:
      - EventID
      - TaskName
      - SubjectUserName
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: What files did this process write, and where did the output land?
  context: >-
    Command-line arguments state the intent; file activity states the result. For the makecab branches the output is a
    cabinet placed in an Exchange or IIS served directory under an image extension, which makes it retrievable by anyone who
    knows the URL. For the 7-Zip branch it is an archive under C:\Programdata\pst. For the comsvcs.dll branch it is a memory
    dump written into the web root. The path the file landed in determines whether the data was merely staged or made
    reachable from outside.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
  answer_sources:
  - process_creation
- question: Was password protection or header encryption applied to the archive?
  context: >-
    For the 7-Zip branch, check for -p (password) and -mhe=on (header encryption); header encryption hides the file names
    inside the archive as well as the contents, which prevents any later inspection of what was collected. Passwords may
    also be supplied on standard input or from a configuration file, in which case they will not appear in the command line
    and the archive itself has to be examined.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Did any of the named artifacts execute on this host, and what are their hashes and threat-intel reputations?
  context: >-
    A file hash is recorded when a file runs, not when it is written, so this looks for the specific artifacts the rule
    names — Opera_browser.exe, cw.exe, xx.bat, the VSPerfMon directory, and the C:\Programdata\pst archive — appearing as an
    executing image or on an interpreter's command line. Submit any hash returned to a reputation service or internal
    threat-intel store. Where the match is an interpreter such as cmd.exe running a batch file, the hash belongs to the
    interpreter, not to the script: retrieve the script from its on-disk path and hash it separately. An artifact that is
    present but has not executed will not appear here, and paths under a public or Temp directory are themselves the
    anomaly worth noting.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith:
          - '\Opera_browser.exe'
          - '\cw.exe'
          - '\makecab.exe'
      selection_interpreter:
        CommandLine|contains:
          - '\Users\Public\opera\'
          - '\Windows\Temp\xx.bat'
          - '\Windows\Temp\cw.exe'
          - '\ProgramData\VSPerfMon\'
          - 'C:\Programdata\pst'
          - '\it.zip'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: Has this account previously produced this rule's pattern, and does that history fit its role?
  context: >-
    This mirrors the rule's own selection structure, scoped to the alerting account, so the count is that account's 90-day
    history of this specific pattern rather than generic use of the binaries involved. An account with no prior matches is a
    different finding from one that produces the pattern routinely; weigh the result against whether the account belongs to
    a server administrator, a backup or monitoring service, or an ordinary user.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_attrib:
        CommandLine|contains|all:
        - attrib
        - ' +h '
        - ' +s '
        - ' +r '
        - .aspx
      selection_vsperfmon:
      - Image|contains: \ProgramData\VSPerfMon\
      - CommandLine|contains|all:
        - schtasks
        - VSPerfMon
      selection_opera_1:
        Image|endswith: Opera_browser.exe
        ParentImage|endswith:
        - \services.exe
        - \svchost.exe
      selection_opera_2:
        Image|endswith: Users\Public\opera\Opera_browser.exe
      selection_vssadmin:
        CommandLine|contains|all:
        - vssadmin list shadows
        - Temp\__output
      selection_makecab_1:
        Image|endswith: \makecab.exe
        CommandLine|contains|all:
        - inetpub\wwwroot\
        - .dmp.zip
      selection_makecab_2:
        Image|endswith: \makecab.exe
        CommandLine|contains:
        - Microsoft\Exchange Server\
        - compressionmemory
        - .gif
      selection_7zip:
        CommandLine|contains|all:
        - ' -t7z '
        - C:\Programdata\pst
        - \it.zip
      selection_rundll32:
        CommandLine|contains|all:
        - \comsvcs.dll
        - Minidump
        - 'full '
        - \inetpub\wwwroot
      selection_other:
        CommandLine|contains:
        - Windows\Temp\xx.bat
        - Windows\WwanSvcdcs
        - Windows\Temp\cw.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: Has this parent process historically driven this rule's pattern here or elsewhere, or is the parent new for this activity?
  context: >-
    When the alert fires under SYSTEM or a service identity, the account name attributes nothing and the launch mechanism is
    the meaningful pivot. This mirrors the rule's selection structure scoped to the alerting parent, so the count is the
    90-day history of this parent driving this specific pattern, grouped by host. A parent that already accounts for a large
    volume of prior matches is server or vendor automation; a parent that is new for this pattern is the deviation to chase.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_attrib:
        CommandLine|contains|all:
        - attrib
        - ' +h '
        - ' +s '
        - ' +r '
        - .aspx
      selection_vsperfmon:
      - Image|contains: \ProgramData\VSPerfMon\
      - CommandLine|contains|all:
        - schtasks
        - VSPerfMon
      selection_opera_1:
        Image|endswith: Opera_browser.exe
        ParentImage|endswith:
        - \services.exe
        - \svchost.exe
      selection_opera_2:
        Image|endswith: Users\Public\opera\Opera_browser.exe
      selection_vssadmin:
        CommandLine|contains|all:
        - vssadmin list shadows
        - Temp\__output
      selection_makecab_1:
        Image|endswith: \makecab.exe
        CommandLine|contains|all:
        - inetpub\wwwroot\
        - .dmp.zip
      selection_makecab_2:
        Image|endswith: \makecab.exe
        CommandLine|contains:
        - Microsoft\Exchange Server\
        - compressionmemory
        - .gif
      selection_7zip:
        CommandLine|contains|all:
        - ' -t7z '
        - C:\Programdata\pst
        - \it.zip
      selection_rundll32:
        CommandLine|contains|all:
        - \comsvcs.dll
        - Minidump
        - 'full '
        - \inetpub\wwwroot
      selection_other:
        CommandLine|contains:
        - Windows\Temp\xx.bat
        - Windows\WwanSvcdcs
        - Windows\Temp\cw.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did this account do across the environment around this time?
  context: >-
    Tracking the account's activity on every host in the alert window shows whether the same identity was operating in more
    than one place, which is how credential reuse after a server compromise surfaces. If the alert fired under SYSTEM or
    another service identity, this returns routine agent and service telemetry from across the fleet — read the
    parent-driven fleet question for a meaningful answer in that case.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    This mirrors the rule's selection structure scoped to the alerting parent process, fleet-wide, within the alert window.
    Several hosts matching at once points at pushed or scheduled automation; a single host points at a host-local trigger.
    For a rule covering server post-exploitation, matches on more than one server in the same window indicate the same
    operation was run against several targets.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_attrib:
        CommandLine|contains|all:
        - attrib
        - ' +h '
        - ' +s '
        - ' +r '
        - .aspx
      selection_vsperfmon:
      - Image|contains: \ProgramData\VSPerfMon\
      - CommandLine|contains|all:
        - schtasks
        - VSPerfMon
      selection_opera_1:
        Image|endswith: Opera_browser.exe
        ParentImage|endswith:
        - \services.exe
        - \svchost.exe
      selection_opera_2:
        Image|endswith: Users\Public\opera\Opera_browser.exe
      selection_vssadmin:
        CommandLine|contains|all:
        - vssadmin list shadows
        - Temp\__output
      selection_makecab_1:
        Image|endswith: \makecab.exe
        CommandLine|contains|all:
        - inetpub\wwwroot\
        - .dmp.zip
      selection_makecab_2:
        Image|endswith: \makecab.exe
        CommandLine|contains:
        - Microsoft\Exchange Server\
        - compressionmemory
        - .gif
      selection_7zip:
        CommandLine|contains|all:
        - ' -t7z '
