  always_include: true
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    The behaviors this rule covers sit late in an intrusion — after a server-side vulnerability was exploited and a web
    shell placed. Earlier detections on the same host, particularly ones covering web-server processes spawning
    interpreters, registry hive access, or remote-management configuration changes, reconstruct the stages that preceded
    this command and indicate how the operator obtained execution.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
