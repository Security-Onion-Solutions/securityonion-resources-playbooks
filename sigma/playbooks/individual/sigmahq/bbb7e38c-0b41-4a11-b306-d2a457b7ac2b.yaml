name: Suspicious File Created In PerfLogs
id: 91c4c3ba-3a6b-446e-b439-8336fa2e6c77
description: |
  Detects a file whose name ends in an executable, script, or archive extension (.exe, .dll, .ps1, .bat, .vbs, .hta, .7z, .zip and similar) being created under C:\PerfLogs\. That directory normally holds only .etl performance-trace files, so a dropped binary or script there is an out-of-place staging artifact. Attackers use writable system directories like this to stage tools and payloads that blend into an expected system path. Confirm the path and extension, identify the process that wrote the file and its parent chain, and determine whether the file was subsequently executed.
type: detection
detection_id: bbb7e38c-0b41-4a11-b306-d2a457b7ac2b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the created file's path and extension match the C:\PerfLogs\ staging pattern this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when a file whose path starts with C:\PerfLogs\ AND whose name ends in an executable, script, or archive extension is created. Review the exact path, the extension, the operation, and the responsible process against those criteria; a stray .etl trace file would not match.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to write executable or script files into C:\PerfLogs\?
  context: Legitimate performance tooling writes .etl traces to this directory, not binaries or scripts. Knowing whether the user role and host function ever involve dropping executable content here is often the fastest way to separate a routine action from staging. When the writer is a machine or service account, judge by the writing process and host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the file still on disk, or was it deleted or renamed after the alert?
  context: The file's post-alert lifecycle drives both urgency and next steps. A payload still on disk can be retrieved, hashed, and analyzed; a file deleted seconds after creation suggests anti-forensic cleanup or a self-deleting dropper and shifts the investigation to what executed in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What is the content of this file? Check for obfuscation, encoded strings, and known malware indicators.
  context: 'Read and analyze the file''s actual content. For scripts and text files: check for base64 encoding, obfuscated strings, embedded URLs, IP addresses, interpreter commands, or known malware string patterns. For binaries: check imports, embedded strings, packer signatures, and signing status. Content analysis answers "what is IN the file", which is distinct from whether the hash is already known-bad.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If this file has executed, what is its hash and does it have known AV or threat-intel detections?
  context: A file's hash is recorded when it runs, not when it is written (file-creation events carry no hash). This query looks for the artifact executing from its dropped path and reads its hash; submit that hash to reputation and threat-intel services to determine whether it is known malicious, benign, or previously unseen. If the file is present but has not executed, retrieve it from C:\PerfLogs\ and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
- question: Which process wrote this file, and what was its full command line?
  context: The file event carries the writing process's identifier. Retrieving that process's command line reveals what operation dropped an executable or script into C:\PerfLogs\ (an installer, an interpreter decoding a payload, or a copy/extract command). Decode any flags, encoded content, source paths, or URLs in the command line to understand the delivery mechanism.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: What process spawned the process that wrote this file, and is that parent chain expected?
  context: The parent process reveals how the writer was invoked. Legitimate staging usually has a predictable parent (an installer, a management agent, an interactive shell run by an administrator). Unusual parents such as office applications, script hosts, or a database or web-server process point to exploitation or macro-driven delivery.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What other files did the responsible process write or delete around the alert?
  context: A process that drops one suspicious file often drops several — a dropper unpacking components, a tool staging output, or ransomware touching many paths. The breadth, paths, and extensions of the process's other file activity distinguish a single artifact from a campaign in progress and enumerate what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to C:\PerfLogs\ recently, and by which processes?
  context: This directory legitimately receives only .etl performance traces from a small set of system components. Other recent arrivals here — especially executables, scripts, or archives, and the processes that wrote them — reveal whether this is an isolated drop or a location under active use for staging, and surface sibling artifacts that belong to the same activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\PerfLogs\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Was this file executed after it was created?
  context: A staged file may later appear in process telemetry when executed, or in image-load telemetry when loaded as a DLL. Correlating the drop to a subsequent execution from the same path reveals whether the artifact progressed from staging to running, which raises urgency from a dormant payload to active execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
- question: Has this file been seen before on this host?
  context: A file that has never been seen on a host is more suspicious than one that is part of normal operations. First-time appearance of an executable or script in C:\PerfLogs\ should be checked even if the filename seems benign; zero or very low historical counts indicate a new or unusual file.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Is this file present on any other hosts in the environment?
  context: Finding the same file in C:\PerfLogs\ across multiple hosts may indicate lateral movement, a worm, or deliberate distribution. If it is only on one host, the activity may be targeted. If on many, determine the distribution pattern and timeline to size the affected set.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection scoped to this user — the result is the user's 90-day history of dropping executable or script files into C:\PerfLogs\ specifically (not generic file activity), aggregated by host. A user who has never produced this pattern is more suspicious than one who does so regularly; weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\PerfLogs\
        TargetFilename|endswith:
        - .7z
        - .bat
        - .bin
        - .chm
        - .dll
        - .exe
        - .hta
        - .lnk
        - .ps1
        - .psm1
        - .py
        - .scr
        - .sys
        - .vbe
        - .vbs
        - .zip
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven the rule's pattern on this host or across the environment, or is the program new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior. The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection scoped to the alerting program, so the result is the 90-day history of this program dropping suspicious files into C:\PerfLogs\ (not generic use of the binary). A new or rare program for this pattern is the deviation worth chasing; a program that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\PerfLogs\
        TargetFilename|endswith:
        - .7z
        - .bat
        - .bin
        - .chm
        - .dll
        - .exe
        - .hta
        - .lnk
        - .ps1
        - .psm1
        - .py
        - .scr
        - .sys
        - .vbe
        - .vbs
        - .zip
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity on more than one host, the scope of the operation may be larger than the single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window, or is it isolated to this host?
  context: 'Under a service principal, "what else did this user do" returns agent-telemetry noise because every host runs the same system-owned processes constantly. The meaningful question is whether the same launch mechanism dropped files into C:\PerfLogs\ elsewhere: the query mirrors the rule''s selection scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\PerfLogs\
        TargetFilename|endswith:
        - .7z
        - .bat
        - .bin
        - .chm
        - .dll
        - .exe
        - .hta
        - .lnk
        - .ps1
        - .psm1
        - .py
        - .scr
        - .sys
        - .vbe
        - .vbs
        - .zip
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, or persistence mechanisms in the same window.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the stages that preceded this file drop and help reconstruct the timeline. Staging into a system directory is often a mid-chain step, so prior alerts can show how the actor arrived.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
