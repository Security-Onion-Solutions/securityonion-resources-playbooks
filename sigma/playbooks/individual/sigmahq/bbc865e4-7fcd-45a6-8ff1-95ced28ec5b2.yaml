name: NtdllPipe Like Activity Execution
id: 6219e347-2390-459b-b30f-89f26b1461df
description: |
  Detects a command line that uses the cmd.exe type built-in to read the contents of ntdll.dll and redirect the output to another file or a named pipe. This pattern is used to obtain a clean, unhooked copy of ntdll.dll by delegating the file read to a trusted signed binary, so the read does not trip AV/EDR user-mode hooks placed on direct file access. The rule fires when the command line contains one of the type-ntdll variants or the ntdll-to-pipe redirect pattern. Determine whether the redirected output is being captured for evasion or syscall-stub harvesting, or whether the command line is benign administrative copying, and reconstruct what the spawning process and any follow-on activity were doing.
type: detection
detection_id: bbc865e4-7fcd-45a6-8ff1-95ced28ec5b2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line read ntdll.dll with the type command and redirect the output to a file or a named pipe?
  context: >-
    Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line. The rule
    fires when the command line types the contents of ntdll.dll from system32 (via %windir%, %systemroot%, or the literal
    c:\windows path) or redirects an ntdll.dll read into a \\.\pipe\ destination. Confirm which variant fired and capture
    the full redirect target.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to read system DLLs and pipe the output to a file or named pipe?
  context: >-
    Legitimate administrative activity can trigger this detection, but reading ntdll.dll and redirecting its bytes to a pipe
    is rarely part of normal operations. Knowing whether the user role and host function involve low-level debugging,
    driver development, or security tooling is often the fastest way to separate routine activity from an evasion attempt.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is the redirected output file still on disk for analysis?
  context: >-
    If the command redirected the ntdll.dll read to a file rather than a named pipe, that output file is a verbatim copy of
    ntdll.dll and may still be on disk. Capturing it enables hash comparison against the on-disk system ntdll.dll and review
    of whether the copy was staged for later reuse. Pipe destinations leave no file artifact.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What exactly does the full command line do, and where is the ntdll.dll output being sent?
  context: >-
    The full command line reveals the destination of the read. A redirect to a \\.\pipe\ target indicates the bytes are
    streamed to another process in memory, the in-memory variant of this technique; a redirect to a file path stages a
    copy on disk. Identify the exact redirect operator and target, and note any pipe name so the consuming process can be
    correlated.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this command interpreter and is that parent chain expected?
  context: >-
    The parent process reveals how the command was invoked. A user-driven shell or an interactive administrative session is
    a different disposition than the command interpreter being spawned by a script host, an Office application, or an
    unfamiliar binary that may have launched it as a hidden child to stage the clean ntdll.dll read.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did this command interpreter spawn afterward?
  context: >-
    The processes spawned afterward reveal the actual impact. A clean ntdll.dll is typically harvested to build syscall
    stubs or to unhook protection before a later stage runs, so follow-on execution of loaders, injectors, or additional
    command interpreters on this host shortly after the read is the part of the chain that confirms operational intent.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: >-
    Even routine tooling can read system DLLs. The query mirrors the rule's selection scoped to this host, so the resulting
    parent and user distribution reflects how this specific ntdll-read pattern has historically run here, not generic cmd.exe
    usage. A new parent process, an unexpected user account, or a first-ever appearance of the pattern is the anomaly worth
    chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - type %windir%\system32\ntdll.dll
        - type %systemroot%\system32\ntdll.dll
        - type c:\windows\system32\ntdll.dll
        - \\ntdll.dll > \\\\.\\pipe\\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: If the output went to a file, does its content match the host's system ntdll.dll, and is the destination path user-writable?
  context: >-
    When the read is redirected to a file, the destination is a byte-for-byte copy of ntdll.dll. Compare its hash and size
    to the genuine system32 ntdll.dll to confirm it is a clean copy rather than a tampered one, and note whether the path is
    a user-writable staging directory. A copy in a temp or profile directory is consistent with harvesting for later reuse.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - type %windir%\system32\ntdll.dll
        - type %systemroot%\system32\ntdll.dll
        - type c:\windows\system32\ntdll.dll
        - \\ntdll.dll > \\\\.\\pipe\\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - type %windir%\system32\ntdll.dll
        - type %systemroot%\system32\ntdll.dll
        - type c:\windows\system32\ntdll.dll
        - \\ntdll.dll > \\\\.\\pipe\\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the
    same user drove similar reads or follow-on execution on other hosts in this window, the scope of the operation may be
    larger than the single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - type %windir%\system32\ntdll.dll
        - type %systemroot%\system32\ntdll.dll
        - type c:\windows\system32\ntdll.dll
        - \\ntdll.dll > \\\\.\\pipe\\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining activity around the read reveals what led to it and what followed, and
    whether it is part of a larger sequence. Look for reconnaissance, additional defense-evasion steps, or process injection
    and loader activity that the clean ntdll.dll copy was meant to support.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this ntdll-read pattern
    rather than generic command-interpreter usage. Many hosts firing the same pattern points to scripted deployment or
    security tooling; one host or a small unrelated set points to manual operator activity. Use the host distribution to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - type %windir%\system32\ntdll.dll
        - type %systemroot%\system32\ntdll.dll
        - type c:\windows\system32\ntdll.dll
        - \\ntdll.dll > \\\\.\\pipe\\
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host, such as defense tampering, reconnaissance, or
    credential access, may reveal the attack stages that preceded a clean-ntdll fetch and help reconstruct the full timeline
    leading up to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
