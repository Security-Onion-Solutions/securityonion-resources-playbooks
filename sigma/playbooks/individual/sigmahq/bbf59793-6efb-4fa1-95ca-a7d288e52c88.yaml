name: Winlogon Notify Key Logon Persistence
id: 8b28d594-4024-4bd6-8291-b549d0fd1c14
description: |
  Detects modification of the Winlogon Notify\logon registry value to reference a DLL, a logon-persistence
  mechanism in which winlogon.exe loads the named notification-package DLL at every user logon. Legitimate
  notification packages exist (some endpoint-protection and credential-provider software register here), so
  the investigation must establish who wrote the value, whether the referenced DLL is signed and expected,
  and whether winlogon.exe subsequently loaded it. The rule fires when a registry value whose key path ends
  in \SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\Notify\logon is set to value data ending in .dll.
type: detection
detection_id: bbf59793-6efb-4fa1-95ca-a7d288e52c88
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Do the registry key and value data match what this rule detects?
  context: Confirm the alert is a true positive before investing time. The rule fires when a value under the
    Winlogon Notify\logon key path is set to data ending in .dll. Review the exact key path (TargetObject),
    the DLL path written (Details), and the writing process against those criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to register a Winlogon notification-package DLL?
  context: Legitimate installation of endpoint-protection or credential-provider software can write Winlogon
    Notify entries, but this is rare on an established host and rarer still from an interactive user session.
    Knowing whether the writing user and host function are consistent with that kind of change is often the
    fastest way to separate a sanctioned deployment from unauthorized persistence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Was this Winlogon Notify change part of a documented deployment or approved maintenance?
  context: Persistence-relevant registry changes usually accompany a software rollout or a change record. A
    corresponding ticket or deployment window suggests a sanctioned notification package; the absence of one
    when policy requires it points toward unauthorized persistence. This check can quickly close or escalate
    the alert.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What Winlogon Notify key and value were written, and is this a known persistence location?
  context: The Notify\logon value is a recognized logon-autostart persistence location — winlogon.exe executes
    the registered notification package at every logon. Read the exact TargetObject path, the DLL path in the
    value data, and the writing process to judge whether this is a legitimate package registration or an
    attacker foothold.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What DLL path is written in the Notify value, and where on disk does it point?
  context: The Details value carries the DLL path that winlogon.exe will load at logon. Decode it and assess
    where it points. Legitimate notification packages live under System32; DLLs referenced from Temp, AppData,
    ProgramData, or other user-writable directories are far more consistent with attacker persistence than a
    signed system component.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Has this Notify value been re-set since the alert, and does the persistence remain in place?
  context: Registry key and value deletions are not observable in this telemetry, so attacker cleanup cannot
    be confirmed directly. Judge whether the persistence stands by looking at the key's re-modification history
    over a longer window and at whether the referenced DLL actually loaded — a value that was set once and
    never revisited, pointing at a DLL that winlogon loaded, is an active persistence mechanism.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Did winlogon.exe load any unexpected or unsigned DLLs after this Notify key was modified?
  context: The persistence takes effect when winlogon.exe loads the registered notification-package DLL at the
    next logon. Surface the modules winlogon.exe loaded after the registry write and compare them against the
    DLL path in the Notify value; a load of the referenced DLL confirms the mechanism fired. The signature
    fields distinguish a signed system package from an unsigned or untrusted binary, and the interval between
    the registry write and the load anchors the time correlation.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\winlogon.exe'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
- question: Is the referenced DLL present on disk, and was it dropped by the same process in this session?
  context: The Notify persistence is only effective if the DLL exists at the path written to the value. Correlating
    file activity from the registry-writing process and its children locates the payload drop, which usually
    lands in the same session as the registry write. The file-write event carries no hash; if the DLL is present,
    hash it from a later load or execution for a reputation lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process wrote this Notify value, and what started that process?
  context: The writing process and its own parent reveal how the persistence was staged. A change from an
    installer or management agent lineage reads differently than one from an interactive shell, a script host,
    or an Office child. Trace the parent's origin to determine whether the execution chain is a routine
    deployment or an interactive intrusion.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other registry modifications happened on this host in the same window?
  context: Actors who set one persistence value often make several changes at once — a Notify DLL for logon
    persistence alongside a Run key, a service change, or a defense-tampering edit. Grouping the host's registry
    modifications in a short window around the write shows what else was touched and whether multiple objectives
    were pursued in one session.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has the Winlogon Notify\logon key been modified before on this host?
  context: The Winlogon Notify key is stable on a settled host and should rarely change outside a software
    install or a driver/agent update. Zero prior history for this exact key is more consistent with first-time
    attacker persistence, while a recurring pattern from a known package suggests routine maintenance. Compare
    the value data across any prior modifications.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this Winlogon Notify key modified on other hosts in the environment?
  context: The same modification across many hosts may indicate a policy push or a widely deployed package;
    isolation to this one host suggests targeted persistence. Compare the value data across hosts — an identical
    DLL path fleet-wide reads like managed software, while a unique or oddly located path on a single host is
    more concerning.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining process activity in the minutes around the registry
    write reveals what led to it and what followed — staging tools, reconnaissance, or additional persistence.
    Aggregating by process and parent collapses routine agent noise while novel parent-child pairs stand out.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may
    reveal the attack stages that preceded the persistence write and help reconstruct the timeline. Persistence
    is often established after an initial foothold is already in place.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host?
  context: Attackers rarely rely on a single persistence mechanism. Alongside a Winlogon Notify DLL they commonly
    stack scheduled tasks, services, registry Run keys, or BITS jobs as backups. Multiple persistence installs
    in the same timeframe indicate intentional stacking rather than an isolated administrative change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup folders or scheduled-task definition paths on this host?
  context: File-based persistence bypasses command-line detection entirely. A payload written into a Startup
    folder or a path referenced by a Run key achieves persistence without invoking schtasks, sc, or reg. File
    monitoring captures these drops even when the actor avoids standard persistence tooling, and finding them
    alongside the Winlogon change shows the full persistence footprint.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
