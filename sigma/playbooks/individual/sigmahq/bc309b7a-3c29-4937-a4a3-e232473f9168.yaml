- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Removal running on a host is an endpoint of someone else's activity, not a starting point, so the
    hours before it are where the staging sits. Look for the download, extraction, or process-injection
    detections that would explain how the file arrived, and for detections against the process that
    turns out to be the parent — those describe what was resident on the host before removal ran.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Over the past 90 days, what else has this host been detected running that a single implant removal would not have addressed?
  context: >-
    Removal of one implant does not remediate what that implant installed beforehand — loaders,
    remote-access tooling, and credential-theft components delivered as second-stage payloads survive
    it, and that residue is the durable finding if the execution is genuine. A 90-day detection
    history over the host covers the dwell an enrolled machine would plausibly have, where a
    short-window view of the hours before the alert covers only the immediate staging. Read the
    result for anything that implies separate resident tooling rather than for the removal event
    itself.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - event.severity_label
  answer_sources:
  - alert
  - edr_console
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like automation or isolated activity?
  context: >-
    The query mirrors the rule's selection with no host scope, giving a fleet-wide count of the
    pattern. Many hosts producing it points to something deployed broadly — a detection-validation
    run, a sample distributed to a test group — and reframes the alert as tooling. One host or a
    small unrelated set points to host-specific activity and sets the boundary for follow-up.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \QbotUninstall.exe
      - Hashes|contains:
        - IMPHASH=E772C815072311D6FB8C3390743E6BE5
        - SHA256=423A9D13D410E2DC38EABB9FDF3121D2072472D0426260283A638B822DCD5180
        - SHA256=559CAE635F0D870652B9482EF436B31D4BB1A5A0F51750836F328D749291D0B6
        - SHA256=855EB5481F77DDE5AD8FA6E9D953D4AEBC280DDDF9461144B16ED62817CC5071
        - SHA256=FAB408536AA37C4ABC8BE97AB9C1F86CB33B63923D423FDC2859EB9D63FA8EA0
      condition: selection
    fields:
