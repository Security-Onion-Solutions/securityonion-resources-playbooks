name: Qakbot Uninstaller Execution
id: 50801c77-946e-4ba7-bd3b-83205903e595
description: |
  Detects a process that either runs from a file whose path ends in \QbotUninstall.exe or whose
  recorded hash matches one of five values — one import hash and four SHA-256 digests — belonging to
  the removal utility distributed to infected hosts during the 2023 law-enforcement disruption of the
  Qakbot botnet. The utility's function was removal rather than intrusion: it terminated the resident
  implant and unlinked the host from its command-and-control infrastructure. It was delivered over
  the botnet's own channel, so a genuine execution implies the host was enrolled in the botnet at the
  time, and it says nothing about what the implant had already installed — second-stage payloads were
  outside the utility's scope and were left in place. Because the file and its hashes have circulated
  publicly since, an execution now is at least as likely to be a retained sample detonated on an
  analysis or test host, or an unrelated file carrying the name. Determine which branch matched, what
  launched the process, where the file came from, and, if the execution is genuine, what else the
  host was carrying before removal ran.
type: detection
detection_id: bc309b7a-3c29-4937-a4a3-e232473f9168
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Did the alerting process match either the QbotUninstall.exe file name or one of the recorded uninstaller hashes?
  context: >-
    The rule's selection is two alternative branches and a match on one of them is enough. The name
    branch fires on any executable whose path ends in \QbotUninstall.exe regardless of its content, so
    a renamed or entirely unrelated file satisfies it. The hash branch fires on one import hash or one
    of four SHA-256 digests and identifies the file's content whatever it is called. Note which branch
    matched, because it sets the weight of everything downstream: a hash match settles file identity
    and moves the investigation onto delivery, launch mechanism, and prior host activity, while a
    name-only match makes the origin and true content of the file the first thing to establish.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - Hashes
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run a malware-removal utility or to handle retained malware samples?
  context: >-
    A host with a malware-analysis, incident-response, or detection-testing role routinely executes
    retained samples and removal tooling, and that is the most common benign path for a file of this
    kind. An ordinary workstation or server with no such role leaves two other paths: a file executed
    by a resident process on the host, or a person running it by hand. Knowing the host's function and
    the account's role separates these before further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What was the full command line and working directory of the alerting binary on this host?
  context: >-
    The utility takes no operator-supplied arguments of any significance, so the directory it ran from
    carries most of the meaning. A path under a user profile temp directory, ProgramData, or another
    user-writable staging location is consistent with a file written by a resident process and
    executed in place. A path under a tools, samples, or analysis share directory, or an explicit
    argument list, points to a deliberate run. Scoping to this binary on this host in the alert window
    also surfaces repeated invocations rather than only the one that fired.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned the alerting binary, and is that parent chain expected?
  context: >-
    The parent is the highest-value pivot for this alert. Removal delivered over the botnet's own
    channel means the resident implant, or a process it had injected into, launched the file — so an
    unfamiliar binary running from a user-writable path, or a system process with an implausible
    parent of its own, points to the host having been enrolled before the alert. A parent of
    explorer.exe, a command interpreter, an archive utility, or a browser points to a person running
    the file by hand. A management or software-deployment agent parent points to a pushed
    remediation. Walk one level further up from whatever the parent turns out to be.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Was a file named QbotUninstall.exe written to this host, and which process wrote it?
  context: >-
    The execution event shows the file ran; the write event shows where it came from. The writing
    process is the delivery mechanism, and the candidates separate cleanly: a resident process
    unpacking it into a temp directory, an archive utility expanding a retained sample, a browser
    saving a download, or a management agent staging it. File writes carry no hash, so identity still
    has to come from the execution event; if the alert matched on hash under a different file name,
    substitute that name from the alerting process path.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: QbotUninstall.exe
      condition: selection
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
  answer_sources:
  - file_event
  - process_creation
- question: What child processes did the alerting binary spawn afterward?
  context: >-
    Removal behavior is narrow: terminate the resident implant's processes, delete its files, and
    exit, largely without spawning anything of note. Command interpreters, script hosts, download
    utilities, or unfamiliar binaries appearing as children mean the file is doing more than its name
    describes, and the execution should be treated as an unknown binary rather than a cleanup step.
    No children at all is consistent with either the removal utility working as intended or a run
    that failed to start.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating process activity in the alert window collapses routine agent telemetry into high-count
    rows and leaves novel parent-child pairs standing at low counts. Look backward for what staged the
    file — a process writing into a temp directory, an archive extraction, a download — and forward
    for anything that removal of a single implant would not account for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- always_include: true
  question: What else did this user run across the environment around this time?
  context: >-
    Tracking the account across all hosts in the alert window shows whether the activity is confined to
    this endpoint or the same account is active elsewhere — which matters if the file was carried
    around by a person rather than delivered to the host. If the alert fired under SYSTEM, a machine
    account, or another service principal, this returns routine agent telemetry and the
    launch-mechanism questions carry the answer instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did the same parent-driven pattern fire on other hosts in the same window?
  context: >-
    Under a service principal, user identity does not attribute behavior; the launch mechanism does.
    This query mirrors the rule's selection scoped to the alerting parent process, fleet-wide, in the
    alert window. Several hosts in the same window points to a pushed or scheduled rollout — a
    deployment agent distributing the file, or a testing harness. A single host points to a host-local
    trigger and keeps the boundary where it is.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \QbotUninstall.exe
      - Hashes|contains:
        - IMPHASH=E772C815072311D6FB8C3390743E6BE5
        - SHA256=423A9D13D410E2DC38EABB9FDF3121D2072472D0426260283A638B822DCD5180
        - SHA256=559CAE635F0D870652B9482EF436B31D4BB1A5A0F51750836F328D749291D0B6
        - SHA256=855EB5481F77DDE5AD8FA6E9D953D4AEBC280DDDF9461144B16ED62817CC5071
        - SHA256=FAB408536AA37C4ABC8BE97AB9C1F86CB33B63923D423FDC2859EB9D63FA8EA0
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Has this host run a binary with this file name before, outside the alerting execution?
  context: >-
    This counts executions of the alerting file name on this host over 90 days regardless of hash, so
    it answers whether the file is resident on the host or first-seen. Repeated executions over months
    under the same account point to something kept and re-run deliberately, which fits an analysis or
    test host. A single execution with no history fits a file that arrived shortly before it ran.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: When this host has previously fired the rule's pattern, what parents and users drove that activity, and does the current alert fit?
  context: >-
    The query mirrors the rule's selection scoped to this host, so the parent and user distribution
    reflects the rule's own firing pattern rather than generic binary usage. A recurring parent and
    account mean the file is part of something that lives here — a sample collection, a detection-test
    harness — and this alert is another instance of it. No prior history means this is the first time
    the pattern has appeared on the host, which raises the weight of the delivery and launch-mechanism
    questions.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \QbotUninstall.exe
      - Hashes|contains:
        - IMPHASH=E772C815072311D6FB8C3390743E6BE5
        - SHA256=423A9D13D410E2DC38EABB9FDF3121D2072472D0426260283A638B822DCD5180
        - SHA256=559CAE635F0D870652B9482EF436B31D4BB1A5A0F51750836F328D749291D0B6
        - SHA256=855EB5481F77DDE5AD8FA6E9D953D4AEBC280DDDF9461144B16ED62817CC5071
        - SHA256=FAB408536AA37C4ABC8BE97AB9C1F86CB33B63923D423FDC2859EB9D63FA8EA0
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this account, giving a 90-day history of the
    pattern for this user aggregated by host. An account that produces it routinely usually belongs to
    someone whose job involves handling retained samples, and the count across hosts will show that
    directly. An account that has never produced it before is worth more attention. Weigh the result
    against the account's role and normal toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
