name: Winrs Local Command Execution
id: af60cae0-fdc3-4e36-b5d0-e5e34904a826
description: |
  Detects winrs.exe used to run commands locally rather than against a remote endpoint. The rule fires when the
  winrs.exe binary (matched by Image or OriginalFileName) is invoked either with an explicit local target
  (/r:localhost, /r:127.0.0.1, /r:[::1], or the /remote: equivalents) or with no remote-target flag at all, in
  which case winrs defaults to localhost. Commands launched this way execute under winrshost.exe as children of a
  Microsoft-signed binary, a form of system binary proxy execution used to evade defenses or to stage local
  command execution. Legitimate winrs use is almost always remote and administrative; local invocation is unusual
  and the investigation should determine what command was run, who ran it, and whether it fits expected
  administrative activity on the host.
type: detection
detection_id: bcfece3d-56fe-4545-9931-3b8e92927db1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the alerting event show winrs.exe invoked for local execution, either targeting localhost/loopback or with no remote-target flag?
  context: >-
    Confirm the alert is a true positive before investing further time. The rule fires on winrs.exe (by Image or
    OriginalFileName) in one of two branches: an explicit local target (/r:localhost, /r:127.0.0.1, /r:[::1], or
    the /remote: forms), or any winrs invocation that carries no /r: or /remote: flag at all, which defaults to
    localhost. Note which branch fired — an explicit loopback target is a deliberate local invocation, while the
    no-flag branch can also catch winrs used with other parameters but no target, so read the full command line to
    confirm it is genuinely local rather than a mistargeted remote call.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run winrs.exe for local command execution?
  context: >-
    Legitimate winrs use is overwhelmingly remote and performed by administrators or deployment tooling. Local
    winrs execution is uncommon, so determine whether the user role and host function make hands-on local use
    plausible — for example an administrator testing a command, or an automation framework — versus an account or
    endpoint with no business reason to proxy commands through winrs.exe.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this winrs.exe invocation run? Decode every flag and the command it executed locally.
  context: >-
    The full command line reveals the operational purpose. Decode the winrs parameters (/r: or /remote: target,
    /u: and /p: credentials, /env:, /unencrypted) and, critically, the trailing command winrs was asked to run
    locally — a built-in interpreter, a reconnaissance binary, or a script. Inline credentials or an encoded
    interpreter command escalate priority. This view scopes to all winrs.exe executions on the host in the window
    so sequential invocations that form one logical operation are visible together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What child processes did winrshost.exe spawn on this host after the alert?
  context: >-
    Commands run locally through winrs execute as children of winrshost.exe, so the spawned processes reveal the
    actual impact. Look for interpreters (cmd.exe, powershell.exe), reconnaissance utilities, or download tooling
    launched under winrshost.exe shortly after the alert — these are the post-execution actions the proxy was used
    to stage.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: \winrshost.exe
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What process spawned this winrs.exe, and is that parent chain expected?
  context: >-
    Because winrs.exe is a Microsoft-signed binary, the parent that launched it indicates how the proxy execution
    was initiated. An interactive shell, a remote-access tool, a script host (wscript.exe, mshta.exe), or an Office
    application as the parent points to operator-driven or scripted abuse, whereas a routine administrative parent
    is more consistent with expected use.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What user account and logon backed this winrs invocation, and is that account expected to run it?
  context: >-
    WinRM activity is most suspicious when driven by an unexpected account — a non-administrator, a service account,
    or an account that does not normally administer this host. The command line may also carry inline credentials
    (/u: and /p:), which indicate explicit credential supply rather than the current session's identity. Correlate
    the account against expected administrators and against any inline credentials in the command.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
      - CommandLine
- question: What WinRM-related logon events occurred on this host around the alert?
  context: >-
    WinRM-backed execution generates logon events even for local invocation, and the logon type and source address
    distinguish a genuinely local session from one that arrived over the network. Correlate logon success and
    failure events for the alerting account in the window to confirm whether the session was local, and to see
    whether the same account also authenticated from elsewhere. If Windows Security logs are not ingested in this
    environment, treat zero results as a visibility gap rather than evidence nothing occurred.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 4624
          - 4625
          - 4648
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetUserName
      - IpAddress
      - LogonType
      - EventID
- question: Does this host normally run winrs.exe at all?
  context: >-
    A binary that rarely or never runs on a host is more suspicious than one that runs routinely. Because legitimate
    winrs use is normally remote and may be uncommon on any given endpoint, a zero or very low historical count here
    strengthens the case that the local invocation is anomalous.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this winrs local-execution pattern, what parents and users drove it, and does the current alert fit?
  context: >-
    Even Microsoft-signed binaries can be abused. This query mirrors the rule's exact selection structure scoped to
    this host, so the resulting parent and user distribution reflects how this specific local-winrs pattern has run
    here historically — not generic winrs usage. A new parent process, an unexpected account, or an unusual
    command-line structure relative to that baseline is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \winrs.exe
      - OriginalFileName: winrs.exe
      selection_local_ip:
        CommandLine|contains|windash:
        - /r:localhost
        - /r:127.0.0.1
        - /r:[::1]
        - /remote:localhost
        - /remote:127.0.0.1
        - /remote:[::1]
      filter_main_remote:
        CommandLine|contains|windash:
        - '/r:'
        - '/remote:'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* or (selection_img and not 1 of filter_main_*)) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \winrs.exe
      - OriginalFileName: winrs.exe
      selection_local_ip:
        CommandLine|contains|windash:
        - /r:localhost
        - /r:127.0.0.1
        - /r:[::1]
        - /remote:localhost
        - /remote:127.0.0.1
        - /remote:[::1]
      filter_main_remote:
        CommandLine|contains|windash:
        - '/r:'
        - '/remote:'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* or (selection_img and not 1 of filter_main_*)) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \winrs.exe
      - OriginalFileName: winrs.exe
      selection_local_ip:
        CommandLine|contains|windash:
        - /r:localhost
        - /r:127.0.0.1
        - /r:[::1]
        - /remote:localhost
        - /remote:127.0.0.1
        - /remote:[::1]
      filter_main_remote:
        CommandLine|contains|windash:
        - '/r:'
        - '/remote:'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* or (selection_img and not 1 of filter_main_*)) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether the local winrs execution is isolated or part of
    broader hands-on activity. The same user driving similar activity on multiple endpoints widens the potential
    scope of compromise.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \winrs.exe
      - OriginalFileName: winrs.exe
      selection_local_ip:
        CommandLine|contains|windash:
        - /r:localhost
        - /r:127.0.0.1
        - /r:[::1]
        - /remote:localhost
        - /remote:127.0.0.1
        - /remote:[::1]
      filter_main_remote:
        CommandLine|contains|windash:
        - '/r:'
        - '/remote:'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* or (selection_img and not 1 of filter_main_*)) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or
    credential access — may reveal the attack stages that preceded the local winrs execution and help reconstruct
    the timeline that led to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Is winrs.exe being used for local execution on other hosts in the same window?
  context: >-
    The same proxy-execution pattern run across many systems in a short window suggests scripted deployment or a
    coordinated operation rather than a one-off. This query mirrors the rule's local-winrs selection across the
    fleet, excluding the alerting host, to surface other endpoints exhibiting the same pattern and help scope
    containment.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \winrs.exe
      - OriginalFileName: winrs.exe
      selection_local_ip:
        CommandLine|contains|windash:
        - /r:localhost
        - /r:127.0.0.1
        - /r:[::1]
        - /remote:localhost
        - /remote:127.0.0.1
        - /remote:[::1]
      filter_main_remote:
        CommandLine|contains|windash:
        - '/r:'
        - '/remote:'
      filter_self:
        host.name|expand: '%hostname%'
      condition: (all of selection_* or (selection_img and not 1 of filter_main_*)) and not filter_self
    fields:
      - host.name
