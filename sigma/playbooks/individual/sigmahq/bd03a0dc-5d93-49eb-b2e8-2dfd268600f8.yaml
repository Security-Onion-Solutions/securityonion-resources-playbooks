name: Potential Compromised 3CXDesktopApp Beaconing Activity - DNS
id: ff464424-f784-4d84-8d01-e16396b2a443
description: |
  Detects DNS lookups to domains associated with the trojanized 3CXDesktopApp softphone client, whose
  compromised build beaconed to attacker-controlled command-and-control infrastructure. The softphone
  binary is legitimately signed and widely deployed, so the DNS request — not the process reputation —
  is the trigger: a build carrying a sideloaded ffmpeg.dll resolves one of these domains as part of its
  beacon. A lookup to any of these domains from an internal host indicates the compromised build is
  present and attempting to reach command-and-control; determine which process issued the query, whether
  it resolved and the host then connected, what modules the process loaded, and how many hosts across the
  environment share the exposure.
type: detection
detection_id: bd03a0dc-5d93-49eb-b2e8-2dfd268600f8
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the queried domain match one of the 3CX-compromise C2 domains, and which process issued the lookup?
  context: Confirm the alert by reviewing the exact domain (QueryName) and the querying process against the rule's
    watched domain list. A DNS alert carries the queried domain and the querying process, not a destination IP, so the
    process behind the lookup is the first thing to establish.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
  answer_sources:
  - alert
  - dns_query
- question: Is the 3CXDesktopApp softphone (or whatever process issued the lookup) expected to be installed and running on this host?
  context: The trojanized softphone is legitimately signed and may be a sanctioned business application, so the presence of
    the process is not itself the finding — the lookup to a watched domain is. Knowing whether this host is a sanctioned
    softphone endpoint helps separate a compromised-build install from an unexpected process reaching this infrastructure.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Which domain was queried, is it a known 3CX-compromise indicator, and did the lookup resolve to an address?
  context: The alert is a DNS lookup, not a connection. Characterize the domain itself — registration age, passive DNS,
    and threat-intel reputation — and confirm whether it resolved. A resolved lookup means an address was returned that the
    host could then connect to; an unresolved lookup (sinkholed or NXDOMAIN) still confirms the compromised build attempted
    the beacon.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
      - Image
  answer_sources:
  - external_threat_intel
  - manual_review
- question: What is the process that issued the lookup, and what do its command line and working directory reveal?
  context: Pivot from the DNS event to the process_creation record of the querying binary to read its full command line and
    the directory it ran from. A softphone launched from its normal install path differs from a copy running out of a
    user-writable or temporary directory, which points at a relocated or repackaged build.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What launched the querying process, and is that parent chain the expected softphone startup path?
  context: The parent process shows how the querying binary was started. A softphone client normally starts from the service
    control manager or the interactive shell at login; an unexpected parent such as a script host or an installer running
    from a temporary path suggests the process was staged rather than installed. If parent linkage is not carried on the DNS
    event, reconstruct lineage from the querying process's own process_creation record.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Did the querying process load a trojanized ffmpeg.dll or other unsigned modules from its application directory?
  context: The fulcrum of the 3CX compromise is a sideloaded ffmpeg.dll bundled with the signed softphone; the beacon logic
    runs from that module, not from the signed executable. Review the modules loaded by the querying process and their
    signature state — an unsigned or unexpectedly signed ffmpeg.dll (or any unsigned module) loaded from the app directory
    corroborates a compromised build.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
  answer_sources:
  - process_creation
  - manual_review
- question: What other domains did the querying process look up around this time, and do they resemble beaconing?
  context: A single flagged lookup is often one of many. Pull every domain the same process resolved in the surrounding
    window; a repeating cadence or a set of algorithmically varied domains from one process is the beaconing signal, and any
    additional watched domains extend the confirmed C2 footprint.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - QueryName
      - Image
  answer_sources:
  - dns_query
- question: After the domain resolved, did this host open an outbound connection to the resolved address?
  context: A DNS lookup only proves resolution was attempted; the follow-through is whether the host actually reached the
    returned address. Pivot on the resolved IP into network connections from this host to see if a session was established,
    and on which port. If the lookup returned no address this returns nothing, which itself means no connection followed.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dns_resolved_ip%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
      - Image
  answer_sources:
  - network_connection
- question: What files did the querying process write to disk on this host?
  context: A beaconing process that reaches command-and-control may retrieve and drop second-stage payloads. Review files
    written by the same process on this host; multiple distinct writes point to staged delivery rather than a single
    configuration file.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
  answer_sources:
  - file_event
  - network_connection
- question: Has this host queried this domain before, or is this the first lookup?
  context: First-time lookups to a domain are more telling than routine resolution. A zero or near-zero historical count for
    this domain on this host indicates the beacon target is new to the environment rather than an established service.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
      - Image
  answer_sources:
  - dns_query
- question: Does this host normally run the querying process?
  context: A softphone client that has run for months looks different from a binary appearing on the host for the first time.
    A zero or very low historical count for the querying process indicates a first-time or rare execution worth closer review.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: Did other hosts in the environment query this same domain?
  context: The domain list is tied to a specific compromised software build, so fan-out maps the deployment footprint. Many
    hosts resolving the same watched domain indicates the compromised build is installed widely; a single host indicates
    isolated exposure. The distribution informs the scope of the response.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - dns_query
- question: What other activity occurred on this host around the time of the alert?
  context: A beacon rarely fires in isolation. Examining the surrounding process activity reveals what ran before and after
    the lookup and whether the host shows hands-on-keyboard follow-through such as reconnaissance, credential access, or
    persistence alongside the command-and-control signal.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential access — help place the
    beacon in a timeline and reconstruct what preceded it. A run of related alerts before the lookup points to an active
    multi-stage operation rather than an isolated event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
