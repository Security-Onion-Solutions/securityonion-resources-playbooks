name: Suspicious ASPX File Drop by Exchange
id: e3f99387-beab-4416-87ca-2d5c6c080b6a
description: |
  Fires when the IIS worker process w3wp.exe, hosting an Exchange application pool (its command line contains MSExchange), writes a file ending in .aspx, .asp, or .ashx into an Exchange web directory (FrontEnd\HttpProxy\ or \inetpub\wwwroot\aspnet_client\). All of the selection groups must match together. A web-facing server process writing a server-side script into its own web root is the classic web-shell installation pattern that follows exploitation of a public-facing Exchange server, giving an operator a persistent hands-on-keyboard interface hosted by the mail server. Legitimate Exchange servicing occasionally stages files in these paths, so the investigation must confirm what the file contains, whether the worker then spawned command shells, and whether the drop lines up with authorized patching or a documented change.
type: detection
detection_id: bd1212e5-78da-431e-95fa-c58e3237a8e6
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the dropped file path, extension, and creating process match what this rule detects?
  context: Confirm the alert is a true positive before investing further time. Verify that the responsible process is w3wp.exe running an Exchange application pool (MSExchange in its command line), that the target path lands under FrontEnd\HttpProxy\ or \inetpub\wwwroot\aspnet_client\, and that the file ends in .aspx, .asp, or .ashx. All three must hold together for this to be the web-shell-drop pattern rather than routine content.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this host an Exchange server where the worker process is expected to write script files into these web directories?
  context: A file-drop into an Exchange web root is only meaningful if the host is a mail server. On a genuine Exchange server, servicing can occasionally stage files in these paths; on a host that is not running Exchange, or under an account that has no business writing there, the same event is far more suspicious. The writing process is w3wp.exe, so judge legitimacy by the host role and the application pool rather than by an interactive user.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this Exchange server patched against the known SSRF and PowerShell RCE vulnerabilities used to reach the worker process?
  context: This drop pattern commonly follows exploitation of a public-facing Exchange server. An unpatched server confirms the exploitation path was open and flags other similarly unpatched Exchange hosts as at risk. Verify the server carries fixes for CVE-2022-41040 (authenticated server-side request forgery) and CVE-2022-41082 (Exchange PowerShell remote code execution); an up-to-date server points the investigation toward a different access path.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: What inbound web request drove the worker process to write this file?
  context: For a server-side drop, the delivery vector is the HTTP request that reached the Exchange worker process, not an email or document. Identifying the originating request and its source address enables perimeter blocking and a search for the same request pattern against other Exchange endpoints. The alert exposes the worker process context; the request itself is reconstructed from web server access and proxy logs for the same timeframe.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: What is inside the dropped script file, and does its content look like a web shell?
  context: Read the actual content of the .aspx/.asp/.ashx file. Web shells typically contain a small handler that evaluates attacker-supplied input, often wrapped in base64, hex, or character-concatenation obfuscation, and may pass commands through to a shell. Look for eval/execute constructs, request-parameter handling, encoded string blobs, and embedded URLs or IP addresses. Content retrieval is a manual step from the on-disk path or the endpoint console; the query locates the write event and the responsible process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: After the drop, what processes did the IIS worker process spawn on this host, and are any of them command shells or script interpreters?
  context: A dropped web shell earns its value when the operator uses it to run commands, which surfaces as the IIS worker process spawning children such as cmd.exe, powershell.exe, or reconnaissance binaries. Enumerate everything w3wp.exe spawned after the drop and inspect the command lines; interactive reconnaissance strings (whoami, ipconfig, net, quser, dir chained with echo markers) are the signature of hands-on-keyboard web-shell use rather than a benign file.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: If this artifact was later executed, what is its hash and does it carry known AV or threat-intel detections?
  context: File-write events carry no hash; a hash is recorded when a file runs. An interpreted web shell is hosted inside the worker process rather than launched as its own process, so this execution-pivot query may return nothing even for a real web shell — in that case retrieve the file from its on-disk path and hash it manually for reputation lookup. Where the operator dropped and then ran a standalone binary, this surfaces its hash for submission to threat intelligence.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
- question: Is the dropped file still on disk, or was it deleted or renamed after the alert?
  context: The file's post-alert lifecycle drives both urgency and next steps. A web shell still on disk can be retrieved, hashed, and analyzed and should be contained; a file deleted or renamed shortly after creation suggests cleanup or staging and shifts the focus to what ran in the interval. Interpret the lifecycle from the operation type recorded on each event for this path.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the responsible process write or delete around the time of the alert?
  context: An operator installing a web shell often drops several artifacts — multiple shells, staged tooling, or output files. The breadth, paths, and extensions of the worker process's other file activity distinguish a single planted file from a broader installation and enumerate what else needs review. The correlation follows the responsible process and its direct children by their process identifiers, which the alert event already carries.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to the Exchange web directories on this host recently, and by which processes?
  context: The Exchange FrontEnd\HttpProxy and aspnet_client directories have a small set of processes that legitimately write there. Other recent arrivals in the same locations reveal whether this is an isolated drop or a directory under active use, and which additional files belong to the same activity. A single unfamiliar writer touching many files in these paths is the signal to chase.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
        - 'FrontEnd\HttpProxy\'
        - '\inetpub\wwwroot\aspnet_client\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What authentication activity on this host preceded the file drop, and does the source or account look expected?
  context: Reaching the Exchange worker process to plant a web shell typically requires prior authentication, and the credentials used are often ordinary standard-user accounts obtained through spraying or theft. Logon events in the hour before the drop, together with their source addresses and logon types, can reveal the account and origin behind the activity. If Windows Security logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence nothing preceded the drop.
  range: -1h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
        - 4624
        - 4648
      condition: selection
    fields:
      - EventID
      - TargetUserName
      - IpAddress
      - LogonType
- question: Did the same detection fire on other servers, indicating more than one host was targeted?
  context: Exploitation of a public-facing service rarely targets a single host. Correlating the same rule across the fleet reveals how many servers produced the same web-shell-drop pattern and identifies additional compromised systems that need the same investigation. Multiple servers firing points to a broader operation against the environment's Exchange footprint.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: When this host has previously produced the rule's drop pattern, what programs and users drove it, and does the current alert fit that history?
  context: The query mirrors the rule's full selection scoped to this host, so the resulting program and user distribution reflects how this specific drop pattern has historically run here rather than generic worker-process activity. A new acting program process, an unexpected account, or a first-ever appearance of the pattern on this host is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith: \w3wp.exe
        CommandLine|contains: MSExchange
        TargetFilename|contains:
        - FrontEnd\HttpProxy\
        - \inetpub\wwwroot\aspnet_client\
      selection_types:
        TargetFilename|endswith:
        - .aspx
        - .asp
        - .ashx
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection*) and _pb_scope
    fields:
    - Image
    - User
- always_include: true
  question: Has this user previously produced the rule's drop pattern, and does that history fit their role?
  context: The query mirrors the rule's selection scoped to this user, returning their 90-day history of this specific drop pattern aggregated by host, not generic use of the worker process. A user who has never produced this pattern is more suspicious than one who does so routinely; weigh the count against the account's role and whether it should be touching Exchange web roots at all.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith: \w3wp.exe
        CommandLine|contains: MSExchange
        TargetFilename|contains:
        - FrontEnd\HttpProxy\
        - \inetpub\wwwroot\aspnet_client\
      selection_types:
        TargetFilename|endswith:
        - .aspx
        - .asp
        - .ashx
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven the rule's drop pattern here, or is the program new for this activity?
  context: When the alert fires under a service or machine account, user identity does not attribute behavior and the meaningful pivot is the launch mechanism. The query mirrors the rule's selection scoped to the alerting program, returning the 90-day history of that program driving this specific pattern. A new or rare program for the pattern is the deviation; a program already accounting for many prior events is routine servicing automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith: \w3wp.exe
        CommandLine|contains: MSExchange
        TargetFilename|contains:
        - FrontEnd\HttpProxy\
        - \inetpub\wwwroot\aspnet_client\
      selection_types:
        TargetFilename|endswith:
        - .aspx
        - .asp
        - .ashx
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around the time of the alert?
  context: Tracking the account's activity across all hosts reveals lateral movement or parallel activity on other endpoints. If the same account produced similar activity elsewhere, the scope of compromise is larger than one server. When the alert fires under a service or machine account this view returns background agent noise, so read it alongside the parent-process pivot that isolates the actual launch mechanism.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did the same program-driven drop pattern fire on other hosts in the same window, or is the activity isolated to this server?
  context: Under a service or machine account, asking what else the user did returns background noise from agents running everywhere. The meaningful question is whether the same launch mechanism fired elsewhere in the alert window. The query mirrors the rule's selection scoped to the alerting program across the fleet; multiple hosts in the same window point to a coordinated rollout against several Exchange servers, while a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith: \w3wp.exe
        CommandLine|contains: MSExchange
        TargetFilename|contains:
        - FrontEnd\HttpProxy\
        - \inetpub\wwwroot\aspnet_client\
      selection_types:
        TargetFilename|endswith:
        - .aspx
        - .asp
        - .ashx
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: A web-shell drop rarely happens in isolation. Earlier detections on the same server — exploitation attempts, reconnaissance, or defense tampering — may reveal the stages that preceded the drop and help reconstruct the timeline. The sequence of alerts on this host tells the fuller story of how the operator reached the point of planting a shell.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
