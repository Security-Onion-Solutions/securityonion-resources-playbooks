name: Renamed Msdt.EXE Execution
id: cf7386f2-c67b-40d0-8141-6e6184b400ee
description: |
  Detects a process whose embedded PE metadata identifies it as msdt.exe (OriginalFileName is msdt.exe) while the on-disk filename is something other than msdt.exe. msdt.exe is the Microsoft Diagnostics Tool and a documented LOLBIN abused for application-whitelisting bypass and proxy execution; renaming it is a masquerading move that hides the tool from name-based detection while preserving its capability. Legitimate copies run as msdt.exe from System32 or SysWOW64, so a metadata/name mismatch is the anomaly here. Investigation should confirm the mismatch, determine how the renamed binary arrived, trace its parent and children, and establish whether the same pattern appears elsewhere in the environment.
type: detection
detection_id: bd1c6866-65fc-44b2-be51-5588fcff82b9
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does this process carry msdt.exe PE metadata while running under a different on-disk filename?
  context: Confirm the true positive before investing time. The rule fires when the embedded OriginalFileName is msdt.exe AND the on-disk image name is NOT msdt.exe. Review the triggering event to verify both halves of the mismatch hold for this process.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - OriginalFileName
- question: Is this user and host expected to run the Microsoft Diagnostics Tool?
  context: Legitimate diagnostics activity can trigger detections, but the tool normally runs as msdt.exe from a system path. Knowing whether the user role and host function involve diagnostics or troubleshooting helps separate a routine action from a renamed-binary anomaly.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the actual identity of this binary based on its metadata and hash?
  context: The on-disk Image name differs from the embedded OriginalFileName of msdt.exe, so compare the two to confirm the rename. The code-signing status indicates whether this is a Microsoft-signed system binary that was relocated and renamed, or an unsigned or tampered copy. The file hash enables a reputation lookup to determine whether this is a known-good tool, a known sample, or a novel binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: What exactly did this renamed msdt.exe do? Decode its full command line.
  context: The full command line reveals whether this invocation matches a known msdt.exe abuse pattern. Look for an answer-file path passed with -path and -af plus /skip, or PCWDiagnostic with an IT_BrowseForFile parameter, both of which drive whitelisting bypass or arbitrary command execution. Decode any embedded paths, parameters, or expansion syntax to understand the operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: How did this renamed msdt.exe binary arrive on the host?
  context: A renamed binary does not appear spontaneously; it was copied, downloaded, or dropped by another process. Tracing the file creation event by basename over a long window reveals the delivery mechanism and the process that wrote it. A user-writable location such as Downloads, Temp, or AppData points to download or extraction; a system directory may indicate compromise of a privileged process or a routine install.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What process spawned this renamed msdt.exe, and is that parent chain expected?
  context: The parent process reveals how the binary was invoked. Office applications such as WINWORD.EXE or EXCEL.EXE spawning a diagnostics binary is a known exploitation telltale, and other scripting hosts like mshta.exe or wscript.exe as the parent also point to malicious launch rather than user-initiated troubleshooting.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What did this renamed binary spawn after execution, and is the same binary present on other hosts?
  context: Renaming hides the tool while it performs its intended function, so the child processes reveal the actual objective. A diagnostics binary spawning sdiagnhost.exe followed by cmd.exe, powershell.exe, regsvr32, or msiexec indicates proxy execution of attacker code. The same renamed binary on multiple hosts suggests deliberate distribution rather than an isolated event.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run a binary with msdt.exe metadata?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low historical counts over 90 days indicate a first-time or rare execution, which fits a freshly delivered renamed copy.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: How often has this host fired this renamed-msdt pattern over the past 90 days, and what command-line structures are typical?
  context: A LOLBIN pattern with no prior history on a host is more suspicious than one seen regularly under stable parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects the rule's specific firing pattern rather than generic msdt.exe usage. The CommandLine projection lets the analyst compare typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName: msdt.exe
      filter:
        Image|endswith: \msdt.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - CommandLine
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the surrounding process activity reveals what led to this event and what followed, and whether it is part of a larger sequence involving reconnaissance, privilege escalation, or persistence. Novel parent-child pairs stand out at low counts against the high-count rows of routine telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal the attack stages that preceded this event and help reconstruct the timeline. The sequence of alerts often tells the operational story leading up to the renamed-binary execution.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName: msdt.exe
      filter:
        Image|endswith: \msdt.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName: msdt.exe
      filter:
        Image|endswith: \msdt.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity on several hosts, the scope of the event may be larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName: msdt.exe
      filter:
        Image|endswith: \msdt.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: Were any other proxy-execution LOLBins used on this host recently?
  context: Operators who abuse one LOLBIN for proxy execution often reach for several. Finding rundll32, regsvr32, mshta, msiexec, or similar binaries running near this event strengthens the case that the renamed msdt.exe is part of an execution chain rather than an isolated artifact.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\installutil.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
