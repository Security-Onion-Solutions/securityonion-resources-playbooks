name: Commvault QOperation Path Traversal Webshell Drop (CVE-2025-57790)
id: c8e5a9e5-173c-4470-ade8-bf177e9490e0
description: |
  Detects a single command line that invokes the Commvault qoperation utility with an execute action, a ' -af ' XML
  answer-file argument, and a .jsp output path under the Apache/Tomcat web root. Every one of those elements must be
  present together for the rule to fire. The combination corresponds to the file-write step of CVE-2025-57790, a path
  traversal in QCommand handling that lets an authenticated request place a JSP file outside the directory the utility
  is meant to write to and into the servlet container's document root. qoperation itself is a normal administration
  utility on Commvault servers, but no documented administrative workflow writes .jsp files into the web root.
  Determine whether the JSP landed on disk, what it contains, whether the web server process subsequently spawned
  command shells or script interpreters, how the request that drove the write was authenticated, and whether the
  installed build is one of the versions affected by this issue.
type: detection
detection_id: bd3b3fff-a018-4994-9876-68af5809160f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the command line contain every marker this rule requires for a qoperation webshell write?
  context: 'The rule fires only when one command line carries all of these together: `qoperation`, `exec`, the ` -af `
    switch, a `.xml ` argument, the `\Apache\webapps\ROOT\` web root path, and `.jsp`. Confirm each element is present
    rather than assuming, and read the full traversal path the JSP was directed to before investing further time.'
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this host a Commvault application server, and is this account expected to run qoperation at all?
  context: qoperation is a legitimate Commvault administration utility, so its presence on a CommServe or web server is
    routine and its presence anywhere else is not. Establish the host's role and whether the account is a Commvault
    service identity, an interactive administrator, or something neither of those. Writing into the servlet container's
    document root is outside the utility's normal administrative use regardless of who ran it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What web request triggered this execution, and what process launched the qoperation command?
  context: Exploitation of this path traversal reaches the utility through the product's web front end, which proxies
    REST requests to a backend command service; the parent process therefore identifies which server component invoked
    the command rather than a human operator. The originating request, its source address, and the token it presented
    have to come from the web server access logs. Look for a preceding multipart upload that placed an XML answer file
    into a metrics upload directory, since that write stages the payload the command then references.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - manual_review
  - edr_console
- question: Is this Commvault installation patched against CVE-2025-57790?
  context: CVE-2025-57790 is a path traversal in QCommand handling that allows a request to write a file outside the
    intended directory. Builds 11.32.0-11.32.101, 11.36.0-11.36.59 and 11.38.20-11.38.25 are affected; 11.32.102,
    11.36.60 and 11.38.32 carry the fix. An affected build confirms the write was possible without any additional
    weakness and tells you which other application servers share the same exposure.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
  answer_sources:
  - asset_inventory
  - edr_console
- question: Were other servers targeted by the same exploitation attempt?
  context: Exploitation of a reachable application is rarely aimed at a single host. Correlating this detection across
    the environment shows how many application servers saw the same webshell write and which additional systems need
    the same file and execution checks. Absence of other hits does not close the question if the rule was only recently
    deployed or if other servers are not reporting process telemetry.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - alert
- question: What exactly did the qoperation command do, and which XML answer file and JSP output path did it name?
  context: The command line names both the XML answer file that carries the operation and the traversal path the JSP was
    directed to; resolve both against the filesystem. The XML is normally dropped first by a separate upload, so its
    location and timestamp anchor the earlier stage of the chain. Scoping to every qoperation invocation on this host in
    the surrounding window catches setup, retry, or cleanup commands issued alongside the write that a single-event view
    would miss.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: 'qoperation'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: Is the JSP payload or the XML answer file encoded or obfuscated, and what does the decoded content do?
  context: The JSP content is staged outside the command line, commonly in an uploaded XML file or in a user object's
    description property, so the command itself reveals only paths. Retrieve the written .jsp and decode it. Minimal
    webshells are a single tag that passes a request parameter straight to a runtime exec call; a common variant hides
    that behind an expression-language string that resolves the runtime class by name so the literal class reference
    never appears. Base64, hex, URL-encoding, and character-concatenation wrappers layer on top of both forms and may
    need decoding more than once.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: What files were written into the web root on this host, and does the JSP named in the command line exist there?
  context: The command line records the intended output path; the file event records whether the write actually landed
    and what else was placed in the same directory. A backup application's document root should hold only vendor-shipped
    content, so any recently written .jsp, .war, or .class file there is worth extracting and reading. Operators
    frequently write several files so that removing one does not remove access. The web root location varies with the
    hosting environment, so the query covers servlet container, IIS, and Apache document roots rather than one path.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_webroot:
        TargetFilename|contains:
          - '\webapps\'
          - '\inetpub\wwwroot\'
          - '\htdocs\'
      condition: selection and selection_webroot
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
  answer_sources:
  - file_event
- question: Did a web server process on this host spawn a command shell or script interpreter?
  context: A JSP runs inside the servlet container, so anything it executes appears as a child of the web server process,
    not of the utility that wrote the file. A java, tomcat, httpd, apache, php-cgi, or w3wp parent spawning cmd.exe,
    powershell.exe, or a scripting host is the execution half of this pattern and is the evidence that the file was not
    only written but used. Server wrappers and renamed container binaries differ between deployments, so if the results
    are empty confirm which binary actually hosts the container here before concluding nothing ran.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_server_parent:
        ParentImage|endswith:
          - '\java.exe'
          - '\javaw.exe'
          - '\tomcat.exe'
          - '\tomcat9.exe'
          - '\httpd.exe'
          - '\apache.exe'
          - '\php-cgi.exe'
          - '\w3wp.exe'
      selection_shell:
        Image|endswith:
          - '\cmd.exe'
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\wscript.exe'
          - '\cscript.exe'
          - '\net.exe'
          - '\whoami.exe'
      condition: selection and selection_server_parent and selection_shell
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Which accounts logged on to this server in the hour before the write, and were any of them explicit-credential logons?
  context: The write is a post-authentication step, so a session or API token existed before the command ran. Logon
    records on the application server show which account was used and whether credentials were presented explicitly
    rather than reused from an existing session. A local administrator name that matches no directory account, or a
    logon originating from the web tier moments before the command, points at an authentication that was forged or
    injected rather than an operator working at a console. If the Security channel is not collected from this host,
    treat an empty result as a visibility gap rather than as evidence that no logon occurred.
  range: -1h
  query: |
    aggregation: true
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4624
          - 4648
      condition: selection
    fields:
      - TargetUserName
      - LogonType
  answer_sources:
  - active_directory
  - manual_review
- question: When this host has produced this qoperation write pattern before, what parents and users drove it, and does
    the current alert fit that history?
  context: The query mirrors the rule's selection scoped to this host, so the parent and user distribution it returns
    reflects how this specific command pattern has run here rather than how the utility is used generally. On a healthy
    Commvault server the expected count is zero. A non-zero history means either an earlier attempt or a local workflow
    nobody documented, and either way the parent and account that drove those prior events are what the current alert
    should be compared against.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - qoperation
        - exec
        - ' -af '
        - '.xml '
        - \Apache\webapps\ROOT\
        - .jsp
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- always_include: true
  question: Has this account produced this qoperation write pattern before, and does that history fit its role?
  context: The query mirrors the rule's selection scoped to this account, aggregated by host, so the result is the
    account's 90-day history of this exact command pattern rather than its general use of the utility. An account with
    no prior history here is a different situation from one that produces this pattern routinely. Weigh the count
    against what the account is provisioned to do, and note that the alerting identity may be a service principal whose
    name attributes nothing about who initiated the action.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - qoperation
        - exec
        - ' -af '
        - '.xml '
        - \Apache\webapps\ROOT\
        - .jsp
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this parent process driven this pattern before on this host or elsewhere, or is the parent new for this activity?
  context: 'When the command runs under a service principal, the account name attributes nothing; the launch mechanism
    does. The query mirrors the rule''s selection scoped to the alerting parent process across 90 days, so the result is
    the history of this specific launcher producing this specific pattern. A parent that already accounts for a large
    volume of prior events is product or platform automation; a parent that has never produced this pattern before is
    the deviation to chase.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - qoperation
        - exec
        - ' -af '
        - '.xml '
        - \Apache\webapps\ROOT\
        - .jsp
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this account do across the environment around this time?
  context: Tracking the account's activity on every host in the surrounding hour shows whether the same identity was
    active elsewhere, which separates a single-server issue from movement across the estate. If the alert fired under a
    service or machine account this query returns platform telemetry in volume and the parent-scoped view of the same
    window is the meaningful answer instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did the same parent-driven pattern fire on other hosts in the same window?
  context: 'Under a service principal, asking what the account did across the environment returns platform noise. The
    question that carries information is whether the same launch mechanism produced the same pattern elsewhere: the
    query mirrors the rule''s selection scoped to the alerting parent process, fleet-wide, in the alert window. Several
    hosts in one window points to a scripted or pushed operation; a single host points to a trigger local to this
    server.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - qoperation
        - exec
        - ' -af '
        - '.xml '
        - \Apache\webapps\ROOT\
        - .jsp
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Have other hosts produced this write pattern in the past week, and does the cross-host distribution look like
    automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this command
    pattern drawn from process telemetry rather than from alert records. That makes it a wider net than alert
    correlation, since it also catches hosts where the alert did not persist. Many hosts producing the pattern on a
    schedule points at deployment automation; a handful of application servers over a short window points at an operator
    working through the estate.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - qoperation
        - exec
        - ' -af '
        - '.xml '
        - \Apache\webapps\ROOT\
        - .jsp
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: The write is one step in a longer sequence, and the steps before it often leave their own detections. Earlier
    alerts on this server covering authentication anomalies, unexpected file uploads, or reconnaissance help place the
    write on a timeline and show how far back the activity reaches. An empty result narrows the window that needs manual
    log review rather than closing the question.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    A webshell is one foothold and it is a fragile one, since it disappears when the file is removed or the
    application is upgraded. Backup mechanisms built with scheduled tasks, services, registry Run keys, BITS jobs, or
    WMI subscriptions in the same few hours indicate deliberate stacking rather than an isolated action. The interval
    between the write and any later persistence installation is itself informative — minutes suggests a scripted
    sequence, hours or days suggests hands-on follow-up.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
