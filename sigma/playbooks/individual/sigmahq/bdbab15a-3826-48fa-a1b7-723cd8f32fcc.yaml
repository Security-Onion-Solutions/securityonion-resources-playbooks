name: Potential Goofy Guineapig GoolgeUpdate Process Anomaly
id: a627b1d3-151f-4338-a504-d422c49cc51c
description: |
  Detects GoogleUpdate.exe spawning another instance of GoogleUpdate.exe where the child binary
  lives outside every directory the Google updater installs into — anything not under
  C:\Program Files\Google\, C:\Program Files (x86)\Google\, or \AppData\Local\Google\Update\.
  Both halves must hold together: the self-spawn alone is ordinary updater behavior, and the
  location is what makes it an anomaly. A binary carrying the updater's name running from
  ProgramData, a profile folder, or a temp directory is a name-and-location match against a
  trusted product rather than the product itself; the Goofy Guineapig backdoor uses exactly this
  arrangement, pairing a legitimately signed GoogleUpdate.exe with a malicious Goopdate.dll
  side-load, relocating the pair to a hidden ProgramData directory and relaunching from there.
  Establish where the child binary lives, which process wrote it there, what started the parent,
  and whether the relaunched process makes outbound connections or is held in place by a service
  or rundll32-based launcher.
type: detection
detection_id: bdbab15a-3826-48fa-a1b7-723cd8f32fcc
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the alert show GoogleUpdate.exe spawning another GoogleUpdate.exe from a directory
    outside the Google install and update paths?
  context: Confirm the alert before investing time. The rule requires both halves together — parent
    and child both named GoogleUpdate.exe, and the child's path outside C:\Program Files\Google\,
    C:\Program Files (x86)\Google\, and \AppData\Local\Google\Update\. Read the child's full path
    first; it is the discriminator and it drives every other step.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
  answer_sources:
  - alert
  - process_creation
- question: Is this host expected to run Google software, and is this user's context consistent with
    an updater relaunching itself?
  context: The Google updater runs on hosts where Chrome or another Google product is installed, and
    it normally runs under the user who owns the installation or under a machine context for the
    machine-wide service. A host with no Google software installed, or an account with no
    relationship to a browser installation, removes the ordinary explanation for the binary being
    present at all.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What started the GoogleUpdate.exe parent, and does its own path and command line look
    like the installed updater?
  context: The parent's own creation event names the grandparent and both command lines. A parent
    launched by services.exe or a scheduled task from a Google install directory is the product's
    normal relaunch. A parent launched by cmd.exe, rundll32.exe, an installer stub, or a script host
    — or a parent whose own path is already outside the Google directories — means the chain was
    established by something other than the product, and the investigation moves upward from there.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other processes did this same GoogleUpdate.exe parent instance spawn?
  context: The updater relaunching itself spawns little else. Side-loaded code hosted inside a
    process that carries the updater's name inherits its identity and spawns from it, so siblings
    are where the rest of the operation shows. Command interpreters running a batch script, copy or
    delete commands against the binary's own directory, and hollowed system binaries such as
    dllhost.exe are the pattern to look for.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What command lines did GoogleUpdate.exe run with on this host around the alert, and which
    working directories did they run from?
  context: The updater's own invocations carry documented switches such as /c, /svc, /medsvc, and
    /handoff. An invocation with no arguments, with arguments the product does not use, or running
    with a working directory in ProgramData or a profile folder points at a binary that only shares
    the name. Comparing the alerting invocation against the other updater executions in the same
    window separates the two.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: Which process wrote a GoogleUpdate.exe file to this host, and into which directory?
  context: The file-write event names the process that placed the binary and the directory it landed
    in, which is the origin of the copy now executing. A write by the Google installer into a Google
    directory is the product installing itself. A write by an archive utility, a browser, an
    installer stub, a script host, or a command interpreter into ProgramData or a user-writable path
    identifies the delivery step, and the same directory usually holds the side-loaded DLL and any
    configuration blob dropped alongside it.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: \GoogleUpdate.exe
      condition: selection
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
  answer_sources:
  - file_event
  - process_creation
- question: In the hours after the alert, what else did GoogleUpdate.exe instances on this host
    launch?
  context: Widening past the single parent instance to every updater process on the host catches the
    relaunched copy, which is a different process from the one that fired the alert. Code that
    relocates itself typically deletes the original, restarts from the new directory, and only then
    begins its real work, so the interesting children often belong to the second instance rather
    than the first.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Did the GoogleUpdate.exe running from this path open outbound connections, and to which
    addresses and ports?
  context: The genuine updater contacts Google's update infrastructure over standard web ports.
    Connections from a copy running outside the product's directories — particularly repeated
    contact with a single external address, contact on a non-standard port such as 4443, or plain
    TCP or UDP traffic to a host that never resolves through normal name lookup — indicate the
    process is hosting a channel rather than checking for updates. Collect the destination address
    for reputation review and for pivoting to other hosts talking to it.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
  - external_threat_intel
- question: Has rundll32.exe launched anything through url.dll on this host?
  context: Calling FileProtocolHandler in url.dll through rundll32.exe hands a path or URL to the
    shell to open, which starts a program without the launching command naming it as a child of a
    recognizable loader. It is a documented living-off-the-land path and is the mechanism the
    relocated updater pattern uses to survive reboot — a service whose image path chains a command
    interpreter into rundll32 into the relocated binary. A hit here identifies the persistence entry
    that needs removing, and the command line names the target path.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \rundll32.exe
        CommandLine|contains: url.dll
      condition: selection
    fields:
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: Aggregating parent-child pairs on the host collapses routine agent and service telemetry
    into a few high-count rows while novel pairings stand out at low counts. Scan for an installer or
    archive utility running shortly before, for command interpreters running batch files, and for
    service-control or scheduled-task activity in the same window.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Which directories has GoogleUpdate.exe run from on this host over the past 90 days, and
    under which accounts?
  context: On a host with Google software installed the updater has a long history, and that history
    is confined to the product's own directories. Grouping the 90 days of executions by path shows
    whether the alerting directory has ever hosted this binary before or appeared for the first time
    now, and the account column shows whether the historical executions ran under the machine-wide
    service or the installing user.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \GoogleUpdate.exe
      condition: selection
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: Has this exact executable path been launched by a GoogleUpdate.exe parent on this host
    before, and with what command lines?
  context: This narrows the history to the specific binary path the alert fired on, launched by the
    updater. A count of zero means the path is new to this host and the self-spawn to it has no
    precedent. An established history with consistent command lines points to software that has been
    behaving this way for months, which shifts the question toward what installed it in that
    location.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their
    role?
  context: The query mirrors the rule's selection scoped to this user, so the result is their 90-day
    history of updater self-spawns from non-product directories rather than generic use of the
    binary, aggregated by host. A user who has never produced it is a different case from one who
    produces it routinely; weigh the count against whether the account belongs to a person, a
    machine, or a software-deployment context.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        ParentImage|endswith: \GoogleUpdate.exe
        Image|endswith: \GoogleUpdate.exe
      filter_main_legit_paths:
      - Image|startswith:
        - C:\Program Files\Google\
        - C:\Program Files (x86)\Google\
      - Image|contains: \AppData\Local\Google\Update\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a machine account or service context, user identity does not
    attribute the behavior; the launch mechanism does. The query mirrors the rule''s selection scoped
    to the alerting parent, giving the 90-day history of that parent driving this pattern. A new or
    rare parent is the deviation worth chasing; a parent already accounting for a large prior count
    across many hosts points at a packaging or deployment practice that relocates the updater
    deliberately.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        ParentImage|endswith: \GoogleUpdate.exe
        Image|endswith: \GoogleUpdate.exe
      filter_main_legit_paths:
      - Image|startswith:
        - C:\Program Files\Google\
        - C:\Program Files (x86)\Google\
      - Image|contains: \AppData\Local\Google\Update\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user do across the environment around this time?
  context: Tracking the account's activity across all hosts in the alert window shows whether the
    same identity was active elsewhere. A trojanised installer distributed to several people lands
    on each of their machines independently, so the same account producing execution on more than
    one host widens what needs to be examined.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same parent-driven pattern fire on other hosts in the same window, or is the
    activity isolated to this host?
  context: Under a machine account or service context, asking what else the user did returns agent
    telemetry from every host. The meaningful pivot is the launch mechanism — the query mirrors the
    rule's selection scoped to the alerting parent, environment-wide, in the alert window. Multiple
    hosts in the same window points to pushed or scheduled automation; a single host points to a
    host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        ParentImage|endswith: \GoogleUpdate.exe
        Image|endswith: \GoogleUpdate.exe
      filter_main_legit_paths:
      - Image|startswith:
        - C:\Program Files\Google\
        - C:\Program Files (x86)\Google\
      - Image|contains: \AppData\Local\Google\Update\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Are other hosts running a GoogleUpdate.exe from this same path, launched by another
    GoogleUpdate.exe?
  context: The query drops the host scope and keeps the exact child path and the updater parent, so
    a hit means another machine holds a copy of the binary in the same non-product directory. A
    handful of unrelated hosts points to the same delivery reaching several people; a large,
    uniform set points to a deployment practice that places the updater outside its normal
    directories. Either answer sets the boundary of what has to be examined.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host may show the stages that preceded this execution — a
    download or archive being opened, an installer stub running, a service being created, or a
    command interpreter deleting files. The ordering of alerts reconstructs the timeline and shows
    how far back the activity started.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
