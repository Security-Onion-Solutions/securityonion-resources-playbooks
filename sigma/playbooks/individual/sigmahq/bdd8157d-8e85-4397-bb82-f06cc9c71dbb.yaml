name: UAC Bypass Using IEInstal - File
id: cc872715-d94e-40b1-a903-93d016aeb05d
description: |
  Detects the auto-elevated binary IEInstal.exe writing a file named consent.exe into a
  user profile's AppData\Local\Temp directory, the artifact signature of a User Account
  Control bypass (UACMe method 64). The legitimate consent.exe lives in System32; a copy
  planted in a user-writable Temp path is executed at high integrity to run an
  attacker-chosen command without a consent prompt. The fire is a single file-write event
  matching the responsible process and the target path together, so first confirm the drop
  is the bypass artifact rather than a benign temp file, then determine how IEInstal.exe was
  launched, whether the planted binary executed, and what ran with elevated privileges
  afterward.
type: detection
detection_id: bdd8157d-8e85-4397-bb82-f06cc9c71dbb
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the dropped file path and the writing process match what this rule detects?
  context: Before investing investigation time, confirm this is a true positive by reviewing
    the exact target path and the responsible process. The rule fires only when
    IEInstal.exe writes a file ending in consent.exe beneath a user's
    AppData\Local\Temp directory, so verify both the writer and the path against the
    triggering event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to produce a consent.exe copy under a user Temp
    directory?
  context: Legitimate activity almost never writes a consent.exe into a user-writable Temp
    path; the real binary is a protected System32 component. Knowing whether the acting
    user and host role are consistent with the observed write is often the fastest way to
    separate a genuine bypass from an unusual but benign event. When the writer is a
    machine or service account, judge by the responsible process and host function instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the dropped consent.exe the legitimate Windows binary or an attacker-planted
    payload?
  context: The genuine consent.exe ships in System32 and is Microsoft-signed; a copy staged
    in a user Temp path is what the bypass executes at high integrity. Retrieve the file and
    examine its size, signature, and strings, and compare it against the known-good System32
    binary to determine whether it is a relocated legitimate file, a renamed tool, or a
    distinct payload.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What launched IEInstal.exe, and is that parent chain expected?
  context: IEInstal.exe is auto-elevated, so the bypass depends on getting it to run and
    perform the write. Pivoting to the writer's own creation event reveals its parent and
    command line. A launch from explorer.exe or a normal installer flow differs sharply from
    one under a script host, a signed-but-repurposed launcher, or an unfamiliar operator
    tool.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
- question: If the planted consent.exe executed, what is its hash and does it have known
    threat intel detections?
  context: A file's hash is recorded when it runs, not when it is written, so this query
    looks for a consent.exe executing on the host and reads its hash. Submit that hash to
    reputation and threat intel sources to determine whether it is known malicious, benign,
    or previously unseen; the responsible Image path distinguishes the Temp-resident copy
    from the legitimate System32 binary. If the planted file is present but has not executed,
    retrieve it from its on-disk path and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
- question: Is the planted consent.exe still on disk, or was it deleted or renamed after the
    alert?
  context: The file's post-alert lifecycle drives both urgency and next steps. A payload
    still on disk can be retrieved, hashed, and analyzed; a copy deleted seconds after
    creation suggests anti-forensic cleanup or a self-removing bypass helper and shifts the
    focus to what executed in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Were registry modifications made to set up a UAC bypass around this event?
  context: Operators frequently attempt several UAC-bypass methods until one succeeds, and
    many rely on registry key manipulation rather than a file drop. Common targets include
    HKCU\Software\Classes\ms-settings\Shell\Open\command,
    HKCU\Software\Classes\mscfile\shell, and HKCU\Environment. A registry-based bypass firing
    close to this file-based one points to deliberate, multi-method escalation rather than a
    benign temp file.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\reg.exe'
          - '\powershell.exe'
          - '\cmd.exe'
        CommandLine|contains:
          - 'ms-settings'
          - 'mscfile'
          - 'Classes\exefile'
          - 'Classes\Folder'
          - 'Environment'
          - 'Shell\Open\command'
          - 'DelegateExecute'
      condition: selection
    fields:
      - CommandLine
      - Image
- question: What action was performed with elevated privileges after the bypass?
  context: A UAC bypass is a means to an end; the planted consent.exe runs at high integrity
    to carry out actions that require it, such as installing persistence, dumping
    credentials, tampering with security tooling, or reaching protected resources. Processes
    running at High or System integrity on this host shortly after the drop reveal the
    objective. Correlating the registry-setup window and this elevation window within a
    short interval reduces noise from routine administrative elevation.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: What other files did the responsible process write or delete around the alert?
  context: A process that stages one bypass artifact often writes several -- a helper
    unpacking components, a launcher dropping its payload, or cleanup deleting evidence. The
    breadth, paths, and extensions of IEInstal.exe's other file activity distinguish an
    isolated drop from a broader staging operation and enumerate what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to this user's Temp directory recently, and by which
    processes?
  context: The AppData\Local\Temp path is user-writable and a common staging location, but a
    small set of processes legitimately write there. Other recent arrivals in the same
    directory reveal whether this is an isolated drop or a location under active use, and
    which other artifacts belong to the same activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\AppData\Local\Temp\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: When this host has previously produced this write pattern, what programs and users
    drove it, and does the current alert fit?
  context: Even a benign-looking path can carry a bypass artifact. The query mirrors the
    rule's selection scoped to this host, so the resulting program and user distribution
    reflects how this specific drop pattern has historically run here. Expect the Image
    column to show IEInstal.exe itself; an unexpected user account or a first-ever
    occurrence is the anomaly worth chasing. File events carry no parent lineage - pivot
    to IEInstal.exe's start event if you need its launch mechanism.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image: C:\Program Files\Internet Explorer\IEInstal.exe
        TargetFilename|startswith: C:\Users\
        TargetFilename|contains: \AppData\Local\Temp\
        TargetFilename|endswith: consent.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- always_include: true
  question: Has this user previously produced this write pattern, and does that history fit
    their role?
  context: The query mirrors the rule's selection scoped to this user, so the result is the
    user's 90-day history of this specific drop pattern aggregated by host. A user who has
    never produced this pattern is more notable than one who does so regularly; weigh the
    count against the user's role and typical duties.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image: C:\Program Files\Internet Explorer\IEInstal.exe
        TargetFilename|startswith: C:\Users\
        TargetFilename|contains: \AppData\Local\Temp\
        TargetFilename|endswith: consent.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this write pattern here or across the
    environment, or is the program new for this activity?
  context: When the alert fires under a service principal, user identity does not attribute
    behavior; the meaningful pivot is the launch mechanism. The query mirrors the rule's
    selection scoped to the alerting program, so the result is the 90-day history of
    this program driving this specific pattern. A new or rare program is the deviation worth
    chasing; a program already accounting for many prior events is more likely vendor or OS
    automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image: C:\Program Files\Internet Explorer\IEInstal.exe
        TargetFilename|startswith: C:\Users\
        TargetFilename|contains: \AppData\Local\Temp\
        TargetFilename|endswith: consent.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or parallel
    activity on multiple endpoints. If the same user triggered similar elevation or staging
    activity elsewhere, the scope of the incident may be larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven write pattern fire on other hosts in the same window,
    or is it isolated to this host?
  context: Under a service principal, tracking user activity across the network returns
    agent-telemetry noise. The meaningful question is whether the same launch mechanism fired
    elsewhere; the query mirrors the rule's selection scoped to the alerting program,
    fleet-wide, in the alert window. Multiple hosts in the same window points to scheduled or
    pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image: C:\Program Files\Internet Explorer\IEInstal.exe
        TargetFilename|startswith: C:\Users\
        TargetFilename|contains: \AppData\Local\Temp\
        TargetFilename|endswith: consent.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the process activity around the drop
    reveals what led to it and what happened after, and whether it belongs to a larger
    sequence such as reconnaissance, privilege escalation, or persistence installation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts produced this write pattern in the past week, and does the
    cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a
    fleet-wide count of this specific drop pattern rather than generic use of the binary.
    Many hosts producing the same pattern points to scripted deployment or vendor
    automation; one host or a small unrelated set points to manual operator activity. Use the
    host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image: C:\Program Files\Internet Explorer\IEInstal.exe
        TargetFilename|startswith: C:\Users\
        TargetFilename|contains: \AppData\Local\Temp\
        TargetFilename|endswith: consent.exe
      condition: selection
    fields:
    - host.name
- question: Were other privilege escalation techniques attempted on this host?
  context: Attackers who attempt one UAC bypass often try multiple methods until one succeeds,
    especially when the OS version or configuration blocks certain techniques. Other
    privilege-escalation or defense-tampering detections on this host, before or after this
    event, confirm deliberate escalation activity rather than a false positive and help
    reconstruct the timeline.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
