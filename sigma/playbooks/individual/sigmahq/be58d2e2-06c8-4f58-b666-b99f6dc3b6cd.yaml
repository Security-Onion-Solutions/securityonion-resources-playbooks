name: Suspicious Process Masquerading As SvcHost.EXE
id: 9e063b38-caa4-42f1-90a6-53612b4129a2
description: |
  Detects a process whose image filename ends in svchost.exe but does not run from the canonical
  system locations (C:\Windows\System32 or C:\Windows\SysWOW64) and whose PE OriginalFileName is not
  svchost.exe. Legitimate svchost.exe is always launched by services.exe from one of those two paths
  with a "-k <ServiceGroup>" argument; a binary named svchost.exe running from anywhere else, or with
  metadata that does not match, is masquerading. Investigation should confirm the name/location/metadata
  mismatch, recover the binary's true identity from its OriginalFileName and hash, trace how it arrived
  on the host, and determine what it did after execution and whether the same binary is present elsewhere.
type: detection
detection_id: be58d2e2-06c8-4f58-b666-b99f6dc3b6cd
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Is the alerting process named svchost.exe running from a non-system path with metadata that does not match svchost.exe?
  context: >-
    Confirm the alert is a true positive before investing investigation time. The rule fires when an
    image ending in svchost.exe runs AND it is not located at C:\Windows\System32\svchost.exe or
    C:\Windows\SysWOW64\svchost.exe AND its OriginalFileName is not svchost.exe. Review the full Image
    path and metadata against those criteria; legitimate svchost runs only from those two paths and is
    launched by services.exe with a "-k" argument.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is this user and host expected to run a binary named svchost.exe from a non-system location?
  context: >-
    Legitimate svchost.exe never runs outside the System32 or SysWOW64 directories, so there is rarely
    a benign administrative reason for a same-named binary elsewhere. Knowing whether the host function
    and the executing account are consistent with developer, packaging, or installer activity that might
    drop a like-named file helps separate a misconfiguration from a planted payload.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the actual identity of this binary based on its OriginalFileName, signature, and hash?
  context: >-
    A renamed binary keeps the PE metadata of the original tool. Compare the Image path (the name on
    disk, svchost.exe) against OriginalFileName (embedded metadata) to expose the mismatch the rule fired
    on. The signing party and signature status indicate whether this is a Microsoft-signed binary running
    under a borrowed name, a third-party signed tool, or unsigned. Submit the hash for reputation lookup
    to determine whether this is a known-good tool, a known malware sample, or a novel binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: What did this svchost.exe-named binary actually do? Decode its full command line.
  context: >-
    Legitimate svchost.exe always carries a "-k <ServiceGroup>" argument. Decode the command line of the
    masquerading binary for flags, encoded content, file paths, or URLs that reveal its operational
    purpose. The absence of a "-k" service group, or the presence of arbitrary arguments, distinguishes
    the planted binary from the system process it imitates. This scopes to executions of this image on
    the host within a few minutes of the alert.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: How did this svchost.exe-named binary arrive on the host?
  context: >-
    A binary named svchost.exe living outside the system directories did not appear on its own; it was
    copied, downloaded, or dropped by another process. Tracing the file-creation event for the binary by
    basename over a long window reveals the delivery mechanism and the process that wrote it. A user-writable
    landing directory (Desktop, Downloads, Temp, AppData) points to download or extraction; the Image field
    on the file_event identifies the dropper, installer, or copy operation.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What did this binary spawn after execution, and is the same renamed binary present on other hosts?
  context: >-
    The point of naming a payload svchost.exe is to perform its function while blending in. Examining the
    child processes launched by the binary reveals its actual objective, such as reconnaissance, credential
    access, or further staging. A same-named binary with matching metadata or hash appearing on multiple
    hosts suggests deliberate distribution rather than an isolated drop.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What process spawned this binary, and is that parent chain expected for svchost.exe?
  context: >-
    Genuine svchost.exe is always launched by services.exe. Any other parent for a binary named svchost.exe
    is itself an anomaly. The parent process reveals how the binary was invoked; user-shell parents
    (explorer.exe, cmd.exe), script hosts (wscript.exe, mshta.exe), or Office applications point to manual
    operator activity or a malicious launch rather than service-control-manager startup.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Has this host previously run a binary named svchost.exe from this path?
  context: >-
    A binary that has never been seen on a host is more suspicious than one that runs regularly. Zero or
    very low historical counts for a non-system svchost.exe indicate first-time or rare execution, which
    raises the priority of the alert.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this masquerading pattern, what parents and users normally drive it, and does the current alert fit?
  context: >-
    Even recurring patterns can be abused. The query mirrors the rule's selection (an image ending in
    svchost.exe, excluding the system paths and matching OriginalFileName) scoped to this host, so the
    resulting parent and user distribution reflects how this specific firing pattern has run here. A new
    parent process, an unexpected account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \svchost.exe
      filter_main_img_location:
        Image:
        - C:\Windows\System32\svchost.exe
        - C:\Windows\SysWOW64\svchost.exe
      filter_main_ofn:
        OriginalFileName: svchost.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this masquerading pattern in the past week, and does the cross-host spread look like automation or isolated activity?
  context: >-
    The query mirrors the rule's selection with no host scope, returning a fleet-wide count of this
    masquerading pattern rather than generic svchost activity. Many hosts firing the same pattern can
    indicate a misnamed file packaged into a deployment or a widely pushed payload; a single host or a
    small unrelated set points to host-local or manual activity. Use the host distribution to calibrate
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \svchost.exe
      filter_main_img_location:
        Image:
        - C:\Windows\System32\svchost.exe
        - C:\Windows\SysWOW64\svchost.exe
      filter_main_ofn:
        OriginalFileName: svchost.exe
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \svchost.exe
      filter_main_img_location:
        Image:
        - C:\Windows\System32\svchost.exe
        - C:\Windows\SysWOW64\svchost.exe
      filter_main_ofn:
        OriginalFileName: svchost.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \svchost.exe
      filter_main_img_location:
        Image:
        - C:\Windows\System32\svchost.exe
        - C:\Windows\SysWOW64\svchost.exe
      filter_main_ofn:
        OriginalFileName: svchost.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or coordinated activity on
    multiple endpoints. If the same account triggered similar activity elsewhere, the scope of the
    incident may be larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \svchost.exe
      filter_main_img_location:
        Image:
        - C:\Windows\System32\svchost.exe
        - C:\Windows\SysWOW64\svchost.exe
      filter_main_ofn:
        OriginalFileName: svchost.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining the process activity around the alert reveals what led to
    this event and what happened after, and whether it is part of a larger sequence. Look for
    reconnaissance, privilege escalation, persistence installation, or data staging that surrounds the
    masquerading execution.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, credential access — may
    reveal the attack stages that preceded the masquerading execution and help reconstruct the timeline.
    The sequence of alerts on a host often tells the story leading up to a planted binary running.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
