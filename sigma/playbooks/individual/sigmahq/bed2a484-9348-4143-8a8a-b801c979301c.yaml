name: Webshell Detection With Command Line Keywords
id: 51555593-948d-48fd-9689-83feb57bb3fc
description: |
  Detects a web server process (w3wp.exe, php-cgi.exe, nginx.exe, httpd.exe, caddy.exe, or a Tomcat/Java host) spawning a child process that runs reconnaissance or execution commands commonly issued through a web shell. The rule fires when EITHER a recognized web server parent is present OR a Tomcat/Java parent with web server characteristics is present, AND EITHER one of several suspicious child patterns runs: net user/use/group, ping -n, wmic /node, an encoded or hidden PowerShell command, a download cradle, a discovery binary (whoami, ipconfig, net, dsquery, systeminfo, and similar), or directory-traversal command syntax. A web server process launching command interpreters or discovery utilities is a hallmark of web shell command execution; legitimate web applications rarely shell out to these tools. Determine what command ran, whether the parent web server was actually compromised, and whether the activity is isolated reconnaissance or the start of hands-on enumeration and lateral movement.
type: detection
detection_id: bed2a484-9348-4143-8a8a-b801c979301c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does this event match the rule - a web server parent spawning a suspicious discovery or execution command?
  context: >-
    Confirm the alert before investing time. The rule fires when EITHER a recognized web server binary (w3wp.exe, php-cgi.exe,
    nginx.exe, httpd.exe, caddy.exe) OR a Tomcat/Java host is the parent, AND EITHER the child runs one of the suspicious
    patterns - net user/use/group, ping -n, wmic /node, encoded or hidden PowerShell, a WebClient download cradle, a discovery
    binary, or cd-traversal syntax. Note which web server branch and which child branch fired; the branch that matched
    determines which downstream questions carry the most weight.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this web server process expected to spawn this child, and what started the web server itself?
  context: >-
    The web server-to-child relationship is the core signal. A web application that shells out to a command interpreter or
    discovery utility is the behavior a web shell produces. Trace the parent web server process back to its own origin to
    confirm it is a normal service start rather than a process that was itself launched through an unusual chain.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What web request or web shell file triggered this execution?
  context: >-
    Command execution under a web server process usually originates from a web request handled by a deployed web shell. Check
    web server access logs for the request that lines up with the alert timestamp - the URL, method, source address, and any
    suspicious file under the web root. Identifying the request enables blocking at the perimeter and locating the dropped
    web shell on disk.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Was the command encoded or obfuscated, and what does it decode to?
  context: >-
    The rule matches -enc, -EncodedCommand, hidden-window flags, and WebClient download cradles - all common ways a web shell
    hides what it runs. Base64-encoded PowerShell is the most frequent form. Decoding reveals the actual payload, such as a
    download cradle, reverse shell, or in-memory .NET loader. For web shell parameter values, decode the suspicious request
    content the rule fired on.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What other child processes did this same web server parent spawn?
  context: >-
    A web shell typically issues a series of commands through the same web server process. Examining the other children of
    this exact parent instance reveals the full scope of activity - chained reconnaissance, file operations, or lateral
    movement tools launched from the same foothold rather than a single isolated command.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this web server parent historically spawned this child binary on this host?
  context: >-
    Some web application stacks legitimately invoke helper processes, but a web server spawning a command interpreter or
    discovery utility is rarely routine. A zero or very low historical count for this specific parent-and-child pairing
    points to a novel spawning relationship introduced by a web shell rather than normal application behavior. Tune for the
    specific web root and hosting environment - custom directories and third-party server binaries shift what counts as normal.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: Did other reconnaissance commands run on this host around the same time?
  context: >-
    A single discovery command may be troubleshooting, but several in rapid succession - whoami, ipconfig, net user, nltest,
    systeminfo - is the signature of post-compromise enumeration through a web shell. Three or more distinct recon binaries
    within a short window typically indicates automated reconnaissance run after the initial foothold. The triggering binary
    is excluded so this surfaces additional discovery activity.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\tracert.exe'
          - '\pathping.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: Is the account that ran this command expected to perform administrative discovery on this host?
  context: >-
    Network administrators and IT staff legitimately run discovery commands for troubleshooting, but a web server worker
    process normally executes under a low-privilege service account that has no reason to enumerate users, groups, or remote
    systems. An enumeration command running under a web server service account is a strong sign the activity came through a
    web shell rather than an interactive admin.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: Did the host the alert fired on initiate outbound or internal connections consistent with remote system enumeration or lateral movement?
  context: >-
    Web shell reconnaissance commonly chains into reaching out to other systems - pinging or resolving internal hosts,
    enumerating shares, or connecting to discovered targets. Outbound or internal connections from the alerting host around
    the time of the discovery commands help distinguish local fact-gathering from active movement toward other systems. A
    burst of new internal destinations alongside the enumeration commands raises the priority.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_webserver_image:
        ParentImage|endswith:
        - \w3wp.exe
        - \php-cgi.exe
        - \nginx.exe
        - \httpd.exe
        - \caddy.exe
        - \ws_tomcatservice.exe
      selection_webserver_characteristics_tomcat1:
        ParentImage|endswith:
        - \java.exe
        - \javaw.exe
        ParentImage|contains:
        - -tomcat-
        - \tomcat
      selection_webserver_characteristics_tomcat2:
        ParentImage|endswith:
        - \java.exe
        - \javaw.exe
        CommandLine|contains:
        - catalina.jar
        - CATALINA_HOME
      selection_susp_net_utility:
        OriginalFileName:
        - net.exe
        - net1.exe
        CommandLine|contains:
        - ' user '
        - ' use '
        - ' group '
      selection_susp_ping_utility:
        OriginalFileName: ping.exe
        CommandLine|contains: ' -n '
      selection_susp_change_dir:
        CommandLine|contains:
        - '&cd&echo'
        - 'cd /d '
      selection_susp_wmic_utility:
        OriginalFileName: wmic.exe
        CommandLine|contains: ' /node:'
      selection_susp_powershell_cli:
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
        CommandLine|contains:
        - ' -enc '
        - ' -EncodedCommand '
        - ' -w hidden '
        - ' -windowstyle hidden'
        - .WebClient).Download
      selection_susp_misc_discovery_binaries:
      - Image|endswith:
        - \dsquery.exe
        - \find.exe
        - \findstr.exe
        - \ipconfig.exe
        - \netstat.exe
        - \nslookup.exe
        - \pathping.exe
        - \quser.exe
        - \schtasks.exe
        - \systeminfo.exe
        - \tasklist.exe
        - \tracert.exe
        - \ver.exe
        - \wevtutil.exe
        - \whoami.exe
      - OriginalFileName:
        - dsquery.exe
        - find.exe
        - findstr.exe
        - ipconfig.exe
        - netstat.exe
        - nslookup.exe
        - pathping.exe
        - quser.exe
        - schtasks.exe
        - sysinfo.exe
        - tasklist.exe
        - tracert.exe
        - ver.exe
        - VSSADMIN.EXE
        - wevtutil.exe
        - whoami.exe
      selection_susp_misc_discovery_commands:
        CommandLine|contains:
        - ' Test-NetConnection '
        - dir \
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_webserver_* and 1 of selection_susp_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_webserver_image:
        ParentImage|endswith:
        - \w3wp.exe
        - \php-cgi.exe
        - \nginx.exe
        - \httpd.exe
