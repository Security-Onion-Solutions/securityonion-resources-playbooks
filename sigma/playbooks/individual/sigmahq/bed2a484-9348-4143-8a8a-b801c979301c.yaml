- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining activity around the alert reveals what led to this event and what followed -
    additional reconnaissance, file drops, privilege escalation, or persistence. Aggregating by process and parent collapses
    routine telemetry into high-count rows while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - exploitation attempts against the web application, file writes to the web root, or
    prior reconnaissance - may reveal the stages that preceded this command execution and help reconstruct how the web shell
    was planted. The alert timeline tells the attack story.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other web servers targeted by the same activity?
  context: >-
    Exploitation of internet-facing web applications rarely targets a single server. Correlating the same rule across all
    hosts reveals how many web servers show the same web shell command execution pattern and identifies additional
    compromised systems that need investigation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Were there authentication or logon events on this host consistent with the web shell account being used for access?
  context: >-
    Web shell command execution under a server service account, and any lateral movement it drives, leaves authentication
    traces. Logon and explicit-credential events on this host around the alert window help establish which account context
    the commands ran under and whether the same account authenticated to other systems. If authentication logs are not
    ingested in this environment, treat zero results as a visibility gap rather than evidence nothing occurred.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: authentication
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - LogonType
      - SourceNetworkAddress
