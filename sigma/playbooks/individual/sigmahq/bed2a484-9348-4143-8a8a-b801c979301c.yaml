- question: What else did this account do across the network around this time?
  context: >-
    Tracking the account's activity across all hosts reveals whether the reconnaissance is confined to this server or spread
    across multiple endpoints. The same account driving similar activity on several hosts widens the scope of compromise.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
