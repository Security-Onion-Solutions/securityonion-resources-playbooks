        - ' -enc '
        - ' -EncodedCommand '
        - ' -w hidden '
        - ' -windowstyle hidden'
        - .WebClient).Download
      selection_susp_misc_discovery_binaries:
      - Image|endswith:
        - \dsquery.exe
        - \find.exe
        - \findstr.exe
        - \ipconfig.exe
        - \netstat.exe
        - \nslookup.exe
        - \pathping.exe
        - \quser.exe
        - \schtasks.exe
        - \systeminfo.exe
        - \tasklist.exe
        - \tracert.exe
        - \ver.exe
        - \wevtutil.exe
        - \whoami.exe
      - OriginalFileName:
        - dsquery.exe
        - find.exe
        - findstr.exe
        - ipconfig.exe
        - netstat.exe
        - nslookup.exe
        - pathping.exe
        - quser.exe
        - schtasks.exe
        - sysinfo.exe
        - tasklist.exe
        - tracert.exe
        - ver.exe
