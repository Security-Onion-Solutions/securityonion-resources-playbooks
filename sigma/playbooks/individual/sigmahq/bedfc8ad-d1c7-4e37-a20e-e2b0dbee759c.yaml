name: HackTool - SharpEvtMute Execution
id: 28ad12f0-5ac8-4888-b803-ef80613092ef
description: |
  Detects execution of SharpEvtMute, a tool that suppresses Windows event logging by injecting an in-process hook into the
  Event Service and applying YARA-style filter rules that drop matching events before they reach Sysmon, Security, Application,
  or System logs. The rule fires when the binary name or product description matches SharpEvtMute, or when the command line
  carries a filter or encoded-filter argument. Because the tool silently drops events at the publisher boundary, the most
  reliable corroboration is a gap or sudden drop in expected event volume on the host; the investigation should determine which
  events the filter targeted, whether the hook is still active, and what activity occurred during the visibility gap.
type: detection
detection_id: bedfc8ad-d1c7-4e37-a20e-e2b0dbee759c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the alerting process match SharpEvtMute by image name, product description, or filter argument?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when the image ends in
    SharpEvtMute.exe, the product Description is SharpEvtMute, or the command line carries a filter or encoded-filter argument.
    Review the exact image, description, and command line against these criteria.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - Description
- question: Is this user and host expected to run an event-logging filter tool?
  context: Legitimate administrative activity rarely involves a tool whose sole purpose is to suppress event logging. Knowing
    whether the user role and host function are consistent with running such a tool is often the fastest path to distinguishing
    a sanctioned security test from unauthorized tampering.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this SharpEvtMute execution part of an authorized penetration test or red team engagement?
  context: Event-suppression tooling is used in authorized adversary-emulation exercises. Before deeper analysis, check whether
    a pentest or red team exercise is active on this host or network segment. An authorized engagement with matching tool usage
    and timing resolves the alert without further work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which SharpEvtMute capability was invoked, and what does the filter argument target?
  context: The tool exposes distinct actions - inject the hook, apply a text or Base64-encoded filter, or query the Event
    Service PID. The command line reveals which capability ran. A filter argument that evaluates true for an event causes that
    event to be dropped; decode the rule body (and any Base64 supplied with an encoded-filter flag) to identify exactly which
    event signatures were being suppressed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What specific event signatures or logging channels did the filter target?
  context: Different filter rules have different impacts. A trivial all-pass-drop filter suppresses everything published, while
    a targeted filter blocks only specific signatures such as process-access events against a sensitive process. Decode the
    filter body in the command line to identify which events would no longer reach the logs - this determines what evidence
    may be missing and where to look for the activity the suppression was meant to hide.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the event-logging hook still active on this host, or has logging been restored?
  context: Suppression may be temporary for a specific action or may persist until the host is rebooted or the hook is removed.
    Filters can be updated dynamically without re-injecting, so a host can remain blind after the original process exits.
    Confirm whether expected event flow has resumed; if it has not, logging should be restored before further investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What activity occurred on this host after the event-logging filter was applied?
  context: Event suppression is applied to enable actions that would otherwise be logged - credential access, payload execution,
    or lateral movement. Examining activity immediately after the filter went in reveals what the suppression was meant to
    hide. A drop in expected event volume followed by process creation in that same window points to the activity the tampering
    enabled.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Did expected event flow drop or fall silent on this host around the time of the alert?
  context: Because the tool drops events at the publisher boundary, the most reliable corroboration is a gap in event volume
    rather than a tampering command. Compare the host's recent security and audit event rate against its normal baseline; a
    sudden silence or sharp drop, especially for the signatures named in the filter, confirms the suppression took effect.
    If audit logging is not collected from this host in this environment, treat the absence of these events as a visibility
    gap rather than evidence nothing happened.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - EventID
      - Channel
- question: Were other defense tampering actions performed on this host?
  context: Operators who suppress logging often disable several controls at once - stopping antivirus, clearing logs, or deleting
    shadow copies to maximize coverage. Finding additional tampering events from the same user or parent process indicates
    multiple controls were targeted in one operation.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Are known SharpEvtMute artifacts present on the host?
  context: The tool leaves characteristic artifacts - the in-process hook DLL loaded into the Event Service, a named control
    pipe whose identifier doubles as an indicator, and the control assembly on disk. Checking for file artifacts written by
    the tool's process confirms execution and reveals scope even after the original process has exited.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process spawned this tool, and is that parent chain expected?
  context: The parent process reveals how the tool was launched. Execution via an interactive shell, a remote-execution utility,
    or a script host points to hands-on-keyboard or framework-driven activity, whereas a routine administrative parent is
    less concerning. Walk up the chain to see what spawned the parent and what else that parent launched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
      - Image|endswith: \SharpEvtMute.exe
      - Description: SharpEvtMute
      - CommandLine|contains:
        - '--Filter "rule '
        - --Encoded --Filter \"
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
      - Image|endswith: \SharpEvtMute.exe
      - Description: SharpEvtMute
      - CommandLine|contains:
        - '--Filter "rule '
        - --Encoded --Filter \"
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated action across multiple endpoints.
    If the same user triggered similar activity on more than one host, the scope of the operation may be larger than the single
    alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
      - Image|endswith: \SharpEvtMute.exe
      - Description: SharpEvtMute
      - CommandLine|contains:
        - '--Filter "rule '
        - --Encoded --Filter \"
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context - what led to
    this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation,
    or persistence mechanisms among the surrounding process activity.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host - reconnaissance, credential access, or other
    defense tampering - may reveal the stages that preceded this event and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were process-based persistence mechanisms installed on this host?
  context: Operators who suppress logging frequently install persistence in the same window so a foothold survives reboot.
    Scheduled tasks, services, registry Run keys, and BITS jobs created from the same timeframe indicate intentional stacking
    rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
