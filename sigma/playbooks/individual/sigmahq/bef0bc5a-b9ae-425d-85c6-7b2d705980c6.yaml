name: Python Initiated Connection
id: 2049d68f-b26c-4df9-89cb-b55793662675
description: |
  Fires when a process whose image path contains 'python' and ends in .exe initiates an outbound
  network connection, excluding loopback traffic and the common package-manager and notebook patterns
  (pip install, conda update, Jupyter notebook). Python routinely opens sockets for legitimate reasons
  such as package installation, developer tooling, and data pipelines, but the same interpreter is also
  used to run port scanners, service-probing scripts, and command-and-control client code. Investigation
  should establish what script and command line drove the connection, what the destination is, and
  whether the host reached many distinct destinations or ports in a short window (a network service
  discovery pattern) versus stable, expected traffic.
type: detection
detection_id: bef0bc5a-b9ae-425d-85c6-7b2d705980c6
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does a python process show an outbound connection to a non-loopback destination that is not a package-manager or notebook pattern?
  context: >-
    The rule fires only when ALL of these hold together: the initiating image path contains 'python' and
    ends in .exe, the connection is outbound (Initiated resolves to egress), the peer is not loopback, and
    the command line is not one of the excluded benign patterns (pip install, conda update, Jupyter
    notebook). Confirm the alert by reviewing the destination IP and port, the direction, and which python
    binary initiated it. Note that this event category mixes network-only sensing with endpoint records, so
    process attribution is present only when the host's endpoint telemetry captured the connection.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - Image
      - Initiated
- question: What is this destination, and what do DNS, WHOIS, and threat intel reveal about it?
  context: >-
    Investigate the destination the python process reached: passive DNS history, registration age,
    TLS certificate details, and known threat intelligence hits. Recently registered domains, self-signed
    certificates, or known command-and-control infrastructure point to attacker-controlled endpoints.
    DestinationHostname is sparsely populated on network-connection events because name resolution is a
    separate lookup, so if it is empty, pivot to the DNS query telemetry for this host on the resolved IP
    to recover the domain and enrich from there.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - DestinationPort
- question: What python script and command line drove this connection?
  context: >-
    CommandLine and ParentImage are not carried on the network-connection event itself, so the intent of
    the connection lives in the process-creation record for the same python instance. Pull the full command
    line and working directory to see the script path, module (-m), inline code (-c), and any target
    host/port arguments. A benign entry looks like a known application script or an interactive session; a
    port-scan or C2 client shows a scanning module, a socket loop, or a script path in a user-writable or
    temporary directory.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: How many distinct destinations and ports did this python process reach in the minutes around the alert?
  context: >-
    Network service discovery shows up as one source touching many destination IPs or many ports on a
    destination within a short window, whereas normal application traffic settles on a small, stable set of
    destination and port pairs. Aggregating this python binary's outbound connections by destination and port
    over a tight window separates sequential probing from routine communication; a common scan threshold is
    on the order of several distinct destinations or ports within roughly sixty seconds. A single stable
    destination with periodic re-connection instead suggests beaconing and should be triaged against the
    destination reputation. Initiated is constrained to egress and the image is scoped to the alerting python
    binary so the count reflects the rule's firing pattern.
  range: +/-10m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
- question: What process spawned the python interpreter, and is this a normal pattern?
  context: >-
    The parent process reveals how python was launched. Legitimate use is typically spawned from a shell,
    an IDE, a scheduler, or a service wrapper. Python spawned by Office applications, script interpreters
    (wscript.exe, cscript.exe, mshta.exe), wmiprvse.exe (WMI remote execution), or wsmprovhost.exe (WinRM
    remote execution) points to automated post-exploitation. This pivots to process-creation telemetry via
    the connection's process identifier, so it resolves only when the endpoint recorded the initiating
    process.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Did other reconnaissance commands run on this host around the same time?
  context: >-
    A single discovery action may be legitimate troubleshooting, but multiple reconnaissance commands in
    rapid succession -- whoami, ipconfig, net user, systeminfo, nltest, nslookup -- is a signature pattern
    of post-compromise enumeration. Python-driven network discovery frequently sits alongside native recon
    binaries as an attacker maps the environment before moving to the next stage. Three or more distinct
    recon binaries within fifteen minutes typically indicates automated enumeration.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: Is this user and host expected to run python scripts that open network connections?
  context: >-
    Developers, data engineers, and IT staff legitimately run python that opens sockets for package
    installation, tooling, and pipelines, and sanctioned scanners (for example Nmap or Nessus equivalents)
    may be operated by security teams from known accounts. Standard users and servers with no development or
    scanning role rarely originate python-driven outbound connections. The user's role and typical baseline
    determine whether the activity is routine or anomalous.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: What child processes did the python interpreter spawn afterward?
  context: >-
    The processes a script launches reveal its actual impact. Discovery-only python usually spawns no
    children, so command interpreters (cmd.exe, powershell.exe), living-off-the-land binaries (certutil.exe,
    bitsadmin.exe), or additional network tools appearing under this python instance point to hands-on-keyboard
    activity or a staged next step rather than a self-contained scan.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally communicate with this destination?
  context: >-
    First-time connections to a destination are more suspicious than routine communication. A historical
    count of this host's connections to the alerting destination distinguishes new attacker infrastructure
    from regular business traffic; zero or very low counts indicate a new or unusual destination. The port
    breakdown shows whether the historical contact was on the same service or a different one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
- question: Does this host normally run this python binary?
  context: >-
    A python interpreter at this path that has never run on the host is more suspicious than one that runs
    regularly for known workloads. Zero or very low historical counts over ninety days indicate first-time
    or rare execution; a busy count on a development or automation host suggests an established, expected
    workload that this connection may belong to.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what programs and users normally drive it, and does the current alert fit?
  context: >-
    Even common tools can be abused. The query mirrors the rule's selection and its benign
    filters, scoped to this host, so the resulting program and user distribution reflects how
    the rule's specific firing pattern (not generic python usage) has historically run here. A
    new acting program process, an unexpected user account, or an unusual invocation is the
    deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
      definition: 'Requirements: Field enrichment is required for the filters to work. As field such as CommandLine and ParentImage are not available by default on this event type'
    detection:
      selection:
        Initiated: 'true'
        Image|contains|all:
        - \python
        - .exe
      filter_optional_conda:
        ParentImage: C:\ProgramData\Anaconda3\Scripts\conda.exe
        CommandLine|contains|all:
        - :\ProgramData\Anaconda3\Scripts\conda-script.py
        - update
      filter_optional_conda_jupyter_notebook:
        ParentImage: C:\ProgramData\Anaconda3\python.exe
        CommandLine|contains: C:\ProgramData\Anaconda3\Scripts\jupyter-notebook-script.py
      filter_main_local_communication:
        DestinationIp: 127.0.0.1
        SourceIp: 127.0.0.1
      filter_main_pip:
        CommandLine|contains|all:
        - pip.exe
        - install
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts fired the rule's pattern in the past week, and does the distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection and benign filters with no host scope, so the result is a
    fleet-wide count of the rule's firing pattern rather than generic python usage. Many hosts firing the same
    pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to
    manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
      definition: 'Requirements: Field enrichment is required for the filters to work. As field such as CommandLine and ParentImage are not available by default on this event type'
    detection:
      selection:
        Initiated: 'true'
        Image|contains|all:
        - \python
        - .exe
      filter_optional_conda:
        ParentImage: C:\ProgramData\Anaconda3\Scripts\conda.exe
        CommandLine|contains|all:
        - :\ProgramData\Anaconda3\Scripts\conda-script.py
        - update
      filter_optional_conda_jupyter_notebook:
        ParentImage: C:\ProgramData\Anaconda3\python.exe
        CommandLine|contains: C:\ProgramData\Anaconda3\Scripts\jupyter-notebook-script.py
      filter_main_local_communication:
        DestinationIp: 127.0.0.1
        SourceIp: 127.0.0.1
      filter_main_pip:
        CommandLine|contains|all:
        - pip.exe
        - install
      condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity on the host in a tight window around the
    connection reveals what led to it and what followed -- reconnaissance, privilege escalation, or
    persistence -- while collapsing repetitive agent noise into high-count rows so that novel parent-child
    pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host -- defense tampering, reconnaissance, credential access -- may reveal
    the attack stages that preceded this connection and help reconstruct the timeline. A python-initiated
    connection following prior enumeration or execution alerts reads very differently from an isolated event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
