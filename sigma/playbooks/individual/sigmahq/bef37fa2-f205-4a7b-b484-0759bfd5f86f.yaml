name: PUA - Advanced IP Scanner Execution
id: 9cd02c2e-f38f-4162-a41d-914936f1c799
description: |
  Detects execution of Advanced IP Scanner, a portable network discovery tool. The rule fires when EITHER the process identity matches advanced_ip_scanner (Image, OriginalFileName, or Description) OR the command line contains both /portable and /lng. Advanced IP Scanner has legitimate administrative uses for inventory and troubleshooting, but it is also a common reconnaissance tool dropped before lateral movement and impact. The investigation should determine whether the scan was authorized administrative activity or operator-driven enumeration of the local network and reachable shares.
type: detection
detection_id: bef37fa2-f205-4a7b-b484-0759bfd5f86f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Did the alerting process match Advanced IP Scanner by binary identity, or by the /portable and /lng command-line flags?
  context: >-
    The rule fires when EITHER the process identity matches advanced_ip_scanner (Image, OriginalFileName, or Description)
    OR the command line carries both /portable and /lng. Confirm which branch fired and review the exact command line and
    process details. The branch matters downstream — an identity match confirms the named tool ran, while a flags-only match
    can indicate a renamed or repackaged copy whose origin and signing chain deserve extra scrutiny.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
      - Description
- question: Is this user expected to run network discovery tooling on this host?
  context: >-
    Network administrators and IT staff legitimately run scanners for inventory and troubleshooting. Standard users rarely
    need to sweep the local network. The user's role and typical behavior baseline determine whether this scan is routine
    or anomalous, and whether the host function (admin workstation vs. ordinary endpoint) fits the activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: Is Advanced IP Scanner on the organization's approved software list for this host?
  context: >-
    Many organizations restrict which network-scanning and discovery tools are sanctioned and on which hosts they may run.
    A portable scanner that runs without installation leaves little inventory footprint and is frequently used as a drop-in
    reconnaissance tool. An unapproved scanner — regardless of its legitimacy as a product — may represent shadow IT or
    operator-staged enumeration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: What did this Advanced IP Scanner invocation actually do? Decode the full command line and the /portable and /lng flags.
  context: >-
    The full command line reveals the scope and intent of the scan. The /portable flag indicates the no-install portable
    build, and /lng selects the language file. Look for any range, target, or output-path arguments that show what network
    was swept and where results were written. This scopes to all executions of the binary on this host within the window,
    which together may form a single scanning session.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned Advanced IP Scanner, and is that parent chain normal?
  context: >-
    Legitimate scanner use is typically launched interactively from explorer.exe or a command prompt, or from a known
    automation script. Launch from Office applications, script interpreters (wscript.exe, cscript.exe, mshta.exe),
    wmiprvse.exe (WMI remote execution), or wsmprovhost.exe (WinRM remote execution) points to automated post-exploitation
    rather than an administrator at the keyboard.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Did this host make a burst of outbound connections to many distinct internal addresses around the scan?
  context: >-
    A network scan manifests as sequential connection attempts to many unique destination addresses within a short window.
    A high count of distinct destinations in a few minutes is the signature of a sweep; a handful of connections is closer
    to ordinary activity. Tuning note — what counts as a scan depends on the scan-rate threshold (unique destinations per
    time window) and on which binaries are sanctioned scanners in this environment.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
- question: Did the scan fan out to SMB ports 445 or 139 across multiple internal hosts?
  context: >-
    Network share discovery shows up as a burst of outbound SMB/RPC connections (445/139) to many hosts in a short window,
    often followed by IPC$ or srvsvc share enumeration. Many distinct SMB destinations over the correlation window points
    to share-mapping reconnaissance rather than a single intended file access. Tuning note — a burst-host threshold (for
    example five or more unique SMB destinations within the window) separates scanning from routine file access.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 445
          - 139
      condition: selection
    fields:
      - DestinationIp
      - Image
- question: Did other reconnaissance commands run on this host around the same time?
  context: >-
    A single discovery action may be legitimate troubleshooting, but several reconnaissance commands in rapid succession —
    net view, nltest, nslookup, arp, netstat — is a signature of post-compromise enumeration. Three or more distinct recon
    binaries within fifteen minutes typically indicates an automated discovery stage rather than an administrator spot-check.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: What child processes did the scanner spawn afterward?
  context: >-
    The processes spawned by a scanning tool reveal what followed the reconnaissance. A standalone scan spawns little or
    nothing; unexpected children such as cmd.exe, powershell.exe, or file-copy and remote-execution helpers point to the
    scan feeding directly into a next attack stage.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run Advanced IP Scanner?
  context: >-
    A scanner that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low historical
    counts over the baseline window indicate first-time or rare execution, which raises the priority of the other questions.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: >-
    Even a sanctioned scanner can be abused. The query mirrors the rule's selection structure scoped to this host, so the
    resulting parent and user distribution reflects how this specific firing pattern has historically run here. A new parent
    process, an unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|contains: \advanced_ip_scanner
      - OriginalFileName|contains: advanced_ip_scanner
      - Description|contains: Advanced IP Scanner
      selection_cli:
        CommandLine|contains|all:
        - /portable
        - /lng
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this firing
    pattern rather than generic use of the binary. Many hosts firing the same pattern points to scripted deployment or
    sanctioned IT inventory automation; one host or a small unrelated set points to manual operator activity. Use the host
    distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|contains: \advanced_ip_scanner
      - OriginalFileName|contains: advanced_ip_scanner
      - Description|contains: Advanced IP Scanner
      selection_cli:
        CommandLine|contains|all:
        - /portable
        - /lng
      condition: 1 of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|contains: \advanced_ip_scanner
      - OriginalFileName|contains: advanced_ip_scanner
      - Description|contains: Advanced IP Scanner
      selection_cli:
        CommandLine|contains|all:
        - /portable
        - /lng
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|contains: \advanced_ip_scanner
      - OriginalFileName|contains: advanced_ip_scanner
      - Description|contains: Advanced IP Scanner
      selection_cli:
        CommandLine|contains|all:
        - /portable
        - /lng
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints. If the
    same user triggered similar activity on multiple hosts, the scope of the operation may be larger than the single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|contains: \advanced_ip_scanner
      - OriginalFileName|contains: advanced_ip_scanner
      - Description|contains: Advanced IP Scanner
      selection_cli:
        CommandLine|contains|all:
        - /portable
        - /lng
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, credential access, or other
    reconnaissance — may reveal the attack stages that preceded the scan and help reconstruct the full timeline. Reconnaissance
    sitting between initial access and lateral movement is a common ordering.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
