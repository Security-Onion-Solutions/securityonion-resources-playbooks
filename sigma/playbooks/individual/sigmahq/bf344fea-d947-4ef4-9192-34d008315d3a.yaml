name: Suspicious Shim Database Patching Activity
id: 420d5dce-d209-4d27-a1a8-13f598cf37a3
description: >-
  Detects registration of a custom application-compatibility shim database that patches one of Windows'
  core system processes (csrss.exe, dllhost.exe, explorer.exe, RuntimeBroker.exe, services.exe, sihost.exe,
  svchost.exe, taskhostw.exe, winlogon.exe, WmiPrvSe.exe) under the AppCompatFlags\Custom registry path.
  Application shimming is a legitimate Windows mechanism for applying runtime fixups to software, installed
  through sdbinst.exe, but a shim that targets a high-frequency system binary can force a chosen DLL to load
  every time that process starts, giving persistence that survives reboot without a Run key, service, or
  scheduled task. Determine whether the shim came from an authorized application-compatibility deployment or
  whether it points at an unexpected payload and coincides with other persistence or tampering activity on
  the host.
type: detection
detection_id: bf344fea-d947-4ef4-9192-34d008315d3a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Do the registry key path and value data match the shim-database pattern this rule detects?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires when a value is written under
    a key path that contains \SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Custom\ AND ends
    with one of the protected system process names (csrss.exe, dllhost.exe, explorer.exe, RuntimeBroker.exe,
    services.exe, sihost.exe, svchost.exe, taskhostw.exe, winlogon.exe, WmiPrvSe.exe). Both conditions must
    hold. Review the exact TargetObject and the writing process against those criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to install application-compatibility shim databases?
  context: >-
    Installing a shim under AppCompatFlags\Custom requires administrative rights because it writes to HKLM.
    Knowing whether the account and host function match application-compatibility packaging or deployment
    work is often the fastest way to separate a routine install from an unauthorized one. User attribution
    is present on most endpoint registry events; when it is a machine account or missing, pivot on the
    writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What process wrote this shim registration, and what started that process?
  context: >-
    The registry write is normally performed by sdbinst.exe. Tracing the writing process and its parent
    shows whether the install came from a legitimate installer or software-packaging chain, or from an
    interactive shell, script host, or Office application that points to hands-on abuse.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Was there a change ticket or approved deployment for this shim database installation?
  context: >-
    Legitimate application-compatibility patches are usually packaged and deployed through a documented
    process. A corresponding change record suggests authorized activity; its absence, when policy requires
    one, points toward an unsanctioned install. Because benign application-compatibility patches also use
    sdbinst.exe, this check is often the fastest discriminator.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which system process does this shim target, and is a shim on that binary expected here?
  context: >-
    The key path ends with the executable the shim patches. Targeting a high-frequency system process such
    as explorer.exe, services.exe, svchost.exe, or winlogon.exe is what makes shimming useful for persistence
    and DLL injection, because the fixup runs every time that process starts. Legitimate shims almost never
    target these core binaries. The writing process and value data indicate whether this looks like a vendor
    application-compatibility fix or a hand-built injection shim.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value data was written under this shim key, and what shim database does it reference?
  context: >-
    The value stored under AppCompatFlags\Custom\<target.exe> identifies the installed shim database,
    typically a GUID or an .sdb filename. Resolve it to the registered database under InstalledSDB and to the
    .sdb file on disk (default location %WINDIR%\AppPatch\Custom) to learn which fixup the shim applies, such
    as a path redirect or DLL injection at process start.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An operator installing a shim for persistence often changes several keys in the same session, such as
    additional shim registrations, defense-tampering keys, or other autostart entries. Grouping registry
    writes on this host by key path and writing process around the alert reveals whether the shim install
    stood alone or was part of a broader configuration change.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Did the shim-installing process write a .sdb file or DLL payload to disk?
  context: >-
    A shim database persists only if its .sdb file and any injected DLL exist on disk. Correlating file
    activity by the registry-writing process and its children surfaces the .sdb dropped under
    %WINDIR%\AppPatch\Custom and any DLL staged for injection. The file-write event carries no hash; if a
    payload is present, hash it from a later execution or retrieve it for a reputation lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: After the shim was installed, did any protected target process load an unsigned DLL consistent with shim-based injection?
  context: >-
    An injection shim forces the target process to load a chosen DLL each time it starts, so the payload
    appears as an unsigned or untrusted module loaded by a core system process such as explorer.exe,
    services.exe, svchost.exe, or winlogon.exe. Because these binaries normally load only signed system DLLs,
    an unsigned load into one of them shortly after the shim registration is a strong sign the injection took
    effect. Core system processes typically start at boot or logon, so the payload may not appear until the
    next restart.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_targets:
        Image|endswith:
          - '\csrss.exe'
          - '\dllhost.exe'
          - '\explorer.exe'
          - '\RuntimeBroker.exe'
          - '\services.exe'
          - '\sihost.exe'
          - '\svchost.exe'
          - '\taskhostw.exe'
          - '\winlogon.exe'
          - '\WmiPrvSe.exe'
      selection_unsigned:
        Signed: 'false'
      condition: selection_host and selection_targets and selection_unsigned
    fields:
      - Image
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
- question: Has this shim key been written on this host before, or is this the first time?
  context: >-
    A shim registration under AppCompatFlags\Custom for a core system process should be a rare, one-time
    event tied to a specific software install. No prior history for this exact key on this host raises the
    concern that the shim was placed for persistence rather than legitimate compatibility support.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was the same shim key written on other hosts in the environment?
  context: >-
    The same shim registration appearing across many hosts can indicate a managed application-compatibility
    rollout, whereas a modification confined to a single host is more consistent with a targeted install.
    Comparing the writing process and value data across hosts helps tell a fleet deployment apart from a
    one-off.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Does this host normally run the process that installed the shim?
  context: >-
    sdbinst.exe and other shim-installation tooling are rarely used in modern environments outside legacy
    application support. A history showing zero or very few prior runs of the writing process on this host
    marks the execution as first-time or rare and raises its priority.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: What other processes executed on this host around the time of the shim install?
  context: >-
    Alerts rarely occur in isolation. Aggregating process execution on the host in a tight window around the
    registry write surfaces what led up to the install and what followed, such as reconnaissance, credential
    access, or additional persistence steps, while collapsing routine agent noise into high-count rows.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before the shim was installed?
  context: >-
    Earlier alerts on the same host, such as defense tampering, reconnaissance, or credential access, may
    reveal the stages that preceded the shim install and help reconstruct the timeline. A persistence step
    arriving after other suspicious activity strengthens the case for a hands-on intrusion.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    Operators rarely rely on a single persistence method. Alongside a shim database, they commonly stack
    scheduled tasks, services, registry Run keys, or BITS jobs. Persistence-tool executions clustered around
    the same window point to intentional stacking rather than an isolated change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped into Startup folders or scheduled-task definition paths on this host?
  context: >-
    File-based persistence bypasses command-line detection entirely. Dropping an executable or script into a
    Startup folder or a Run-key-referenced path achieves autostart without invoking a persistence tool.
    File-write telemetry captures these drops even when the shim is only one of several footholds established.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
