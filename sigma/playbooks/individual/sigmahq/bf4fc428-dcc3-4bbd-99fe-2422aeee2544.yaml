name: ETW Logging Disabled In .NET Processes - Sysmon Registry
id: e64a1caf-6032-42e7-9eca-33c84f23714c
description: >-
  This detection fires on a registry modification that disables Event Tracing
  for Windows (ETW) for .NET/CLR processes, a defense-evasion action that blinds
  the telemetry used to observe in-memory .NET assembly loads. It matches when
  EITHER a path ending in .NETFramework\ETWEnabled is set to DWORD 0, OR a path
  ending in COMPlus_ETWEnabled or COMPlus_ETWFlags is set to 0 / DWORD 0 — each
  branch requires both the specific key path AND the disabling value together.
  Legitimate causes are rare (developer JIT-dump or CLR configuration); the
  investigation should confirm which value was written, what process wrote it,
  whether ETW stayed disabled, and what .NET execution followed under the
  reduced visibility.
type: detection
detection_id: bf4fc428-dcc3-4bbd-99fe-2422aeee2544
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Do the registry key and value data match either ETW-disabling pattern this rule detects?
  context: >-
    Before investing investigation time, confirm the alert is a true positive by
    reviewing the exact key path (TargetObject) and value data (Details) against
    the detection. The rule fires on EITHER a write of DWORD 0 to a path ending
    in .NETFramework\ETWEnabled, OR a write of 0 / DWORD 0 to a path ending in
    COMPlus_ETWEnabled or COMPlus_ETWFlags. Note which branch matched: the
    COMPlus branch points to CLR configuration knobs, while the .NETFramework
    branch is the framework-wide ETW switch. That distinction guides the
    downstream questions.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to change .NET ETW configuration in the registry?
  context: >-
    Legitimate administrative or developer activity can trigger this detection,
    but a direct write disabling .NET ETW is uncommon outside of JIT-dump
    debugging. Knowing whether the user role and host function are consistent
    with CLR configuration changes is often the fastest path to distinguishing a
    true positive from routine work. User attribution is present on most
    endpoint registry events; when it is a machine account or missing, pivot on
    the writing process (Image) instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which registry value was modified, and is this a known ETW or defense-evasion location?
  context: >-
    The registry path reveals intent. A value ending in
    .NETFramework\ETWEnabled is the framework-wide ETW switch;
    COMPlus_ETWEnabled and COMPlus_ETWFlags are CLR configuration knobs that
    suppress runtime event registration for a process. All three are
    defense-evasion locations rather than routine configuration, so the specific
    value name and the data written determine what telemetry stops being
    emitted.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value was written to this key, and what does setting it to zero do to ETW?
  context: >-
    Read the Details field. A DWORD 0 (0x00000000) or plain 0 written to these
    keys tells the CLR to skip the block of ETW registration calls, so .NET
    event providers never register and no runtime CLR events — including those
    used to detect malicious in-memory assembly loads — are emitted for affected
    processes. A value that restores logging would be a non-zero DWORD; anything
    zero here is the disabling signal.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What .NET logging capability was disabled, and which process wrote the value?
  context: >-
    The targeted capability is ETW for the .NET runtime, which removes visibility
    into assembly loads and other CLR events that defenders rely on. Identify the
    process that performed the write and, where the writer is a command-line tool
    such as reg.exe or powershell.exe, decode the command that set the value.
    Establishing the writing process determines whether this was an interactive
    change, an installer, or an implant blinding itself.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the process that wrote this value expected to change ETW settings, and what started it?
  context: >-
    Legitimate registry edits of this kind usually come from a small set of
    tools (for example regedit.exe or msiexec.exe under a documented
    deployment). Tracing the writer's own origin (grandparent process) reveals
    whether the chain is routine or suspicious, such as an unsigned binary or an
    Office or scripting-host ancestor performing the write. Unsigned executables
    or an abnormal parent-child lineage performing this change raise the
    priority.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does an administrator recall disabling .NET ETW or performing related maintenance?
  context: >-
    Direct confirmation from the person behind the account is often the fastest
    path to determining legitimacy. If no administrator recalls a JIT-debugging
    or CLR-configuration task that would explain the change, the credentials may
    be compromised or the write may be automated tooling. If someone does recall
    it, capture why the change was made and whether it was meant to be permanent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did the ETW-disabling value stay in place, or was it changed again afterward?
  context: >-
    Endpoint telemetry emits no registry key or value deletion events, so
    attacker cleanup of the key is not directly observable. Judge whether the
    disabling persists from the key's re-modification history over the following
    hours (this query) and from whether .NET execution subsequently occurred
    under the reduced visibility. A later write restoring a non-zero value would
    indicate the change was temporary.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Were other registry modifications made on this host in the same session?
  context: >-
    Actors who disable one control often modify several keys in the same window —
    combining ETW suppression with persistence entries or additional policy
    changes. Registry changes clustered from the same user or writing process
    within a short window reveal the full scope of configuration tampering and
    whether multiple objectives were pursued together.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What executed on this host after ETW logging was disabled?
  context: >-
    Defenses are disabled for a reason — to run code that would normally be
    observed. Examining process activity in the window immediately after the
    change reveals what the blinding was meant to hide, most relevantly .NET
    assembly execution whose CLR events would no longer be emitted. Correlate
    this window with network connections and file activity as well.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense-tampering actions performed on this host?
  context: >-
    Actors who disable one control often disable several, stacking log clearing,
    service stops, and defender or firewall changes to maximize coverage.
    Finding additional tampering commands from the same user or parent process
    indicates multiple controls were targeted in the same operation rather than
    an isolated ETW change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Were other persistence mechanisms installed on this host around this time?
  context: >-
    Blinding ETW is often paired with establishing a foothold. Actors commonly
    install backup mechanisms using scheduled tasks, services, registry Run
    keys, BITS jobs, or WMI subscriptions. Persistence-tool executions in the
    same timeframe indicate intentional stacking rather than an isolated
    configuration change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Has this registry key been modified before on this host?
  context: >-
    A first-time modification to an ETW-related key is more suspicious than a
    recurring change. These keys should rarely be touched on a normal host, so a
    historical view helps calibrate severity. Compare the earlier Details values
    and writing processes; zero history means the key has never been changed
    here before.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this registry key modified on other hosts in the environment?
  context: >-
    The same modification across multiple hosts may indicate a policy or
    software deployment, whereas a change confined to this host looks targeted.
    Compare the Details values and writing processes across hosts to tell mass
    configuration from selective tampering.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the change?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity around the
    change surfaces what led to it and what followed, with novel parent-child
    pairs standing out at low counts against repetitive agent telemetry. Look for
    reconnaissance, privilege escalation, or execution that accompanies the
    tampering.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this change?
  context: >-
    Earlier detections on the same host — reconnaissance, credential access, or
    other defense tampering — may reveal the stages that preceded this event and
    help reconstruct the timeline. A sequence of tampering followed by execution
    tells the attack story better than any single alert.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
