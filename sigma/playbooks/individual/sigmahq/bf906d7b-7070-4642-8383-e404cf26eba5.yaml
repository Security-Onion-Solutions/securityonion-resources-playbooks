name: DarkGate - User Created Via Net.EXE
id: 056b171a-c0b2-4260-8e6a-ac248e64a86f
description: |
  Detects net.exe or net1.exe executing with a command line that contains all of `user`, `add`, `DarkGate`, and `SafeMode` — the fixed local-account name and credential pair the DarkGate family uses when it provisions a local user tied to safe-mode boot. A locally created account is a credential that survives reboot, endures password resets on other accounts, and outlives process-level cleanup; tying it to safe mode means it can be used in a boot state where endpoint tooling is not loaded.
  The rule fires on a single selection, so every one of the four command-line tokens plus a net.exe or net1.exe image must be present in the same event. Investigation should confirm the account was actually created, identify the process lineage that drove net.exe, establish which identity ran it, and determine whether additional persistence was installed on the host in the same window.
type: detection
detection_id: bf906d7b-7070-4642-8383-e404cf26eba5
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the alerting command line contain all four of `user`, `add`, `DarkGate`, and `SafeMode`, and did it run under net.exe or net1.exe?
  context: >-
    The rule fires only when one net.exe or net1.exe command line carries all four literal
    tokens together, so confirm each is present rather than assuming a partial match. Read
    the exact account name being added and the credential supplied alongside it — those are
    hardcoded by this family rather than chosen per host, and the account name is what you
    will act on during containment.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: What did net.exe actually do, and did other net.exe invocations run on this host in the same window?
  context: >-
    net is a multi-subcommand tool. Account provisioning normally spans several sequential
    invocations that form one logical operation — `net user /add` creates the account,
    `net localgroup administrators /add` grants it privileges, `net accounts` relaxes password
    policy, and `net share` or `net use` exposes or reaches resources with the new credential.
    Read the full argument list of the alerting command and of every neighbouring net.exe or
    net1.exe execution on this host to recover the whole operation rather than the one step
    that tripped the rule.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned net.exe, and is that parent a normal launcher for account management?
  context: >-
    Administrator-driven account creation is typed into cmd.exe under explorer.exe or issued
    from a management console. A parent of wscript.exe, cscript.exe, mshta.exe, powershell.exe,
    an Office application, wmiprvse.exe, or a renamed binary running from a user-writable
    directory points to scripted execution rather than a person at a keyboard. Loaders also
    relaunch net.exe through an intermediate cmd.exe to blur lineage, so read the parent
    command line as well as the parent image and walk further up if the immediate parent is
    a generic shell.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: Was a local account actually created on this host, and what account name was assigned?
  context: >-
    The command line shows intent; Security event 4720 shows the result. A 4720 record landing
    within seconds of the net.exe start — commonly a 5s to 2m gap once automation delay is
    accounted for — confirms the account exists and gives the exact target account name, which
    is what gets disabled or removed during containment. It also names the subject account that
    performed the creation, which should match the identity on the process event. If
    Security-channel events are not collected in this environment, treat an empty result as a
    visibility gap rather than evidence that no account was created.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 4720
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetUserName
      - SubjectUserName
  answer_sources:
  - active_directory
  - manual_review
- question: Is the identity that ran net.exe one that normally performs local account management on this host?
  context: >-
    Creating a local account is an administrative action. Note whether the process ran as
    SYSTEM, a local administrator, a standard user, or a machine account. A standard user
    account performing it is a privilege deviation worth chasing; SYSTEM or a machine account
    means a service, scheduled task, or injected process drove the action rather than a person,
    which moves the investigation onto the launch mechanism instead of the user.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
  answer_sources:
  - organizational_knowledge
  - asset_inventory
- question: Did other reconnaissance commands run on this host around the same time?
  context: >-
    Account provisioning is normally bracketed by enumeration — whoami, net user, net localgroup,
    nltest, quser, systeminfo — used to establish context beforehand and to confirm the account
    landed afterwards. Three or more distinct discovery binaries inside fifteen minutes reads as
    automated enumeration rather than troubleshooting. The alerting net.exe execution appears in
    these results by construction; the useful signal is what surrounds it.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Account creation is one step in a longer sequence, and the parent-child pairs on either
    side of it tell you what delivered the loader and what it did next. Repetitive agent and
    OS telemetry collapses into a few high-count rows here; novel parent-child pairs stand out
    at low counts and are what to read first.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
- question: What else did this user account do across the environment around this time?
  context: >-
    Tracking the account's activity across all hosts in the alert window shows whether the
    same identity was active on more than one endpoint, which distinguishes a host-local
    infection from credentialed movement. If the alert fired under SYSTEM, a machine account,
    or another service principal, this view fills with routine agent telemetry and the
    parent-driven cross-host view is the one that answers the question.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: Did this same parent-driven account-creation pattern fire on other hosts in the same window?
  context: >-
    When the alert fires under a service principal, asking what the user did elsewhere returns
    agent noise, because every host runs SYSTEM-owned agents constantly. The meaningful pivot
    is the launch mechanism: this counts hosts where the same parent process drove the exact
    firing pattern within the alert window. Several hosts at once points at a pushed or
    scheduled rollout; a single host points at a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \net.exe
        - \net1.exe
        CommandLine|contains|all:
        - user
        - add
        - DarkGate
        - SafeMode
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What did this user account do next on this host in the four hours after the alert?
  context: >-
    Follow-on activity shows what the account was created for. Look for the new credential
    being exercised — logons, `runas`, `net use`, remote service creation — and for privilege
    grants, boot-configuration changes, and payload execution from user-writable directories.
    An account created and never touched again is a dormant foothold; one used minutes later
    is an active operation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
  always_include: true
- question: What other net.exe launches followed on this host in the next four hours, and did the parent or argument structure change?
  context: >-
    When the alert fires under a service principal, tracking the identity is unbounded, so
    track the binary instead. Routine automation repeats net.exe with a stable parent and a
    stable argument structure. A change of parent, or a move from account creation to group
    membership, share access, or password policy, is the progression worth reading.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ParentImage
      - CommandLine
  answer_sources:
  - process_creation
  always_include: true
- question: Has this user account produced this exact net.exe account-creation pattern before, and does that history fit the account's role?
  context: >-
    This counts the account's 90-day history of the rule's specific firing pattern rather than
    generic net.exe use, aggregated by host. Because the account name and credential in this
    pattern are hardcoded rather than site-specific, any prior history is more likely to be a
    repeat infection or a prior test than routine administration — weigh a non-zero count
    against what this identity is supposed to do, and treat zero as a first occurrence.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \net.exe
        - \net1.exe
        CommandLine|contains|all:
        - user
        - add
        - DarkGate
        - SafeMode
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: Has this parent process driven this exact net.exe account-creation pattern before, on this host or anywhere in the environment?
  context: >-
    Under a service principal the user identity attributes nothing, so the launch mechanism is
    the pivot. This is the 90-day history of this parent driving the rule's specific pattern,
    aggregated by host, rather than generic parent-and-binary co-occurrence. A parent that is
    new for this pattern is the deviation to chase; a parent already accounting for a large
    prior volume across many hosts is automation and should be identified before anything else.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \net.exe
        - \net1.exe
        CommandLine|contains|all:
        - user
        - add
        - DarkGate
        - SafeMode
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: Were other process-based persistence mechanisms installed on this host in the surrounding hours?
  context: >-
    A local account is one foothold, and operators routinely stack others behind it. This
    surfaces schtasks.exe, at.exe, sc.exe, reg.exe, bitsadmin.exe, and wmic.exe executions
    within four hours either side of the alert. Registry writes under the safe-boot
    configuration keys deserve particular attention here, since an account provisioned for
    safe mode is only usable if the boot state can also be reached.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Were files dropped to persistence locations such as Startup folders or scheduled-task definition paths on this host?
  context: >-
    File-based persistence leaves no command-line trace. Writing an executable or script into
    a Startup folder, or laying a scheduled-task XML definition directly under the task store,
    achieves the same result without running schtasks, sc, or reg. Note the writing process —
    if it is the same lineage that drove net.exe, the account and the file drop are one
    operation.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Account creation sits late in a delivery sequence. Earlier detections on the same host —
    script-host execution, download cradles, defense tampering, credential access — reconstruct
    how the operator arrived at the point of provisioning an account, and often name the initial
    access vector that the account itself does not reveal.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Are there detections for this user account on other hosts in the past day?
  context: >-
    If the same identity triggered detections on more than one host, the activity extends past
    a single endpoint and the credential itself may be in use for movement. When the alert fired
    under a service principal this view matches nearly everywhere and should be read as
    uninformative rather than as scope.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        user.name|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
  answer_sources:
  - alert
  always_include: true
- question: Did this same rule fire on other hosts in the past 24 hours, and is the cross-host distribution consistent with a single intrusion?
  context: >-
    This asks whether the detection itself is firing elsewhere rather than whether the identity
    is active elsewhere, which stays meaningful when the alert fires under a service principal.
    Because the account name and credential in this pattern are hardcoded, multiple hosts within
    a day usually means one loader reached them all rather than independent administration, and
    each host needs the same account check.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.name|expand: '%rule_name%'
      condition: selection
    fields:
      - host.name
  answer_sources:
  - alert
  always_include: true
