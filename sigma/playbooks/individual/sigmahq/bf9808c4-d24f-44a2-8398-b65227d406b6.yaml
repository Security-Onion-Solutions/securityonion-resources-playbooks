name: Potential Libvlc.DLL Sideloading
id: ec7cb555-6362-4624-83e0-85eb225dd9f1
description: |
  Detects a Windows process loading a module named libvlc.dll from a path outside the legitimate VideoLAN VLC installation directories (C:\Program Files\VideoLAN\VLC\ or C:\Program Files (x86)\VideoLAN\VLC\). libvlc.dll is a real dependency of VLC.exe, so a load from an unexpected directory is consistent with DLL search-order hijacking, where a signed or renamed executable is placed alongside an attacker-supplied DLL of the same name to run code under a trusted process image.
  Legitimate causes include VLC installed to a non-default location or a portable VLC build. The investigation should establish the loading process's identity and origin, the DLL's signature and hash, whether the DLL was recently written to disk outside the VLC directories, and what the loading process did after the load.
type: detection
detection_id: bf9808c4-d24f-44a2-8398-b65227d406b6
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the loaded module match what this rule detects — is libvlc.dll loading from a path outside the VLC installation directories?
  context: >-
    Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded) and the process that loaded it against
    the rule's criteria. The rule fires only when a file named libvlc.dll loads from a directory other than C:\Program Files\VideoLAN\VLC\
    or C:\Program Files (x86)\VideoLAN\VLC\. A load from a user-writable path (AppData, Temp, ProgramData, Public, or a per-user
    application folder) is the anomaly; a non-default but legitimate install directory is the most common benign explanation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this user and host expected to run VLC or otherwise load libvlc.dll?
  context: >-
    A media player and its libraries are expected on some workstations and almost never on servers or service accounts. Knowing
    whether this host's function and this user's role are consistent with VLC being present is often the fastest way to separate
    a legitimate non-default install from an executable that was staged alongside a same-named DLL to abuse the trusted VLC image.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What process loaded libvlc.dll, where does its executable live, and is it the legitimate VLC.exe?
  context: >-
    The loading process is the heart of a sideloading case. Pull its full image path, command line, working directory, and
    user. Legitimate VLC.exe runs from a VideoLAN install directory; a same-named or renamed executable running from a user-writable
    path, or an unrelated binary loading libvlc.dll, is the abuse pattern. The working directory frequently equals the folder
    the attacker-supplied DLL was dropped into, since search-order hijacking relies on the DLL sitting beside the executable.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
      - User
- question: What is the signing status, hash, and reputation of the libvlc.dll that loaded?
  context: >-
    The load event carries the module's signature and hash directly, so reputation can be checked without waiting for an execution
    pivot. A genuinely VideoLAN-signed libvlc.dll relocated to an unexpected folder may still be benign; an unsigned module, one
    with an invalid or distrusted signature, or one whose hash is unknown to the legitimate VLC build is a substitution indicator.
    Hash lookups against threat intelligence surface known sideloading loaders.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
        ImageLoaded|endswith: '\libvlc.dll'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What other modules did this process load, and are any from non-canonical paths, unsigned, or from user-writable directories?
  context: >-
    The full set of modules a process pulls in tells the operator's story when the loaded libvlc.dll alone is ambiguous. Look for
    additional DLLs from Temp, AppData, ProgramData, or Public; unsigned modules where signed ones are expected; and system DLL
    names loaded from non-system paths. A cluster of anomalous loads by the same process strengthens the sideloading assessment
    over a single relocated library.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: What spawned the process that loaded libvlc.dll, and is that parent chain expected?
  context: >-
    The parent reveals how the loading process was launched. A VLC.exe started from explorer.exe by a user is routine; a same-named
    executable spawned by an archive utility, a script host, an Office application, or a browser download handler points to delivery
    of a sideloading bundle. Walk up the tree by pivoting on the parent's own ancestry if the immediate parent is itself unusual.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Is the libvlc.dll file, or another dropped payload, still on disk for analysis?
  context: >-
    If the loading process or one of its children wrote files, checking whether they still exist enables hashing, sandbox submission,
    and content review. The attacker-supplied libvlc.dll and any adjacent decoy or payload dropped into the same directory are the
    priority artifacts. Mark-of-the-Web / alternate-data-stream provenance on the dropped DLL is not visible in this telemetry and
    is a manual or endpoint-console check.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was a file named libvlc.dll written to a non-VLC directory on this host, and by which process?
  context: >-
    Search-order hijacking begins with the malicious DLL being placed on disk. A write of libvlc.dll to any path outside the VideoLAN
    install directories, correlated in time ahead of this load, identifies the delivery step and the process that staged it (an
    archive extractor, a downloader, or the sideloading executable itself). The interval between the write and the module load is
    the correlation window that separates a fresh drop from a long-standing legitimate file.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: '\libvlc.dll'
      filter_main_vlc:
        TargetFilename|startswith:
          - 'C:\Program Files (x86)\VideoLAN\VLC\'
          - 'C:\Program Files\VideoLAN\VLC\'
      condition: selection and not filter_main_vlc
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
- question: Has libvlc.dll been loaded on this host before, and by which processes?
  context: >-
    A first-time module load on a host is a stronger anomaly than a recurring one. If the same libvlc.dll path has been loaded
    repeatedly by the same process over the past 90 days, this load is probably part of a stable install. If this is the first
    occurrence, or the library has only ever been loaded by different processes, the current load is the outlier worth pursuing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Were DLL-redirection or process-persistence registry keys modified on this host around the time of the load?
  context: >-
    DLL hijacking is often paired with registry-based redirection or persistence. Modifications to KnownDLLs, AppInit_DLLs, App Paths,
    Image File Execution Options, or Run/RunOnce keys around the load window indicate an attacker arranging for the sideloaded code
    to run again or for other binaries to resolve to attacker-controlled modules. A clean result narrows the activity to a single
    in-memory load; a match expands the scope to configured persistence.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\Session Manager\KnownDLLs'
          - '\Windows NT\CurrentVersion\Windows\AppInit_DLLs'
          - '\CurrentVersion\Image File Execution Options\'
          - '\CurrentVersion\App Paths\'
          - '\CurrentVersion\Run'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Loads rarely occur in isolation. Examining process activity in the surrounding minutes reveals what launched the loading process
    and what happened after — reconnaissance, credential access, additional payload execution, or outbound connections. Novel parent-child
    pairs at low counts stand out against the high-count agent and system noise that the aggregation collapses.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Was there a change ticket, maintenance window, or documented approval for installing or running VLC on this host?
  context: >-
    Many organizations track software installs and non-standard tooling through change management. A ticket or approved deployment
    that explains VLC being present in a non-default location suggests authorized activity; absence of one, where policy requires it,
    keeps the sideloading hypothesis open and supports escalation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this activity align with normal work hours and maintenance windows?
  context: >-
    Legitimate software runs and installs typically occur during business hours or scheduled maintenance. A libvlc.dll load from an
    unusual path in the middle of the night, on a host that has no history of running VLC, is more consistent with attacker activity
    than the same load during a documented deployment window.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is libvlc.dll being loaded by other hosts in the environment, and by which processes?
  context: >-
    Cross-host correlation shows how far the activity reaches. The same libvlc.dll path loaded on one host may be a localized event;
    the same library loaded across several hosts under the same non-standard process points to shared tooling or a distributed intrusion.
    Pay attention to the variety of loading processes: a single expected parent everywhere is benign, while unexpected loaders on other
    hosts extend the investigation.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, credential access, or delivery of an archive — may reveal
    the stages that preceded the DLL load and help reconstruct the timeline. Sideloading is usually a mid-chain execution step rather
    than the entry point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    Attackers rarely rely on a single foothold. After establishing execution through a sideloaded DLL, they commonly add backup
    persistence with different techniques — scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions. Multiple
    persistence installations in the same timeframe indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations (Startup folders, scheduled-task definitions) on this host?
  context: >-
    File-based persistence bypasses command-line detection entirely. Dropping an executable or script into the Startup folder or a
    path referenced by a registry Run key achieves persistence without running schtasks, sc, or reg. File-event monitoring captures
    these drops even when the attacker avoids standard persistence tools, which is common when execution already runs under a trusted
    process image.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
