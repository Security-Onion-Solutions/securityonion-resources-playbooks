name: Disable Exploit Guard Network Protection on Windows Defender
id: 1e1fa3a7-f5f4-40db-9941-1f6e49a8d90c
description: |
  Detects a registry write that sets DisallowExploitProtectionOverride to DWORD (00000001) under the Windows Defender
  Security Center "App and Browser protection" policy key, weakening Exploit Guard Network Protection. Group Policy and
  local admin tooling set this value legitimately during hardening or configuration changes, but the same modification is a
  common defense-evasion step taken to allow tooling or payloads that Network Protection would otherwise block. The
  investigation should confirm the exact key and value, identify the writing process and its operator, determine whether the
  change persists, and look for the activity the weakened protection was meant to enable.
type: detection
detection_id: bf9e1387-b040-4393-9851-1598f8ecfae9
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Do the registry key and value data match what this rule detects?
  context: Confirm the alert is a true positive by reviewing the exact registry path (TargetObject) and value data (Details)
    against the rule's criteria. The rule fires when a write sets DisallowExploitProtectionOverride to DWORD (00000001) under
    the Windows Defender Security Center App and Browser protection policy key. A value other than that DWORD, or a different
    key path, points to a partial or unrelated match.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify Windows Defender exploit protection policy keys?
  context: Legitimate hardening scripts, Group Policy processing, and endpoint management tooling routinely edit Defender
    policy keys, and those writes often carry a machine account or SYSTEM rather than an interactive user. Knowing whether the
    writing process and account are consistent with sanctioned configuration management is usually the fastest way to separate
    a routine change from tampering. If User is a machine account or missing, pivot on the writing process (Image) instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this a known security-evasion registry location, and what value was written?
  context: This key lives under HKLM\SOFTWARE\Policies\Microsoft\Windows Defender Security Center\App and Browser protection,
    a policy path that governs Exploit Guard behavior. DisallowExploitProtectionOverride set to DWORD (00000001) locks out
    user-facing exploit protection controls and is a defense-tampering location rather than a persistence one. Record the exact
    value data and the writing process so the judgment about intent is anchored to the observed modification.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What does the written value data mean for exploit protection on this host?
  context: The Details field carries the policy value being set. DWORD (00000001) on DisallowExploitProtectionOverride disallows
    overriding exploit protection settings, which in this policy weakens Network Protection enforcement. A DWORD of 0 or absence
    of the value leaves the default protective behavior in place, so the specific value data determines whether protection was
    actually reduced.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What command did the writing process run to weaken Exploit Guard Network Protection?
  context: The registry write can come from reg.exe, a PowerShell Set-ItemProperty call, a Group Policy import, or a custom
    tool. Retrieving the writing process's command line shows how the change was made and whether it was a single targeted
    edit or part of a broader script that also touched other controls. The command line reveals whether the operator scripted
    the tampering or invoked it interactively.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process wrote this value and what launched it?
  context: The parent chain of the writing process shows how the modification was initiated. A change originating from Group
    Policy processing or a management agent looks different from one launched by a script host, an Office application, or a
    remote-access tool. An unexpected parent for a Defender policy edit is a stronger signal of tampering than the edit alone.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
- question: Does this modification persist, or is the value re-set after the alert?
  context: A one-off change made for a specific action may be reverted, while a durable weakening of protection is left in
    place. Registry value deletions are not directly observable on endpoint telemetry, so judge persistence from the key's
    re-modification history over a longer window rather than expecting a removal event. Repeated writes flipping the value back
    and forth suggest a fight between tampering and a management baseline reasserting policy.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Is Exploit Guard Network Protection currently restored, or is the host still exposed?
  context: The tampering may have been temporary or may still be in effect. Confirming the current state of Exploit Guard
    Network Protection through direct host inspection or the endpoint management console reveals whether the host remains
    exposed and needs the policy restored before the rest of the investigation proceeds.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Has this Defender policy key been modified before on this host?
  context: Security policy keys should change rarely and through predictable management processes. A long history of writes
    to this key from a management agent points to routine configuration, while a first-time or isolated modification is more
    consistent with hands-on tampering. Compare the historical Details values to see whether the same policy value is normally
    set or whether this write reversed a protective setting.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What activity occurred on this host after Network Protection was weakened?
  context: Network Protection is disabled to allow something it would otherwise block, such as a download, a connection to an
    untrusted host, or execution of flagged tooling. Examining process activity in the window immediately after the registry
    write reveals what the weakened protection was meant to enable. Correlate this with network connections and file writes in
    the same window.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense tampering actions performed on this host?
  context: Operators who weaken one control often disable several in the same operation, combining exploit protection changes
    with log clearing, shadow copy deletion, recovery disabling, or firewall changes. Finding additional tampering commands
    from the same user or parent process indicates a coordinated effort to reduce visibility and protection rather than an
    isolated policy edit.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Were other registry modifications made on this host in the same session?
  context: Operators who edit one policy key often edit several, pairing a Defender weakening with Run-key persistence,
    firewall rules, or other policy changes. Reviewing all registry modifications on the host in the surrounding window, grouped
    by key path and writing process, reveals whether multiple objectives were pursued together. The triggering key appears in
    the results; the signal is what else changed alongside it.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Aggregating process activity in the window around the registry write surfaces
    what led up to it and what followed, and helps place the tampering within a larger sequence such as reconnaissance,
    privilege escalation, or payload execution. Novel parent-child pairs at low counts stand out against high-count routine
    telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Was this Defender policy key modified on other hosts in the environment?
  context: The same modification across many hosts is consistent with a Group Policy rollout or a management-driven change,
    while a change confined to this one host is more consistent with targeted tampering. Compare the Details values across
    hosts to see whether the same value is being set everywhere or whether this host diverges from the fleet.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as reconnaissance, credential access, or other defense tampering, may
    reveal the stages that preceded this event and help reconstruct the timeline. Defense weakening frequently sits between an
    initial foothold and the activity it is meant to enable.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host?
  context: Weakening a defensive control often accompanies establishing durable access. Scheduled tasks, services, registry
    Run keys, BITS jobs, or WMI subscriptions installed in the same timeframe indicate intentional stacking of persistence
    rather than an isolated configuration change. Multiple mechanisms from the same window point to hands-on activity.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations (Startup folders, scheduled-task definitions) on this host?
  context: File-based persistence bypasses command-line detection entirely. Dropping an executable or script into a Startup
    folder or a path referenced by a registry Run key achieves persistence without invoking schtasks, sc, or reg. File event
    monitoring captures these drops even when standard persistence tooling is avoided, which is relevant once a control has
    been weakened to let such a payload run.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
