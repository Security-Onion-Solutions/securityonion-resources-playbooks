name: Qakbot Rundll32 Fake DLL Extension Execution
id: 4df3b1fa-07df-443c-ae35-4b2d452ee03d
description: |
  Detects rundll32.exe launched by a shell or script host (cmd.exe, cscript.exe, curl.exe, mshta.exe,
  powershell.exe, pwsh.exe, wscript.exe) with a command line that references a user-writable directory
  (:\ProgramData\, :\Users\Public\, \AppData\Local\Temp\, \AppData\Roaming\) and that contains no `.dll`
  substring anywhere. rundll32 maps a module by path and never inspects the extension, so a payload saved
  as .dat, .tmp, .png, or a random suffix executes exactly as a .dll would while defeating extension-based
  hunting and casual inspection of the command line; this is the signed-binary proxy execution pattern
  tracked as T1218.011, and loader families such as Qakbot rely on it. The investigation should establish
  which file rundll32 mapped and which export or ordinal ran, who wrote that file to the user-writable
  path and where it came from, whether the mapped module is signed and previously seen, and whether the
  execution produced child processes or outbound connections.
type: detection
detection_id: bfd34392-c591-4009-b938-9fd985a28b85
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: >-
    Does the rundll32 command line point at a file under a user-writable directory with no `.dll` anywhere
    in it, and did a shell or script host spawn it?
  context: >-
    All three conditions must hold together for this rule to fire: the parent ends in cmd.exe, cscript.exe,
    curl.exe, mshta.exe, powershell.exe, pwsh.exe or wscript.exe; the image is rundll32.exe; and the command
    line references one of :\ProgramData\, :\Users\Public\, \AppData\Local\Temp\ or \AppData\Roaming\ — while
    the command line as a whole contains no `.dll` substring. Confirm each part and record the extension that
    was actually used, because that gap is the finding: rundll32 loads the file as a module regardless of what
    it is named, so an extension such as .dat, .tmp, .png or a random string carries a PE that runs as a DLL.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run rundll32 against files staged in ProgramData, Public, or AppData?
  context: >-
    Software installers, vendor updaters, and some management tooling do stage modules in ProgramData or
    AppData and load them with rundll32, but they almost always name them .dll. A user role and host function
    that have no reason to proxy-execute a non-.dll module out of a user-writable directory narrow this to a
    single question quickly; a build, packaging, or IT-automation role widens it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this shell or script host expected to launch rundll32, and what started the parent itself?
  context: >-
    The parent list this rule matches is the delivery layer of a loader chain — a script host or shell that
    ran first and then handed off execution to a signed Windows binary. The parent's own command line usually
    names the script, the download, or the one-liner that staged the module, and the grandparent shows whether
    the chain began with a document, an archive extraction, an interactive session, or a scheduled job.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other child processes did the same parent instance spawn around this time?
  context: >-
    A loader script rarely does one thing. Siblings of the alerting rundll32 under the same parent instance
    reveal whether the same launcher also copied files, ran reconnaissance commands, or started a second stage.
    A parent whose only child is this rundll32 points to a narrow, single-purpose invocation.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Which file did rundll32 map, and which export or ordinal was called?
  context: >-
    Read the command line apart: the argument before the comma is the module path, the argument after it is
    the export name or an `#N` ordinal. Note the file name and extension, whether the path is quoted, and
    whether the export name is a plausible Windows API name or an arbitrary string — exported entry points
    with random or single-letter names are typical of custom modules rather than system libraries. This query
    covers every rundll32 invocation on the host in the window that references these directories, so a staged
    chain of several loads appears together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \rundll32.exe
        CommandLine|contains:
          - ':\ProgramData\'
          - ':\Users\Public\'
          - '\AppData\Local\Temp\'
          - '\AppData\Roaming\'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: Which modules did the alerting rundll32 process map, and are they signed and known?
  context: >-
    Module-load telemetry records the real path of every image the process mapped, along with its hash and
    signature state, which is the fastest way to identify the disguised file no matter what it is named. An
    unsigned module loaded out of a user-writable directory alongside the normal system libraries is the
    payload; the hash on that load event can be checked against reputation sources directly, with no pivot to
    a later execution needed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: Did the parent process write the file that rundll32 loaded, and what else did it write to disk?
  context: >-
    The module has to reach the user-writable path before it can be proxy-executed, and the same script host
    or shell that launched rundll32 is the most likely writer — a curl.exe or powershell.exe parent points at
    a download, a cmd.exe parent at a copy or an archive extraction. Files written by the parent instance show
    the staging step, the naming convention used for the disguised module, and any companion files such as
    configuration or a second stage.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - process_creation
- question: Did the alerting rundll32 process spawn any child processes?
  context: >-
    A module loaded through rundll32 frequently runs entirely inside the rundll32 process and never spawns
    anything, so an empty result here is common and does not indicate the load was benign. When children do
    appear — command interpreters, script hosts, or a copy of a system binary from an unusual path — they mark
    the point where the module moved on to its next stage.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Did the alerting rundll32 process make outbound network connections, and to where?
  context: >-
    Because the module executes in-process, rundll32.exe itself is what appears as the network endpoint for
    anything the module does. Connections to external addresses, especially repeating ones to a small set of
    destinations, indicate the loaded module established command-and-control rather than performing a local
    task. Absence of connections does not rule out execution — some loaders only stage and exit.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
- question: How routinely has this host run rundll32 against files in these user-writable directories over the past 90 days?
  context: >-
    rundll32.exe runs constantly on any Windows host, so a count of the binary alone measures nothing. Scoped
    to the four directories this rule watches, the count says whether loading modules out of ProgramData,
    Public, or AppData is normal on this host — a pattern some installers and updaters do produce. Note that
    this baseline includes ordinary .dll loads from those paths; a high count is a statement about the
    directory habit, not about the extension gap.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \rundll32.exe
        CommandLine|contains:
          - ':\ProgramData\'
          - ':\Users\Public\'
          - '\AppData\Local\Temp\'
          - '\AppData\Roaming\'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: Has this parent binary spawned rundll32 on this host before?
  context: >-
    A script host or shell handing off to rundll32 is a specific pairing, and on most workstations it is rare
    or absent. Zero or very low counts make this a novel launch relationship worth chasing; a high count
    usually traces to a management agent or a packaged application that wraps its own installer logic, which
    the returned command lines will identify.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    This query mirrors the rule's selection structure scoped to this user, so the result is the user's 90-day
    history of this exact pattern — a shell or script host launching rundll32 against a non-.dll path in a
    user-writable directory — rather than generic rundll32 use, aggregated by host. A user who has never
    produced this pattern is a different proposition from one who produces it weekly; weigh the count against
    their role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        ParentImage|endswith:
        - \cmd.exe
        - \cscript.exe
        - \curl.exe
        - \mshta.exe
        - \powershell.exe
        - \pwsh.exe
        - \wscript.exe
        Image|endswith: \rundll32.exe
        CommandLine|contains:
        - :\ProgramData\
        - :\Users\Public\
        - \AppData\Local\Temp\
        - \AppData\Roaming\
      filter_main_extension:
        CommandLine|contains: .dll
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: >-
    Has this parent process historically driven the rule's pattern on this host or across the environment, or
    is the parent new for this activity?
  context: >-
    When the alert fires under a service principal, user identity attributes nothing and the launch mechanism
    is the meaningful pivot. This query mirrors the rule's selection structure scoped to the alerting parent
    process, so the result is the 90-day history of this parent driving this specific pattern rather than
    generic parent-and-binary co-occurrence. A parent that is new or rare for this pattern is the deviation
    worth chasing; one that already accounts for thousands of prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        ParentImage|endswith:
        - \cmd.exe
        - \cscript.exe
        - \curl.exe
        - \mshta.exe
        - \powershell.exe
        - \pwsh.exe
        - \wscript.exe
        Image|endswith: \rundll32.exe
        CommandLine|contains:
        - :\ProgramData\
        - :\Users\Public\
        - \AppData\Local\Temp\
        - \AppData\Roaming\
      filter_main_extension:
        CommandLine|contains: .dll
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did this user do across the environment around this time?
  context: >-
    Tracking the user's process activity across all hosts in the alert window shows whether the loader ran on
    one endpoint or the same identity was active on several. Multiple hosts in the same window points to
    lateral movement or to an identity being used from more than one place. If the alert fired under SYSTEM or
    another service principal, this returns agent telemetry rather than an answer — read the parent-driven
    fleet question instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: >-
    Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to
    this host?
  context: >-
    Under a service principal, asking what else the user did returns agent-telemetry noise, since every host
    runs SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism fired
    elsewhere: this query mirrors the rule's selection structure scoped to the alerting parent process,
    fleet-wide, within the alert window. Several hosts in the same window points to scheduled or pushed
    automation or a delivery wave; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        ParentImage|endswith:
        - \cmd.exe
        - \cscript.exe
        - \curl.exe
        - \mshta.exe
        - \powershell.exe
        - \pwsh.exe
        - \wscript.exe
        Image|endswith: \rundll32.exe
        CommandLine|contains:
        - :\ProgramData\
        - :\Users\Public\
        - \AppData\Local\Temp\
        - \AppData\Roaming\
      filter_main_extension:
        CommandLine|contains: .dll
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Aggregating every process creation on the host by image and parent collapses repetitive agent telemetry
    into high-count rows while novel parent-child pairs stand out at the bottom with counts of one or two.
    Scan for the pairs that do not belong — archive utilities, additional script hosts, credential or
    discovery tooling — to place this load inside the wider sequence on the host.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    A proxy-executed loader normally sits in the middle of a sequence rather than at its start. Earlier
    detections on the same host — a script host writing to disk, a download utility reaching an unusual
    destination, a document spawning a shell — reconstruct how the module arrived and who staged it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
