name: Potential SystemNightmare Exploitation Attempt
id: 90a71251-651d-4fdd-97f5-5690cfad2f1d
description: |
  Detects a command line containing any of three literal strings carried by the SystemNightmare
  print-spooler exploitation tool: the driver-hosting host name printnightmare.gentilkiwi.com, the
  ' /user:gentilguest ' account switch, or the operator-supplied driver name 'Kiwi Legit Printer'.
  The tool chains the print spooler's Point and Print driver installation path with a locally created
  account to install an operator-supplied printer driver and hand back an interactive command prompt
  running as LOCAL SYSTEM. The rule places no constraint on the executable, its path, or its parent,
  so anything carrying one of the strings fires it — the tool itself under any filename, a wrapper
  script, or a control-validation test that echoes the published indicator. Investigation should
  establish which binary received the string and which account launched it, whether the spooler
  service spawned a child process or loaded a new driver around the same time, and what ran under the
  resulting token afterward.
type: detection
detection_id: c01f7bd6-0c1d-47aa-9c61-187b91273a16
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the alerting command line carry one of the SystemNightmare marker strings, and was it passed to a running executable?
  context: >-
    The rule matches a command line containing the driver-hosting host name printnightmare.gentilkiwi.com,
    the ' /user:gentilguest ' switch, or the driver name 'Kiwi Legit Printer', with no constraint on the
    binary or its parent. Note which of the three appeared and confirm it was handed to a process as an
    argument rather than quoted inside a scanning, grep-style, or documentation command that only
    references the published indicator.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run print-spooler privilege-escalation tooling?
  context: >-
    These strings have no routine administrative use, but they do appear on hosts where security staff
    run control-validation tests or where an operator is reproducing a known escalation path in a lab
    build. Knowing whether this account performs that work, and whether this host is a test system or a
    production endpoint, is the fastest way to separate a sanctioned exercise from an unsanctioned one.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Which binary issued the marker string, from what working directory, and what were the full arguments?
  context: >-
    The rule constrains only the command line, so the executable behind it is unknown until read. The
    binary name and working directory separate a downloaded exploit tool run from a user-writable
    directory from a driver-installation utility invoked with the marker as a parameter. This query
    returns every process on this host whose command line carries one of the markers within the alert
    window, which captures multi-step invocations that together form one escalation attempt.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
        - printnightmare.gentilkiwi.com
        - ' /user:gentilguest '
        - Kiwi Legit Printer
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
      - User
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned the alerting binary, and is that parent chain expected on this host?
  context: >-
    The parent reveals how the tool was invoked. An interactive shell or explorer.exe parent points to a
    hands-on-keyboard operator; a remote-execution service, script host, or software-deployment agent
    parent points to a pushed or automated launch and changes both the scope and the containment step.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Did the print spooler service spawn any child process on this host around the time of the alert?
  context: >-
    The escalation path ends with spoolsv.exe launching a process under the SYSTEM token it already
    holds, so a spooler child process is the observable outcome of a successful attempt rather than a
    mere attempt. A command interpreter, script host, or any interactive binary parented to spoolsv.exe
    within the alert window indicates the exploit reached its objective; no spooler children suggests the
    attempt failed or was blocked.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\spoolsv.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
  answer_sources:
  - process_creation
- question: Which printer driver modules loaded into the spooler service on this host around the alert, and are any of them unsigned or newly seen?
  context: >-
    Point and Print installation makes the spooler load a driver module the operator controls, and the
    module name varies with the tooling rather than being fixed. Reviewing what spoolsv.exe loaded in the
    alert window shows whether a driver arrived alongside the command line, and the signer field separates
    vendor print drivers from an unsigned module dropped to a user-writable path. If library load events
    are not collected in this environment, treat zero results as a visibility gap rather than evidence no
    driver loaded.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\spoolsv.exe'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
  answer_sources:
  - process_creation
  - manual_review
- question: Which accounts were assigned SYSTEM-equivalent privileges on this host around the time of the alert?
  context: >-
    Special-privilege assignment events record the moment a logon receives SeDebugPrivilege,
    SeTcbPrivilege, or SeImpersonatePrivilege, which is where a successful escalation to LOCAL SYSTEM
    becomes visible in authentication telemetry independent of process data. An assignment to an account
    that does not normally hold these privileges, timed to the alert, corroborates the escalation; the
    logon ID also links back to the session the resulting shell ran in. If the Security channel is not
    collected in this environment, this query returns no rows by construction.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 4672
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - SubjectUserName
      - SubjectLogonId
      - PrivilegeList
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: What child processes did the alerting process spawn afterward, and under which account did they run?
  context: >-
    The children of the alerting process show what the escalation attempt was used for. The account each
    child ran under is the load-bearing detail — a child running as SYSTEM where the parent ran as a
    standard user marks the token change, and the binaries that follow show whether the operator moved on
    to credential access, account creation, or remote access.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
  answer_sources:
  - process_creation
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Escalation rarely stands alone. Aggregating parent-child pairs in the surrounding window collapses
    routine agent telemetry into high-count rows while novel pairings stand out at low counts, which is
    where staging, reconnaissance, and persistence steps around the attempt become visible.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Has this host produced the rule's pattern before, and if so which parents and accounts drove it?
  context: >-
    The query mirrors the rule's selection scoped to this host, so the parent/user distribution reflects
    how these specific marker strings have appeared here historically rather than generic binary usage. A
    recurring pattern under one parent and account points to a lab build or a repeated validation
    exercise; a first occurrence on a host with no history of it is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - printnightmare.gentilkiwi.com
        - ' /user:gentilguest '
        - Kiwi Legit Printer
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, so the result is the account's 90-day
    history of these marker strings rather than generic use of a binary, aggregated by host. An account
    with no prior history of the pattern is the more interesting case; a security engineer or red-team
    account with a run of prior hits across lab hosts reads differently from a helpdesk or service account
    producing it for the first time.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - printnightmare.gentilkiwi.com
        - ' /user:gentilguest '
        - Kiwi Legit Printer
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this parent process historically driven the rule's pattern, or is the parent new for this activity?
  context: >-
    When the alert fires under SYSTEM, a computer account, or a service principal, the user name attributes
    nothing and the launch mechanism becomes the meaningful pivot. This query mirrors the rule's selection
    scoped to the alerting parent, so the result is that parent's 90-day history of driving this pattern. A
    parent already accounting for prior events across many hosts points to a deployment or testing harness;
    a parent new to the pattern is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - printnightmare.gentilkiwi.com
        - ' /user:gentilguest '
        - Kiwi Legit Printer
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user run across the environment around this time?
  context: >-
    Tracking the account's activity across all hosts in the surrounding window shows whether the escalation
    attempt was isolated or one step in a sequence touching several endpoints. The same account driving
    similar activity on multiple hosts widens the scope of the investigation.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did the same parent-driven pattern fire on other hosts in the same window?
  context: >-
    Under a service principal, a user-scoped sweep returns agent telemetry from every host rather than an
    answer. This query mirrors the rule's selection scoped to the alerting parent process, fleet-wide,
    within the alert window. Several hosts in the same window points to a pushed or scheduled rollout; a
    single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - printnightmare.gentilkiwi.com
        - ' /user:gentilguest '
        - Kiwi Legit Printer
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host reconstruct what preceded the escalation attempt. Look for the
    delivery and staging steps that typically come first — a download or archive extraction, a script host
    launch, or reconnaissance of local privileges — and for defense tampering that would explain why the
    attempt got as far as it did.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection with no host scope, giving a fleet-wide count of these marker
    strings. Many hosts in a tight sequence points to a scripted validation sweep or a testing harness; one
    host, or a small unrelated set, points to manual operator activity. Use the host distribution to
    calibrate how far the response needs to reach.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - printnightmare.gentilkiwi.com
        - ' /user:gentilguest '
        - Kiwi Legit Printer
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
