name: DNS Query by Finger Utility
id: 630bddb3-2c38-49fa-8b31-8cf1ac07405e
description: >-
  Detects a DNS lookup issued by finger.exe, the legacy Windows finger client. The finger utility is
  rarely used on modern Windows, and it can be abused as a living-off-the-land binary to retrieve
  remote text from a finger server (TCP port 79) and pipe that text straight into cmd.exe for
  execution (finger user@host | cmd). Because the alert is a DNS query rather than a connection,
  investigate the queried domain and whether an egress connection and downstream command execution
  actually followed, distinguishing a rare-but-benign finger invocation from remote command retrieval.
type: detection
detection_id: c082c2b0-525b-4dbc-9a26-a57dc4692074
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Was this DNS lookup issued by finger.exe, and what domain did it resolve?
  context: >-
    Confirm the process behind the lookup is finger.exe and note the exact domain queried. The rule
    fires on any DNS query issued by finger.exe, which is uncommon in modern Windows environments, so
    the querying process and the queried domain are the core facts to establish first.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - Image
- question: Is this user and host expected to run the finger utility?
  context: >-
    finger.exe is rarely used administratively on modern Windows. Knowing whether the user role and
    host function ever legitimately invoke it is often the fastest way to separate a routine or legacy
    use from social-engineering-driven abuse. Admin-level users running command-retrieval tooling
    outside a known baseline is the concern.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What were finger.exe's full command-line arguments on this host?
  context: >-
    The finger command line reveals the target it queried. The abuse pattern is finger user@host,
    where host is an attacker-controlled finger server, frequently piped into cmd.exe (finger
    user@host | cmd) so the returned text is executed as shell commands. Decode the user@host argument
    and any piping or command chaining.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What domain did finger.exe look up, is it known-malicious, and did it resolve?
  context: >-
    The alert is a DNS lookup, not a connection, so investigate the queried domain itself: registration
    age, passive DNS, and reputation. Finger-server domains used for command retrieval are frequently
    recently registered. Check whether the lookup resolved and to which infrastructure, since that
    resolved address is where any follow-on retrieval connection would go.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: Across the alert window, how many domains did finger.exe query and do any show encoding or DGA characteristics?
  context: >-
    DNS tunneling encodes data into long base32 or base64 subdomains and issues many queries in a short
    interval. Command retrieval via finger typically resolves one short finger-server domain rather than
    a burst of long encoded labels, so a high query count or unusually long, high-entropy subdomains
    would point to tunneling rather than a single command fetch.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - QueryName
- question: What process launched finger.exe, and is that parent chain expected?
  context: >-
    The parent reveals how finger was invoked. In the abuse pattern a user pastes a command into the
    Run dialog or a shell, so finger's parent is typically cmd.exe or explorer.exe carrying the full
    finger user@host | cmd string in its command line. An Office application, browser, or script host
    as the parent points to social-engineering delivery rather than legacy tooling.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: What commands referencing finger ran on this host, and was the output piped into cmd?
  context: >-
    The retrieve-and-execute pattern pipes finger's output into cmd.exe (finger user@host | cmd), so the
    raw text returned by the finger server is executed as shell commands. Look for the pipe into cmd, the
    @ host lookup, and command chaining (&& or ^). The executed payload commonly creates a randomly named
    directory, copies curl.exe to a renamed binary, and downloads an archive disguised as a PDF.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: finger
      condition: selection
    fields:
      - CommandLine
      - ParentImage
- question: Did finger.exe spawn any child processes on this host?
  context: >-
    In the command-retrieval abuse pattern finger's output is piped into a separate cmd.exe rather than
    spawned as a child, so direct children are often absent, and the executed payload runs under the
    sibling shell surfaced by the command-line analysis. A non-empty result here means finger launched a
    process directly, which is its own anomaly worth decoding.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: After the DNS lookup, did finger.exe open an outbound connection, and to which address and port?
  context: >-
    A DNS query alone does not confirm command retrieval. The finger protocol runs over TCP port 79.
    Anchoring on the finger.exe process rather than the DNS resolver address shows whether an egress
    connection actually followed the lookup and to which external infrastructure. A connection on port 79
    to a non-local address is the retrieval step where remote commands are pulled back.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: Has this host run finger.exe before, and under which users?
  context: >-
    finger.exe is uncommon on modern Windows. A zero or very low 90-day count marks this as a first-time
    or rare execution, raising suspicion. A steady history under one specific user may instead indicate a
    legacy script or a routine operator, which recalibrates how much weight to give the alert.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Has this host queried this domain before?
  context: >-
    First-time lookups of a domain are more suspicious than routine resolution. A zero or low 90-day count
    for this finger-server domain points to newly introduced infrastructure rather than established
    business traffic, while a long, steady history suggests a known service.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: When this host has previously issued finger.exe DNS queries, what programs and users drove them, and does this alert fit?
  context: >-
    The query mirrors the rule's firing pattern scoped to this host, so the program and user
    distribution reflects how finger.exe lookups have historically occurred here rather than
    generic binary usage. A new acting program process, an unexpected user account, or an
    unusual invocation is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: dns_query
    detection:
      selection:
        Image|endswith: \finger.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating surrounding process activity surfaces novel parent-child
    pairs, such as a renamed curl binary reaching out, archive extraction, or a scripting interpreter
    launch, that reveal whether the finger lookup was one step in a larger sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host, such as social-engineering delivery, reconnaissance, or execution,
    may reveal the stages that preceded the finger lookup and help reconstruct the full timeline of the
    activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts issued finger.exe DNS queries in the past week, and does the spread look like automation or one-off activity?
  context: >-
    The query counts the rule's firing pattern fleet-wide with no host scope. Many hosts resolving
    finger-server domains at once suggests a broad social-engineering lure or scripted deployment, while a
    single host or a small unrelated set points to targeted manual activity. Use the spread and parent
    consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: dns_query
    detection:
      selection:
        Image|endswith: \finger.exe
      condition: selection
    fields:
    - host.name
