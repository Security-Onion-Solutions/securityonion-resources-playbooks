name: Potentially Suspicious NTFS Symlink Behavior Modification
id: d5e9cb6e-70b9-4e36-bf2f-a6b54b9b26e9
description: |
  Detects a command interpreter (cmd.exe, powershell.exe, or pwsh.exe) running 'fsutil behavior set SymlinkEvaluation'
  with R2L:1, R2R:1, or L2L:1 to widen which symbolic-link traversal classes NTFS permits. By default remote-to-local
  and remote-to-remote symlink resolution is restricted; enabling these loosens the system's tolerance of cross-host
  and cross-volume link traversal. Legitimate use is rare and usually tied to a specific storage or application
  requirement, so context matters. The same configuration change is used ahead of mass file encryption so the encryptor
  can follow links across volumes and hosts, and frequently appears alongside shadow-copy deletion, log clearing, and
  SMB-based propagation. Confirm the exact command, who ran it, what spawned the shell, and whether file-impact or
  defense-tampering activity surrounds it.
type: detection
detection_id: c0b2768a-dd06-4671-8339-b16ca8d1f27f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line show fsutil setting SymlinkEvaluation to R2L:1, R2R:1, or L2L:1 from a command shell?
  context: Confirm the alert is a true positive by reviewing the triggering event. The rule fires when cmd.exe, powershell.exe,
    or pwsh.exe runs a command line containing all of "fsutil", "behavior", "set", and "SymlinkEvaluation" together with one
    of the symlink-class flags. Verify the binary, its original filename, and the exact flag that was enabled.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to modify NTFS symlink-evaluation behavior?
  context: Changing symlink-evaluation classes is an uncommon, privileged storage-configuration action. Knowing whether the
    user role and host function involve NTFS volume administration is often the fastest way to separate a legitimate change
    from operator preparation. Most endpoints and most users never have a reason to loosen remote symlink resolution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which symlink-traversal classes were enabled, and were any other fsutil behavior settings changed in the same window?
  context: The full command line reveals the specific configuration change. R2L:1 and R2R:1 enable remote-to-local and remote-to-remote
    link resolution; L2L:1 affects local-to-local. Decode each flag and check whether the same shell also changed other fsutil
    behavior keys such as disablelastaccess (suppresses last-access forensic timestamps) or disabledeletenotify. The query
    scopes to fsutil behavior commands on this host so multiple sequential invocations that form one logical operation are
    visible together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
          - fsutil
          - behavior
          - set
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - User
- question: If the change ran through PowerShell, did script block logging capture the full fsutil invocation?
  context: When the shell is powershell.exe or pwsh.exe, Event ID 4104 records the deobfuscated script content actually executed,
    which is ground truth even if the command line was wrapped or built from concatenated strings. If PowerShell operational
    logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence nothing ran. For
    a cmd.exe-launched change this source will not apply.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: What process spawned this command shell, and is that parent chain expected?
  context: The parent reveals how the shell was invoked. A human-driven change typically descends from explorer.exe or an
    interactive console; an interactive remote-access session, a script host, or an unexpected service parent points toward
    hands-on-keyboard operator activity. Walk up the tree to see what launched the parent and what else it spawned.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did file creation or modification activity on remote shares or across volumes follow the symlink-evaluation change on this host?
  context: Widening symlink evaluation is a means to an end. The payoff stage is file access that follows links across volume
    or host boundaries that NTFS would otherwise block, which on this host shows up as a burst of file writes or modifications
    shortly after the change. A cluster of file events under UNC or non-system-drive paths after the fsutil command points
    to successful use of the loosened traversal; little or no following file activity weakens the impact-preparation reading.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - User
      - EventType
- question: What other processes did this command shell spawn afterward?
  context: The processes spawned by the shell after the configuration change reveal the operation's actual direction. Shadow-copy
    deletion (vssadmin, wmic shadowcopy), service stops, log clearing (wevtutil), SMB propagation, or an unfamiliar payload
    binary launching shortly after the symlink change all point toward impact preparation rather than a one-off administrative
    tweak.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run fsutil at all?
  context: fsutil is a privileged NTFS configuration tool that most endpoints rarely or never invoke interactively. Zero or
    very low historical counts indicate first-time or rare execution and raise suspicion; a host with a steady history of fsutil
    use may be a storage or build server where the tool is part of normal administration.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously run this fsutil SymlinkEvaluation pattern, what parents and users drove it, and does the current alert fit?
  context: Even routine tools get abused. This query mirrors the rule's detection structure scoped to this host, so the parent/user
    distribution reflects how this specific firing pattern (not generic shell usage) has historically run here. A new parent
    process, an unexpected user account, or a first-ever occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img_proxy:
      - Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - Cmd.Exe
        - PowerShell.EXE
        - pwsh.dll
      selection_fsutil_cli:
        CommandLine|contains|all:
        - fsutil
        - behavior
        - set
        - SymlinkEvaluation
      selection_symlink_params:
        CommandLine|contains:
        - R2L:1
        - R2R:1
        - L2L:1
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts run this fsutil SymlinkEvaluation pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: This query mirrors the rule's detection structure with no host scope, giving a fleet-wide count of this specific
    firing pattern rather than generic fsutil usage. Many hosts changing symlink evaluation in the same window points to scripted
    or pushed deployment, which during an active operation can be the encryptor propagating; a single host or a small unrelated
    set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img_proxy:
      - Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - Cmd.Exe
        - PowerShell.EXE
        - pwsh.dll
      selection_fsutil_cli:
        CommandLine|contains|all:
        - fsutil
        - behavior
        - set
        - SymlinkEvaluation
      selection_symlink_params:
        CommandLine|contains:
        - R2L:1
        - R2R:1
        - L2L:1
      condition: all of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img_proxy:
      - Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - Cmd.Exe
        - PowerShell.EXE
        - pwsh.dll
      selection_fsutil_cli:
        CommandLine|contains|all:
        - fsutil
        - behavior
        - set
        - SymlinkEvaluation
      selection_symlink_params:
        CommandLine|contains:
        - R2L:1
        - R2R:1
        - L2L:1
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img_proxy:
      - Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - Cmd.Exe
        - PowerShell.EXE
        - pwsh.dll
      selection_fsutil_cli:
        CommandLine|contains|all:
        - fsutil
        - behavior
        - set
        - SymlinkEvaluation
      selection_symlink_params:
        CommandLine|contains:
        - R2L:1
        - R2R:1
        - L2L:1
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints.
    If the same user triggered similar configuration changes or hands-on activity on multiple hosts, the scope of the operation
    may be larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img_proxy:
      - Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - Cmd.Exe
        - PowerShell.EXE
        - pwsh.dll
      selection_fsutil_cli:
        CommandLine|contains|all:
        - fsutil
        - behavior
        - set
        - SymlinkEvaluation
      selection_symlink_params:
        CommandLine|contains:
        - R2L:1
        - R2R:1
        - L2L:1
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led to the change and what followed
    it, and whether it is part of a larger sequence. Look for reconnaissance, credential access, service stops, shadow-copy
    deletion, or staging that surrounds the symlink change.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host such as defense tampering, reconnaissance,
    or credential access may reveal the stages that preceded this change and help reconstruct the timeline. Loosening symlink
    evaluation late in a sequence that already shows credential access or defense tampering is a stronger impact-preparation
    signal than an isolated change.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
