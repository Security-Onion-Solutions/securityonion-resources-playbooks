name: Registry Modification for OCI DLL Redirection
id: d82281a9-f309-41f9-9c07-6f4a2e14941f
description: |
  Detects modifications to the MSDTC service MTxOCI registry values (OracleOciLib or
  OracleOciLibPath) that redirect the DLL the service loads away from its default. The rule
  fires when OracleOciLib is set to a filename other than oci.dll, OR when OracleOciLibPath is
  set to a path outside %SystemRoot%\System32\ — either change points MSDTC at an attacker-chosen
  library. This is a DLL redirection (phantom hijacking) technique used for persistence,
  privilege escalation, and defense evasion: on the next MSDTC start the redirected library
  executes in the service context. The investigation should confirm which value changed, decode
  the redirected path, verify whether that DLL exists on disk, and determine whether MSDTC
  loaded and ran it.
type: detection
detection_id: c0e0bdec-3e3d-47aa-9974-05539c999c89
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: 'Do the MSDTC registry value and its data match what this rule detects, and which branch fired?'
  context: 'The rule fires on either of two MSDTC MTxOCI value changes: OracleOciLib set to a filename other than oci.dll, or OracleOciLibPath set to a path outside %SystemRoot%\System32\. Confirm the exact TargetObject and its Details value, and note which of the two values changed — the branch determines whether the redirection swaps the DLL name or the load path. Both point the MSDTC service at an attacker-chosen library.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: 'Is this user and host expected to modify MSDTC service configuration keys?'
  context: 'MSDTC MTxOCI values are set at Oracle client install or MSDTC configuration time and rarely change afterward on a running host. Confirm whether the writing process (Image) and account are consistent with a legitimate installer or administrator. User attribution is present on roughly 94% of endpoint registry events; when it is a machine account or missing, judge legitimacy from the writing process instead.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: 'Was there a change ticket, maintenance window, or documented approval for this MSDTC configuration change?'
  context: 'MSDTC and Oracle client changes are typically driven by a documented deployment or maintenance activity. A corresponding ticket suggests authorized work; absence of one when policy requires it points toward an unauthorized redirection of the service DLL.'
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: 'Which MTxOCI value was modified, and does the change move MSDTC off its default DLL or path?'
  context: 'OracleOciLib holds the filename MSDTC loads (default oci.dll) and OracleOciLibPath holds the directory it loads from (default %SystemRoot%\System32\). A value naming a different DLL, or a path outside System32, redirects the service to an attacker-controlled library. Use the exact key path and Details value to judge whether this is a benign Oracle client setting or a redirection.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: 'What DLL name or path was written to the value, and where does it resolve on disk?'
  context: 'The Details value is the redirected target. For OracleOciLib it is a DLL filename; for OracleOciLibPath it is a directory. Resolve the two together into a full path and check whether it lands outside %SystemRoot%\System32\ or names something other than oci.dll (for example evil.dll or a path under a user-writable or temp directory). That resolved path becomes the malicious DLL to hunt for on disk and in module-load telemetry.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: 'Is this MSDTC key change persistent, and was the value later changed again on this host?'
  context: 'MSDTC redirection persists across reboots because the service reads these values on every start, so the redirection stays active until the value is restored. Registry key and value deletion events are not emitted by endpoint telemetry in this environment, so attacker cleanup of the key is not directly observable — judge persistence from the value re-modification history over a longer window and from whether the configured DLL executed, rather than from whether the key was removed.'
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: 'Was the redirected DLL actually written to disk by the process that made the registry change?'
  context: 'The redirection is only effective if the DLL named in the value exists at the resolved path. Correlating file writes by the registry-writing process and its children finds the payload landing in the same session as the registry change. The file-write event carries no hash; if the DLL is present, hash it from a later execution or retrieve it for a reputation lookup.'
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: 'After the change, what DLLs did the MSDTC service load, and did any resolve outside System32 or to a name other than oci.dll?'
  context: 'The redirection only executes when MSDTC restarts and loads the module named in OracleOciLib from OracleOciLibPath. Reviewing msdtc.exe module loads on the host shows whether the service pulled in a non-standard library. Compare the loaded module path against the redirected value, and check the signer and signature status — an unsigned or unexpectedly signed module loaded into MSDTC is the execution of the redirected DLL.'
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\msdtc.exe'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
- question: 'Did the MSDTC service run its redirected DLL and spawn any child processes after the change?'
  context: 'A malicious library loaded into MSDTC runs in the service context and may spawn follow-on processes for command execution, discovery, or credential access. Child processes of msdtc.exe after the registry change indicate the redirected DLL executed and the persistence is active rather than dormant.'
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\msdtc.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: 'Were other registry modifications made on this host in the same session?'
  context: 'An actor who redirects the MSDTC DLL often makes other changes in the same window — additional service or persistence keys, security-tool settings, or firewall rules. Registry modifications on this host around the same time, grouped by key path and writing process, reveal the full scope of the configuration changes and whether multiple objectives were pursued.'
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: 'Has this MSDTC MTxOCI value been modified before on this host?'
  context: 'These values normally change only at Oracle client install or MSDTC setup and then stay stable. A history showing the value set once long ago (or never) makes a fresh change more suspicious; frequent recent changes may indicate repeated tampering. Compare the historical Details values to see whether the same DLL was always configured or the target just changed.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: 'Was this MTxOCI value modified on other hosts in the environment?'
  context: 'The same redirection across multiple hosts may indicate a deployment, a GPO change, or a spreading intrusion; a single-host change is more likely targeted. Compare the Details values across hosts — a consistent legitimate DLL path points to normal configuration, while varied or non-standard paths point to hands-on tampering.'
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: 'What process made the registry change, and what started that process?'
  context: 'The writing process and its parent reveal how the redirection was introduced. A legitimate installer or configuration tool launched from an interactive session looks different from reg.exe, powershell.exe, or an unknown binary launched by a script host or an unexpected parent. Tracing the parent origin distinguishes an installer-driven change from hands-on tampering.'
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: 'What other process activity occurred on this host around the time of the alert?'
  context: 'Alerts rarely occur in isolation. Process activity around the registry change reveals what led to it and what followed — reconnaissance, DLL staging, or service manipulation. Aggregating by process and parent collapses routine agent telemetry into high-count rows while novel parent-child pairs stand out at low counts.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: 'Did other detections fire on this host in the hours before this alert?'
  context: 'Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the attack stages that preceded the DLL redirection and help reconstruct the timeline. The sequence of alerts often tells the story leading up to a persistence change.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
