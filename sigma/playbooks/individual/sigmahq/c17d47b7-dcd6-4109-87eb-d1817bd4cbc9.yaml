name: Windows Credential Guard Registry Tampering Via CommandLine
id: 68bacf11-1caf-4722-8352-63f4e9123a85
description: |
  Detects command-line registry edits that target Windows Credential Guard configuration, run through reg.exe or PowerShell.
  The rule fires only when a single command combines all of: a matching binary (powershell.exe, pwsh.exe, or reg.exe), a
  registry write/delete verb (add, delete, Set-ItemProperty, New-ItemProperty, Remove-ItemProperty, or their aliases), a
  DeviceGuard or LSA registry path, and a Credential Guard value name (EnableVirtualizationBasedSecurity,
  RequirePlatformSecurityFeatures, or LsaCfgFlags).
  Credential Guard isolates secrets such as NTLM hashes and Kerberos tickets using virtualization-based security; setting
  LsaCfgFlags to 0 (or weakening the related VBS values) turns that isolation off, exposing those secrets to local theft.
  Legitimate hits come from imaging, GPO/MDM hardening rollouts, or deliberate admin reconfiguration; malicious hits weaken
  credential protection ahead of credential access and lateral movement. The investigation should confirm the exact value
  and data written, who and what drove it, and whether other defense-weakening activity surrounds it.
type: detection
detection_id: c17d47b7-dcd6-4109-87eb-d1817bd4cbc9
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line match this rule's pattern — a Credential Guard registry value being added, modified, or deleted via reg.exe or PowerShell?
  context: Confirm the alert is a true positive. The rule fires only when the command combines a matching binary, a write/delete verb, a DeviceGuard or LSA registry path, and one of the Credential Guard value names (EnableVirtualizationBasedSecurity, RequirePlatformSecurityFeatures, LsaCfgFlags). Verify all four elements are present in the exact command line and note which value is targeted.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to reconfigure Credential Guard or virtualization-based security settings?
  context: Credential Guard and VBS settings are normally changed only during imaging, hardening rollouts, or deliberate admin reconfiguration. A user or host with no reason to touch these values is the fastest signal that the change is unexpected.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exact Credential Guard value and data were written, and does the data disable protection?
  context: The value name and data determine impact. LsaCfgFlags set to 0 disables Credential Guard; EnableVirtualizationBasedSecurity or RequirePlatformSecurityFeatures set to 0 weakens the VBS foundation it relies on. Read the full reg.exe or PowerShell arguments (or the linked registry_set event) to capture the precise key path under \Control\DeviceGuard, \Control\LSA, or Software\Policies\Microsoft\Windows\DeviceGuard, the value name, and the data written. A delete of the value reverts to default and can also weaken the configuration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Which Credential Guard control was targeted, and was it disabled, weakened, or removed?
  context: Distinguish the specific outcome. Setting LsaCfgFlags to 0 disables Credential Guard outright; clearing RequirePlatformSecurityFeatures or EnableVirtualizationBasedSecurity removes platform-security enforcement; deleting the value reverts to the platform default. Each outcome has a different effect on whether NTLM hashes and Kerberos tickets remain isolated. The command line shows which value and verb were used.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: If PowerShell drove the change, was the command encoded or obfuscated, and what does it decode to?
  context: When the binary is powershell.exe or pwsh.exe, the registry write can be hidden behind -EncodedCommand (-enc) base64, string concatenation, backtick escaping, or variable substitution. Decode the command to confirm it is the Set-ItemProperty / New-ItemProperty / Remove-ItemProperty operation the rule matched, and check whether the same script performs additional actions beyond the single registry value. If reg.exe drove the change, the command is already plain text and this step confirms there is no further encoded payload.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned this reg.exe or PowerShell instance, and is that parent chain expected?
  context: The parent reveals how the registry edit was invoked. Imaging and GPO/MDM rollouts have predictable parents such as services or management agents. Parents like cmd.exe launched interactively, mshta.exe, wscript.exe, or an Office application point to hands-on-keyboard or scripted abuse. Walk up to the parent's own parent if the immediate parent is itself a shell.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Is Credential Guard currently running on this host, or does it remain disabled?
  context: The tampering may be momentary or persistent. Check the host's current Credential Guard / VBS state to determine whether secrets are still exposed. If LsaCfgFlags remains 0 or the VBS values remain cleared, credentials stay unprotected and the control should be restored before further investigation. Current state is read from the host or endpoint console, not from the alerting event.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What activity occurred on this host after the Credential Guard change?
  context: Disabling Credential Guard exposes cached NTLM hashes and Kerberos tickets to local theft. Examine process activity in the window after the change for credential-access tooling, LSASS access, or lateral-movement utilities — the actions the weakened protection was meant to enable. A burst of new activity immediately after the change points to the change being a precursor rather than routine reconfiguration.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense-tampering actions performed on this host around the same time?
  context: Operators who weaken one control often weaken several — disabling Defender, clearing event logs, deleting shadow copies, or stopping security services alongside the Credential Guard change. Finding multiple tampering events from the same user or parent within a short window indicates a coordinated effort to lower defenses rather than an isolated configuration edit.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Were other registry modifications made on this host in the same session?
  context: A single tampering operation often touches several keys — weakening Credential Guard alongside setting a Run key for persistence or disabling Defender via the registry. Reviewing other reg.exe and regedit.exe write operations from the same user within the window reveals whether multiple configuration changes were pursued together.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- question: When this host has previously fired this Credential Guard tampering pattern, what parents and users drove it, and does the current alert fit?
  context: Even legitimate hardening tools can match this pattern. The query mirrors the rule's full selection scoped to this host, so the parent/user distribution reflects how this specific firing pattern — not generic reg.exe or PowerShell usage — has historically run here. A new parent process, an unexpected user account, or a one-off appearance against a history of scheduled management activity is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \reg.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
        - reg.exe
      selection_cli:
        CommandLine|contains:
        - 'add '
        - 'New-ItemProperty '
        - 'Set-ItemProperty '
        - 'si '
        - 'delete '
        - 'del '
        - 'Remove-ItemProperty '
        - 'rp '
      selection_key_base:
        CommandLine|contains:
        - \Control\DeviceGuard
        - \Control\LSA
        - Software\Policies\Microsoft\Windows\DeviceGuard
      selection_key_specific:
        CommandLine|contains:
        - EnableVirtualizationBasedSecurity
        - RequirePlatformSecurityFeatures
        - LsaCfgFlags
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \reg.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
        - reg.exe
      selection_cli:
        CommandLine|contains:
        - 'add '
        - 'New-ItemProperty '
        - 'Set-ItemProperty '
        - 'si '
        - 'delete '
        - 'del '
        - 'Remove-ItemProperty '
        - 'rp '
      selection_key_base:
        CommandLine|contains:
        - \Control\DeviceGuard
        - \Control\LSA
        - Software\Policies\Microsoft\Windows\DeviceGuard
      selection_key_specific:
        CommandLine|contains:
        - EnableVirtualizationBasedSecurity
        - RequirePlatformSecurityFeatures
        - LsaCfgFlags
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \reg.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
        - reg.exe
      selection_cli:
        CommandLine|contains:
        - 'add '
        - 'New-ItemProperty '
        - 'Set-ItemProperty '
        - 'si '
        - 'delete '
        - 'del '
        - 'Remove-ItemProperty '
        - 'rp '
      selection_key_base:
        CommandLine|contains:
        - \Control\DeviceGuard
        - \Control\LSA
        - Software\Policies\Microsoft\Windows\DeviceGuard
      selection_key_specific:
        CommandLine|contains:
        - EnableVirtualizationBasedSecurity
        - RequirePlatformSecurityFeatures
        - LsaCfgFlags
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around this time?
  context: Tracking the acting user's activity across all hosts in the window reveals whether the Credential Guard change is isolated or part of broader hands-on activity. The same user weakening protection on multiple hosts widens the likely scope.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \reg.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
        - reg.exe
      selection_cli:
        CommandLine|contains:
        - 'add '
        - 'New-ItemProperty '
        - 'Set-ItemProperty '
        - 'si '
        - 'delete '
        - 'del '
        - 'Remove-ItemProperty '
        - 'rp '
      selection_key_base:
        CommandLine|contains:
        - \Control\DeviceGuard
        - \Control\LSA
        - Software\Policies\Microsoft\Windows\DeviceGuard
      selection_key_specific:
        CommandLine|contains:
        - EnableVirtualizationBasedSecurity
        - RequirePlatformSecurityFeatures
        - LsaCfgFlags
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Tampering rarely happens in isolation. Earlier detections on the same host — reconnaissance, execution, or other defense-evasion activity — may reveal the stages that preceded the Credential Guard change and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired this Credential Guard tampering pattern in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's full selection with no host scope, so the result is a fleet-wide count of this specific firing pattern rather than generic reg.exe or PowerShell usage. Many hosts firing the same pattern points to a scripted hardening or imaging rollout; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \reg.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
        - reg.exe
      selection_cli:
        CommandLine|contains:
        - 'add '
        - 'New-ItemProperty '
        - 'Set-ItemProperty '
        - 'si '
        - 'delete '
        - 'del '
        - 'Remove-ItemProperty '
        - 'rp '
      selection_key_base:
        CommandLine|contains:
        - \Control\DeviceGuard
        - \Control\LSA
        - Software\Policies\Microsoft\Windows\DeviceGuard
      selection_key_specific:
        CommandLine|contains:
        - EnableVirtualizationBasedSecurity
        - RequirePlatformSecurityFeatures
        - LsaCfgFlags
      condition: all of selection_*
    fields:
    - host.name
