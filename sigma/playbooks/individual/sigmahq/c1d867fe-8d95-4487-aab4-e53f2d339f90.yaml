name: Renamed Sysinternals Sdelete Execution
id: a6ad7325-3f70-42dd-8f36-84184a22837a
description: |
  Detects a process whose PE metadata identifies it as SysInternals SDelete (OriginalFileName "sdelete.exe") while the
  on-disk name is something other than sdelete.exe or sdelete64.exe. SDelete is a legitimate secure-deletion utility that
  overwrites file contents to the DoD 5220.22-M pattern and renames each target 26 times before unlinking it, but it is
  also renamed and used by destruction-oriented operators to wipe victim files, dropped tooling, and logs while evading
  name-based detection. Determine whether the renamed copy and its execution context are consistent with sanctioned
  administrative wiping, or whether the deletion/overwrite activity is part of impact-stage data destruction.
type: detection
detection_id: c1d867fe-8d95-4487-aab4-e53f2d339f90
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the executing binary carry the SDelete OriginalFileName while running under a non-standard on-disk name?
  context: Confirm the alert is a true positive before investing investigation time. The rule fires when the PE
    OriginalFileName resolves to sdelete.exe AND the image on disk is named something other than sdelete.exe or
    sdelete64.exe. Review the alerting event and verify both halves hold for this process.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - OriginalFileName
- question: What is the actual identity of this binary based on its metadata and hash?
  context: When SDelete is renamed, the PE metadata (OriginalFileName sdelete.exe) and the code-signing chain still reflect
    the original Microsoft Sysinternals tool even though the name on disk differs. Compare the Image path against
    OriginalFileName to confirm the mismatch, and use the signing status and file hash to determine whether this is an
    unmodified Microsoft-signed SDelete copy, a tampered build, or an unrelated binary impersonating the metadata.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: What exactly did this renamed SDelete invocation do? Decode the full command line and its flags.
  context: The command line reveals the deletion scope and aggressiveness. Decode each flag and target. Notable switches
    are -s (recurse subdirectories), -r (clear read-only), -p N (overwrite passes, default 1), -c (clean free space), -z
    (zero free space), -q (quiet), and -nobanner. A bare drive letter or a recursive path target indicates broad wiping;
    free-space cleansing (-c/-z) is an anti-forensic pattern aimed at destroying already-deleted content. Pull every
    SDelete-identity execution on this host in the window, since wiping operations often run as multiple sequential
    invocations that together form one logical operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is this user and host expected to securely wipe files or free space with a renamed deletion utility?
  context: Legitimate secure-deletion activity is usually tied to a known administrative or decommissioning workflow on a
    specific role of host. Knowing whether the user role and host function are consistent with running a renamed SDelete
    copy is often the fastest way to separate sanctioned wiping from impact-stage destruction. The deliberate renaming
    itself is unusual for routine administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: How did this renamed SDelete binary arrive on the host?
  context: A renamed copy of SDelete does not appear spontaneously. Tracing the file-creation event for this binary by
    basename over a long window reveals the delivery mechanism, such as a download tool, an archive extraction, a manual
    copy via remote access, or a malware dropper. A copy that landed in a user-writable location (Desktop, Downloads,
    Temp, AppData) was likely staged for this operation; one placed by an installer in a system directory may reflect a
    sanctioned deployment.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What process spawned this renamed SDelete and is that parent chain expected?
  context: The parent process shows how the wiping tool was invoked. Interactive administrative use typically descends from
    explorer.exe or a console shell, while invocation from a script host, a remote-execution service, or an Office
    application points to automated or operator-driven destruction. Walk up to the parent to see what launched it and what
    else it spawned.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What files did this process delete or rename on the host, and do they form a mass-overwrite pattern?
  context: SDelete renames each target file 26 times (AAA.AAA, BBB.BBB ... ZZZ.ZZZ) before unlinking it, so a single wipe
    produces a dense burst of rename and delete events on the filesystem. A high volume of deletions concentrated in
    sensitive locations such as System32, user document directories, database paths, or backup/log directories indicates
    destruction of data rather than cleanup of one stray file. Correlate the deletion timing with the alerting process to
    confirm this binary is the deleter.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: file_delete
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
- question: What other destructive or recovery-inhibiting actions occurred on this host?
  context: 'Destruction-stage operators typically chain several actions: wiping files, deleting shadow copies, disabling
    recovery, stopping security services, and clearing event logs. Finding the complete set of destructive commands around
    the alert reveals whether the renamed SDelete run is one isolated administrative action or part of a coordinated impact
    sequence. A shared parent across these commands points to scripted execution.'
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_destructive:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\cipher.exe'
          - '\fsutil.exe'
          - '\icacls.exe'
          - '\takeown.exe'
          - '\attrib.exe'
          - '\sc.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\powershell.exe'
          - '\taskkill.exe'
      condition: selection and selection_destructive
    fields:
      - Image
      - User
- question: What recovery-inhibiting commands were executed on this host?
  context: 'Destruction operators chain multiple recovery-inhibiting commands: deleting shadow copies (vssadmin, wmic),
    disabling boot recovery (bcdedit), deleting backups (wbadmin), corrupting boot.ini, and disabling the Windows Recovery
    Environment (reagentc). This query surfaces those commands on the host so the analyst can gauge the full scope of
    recovery destruction, then verify whether each action succeeded by checking system state (vssadmin list shadows,
    bcdedit /enum, reagentc /info).'
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\reagentc.exe'
          - '\diskshadow.exe'
      selection_cmdline:
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'recoveryenabled'
          - 'bootstatuspolicy'
          - 'delete catalog'
          - 'delete systemstatebackup'
          - 'boot.ini'
          - 'winre.wim'
          - '/disable'
      condition: selection and (selection_recovery or selection_cmdline)
    fields:
      - Image
      - CommandLine
- question: Are there signs of file encryption, ransom notes, or unknown binary execution on this host after the wipe?
  context: Secure-deletion and recovery destruction frequently precede or accompany file encryption by minutes. Checking
    for unknown or suspicious binaries executing after the destructive action, especially from temp or user-writable
    paths, determines whether an encryption phase followed the wipe. The analyst should also check for ransom notes
    (README, HOW_TO_DECRYPT, unusual file extensions) via file-creation events or the endpoint console.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_known:
        Image|startswith:
          - 'C:\Program Files'
          - 'C:\Windows\System32\svchost'
          - 'C:\Windows\System32\wbem'
      condition: selection and not filter_known
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: When this host previously fired this renamed-SDelete pattern, what parents and users drove it, and does the
    current alert fit?
  context: Even legitimate tools get abused. This query mirrors the rule's selection (SDelete OriginalFileName, excluding
    the canonical sdelete.exe/sdelete64.exe names) scoped to this host, so the resulting parent and user distribution
    reflects how this specific firing pattern has historically run here rather than generic binary usage. A new parent
    process, an unexpected user account, or a first-time appearance is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName: sdelete.exe
      filter:
        Image|endswith:
        - \sdelete.exe
        - \sdelete64.exe
        - \sdelete64a.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName: sdelete.exe
      filter:
        Image|endswith:
        - \sdelete.exe
        - \sdelete64.exe
        - \sdelete64a.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName: sdelete.exe
      filter:
        Image|endswith:
        - \sdelete.exe
        - \sdelete64.exe
        - \sdelete64a.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether destruction is isolated to one endpoint or spans
    several. The same user triggering wiping or destructive activity on multiple hosts in the window widens the scope of
    compromise and the containment footprint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName: sdelete.exe
      filter:
        Image|endswith:
        - \sdelete.exe
        - \sdelete64.exe
        - \sdelete64a.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: Is this same renamed-SDelete detection firing on other hosts in the environment?
  context: Destruction operations often execute the same sequence across many hosts simultaneously or in rapid succession.
    Finding this same detection on multiple hosts indicates network-wide execution and determines the scope for
    containment and incident response. The first-to-last detection timeline reveals the spread pattern.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
- question: What did this renamed binary do after execution, and is the same renamed copy present on other hosts?
  context: The point of renaming a tool is to keep performing its function while evading name-based detection. Examining
    the child processes and follow-on activity spawned by this binary reveals what the wiping operation actually touched,
    and the same renamed copy appearing on multiple hosts suggests deliberate distribution rather than an isolated
    incident.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
