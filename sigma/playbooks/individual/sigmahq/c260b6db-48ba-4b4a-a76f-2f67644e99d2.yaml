name: HackTool - Covenant PowerShell Launcher
id: 85e00a07-ee5d-461a-9311-4998bafbf2b8
description: |
  Detects command lines characteristic of the Covenant C2 framework's PowerShell launcher. The rule fires when EITHER a hidden, no-profile PowerShell launch carries an inline or encoded command (the -Sta -Nop -Window Hidden flag combination paired with -Command or -EncodedCommand), OR the command line contains a Covenant-specific signature such as the GruntHTTP stager string, an mshta file.hta launch, the in-memory MemoryStream assignment, or a known encoded payload prefix. Legitimate hidden encoded PowerShell does occur (installers, packaged automation, management agents), so confirm which branch fired, decode the payload, and check whether the user, host, and parent process are expected to run launchers formatted like this. Malicious use loads a .NET implant in memory, so corroborate with script block logging and loaded-assembly evidence rather than relying on the command line alone.
type: detection
detection_id: c260b6db-48ba-4b4a-a76f-2f67644e99d2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line match either branch this rule detects?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires on EITHER of two branches, and which one
    matched changes what to look at next. Branch one is a hidden, no-profile PowerShell launch carrying a command -- the
    flags -Sta, -Nop, and -Window Hidden together with -Command or -EncodedCommand. Branch two is a Covenant-specific
    signature in the command line such as the GruntHTTP stager string, an mshta file.hta launch, the in-memory
    MemoryStream assignment, or a known encoded payload prefix. Read the full command line and note which branch fired;
    the signature branch is far more specific to the framework than the generic hidden-launch branch.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to launch hidden or encoded PowerShell of this kind?
  context: >-
    Legitimate administrative tooling, installers, and packaged automation sometimes launch PowerShell with hidden
    windows and encoded commands. Knowing whether this user role and host function normally run launchers formatted like
    this is often the fastest way to separate a true positive from routine operations. A workstation belonging to a
    developer or an administrator differs sharply from a server or a kiosk that should never see hand-driven PowerShell.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this launch part of an authorized penetration test or red team engagement?
  context: >-
    Covenant is an open-source command-and-control framework used in authorized security assessments as well as by
    adversaries. Before investing further analysis, check whether a penetration test or red team exercise is active on
    this host or network segment. An authorized engagement whose tooling and timing match resolves the alert without
    deeper investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which Covenant launcher variant and capability does the command line indicate?
  context: >-
    The launcher command line reveals how the implant is being staged. The MemoryStream assignment and known encoded
    prefix indicate an in-memory .NET stager, the GruntHTTP string indicates an HTTP Grunt implant, and an mshta
    file.hta launch indicates an HTA-delivered stage. Identifying the variant determines what the implant can do once
    resident and determines the scope of the response.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Was the command encoded, and what does the decoded payload do?
  context: >-
    The -EncodedCommand parameter and the known encoded prefix in the signature branch carry a base64 payload that hides
    the actual instructions. Decode it to recover the real script. Covenant launchers typically reconstruct a byte
    stream in memory and load a .NET assembly with no file written to disk, so look for download cradles, MemoryStream
    or assembly-load logic, and any callback host inside the decoded text.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did the launching process load the .NET runtime or PowerShell automation assemblies in memory?
  context: >-
    A Covenant launcher reflectively loads a .NET implant into the running process rather than writing an executable to
    disk, so image-load evidence is often the clearest artifact of in-memory execution. The common language runtime and
    the PowerShell automation assembly loading into a process that does not normally host managed code, or loading
    shortly after the alerting command line, corroborates fileless .NET execution that the command line alone cannot
    confirm. If image-load events are not collected in this environment, treat the absence of results as a visibility
    gap rather than evidence nothing loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_modules:
        ImageLoaded|endswith:
          - '\clr.dll'
          - '\clrjit.dll'
          - '\mscoree.dll'
          - '\System.Management.Automation.dll'
          - '\System.Management.Automation.ni.dll'
          - '\amsi.dll'
      condition: selection and selection_modules
    fields:
      - Image
      - ImageLoaded
- question: Did PowerShell script block logging capture the deobfuscated script content?
  context: >-
    Script block logging records the script content PowerShell actually executed, even when the command line was
    encoded or obfuscated, giving ground truth about what ran. For an in-memory Covenant stager this often exposes the
    assembly-load or download-cradle logic the encoded command hid. If PowerShell operational logs are not ingested in
    this environment, treat the absence of results as a visibility gap worth recording rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell security controls bypassed or weakened on this host before the launch?
  context: >-
    Operators frequently disable or evade PowerShell defenses before staging a payload. Common precursors include AMSI
    patching, execution-policy bypass flags, real-time monitoring being turned off, and PowerShell version-2 downgrade
    to escape script block logging. Finding these in the hour before the alert strengthens the case that the hidden
    encoded launch was preparation for an implant rather than benign automation.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: What process spawned this launcher, and is that parent chain expected?
  context: >-
    The parent process reveals how the launcher was invoked. A launch from explorer.exe or a management agent differs
    sharply from one spawned by an Office application, mshta.exe, wscript.exe, or a browser, which point to macro or
    document-delivered execution. Walk up the tree to see what started the parent and what else it spawned.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did this launcher spawn afterward?
  context: >-
    The processes a launcher spawns reveal its actual impact. An in-memory implant may spawn cmd.exe, additional
    PowerShell, rundll32, or network utilities for discovery and lateral movement, or it may inject and spawn nothing
    visible. Reviewing the children of the alerting process shows whether post-exploitation activity followed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host previously fired this launcher pattern, what parents and users drove it, and does the current alert fit?
  context: >-
    The query mirrors the rule's own selection structure scoped to this host, so the resulting parent and user
    distribution reflects how this specific launcher pattern -- not generic PowerShell usage -- has historically run
    here. A new parent process, an unexpected account, or a first-time appearance of the pattern is the deviation worth
    chasing; a parent and user that already account for prior firings point toward established automation.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        CommandLine|contains|all:
        - -Sta
        - -Nop
        - -Window
        - Hidden
        CommandLine|contains:
        - -Command
        - -EncodedCommand
      selection_2:
        CommandLine|contains:
        - 'sv o (New-Object IO.MemorySteam);sv d '
        - mshta file.hta
        - GruntHTTP
        - -EncodedCommand cwB2ACAAbwAgA
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        CommandLine|contains|all:
        - -Sta
        - -Nop
        - -Window
        - Hidden
        CommandLine|contains:
        - -Command
        - -EncodedCommand
      selection_2:
        CommandLine|contains:
        - 'sv o (New-Object IO.MemorySteam);sv d '
        - mshta file.hta
        - GruntHTTP
        - -EncodedCommand cwB2ACAAbwAgA
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        CommandLine|contains|all:
        - -Sta
        - -Nop
        - -Window
        - Hidden
        CommandLine|contains:
        - -Command
        - -EncodedCommand
      selection_2:
        CommandLine|contains:
        - 'sv o (New-Object IO.MemorySteam);sv d '
        - mshta file.hta
        - GruntHTTP
        - -EncodedCommand cwB2ACAAbwAgA
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts in the surrounding window reveals lateral movement or staging across
    multiple endpoints. If the same account drove similar activity elsewhere at the same time, the scope of the incident
    may be larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        CommandLine|contains|all:
        - -Sta
        - -Nop
        - -Window
        - Hidden
        CommandLine|contains:
        - -Command
        - -EncodedCommand
      selection_2:
        CommandLine|contains:
        - 'sv o (New-Object IO.MemorySteam);sv d '
        - mshta file.hta
        - GruntHTTP
        - -EncodedCommand cwB2ACAAbwAgA
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining the process activity surrounding the alert reveals what led to this
    launch, what followed it, and whether it is part of a larger sequence. Novel parent-child pairs at low counts stand
    out against repetitive agent telemetry; look for reconnaissance, privilege escalation, or persistence around the
    same minutes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host -- defense tampering, reconnaissance, credential access -- may reveal the
    attack stages that preceded this launch and help reconstruct the timeline. The sequence of alerts on a host often
    tells the story; staging activity commonly precedes implant execution.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired this launcher pattern in the past week, and does the distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, giving a fleet-wide count of this specific
    launcher pattern rather than generic PowerShell usage. Many hosts firing the same pattern points to scripted
    deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host
    spread to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        CommandLine|contains|all:
        - -Sta
        - -Nop
        - -Window
        - Hidden
        CommandLine|contains:
        - -Command
        - -EncodedCommand
      selection_2:
        CommandLine|contains:
        - 'sv o (New-Object IO.MemorySteam);sv d '
        - mshta file.hta
        - GruntHTTP
        - -EncodedCommand cwB2ACAAbwAgA
      condition: 1 of selection_*
    fields:
    - host.name
