name: Suspicious Microsoft OneNote Child Process
id: a4359b3d-0737-4851-b010-68ead0614dbc
description: |
  Detects when Microsoft OneNote (onenote.exe) spawns a suspicious child process, which commonly indicates execution of a malicious embedded object inside a .one file. The rule fires when onenote.exe is the parent AND at least one of three conditions holds - the child is a known living-off-the-land binary by name or OriginalFileName, OR explorer.exe runs with a scriptable extension on its command line, OR the child runs from a user-writable staging path (AppData, ProgramData, Public, Windows Temp/Tasks) - and the activity is not a known Teams or OneDrive embedding launch. OneNote attachments became a phishing delivery vector where a victim is socially engineered into double-clicking an embedded file icon that launches a script host or interpreter; investigate whether the child execution is attacker-driven delivery versus a benign add-in or user action.
type: detection
detection_id: c27515df-97a9-4162-8a60-dc0eeb51b775
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Did onenote.exe spawn a child that matches any one of the rule's trigger branches?
  context: >-
    Confirm the alert is a true positive by reviewing the triggering event. The rule fires
    when onenote.exe is the parent AND EITHER the child is a listed living-off-the-land binary
    by Image name or OriginalFileName, OR it is explorer.exe carrying a scriptable extension
    (.hta, .vb, .wsh, .js, .ps, .scr, .pif, .bat, .cmd) on its command line, OR the child runs
    from a user-writable staging path (AppData, Public, ProgramData, Windows Tasks, Windows Temp).
    Note which branch fired - the branch determines which downstream questions carry weight. A
    name-branch fire points at the binary identity; a path-branch fire points at where the binary
    was staged.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - OriginalFileName
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to open OneNote documents that launch interpreters or scripts?
  context: >-
    Legitimate OneNote use rarely spawns command interpreters, script hosts, or other living-off-the-land
    binaries. Knowing whether the user routinely receives .one files and whether the host runs OneNote
    add-ins or automation that legitimately invokes child tools is often the fastest way to separate a
    benign add-in from socially engineered execution of an embedded object.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What .one file or email attachment led OneNote to launch this child process?
  context: >-
    OneNote-based execution typically begins with a .one file delivered as an email attachment or
    download that the victim opens, then double-clicks an embedded object icon. Identifying the source
    file and how it arrived (mail attachment, web download, shared link) enables perimeter blocking and
    a search for other recipients. The parent command line and recently opened .one files on the host
    point to the originating document.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - manual_review
  - edr_console
- question: Is onenote.exe expected to spawn this child, and what started OneNote itself?
  context: >-
    The onenote.exe-to-child relationship is the core signal. Tracing OneNote's own origin reveals
    whether the chain is user-driven (a person opened a .one file from mail or a share) or part of an
    automated launch. A scriptable child of OneNote is the embedded-object execution pattern; a benign
    add-in launch usually has a predictable, signed helper as the child.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What is the true identity of the child binary based on its metadata and hash?
  context: >-
    The rule matches both on-disk name (Image) and embedded metadata (OriginalFileName) because
    delivered payloads are often renamed - a copied powershell.exe seen on disk as system32.bat.exe
    still carries OriginalFileName PowerShell.exe. Comparing the Image path against OriginalFileName
    exposes the renamed-tool pattern, and the signing chain plus hash distinguish a Microsoft-signed
    system binary from an unsigned or tampered drop. Submit the hash for reputation checking.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: What exactly did the spawned child binary do? Decode its full command line.
  context: >-
    The full command line reveals the operation. Decode any encoded or obfuscated content, flags,
    file paths, and URLs. OneNote-delivered chains commonly fetch a remote payload via a script host
    or interpreter, then stage a follow-on binary. Scoping to all executions of this binary on the
    host within a few minutes captures multi-step invocations that together form one logical operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: If the child is PowerShell, was the command encoded or obfuscated, and what does it decode to?
  context: >-
    When the spawned child is powershell.exe or pwsh.exe, OneNote-delivered chains frequently pass an
    -EncodedCommand (-enc) base64 payload or use concatenation, backtick escaping, and variable
    substitution to hide intent. Decoding reveals the actual payload - a download cradle, reverse shell,
    or in-memory .NET assembly load. If the child is not a PowerShell process, this query returns the
    triggering event for reference and the decode applies to the relevant interpreter instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Did the spawned child make outbound network connections to fetch a payload or reach a remote host?
  context: >-
    Spearphishing-attachment chains continue with outbound activity - the script host or interpreter
    reaches a file-transfer service or compromised site to download a follow-on payload, and a decoy
    document is sometimes fetched in parallel to reassure the victim. Outbound connections from the
    spawned child, especially to file-sharing or transfer services, corroborate active delivery rather
    than a benign add-in launch.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - Initiated
  answer_sources:
  - network_connection
- question: What other child processes did this same OneNote instance spawn?
  context: >-
    A single embedded-object launch often kicks off multiple processes - an interpreter that downloads,
    a shell that stages, and a follow-on binary that runs the payload. Examining the siblings spawned by
    the exact OneNote instance shows the full scope of activity initiated through this document.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Has this OneNote-to-child binary pairing been seen on this host before?
  context: >-
    OneNote spawning a command interpreter or script host is rarely routine. Historical frequency of
    this specific parent-child pairing on the host distinguishes a recurring benign add-in from a novel
    spawning relationship. Zero or very low counts indicate first-time execution worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \onenote.exe
      selection_opt_img:
      - OriginalFileName:
        - bitsadmin.exe
        - CertOC.exe
        - CertUtil.exe
        - Cmd.Exe
        - CMSTP.EXE
        - cscript.exe
        - curl.exe
        - HH.exe
        - IEExec.exe
        - InstallUtil.exe
        - javaw.exe
        - Microsoft.Workflow.Compiler.exe
        - msdt.exe
        - MSHTA.EXE
        - msiexec.exe
        - Msxsl.exe
        - odbcconf.exe
        - pcalua.exe
        - PowerShell.EXE
        - RegAsm.exe
        - RegSvcs.exe
        - REGSVR32.exe
        - RUNDLL32.exe
        - schtasks.exe
        - ScriptRunner.exe
        - wmic.exe
        - WorkFolders.exe
        - wscript.exe
      - Image|endswith:
        - \AppVLP.exe
        - \bash.exe
        - \bitsadmin.exe
        - \certoc.exe
        - \certutil.exe
        - \cmd.exe
        - \cmstp.exe
        - \control.exe
        - \cscript.exe
        - \curl.exe
        - \forfiles.exe
        - \hh.exe
        - \ieexec.exe
        - \installutil.exe
        - \javaw.exe
        - \mftrace.exe
        - \Microsoft.Workflow.Compiler.exe
        - \msbuild.exe
        - \msdt.exe
        - \mshta.exe
        - \msidb.exe
        - \msiexec.exe
        - \msxsl.exe
        - \odbcconf.exe
        - \pcalua.exe
        - \powershell.exe
        - \pwsh.exe
        - \regasm.exe
        - \regsvcs.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \schtasks.exe
        - \scrcons.exe
        - \scriptrunner.exe
        - \sh.exe
        - \svchost.exe
        - \verclsid.exe
        - \wmic.exe
        - \workfolders.exe
        - \wscript.exe
      selection_opt_explorer:
        Image|endswith: \explorer.exe
        CommandLine|contains:
        - .hta
        - .vb
        - .wsh
        - .js
        - .ps
        - .scr
        - .pif
        - .bat
        - .cmd
      selection_opt_paths:
        Image|contains:
        - \AppData\
        - \Users\Public\
        - \ProgramData\
        - \Windows\Tasks\
        - \Windows\Temp\
        - \Windows\System32\Tasks\
      filter_teams:
        Image|endswith: \AppData\Local\Microsoft\Teams\current\Teams.exe
        CommandLine|endswith: -Embedding
      filter_onedrive:
        Image|contains: \AppData\Local\Microsoft\OneDrive\
        Image|endswith: \FileCoAuth.exe
        CommandLine|endswith: -Embedding
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_parent and 1 of selection_opt_* and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
