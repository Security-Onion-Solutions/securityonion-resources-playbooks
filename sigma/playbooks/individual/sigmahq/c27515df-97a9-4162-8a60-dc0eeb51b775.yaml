- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Embedded-object execution rarely occurs in isolation. Examining activity in the minutes around the
    alert reveals what led to the document opening, what the child staged afterward, and the timing
    between document open, file creation, and process execution that characterizes a delivery chain.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, defense tampering, or other execution alerts -
    may reveal the stages that preceded this event and help reconstruct the delivery timeline. The alert
    sequence on a host often tells the order of the operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Were other users or systems hit by the same OneNote child-process delivery?
  context: >-
    Phishing campaigns rarely target a single user. If one recipient opened a malicious .one file and it
    spawned a suspicious child, others likely received the same attachment. Correlating this detection
    across hosts reveals campaign breadth and identifies additional systems that need investigation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - alert
