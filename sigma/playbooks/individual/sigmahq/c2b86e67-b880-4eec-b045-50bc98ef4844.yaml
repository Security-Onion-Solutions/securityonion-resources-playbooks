- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, or initial-access activity — may reveal the
    stages that preceded the credential sweep and help reconstruct the timeline. Credential access is usually a midpoint,
    not a starting point, so prior alerts often explain how the operator reached this host.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
