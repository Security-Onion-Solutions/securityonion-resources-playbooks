        - -kalypsomedia
        - -keepass
        - -keepassconfig
        - -lsa_secrets
        - -mavenrepositories
        - -memory_dump
        - -Mozilla
        - -mRemoteNG
        - -mscache
        - -opensshforwindows
        - -openvpn
        - -outlook
        - -pidgin
        - -postgresql
        - -psi-im
        - -puttycm
        - -pypykatz
        - -Rclone
        - -rdpmanager
