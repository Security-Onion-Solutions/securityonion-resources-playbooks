name: Blue Mockingbird
id: d21ca48f-49b6-40fe-861e-e7c6324a1e27
description: |
  Fires when either of two independent command patterns runs — cmd.exe whose command line contains both
  `sc config` and `wercplsupporte.dll`, or wmic.exe whose command line ends in COR_PROFILER. Only one
  branch has to match. The first repoints the legitimate Windows Error Reporting control-panel support
  service at a DLL whose name differs from the genuine `wercplsupport.dll` by a single character, so a
  system service loads chosen code every time it starts. The second sets a CLR profiler environment
  variable through WMI, which together with a CLSID registered under InProcServer32 makes every .NET
  process started on the host load a chosen DLL and re-establish the mechanism. Both branches are
  registry-backed persistence with a masquerading component, and both are command forms used by the Blue
  Mockingbird cryptomining activity cluster following exploitation of internet-facing web applications.
  The investigation should establish which branch fired, what service, CLSID, and DLL path the command
  named, whether that DLL exists on disk, how the executing process was reached, and whether other
  persistence was installed alongside it.
type: detection
detection_id: c3198a27-23a0-4c2c-af19-e5328d49680e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the alerting command line match either branch of this rule — a cmd.exe `sc config` naming wercplsupporte.dll, or a wmic.exe command line ending in COR_PROFILER?
  context: >-
    The rule fires on either of two independent branches and only one has to match, so record which one
    did, because the two lead to different evidence. The cmd.exe branch requires both `sc config` and
    `wercplsupporte.dll` on the same command line together and points at a service whose DLL was
    repointed. The wmic.exe branch requires only that the command line end in COR_PROFILER and points at
    a CLR profiler variable being written through WMI, typically in the form
    `wmic ENVIRONMENT create name="COR_PROFILER",username="<system>",VariableValue="<CLSID>"`. Read the
    full command line for the service name, the CLSID, and any DLL path it carries.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to reconfigure system services or set machine-wide CLR profiler variables?
  context: >-
    Repointing a service DLL and writing a machine-wide profiler variable are administrative operations,
    normally performed by a named administrator or by a deployment mechanism inside a maintenance window.
    On a web or application server the executing account is frequently an application pool or service
    identity, which does not perform configuration changes by hand, so the account is often the fastest
    discriminator available. Establish what the host does and what the account is provisioned for before
    reading anything else.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What spawned the process that made this change, and what started that parent?
  context: >-
    Registry-backed configuration changes normally descend from a small set of legitimate configuration
    tools — an installer such as msiexec.exe, a management agent, regedit.exe, or an administrator's
    interactive shell under explorer.exe — and an environment's allow-list of those tools is what makes
    the exceptions readable. A parent that is a web server worker process, a script host, or a
    remote-execution service means the command was reached through code execution on the host rather
    than through configuration management. The parent's own command line and grandparent show which of
    the two this was.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other child processes did the same parent spawn?
  context: >-
    Neither branch of this rule is self-sufficient. A repointed service still needs its DLL staged and
    the service restarted; a profiler variable still needs a CLSID registered and a second variable set.
    Those are separate invocations that a single script issues in sequence from one parent, so listing
    the parent's other children in the window names the rest of the sequence and the tools it used.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What registry key and value did the alerting process write, and is that location a known persistence spot?
  context: >-
    The command line states the intent; the registry event states what changed. A `sc config` is
    committed under HKLM\SYSTEM\CurrentControlSet\Services, and a WMI environment write lands under the
    Session Manager Environment key — both survive reboot. Be aware that the process recorded on the
    registry event is frequently the service control manager or the WMI provider host rather than the
    process named on the alert, so an empty result means the write was committed by a helper process,
    not that no change occurred. The signer columns describe the writing process and should be read for
    coherence with the key being written, never as a verdict.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - process_creation
- question: Were the service, CLSID, or environment registry values this technique depends on written on this host?
  context: >-
    These keys are where both branches are actually committed, and the value data names the payload. A
    repointed service is a ServiceDll value under a service's Parameters subkey or an altered ImagePath;
    a CLR profiler is an InProcServer32 default value under a CLSID, plus COR_ENABLE_PROFILING and
    COR_PROFILER values under the Session Manager Environment key; Run keys are a third landing spot for
    the same objective. The keys this environment treats as critical — Run, Services, security settings,
    and LSASS — are the ones to read first. The Details column carries the DLL path each value points at,
    and that path is what needs to be located on disk.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\Parameters\ServiceDll'
          - '\ImagePath'
          - '\InProcServer32'
          - '\Session Manager\Environment'
          - '\CurrentVersion\Run'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - manual_review
- question: Did the WMI-Activity channel record provider loads or event subscriptions on this host around the alert?
  context: >-
    A wmic command line shows only the request that was issued; the WMI-Activity operational channel
    shows what the WMI service did with it, recording provider loads as event 5857 and event
    subscriptions as 5860 for temporary and 5861 for permanent. An environment write through WMI touches
    the \root\cimv2 namespace, so a subscription registered under \root\subscription in the same window
    means WMI was also used for triggered execution rather than a single configuration write.
    Read the namespace and WQL filter from the Query and NamespaceName columns, the provider
    name on 5857 rows, and the consumer payload on 5861 rows from CONSUMER — message carries
    the full narrative when a column is empty. Hosts that do not ship the WMI-Activity channel
    return nothing here, so treat zero results as a visibility gap rather than evidence nothing
    was registered.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: wmi
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 5857
          - 5860
          - 5861
      condition: selection
    fields:
      - EventID
      - winlog.user_data.ProviderName
      - winlog.user_data.NamespaceName
      - winlog.user_data.Query
      - winlog.user_data.CONSUMER
      - message
  answer_sources:
  - manual_review
- question: Did wmic.exe or the WMI provider host open outbound connections from this host around the alert, and to how many distinct remote destinations?
  context: >-
    WMI is a remote execution channel as well as a local one, and the same call that writes a variable
    locally can be aimed at other machines with a `/node:` argument. Connections from wmic.exe or
    WmiPrvSE.exe to port 135 and the dynamic RPC range name the machines driven from here. Count the
    unique remote destinations inside the window: a handful is consistent with administrative use, while
    dozens within a few minutes is scripted fan-out and sets the containment scope. Correlate the process
    creation with the connections inside the same hour — past that the association stops being reliable.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\wmic.exe'
          - '\WmiPrvSE.exe'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - Initiated
  answer_sources:
  - network_connection
- question: Were other registry modifications made with reg.exe on this host in the same session?
  context: >-
    Both branches of this rule are visible on a command line, but the registry writes that complete the
    same objective usually are not, because they are issued through reg.exe as separate invocations. A
    CLR profiler needs a CLSID registered under InProcServer32 and COR_ENABLE_PROFILING set alongside the
    profiler variable; a repointed service needs its ServiceDll value written under the service's
    Parameters subkey. A half-hour window either side of the alert is wide enough to catch those
    invocations while staying readable, and their command lines carry the DLL paths.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Does the change survive reboot, and is the DLL it points at present on disk?
  context: >-
    Both branches make a process load a DLL from a path held in the registry, and both take effect only
    if that file exists — a repointed service loads its DLL when the service next starts, and a
    registered CLR profiler loads into every .NET process started afterwards, which re-establishes the
    mechanism continuously without any further command. This query lists file activity by the alerting
    process and its children, which is where a payload staged in the same session appears. The file write
    carries no hash, so if the path is present, hash it from a later execution or retrieve the file for
    reputation review. If nothing appears, the DLL was staged earlier by a separate process and should be
    located by the path held in the registry value data.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Were other persistence mechanisms installed on this host around the alert?
  context: >-
    Persistence of this kind is normally stacked rather than singular — a repointed service DLL, a
    registered CLR profiler, a scheduled task named to imitate a system task, and a Run key all serve one
    objective, and any surviving one can re-establish the others. This aggregation lists the persistence
    and management tools that ran on the host in the four hours around the alert. Read the schtasks rows
    for task names that imitate system tasks and for a `/S` argument aiming a task at another machine,
    the sc rows for service names other than the one on the alert, and the wmic rows for execution forms
    as well as configuration ones, since `wmic process call create` is an execution request rather than a
    configuration change. Equivalents run from PowerShell, such as `Invoke-WmiMethod`, `New-Service`, or
    `Set-ItemProperty`, do the same work without these binaries and are not returned here.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: When this host has previously produced this rule's pattern, what parents and users drove it, and does the current alert fit that history?
  context: >-
    The query mirrors the rule's own selection structure scoped to this host, so the parent and account
    distribution describes how this specific command pattern has run here over the past two weeks —
    not general use of cmd.exe or wmic.exe, which run constantly. In most environments the count is zero
    and the alert is the entire history, which is itself the answer. A non-zero count driven by a
    deployment agent parent under a service account is a different finding from a one-off under an
    interactive shell.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      sc_cmd:
        Image|endswith: \cmd.exe
        CommandLine|contains|all:
        - sc config
        - wercplsupporte.dll
      wmic_cmd:
        Image|endswith: \wmic.exe
        CommandLine|endswith: COR_PROFILER
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (sc_cmd or wmic_cmd) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Have other hosts produced this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of this exact command pattern rather than of the binaries it uses. Several hosts producing it
    points to either a management action pushed across the estate or one operator repeating the same
    step; a single host points to activity local to this machine. If the hosts that appear are
    internet-facing application servers, treat the set as a population defined by exposure rather than a
    coincidence, and check each for the same route in.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      sc_cmd:
        Image|endswith: \cmd.exe
        CommandLine|contains|all:
        - sc config
        - wercplsupporte.dll
      wmic_cmd:
        Image|endswith: \wmic.exe
        CommandLine|endswith: COR_PROFILER
      condition: sc_cmd or wmic_cmd
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Has this account produced this rule's pattern before, and does that history fit its role?
  context: >-
    The query mirrors the rule's selection structure scoped to this account, so the result is the
    account's 90-day history of this specific pattern across hosts, not its general use of cmd.exe or
    wmic.exe. Interactive administrator accounts occasionally reconfigure services by hand; application
    pool identities, SYSTEM, and machine accounts do not, and when the pattern appears under one of those
    the launch mechanism rather than the account name is the attributing evidence. Weigh the count
    against what the account is provisioned to do.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      sc_cmd:
        Image|endswith: \cmd.exe
        CommandLine|contains|all:
        - sc config
        - wercplsupporte.dll
      wmic_cmd:
        Image|endswith: \wmic.exe
        CommandLine|endswith: COR_PROFILER
      _pb_scope:
        User|expand: '%User%'
      condition: (sc_cmd or wmic_cmd) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Has this parent process driven this rule's pattern before, or is the parent new for this activity?
  context: >-
    When the alert fires under a service or machine identity, the account name attributes nothing and the
    launch mechanism does. The query mirrors the rule's selection structure scoped to the alerting parent
    process, so the result is that parent's 90-day history of driving this exact pattern, broken out by
    host. A parent that already accounts for the pattern on many hosts is a deployment mechanism; a
    parent that has never driven it before is the deviation to chase.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      sc_cmd:
        Image|endswith: \cmd.exe
        CommandLine|contains|all:
        - sc config
        - wercplsupporte.dll
      wmic_cmd:
        Image|endswith: \wmic.exe
        CommandLine|endswith: COR_PROFILER
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (sc_cmd or wmic_cmd) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What else did this account run across the environment around this time?
  context: >-
    A configuration change of this kind sits inside a longer sequence, and the steps around it —
    reconnaissance, credential access, task creation aimed at other machines — show whether this host is
    the only one involved. Tracking the account across hosts in the hour around the alert is the earliest
    view of that. When the alert fires under SYSTEM, a service identity, or a machine account this view
    returns routine agent volume on every host, and the parent-scoped view of the same window is the
    meaningful one.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did this same parent-driven pattern fire on other hosts in the same window?
  context: >-
    Under a service principal, asking what the account did across the network returns agent telemetry
    from every host. The answerable question is whether the same launch mechanism produced this pattern
    elsewhere at the same time, so the query mirrors the rule's selection structure scoped to the
    alerting parent process, fleet-wide, in the hour around the alert. Several hosts in that window
    points to a pushed or scheduled rollout; this host alone points to a host-local trigger.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      sc_cmd:
        Image|endswith: \cmd.exe
        CommandLine|contains|all:
        - sc config
        - wercplsupporte.dll
      wmic_cmd:
        Image|endswith: \wmic.exe
        CommandLine|endswith: COR_PROFILER
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (sc_cmd or wmic_cmd) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Installing persistence presupposes that execution on the host was already obtained, so the hours
    before the alert are where that route appears — an application worker process spawning a shell, a
    privilege escalation tool abusing impersonation rights, or credential access tooling. Earlier
    detections name that route and set the start of the timeline. Their absence is also informative,
    since it moves the question toward how execution was reached without producing an alert.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
