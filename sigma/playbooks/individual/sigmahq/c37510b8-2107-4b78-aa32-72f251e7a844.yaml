name: Potential Ryuk Ransomware Activity
id: bd11c096-6b96-4955-a177-ebb1a8f454e5
description: |
  Detects command lines associated with Ryuk ransomware deployment. The rule fires when at least one of
  three independent patterns appears: either a command line that references both
  Microsoft\Windows\CurrentVersion\Run and C:\users\Public\ (autostart registration of a payload staged in
  the Public directory), or a recursive backup-file deletion (del /s /f /q c:\ against \*.bac, \*.bak and
  \*.bkf together), or net.exe / net1.exe stopping samss, audioendpointbuilder, unistoresvc_ or AcrSch2Svc
  with the ' stop ' and ' /y' arguments. The three branches are separate stages of the same operation —
  autostart persistence, destruction of local recovery data, and stopping services that hold files open or
  guard credentials before encryption — and any one of them alone is enough to fire the rule. The
  investigation should establish which branch matched, whether the other stages also ran on the host, what
  payload the Run key or the staged directory references, and whether the same pattern reached other hosts.
type: detection
detection_id: c37510b8-2107-4b78-aa32-72f251e7a844
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the alerting command line match one of this rule's three patterns, and which branch fired?
  context: >-
    The rule matches a command line that either references both Microsoft\Windows\CurrentVersion\Run and
    C:\users\Public\, or recursively deletes \*.bac, \*.bak and \*.bkf with del /s /f /q c:\, or runs net.exe
    / net1.exe with ' stop ' and ' /y' against samss, audioendpointbuilder, unistoresvc_ or AcrSch2Svc.
    Record which branch matched, because it sets the next step. The autostart branch points at the payload
    named in the Run value, the deletion branch at what backup data is recoverable, and the service branch at
    which services were left stopped and why those specific ones were chosen.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this parent expected to spawn the alerting process, and what started the parent?
  context: >-
    All three branches of this rule are single command lines that are normally issued from a script rather
    than typed, so the parent identifies the launch mechanism. A cmd.exe or powershell.exe parent running a
    batch file, a remote-execution parent such as wmiprvse.exe or a service host created by a remote-admin
    tool, or a parent under a user-writable directory each point to operator-driven or automated execution.
    Tracing the parent's own origin shows where the chain started.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other child processes did the same parent spawn?
  context: >-
    Ryuk deployment is script-driven, and the script issues its service stops, backup deletion, autostart
    registration and payload launch as separate child processes of one parent within a short window. Listing
    the parent's other children shows whether the alerting command was isolated or one line of a longer
    sequence, and often surfaces the branches of this rule that did not fire on their own.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What recovery-inhibiting commands were executed on this host?
  context: >-
    The rule's backup-deletion branch removes \*.bac, \*.bak and \*.bkf files across the system drive, which
    is one of several recovery-inhibiting steps that usually run together — shadow-copy deletion via vssadmin
    or wmic, boot-recovery disabling via bcdedit, backup-catalog deletion via wbadmin, and Recovery
    Environment changes via reagentc. This query surfaces all of them on the host over the following day.
    Each result states what was attempted, not what succeeded, so confirm the live state on the host with
    vssadmin list shadows, bcdedit /enum, reagentc /info and wbadmin get versions, and check whether
    offline, tape or cloud backups are intact through the backup system itself.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\reagentc.exe'
          - '\diskshadow.exe'
      selection_cmdline:
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'recoveryenabled'
          - 'bootstatuspolicy'
          - 'delete catalog'
          - 'delete systemstatebackup'
          - 'boot.ini'
          - 'winre.wim'
          - '/disable'
      condition: selection and (selection_recovery or selection_cmdline)
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
  - edr_console
- question: What other destructive or recovery-inhibiting actions occurred on this host?
  context: >-
    The three branches of this rule are stages that normally run alongside others — stopping services with
    sc or taskkill, changing file ownership and permissions with takeown or icacls, and clearing logs. This
    aggregation over the binaries those stages use shows how many of them ran on the host in the same window.
    A single row is consistent with isolated administrative work; several of these binaries appearing
    together, especially under one parent, describes a scripted sequence.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_destructive:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\cipher.exe'
          - '\fsutil.exe'
          - '\icacls.exe'
          - '\takeown.exe'
          - '\attrib.exe'
          - '\sc.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\powershell.exe'
          - '\taskkill.exe'
      condition: selection and selection_destructive
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: Are there signs of file encryption, ransom notes, or ransomware binary execution on this host?
  context: >-
    Service stops and backup deletion typically precede file encryption by minutes, so the half hour after
    the alert is where the encryptor appears if it ran. This query lists processes outside the usual system
    paths on the host in that window. Look for unfamiliar executables launched from user-writable
    directories such as C:\users\Public\, interpreters launching unknown binaries, and processes that keep
    running with sustained file activity. Ransom notes and renamed files are visible from file events or the
    endpoint console rather than here.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_known:
        Image|startswith:
          - 'C:\Program Files'
          - 'C:\Windows\System32\svchost'
          - 'C:\Windows\System32\wbem'
      condition: selection and not filter_known
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: Is this same activity occurring on other hosts in the environment?
  context: >-
    Ryuk is deployed against many hosts at once from a central foothold, so the same command lines tend to
    appear across a segment within a short window. This query counts every host where this detection fired,
    without a host filter. The number of hosts and the interval between the first and last hit describe
    whether this is a single-host event or a coordinated push, which sets the scope for the response.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
  answer_sources:
  - process_creation
  - alert
- question: What specific registry key and value were modified, and is this a known persistence location?
  context: >-
    The autostart branch of this rule reads a key path out of a command line; the registry event linked to
    the same process gives the key path and the value data as structured fields instead. A value under
    Microsoft\Windows\CurrentVersion\Run naming an executable in C:\users\Public\ registers that file to run
    at every logon, and the value data names the payload to chase. Read the writing process's signer for
    coherence with the key being written rather than as a verdict — almost every alerting process is
    trusted-signed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - process_creation
- question: Does the registry change survive reboot, and is the referenced executable or script still present on disk?
  context: >-
    Autostart registration only executes something if the file named in the value exists at that path. The
    rule pins the staging directory to C:\users\Public\, so confirming that a file was written there by this
    process or one of its children determines whether the entry is live and what it would launch at the next
    logon. File-write events carry no hash, so hash the payload from a later execution or retrieve it from
    disk for a reputation lookup. Registry deletion is not observable in this telemetry, so judge cleanup
    from later re-modification of the value rather than from a delete event.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Were other registry modifications made on this host in the same session?
  context: >-
    An operator who writes one autostart value usually writes several registry changes in the same session —
    a second Run or RunOnce value, security-tool policy keys, or firewall settings. This query lists reg.exe
    and regedit.exe write operations on the host in a wider window, so the entry that fired this rule sits
    alongside whatever else was changed. Registry writes made through PowerShell cmdlets or direct API calls
    do not appear here.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Did other reconnaissance commands run on this host around the same time?
  context: >-
    net.exe and net1.exe carry the service-stop branch of this rule, and the same binaries are the usual
    tools for enumerating shares, sessions, accounts and domain groups. Deployment is preceded by
    enumeration of what is reachable, so several distinct discovery binaries within a quarter hour describes
    scripted reconnaissance rather than a person checking one thing. Read the result for which binaries ran
    and under which account, not for volume.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: Is this user and host expected to stop these services, delete backup files, or register autostart entries?
  context: >-
    Backup administrators, imaging tools and service-maintenance scripts do produce commands that resemble
    these branches, so the account and the host role decide how much of the pattern is routine. Stopping
    samss, audioendpointbuilder, unistoresvc_ or AcrSch2Svc is not part of ordinary desktop administration,
    and a standard user account driving any of the three branches is a deviation regardless of the host.
    Check whether the account is an administrator, a service account, or a standard user, and whether the
    host is a backup or file server where the deletion pattern could be part of a maintenance job.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
  answer_sources:
  - organizational_knowledge
  - asset_inventory
- question: When this host has previously produced this rule's pattern, what parents and users drove that activity, and does the current alert fit?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the parent and user
    distribution reflects how these three specific command-line patterns have run here over the past two
    weeks, not generic net.exe or reg.exe usage. A recurring backup-maintenance job or imaging tool shows up
    as a consistent parent and account; an empty result, a new parent, or an unexpected account is the
    deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_reg:
        CommandLine|contains|all:
        - Microsoft\Windows\CurrentVersion\Run
        - C:\users\Public\
      selection_del:
        CommandLine|contains|all:
        - del /s /f /q c:\
        - \*.bac
        - \*.bak
        - \*.bkf
      selection_net:
        Image|endswith:
        - \net.exe
        - \net1.exe
        CommandLine|contains|all:
        - ' stop '
        - ' /y'
        CommandLine|contains:
        - samss
        - audioendpointbuilder
        - unistoresvc_
        - AcrSch2Svc
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Has this user previously produced this rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the account's
    90-day history of these three command-line patterns across the environment rather than its generic use
    of net.exe or reg.exe. An account that produces this regularly on the same small set of hosts is likely
    tied to a backup or maintenance duty worth confirming; an account with no prior history that produces it
    once is the case to pursue. Weigh the count against what the account is for.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_reg:
        CommandLine|contains|all:
        - Microsoft\Windows\CurrentVersion\Run
        - C:\users\Public\
      selection_del:
        CommandLine|contains|all:
        - del /s /f /q c:\
        - \*.bac
        - \*.bak
        - \*.bkf
      selection_net:
        Image|endswith:
        - \net.exe
        - \net1.exe
        CommandLine|contains|all:
        - ' stop '
        - ' /y'
        CommandLine|contains:
        - samss
        - audioendpointbuilder
        - unistoresvc_
        - AcrSch2Svc
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: Has this parent process historically driven this rule's pattern, or is the parent new for this activity?
  context: >-
    When the alert fires under SYSTEM or a computer account, user identity attributes nothing and the launch
    mechanism is the meaningful pivot. The query mirrors the rule's selection structure scoped to the
    alerting parent, so the result is the 90-day history of this parent driving these specific patterns,
    grouped by host. A parent that already accounts for thousands of prior events across many hosts is
    vendor or operating-system automation; a parent that has never driven this before is the deviation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_reg:
        CommandLine|contains|all:
        - Microsoft\Windows\CurrentVersion\Run
        - C:\users\Public\
      selection_del:
        CommandLine|contains|all:
        - del /s /f /q c:\
        - \*.bac
        - \*.bak
        - \*.bkf
      selection_net:
        Image|endswith:
        - \net.exe
        - \net1.exe
        CommandLine|contains|all:
        - ' stop '
        - ' /y'
        CommandLine|contains:
        - samss
        - audioendpointbuilder
        - unistoresvc_
        - AcrSch2Svc
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did this user account do across the environment around this time?
  context: >-
    Deployment reaches many hosts from one account, so the account's activity elsewhere in the same hour
    shows how far it has been used. The query deliberately omits a host filter. Several hosts running
    similar administrative binaries under this account within the window describes lateral reach; if the
    alert fired under SYSTEM or a computer account this returns routine agent activity on every host and
    should be read as a degenerate result rather than as reach.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: Did this same parent-driven pattern fire on other hosts in the same window?
  context: >-
    Under a service principal, asking what the user did elsewhere returns agent telemetry from every host.
    The launch mechanism is the answerable version of the same question. The query mirrors the rule's
    selection structure scoped to the alerting parent, fleet-wide, within the alert window. Several hosts in
    the same hour points to a pushed or scheduled rollout; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_reg:
        CommandLine|contains|all:
        - Microsoft\Windows\CurrentVersion\Run
        - C:\users\Public\
      selection_del:
        CommandLine|contains|all:
        - del /s /f /q c:\
        - \*.bac
        - \*.bak
        - \*.bkf
      selection_net:
        Image|endswith:
        - \net.exe
        - \net1.exe
        CommandLine|contains|all:
        - ' stop '
        - ' /y'
        CommandLine|contains:
        - samss
        - audioendpointbuilder
        - unistoresvc_
        - AcrSch2Svc
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: Have other hosts produced this rule's pattern in the past week, and how is it distributed across the fleet?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count
    of these three command-line patterns over the past week rather than the generic footprint of net.exe or
    reg.exe. A steady spread across many hosts points to scripted deployment or vendor automation that can
    be confirmed and tuned; a small unrelated set, or a cluster that starts in the last few days, points to
    operator activity and defines the hosts in scope.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_reg:
        CommandLine|contains|all:
        - Microsoft\Windows\CurrentVersion\Run
        - C:\users\Public\
      selection_del:
        CommandLine|contains|all:
        - del /s /f /q c:\
        - \*.bac
        - \*.bak
        - \*.bkf
      selection_net:
        Image|endswith:
        - \net.exe
        - \net1.exe
        CommandLine|contains|all:
        - ' stop '
        - ' /y'
        CommandLine|contains:
        - samss
        - audioendpointbuilder
        - unistoresvc_
        - AcrSch2Svc
      condition: 1 of selection_*
    fields:
    - host.name
  answer_sources:
  - process_creation
