        - .cpl"
        - .cpl'
        - '.dll '
        - .dll,
        - .dll"
        - .dll'
        - '.inf '
        - .inf,
        - .inf"
        - .inf'
      - CommandLine|endswith:
        - .cpl
        - .dll
