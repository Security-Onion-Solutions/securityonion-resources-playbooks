        - .dll"
        - .dll'
        - '.inf '
        - .inf,
        - .inf"
        - .inf'
      - CommandLine|endswith:
        - .cpl
        - .dll
        - '.inf'
      filter_main_localserver:
        CommandLine|contains: ' -localserver '
      filter_main_zzzzInvokeManagedCustomActionOutOfProc:
        ParentImage|endswith: \msiexec.exe
        CommandLine|contains|all:
        - :\Windows\Installer\
        - .tmp
        - zzzzInvokeManagedCustomActionOutOfProc
      filter_optional_EdgeUpdate:
        ParentCommandLine|contains|all:
        - :\Users\
        - \AppData\Local\Microsoft\EdgeUpdate\Install\{
        - \EDGEMITMP_
        - .tmp\setup.exe
        - --install-archive=
        - --previous-version=
        - --msedgewebview --verbose-logging --do-not-launch-msedge --user-level
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, a malicious document opening, or credential access — may reveal the attack stages that preceded the proxy-execution attempt and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were any other proxy-execution LOLBins used on this host recently?
  context: Operators who use one proxy-execution LOLBin often use several. If rundll32 was used to run code through a trusted binary, check whether regsvr32, mshta, msbuild, installutil, msiexec, or similar binaries were also used on this host. Multiple proxy-execution utilities performing the same objective strengthens the case for trusted-binary abuse rather than incidental use.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was rundll32 executed from its expected system path?
  context: rundll32 executed from outside System32 or SysWOW64 may have been copied or renamed to evade path-based allowlists, or a different binary may have been renamed to rundll32.exe. A rundll32.exe running from a user profile, Temp, or Downloads directory is more suspicious than one in System32. Compare the Image path against OriginalFileName to spot a relocated or renamed copy.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired the rule's rundll32 pattern over the past 90 days, and what command-line structures are typical?
  context: A rundll32 invocation matching this uncommon-extension pattern with no prior history on a host is more suspicious than one seen regularly under stable parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects the rule's specific firing pattern rather than generic use of rundll32. The command-line projection lets the typical invocation patterns be compared against the alerting one — a baseline DLL list emerges from the recurring patterns.
  range: -90d
