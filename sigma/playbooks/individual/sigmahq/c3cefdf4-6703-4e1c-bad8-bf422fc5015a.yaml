name: Outlook Security Settings Updated - Registry
id: f9f9ddff-0a9a-410c-ad4d-a4f53e8da407
description: |
  This rule fires when a process modifies a registry value under an Office Outlook Security key (a
  path containing \SOFTWARE\Microsoft\Office\ and \Outlook\Security\) and the writing process is not
  the in-box OUTLOOK.EXE installed under Program Files. These keys govern macro trust levels,
  attachment blocking, add-in trust, and object-model prompts; lowering them (for example setting the
  macro security level to allow all macros) is a known path to mail-client persistence and
  macro-based execution, sometimes paired with dropping a VbaProject.OTM macro file into the Outlook
  profile. Legitimate changes come from administrative policy deployment or Group Policy, so the
  investigation should determine which setting changed, what process and user made the change,
  whether an Outlook macro or startup artifact accompanied it, and whether the change was authorized.
type: detection
detection_id: c3cefdf4-6703-4e1c-bad8-bf422fc5015a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Do the registry key path and writing process match what this rule detects?
  context: >-
    Confirm the alert is a true positive by reviewing the exact registry path against the Office
    Outlook Security key pattern and verifying the writing process is not the in-box OUTLOOK.EXE from
    Program Files. The rule fires only when both conditions hold together, a value under
    \SOFTWARE\Microsoft\Office\...\Outlook\Security\ was modified AND the writer was some other
    process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify Outlook mail-client security settings?
  context: >-
    Legitimate changes to Outlook security keys are usually pushed by administrative tooling or Group
    Policy, not by an interactive user or an ad-hoc process. Confirm whether the account and host
    function are consistent with mail-client policy changes. High-value mailboxes (administrator,
    finance, executive) are frequent targets for this persistence style, so weigh whether the user
    and host fit an expected administrative-change pattern.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Was there a change ticket or approved maintenance window for this Outlook security change?
  context: >-
    Legitimate changes to mail-client security policy are normally deployed through documented
    process or Group Policy. A corresponding change ticket or maintenance window suggests authorized
    activity; the absence of one, when policy requires it, suggests the change was unauthorized and
    moves the alert toward a true positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the user or an administrator recall changing Outlook security settings?
  context: >-
    Direct confirmation from the account owner or the administrator responsible is often the fastest
    way to establish legitimacy. If no one recalls lowering the macro or attachment protections, the
    account may be compromised or the change may be automated by malware; if someone confirms it,
    capture why the setting was changed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which specific Outlook Security value was changed, and is it a known macro or attachment control?
  context: >-
    The exact value name determines what protection changed. A Level value under Outlook\Security
    controls macro trust (setting it to allow all macros enables VBA execution); AdminSecurityMode,
    AddinTrust, and the Level1Add/Level1Remove attachment lists govern add-in trust and which
    attachment types are blocked. Read the value name and its data to decide whether the change
    weakens a mail-client protection.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value data was written, and does it disable or weaken a protection?
  context: >-
    Registry value data reveals intent. For Outlook security keys a DWORD such as Level set to 1
    disables macro warnings and allows all macros to run; attachment-list values such as Level1Remove
    can demote a blocked executable or script extension so it is delivered. Interpret the value data
    against the setting's documented meaning; a value that turns a protection off is the malicious
    case.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote this key, and what parent process launched it?
  context: >-
    The writing process and its parent show how the change was made. A policy deployment agent or
    Group Policy engine is expected; reg.exe, powershell.exe, wscript.exe, or a script host launched
    from an Office application or a user shell suggests hands-on or macro-driven tampering. Walk up
    the parent chain to see what initiated the modification.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Is this a persistence-relevant Outlook location, and does the change stay in place over time?
  context: >-
    Outlook Security keys persist the weakened setting across restarts, so the mailbox stays
    exploitable until the value is reset. Registry value deletions are not recorded by endpoint
    telemetry, so do not look for a removal event; instead judge whether the change endured by
    reviewing the key's modification history over a longer window and whether Outlook subsequently
    loaded macros. A setting that was lowered and never restored, followed by macro execution,
    indicates active persistence.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Has this Outlook Security value been modified before on this host?
  context: >-
    Routine Office administration rarely rewrites macro or attachment-security values on a
    workstation, so a first-time modification is more notable than a recurring one. Compare the
    historical value data: repeated identical writes suggest managed configuration, while a one-off
    change to a value never touched before warrants closer review.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What other registry changes were made on this host in the same window?
  context: >-
    Operators who weaken one mail-client protection often make several related changes together,
    lowering macro security, disabling attachment blocking, and adding a startup or Run-key entry.
    Registry modifications on this host in the surrounding window, grouped by key and writing process,
    reveal whether this was an isolated setting change or part of a cluster of configuration tampering
    from the same process or user.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Did the same process activity drop an Outlook macro or startup file, such as VbaProject.OTM?
  context: >-
    Outlook macro persistence pairs the security-setting change with a VbaProject.OTM file placed in
    the Outlook profile folder, which loads and runs on the next Outlook launch. Correlating file
    writes by the registry-writing process and its children surfaces that payload when it lands in
    the same session. The file-write event carries no hash; if a macro or script file is present,
    retrieve or hash it from a later execution for a reputation check.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did OUTLOOK.EXE spawn child processes after the setting changed?
  context: >-
    Once macro security is lowered, a malicious Outlook macro can execute when Outlook next runs,
    typically visible as OUTLOOK.EXE spawning a script host or command interpreter such as cmd.exe,
    powershell.exe, wscript.exe, mshta.exe, or rundll32.exe. Child processes of OUTLOOK.EXE after the
    change confirm the weakened setting was exercised and a payload ran.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\OUTLOOK.EXE'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Was the same Outlook Security value modified on other hosts recently?
  context: >-
    The same modification across many hosts usually points to a Group Policy or software deployment;
    a change isolated to one host looks more targeted. Compare the writing process and value data
    across hosts, since a policy engine writing a consistent value differs from an interactive tool
    setting an unusual one on a single machine.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity ran on this host around the time of the change?
  context: >-
    A configuration change rarely happens in isolation. Process activity in the surrounding window
    can reveal how the change was delivered and what followed it, a spawned script host, a downloaded
    tool, or reconnaissance. Aggregating by process and parent collapses routine agent noise while
    novel parent-child pairs stand out.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this change?
  context: >-
    Earlier alerts on the same host, defense tampering, phishing-related execution, reconnaissance,
    or credential access, may show the stages that led to this mail-client change and help place it
    in a timeline. A cluster of detections preceding the setting change points to hands-on activity
    rather than a routine administrative edit.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other persistence mechanisms installed on this host around the same time?
  context: >-
    Mail-client persistence is often one of several footholds. Execution of scheduling and service
    tools such as schtasks.exe, at.exe, sc.exe, reg.exe, bitsadmin.exe, or wmic.exe in the
    surrounding window may indicate the operator stacked additional persistence alongside the Outlook
    change. Multiple mechanisms installed together point to intentional persistence rather than an
    isolated administrative edit.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
