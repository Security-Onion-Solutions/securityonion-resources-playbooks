name: File Explorer Folder Opened Using Explorer Folder Shortcut Via Shell
id: e1b53ced-8c17-444f-abd4-9d88e1e8c00b
description: |
  Detects cmd.exe, powershell.exe, or pwsh.exe spawning explorer.exe with a command line containing
  the shell:mycomputerfolder namespace token, which opens the My Computer folder view. The shell:
  protocol resolves named special folders without using full filesystem paths, and explorer.exe is
  the Microsoft-signed handler for these tokens. Programmatic invocation of shell: folder shortcuts
  from a command interpreter is unusual outside user-driven tooling and can indicate scripted
  navigation to sensitive special folders or recon-style folder enumeration. The investigation should
  confirm the exact command line, determine why a script host or shell launched explorer.exe, and
  check whether the activity is part of a broader discovery sequence.
type: detection
detection_id: c3d76afc-93df-461e-8e67-9b2bad3f2ac4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Did cmd.exe, powershell.exe, or pwsh.exe spawn explorer.exe with a shell:mycomputerfolder command line?
  context: Confirm the alert is a true positive by reviewing the exact command line and the parent/child
    pair against the rule's criteria. The rule fires only when a command interpreter is the parent AND
    the child is explorer.exe AND the command line contains the shell:mycomputerfolder token.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Is the interpreter parent (cmd.exe, powershell.exe, or pwsh.exe) expected to spawn explorer.exe, and what started the parent?
  context: The interpreter-to-explorer relationship is the core signal here. Tracing the parent's own
    origin reveals whether the chain is a user opening a folder from an interactive shell or a script
    or automation that programmatically launched explorer.exe with a shell namespace token.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did the same interpreter parent spawn?
  context: If the interpreter that launched explorer.exe also spawned other processes, those siblings
    reveal the full scope of activity from that parent. Multiple recon or staging children from the
    same parent points to scripted enumeration rather than a one-off folder open.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What was the full explorer.exe command line, and which shell namespace token did it open?
  context: Decode the complete command line on explorer.exe to confirm the shell:mycomputerfolder token
    and check for additional shell namespace arguments in the same window. Sensitive tokens such as shell:Startup,
    shell:Common Startup, shell:SendTo, shell:CredentialManager, shell:DpAPIKeys, or shell:UserProfiles
    indicate navigation to persistence or credential-staging folders rather than the benign My Computer view.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What interpreter command line invoked explorer.exe, and is that parent normal for this activity?
  context: The parent command line shows exactly how explorer.exe was launched. A user-driven folder
    open is typically launched from an interactive cmd.exe under explorer.exe, while a scripted shell
    namespace invocation may come from a non-interactive PowerShell cradle, a remote-execution host, or an
    automation script.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Is this user expected to navigate special folders programmatically via a command interpreter?
  context: IT staff and administrators legitimately script folder navigation; standard users rarely
    invoke shell namespace tokens from cmd.exe or PowerShell. The user's role and baseline determine whether this
    is routine. Service or inventory accounts on an allowed-discovery list are an expected source; an
    interactive user account driving programmatic enumeration is the deviation worth chasing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single shell namespace folder open may be benign, but multiple reconnaissance commands in rapid
    succession -- whoami, ipconfig, net view, net user, nltest -- is a signature of post-compromise
    enumeration. Three or more distinct recon binaries within the window typically indicates automated
    discovery surrounding the folder navigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: Did this host make a burst of outbound SMB or RPC connections to many distinct hosts after the folder navigation?
  context: Network Share Discovery often pairs special-folder navigation with rapid outbound SMB/RPC
    fan-out (ports 445 and 139, IPC$ / srvsvc named pipes) to enumerate shares across many hosts in a
    short window. Treat connections to roughly five or more distinct destination hosts within about ten
    minutes as scanning behavior; management agents accessing known pipes such as spoolss are expected
    and can be excluded. A clean result here weakens the share-discovery interpretation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 445
          - 139
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
- question: Does an interpreter parent normally spawn explorer.exe with a shell namespace token on this host?
  context: Some parent-child pairings are routine, but a command interpreter launching explorer.exe with
    a shell namespace argument is uncommon outside user-driven tooling. Historical frequency of this specific
    pairing on the host distinguishes a familiar workflow from a novel spawning relationship.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        ParentImage|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
        Image|endswith: \explorer.exe
        CommandLine|contains: shell:mycomputerfolder
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        ParentImage|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
        Image|endswith: \explorer.exe
        CommandLine|contains: shell:mycomputerfolder
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or enumeration spanning
    multiple endpoints. If the same user triggered similar activity elsewhere, the scope of the activity
    may be larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        ParentImage|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
        Image|endswith: \explorer.exe
        CommandLine|contains: shell:mycomputerfolder
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining surrounding activity reveals what led to this
    event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance,
    privilege escalation, or persistence mechanisms near the folder navigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- defense tampering, reconnaissance, credential access --
    may reveal the attack stages that preceded this event and help reconstruct the timeline. The alert
    sequence tells the story of how the host reached this point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
