name: Suspicious Non-Browser Network Communication With Telegram API
id: 4864c646-2802-4db3-aec8-082380b39b0f
description: |
  Detects a non-browser process making a network connection whose destination hostname contains api.telegram.org, after excluding a list of known web browsers. The Telegram Bot API is a legitimate web service, but it is also abused as a covert command-and-control and exfiltration channel: a bot token embedded in the URL path drives sendMessage/getUpdates calls that carry tasking and stolen data over HTTPS to a trusted, rarely blocked domain. Legitimate triggers include applications with built-in Telegram integration, RSS or notification tools, and browsers not present in the exclusion list. The investigation should identify the initiating process, confirm the destination is genuine Telegram infrastructure, and determine whether the traffic shows beaconing, high outbound volume, or downloaded payloads.
type: detection
detection_id: c3dbbc9f-ef1d-470a-a90a-d343448d5875
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the destination, port, and initiating process match what this rule detects?
  context: Confirm the connection resolves to a host whose name contains api.telegram.org, that the initiating process is not one of the excluded browsers, and note the destination port and direction. The connection may come from network-level telemetry with no process fields, in which case pivot to the endpoint and DNS records to attribute the process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
- question: Is this user and host expected to run a non-browser application that talks to the Telegram API?
  context: Some line-of-business applications, chat bridges, or monitoring tools legitimately call the Telegram Bot API. Knowing whether this host and user role are consistent with such usage is often the fastest way to separate a sanctioned integration from covert C2. On network-only telemetry the process may be absent, so User may hydrate to NODATA; corroborate with asset and role records.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What process initiated the connection, and is the binary a known application or a renamed or unusual executable?
  context: The rule fires on any non-browser process, so the identity of the initiator is the central triage question. A signed application from Program Files that ships Telegram integration is very different from an unsigned or renamed binary running out of a user-writable path. Network-level telemetry may not carry the process image; where it is absent, attribute the process through the DNS lookup and endpoint process records.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - Image
      - Initiated
      - DestinationPort
- question: What is the full command line of the process that contacted the Telegram API?
  context: The command line often reveals the operational purpose of a Telegram client, such as a hardcoded bot token, a chat or channel identifier, a config-file path, or a script the process is running. Decode any flags, tokens, and paths. If network-level telemetry fired and no matching process is recorded, treat an empty result as a visibility gap and pivot to endpoint process records for the same host and window.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is the destination genuinely Telegram infrastructure, and what do threat intel and TLS details show?
  context: The Telegram Bot API is a legitimate service, so the question is not whether the domain is malicious but whether this connection is direct API abuse for covert tasking. Confirm the resolved IP belongs to Telegram's published ranges, review the TLS SNI and certificate, and check passive DNS and threat intel for the specific IP. Reputation lookups are manual; the query returns the connection details to anchor them.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - DestinationPort
- question: Which process on this host resolved api.telegram.org, and does it match the process that connected?
  context: Destination hostname is only sparsely recorded on connection events, so the DNS lookup is the reliable record of the domain request. Pairing the resolving process with the connecting process attributes the traffic to a specific binary and confirms the domain intent behind the destination IP. A non-browser process resolving the Telegram API is the pattern of interest.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|endswith: api.telegram.org
      condition: selection
    fields:
      - QueryName
      - Image
- question: What process spawned the process that contacted the Telegram API, and is that parent chain expected?
  context: The parent process reveals how the initiator was launched. Legitimate integrations usually have predictable parents such as explorer.exe or services.exe, while parents like office applications, wscript.exe, mshta.exe, or a shell suggest macro-driven or exploitation delivery of a covert client.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Has this host connected to this destination before, and from which processes?
  context: First-time connections to a destination are more suspicious than routine traffic. A low or zero historical count from this host, or connections that previously came only from a browser, points to new activity rather than an established integration.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
- question: What other connections did this host make to this destination around the time of the alert?
  context: A single connection may be one leg of a larger exchange. Surfacing the other connections to the same destination reveals repeated calls, multiple ports, or additional processes, which distinguish a one-off request from sustained C2 tasking.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
      - Initiated
- question: Do connections to this destination recur at regular intervals consistent with automated beaconing?
  context: Covert use of a web service for C2 typically produces regular, machine-driven callbacks rather than sporadic user-driven requests, and exfiltration produces bursts of high outbound-to-inbound volume. Aggregating the connections over time exposes a fixed cadence or off-hours persistence; assess the outbound data volume against flow or packet records, treating sustained transfers above roughly 1MB in a short window as a staging or exfiltration signal.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Initiated
- question: Do other hosts in the environment connect to this destination?
  context: If only this host reaches the destination, it points to targeted C2. If many hosts connect, it may be a sanctioned integration or a widespread compromise. The distribution across hosts and the processes involved inform the scope of the response.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - host.name
      - DestinationPort
      - Image
- question: Did the process or a child it spawned write a file to disk after contacting the Telegram API?
  context: A Telegram channel is frequently used to pull additional tooling. Confirming that the alerting process, or a child of it, created a file establishes whether the activity progressed from tasking to an ingress tool transfer, and where the payload landed for retrieval. Note whether any written file still persists on disk so it can be hashed and analyzed.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: If a downloaded payload was executed, what is its hash and is it known to threat intelligence?
  context: The hash needed for a reputation lookup or sandbox detonation is recorded when a payload runs, not when it is written. This query returns the processes the alerting process and its parent spawned, with their executable hashes; for a download-and-execute that is the payload. If the payload was launched later by an unrelated process it will not appear here, so retrieve the on-disk file and hash it manually.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection_children
    fields:
      - Image
      - Hashes
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Aggregating process activity around the connection surfaces what led up to it and what followed, and highlights novel parent-child pairs that stand out against routine agent and system noise. Look for reconnaissance, credential access, or persistence around the same window.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal the stages that preceded the outbound Telegram connection and help reconstruct the timeline of the operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
