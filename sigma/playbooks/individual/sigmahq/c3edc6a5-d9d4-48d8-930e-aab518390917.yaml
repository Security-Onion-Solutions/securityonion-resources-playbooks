name: Potential Persistence Via Outlook Form
id: cdbe1f28-9bfd-4da7-94cf-f730eaceb746
description: |
  Detects outlook.exe writing a file into the Outlook custom-forms cache
  (%localappdata%\Microsoft\FORMS\IPM or the legacy \Local Settings\Application
  Data\Microsoft\Forms path). Custom Outlook forms can embed VBScript that runs
  when a matching item is opened or when Outlook starts, giving mail-triggered
  persistence that survives reboots and is not tied to logon. Legitimate form
  authoring by developers or power users produces the same write, so the
  investigation is to read the form's content, determine whether it persists and
  reloads at the next Outlook start, and check whether outlook.exe subsequently
  spawned script interpreters or loaded unusual payloads.
type: detection
detection_id: c3edc6a5-d9d4-48d8-930e-aab518390917
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the written file path and the creating process match an Outlook custom-form drop?
  context: Confirm the alert is a true positive by reviewing the exact file path and the responsible process against the rule's criteria — outlook.exe writing under \Microsoft\FORMS\IPM or \Local Settings\Application Data\Microsoft\Forms. A write from a process other than outlook.exe, or to a path outside the forms cache, is a mismatch.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to author or publish custom Outlook forms?
  context: Legitimate form authoring is done by developers and power users; most mailbox owners never create custom forms. Knowing whether this account and endpoint routinely build forms is often the fastest way to separate a benign authoring session from mail-triggered persistence. When the writer is a machine or service account, judge by the host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Does the user recall designing or publishing a custom Outlook form?
  context: Direct confirmation from the mailbox owner is often the quickest way to resolve this alert. If the user built a form through the Developer tab's Design a Form workflow, the write is expected; if they do not recall any form work, the form may have been inserted programmatically into their mailbox and the account or client may be compromised. If they confirm, capture why the form was created and what it does.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What does the cached form file contain, and does it embed VBScript or other code?
  context: Read the form definition's actual content. A custom Outlook form can carry embedded VBScript that executes on item open or Outlook start; check for script blocks, shell or process-launch calls, encoded strings, embedded URLs or IP addresses, and references to interpreters such as WScript.Shell. The forms cache stores each form under its own subfolder with a frmcache.dat index, so retrieve the on-disk file from the endpoint for inspection.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Is the form still present in the forms cache, or was it deleted or replaced after the alert?
  context: A custom form that stays in the cache reloads and re-arms every time Outlook starts, which is the persistence mechanic — so a form that remains on disk is the case that needs containment. A form written and then quickly removed suggests a one-off test or anti-forensic cleanup, and shifts the focus to what executed while it was present. Clearing the forms cache and restarting Outlook is the documented remediation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did outlook.exe spawn any child processes on this host around the alert, and are any of them script interpreters or LOLBins?
  context: A malicious custom form executes by having outlook.exe launch a payload — commonly cmd.exe, powershell.exe, wscript.exe, cscript.exe, rundll32.exe, mshta.exe, or SyncAppvPublishingServer.exe. Outlook rarely spawns children at all, so any child process is worth examining; interpreter or LOLBin children are the direct execution signal for form-based persistence. The launch may fire immediately at Outlook start or be delayed until a crafted message arrives, so weigh child processes across the window rather than only at the write time.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - Hashes
- question: What DLLs did outlook.exe load around the alert, and are any of them unsigned or unusual?
  context: Form-triggered payloads can be delivered as a library loaded into the Outlook process rather than a spawned child, so an unsigned or unexpected module loaded by outlook.exe near the form write is a payload-loading signal. Load events carry the module's signature status and hash directly, so an unsigned module or one whose hash is unknown to threat intelligence is the module to pull for analysis. A missing or invalid signature on a module loaded from a user-writable path is the strongest of these to chase.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
- question: What other files did the responsible process write or delete around the alert?
  context: A process that drops one form file may also stage other artifacts — additional form definitions, script payloads, or configuration files. The breadth, paths, and extensions of the writer's other file activity distinguish a single form-authoring action from broader staging and enumerate what else needs review. The correlation covers the writing process and its direct children.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to the Outlook forms cache on this host recently, and by which processes?
  context: The forms cache is written to by outlook.exe under normal use, so other recent arrivals in the same directory reveal whether this is an isolated form or a location under active modification. Multiple form files appearing close together, or a writer other than outlook.exe touching this path, points to programmatic form insertion rather than ordinary caching. Each custom form lands in its own subfolder under this path.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\Microsoft\FORMS\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has this form file been written on this host before?
  context: A form file that has never been seen on this host is more suspicious than one that is part of an existing, long-standing custom form. Zero or very low historical counts indicate a first-time appearance of this form definition, which is worth checking even if the filename looks routine.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: When this host has previously written Outlook forms, what programs and users normally drove that activity, and does the current alert fit?
  context: The query mirrors the rule's selection scoped to this host, so the resulting program and user distribution reflects how form writes to this cache have historically occurred here — not generic outlook.exe usage. A new acting program process, an unexpected user account, or a first-ever appearance of this pattern is the deviation worth chasing. Form-triggered execution timing varies, so treat any historical baseline as the pattern of writes rather than of the downstream execution.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith: \outlook.exe
        TargetFilename|contains:
        - \AppData\Local\Microsoft\FORMS\IPM
        - \Local Settings\Application Data\Microsoft\Forms
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: Were other Outlook startup-persistence registry values set on this host around the alert?
  context: Forms are one of several Office-startup persistence mechanisms, and operators frequently stack them. Registry-based siblings include EnableUnsafeClientMailRules (Outlook Rules), LoadMacroProviderOnBoot and the Security Level value (macro persistence), EnableRoamingFolderHomepages, NonDefaultStoreScript and UserDefinedUrl (Outlook Home Page / Today). Any of these set within the same window as the form write indicates intentional persistence stacking rather than isolated form authoring. Values may vary across Outlook 2013, 2016, and M365 builds.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - EnableUnsafeClientMailRules
          - LoadMacroProviderOnBoot
          - EnableRoamingFolderHomepages
          - NonDefaultStoreScript
          - UserDefinedUrl
          - \Outlook\Today\
          - \Outlook\Security\Level
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- always_include: true
  question: Has this user previously written to the Outlook forms cache, and does that history fit their role?
  context: The query mirrors the rule's selection scoped to this user, giving their 90-day history of form-cache writes aggregated by host — not generic outlook.exe activity. A user who has never produced this pattern is more suspicious than one who authors forms regularly; weigh the count against whether form development is part of their role.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith: \outlook.exe
        TargetFilename|contains:
        - \AppData\Local\Microsoft\FORMS\IPM
        - \Local Settings\Application Data\Microsoft\Forms
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven form-cache writes on this host or across the environment, or is the program new for this activity?
  context: 'When the alert fires under a service or machine account, user identity does not attribute the behavior — the meaningful pivot is the launch mechanism. The query mirrors the rule''s selection scoped to the alerting program, giving the 90-day history of this program driving form-cache writes. A new or rare program for this pattern is the deviation worth chasing; a program that already accounts for many prior events is routine automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith: \outlook.exe
        TargetFilename|contains:
        - \AppData\Local\Microsoft\FORMS\IPM
        - \Local Settings\Application Data\Microsoft\Forms
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the form write is isolated or part of broader activity. If the same account triggered comparable actions on multiple endpoints in the same window, the scope of the investigation may be larger than a single mailbox.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven form-cache write fire on other hosts in the same window, or is it isolated to this host?
  context: 'Under a service or machine account, network-wide user activity is dominated by agent telemetry, so the meaningful question is whether the same launch mechanism fired elsewhere. The query mirrors the rule''s selection scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts in the same window points to a pushed or scheduled rollout; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith: \outlook.exe
        TargetFilename|contains:
        - \AppData\Local\Microsoft\FORMS\IPM
        - \Local Settings\Application Data\Microsoft\Forms
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Have other hosts written Outlook forms to this cache in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of form-cache writes rather than generic outlook.exe usage. Many hosts producing the same pattern points to a managed form deployment or a spreading operation; one host or a small unrelated set points to manual or targeted activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith: \outlook.exe
        TargetFilename|contains:
        - \AppData\Local\Microsoft\FORMS\IPM
        - \Local Settings\Application Data\Microsoft\Forms
      condition: selection
    fields:
    - host.name
