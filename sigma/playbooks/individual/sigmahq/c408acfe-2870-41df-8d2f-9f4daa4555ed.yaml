name: Potential Exploitation of CVE-2024-37085 - Suspicious Creation Of ESX Admins Group
id: b6c7c5e6-0dd3-4141-b6c0-20f1aec4b261
description: |
  Detects command-line creation of an Active Directory group named "ESX Admins", fired by either
  of two branches: a net.exe or net1.exe command line that carries /add, /domain, group and the
  string "ESX Admins" together, or a PowerShell command line that carries New-ADGroup and
  "ESX Admins" together. Domain-joined VMware ESXi hypervisors grant full administrative rights
  to any domain group with that exact name, so creating the group and placing an account in it
  yields hypervisor administrator access without authenticating to the hypervisor at all
  (CVE-2024-37085); the same pattern has been used to reach and encrypt hosted virtual machines.
  Creation of this group can be deliberate where an ESXi estate is intentionally domain-joined,
  so the investigation should determine whether the group creation was a planned change, which
  accounts ended up in the group, and what the account and parent process that ran the command
  did before and after.
type: detection
detection_id: c408acfe-2870-41df-8d2f-9f4daa4555ed
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the alerting command line either add a domain group named "ESX Admins" with net.exe, or create that group with the New-ADGroup cmdlet?
  context: >-
    The rule fires on either of two branches. The net branch requires a net.exe or net1.exe
    command line carrying /add, /domain, group and the string "ESX Admins" all together; the
    PowerShell branch requires New-ADGroup and "ESX Admins" together. Note which branch fired,
    because it changes where the follow-up evidence lives — the net branch points at a shell or
    script invocation, the PowerShell branch at cmdlet-driven administration with script-level
    arguments worth reading.
  range: +/-30d
  answer_sources:
  - alert
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: What exactly did the group command do, and which account was added to the group?
  context: >-
    Decode every argument of the alerting command line and of any sibling invocations in the same
    window. Group manipulation from the command line frequently arrives in pairs, one invocation
    creating the group and a second adding a member, so the alerting event alone may show only
    half of the operation. The member account is the identity that would inherit hypervisor
    administrator rights, so identify it explicitly.
  range: +/-5m
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: 'ESX Admins'
      condition: selection
    fields:
      - CommandLine
      - Image
      - CurrentDirectory
- question: Was the PowerShell command encoded or obfuscated, and what does the full New-ADGroup invocation resolve to?
  context: >-
    The command line matched in plain text, but the same cmdlet is reachable through
    -EncodedCommand, string concatenation, backtick escaping, or variable substitution, and a
    single readable fragment can sit inside a larger obfuscated script. Decode or deobfuscate the
    command line and read the group name, the -Path the group is created under, the -GroupScope,
    and any member arguments. This question does not apply when the net.exe branch fired.
  range: +/-30d
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Was an "ESX Admins" group actually created in the directory, and were members added to it?
  context: >-
    A process_creation event proves the command was launched, not that it succeeded. Domain
    controller security events record group creation (4727 and 4731) and membership additions
    (4728 and 4732), with the group name in TargetUserName and the added account in MemberName.
    Confirming the group exists and enumerating its members establishes whether hypervisor
    administrative rights were actually granted and to which accounts. If domain controller
    security events are not collected in this environment, treat an empty result as a visibility
    gap rather than evidence the group was never created.
  range: -7d
  answer_sources:
  - active_directory
  - manual_review
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 4727
          - 4728
          - 4731
          - 4732
        TargetUserName|contains: 'ESX Admins'
      condition: selection
    fields:
      - EventID
      - TargetUserName
      - MemberName
      - SubjectUserName
- question: What process spawned the group command, and is that parent normal for domain group management?
  context: >-
    Deliberate group management runs from an administrator console spawned by explorer.exe, or
    from a provisioning script under a scheduler or configuration-management agent. Parents such
    as wmiprvse.exe, wsmprovhost.exe, mshta.exe, wscript.exe, or an Office application indicate
    remote or automated execution driven from elsewhere. The parent command line often carries
    the wrapping script or the remote-execution invocation that explains the operation.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: What spawned the parent process of this command, and how was that parent itself started?
  context: >-
    The immediate parent is visible in the alert; walking one level further up shows how the shell
    or scripting host was started — a remote execution service, a scheduled task, or an
    interactive logon. Long-running parents such as consoles, service hosts, and logon sessions
    frequently start hours or days before the alert, so a wide lookback is expected here.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Is the account that ran this command expected to create or modify domain groups?
  context: >-
    Domain group creation is normally limited to identity administrators and to provisioning
    automation running under a known service account. A helpdesk, workstation, or standard user
    account creating a domain group is a deviation. Check whether the account holds delegated
    group-management rights in the directory and whether its owner acknowledges the action.
  range: +/-30d
  answer_sources:
  - organizational_knowledge
  - asset_inventory
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: Were PowerShell security controls bypassed or weakened on this host before this execution?
  context: >-
    Execution policy bypass, AMSI patching, an engine downgrade to version 2, and antivirus
    real-time monitoring changes commonly precede hands-on directory changes. Finding them in the
    preceding hour ties the group creation to an operator working through a prepared foothold
    rather than to a routine administrative task run from a console.
  range: -1h
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: Did other reconnaissance commands run on this host around the same time?
  context: >-
    A single net.exe invocation can be routine administration, but several enumeration binaries in
    the same window is the pattern of post-compromise mapping. Directory-focused enumeration such
    as nltest, dsquery, and net group immediately before the group creation suggests the operator
    was locating the domain path to the hypervisor estate. PowerShell directory cmdlets such as
    Get-ADGroup, Get-ADComputer, and [ADSISearcher] queries serve the same purpose and appear in
    command lines rather than as distinct binaries.
  range: +/-15m
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: What child processes did the alerting process spawn afterward?
  context: >-
    net.exe normally re-executes itself as net1.exe and spawns nothing else. A PowerShell session
    that created the group may go on to add members, query the directory, or reach out to the
    hypervisor estate. Children beyond the expected net1.exe hand-off indicate the operation
    continued past the group creation.
  range: +4h
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating process activity on the host collapses repetitive agent telemetry into high-count
    rows while novel parent-child pairs stand out at low counts. Scan for credential access
    tooling, remote execution frameworks, and binaries staged shortly before or after the group
    creation, which place this event in the operation's timeline.
  range: +/-15m
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- always_include: true
  question: Has this user previously produced this group-creation pattern, and does that history fit their role?
  context: >-
    The query counts this account's 90-day history of the rule's exact firing pattern, aggregated
    by host, rather than its generic use of net.exe or PowerShell. An account that has never
    produced the pattern is a deviation; one that produces it regularly is more likely running
    provisioning automation. Weigh the count against the account's delegated directory rights and
    normal toolset.
  range: -90d
  answer_sources:
  - process_creation
  - organizational_knowledge
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_net_img:
      - Image|endswith:
        - \net.exe
        - \net1.exe
      - OriginalFileName:
        - net.exe
        - net1.exe
      selection_net_cmd:
        CommandLine|contains|all:
        - /add
        - /domain
        - ESX Admins
        - group
      selection_powershell_img:
      - Image|endswith:
        - \PowerShell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.exe
        - pwsh.dll
      selection_powershell_cli:
        CommandLine|contains|all:
        - New-ADGroup
        - ESX Admins
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_net_* or all of selection_powershell_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this parent process historically driven this group-creation pattern on this host or across the environment?
  context: >-
    When the alert fires under SYSTEM, a service account, or a computer account, user identity
    does not attribute the behavior and the launch mechanism does. The query counts 90 days of
    this parent process driving the rule's exact firing pattern, aggregated by host. A parent that
    already accounts for many prior events is provisioning or vendor automation; a parent that is
    new or rare for this pattern is the deviation worth chasing.
  range: -90d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_net_img:
      - Image|endswith:
        - \net.exe
        - \net1.exe
      - OriginalFileName:
        - net.exe
        - net1.exe
      selection_net_cmd:
        CommandLine|contains|all:
        - /add
        - /domain
        - ESX Admins
        - group
      selection_powershell_img:
      - Image|endswith:
        - \PowerShell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.exe
        - pwsh.dll
      selection_powershell_cli:
        CommandLine|contains|all:
        - New-ADGroup
        - ESX Admins
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_net_* or all of selection_powershell_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user account do across the environment around this time?
  context: >-
    Tracking the account across all hosts shows whether the group creation was one step in a
    session that also touched other systems. Concentration on a single host points to local
    administration; activity spanning several hosts in the same window points to lateral movement
    under the same credentials. When the alert fires under a service principal this view fills
    with routine agent telemetry and the parent-scoped clustering view carries the answer instead.
  range: +/-1h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did the same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    The query counts the rule's exact firing pattern scoped to the alerting parent process,
    fleet-wide, within the alert window. Several hosts in the same window points to scheduled or
    pushed automation; a single host points to a host-local trigger such as an operator session.
    This is the meaningful clustering view when the alert fires under a service principal, where
    user-scoped clustering returns agent noise.
  range: +/-1h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_net_img:
      - Image|endswith:
        - \net.exe
        - \net1.exe
      - OriginalFileName:
        - net.exe
        - net1.exe
      selection_net_cmd:
        CommandLine|contains|all:
        - /add
        - /domain
        - ESX Admins
        - group
      selection_powershell_img:
      - Image|endswith:
        - \PowerShell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.exe
        - pwsh.dll
      selection_powershell_cli:
        CommandLine|contains|all:
        - New-ADGroup
        - ESX Admins
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_net_* or all of selection_powershell_*) and _pb_scope
    fields:
    - host.name
- question: When this host has previously fired this pattern, what parents and users drove it, and does the current alert fit?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the parent and user
    distribution reflects how this specific firing pattern has run here rather than generic net.exe
    or PowerShell usage. An empty history, a new parent process, or an unexpected account are the
    deviations worth chasing.
  range: -14d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_net_img:
      - Image|endswith:
        - \net.exe
        - \net1.exe
      - OriginalFileName:
        - net.exe
        - net1.exe
      selection_net_cmd:
        CommandLine|contains|all:
        - /add
        - /domain
        - ESX Admins
        - group
      selection_powershell_img:
      - Image|endswith:
        - \PowerShell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.exe
        - pwsh.dll
      selection_powershell_cli:
        CommandLine|contains|all:
        - New-ADGroup
        - ESX Admins
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_net_* or all of selection_powershell_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query counts the rule's firing pattern fleet-wide with no host scope. Many hosts producing
    the same pattern points to scripted provisioning or a configuration-management rollout; one
    host, or a small unrelated set, points to manual operator activity. Because the group name
    grants hypervisor administrative rights by default wherever the directory is trusted by an
    ESXi estate, any host outside a known provisioning path deserves the same treatment as the
    alerting one.
  range: -7d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_net_img:
      - Image|endswith:
        - \net.exe
        - \net1.exe
      - OriginalFileName:
        - net.exe
        - net1.exe
      selection_net_cmd:
        CommandLine|contains|all:
        - /add
        - /domain
        - ESX Admins
        - group
      selection_powershell_img:
      - Image|endswith:
        - \PowerShell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.exe
        - pwsh.dll
      selection_powershell_cli:
        CommandLine|contains|all:
        - New-ADGroup
        - ESX Admins
      condition: all of selection_net_* or all of selection_powershell_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Directory changes of this kind sit late in an operation, so earlier detections on the same
    host — credential access, defense tampering, remote execution — usually carry the initial
    access and escalation story. Reconstructing that order shows how the operator reached a
    position from which domain groups could be modified.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
