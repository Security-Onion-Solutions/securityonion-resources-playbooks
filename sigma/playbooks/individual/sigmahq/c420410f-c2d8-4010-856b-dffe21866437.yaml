name: Enable LM Hash Storage
id: 2f984d18-e56c-496e-a215-e7f4cc689fc2
description: |
  This rule detects a write to the NoLMHash registry value under HKLM\System\CurrentControlSet\Control\Lsa that sets it to DWORD 0, which re-enables Windows storage of the weak LAN Manager (LM) hash of account passwords in the local SAM and Active Directory. The hardened value is 1 (LM storage disabled, the default on modern Windows); flipping it to 0 makes newly set password hashes GPU-crackable in seconds and is a credential-access enabler typically performed by an administrator-level actor before dumping the SAM and SECURITY hives. Legitimate changes to this policy are normally pushed uniformly via Group Policy, so a direct single-host registry write should be investigated to confirm who made the change, whether it persisted, and whether credential-dumping activity followed.
type: detection
detection_id: c420410f-c2d8-4010-856b-dffe21866437
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Do the registry key path and value data match the NoLMHash re-enable pattern this rule detects?
  context: >-
    The rule fires only when both conditions hold together, a TargetObject ending in
    System\CurrentControlSet\Control\Lsa\NoLMHash and a Details value of DWORD (0x00000000).
    Value 0 re-enables on-disk LM hash storage; the hardened setting is 1. Confirm the exact key path,
    value data, and writing process before investing further investigation time.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify the LSA security policy that governs LM hash storage?
  context: >-
    Changes to credential-protection policy are normally made by a small set of administrators or
    domain-management automation, and most often on domain controllers. A modification from a workstation,
    a service account, or a user with no security-administration role is far more likely to be adversarial.
    The writing process (Image) matters when User resolves to a machine account or SYSTEM.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value was written to the NoLMHash setting and what protection does it change?
  context: >-
    A Details value of DWORD (0x00000000) tells Windows it may store the LAN Manager hash of passwords,
    a DES-derived, case-insensitive, unsalted digest that rainbow-tables crack in seconds on commodity GPUs.
    The hardened value is 1. Reading the Details field confirms whether this write weakened credential storage
    (set to 0) rather than hardened it (set to 1).
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Is the modified LSA key a known credential-protection setting and what process wrote it?
  context: >-
    The Lsa\NoLMHash value governs whether Windows retains the weak LM hash of account passwords on disk.
    It is a security-weakening location rather than a persistence launch point, so the value data itself is
    the payload. Identify the writing process (Image) to distinguish a policy-management tool from a
    reg.exe, powershell.exe, or renamed binary run interactively.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Does the NoLMHash setting stay at the weakened value or was it flipped back?
  context: >-
    Endpoint telemetry emits no registry key or value deletion events, so cleanup cannot be observed directly.
    Judge whether the weakening persists from the key's re-modification history over the following hours, whether
    a later write returned it to DWORD 1 (a revert, often GPO reasserting policy) or it stays at 0. A value that
    remains at 0 keeps credential storage weakened for every subsequent password change.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Is the process that wrote this setting spawned by an expected parent, and what started that parent?
  context: >-
    Legitimate policy changes originate from Group Policy processing or an administrator running reg.exe from an
    interactive shell. Tracing the writing process back to its parent reveals whether the chain is routine or
    suspicious, for example reg.exe or powershell.exe launched by wmiprvse.exe, an Office application, or a
    renamed binary. Flag unsigned or abnormal parent-child lineage performing this modification.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other registry modifications occurred on this host in the same session?
  context: >-
    Actors who weaken one credential-protection setting frequently flip several, for example lowering the LAN
    Manager authentication level, enabling RestrictedAdmin, or disabling security tooling in the same window.
    Grouping registry writes by key path and writing process shows whether the NoLMHash change landed alongside
    other security-policy or persistence changes.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: After LM hash storage was re-enabled, did credential-dumping activity follow on this host?
  context: >-
    Re-enabling LM hash storage only pays off once the credential material is harvested. Look in the hours after
    the change for SAM, SECURITY, or SYSTEM hive saves via reg.exe or for LSASS credential-dumping command strings.
    Finding these confirms the weakening was leveraged rather than an isolated misconfiguration.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
          - 'reg save'
          - 'HKLM\SAM'
          - 'HKLM\SECURITY'
          - 'lsadump'
          - 'sekurlsa'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other process activity occurred on this host around the time of the change?
  context: >-
    Credential weakening rarely occurs in isolation. Aggregating process activity in the surrounding window
    surfaces reconnaissance (whoami, nltest, tasklist), credential tooling, and archive or exfiltration commands
    that cluster around hands-on credential-access activity, while collapsing routine agent telemetry into
    high-count rows.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Has the NoLMHash value been modified before on this host?
  context: >-
    Security-policy keys should rarely change. A history showing this value has never been written on this host,
    or was previously only set to the hardened value 1, makes a fresh write to 0 stand out. Repeated flips can
    indicate contention between an actor and Group Policy reasserting the hardened setting.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Did other detections fire on this host before the NoLMHash change?
  context: >-
    Credential weakening is usually a late stage of intrusion. Earlier detections on the same host, such as
    defense tampering, reconnaissance, or exploitation, help reconstruct the sequence that led to this event
    and confirm whether the change is part of an active multi-stage operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other persistence or registry-tampering tools run on this host in the same window?
  context: >-
    Registry, scheduling, and service-control tools run together often mark a hands-on session rather than a
    single administrative change. Seeing reg.exe alongside wmic.exe, schtasks.exe, or sc.exe in the surrounding
    window indicates the credential-weakening write was one action among several.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Was the NoLMHash value changed on other hosts in the environment?
  context: >-
    The same write across many hosts may be a mis-scoped Group Policy change (compare the Details value, which
    would be 1 for hardening) or credential weakening pushed across multiple domain controllers. A change on a
    single host, especially a domain controller, is more consistent with targeted activity. Compare Details values
    across hosts to tell hardening from weakening.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Was there a change ticket or approved maintenance window for modifying the LM hash storage policy?
  context: >-
    Security-policy changes on domain controllers and privileged hosts usually require documented approval. A
    corresponding ticket suggests authorized hardening or testing; the absence of one where policy requires it
    points toward unauthorized activity and helps quickly close or escalate the alert.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is a direct registry write to the LSA policy consistent with how your organization changes security policy?
  context: >-
    Credential-protection settings are normally managed centrally through Group Policy rather than a direct
    reg.exe or PowerShell write on an individual host. A one-off command-line modification may indicate an actor
    bypassing standard tooling, or an administrator taking a shortcut. Understanding the normal procedure
    distinguishes the two.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
