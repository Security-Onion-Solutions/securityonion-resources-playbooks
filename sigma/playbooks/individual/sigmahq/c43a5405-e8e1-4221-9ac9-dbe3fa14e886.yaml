name: System Language Discovery via Reg.Exe
id: 9f3c1d2a-7b54-4e08-9a6f-2c1d8e4b7a30
description: |
  Detects reg.exe being used to query the system language configuration under the
  registry path Control\Nls\Language. The rule fires when reg.exe (by image name or
  original file name) runs with a command line that contains both a query operation
  and the Control\Nls\Language key path. Reading the system UI language is a benign
  diagnostic on its own, but it is also a common discovery step: operators enumerate
  the system locale to fingerprint a victim's region, tailor a payload, or skip hosts
  in locales they intend to avoid. Investigation should confirm the exact query, identify
  what process invoked reg.exe, and look for the surrounding reconnaissance that locale
  discovery usually accompanies.
type: detection
detection_id: c43a5405-e8e1-4221-9ac9-dbe3fa14e886
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- question: Did reg.exe run a query against the Control\Nls\Language registry path?
  context: Confirm the alert is a true positive by reviewing the exact command line and
    process details. The rule fires only when reg.exe (or a binary whose original file
    name is reg.exe) runs with a command line containing both a query operation and the
    path Control\Nls\Language. Verify both elements are present and note the full key
    path that was queried.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to query system locale settings from the command line?
  context: Network administrators and IT staff occasionally read locale or language
    settings while troubleshooting, and some software installers query the system UI
    language. Standard users and most service accounts have no reason to run reg.exe
    against Control\Nls\Language. The user's role and the host's function determine
    whether this read is routine diagnostics or post-compromise fingerprinting.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: What exact registry key did the query target, and does the full path match the system-language locale keys?
  context: The Control\Nls\Language subtree holds the installed and default UI language
    identifiers (for example InstallLanguage and Default under
    HKLM\SYSTEM\CurrentControlSet\Control\Nls\Language). Because this is a read rather
    than a write, the command line itself is the source of truth for what was queried;
    reg query does not emit a registry-modification event. Parse the full key path and
    any value name from the command line and confirm whether the query targeted the
    system default language, the installed language, or the broader Nls subtree.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned reg.exe, and is that parent chain expected for a locale query?
  context: The parent process reveals how the locale query was invoked. reg.exe launched
    by explorer.exe or an interactive shell points to manual diagnostics, while reg.exe
    launched by a script host (wscript.exe, cscript.exe, mshta.exe), an Office application,
    powershell.exe, or wmiprvse.exe points to automated enumeration. Identify the parent
    and what else it spawned to reconstruct how the query reached the host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What process spawned the locale-query command, and is that parent normal for system discovery?
  context: Legitimate discovery commands are usually run from cmd.exe spawned by
    explorer.exe (a user opening a command prompt) or from an automation script. Locale
    queries spawned by Office applications, script interpreters, mshta.exe, or
    wmiprvse.exe indicate automated post-exploitation enumeration rather than an
    operator troubleshooting at a console.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single locale query may be benign diagnostics, but multiple reconnaissance
    commands in rapid succession -- whoami, systeminfo, ipconfig, net user, nltest -- is
    a signature pattern of post-compromise enumeration. Locale discovery is frequently
    one step in a fingerprinting sweep an operator runs to understand a host before
    moving to the next stage.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: Did processes on this host invoke locale-related APIs or query other Nls/locale keys around this time?
  context: System language discovery is not limited to reg.exe. The same intent shows
    up as other reg queries against the Nls subtree or InternationalSettings, and as
    locale-related API calls (GetUserDefaultUILanguage, GetSystemDefaultUILanguage,
    GetKeyboardLayoutList, GetLocaleInfoW). Finding additional locale or keyboard-layout
    reads on the host -- especially from script hosts or unknown binaries -- strengthens
    the case that this is deliberate region fingerprinting rather than an isolated read.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_locale:
        CommandLine|contains:
          - 'Control\Nls'
          - 'GetUserDefaultUILanguage'
          - 'GetSystemDefaultUILanguage'
          - 'GetKeyboardLayoutList'
          - 'GetLocaleInfo'
          - 'GetTimeZoneInformation'
          - 'Get-WinSystemLocale'
          - 'Get-Culture'
          - 'Get-WinUILanguageOverride'
      condition: selection and selection_locale
    fields:
      - Image
      - CommandLine
      - User
- question: What did reg.exe spawn afterward, and did follow-on activity progress beyond discovery?
  context: A locale read on its own changes nothing, so the investigative value is in
    what came next. reg.exe legitimately spawns nothing; child processes following the
    query -- cmd.exe, powershell.exe, certutil.exe, or a payload -- indicate the
    discovery fed directly into an execution or download stage. The forward window
    captures progression from fingerprinting into hands-on action.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the process activity surrounding
    the locale query shows what led up to it and what followed -- reconnaissance,
    privilege escalation, persistence installation, or staging -- and provides the
    broader context for whether the read was part of a larger sequence. Novel
    parent-child pairs stand out against the high-count agent telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Was reg.exe executed from its expected System32 or SysWOW64 path?
  context: reg.exe executed from outside System32 or SysWOW64, or a binary whose original
    file name is reg.exe running under a different file name, can indicate the binary was
    copied or renamed to evade path-based or name-based controls. Compare the Image path
    against the OriginalFileName to confirm this is the genuine system reg.exe.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Were other discovery LOLBins used on this host recently?
  context: Operators who run one discovery binary usually run several. Locale discovery
    commonly sits alongside other living-off-the-land enumeration -- wmic, query.exe,
    dnscmd, or systeminfo -- and finding multiple discovery LOLBins performing
    fingerprinting on the same host in a short window strengthens the case that this is
    deliberate reconnaissance rather than a one-off diagnostic.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\wmic.exe'
          - '\query.exe'
          - '\qprocess.exe'
          - '\quser.exe'
          - '\dnscmd.exe'
          - '\nltest.exe'
          - '\setspn.exe'
          - '\dsquery.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\nbtstat.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_cli:
        CommandLine|contains|all:
        - query
        - Control\Nls\Language
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_cli:
        CommandLine|contains|all:
        - query
        - Control\Nls\Language
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around this time?
  context: Tracking the user's activity across all hosts reveals whether the same account
    performed similar enumeration on multiple endpoints. If the user triggered comparable
    discovery elsewhere, the scope of the activity may be larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_cli:
        CommandLine|contains|all:
        - query
        - Control\Nls\Language
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired this locale-query pattern in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the
    result is a fleet-wide count of the locale-query pattern, not generic reg.exe usage.
    Many hosts firing the same pattern points to scripted deployment or a software
    installer reading the system language; one host or a small unrelated set points to
    manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_cli:
        CommandLine|contains|all:
        - query
        - Control\Nls\Language
      condition: all of selection_*
    fields:
    - host.name
- question: How often has this host fired the locale-query pattern over the past 90 days, and what command-line structures are typical?
  context: A locale-query pattern with no prior history on a host is more suspicious than
    one seen regularly under stable parents (for example a recurring inventory script).
    The query mirrors the rule's selection structure scoped to this host, so the count
    reflects the rule's specific firing pattern, not generic reg.exe usage. The
    command-line projection lets the analyst compare typical invocation patterns against
    the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_cli:
        CommandLine|contains|all:
        - query
        - Control\Nls\Language
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- question: Did other detections fire on this host in the hours before this alert?
  context: Discovery rarely happens in isolation. Earlier detections on the same host --
    initial execution, script-host activity, credential access, or other reconnaissance
    -- may reveal the stages that preceded the locale query and help reconstruct the full
    timeline of activity on the host.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
