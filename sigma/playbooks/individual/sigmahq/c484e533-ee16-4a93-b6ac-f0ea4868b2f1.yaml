name: HackTool - SharpUp PrivEsc Tool Execution
id: 293b91fb-d99b-481e-8932-fb2d71ee4070
description: |
  Detects execution of SharpUp, a C# privilege-escalation reconnaissance tool that runs the canonical Windows local-PrivEsc checks (modifiable services, unquoted service paths, DLL-hijackable PATH entries, cached Group Policy Preferences passwords, and similar) and reports exploitable findings without weaponizing them. The rule fires when a process matches any one of three conditions - the image name ends in SharpUp.exe, the file Description is "SharpUp", or the command line contains one of the named check keywords (HijackablePaths, UnquotedServicePath, ProcessDLLHijack, ModifiableServiceBinaries, ModifiableScheduledTask, DomainGPPPassword, CachedGPPPassword). Because SharpUp is a read-only enumeration tool frequently launched in memory via execute-assembly, the investigation should establish which checks were run, who and what launched it, whether the run was an authorized assessment, and what activity preceded or followed it on the host.
type: detection
detection_id: c484e533-ee16-4a93-b6ac-f0ea4868b2f1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does this process match SharpUp by image name, file description, or one of its privesc-check keywords?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when any one branch matches - the image name ends in SharpUp.exe, OR the file Description equals "SharpUp", OR the command line contains a check keyword such as HijackablePaths, UnquotedServicePath, ProcessDLLHijack, ModifiableServiceBinaries, ModifiableScheduledTask, DomainGPPPassword, or CachedGPPPassword. Note which branch fired - a Description match on a renamed binary, or a keyword-only match, changes how much weight to give the binary name downstream.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - Description
- question: Is this SharpUp execution part of an authorized penetration test or red team engagement?
  context: >-
    Offensive privilege-escalation tools like SharpUp are routinely used in authorized security assessments. Before deeper analysis, check whether a pentest or red team exercise is active on this host or network segment. An authorized engagement with matching tool usage and timing resolves the alert without further work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which SharpUp checks were invoked, and was audit mode used?
  context: >-
    SharpUp is multi-purpose - the command-line arguments name which checks ran (HijackablePaths, UnquotedServicePath, ProcessDLLHijack, ModifiableServiceBinaries, ModifiableScheduledTask, DomainGPPPassword, CachedGPPPassword, or "audit" to force all checks regardless of integrity level). The selected checks reveal what escalation surface the operator was probing - service hijacks, scheduled-task weaknesses, or cached GPP credentials - which scopes the potential compromise and the follow-up actions.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user expected to run local privilege-escalation enumeration tools?
  context: >-
    Penetration testers and security staff legitimately run privesc reconnaissance during assessments. Standard users and most administrators have no routine reason to execute SharpUp-style enumeration. The user's role and typical toolset determine whether this activity is sanctioned or anomalous.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: What process spawned this tool, and is that parent chain expected?
  context: >-
    The parent process reveals how the tool was launched. A console started by explorer.exe suggests interactive operator use; parents like wmiprvse.exe, wsmprovhost.exe, mshta.exe, rundll32.exe, or an Office application point to remote execution or a download cradle - and clr.dll loaded under an atypical parent suggests in-memory execute-assembly delivery where no SharpUp.exe ever touched disk.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Did the alerting process load the .NET runtime from an unusual parent, indicating in-memory execute-assembly delivery?
  context: >-
    SharpUp is a single .NET assembly commonly run via execute-assembly, leaving no SharpUp.exe on disk. In that case the on-host signal is a clr.dll or mscoree.dll image load inside a process whose parent is not a normal .NET host - rundll32.exe, a beacon process, or a service spawned outside expected automation. Correlating the image-load event with the alerting process clarifies whether the binary executed from disk or was injected in memory.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_clr:
        ImageLoaded|endswith:
          - '\clr.dll'
          - '\mscoree.dll'
          - '\mscorlib.ni.dll'
      condition: selection and selection_clr
    fields:
      - Image
      - ImageLoaded
      - ProcessGuid
- question: Does this host normally run SharpUp?
  context: >-
    A binary that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low historical counts over the trailing 90 days indicate first-time or rare execution - expected for an offensive privesc tool outside of a sanctioned assessment.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this SharpUp pattern, what parents and users drove it, and does the current alert fit?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the resulting parent/user distribution reflects how this specific firing pattern has historically run here - not generic binary usage. A new parent process, an unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \SharpUp.exe
      - Description: SharpUp
      - CommandLine|contains:
        - HijackablePaths
        - UnquotedServicePath
        - ProcessDLLHijack
        - ModifiableServiceBinaries
        - ModifiableScheduledTask
        - DomainGPPPassword
        - CachedGPPPassword
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did SharpUp spawn afterward?
  context: >-
    SharpUp itself is non-destructive and reports findings without exploiting them, so it normally spawns no children. Child processes such as cmd.exe, powershell.exe, sc.exe, or certutil.exe shortly after the run suggest the operator moved from enumeration to acting on a discovered escalation path.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \SharpUp.exe
      - Description: SharpUp
      - CommandLine|contains:
        - HijackablePaths
        - UnquotedServicePath
        - ProcessDLLHijack
        - ModifiableServiceBinaries
        - ModifiableScheduledTask
        - DomainGPPPassword
        - CachedGPPPassword
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \SharpUp.exe
      - Description: SharpUp
      - CommandLine|contains:
        - HijackablePaths
        - UnquotedServicePath
        - ProcessDLLHijack
        - ModifiableServiceBinaries
        - ModifiableScheduledTask
        - DomainGPPPassword
        - CachedGPPPassword
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar enumeration on several hosts in the same window, the scope of the activity is larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \SharpUp.exe
      - Description: SharpUp
      - CommandLine|contains:
        - HijackablePaths
        - UnquotedServicePath
        - ProcessDLLHijack
        - ModifiableServiceBinaries
        - ModifiableScheduledTask
        - DomainGPPPassword
        - CachedGPPPassword
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other reconnaissance commands run on this host around the same time?
  context: >-
    A single discovery command may be benign troubleshooting, but several in rapid succession - whoami, net user, nltest, systeminfo - is a signature of post-compromise enumeration. SharpUp run alongside a burst of native recon binaries within a tight window indicates an operator mapping the host before acting.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: Did the alerting process write files to user-writable or installer directories on this host?
  context: >-
    Several SharpUp checks key on user-writable locations - HijackablePaths and ProcessDLLHijack flag writable PATH and DLL-search directories, ModifiableServiceBinaries flags writable service binPaths. If the operator followed a finding by planting a payload into one of those directories, the file write appears here even after the enumeration process exits. Watch for executables or DLLs dropped to %TEMP%, ProgramData, or installer unpack paths under the same process.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining activity around the alert reveals what led to it and what followed - reconnaissance, privilege escalation attempts, or persistence installation - and whether the SharpUp run is one step in a larger sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - defense tampering, credential access, or reconnaissance - may reveal the attack stages that preceded this enumeration and help reconstruct the timeline. A privesc-discovery run that follows an initial-access or execution alert is more concerning than one in isolation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired this SharpUp pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, giving a fleet-wide count of this firing pattern rather than generic binary usage. Many hosts firing the same pattern points to a scripted assessment sweep; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \SharpUp.exe
      - Description: SharpUp
      - CommandLine|contains:
        - HijackablePaths
        - UnquotedServicePath
        - ProcessDLLHijack
        - ModifiableServiceBinaries
        - ModifiableScheduledTask
        - DomainGPPPassword
        - CachedGPPPassword
      condition: selection
    fields:
    - host.name
