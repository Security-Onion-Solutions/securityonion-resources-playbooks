name: Renamed PAExec Execution
id: bc5a90ec-d908-42e1-b622-d1129ea1c296
description: |
  Detects a process that carries PAExec's PE metadata (OriginalFileName, Description, Product) or one of its known import hashes while running from a filename or path other than the canonical PAExec install location. PAExec is a redistributable PsExec equivalent that installs a temporary remote service over SMB and runs commands on remote hosts, often as SYSTEM; renaming or relocating it is common tradecraft to evade name-based blocking while keeping the remote-execution capability. Investigation should confirm the metadata/hash match, identify what the tool was directed to do, and determine whether this is sanctioned administration or hands-on-keyboard lateral movement.
type: detection
detection_id: c4e49831-1496-40cf-8ce1-b53f942b02f9
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does this process carry PAExec PE metadata or a known PAExec import hash while running from a non-canonical PAExec path?
  context: >-
    The rule fires when a process matches PAExec by OriginalFileName, Description, Product, or import hash AND is not running from a canonical PAExec location (filename ending in paexec.exe, or a path under the auto-copied C:\Windows\PAExec- prefix). Confirm the metadata and hash on the triggering event and note the actual Image path; a match outside the canonical location is the renamed/relocated condition the rule targets.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - OriginalFileName
      - Description
      - Hashes
      - Product
- question: Is this user and host expected to run a remote-execution administration tool like PAExec?
  context: PAExec is legitimately used by administrators and is sometimes bundled and renamed by software vendors. Knowing whether this user role and host function normally perform remote command execution is often the fastest way to separate sanctioned administration from operator activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the actual identity of this binary based on its metadata and hash?
  context: When PAExec is renamed, the on-disk Image name differs but the embedded PE metadata (OriginalFileName PAExec.exe, Product PAExec) and import hash still reveal the original tool. Compare the Image path against OriginalFileName to confirm the rename, and submit the hash for reputation lookup to distinguish a redistributed vendor copy from a known-abused or novel sample.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: What did this PAExec invocation do? Decode the command line, including any remote target, credential, and run-as flags.
  context: >-
    The command line reveals the operation. Look for a remote target (\\host or \\* wildcard for all domain computers), the -s flag (run as SYSTEM), -u/-p (alternate credentials), -c (copy program to remote), -i (interactive), and the spawned command. PAExec-only flags (-cnodel, -clist, -csrc, -p@, -p@d, -rlo, -lo, -dfr) do not exist in PsExec and are a strong signal when seen. The host+binary scope over a short window captures sequential invocations that form one logical operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this renamed PAExec, and is that parent chain expected?
  context: The parent process shows how the tool was launched. Interactive launches from explorer.exe or a shell suggest hands-on use; a service, scripting host, or remote-access parent points to automation or remote operation. Walk up the parent chain if the immediate parent is itself unexpected.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did this renamed PAExec spawn after execution?
  context: >-
    The point of renaming the tool is to keep its capability while evading name-based blocking. Child processes spawned by the renamed binary reveal the actual objective. High-risk children such as cmd.exe, powershell.exe, rundll32.exe, regsvr32.exe, mshta.exe, msiexec.exe, curl.exe, or bitsadmin.exe indicate the tool was used to launch a payload or follow-on command rather than a benign administrative task.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did this renamed PAExec open outbound connections, and where to?
  context: >-
    PAExec reaches remote hosts over SMB to the ADMIN$ and IPC$ shares to install a temporary service and run the command, leaving an outbound connection footprint from the tool. Egress to internal hosts on SMB (445) is consistent with remote administration or lateral movement; egress outside known-good administration networks, or to external addresses, raises severity. Compare the destinations against expected administration egress ranges for this host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
- question: How did this renamed PAExec binary arrive on the host?
  context: >-
    A renamed binary was copied, downloaded, or dropped by some process. Matching the file creation event by basename over a long window reveals the delivery mechanism: a download tool, an archive extraction, a manual copy, or a push from another host. The creating process (Image on the file event) identifies the dropper, installer, or copy operation. A user-writable landing location (Downloads, Temp, AppData) points to download or extraction.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Does this host normally run a binary with PAExec's metadata?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low historical counts over the baseline window indicate first-time or rare execution of this tool on this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern (renamed PAExec, not generic binary usage) has historically run here. A new parent process, an unexpected user account, or an unusual launch pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: PAExec Application
      - OriginalFileName: PAExec.exe
      - Product|contains: PAExec
      - Hashes|contains:
        - IMPHASH=11D40A7B7876288F919AB819CC2D9802
        - IMPHASH=6444f8a34e99b8f7d9647de66aabe516
        - IMPHASH=dfd6aa3f7b2b1035b76b718f1ddc689f
        - IMPHASH=1a6cca4d5460b1710a12dea39e4a592c
      filter_main_known_location:
      - Image|endswith: \paexec.exe
      - Image|startswith: C:\Windows\PAExec-
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the renamed-PAExec firing pattern rather than generic usage of the binary. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: PAExec Application
      - OriginalFileName: PAExec.exe
      - Product|contains: PAExec
      - Hashes|contains:
        - IMPHASH=11D40A7B7876288F919AB819CC2D9802
        - IMPHASH=6444f8a34e99b8f7d9647de66aabe516
        - IMPHASH=dfd6aa3f7b2b1035b76b718f1ddc689f
        - IMPHASH=1a6cca4d5460b1710a12dea39e4a592c
      filter_main_known_location:
      - Image|endswith: \paexec.exe
      - Image|startswith: C:\Windows\PAExec-
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: PAExec Application
      - OriginalFileName: PAExec.exe
      - Product|contains: PAExec
      - Hashes|contains:
        - IMPHASH=11D40A7B7876288F919AB819CC2D9802
        - IMPHASH=6444f8a34e99b8f7d9647de66aabe516
        - IMPHASH=dfd6aa3f7b2b1035b76b718f1ddc689f
        - IMPHASH=1a6cca4d5460b1710a12dea39e4a592c
      filter_main_known_location:
      - Image|endswith: \paexec.exe
      - Image|startswith: C:\Windows\PAExec-
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: PAExec Application
      - OriginalFileName: PAExec.exe
      - Product|contains: PAExec
      - Hashes|contains:
        - IMPHASH=11D40A7B7876288F919AB819CC2D9802
        - IMPHASH=6444f8a34e99b8f7d9647de66aabe516
        - IMPHASH=dfd6aa3f7b2b1035b76b718f1ddc689f
        - IMPHASH=1a6cca4d5460b1710a12dea39e4a592c
      filter_main_known_location:
      - Image|endswith: \paexec.exe
      - Image|startswith: C:\Windows\PAExec-
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in the alert window reveals lateral movement or activity spanning multiple endpoints. The same user driving similar activity on several hosts widens the potential scope. This pivot returns agent-telemetry noise under a service account, so it is paired with a launch-mechanism view.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: PAExec Application
      - OriginalFileName: PAExec.exe
      - Product|contains: PAExec
      - Hashes|contains:
        - IMPHASH=11D40A7B7876288F919AB819CC2D9802
        - IMPHASH=6444f8a34e99b8f7d9647de66aabe516
        - IMPHASH=dfd6aa3f7b2b1035b76b718f1ddc689f
        - IMPHASH=1a6cca4d5460b1710a12dea39e4a592c
      filter_main_known_location:
      - Image|endswith: \paexec.exe
      - Image|startswith: C:\Windows\PAExec-
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Novel parent-child pairs at low counts are what to scan for; high-count rows are usually routine agent and operating-system activity.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: 'Earlier detections on the same host may reveal the stages that preceded this event. Look for patterns: reconnaissance followed by execution, defense tampering followed by lateral movement, or credential access followed by remote command execution. The alert timeline helps reconstruct the operation.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
