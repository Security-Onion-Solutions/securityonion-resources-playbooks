name: Potential Remote PowerShell Session Initiated
id: 4cfd70fe-863a-4c36-b984-782c25a163c0
description: |
  Detects a process that initiated an outbound network connection over ports 5985 (WinRM HTTP) or 5986 (WinRM HTTPS) from an account that is not a network service account, over IPv4, excluding localhost and a known Avast service binary. The alerting host is the source of the connection, so it is reaching out to remotely manage another system via PowerShell remoting. Legitimate WinRM use is common from administrative jump boxes and management servers; from a standard workstation or an unexpected account it can indicate lateral movement, in which a compromised host is used to execute PowerShell on other systems.
type: detection
detection_id: c539afac-c12a-46ed-b1bd-5a5567c9f045
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Do the destination and port match what this rule detects, and which process on this host initiated the WinRM connection?
  context: >-
    The rule fires when a non-service-account process on this host initiates an outbound connection (Initiated maps to an egress direction) to destination port 5985 or 5986 over IPv4, and the endpoints are not localhost. Confirm the destination address is the intended management target and identify the process that opened the connection.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Initiated
      - SourceIsIpv6
- question: Is this user and host expected to initiate remote PowerShell sessions to other systems?
  context: >-
    WinRM remoting from administrative jump boxes and management servers is routine. The same activity from a standard workstation, or under an account that is not an administrator, is worth scrutiny. This question reads the initiating process context; on a network alert those process fields are present only for the endpoint-agent subset, so treat missing values as a pivot to the process record by host and time.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What system is the destination of this WinRM connection, and is it a known managed endpoint?
  context: >-
    Investigate the destination address. Determine whether it is a domain controller, server, or workstation, and whether it falls inside the expected management scope. DestinationHostname is sparsely populated on network telemetry, so resolve the address through the host's DNS lookups and asset inventory. An unexpected or newly seen target suggests the source host is being used as a pivot.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - DestinationPort
- question: Did the initiating process run PowerShell with an encoded or obfuscated command, and what does it decode to?
  context: >-
    Remote PowerShell operators frequently pass -EncodedCommand or -enc payloads, or obfuscated one-liners, into Invoke-Command and Enter-PSSession. Decode base64 to reveal download cradles, reverse shells, or in-memory .NET assembly loads. If the alerting network event carries no process identity, pivot on the host and connection time to the process record for the initiating powershell.exe.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process initiated the outbound WinRM connection, and is that parent chain expected?
  context: >-
    Legitimate remoting is launched by powershell.exe or pwsh.exe under an interactive administrative shell or a management agent. An initiating process parented by Office applications, mshta.exe, wscript.exe, or an unexpected service points to macro- or script-driven abuse. Walk up the tree from the initiating process to confirm the launch path.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Were PowerShell security controls bypassed or weakened on this host before the remote session?
  context: >-
    Attackers often disable protections before running a payload. Common precursors include AMSI patching (amsi.dll in memory), execution-policy downgrades (-ExecutionPolicy Bypass, -ep bypass, Set-ExecutionPolicy), and PowerShell v2 downgrade attacks (-Version 2) that lack logging. These events shortly before the connection strengthen the case for malicious remoting.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the full content of what ran over the remote session?
  context: >-
    Event ID 4104 records the deobfuscated script content the PowerShell engine actually executes, including commands relayed into remote sessions, even when the command line is encoded. This is ground truth about what ran. If operational PowerShell logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Is this host an expected administrative source for remote-management connections, or is it reaching lateral-movement ports it does not normally use?
  context: >-
    The alerting host initiated the WinRM connection outbound, so it is the source of the remote session. A management jump box routinely reaches 5985, 5986, 3389, and 445; a standard workstation reaching those ports across multiple destinations suggests it is being used as a pivot. Review the destination ports and the local source address the connections used.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 445
          - 135
          - 3389
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - SourceIp
      - DestinationPort
- question: What account and authentication method drove this remote session, and does it look like valid credentials, pass-the-hash, or a Kerberos ticket?
  context: >-
    WinRM authenticates through Negotiate, which resolves to Kerberos or NTLM. NTLM type-3 network logons with no prior interactive logon suggest pass-the-hash; valid credential use suggests the operator obtained a working password. The full logon evidence lives in Security 4624 and 4648 records; the alert event shows the initiating user context.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
      - CommandLine
- question: Has this user account run other remote-access or lateral-movement tools across the environment in the past day?
  context: >-
    Operators pivoting rarely rely on a single channel. A user driving WinRM alongside psexec,
    mstsc, ssh, plink, or wmic across multiple hosts indicates active lateral movement. If the
    user resolves to NODATA, pivot on the source host or its outbound connections to remote-
    management ports. If this alert fired under SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a
    machine account (name ending in $), this query intentionally returns nothing — a user pivot
    on a service principal matches every host's background automation, not an actor; assess
    movement through the host- and program-scoped questions instead.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_lateral:
        Image|endswith:
        - \psexec.exe
        - \psexec64.exe
        - \mstsc.exe
        - \ssh.exe
        - \plink.exe
        - \wmic.exe
      filter_svcprin_builtin:
        User:
        - SYSTEM
        - LOCAL SERVICE
        - NETWORK SERVICE
      filter_svcprin_machine:
        User|endswith: $
      condition: (selection and selection_lateral) and not 1 of filter_svcprin_*
    fields:
    - host.name
    - Image
- question: When this host has previously initiated WinRM connections matching this rule, what processes and users normally drove them, and does the current alert fit?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the resulting process and user distribution reflects how this host's WinRM-initiation pattern (not generic outbound traffic) has run historically. A new initiating user, an unexpected account, or an unfamiliar process is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        DestinationPort:
        - 5985
        - 5986
        Initiated: 'true'
        SourceIsIpv6: 'false'
      filter_main_service_users:
      - User|contains:
        - NETWORK SERVICE
        - NETZWERKDIENST
        - SERVICIO DE RED
        - SERVIZIO DI RETE
      - User|contains|all:
        - SERVICE R
        - SEAU
      filter_main_localhost:
        SourceIp:
        - ::1
        - 127.0.0.1
        DestinationIp:
        - ::1
        - 127.0.0.1
      filter_optional_avast:
        Image:
        - C:\Program Files\Avast Software\Avast\AvastSvc.exe
        - C:\Program Files (x86)\Avast Software\Avast\AvastSvc.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - Image
    - User
- question: Does this host normally connect to this destination, and over what ports?
  context: >-
    First-time connections to a management target are more suspicious than routine administrative traffic. Zero or very low history to this destination suggests new infrastructure or a newly targeted host. The port variation shows whether the relationship is limited to remote management or spans other services.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
- question: What other process activity occurred on this host around the time of the WinRM connection?
  context: >-
    Remoting is often bracketed by reconnaissance, credential access, or staging. Aggregating process activity around the alert collapses repetitive agent noise into high-count rows while novel parent-child pairs stand out at low counts. The window between session setup and follow-on execution is typically short, often under a minute.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Where has this account authenticated recently, and do the logon types match remote management?
  context: >-
    WinRM produces network (type 3) logons on the systems it reaches. An account authenticating
    to many hosts in a short window, especially with type-3 or type-10 logons after credential
    access, corroborates lateral movement. This reads the Windows Security logon record across
    hosts rather than the endpoint process telemetry. If the alert fired under SYSTEM, LOCAL
    SERVICE, NETWORK SERVICE, or a machine account (name ending in $), this query intentionally
    returns nothing — service-principal logons are background noise, not an actor trail. For a
    human account, zero results can also mean the Security channel is not ingested for the
    relevant hosts; confirm 4624 visibility before reading zero as "no authentications".
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
        - 4624
        - 4625
        TargetUserName|expand: '%User%'
      filter_svcprin_builtin:
        TargetUserName:
        - SYSTEM
        - LOCAL SERVICE
        - NETWORK SERVICE
      filter_svcprin_machine:
        TargetUserName|endswith: $
      condition: (selection) and not 1 of filter_svcprin_*
    fields:
    - host.name
    - IpAddress
    - EventID
    - LogonType
- question: Have other hosts initiated WinRM connections matching this rule in the past week, and does the spread look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this WinRM-initiation pattern rather than generic port usage. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        DestinationPort:
        - 5985
        - 5986
        Initiated: 'true'
        SourceIsIpv6: 'false'
      filter_main_service_users:
      - User|contains:
        - NETWORK SERVICE
        - NETZWERKDIENST
        - SERVICIO DE RED
        - SERVIZIO DI RETE
      - User|contains|all:
        - SERVICE R
        - SEAU
      filter_main_localhost:
        SourceIp:
        - ::1
        - 127.0.0.1
        DestinationIp:
        - ::1
        - 127.0.0.1
      filter_optional_avast:
        Image:
        - C:\Program Files\Avast Software\Avast\AvastSvc.exe
        - C:\Program Files (x86)\Avast Software\Avast\AvastSvc.exe
      condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before the WinRM connection?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal the stages that preceded remote-session initiation and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
