name: Assembly Loading Via CL_LoadAssembly.ps1
id: 430face7-e67c-4666-a760-6ae919cc0a01
description: |
  Detects command lines invoking LoadAssemblyFromPath or LoadAssemblyFromNS, the exported functions of the Microsoft-signed
  PowerShell diagnostic script CL_LoadAssembly.ps1. These functions perform a reflective Reflection.Assembly load of an
  arbitrary .NET assembly into the PowerShell process, which loads code without executing it as a PE and can bypass AppLocker
  and application-control policy. Legitimate use is rare and tied to Windows diagnostic workflows under %systemroot%\diagnostics\system\;
  malicious use loads an out-of-band, often unsigned, assembly via path traversal so a signed script proxies execution of
  attacker code. Determine which assembly was loaded, where it came from, what code ran from it, and whether the host shifted
  to PowerShell v2 to also evade AMSI and Constrained Language Mode.
type: detection
detection_id: c57872c7-614f-4d7f-a40d-b78c8df2d30d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line contain LoadAssemblyFromPath or LoadAssemblyFromNS as the rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line.
    The rule fires when either function name appears, so note which one was called and the full argument that follows it,
    including any path-traversal sequence pointing at the assembly being loaded.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run PowerShell diagnostic scripts that load .NET assemblies?
  context: Legitimate use of CL_LoadAssembly.ps1 is rare and tied to Windows diagnostic troubleshooting. Knowing whether the
    user role and host function plausibly involve running diagnostic scripts or assembly-loading PowerShell is often the fastest
    path to separating a true positive from routine support activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What assembly did the command load, and from what path?
  context: The full command line reveals which assembly was loaded and from where. Decode the argument after LoadAssemblyFromPath
    or LoadAssemblyFromNS, resolve any relative path-traversal sequence to an absolute path, and note whether the target sits
    in a user-writable or out-of-band location rather than under the signed diagnostics directory. Check also for a switch
    dropping the session to PowerShell v2, which removes AMSI and Constrained Language Mode protection.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
        - 'LoadAssemblyFromPath '
        - 'LoadAssemblyFromNS '
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this command, and is that parent chain expected?
  context: The parent process reveals how the assembly-loading command was invoked. A signed diagnostic script driven by a
    legitimate troubleshooting workflow usually has a predictable parent. Unusual parents such as office applications, wscript.exe,
    cscript.exe, mshta.exe, or a remote-access tool point toward proxied execution of attacker-supplied code rather than a
    genuine diagnostic.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What .NET assemblies or modules loaded into the process around the time of the alert?
  context: LoadAssemblyFromPath performs a reflective Reflection.Assembly load, so the abused assembly appears as an image
    or module load into the host process rather than as a new process. Look for a recently loaded .NET assembly from a user-writable
    or non-system path, and note its signing status. An unsigned or out-of-band module loaded reflectively is the payload the
    signed script was used to proxy.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
      - Signature
- question: Was the loaded assembly written to disk recently, and is it signed?
  context: The proxied payload is typically a .NET assembly delivered out-of-band and then loaded via path traversal. Pivot
    on the assembly path resolved from the command line to find when the file was written, by which process, and whether it
    is signed by Microsoft or an unrelated or absent signer. A signed parent script loading an unsigned, recently dropped assembly
    is the signed-to-unsigned transition that distinguishes abuse from diagnostic use.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - User
      - EventType
- question: What child processes did this command spawn afterward, and how soon after the assembly load?
  context: Code in a reflectively loaded assembly often invokes a static method that spawns follow-on activity. Child processes
    such as cmd.exe, powershell.exe, certutil.exe, or a network download cradle reveal the actual purpose of the proxied payload.
    A short delay between the assembly load and the child process strengthens the link between the two.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: How often has this assembly-loading pattern run on this host historically?
  context: A diagnostic-script assembly load that has never been seen on a host is more suspicious than one that recurs on
    a predictable schedule. Zero or very low historical counts for this command pattern indicate first-time or rare execution
    worth closer review.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
        - 'LoadAssemblyFromPath '
        - 'LoadAssemblyFromNS '
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and
    does the current alert fit that pattern?
  context: Even legitimate diagnostic scripts run in a consistent way. The query mirrors the rule's selection scoped to this
    host, so the resulting parent and user distribution reflects how this specific assembly-loading pattern has historically
    run here. A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - 'LoadAssemblyFromPath '
        - 'LoadAssemblyFromNS '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What other tools ran on this host around the same time?
  context: Proxied execution rarely happens in isolation. Activity surrounding the assembly load may reveal reconnaissance,
    privilege escalation, persistence installation, or data staging that provides broader context for the investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent
    automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this assembly-loading
    pattern. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated
    set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - 'LoadAssemblyFromPath '
        - 'LoadAssemblyFromNS '
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - 'LoadAssemblyFromPath '
        - 'LoadAssemblyFromNS '
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - 'LoadAssemblyFromPath '
        - 'LoadAssemblyFromNS '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints. If
    the same user triggered similar activity on multiple hosts, the scope of the operation may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - 'LoadAssemblyFromPath '
        - 'LoadAssemblyFromNS '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal
    the attack stages that preceded the assembly load and help reconstruct the full timeline. The sequence of alerts often
    tells the story of how the operator reached the point of proxying execution through a signed script.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
