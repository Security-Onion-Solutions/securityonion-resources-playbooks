name: Hacktool - EDR-Freeze Execution
id: 31ccb03c-97b0-4b00-8c96-03adf93af929
description: |
  Detects execution of EDR-Freeze, a user-mode tool that suspends EDR and antimalware
  processes by abusing the MiniDumpWriteDump function and WerFaultSecure.exe, holding a
  target security process in a frozen state without a vulnerable driver (no BYOVD). The
  rule fires when EITHER the process Image path contains the EDR-Freeze name OR the
  process import hash matches a known EDR-Freeze build, so the alert may be a renamed
  binary identified only by its import hash. Because the tool's purpose is to blind
  monitoring for a short window while other actions run, the investigation should
  confirm the match, identify which security process was targeted and the freeze
  duration, determine whether protection has recovered, and examine what executed on
  the host during and after the freeze.
type: detection
detection_id: c598cc0c-9e70-4852-b9eb-8921af79f598
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- question: Does the alerting process match this rule either by an EDR-Freeze image name or by a known EDR-Freeze import hash?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires
    on either of two independent conditions, so note which branch matched. Either the executable path
    contains an EDR-Freeze name, or the import hash matches a known EDR-Freeze build even when the
    binary has been renamed. A hash-only match with an innocuous file name is the stronger signal that
    someone tried to disguise the tool.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: Is this user and host expected to run a process-suspension tool that targets security software?
  context: Legitimate software does not ship a tool whose function is to freeze EDR or antimalware
    processes, so the relevant judgment is whether an authorized security assessment or known tooling
    explains why this user and host would run it. A sanctioned test range or a security engineer's
    workstation may explain it; a production server or a standard user endpoint generally does not.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this EDR-Freeze execution part of an authorized penetration test or red team engagement?
  context: Tools that suspend security processes are used in authorized defense-evasion testing. Before
    investing investigation time, check whether a pentest or red team exercise is currently active on
    this host or network segment. An authorized engagement with matching tool usage and timing resolves
    the alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What did EDR-Freeze do when launched? Decode the command line to identify the target process and the freeze duration.
  context: EDR-Freeze takes the target security process (by PID or name) and a freeze duration in
    milliseconds (for example, 10000 ms). The command line reveals which security process was meant
    to be suspended and for how long. A short duration repeated in a script points to a brief
    blind-spot window opened for another action; a long single freeze points to disabling protection
    outright. Record the target and duration to drive the rest of the investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which security process was targeted for suspension, and which EDR or antimalware product does it belong to?
  context: EDR-Freeze suspends a named security process rather than disabling a service or policy, so
    identifying the target process names the product whose monitoring was blinded. Different targets
    have different blast radius — suspending the primary EDR sensor removes detection and response on
    the host, while suspending an antimalware scanner removes on-access scanning. The targeted product
    determines remediation and how much visibility was lost during the freeze.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Has the targeted security process recovered, or is it still suspended and the host still unprotected?
  context: The freeze is meant to be temporary — the target resumes after the supplied duration elapses
    or when the freezing process exits. Confirm the targeted EDR or antimalware process is running and
    reporting again. If it remains suspended, crashed, or stopped reporting telemetry, the host is still
    unprotected and the control should be restored before the investigation continues.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned EDR-Freeze and is that parent chain expected?
  context: The parent process reveals how the tool was invoked. A launch from a script host, a remote
    execution utility, or an unexpected interactive shell points to operator activity, while a launch
    from a sanctioned testing harness may explain it. Walk up the tree to see what spawned the parent
    and what else the parent launched in the same session.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What executed on this host during and immediately after the freeze window?
  context: The tool blinds monitoring for a short window so that other actions run unobserved, so the
    processes that start while protection is suspended are the activity the freeze was meant to hide.
    Examine process creation in the window following the freeze for payload execution, credential
    access, or lateral movement, and treat a gap in security-product telemetry followed by new
    processes as the activity the freeze enabled.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense-tampering actions performed on this host?
  context: Operators who suspend one security control often layer additional tampering — stopping
    services, clearing event logs, deleting shadow copies, or adding exclusions — to widen and prolong
    the blind spot. Finding multiple tampering events from the same user or parent process around the
    freeze indicates a deliberate effort to disable defenses rather than an isolated tool run.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: What files did the EDR-Freeze process write to disk on this host?
  context: The technique abuses MiniDumpWriteDump, which can write a memory dump of the target security
    process to disk, and the tool may also drop helper files or output. File creation events from the
    EDR-Freeze process confirm execution and reveal any dump or staged data even after the original
    process exits. A dump of a security process is itself a credential-access concern worth following.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has this binary run on this host before?
  context: A process executable that has never been seen on a host is more suspicious than one that runs
    regularly. Zero or very low historical counts for this binary indicate first-time execution, which
    is the expected profile for a freshly delivered defense-evasion tool. Group the result by user to
    see who has run it previously, if anyone.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: The query mirrors the rule's selection structure scoped to this host, so the resulting parent
    and user distribution reflects how this specific firing pattern — the EDR-Freeze image name or a
    matching import hash — has historically run here rather than generic binary usage. A new parent
    process, an unexpected user account, or a first-ever appearance is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|contains:
        - \EDR-Freeze
        - \EDRFreeze
        Image|endswith: .exe
      selection_imphash:
        Hashes|contains:
        - IMPHASH=1195F7935954A2CD09157390C33F8E8C
        - IMPHASH=129F58DE3D687FB7F012BF6C3D679997
        - IMPHASH=2C617A175D0086251642C6619F7CC8BA
        - IMPHASH=8828F0B906F7844358FB92A899E9520F
        - IMPHASH=AF76D95157EC554DC1EF178E4E66D447
        - IMPHASH=E1B04316B61ACA31DD52ABBEC0A37FD5
        - IMPHASH=8B2D5B54AFCFEC60D54F6B31D80ED4A0
        - IMPHASH=AB8BB31EDD91D2A05FE7B62A535E9EB7
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|contains:
        - \EDR-Freeze
        - \EDRFreeze
        Image|endswith: .exe
      selection_imphash:
        Hashes|contains:
        - IMPHASH=1195F7935954A2CD09157390C33F8E8C
        - IMPHASH=129F58DE3D687FB7F012BF6C3D679997
        - IMPHASH=2C617A175D0086251642C6619F7CC8BA
        - IMPHASH=8828F0B906F7844358FB92A899E9520F
        - IMPHASH=AF76D95157EC554DC1EF178E4E66D447
        - IMPHASH=E1B04316B61ACA31DD52ABBEC0A37FD5
        - IMPHASH=8B2D5B54AFCFEC60D54F6B31D80ED4A0
        - IMPHASH=AB8BB31EDD91D2A05FE7B62A535E9EB7
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|contains:
        - \EDR-Freeze
        - \EDRFreeze
        Image|endswith: .exe
      selection_imphash:
        Hashes|contains:
        - IMPHASH=1195F7935954A2CD09157390C33F8E8C
        - IMPHASH=129F58DE3D687FB7F012BF6C3D679997
        - IMPHASH=2C617A175D0086251642C6619F7CC8BA
        - IMPHASH=8828F0B906F7844358FB92A899E9520F
        - IMPHASH=AF76D95157EC554DC1EF178E4E66D447
        - IMPHASH=E1B04316B61ACA31DD52ABBEC0A37FD5
        - IMPHASH=8B2D5B54AFCFEC60D54F6B31D80ED4A0
        - IMPHASH=AB8BB31EDD91D2A05FE7B62A535E9EB7
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across
    multiple endpoints. If the same user drove similar activity on multiple hosts, the scope of the
    intrusion may be larger than this single execution.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|contains:
        - \EDR-Freeze
        - \EDRFreeze
        Image|endswith: .exe
      selection_imphash:
        Hashes|contains:
        - IMPHASH=1195F7935954A2CD09157390C33F8E8C
        - IMPHASH=129F58DE3D687FB7F012BF6C3D679997
        - IMPHASH=2C617A175D0086251642C6619F7CC8BA
        - IMPHASH=8828F0B906F7844358FB92A899E9520F
        - IMPHASH=AF76D95157EC554DC1EF178E4E66D447
        - IMPHASH=E1B04316B61ACA31DD52ABBEC0A37FD5
        - IMPHASH=8B2D5B54AFCFEC60D54F6B31D80ED4A0
        - IMPHASH=AB8BB31EDD91D2A05FE7B62A535E9EB7
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of the firing pattern — the EDR-Freeze image name or a matching import hash —
    rather than generic binary usage. Many hosts firing the same pattern points to a scripted rollout;
    one host or a small unrelated set points to manual operator activity. Use the host distribution to
    calibrate scope.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|contains:
        - \EDR-Freeze
        - \EDRFreeze
        Image|endswith: .exe
      selection_imphash:
        Hashes|contains:
        - IMPHASH=1195F7935954A2CD09157390C33F8E8C
        - IMPHASH=129F58DE3D687FB7F012BF6C3D679997
        - IMPHASH=2C617A175D0086251642C6619F7CC8BA
        - IMPHASH=8828F0B906F7844358FB92A899E9520F
        - IMPHASH=AF76D95157EC554DC1EF178E4E66D447
        - IMPHASH=E1B04316B61ACA31DD52ABBEC0A37FD5
        - IMPHASH=8B2D5B54AFCFEC60D54F6B31D80ED4A0
        - IMPHASH=AB8BB31EDD91D2A05FE7B62A535E9EB7
      condition: 1 of selection_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — reconnaissance, credential access, or other defense
    tampering — may reveal the attack stages that preceded the freeze and help reconstruct the timeline.
    A tool that blinds monitoring is usually deployed to enable a specific next action, so the alerts
    bracketing it tell the larger story.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
