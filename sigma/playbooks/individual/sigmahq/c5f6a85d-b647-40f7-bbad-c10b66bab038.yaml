name: UAC Notification Disabled
id: 52a82b8a-833b-4c46-8ab2-d9edf42132d7
description: >-
  Detects a modification to the HKLM\SOFTWARE\Microsoft\Security Center\UACDisableNotify
  registry value set to 1 (DWORD 0x00000001), which suppresses User Account Control
  elevation prompts so that privilege-elevation requests proceed without user
  interaction. Legitimate changes to this value are rare outside of deliberate policy
  or imaging activity, while malware and post-exploitation tooling set it to smooth
  silent privilege escalation and reduce the friction of later elevated actions. The
  investigation should confirm the exact value and writing process, establish whether
  the change is expected on this host, and determine what elevated activity, additional
  registry tampering, or complementary bypass attempts followed.
type: detection
detection_id: c5f6a85d-b647-40f7-bbad-c10b66bab038
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Do the registry key and value data match what this rule detects?
  context: >-
    Before investing investigation time, confirm the alert is a true positive by
    reviewing the exact key path and value data against the rule's criteria. The
    TargetObject must end in \Microsoft\Security Center\UACDisableNotify and Details
    must be DWORD (0x00000001), meaning the value is set to 1 and UAC elevation
    notifications are suppressed. Note the writing process for later pivots.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify User Account Control policy values?
  context: >-
    Legitimate changes to UAC policy values are rare and usually tied to deliberate
    administrative or imaging activity. Knowing whether the writing user role and host
    function are consistent with a security-policy change is often the fastest path to
    separating a true positive from routine operations. User attribution is present on
    most endpoint registry events; when it is a machine account or missing, pivot on the
    writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What specific registry value was modified, and is this a known evasion location?
  context: >-
    The Security Center\UACDisableNotify value governs whether UAC elevation prompts are
    shown; setting it to 1 (DWORD 0x00000001) suppresses them, which is a security-tool
    tampering pattern rather than a routine configuration change. Confirm the exact value
    data and the writing process, and judge whether this is a location attackers routinely
    target to weaken elevation controls.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Does the UAC-disabling modification persist, or was the value later changed again on this host?
  context: >-
    Endpoint telemetry emits no registry key or value deletion events, so attacker cleanup
    of this value cannot be observed directly. Judge persistence from the value's
    re-modification history over a longer window — whether it was reset, re-applied, or
    left in place — and from whether elevated activity that the suppressed prompt would
    otherwise have gated actually followed.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote this value, and what spawned it?
  context: >-
    The writing process and its parent chain reveal how the change was made. A reg.exe or
    powershell.exe write launched from an interactive shell, a script host such as
    wscript.exe or mshta.exe, or an Office application points to hands-on or scripted
    tampering rather than a management tool. Walk up from the writing process to its
    parent to see the invocation path.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Does this host normally run the process that made this change?
  context: >-
    A writing binary that has never or rarely run on this host is more suspicious than a
    routinely present administrative tool. Zero or very low historical counts indicate
    first-time or rare execution of the process that disabled UAC notifications. Common
    interpreters such as reg.exe, powershell.exe, and cmd.exe will show baseline volume;
    weigh the result against how frequently the tool is legitimately used here.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Has this registry value been modified before on this host?
  context: >-
    Security policy values like UACDisableNotify should rarely change, so a first-time
    modification is more suspicious than a recurring one. Compare the historical Details
    values to see whether the same setting has been applied before or whether this is a
    novel change to elevation policy on this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Were other registry modifications made on this host in the same session?
  context: >-
    Actors who disable UAC notifications often make several related changes at once —
    disabling Defender, setting Run-key persistence, or altering firewall rules. Clusters
    of registry changes from the same writing process within a short window (for example
    30 seconds around the change) reveal the full scope of the configuration tampering and
    whether multiple objectives were pursued.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other process activity occurred on this host around the time of the change?
  context: >-
    The registry change rarely happens in isolation. Aggregating process activity in a
    tight window around the alert surfaces what led to the change and what followed —
    reconnaissance, tool downloads, or elevated execution — while collapsing repetitive
    agent telemetry into high-count rows so novel parent-child pairs stand out at low
    counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: What action was performed with elevated privileges after UAC notifications were disabled?
  context: >-
    Suppressing UAC prompts is a means to an end — it removes the friction of running
    high-integrity actions. Examining processes that ran at High or System integrity
    shortly after the change reveals the objective, whether installing persistence,
    dumping credentials, tampering with security tools, or accessing protected resources.
    Correlating within a tunable window after the change reduces noise from unrelated
    admin activity.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: Did an auto-elevated Windows binary load an unsigned or unexpected DLL around this time?
  context: >-
    A parallel UAC bypass family sideloads an unsigned DLL into an auto-elevated binary
    (fodhelper.exe, eventvwr.exe, sdclt.exe, computerdefaults.exe, wsreset.exe, slui.exe)
    so the elevated process executes attacker code without a prompt. An unsigned module
    loaded by one of these binaries near the notification-disable change indicates a
    DLL-hijack elevation attempt rather than a policy-only change.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\fodhelper.exe'
          - '\eventvwr.exe'
          - '\sdclt.exe'
          - '\computerdefaults.exe'
          - '\wsreset.exe'
          - '\slui.exe'
        Signed: 'false'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - Image
- question: Were auto-elevated-binary UAC bypass techniques also attempted on this host?
  context: >-
    Beyond disabling prompt notifications, T1548.002 covers shell-hijack bypasses that
    write a command to a key an auto-elevated process reads and executes —
    ms-settings\Shell\Open\command (fodhelper, computerdefaults), mscfile\shell\open\command
    (eventvwr), and Folder\shell\open\command (sdclt). Finding these command-line patterns
    alongside the notification disable confirms deliberate, multi-method elevation activity.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\reg.exe'
          - '\powershell.exe'
          - '\cmd.exe'
        CommandLine|contains:
          - 'ms-settings'
          - 'mscfile'
          - 'Classes\exefile'
          - 'Classes\Folder'
          - 'Environment'
          - 'Shell\Open\command'
          - 'DelegateExecute'
      condition: selection
    fields:
      - CommandLine
      - Image
- question: Were other privilege escalation or defense-evasion detections raised on this host?
  context: >-
    Actors who disable UAC often try multiple elevation or evasion methods in sequence.
    Other detections on the same host within the surrounding window — additional UAC bypass
    attempts, defense tampering, or credential access — confirm deliberate privilege
    escalation rather than an isolated configuration change.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- question: Did other detections fire on this host in the hours before this change?
  context: >-
    Earlier detections on the same host — reconnaissance, initial execution, or defense
    tampering — may reveal the stages that preceded the UAC change and help reconstruct
    the timeline leading up to the elevation attempt.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was this registry value modified on other hosts in the environment?
  context: >-
    The same UACDisableNotify change across multiple hosts may indicate a pushed policy,
    widespread malware, or lateral movement, whereas a single-host change is more likely
    targeted. Compare the Details values and writing processes across hosts to distinguish
    a fleet-wide configuration from isolated tampering.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
