name: Turla Group Lateral Movement
id: bfd6eb41-9807-45e8-93e6-e17b3d317c84
description: |
  Detects a command interpreter running one of three literal command lines associated with automated lateral
  movement and host enumeration: a `net use` mapping a domain controller's C$ share with a password supplied
  inline, a recursive `dir` search for document files across the system drive, and a `dir` listing of
  executables in the temp directory. Together these describe administrative-share access with hardcoded
  credentials alongside collection-oriented file discovery — inventorying documents and confirming that a
  staged payload landed — but the same literal strings are also reused verbatim in authorized assessments and
  detection-validation tests, which is the first thing to rule out. Investigation should confirm the exact
  command line, establish whether the share mapping succeeded and under which account, and determine whether
  the enumeration was followed by file copying, archiving, or execution on the mapped host.
type: detection
detection_id: c601f20d-570a-4cde-a7d6-e17f99cb8e7f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the alerting command line match one of the command patterns in the rule's selection?
  context: >-
    The rule fires when its single selection matches, and that selection is a list of three literal command
    lines: a `net use` mapping a domain controller's C$ share with an inline plaintext password, a recursive
    `dir c:\*.doc*` search for document files, and a `dir %TEMP%\*.exe` listing of executables in the temp
    directory. Read the exact command line before investing further time. The three patterns describe
    different activity, and which one fired determines where the investigation goes next.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this command execution part of an authorized penetration test or red team engagement?
  context: >-
    These command lines are published, widely copied strings, and they are reused as-is in security
    assessments, purple-team exercises, and detection-validation runs precisely because they are known to
    trigger detections. Check whether an engagement or a control test is active on this host or network
    segment. A documented exercise with matching scope and timing resolves the alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did the alerting process or its children write any files, such as redirected directory-listing output?
  context: >-
    A recursive document search is normally run to build an inventory, and the result is usually redirected to
    a text file so it can be read or collected later. Files written by this process or its direct children —
    listing output, staged archives, or a binary copied from a mapped share — are the artifacts to preserve
    and read before routine cleanup removes them.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What did the full command sequence do, and what share, directories, or output paths does it reference?
  context: >-
    The command line is the entire payload here — the rule constrains nothing about the binary, only the
    arguments. Read the mapped UNC path and the account supplied with it, the search root and file mask of
    each enumeration, and any output redirection. This query returns the rule's command patterns across a
    ten-minute window on the host rather than the single alerting event, so a share mapping followed by
    directory sweeps appears as the sequence it is instead of three unrelated rows.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
          - 'net use \\\\'
          - 'dir c:\\'
          - 'dir %TEMP%\\'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this command interpreter, and is that parent expected for interactive administration?
  context: >-
    Share mappings and directory searches typed by an administrator normally descend from explorer.exe or an
    existing console session. A parent such as wscript.exe, cscript.exe, mshta.exe, an Office application,
    wmiprvse.exe, or wsmprovhost.exe means the commands were driven by a script or arrived over a
    remote-execution channel rather than being typed by a person, which changes how the same command line
    should be read. The parent command line also shows whether the interpreter was handed a one-line
    instruction or a longer batch.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Is this account expected to map administrative shares and run recursive file searches on this host?
  context: >-
    Administrators and IT staff map C$ and ADMIN$ shares and search file systems for legitimate
    troubleshooting and inventory work. Standard user accounts rarely do either, and service accounts that
    perform inventory work usually do so on a schedule rather than once. Check the account's role, whether it
    is a service principal, and whether it is normally used on this host at all.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: Did this host log an explicit-credential logon or an administrative share access around the alert?
  context: >-
    A `net use` that supplies a password inline produces a logon with explicit credentials (4648) on the
    initiating host, naming the target server and the account used, and an administrative share access (5140)
    recording the share name when the share is opened. Which share was reached — C$, ADMIN$, or IPC$ — and
    which account reached it tells you whether the mapping succeeded and what it exposed. If Security channel
    events are not collected in this environment, treat an empty result as a visibility gap rather than as
    evidence the mapping failed.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      host_scope:
        host.name|expand: '%hostname%'
      selection_explicit_cred:
        EventID: 4648
      selection_share_access:
        EventID: 5140
        ShareName|contains:
          - 'C$'
          - 'ADMIN$'
          - 'IPC$'
      condition: host_scope and 1 of selection_*
    fields:
      - TargetUserName
      - TargetServerName
      - ShareName
      - IpAddress
- question: Did remote-execution or interpreter processes run on this host in the half hour after the alert?
  context: >-
    Mapping an administrative share is a means to an end. The follow-on step is copying a file onto the share
    and running it, usually through a service creation, a scheduled task, or a shell. Execution of cmd.exe,
    powershell.exe, runonce.exe, sc.exe, schtasks.exe, psexec.exe, or wmic.exe inside the correlation window
    that matters for this pattern — roughly 5 to 10 minutes, widened here to 30 minutes to allow for operator
    pauses — is what turns share access into remote code execution.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_exec:
        Image|endswith:
          - '\cmd.exe'
          - '\powershell.exe'
          - '\runonce.exe'
          - '\sc.exe'
          - '\schtasks.exe'
          - '\psexec.exe'
          - '\wmic.exe'
      condition: selection and selection_exec
    fields:
      - Image
      - CommandLine
      - User
- question: Did other reconnaissance commands run on this host around the same time?
  context: >-
    A single directory search can be troubleshooting; several enumeration commands in quick succession is the
    pattern of post-compromise reconnaissance. net.exe and net1.exe matter most here, since `net use`,
    `net view`, and `net share` are how share discovery is normally driven, alongside nltest.exe and
    nslookup.exe for domain and name resolution. Three or more distinct reconnaissance binaries inside 15
    minutes, more than 50 directory queries in 30 seconds, or share enumeration followed by SMB connections to
    5 or more hosts within 10 minutes all indicate the enumeration was scripted rather than typed.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: Did any executable in a temp directory run on this host, and does its hash have known threat-intel detections?
  context: >-
    One of the rule's patterns lists executables in the temp directory, which is the check made to confirm a
    staged payload landed. A file write carries no hash; the hash is recorded when the file executes. This
    query looks for executions out of a temp path on the host and returns the hash — submit it to threat-intel
    services or an internal repository to see whether it is known. An executable that is present in temp but
    has not run will not appear here, so retrieve it from its on-disk path and hash it manually. When the
    match is on the command line rather than the image, the hash belongs to the interpreter, not the artifact.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|contains: '\Temp\'
      selection_interpreter:
        CommandLine|contains: '\Temp\'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
- question: Has this account run remote-execution tooling on other hosts in the past day?
  context: >-
    Share mapping and file enumeration sit early in an operation, and the account that performed
    them is the thread to pull. If the same account has run psexec, mstsc, ssh, plink, or wmic
    across several hosts in the last 24 hours, the activity is not confined to this endpoint and
    the containment scope is wider than one machine. A result confined to the alerting host,
    with no remote-execution tooling, points to a local action instead. If this alert fired
    under SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a machine account (name ending in $), this
    query intentionally returns nothing — a user pivot on a service principal matches every
    host's background automation, not an actor; assess movement through the host- and program-
    scoped questions instead.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_lateral:
        Image|endswith:
        - \psexec.exe
        - \psexec64.exe
        - \mstsc.exe
        - \ssh.exe
        - \plink.exe
        - \wmic.exe
      filter_svcprin_builtin:
        User:
        - SYSTEM
        - LOCAL SERVICE
        - NETWORK SERVICE
      filter_svcprin_machine:
        User|endswith: $
      condition: (selection and selection_lateral) and not 1 of filter_svcprin_*
    fields:
    - host.name
    - Image
- question: What else did this account do across the environment around the time of the alert?
  context: >-
    Tracking the account beyond the alerting host shows whether the same identity was active elsewhere in the
    same window, which is what separates a local action from movement between hosts. If the alert fired under
    SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a computer account, this view returns agent telemetry from
    every host the principal touches and answers nothing — the parent-process pivot is the meaningful read in
    that case.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  always_include: true
- question: Did the same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, user identity does not attribute behavior; the launch mechanism does. This
    query counts the rule's command patterns fleet-wide, scoped to the parent process that launched the
    alerting command, inside the alert window. Several hosts at once points to scheduled or pushed automation
    — a deployment script, an inventory job, or an assessment harness. A single host points to a trigger local
    to this machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine:
        - net use \\\\%DomainController%\C$ "P@ssw0rd" *
        - dir c:\\*.doc* /s
        - dir %TEMP%\\*.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  always_include: true
- question: Has this account produced the rule's command patterns before, and does that history fit their role?
  context: >-
    This query returns the account's 90-day history of these specific command patterns, grouped by host,
    rather than its generic use of a command interpreter. An account that has never issued them is a different
    proposition from one that issues them weekly. Weigh the count and the host spread against the account's
    role: an administrator running a recurring inventory script produces a steady history across known hosts,
    while a first appearance on a single host does not.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine:
        - net use \\\\%DomainController%\C$ "P@ssw0rd" *
        - dir c:\\*.doc* /s
        - dir %TEMP%\\*.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  always_include: true
- question: Has this parent process historically driven these command patterns here or elsewhere, or is the parent new for this activity?
  context: >-
    The complement to account history is launch history. This query returns the 90-day, host-grouped history
    of the rule's command patterns launched by the alerting parent process. A parent that already accounts for
    thousands of prior events is vendor or OS automation and the count will concentrate on the hosts that run
    it. A parent that has never driven this pattern is the deviation worth chasing, whichever account it ran
    under.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine:
        - net use \\\\%DomainController%\C$ "P@ssw0rd" *
        - dir c:\\*.doc* /s
        - dir %TEMP%\\*.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  always_include: true
- question: When this host has fired these command patterns before, what parents and accounts drove them, and does the current alert fit?
  context: >-
    The query mirrors the rule's selection scoped to this host, so the parent and account distribution
    describes how these specific patterns have run here over the last two weeks rather than how often a
    command interpreter runs. A new parent, an unexpected account, or an empty result all point the same way:
    this instance is not the routine one. A distribution dominated by one parent and one service account is
    the signature of a recurring job.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine:
        - net use \\\\%DomainController%\C$ "P@ssw0rd" *
        - dir c:\\*.doc* /s
        - dir %TEMP%\\*.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired these command patterns in the past week, and does the distribution look like automation or one-off activity?
  context: >-
    Unscoped by host, this counts the rule's firing pattern fleet-wide rather than generic interpreter usage.
    Many hosts producing the same patterns points to scripted deployment, a recurring inventory job, or an
    assessment harness rolled out broadly; 5 or more hosts inside a short window is the point at which this
    reads as a rollout rather than an individual action. One host, or a small set with no shared owner, points
    to manual operator activity. Use the spread and the consistency of the parents to calibrate how far the
    response needs to reach.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine:
        - net use \\\\%DomainController%\C$ "P@ssw0rd" *
        - dir c:\\*.doc* /s
        - dir %TEMP%\\*.exe
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Share access and file enumeration sit in the middle of an operation, not at its start. Earlier detections
    on the same host — an initial execution, defense tampering, or credential access — reconstruct how the
    operator reached this point and what access they already hold. Detections that follow in the same sequence
    indicate the enumeration produced something worth acting on.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
