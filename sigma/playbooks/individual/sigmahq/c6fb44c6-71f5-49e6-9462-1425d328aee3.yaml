name: Powershell Base64 Encoded MpPreference Cmdlet
id: a9150228-2790-4b75-810b-f0b9a7b69f12
description: |
  Detects a PowerShell command line that carries a base64-encoded (or base64offset-encoded) Add-MpPreference or
  Set-MpPreference cmdlet, the canonical mechanism for adding Windows Defender exclusions or flipping protection
  flags. Encoding the cmdlet hides the tampering from casual command-line inspection, so the rule fires regardless of
  the surrounding script. Legitimate management of Defender exclusions is normally run in clear text by administrators
  or configuration tooling; an encoded form points to an operator deliberately concealing a Defender carve-out, often
  as a precursor to payload execution. The investigation should decode the cmdlet to identify exactly what exclusion or
  setting was changed, confirm whether protection is currently weakened, and look for the activity the tampering was
  meant to enable.
type: detection
detection_id: c6fb44c6-71f5-49e6-9462-1425d328aee3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line contain a base64-encoded Add-MpPreference or Set-MpPreference cmdlet?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the full command line of
    the triggering event. The rule fires when a PowerShell command line carries an encoded Add-MpPreference or Set-MpPreference
    cmdlet, so verify the encoded fragment is present and decode it to confirm it is genuinely a Defender preference change.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to change Windows Defender exclusions or protection settings?
  context: Legitimate Defender management is normally performed by administrators or configuration tooling in clear text.
    Knowing whether this account and endpoint routinely manage Defender preferences is often the fastest path to separating
    sanctioned administrative work from an operator concealing a carve-out.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What specific Defender setting or exclusion did the decoded cmdlet change?
  context: Different Defender changes have different impacts. An -ExclusionProcess or -ExclusionPath entry carves a binary
    or directory out of real-time protection and also stops Attack Surface Reduction and Network Protection from inspecting
    it; -DisableRealtimeMonitoring or -MAPSReporting Disabled weakens detection broadly. Decode the encoded fragment, then
    read the cmdlet parameter and value to determine exactly what was excluded or disabled.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: How was the cmdlet encoded, and what does the full command decode to?
  context: The rule matches base64 and base64offset encodings of the cmdlet, which is how operators hide a Defender carve-out
    from casual inspection. The same command line may also use -EncodedCommand, string concatenation, or backtick escaping.
    Decode every layer to recover the full script, including any download cradle or in-memory loader bundled with the
    preference change.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the deobfuscated cmdlet and surrounding script?
  context: Script block logging records the deobfuscated script content PowerShell actually executes, even when the command
    line is base64-encoded. This is the ground truth for what the encoded cmdlet expanded to and reveals any wider script it
    was embedded in. If PowerShell operational logs are not ingested in this environment, treat zero results as a visibility
    gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell or AMSI security controls bypassed or weakened on this host before this execution?
  context: Operators often weaken PowerShell defenses before running a payload. Common precursors include AMSI bypass (patching
    amsi.dll in memory), execution-policy changes such as -ExecutionPolicy Bypass or -ep bypass, and a downgrade to PowerShell
    v2 which lacks logging. Finding these alongside the Defender carve-out strengthens the case that the tampering was
    deliberate operator preparation.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: Is Windows Defender protection currently restored, or does the change still stand?
  context: The cmdlet change may have been temporary or may persist. If an exclusion is still in place or real-time monitoring
    is still disabled, the host remains under-protected and the setting should be reverted before further investigation. Check
    the current Defender preference state on the host directly rather than relying on the alert alone.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What activity occurred on this host after the Defender setting was changed?
  context: Operators weaken Defender for a reason, typically to run a payload, dump credentials, or stage data that would
    otherwise be blocked or scanned. Examining process activity in the window after the cmdlet ran reveals what the carve-out
    or disabled control was meant to enable, especially execution from a path that was just excluded.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense tampering actions performed on this host in the same window?
  context: Operators who weaken one control often weaken several, stacking exclusions with log clearing, shadow-copy deletion,
    or service stops for maximum coverage. Finding additional tampering from the same user or parent process indicates several
    controls were targeted in one operation rather than an isolated setting change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Were Windows Defender or telemetry settings altered directly in the registry on this host?
  context: Defender preference cmdlets ultimately write to the registry, and operators sometimes edit those keys directly
    to bypass cmdlet-level monitoring, or disable Sysmon and other telemetry the same way. Registry modification events under
    the Defender policy keys or telemetry provider keys surface tampering that does not appear in a PowerShell command line.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\Windows Defender\Exclusions'
          - '\Windows Defender\Real-Time Protection'
          - '\Windows Defender\Features'
          - '\Windows Advanced Threat Protection'
          - '\Policies\Microsoft\Windows Defender'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: What process spawned the PowerShell that ran the encoded cmdlet, and is that parent chain expected?
  context: The parent process reveals how the encoded cmdlet was launched. Interactive administration typically descends from
    explorer.exe or a console; parents such as mshta.exe, wscript.exe, an Office application, or an unexpected service point
    toward exploitation or a malicious script delivering the Defender carve-out.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously fired this encoded-MpPreference pattern, what parents and users drove it, and does
    the current alert fit?
  context: Even routine Defender management can resemble this pattern. The query mirrors the rule's selection scoped to this
    host, so the resulting parent and user distribution reflects how this specific encoded-cmdlet pattern has run here, not
    generic PowerShell usage. A new parent process, an unexpected account, or a one-off pattern against an established baseline
    is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|base64offset|contains:
        - 'Add-MpPreference '
        - 'Set-MpPreference '
        - 'add-mppreference '
        - 'set-mppreference '
      - CommandLine|contains:
        - QQBkAGQALQBNAHAAUAByAGUAZgBlAHIAZQBuAGMAZQAgA
        - EAZABkAC0ATQBwAFAAcgBlAGYAZQByAGUAbgBjAGUAIA
        - BAGQAZAAtAE0AcABQAHIAZQBmAGUAcgBlAG4AYwBlACAA
        - UwBlAHQALQBNAHAAUAByAGUAZgBlAHIAZQBuAGMAZQAgA
        - MAZQB0AC0ATQBwAFAAcgBlAGYAZQByAGUAbgBjAGUAIA
        - TAGUAdAAtAE0AcABQAHIAZQBmAGUAcgBlAG4AYwBlACAA
        - YQBkAGQALQBtAHAAcAByAGUAZgBlAHIAZQBuAGMAZQAgA
        - EAZABkAC0AbQBwAHAAcgBlAGYAZQByAGUAbgBjAGUAIA
        - hAGQAZAAtAG0AcABwAHIAZQBmAGUAcgBlAG4AYwBlACAA
        - cwBlAHQALQBtAHAAcAByAGUAZgBlAHIAZQBuAGMAZQAgA
        - MAZQB0AC0AbQBwAHAAcgBlAGYAZQByAGUAbgBjAGUAIA
        - zAGUAdAAtAG0AcABwAHIAZQBmAGUAcgBlAG4AYwBlACAA
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this encoded-MpPreference pattern in the past week, and does the cross-host distribution
    look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this specific encoded-cmdlet
    pattern rather than generic PowerShell usage. Many hosts firing the same pattern points to a scripted deployment or
    configuration push; one host or a small unrelated set points to manual operator activity. Use the host spread and
    parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|base64offset|contains:
        - 'Add-MpPreference '
        - 'Set-MpPreference '
        - 'add-mppreference '
        - 'set-mppreference '
      - CommandLine|contains:
        - QQBkAGQALQBNAHAAUAByAGUAZgBlAHIAZQBuAGMAZQAgA
        - EAZABkAC0ATQBwAFAAcgBlAGYAZQByAGUAbgBjAGUAIA
        - BAGQAZAAtAE0AcABQAHIAZQBmAGUAcgBlAG4AYwBlACAA
        - UwBlAHQALQBNAHAAUAByAGUAZgBlAHIAZQBuAGMAZQAgA
        - MAZQB0AC0ATQBwAFAAcgBlAGYAZQByAGUAbgBjAGUAIA
        - TAGUAdAAtAE0AcABQAHIAZQBmAGUAcgBlAG4AYwBlACAA
        - YQBkAGQALQBtAHAAcAByAGUAZgBlAHIAZQBuAGMAZQAgA
        - EAZABkAC0AbQBwAHAAcgBlAGYAZQByAGUAbgBjAGUAIA
        - hAGQAZAAtAG0AcABwAHIAZQBmAGUAcgBlAG4AYwBlACAA
        - cwBlAHQALQBtAHAAcAByAGUAZgBlAHIAZQBuAGMAZQAgA
        - MAZQB0AC0AbQBwAHAAcgBlAGYAZQByAGUAbgBjAGUAIA
        - zAGUAdAAtAG0AcABwAHIAZQBmAGUAcgBlAG4AYwBlACAA
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|base64offset|contains:
        - 'Add-MpPreference '
        - 'Set-MpPreference '
        - 'add-mppreference '
        - 'set-mppreference '
      - CommandLine|contains:
        - QQBkAGQALQBNAHAAUAByAGUAZgBlAHIAZQBuAGMAZQAgA
        - EAZABkAC0ATQBwAFAAcgBlAGYAZQByAGUAbgBjAGUAIA
        - BAGQAZAAtAE0AcABQAHIAZQBmAGUAcgBlAG4AYwBlACAA
        - UwBlAHQALQBNAHAAUAByAGUAZgBlAHIAZQBuAGMAZQAgA
        - MAZQB0AC0ATQBwAFAAcgBlAGYAZQByAGUAbgBjAGUAIA
        - TAGUAdAAtAE0AcABQAHIAZQBmAGUAcgBlAG4AYwBlACAA
        - YQBkAGQALQBtAHAAcAByAGUAZgBlAHIAZQBuAGMAZQAgA
        - EAZABkAC0AbQBwAHAAcgBlAGYAZQByAGUAbgBjAGUAIA
        - hAGQAZAAtAG0AcABwAHIAZQBmAGUAcgBlAG4AYwBlACAA
        - cwBlAHQALQBtAHAAcAByAGUAZgBlAHIAZQBuAGMAZQAgA
        - MAZQB0AC0AbQBwAHAAcgBlAGYAZQByAGUAbgBjAGUAIA
        - zAGUAdAAtAG0AcABwAHIAZQBmAGUAcgBlAG4AYwBlACAA
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|base64offset|contains:
        - 'Add-MpPreference '
        - 'Set-MpPreference '
        - 'add-mppreference '
        - 'set-mppreference '
      - CommandLine|contains:
        - QQBkAGQALQBNAHAAUAByAGUAZgBlAHIAZQBuAGMAZQAgA
        - EAZABkAC0ATQBwAFAAcgBlAGYAZQByAGUAbgBjAGUAIA
        - BAGQAZAAtAE0AcABQAHIAZQBmAGUAcgBlAG4AYwBlACAA
        - UwBlAHQALQBNAHAAUAByAGUAZgBlAHIAZQBuAGMAZQAgA
        - MAZQB0AC0ATQBwAFAAcgBlAGYAZQByAGUAbgBjAGUAIA
        - TAGUAdAAtAE0AcABQAHIAZQBmAGUAcgBlAG4AYwBlACAA
        - YQBkAGQALQBtAHAAcAByAGUAZgBlAHIAZQBuAGMAZQAgA
        - EAZABkAC0AbQBwAHAAcgBlAGYAZQByAGUAbgBjAGUAIA
        - hAGQAZAAtAG0AcABwAHIAZQBmAGUAcgBlAG4AYwBlACAA
        - cwBlAHQALQBtAHAAcAByAGUAZgBlAHIAZQBuAGMAZQAgA
        - MAZQB0AC0AbQBwAHAAcgBlAGYAZQByAGUAbgBjAGUAIA
        - zAGUAdAAtAG0AcABwAHIAZQBmAGUAcgBlAG4AYwBlACAA
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around the time of the alert?
  context: Tracking the account's activity across all hosts in a tight window reveals lateral movement or coordinated action
    on multiple endpoints. If the same user weakened Defender on several hosts, the scope of the operation is wider than a
    single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|base64offset|contains:
        - 'Add-MpPreference '
        - 'Set-MpPreference '
        - 'add-mppreference '
        - 'set-mppreference '
      - CommandLine|contains:
        - QQBkAGQALQBNAHAAUAByAGUAZgBlAHIAZQBuAGMAZQAgA
        - EAZABkAC0ATQBwAFAAcgBlAGYAZQByAGUAbgBjAGUAIA
        - BAGQAZAAtAE0AcABQAHIAZQBmAGUAcgBlAG4AYwBlACAA
        - UwBlAHQALQBNAHAAUAByAGUAZgBlAHIAZQBuAGMAZQAgA
        - MAZQB0AC0ATQBwAFAAcgBlAGYAZQByAGUAbgBjAGUAIA
        - TAGUAdAAtAE0AcABQAHIAZQBmAGUAcgBlAG4AYwBlACAA
        - YQBkAGQALQBtAHAAcAByAGUAZgBlAHIAZQBuAGMAZQAgA
        - EAZABkAC0AbQBwAHAAcgBlAGYAZQByAGUAbgBjAGUAIA
        - hAGQAZAAtAG0AcABwAHIAZQBmAGUAcgBlAG4AYwBlACAA
        - cwBlAHQALQBtAHAAcAByAGUAZgBlAHIAZQBuAGMAZQAgA
        - MAZQB0AC0AbQBwAHAAcgBlAGYAZQByAGUAbgBjAGUAIA
        - zAGUAdAAtAG0AcABwAHIAZQBmAGUAcgBlAG4AYwBlACAA
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Tampering with Defender rarely happens in isolation. Earlier detections on the same host, such as reconnaissance,
    credential access, or other defense evasion, may reveal the attack stages that preceded this change and help reconstruct
    the timeline that led to the carve-out.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
