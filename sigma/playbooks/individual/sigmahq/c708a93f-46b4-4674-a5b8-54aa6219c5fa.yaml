name: Potential COLDSTEEL RAT File Indicators
id: 360aa3f2-3247-46e7-9a18-1730301cfccf
description: |
  Detects the creation of a file named 'dllhost.exe' under 'C:\users\public\Documents\' - a name-and-location pairing associated with a fully featured Windows remote access tool. The legitimate dllhost.exe COM surrogate lives in 'C:\Windows\System32', so a copy written to the public, user-writable Documents folder is a name masquerade. This family typically runs as or via svchost.exe, persists as a Windows service, and uses rundll32.exe to hinder detection; the investigation should confirm what the file is, determine whether it executed, reconstruct how it arrived, and check for stacked persistence.
type: detection
detection_id: c708a93f-46b4-4674-a5b8-54aa6219c5fa
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alert show dllhost.exe being written to C:\users\public\Documents\, and which process created it?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The legitimate dllhost.exe
    COM surrogate lives in C:\Windows\System32, so a file with that name written to the public Documents
    folder is a name masquerade. Review the exact path and the responsible process against the detection.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to have executables written into C:\users\public\Documents\?
  context: >-
    A public, user-writable Documents folder is not a normal drop location for executables. Knowing whether
    the writing process and host role are consistent with legitimate activity is often the fastest way to
    separate a true positive from a benign artifact. When the writer is a machine or service account, judge
    by the writing process and host function instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the dropped dllhost.exe still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives urgency and next steps. A payload still on disk can be retrieved,
    hashed, and analyzed; a copy deleted or renamed seconds after creation points to anti-forensic cleanup or
    a self-staging dropper and shifts the focus to what executed in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Is this dllhost.exe the genuine COM surrogate or a renamed/decoy binary?
  context: >-
    The filename mimics a legitimate Windows binary, so identity matters more than the name. Retrieve the file
    and check its size, signing status, imports, and strings against the real System32 dllhost.exe. This family
    is a fully featured remote access tool that runs as or via svchost.exe and leans on rundll32.exe to hinder
    detection, so an unsigned or oddly sized binary at this path is the artifact to escalate.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
- question: If this dllhost.exe has executed, what is its hash and does it have known threat-intel detections?
  context: >-
    A file's hash is recorded when it runs, not when it is written, so this query looks for the artifact
    executing from its dropped path and reads the process hash. Submit that hash to threat intelligence to
    determine whether it matches known malicious variants, is benign, or is previously unseen. If the file is
    present but has not executed, retrieve it from disk and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: Was dllhost.exe at this public path executed after it was written?
  context: >-
    Correlating the file drop with later execution reveals whether the artifact progressed from delivery to
    running code. This family executes commands by spawning a new cmd.exe process that is driven over a network
    connection, so pair evidence of execution with any child cmd.exe and outbound connections from the same host.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
  - image_load
- question: Has a file named dllhost.exe been written to this public path on this host before?
  context: >-
    A file that has never appeared at this path on this host is more suspicious than one that recurs as part of
    routine operations. Zero or very low historical counts indicate a first-time appearance and raise the
    priority of the current drop.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Was dllhost.exe written to this same public location on any other hosts?
  context: >-
    Finding the same drop on multiple hosts points to deliberate distribution or lateral movement; a single host
    points to a targeted or host-local trigger. If the file appears on many hosts, map the distribution pattern
    and timeline to size the incident.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- question: What launched the process that wrote dllhost.exe to the public Documents folder?
  context: >-
    The parent chain above the writing process reveals how the drop was initiated. This family supports
    exploitation of public-facing applications for initial access, so a writer spawned from a service host,
    a web or application process, or an unexpected interpreter is worth tracing further up the tree.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A process that drops one suspicious file often drops several - a dropper unpacking components, a tool staging
    output, or cleanup deletions. The breadth, paths, and extensions of the process's other file activity
    distinguish a single artifact from staged tooling and enumerate what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: What else has been written to C:\users\public\Documents\ recently, and by which processes?
  context: >-
    Location drives suspicion for file artifacts. The public Documents folder has a small set of processes that
    legitimately write there. Other recent arrivals in the same directory reveal whether this is an isolated drop
    or a location under active staging, and which other artifacts belong to the same activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\users\public\Documents\'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- always_include: true
  question: Has this user previously had dllhost.exe written to this public path, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, so the result is the user's 90-day history of this
    specific drop pattern rather than generic file activity, aggregated by host. A user who has never produced this
    pattern is more suspicious than one who does so regularly; weigh the count against their role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename: C:\users\public\Documents\dllhost.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this program historically driven this drop on this host or across the environment, or is the program new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute the behavior; the meaningful
    pivot is the launch mechanism. The query mirrors the rule's selection scoped to the alerting program, so
    the result is the 90-day history of this program producing this specific drop. A new or rare program for this
    pattern is the deviation worth chasing; a program already accounting for many prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename: C:\users\public\Documents\dllhost.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or coordinated activity on multiple
    endpoints. If the same user triggered similar activity elsewhere in the window, the scope of compromise may be
    larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same program-driven drop fire on other hosts in the same window, or is it isolated to this host?
  context: >-
    Under a service principal, asking what else the user did network-wide returns agent-telemetry noise. The
    meaningful question is whether the same launch mechanism fired elsewhere. The query mirrors the rule's selection
    scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts point to pushed or
    scheduled automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename: C:\users\public\Documents\dllhost.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this file was dropped?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host - exploitation of a public-facing
    service, defense tampering, or discovery activity - may reveal the stages that preceded the drop and help
    reconstruct the timeline leading to this remote access tool being staged.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Were other process-based persistence mechanisms installed on this host around the drop?
  context: >-
    Attackers rarely rely on a single persistence mechanism. This family persists as a Windows service, so check
    for service creation via sc.exe alongside scheduled tasks, registry Run keys, BITS jobs, or WMI subscriptions
    installed in the same timeframe. Multiple persistence installations together indicate intentional stacking
    rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Were files dropped to Startup folders or scheduled-task definition paths on this host?
  context: >-
    File-based persistence bypasses command-line detection entirely. Dropping an executable or script into a Startup
    folder or a path referenced by a registry Run key achieves persistence without running schtasks, sc, or reg.
    File-event monitoring captures these drops even when standard persistence tooling is avoided.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
