name: Potential Suspicious Windows Feature Enabled - ProcCreation
id: 6e13e077-9eca-4099-baee-ad3e43f8e10c
description: |
  Detects use of the PowerShell DISM cmdlet Enable-WindowsOptionalFeature against the running OS (-Online -FeatureName)
  to turn on a sensitive Windows optional feature such as Microsoft-Windows-Subsystem-Linux, TFTP, TelnetServer, SMB1Protocol,
  Client-ProjFS, or the optional Internet Explorer component. The rule fires when the command line contains the cmdlet,
  the -Online and -FeatureName switches, AND one of the named sensitive feature strings. Enabling these features is
  legitimate during provisioning, lab setup, or developer work, but the same primitive is used to bring an EDR-blind
  Linux toolchain online (WSL), restore a legacy protocol (SMB1, TFTP, Telnet), or stage other footholds; the
  investigation should establish who ran it, what feature was enabled, and what followed.
type: detection
detection_id: c740d4cf-a1e9-41de-bb16-8a46a4f57918
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line match this rule — Enable-WindowsOptionalFeature with -Online, -FeatureName, and a sensitive feature name?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires only when the command line
    contains Enable-WindowsOptionalFeature AND -Online AND -FeatureName together with one of the named sensitive features
    (TelnetServer, Internet-Explorer-Optional-amd64, TFTP, SMB1Protocol, Client-ProjFS, Microsoft-Windows-Subsystem-Linux).
    Read the exact command line and note which feature was named — the feature drives the rest of the investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to enable optional Windows features?
  context: >-
    Enabling optional features is routine provisioning or developer activity on workstations and build hosts, and unusual
    on a general-purpose server or an end-user machine with no admin role. Knowing whether the user role and host function
    fit feature management is often the fastest path to separating a true positive from routine operations.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What feature was enabled and with what switches — was -All, -Source, -LimitAccess, or -NoRestart present?
  context: >-
    The full command line reveals exactly what was turned on. Note the FeatureName value, whether -All pulled in parent
    features, whether -Source pointed at offline install media, whether -LimitAccess blocked the Windows Update fallback,
    and whether -NoRestart suppressed the reboot prompt to stay quiet. The query scopes to feature-enable commands on this
    host within a tight window rather than to a binary name, because the rule matches on command-line content.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
          - Enable-WindowsOptionalFeature
          - -Online
          - -FeatureName
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - User
- question: What process spawned this command and is that parent chain expected?
  context: >-
    The parent process reveals how the cmdlet was invoked. Interactive administration typically shows explorer.exe or a
    console host as the ancestor; an unexpected parent such as a script host, an Office application, or a remote-management
    agent points toward automated or operator-driven execution rather than a person at the keyboard.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host previously fired the rule's pattern, what parents and users drove it, and does this alert fit?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution
    reflects how feature-enable activity has actually run here, not generic interpreter usage. A new parent process, an
    unexpected user account, or a feature name that has never appeared before is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cmd:
        CommandLine|contains|all:
        - Enable-WindowsOptionalFeature
        - -Online
        - -FeatureName
      selection_feature:
        CommandLine|contains:
        - TelnetServer
        - Internet-Explorer-Optional-amd64
        - TFTP
        - SMB1Protocol
        - Client-ProjFS
        - Microsoft-Windows-Subsystem-Linux
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did this command spawn afterward?
  context: >-
    Enabling a feature is a setup step; the impact shows up in what runs next. After Microsoft-Windows-Subsystem-Linux is
    enabled, watch for wsl.exe, a distro launcher, or a downloaded kernel installer; after TFTP, TelnetServer, or SMB1 the
    payoff is a legacy transfer or remote-access client. Scoping by the parent process instance keeps this precise to the
    children of the alerting command.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other tools ran on this host around the same time?
  context: >-
    Feature enablement rarely happens alone in an intrusion. Activity surrounding the command may reveal reconnaissance,
    privilege escalation, download tooling, or persistence that gives the feature change its real meaning. A burst of
    administrative tooling in the same window reads differently than a single isolated cmdlet invocation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Have other hosts fired the rule's pattern in the past week, and does the spread look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the
    feature-enable pattern rather than generic interpreter usage. Many hosts enabling the same feature points to scripted
    deployment or imaging automation; one host or a small unrelated set points to manual operator activity. Use the host
    spread and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cmd:
        CommandLine|contains|all:
        - Enable-WindowsOptionalFeature
        - -Online
        - -FeatureName
      selection_feature:
        CommandLine|contains:
        - TelnetServer
        - Internet-Explorer-Optional-amd64
        - TFTP
        - SMB1Protocol
        - Client-ProjFS
        - Microsoft-Windows-Subsystem-Linux
      condition: all of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cmd:
        CommandLine|contains|all:
        - Enable-WindowsOptionalFeature
        - -Online
        - -FeatureName
      selection_feature:
        CommandLine|contains:
        - TelnetServer
        - Internet-Explorer-Optional-amd64
        - TFTP
        - SMB1Protocol
        - Client-ProjFS
        - Microsoft-Windows-Subsystem-Linux
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cmd:
        CommandLine|contains|all:
        - Enable-WindowsOptionalFeature
        - -Online
        - -FeatureName
      selection_feature:
        CommandLine|contains:
        - TelnetServer
        - Internet-Explorer-Optional-amd64
        - TFTP
        - SMB1Protocol
        - Client-ProjFS
        - Microsoft-Windows-Subsystem-Linux
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or coordinated action across multiple
    endpoints. If the same account enabled features or ran related tooling on more than one host in the same window, the
    scope of the activity is broader than a single machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cmd:
        CommandLine|contains|all:
        - Enable-WindowsOptionalFeature
        - -Online
        - -FeatureName
      selection_feature:
        CommandLine|contains:
        - TelnetServer
        - Internet-Explorer-Optional-amd64
        - TFTP
        - SMB1Protocol
        - Client-ProjFS
        - Microsoft-Windows-Subsystem-Linux
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining what ran before and after the feature-enable command on this host shows
    what led to it and what followed, and whether it is part of a larger sequence. Novel parent-child pairs at low counts
    stand out against the repetitive agent telemetry that dominates the high-count rows.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the stages
    that preceded the feature change and help reconstruct the timeline. A feature being enabled after prior suspicious
    activity reads very differently than one that appears with no preceding alerts.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
