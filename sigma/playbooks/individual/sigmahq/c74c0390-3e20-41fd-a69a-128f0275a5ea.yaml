name: Cab File Extraction Via Wusa.EXE From Potentially Suspicious Paths
id: 9ec0c80c-be41-46c8-9f7f-0a0d08850e35
description: |
  Detects wusa.exe (Windows Update Standalone Installer) extracting a .cab file via the
  "/extract:" argument from a user-writable or temporary path such as PerfLogs, Users\Public,
  Windows\Temp, or a user AppData\Local\Temp directory. Legitimate update installation uses
  wusa.exe against signed MSU packages in system or download locations, so a /extract that
  pulls CAB contents out of a staging directory is the pattern of interest. Malicious delivery
  chains use wusa.exe to unpack a downloaded CAB straight into a system directory, which can
  drop loader DLLs and configuration files for service hijack or proxied execution; the
  investigation should confirm what CAB was extracted, where its contents went, what spawned
  wusa.exe, and what ran immediately afterward.
type: detection
detection_id: c74c0390-3e20-41fd-a69a-128f0275a5ea
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line show wusa.exe extracting a cab from a user-writable or temporary path?
  context: Confirm the alert is a true positive by reviewing the exact command line. The rule fires
    only when wusa.exe runs with "/extract:" AND the command line references one of the staging
    paths (PerfLogs, Users\Public, Windows\Temp, or a user AppData\Local\Temp). Verify both
    conditions are present in the triggering event and note the source CAB and the extraction target.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to install or extract update packages with wusa.exe?
  context: Routine patching and software deployment can invoke wusa.exe, but extracting CAB contents
    from a staging directory is unusual for normal update flows. Knowing whether the user role and
    host function involve manual package handling or deployment tooling is often the fastest way to
    separate a true positive from an administrative or automation task.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What CAB was extracted and where did its contents go? Decode the full wusa.exe command line.
  context: The full command line reveals the source CAB path supplied to "/extract:" and the
    destination directory the contents were written to. A destination of system32 or another
    system directory, combined with a source CAB in a user-writable staging path, is the abuse
    pattern - it unpacks attacker-controlled files into a trusted location. Decode every argument
    and identify the source CAB, the target directory, and any quiet or norestart flags.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned wusa.exe and is that parent chain expected?
  context: The parent process reveals how wusa.exe was invoked. Update workflows are typically
    launched by trusted service or management parents. A parent such as cmd.exe, a script host,
    an Office application, or a process running from a temporary directory points to a scripted
    delivery chain rather than legitimate patching.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did wusa.exe spawn afterward?
  context: The processes that run after extraction reveal the actual impact. In a delivery chain,
    extracted CAB contents are frequently loaded or executed by a follow-on rundll32.exe,
    cmd.exe, or a newly written binary or DLL. Unexpected children, especially from the
    extraction target directory, indicate the unpacked payload was activated.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host - reconnaissance,
    a download or decode step, or defense tampering - may reveal the staging activity that preceded
    the CAB extraction and help reconstruct the delivery sequence. A download-then-extract pattern
    is especially relevant here.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: What other activity occurred on this host around the time of the alert?
  context: Examining activity around the alert reveals what led to the extraction and what happened
    after. Look for a preceding download or decode step, files written into the staging directory,
    and follow-on execution or service modification that would indicate the extracted contents
    were put to use.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Does this host normally run wusa.exe?
  context: A host that has never or rarely run wusa.exe is more suspicious than one that runs it on
    a regular patching cadence. Zero or very low historical counts indicate first-time or rare
    execution, which is more consistent with delivery-chain abuse than with routine update
    installation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even routine update tooling can be abused. The query mirrors the rule's selection structure
    scoped to this host, so the resulting parent/user distribution reflects how this specific firing
    pattern - wusa.exe extracting a CAB from a staging path - has historically run here. A new parent
    process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_root:
        Image|endswith: \wusa.exe
        CommandLine|contains: '/extract:'
      selection_paths:
        CommandLine|contains:
        - :\PerfLogs\
        - :\Users\Public\
        - :\Windows\Temp\
        - \Appdata\Local\Temp\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_root:
        Image|endswith: \wusa.exe
        CommandLine|contains: '/extract:'
      selection_paths:
        CommandLine|contains:
        - :\PerfLogs\
        - :\Users\Public\
        - :\Windows\Temp\
        - \Appdata\Local\Temp\
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_root:
        Image|endswith: \wusa.exe
        CommandLine|contains: '/extract:'
      selection_paths:
        CommandLine|contains:
        - :\PerfLogs\
        - :\Users\Public\
        - :\Windows\Temp\
        - \Appdata\Local\Temp\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning
    multiple endpoints. If the same user triggered similar staging or extraction activity on multiple
    hosts, the scope of the operation may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_root:
        Image|endswith: \wusa.exe
        CommandLine|contains: '/extract:'
      selection_paths:
        CommandLine|contains:
        - :\PerfLogs\
        - :\Users\Public\
        - :\Windows\Temp\
        - \Appdata\Local\Temp\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other tools ran on this host around the same time?
  context: Delivery chains involve multiple tools in sequence. Activity surrounding the wusa.exe
    extraction may reveal a preceding download or decode utility, a script host, or follow-on
    loaders that provide broader context for the investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of this firing pattern - wusa.exe extracting a CAB from a staging path - not
    generic usage of the binary. Many hosts firing the same pattern points to scripted deployment
    or vendor automation; one host or a small unrelated set points to manual operator activity.
    Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_root:
        Image|endswith: \wusa.exe
        CommandLine|contains: '/extract:'
      selection_paths:
        CommandLine|contains:
        - :\PerfLogs\
        - :\Users\Public\
        - :\Windows\Temp\
        - \Appdata\Local\Temp\
      condition: all of selection_*
    fields:
    - host.name
