name: Run Once Task Configuration in Registry
id: e2834e5c-045e-4cb3-9ef1-91f207e4a17b
description: |
  Detects configuration of an Active Setup Installed Components StubPath value in the registry, a per-user
  logon persistence mechanism whose command executes once for each user at first interactive logon. The rule
  fires when a registry value path contains \Microsoft\Active Setup\Installed Components AND ends in \StubPath,
  excluding the known Chrome and Edge installer writes. Legitimate software installers configure StubPath entries
  during deployment; unexpected writes can stage a command that runs under each user's context. Investigation
  should decode the configured command, attribute the writing process and its parent chain, determine whether the
  referenced payload exists and executed, and check for other persistence configured in the same session.
type: detection
detection_id: c74d7efc-8826-45d9-b8bb-f04fac9e4eff
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Do the registry key path and value data match the Active Setup StubPath persistence pattern this rule detects?
  context: >-
    Confirm the alert is a true positive by reviewing the exact key path (TargetObject) under Active Setup Installed
    Components ending in StubPath, the value data (Details), and the writing process against the rule's criteria.
    Legitimate Chrome and Edge installers write StubPath values under their own component GUIDs and are excluded by
    the rule; anything else warrants review.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to configure Active Setup StubPath entries?
  context: >-
    Active Setup StubPath commands run once per user at first interactive logon. Software installers legitimately
    configure them, but routine users and most endpoints have no reason to write these keys. Knowing whether the
    account and host function match the behavior separates deployment activity from unexpected persistence
    configuration. When User is a machine account or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What Active Setup component and StubPath command were configured, and is this a known persistence location?
  context: >-
    Active Setup Installed Components StubPath is a per-user logon persistence location: the command in the value
    data executes once for each user the first time they log on. This is a well-documented persistence and
    defense-evasion mechanism. The specific component GUID under Installed Components and the command string in
    Details determine what runs and under whose context.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What command or payload is written in the StubPath value, and what does it do?
  context: >-
    The Details value is the command executed by the Active Setup mechanism. Decode it for file paths to unusual
    locations (Temp, AppData, ProgramData), encoded content (base64, hex), script-host or cmd invocations, and DLL
    references. If Details points to an executable path, that path becomes the payload to trace for existence and
    execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Which process wrote this StubPath value, and what spawned that process?
  context: >-
    The registry modification is attributed to a writing process. Tracing that process's own origin reveals whether
    the write came from a legitimate installer chain (an MSI under msiexec.exe, a setup bootstrapper) or from an
    unexpected parent such as a script host, an Office application, or an interactive shell. Abnormal parent-child
    lineage performing the write raises the priority.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other registry modifications were made on this host in the same session?
  context: >-
    Actors configuring persistence often modify several keys together, for example setting a logon persistence
    entry while disabling protections or adjusting configuration. Registry changes clustered from the same writing
    process within a short window reveal whether multiple objectives were pursued alongside the StubPath write.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Is the executable or script referenced by the StubPath command present on disk, and was it recently written?
  context: >-
    Active Setup persistence is only effective if the payload the StubPath command invokes exists at its path.
    Correlating file activity by the registry-writing process and its children surfaces whether the referenced
    binary was dropped in the same session. The file-write event carries no hash; if the payload is present, hash it
    from a later execution or retrieve it for a reputation lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did the command configured in the StubPath value execute on this host?
  context: >-
    Active Setup StubPath commands run at the next interactive logon for each user. The query anchors on the command
    string captured in the value data, so any row is the configured command actually running, confirming the
    persistence is active rather than merely staged. A zero is expected until a user logs on interactively; if the
    value stores an environment-variable or shortened form of the command, expand it and search the literal path
    manually.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|expand: '%Details%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Was this StubPath value modified again or reset after the initial write?
  context: >-
    Registry key and value deletions are not observable in endpoint telemetry, so attacker cleanup cannot be seen
    directly as a removal event. Judge whether the persistence entry was altered by reviewing the key's
    re-modification history over a longer window: a follow-up write may overwrite the payload, disable it, or restore
    a legitimate value. Compare successive Details values to see how the entry changed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Has this Active Setup StubPath key been modified before on this host?
  context: >-
    First-time configuration of a StubPath entry is more suspicious than a recurring one. Active Setup components are
    normally written by installers at software deployment; a key with no prior modification history, or one now set
    to a different value than past writes, points to newly introduced persistence rather than routine software
    behavior.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was there a change ticket, maintenance window, or documented approval for this persistence configuration?
  context: >-
    Configuring a per-user logon persistence entry is the kind of change software deployments and system
    administration typically document. A corresponding ticket or deployment record suggests authorized activity; its
    absence when policy requires one suggests the write was unauthorized.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this registry configuration align with normal work hours or a maintenance window?
  context: >-
    Legitimate installer and administration activity usually lands during business hours or scheduled maintenance. A
    StubPath persistence write outside those windows, especially on a workstation with no deployment in progress, is
    more suspicious than the same change during a documented rollout.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What other process activity occurred on this host around the time of the registry write?
  context: >-
    Persistence configuration rarely occurs in isolation. Aggregating process activity around the alert reveals what
    led to the write and what followed: reconnaissance, privilege escalation, payload staging, or additional
    persistence. Novel parent-child pairs stand out at low counts against high-count routine telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this registry write?
  context: >-
    Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal
    the attack stages that preceded the persistence configuration and help reconstruct the timeline leading to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: >-
    Attackers rarely rely on a single persistence mechanism. Alongside an Active Setup StubPath entry, they commonly
    stack scheduled tasks, services, Run keys, or BITS jobs created through command-line tools. Multiple persistence
    installations in the same timeframe indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
