name: System Disk And Volume Reconnaissance Via Wmic.EXE
id: 50ba86f2-7903-493f-b369-af49ed15175d
description: |
  Detects wmic.exe (identified by Image ending in WMIC.exe or OriginalFileName wmic.exe) running a
  disk and volume enumeration command. The rule fires when the binary matches AND the command line
  carries one of the recon patterns: a ' volumename' or ' logicaldisk' argument, both 'path' and
  'win32_logicaldisk' together, or both ' volume' and ' list ' together. This enumerates logical
  disks, free space, file systems, and volume names — a read-only inventory that needs no elevation
  and is commonly run by attackers establishing situational awareness on a newly accessed host, but
  also by legitimate administrators and inventory scripts. Determine whether the invocation is
  routine administration or part of post-compromise enumeration by examining the full command, the
  parent process, the user and host role, and any surrounding reconnaissance.
type: detection
detection_id: c79da740-5030-45ec-a2e0-479e824a562c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Is the alerting process wmic.exe running a disk or volume enumeration command?
  context: Confirm the alert is a true positive before investing time. The rule fires when the binary is wmic.exe (Image ending in WMIC.exe or OriginalFileName wmic.exe) AND the command line carries a disk/volume recon pattern — ' volumename' or ' logicaldisk', or both 'path' and 'win32_logicaldisk', or both ' volume' and ' list '. Read the exact command line and confirm both the binary identity and one of these argument patterns are present rather than a different wmic subcommand.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run wmic disk and volume enumeration?
  context: Disk and volume inventory through wmic is routine for some administrators, asset-management tooling, and backup or imaging scripts, but unusual from a standard user account or a host with no inventory role. The wmic command-line utility is also deprecated on current Windows builds, so legitimate calls should be rare on modern systems. Knowing whether the account and host function fit administrative inventory work is often the fastest way to separate routine operations from post-compromise enumeration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this wmic command enumerate? Decode the full argument string.
  context: The full command line reveals what was inventoried. Identify whether it used the alias form (' logicaldisk', ' volume list ') or the raw WMI class form ('path win32_logicaldisk get ...'), and which properties were projected — caption, filesystem, freespace, size, volumename, serial. The host-scoped window captures whether this was a single inventory call or one of several wmic queries (service, product, baseboard, volume) run back to back, which together form a broader enumeration sweep rather than an isolated lookup.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains:
          - ' volumename'
          - ' logicaldisk'
          - 'win32_logicaldisk'
          - ' volume'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this wmic command, and is that parent chain expected?
  context: The parent reveals how the enumeration was initiated. Legitimate disk inventory typically runs from cmd.exe opened by a user (explorer.exe ancestry) or from an automation or management agent. Suspicious parents include script interpreters (wscript.exe, cscript.exe, mshta.exe), Office applications, wmiprvse.exe (remote WMI execution), or wsmprovhost.exe (WinRM remote execution), which point to automated or remote post-exploitation enumeration rather than an operator at the keyboard.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: What did wmic.exe spawn afterward on this host?
  context: A read-only disk inventory has no children of its own, so processes that wmic launches afterward reveal whether the tool was used as more than a passive query. Watch for cmd.exe, powershell.exe, or other recon and download tooling spawned from wmic, and for the wmic process call create primitive being used to launch arbitrary commands — patterns that turn a benign-looking inventory into a foothold for further action.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single disk-inventory command may be legitimate troubleshooting, but several discovery commands in rapid succession — whoami, ipconfig, net, systeminfo, nltest, tasklist alongside wmic — is a signature of post-compromise enumeration. Three or more distinct recon binaries within fifteen minutes typically indicates an operator or script building situational awareness before the next stage. Note which other commands fired and under what account.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: Have other hosts fired this disk-recon pattern in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this specific disk-recon firing pattern rather than generic wmic usage. Many hosts firing the same pattern points to scripted inventory or imaging automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \WMIC.exe
      - OriginalFileName: wmic.exe
      selection_cli:
      - CommandLine|contains:
        - ' volumename'
        - ' logicaldisk'
      - CommandLine|contains|all:
        - path
        - win32_logicaldisk
      - CommandLine|contains|all:
        - ' volume'
        - ' list '
      condition: all of selection_*
    fields:
    - host.name
- question: How often has this host fired the disk-recon pattern over the past 90 days, and what command-line structures are typical?
  context: A disk-recon pattern with no prior history on a host is more suspicious than one that runs regularly under stable automation. The query mirrors the rule's selection structure scoped to this host, so the count reflects this specific firing pattern rather than generic wmic usage. The command-line projection lets you compare the typical invocation patterns here against the alerting one — a new pattern, a new projection of properties, or a first-ever occurrence is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \WMIC.exe
      - OriginalFileName: wmic.exe
      selection_cli:
      - CommandLine|contains:
        - ' volumename'
        - ' logicaldisk'
      - CommandLine|contains|all:
        - path
        - win32_logicaldisk
      - CommandLine|contains|all:
        - ' volume'
        - ' list '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- question: Was wmic.exe executed from its expected System32 path?
  context: The legitimate binary lives at %SystemRoot%\System32\wbem\wmic.exe. A wmic.exe running from a user temp directory, a download folder, or any path outside System32/SysWOW64 may indicate the binary was copied or renamed to evade path-based allowlists. Compare the Image path against the expected location, and check OriginalFileName to confirm whether a renamed copy is being run under a different file name.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Were other discovery or proxy-execution LOLBins used on this host recently?
  context: Operators who use one living-off-the-land binary for enumeration often use several. If wmic was used for disk inventory, check whether other built-in proxy-execution and discovery binaries ran on the same host in the recent window — finding multiple LOLBins building situational awareness or executing code strengthens the case for hands-on post-compromise activity over isolated administration.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\control.exe'
          - '\hh.exe'
          - '\installutil.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\diskshadow.exe'
          - '\dnscmd.exe'
          - '\esentutl.exe'
          - '\xwizard.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \WMIC.exe
      - OriginalFileName: wmic.exe
      selection_cli:
      - CommandLine|contains:
        - ' volumename'
        - ' logicaldisk'
      - CommandLine|contains|all:
        - path
        - win32_logicaldisk
      - CommandLine|contains|all:
        - ' volume'
        - ' list '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \WMIC.exe
      - OriginalFileName: wmic.exe
      selection_cli:
      - CommandLine|contains:
        - ' volumename'
        - ' logicaldisk'
      - CommandLine|contains|all:
        - path
        - win32_logicaldisk
      - CommandLine|contains|all:
        - ' volume'
        - ' list '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user account do across the network around this time?
  context: Tracking the account's activity across all hosts can reveal lateral movement or a wider footprint. If the same account triggered similar enumeration or other activity on multiple endpoints in the alert window, the scope of compromise may be larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \WMIC.exe
      - OriginalFileName: wmic.exe
      selection_cli:
      - CommandLine|contains:
        - ' volumename'
        - ' logicaldisk'
      - CommandLine|contains|all:
        - path
        - win32_logicaldisk
      - CommandLine|contains|all:
        - ' volume'
        - ' list '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Enumeration rarely appears in isolation. Earlier detections on the same host — initial execution, defense tampering, or other reconnaissance — may reveal the stages that preceded this disk inventory and help reconstruct the timeline. Disk and volume recon often sits early in a sequence that continues toward credential access or data staging.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur alone. Examining surrounding activity reveals what led to this enumeration firing and what followed it, including further recon, file staging, or follow-on execution. Novel parent-child pairs stand out at low counts against routine high-count agent telemetry, which is what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
