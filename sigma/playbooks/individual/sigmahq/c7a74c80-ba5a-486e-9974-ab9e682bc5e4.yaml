  question: What else did this user do across the environment around the time of the alert?
  context: Tracking the user's activity across all hosts in the alert window reveals whether the same account is active on other endpoints, which would widen the scope of the investigation. This is a right-now cross-host view, distinct from the user's longer-term history of this behavior.
  range: +/-1h
  query: |
