name: File With Uncommon Extension Created By An Office Application
id: 0206e59c-89b9-4725-beef-4f0661d2c8b2
description: |
  Detects a Microsoft Office application (Excel, Access, Publisher, PowerPoint, Visio, or Word) creating a file whose name ends in an executable or script extension such as .exe, .dll, .bat, .ps1, .hta, .scr, or .vbs. The rule fires when an Office binary AND an executable/script target extension are both present, excluding a small set of known-benign Office cache and assembly paths. Office applications produce documents, not executables, so this pattern most often reflects a macro or embedded object dropping a payload to disk as the staging step before execution. Determine what document the user opened, what the dropped file is, whether it executed, and what else the responsible process touched.
type: detection
detection_id: c7a74c80-ba5a-486e-9974-ab9e682bc5e4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Did an Office application create a file ending in an executable or script extension, and do the path and process match the alert?
  context: Confirm the alert is a true positive by reviewing the exact file that was written, its extension, and the Office process that created it. An Office binary writing a .exe, .dll, .bat, .ps1, .hta, or similar payload extension is the pattern the rule fires on and rarely corresponds to normal document editing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to have an Office application write executable or script files to disk?
  context: Legitimate Office use produces documents, not executables. Knowing whether this user's role and this host's function ever involve Office add-ins or automation that legitimately writes scripts is often the fastest way to separate a benign developer or IT workflow from a macro-dropped payload.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What document or email attachment did the Office application open before it wrote this file?
  context: Office drops executables as the effect of a macro or embedded object in a document the user opened. Identifying the source document and how it arrived — an email attachment, a downloaded file, or a network share — enables blocking the delivery path and finding other recipients. The parent process and its command line show how the Office session was launched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Is the Office installation on this host fully patched against macro, OLE, and DDE abuse?
  context: Some Office-to-payload chains rely on known vulnerabilities in document parsing or object handling. Confirming the Office version and patch level indicates whether exploitation of a known issue was possible and whether other similarly unpatched hosts are exposed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: What is in the file the Office application wrote, and does its content show obfuscation or known malware indicators?
  context: Retrieve the dropped file and examine its actual content. For scripts, look for base64 or otherwise obfuscated strings, embedded URLs or IP addresses, and command sequences; for binaries, check imports, embedded strings, packer signatures, and signing status. This is content analysis and is distinct from a hash reputation lookup.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If the dropped file has executed, what is its hash and does it have known threat-intelligence detections?
  context: A file's hash is recorded when it runs, not when it is written, so file-creation events carry no hash. This query looks for the dropped file executing by matching its name in the process image path and reads the hash; submit that hash to reputation and threat-intel sources. If the file is present but has not executed, retrieve it from its on-disk path and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
- question: What child processes did the Office application spawn around the time it wrote this file?
  context: The user-execution chain completes when the Office process launches a child — commonly powershell.exe, wscript.exe, cscript.exe, cmd.exe, mshta.exe, rundll32.exe, regsvr32.exe, or msiexec.exe — to run or unpack the dropped payload. A child of this kind under an Office parent indicates the payload was executed or unpacked and points to what ran next.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is the dropped file still on disk, or was it deleted or renamed after the alert?
  context: The file's post-alert lifecycle drives next steps. A payload still on disk can be retrieved, hashed, and analyzed; a file deleted seconds after creation suggests a self-deleting dropper or cleanup and shifts focus to what executed in the interval.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the responsible Office process write or delete around the alert?
  context: A process that drops one payload often drops several — staging multiple components or unpacking an archive. The breadth, paths, and extensions of the Office process's other file activity distinguish a single artifact from a multi-file staging operation and enumerate what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files with executable or script extensions have recently been written on this host, and by which processes?
  context: Because the rule pins extensions rather than a fixed directory, the useful comparison is other recent arrivals of executable and script files on the same host. A cluster of such files, or an unfamiliar writing process, indicates a staging location or a broader drop rather than an isolated event.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith:
          - .bat
          - .cmd
          - .com
          - .dll
          - .exe
          - .hta
          - .ocx
          - .proj
          - .ps1
          - .scf
          - .scr
          - .sys
          - .vbe
          - .vbs
          - .wsf
          - .wsh
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: When this host has previously produced this Office-writes-executable behavior, what programs and users drove it, and does the current alert fit?
  context: The query mirrors the rule's full selection scoped to this host, so the program and user distribution reflects how this specific behavior — not generic Office usage — has run here. A new acting program process, an unexpected account, or a first-ever occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection1:
        Image|endswith:
        - \excel.exe
        - \msaccess.exe
        - \mspub.exe
        - \powerpnt.exe
        - \visio.exe
        - \winword.exe
      selection2:
        TargetFilename|endswith:
        - .bat
        - .cmd
        - .com
        - .dll
        - .exe
        - .hta
        - .ocx
        - .proj
        - .ps1
        - .scf
        - .scr
        - .sys
        - .vbe
        - .vbs
        - .wsf
        - .wsh
      filter_main_localassembly:
        TargetFilename|contains: \AppData\Local\assembly\tmp\
        TargetFilename|endswith: .dll
      filter_optional_webservicecache:
        TargetFilename|contains|all:
        - C:\Users\
        - \AppData\Local\Microsoft\Office\
        - \WebServiceCache\AllUsers
        TargetFilename|endswith: .com
      filter_optional_webex:
        Image|endswith: \winword.exe
        TargetFilename|contains: \AppData\Local\Temp\webexdelta\
        TargetFilename|endswith:
        - .dll
        - .exe
      filter_optional_backstageinappnavcache:
        TargetFilename|contains|all:
        - C:\Users\
        - \AppData\Local\Microsoft\Office\
        - \BackstageInAppNavCache\
        TargetFilename|endswith: .com
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection* and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - Image
    - User
- always_include: true
  question: Has this user previously produced this Office-writes-executable behavior, and does that history fit their role?
  context: The query mirrors the rule's selection scoped to this user, aggregated by host, giving the user's history of this specific behavior rather than generic Office use. A user who has never produced it is more notable than one who does routinely; weigh the count against the user's role and typical toolset.
