- question: Were other users or hosts hit by the same detection, pointing to a wider delivery campaign?
  context: Malicious documents are rarely sent to a single recipient. Correlating the same detection across other hosts and users reveals the breadth of the delivery and identifies additional systems that received the same payload and need investigation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Did other detections fire on this host in the hours before this alert?
  context: Office dropping a payload is often not the first observable step. Earlier detections on the same host — phishing indicators, reconnaissance, or defense tampering — help reconstruct how the activity began and what stage this event represents.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
