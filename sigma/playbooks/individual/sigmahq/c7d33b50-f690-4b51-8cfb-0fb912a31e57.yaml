name: HackTool - SharpDPAPI Execution
id: 2bf2951f-9351-411f-8514-2b669b85af84
description: |
  Detects execution of SharpDPAPI, a C# port of Mimikatz DPAPI functionality used to decrypt DPAPI-protected
  secrets — user and machine masterkeys, Credential Manager blobs, Vault entries, saved RDP sessions, and browser
  cookies and logins, plus domain backup-key extraction. The rule fires when EITHER the process Image or
  OriginalFileName identifies SharpDPAPI.exe, OR the command line carries a DPAPI subcommand (masterkeys,
  credentials, vaults, rdg, keepass, backupkey, blob, certificates) together with an option flag or a GUID-formatted
  argument. Determine whether the execution is an authorized assessment, which DPAPI capability was invoked, and
  whether secret material or a domain backup key was accessed — a backupkey extraction against a domain controller
  turns a per-user secret store into a domain-wide one.
type: detection
detection_id: c7d33b50-f690-4b51-8cfb-0fb912a31e57
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does this event match SharpDPAPI execution — either by SharpDPAPI.exe image/original filename, or by a DPAPI subcommand combined with an option flag or GUID argument?
  context: >-
    The rule fires on either of two independent branches: the process Image ends in \SharpDPAPI.exe or its
    OriginalFileName is SharpDPAPI.exe, OR the command line contains a DPAPI subcommand (backupkey, blob,
    certificates, credentials, keepass, masterkeys, rdg, vaults) together with at least one option flag
    (/file:, /machine, /mkfile:, /password:, /pvk:, /server:, /target:, /unprotect) or a GUID-formatted
    argument. Confirm which branch fired: a clean image-name match identifies the tool by metadata even if
    renamed-and-flags-stripped, while a flag/subcommand match identifies it by behavior even if the binary
    was renamed. Note the branch — when only the command-line branch fired, the binary name may be disguised
    and the signing/origin checks on the image carry more weight.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run DPAPI secret-extraction tooling?
  context: >-
    DPAPI dumping is almost never part of routine administration. Knowing whether the user role and host
    function include credential-recovery or forensic duties is often the fastest way to separate an authorized
    operation from intrusion activity. A backup or recovery workstation operated by an identity team is a very
    different finding than the same execution on a general-purpose endpoint.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this SharpDPAPI execution part of an authorized penetration test or red team engagement?
  context: >-
    Offensive credential tooling like SharpDPAPI is used in authorized security assessments. Before investing
    investigation time, check whether a pentest or red team exercise is currently active on this host or network
    segment. An authorized engagement with matching tool usage and timing resolves the alert without further
    analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which DPAPI capability was invoked — and did the command request a domain backup key?
  context: >-
    SharpDPAPI is multi-purpose. The subcommand determines the scope of compromise: masterkeys and
    machinemasterkeys decrypt user or machine masterkey material; credentials, vaults, and rdg pull Credential
    Manager, Windows Vault, and saved RDP secrets; keepass and certificates target those stores; triage runs an
    all-in-one sweep. backupkey /server: requests the domain DPAPI backup key via the directory replication
    primitive — once obtained it decrypts every user's masterkeys domain-wide. /pvk: supplies that backup key
    for offline decryption. Identify the subcommand and any /pvk: or /server: argument to set the blast radius.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Across the full SharpDPAPI invocation on this host, what targets, files, and keys did the command line reference?
  context: >-
    The complete command line reveals exactly which secret stores were touched and how. Decode the subcommand,
    the /target: and /file: arguments (specific masterkey GUIDs or credential files), /mkfile: and /pvk: paths
    (an externally supplied backup key or masterkey file), /password: and /server: values, and the /machine and
    /unprotect flags. Multi-command tools sometimes run as several sequential invocations that together form one
    logical operation, so review every SharpDPAPI execution in the window, not just the triggering one.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Did this process read or write DPAPI masterkey, credential, or vault files on the host?
  context: >-
    DPAPI extraction reads characteristic paths — user masterkey blobs under \AppData\Roaming\Microsoft\Protect\<SID>\,
    machine masterkeys under C:\Windows\System32\Microsoft\Protect, credential files under
    \AppData\Local\Microsoft\Credentials, vault directories under \Microsoft\Vault, RSA private-key blobs under
    \Microsoft\Crypto\RSA\, and RDCMan.settings — and may write decrypted output to a file. File events from this
    process confirm which stores were accessed even after the process has exited.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process spawned SharpDPAPI and is that parent chain expected?
  context: >-
    The parent process reveals how the tool was launched. A masterkey/credential dumper run from explorer.exe
    during an interactive admin session is different from one spawned by a script host, a remote-execution service
    host, or a process injected via in-memory assembly loading. SharpDPAPI is frequently run in memory through
    assembly-execution loaders, so an unexpected or memory-resident parent is the deviation worth chasing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did this process or a process it spawned write any artifact to disk around the alert, beyond the known DPAPI store paths, that could be output from a duplicated or impersonated token?
  context: >-
    Token-duplication and impersonation rights are granted through a cross-process handle open, and that handle
    open is not observable in this environment — there is no process-access telemetry here, so a zero result below
    does not prove SharpDPAPI never attempted to duplicate or impersonate a token. What is observable is anything
    the process or its children wrote afterward. A file outside the standard masterkey/credential/vault paths —
    an exported backup key, an extracted secret dump, or a staging file for a follow-on operation — is the
    corroborating evidence that live token theft, not just on-disk decryption, occurred.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was a new logon session created on this host in the minutes around the alert under a different account or elevated context?
  context: >-
    Make-and-impersonate-token activity surfaces in security audit logs as a new logon (often a NewCredentials
    or network logon sourced locally) followed by privileged-context assignment, with a security context that
    differs from the launching process. Correlate logon and special-privilege-assignment events near the alert
    time to see whether the execution ran under, or created, an identity distinct from the parent — a switch from
    the parent's context points to token manipulation rather than a straightforward user-context run.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      service: security
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4624
          - 4672
      condition: selection
    fields:
      - EventID
      - TargetUserName
      - LogonType
      - SubjectUserName
- question: Does this host normally run SharpDPAPI?
  context: >-
    A binary that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low
    historical counts over the trailing window indicate first-time or rare execution, which raises the priority of
    the credential-access finding. A recurring presence may point to a sanctioned recovery or assessment workflow
    worth confirming with the owning team.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host previously fired the SharpDPAPI pattern, what parents and users drove it, and does the current alert fit?
  context: >-
    Even credential tooling can have a sanctioned footprint. The query mirrors the rule's selection structure
    scoped to this host, so the resulting parent/user distribution reflects how the rule's specific firing pattern
    has historically run here rather than generic binary usage. A new parent process, an unexpected user account,
    or an unusual command-line structure relative to that history is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \SharpDPAPI.exe
      - OriginalFileName: SharpDPAPI.exe
      selection_other_cli:
        CommandLine|contains:
        - ' backupkey '
        - ' blob '
        - ' certificates '
        - ' credentials '
        - ' keepass '
        - ' masterkeys '
        - ' rdg '
        - ' vaults '
      selection_other_options_guid:
        CommandLine|contains|all:
        - ' {'
        - '}:'
      selection_other_options_flags:
        CommandLine|contains:
        - ' /file:'
        - ' /machine'
        - ' /mkfile:'
        - ' /password:'
        - ' /pvk:'
        - ' /server:'
        - ' /target:'
        - ' /unprotect'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_img or (selection_other_cli and 1 of selection_other_options_*)) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did SharpDPAPI spawn afterward?
  context: >-
    The processes spawned by the tool reveal its actual impact. Follow-on processes such as cmd.exe,
    powershell.exe, or networked utilities can indicate that decrypted secrets were immediately used — for
    example to authenticate elsewhere, stage output, or pivot. A dumper that exits with no children is consistent
    with collection-only activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \SharpDPAPI.exe
      - OriginalFileName: SharpDPAPI.exe
      selection_other_cli:
        CommandLine|contains:
        - ' backupkey '
        - ' blob '
        - ' certificates '
        - ' credentials '
        - ' keepass '
        - ' masterkeys '
        - ' rdg '
        - ' vaults '
      selection_other_options_guid:
        CommandLine|contains|all:
        - ' {'
        - '}:'
      selection_other_options_flags:
        CommandLine|contains:
        - ' /file:'
        - ' /machine'
        - ' /mkfile:'
        - ' /password:'
        - ' /pvk:'
        - ' /server:'
        - ' /target:'
        - ' /unprotect'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_img or (selection_other_cli and 1 of selection_other_options_*)) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \SharpDPAPI.exe
      - OriginalFileName: SharpDPAPI.exe
      selection_other_cli:
        CommandLine|contains:
        - ' backupkey '
        - ' blob '
        - ' certificates '
        - ' credentials '
        - ' keepass '
        - ' masterkeys '
        - ' rdg '
        - ' vaults '
      selection_other_options_guid:
        CommandLine|contains|all:
        - ' {'
        - '}:'
      selection_other_options_flags:
        CommandLine|contains:
        - ' /file:'
        - ' /machine'
        - ' /mkfile:'
        - ' /password:'
        - ' /pvk:'
        - ' /server:'
        - ' /target:'
        - ' /unprotect'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_img or (selection_other_cli and 1 of selection_other_options_*)) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Credential access rarely happens in isolation. Earlier detections on the same host — defense tampering,
    privilege escalation, reconnaissance, or other token-manipulation activity — may reveal the stages that
    preceded this execution and help reconstruct the timeline leading to the DPAPI extraction.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
