name: PUA - Sysinternals Tools Execution - Registry
id: 875fbf50-3db7-4862-b9f0-a1c11827fff2
description: >-
  Detects creation of a Sysinternals "EulaAccepted" registry value under a
  tool-specific key such as \PsExec\EulaAccepted, \ProcDump\EulaAccepted, or
  \SDelete\EulaAccepted. Sysinternals utilities write this value the first time
  they run and the user accepts the license, so the value's appearance means the
  named tool executed on this host. Administrators legitimately run these tools;
  the same suite is also used by intruders, where PsExec drives remote and
  lateral execution, ProcDump dumps process memory for credential access, SDelete
  wipes files for anti-forensics, and Handle or Process Explorer perform host
  reconnaissance. Identify which tool the key path names, confirm the tool ran
  and what it targeted, and determine whether the use was authorized.
type: detection
detection_id: c7da8edc-49ae-45a2-9e61-9fd860e4e73d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Do the registry key path and value data match what this rule detects?
  context: >-
    Confirm the alert is a true positive by reviewing the exact key path
    (TargetObject) against the detection criteria. The rule fires when the path
    contains a Sysinternals tool segment (\PsExec, \ProcDump, \SDelete, \Handle,
    \Process Explorer, \Sysinternals and similar) and ends in \EulaAccepted, the
    marker written on first accepted run of that tool.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to run Sysinternals administrative tools?
  context: >-
    Legitimate administrative activity can trigger this detection. Sysinternals
    tools are common on IT and administrator workstations and rare on general
    user endpoints or servers with no admin role. Knowing whether the user and
    host function fit administrative tool use is often the fastest way to
    separate routine operations from suspicious execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which Sysinternals tool does this key path identify, and what is that tool's abuse profile?
  context: >-
    The path segment names the specific tool. PsExec enables remote command
    execution and lateral movement, ProcDump dumps process memory and is used
    against lsass.exe for credential access, SDelete securely erases files as an
    anti-forensic step, PsPasswd changes account passwords, PsLoglist reads event
    logs, and Handle or Process Explorer support host reconnaissance. The writing
    process (Image) should be the tool binary itself, since these utilities
    register their own EULA acceptance.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What tool name and value data does the key hold, and does the value confirm a first accepted run?
  context: >-
    Read the tool name from the path segment and interpret the value data
    (Details). The EulaAccepted value is typically a DWORD set to 1 when the
    license was accepted, written once at first run. A present value confirms the
    tool ran interactively or with a flag that auto-accepts the license. If
    Details is absent, the value may be binary or empty, but the key path alone
    still identifies which tool executed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process spawned this Sysinternals tool, and is that parent chain expected?
  context: >-
    The parent process reveals how the tool was launched. Interactive admin use
    usually descends from explorer.exe or a shell the admin opened; automation
    descends from a scheduler or deployment agent. Parents such as mshta.exe,
    wscript.exe, an Office application, or an unexpected service point to scripted
    or exploited launch rather than deliberate administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
- question: What was the tool's full command line, and what target or file did it act on?
  context: >-
    The registry marker confirms the tool started, but the command line shows
    what it did. Look for a remote host or admin share argument on PsExec, a
    process name or PID such as lsass.exe on ProcDump, a file or free-space path
    on SDelete, or an account name on PsPasswd. The command line and working
    directory determine whether the run was benign administration or hands-on
    intrusion activity.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - ProcessGuid
- question: Does this host normally run this Sysinternals tool?
  context: >-
    A tool never seen before on a host is more suspicious than one that runs
    regularly. Zero or very low historical counts indicate first-time or rare
    execution, which is consistent with the EulaAccepted marker being written now
    for the first time. Frequent prior execution suggests an established
    administrative workflow.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Has this EulaAccepted key been set before on this host?
  context: >-
    The EULA marker is written once at first accepted run, so on a host that has
    used the tool before the key already exists and this modification may be a
    reinstall, a new user profile, or a re-run. No prior history for the key
    indicates the tool is running here for the first time, which raises the
    priority of confirming who introduced it.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Does the key remain present afterward, and did the tool run again on this host?
  context: >-
    Endpoint telemetry emits no registry key or value deletion events, so removal
    of the marker to hide that the tool ran cannot be confirmed directly. Judge
    the tool's ongoing use from later modifications of the same key and from
    repeat execution of the tool binary in the days after the alert. Continued
    activity points to sustained use rather than a single administrative task.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Were other registry modifications made on this host in the same session?
  context: >-
    Intruders who run one Sysinternals tool often chain several actions, so the
    signal is what else changed alongside the EULA marker. Look for other tool
    EULA keys, service creation entries, security policy changes, or Run key
    persistence landing in the same window, which together indicate a hands-on
    session rather than an isolated tool launch.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining process activity around the marker
    reveals what launched the tool, what ran alongside it, and whether it belongs
    to a larger sequence such as reconnaissance, credential access, or lateral
    movement staged from this host.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did the identified tool make outbound network connections indicating remote or lateral execution?
  context: >-
    PsExec and similar remote-capable Sysinternals tools connect to a target host
    over SMB on port 445 to install and run a service remotely. Outbound
    connections from the tool binary to internal hosts, especially over 445,
    indicate the tool was used for remote or lateral execution rather than local
    administration. No outbound connections is consistent with purely local use.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: Was this same tool EulaAccepted key set on other hosts in the environment?
  context: >-
    The same tool marker appearing across many hosts in a short window suggests
    mass deployment, either a sanctioned rollout or an intruder spreading a tool
    laterally. If only this host carries the marker, the use is targeted or
    local. Compare the writing process and value data across hosts to tell a
    coordinated push from independent administrative use.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host, such as defense tampering,
    reconnaissance, or credential access, may reveal the stages that preceded
    tool execution and help reconstruct the timeline. A cluster of prior alerts
    raises the likelihood this tool run is part of an active operation rather
    than routine administration.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
