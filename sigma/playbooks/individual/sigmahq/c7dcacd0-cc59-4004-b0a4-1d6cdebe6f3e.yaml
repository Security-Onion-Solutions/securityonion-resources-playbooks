name: Disable Administrative Share Creation at Startup
id: b7dd8ae8-3e6a-4cd3-82bd-a40f76cc6ea6
description: |
  Detects a registry write that sets the AutoShareServer or AutoShareWks value under
  Services\LanmanServer\Parameters to DWORD 0, which stops Windows from auto-creating the
  hidden administrative shares (ADMIN$, C$, IPC$) at the next service start. Administrators
  occasionally disable admin shares as a hardening step, so a change from a known change
  window or configuration-management run can be benign. Under indicator-removal activity the
  same change cleans up and impairs the SMB admin-share access used for remote administration
  and lateral movement; determine which process wrote the value, whether it persists, and what
  else happened on the host around that time.
type: detection
detection_id: c7dcacd0-cc59-4004-b0a4-1d6cdebe6f3e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the registry key path and value data match the admin-share disable this rule detects?
  context: Confirm the alert is a true positive before investing time. The rule fires when the
    TargetObject ends in AutoShareServer or AutoShareWks under Services\LanmanServer\Parameters
    AND the value data is DWORD 0. Review the exact key path, the value data, and the writing
    process against those criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify the LanmanServer share parameters?
  context: Legitimate hardening or configuration-management activity can set these values.
    Knowing whether the writing account and host function fit that pattern is often the fastest
    way to separate a sanctioned change from indicator removal. User attribution is present on
    roughly 94% of endpoint registry events; when it is a machine account or missing, pivot on
    the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which share type was disabled and what does the value data mean?
  context: The value name identifies the target — AutoShareWks governs auto-creation of admin
    shares on workstation-class systems, AutoShareServer governs server-class systems. Value
    data of DWORD 0 disables auto-creation, while DWORD 1 or an absent value keeps the default
    on. Read the Details field to confirm the write is a disable (0) rather than a re-enable.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Is Services\LanmanServer\Parameters a known evasion-relevant location, and what process wrote to it?
  context: This key controls whether the hidden administrative shares are recreated at each
    Server service start. Setting AutoShareServer or AutoShareWks to 0 is a recognized
    indicator-removal and lateral-movement-impairment step. The writing process (Image) tells
    you whether a standard tool (reg.exe, a policy client) or an unexpected binary made the
    change.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What capability does disabling admin-share auto-creation remove, and what does it enable for the actor?
  context: Turning off auto-creation of ADMIN$, C$, and IPC$ removes the default SMB paths used
    for remote administration and for pushing or pulling files between hosts. As indicator
    removal it also erases the share footprint that remote-access tooling would leave. The
    command line of the writing process shows how the change was made and whether it was part
    of a scripted sequence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the disabled value stay in place, and did the writing process also run other payloads?
  context: Endpoint telemetry records registry modifications but not key or value deletions, so
    judge persistence from the key's re-modification history rather than asking whether the value
    was removed. If the value is later set back to 1, the change was temporary or reverted; if
    it remains 0 across the window, auto-creation stays off at the next service start. Also
    check whether the same process ran additional commands, which distinguishes a one-off
    hardening change from hands-on activity.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process spawned the process that wrote this registry value, and is that chain expected?
  context: The parent reveals how the change was invoked. A configuration-management agent or an
    interactive administrator shell implies routine change; a script interpreter, an office
    application, or a remote-execution service as the parent points to scripted or
    remotely-driven tampering. Walk up from the writing process to its parent to judge intent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Are the administrative shares currently still disabled on this host?
  context: The disable takes effect at the next Server service start, so the host may or may not
    currently be serving admin shares. Confirm the present state of AutoShareServer and
    AutoShareWks and whether the shares are reachable; if they remain off and that is not the
    intended configuration, the setting should be restored as part of remediation. Check current
    status through host inspection rather than relying only on the write event.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What activity occurred on this host after the admin shares were disabled?
  context: Defenses are usually disabled to enable a follow-on action. Examining process activity
    in the window after the change reveals what the tampering was meant to support — credential
    access, staging, or execution that would otherwise leave a share footprint. Novel processes
    appearing right after the change deserve priority review.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other registry modifications made on this host in the same window?
  context: Actors who change one key often change several — pairing an admin-share disable with a
    Run key for persistence, a Defender policy change, or a firewall setting. Grouping registry
    writes on the host by key path and writing process in a short window around the alert shows
    the full scope of configuration changes and whether several objectives were pursued together.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Were other defense-tampering actions performed on this host?
  context: Actors who disable one control often disable several — stopping Defender, clearing
    event logs, or deleting shadow copies alongside the share change. Finding multiple tampering
    commands from the same user or parent process in the surrounding window indicates a
    coordinated effort to reduce visibility rather than an isolated administrative change. The
    CLI form of share removal (net use with /delete, or Remove-SmbMapping) is worth watching for
    in the same sequence.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Has this share-parameter value been modified before on this host?
  context: The LanmanServer share-parameter values should rarely change on a stable host. A
    first-time or very rare modification is more notable than a key that changes routinely under
    a configuration baseline. Compare historical Details values and writing processes to see
    whether this write matches a recurring management pattern or is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Were this host's administrative shares accessed remotely in the period before they were disabled?
  context: Admin shares (ADMIN$, C$, IPC$) are the SMB paths used for remote administration and
    lateral movement, and disabling their auto-creation can be cleanup after such use. Network
    share access events on the host name the accessing account and source address, which help
    tie the disable to prior remote activity. Detailed file-share auditing is often not enabled,
    so treat zero results as a possible visibility gap rather than proof no access occurred.
  range: -24h
  query: |
    aggregation: true
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 5140
      condition: selection
    fields:
      - ShareName
      - SubjectUserName
      - IpAddress
- question: Was this share-parameter value modified on other hosts in the environment?
  context: The same modification across many hosts may reflect a group-policy rollout or a
    configuration-management push, whereas a change on a single host points to targeted activity.
    Compare the writing process and value data across hosts to tell a fleet-wide policy change
    from an isolated one.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining what ran shortly before and after the
    registry change reveals the immediate context — what led to it and what followed. Aggregating
    process activity by parent and child collapses routine agent noise into high-count rows while
    novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential
    access — may reveal the stages that preceded this change and help reconstruct the timeline.
    Indicator-removal steps commonly come after the activity they are meant to hide.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host?
  context: Actors rarely rely on a single foothold. Alongside indicator removal they commonly
    install backup persistence using scheduled tasks, services, registry Run keys, BITS jobs, or
    WMI subscriptions. Persistence-tool executions in the surrounding window indicate deliberate
    stacking rather than an isolated administrative change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations (Startup folders, scheduled-task definitions) on this host?
  context: File-based persistence bypasses command-line detection entirely. Dropping an
    executable or script into a Startup folder or a path referenced by a registry Run key
    achieves persistence without running schtasks, sc, or reg. File-event monitoring captures
    these drops even when standard persistence tools are avoided.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
