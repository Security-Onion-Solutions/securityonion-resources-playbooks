name: Network Connection Initiated By Regsvr32.EXE
id: bb19d62f-1d41-40c8-a0e9-6e6064177168
description: |
  Detects an outbound network connection initiated by regsvr32.exe. regsvr32.exe is a
  signed Microsoft binary for registering and unregistering COM components and ActiveX
  controls; it seldom initiates network traffic on its own, so an outbound connection is
  an anomaly worth explaining. The pattern most associated with this behavior is remote
  scriptlet execution (regsvr32 /s /n /u /i:<URL> scrobj.dll), which fetches and runs a
  remote JScript/COM scriptlet in memory without writing it to disk, and is also used to
  pull DLL or follow-on payloads. Determine what command line launched regsvr32, what
  destination it reached, which modules it loaded, and what it spawned, to separate
  benign COM registration from signed-binary proxy execution.
type: detection
detection_id: c7e91a02-d771-4a6d-a700-42587e0b1095
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Do the destination and port match what this rule detects, and which process initiated it?
  context: >-
    Confirm the alert by reviewing the destination IP and port and the connection direction against an outbound
    regsvr32.exe connection. The rule fires when the initiating image ends in regsvr32.exe and the connection is
    outbound (egress). Network telemetry from a passive sensor may not carry process fields, so confirm the initiating
    process from the endpoint record where present.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - Image
      - Initiated
- question: Is this user and host expected to have regsvr32.exe make outbound network connections?
  context: >-
    regsvr32.exe legitimately registers COM components locally and rarely reaches out to the network. Knowing whether
    this host and user routinely run software that drives regsvr32 outbound is often the fastest way to separate benign
    COM registration from remote scriptlet execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What was the full command line that launched regsvr32.exe, and does it reference a remote scriptlet or URL?
  context: >-
    The launching command line is the load-bearing evidence. Decode the arguments for a /i reference pointing at an
    http or https URL or a .sct or .ocx scriptlet, and for /s /n /u flags paired with scrobj.dll, the pattern that
    fetches and runs a remote COM scriptlet without writing it to disk. This pivots from the network event to the
    process record by process identity; if the connection was seen only by a passive sensor with no process fields,
    the launching command line is not retrievable this way.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What DLLs did this regsvr32.exe instance load, and were scrobj.dll or any unsigned or untrusted modules among them?
  context: >-
    Remote scriptlet execution loads scrobj.dll (the COM scriptlet component) to run the fetched code; payloads
    delivered as DLLs surface as unsigned or untrusted modules loaded shortly after invocation. Reviewing the module
    loads for this process identity distinguishes ordinary COM registration from proxied code execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - SignatureStatus
- question: What is this destination, and what do passive DNS, registration age, and threat intelligence reveal about it?
  context: >-
    Investigate the destination reached by regsvr32.exe: resolution history, domain registration age, hosting, and any
    known-bad reputation. Recently registered domains, bulletproof hosting, or known scriptlet-delivery infrastructure
    point to attacker-controlled endpoints. The connection event rarely carries the resolved hostname, so anchor on the
    destination IP and correlate the name separately.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - DestinationPort
- question: What domains did this host resolve just before the connection, and does one map to the destination IP?
  context: >-
    Because the connection record rarely stores the resolved hostname, the domain behind an outbound regsvr32.exe
    connection is usually recoverable only from the preceding lookup. Match a resolved name to the destination address
    to identify the domain the scriptlet or payload was fetched from; a freshly resolved, low-reputation, or
    algorithmically generated name strengthens the case for remote delivery.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - QueryName
- question: What process spawned this regsvr32.exe, and is that parent chain expected?
  context: >-
    The parent reveals how regsvr32 was invoked. Legitimate COM registration is usually launched by explorer.exe, an
    installer, or a service. Parents such as mshta.exe, wscript.exe, cscript.exe, or an Office application point to
    macro or script-driven execution. This lookup resolves the immediate parent by its process identity; walk up
    further from the parent's own parent if the chain looks unusual.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What child processes did this regsvr32.exe spawn afterward?
  context: >-
    The children reveal the payload's effect. A remote scriptlet commonly instantiates WScript.Shell to launch cmd.exe
    or powershell.exe, or drops and runs a staged binary. Unexpected children within the hours after the connection
    indicate post-execution activity rather than benign registration.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run regsvr32.exe at all?
  context: >-
    A binary that is rare or unseen on a host is more suspicious than one that runs routinely. Low or zero counts over
    the trailing period indicate first-time or unusual execution and raise the weight of the outbound connection.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously initiated outbound regsvr32.exe connections, what programs and users drove them, and does this alert fit that pattern?
  context: >-
    Even a binary seen before can be abused. This mirrors the rule's exact firing pattern scoped
    to this host, so the program and user distribution reflects how outbound regsvr32.exe
    connections have historically originated here. A new acting program, an unexpected account,
    or a first-of-its-kind occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        Initiated: 'true'
        Image|endswith: \regsvr32.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: Does this host normally communicate with this destination?
  context: >-
    First-time connections to a destination carry more weight than routine traffic. A destination this host has never
    reached, especially over an unusual port, separates new delivery infrastructure from established business
    communication.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur alone. Aggregating the surrounding process activity surfaces what led up to the connection and
    what followed, such as reconnaissance, privilege escalation, or persistence, while collapsing routine agent noise.
    Novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal the
    stages that preceded this connection and help reconstruct the timeline. A cluster of related alerts changes how this
    one should be weighted.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts initiated outbound regsvr32.exe connections in the past week, and does the distribution look like automation or one-off activity?
  context: >-
    This mirrors the rule's firing pattern with no host scope, giving a fleet-wide count of outbound regsvr32.exe
    connections. Many hosts showing the same pattern points to a deployment tool or vendor software driving regsvr32; a
    single host or a small unrelated set points to hands-on-keyboard activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        Initiated: 'true'
        Image|endswith: \regsvr32.exe
      condition: selection
    fields:
    - host.name
- question: Were any other proxy-execution LOLBins used on this host recently?
  context: >-
    Operators who proxy code through one signed binary often reach for others. If regsvr32 fetched and ran a remote
    scriptlet, check whether rundll32, mshta, msbuild, installutil, or similar signed binaries were also used to execute
    code in the same window. Several proxy-execution binaries converging on one host strengthens the case for deliberate
    abuse.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was regsvr32.exe executed from its expected System32 or SysWOW64 path?
  context: >-
    regsvr32.exe running from outside the System32 or SysWOW64 directories may have been copied or renamed to evade
    path-based allowlists. Confirm the image path and the original file name against the legitimate signed binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host initiated outbound regsvr32.exe connections over the past 90 days, and what command-line structures are typical?
  context: >-
    An outbound regsvr32.exe pattern with little or no prior history on a host is more suspicious than one that recurs
    under stable command lines. This mirrors the rule's firing pattern scoped to this host; the command-line projection
    lets you compare typical invocations against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        Initiated: 'true'
        Image|endswith: \regsvr32.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - CommandLine
