name: Suspicious Autorun Registry Modified via WMI
id: 9e90ed53-999e-48fc-b278-0b1af9c6157c
description: |
  Detects wmic.exe (or a process spawned by wmiprvse.exe) running reg add against a CurrentVersion\Run, WOW6432Node Run, or
  Policies\Explorer\Run autorun key, where the command line ALSO references EITHER a system-writable staging path (Temp,
  ProgramData, Perflogs, AppData, Public, Recycle.bin) OR a user profile path combined with a personal-folder name (Documents,
  Pictures, Music, Favorites, Contacts). Using WMI to write a Run key is a way to establish logon persistence while obscuring
  the parentage of the change. Legitimate software installers and administrative scripts can write Run keys, so the
  investigation determines whether the registered payload, the parent chain, and the user are consistent with sanctioned
  deployment.
type: detection
detection_id: c80e66d8-1780-48a9-b412-46663fd21ac0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- question: Did wmic.exe run reg add against an autorun Run key, and did the command line reference either a system-writable
    staging path or a user profile personal-folder path?
  context: Confirm the alert is a true positive before investing time. The rule fires when wmic.exe (or a wmiprvse.exe child)
    runs reg add against a CurrentVersion\Run, WOW6432Node, or Policies\Explorer\Run key AND the command line references EITHER
    a system-writable staging path (Temp, ProgramData, Perflogs, AppData, Public) OR a user profile path together with a
    personal-folder name. Note which path branch fired — a staging-path match points at a dropped payload in a transient
    directory, while a user-profile match points at a payload hidden among the user's personal folders, and that distinction
    steers the on-disk and signing checks downstream.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to create logon persistence by writing Run keys through WMI?
  context: Legitimate administrative activity and software installs can write Run keys, but doing so by invoking reg add
    through wmic.exe is an unusual delivery path for routine management. Knowing whether the user role and host function are
    consistent with deploying autostart entries this way is often the fastest path to separating a sanctioned change from an
    operator establishing persistence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What spawned the wmic.exe (or wmiprvse.exe) process, and is that parent chain expected for this kind of registry
    change?
  context: The parent-child relationship is the core signal for WMI-delivered persistence. wmiprvse.exe spawning the change
    points at a WMI method invocation (local or remote), while wmic.exe launched from a shell, script host, or Office process
    points at hands-on or macro-driven execution. Tracing the parent's own origin (grandparent) shows whether the chain is a
    legitimate management workflow or a payload spawned by another tool.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did the same parent spawn around the time of this alert?
  context: If a suspicious parent spawned the WMI-driven registry change, it likely spawned other processes too. Sibling
    processes from the same parent reveal the full scope of activity — reconnaissance, payload drop, or additional persistence
    — and multiple suspicious children from one parent points to scripted orchestration rather than an isolated administrative
    action. host.name is included as a fallback because ParentProcessGuid may resolve to NODATA.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What exact Run key path and value were written, and what executable or script does the value point to?
  context: The registry value reveals intent. The rule matches Run keys under CurrentVersion\Run, WOW6432Node, and
    Policies\Explorer\Run, but the specific value name and data determine what actually runs at logon. Reading the structured
    registry event gives the key path and written data directly instead of parsing them out of the reg.exe command line.
    Pay attention to whether the value data points into a system-writable staging directory or a user profile path, since that
    is the location branch the rule keyed on.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Were other registry modifications made on this host in the same session, within minutes of this change?
  context: Operators who write one persistence key often make several registry changes at once — stacking a second Run key,
    disabling a security setting, or relaxing a policy. Finding a cluster of reg.exe write operations on the host within a
    short window reveals the full scope of configuration changes and whether multiple objectives were pursued alongside the
    autorun entry. This also surfaces the time-correlation window between related changes.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- question: Does the referenced executable or script exist on disk at the path written to the Run value, and what is its hash?
  context: Registry persistence is only effective if the referenced payload exists at the path written to the registry value.
    The rule's path branches point at staging directories (Temp, ProgramData, Public) or user profile folders, so the value
    data likely references a file in one of those locations. Confirming the file exists and analyzing its hash determines
    whether the persistence is active and what it would execute on next logon. If the registry value data does not resolve to
    a concrete path here, read it from the written value and verify the file manually.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What WMI provider operations occurred on this host around the time of the alert, and which namespace and method
    were invoked?
  context: WMI execution leaves provider-side records distinct from the spawned process. The
    channel's low-volume records are provider loads (event 5857) and event-subscription
    registrations (5859-5861) — local management activity in root\cimv2 differs from
    root\subscription registrations that operators use to run commands on a trigger. Read the
    namespace and WQL filter from the NamespaceName and Query columns, the loaded provider from
    ProviderName, and the consumer payload on 5861 rows from CONSUMER; message carries the
    readable narrative on every row. If WMI operational events are not ingested in this
    environment, treat zero results as a visibility gap rather than evidence the activity was
    local-only.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        Channel: 'Microsoft-Windows-WMI-Activity/Operational'
        host.name|expand: '%hostname%'
        EventID:
          - 5857
          - 5859
          - 5860
          - 5861
      condition: selection
    fields:
      - EventID
      - winlog.user_data.ProviderName
      - winlog.user_data.NamespaceName
      - winlog.user_data.Query
      - winlog.user_data.CONSUMER
      - message
- question: Did this host receive or make WMI-related network connections around the time of the alert that could indicate
    remote command execution?
  context: WMI can drive command execution remotely, in which case wmiprvse.exe servicing an inbound connection spawns the
    payload. Network connections involving the WMI service around the alert time distinguish a remotely triggered registry
    change from a host-local one. A remote source points at lateral movement and widens the investigation to the originating
    host. NOT filters exclude routine loopback so the inbound or outbound remote endpoint stands out.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\wmiprvse.exe'
          - '\wmic.exe'
          - '\svchost.exe'
      filter_local:
        DestinationIp|cidr:
          - '127.0.0.0/8'
          - '::1/128'
      condition: selection and not filter_local
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - Initiated
- question: Were other proxy-execution or persistence LOLBins used on this host recently?
  context: Operators who use one living-off-the-land binary often use several. Alongside WMI writing a Run key, the same host
    may show other binaries used to proxy-execute code or install persistence — rundll32, regsvr32, mshta, schtasks, sc, or
    bitsadmin. Finding multiple LOLBins performing related objectives in the same timeframe strengthens the case for scripted
    malicious activity over a one-off administrative action.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\schtasks.exe'
          - '\reg.exe'
          - '\sc.exe'
          - '\at.exe'
          - '\bitsadmin.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\mavinject.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was wmic.exe executed from its expected System32/SysWOW64 path, or from a relocated or renamed copy?
  context: A LOLBin executed from a non-standard path — outside System32 or SysWOW64 — may have been copied or renamed to
    evade path-based allowlists. The rule also matches on OriginalFileName, so a renamed wmic.exe still triggers; comparing
    Image against OriginalFileName here confirms whether the binary was running from its expected location or a relocated copy.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired this WMI-to-Run-key pattern over the past 90 days, and what command-line structures are
    typical?
  context: A persistence pattern with no prior history on a host is more suspicious than one seen regularly under stable
    parents. This query mirrors the rule's full selection structure scoped to this host, so the count reflects the rule's
    specific firing pattern rather than generic wmic.exe usage. The CommandLine projection lets the analyst compare typical
    invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_execution_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      - ParentImage|endswith: \wmiprvse.exe
      selection_execution_cmd:
        CommandLine|contains|all:
        - reg
        - ' add '
        CommandLine|contains:
        - \Software\Microsoft\Windows\CurrentVersion\Run
        - \Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Run
        - \Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run
      selection_suspicious_paths_1:
        CommandLine|contains:
        - :\Perflogs
        - :\ProgramData'
        - :\Windows\Temp
        - :\Temp
        - \AppData\Local\Temp
        - \AppData\Roaming
        - :\$Recycle.bin
        - :\Users\Default
        - :\Users\public
        - '%temp%'
        - '%tmp%'
        - '%Public%'
        - '%AppData%'
      selection_suspicious_paths_user_1:
        CommandLine|contains: :\Users\
      selection_suspicious_paths_user_2:
        CommandLine|contains:
        - \Favorites
        - \Favourites
        - \Contacts
        - \Music
        - \Pictures
        - \Documents
        - \Photos
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_execution_* and (selection_suspicious_paths_1 or (all of selection_suspicious_paths_user_*))) and _pb_scope
    fields:
    - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_execution_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      - ParentImage|endswith: \wmiprvse.exe
      selection_execution_cmd:
        CommandLine|contains|all:
        - reg
        - ' add '
        CommandLine|contains:
        - \Software\Microsoft\Windows\CurrentVersion\Run
        - \Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Run
        - \Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run
      selection_suspicious_paths_1:
        CommandLine|contains:
        - :\Perflogs
        - :\ProgramData'
        - :\Windows\Temp
        - :\Temp
        - \AppData\Local\Temp
        - \AppData\Roaming
        - :\$Recycle.bin
        - :\Users\Default
        - :\Users\public
        - '%temp%'
        - '%tmp%'
        - '%Public%'
        - '%AppData%'
      selection_suspicious_paths_user_1:
        CommandLine|contains: :\Users\
      selection_suspicious_paths_user_2:
        CommandLine|contains:
        - \Favorites
        - \Favourites
        - \Contacts
        - \Music
        - \Pictures
        - \Documents
        - \Photos
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_execution_* and (selection_suspicious_paths_1 or (all of selection_suspicious_paths_user_*))) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_execution_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      - ParentImage|endswith: \wmiprvse.exe
      selection_execution_cmd:
        CommandLine|contains|all:
        - reg
        - ' add '
        CommandLine|contains:
        - \Software\Microsoft\Windows\CurrentVersion\Run
        - \Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Run
        - \Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run
      selection_suspicious_paths_1:
        CommandLine|contains:
        - :\Perflogs
        - :\ProgramData'
        - :\Windows\Temp
        - :\Temp
        - \AppData\Local\Temp
        - \AppData\Roaming
        - :\$Recycle.bin
        - :\Users\Default
        - :\Users\public
        - '%temp%'
        - '%tmp%'
        - '%Public%'
        - '%AppData%'
      selection_suspicious_paths_user_1:
        CommandLine|contains: :\Users\
      selection_suspicious_paths_user_2:
        CommandLine|contains:
        - \Favorites
        - \Favourites
        - \Contacts
        - \Music
        - \Pictures
        - \Documents
        - \Photos
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_execution_* and (selection_suspicious_paths_1 or (all of selection_suspicious_paths_user_*))) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around the time of this alert?
  context: Tracking the user's activity across all hosts reveals lateral movement or a footprint spanning multiple endpoints.
    If the same user drove similar WMI or registry activity on other hosts in this window, the scope of the operation may be
    larger than the single alerting host. This asks what they did right now across the network, distinct from their 90-day
    baseline.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_execution_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      - ParentImage|endswith: \wmiprvse.exe
      selection_execution_cmd:
        CommandLine|contains|all:
        - reg
        - ' add '
        CommandLine|contains:
        - \Software\Microsoft\Windows\CurrentVersion\Run
        - \Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Run
        - \Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run
      selection_suspicious_paths_1:
        CommandLine|contains:
        - :\Perflogs
        - :\ProgramData'
        - :\Windows\Temp
        - :\Temp
        - \AppData\Local\Temp
        - \AppData\Roaming
        - :\$Recycle.bin
        - :\Users\Default
        - :\Users\public
        - '%temp%'
        - '%tmp%'
        - '%Public%'
        - '%AppData%'
      selection_suspicious_paths_user_1:
        CommandLine|contains: :\Users\
      selection_suspicious_paths_user_2:
        CommandLine|contains:
        - \Favorites
        - \Favourites
        - \Contacts
        - \Music
        - \Pictures
        - \Documents
        - \Photos
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_execution_* and (selection_suspicious_paths_1 or (all of selection_suspicious_paths_user_*))) and _pb_scope
    fields:
    - host.name
- question: Does the timing of this activity align with normal work hours and maintenance windows?
  context: Legitimate persistence and configuration changes typically occur during business hours or scheduled maintenance
    windows. A Run key written through WMI at 3 AM on a Saturday is more suspicious than the same change during a documented
    weekday maintenance window. Account for the host's timezone and whether the responsible team operates on a non-standard
    schedule.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did other detections fire on this host in the hours before this alert?
  context: Persistence rarely happens in isolation. Earlier detections on the same host — defense tampering, reconnaissance,
    or credential access — may reveal the stages that preceded this autorun change and help reconstruct the timeline. The
    sequence of alerts on the host often tells the operation's story.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
