name: AADInternals PowerShell Cmdlets Execution - ProccessCreation
id: 923a98f7-5350-4296-8dbb-4e3d473b09a0
description: |
  Detects execution of AADInternals cmdlets via a PowerShell host (powershell.exe, powershell_ise.exe,
  or pwsh.exe). AADInternals is a PowerShell module for administering Azure AD and Office 365; the same
  cmdlets that support legitimate administration also expose token extraction, directory reconnaissance,
  federation manipulation, and account changes that are useful in an attack against an Azure AD or
  Office 365 tenant. The rule fires when a PowerShell host process runs AND its command line contains
  one of the AADInternals verb-noun cmdlets (Add-AADInt, Get-AADInt, Export-AADInt, Invoke-AADInt, and
  the rest of the *-AADInt family). The investigation should determine which cmdlets ran, what tenant
  data or credentials they targeted, whether the acting user and host normally perform Azure AD
  administration, and what activity preceded and followed the execution.
type: detection
detection_id: c86500e9-a645-4680-98d7-f882c70c1ea3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- question: Does a PowerShell host process run with an AADInternals cmdlet on its command line, matching what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when both
    conditions hold together — the image is a PowerShell host (powershell.exe, powershell_ise.exe, or pwsh.exe, or the
    original file name resolves to PowerShell) AND the command line contains an AADInternals cmdlet such as Get-AADInt,
    Export-AADInt, or Invoke-AADInt. Read the exact command line and confirm both the host and the cmdlet are present.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to administer Azure AD or Office 365?
  context: AADInternals is an administration module, so legitimate use is plausible for identity administrators or
    automation that manages a tenant. Knowing whether the acting user's role and the host's function are consistent with
    Azure AD / Office 365 administration is often the fastest path to separating a sanctioned admin task from an operator
    abusing the same tooling.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which AADInternals cmdlets ran, and what tenant data, tokens, or credentials did they target?
  context: AADInternals cmdlets map to distinct objectives. Export-AADInt and Read-AADInt commonly extract tokens, AD
    Connect credentials, or directory objects; Get-AADInt enumerates tenant configuration and identities; Set-AADInt,
    New-AADInt, and Grant-AADInt modify federation, accounts, or permissions. Read the full command line, enumerate every
    cmdlet invoked, and identify what each one targets, because that determines which accounts, tokens, or federation trust
    may be compromised and what remediation is needed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Was the command encoded or obfuscated, and what does it decode to?
  context: PowerShell command lines can be hidden with the -EncodedCommand (-enc) parameter, string concatenation, backtick
    escaping, or variable substitution, and the AADInternals module itself may be loaded in memory before the cmdlet is
    invoked. If the command line is encoded, decode the base64 payload and confirm which AADInternals cmdlets and arguments
    actually executed; if it is already readable, identify the module import and the specific cmdlet so the operation can be
    reconstructed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the full AADInternals script content?
  context: Script block logging (Event ID 4104) records the deobfuscated script content PowerShell actually executed, even
    when the command line is encoded or the module is loaded in memory. This provides ground truth about which AADInternals
    cmdlets and parameters ran, bypassing command-line obfuscation. If PowerShell operational logs are not ingested in this
    environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell security controls bypassed or weakened before this execution?
  context: Operators frequently disable or bypass PowerShell security controls before running a payload. Common precursors
    include AMSI bypass (patching amsi.dll in memory), execution policy changes (Set-ExecutionPolicy or the -ep bypass flag),
    constrained language mode escape, and downgrade to PowerShell v2 which lacks logging. Finding these events in the hour
    before the AADInternals execution strengthens the case that the activity is not routine administration.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: Which accounts or tenant identities may be compromised, and do any have elevated privileges?
  context: The severity of this activity depends on what the cmdlets targeted and the privilege of the affected identities.
    Extraction of Global Administrator, AD Connect (sync), or federation-signing credentials requires incident escalation;
    enumeration of a standard user may only need monitoring. Cross-reference the targeted accounts and the acting user with
    directory group memberships to scope exposure.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single administrative command may be legitimate, but multiple reconnaissance commands in rapid succession —
    whoami, net user, nltest, dsquery, setspn — is a signature of post-compromise enumeration. Directory and identity
    discovery running alongside AADInternals cmdlets suggests an operator mapping the environment before the next stage
    rather than a one-off administrative task.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: When this host has previously fired the AADInternals pattern, what parents and users drove it, and does this alert fit that pattern?
  context: Even routine Azure AD administration leaves a baseline. The query mirrors the rule's selection structure scoped to
    this host, so the resulting parent and user distribution reflects how this specific firing pattern has historically run
    here, not generic PowerShell usage. A new parent process, an unexpected user account, or a first-time appearance of the
    AADInternals pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.Exe
        - pwsh.dll
      selection_cli:
        CommandLine|contains:
        - Add-AADInt
        - ConvertTo-AADInt
        - Disable-AADInt
        - Enable-AADInt
        - Export-AADInt
        - Find-AADInt
        - Get-AADInt
        - Grant-AADInt
        - Initialize-AADInt
        - Install-AADInt
        - Invoke-AADInt
        - Join-AADInt
        - New-AADInt
        - Open-AADInt
        - Read-AADInt
        - Register-AADInt
        - Remove-AADInt
        - Reset-AADInt
        - Resolve-AADInt
        - Restore-AADInt
        - Save-AADInt
        - Search-AADInt
        - Send-AADInt
        - Set-AADInt
        - Start-AADInt
        - Unprotect-AADInt
        - Update-AADInt
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.Exe
        - pwsh.dll
      selection_cli:
        CommandLine|contains:
        - Add-AADInt
        - ConvertTo-AADInt
        - Disable-AADInt
        - Enable-AADInt
        - Export-AADInt
        - Find-AADInt
        - Get-AADInt
        - Grant-AADInt
        - Initialize-AADInt
        - Install-AADInt
        - Invoke-AADInt
        - Join-AADInt
        - New-AADInt
        - Open-AADInt
        - Read-AADInt
        - Register-AADInt
        - Remove-AADInt
        - Reset-AADInt
        - Resolve-AADInt
        - Restore-AADInt
        - Save-AADInt
        - Search-AADInt
        - Send-AADInt
        - Set-AADInt
        - Start-AADInt
        - Unprotect-AADInt
        - Update-AADInt
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.Exe
        - pwsh.dll
      selection_cli:
        CommandLine|contains:
        - Add-AADInt
        - ConvertTo-AADInt
        - Disable-AADInt
        - Enable-AADInt
        - Export-AADInt
        - Find-AADInt
        - Get-AADInt
        - Grant-AADInt
        - Initialize-AADInt
        - Install-AADInt
        - Invoke-AADInt
        - Join-AADInt
        - New-AADInt
        - Open-AADInt
        - Read-AADInt
        - Register-AADInt
        - Remove-AADInt
        - Reset-AADInt
        - Resolve-AADInt
        - Restore-AADInt
        - Save-AADInt
        - Search-AADInt
        - Send-AADInt
        - Set-AADInt
        - Start-AADInt
        - Unprotect-AADInt
        - Update-AADInt
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated activity across multiple
    endpoints. If the same user ran AADInternals or related tooling on multiple hosts, the scope of the operation may be
    larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.Exe
        - pwsh.dll
      selection_cli:
        CommandLine|contains:
        - Add-AADInt
        - ConvertTo-AADInt
        - Disable-AADInt
        - Enable-AADInt
        - Export-AADInt
        - Find-AADInt
        - Get-AADInt
        - Grant-AADInt
        - Initialize-AADInt
        - Install-AADInt
        - Invoke-AADInt
        - Join-AADInt
        - New-AADInt
        - Open-AADInt
        - Read-AADInt
        - Register-AADInt
        - Remove-AADInt
        - Reset-AADInt
        - Resolve-AADInt
        - Restore-AADInt
        - Save-AADInt
        - Search-AADInt
        - Send-AADInt
        - Set-AADInt
        - Start-AADInt
        - Unprotect-AADInt
        - Update-AADInt
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the alert reveals what led to the event and
    what happened afterward, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, or
    persistence mechanisms in the same window.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the
    attack stages that preceded the AADInternals execution and help reconstruct the timeline. Identity tooling run late in a
    chain often follows the activity that established the foothold.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired the AADInternals pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this
    firing pattern rather than generic PowerShell usage. Many hosts firing the same pattern points to scripted deployment or
    administration automation; one host or a small unrelated set points to manual operator activity. Use the host distribution
    to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.Exe
        - pwsh.dll
      selection_cli:
        CommandLine|contains:
        - Add-AADInt
        - ConvertTo-AADInt
        - Disable-AADInt
        - Enable-AADInt
        - Export-AADInt
        - Find-AADInt
        - Get-AADInt
        - Grant-AADInt
        - Initialize-AADInt
        - Install-AADInt
        - Invoke-AADInt
        - Join-AADInt
        - New-AADInt
        - Open-AADInt
        - Read-AADInt
        - Register-AADInt
        - Remove-AADInt
        - Reset-AADInt
        - Resolve-AADInt
        - Restore-AADInt
        - Save-AADInt
        - Search-AADInt
        - Send-AADInt
        - Set-AADInt
        - Start-AADInt
        - Unprotect-AADInt
        - Update-AADInt
      condition: all of selection_*
    fields:
