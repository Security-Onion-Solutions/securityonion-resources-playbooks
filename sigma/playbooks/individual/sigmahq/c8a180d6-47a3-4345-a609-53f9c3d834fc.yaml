name: Suspicious Reconnaissance Activity Using Get-LocalGroupMember Cmdlet
id: ba19f554-e3c4-42dc-ad2d-499c48901ac8
description: |
  Detects use of the PowerShell Get-LocalGroupMember cmdlet to enumerate the membership of privileged
  groups such as local administrators, enterprise admins, Remote Desktop Users, or Exchange Trusted
  Subsystem. The rule fires when a command line contains the Get-LocalGroupMember cmdlet AND references
  one of those privileged group names. Reading group membership is read-only and routine for administrators
  and inventory tooling; the same enumeration is also an early step attackers take to map privileged
  accounts and plan privilege escalation or lateral movement, so the investigation centers on whether the
  user, parent process, and surrounding activity match expected administrative behavior.
type: detection
detection_id: c8a180d6-47a3-4345-a609-53f9c3d834fc
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line contain Get-LocalGroupMember together with a privileged group name?
  context: Confirm the alert is a true positive before investing further time. The rule fires only when
    the command line contains the Get-LocalGroupMember cmdlet AND names a privileged group (domain admins,
    enterprise admins, an administrator/administrateur variant, Exchange Trusted Subsystem, or a Remote
    Desktop Users localization). Verify both elements are present in the exact command line of the
    triggering event.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What exactly did the Get-LocalGroupMember command enumerate, and were other enumeration
    cmdlets run in the same session?
  context: The full command line reveals which group was queried and whether the call was wrapped in a
    loop, piped into formatting, or chained with other discovery cmdlets. This query returns
    Get-LocalGroupMember invocations on this host in a tight window so a multi-step enumeration script
    is visible as a set, not a single line. Note which privileged groups were targeted and whether the
    output was exported or staged.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: 'Get-LocalGroupMember '
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - User
- question: Which privileged groups were named in the enumeration, and is reading those groups expected
    for this user and host?
  context: The rule keys on a specific set of high-value groups - local/domain administrators, enterprise
    admins, Exchange Trusted Subsystem, and Remote Desktop Users (including the French and Spanish
    localizations administrateur, Utilisateurs du Bureau a distance, and Usuarios de escritorio remoto).
    Enumerating these groups maps who holds privileged access on the host. Determine which group names
    appeared and whether routine inventory or troubleshooting on this host legitimately reads them.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - User
- question: What process spawned the Get-LocalGroupMember command, and is that parent expected to launch
    PowerShell enumeration?
  context: Group enumeration run interactively typically descends from explorer.exe or a console opened
    by an administrator. The same cmdlet spawned by Office applications, script interpreters (wscript.exe,
    cscript.exe, mshta.exe), wmiprvse.exe, or wsmprovhost.exe points to macro-driven or remote-execution
    enumeration rather than hands-on administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single group-membership query may be legitimate troubleshooting, but several discovery
    commands in quick succession - whoami, net user, nltest, tasklist, systeminfo - is a signature of
    post-compromise enumeration. Attackers run these to understand their context before choosing the next
    stage. Three or more distinct recon binaries inside fifteen minutes usually indicates automated
    reconnaissance.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: Is this user expected to run administrative discovery commands?
  context: Administrators and IT staff legitimately enumerate group membership for inventory and
    troubleshooting. Standard users rarely have a reason to read who belongs to the administrators or
    enterprise admins groups. The user's role and typical behavior determine whether reading privileged
    group membership is routine or anomalous here.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cmdlet:
        CommandLine|contains: 'Get-LocalGroupMember '
      selection_group:
        CommandLine|contains:
        - domain admins
        - ' administrator'
        - ' administrateur'
        - enterprise admins
        - Exchange Trusted Subsystem
        - Remote Desktop Users
        - "Utilisateurs du Bureau \xE0 distance"
        - Usuarios de escritorio remoto
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cmdlet:
        CommandLine|contains: 'Get-LocalGroupMember '
      selection_group:
        CommandLine|contains:
        - domain admins
        - ' administrator'
        - ' administrateur'
        - enterprise admins
        - Exchange Trusted Subsystem
        - Remote Desktop Users
        - "Utilisateurs du Bureau \xE0 distance"
        - Usuarios de escritorio remoto
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or enumeration repeated
    on multiple endpoints. If the same user triggered similar activity elsewhere in this window, the scope
    of the operation may be larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cmdlet:
        CommandLine|contains: 'Get-LocalGroupMember '
      selection_group:
        CommandLine|contains:
        - domain admins
        - ' administrator'
        - ' administrateur'
        - enterprise admins
        - Exchange Trusted Subsystem
        - Remote Desktop Users
        - "Utilisateurs du Bureau \xE0 distance"
        - Usuarios de escritorio remoto
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did remote-access or lateral-movement activity follow the enumeration on this host?
  context: Account discovery is a precursor step; the privileged accounts it surfaces are often used
    shortly afterward for remote access or lateral movement. Look for outbound administrative sessions,
    remote service creation, or remote PowerShell launched from this host in the hours after the
    enumeration, which would indicate the mapped accounts were acted on rather than merely listed.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_remote:
        Image|endswith:
          - '\psexec.exe'
          - '\psexec64.exe'
          - '\wmic.exe'
          - '\winrs.exe'
          - '\mstsc.exe'
          - '\sc.exe'
      condition: selection and selection_remote
    fields:
      - Image
      - CommandLine
      - User
- question: Has this host run the Get-LocalGroupMember enumeration pattern before?
  context: A pattern that has never been seen on a host is more notable than one that runs regularly.
    Zero or very low historical counts of this privileged-group enumeration indicate first-time or rare
    execution, while a steady history suggests recurring inventory or management tooling.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: 'Get-LocalGroupMember '
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive
    that activity, and does the current alert fit that pattern?
  context: Even routine enumeration can be abused. The query mirrors the rule's selection structure scoped
    to this host, so the resulting parent and user distribution reflects how this specific privileged-group
    enumeration has historically run here. A new parent process, an unexpected user account, or an unusual
    command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cmdlet:
        CommandLine|contains: 'Get-LocalGroupMember '
      selection_group:
        CommandLine|contains:
        - domain admins
        - ' administrator'
        - ' administrateur'
        - enterprise admins
        - Exchange Trusted Subsystem
        - Remote Desktop Users
        - "Utilisateurs du Bureau \xE0 distance"
        - Usuarios de escritorio remoto
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host
    distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of this privileged-group enumeration pattern. Many hosts firing the same pattern
    points to scripted deployment or inventory automation; one host or a small unrelated set points to
    manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cmdlet:
        CommandLine|contains: 'Get-LocalGroupMember '
      selection_group:
        CommandLine|contains:
        - domain admins
        - ' administrator'
        - ' administrateur'
        - enterprise admins
        - Exchange Trusted Subsystem
        - Remote Desktop Users
        - "Utilisateurs du Bureau \xE0 distance"
        - Usuarios de escritorio remoto
      condition: all of selection_*
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led to the
    enumeration and what followed it, and whether it is part of a larger sequence. Look for privilege
    escalation attempts, credential access, or persistence mechanisms near the enumeration.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - defense tampering, other reconnaissance, credential
    access - may reveal the stages that preceded this enumeration and help reconstruct the timeline.
    Reconnaissance frequently sits in the middle of a chain, so prior alerts often explain how the
    operator reached this point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
