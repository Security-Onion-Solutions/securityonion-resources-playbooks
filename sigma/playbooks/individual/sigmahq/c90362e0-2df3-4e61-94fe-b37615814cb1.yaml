name: Potential Persistence Via Netsh Helper DLL - Registry
id: 6c8d5793-d723-44f7-adcf-dc0abf78c033
description: |
  Detects a new DLL value being written under the NetSh registry key (HKLM\SOFTWARE\Microsoft\NetSh), where Windows loads registered helper DLLs every time netsh.exe runs. The rule fires when a registry value whose data ends in .dll is set under that key AND the write is not one of the known operating-system helpers added by poqexec.exe (ipmontr.dll, iasmontr.dll, ippromon.dll). Registering a malicious helper DLL grants persistence and code execution because the DLL's InitHelperDll export runs in netsh's context on the next invocation, so the investigation should identify the DLL, confirm whether it exists on disk, and determine whether netsh subsequently loaded it or spawned child processes.
type: detection
detection_id: c90362e0-2df3-4e61-94fe-b37615814cb1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Do the modified NetSh registry key and its DLL value data match what this rule detects?
  context: Confirm the alert is a true positive before investing time. The rule fires when a value under \SOFTWARE\Microsoft\NetSh is set to data ending in .dll AND the write is not one of the operating-system helpers added by poqexec.exe (ipmontr.dll, iasmontr.dll, ippromon.dll). Review the exact key path (TargetObject), the value data (Details), and the writing process to verify both conditions hold.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to register a NetSh helper DLL?
  context: Registering a netsh helper is an uncommon administrative action. Knowing whether the account and host function fit the change is often the fastest way to separate a true positive from routine maintenance. The writing identity may be SYSTEM or a machine account for service-driven writes rather than an interactive administrator; when User is absent or a machine account, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What NetSh helper DLL was registered, and is this a known persistence location?
  context: The NetSh helper key loads every registered DLL into netsh.exe whenever netsh runs, which makes it a persistence and code-execution location rather than a routine configuration key. Read the value data (Details) for the DLL name or path and the writing process (Image) to judge whether the entry is a legitimate helper or an attacker-registered one.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What DLL path was written to the NetSh helper value, and does it point to a user-writable or otherwise unusual location?
  context: The Details field holds the helper DLL path that netsh will load. Legitimate helpers resolve to System32 (ipmontr.dll, iasmontr.dll, ippromon.dll and similar). A path in a user-writable directory such as a user profile, AppData, ProgramData, or Temp is a strong sign of an attacker-registered helper. Decode the value for the full path and file name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Does the NetSh helper registration persist, and has this key been re-modified since the alert?
  context: Registry key and value deletions are not observable in endpoint telemetry, so persistence cannot be judged by watching for a removal. Instead read the key's re-modification history over the following hours and days, note whether the DLL value was overwritten or replaced, and confirm from later evidence whether the configured payload executed. A value that remains in place and whose DLL later loads into netsh indicates active persistence.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: After the helper was registered, did netsh.exe run and load the registered DLL?
  context: A registered helper DLL loads into netsh.exe every time netsh runs, and its InitHelperDll export executes in netsh's context. Look through the modules netsh loaded for the registered DLL path, and treat an unsigned DLL or one loaded from a user-writable directory as the persistence firing. If netsh has not run since the registration, the payload has not yet executed but remains staged.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\netsh.exe'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- question: After the helper was registered, did netsh.exe spawn any child processes?
  context: netsh normally spawns no child processes. A malicious helper DLL commonly launches an interpreter such as cmd.exe or powershell.exe, or a decoy like calc.exe, from within netsh, or injects shellcode into another process. Any child of netsh.exe here is anomalous and identifies what the persistence executed; an enterprise whitelist of expected netsh children is normally empty.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\netsh.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is the registered helper DLL present on disk?
  context: The persistence only executes if the DLL exists at the registered path, so confirming the file was written determines whether the mechanism is armed and what it would load. Correlate file activity by the registering process and its children to find the DLL drop, which usually lands in the same session as the registry write. The file-write event carries no hash; if the DLL is present, hash it from a later execution or retrieve it for a reputation lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process registered the NetSh helper, and what launched that process?
  context: The registration is typically performed by netsh add helper or by reg.exe writing the key directly. Tracing the writing process back to its own parent reveals whether the chain is legitimate (an administrator in an interactive shell) or suspicious (a script host, Office application, or an unexpected parent driving the change).
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other registry modifications occurred on this host in the same session?
  context: Actors who register a netsh helper often make additional registry changes at the same time -- for example, adding a Run key pointing to netsh so the helper auto-runs at logon, or disabling a security control. All registry modifications on the host in the window, grouped by key path and writing process, reveal whether persistence, tampering, and configuration changes landed together.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Was this NetSh helper registration part of an approved change or deployment?
  context: Persistence and network-configuration changes are commonly gated by change control. A corresponding ticket or documented deployment suggests authorized activity; absence of one when policy requires it points toward an unauthorized change and raises the priority of the finding.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Has the NetSh helper key been modified before on this host?
  context: A first-time modification to this key is more suspicious than a recurring one. Some software and operating-system components register helpers routinely, so a long history of the same value being set is easier to explain than a value that appears for the first time. Compare the Details values across the history to see whether this DLL is new to the host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What other process activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Process activity in the minutes around the registration reveals what led to it and what followed -- reconnaissance, privilege escalation, or additional persistence. Aggregating by process and parent collapses routine agent noise into high-count rows while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- defense tampering, reconnaissance, or credential access -- may reveal the stages that preceded the persistence attempt and help reconstruct the timeline. The sequence of alerts on a host often tells the fuller story of what the activity is part of.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host?
  context: Attackers rarely rely on a single foothold. After registering the netsh helper, they commonly add backup mechanisms with different techniques -- scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions. Multiple persistence installations in the same timeframe indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations such as Startup folders or scheduled-task definition paths on this host?
  context: File-based persistence bypasses command-line detection entirely. Dropping an executable or script into a Startup folder or a path referenced by a registry Run key achieves persistence without running schtasks, sc, or reg. File-event monitoring captures these drops even when the actor avoids standard persistence tooling.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Was the NetSh helper key modified on other hosts in the environment?
  context: The same modification across many hosts may indicate a group-policy push or a software deployment adding a legitimate helper. A modification confined to this one host is more consistent with a targeted persistence attempt. Compare the Details values across hosts to see whether the same DLL is being registered everywhere or only here.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
