name: PUA - Mouse Lock Execution
id: c4b9d13b-4d2c-4d10-a7a2-bed4b337386c
description: |
  Detects execution of the "Mouse Lock" utility, identified by its Product name ("Mouse Lock"),
  Company string ("Misc314"), or a command line containing "Mouse Lock_". The tool locks the screen
  behind a password prompt and records attempted passwords, which places it in the credential-access
  and collection space (GUI input capture) even though it is marketed as a benign desktop utility.
  Legitimate use is possible, but the saved-password behaviour means an operator can use it to capture
  whatever a user types at the lock prompt. Determine who ran it, under what parent and account, whether
  this host or user has run it before, and what activity surrounded it.
type: detection
detection_id: c9192ad9-75e5-43eb-8647-82a0a5b493e3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- question: Does this process match the Mouse Lock signature the rule detects?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires on
    a Product string containing "Mouse Lock", a Company string containing "Misc314", or a command line
    containing "Mouse Lock_". Review the event's Product, Company, and CommandLine fields against those
    criteria.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - Company
      - Product
- question: Is this user and host expected to run a screen-lock or password-prompt utility like Mouse Lock?
  context: Legitimate desktop activity can trigger this detection if a user installed Mouse Lock themselves.
    Knowing whether the user role and host function are consistent with running a third-party screen-lock
    tool is often the fastest path to distinguishing personal use from operator-deployed capture.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What credential input did Mouse Lock prompt for or capture, and where are attempted passwords stored?
  context: Mouse Lock presents a lock-screen password dialog and saves attempted passwords, so the captured
    input is the user's lock password and any guesses an operator entered. Decode the command line for the
    "Mouse Lock_" arguments and identify the configured save location for attempted passwords, because that
    file is the credential-capture artifact for this technique.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned Mouse Lock and is that parent chain expected?
  context: The parent process reveals how the tool was launched. A user double-clicking from explorer.exe
    is consistent with personal use; a launch from a scripting host, a remote-access tool, or an unexpected
    automation parent points to operator deployment for input capture.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Has this host run the Mouse Lock pattern before?
  context: A pattern that has never been seen on a host is more suspicious than one that runs regularly.
    Zero or very low historical counts indicate first-time or rare execution. The query scopes to the
    rule's "Mouse Lock_" command-line pattern rather than a binary name, since the rule has no Image field.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: 'Mouse Lock_'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the Mouse Lock pattern, what parents and users normally
    drive that activity, and does the current alert fit that pattern?
  context: Even a benign-looking utility can be abused. The query mirrors the rule's selection structure
    scoped to this host, so the resulting parent/user distribution reflects how the rule's specific firing
    pattern has historically run here. A new parent process, an unexpected user account, or an unusual
    command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
      - Product|contains: Mouse Lock
      - Company|contains: Misc314
      - CommandLine|contains: Mouse Lock_
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did Mouse Lock spawn afterward?
  context: The processes spawned by the tool reveal its actual impact. A screen-lock utility has few
    expected children; spawning cmd.exe, powershell.exe, or file-copy tools afterward suggests the
    execution was a foothold for further action rather than a simple desktop lock.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Have other hosts fired the Mouse Lock pattern in the past week, and does the cross-host
    distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of the rule's firing pattern. Many hosts firing the same pattern points to scripted
    deployment or a software-distribution rollout; one host or a small unrelated set points to manual
    operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
      - Product|contains: Mouse Lock
      - Company|contains: Misc314
      - CommandLine|contains: Mouse Lock_
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
      - Product|contains: Mouse Lock
      - Company|contains: Misc314
      - CommandLine|contains: Mouse Lock_
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
      - Product|contains: Mouse Lock
      - Company|contains: Misc314
      - CommandLine|contains: Mouse Lock_
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning
    multiple endpoints. If the same user triggered similar activity on several hosts, the scope of the
    incident may be larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
      - Product|contains: Mouse Lock
      - Company|contains: Misc314
      - CommandLine|contains: Mouse Lock_
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate
    context: what led to this event, what happened after, and whether it is part of a larger sequence.
    Look for reconnaissance, credential access, or staging that surrounds the Mouse Lock execution.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host - defense tampering,
    reconnaissance, credential access - may reveal the stages that preceded this event and help
    reconstruct the timeline around the input-capture activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Which accounts may be exposed by captured input, and do any have elevated privileges?
  context: The severity of credential capture depends on whose password could have been recorded. The
    account that unlocks at this host's lock prompt - and any privileged account a user might type while
    the tool is running - determines remediation. A standard user may only need a password reset; a domain
    admin or service account requires escalation. Cross-reference the user with directory group memberships.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
