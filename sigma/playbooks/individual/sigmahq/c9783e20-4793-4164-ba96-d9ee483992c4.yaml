name: Logged-On User Password Change Via Ksetup.EXE
id: 470d7bf5-a071-4b92-83a3-73f9bdf34c70
description: |
  Detects ksetup.exe invoked with the /ChangePassword subcommand, which uses the kpasswd protocol (RFC 3244) to change the currently logged-on user's password from the command line. The rule fires only when both conditions hold: the binary is ksetup.exe (by Image name or OriginalFileName) and the command line contains ' /ChangePassword '. ksetup.exe is a Microsoft-signed Windows-shipped Kerberos configuration tool, so detection is purely command-line based; changing a password through this path rather than the normal interactive or directory channels is unusual, and the investigation should establish who ran it, under what identity, how it was launched, and whether the password change fits sanctioned administrative activity.
type: detection
detection_id: c9783e20-4793-4164-ba96-d9ee483992c4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line show ksetup.exe running with the /ChangePassword subcommand?
  context: >-
    Confirm the alert is a true positive by reviewing the exact command line against the rule's criteria, which fire only when both conditions hold: the binary is ksetup.exe (by Image name or OriginalFileName) and the command line contains ' /ChangePassword '. Read the full statement to see whether old and new passwords were supplied inline and which account the change targeted.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to change account passwords using command-line Kerberos tooling?
  context: >-
    Most users change passwords through the interactive logon screen or self-service directory channels, not through ksetup.exe. A command-line password change is more typical of administrators, scripted account maintenance, or non-Windows Kerberos realm configuration. A change run by an account with no such role, or from a host that is not an administration or realm-joined system, is the deviation worth chasing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this ksetup invocation do? Decode the full command line and identify which account the password change targeted.
  context: >-
    The full command line reveals the operational detail. Parse whether old and new passwords were passed inline, whether a /server or /domain qualifier directed the kpasswd request at a specific server or realm, and whether other ksetup subcommands ran on this host in the same window. Inline credentials in the command line are themselves a credential-exposure concern. The host-scoped window also catches related ksetup operations such as realm or KDC changes that may accompany the password change.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned ksetup, and is that parent chain expected for a command-line password change?
  context: >-
    The parent process reveals how the tool was invoked. A sanctioned change is typically launched from an interactive administrative shell (cmd.exe or powershell.exe under explorer.exe) or a known management script. Parents such as script hosts, remote-execution services, Office applications, or unexpected automation suggest the change was issued as part of a scripted or hands-on-keyboard operation rather than routine account maintenance.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Does this host normally run ksetup.exe?
  context: >-
    ksetup.exe ships with every modern Windows but is rarely run interactively; its appearance on a host is itself worth noting, and a /ChangePassword invocation more so. Zero or very low historical counts indicate first-time or rare execution, which raises the bar for treating this as routine maintenance. Calibrate against which hosts in this environment legitimately perform Kerberos realm configuration or scripted account management.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \ksetup.exe
      - OriginalFileName: ksetup.exe
      selection_cli:
        CommandLine|contains: ' /ChangePassword '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \ksetup.exe
      - OriginalFileName: ksetup.exe
      selection_cli:
        CommandLine|contains: ' /ChangePassword '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether this password change is isolated or part of broader movement. If the same user triggered related credential or administrative activity on multiple endpoints in the same window, the scope of the operation may be larger than a single change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \ksetup.exe
      - OriginalFileName: ksetup.exe
      selection_cli:
        CommandLine|contains: ' /ChangePassword '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What did this user do next on this host?
  context: >-
    Follow-on activity reveals the next steps after the password change. Look for privilege escalation, persistence installation, credential dumping, or lateral movement attempts by the same user on this host, which would frame the change within a larger operation rather than a standalone maintenance action.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other launches of ksetup on this host followed in the next four hours, and does the parent or command-line structure change?
  context: >-
    Under a service or computer account, asking what the user did next is unbounded. A more focused follow-on is to track repeat invocations of ksetup.exe on the same host: routine scheduled maintenance repeats with stable parents and command-line structures, while a deviation in parent or command-line in the follow-on window is the signal worth chasing.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ParentImage
      - CommandLine
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining process activity around the alert reveals what led to this event and what happened after. Look for reconnaissance, credential access, or additional Kerberos or account tooling that frames the password change within a larger sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Are there alerts for this user on other hosts in the past day?
  context: >-
    If the same user triggered alerts on multiple hosts, the activity may extend beyond a single endpoint. Check for lateral movement patterns or credential abuse across the environment. If the user identity is not populated in alert data, fall back to pivoting on process activity scoped by the same account.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        user.name|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
- question: Did this same rule fire on other hosts in the past day, and does the cross-host pattern look like coordinated automation or an isolated detection?
  context: >-
    Under a service or computer account, asking about alerts for this user across hosts is meaningless because the identity is omnipresent. The triage-useful question is whether this rule itself fires on multiple hosts: a rule firing across many hosts on the same day is more likely tracking scheduled or pushed automation, while a rule firing on one host alone is the deviation worth chasing.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the stages that preceded the password change and help reconstruct the timeline. The sequence of alerts often tells whether this change is opportunistic or a planned step of a multi-stage operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
