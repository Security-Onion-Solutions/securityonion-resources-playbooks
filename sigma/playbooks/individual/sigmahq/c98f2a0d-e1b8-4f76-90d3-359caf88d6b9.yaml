name: Potential Defense Evasion Activity Via Emoji Usage In CommandLine - 2
id: 24de1870-7c40-414f-b806-d6d88d542ebf
description: |
  Detects a process_creation event whose command line contains one of a large list of emoji
  characters. Emoji are valid characters in a command line, but they carry no operational meaning
  for the interpreter, so their presence usually means the command was constructed by something
  other than a person typing a normal command: an obfuscator that uses emoji as variable names or
  substitution tokens, a payload that embeds data in non-ASCII characters, or a generator that
  pads arguments to defeat literal string matching. Benign sources exist — chat clients, localized
  installers, test data, and scripts that print status characters all put emoji on a command line.
  The investigation should establish what the command actually does once the emoji are accounted
  for, whether the parent chain explains how such a command line was assembled, and whether the
  same command line or the same actor appears elsewhere in the environment.
type: detection
detection_id: c98f2a0d-e1b8-4f76-90d3-359caf88d6b9
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the alerting command line actually contain one of the emoji characters this rule looks for?
  context: >-
    The rule fires on a single condition — a process_creation event whose CommandLine contains any
    one of the listed emoji characters. Read the raw command line and confirm an emoji is present
    in the argument text itself rather than in a rendered field or a truncated display. If no emoji
    is visible in the raw value, the match is an artifact of encoding or field handling rather than
    the behavior the rule targets.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run commands that carry emoji characters?
  context: >-
    Some software puts emoji on a command line as a matter of course — messaging clients, localized
    installers, build and test tooling, and scripts that emit status characters. Establishing whether
    this host runs that class of software, and whether this user works with it, is usually the fastest
    way to separate routine output from a command line that was deliberately built with non-ASCII
    padding.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What does the command actually do once the emoji characters are accounted for?
  context: >-
    Strip or set aside the emoji and read the remaining command as the interpreter would. Emoji
    commonly appear as variable or function names in obfuscated scripts, as delimiters splitting a
    payload into fragments that are concatenated at runtime, or as filler inserted between real
    tokens to break literal matching. Identify the binary being driven, the flags, any encoded or
    concatenated content, and any file path or network destination that the command resolves to.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - Image
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned this command, and is that parent chain expected?
  context: >-
    The parent reveals how the command line was assembled. A shell or script host launched from
    explorer.exe is consistent with a person or an interactive script; a parent such as an Office
    application, a mail client, an archive utility, or a script host running from a temporary
    directory points to the command line arriving from outside the host. Read the parent's own
    command line for the generator that produced the emoji-bearing arguments.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What else did the same parent launch around this time?
  context: >-
    A generator that emits one obfuscated command line usually emits several. Listing every child of
    the same parent in the surrounding window shows whether this execution stands alone or is one
    step in a sequence the parent drove, and whether the sibling commands carry the same construction
    style as the alerting one.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What child processes did the alerting process spawn afterward?
  context: >-
    The children reveal what the command achieved. Obfuscation is a wrapper around an action, not the
    action itself — the payload usually surfaces as a script host, a download utility, an archive
    tool, or a second interpreter started by the alerting process. An obfuscated command line that
    spawns nothing is a different finding from one that starts a downloader.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Did the alerting process make any network connections?
  context: >-
    Non-ASCII padding is frequently applied to commands that retrieve a second stage or contact a
    controller, and the destination is often the part being hidden from literal matching. Connections
    made by the alerting process itself tie the command line to an external endpoint that can be
    checked against the destinations the host normally uses.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
- question: Did the alerting process write any files to disk?
  context: >-
    A command whose arguments are obfuscated often ends in a written artifact — a decoded script, an
    archive, a dropped executable, or a staging file in a user-writable directory. The written paths
    name the artifact to collect and give a second anchor for the investigation when the command line
    itself is unreadable.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetFilename
  answer_sources:
  - file_event
- question: Does this host normally run this binary at all?
  context: >-
    Historical frequency of the alerting binary on this host separates a tool that runs here every
    day from one that appeared for the first time today. A binary with a long, steady history under
    the same account points toward software that legitimately emits these characters; zero or very
    low counts make the execution itself the finding, independent of what the arguments contain.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: Has this exact command line run anywhere else in the environment?
  context: >-
    An identical command line appearing on many hosts is the signature of deployed software or a
    packaged script, and is normally explained by an inventory or deployment record. The same command
    line on a small number of unrelated hosts, or on one host only, points to something assembled for
    this environment rather than shipped into it. This matches the command line exactly, so a
    generator that varies its padding per execution will return only the alerting event.
  range: -30d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|expand: '%CommandLine%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating every process and its parent in the surrounding window collapses routine agent and
    service telemetry into a few high-count rows while novel parent-child pairs stand out at low
    counts. Those low-count pairs are where reconnaissance, credential access, or persistence steps
    around this execution become visible.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Obfuscated command lines tend to sit in the middle of a sequence rather than at its start.
    Earlier detections on the same host — defense tampering, reconnaissance, or credential access —
    help place this execution in the timeline and often identify the delivery step that preceded it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: What else did this user do across the environment around this time?
  context: >-
    Tracking the account across all hosts in the surrounding hour shows whether the activity is
    confined to this endpoint or the same account is driving execution elsewhere. If the alert fired
    under a machine or service principal, this returns broad automation telemetry rather than the
    actions of a person, and the parent-driven view of the same window is the meaningful answer.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did the same parent and binary pairing run on other hosts in this window?
  context: >-
    This pivots on the launching mechanism rather than the account, which is the attribution that
    survives when the alert fires under a machine or service principal. The same parent driving the
    same binary across several hosts in one window is the signature of a deployment or scheduled
    job; the pairing occurring only here points to something local to this endpoint.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
  answer_sources:
  - process_creation
- question: Has this detection fired on other hosts recently?
  context: >-
    Counting this rule's own recent firings across the environment distinguishes a persistent
    background source — one application or script that routinely emits these characters, which can be
    identified once and tuned — from an isolated occurrence on a single host. A first-of-its-kind
    firing carries different weight than one of hundreds.
  range: -30d
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule.uuid%'
      condition: selection
    fields:
      - host.name
      - rule.name
  answer_sources:
  - alert
