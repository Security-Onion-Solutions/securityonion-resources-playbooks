name: Potential KamiKakaBot Activity - Winlogon Shell Persistence
id: 6621a58c-3f60-4a11-abee-ed3876cb4100
description: |
  Detects modification of the Winlogon Shell registry value (a TargetObject ending in \Microsoft\Windows NT\CurrentVersion\Winlogon\Shell) where the value data carries a hidden-window PowerShell payload, combining -nop -w h, $env, explorer.exe, and Start-Process in one string. The Shell value normally holds only explorer.exe; anything appended after it is executed at every interactive logon, a persistence method KamiKakaBot samples use to launch a hidden PowerShell that drives MSBuild against a decrypted payload. Investigation should confirm the value data, identify the process that wrote the key, determine whether the referenced payload ran at logon and remains on disk, and check for co-installed persistence.
type: detection
detection_id: c9b86500-1ec2-4de6-9120-d744c8fb5caf
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Do the Winlogon Shell registry value and its data match what this rule detects?
  context: >-
    Confirm the alert is a true positive by reviewing the exact key path (a TargetObject ending in \Microsoft\Windows NT\CurrentVersion\Winlogon\Shell) and the value data (Details), which must contain all of -nop -w h, $env, explorer.exe, and Start-Process together. The Shell value normally holds only explorer.exe; the appended command string is the malicious element that runs at logon.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify the Winlogon Shell registry value?
  context: >-
    The Winlogon Shell value is set once at OS install and effectively never changes during normal operation, so almost any modification is unexpected regardless of who made it. Confirm whether the writing process and account match a known deployment or imaging activity; a user logon session or a masqueraded document-handler writing this value points to malware rather than administration. User attribution is present on most endpoint registry events, but when it is a machine account or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What started the process that wrote this value, and is that chain expected?
  context: >-
    The process that set the Shell value and its own parent reveal how the write happened. A legitimate imaging or install tool has a predictable chain; a masqueraded office application (for example a renamed WinWord.exe side-loading a malicious DLL from its working directory) or a script host writing this key indicates the persistence was planted by malware. Trace the writing process back to what launched it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because this event type does not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is the Winlogon Shell value a known persistence location, and what does the writing process indicate?
  context: >-
    The Shell value under \Microsoft\Windows NT\CurrentVersion\Winlogon executes whatever string it holds at each interactive logon, making it a well-known autostart persistence location. Its expected content is exactly explorer.exe; any additional command appended after explorer.exe is executed alongside the shell. Confirm the location and note which process wrote the value to judge whether this is a planted logon persistence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Decode the Shell value data — what command runs at logon and what does it do?
  context: >-
    Read the Details field and break down the appended command. The KamiKakaBot pattern sets the value to explorer.exe followed by explorer.exe /e,/root,<powershell> -nop -w h with a Start-Process call that references $env variables — a hidden-window (-w h), no-profile (-nop) PowerShell that resolves an environment-variable path (typically an MSBuild binary) and starts it against a dropped temp payload. Identify the resolved binary and any file path or argument the command targets; a referenced executable or script path becomes the next artifact to run down.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Did the hidden PowerShell payload configured in the Shell value execute at logon?
  context: >-
    Winlogon Shell persistence only fires when the affected user next logs on interactively, so the payload may run minutes, hours, or days after the registry write. Look for the configured hidden-window PowerShell launch (-nop -w h combined with Start-Process) executing on this host, which confirms the persistence became active. Absence so far does not clear the alert if no interactive logon has occurred since the write.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
          - '-nop -w h'
          - 'Start-Process'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Is the executable or script referenced by the Shell payload present on disk on this host?
  context: >-
    The persistence is only effective if the payload it launches exists. The decoded value resolves an environment-variable path (commonly an MSBuild binary) and points it at a dropped temp file; confirm whether the process that wrote the key, or its children, created that payload on disk in the same session. Reboot survival is a judgment call rather than an observable event here: correlate the dropped payload with the re-modification history of the Shell value. Registry and value deletions are not recorded by endpoint telemetry, so do not treat the absence of a delete event as proof of cleanup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Does the Shell value modification persist, or was it reverted and re-applied over time?
  context: >-
    Because endpoint telemetry emits no registry key or value deletion events, cleanup of this key cannot be observed directly; judge persistence from the value's re-modification history instead. Repeated writes that restore the malicious Shell string after something reset it, or a single write that remains unchanged, both indicate active persistence. Pair this with whether the configured payload executed to confirm the mechanism is live.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Has the Winlogon Shell value been modified before on this host?
  context: >-
    The Shell value should be written once at imaging and then remain static, so a rich modification history is unusual and a first-ever write is highly notable. Compare prior Details values against the current one: a key that has never changed before now carrying an appended PowerShell command is a strong signal of newly planted persistence.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What other registry modifications were made on this host in the same session?
  context: >-
    Malware establishing logon persistence often changes several keys together. Registry modifications from the same host and writing process within a short window around this write reveal the wider scope: additional autostart entries, security-setting changes, or configuration edits landing alongside the Shell modification point to a hands-on or installer-style implant rather than an isolated event.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Was the Winlogon Shell value modified on other hosts in the environment?
  context: >-
    The same Shell modification across multiple hosts distinguishes a widespread malware deployment or lateral movement from a single targeted host. Compare the Details values seen on each host: identical malicious payload strings across systems indicate a common infection vector, while a single affected host suggests targeted delivery.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    Attackers rarely rely on a single foothold. The KamiKakaBot pattern pairs Winlogon Shell persistence with a scheduled task created via schtasks, so look for other persistence tooling running in the same timeframe. Scheduled-task, service, or registry-tool executions clustered around this write indicate intentional stacking of persistence rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup folders or scheduled-task definition paths on this host?
  context: >-
    File-based persistence bypasses command-line detection entirely. Alongside the Shell value, the same session may have dropped an executable or script into a Startup folder or a path referenced by a Run key. File-event monitoring captures these drops even when standard persistence tools are avoided, revealing parallel autostart mechanisms.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    A logon-persistence write is usually one step in a delivery chain. Examining the processes running on this host in the minutes around the registry modification reveals what led to it (document handlers, DLL side-loading, script interpreters) and what followed. Novel parent-child pairs at low counts are what to scan for against the background of routine agent telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Persistence is typically planted after initial access and defense evasion. Earlier detections on the same host — document-borne execution, DLL side-loading, or defense tampering — help reconstruct how the payload arrived and place this Shell modification in the wider timeline of the intrusion.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
