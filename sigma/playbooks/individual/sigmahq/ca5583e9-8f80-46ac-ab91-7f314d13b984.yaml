name: Potentially Suspicious Child Process of KeyScrambler.exe
id: 9d2f7c4a-1b6e-4f53-9a8c-3e7d5b021f88
description: |
  Detects KeyScrambler.exe, an anti-keylogging utility, spawning a command interpreter
  or script host (cmd.exe, cscript.exe, mshta.exe, powershell.exe, pwsh.exe, regsvr32.exe,
  rundll32.exe, or wscript.exe). The rule fires only when the parent Image ends in
  KeyScrambler.exe AND the child resolves to one of those binaries by Image name or
  OriginalFileName. A signed third-party security tool has no routine reason to launch
  these interpreters; the pattern is consistent with hijacking the application's execution
  flow — a DLL search-order hijack against KeyScrambler.exe (T1574.001) or exploitation of
  the running application (T1203) — to obtain execution under a trusted process. The
  investigation should confirm the parent-child pair, decode what the child ran, and
  determine whether a planted module or dropped file set up the abuse.
type: detection
detection_id: ca5583e9-8f80-46ac-ab91-7f314d13b984
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- question: Does the alert match the rule — KeyScrambler.exe as the parent spawning cmd, cscript, mshta, powershell, pwsh, regsvr32, rundll32, or wscript as the child?
  context: Before investing investigation time, confirm both halves of the detection. The
    ParentImage must end in KeyScrambler.exe and the child must resolve to one of the listed
    interpreters by Image name or OriginalFileName. Confirming the OriginalFileName matters
    because a renamed binary still trips the rule on its embedded original name; check that
    field against the on-disk Image to spot a masqueraded interpreter.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - OriginalFileName
- question: Is this user and host expected to run KeyScrambler, and would it ever launch a command interpreter?
  context: KeyScrambler is an endpoint anti-keylogging tool, so its presence on a host is
    not itself unusual; what is unusual is the tool spawning an interpreter. Knowing whether
    the user routinely runs scripting tools and whether the host's function involves
    administrative automation helps separate a misconfiguration or installer behavior from
    hijacked execution flow.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is KeyScrambler.exe expected to spawn this child, and what started KeyScrambler.exe itself?
  context: The parent-child relationship is the core signal for this detection. KeyScrambler
    normally runs as a tray utility and does not launch interpreters. Tracing what started
    KeyScrambler.exe — a logon-time autostart, an installer, or another process — shows
    whether the execution chain reflects normal tool startup or an external process driving
    the trusted binary to spawn the detected child.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did this same KeyScrambler.exe instance spawn?
  context: If this KeyScrambler.exe instance launched the detected interpreter, it may have
    launched others. Several interpreters or tools spawned from the same parent instance in
    a short window points to deliberate orchestration — staged reconnaissance, download, or
    persistence — rather than a single isolated event.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What exactly did the spawned interpreter do? Decode its full command line and working directory.
  context: The child's command line reveals the operational intent. Decode any flags, encoded
    blocks, file paths, or URLs. cmd.exe and powershell.exe are common enough that a
    host-and-binary view can be noisy; narrow on the command-line pattern of interest when
    the result is broad. For regsvr32, rundll32, mshta, and the script hosts, the argument
    is usually the script, DLL, scriptlet, or COM object being executed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: If the child was powershell.exe or pwsh.exe, was the command encoded or obfuscated, and what does it decode to?
  context: When the spawned interpreter is PowerShell, attackers frequently use -EncodedCommand
    (-enc), string concatenation, backtick escaping, or variable substitution to hide intent.
    Base64-encoded commands are the most common form; decoding reveals download cradles,
    reverse shells, or in-memory .NET assembly loads. For a non-PowerShell child this question
    does not apply.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What DLLs did KeyScrambler.exe load, and were any unsigned or loaded from a user-writable or non-standard path?
  context: A common way a signed tool ends up spawning interpreters is a DLL search-order
    hijack — a planted DLL placed beside or ahead of the legitimate one runs the operator's
    code inside the trusted process. Reviewing the modules KeyScrambler.exe loaded
    distinguishes a clean install directory from a side-loaded attacker DLL. A module under a
    user-writable path, or an unsigned module loaded by KeyScrambler.exe, is the artifact of
    the hijack that explains the suspicious child.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \KeyScrambler.exe
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- question: Did KeyScrambler.exe crash or exit abnormally on this host shortly before the child was spawned?
  context: Exploitation of a client application often shows as an application-error or
    abnormal-exit event for the targeted process immediately before unexpected child
    execution. An application crash logged for KeyScrambler.exe in the minutes around the
    alert supports memory-corruption exploitation of the running tool rather than a benign
    configuration that launched the interpreter. Absence of a crash points toward
    execution-flow hijack (a planted module or redirected path) instead.
  range: -15m
  query: |
    aggregation: false
    logsource:
      service: application
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Provider_Name: Application Error
      filter:
        Data|contains: KeyScrambler
      condition: selection and filter
    fields:
      - Provider_Name
      - Data
- question: Were files written to user-writable paths around the time of the alert that the spawned interpreter then used?
  context: Client-execution exploitation commonly drops or stages a payload in a user-writable
    location — Downloads, %TEMP%, %APPDATA%, OneDrive, or an application startup folder —
    before the interpreter runs it. Correlating file writes in those paths with the alert
    window reveals the staged script, DLL, or scriptlet behind a regsvr32, rundll32, mshta, or
    script-host invocation, and gives a concrete artifact to hash and hunt for elsewhere.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - \Downloads\
          - \AppData\Local\Temp\
          - \AppData\Roaming\
          - \OneDrive\
          - \Start Menu\Programs\Startup\
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did the spawned interpreter or KeyScrambler.exe establish outbound network connections shortly after the alert?
  context: Exploitation and hijacked execution are frequently followed by outbound
    command-and-control or payload-retrieval traffic from the interpreter the tool spawned.
    Connections initiated by the child binary in the window after the alert, especially to
    external addresses outside known update or CDN ranges, indicate the execution reached a
    network stage. Use the connecting process and destination to pivot to perimeter logs and
    block the endpoint.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        Image|endswith:
          - \cmd.exe
          - \cscript.exe
          - \mshta.exe
          - \powershell.exe
          - \pwsh.exe
          - \regsvr32.exe
          - \rundll32.exe
          - \wscript.exe
          - \KeyScrambler.exe
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
- question: Is the same KeyScrambler.exe-to-interpreter spawning pattern occurring on other hosts?
  context: The same trusted-tool-to-interpreter pair appearing on multiple hosts may indicate
    a shared planted DLL distributed with a software package or a coordinated push, while a
    single occurrence is more likely targeted or a one-off misconfiguration. Enterprise-wide
    comparison helps calibrate scope and identify other affected endpoints.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \KeyScrambler.exe
      selection_binaries:
      - Image|endswith:
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
      - OriginalFileName:
        - Cmd.Exe
        - cscript.exe
        - mshta.exe
        - PowerShell.EXE
        - pwsh.dll
        - regsvr32.exe
        - RUNDLL32.EXE
        - wscript.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \KeyScrambler.exe
      selection_binaries:
      - Image|endswith:
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
      - OriginalFileName:
        - Cmd.Exe
        - cscript.exe
        - mshta.exe
        - PowerShell.EXE
        - pwsh.dll
        - regsvr32.exe
        - RUNDLL32.EXE
        - wscript.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around this time?
  context: Tracking the account's activity across all hosts in the surrounding window reveals
    lateral movement or coordinated activity on multiple endpoints. If the same user triggered
    similar interpreter activity elsewhere, the scope is larger than this one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \KeyScrambler.exe
      selection_binaries:
      - Image|endswith:
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
      - OriginalFileName:
        - Cmd.Exe
        - cscript.exe
        - mshta.exe
        - PowerShell.EXE
        - pwsh.dll
        - regsvr32.exe
        - RUNDLL32.EXE
        - wscript.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Does this host normally run this interpreter?
  context: An interpreter that has rarely or never executed on a host is more suspicious than
    one that runs regularly. cmd.exe and powershell.exe are common on most hosts, but the
    historical count still helps; for the rarer children — mshta.exe, cscript.exe, wscript.exe
    — zero or very low counts indicate first-time or unusual execution worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Surveying activity around the alert reveals what
    led to the execution and what followed — reconnaissance, persistence, or further tool use.
    Aggregating by process and parent collapses repetitive agent telemetry into high-count
    rows while novel parent-child pairs stand out at low counts, which is what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
