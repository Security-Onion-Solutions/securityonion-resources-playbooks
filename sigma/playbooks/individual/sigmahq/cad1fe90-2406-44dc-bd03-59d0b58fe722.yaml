name: HackTool - NPPSpy Hacktool Usage
id: 62ca18c8-73d0-4e9d-8418-d43860e01481
description: |
  Detects NPPSpy, a credential-capture tool that registers a malicious Windows network provider so the operating
  system hands it each user's cleartext password during logon, then writes those passwords to a local file. The rule
  fires when NPPSpy's artifacts appear on disk: its provider DLL (NPPSpy.dll) or its output file (NPPSpy.txt). The DLL
  indicates the tool was staged; the .txt output means credentials were actually captured in cleartext. Because the
  capture happens at the logon-provider layer, every account that logged in after the provider was registered is
  exposed. Determine whether an authorized engagement explains it, which accounts appear in the output, how the
  provider was registered, and how far the artifacts spread.
type: detection
detection_id: cad1fe90-2406-44dc-bd03-59d0b58fe722
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the file name and creating process match an NPPSpy artifact?
  context: >-
    Confirm the alert is a true positive by reviewing the exact file name, the operation performed
    (created/renamed/deleted), and the writing process. The rule matches NPPSpy's own names — the provider DLL
    (NPPSpy.dll) and the capture-output file (NPPSpy.txt). Which name fired determines whether the tool was merely
    staged or has already written captured passwords to disk.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to register a network provider or run a credential-capture tool?
  context: >-
    Registering a network provider DLL and harvesting logon passwords to a text file has no legitimate purpose outside
    sanctioned security testing. Knowing whether the user role and host function fit that activity is the fastest way
    to separate an authorized assessment from an intrusion. When the writing account is a machine or service account,
    judge by the writing process and host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this NPPSpy execution part of an authorized penetration test or red team engagement?
  context: >-
    Credential-capture tools are used in authorized internal assessments to demonstrate logon-password exposure.
    Before investing analysis time, check whether a pentest or red team exercise is active on this host or network
    segment. An authorized engagement with matching tooling, host, and timing resolves the alert; absence of one on a
    production host makes a captured-password file a live credential-access incident.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Was the malicious network provider registered and the NPPSpy DLL staged on this host?
  context: >-
    NPPSpy works by adding itself to the network provider order and pointing a provider entry at NPPSpy.dll, so the
    logon flow forwards each password to it. Confirm whether the provider registration and DLL staging happened here —
    the setup is what turns a dropped file into an active capture. Look for the provider-order change and the DLL write
    in the process activity around the alert.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What does the artifact contain — captured cleartext passwords, or the genuine provider DLL?
  context: >-
    For NPPSpy.txt, read the contents directly: it lists captured logon credentials as account and cleartext-password
    entries, one per user who logged in after the provider was registered. For NPPSpy.dll, confirm it is the genuine
    tool rather than a look-alike by checking size, signing status, and characteristic strings. The .txt contents are
    the definitive proof of what was harvested.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If NPPSpy.dll loaded into the logon flow, what is its hash and does it have known threat-intel detections?
  context: >-
    A DLL's hash is recorded when it is loaded. Because NPPSpy registers as a network provider, the DLL is loaded by
    the logon-provider host during authentication; this query looks for that load and reads the hash and signature so
    it can be submitted to reputation and threat-intel services. If only the .txt output is present and no DLL load
    appears, retrieve the on-disk DLL from its provider path for manual hashing.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith: '\NPPSpy.dll'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Hashes
- question: What credentials were captured — which accounts and logon types appear in the output?
  context: >-
    NPPSpy captures credentials at the network-provider layer, so it collects the cleartext password of every account
    that authenticates while it is registered — interactive, remote, and service logons alike. Identify every account
    in NPPSpy.txt; each is exposed in cleartext and should be treated as compromised and reset. Note the logon types
    to gauge whether privileged or service accounts were among those captured.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which of the captured accounts have elevated or service privileges?
  context: >-
    The severity of this capture depends on which accounts logged in while NPPSpy was active. A domain administrator,
    service account, or backup operator captured in cleartext requires incident escalation and immediate reset; a
    single standard user is lower-urgency but still exposed. Cross-reference the captured account list against
    directory group memberships to prioritize resets.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Are NPPSpy's other artifacts present on this host — the DLL, the output file, and the provider registration?
  context: >-
    NPPSpy leaves a consistent footprint: the provider DLL, the NPPSpy.txt output, and a network-provider registration
    under the services and NetworkProvider order keys. Enumerate the files created around the alert to confirm the full
    set and gauge how long the tool was active. The registry provider-order entry is what keeps the capture running
    across reboots and should be checked and removed as part of remediation.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    The full breadth of the writing process's file activity, and that of its direct children, enumerates what else was
    produced or staged alongside the captured-password file. Because NPPSpy.txt is written by the logon-provider host
    rather than the operator's tool, weigh the results by which paths and file types are unusual for that process
    rather than by volume alone.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after this event?
  context: >-
    Captured cleartext passwords are typically reused to move laterally. This query returns outbound connections from
    this host to remote-access ports — 3389 (RDP), 445 (SMB), 5985/5986 (WinRM), 22 (SSH) — in the hours after the
    capture, with the originating process and account. Credentials replayed from a different machine will not appear
    here, so also review logons for the captured accounts on their likely targets. If host network telemetry is not
    collected, treat zero rows as a visibility gap rather than evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Are NPPSpy artifacts present on any other hosts in the environment?
  context: >-
    The same tool file names on multiple hosts point to a broader operation or deliberate distribution across capture
    points; a single host points to a targeted or host-local run. Because the provider must be registered on each host
    to capture there, artifacts on several hosts mean multiple capture points and a wider set of exposed accounts.
    Compare the writing process and timeline across hosts to reconstruct how it spread.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- always_include: true
  question: Has this user previously produced NPPSpy artifacts, and does that history fit their role?
  context: >-
    The query mirrors the rule's file-name pattern scoped to this user, returning their 90-day history of producing
    NPPSpy artifacts (not generic file activity), aggregated by host. A user who has never produced this pattern is
    more suspicious than one who does so regularly as part of a sanctioned testing role. Weigh the count against the
    account's normal function.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith:
        - \NPPSpy.txt
        - \NPPSpy.dll
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven NPPSpy artifacts on this host or across the environment, or is it new for this activity?
  context: >-
    When the alert fires under a service or machine account, user identity does not attribute the behavior; the launch
    mechanism does. The query mirrors the rule's file-name pattern scoped to the alerting program, returning the
    90-day history of that program producing this pattern. A new or rare program for these artifacts is the deviation
    worth chasing; a program that already accounts for many prior events is more likely a testing harness or automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith:
        - \NPPSpy.txt
        - \NPPSpy.dll
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether the credential-capture run is isolated or part of a
    wider hands-on operation — provider registration, reconnaissance, or additional tooling on other endpoints. If the
    same account produced activity on multiple hosts in the same window, the scope of compromise is larger than this
    one alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven pattern produce NPPSpy artifacts on other hosts in the same window?
  context: >-
    Under a service or machine account, a user-wide network sweep returns agent-telemetry noise. The meaningful question
    is whether the same launch mechanism fired elsewhere: the query mirrors the rule's file-name pattern scoped to the
    alerting program, fleet-wide, in the alert window. Multiple hosts point to pushed or scheduled distribution;
    a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith:
        - \NPPSpy.txt
        - \NPPSpy.dll
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Credential capture rarely starts a chain. Earlier detections on the same host — initial access, privilege
    escalation, or defense tampering — may reveal how the operator reached the point of registering a malicious
    provider and help reconstruct the timeline. The sequence of alerts often tells the story better than any single
    event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Are the NPPSpy files still on disk, or were they deleted or renamed after the alert?
  context: >-
    The artifacts' post-alert lifecycle drives next steps. NPPSpy.txt still on disk can be retrieved to enumerate
    exactly which accounts were captured; the DLL still present can be hashed and analyzed. Files deleted shortly after
    creation indicate anti-forensic cleanup and shift the focus to which accounts logged in — and were therefore
    captured — before removal.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
