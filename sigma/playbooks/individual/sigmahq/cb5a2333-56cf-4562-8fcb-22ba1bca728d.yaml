- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host - defense tampering, reconnaissance, or
    other execution events - may reveal the attack stages that preceded the download and help reconstruct the timeline. An
    obfuscated-IP download is frequently a mid-chain delivery step rather than the first action.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
