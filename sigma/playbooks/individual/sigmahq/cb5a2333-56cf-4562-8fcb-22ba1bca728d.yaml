name: Obfuscated IP Download Activity
id: 55bd6f22-8a2a-44ca-8781-60a98bab611a
description: |
  Detects a command-line download invocation (Invoke-WebRequest/iwr, Invoke-RestMethod/irm, wget, curl, DownloadFile,
  DownloadString) whose target is an obfuscated representation of an IP address rather than a normal dotted-quad. The rule
  fires when the command line contains a download verb AND at least one obfuscated-address pattern matches -- either a
  hex form (' 0x', '//0x', '.0x'), a URL-encoded host ('http://' combined with '%2e'), or a regex-matched octal/decimal
  packed-integer host -- AND the command line does NOT contain a plain valid dotted-quad IP. Encoding an IP as hex, octal,
  or a single packed integer hides the destination from casual inspection and from naive IOC string matching; it is a
  common evasion in download cradles delivering follow-on payloads. Determine what address the obfuscated host decodes
  to, whether the download succeeded, and whether the destination and behavior fit any sanctioned activity on this host.
type: detection
detection_id: cb5a2333-56cf-4562-8fcb-22ba1bca728d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- question: Does the command line contain a download verb AND an obfuscated IP host, with no plain dotted-quad IP present?
  context: Confirm the alert is a true positive before investing time. The rule fires only when ALL of these hold together
    on one command line - a download verb is present (Invoke-WebRequest, iwr, Invoke-RestMethod, irm, wget, curl, DownloadFile,
    or DownloadString); AND at least one obfuscated-host pattern matches - EITHER a hex form (' 0x', '//0x', '.0x', '.00x'),
    OR a URL-encoded host ('http://' together with '%2e'), OR a regex-matched octal/decimal packed-integer host; AND no plain
    valid dotted-quad IP appears in the same command line. Note which obfuscation branch fired, because that drives how you
    decode the host below.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to download files from raw numeric IP addresses via command-line tools?
  context: Legitimate administrative scripting occasionally pulls files with curl or PowerShell download methods, but pointing
    those tools at an obfuscated numeric IP rather than a hostname is unusual for routine operations. Knowing whether the
    user role and host function include command-line downloads helps separate sanctioned automation from operator activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What address does the obfuscated host decode to, and what does the download command actually fetch?
  context: The obfuscated host is the operator hiding the destination from casual inspection and from naive IOC matching.
    Convert the host to its canonical dotted-quad - hex forms (0x25.0x1b.0x29.0xc3 or a packed 0x251b29c3), octal forms
    (045.033.051.0303 or packed 04506624703), packed decimal integers (622537155), and URL-encoded hosts ('%33%37%2e...'
    decode to '37.27...'). Then read the full command to identify the download verb, the requested resource path, and any
    output file path so you know what was retrieved and where it was written.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Once decoded to a canonical IP, what does threat intel, WHOIS, and passive DNS reveal about the destination?
  context: After resolving the obfuscated host to a dotted-quad, investigate the destination directly - registration age,
    hosting/ASN, passive DNS history, and any known threat-intel hits. Raw-IP destinations with no associated domain,
    recently allocated ranges, or bulletproof-hosting ASNs point to attacker-controlled infrastructure rather than a known
    service. The decoded address comes from the alerting command line; this lookup is performed manually against intel
    sources.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%related_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - DestinationPort
      - Image
- question: What process spawned the download command, and is that parent chain expected?
  context: A command-line download from an obfuscated IP launched from explorer.exe or an interactive shell is a different
    story from the same command spawned by winword.exe, wscript.exe, mshta.exe, or a PowerShell download cradle. An office
    application or script-host parent indicates the download was driven by a macro or staged loader rather than a user
    typing the command.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single download may be isolated, but obfuscated-IP retrieval clustered with rapid enumeration - whoami, ipconfig,
    net user, systeminfo, nltest - is a signature of post-compromise staging. Attackers commonly pull a payload, then survey
    the host before moving to the next stage. Multiple distinct recon binaries within minutes points to automated activity
    rather than ad-hoc troubleshooting.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: Was the download successful? Check for file creation at the destination path.
  context: A download command does not guarantee the file was retrieved - network errors, a blocked or dead obfuscated host,
    or security controls may have stopped the transfer. Confirming a file was written establishes whether the activity
    progressed past the delivery stage. The destination path comes from the download command's output argument; if none is
    visible, look for new files written by the downloading process.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: If the downloaded payload was executed, what is its hash and reputation?
  context: The hash for a reputation lookup is recorded when the payload runs, not when it is fetched to the obfuscated
    destination — file-creation events carry no hash. If the same command ran it, the payload is a child or sibling of
    the alerting process, so this query returns those processes with their executable hashes. The obfuscated destination
    suggests the operator did not want the file inspected, so if it was run later by an unrelated process, retrieve it
    from disk and hash it manually.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      selection_siblings:
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: 1 of selection_*
    fields:
      - Image
      - Hashes
- question: What other file activity occurred in the target directory?
  context: Operators often stage multiple files in the same directory, or the fetched file triggers further writes
    (extraction, decompression, additional downloads). Examining directory-level file activity reveals the broader scope
    of the delivery operation beyond the single file the command named.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Is the downloaded or referenced file still on disk for analysis?
  context: If the command wrote a payload to disk, checking whether it still exists enables hash lookups, sandbox
    submission, and content review. Files that have already been deleted or moved suggest the operator cleaned up after
    staging, which itself is a meaningful signal.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: When this host has previously fired this obfuscated-download pattern, what parents and users drove it, and does
    the current alert fit?
  context: The query mirrors the rule's full selection structure scoped to this host, so the parent/user distribution
    reflects how this specific obfuscated-IP download pattern - not generic curl or PowerShell usage - has historically run
    here. A new parent process, an unexpected user account, or a first-time appearance of the pattern is the deviation worth
    chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_command:
        CommandLine|contains:
        - Invoke-WebRequest
        - 'iwr '
        - Invoke-RestMethod
        - 'irm '
        - 'wget '
        - 'curl '
        - DownloadFile
        - DownloadString
      selection_ip_1:
        CommandLine|contains:
        - ' 0x'
        - //0x
        - .0x
        - .00x
      selection_ip_2:
        CommandLine|contains|all:
        - http://%
        - '%2e'
      selection_ip_3:
      - CommandLine|re: https?://[0-9]{1,3}\.[0-9]{1,3}\.0[0-9]{3,4}
      - CommandLine|re: https?://[0-9]{1,3}\.0[0-9]{3,7}
      - CommandLine|re: https?://0[0-9]{3,11}
      - CommandLine|re: https?://(?:0[0-9]{1,11}\.){3}0[0-9]{1,11}
      - CommandLine|re: https?://0[0-9]{1,11}
      - CommandLine|re: ' [0-7]{7,13}'
      filter_main_valid_ip:
        CommandLine|re: https?://(?:(?:25[0-5]|(?:2[0-4]|1\d|[1-9])?\d)(?:\.|\b)){4}
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_command and 1 of selection_ip_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this obfuscated-download pattern in the past week, and does the distribution look like
    automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this
    obfuscated-IP download pattern - not generic download-tool usage. Many hosts firing the same pattern points to scripted
    deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host
    distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_command:
        CommandLine|contains:
        - Invoke-WebRequest
        - 'iwr '
        - Invoke-RestMethod
        - 'irm '
        - 'wget '
        - 'curl '
        - DownloadFile
        - DownloadString
      selection_ip_1:
        CommandLine|contains:
        - ' 0x'
        - //0x
        - .0x
        - .00x
      selection_ip_2:
        CommandLine|contains|all:
        - http://%
        - '%2e'
      selection_ip_3:
      - CommandLine|re: https?://[0-9]{1,3}\.[0-9]{1,3}\.0[0-9]{3,4}
      - CommandLine|re: https?://[0-9]{1,3}\.0[0-9]{3,7}
      - CommandLine|re: https?://0[0-9]{3,11}
      - CommandLine|re: https?://(?:0[0-9]{1,11}\.){3}0[0-9]{1,11}
      - CommandLine|re: https?://0[0-9]{1,11}
      - CommandLine|re: ' [0-7]{7,13}'
      filter_main_valid_ip:
        CommandLine|re: https?://(?:(?:25[0-5]|(?:2[0-4]|1\d|[1-9])?\d)(?:\.|\b)){4}
      condition: selection_command and 1 of selection_ip_* and not 1 of filter_main_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_command:
        CommandLine|contains:
        - Invoke-WebRequest
        - 'iwr '
        - Invoke-RestMethod
        - 'irm '
        - 'wget '
        - 'curl '
        - DownloadFile
        - DownloadString
      selection_ip_1:
        CommandLine|contains:
        - ' 0x'
        - //0x
        - .0x
        - .00x
      selection_ip_2:
        CommandLine|contains|all:
        - http://%
        - '%2e'
      selection_ip_3:
      - CommandLine|re: https?://[0-9]{1,3}\.[0-9]{1,3}\.0[0-9]{3,4}
      - CommandLine|re: https?://[0-9]{1,3}\.0[0-9]{3,7}
      - CommandLine|re: https?://0[0-9]{3,11}
      - CommandLine|re: https?://(?:0[0-9]{1,11}\.){3}0[0-9]{1,11}
      - CommandLine|re: https?://0[0-9]{1,11}
      - CommandLine|re: ' [0-7]{7,13}'
      filter_main_valid_ip:
        CommandLine|re: https?://(?:(?:25[0-5]|(?:2[0-4]|1\d|[1-9])?\d)(?:\.|\b)){4}
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_command and 1 of selection_ip_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_command:
        CommandLine|contains:
        - Invoke-WebRequest
        - 'iwr '
        - Invoke-RestMethod
        - 'irm '
        - 'wget '
