name: Kapeka Backdoor Configuration Persistence
id: 04fd1748-d7d1-4729-a76e-240e8ad97cfb
description: |
  Detects a registry value named "Seed" written under a \SOFTWARE\Microsoft\Cryptography\Providers\{GUID} subkey, provided the value data is not empty. This location is abused to register a Subject Interface Package (SIP) provider and to stash an encrypted backdoor configuration blob that survives reboot, subverting trust controls while persisting the implant's settings. Legitimate software rarely writes a Seed value to a Cryptography\Providers subkey, so investigation should decode the stored blob, identify the process that wrote it, and correlate the write with any anomalous cryptographic module loads or follow-on execution on the host.
type: detection
detection_id: cbaa3ef3-07a9-4c8e-82d1-9e40578da7fd
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Do the registry key and value data match what this rule detects?
  context: >-
    The rule fires when a value named Seed is written under a \SOFTWARE\Microsoft\Cryptography\Providers\{GUID}
    subkey AND the value data is not "(Empty)". Confirm the exact key path (TargetObject), that the value name
    ends in \Seed, that the data is populated, and note the writing process before investing further time.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to write cryptographic provider registry keys?
  context: >-
    Writes under HKLM\SOFTWARE\Microsoft\Cryptography\Providers are normally performed by the OS or by
    installers registering a legitimate crypto provider, not by interactive users or ad-hoc tooling. Knowing
    whether the writing user and host function fit this operation is often the fastest triage step. User
    attribution is present on most endpoint registry events; when it is a machine account or missing, pivot on
    the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the Cryptography\Providers key a known persistence or trust-subversion location, and what wrote to it?
  context: >-
    Keys under \SOFTWARE\Microsoft\Cryptography relate to code-signing and trust validation. A Seed value under a
    Providers\{GUID} subkey is consistent with registering a SIP provider and persisting an implant's
    configuration rather than any documented product behavior. Read the exact key, the value data, and the
    writing process to judge whether this is a legitimate provider registration or trust-control subversion.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What is stored in the Seed value data, and what does the blob decode to?
  context: >-
    The Seed value holds the stored configuration for the backdoor, typically an encoded or encrypted blob rather
    than a readable path. Examine the Details field for base64 or hex-encoded content, embedded paths, or a binary
    structure. A populated, high-entropy blob under a Cryptography\Providers subkey is the configuration payload
    itself; decoding it (or extracting it for offline analysis) reveals command-and-control settings and how the
    implant is tuned.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Does the Seed value persist, and has it been rewritten on this host after the initial write?
  context: >-
    Endpoint telemetry does not emit registry key or value deletion events, so cleanup of the key cannot be
    observed directly. Judge persistence from the value's re-modification history over a longer window and from
    whether the configured implant executed. Repeated writes to the same Seed value can indicate the backdoor
    refreshing its stored configuration.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What other registry modifications occurred on this host in the same session?
  context: >-
    Registering a SIP provider and persisting a backdoor rarely happens in isolation. Within a short window the
    same process often touches trust-provider mappings, autorun keys, or defense settings. Correlating registry
    changes, module loads, and file writes across one time window shows the full scope of the configuration
    change and whether multiple objectives were pursued together.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Were SIP or trust-provider DLL mappings registered or modified on this host around the same time?
  context: >-
    SIP and trust provider hijacking redirects WinVerifyTrust validation by pointing the Dll and FuncName values
    under the CryptSIPDll* and Providers\Trust\FinalPolicy keys at an attacker module. Modifications to these keys
    alongside the Seed configuration write indicate the trust-subversion half of the technique, not just
    configuration storage. Review any Dll paths written to these keys for non-Microsoft or unusual locations.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\Cryptography\OID\EncodingType 0\CryptSIPDllGetSignedDataMsg'
          - '\Cryptography\OID\EncodingType 0\CryptSIPDllVerifyIndirectData'
          - '\Cryptography\Providers\Trust\FinalPolicy'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Did any unsigned or non-Microsoft cryptographic modules load on this host around the registry change?
  context: >-
    A hijacked SIP provider loads its module into processes that perform trust verification. Review module loads
    on the host in the window and focus on the signer and signature status; an unsigned module, or one signed by a
    party other than Microsoft loading from an unusual path, is the module-load evidence this technique implies.
    Trusted-publisher baselines under HKLM cryptography keys should change infrequently, so a newly loaded
    unsigned crypto module correlated with the Seed write is high-value.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- question: Did a loader process such as rundll32.exe execute on this host after the configuration was written?
  context: >-
    The stored configuration is only effective once the implant is loaded and run. Backdoors that persist a config
    blob commonly launch through a signed loader such as rundll32.exe invoking an exported function of a dropped
    library. Executions of loader binaries after the registry write help confirm whether the persistence became
    active. If the loader binary is common in this environment, treat this as a lead to correlate with the module
    loads and file writes rather than a confirmation on its own.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What files did the process that wrote this registry value create around the same time?
  context: >-
    The registry write and the backdoor payload drop usually happen in the same session from the same process. The
    Seed value stores configuration rather than a payload path, so correlate file activity by the registry-writing
    process and its children instead. A library or executable created in that window is a candidate implant; if one
    appears, retrieve it for offline analysis rather than relying on the file-write event, which carries no hash.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has this Cryptography\Providers key been written on this host before?
  context: >-
    Cryptographic provider registration keys should change rarely, mostly during OS updates or genuine provider
    installs. A key with no prior write history, or one whose stored Seed data differs from anything seen before,
    is more suspicious than a routinely updated value. Baseline the registry path against its own history to
    calibrate how anomalous this write is.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What process wrote this value and what parent chain launched it?
  context: >-
    The writing process and its lineage reveal how the configuration was planted. A signed loader or a benign-looking
    process spawned from an unexpected parent (a script host, an Office application, or an unusual service) points to
    malicious activity, whereas an installer launched by the platform's software-deployment chain points to legitimate
    provider registration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining the process activity immediately before and after the registry write
    reveals what led to it and what followed, and whether the Seed write is one step in a longer sequence such as
    reconnaissance, privilege escalation, or additional persistence. Aggregating parent-child pairs collapses routine
    agent noise while novel pairs stand out.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Was this Cryptography\Providers Seed value written on other hosts in the environment?
  context: >-
    The same write on multiple hosts may indicate a shared implant deployment or lateral movement, while a single
    host suggests a targeted foothold. Compare the stored Details values across hosts; identical blobs on several
    systems point to one operator pushing the same configuration, whereas distinct values suggest per-host tailoring.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the
    stages that preceded the configuration write and help reconstruct the timeline. Establishing a trust-subversion
    foothold often follows initial access and precedes broader implant activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other persistence mechanisms installed on this host in the surrounding window?
  context: >-
    Operators rarely rely on a single persistence mechanism. After a SIP-based configuration foothold, backup
    mechanisms — scheduled tasks, services, registry Run keys, or BITS jobs — are commonly installed with different
    tooling. Persistence-tool executions clustered in the same timeframe indicate intentional stacking rather than
    isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Does any administrator or deployment process account for writing a Seed value under Cryptography\Providers?
  context: >-
    A Seed value under a Cryptography\Providers subkey is not a change an administrator makes by hand, so direct
    confirmation is a fast way to separate a rare legitimate provider install from malicious activity. If no one and
    no deployment tooling accounts for the write, the account context may be compromised or the activity automated.
    If someone does confirm it, capture what software was being installed and why.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
