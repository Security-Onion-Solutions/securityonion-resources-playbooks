name: Conhost Spawned By Uncommon Parent Process
id: f92748f2-6acc-4bf6-a9e0-343c49a3e346
description: |
  Detects when conhost.exe (Console Window Host) is spawned by a protected system process
  that should never legitimately request a console window — explorer.exe, lsass.exe, regsvr32.exe,
  rundll32.exe, services.exe, smss.exe, spoolsv.exe, svchost.exe, userinit.exe, wininit.exe, or
  winlogon.exe. The rule fires when conhost.exe has one of these parents AND the parent is not a
  known-benign svchost service host or the Dropbox client. conhost.exe is normally launched by the
  binary requesting a console (cmd.exe, powershell.exe, an interactive console app); when an actor
  injects shell code into a long-running system process and that code creates a console, the
  resulting conhost.exe child has an "impossible" parent — that parent-child pair is the signal of
  process injection used to bypass interpreter and allowlisting controls. Determine whether the
  parent process was injected, what the injected console did, and whether the same pairing appears
  elsewhere.
type: detection
detection_id: cbb9e3d1-2386-4e59-912e-62f1484f7a89
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Is the parent of this conhost.exe one of the protected system processes that should never spawn a console host?
  context: Confirm the alert is a true positive before investing analysis time. The rule fires when
    Image ends in conhost.exe AND ParentImage is one of explorer.exe, lsass.exe, regsvr32.exe,
    rundll32.exe, services.exe, smss.exe, spoolsv.exe, svchost.exe, userinit.exe, wininit.exe, or
    winlogon.exe, AND the parent is not a known-benign svchost service host or the Dropbox client.
    Read the alert's ParentImage and ParentCommandLine and verify the pairing is genuinely one of
    the flagged combinations rather than a benign exception the filters should have caught.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
- question: Is this host expected to have one of these protected system processes spawning conhost.exe?
  context: A protected system process launching a console host is not a routine administrative action,
    so user role rarely explains it. Knowing the host's function — whether it runs a benign agent or
    line-of-business software known to inject into system processes — is often the fastest way to
    separate a true positive from a tolerated edge case in this environment.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this parent expected to spawn conhost.exe, and what started the parent itself?
  context: The parent-child relationship is the core signal for this detection. Tracing the parent's
    own origin (the grandparent process) reveals whether the chain is legitimate or whether the
    parent was itself spawned or hollowed by something unexpected. A protected system process with a
    normal startup lineage that nonetheless spawned a console host points toward in-process injection
    rather than a misconfiguration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did this same parent instance spawn?
  context: If injected code inside the parent created a console, it likely spawned other processes
    too. Examining the siblings of this conhost.exe from the exact parent instance reveals the full
    scope of activity driven through the injected process — additional interpreters, reconnaissance
    tools, or network utilities launched by the same parent strongly suggest hands-on operation
    rather than an isolated quirk.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What is the parent process doing, and what spawned it?
  context: The parent's own process_creation event reveals how the suspect activity was initiated.
    Read the parent's CommandLine and its grandparent to judge whether this is the genuine,
    unmodified system process or a copy spawned from an unexpected location. For a true injection,
    the parent looks normal on disk and in lineage while behaving abnormally by creating a console —
    making the surrounding context the discriminator.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Does the parent's command line match a documented benign exception, or is it an unexplained protected-process invocation?
  context: The rule already excludes known-benign svchost service hosts (command lines containing
    service switches such as -k netsvcs -p -s NetSetupSvc, -k imgsvc, -k wsappx -p -s AppXSvc, and
    similar) and the Dropbox client path. Documented legitimate rundll32 parents also exist —
    MSI custom-action invocations (zzzzInvokeManagedCustomActionOutOfProc), the Program Compatibility
    Assistant patch task (PcaSvc.dll,PcaPatchSdbTask), and the WebDAV cookie call
    (davclnt.dll,DavSetCookie). Compare the alerting parent's command line against these patterns; a
    parent that matches none of them and still spawned a console host is the meaningful finding.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What commands ran in the console created by this conhost.exe?
  context: A console host with no attached interactive interpreter, or one whose child processes are
    interpreters or living-off-the-land utilities, points to an injected custom shell using the
    console for command execution. Identify the children of this conhost.exe instance and decode
    their command lines for encoded or obfuscated arguments, which characterize interpreter abuse
    routed through the injected process rather than legitimate console use.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: How often has this specific parent spawned conhost.exe on this host historically?
  context: Some parents in the flagged list spawn console hosts on rare, documented occasions
    (rundll32.exe for MSI custom actions or the PCA patch task). A pairing that has occurred
    repeatedly over months on this host is more likely tied to recurring local automation, while a
    zero or near-zero historical count marks a novel spawning relationship worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ParentCommandLine
- question: Does this host normally run conhost.exe at all, and under what parents?
  context: conhost.exe runs constantly under normal console-requesting binaries, so raw volume is not
    the signal here — the historical distribution of its parents is. Establishing the host's usual
    parent set for conhost.exe makes the alerting protected-process parent stand out as a deviation
    from the baseline.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ParentImage
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \conhost.exe
        ParentImage|endswith:
        - \explorer.exe
        - \lsass.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \services.exe
        - \smss.exe
        - \spoolsv.exe
        - \svchost.exe
        - \userinit.exe
        - \wininit.exe
        - \winlogon.exe
      filter_main_svchost:
        ParentCommandLine|contains:
        - -k apphost -s AppHostSvc
        - -k imgsvc
        - -k localService -p -s RemoteRegistry
        - -k LocalSystemNetworkRestricted -p -s NgcSvc
        - -k NetSvcs -p -s NcaSvc
        - -k netsvcs -p -s NetSetupSvc
        - -k netsvcs -p -s wlidsvc
        - -k NetworkService -p -s DoSvc
        - -k wsappx -p -s AppXSvc
        - -k wsappx -p -s ClipSVC
        - -k wusvcs -p -s WaaSMedicSvc
      filter_optional_dropbox:
        ParentCommandLine|contains:
        - C:\Program Files (x86)\Dropbox\Client\
        - C:\Program Files\Dropbox\Client\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \conhost.exe
        ParentImage|endswith:
        - \explorer.exe
        - \lsass.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \services.exe
        - \smss.exe
        - \spoolsv.exe
        - \svchost.exe
        - \userinit.exe
        - \wininit.exe
        - \winlogon.exe
      filter_main_svchost:
        ParentCommandLine|contains:
        - -k apphost -s AppHostSvc
        - -k imgsvc
        - -k localService -p -s RemoteRegistry
        - -k LocalSystemNetworkRestricted -p -s NgcSvc
        - -k NetSvcs -p -s NcaSvc
        - -k netsvcs -p -s NetSetupSvc
        - -k netsvcs -p -s wlidsvc
        - -k NetworkService -p -s DoSvc
        - -k wsappx -p -s AppXSvc
        - -k wsappx -p -s ClipSVC
        - -k wusvcs -p -s WaaSMedicSvc
      filter_optional_dropbox:
        ParentCommandLine|contains:
        - C:\Program Files (x86)\Dropbox\Client\
        - C:\Program Files\Dropbox\Client\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: What else did the user context this alert fired under do across the environment around this time?
  context: Tracking the identity's activity across all hosts in the alert window can reveal lateral
    movement or coordinated activity spanning multiple endpoints. If the same identity drove similar
    activity on other hosts at the same time, the scope of the operation may be larger than this
    single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \conhost.exe
        ParentImage|endswith:
        - \explorer.exe
        - \lsass.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \services.exe
        - \smss.exe
        - \spoolsv.exe
        - \svchost.exe
        - \userinit.exe
        - \wininit.exe
        - \winlogon.exe
      filter_main_svchost:
        ParentCommandLine|contains:
        - -k apphost -s AppHostSvc
        - -k imgsvc
        - -k localService -p -s RemoteRegistry
        - -k LocalSystemNetworkRestricted -p -s NgcSvc
        - -k NetSvcs -p -s NcaSvc
        - -k netsvcs -p -s NetSetupSvc
        - -k netsvcs -p -s wlidsvc
        - -k NetworkService -p -s DoSvc
        - -k wsappx -p -s AppXSvc
        - -k wsappx -p -s ClipSVC
        - -k wusvcs -p -s WaaSMedicSvc
      filter_optional_dropbox:
        ParentCommandLine|contains:
        - C:\Program Files (x86)\Dropbox\Client\
        - C:\Program Files\Dropbox\Client\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: Is this protected-process-spawns-conhost pattern occurring on other hosts in the environment?
  context: The same impossible parent-child pairing appearing on multiple hosts suggests a pushed
    implant or a campaign rather than a one-off. A single occurrence is more likely targeted or a
    local anomaly. Environment-wide comparison helps calibrate severity and identify the full set of
    affected endpoints.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - ParentCommandLine
- question: Did this activity occur outside normal administrative or maintenance windows?
  context: The rare legitimate causes of a protected process spawning conhost.exe — installer custom
    actions, the Program Compatibility Assistant patch task — cluster around software deployment and
    maintenance activity. Activity at off-hours, or outside any change or maintenance window, removes
    one of the few benign explanations and weights the disposition toward injection. Establish when
    the alert fired relative to expected activity windows for this host.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led to
    this event and what followed — reconnaissance, privilege escalation, or persistence that may be
    part of the same sequence. Aggregating by Image and ParentImage collapses repetitive agent
    telemetry into single rows while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access
    — may reveal the stages that preceded this event and help reconstruct the timeline. Process
    injection into a system process is often a mid-chain step, so prior alerts can show how the actor
    reached this point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
