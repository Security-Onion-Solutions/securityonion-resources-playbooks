name: Suspicious Process Parents
id: 22cd9546-1772-4a84-9d31-4e9ed6f01054
description: |
  Detects child processes spawned by parent binaries that should normally have no children, or only a single
  known child. The rule fires on two branches: a parent ending in minesweeper.exe, winver.exe, or bitsadmin.exe
  spawning any child at all, OR a parent ending in csrss.exe, certutil.exe, eventvwr.exe, calc.exe, or notepad.exe
  spawning a child that is not on the known-good list (WerFault.exe, wermgr.exe, conhost.exe, mmc.exe,
  win32calc.exe, notepad.exe). An anomalous child under one of these parents is a common signature of process
  injection and spawn-to masquerading, where an implant injects into a legitimate-looking process and then launches
  follow-on tooling under it. Investigation should confirm which parent branch fired, establish whether the parent
  is genuinely that binary or an injected host, and determine what the spawned child did.
type: detection
detection_id: cbec226f-63d9-4eca-9f52-dfb6652f24df
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Which parent branch fired, and is the parent-child pairing genuinely anomalous?
  context: Confirm the alert against the rule's two branches. The first branch fires when the parent ends in
    minesweeper.exe, winver.exe, or bitsadmin.exe and spawns any child — these binaries normally have no children.
    The second fires when the parent ends in csrss.exe, certutil.exe, eventvwr.exe, calc.exe, or notepad.exe and
    the child is not WerFault.exe, wermgr.exe, conhost.exe, mmc.exe, win32calc.exe, or notepad.exe. Note which
    parent and child are present, because the branch determines which downstream questions carry weight.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: Is this user and host expected to run the spawned child under this parent?
  context: Some parent-child pairs are routine in specific roles — for example bitsadmin used by software
    distribution, or eventvwr launched from an admin console. Knowing whether the user role and host function
    explain the spawn is often the fastest way to separate routine administration from injection.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is the parent process genuinely the binary its name suggests, based on its metadata and hash?
  context: A parent ending in csrss.exe, certutil.exe, calc.exe, or similar may be the real signed system binary
    that was injected into, or an unrelated binary renamed to impersonate it. Compare the parent's Image path
    against its OriginalFileName, and check the signing status and hash. A Microsoft-signed binary from its
    canonical system directory points to injection of a legitimate process; an unsigned or relocated binary points
    to a renamed impostor.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: How did the parent binary arrive on the host, and is it running from its expected directory?
  context: Signed system binaries like csrss.exe, certutil.exe, and eventvwr.exe normally live in canonical system
    directories. A copy of one of these names in a user-writable location (Desktop, Downloads, Temp, AppData) is a
    location anomaly consistent with masquerading. Tracing the file creation event by basename over a long window
    reveals whether the parent was dropped, copied, or installed, and which process wrote it.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What is the full command line of the spawned child, and what does it do?
  context: The anomalous child under one of these parents is the operational payload of a spawn-to injection.
    Decode its arguments, any encoded content, file paths, and URLs to identify what it does — reconnaissance,
    credential access, download, or lateral movement. The child's purpose, not the parent's name, is what
    determines severity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: What is the parent process doing, and what command line did it run with?
  context: The parent's own command line and execution context show how the suspect process was started and
    whether it was driven interactively, by a service, or by another process. For an injected legitimate binary,
    the parent's command line is often the normal launch arguments while the anomalous behavior is the unexpected
    child; for a renamed impostor, the command line itself may reveal the operation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: How much time elapsed between the parent's start and the spawning of this child?
  context: For genuine spawn-to injection, the child frequently appears well after the parent started, once the
    implant has established itself in the injected process. A parent that has been running for an extended period
    and then suddenly spawns an anomalous child fits injection better than a fresh launch-and-spawn sequence.
    Compare the parent's process start time with the child's creation time on this host.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%ParentImage%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: What other child processes did this parent spawn on the host?
  context: An injected or abused parent is often used to launch several tools in sequence — reconnaissance,
    credential access, then movement. Listing every child of this parent binary on the host reveals the full scope
    of activity initiated through it, beyond the single child that triggered the alert.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%ParentImage%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What did the spawned child do after execution, and does the same child appear under this parent on other hosts?
  context: The point of spawning a payload under a benign-looking parent is to operate while blending in. Examining
    the child's own child processes, file writes, and network connections reveals its objective. The same
    parent-child pairing appearing across multiple hosts points to deliberate distribution or automation rather
    than an isolated event.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this parent binary ever spawned this child on this host before?
  context: Some parent-child pairings are routine for a host's role while others are unprecedented. A pairing with
    zero or very low historical count is a novel spawning relationship and weighs toward injection or masquerading;
    a pairing already seen thousands of times is more likely OS or vendor automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%ParentImage%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith:
        - \minesweeper.exe
        - \winver.exe
        - \bitsadmin.exe
      selection_special:
        ParentImage|endswith:
        - \csrss.exe
        - \certutil.exe
        - \eventvwr.exe
        - \calc.exe
        - \notepad.exe
      filter_special:
        Image|endswith:
        - \WerFault.exe
        - \wermgr.exe
        - \conhost.exe
        - \mmc.exe
        - \win32calc.exe
        - \notepad.exe
      filter_null:
        Image: null
      _pb_scope:
        User|expand: '%User%'
      condition: (selection or ( selection_special and not 1 of filter_* )) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith:
        - \minesweeper.exe
        - \winver.exe
        - \bitsadmin.exe
      selection_special:
        ParentImage|endswith:
        - \csrss.exe
        - \certutil.exe
        - \eventvwr.exe
        - \calc.exe
        - \notepad.exe
      filter_special:
        Image|endswith:
        - \WerFault.exe
        - \wermgr.exe
        - \conhost.exe
        - \mmc.exe
        - \win32calc.exe
        - \notepad.exe
      filter_null:
        Image: null
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection or ( selection_special and not 1 of filter_* )) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in the alert window reveals lateral movement or activity
    spanning multiple endpoints. The same user driving similar activity on several hosts widens the likely scope of
    compromise.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith:
        - \minesweeper.exe
        - \winver.exe
        - \bitsadmin.exe
      selection_special:
        ParentImage|endswith:
        - \csrss.exe
        - \certutil.exe
        - \eventvwr.exe
        - \calc.exe
        - \notepad.exe
      filter_special:
        Image|endswith:
        - \WerFault.exe
        - \wermgr.exe
        - \conhost.exe
        - \mmc.exe
        - \win32calc.exe
        - \notepad.exe
      filter_null:
        Image: null
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection or ( selection_special and not 1 of filter_* )) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining process activity around the alert window reveals what led to
    this event and what followed. Aggregating by parent and child collapses repetitive agent telemetry into
    high-count rows while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may
    reveal the stages that preceded this event and help reconstruct the timeline. A spawn-to injection is often
    preceded by an initial-access or execution alert.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
