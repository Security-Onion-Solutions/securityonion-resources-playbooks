name: CurrentVersion NT Autorun Keys Modification
id: be1c45ad-55d0-44c0-89dc-3191d6a9abc0
description: |
  Detects modification of an autostart extensibility point (ASEP) under HKLM ...\Windows NT\CurrentVersion. The rule fires when a write lands on both the CurrentVersion base path AND one of the known autorun subkeys (Winlogon components Userinit, Shell, Taskman, VmApplet, GpExtensions, AppSetup, AlternateShells; AppInit_Dlls; Image File Execution Options; Drivers32; Font Drivers; IconServiceLib; Windows Run/Load), while excluding known-good writers such as poqexec, GP-extension svchost, RuntimeBroker, and the Edge/Avira/Office/OneDrive updaters.
  These keys cause a referenced binary or DLL to load at boot or logon, so legitimate installers and administrators do touch them, but an unexpected write pointing at a user-writable or unusual path is a common persistence and privilege-escalation foothold. Investigation should confirm the exact key and value data, decode what the value points to, determine who wrote it and what spawned that writer, and check whether the referenced payload landed on disk and subsequently executed.
type: detection
detection_id: cbf93e5d-ca6c-4722-8bea-e9119007c248
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Do the registry key and value data match one of the monitored autorun locations?
  context: Before investing investigation time, confirm the write landed on a monitored autostart key under Windows NT\CurrentVersion (a Winlogon component such as Userinit or Shell, AppInit_Dlls, Image File Execution Options, Drivers32, or Windows Run/Load) and review the value data and writing process against the rule's criteria. Known-good updater and Group Policy writers are already excluded by the rule.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify boot or logon autostart keys?
  context: Legitimate administrative activity and software installation can write these keys. Knowing whether the user role and host function are consistent with editing Winlogon, AppInit_Dlls, or IFEO entries is often the fastest way to separate a true positive from routine maintenance. User attribution is present on most endpoint registry events; when it is a machine account or missing, pivot on the writing process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What spawned the process that wrote this autorun key, and is that chain expected?
  context: The autorun key was written by a process; tracing that process back to its own parent reveals whether the write came from a legitimate installer or administrative tool or from an unexpected chain such as a script host, Office application, or command shell. An installer writing Run/Winlogon keys is routine; a document-spawned shell writing them is not.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Was this autorun key change part of a documented deployment, maintenance window, or approval?
  context: Many organizations require change tickets for persistence-relevant changes. A corresponding ticket or deployment record suggests authorized activity such as a software rollout that legitimately sets a Run or Winlogon value; absence of one when policy requires it suggests the change was unauthorized.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the user or administrator recall making this autostart configuration change?
  context: Direct confirmation from the person behind the account is often the fastest path to determining legitimacy. If nobody recalls editing the autorun key, the credentials may be compromised or the write may be automated malware; if they do recall it, capture why the change was made and what it points to.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which autorun key and value were modified, and how is that location abused for persistence?
  context: The specific location determines intent. Winlogon\Userinit and Winlogon\Shell run a binary at every interactive logon; AppInit_Dlls loads a DLL into most user-mode processes; Image File Execution Options can attach a debugger that hijacks an unrelated executable; Drivers32 and Winlogon\GpExtensions load code during startup. The value name and data written determine what executes or what setting changes.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value data was written to this autorun key and what does it point to?
  context: Autorun value data typically holds a path to the binary or DLL that will load at boot or logon, and sometimes an appended command line. Read the value data for a file path in an unusual location (Temp, AppData, ProgramData, or a user profile), a secondary executable appended to a legitimate one (for example userinit.exe,malware.exe), a script host invocation, or an encoded payload. A path here becomes the payload to chase on disk and in later execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Were other registry modifications made on this host in the same session?
  context: Attackers who set one autostart key often make several changes together, such as adding a Run value AND weakening a security policy AND adjusting a service. Registry changes clustered from the same writing process within a short window reveal the full scope of the configuration changes and whether more than one objective was pursued.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has this autorun key been modified before on this host?
  context: Winlogon, AppInit_Dlls, and IFEO keys change rarely outside of OS servicing and software installation, so a first-time or very infrequent modification is more suspicious than a recurring one. Compare the historical value data to see whether the same value is routinely set or whether this write is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Is the executable or script referenced by the autorun value present on disk?
  context: Autorun persistence is only effective if the payload referenced by the value data exists at the path written to the key. Correlating file activity from the writing process and its children shows whether a payload landed on disk in the same session, usually near the registry write. The file-write event carries no hash; if the payload is present, hash it from a later execution or retrieve it for a reputation lookup. Deletion of the key itself is not observable here, so judge cleanup from the key's re-modification history and from whether the payload ran.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did a process run from the path referenced by the autorun value at startup or logon?
  context: >-
    Autorun keys execute their referenced payload at the next boot or interactive logon, which
    can be minutes to days after the key is written. The query anchors on the value data written
    to the key, returning executions whose command line carries the registered path; a match
    confirms the persistence is active and the payload ran. For DLL-type values such as
    AppInit_Dlls or Drivers32 the payload loads inside existing processes rather than starting
    one, so a zero here is expected — the value-data decode question identifies the module in
    that case. If process telemetry does not span the next reboot, treat absence as a visibility
    gap rather than proof the payload never executed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|expand: '%Details%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Was this autorun key modified on other hosts in the environment?
  context: The same autostart key set on many hosts may reflect a Group Policy change or a widely deployed installer, while a modification confined to this one host looks more targeted. Compare the value data across hosts to see whether the same payload is being set everywhere or whether this host received a unique value.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Aggregating process activity around the registry write reveals what led to it and what followed, such as a dropper that wrote the payload, reconnaissance, or additional persistence steps. Repetitive agent telemetry collapses into high-count rows while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal the attack stages that preceded the autorun key modification and help reconstruct the timeline leading to the persistence attempt.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host?
  context: Attackers rarely rely on a single foothold. Alongside an autorun key they commonly stack scheduled tasks, services, or additional registry writes using different tools. Multiple persistence installations in the same timeframe indicate intentional stacking rather than an isolated administrative change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup folder or scheduled-task definition paths on this host?
  context: File-based persistence bypasses command-line detection entirely. Dropping an executable or script into a Startup folder or a path referenced by a registry Run key achieves persistence without invoking schtasks, sc, or reg. File event monitoring captures these drops even when the attacker avoids standard persistence tooling, complementing the autorun key write detected here.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
