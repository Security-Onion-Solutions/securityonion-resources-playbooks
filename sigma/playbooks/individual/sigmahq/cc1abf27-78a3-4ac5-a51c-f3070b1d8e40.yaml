name: Registry Export of Third-Party Credentials
id: 6b731ba6-eb06-436f-8eb4-70c6a48640f7
description: |
  Detects reg.exe invoked with a save or export operation against a registry path that stores third-party
  application credentials (FTP clients, SSH/SFTP session managers, VNC servers, mail clients). The rule fires
  only when all three conditions match together: the image is reg.exe (or OriginalFileName reg.exe), the
  command line contains a save/export verb, and it contains one of the watched credential subkeys. Manually
  backing up a single application's settings can produce one such command, but credential-stealer families
  dump several of these subkeys in quick succession to harvest stored passwords offline. Determine whether the
  exported subkey, the parent process, the user, and any follow-on activity point to a legitimate backup or to
  credential theft.
type: detection
detection_id: cc1abf27-78a3-4ac5-a51c-f3070b1d8e40
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line show reg.exe running a save or export against a third-party credential registry path?
  context: Confirm the alert is a true positive before investing time. The rule fires only when all three pieces
    are present together — the image is reg.exe (or OriginalFileName is reg.exe), the command line contains a
    save or export verb, and it contains one of the watched credential subkeys (for example WinSCP Sessions,
    Sota FFFTP, PuTTY SshHostKeys, OpenSSH Agent Keys). Read the exact command and confirm which subkey was
    targeted and where the output was written.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to back up third-party application credentials from the registry?
  context: Legitimate backup of an FTP client, SSH session manager, or VNC server's saved settings can trigger
    this rule when an admin or the application's own owner exports their configuration. Knowing whether this
    user's role and this host's function involve maintaining those applications is often the fastest way to
    separate a routine backup from credential theft.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which third-party credential store was targeted by the export?
  context: Different watched subkeys hold different secrets — WinSCP Sessions and Sota FFFTP store saved FTP/SFTP
    server passwords (FFFTP keeps base64-obfuscated passwords, WinSCP uses a reversible host-and-user XOR scheme),
    PuTTY SshHostKeys and OpenSSH Agent Keys hold SSH material, and the VNC entries hold remote-access passwords.
    Identifying the exact subkey determines which application accounts may be exposed and what must be rotated.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Decode the full reg export command — which subkey was exported, what output file was written, and was the overwrite flag set?
  context: The full command line reveals the operation's intent. Identify the exact source subkey, the destination
    .reg file path (these families write to %LOCALAPPDATA% with names like FFFTP_registry.reg or WinSCP_registry.reg),
    and whether a silent-overwrite flag such as /y was used. The destination path is what a follow-on file query
    looks for on disk. A single subkey export under a /y flag pointed at a temp or AppData path is consistent with
    automated harvesting rather than an interactive backup.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_cli_save:
        CommandLine|contains:
        - save
        - export
      selection_cli_path:
        CommandLine|contains:
        - \Software\Aerofox\Foxmail\V3.1
        - \Software\Aerofox\FoxmailPreview
        - \Software\DownloadManager\Passwords
        - \Software\FTPWare\COREFTP\Sites
        - \Software\IncrediMail\Identities
        - \Software\Martin Prikryl\WinSCP 2\Sessions
        - \Software\Mobatek\MobaXterm
        - \Software\OpenSSH\Agent\Keys
        - \Software\OpenVPN-GUI\configs
        - \Software\ORL\WinVNC3\Password
        - \Software\Qualcomm\Eudora\CommandLine
        - \Software\RealVNC\WinVNC4
        - \Software\RimArts\B2\Settings
        - \Software\SimonTatham\PuTTY\Sessions
        - \Software\SimonTatham\PuTTY\SshHostKeys
        - \Software\Sota\FFFTP
        - \Software\TightVNC\Server
        - \Software\WOW6432Node\Radmin\v3.0\Server\Parameters\Radmin
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is the exported .reg file still on disk for analysis?
  context: The export writes a .reg file containing the harvested credential subkey (commonly under %LOCALAPPDATA%
    with names like FFFTP_registry.reg or WinSCP_registry.reg). If it is still present, it can be hashed, reviewed,
    or submitted for analysis to confirm exactly which saved sessions and passwords were captured. Its absence may
    mean it was already exfiltrated and deleted.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process spawned reg.exe, and is that parent chain expected for a credential export?
  context: The parent reveals how the export was launched. Interactive backups are typically driven by explorer.exe
    or a console the user opened. A command shell spawned by an unsigned executable from a user-writable path, or
    a chain that does not correspond to any administrative task, points to automated harvesting. Walk up the tree
    to see what spawned the parent and what else that parent launched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What other processes did the same parent spawn after the export?
  context: The processes launched alongside or after the export reveal the operation's broader goal. Credential-stealer
    families frequently pair these registry exports with a headless browser launch (chrome.exe with --headless and
    --silent-launch to crawl browser-stored secrets without a visible window) and with archiving or network tools
    used to stage and exfiltrate the collected data. Unexpected children indicate the export was one stage of a
    multi-step harvest.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other activity occurred on this host around the time of the alert?
  context: Registry credential exports rarely happen in isolation. Activity in the surrounding window may reveal
    parallel exports of other watched subkeys, browser-data harvesting, reconnaissance, or staging that together
    define the scope. Novel parent-child pairs at low counts are what to scan for against the high-count background
    of routine host telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_cli_save:
        CommandLine|contains:
        - save
        - export
      selection_cli_path:
        CommandLine|contains:
        - \Software\Aerofox\Foxmail\V3.1
        - \Software\Aerofox\FoxmailPreview
        - \Software\DownloadManager\Passwords
        - \Software\FTPWare\COREFTP\Sites
        - \Software\IncrediMail\Identities
        - \Software\Martin Prikryl\WinSCP 2\Sessions
        - \Software\Mobatek\MobaXterm
        - \Software\OpenSSH\Agent\Keys
        - \Software\OpenVPN-GUI\configs
        - \Software\ORL\WinVNC3\Password
        - \Software\Qualcomm\Eudora\CommandLine
        - \Software\RealVNC\WinVNC4
        - \Software\RimArts\B2\Settings
        - \Software\SimonTatham\PuTTY\Sessions
        - \Software\SimonTatham\PuTTY\SshHostKeys
        - \Software\Sota\FFFTP
        - \Software\TightVNC\Server
        - \Software\WOW6432Node\Radmin\v3.0\Server\Parameters\Radmin
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_cli_save:
        CommandLine|contains:
        - save
        - export
      selection_cli_path:
        CommandLine|contains:
        - \Software\Aerofox\Foxmail\V3.1
        - \Software\Aerofox\FoxmailPreview
        - \Software\DownloadManager\Passwords
        - \Software\FTPWare\COREFTP\Sites
        - \Software\IncrediMail\Identities
        - \Software\Martin Prikryl\WinSCP 2\Sessions
        - \Software\Mobatek\MobaXterm
        - \Software\OpenSSH\Agent\Keys
        - \Software\OpenVPN-GUI\configs
        - \Software\ORL\WinVNC3\Password
        - \Software\Qualcomm\Eudora\CommandLine
        - \Software\RealVNC\WinVNC4
        - \Software\RimArts\B2\Settings
        - \Software\SimonTatham\PuTTY\Sessions
        - \Software\SimonTatham\PuTTY\SshHostKeys
        - \Software\Sota\FFFTP
        - \Software\TightVNC\Server
        - \Software\WOW6432Node\Radmin\v3.0\Server\Parameters\Radmin
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the same account exported credential
    subkeys on multiple endpoints or moved between them. If the same user triggered similar activity on several
    hosts, the scope of credential exposure is larger than a single machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_cli_save:
        CommandLine|contains:
        - save
        - export
      selection_cli_path:
        CommandLine|contains:
        - \Software\Aerofox\Foxmail\V3.1
        - \Software\Aerofox\FoxmailPreview
        - \Software\DownloadManager\Passwords
        - \Software\FTPWare\COREFTP\Sites
        - \Software\IncrediMail\Identities
        - \Software\Martin Prikryl\WinSCP 2\Sessions
        - \Software\Mobatek\MobaXterm
        - \Software\OpenSSH\Agent\Keys
        - \Software\OpenVPN-GUI\configs
        - \Software\ORL\WinVNC3\Password
        - \Software\Qualcomm\Eudora\CommandLine
        - \Software\RealVNC\WinVNC4
        - \Software\RimArts\B2\Settings
        - \Software\SimonTatham\PuTTY\Sessions
        - \Software\SimonTatham\PuTTY\SshHostKeys
        - \Software\Sota\FFFTP
        - \Software\TightVNC\Server
        - \Software\WOW6432Node\Radmin\v3.0\Server\Parameters\Radmin
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Which application accounts may be compromised, and do any grant access to sensitive systems?
  context: The severity depends on what the exported saved sessions can reach. FTP/SFTP and SSH session stores
    often hold credentials for production servers, code repositories, or transfer endpoints; VNC and Radmin entries
    grant interactive remote control. Enumerate the saved hosts and accounts in the targeted store and assess which
    grant access to sensitive systems requiring rotation or escalation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: How often has this host fired this reg.exe credential-export pattern over the past 90 days, and what command-line structures are typical?
  context: A credential-export pattern with no prior history on a host is more suspicious than one that recurs under
    a stable parent. The query mirrors the rule's selection structure scoped to this host, so the count reflects this
    specific firing pattern rather than generic reg.exe usage. The command-line projection lets you compare typical
    invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_cli_save:
        CommandLine|contains:
        - save
        - export
      selection_cli_path:
        CommandLine|contains:
        - \Software\Aerofox\Foxmail\V3.1
        - \Software\Aerofox\FoxmailPreview
        - \Software\DownloadManager\Passwords
        - \Software\FTPWare\COREFTP\Sites
        - \Software\IncrediMail\Identities
        - \Software\Martin Prikryl\WinSCP 2\Sessions
        - \Software\Mobatek\MobaXterm
        - \Software\OpenSSH\Agent\Keys
        - \Software\OpenVPN-GUI\configs
        - \Software\ORL\WinVNC3\Password
        - \Software\Qualcomm\Eudora\CommandLine
        - \Software\RealVNC\WinVNC4
        - \Software\RimArts\B2\Settings
        - \Software\SimonTatham\PuTTY\Sessions
        - \Software\SimonTatham\PuTTY\SshHostKeys
        - \Software\Sota\FFFTP
        - \Software\TightVNC\Server
        - \Software\WOW6432Node\Radmin\v3.0\Server\Parameters\Radmin
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- question: When this host has previously fired this credential-export pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even routine maintenance scripts can match this pattern. The query mirrors the rule's selection structure
    scoped to this host — the resulting parent and user distribution reflects how this specific firing pattern has
    historically run here. A new parent process, an unexpected user account, or an unusual command-line structure is the
    anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_cli_save:
        CommandLine|contains:
        - save
        - export
      selection_cli_path:
        CommandLine|contains:
        - \Software\Aerofox\Foxmail\V3.1
        - \Software\Aerofox\FoxmailPreview
        - \Software\DownloadManager\Passwords
        - \Software\FTPWare\COREFTP\Sites
        - \Software\IncrediMail\Identities
        - \Software\Martin Prikryl\WinSCP 2\Sessions
        - \Software\Mobatek\MobaXterm
        - \Software\OpenSSH\Agent\Keys
        - \Software\OpenVPN-GUI\configs
        - \Software\ORL\WinVNC3\Password
        - \Software\Qualcomm\Eudora\CommandLine
        - \Software\RealVNC\WinVNC4
        - \Software\RimArts\B2\Settings
        - \Software\SimonTatham\PuTTY\Sessions
        - \Software\SimonTatham\PuTTY\SshHostKeys
        - \Software\Sota\FFFTP
        - \Software\TightVNC\Server
        - \Software\WOW6432Node\Radmin\v3.0\Server\Parameters\Radmin
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Were other credential or registry LOLBins used on this host recently for the same objective?
  context: Operators who use reg.exe to dump one credential store often reach for additional tools — esentutl or
    extrac32 to copy locked files, certutil to encode the staged data, or other registry-capable binaries — to
    complete a harvest. Finding several of these performing related work in the same window strengthens the case
    that this is deliberate credential collection rather than an isolated backup.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\esentutl.exe'
          - '\extrac32.exe'
          - '\expand.exe'
          - '\makecab.exe'
          - '\wmic.exe'
          - '\regsvr32.exe'
          - '\rundll32.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was reg.exe executed from its expected System32 or SysWOW64 path?
  context: reg.exe run from outside System32 or SysWOW64 may have been copied or renamed to evade path-based
    allowlists. A 32-bit stealer running under WOW64 will legitimately invoke SysWOW64\reg.exe, but reg.exe
    launched from a user temp or AppData directory is more suspicious than one in its standard location. Confirm
    the image path and OriginalFileName agree with a genuine system reg.exe.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
