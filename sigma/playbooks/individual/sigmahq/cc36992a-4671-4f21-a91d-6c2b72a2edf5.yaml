name: Suspicious Eventlog Clearing or Configuration Change Activity
id: b08e6c5e-254a-440d-b711-f8a5dc4f6d90
description: |
  Detects clearing or configuration tampering of the Windows event log through wevtutil, PowerShell, or wmic. The rule fires
  when at least one of several patterns matches: wevtutil invoked with a clear-log / set-log / lfn: argument, PowerShell run
  with the *-EventLog cmdlets or the .NET EventLogSession/EventLog clear APIs, or powershell/wmic invoking ClearEventLog —
  while excluding the benign msiexec ` sl ` pattern. Clearing logs (cl/clear-log) destroys authentication and execution
  evidence; reconfiguring a channel (sl /e:false, lfn: relocation) disables future logging. Administrators legitimately clear
  or relocate logs during maintenance, so the investigation should confirm which channel was targeted, who ran the command,
  whether the action was scripted automation or hands-on-keyboard, and what activity surrounds the tampering.
type: detection
detection_id: cc36992a-4671-4f21-a91d-6c2b72a2edf5
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the alerting process match one of this rule's event-log tampering patterns, and which branch fired?
  context: >-
    The rule fires on any one of several branches: wevtutil with a clear-log/set-log/lfn: argument, PowerShell using the
    *-EventLog cmdlets or the .NET EventLogSession.ClearLog / EventLog.Clear APIs, or powershell/wmic invoking ClearEventLog.
    Confirm the alert is a true positive by reading the exact Image, OriginalFileName, and CommandLine and noting which
    branch matched — a wevtutil ` cl ` clear differs from a wevtutil ` sl /e:false ` reconfiguration, and a .NET-API call
    from pwsh.exe will read very differently from a Clear-EventLog cmdlet. The branch that fired determines which downstream
    questions carry weight.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to clear or reconfigure Windows event logs?
  context: >-
    Log clearing and channel reconfiguration are legitimate maintenance actions for administrators, backup tooling, and
    image-build automation. Knowing whether the acting user's role and the host's function are consistent with event-log
    administration is often the fastest path to separating routine maintenance from defense evasion.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which event log channel was cleared or reconfigured, and was it a destructive clear or a configuration change?
  context: >-
    The specific target and verb determine impact. A clear (cl / clear-log / Clear-EventLog / ClearEventLog) on the Security
    channel destroys authentication and 4688/1102 evidence; set-log (sl) with /e:false disables a channel going forward; lfn:
    relocates a channel's backing file so future events land off the expected path. Read the full command line to identify
    the exact channel name (Security, System, Application, Microsoft-Windows-PowerShell/Operational, Sysmon/Operational, or a
    custom log) and whether a /bu: backup was taken — a clear without /bu is irreversible.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: If a PowerShell branch fired, was the command encoded or obfuscated, and what does it decode to?
  context: >-
    The PowerShell branches match readable cmdlet and .NET-API strings, but an operator can wrap the same call in
    -EncodedCommand (-enc) base64, string concatenation, or backtick escaping to slip a more capable script past
    string-based review. Decode any base64 payload and deobfuscate concatenated strings to confirm the script only clears
    logs versus also pulling a download cradle, loading a .NET assembly in memory, or chaining further tampering. This does
    not apply to the wevtutil or wmic branches.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned this tool, and is that parent chain expected for event-log administration?
  context: >-
    The parent process reveals how the clearing tool was invoked. Legitimate clearing usually descends from an interactive
    shell, a management console, or a known maintenance scheduler. Unusual parents — Office applications, mshta.exe,
    wscript.exe, a web-server worker, or an unexpected service — point to the tampering being driven by another stage of an
    intrusion rather than by an administrator. This parent-mechanism view is the process-identification angle for the
    impair-defenses behavior.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Does this host normally run this event-log tool?
  context: >-
    A binary that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low historical
    counts for wevtutil, pwsh.exe, or wmic on this host indicate first-time or rare use and shift the disposition away from
    routine maintenance.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this rule's pattern, what parents and users drove it, and does the current alert fit?
  context: >-
    Even common tools get abused. This query mirrors the rule's full selection structure scoped to this host, so the
    resulting parent and user distribution reflects how this specific event-log-tampering pattern — not generic wevtutil or
    PowerShell usage — has historically run here. A new parent process, an unexpected user account, or an unusual
    command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_wevtutil_img:
      - Image|endswith: \wevtutil.exe
      - OriginalFileName: wevtutil.exe
      selection_wevtutil_cmd:
        CommandLine|contains:
        - 'clear-log '
        - ' cl '
        - 'set-log '
        - ' sl '
        - 'lfn:'
      selection_other_ps_img:
        Image|endswith:
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
      selection_other_ps_cmd:
      - CommandLine|contains:
        - 'Clear-EventLog '
        - 'Remove-EventLog '
        - 'Limit-EventLog '
        - 'Clear-WinEvent '
      - CommandLine|contains|all:
        - Eventing.Reader.EventLogSession
        - ClearLog
      - CommandLine|contains|all:
        - Diagnostics.EventLog
        - Clear
      selection_other_wmi:
        Image|endswith:
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
        - \wmic.exe
        CommandLine|contains: ClearEventLog
      filter_main_msiexec:
        ParentImage:
        - C:\Windows\SysWOW64\msiexec.exe
        - C:\Windows\System32\msiexec.exe
        CommandLine|contains: ' sl '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (((all of selection_wevtutil_*) or (all of selection_other_ps_*) or selection_other_wmi) and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    This query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this
    event-log-tampering pattern rather than generic tool usage. Many hosts firing the same pattern points to scripted
    deployment or a maintenance job that clears logs across the estate; one host or a small unrelated set points to manual
    operator activity. Use the host distribution and parent/binary consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_wevtutil_img:
      - Image|endswith: \wevtutil.exe
      - OriginalFileName: wevtutil.exe
      selection_wevtutil_cmd:
        CommandLine|contains:
        - 'clear-log '
        - ' cl '
        - 'set-log '
        - ' sl '
        - 'lfn:'
      selection_other_ps_img:
        Image|endswith:
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
      selection_other_ps_cmd:
      - CommandLine|contains:
        - 'Clear-EventLog '
        - 'Remove-EventLog '
        - 'Limit-EventLog '
        - 'Clear-WinEvent '
      - CommandLine|contains|all:
        - Eventing.Reader.EventLogSession
        - ClearLog
      - CommandLine|contains|all:
        - Diagnostics.EventLog
        - Clear
      selection_other_wmi:
        Image|endswith:
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
        - \wmic.exe
        CommandLine|contains: ClearEventLog
      filter_main_msiexec:
        ParentImage:
        - C:\Windows\SysWOW64\msiexec.exe
        - C:\Windows\System32\msiexec.exe
        CommandLine|contains: ' sl '
      condition: (all of selection_wevtutil_*) or (all of selection_other_ps_*) or (selection_other_wmi) and not 1 of filter_main_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_wevtutil_img:
      - Image|endswith: \wevtutil.exe
      - OriginalFileName: wevtutil.exe
      selection_wevtutil_cmd:
        CommandLine|contains:
        - 'clear-log '
        - ' cl '
        - 'set-log '
        - ' sl '
        - 'lfn:'
      selection_other_ps_img:
        Image|endswith:
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
      selection_other_ps_cmd:
      - CommandLine|contains:
        - 'Clear-EventLog '
        - 'Remove-EventLog '
        - 'Limit-EventLog '
        - 'Clear-WinEvent '
      - CommandLine|contains|all:
        - Eventing.Reader.EventLogSession
        - ClearLog
      - CommandLine|contains|all:
        - Diagnostics.EventLog
        - Clear
      selection_other_wmi:
        Image|endswith:
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
        - \wmic.exe
        CommandLine|contains: ClearEventLog
      filter_main_msiexec:
        ParentImage:
        - C:\Windows\SysWOW64\msiexec.exe
        - C:\Windows\System32\msiexec.exe
        CommandLine|contains: ' sl '
      _pb_scope:
        User|expand: '%User%'
      condition: (((all of selection_wevtutil_*) or (all of selection_other_ps_*) or selection_other_wmi) and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_wevtutil_img:
      - Image|endswith: \wevtutil.exe
      - OriginalFileName: wevtutil.exe
      selection_wevtutil_cmd:
        CommandLine|contains:
        - 'clear-log '
        - ' cl '
        - 'set-log '
        - ' sl '
        - 'lfn:'
      selection_other_ps_img:
        Image|endswith:
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
      selection_other_ps_cmd:
      - CommandLine|contains:
        - 'Clear-EventLog '
        - 'Remove-EventLog '
        - 'Limit-EventLog '
        - 'Clear-WinEvent '
      - CommandLine|contains|all:
        - Eventing.Reader.EventLogSession
        - ClearLog
      - CommandLine|contains|all:
        - Diagnostics.EventLog
        - Clear
      selection_other_wmi:
        Image|endswith:
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
        - \wmic.exe
        CommandLine|contains: ClearEventLog
      filter_main_msiexec:
        ParentImage:
        - C:\Windows\SysWOW64\msiexec.exe
        - C:\Windows\System32\msiexec.exe
        CommandLine|contains: ' sl '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (((all of selection_wevtutil_*) or (all of selection_other_ps_*) or selection_other_wmi) and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or coordinated action across multiple endpoints.
    If the same user cleared logs or ran other tooling on several hosts in the same window, the scope of the operation may be
    larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_wevtutil_img:
      - Image|endswith: \wevtutil.exe
      - OriginalFileName: wevtutil.exe
      selection_wevtutil_cmd:
        CommandLine|contains:
        - 'clear-log '
        - ' cl '
        - 'set-log '
        - ' sl '
        - 'lfn:'
      selection_other_ps_img:
        Image|endswith:
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
      selection_other_ps_cmd:
      - CommandLine|contains:
        - 'Clear-EventLog '
        - 'Remove-EventLog '
        - 'Limit-EventLog '
        - 'Clear-WinEvent '
      - CommandLine|contains|all:
        - Eventing.Reader.EventLogSession
        - ClearLog
      - CommandLine|contains|all:
        - Diagnostics.EventLog
        - Clear
      selection_other_wmi:
        Image|endswith:
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
        - \wmic.exe
        CommandLine|contains: ClearEventLog
      filter_main_msiexec:
        ParentImage:
        - C:\Windows\SysWOW64\msiexec.exe
        - C:\Windows\System32\msiexec.exe
        CommandLine|contains: ' sl '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (((all of selection_wevtutil_*) or (all of selection_other_ps_*) or selection_other_wmi) and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What activity occurred on this host after the event logs were cleared or reconfigured?
  context: >-
    Logs are often cleared to hide what comes next, or to erase what already happened. Examining process activity in the
    window after the tampering reveals what the clearing was meant to conceal or enable. If a channel was cleared or
    disabled, expect a visibility gap in that channel; process creation that resumes in that window points to the activity
    the tampering was protecting.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense-tampering actions performed on this host around the same time?
  context: >-
    Operators who clear one log often disable several controls — stopping Defender or EDR services, deleting shadow copies,
    disabling recovery, and clearing additional channels — to maximize coverage. Finding multiple tampering events from the
    same user or parent process within the surrounding window indicates several controls were targeted in one operation
    rather than an isolated administrative clear.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Were .evtx log files deleted or relocated on this host around the time of the alert?
  context: >-
    Clearing through a tool is only one route to destroying log evidence. An operator can also delete the backing .evtx files
    directly, or use wevtutil sl /lfn: to relocate a channel so future events land off the expected path. File-deletion and
    file-creation events for the event-log store surface this even when no clearing cmdlet ran. Deletions or new .evtx files
    outside the default winevt\Logs directory in this window point to evidence destruction or log relocation.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: file_delete
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_evtx:
        TargetFilename|contains:
          - '\winevt\Logs\'
          - '.evtx'
      condition: selection and selection_evtx
    fields:
      - TargetFilename
      - Image
      - User
- question: Were EventLog or autologger registry keys modified on this host around the time of the alert?
  context: >-
    Event logging can be disabled without any clearing command by editing the registry — flipping the Start value of the
    EventLog service, setting Enabled to 0 on a channel under EventLog\Channels, or disabling an Autologger trace session.
    Registry-set events surface this configuration-level defense evasion that process command lines for wevtutil or
    PowerShell will not show. Changes to these keys in the surrounding window indicate logging was disabled at the
    service or channel level.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\Services\EventLog\'
          - '\WINEVT\Channels\'
          - '\WMI\Autologger\'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: Did the Security channel record a log-cleared event, and does its timing line up with the alerting command?
  context: >-
    Clearing the Security log generates a single audit record (Event ID 1102) as the last entry before the channel is wiped.
    Correlating that record with the alerting process confirms the clear actually executed against the Security channel and
    pins the exact time the evidence gap begins. Absence of a 1102 while the command targeted Security may mean the channel
    was already disabled, the clear failed, or a different channel was the target. If Security audit events are not collected
    in this environment, treat the absence as a visibility gap rather than evidence nothing happened.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 1102
      condition: selection
    fields:
      - EventID
      - SubjectUserName
      - SubjectDomainName
