name: Tasks Folder Evasion
id: 6453066f-2852-43ec-aeae-baf66873da78
description: |
  Detects a command line that both invokes a file-writing verb (echo, copy, type, or file createnew)
  AND references the globally writable Tasks folders under C:\Windows\System32\Tasks\ or C:\Windows\SysWow64\Tasks\.
  Both conditions must be present together. These directories are writable by unprivileged users, so an actor can
  plant a script or .NET assembly there that script hosts and .NET applications (cscript, wscript, regsvr32, mshta,
  eventvwr) subsequently load, achieving execution and persistence with hijacked execution flow. Legitimate writes to
  these paths are rare; the investigation should confirm what file was written, whether it was later loaded as a module,
  and whether the writing process and user are expected to touch these system directories.
type: detection
detection_id: cc4e02ba-9c06-48e2-b09e-2500cace9ae0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- question: Does the command line both use a file-writing verb and reference a System32\Tasks or SysWow64\Tasks path?
  context: Confirm the alert is a true positive before investing further. The rule fires only when the command line
    contains a file-writing verb (echo, copy, type, or file createnew) AND a reference to C:\Windows\System32\Tasks\
    or C:\Windows\SysWow64\Tasks\. Verify both elements are present in the exact command line and note which Tasks path
    and which verb were used.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to write files into the System32\Tasks or SysWow64\Tasks directories?
  context: Writing into the globally writable Tasks folders is unusual for ordinary users and most automation. Knowing
    whether the user role and host function legitimately involve placing files in these system directories is often the
    fastest way to separate a true positive from a rare but sanctioned operation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What did the full command do — which file was written into the Tasks folder and with what content?
  context: The full command line reveals the source and destination of the write. Identify the target file name under
    the Tasks path, the content being written (echoed text, copied source file, redirected output), and any chained
    commands. Because cmd.exe is high volume, this query is scoped to invocations on this host that reference the Tasks
    paths so related sequential write commands are captured without unrelated shell activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
          - ' C:\Windows\System32\Tasks\'
          - ' C:\Windows\SysWow64\Tasks\'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What is the content of the file written into the Tasks folder?
  context: Read the file planted under the Tasks path. For scripts and text check for base64 encoding, obfuscated strings,
    embedded URLs or IP addresses, and known malicious patterns; for a .NET assembly or binary check imports, embedded
    strings, packer signatures, and signing status. The file's content determines what executes when a script host or
    .NET application loads it. Content retrieval is a manual step from the endpoint or EDR.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What is the hash of the module loaded from the Tasks folder?
  context: The System32\Tasks and SysWow64\Tasks folders are world-writable, and the technique drops an assembly
    there for a script host or .NET application (cscript, wscript, regsvr32, mshta, eventvwr) to load. A module's
    hash is recorded when it loads, so this looks on the host for modules loaded from a Tasks path and returns
    their hashes -- legitimate code does not load assemblies from Tasks, so any hit is high-signal. Submit the
    hash to VirusTotal, Hybrid Analysis, or internal threat intel. If the dropped file is instead a script run by
    a host process, it is data with no load hash -- retrieve it from the Tasks path and hash it by hand (see the
    content-decode and evidence-preservation steps).
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_path:
        ImageLoaded|contains:
          - '\System32\Tasks\'
          - '\SysWow64\Tasks\'
      condition: selection and selection_path
    fields:
      - ImageLoaded
      - Hashes
- question: What process spawned this command interpreter and is that parent chain expected?
  context: The parent process reveals how the write into the Tasks folder was initiated. Interactive use from explorer.exe
    differs from a script host (wscript.exe, mshta.exe), an Office application, or a remote-execution service spawning
    the interpreter. An unexpected parent points toward scripted or exploited execution rather than an administrator at
    a console.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Is the file referenced in the Tasks path still on disk for analysis?
  context: The command references a file under the Tasks folder. Checking whether it still exists on disk enables deeper
    analysis — hash lookups, sandbox submission, or content review. If the file has already been removed or loaded and
    deleted, capture whatever telemetry recorded its prior existence.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was a module loaded from a System32\Tasks or SysWow64\Tasks path on this host?
  context: The payoff of this technique is execution flow hijack — a script host or .NET application loading the planted
    assembly from the Tasks directory. A module load whose path is under \System32\Tasks\ or \SysWow64\Tasks\ confirms
    the planted file was actually executed as code rather than merely staged. Correlate the loading process and the load
    time with the original write to establish the file-creation-to-load interval.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|contains:
          - '\System32\Tasks\'
          - '\SysWow64\Tasks\'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: When this host has previously fired this rule's pattern, what parents and users drove it, and does the current
    alert fit?
  context: Even routine tools can be abused. This query mirrors the rule's selection structure scoped to this host, so the
    resulting parent and user distribution reflects how this specific write-into-Tasks pattern has historically run here.
    A new parent process, an unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection1:
        CommandLine|contains:
        - 'echo '
        - 'copy '
        - 'type '
        - file createnew
      selection2:
        CommandLine|contains:
        - ' C:\Windows\System32\Tasks\'
        - ' C:\Windows\SysWow64\Tasks\'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection1:
        CommandLine|contains:
        - 'echo '
        - 'copy '
        - 'type '
        - file createnew
      selection2:
        CommandLine|contains:
        - ' C:\Windows\System32\Tasks\'
        - ' C:\Windows\SysWow64\Tasks\'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection1:
        CommandLine|contains:
        - 'echo '
        - 'copy '
        - 'type '
        - file createnew
      selection2:
        CommandLine|contains:
        - ' C:\Windows\System32\Tasks\'
        - ' C:\Windows\SysWow64\Tasks\'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints.
    If the same user triggered similar activity on multiple hosts, the scope of the operation may be larger than the single
    alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection1:
        CommandLine|contains:
        - 'echo '
        - 'copy '
        - 'type '
        - file createnew
      selection2:
        CommandLine|contains:
        - ' C:\Windows\System32\Tasks\'
        - ' C:\Windows\SysWow64\Tasks\'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led to the write into the
    Tasks folder, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege
    escalation, or additional persistence mechanisms in the same window.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the
    stages that preceded this write into the Tasks folder and help reconstruct the timeline leading up to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like
    automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, giving a fleet-wide count of the write-into-Tasks
    pattern rather than generic binary usage. Many hosts firing the same pattern points to scripted deployment or vendor
    automation; a single host or small unrelated set points to manual operator activity. Use the host distribution and
    parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection1:
        CommandLine|contains:
        - 'echo '
        - 'copy '
        - 'type '
        - file createnew
      selection2:
        CommandLine|contains:
        - ' C:\Windows\System32\Tasks\'
        - ' C:\Windows\SysWow64\Tasks\'
      condition: all of selection*
    fields:
    - host.name
- question: Were files dropped to other persistence locations on this host in the surrounding window?
  context: Writing into the Tasks folder is one file-based foothold; attackers commonly stack backups. File event monitoring
    captures drops to the Startup folder and registry Run/RunOnce key paths even when the attacker avoids standard persistence
    tools. Drops to multiple persistence locations in the same timeframe indicate intentional stacking rather than isolated
    administrative action.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
          - '\System32\Tasks\'
          - '\SysWow64\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
