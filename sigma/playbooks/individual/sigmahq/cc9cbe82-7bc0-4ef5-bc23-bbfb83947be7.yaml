name: File Decoded From Base64/Hex Via Certutil.EXE
id: 60439e62-38f4-4f17-a766-4b846b29a918
description: |
  Detects certutil.exe running with the -decode or -decodehex flag, which decodes a base64 or hex encoded file back into its
  original form. The rule fires when the process is certutil.exe (by Image name or OriginalFileName) AND the command line contains
  -decode or -decodehex. certutil is a Microsoft-signed system binary, so attackers use these flags as a living-off-the-land
  primitive to turn a benign-looking encoded file on disk into an executable payload before running it, often after the encoded
  file was wrapped in PEM-style certificate headers. Legitimate certificate and PKI workflows rarely use the decode verbs, so
  the investigation should establish what file was decoded, where its output landed, and whether anything executed it afterward.
type: detection
detection_id: cc9cbe82-7bc0-4ef5-bc23-bbfb83947be7
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the certutil command line contain -decode or -decodehex, and is the process certutil.exe?
  context: Confirm the alert is a true positive by reviewing the exact command line and process identity. The rule requires both
    that the process is certutil.exe (by Image name or OriginalFileName) and that the command line carries -decode or -decodehex.
    Read the source file and the output file named in the command — they identify what was decoded and where the decoded result
    was written.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to decode files with certutil?
  context: Legitimate administrative and PKI activity rarely invokes certutil's decode verbs. Knowing whether the user role and
    host function are consistent with command-line file decoding is often the fastest way to separate a true positive from a
    routine operation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the encoded source file, what is the decoded output path, and what does the decoded content turn out to be?
  context: The decode verb's two file arguments are the operative detail — the first is the encoded input, the second is the
    decoded output. Attackers wrap an executable in PEM-style -----BEGIN CERTIFICATE----- headers so certutil decodes it back
    to a runnable PE while resembling a benign certificate operation. Retrieve the output file and inspect it to determine whether
    it is an executable, a script, or data, and what operation it would perform.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the decoded output file still on disk for analysis?
  context: The second argument to -decode/-decodehex is the decoded output path. Checking whether that file still exists on disk
    enables hash lookups, sandbox submission, or content review. Attackers frequently delete the encoded input and the decoded
    output after execution, so absence is itself informative.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was certutil.exe executed from its expected System32 or SysWOW64 path?
  context: certutil normally runs from C:\Windows\System32\certutil.exe or C:\Windows\SysWOW64\certutil.exe. A copy running from
    a user temp, Downloads, or ProgramData directory may have been relocated or renamed to evade path-based allowlists, which
    raises the suspicion of the decode operation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: What process spawned certutil and is that parent chain expected?
  context: The parent process reveals how certutil was invoked. Decode operations driven by explorer.exe or an interactive shell
    differ from those spawned by mshta.exe, wscript.exe, Office applications, or a script host, which point to macro or script-driven
    execution. The launching parent helps distinguish routine usage from operator tooling on this host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did certutil spawn afterward, and did the decoded output execute?
  context: A decode operation that is immediately followed by execution of the decoded file is the core abuse pattern. Child
    processes such as cmd.exe, powershell.exe, or a freshly written executable in a user-writable directory indicate the decoded
    payload ran. Legitimate decode usage typically has no execution follow-on.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other file activity occurred in the directory where the decoded output landed?
  context: Attackers often stage several files in the same directory, or the decoded file triggers further writes such as extraction,
    configuration drops, or additional decoded artifacts. Examining directory-level file activity reveals the broader scope of
    the staging operation around the decode.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What file did certutil decode, and can you retrieve and analyze it?
  context: certutil -decode reconstructs a binary from base64/hex — the decoded output is the payload, written to the
    name given on the command line. File-creation events carry no hash, so retrieve the decoded file from the path
    below and submit its hash to threat intelligence or detonate it in a sandbox. If the decoded payload was then
    executed, its hash is also on its process event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - EventType
- question: Does this host normally run certutil at all?
  context: A binary that has rarely or never run on a host is more suspicious than one that runs regularly. Zero or very low
    historical counts over 90 days indicate first-time or rare certutil use on this host, regardless of which verb was passed.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously decoded files with certutil, what parents and users normally drove it, and does this
    alert fit that pattern?
  context: Even common tools can be abused. This query mirrors the rule's selection — certutil with -decode or -decodehex — scoped
    to this host, so the resulting parent and user distribution reflects how this specific decode pattern has historically run
    here, not generic certutil usage. A new parent process, an unexpected user, or an unusual command-line structure is the deviation
    worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certutil.exe
      - OriginalFileName: CertUtil.exe
      selection_cli:
        CommandLine|contains|windash:
        - '-decode '
        - '-decodehex '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certutil.exe
      - OriginalFileName: CertUtil.exe
      selection_cli:
        CommandLine|contains|windash:
        - '-decode '
        - '-decodehex '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certutil.exe
      - OriginalFileName: CertUtil.exe
      selection_cli:
        CommandLine|contains|windash:
        - '-decode '
        - '-decodehex '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If
    the same user triggered similar activity on several hosts, the scope of compromise may be larger. This pivot is meaningful
    only when the alert fires under a named user account.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certutil.exe
      - OriginalFileName: CertUtil.exe
      selection_cli:
        CommandLine|contains|windash:
        - '-decode '
        - '-decodehex '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Were any other encode/decode or download LOLBins used on this host recently?
  context: Attackers who use one living-off-the-land binary often use several. If certutil decoded a payload, check whether expand,
    extrac32, makecab, bitsadmin, curl, or other transfer and extraction binaries were also used to stage or move files. Multiple
    such binaries performing related actions strengthens the case for hands-on activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\hh.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: How often has this host decoded files with certutil over the past 90 days, and what command-line structures are typical?
  context: A decode pattern with no prior history on a host is more suspicious than one used regularly under stable parents. This
    query mirrors the rule's selection — certutil with -decode or -decodehex — scoped to this host, so the count reflects this
    specific decode pattern rather than generic certutil usage. The command-line projection lets you compare typical invocation
    patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certutil.exe
      - OriginalFileName: CertUtil.exe
      selection_cli:
        CommandLine|contains|windash:
        - '-decode '
        - '-decodehex '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- question: In the minutes around the decode, what scripts or suspicious parents created encoded or archive files on this host?
  context: Obfuscation detection correlates script or suspicious-parent execution with creation of encoded, compressed, or encrypted
    files such as .b64, .hex, .zip, .7z, or .enc. A tight window between an encoded file appearing and certutil decoding it points
    to a stage-then-decode sequence; widen or narrow the window to the cadence of this host's activity. File creations clustered
    around the alert that feed into or follow from the decode are the time-correlated artifacts to reconstruct.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - '.b64'
          - '.hex'
          - '.zip'
          - '.7z'
          - '.enc'
      condition: selection
    fields:
      - TargetFilename
      - Image
