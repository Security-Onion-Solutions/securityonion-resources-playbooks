name: Suspicious Windows Trace ETW Session Tamper Via Logman.EXE
id: 4db1fc10-cdee-4dab-82ef-7cd6353353c9
description: |
  Detects logman.exe (or a renamed binary whose OriginalFileName is Logman.exe) invoked to stop or delete a Windows Event Tracing (ETW) session whose name matches a security-telemetry collector — Circular Kernel Context Logger, an EventLog- session, the Sysmon trace session, or SysmonDnsEtwSession. The rule fires only when all three conditions hold at once: the binary is logman, the command carries a stop or delete verb, and the targeted session name matches one of those telemetry collectors. Stopping or deleting these sessions blinds the host's low-level event capture, so legitimate firings come from administrative maintenance or agent installers, while malicious use precedes hands-on-keyboard activity meant to run without telemetry. Determine which session was targeted, whether collection is still down, who and what drove the action, and what happened on the host once visibility was reduced.
type: detection
detection_id: cd1f961e-0b96-436b-b7c6-38da4583ec00
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the logman command line match what this rule detects — a stop or delete verb against a security ETW session name?
  context: Confirm the alert is a true positive by reviewing the exact command line. The rule requires all three conditions together — the binary resolves to logman.exe (by image name or OriginalFileName), the command carries 'stop ' or 'delete ', and it names one of the security trace sessions (Circular Kernel Context Logger, an EventLog- session, SYSMON TRACE, or SysmonDnsEtwSession). Note which session name appears; it determines which telemetry went dark and which downstream questions matter most.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to manage ETW trace sessions with logman?
  context: Legitimate logman stop/delete activity comes from administrators tuning performance collectors or from agent installers that reset trace sessions during setup. A workstation or an account with no operational reason to touch ETW sessions is the disposition-changing case. Compare the user role and host function against routine telemetry maintenance.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which ETW trace session was stopped or deleted, and what telemetry does that session feed?
  context: Different session names blind different collectors. Circular Kernel Context Logger and SYSMON TRACE feed Sysmon's process, network, and registry events; EventLog- sessions back the classic Windows event channels; SysmonDnsEtwSession captures DNS query telemetry. Decode the full command line to identify the exact session name and verb (stop versus delete — delete removes the session definition, not just the running instance). The targeted collector determines what evidence is now missing for the rest of the investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the targeted ETW session running again, or is that telemetry still not being collected?
  context: Stopping or deleting a trace session may be transient (reset during a maintenance window) or persistent (left down to suppress evidence). Check whether the session has been restarted and is collecting again, or whether events from that collector are still absent. A session that is still down means the host has an active visibility gap that should be restored before further analysis depends on its telemetry.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: After the trace session was tampered with, is there a gap in this host's telemetry where events stop arriving?
  context: Stopping the Sysmon or EventLog- ETW session produces an observable absence — process, network, registry, or event-channel records that normally stream continuously go quiet right after the logman command. A clean break in collected events at that timestamp confirms the tamper took effect, and the length of the gap bounds the window in which other activity could have run unrecorded. If the telemetry from the targeted collector is not retained in this environment, treat zero results as a visibility gap rather than evidence nothing happened.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: What process spawned logman, and is that parent chain expected for ETW session management?
  context: The parent reveals how logman was invoked. Administrative maintenance and installer activity have predictable parents (an interactive shell launched by explorer.exe, services.exe, or an installer process). A parent such as a script host, an Office application, or an unsigned binary points to scripted or hands-on-keyboard abuse rather than routine telemetry tuning.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What ran on this host in the hour after the trace session was tampered with?
  context: Telemetry is disabled to enable something. Activity in the window right after the logman command — process execution, credential access tooling, archiving, or data movement — is the activity the tamper was meant to run without recording. Where the targeted session feeds the very telemetry you would use here, correlate with network connections and file events for the same window, since process records may be incomplete.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense-tampering actions performed on this host around the same time?
  context: Operators who disable one telemetry collector often disable several or clear logs outright to maximize coverage. Finding additional tampering — log clearing, shadow-copy deletion, service stops, Defender changes, or firewall edits — from the same user or parent process indicates a coordinated effort to reduce visibility rather than an isolated administrative action.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Were Windows event log files (.evtx) deleted or modified on this host in the surrounding window?
  context: Stopping an EventLog- ETW session and deleting the underlying .evtx files are complementary indicator-removal steps — the first halts collection, the second destroys what was already recorded. File-deletion events touching the event-log store under the System32 winevt directory in the same timeframe point to a deliberate effort to erase historical evidence rather than a transient session reset.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: file_delete
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_evtx:
        TargetFilename|contains:
          - '\winevt\Logs\'
          - '.evtx'
      condition: selection and selection_evtx
    fields:
      - TargetFilename
      - Image
      - User
- question: When this host previously fired this logman ETW-tamper pattern, what parents and users drove it, and does the current alert fit that history?
  context: Even on hosts where ETW session maintenance is routine, the firing pattern has a normal pattern. The query mirrors the rule's selection — logman stopping or deleting one of the named security sessions — scoped to this host, so the resulting parent and user distribution reflects how this specific tamper pattern has historically run here. A new parent process, an unexpected account, or a first-ever firing is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \logman.exe
      - OriginalFileName: Logman.exe
      selection_action:
        CommandLine|contains:
        - 'stop '
        - 'delete '
      selection_service:
        CommandLine|contains:
        - Circular Kernel Context Logger
        - EventLog-
        - SYSMON TRACE
        - SysmonDnsEtwSession
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \logman.exe
      - OriginalFileName: Logman.exe
      selection_action:
        CommandLine|contains:
        - 'stop '
        - 'delete '
      selection_service:
        CommandLine|contains:
        - Circular Kernel Context Logger
        - EventLog-
        - SYSMON TRACE
        - SysmonDnsEtwSession
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \logman.exe
      - OriginalFileName: Logman.exe
      selection_action:
        CommandLine|contains:
        - 'stop '
        - 'delete '
      selection_service:
        CommandLine|contains:
        - Circular Kernel Context Logger
        - EventLog-
        - SYSMON TRACE
        - SysmonDnsEtwSession
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around the time of this alert?
  context: Tracking the user's activity across all hosts in the alert window reveals lateral movement or coordinated activity on multiple endpoints. If the same account stopped or deleted trace sessions, or ran other tooling, on several hosts close together, the scope is broader than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \logman.exe
      - OriginalFileName: Logman.exe
      selection_action:
        CommandLine|contains:
        - 'stop '
        - 'delete '
      selection_service:
        CommandLine|contains:
        - Circular Kernel Context Logger
        - EventLog-
        - SYSMON TRACE
        - SysmonDnsEtwSession
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired this logman ETW-tamper pattern in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this specific tamper pattern rather than generic logman usage. Many hosts firing the same pattern points to scripted deployment or agent-installer behavior that resets trace sessions; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \logman.exe
      - OriginalFileName: Logman.exe
      selection_action:
        CommandLine|contains:
        - 'stop '
        - 'delete '
      selection_service:
        CommandLine|contains:
        - Circular Kernel Context Logger
        - EventLog-
        - SYSMON TRACE
        - SysmonDnsEtwSession
      condition: all of selection*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Telemetry tampering rarely happens in isolation. Earlier detections on the same host — reconnaissance, credential access, or other defense-evasion activity — may reveal the attack stages that preceded the trace-session tamper and help reconstruct the full timeline. If the targeted ETW session feeds the very telemetry those earlier detections rely on, alerts may thin out after this point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were process-based persistence mechanisms installed on this host around the same time?
  context: Reducing telemetry and establishing persistence often go together — an operator who blinds a collector frequently follows with a foothold that survives reboot. Scheduled tasks, services, registry Run-key edits, BITS jobs, or WMI subscriptions created in the surrounding window indicate intentional stacking rather than isolated maintenance.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
