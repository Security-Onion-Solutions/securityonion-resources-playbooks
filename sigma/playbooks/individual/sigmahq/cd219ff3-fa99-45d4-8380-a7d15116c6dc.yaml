name: New User Created Via Net.EXE
id: 4fe1f3d0-babc-4905-8214-5db43ba763f2
description: |
  Detects local user account creation via net.exe or net1.exe, where the command line contains
  both "user" and "add". The rule fires when the binary is net.exe or net1.exe (by Image or
  OriginalFileName) AND the command line carries both keywords. Creating a local account is a
  common persistence step: an operator who has gained execution often adds a new account to
  retain access independent of the credential they entered with, and may then add it to a
  privileged group. The same command is also routine administration, so investigation should
  confirm the account that was created, who created it, the parent chain, and whether the action
  was approved before treating it as malicious.
type: detection
detection_id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- question: Did net.exe or net1.exe run with a command line containing both "user" and "add"?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires
    when the process is net.exe or net1.exe (by Image or OriginalFileName) AND the command line
    contains both "user" and "add". Review the exact command line against both conditions and read
    off the account name being created.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user expected to create local accounts on this host?
  context: Network administrators and IT staff legitimately create local accounts for maintenance,
    service setup, or onboarding. Standard users almost never run "net user /add". The account that
    invoked net.exe and its role determine whether local account creation here is routine
    administration or unauthorized persistence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: What account was created and with what attributes? Decode the full net.exe command line.
  context: The full command line reveals the new account name, any password set inline, and flags
    such as /add, /domain, or /active that change scope or state. net and net1 often run as a pair
    (net.exe relaunches net1.exe), so the host-scoped window may show both halves of the same
    operation. Note whether a follow-on "net localgroup administrators /add" placed the new account
    in a privileged group.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Was a local account creation event (4720) recorded on this host around the same time, and what account does it name?
  context: A successful "net user /add" produces a Security account-management event for user
    creation (event ID 4720) carrying the new account name and the creator. Correlating the process
    execution with the resulting account event confirms the account was actually created rather than
    a failed or syntactically incomplete command, and ties the new account name to the operation. If
    Security account-management events are not collected in this environment, treat zero results as a
    visibility gap rather than evidence no account was created.
  range: +/-2m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4720
      condition: selection
    fields:
      - TargetUserName
      - SubjectUserName
      - SamAccountName
- question: What process spawned net.exe, and is that parent chain expected for account creation?
  context: Legitimate account creation is typically run from cmd.exe or powershell.exe spawned by
    explorer.exe (an admin at a console) or from a deployment/automation parent. net.exe spawned by
    Office applications, script interpreters (wscript.exe, cscript.exe, mshta.exe), wmiprvse.exe
    (remote WMI), or wsmprovhost.exe (WinRM) points to automated post-exploitation rather than
    hands-on administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Did other reconnaissance commands run on this host around the same time?
  context: Account creation for persistence often sits inside a burst of enumeration. A single net
    command may be benign troubleshooting, but several reconnaissance commands in rapid succession --
    whoami, net user, net group, nltest, dsquery, quser -- is a signature of post-compromise
    enumeration before the operator establishes a foothold.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \net.exe
        - \net1.exe
      - OriginalFileName:
        - net.exe
        - net1.exe
      selection_cli:
        CommandLine|contains|all:
        - user
        - add
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \net.exe
        - \net1.exe
      - OriginalFileName:
        - net.exe
        - net1.exe
      selection_cli:
        CommandLine|contains|all:
        - user
        - add
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity on
    multiple endpoints. If the same user created accounts or ran administrative commands elsewhere in
    the same window, the scope of the operation may be larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \net.exe
        - \net1.exe
      - OriginalFileName:
        - net.exe
        - net1.exe
      selection_cli:
        CommandLine|contains|all:
        - user
        - add
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What did this user do next on this host?
  context: Follow-on activity reveals the next steps after the account was created. Look for the new
    account being added to a privileged group, the account being used to authenticate, persistence
    installation, or lateral movement attempts by the same user.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other launches of net.exe on this host followed in the next four hours, and does the parent or command-line structure change?
  context: Under a service principal, asking what the user did next is unbounded. A focused follow-on
    for automation-driven alerts is to track repeat net.exe invocations on the same host. Routine
    scheduled tasks repeat with stable parents and command-line structures; a deviation in parent or
    command line in the follow-on window -- for example a shift from account creation to group
    membership changes -- is the signal worth chasing.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ParentImage
      - CommandLine
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate
    context -- what led to the account creation, what happened after, and whether it is part of a
    larger sequence. Look for reconnaissance, privilege escalation, or additional persistence around
    the net.exe execution.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- defense
    tampering, reconnaissance, credential access -- may reveal the stages that preceded the account
    creation and help reconstruct the full timeline leading to this persistence step.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was there a change ticket, maintenance window, or documented approval to create this account?
  context: Many organizations require an approved request before a local account is created, especially
    on servers. A corresponding ticket suggests authorized administration; absence of one when policy
    requires it suggests the account was created without authorization. This check can quickly close a
    false positive or escalate a true positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Was net.exe executed from its expected System32 path?
  context: net.exe and net1.exe normally live under System32 or SysWOW64. A copy running from a user
    temp directory, a profile folder, or another non-standard path may indicate the binary was
    relocated or renamed to evade path-based allowlists, which raises the weight of the account
    creation firing here.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host run net.exe with "user add" over the past 90 days, and what command-line structures are typical?
  context: An account-creation command with no prior history on a host is more suspicious than one that
    appears routinely under a stable parent (for example a provisioning script). The query mirrors the
    rule's selection structure scoped to this host, so the count reflects this specific "net user add"
    pattern rather than generic net.exe usage. The command-line projection lets the analyst compare
    typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \net.exe
        - \net1.exe
      - OriginalFileName:
        - net.exe
        - net1.exe
      selection_cli:
        CommandLine|contains|all:
        - user
        - add
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: Attackers rarely rely on a single persistence mechanism. After creating an account, they
    commonly add backup mechanisms using different techniques -- scheduled tasks, services, registry
    Run keys, BITS jobs, or WMI subscriptions. Multiple persistence installations in the same
    timeframe indicate intentional stacking rather than an isolated administrative account change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
