name: New BgInfo.EXE Custom WMI Query Registry Configuration
id: 65efae22-1582-43b1-a87b-0622feb84091
description: |
  Detects a registry value written under \Software\Winternals\BGInfo\UserFields\ whose value data
  begins with 6 — the BgInfo custom-field type that is evaluated as a WMI query. Both conditions must
  hold together for the rule to fire: the key path identifies a BgInfo user-defined field, and the
  leading 6 in the data identifies that field as WMI-backed rather than a static string, an
  environment variable, or a file. Once configured, the signed Sysinternals binary bginfo.exe runs
  the stored query every time it renders the desktop, which on many deployments is at every logon via
  a logon script or an autostart entry, so the configuration value is what turns a routine desktop
  utility into a repeatable query-execution mechanism owned by whoever wrote the value.
  Administrators add user fields to surface inventory data such as asset tags or patch levels, so the
  investigation should establish what query text was stored, which process and account wrote it,
  whether that pairing is coherent, and whether bginfo.exe subsequently ran under the new
  configuration.
type: detection
detection_id: cd277474-5c52-4423-a52b-ac2d7969902f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the alerting write target a BgInfo UserFields value, and does its value data begin with 6?
  context: >-
    The rule requires both conditions together — a key path under \Software\Winternals\BGInfo\UserFields\
    and value data whose first character is 6, the WMI-query field type. Confirm the exact key path,
    read the value data past the leading type code to see the query text, and read the writing process
    and its signer as context rather than a verdict. Nearly every alerting process on Windows endpoint
    telemetry is trusted-signed, so the useful judgment is coherence — a Sysinternals or deployment-tool
    signer configuring a BgInfo field is self-consistent, a script host or interactive shell writing the
    same value is not.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - registry_event
- question: Is this user and host expected to configure BgInfo custom fields?
  context: >-
    BgInfo user fields are normally defined once by whoever builds the desktop-information layout —
    a workstation-engineering or asset-management function — and then distributed, not authored
    ad hoc on individual endpoints. A user with no configuration-management role, or a host that is
    not part of a BgInfo deployment at all, makes the write worth explaining. User attribution is
    present on most endpoint registry events; when the account is a machine account or SYSTEM, pivot
    on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Was this BgInfo configuration change part of a documented deployment or maintenance activity?
  context: >-
    Desktop-information fields are usually added as part of a build or an inventory-reporting project,
    which normally leaves a ticket, a package, or a configuration-management record behind. A matching
    record closes the alert quickly. Absence of one, on a host where BgInfo is otherwise centrally
    managed, means the field was authored locally and needs an owner. The redisplayed alert event in
    the results panel carries no answer to this question.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: Does the user or administrator recall adding a custom BgInfo field on this host?
  context: >-
    The rule's expected benign case is an administrator adding a WMI-backed inventory field, and the
    fastest way to settle that is to ask. If the person confirms, ask what data the field was meant to
    display and compare their answer to the query text actually stored in the value. If nobody recalls
    the change, the account that wrote it becomes the next thing to examine. This question is answered
    from people, not from the redisplayed alert event.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: What launched the process that wrote this BgInfo UserFields value?
  context: >-
    The registry event names the writing process but not its origin. Looking that process up by its own
    identifier returns the parent that started it, which separates a configuration tool, installer, or
    management agent from an interactive shell, a script host such as wscript.exe or mshta.exe, or an
    Office application. Registry-tool allowlists in mature environments typically cover regedit.exe,
    reg.exe, and msiexec.exe running under a deployment parent; a write arriving outside that set is
    the case that needs explaining.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other processes did the writing process spawn around the configuration change?
  context: >-
    A process that stops at one configuration value looks different from one that also launches
    tooling. Listing the children of the writing process shows whether the BgInfo field was an
    isolated change or one step in a longer sequence. Registry telemetry does not record the acting
    process's own parent, so this shows what that process started, not what started alongside it.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Which BgInfo user field was configured, and does the writing process plausibly own that key?
  context: >-
    The value name under \Software\Winternals\BGInfo\UserFields\ is the field label that appears on the
    desktop, and the data holds the field type followed by its definition. Field types cover static
    text, environment variables, file contents, VB script, and WMI queries; the type-6 form is the one
    that hands bginfo.exe a query to evaluate at render time. Judge the signer against the key — a
    Sysinternals-signed or deployment-tool-signed process configuring a BgInfo field is coherent, a
    general-purpose LOLBin writing someone else's application configuration is not. Trusted signing is
    true of essentially every alerting process and is not exculpatory on its own.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - registry_event
- question: What query text is stored in the value data after the leading type code?
  context: >-
    The data is the field-type code followed by the definition BgInfo evaluates. Strip the leading 6 and
    read the remainder as a WMI query — note the namespace, the class, and the properties requested.
    An inventory field asks for something displayable such as a serial number, an OS build, or a patch
    level from a standard class. A definition that reaches into Win32_Process, Win32_Service,
    Win32_UserAccount, security-product classes, or a non-default namespace is asking for host survey
    data rather than a desktop label. Value data is absent on registry events whose data is binary or
    empty, so treat a missing Details value as a telemetry gap and read the field from the host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
  answer_sources:
  - registry_event
  - manual_review
- question: Were other registry modifications made on this host in the same window?
  context: >-
    A single configuration value reads differently depending on what landed beside it. Grouping every
    registry modification on the host in the surrounding window by key path and writing process shows
    whether the BgInfo field arrived alone, alongside other BgInfo settings from the same deployment,
    or alongside autostart, service, or policy changes from the same account. The triggering key will
    appear in the results; the signal is what else is there.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
  answer_sources:
  - registry_event
- question: Was this UserField value written once, or has it been rewritten since the alert?
  context: >-
    A field that is set once and left alone matches a configuration change. Repeated rewrites of the
    same value, or a rewrite that swaps the query text shortly after the first write, match someone
    iterating on a definition or reverting it after use. Value and key deletion are not observable in
    this telemetry, so absence of further events is not evidence the field was removed — judge the
    field's current state from the host itself and from whether bginfo.exe ran in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
  answer_sources:
  - registry_event
  - manual_review
- question: Did the writing process or its children create any files on this host in the same session?
  context: >-
    A BgInfo user field stores a query definition rather than a payload path, so there is no referenced
    executable to confirm on disk. The session around the write is still worth reading — staging a
    BgInfo binary, dropping a .bgi layout file, or writing a script into a user-writable directory all
    show up as file activity from the same process lineage. File-write events carry no hash; if a file
    of interest appears, hash it from a later execution or retrieve it for a reputation lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Did bginfo.exe run on this host after the field was configured?
  context: >-
    The stored query only executes when BgInfo renders, so the configuration change and its effect are
    separate events. An execution shortly after the write means the query ran under the new definition
    and any data it returned was rendered on the desktop. Look at the parent as well — a run from a
    logon script, a scheduled task, or an autostart entry means the query repeats on every logon rather
    than once. No execution means the field is staged but has not yet taken effect.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\bginfo.exe'
          - '\bginfo64.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
  answer_sources:
  - process_creation
  - registry_event
- question: Does this host normally run the process that wrote the configuration value?
  context: >-
    Ninety days of execution history for the writing binary on this host, grouped by account, calibrates
    how routine the write is. A binary that runs regularly under a management account points at an
    established process; zero or near-zero history means the write came from something that does not
    normally run here, which raises the value of the lineage and query-text questions.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: Has this BgInfo user field been configured before on this host?
  context: >-
    Ninety days of modification history for this exact value shows whether the field is part of a
    recurring deployment that rewrites it on a schedule or something written for the first time. Compare
    the historical value data against what was written now — the same definition arriving again matches
    reapplied configuration, a changed definition on a previously stable field is the case to pursue.
    No history at all means the field was created by this write.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
  answer_sources:
  - registry_event
- question: Was the same BgInfo user field configured on other hosts?
  context: >-
    Dropping the host filter shows whether this value is written fleet-wide or only here. A field that
    appears across many hosts with the same value data and the same writing process matches a managed
    rollout. A field that exists on one host, or that carries different query text on this host than
    elsewhere, is a local change rather than a distributed one.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
  answer_sources:
  - registry_event
- question: What other process activity occurred on this host around the time of the configuration change?
  context: >-
    Grouping process starts on the host in the surrounding window by binary and parent collapses routine
    agent and service traffic into high-count rows and leaves novel parent-child pairings visible at low
    counts. That is what to scan for — a script host, an interactive shell, or a remote-execution parent
    appearing near the write reframes it as part of a hands-on session rather than a deployment.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host help place this write in a sequence. Reconnaissance or defense
    tampering before a query-execution mechanism is configured reads differently from a quiet host where
    this is the only detection of the day. Read the earlier alerts for what stage they represent rather
    than for their severity labels alone.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Were other persistence mechanisms installed on this host around the same time?
  context: >-
    A BgInfo field that runs at every logon is one mechanism among several an operator may configure in
    the same session. Scheduled tasks, services, autostart values, BITS jobs, and WMI subscriptions
    installed within hours of the configuration change point at intentional stacking rather than a
    single administrative action. Aggregating by tool and command shows which mechanisms were touched
    without listing every execution.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
