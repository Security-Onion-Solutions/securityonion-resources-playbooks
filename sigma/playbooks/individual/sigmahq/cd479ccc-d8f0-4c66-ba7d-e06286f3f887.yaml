name: Potential CVE-2021-26857 Exploitation Attempt
id: 22d05c6b-4185-4183-909c-63260d156525
description: |
  Fires when a process is created whose parent is Exchange Server's Unified Messaging worker
  (ParentImage ending in \UMWorkerProcess.exe) AND whose image is not one of the Windows Error
  Reporting binaries (wermgr.exe, WerFault.exe) the service legitimately spawns. CVE-2021-26857 is
  an insecure-deserialization flaw in the Unified Messaging service; code that lands through it runs
  in the service context, which on an Exchange server is SYSTEM. Because the error-reporting binaries
  the rule already excludes are the UM worker's only routinely expected children, any other child is
  a process-lineage anomaly rather than a parameter anomaly. The investigation should establish what
  the child process did, whether the Unified Messaging service logged a deserialization error in the
  same window, whether files were written to web-accessible or staging directories, whether the child
  made outbound connections, and whether the host's Exchange build predates the fix.
type: detection
detection_id: cd479ccc-d8f0-4c66-ba7d-e06286f3f887
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the alerting event match what this rule detects — a process whose parent is UMWorkerProcess.exe and whose own image is neither wermgr.exe nor WerFault.exe?
  context: The rule requires both conditions together — the parent path ends in \UMWorkerProcess.exe
    AND the child is not one of the two Windows Error Reporting binaries. Confirm the ParentImage on
    the alerting event really resolves to the Exchange Unified Messaging worker and is not a
    similarly named binary elsewhere on disk, and note which child image was launched — that image
    determines which follow-on questions carry weight.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
  answer_sources:
  - alert
  - process_creation
- question: Is this host an Exchange server running the Unified Messaging role, and is that role expected here?
  context: The rule only has meaning on a host that actually runs the Unified Messaging service.
    Confirm the host's role from asset inventory and confirm whether UM is deliberately enabled — a
    server that carries the role only because it was never trimmed after a migration is both a
    likelier target and an easier remediation than one that depends on the role.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What request reached the Unified Messaging service immediately before this process was created?
  context: Deserialization flaws in a server role are reached over the network, so the delivery
    vector is a request rather than a document or an attachment. The parent's own command line
    identifies the UM worker instance; the request that fed it is reconstructed from the Exchange
    web-proxy and Unified Messaging logs on the server for the minutes before the spawn, and the
    originating source address is what gets blocked at the perimeter.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - manual_review
  - edr_console
- question: Is this Exchange installation patched against CVE-2021-26857?
  context: The Unified Messaging deserialization flaw is fixed by the March 2021 and later Exchange
    cumulative and security updates. An Exchange build predating the fix makes exploitation a
    plausible explanation for the lineage anomaly and identifies every other server on the same build
    as exposed; a fully patched build points the investigation toward a different route into the
    service context, and toward whichever other Exchange servers share that build.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
  answer_sources:
  - asset_inventory
  - edr_console
- question: Were other Exchange servers in the environment targeted the same way?
  context: Internet-facing server roles are enumerated and exploited in sweeps, so a single alerting
    host is rarely the only one probed. Counting this rule's firings across hosts in the last day
    separates one server with an anomalous lineage from a set of servers being worked through, and
    names the additional systems that need the same triage.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - alert
- question: What was the Unified Messaging worker process itself, and what started it?
  context: The alert names the parent only by path. Retrieving the worker's own creation event shows
    its command line and its own parent, which confirms it was started by the Exchange service
    infrastructure rather than by an interactive or unexpected launcher, and gives the worker's start
    time — a worker that started long before the spawn was serving traffic, one that started moments
    before may have been recycled by a preceding crash.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
  answer_sources:
  - process_creation
- question: What exactly did the spawned child process do? Decode its full command line.
  context: The child is the payload's first observable action, and its arguments state the operation
    directly — a written file path, a fetched location, an encoded block, an interpreter one-liner,
    or a credential-dumping target. Decode every flag and any encoded content, and read the working
    directory, which for code running in the service context frequently sits under the Exchange
    installation tree rather than a user profile.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: Did the Unified Messaging service log an application error on this host around the time of the spawn?
  context: Deserialization of a malformed object typically leaves an error entry from the Unified
    Messaging provider in the Application log, and a cast exception in the message text is the
    signature of the payload being rehydrated into an unexpected type. An error entry alongside the
    spawn corroborates that the child came out of exploitation rather than out of normal service
    work; its absence does not clear the alert, because code that deserializes cleanly leaves no
    error. If the Application channel is not collected in this environment, treat an empty result as
    a visibility gap.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      service: application
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Provider_Name|contains: 'MSExchange Unified Messaging'
      condition: selection
    fields:
      - Provider_Name
      - EventID
      - Data
  answer_sources:
  - manual_review
- question: What other child processes did this same Unified Messaging worker instance spawn?
  context: Code running in the service context normally proceeds in stages — a first child
    establishes execution, later ones stage tooling, collect data, or open a channel outward. Listing
    every child of this exact worker instance shows whether the alerting process was isolated or one
    step of a sequence. Command interpreters and script hosts (powershell.exe, cmd.exe, wscript.exe,
    mshta.exe, rundll32.exe, regsvr32.exe, msiexec.exe, curl.exe) rarely belong under this parent at
    all and are the entries to read first.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What files did the spawned process write, and where do those paths sit?
  context: The stage after execution in the service context is usually a file drop, and the
    destination is the discriminator. Writes into web-accessible directories under the Exchange
    installation or the IIS root leave a reachable script that survives the process, writes into
    ProgramData or the Windows temp tree indicate staging of tooling or collected data, and writes
    into the service's own working directories may be routine. The query is anchored on the process
    rather than on a path list so nothing the process wrote is filtered out.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetFilename
  answer_sources:
  - file_event
- question: Did the spawned process make outbound network connections?
  context: Execution reached through a server-side flaw is commonly followed within minutes by a
    connection outward to retrieve tooling or open a channel back. Read the destination addresses and
    ports against what this server is expected to talk to — an Exchange host has a narrow and
    well-known egress profile, so anything outside the update and mail paths already in the
    environment's allowed destinations is worth resolving. No result here does not clear the alert;
    it moves the question to what the process wrote locally.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
- question: Has the Unified Messaging worker on this host ever spawned this child binary before?
  context: This pairing is the investigative core of the alert, and its 90-day history is what
    separates a novel lineage from an installed behavior. A count of zero means the worker has never
    launched this binary on this host. A steady historical count points at a management agent,
    monitoring probe, or backup component that attaches to the service and has simply never been
    excluded from the rule — check the returned command lines for the consistent argument pattern
    that identifies such a component.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Has this account previously produced the rule's pattern, and does that history fit what the account is for?
  context: The query mirrors the rule's selection structure scoped to the alerting account, so the
    result is that account's 90-day history of this specific pattern rather than generic activity.
    On an Exchange server the Unified Messaging worker runs under a service identity, so an account
    with no prior history here is the deviation worth chasing, while a long history points to a
    component that has always behaved this way.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \UMWorkerProcess.exe
      filter:
        Image|endswith:
        - wermgr.exe
        - WerFault.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Has this parent process historically driven the rule's pattern on this host or across the environment, or is the parent new for this activity?
  context: When the alert fires under a service identity, the account name attributes nothing — the
    launch mechanism does. The query mirrors the rule's selection structure scoped to the alerting
    parent, so the result is the 90-day history of the Unified Messaging worker driving this pattern.
    A parent that already accounts for a large volume of prior events is an installed component
    attaching to the service; a parent with little or no history for this pattern is the deviation.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \UMWorkerProcess.exe
      filter:
        Image|endswith:
        - wermgr.exe
        - WerFault.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What else did this account do across the environment around this time?
  context: Tracking the account's activity on every host in the alert window reveals whether the
    identity was used beyond this server. If the alert fired under a service identity that exists on
    every host, this returns routine agent activity in volume and the parent-scoped view is the
    meaningful one; if it fired under a named or administrative account, the same account appearing
    on other hosts in the window widens the investigation immediately.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: Under a service identity, asking what else the account did returns agent telemetry from
    every host. The useful question is whether the same launch mechanism fired elsewhere, so the
    query mirrors the rule's selection structure scoped to the alerting parent, fleet-wide, in the
    alert window. Several Exchange servers producing the pattern at once points at a sweep against
    the role or at pushed automation; a single host points at a host-local trigger.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \UMWorkerProcess.exe
      filter:
        Image|endswith:
        - wermgr.exe
        - WerFault.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: The 15 minutes either side of the spawn carry what led to it and what followed. Aggregating
    process activity by image and parent collapses the server's steady background into single
    high-count rows and leaves novel parent-child pairs standing out at low counts — which is what to
    scan for. On an Exchange server, other web or service processes spawning interpreters in the same
    window indicates the service context was reached by more than one route.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: Server-side exploitation is usually one step in a sequence. Earlier detections on the same
    host — web-directory script writes, credential access against the local process memory, archive
    staging, or reconnaissance — reconstruct what preceded the spawn and indicate whether the service
    context had already been reached before this rule fired.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
