name: Axios NPM Compromise File Creation Indicators - Windows
id: bb096e95-124d-4d61-84e2-7edbea6364ed
description: |
  Detects file creation events tied to a known npm supply-chain compromise, where a trojanized transitive
  package dependency runs a postinstall dropper during installation. The rule fires when node.exe or
  powershell.exe writes one of the dropper's fixed Windows artifacts: a renamed PowerShell copy at
  C:\ProgramData\wt.exe, a persistence batch file at C:\ProgramData\system.bat, or the staging scripts
  6202033.vbs and 6202033.ps1 under a user AppData\Local\Temp path. Both the writing process AND the
  target path must match, so a hit means the install-time dropper reached its file-drop stage on this host.
  Investigation should confirm the artifact and writer, decode the dropper chain, check whether the files
  self-deleted, and pivot to first-run execution, egress, and Run-key persistence to gauge whether the
  stage-2 RAT actually ran.
type: detection
detection_id: cd6386fa-bb9a-4b67-b006-786b6ab5d2ba
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Do the dropped file path and the creating process match what this rule detects?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires only when node.exe or
    powershell.exe creates one of the dropper's fixed paths (C:\ProgramData\wt.exe,
    C:\ProgramData\system.bat, or a Temp\6202033.vbs / Temp\6202033.ps1 under a user profile). Both
    halves must hold, so verify the exact TargetFilename and the responsible Image against those criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to drop executables and scripts into ProgramData or a Temp path?
  context: >-
    Executables and batch files written into C:\ProgramData, and scripts staged under AppData\Local\Temp,
    have a small set of processes that legitimately do so. Judge the writing process and host role against
    known software-deployment and admin activity. When the recorded user is a machine or service account,
    weigh the writer and host function rather than the account name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What invoked the writing process, and does the parent chain look like a package install?
  context: >-
    This drop happens during an npm install when a compromised package's postinstall hook runs node.exe.
    Read the parent Image and ParentCommandLine to see whether node.exe was launched by an npm or install
    workflow, a build agent, or a developer shell. That parentage identifies which project or install
    pulled in the trojanized dependency and where else it may be present.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: What is inside the dropped file? Check for the C2 URL, XOR or base64 obfuscation, and execution cradle.
  context: >-
    Retrieve and read the dropped artifact. The staging VBScript launches a hidden command interpreter that
    curls a stage-2 PowerShell payload and runs it with an execution-policy bypass; the batch file re-fetches
    and executes code from a memory-only cradle each boot. Look for the C2 host and port, base64 or
    XOR-obfuscated strings, and any scriptblock create-and-invoke pattern that indicates fileless execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What was the full command line of the writing process, and what download-and-run cradle does it contain?
  context: >-
    The writing process is node.exe or a PowerShell instance that stages the dropper chain. Decode its full
    command line for the download-and-execute cradle. Watch for an execution-policy bypass and hidden window
    flag, a curl POST that retrieves a remote script, and a scriptblock create-and-invoke that runs the
    fetched content in memory without writing a further file.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the dropped file still on disk, or was it deleted or renamed shortly after creation?
  context: >-
    The dropper self-erases its staging scripts and rewrites package metadata to frustrate responders, so a
    deletion within seconds of creation is the expected cleanup signature rather than a benign temp file. A
    file still on disk can be retrieved, hashed, and analyzed; a fast deletion shifts the investigation to
    what executed in the interval and to recovery from shadow copies or backups.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: If the dropped artifact executed, what is its hash and does it have known threat-intel detections?
  context: >-
    File-creation events carry no hash; the hash is recorded when the artifact runs. This query looks for the
    dropped file executing and reads its hash. The renamed PowerShell copy is a legitimate signed binary
    relocated under a deceptive name, so treat a clean signature as expected and pivot on path and behavior;
    submit the staging-script and payload hashes to threat intel to confirm whether they are known malicious.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
- question: What child processes did the writing process spawn after the file drop?
  context: >-
    First-run execution is where a supply-chain drop turns into an active RAT. The dropper chain typically
    runs a command interpreter that locates PowerShell, launches cscript against the staged VBScript, curls a
    stage-2 payload, and executes it through the renamed binary. Enumerate the children of the writing process
    to see whether that download-and-run sequence proceeded or stopped at the file drop.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Do processes running from ProgramData load PowerShell or .NET runtime modules, and are those modules signed?
  context: >-
    The dropper copies the real PowerShell binary to C:\ProgramData\wt.exe to masquerade as a terminal app.
    An image running from ProgramData that loads the PowerShell automation assembly or the .NET runtime
    confirms it is a relocated interpreter rather than an installed application. Review the loaded modules and
    their signing status; unsigned or abnormally signed modules loaded by a ProgramData binary is the
    module-and-signature anomaly this supply-chain pattern produces.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|contains: '\ProgramData\'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
- question: Did this host connect out to the command-and-control endpoint shortly after the file drop?
  context: >-
    The supply-chain chain writes its artifacts, spawns first-run children, and then beacons out to attacker
    infrastructure, typically within a short window after install. Look for egress from this host to the known
    C2 address 142.11.206.73 or to any destination on port 8000 in the time around the alert. A connection
    correlating with the file drop confirms the dropper reached its network stage and the stage-2 RAT is
    likely active. Adjust the correlation window for staged rollouts.
  range: +2h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_c2:
      - DestinationIp: '142.11.206.73'
      - DestinationPort: 8000
      condition: selection_host and selection_c2
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
      - Image
- question: Was a Run-key persistence entry created on this host pointing at a ProgramData batch file?
  context: >-
    The stage-2 RAT persists by registering a CurrentVersion\Run value named MicrosoftUpdate that points at
    C:\ProgramData\system.bat, which re-fetches the payload from C2 memory at each boot. Review recent Run-key
    modifications on this host and their value data. A Run entry referencing a ProgramData batch or the renamed
    ProgramData binary is the persistence stage of this compromise.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\CurrentVersion\Run\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Were PowerShell security controls bypassed or weakened around this activity?
  context: >-
    The dropper runs its stage-2 PowerShell with an execution-policy bypass and a hidden window, and RATs of
    this kind often disable logging or antimalware scanning before running. Finding an execution-policy bypass,
    an AMSI patch, a downgrade to an older engine version, or realtime-monitoring changes on this host near the
    alert strengthens the case that the dropped scripts executed maliciously.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the deobfuscated stage-2 script content?
  context: >-
    Script block logging records the deobfuscated script PowerShell actually executes, even when the launcher
    curls the payload and runs it from memory with no file written for the final stage. It is the ground truth
    for what the stage-2 cradle ran. If PowerShell operational logs are not ingested in this environment, treat
    zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A dropper rarely writes a single file. The same process that dropped this artifact commonly stages several
    others in sequence, then deletes its own staging scripts. Enumerating the writer's other file activity, and
    that of its direct children, reveals the full set of dropped artifacts and cleanup deletions that need
    review rather than this one path in isolation.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to ProgramData recently, and by which processes?
  context: >-
    Executables and batch files in C:\ProgramData come from a small set of installers and services. Other recent
    arrivals in that directory reveal whether this drop is isolated or the location is under active use for
    staging, and which additional artifacts belong to the same activity. A single unfamiliar writer touching
    several files in ProgramData is the signal to follow.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\ProgramData\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did this same detection fire on other hosts, indicating how widely the compromised package spread?
  context: >-
    A poisoned package installs wherever the dependency is pulled, so one host firing this rule usually means
    others did too. Correlating this detection across hosts shows how many systems installed the trojanized
    dependency and need the same first-run, egress, and persistence checks, and helps scope remediation and
    version pinning across the environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- always_include: true
  question: Has this user previously produced this drop pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's full selection scoped to the recorded user, returning that user's 90-day
    history of this specific drop pattern aggregated by host, not generic use of node.exe or powershell.exe.
    A user who has never produced this pattern is more suspicious than one who does so regularly. Weigh the
    count against the user's role, and when the account is a machine or service principal, rely on the
    parent-process history instead.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_img:
        Image|endswith:
        - \node.exe
        - \powershell.exe
      selection_fils:
      - TargetFilename:
        - C:\ProgramData\wt.exe
        - C:\ProgramData\system.bat
      - TargetFilename|contains|all:
        - C:\Users\
        - \AppData\Local\Temp\6202033.vbs
      - TargetFilename|contains|all:
        - C:\Users\
        - \AppData\Local\Temp\6202033.ps1
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has the alerting program historically driven this drop pattern, or is the program new for this activity?
  context: >-
    When the alert fires under a machine or service account, user identity does not attribute behavior, so the
    meaningful pivot is the launch mechanism. This query mirrors the rule's full selection scoped to the alerting
    program, returning the 90-day history of that program driving this specific drop pattern aggregated by
    host. A new or rare program for this pattern is the deviation worth chasing; a program already accounting for
    many prior events is routine software automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_img:
        Image|endswith:
        - \node.exe
        - \powershell.exe
      selection_fils:
      - TargetFilename:
        - C:\ProgramData\wt.exe
        - C:\ProgramData\system.bat
      - TargetFilename|contains|all:
        - C:\Users\
        - \AppData\Local\Temp\6202033.vbs
      - TargetFilename|contains|all:
        - C:\Users\
        - \AppData\Local\Temp\6202033.ps1
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
