name: Lolbin Runexehelper Use As Proxy
id: ae632243-8984-4a0f-989f-dab35c5dda9f
description: |
  Detects a process whose parent image ends in runexehelper.exe, a Microsoft-signed Windows utility that
  duplicates the calling thread's token and launches the executable named in its first argument via
  CreateProcessAsUser, redirecting that program's output to a file. Because runexehelper is a trusted signed
  binary, an attacker can use it as a proxy launcher to run an arbitrary executable while the visible parent
  remains a legitimate system tool, breaking the expected parent-child lineage of the payload. Legitimate use
  of this binary is rare, so the investigation should identify the spawned child executable, confirm what it
  is and what it did, determine what launched runexehelper itself, and establish whether the user, host, and
  spawning context fit a benign explanation or trusted-binary proxy execution.
type: detection
detection_id: cd71385d-fd9b-4691-9b98-2b1f7e508714
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- question: Does the parent image of the alerting process end in runexehelper.exe?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when a
    process is spawned by a parent whose image path ends in runexehelper.exe. Read the full ParentImage and
    confirm the parent is runexehelper.exe rather than an unrelated binary with a similar name. The alerting
    process itself is the child runexehelper launched — that child is the proxied payload.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: Is this user and host expected to launch executables through runexehelper.exe?
  context: Legitimate use of runexehelper.exe as a launcher is uncommon, so administrative or developer activity
    that explains it is the exception rather than the rule. Knowing whether the user role and host function fit
    running arbitrary executables through a trusted proxy binary is often the fastest path to distinguishing a
    rare-but-benign invocation from proxy execution. Activity under a standard user points toward user-initiated
    execution; activity under an elevated or service context shifts the interpretation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What launched runexehelper.exe, and what was its full command line?
  context: runexehelper.exe takes the executable to run as its first argument, so its own command line names the
    proxied payload and its path directly. Retrieving runexehelper's process_creation event also reveals the
    grandparent that started it — for example a script host, a shell, or a scheduled-task host — which shows how
    the proxy launch was initiated. A grandparent such as cmd.exe, powershell.exe, wscript.exe, or an Office
    application points toward operator-driven or macro-driven invocation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: What exactly did the proxied child process do? Decode its command-line arguments.
  context: The child launched through runexehelper.exe is the executable the proxy was used to run. Decode its
    full command line for flags, encoded content, file paths, or URLs that reveal the operation it carried out.
    A URL, IP address, or script path in the arguments indicates download or follow-on execution; matching the
    arguments against suspicious-argument patterns (remote URLs, script paths, DLL entrypoints) helps separate a
    benign relocated tool from a payload run under a trusted-binary cover.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What is the actual identity of the child executable that runexehelper launched?
  context: The proxied child is the payload the trusted binary was used to run. Comparing the Image path against
    OriginalFileName reveals whether the child is a renamed tool, and the signing details indicate whether it is
    a Microsoft-signed system binary, a third-party signed tool, or unsigned. Proxy execution through a signed
    launcher is most concerning when the child itself is unsigned or runs from a user-writable directory such as
    %TEMP%, AppData, or a download folder; a Microsoft-signed child from System32 is more consistent with a known
    binary list of allowed executables. The file hash enables a reputation lookup to determine whether this is a
    known-good tool, known malware, or a novel binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: Did the child executable launched through runexehelper.exe make outbound network connections?
  context: System binary proxy execution is frequently used to run a downloader or a payload that beacons to an
    external host. Outbound connections from the proxied child — especially to external IP addresses or to
    destinations outside the organization's known enterprise domains — indicate command-and-control or payload
    retrieval. Connections only to internal infrastructure or known-good update endpoints are more consistent
    with routine activity. If network telemetry is not collected for this host, treat zero results as a
    visibility gap rather than evidence nothing connected.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: What other child processes did runexehelper.exe spawn?
  context: A proxy launcher may be used more than once to run several executables in sequence — for example a
    downloader followed by the payload it retrieved. Seeing every child of runexehelper.exe on this host reveals
    the full scope of activity initiated through the proxy rather than only the one process that tripped the
    alert.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What process activity occurred around runexehelper.exe at the same time?
  context: Beyond its direct children, the activity surrounding the proxy launch helps reconstruct what set it in
    motion and what followed. Examining process activity tied to runexehelper.exe in a tight window around the
    alert can surface the staging of the proxied executable, related shell or script-host activity, or follow-on
    tools run shortly after.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has runexehelper.exe spawned this child binary on this host before?
  context: A parent-child pairing that has never been seen on the host is more suspicious than a recurring one.
    Because runexehelper.exe is rarely used as a launcher in normal operations, almost any historical match is
    itself notable; a zero or very low count confirms this is a novel proxy-launch relationship rather than an
    established workflow, while a recurring pair points to vendor or administrative automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \runexehelper.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \runexehelper.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the proxy execution was an isolated event
    or part of broader hands-on activity. If the same user triggered similar activity on multiple endpoints in the
    same window, the scope of the incident may be larger than one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \runexehelper.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Is runexehelper.exe spawning this binary on other hosts?
  context: The same proxy-launch pairing appearing across multiple hosts may indicate a scripted deployment or a
    distribution pattern, while a single occurrence is more likely targeted. An environment-wide comparison helps
    calibrate severity and identify the scope of the activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context —
    what led to this execution and what happened after. Aggregating by Image and ParentImage collapses repetitive
    agent telemetry while novel parent-child pairs stand out at low counts, which is what distinguishes the proxy
    execution chain from background noise.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — reconnaissance, defense tampering, or credential access — may
    reveal the stages that preceded this proxy execution and help reconstruct the timeline. Defense tampering or
    credential access followed by execution is a common ordering; the absence of prior alerts is consistent with
    this being an early step in the activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
