name: Renamed SysInternals DebugView Execution
id: c1cb20e2-1870-47c7-a52f-bbd62c78330d
description: |
  Detects a process whose PE metadata identifies it as Sysinternals DebugView (Product field reads "Sysinternals DebugView") while the file on disk is NOT the canonical Dbgview.exe — the rule fires when the Product matches AND the legitimate combination of OriginalFileName Dbgview.exe and an Image ending in \Dbgview.exe does NOT match. This pattern surfaces a DebugView-branded binary running under a different filename, which can be a legitimate copy that was renamed for convenience or a payload wrapped in DebugView PE metadata to blend in. The investigation should establish the binary's true identity from its metadata and hash, how it arrived, what it did after execution, and whether the same artifact appears elsewhere in the environment.
type: detection
detection_id: cd764533-2e07-40d6-a718-cfeec7f2da7f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the running binary carry Sysinternals DebugView metadata while running under a non-Dbgview.exe filename?
  context: Confirm the alert is a true positive before investing investigation time. The rule fires when the process Product is Sysinternals DebugView but the file is not the canonical Dbgview.exe (OriginalFileName Dbgview.exe with an Image path ending in \Dbgview.exe). Review the Product value alongside the OriginalFileName and Image path shown on the triggering event to verify the metadata-versus-filename mismatch is real and not a truncated or misparsed field.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Product
- question: Is this user and host expected to run Sysinternals diagnostic tooling like DebugView?
  context: Legitimate administrative and developer activity can trigger this detection — DebugView is a standard debugging utility, and renaming the executable is common for portable toolkits. Knowing whether the user role and host function involve low-level debugging or driver work is often the fastest way to separate routine use from a metadata-spoofed payload.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the actual identity of this binary based on its metadata and hash?
  context: The file is named something other than Dbgview.exe but its PE metadata reports Sysinternals DebugView. Compare the Image path (the name on disk) against OriginalFileName (embedded metadata), then check the signing party and signature status — a genuine DebugView copy is signed by Microsoft, while a payload wearing DebugView metadata is typically unsigned or carries an inconsistent or invalid signature. Submit the file hash for reputation lookup to determine whether this is a known-good tool, a known-bad sample, or a novel binary needing deeper analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: How did this renamed DebugView-branded binary arrive on the host?
  context: A renamed binary does not appear spontaneously — it was copied, downloaded, extracted from an archive, or dropped by a parent process. Tracing the file creation event by basename over a long window reveals the delivery mechanism and the process that wrote it. A user-writable landing spot such as Downloads, Temp, or AppData points to download or extraction; a system directory points to either an installer or compromise of a privileged process.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What did this DebugView-branded binary do? Decode its full command line.
  context: The full command line reveals the specific action taken. Decode any flags, parameters, file paths, or URLs passed to the binary. Genuine DebugView is typically launched interactively with few or no arguments; a payload wearing its metadata may carry installation flags, output paths, or network indicators that reveal its real purpose.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this binary and is that parent chain expected?
  context: The parent process reveals how the binary was invoked. Interactive launches under explorer.exe fit normal tool use; parents such as script hosts, Office applications, archive utilities, or remote-execution tooling suggest the binary was launched as a stage in an automated or hands-on-keyboard operation rather than by an administrator opening a debugger.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What did this binary do after execution, and is the same renamed binary present on other hosts?
  context: The point of renaming a binary is to perform its function while evading name-based detection. Examining the child processes spawned by this binary reveals its actual objective — credential access, reconnaissance, or lateral movement would all surface as descendant processes. The same renamed, DebugView-branded binary appearing on multiple hosts points to deliberate distribution rather than an isolated copy.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run a binary at this path with DebugView metadata?
  context: A binary path that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low historical counts at this Image path indicate first-time or rare execution and raise the priority of identifying the binary's true origin.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the renamed-DebugView pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even legitimate renamed tooling produces a stable pattern over time. This query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how the rule's specific firing pattern — not generic DebugView usage — has historically run here. A new parent process, an unexpected user account, or an unusual launch pattern is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Product: Sysinternals DebugView
      filter:
        OriginalFileName: Dbgview.exe
        Image|endswith: \Dbgview.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Product: Sysinternals DebugView
      filter:
        OriginalFileName: Dbgview.exe
        Image|endswith: \Dbgview.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Product: Sysinternals DebugView
      filter:
        OriginalFileName: Dbgview.exe
        Image|endswith: \Dbgview.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity on more than one host, the scope of the incident may be larger than the single alert suggests.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Product: Sysinternals DebugView
      filter:
        OriginalFileName: Dbgview.exe
        Image|endswith: \Dbgview.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding this event reveals what led up to it and what followed, and whether it is part of a larger sequence. Aggregating by Image and ParentImage collapses repetitive telemetry into high-count rows while novel parent-child pairs stand out at low counts — those low-count pairs are what the analyst is scanning for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the stages that preceded this event and help reconstruct the timeline. Renamed tooling is often a mid-chain artifact, so a preceding alert can pin down how the operator reached this point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired the renamed-DebugView pattern in the past week, and does the cross-host spread look like automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the rule's firing pattern rather than generic DebugView usage. Many hosts firing the same pattern points to scripted deployment or vendor automation that renames the binary; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Product: Sysinternals DebugView
      filter:
        OriginalFileName: Dbgview.exe
        Image|endswith: \Dbgview.exe
      condition: selection and not filter
    fields:
    - host.name
