name: Suspicious File Creation Activity From Fake Recycle.Bin Folder
id: 0ee86451-0bbf-427b-9915-093657651f5d
description: |
  Detects a file being written into, or by a process running from, a folder named RECYCLER.BIN or RECYCLERS.BIN. The legitimate Windows recycle bin is $Recycle.Bin; a folder named RECYCLER.BIN or RECYCLERS.BIN is not a system location and is a known staging and hiding spot for malware. This staging pattern typically drops a signed legitimate executable, a malicious DLL loaded by side-loading, and an encrypted payload together, often spread through removable media, and running a process from the fake recycle bin evades casual filesystem inspection. Investigation should identify what was written, which process wrote it, whether the artifact later executed, and whether the same folder pattern appears on other hosts.
type: detection
detection_id: cd8b36ac-8e4a-4c2f-a402-a29b8fbd5bca
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the file path or the writing process path match the fake recycle bin pattern this rule detects?
  context: Confirm the alert is a true positive by reviewing the exact file path and the responsible process. The rule fires when a file is written into a folder named RECYCLER.BIN or RECYCLERS.BIN, or when the writing process itself runs from such a folder. The legitimate Windows recycle bin is $Recycle.Bin; a folder named RECYCLER.BIN or RECYCLERS.BIN is not a system location.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to write files into a recycle-bin-named folder?
  context: Legitimate software does not create or write to folders named RECYCLER.BIN or RECYCLERS.BIN. Knowing whether the user role and host function involve anything resembling this activity is often the fastest way to separate a true positive from an unusual but benign event. When the responsible account is a machine or service account, judge by the writing process and host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What process wrote this file, and what was its full command line and working directory?
  context: The file event records the responsible process's identifier; pivoting to that process's execution reveals its command line, its parent, and the directory it ran from. A writing process that is itself running from a RECYCLER.BIN or RECYCLERS.BIN folder reflects execution from the fake recycle bin, a hiding technique. A signed legitimate binary writing there may be side-loading a malicious DLL staged alongside it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
      - ParentImage
- question: What file was written to the fake recycle bin folder, and is it an executable, DLL, or encrypted payload?
  context: This staging pattern typically drops a set of files together - a signed legitimate executable, a malicious DLL loaded by side-loading, and an encrypted data file that the DLL decrypts to shellcode in memory. Identify the written file's type and, where possible, retrieve and inspect its content for obfuscation, embedded strings, or known indicators. Retrieving the actual bytes requires pulling the file from the endpoint.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If the dropped file later executed, what is its hash and does it have known threat intel detections?
  context: File-creation events carry no hash; the hash is recorded when the file runs. This query looks for the artifact executing by its filename and reads its hash so it can be checked against reputation and threat intelligence to determine whether it is known malicious, benign, or previously unseen. If the file is present but has not executed, retrieve it from its on-disk path and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
- question: Is the file still on disk, or was it deleted or renamed after the alert?
  context: The file's post-alert lifecycle drives both urgency and next steps. A payload still on disk can be retrieved, hashed, and analyzed; a file deleted shortly after creation suggests anti-forensic cleanup or a self-deleting dropper and shifts the focus to what executed in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the responsible process write or delete around the alert?
  context: A dropper that stages one file in a fake recycle bin folder usually drops several together - the legitimate loader executable, the malicious side-load DLL, and the encrypted payload. The breadth, paths, and extensions of the process's other file activity distinguish a single artifact from a full staging set and enumerate what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to the fake recycle bin folder recently, and by which processes?
  context: The folder itself is the signal. Legitimate processes do not write to RECYCLER.BIN or RECYCLERS.BIN folders, so every other file that landed there and every process that wrote one is part of the same activity. Grouping the directory's recent writes by path and writing process reveals the full staging set and whether the location is under active use.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - 'RECYCLER.BIN\'
          - 'RECYCLERS.BIN\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has this file been seen before on this host?
  context: A file appearing for the first time is more suspicious than one that recurs as part of normal operations. Zero or very low historical counts for this path on this host indicate a first-time drop even if the filename seems ordinary.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has this host produced fake recycle bin file activity before, and which programs and users drove it?
  context: The query counts this host's prior file writes matching the fake recycle bin pattern, grouped by the writing program and user account; file events carry no parent lineage, so pivot to the writer's process-creation event if lineage matters. A pattern that has never fired here before, or a new writing program or user account driving it, is the deviation worth chasing; a recurring program and user may point to a benign but unusual local process.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
      - Image|contains:
        - RECYCLERS.BIN\
        - RECYCLER.BIN\
      - TargetFilename|contains:
        - RECYCLERS.BIN\
        - RECYCLER.BIN\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- always_include: true
  question: Has this user produced fake recycle bin file activity before, and does that history fit their role?
  context: The query counts this user's 90-day history of the fake recycle bin write pattern, grouped by host. A user who has never produced this pattern is more suspicious than one who does so routinely; weigh the count against the user's role. When the alert fires under a machine or service account, user identity does not attribute the behavior and the parent-process history is the meaningful pivot.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
      - Image|contains:
        - RECYCLERS.BIN\
        - RECYCLER.BIN\
      - TargetFilename|contains:
        - RECYCLERS.BIN\
        - RECYCLER.BIN\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program driven fake recycle bin file activity before, or is the program new for this pattern?
  context: When the alert fires under a service or machine account, the launch mechanism attributes behavior better than the user. The query counts the alerting program's 90-day history of driving this write pattern, grouped by host. A new or rare program for this pattern is the deviation; a program that already accounts for many prior events points to established local automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
      - Image|contains:
        - RECYCLERS.BIN\
        - RECYCLER.BIN\
      - TargetFilename|contains:
        - RECYCLERS.BIN\
        - RECYCLER.BIN\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the environment around the time of the alert?
  context: Tracking the account's activity across all hosts in a tight window reveals whether the staging is isolated or part of movement across multiple endpoints. If the same account produced related activity on several hosts, the scope may be larger than a single drop.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window, or is it isolated to this host?
  context: Under a service or machine account, an account-wide pivot returns agent-telemetry noise. Whether the same launch mechanism produced the fake recycle bin pattern elsewhere in the alert window is the meaningful question - multiple hosts point to pushed or scheduled automation or to removable-media spread, a single host points to a local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
      - Image|contains:
        - RECYCLERS.BIN\
        - RECYCLER.BIN\
      - TargetFilename|contains:
        - RECYCLERS.BIN\
        - RECYCLER.BIN\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Have other hosts shown fake recycle bin file activity in the past week?
  context: The query counts the fake recycle bin write pattern fleet-wide with no host scope. This staging technique spreads through removable media, so the same folder pattern appearing on several hosts points to propagation or a coordinated drop rather than a one-off; the host distribution calibrates the scope of the response.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
      - Image|contains:
        - RECYCLERS.BIN\
        - RECYCLER.BIN\
      - TargetFilename|contains:
        - RECYCLERS.BIN\
        - RECYCLER.BIN\
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Staging a payload is one step in a longer sequence. Earlier detections on the same host - removable-media activity, execution of a signed loader, or reconnaissance - may reveal how the files arrived and what has already run.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were files dropped to persistence locations such as the Startup folder or scheduled-task definition paths on this host?
  context: File-based persistence bypasses command-line detection entirely. After staging a payload, this activity commonly establishes persistence by dropping an executable or script into a Startup folder or a path referenced by a registry Run key. File event monitoring captures these drops even when standard persistence tools are avoided.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Does the user or an administrator recall creating these files or this folder?
  context: Direct confirmation from the person behind the account is often the fastest way to establish legitimacy. Almost no legitimate workflow creates a folder named RECYCLER.BIN or RECYCLERS.BIN; if no one recalls the activity, treat the account as potentially compromised or the process as automated malware. If they do recall it, get context on why.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
