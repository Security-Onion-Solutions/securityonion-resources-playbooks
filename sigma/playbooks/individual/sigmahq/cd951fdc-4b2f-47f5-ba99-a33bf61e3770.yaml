      condition: (1 of selection_image_* and selection_user and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the surrounding activity reveals what led to the elevated install and what followed — reconnaissance, additional escalation attempts, or persistence. Aggregating by image and parent collapses repetitive agent noise while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the stages that preceded the elevated install and help reconstruct the timeline. A privilege-escalation primitive is frequently one step in a longer sequence rather than a standalone event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
