name: Potential DLL Sideloading Of MsCorSvc.DLL
id: ac81e94d-17de-470c-9c1b-00973fb4cbbe
description: |
  Detects a module named mscorsvc.dll being loaded from a path that does NOT begin with the
  legitimate .NET Framework directories (C:\Windows\Microsoft.NET\Framework*, WinSxS), which is
  consistent with DLL search-order hijacking or phantom DLL hijacking of a signed .NET component.
  Legitimately, applications load their own bundled copy of this DLL from a Framework path; when the
  same name loads from a user-writable or application directory, an attacker may have placed a
  malicious mscorsvc.dll alongside a copied trusted executable so the payload executes under a
  signed, allow-listed process. Investigation should establish where the DLL loaded from, whether it
  is validly signed, which executable loaded it, and whether that executable is running from an
  unexpected location.
type: detection
detection_id: cdb15e19-c2d0-432a-928e-e49c8c60dcf2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the loaded module match what this rule detects — path, signature, and loading process?
  context: Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded), its
    code-signature status, and the process that loaded it. The rule fires when a module ending in
    mscorsvc.dll loads AND its path does not begin with the legitimate .NET Framework directories
    (C:\Windows\Microsoft.NET\Framework*, WinSxS). A load from a user-writable or application
    directory is the side-loading pattern; a genuinely-signed Microsoft copy staged by an installer
    may still be benign. DLL loads carry a hash and signing status on the load event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this user and host expected to run the executable that loaded this .NET component?
  context: Legitimate .NET applications and system components load mscorsvc.dll routinely. Knowing
    whether the user role and host function are consistent with running the loading executable is
    often the fastest path to distinguishing a routine .NET application from a relocated trusted
    binary being abused for side-loading.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What modules did the loading process pull in, and are any from non-canonical paths, unsigned, or from user-writable directories?
  context: 'The full set of modules a process loads exposes the side-loading story when the DLL name
    alone is ambiguous. Look for: (1) modules loaded from AppData, ProgramData, Public, or a program
    install directory rather than the system path expected for that name; (2) unsigned modules where
    signed ones are expected; (3) system or framework DLL names loaded from non-system paths, which is
    the search-order hijacking pattern. Enumerating every module the process loaded shows whether
    mscorsvc.dll was the only relocated component or one of several.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For the loaded mscorsvc.dll, what is its signing status, hash, and threat-intel reputation?
  context: Module reputation separates a routine .NET Framework DLL from a side-loaded malicious one.
    A validly signed Microsoft copy loaded from an unexpected location may still be legitimate; an
    unsigned or invalidly-signed file using this Microsoft DLL name is a strong masquerading
    indicator. SignatureStatus values to weigh are Valid (probably benign), Unsigned, Expired,
    Distrusted, and Invalid (tampered). The Hashes value supports a hash lookup against threat
    intelligence and a comparison to the known-good baseline hash of the legitimate DLL to detect
    substitution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: From what directory did mscorsvc.dll load, and does it fall outside the legitimate .NET Framework and WinSxS paths?
  context: The load path is the decisive signal for this technique. The legitimate DLL lives under
    C:\Windows\Microsoft.NET\Framework, Framework64, FrameworkArm, FrameworkArm64, or WinSxS; a load
    from anywhere else means a copy was staged for search-order or phantom hijacking. Re-running the
    detection across the host over a window shows every anomalous load of this name and the executable
    that loaded each one, which distinguishes a single incident from repeated staging.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith: '\mscorsvc.dll'
      filter_main_generic:
        ImageLoaded|startswith:
          - 'C:\Windows\Microsoft.NET\Framework\'
          - 'C:\Windows\Microsoft.NET\Framework64\'
          - 'C:\Windows\Microsoft.NET\FrameworkArm\'
          - 'C:\Windows\Microsoft.NET\FrameworkArm64\'
          - 'C:\Windows\WinSxS\'
      condition: selection and not filter_main_generic
    fields:
      - ImageLoaded
      - Image
      - Signed
      - Signature
      - SignatureStatus
- question: What is the loading executable's command line and working directory, and is it running from an unexpected location?
  context: Classic side-loading copies a signed executable into a user-writable directory next to a
    malicious DLL so the DLL loads under the trusted process. The working directory and full path of
    the loading executable are the tell — a legitimate .NET application runs from Program Files or a
    system path, while a relocated copy runs from AppData, a temp folder, or a download directory.
    Reviewing the command line also shows what the process was actually doing when the load occurred.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned the executable that loaded mscorsvc.dll, and is that parent chain expected?
  context: The parent process reveals how the loading executable was launched. A legitimate .NET
    component is typically started by services.exe, explorer.exe, or a known application launcher.
    Unusual parents such as a scripting host, an Office application, or an unfamiliar dropper suggest
    the trusted binary was placed and invoked to trigger the side-load rather than run in its normal
    context.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Is the loaded mscorsvc.dll still on disk for analysis?
  context: If the DLL and the copied host executable remain on disk, they can be hashed, submitted to
    a sandbox, and compared against the known-good Microsoft binary. Correlating file writes to the
    loading process and its direct children shows whether this process staged the DLL itself or merely
    loaded a file placed earlier by another process.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has mscorsvc.dll been loaded on this host before, and under which processes?
  context: A first-time load of this module from this path is a stronger anomaly than a recurring one.
    If the same DLL has been loaded by the same executable repeatedly over the past 90 days from the
    same location, the current load is probably routine. If this is the first occurrence, or the DLL
    has historically loaded only under entirely different processes, the current load is anomalous.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Is mscorsvc.dll being loaded on other hosts, especially under unexpected loading processes?
  context: Cross-host correlation surfaces deployment scope. The same DLL name loading from a
    non-standard path across multiple hosts points to distribution of a staged payload or a shared
    build artifact rather than a localized incident. Pay attention to the variety of loading
    processes, since the same DLL loaded by unexpected executables on other hosts suggests the
    side-loading is being reused across the environment.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Were registry keys that govern DLL search order, image execution, or .NET behavior modified on this host around the alert?
  context: Search-order hijacking can be established or persisted through the registry as well as
    through file placement — for example changes to the KnownDLLs list, App Paths entries for the
    loading executable, Image File Execution Options, or .NET Framework configuration keys.
    Modifications to these keys near the time of the load can explain how the abnormal module path was
    reached and whether persistence was configured alongside the side-load.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\Session Manager\KnownDLLs'
          - '\CurrentVersion\App Paths\'
          - '\Image File Execution Options\'
          - '\Microsoft\.NETFramework'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the load reveals the immediate
    context: what staged or launched the loading executable, what ran afterward, and whether the load
    is one step in a longer sequence. Look for reconnaissance, privilege escalation, or additional
    persistence in the same window, and for the file writes that placed the DLL.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential
    access — may reveal the stages that preceded the side-load and help reconstruct the timeline.
    Staged execution under a trusted process is often preceded by the delivery and setup steps that
    put the executable and DLL in place.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was there a change ticket, maintenance window, or documented approval for deploying or updating this application?
  context: Installs and updates of legitimate .NET software can place and load their own copies of
    framework DLLs. A corresponding change ticket or maintenance window suggests the load followed an
    authorized deployment; the absence of one where policy requires it suggests the executable and DLL
    were staged outside normal channels.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the user or administrator recall installing or running the application that loaded this component?
  context: Direct confirmation from the person behind the account is often the fastest path to a
    verdict. If the user does not recall installing or launching the loading executable, the binary
    may have been dropped by malware or an unauthorized process. If they do recall it, capture what
    they were doing and why the application ran from that location.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: Side-loading gives an attacker code execution under a trusted process; a foothold is
    commonly backed up with additional persistence installed through different techniques — scheduled
    tasks, services, registry Run keys, BITS jobs, or WMI subscriptions. Multiple persistence
    installations in the same timeframe indicate deliberate stacking rather than isolated
    administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations (Startup folders, scheduled-task definitions) on this host?
  context: File-based persistence bypasses command-line detection entirely. Dropping an executable or
    script into the Startup folder or a path referenced by a registry Run key achieves persistence
    without running scheduling or registry tools. File event monitoring captures these drops even when
    the attacker relies on side-loading for the initial execution.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
