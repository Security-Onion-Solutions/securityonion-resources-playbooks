name: Drop Binaries Into Spool Drivers Color Folder
id: 4f616d88-8cce-43a5-85c1-413b2d387615
description: >-
  Detects the creation of an executable, DLL, or driver file (.exe, .dll, .sys) under
  C:\Windows\System32\spool\drivers\color\. That directory is the Windows color-management
  store and normally holds color-profile data such as .icm and .icc files, not executable
  code, so any binary written there is anomalous regardless of its name. The location is a
  known staging and hiding spot: droppers place trojanized binaries there and later load them
  as DLLs via COM hijack or side-load for persistence and in-memory execution. Investigation
  should confirm the write, identify the process that created the file and its command line,
  determine whether the binary subsequently executed or was loaded, and establish whether the
  file and the responsible process are new to the host and environment.
type: detection
detection_id: ce7066a6-508a-42d3-995b-2952c65dc2ce
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Do the file path and creating process match what this rule detects?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The write
    should be a file whose name ends in .dll, .exe, or .sys landing under
    C:\Windows\System32\spool\drivers\color\. That directory normally holds color-profile
    data (.icm and .icc), not executable code, so a binary written there is anomalous on
    location alone. Review the exact path, the operation performed, and the responsible
    process against the detection criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to write executable files into the color-profile folder?
  context: >-
    Legitimate administrative or installer activity can occasionally touch system directories,
    but the color-profile store is not a normal drop location for executables. Knowing whether
    the responsible user role and host function are consistent with writing a .dll, .exe, or
    .sys there is often the fastest way to separate a true positive from routine operations.
    When the writer is a machine or service account, judge by the writing process and the host
    role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the file still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives both urgency and next steps. A payload still on
    disk can be retrieved, hashed, and analyzed; a file deleted seconds after creation suggests
    anti-forensic cleanup or a self-deleting dropper and shifts the investigation toward what
    executed in between. Interpret the operation type for the same path over the following
    hours.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What is in the binary written to the color-profile folder?
  context: >-
    Retrieve and analyze the file's actual content. For a binary, check imports, embedded
    strings, packer signatures, and signing status; trojanized system DLLs staged in this
    location are often legitimate Windows binaries with sections overwritten by malicious code
    and a patched PE header. This is content analysis and is distinct from hash reputation
    lookup: it answers what is inside the file, retrieved manually from the endpoint or an EDR
    console into a safe environment.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What process wrote this binary, and how was it launched?
  context: >-
    The file event carries the responsible process identifier, so its own creation event
    reveals what the writer is and the full command line it ran under. A sandboxed renderer,
    an Office application, or another exploited process writing an executable into a system
    directory is notable, because these processes have no legitimate reason to stage binaries
    in the color-profile store.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: What launched the process that wrote the file, and is that parent chain expected?
  context: >-
    The parent process reveals how the writing process was invoked. Legitimate usage has
    predictable parent chains; an unusual parent such as a document reader, a script host, or
    an Office application may indicate exploitation or a malicious macro that led to the drop.
    Walk one level up from the writer to see what spawned it and what else that parent
    launched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A process that drops one suspicious file often drops several: a dropper unpacking
    components, a tool staging output, or trojanized binaries placed alongside a loader. The
    breadth, paths, and extensions of the writer's other file activity distinguish a single
    artifact from a multi-file staging operation and enumerate what else needs review. Volume
    alone is not suspicion for a noisy writer; look at where the writes land.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has recently been written to the color-profile folder, and by which processes?
  context: >-
    Location drives suspicion for this artifact. The color-profile store has a very small set
    of processes that legitimately write there, and those writes are color-management data, not
    executables. Other recent arrivals in the same directory reveal whether this is an isolated
    drop or a location under active use, and a single unfamiliar writer across multiple files
    is the signal to chase.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\spool\drivers\color\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If the dropped binary later executed, what is its hash and does it have known detections?
  context: >-
    A file's hash is recorded when it runs, not when it is written, because file-creation events
    carry no hash. This query looks for the artifact executing as a process and reads its hash;
    submit that to threat-intelligence sources to determine whether it is known malicious,
    benign, or previously unseen. A binary that is present but has not executed will not appear
    here, so retrieve it from its on-disk path and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
- question: Was the dropped binary later loaded as a DLL by another process?
  context: >-
    Binaries staged in this folder are frequently loaded as DLLs by a separate host or system
    process through COM hijack or side-load rather than run as a standalone executable. A load
    event records the loading process and the signature state of the loaded module, revealing
    whether the drop progressed from delivery to in-memory execution. A .sys driver would load
    through the driver subsystem rather than appear here; for that case, correlate on the file's
    on-disk presence and subsequent host behavior.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - ImageLoaded
      - Image
      - SignatureStatus
- question: Has this file been seen before on this host?
  context: >-
    A file that has never appeared on a host is more suspicious than one that is part of normal
    operations. First-time appearance of an executable under the color-profile folder should be
    checked even if the file name seems benign; zero or very low historical counts indicate a
    new or unusual artifact.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Is this file present on any other hosts in the environment?
  context: >-
    Finding the same file name in the color-profile folder on multiple hosts may indicate
    lateral movement or deliberate distribution of a staged payload. If the file is only on one
    host, the activity may be targeted; if it appears on many, determine the distribution
    pattern and timeline to size the affected set.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, so the result is the user's
    90-day history of binaries written into the color-profile folder, not generic file
    activity, aggregated by host. A user who has never produced this pattern is more suspicious
    than one who does so regularly; weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|startswith: C:\Windows\System32\spool\drivers\color\
        TargetFilename|endswith:
        - .dll
        - .exe
        - .sys
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this pattern, or is the program new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute behavior;
    the meaningful pivot is the launch mechanism. The query mirrors the rule's selection scoped
    to the alerting program, so the result is the 90-day history of this program driving
    binary drops into the color-profile folder, aggregated by host. A new or rare program for
    this pattern is the deviation worth chasing; a program that already accounts for many prior
    events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|startswith: C:\Windows\System32\spool\drivers\color\
        TargetFilename|endswith:
        - .dll
        - .exe
        - .sys
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or activity spanning
    multiple endpoints. If the same user triggered related activity on other hosts in the same
    window, the scope of compromise may be larger than this single drop.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window, or is it isolated to this host?
  context: >-
    Under a service principal, asking what else the user did across the network returns
    agent-telemetry noise, because every host runs system-owned agents constantly. The
    meaningful question is whether the same launch mechanism produced this pattern elsewhere:
    the query mirrors the rule's selection scoped to the alerting program, fleet-wide, in
    the alert window. Multiple hosts in the same window points to scheduled or pushed
    automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|startswith: C:\Windows\System32\spool\drivers\color\
        TargetFilename|endswith:
        - .dll
        - .exe
        - .sys
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining process activity around the drop reveals what
    led to it and what happened after, and whether it is part of a larger sequence such as
    exploitation, privilege escalation, or persistence setup. Aggregating by process and parent
    collapses repetitive agent noise while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host, such as defense tampering, reconnaissance, or
    credential access, may reveal the attack stages that preceded this drop and help reconstruct
    the timeline. A staged binary is usually a mid-chain artifact, so the alerts that came before
    it often explain how the writer gained the access to place it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
