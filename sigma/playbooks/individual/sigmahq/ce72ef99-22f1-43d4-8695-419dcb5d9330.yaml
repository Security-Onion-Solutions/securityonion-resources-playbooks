- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — credential access, lateral movement, reconnaissance, or other defense tampering — may reveal the stages that preceded this service kill and help reconstruct the intrusion timeline. Service tampering usually sits late in a hands-on intrusion, just before impact, so what came before frames the urgency.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
