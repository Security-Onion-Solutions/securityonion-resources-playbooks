name: InfDefaultInstall.exe .inf Execution
id: 92a6c99c-b163-423f-a705-97fd826c6897
description: |
  Detects InfDefaultInstall.exe being run against a .inf file, identified by a command line that
  contains both "InfDefaultInstall.exe " and ".inf". InfDefaultInstall.exe is a signed Windows binary
  that performs installation based on the contents of an INF file; a specially crafted INF can use the
  scrobj.dll scriptlet handler to execute an embedded or remotely referenced SCT script, giving an
  operator code execution through a trusted binary while bypassing application allowlists. Legitimate
  software installers occasionally invoke it, so the investigation should establish what the referenced
  INF actually does, what the binary loaded and spawned, who and what launched it, and whether the same
  pattern is part of routine automation or a one-off operator action.
type: detection
detection_id: ce7cf472-6fcc-490a-9481-3786840b5d9b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- question: Does the command line contain both InfDefaultInstall.exe and a .inf file reference?
  context: >-
    Before investing investigation time, confirm the alert is a true positive by reviewing the exact
    command line against the detection criteria. The rule fires when the command line contains
    "InfDefaultInstall.exe " and ".inf" together. Verify both tokens are present and read the full
    argument string to identify the specific INF file path being installed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run InfDefaultInstall.exe against an INF file?
  context: >-
    Legitimate software installation occasionally uses InfDefaultInstall.exe, but interactive use is
    uncommon outside of vendor installers. Knowing whether the user role and host function are
    consistent with installing software through an INF is often the fastest path to distinguishing a
    routine installer from operator-driven proxy execution. A workstation user with no software-deployment
    remit invoking it directly is far less expected than an IT-managed deployment host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What INF file did InfDefaultInstall.exe install, and what does that INF actually do?
  context: >-
    The full command line reveals the INF path being installed. Read the argument string to identify the
    INF file, then examine the INF contents for a DefaultInstall section that registers or runs a
    scriptlet through scrobj.dll, a RegisterOCXSection, or a remote URL for the SCT payload. The behavior
    the INF encodes — script execution, DLL registration, or a network fetch — is what determines the
    impact, so decode the INF rather than treating the command line alone as the whole action.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
        - 'InfDefaultInstall.exe '
        - '.inf'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Does the command line or INF reference reveal a scriptlet handler, a remote URL, or a non-standard INF path?
  context: >-
    Proxy execution through this binary hinges on what the INF points at. A command line or INF that
    references scrobj.dll, an .sct scriptlet, an http or unc path, or an INF staged in a user-writable
    directory such as a temp, downloads, or profile folder points toward operator-supplied content rather
    than a vendor installer shipped under Program Files. Identify the INF location and any embedded
    URL or scriptlet reference to judge whether the payload is local and trusted or remotely fetched.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: '.sct'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - Image
- question: What process spawned InfDefaultInstall.exe, and is that parent chain expected?
  context: >-
    The parent process reveals how the binary was invoked. A vendor installer typically descends from a
    setup executable or an interactive administrative shell. A parent such as a script host (wscript,
    cscript, mshta), an Office application, a browser, or an unfamiliar binary points toward exploitation
    or operator-driven proxy execution rather than legitimate installation. Note what spawned the parent
    and what else the parent launched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did InfDefaultInstall.exe load scrobj.dll or other scripting engines on this host around the time of the alert?
  context: >-
    The proxy-execution path runs an SCT scriptlet through the scrobj.dll handler, so a module-load event
    for scrobj.dll attributed to infdefaultinstall.exe is the strongest confirmation that script execution
    actually occurred rather than a benign INF install. Loads of scripting or runtime engines such as
    jscript.dll, vbscript.dll, or the .NET runtime alongside it reinforce that the INF carried executable
    content. Absence of scrobj.dll suggests the INF performed a non-scripted install.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\infdefaultinstall.exe'
      condition: selection
    fields:
      - ImageLoaded
      - Image
- question: Did InfDefaultInstall.exe or a process it spawned make an outbound network connection around the time of the alert?
  context: >-
    A crafted INF can reference a remotely hosted SCT scriptlet, in which case the binary or its child
    reaches out to fetch the payload before executing it. An outbound connection from infdefaultinstall.exe
    to an external or unfamiliar host near the alert indicates remote-payload retrieval rather than a
    self-contained local install. Correlate the destination with the INF reference and review whether the
    address is an enterprise software-distribution endpoint or an unknown host.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\infdefaultinstall.exe'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: What child processes did InfDefaultInstall.exe spawn afterward?
  context: >-
    The processes spawned after the INF runs reveal its actual impact. A legitimate install rarely spawns
    interactive interpreters; proxy execution through an SCT scriptlet often hands off to cmd.exe,
    powershell.exe, wscript.exe, or other tooling for post-exploitation. Unexpected children indicate the
    INF carried executable content rather than performing a benign installation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\infdefaultinstall.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host previously fired this InfDefaultInstall pattern, what parents and users drove it, and does the current alert fit?
  context: >-
    Even signed system binaries get abused. The query mirrors the rule's selection structure scoped to
    this host, so the resulting parent and user distribution reflects how this specific INF-execution
    pattern has historically run here rather than generic binary usage. A new parent process, an
    unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - 'InfDefaultInstall.exe '
        - '.inf'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - 'InfDefaultInstall.exe '
        - '.inf'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - 'InfDefaultInstall.exe '
        - '.inf'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or coordinated activity across
    multiple endpoints. If the same user triggered proxy execution or other tooling on more than one host,
    the scope of the activity may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - 'InfDefaultInstall.exe '
        - '.inf'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context:
    what led to this event, what happened after, and whether it is part of a larger sequence. Look for
    reconnaissance, privilege escalation, persistence mechanisms, or additional proxy-execution tooling
    surrounding the INF execution.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Were any other proxy-execution LOLBins used on this host recently?
  context: >-
    Operators who use one proxy-execution LOLBin often use several. If InfDefaultInstall.exe was used to
    run a scriptlet, check whether rundll32, regsvr32, mshta, msbuild, cmstp, installutil, msiexec, or
    similar trusted binaries were also used to execute code on this host. Finding multiple proxy-execution
    LOLBins performing the same objective strengthens the case for deliberate allowlist bypass over a
    benign installer.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\installutil.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was InfDefaultInstall.exe executed from its expected System32 or SysWOW64 path?
  context: >-
    InfDefaultInstall.exe normally runs from C:\Windows\System32 or C:\Windows\SysWOW64. Execution from a
    non-standard path outside those directories may indicate the binary was copied or renamed to evade
    path-based allowlists. A copy running from a user temp, downloads, or profile directory is more
    suspicious than one in System32. The OriginalFileName field confirms identity even if the on-disk
    name was changed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired this InfDefaultInstall pattern over the past 90 days, and what command-line structures are typical?
  context: >-
    A LOLBin pattern with no prior history on a host is more suspicious than one used regularly under
    stable parents. The query mirrors the rule's selection structure scoped to this host, so the count
    reflects this specific INF-execution pattern rather than generic usage of the binary. The command-line
    projection lets the analyst compare typical invocation patterns — which INF paths are normally installed
    — against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - 'InfDefaultInstall.exe '
        - '.inf'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - CommandLine
