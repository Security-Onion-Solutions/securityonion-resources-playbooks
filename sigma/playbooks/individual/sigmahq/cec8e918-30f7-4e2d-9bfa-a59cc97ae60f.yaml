name: OpenWith.exe Executes Specified Binary
id: c95a9220-1d47-4a6a-9e1c-c19b06365874
description: |
  Detects OpenWith.exe being used to launch another binary, where the command line carries the /c flag that tells OpenWith.exe to execute the file path that follows it. OpenWith.exe is the Microsoft-signed "Open with" dialog helper; passing /c followed by a path makes it act as a proxy execution vehicle that spawns the named binary as its child, so a trusted signed process launches attacker-chosen code (observed launching .hta, .msi, and arbitrary executables). The investigation should establish what the /c argument pointed at, what child process OpenWith.exe actually spawned, how OpenWith.exe was invoked, and whether this fits any routine usage on the host or fleet.
type: detection
detection_id: cec8e918-30f7-4e2d-9bfa-a59cc97ae60f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- question: Does the command line show OpenWith.exe running with the /c flag and a target file path?
  context: >-
    Confirm the alert is a true positive by reviewing the exact command line against the rule's criteria, which fire when the image ends in OpenWith.exe and the command line contains /c. Read the full statement to identify what path or binary follows /c — OpenWith.exe treats that argument as the file to execute, so the value names the proxied payload (for example an .exe, .hta, or .msi).
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to launch programs through the OpenWith.exe helper from the command line?
  context: >-
    Interactive users almost never invoke OpenWith.exe with a /c file argument by hand; the "Open with" dialog is normally driven through the shell, not scripted with /c. A command-line OpenWith.exe /c invocation from an account or host with no plausible reason to proxy program launches this way is the deviation worth chasing, while a known automation or admin script may explain it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What did this OpenWith.exe invocation actually launch? Decode the full /c argument.
  context: >-
    The full command line reveals the proxied target. Parse what follows /c — a local executable, a script (.hta, .vbs, .js), an installer (.msi), or a remote/UNC path. The file extension and location indicate the payload type and whether it lives in a user-writable or unusual directory. Note any additional arguments passed through to the launched program, since OpenWith.exe forwards them to the child it spawns.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned OpenWith.exe, and is that parent chain expected?
  context: >-
    The parent process reveals how OpenWith.exe was invoked. A scripted /c proxy launch is more concerning when the parent is a script host (wscript.exe, mshta.exe), an Office application, a remote-execution service, or another LOLBin, and less so when it descends from an interactive explorer.exe session. Identify the parent and what spawned it to see whether the proxy launch was hands-on-keyboard or part of an automated chain.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did OpenWith.exe spawn afterward?
  context: >-
    OpenWith.exe acts as a proxy by launching the program named after /c as its child, so the spawned process is the actual payload and the most direct evidence of what executed. Identify the children of OpenWith.exe on this host and inspect their image paths and command lines — a script interpreter, installer, or unsigned executable spawned here is the proxied code, while subsequent network or shell tooling can indicate post-execution activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did OpenWith.exe or the binary it launched make outbound network connections, and are the destinations expected?
  context: >-
    A proxied payload run through OpenWith.exe may retrieve a second stage or beacon to operator infrastructure, and the /c target itself can be a remote or UNC path. Confirm whether the OpenWith.exe process opened any connections and to where. Connections to external or unfamiliar hosts broaden the scope and identify infrastructure to pivot on. If network telemetry for this process is not collected in this environment, treat zero results as a visibility gap rather than evidence no connection occurred, and pivot to the spawned child process and any files it touched.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: Does this host normally run OpenWith.exe from the command line?
  context: >-
    OpenWith.exe ships with Windows but is rarely launched with a /c file argument as part of normal operation. Zero or very low historical counts indicate first-time or rare command-line use, which raises the bar for treating this as routine. Some software does invoke OpenWith.exe through the shell, so calibrate against what this host normally does.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit?
  context: >-
    Even built-in binaries can be abused. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific OpenWith.exe /c firing pattern has historically run here, not generic OpenWith.exe usage. A new parent process, an unexpected user account, or an unusual command-line structure against the prior distribution is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \OpenWith.exe
        CommandLine|contains: /c
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \OpenWith.exe
        CommandLine|contains: /c
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \OpenWith.exe
        CommandLine|contains: /c
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether this proxy launch is isolated or part of broader movement. If the same user triggered related execution or administrative activity on multiple endpoints in the same window, the scope of the operation may be larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \OpenWith.exe
        CommandLine|contains: /c
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining process activity around the alert reveals what led to this event and what happened after. Look for reconnaissance, credential access, or additional execution tooling that frames the OpenWith.exe proxy launch within a larger sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the stages that preceded this proxy execution and help reconstruct the timeline. The sequence of alerts often tells whether this launch is opportunistic or a planned step of a multi-stage operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this specific OpenWith.exe /c pattern rather than generic OpenWith.exe usage. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \OpenWith.exe
        CommandLine|contains: /c
      condition: selection
    fields:
    - host.name
