name: Potential PowerShell Execution Policy Tampering - ProcCreation
id: 3d26386c-5843-44e8-8cd9-38e1971902e0
description: |
  Detects a command line that references the PowerShell ExecutionPolicy registry location (under ShellIds\Microsoft.PowerShell or the Policies\Microsoft\Windows\PowerShell path) together with a permissive policy value (Bypass, RemoteSigned, or Unrestricted). The rule fires only when both the registry path token and a policy value appear in the same command line. Lowering the execution policy removes the signing requirement for scripts and is frequently a precondition for running unsigned PowerShell payloads; it can also be legitimate administration or build automation. Determine who ran the change, what it was scoped to, and whether unsigned script execution followed.
type: detection
detection_id: cf2e938e-9a3e-4fe8-a347-411642b28a9f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line contain both a PowerShell ExecutionPolicy registry path and a permissive policy value?
  context: Confirm the alert is a true positive by reviewing the exact command line. The rule requires both an ExecutionPolicy registry path token (ShellIds\Microsoft.PowerShell\ExecutionPolicy or Policies\Microsoft\Windows\PowerShell\ExecutionPolicy) and one of Bypass, RemoteSigned, or Unrestricted in the same command. Note which policy value and which path were used.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to change the PowerShell execution policy?
  context: Lowering the execution policy can be routine for administrators, software deployment, or build pipelines. Knowing whether the account and host normally manage PowerShell policy is often the fastest way to separate sanctioned configuration from operator preparation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: If a registry_set event is linked to this process, which ExecutionPolicy key and value were written?
  context: When the policy change reaches the registry, the linked registry_set event records the target key (TargetObject) and the value written (Details) as structured fields. The per-machine location sits under ShellIds\Microsoft.PowerShell\ExecutionPolicy and the policy-enforced location under Policies\Microsoft\Windows\PowerShell; Bypass and Unrestricted remove signing checks entirely while RemoteSigned only relaxes local scripts. If the change was made in-memory for the session and never written to the registry, this returns nothing — read the command line directly to confirm the value and scope.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Was the command encoded or obfuscated, and what does it decode to?
  context: The execution-policy change may be one fragment of a larger one-liner. Decode any -EncodedCommand or -enc base64, and unwind backtick escaping, string concatenation, or variable substitution. Look for what runs alongside the policy change — a download cradle, an Invoke-Expression of fetched content, or an assembly load into memory.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned this command, and is that parent chain expected?
  context: The parent process reveals how the policy change was invoked. A change driven by explorer.exe, a deployment agent, or a console session is consistent with administration; parents such as mshta.exe, wscript.exe, winword.exe, or a browser child point to script-driven or macro-driven execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did PowerShell script block logging capture the full script content around this change?
  context: Event ID 4104 records the deobfuscated script PowerShell actually executed, even when the command line is encoded. This gives ground truth for what ran together with the execution-policy change. If PowerShell operational logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were other registry modifications made on this host in the same session via reg.exe or regedit.exe?
  context: An execution-policy change often travels with other configuration edits — disabling protections, adding exclusions, or setting persistence keys. Finding a cluster of registry writes from the same host within a short window reveals whether several configuration objectives were pursued together.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- question: Were other PowerShell security controls weakened on this host in the hour before this change?
  context: Operators often relax several controls together — patching AMSI in memory, disabling realtime protection, or invoking the legacy version 2 engine that lacks logging — alongside lowering the execution policy. Finding these adjacent control-weakening actions strengthens the case that the policy change was preparation for unsigned execution.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: How often has this host changed the PowerShell execution policy before?
  context: A host that regularly relaxes execution policy as part of automation or administration is less concerning than one where this command pattern has never appeared. Zero or very low historical counts indicate first-time or rare use of this specific change. Scoping is by the rule's command-line pattern, since the rule carries no fixed binary.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_path:
        CommandLine|contains:
          - \ShellIds\Microsoft.PowerShell\ExecutionPolicy
          - \Policies\Microsoft\Windows\PowerShell\ExecutionPolicy
      selection_values:
        CommandLine|contains:
          - Bypass
          - RemoteSigned
          - Unrestricted
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
      - User
- question: When this host has previously matched the rule's pattern, what parents and users drove it, and does the current alert fit that pattern?
  context: The query mirrors the rule's selection structure scoped to this host, so the parent/user distribution reflects how this exact policy-change pattern has historically run here — not generic PowerShell usage. A new parent process, an unexpected account, or an unusual command structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_path:
        CommandLine|contains:
        - \ShellIds\Microsoft.PowerShell\ExecutionPolicy
        - \Policies\Microsoft\Windows\PowerShell\ExecutionPolicy
      selection_values:
        CommandLine|contains:
        - Bypass
        - RemoteSigned
        - Unrestricted
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did the command that changed the policy spawn afterward?
  context: The processes spawned after the policy change reveal its actual impact. A change followed immediately by script-host children, download utilities, or further PowerShell invocations suggests the relaxation was a precursor to executing fetched content.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_path:
        CommandLine|contains:
        - \ShellIds\Microsoft.PowerShell\ExecutionPolicy
        - \Policies\Microsoft\Windows\PowerShell\ExecutionPolicy
      selection_values:
        CommandLine|contains:
        - Bypass
        - RemoteSigned
        - Unrestricted
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_path:
        CommandLine|contains:
        - \ShellIds\Microsoft.PowerShell\ExecutionPolicy
        - \Policies\Microsoft\Windows\PowerShell\ExecutionPolicy
      selection_values:
        CommandLine|contains:
        - Bypass
        - RemoteSigned
        - Unrestricted
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around the time of the alert?
  context: Tracking the account's activity across all hosts reveals lateral movement or coordinated activity on multiple endpoints. If the same user triggered similar actions elsewhere, the scope of the activity may be larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_path:
        CommandLine|contains:
        - \ShellIds\Microsoft.PowerShell\ExecutionPolicy
        - \Policies\Microsoft\Windows\PowerShell\ExecutionPolicy
      selection_values:
        CommandLine|contains:
        - Bypass
        - RemoteSigned
        - Unrestricted
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining surrounding activity reveals what led to the policy change and what followed it. Aggregating by parent and child collapses repetitive agent telemetry into high-count rows while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts matched the rule's pattern in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, giving a fleet-wide count of this policy-change pattern rather than generic PowerShell usage. Many hosts matching the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_path:
        CommandLine|contains:
        - \ShellIds\Microsoft.PowerShell\ExecutionPolicy
        - \Policies\Microsoft\Windows\PowerShell\ExecutionPolicy
      selection_values:
        CommandLine|contains:
        - Bypass
        - RemoteSigned
        - Unrestricted
      condition: all of selection_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the attack stages that preceded a policy change made to enable unsigned execution. The alert timeline helps reconstruct whether this change is an isolated administrative action or one step in a sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
