name: Potential Qakbot Rundll32 Execution
id: bbfcca87-fffe-4361-8ece-bef4a3d59a39
description: |
  Fires only when every one of the rule's conditions holds together: rundll32.exe is launched by
  cmd.exe, cscript.exe, curl.exe, mshta.exe, powershell.exe, pwsh.exe, or wscript.exe, and the same
  command line both names a path under ProgramData, C:\Users\Public, AppData\Local\Temp, or
  AppData\Roaming and contains `.dll`. rundll32.exe is a signed Windows binary that loads an arbitrary
  DLL and calls an exported function inside it, which lets code run under a trusted image name without
  the payload ever being an executable of its own; Qakbot and comparable loader families use it in this
  exact form, staging the DLL in a directory any user can write to and invoking it from the script host,
  shell, or transfer tool that delivered it. Legitimate rundll32 use is overwhelmingly launched by
  Windows components against DLLs in System32, so the combination of a scripting or shell parent with a
  user-writable DLL path is what the rule isolates. The investigation should establish which DLL and
  export the command line named, whether that DLL was loaded and who signed it, how it reached the disk,
  what the process did afterward, and whether the same parent-driven pattern appears elsewhere.
type: detection
detection_id: cf879ffb-793a-4753-9a14-bc8f37cc90df
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the alerting command line show rundll32.exe loading a DLL from a user-writable directory, launched by one of the rule's parent binaries?
  context: >-
    Every condition had to hold together for this to fire, so confirm all of them against the event: the
    parent ends in cmd.exe, cscript.exe, curl.exe, mshta.exe, powershell.exe, pwsh.exe, or wscript.exe;
    the image is rundll32.exe; the command line contains one of `:\ProgramData\`, `:\Users\Public\`,
    `\AppData\Local\Temp\`, or `\AppData\Roaming\`; and the command line also contains `.dll`. Read the
    full command line for the DLL path it names and for the export name or ordinal after the comma, since
    those two values are what the rest of the investigation follows.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run rundll32.exe against DLLs staged in ProgramData, Public, or a user's AppData directory?
  context: >-
    Vendor installers and a small number of management agents do stage helper DLLs outside System32 and
    call them through rundll32, so the pattern is not unique to malicious code — but on a workstation
    driven by an interactive user it is uncommon, and the account and host function are the fastest way to
    tell the two apart. Establish what the host does, whether the account is an ordinary user or a service
    or machine identity, and whether any deployment or software-packaging activity was expected here.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this parent expected to launch rundll32.exe, and what started the parent itself?
  context: >-
    The parent set the rule matches is the delivery layer of a loader chain: a script host running a
    downloaded script, a shell running a one-liner, or a transfer tool that just retrieved the file.
    Reading the parent's own command line names the script, URL, or command that led here, and the
    grandparent shows how that parent was reached — an office document, a browser download, a mail client,
    an archive utility, or a management agent each imply a different entry point and a different scope.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other child processes did the same parent instance spawn?
  context: >-
    A loader rarely does one thing. The same parent instance commonly retrieves the payload, copies or
    renames it, launches it through rundll32, and then runs discovery commands, so listing the parent's
    other children in the surrounding window names the rest of the sequence and the tools it used. Look in
    particular for additional rundll32 invocations against different exports of the same DLL, for
    scheduling or registry-writing utilities, and for account and network enumeration.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What DLL path, export, and arguments did this rundll32 command line carry?
  context: >-
    rundll32 takes the form `rundll32.exe <dll path>,<export> [arguments]`, so the command line names the
    exact file to examine and the exact function that ran inside it. Note the file extension actually used
    — loader families frequently stage the DLL as `.dat`, `.tmp`, `.png`, or with no extension and still
    pass `.dll` elsewhere on the command line — and note whether the export is a plausible name or an
    ordinal such as `#1`, which is common where the DLL has no meaningful export table. The query returns
    every rundll32 invocation on this host in the window that carries a user-writable path and `.dll`, so
    sequential invocations against different exports of the same file appear together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_binary:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      selection_paths:
        CommandLine|contains:
        - :\ProgramData\
        - :\Users\Public\
        - \AppData\Local\Temp\
        - \AppData\Roaming\
      selection_extension:
        CommandLine|contains: .dll
      condition: all of selection_*
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: Which DLL did the alerting rundll32 process actually load, and who signed it?
  context: >-
    The command line states an intent; the module-load events state what was really mapped into the
    process. Those events carry the loaded path, the signature status, the signer name, and the file hash
    on the load itself, so this is where the named DLL becomes a concrete file with a reputation that can
    be looked up. An unsigned module loaded out of ProgramData, Public, or AppData is the payload the rule
    is pointing at; a module signed by the vendor that owns the parent application points at a bundled
    helper instead. If module-load telemetry is not collected in this environment, treat an empty result
    as a visibility gap rather than as evidence nothing loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: Did the alerting rundll32 process make outbound network connections?
  context: >-
    A DLL loaded through rundll32 inherits a signed Windows image name for any traffic it generates, which
    is the operational reason the technique is used for loaders and for command-and-control. rundll32
    contacting an external address on a web port, or a raw address with no name resolution behind it, is
    the behavior to establish here; routine rundll32 work driven by Windows components is local and
    generates little or no egress. Carry any destination found here into the environment's traffic records
    to see how long the conversation lasted and how much data moved.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
- question: Did the parent process write the DLL it then pointed rundll32 at?
  context: >-
    The parent binaries this rule matches are also the tools that stage the file — a transfer tool writes
    it directly, a script host writes it from a downloaded script, a shell copies or renames it into place.
    Listing the files this parent instance wrote in the surrounding window either produces the DLL named on
    the command line, which ties delivery and execution to one chain, or shows the file was already on disk
    and was placed by something earlier. Note any additional files written alongside it, particularly
    configuration or data files dropped into the same directory.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - TargetFilename
  answer_sources:
  - file_event
- question: What else did this parent binary launch on this host in the hours after the alert?
  context: >-
    This widens the view from the single parent instance to every execution of that parent binary on the
    host in the following hours, which is where a second stage shows up — a further rundll32 or regsvr32
    load, a scheduling or registry-writing utility establishing persistence, or discovery commands. When
    the parent is cmd.exe or powershell.exe the result includes ordinary activity, so read it for the
    sequence rather than the volume, and anchor on the minutes immediately following the alert.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Has this parent binary launched rundll32.exe on this host before, and how often?
  context: >-
    This counts the parent-and-child pairing over 90 days regardless of what the command line carried, so
    it answers whether the launch relationship itself is routine on this host. Some management and
    packaging software genuinely runs rundll32 from a shell or script host on a schedule, and a high count
    with a repetitive command line is that. A pairing that has never occurred before, or occurs only around
    the alert, is a new execution relationship rather than an established one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Has this host previously run rundll32.exe against DLLs staged in user-writable directories, and under which accounts?
  context: >-
    rundll32 itself runs constantly on any Windows host, so its bare 90-day count measures nothing. This
    query keeps the rule's own constraints — a user-writable path and `.dll` on the command line — so the
    count is the host's history of this specific usage rather than of the binary, broken out by account. A
    host with an established history under a single service or installer account has software that works
    this way; a host with no prior history is seeing the pattern for the first time.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_binary:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      selection_paths:
        CommandLine|contains:
        - :\ProgramData\
        - :\Users\Public\
        - \AppData\Local\Temp\
        - \AppData\Roaming\
      selection_extension:
        CommandLine|contains: .dll
      condition: all of selection_*
    fields:
      - User
  answer_sources:
  - process_creation
- question: Has this account produced this rule's pattern before, and does that history fit its role?
  context: >-
    The query mirrors the rule's selection structure scoped to this account, so the result is the account's
    90-day history of this specific pattern across hosts, not its general use of rundll32 or of a shell. A
    packaging or deployment identity that produces this pattern on many hosts is doing its job; an ordinary
    user account with no prior history is the deviation. Weigh the count against what the account is
    provisioned to do, and note that when the alert fires under SYSTEM or a machine account the account name
    attributes nothing and the launch mechanism is the better pivot.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_paths:
        ParentImage|endswith:
        - \cmd.exe
        - \cscript.exe
        - \curl.exe
        - \mshta.exe
        - \powershell.exe
        - \pwsh.exe
        - \wscript.exe
        Image|endswith: \rundll32.exe
        CommandLine|contains:
        - :\ProgramData\
        - :\Users\Public\
        - \AppData\Local\Temp\
        - \AppData\Roaming\
      selection_extension:
        CommandLine|contains: .dll
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Has this parent process driven this rule's pattern before, or is the parent new for this activity?
  context: >-
    When the alert fires under a service or machine identity the account name attributes nothing and the
    launch mechanism does. The query mirrors the rule's selection structure scoped to the alerting parent
    process, so the result is that parent's 90-day history of driving this exact pattern, broken out by host.
    A parent that already accounts for the pattern across many hosts is a deployment or vendor mechanism; a
    parent that has never driven it before is the deviation to chase.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_paths:
        ParentImage|endswith:
        - \cmd.exe
        - \cscript.exe
        - \curl.exe
        - \mshta.exe
        - \powershell.exe
        - \pwsh.exe
        - \wscript.exe
        Image|endswith: \rundll32.exe
        CommandLine|contains:
        - :\ProgramData\
        - :\Users\Public\
        - \AppData\Local\Temp\
        - \AppData\Roaming\
      selection_extension:
        CommandLine|contains: .dll
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What else did this account do across the environment around the time of the alert?
  context: >-
    This is the account's activity right now rather than its history — every process it ran on every host in
    the surrounding hour, aggregated by host and binary. The same account appearing on hosts it does not
    normally touch, or running remote-execution and administrative tooling in the same window, widens the
    scope beyond this endpoint. When the alert fires under SYSTEM or a machine account this returns routine
    agent activity from across the estate and the parent-scoped view of the same window is the meaningful
    read instead.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did this same parent-driven pattern fire on other hosts in the same window?
  context: >-
    The query mirrors the rule's selection structure scoped to the alerting parent process, fleet-wide, in
    the alert window. Several hosts producing the pattern within the same hour points at a scheduled or
    pushed mechanism, or at a delivery attempt that reached several recipients at once; a single host points
    at a host-local trigger. The host list is also the population to check for the loaded DLL and for any
    egress that followed it.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_paths:
        ParentImage|endswith:
        - \cmd.exe
        - \cscript.exe
        - \curl.exe
        - \mshta.exe
        - \powershell.exe
        - \pwsh.exe
        - \wscript.exe
        Image|endswith: \rundll32.exe
        CommandLine|contains:
        - :\ProgramData\
        - :\Users\Public\
        - \AppData\Local\Temp\
        - \AppData\Roaming\
      selection_extension:
        CommandLine|contains: .dll
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Aggregating every parent-and-child pairing on the host in the surrounding window collapses repetitive
    agent and service telemetry into a few high-count rows while novel pairings stand out at low counts.
    Read it for what appeared once or twice: an archive or document application spawning a script host, a
    browser or mail client writing to a shell, a scheduling utility, or credential and discovery tooling.
    That is the immediate context this execution sits in.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
- question: How common is this parent binary launching rundll32.exe across the fleet in the last day?
  context: >-
    This counts the parent-and-child pairing environment-wide with no command-line constraint, so it
    calibrates how unusual the launch relationship is here rather than measuring the rule's pattern. A
    pairing that appears on hundreds of hosts is produced by software the environment runs everywhere, and
    the DLL path is then the only discriminator; a pairing confined to a handful of hosts makes those hosts
    the population to examine. The projected command lines show whether the other occurrences are the same
    invocation repeated by automation or unrelated one-off use.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    A loader executing through rundll32 is a middle stage, so the hours before it are where delivery and the
    first execution show up — a document or archive application spawning a script host, a script host
    retrieving a file, a transfer tool reaching an external address, or a scheduled task being written.
    Earlier detections on this host order those stages into a timeline and often name the entry point that
    this alert alone does not show.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
