name: HackTool - SharpChisel Execution
id: c2b8df51-1043-46ba-8b1a-2951c9d98f85
description: |
  Fires when a process either has an image name ending in SharpChisel.exe or carries SharpChisel in its
  Product metadata. SharpChisel is a C# wrapper around the Chisel tunneling utility used to relay traffic
  through an internal host, typically by running a reverse-mode client that dials an external relay and a
  local SOCKS5 server so operator traffic can reach otherwise unreachable internal hosts and protocols.
  Legitimate appearances are rare and usually tied to an authorized engagement; otherwise the binary points
  to an operator establishing proxy infrastructure for command-and-control. Investigation should confirm the
  match, decode which tunnel role and ports were configured, identify the connection endpoints, and determine
  how the binary arrived and who ran it.
type: detection
detection_id: cf93e05e-d798-4d9e-b522-b0248dc61eaf
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the alerting process match SharpChisel either by image name or by Product metadata?
  context: >-
    The rule fires on either of two branches — an image path ending in SharpChisel.exe, or a Product metadata
    value of SharpChisel. Confirm which branch matched and review the full image path and product fields. A
    Product match on a renamed binary is as meaningful as a literal SharpChisel.exe filename, and tells the
    analyst the operator may have renamed the executable.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - Product
- question: Is this user and host expected to run a network tunneling tool?
  context: >-
    Tunneling tools are almost never part of routine workstation or server activity. Knowing whether the user
    role and host function involve sanctioned tunneling or proxying is often the fastest way to separate an
    authorized test from operator activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this SharpChisel execution part of an authorized penetration test or red team engagement?
  context: >-
    Offensive tunneling tools are used in authorized security assessments. Check whether a pentest or red team
    exercise is currently active on this host or network segment. An authorized engagement with matching tool
    usage and timing resolves the alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is SharpChisel or any Chisel-based tunneling tool on the organization's approved software list?
  context: >-
    Organizations typically sanction a small set of remote access and tunneling tools for IT support. A
    Chisel-based tunneler not on that list represents shadow IT or operator-deployed infrastructure regardless
    of where the binary came from, and should be checked even if it appears under a familiar account.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a current helpdesk ticket, change record, or testing window explaining this tunnel?
  context: >-
    Sanctioned tunneling normally correlates with an approved development or testing use case, a documented
    administrative procedure, or a scheduled maintenance window. If no such context exists, the tunnel may have
    been set up for persistent access or to bridge into internal services.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What tunnel configuration did this invocation set up? Decode the command-line arguments.
  context: >-
    The command line reveals the tunnel role and routing. A client invocation dials an external relay and may
    carry a reverse-forward token of the form r:LISTEN:HOST:PORT; a server invocation opens a local listener,
    often with a SOCKS5 flag. Decode the role, the external address, the listen and forward ports, and any
    SOCKS5 option to understand exactly what path traffic takes.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Which tunnel role was invoked — client, server, or both on this host?
  context: >-
    Chisel-based tunnelers run as a client that connects out to a relay, as a server that listens locally, or
    as both on the same host to layer a SOCKS5 proxy inside a reverse port forward. Identifying the role from
    the arguments determines whether this host is the pivot ingress, the SOCKS5 exit, or both, which scopes the
    reachable internal surface.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What external endpoints and ports did this tool connect to or listen on?
  context: >-
    The destination reveals where the tunnel relays traffic and which ports carry it. Watch for connections to
    well-known proxy or relay ports such as 1080, 8080, and 4444, or to high non-standard ports. A connection
    to an unfamiliar external address rather than known vendor infrastructure points to operator-controlled
    relay infrastructure.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: Did this host open connections to internal peer hosts on proxy or SMB ports right after the tool ran?
  context: >-
    Once a SOCKS5 listener is live, traffic emerges from this host toward internal peers it does not normally
    talk to, often on proxy ports like 1080, 8080, or 4444, or SMB and RPC over non-standard ports. Connections
    to internal addresses that fall outside this host's usual peer set are the proxied lateral traffic. Compare
    the destinations against this host's normal host-to-host baseline.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 1080
          - 8080
          - 4444
          - 9999
          - 8888
          - 445
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
- question: What process spawned SharpChisel and is that parent chain expected?
  context: >-
    The parent process reveals how the tunneler was launched. A launch from explorer.exe or a shell suggests
    hands-on-keyboard execution, while a launch from a sideloaded helper, a script host, or an unusual service
    process suggests the binary was dropped and run by earlier-stage tooling. Legitimate system processes that
    rarely spawn network-capable children are worth scrutiny here.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did SharpChisel spawn afterward?
  context: >-
    Processes spawned by the tunneler reveal what the proxied access was used for. Post-exploitation often
    follows tunnel setup — command interpreters, script hosts, or credential and discovery tooling launched
    once an internal path is open. Unexpected children point to activity that the tunnel was bridging.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Do bursts of outbound or internal connections line up in time with this tool's execution?
  context: >-
    A new tunnel process followed shortly by a spike in connections is the correlation that distinguishes an
    active relay from an idle binary. Line up the tool's start time against connection volume from this host
    and note whether a sustained burst begins around execution. The aggregation collapses repeated connections
    so a new high-count destination stands out.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \SharpChisel.exe
      - Product: SharpChisel
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \SharpChisel.exe
      - Product: SharpChisel
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or staging on multiple endpoints. If
    the same user triggered similar activity elsewhere, the scope of the operation may be larger than this one
    host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \SharpChisel.exe
      - Product: SharpChisel
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining activity around this event surfaces what led up to it and what
    followed — reconnaissance, privilege escalation, or persistence that provides broader context. Aggregating
    by image and parent collapses repetitive agent telemetry so novel parent-child pairs stand out.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
