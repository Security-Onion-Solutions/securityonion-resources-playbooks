name: Malicious DLL Load By Compromised 3CXDesktopApp
id: 1f43fd3d-94eb-40f6-9344-cbe5850c3b66
description: |
  Detects the load of a DLL whose hash matches a set of known-compromised modules distributed
  through a trojanized build of a desktop communications application. In a software supply-chain
  compromise the attacker modifies a legitimately-signed application so that one of its bundled DLLs
  decrypts and executes an embedded payload, beacons to attacker infrastructure, and pulls a
  later-stage payload; because the trojanized DLL ships inside a validly-signed application, code-signature
  checks alone do not flag it, so this rule matches on the exact file hashes. A hash match is
  high-confidence: confirm the loaded module's hash against the rule, identify the loading process and
  its parent, and determine whether the host made outbound connections or ran a second-stage payload
  consistent with the loader's known behavior.
type: detection
detection_id: d0b65ad3-e945-435e-a7a9-438e62dd48e9
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the loaded module's hash match one of the known-compromised DLL hashes this rule detects?
  context: Confirm the alert is a true positive by reviewing the exact hash of the loaded module
    (ImageLoaded) against the hardcoded known-bad hashes the rule matches on. The trojanized modules
    were signed with a valid vendor certificate, so signature status alone does not distinguish them
    from the legitimate DLL of the same name; the hash is the discriminator. Also note the module path
    and the loading process for the downstream questions.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Hashes
- question: Is this host expected to run the affected application, and is the user consistent with that use?
  context: Legitimate use of the underlying application is common, so a hash match on one of its DLLs
    is what makes this notable rather than the application itself. Knowing whether the host is a normal
    endpoint for this communications application, and whether the logged-on user routinely runs it,
    helps establish how the trojanized build reached this system.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: For the loaded module, what are its signing status, hash, and threat-intel reputation?
  context: The trojanized DLLs in this family carry a valid vendor signature, so a Valid SignatureStatus
    does not clear the module on its own. Compare the hash against threat intelligence rather than relying
    on signature state; a signed module whose hash matches a known-bad loader is confirmed malicious.
    Signature values of Unsigned, Expired, Distrusted, or Invalid on a system-named DLL are an additional
    masquerading signal.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What other modules did the loading process load, and are any from non-canonical paths or user-writable directories?
  context: A supply-chain loader often pulls additional modules or stages further DLLs alongside the
    trojanized one. Look for modules loaded from the application's own directory instead of the expected
    system path, unsigned modules where signed ones are expected, and system DLL names loaded from
    outside System32 — all consistent with side-loading and search-order abuse by the compromised process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - SignatureStatus
      - Image
- question: What is the loading process, and what were its command line and working directory?
  context: The image-load event names the process that loaded the module. Confirm it is the expected
    application binary running from its installed location rather than a copy relocated to a user-writable
    path, and review its command line and current directory for arguments or paths that are not part of
    normal application startup.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned the loading process, and is that parent chain expected?
  context: The parent process reveals how the affected application was launched. An interactive launch
    from explorer.exe or a service-managed start is routine; a start from a script host, an Office
    application, or an unexpected updater may indicate that the trojanized build was delivered or
    executed through another stage rather than a normal install or update.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Did the loading process make outbound network connections around the time of the load?
  context: Loaders in this family beacon to attacker infrastructure and retrieve a later-stage payload
    after the trojanized DLL initializes. Outbound connections from the affected application process
    close to the load time — especially to external addresses or uncommon ports — corroborate active
    C2 rather than a benign module load.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: What external domains did the loading process resolve around the time of the load?
  context: The retrieval stage of this family resolves attacker-controlled or intermediary hosting
    domains before pulling its next-stage payload. Domain lookups issued by the affected application
    process near the load time help identify the C2 or staging infrastructure and give an indicator to
    pivot on across the fleet.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - QueryName
- question: Did the loading process spawn any child processes after the module loaded?
  context: A successful loader frequently launches a second-stage process or a command interpreter to
    continue the operation. Child processes of the affected application close to the load time, and
    their command lines, indicate whether the load progressed to hands-on execution rather than
    remaining a dormant module load.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this module been loaded on this host before, and under which processes?
  context: A first-time load of this module on the host is a stronger anomaly than a recurring one. If
    the same module has loaded under the same process repeatedly over the prior 90 days, an update or
    reinstall may have replaced a good DLL with a trojanized one of the same name; if this is the first
    occurrence, the module arrived recently.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Does this host normally run the affected application?
  context: An application that has never been seen on a host is more suspicious than one that runs
    regularly. Zero or very low historical counts for the loading process indicate the affected
    application was installed or run recently, which is consistent with a freshly delivered trojanized
    build rather than an established deployment.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Is this module being loaded on other hosts, and under which processes?
  context: Cross-host correlation surfaces the spread of the trojanized build. The same module loading
    across many hosts indicates a distributed install or update pushed the compromised version widely,
    which changes the response from single-host containment to a fleet-scale remediation of the affected
    application.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Are any of the specific known-compromised DLL hashes present on other hosts, including under renamed files?
  context: Hunting the exact known-bad hashes across the fleet catches copies of the trojanized module
    even where it was renamed or relocated, which a filename-based search would miss. Any additional host
    returning one of these hashes is loading a confirmed-malicious module and should be triaged the same
    way as the alerting host.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Hashes|contains:
          - SHA256=7986BBAEE8940DA11CE089383521AB420C443AB7B15ED42AED91FD31CE833896
          - SHA256=11BE1803E2E307B647A8A7E02D128335C448FF741BF06BF52B332E0BBF423B03
          - SHA256=F79C3B0ADB6EC7BCC8BC9AE955A1571AAED6755A28C8B17B1D7595EE86840952
          - SHA256=8AB3A5EAAF8C296080FADF56B265194681D7DA5DA7C02562953A4CB60E147423
      condition: selection
    fields:
      - host.name
      - Image
      - ImageLoaded
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining process activity around the load reveals what
    preceded it and what followed, and whether the module load is one step in a larger sequence such as
    reconnaissance, credential access, or persistence established after the loader executed.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential
    access — may reveal the stages that preceded the module load and help reconstruct the timeline of
    how the trojanized application was delivered and run.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
