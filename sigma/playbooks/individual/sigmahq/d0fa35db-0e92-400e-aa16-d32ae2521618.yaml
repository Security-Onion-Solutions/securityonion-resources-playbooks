name: SNAKE Malware Covert Store Registry Key
id: a7b99372-b6c6-4d4c-a00d-61fae9f59e8b
description: |
  Detects a registry modification whose key path ends in SECURITY\Policy\Secrets\n — an LSA secrets entry the SNAKE
  malware family uses as a covert store for its encrypted usermode component. The SECURITY hive is readable only by
  SYSTEM and holds OS-owned credential material, so a blob placed there stays off the filesystem and outside ordinary
  registry enumeration, and it survives reboot with the hive; the stored data is encrypted rather than a readable path,
  so the write itself carries no filename or command to pivot on. The rule keys solely on that exact key path, with no
  value-data or event-type constraint, so the investigation should establish which process wrote the key and what
  launched it, whether the store was written once or is being maintained, what files landed in the same session, and
  whether a service, driver, or autostart mechanism was staged alongside it.
type: detection
detection_id: d0fa35db-0e92-400e-aa16-d32ae2521618
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the alerting registry write target the LSA secrets key path ending in SECURITY\Policy\Secrets\n?
  context: >-
    The rule has a single condition — a TargetObject path ending in SECURITY\Policy\Secrets\n — with no value-data or
    event-type constraint, so any modification touching that exact key path fires. Confirm the exact TargetObject on the
    triggering event and identify the process that wrote it. The signer columns say which vendor published the writing
    process and are context, not a verdict; essentially every alerting process is trusted-signed. The useful judgment is
    coherence between the signer and the key, and writes into the SECURITY hive normally come from OS credential
    components rather than from an arbitrary signed binary.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - registry_event
- question: Is this host expected to have a process creating entries under the LSA secrets hive?
  context: >-
    Writing under HKLM\SECURITY\Policy\Secrets requires SYSTEM, so the account on this event is typically SYSTEM or the
    machine account rather than a person — when it is, pivot on the writing process for attribution instead. The OS
    creates secrets for machine-account passwords, DPAPI master key material, and cached service credentials, and names
    them accordingly; an entry named n corresponds to no OS or vendor producer, so a routine explanation would have to
    come from local tooling running as SYSTEM.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Does any administrator recall maintenance or a deployment on this host that would create an LSA secret?
  context: >-
    Confirmation from the people who administer the host is the fastest route to a benign explanation. This is not an
    operation a user performs interactively — the realistic benign candidates are a backup, credential-management, or
    endpoint-agent installation running as SYSTEM. If no one recalls such work and no deployment window covers the
    timestamp, treat the write as unexplained and continue with the process-lineage and file-drop questions.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: What exact key and value data were written under the LSA secrets hive, and does the writing process plausibly own that key?
  context: >-
    The SECURITY\Policy\Secrets subtree is the LSA secrets store, where the OS keeps machine-account passwords, DPAPI
    master key material, and cached service credentials under a DACL that grants access to SYSTEM only. That combination
    of restricted access and OS-owned content is what makes it useful as a covert store — content placed there is not
    reachable by normal file or registry enumeration and persists across reboot with the hive. Judge coherence between
    the signer of the writing process and the key being written rather than treating trusted as exculpatory.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - registry_event
- question: What value data was written to the covert store, and is it readable content or opaque binary?
  context: >-
    The value data determines what the store holds. This family keeps its usermode component there in encrypted form, so
    opaque binary rather than a path or command is the expected result. Registry value data is recorded on roughly 79% of
    endpoint registry modifications and is absent when the data is binary or empty — which is exactly the case for an
    encrypted blob — so empty value data here is consistent with the technique and is not evidence that nothing was
    written. When it is absent, export the key from the host under SYSTEM context to recover and size the stored data.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
  answer_sources:
  - registry_event
  - manual_review
- question: Has the covert store been written more than once, and does the value data change between writes?
  context: >-
    Registry key and value deletions are not recorded by endpoint telemetry, so whether the store was later removed
    cannot be answered from logs — the observable signal is the write history. A single write is consistent with initial
    installation; repeated writes indicate a component is actively maintaining the store, which places the payload in the
    present rather than in a finished installation. Read persistence from this re-modification history and from whether
    the reading component executed.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - registry_event
  - manual_review
- question: Which process wrote the covert store, and what launched it?
  context: >-
    The writing process is named on the alert but its origin is not; retrieving its own start event reveals the parent
    that launched it and the command line it ran with. Writes into the SECURITY hive normally originate from OS
    credential components running under services.exe. A script host, an installer executing from a temporary or
    user-writable directory, or an image outside System32 indicates the write came from deployed tooling rather than the
    operating system.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: Does this host normally run the process that wrote the covert store?
  context: >-
    A binary that has never run on this host before is a different proposition from one that runs every day. The 90-day
    history grouped by account shows whether this image is a routine SYSTEM component or a first-time execution; a zero
    or very low count for a process writing into the SECURITY hive narrows the timeline to recent installation activity.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: What other registry keys were modified on this host in the same window?
  context: >-
    Placing a covert store is one step of a larger installation — a driver registration under Services, a service entry,
    or security-setting changes commonly land in the same session. The triggering key appears in these results; the
    signal is what else was written alongside it and which process wrote it. A cluster of unrelated hive paths touched by
    one image describes an installer; scattered routine keys from many images describe normal host activity.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
  answer_sources:
  - registry_event
- question: Did the process that wrote the covert store, or its children, also write files to disk?
  context: >-
    The store holds encrypted data rather than a path, so there is no referenced filename to check on disk — the file
    correlate is whatever the writing process and its children created in the same session, typically a driver, a loader
    module, or a working file. File-write events carry no hash; if a candidate file is found, hash it from a later
    execution of that path or retrieve it for a reputation lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Did the process that wrote the covert store execute again on this host after the alert?
  context: >-
    A store on its own is inert; it becomes operational when the component that reads it runs. Because the value data
    holds no path, the executable to look for is not named anywhere in the registry event, and the practical proxy is
    re-execution of the writing image in the hours after the write. Recurring execution under SYSTEM, or execution with
    command lines that differ from the installation invocation, is consistent with a component now loading from the
    store.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - ParentImage
  answer_sources:
  - process_creation
- question: Has this key path been modified before on this host?
  context: >-
    LSA secrets are created by the operating system at specific moments — domain join, machine-account password rotation,
    service-account configuration — and named for the purpose they serve. No history at all across 90 days indicates the
    entry was created for the first time at the moment of the alert, which for a name with no OS producer places the
    write inside the installation window rather than in routine credential maintenance.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
  answer_sources:
  - registry_event
- question: Was the same key path modified on any other host in the environment?
  context: >-
    The same LSA secrets entry appearing on more than one host means the installation was repeated, and the set of
    affected hosts becomes the scope of the response rather than a single machine. A single host points to a targeted or
    early-stage installation. Compare the writing process across hosts — a consistent image indicates one tool run
    repeatedly, differing images indicate the store is reached by more than one component.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
  answer_sources:
  - registry_event
- question: What other process activity occurred on this host around the time of the write?
  context: >-
    Aggregating process starts around the alert collapses routine agent and service telemetry into high-count rows and
    leaves novel parent-child pairs standing at low counts, which is what is worth scanning for. A service installation,
    a driver-loading helper, or a script host in the same window describes the rest of the installer that the registry
    write is one artifact of.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host may show the stages that preceded the write — credential access, defense
    tampering, or a service or driver being installed. The ordering of alerts reconstructs the timeline and indicates how
    far back the activity started, which matters when the store itself gives no installation timestamp beyond the write.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Were other persistence mechanisms installed on this host in the same timeframe?
  context: >-
    A covert store is a staging location, not the mechanism that gets code running — that requires a service, driver,
    scheduled task, or autostart entry. Persistence tooling executing within hours of the write on either side indicates
    the store was one step of an installation sequence, and identifies the mechanism that would reload the payload after
    the store is cleaned up.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Were files dropped into Startup folders or scheduled-task definition paths on this host?
  context: >-
    File-based persistence leaves no command line to detect — a binary written into a Startup folder or a task XML
    written directly under the Tasks directories achieves autostart without running schtasks, sc, or reg. Checking these
    paths in the same window covers the persistence route that a persistence-tool query cannot see, which matters for an
    installation that has already demonstrated a preference for storage the OS does not expose.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
