name: Renamed VsCode Code Tunnel Execution - File Indicator
id: 1e325157-3fa2-4b36-ab6f-6470f6ad141a
description: |
  Detects creation of a file named code_tunnel.json by a process whose image is NOT the signed VS Code CLI
  (code.exe or code-tunnel.exe). code_tunnel.json is the state file the VS Code Remote Tunnels CLI writes when a
  tunnel is registered; the tunnel is a Microsoft-signed, GitHub-authenticated channel that exposes an interactive
  remote session (file browser, terminal, task and extension execution, port forwarding) over Microsoft-hosted relay
  domains. Legitimate developers do register tunnels, but a renamed or relocated code binary writing this state file
  points to deliberate evasion of name-based controls. The investigation should establish the writing binary's true
  identity and origin, whether a tunnel actually became reachable, what the binary spawned, and how far the activity
  spread.
type: detection
detection_id: d102b8f5-61dc-4e68-bd83-9a3187c67377
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Was a file named code_tunnel.json created by a process other than the signed VS Code CLI?
  context: Confirm the alert before investing time. Review the exact file path, the operation performed, and the
    responsible process image. The rule excludes the legitimate writers code.exe and code-tunnel.exe, so a match means
    some other process wrote the tunnel state file.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to register a VS Code tunnel?
  context: Developer workstations and engineers routinely run VS Code and may register tunnels legitimately. A server,
    a service account, or a user with no development role writing this state file is far less expected. When the writer
    is a machine or service account, judge by the responsible process and the host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What is the actual identity of the process that wrote the tunnel file, based on its metadata and hash?
  context: The VS Code CLI is signed by Microsoft and its embedded OriginalFileName is Code.exe, but the portable
    build ships with an empty ProductName that breaks publisher-based allow-listing. A renamed copy keeps the Microsoft
    signature and OriginalFileName while running from an unexpected path or name. Compare the Image path on disk against
    OriginalFileName and submit the hash for reputation to confirm this is the real CLI, a tampered build, or an
    unrelated binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: How did the binary that wrote the tunnel file arrive on this host?
  context: The CLI does not appear spontaneously. It is downloaded as a portable archive, extracted, or copied into a
    working directory. Tracing the file-creation event for the binary by its name reveals the delivery mechanism, the
    responsible process, and whether it landed in a user-writable staging path such as Temp, Downloads, or AppData.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What child processes did the tunnel binary spawn after execution?
  context: A registered tunnel exposes an interactive session, and the CLI host typically spawns a Node.js helper,
    cmd.exe, winpty-agent.exe, and interactive PowerShell to service remote commands. Those children are the actual
    remote-access surface. The same binary appearing on other hosts points to deliberate distribution rather than an
    isolated developer action.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is the tunnel state file still on disk, or was it deleted or renamed after the alert?
  context: The file's post-alert lifecycle drives next steps. A state file still on disk can be read to recover the
    tunnel identity for revocation; a file removed shortly after creation suggests cleanup and shifts focus to what
    executed in between and whether the tunnel remains registered server-side regardless of the local file.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What tunnel identity does the code_tunnel.json file contain?
  context: The state file records the tunnel name, id, and cluster region assigned at registration. Retrieve the file
    from the host and read it to recover the tunnel name so the session can be located and revoked, and to confirm the
    file is genuine tunnel metadata rather than an unrelated file that merely shares the name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What was the full command line of the renamed VS Code binary, and which tunnel options did it use?
  context: The command line reveals the operational intent. Read the tunnel subcommand and its options, including a
    persistent name, the license-consent acceptance, and a data-directory override that relocates the state file away
    from the default profile path so filename-based detection is evaded. The query returns every execution of this
    binary on the host in the window so a multi-step setup is visible.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process launched the renamed VS Code binary?
  context: The parent process shows how the CLI was invoked. A launch from an interactive shell or a download cradle
    points to hands-on-keyboard or scripted setup, whereas explorer.exe suggests a user double-click. An unusual parent
    such as a script host or an Office application indicates the tunnel was set up as a follow-on to another payload.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Did this host resolve VS Code tunnel relay domains, indicating an active tunnel rather than a leftover state file?
  context: The tunnel's control and data plane run over Microsoft-hosted relay and dev-tunnel domains. A lookup of those
    domains after the state file appears confirms the tunnel registered and is reachable, which means an interactive
    remote session is exposed. No resolution suggests a stale or aborted registration. If DNS logging is not ingested
    in this environment, treat zero results as a visibility gap rather than evidence the tunnel never connected.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|contains:
          - tunnels.api.visualstudio.com
          - devtunnels.ms
      condition: selection
    fields:
      - QueryName
      - Image
- question: What other files did the responsible process write or delete around the alert?
  context: The CLI drops more than the tunnel state file. License-consent and other cli-data-dir state files accompany a
    genuine setup, while a broader burst of writes may reveal staged payloads or unpacked components. The breadth and
    location of the process's other file activity distinguish a routine tunnel setup from a dropper in progress.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Is a code_tunnel.json file present on any other hosts in the environment?
  context: Finding the same tunnel state file on multiple hosts points to a deliberate rollout of remote access rather
    than one developer's workstation. A single host suggests a targeted or ad-hoc action; many hosts indicate scripted
    or pushed distribution and a wider scope to contain.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- question: Does this host normally run this binary?
  context: A binary that has never been seen on the host is more suspicious than one that runs regularly. Zero or very
    low historical counts indicate a first-time or rare execution of the tunnel CLI on this endpoint, weighing against
    routine developer use.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection scoped to this user, returning the user's 90-day history of writing
    the tunnel state file from a non-VS-Code process, aggregated by host. A user who has never produced this pattern is
    more suspicious than one who does so regularly; weigh the count against their role and expected toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: \code_tunnel.json
      filter_main_legit_name:
        Image|endswith:
        - \code-tunnel.exe
        - \code.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven the rule's pattern on this host or across the environment, or is the program new for this activity?
  context: When the alert fires under a service principal, user identity does not attribute behavior; the meaningful
    pivot is the launch mechanism. The query mirrors the rule's selection scoped to the alerting program,
    returning the 90-day history of this program producing the tunnel state file. A new or rare program for this pattern
    is the deviation worth chasing; a program that already accounts for thousands of prior events is automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: \code_tunnel.json
      filter_main_legit_name:
        Image|endswith:
        - \code-tunnel.exe
        - \code.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the environment around this time?
  context: Tracking the user's activity across all hosts reveals whether the tunnel setup is isolated or part of wider
    movement. If the same user drove similar activity on multiple hosts in the same window, the scope of compromise may
    be larger than this one endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: Under a service principal, tracking the user across the network returns agent-telemetry noise. The meaningful
    question is whether the same launch mechanism produced the tunnel state file elsewhere. Multiple hosts in the same
    window point to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: \code_tunnel.json
      filter_main_legit_name:
        Image|endswith:
        - \code-tunnel.exe
        - \code.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as defense tampering,
    reconnaissance, or credential access, may reveal the stages that preceded the tunnel setup and help reconstruct the
    timeline that led to establishing remote access.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
