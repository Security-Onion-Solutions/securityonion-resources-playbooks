name: CLR DLL Loaded Via Office Applications
id: 3233da44-a1a2-4370-a646-1e292d32e162
description: |
  Detects an Office application (Word, Excel, PowerPoint, Publisher, Outlook, OneNote) loading the .NET
  Common Language Runtime DLL (clr.dll). The rule fires when the loading process ends in one of those Office
  binaries AND the loaded module path contains clr.dll. Office binaries do not host managed code during
  normal document viewing, so a CLR load means .NET code executed inside the process, typically through a
  VBA macro that instantiates a .NET object or an injected assembly. Investigation should confirm the load,
  identify the document that opened the application, and determine whether the .NET-hosted execution dropped
  files, spawned living-off-the-land children, or reached out to the network.
type: detection
detection_id: d13c43f0-f66b-4279-8b2c-5912077c1780
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the loaded module match what this rule detects — clr.dll loaded by an Office application?
  context: >-
    Confirm the alert is a true positive by reviewing the loaded module path (ImageLoaded), its signing
    status, and the Office process that loaded it against the rule's two conditions, which both must hold: the
    loading process ends in an Office binary and the module path contains clr.dll. A CLR load into an Office
    application means .NET code ran inside that process, normally through a VBA macro or an injected assembly,
    since Office does not host managed code during ordinary document viewing. The load event carries the
    module hash and signing status directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Is this user and host expected to open Office documents that run .NET code?
  context: >-
    Legitimate document workflows rarely cause an Office application to host the CLR. A user who routinely runs
    macro-enabled workbooks built in-house, or a host used for developing Office add-ins, is a different
    situation than a general-purpose workstation where an Office process suddenly loaded clr.dll. Knowing the
    user role and host function is often the fastest way to separate a routine operation from macro-driven
    execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What document or email attachment caused this Office application to run?
  context: >-
    Malicious .NET-hosted execution inside Office almost always begins with a delivered file — an attachment
    opened from email, a document downloaded from the web, or a file from a share. The parent process and its
    command line usually carry the document filename that was opened. Identifying the specific file enables
    blocking it at the perimeter and searching for other recipients who received the same lure.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: What other modules did this Office process load around the alert, and are any from user-writable or non-canonical paths?
  context: >-
    A CLR load rarely stands alone. After clr.dll, a .NET macro typically pulls in mscoree.dll, mscorlib, and
    the JIT, then loads whatever assemblies the operator's code references. Look for assemblies loaded from
    Temp, AppData, ProgramData, or Public, unsigned modules where signed ones are expected, and system DLL
    names loaded from non-system paths. Follow-on module loads are themselves telling: an Office process that
    loads taskschd.dll is driving the Task Scheduler COM API directly (scheduled-task creation without
    schtasks.exe), and loads of wbemdisp.dll, wbemprox.dll, or fastprox.dll indicate WMI being invoked from
    the macro.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For each non-Microsoft or user-path module this Office process loaded, what is its signing status, hash, and reputation?
  context: >-
    Module reputation distinguishes a routine third-party add-in from a side-loaded malicious assembly. A
    genuinely signed Microsoft DLL loaded from an unexpected location may still be benign, but an unsigned
    module with a Microsoft-style name, or a SignatureStatus of Unsigned, Expired, Distrusted, or Invalid, is
    a masquerading or tampering signal. Hash lookups against threat intelligence surface known loaders. Trusted
    in-house or vendor signers can be recorded on an allow list so benign add-ins do not repeatedly draw
    attention.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: Did this Office application spawn a living-off-the-land child process after loading the CLR?
  context: >-
    The most direct impact of a macro is a child process. .NET-hosted Office execution commonly launches
    powershell.exe, cmd.exe, wscript.exe, cscript.exe, mshta.exe, rundll32.exe, regsvr32.exe, msiexec.exe,
    curl.exe, bitsadmin.exe, pcalua.exe, expand.exe, or tar.exe to stage the next stage. Any of these under an
    Office parent within a few minutes of the CLR load is a strong progression signal. Note that WMI-based
    macros deliberately break this parent chain by spawning through wmiprvse.exe instead, so an absence of
    direct children does not clear the alert.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
        Image|endswith:
          - \powershell.exe
          - \cmd.exe
          - \wscript.exe
          - \cscript.exe
          - \mshta.exe
          - \rundll32.exe
          - \regsvr32.exe
          - \msiexec.exe
          - \curl.exe
          - \bitsadmin.exe
          - \pcalua.exe
          - \expand.exe
          - \tar.exe
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What executable, script, or macro-enabled files did the Office process or its children write around the alert?
  context: >-
    A .NET macro frequently drops a second-stage payload before executing it. Files written by the Office
    process or its direct children with extensions such as exe, scr, dll, js, vbs, bat, cmd, ps1, hta, lnk,
    iso, docm, or xlsm are the artifacts to recover and analyze. Focus on writes into user-writable staging
    paths — Downloads, Temp, the user profile, AppData, and Office startup folders — where delivered payloads
    are typically placed. File writes are correlated to the alerting process and its children by process
    lineage, since file-write events carry no hash of their own.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      selection_ext:
        TargetFilename|endswith:
          - .exe
          - .scr
          - .dll
          - .js
          - .vbs
          - .bat
          - .cmd
          - .ps1
          - .hta
          - .lnk
          - .iso
          - .docm
          - .xlsm
      condition: (selection_self or selection_child) and selection_ext
    fields:
      - TargetFilename
      - Image
- question: Is a dropped payload or the opened document still on disk for analysis?
  context: >-
    If the .NET-hosted execution referenced or created a file — a downloaded payload, a decoded script, or the
    macro-enabled document itself — checking whether it still exists on disk enables hash lookups, sandbox
    submission, and content review. The query correlates file activity to the alerting process and its direct
    children by process lineage.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did the Office process make outbound network connections around the alert?
  context: >-
    .NET-hosted Office macros commonly reach out to fetch a second-stage payload or to beacon immediately after
    execution. Outbound connections from the Office process within minutes of the CLR load, especially to
    destinations outside corporate update, CDN, and proxy egress ranges, point to download or command-and-control
    activity. If the macro spawned a child process, also review egress from that child, identified in the
    child-process spawn analysis.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: Which processes on this host have loaded the CLR runtime DLL over the past 90 days, and is loading by an Office application routine here?
  context: >-
    A first-time CLR load by an Office binary is a stronger anomaly than a recurring one. If clr.dll has
    historically been loaded only by developer tools, .NET services, or management utilities on this host — and
    never by Office — the current load stands out. If an Office application has loaded it repeatedly (for
    example, on a host running a sanctioned macro-based add-in), the load is more likely routine.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: When this host has previously fired this CLR-in-Office pattern, what programs and users normally drive it, and does the current alert fit?
  context: >-
    Even sanctioned macro workflows can be abused. The query mirrors the rule's selection scoped
    to this host, so the resulting program and user distribution reflects how this specific
    firing pattern — an Office binary loading clr.dll — has run here before, not generic Office
    usage. A new acting program process, an unexpected user account, or a first-ever occurrence
    is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith:
        - \excel.exe
        - \mspub.exe
        - \outlook.exe
        - \onenote.exe
        - \onenoteim.exe
        - \powerpnt.exe
        - \winword.exe
        ImageLoaded|contains: \clr.dll
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity in the minutes surrounding the CLR load
    collapses repetitive agent telemetry into high-count rows while novel parent-child pairs stand out at low
    counts. Reconnaissance, credential access, or persistence installation near the alert time provides the
    broader context for the macro's execution.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, credential access, or a prior
    delivery alert — may reveal the stages that preceded the macro's execution and help reconstruct the full
    timeline. A cluster of alerts on one host in a short window is more meaningful than any single event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Is this Office installation fully patched?
  context: >-
    Some macro and .NET-hosted execution chains rely on unpatched Office vulnerabilities in macro, OLE, or DDE
    handling. Confirming the Office build is current helps distinguish exploitation of a known CVE from
    ordinary macro abuse, and flags whether other similarly unpatched hosts are exposed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: Did the same CLR-in-Office pattern fire on other hosts or for other users?
  context: >-
    Phishing and macro campaigns rarely target a single user. If one Office application loaded the CLR from a
    delivered document, other recipients likely opened the same lure. Correlating this detection across hosts
    and users reveals the breadth of the campaign and identifies additional systems that need investigation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Have other hosts fired this CLR-in-Office pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this
    specific firing pattern rather than generic Office usage. Many hosts loading the CLR into Office with a
    consistent parent points to a sanctioned add-in or scripted deployment; one host or a small unrelated set
    points to targeted, operator-driven activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith:
        - \excel.exe
        - \mspub.exe
        - \outlook.exe
        - \onenote.exe
        - \onenoteim.exe
        - \powerpnt.exe
        - \winword.exe
        ImageLoaded|contains: \clr.dll
      condition: selection
    fields:
    - host.name
