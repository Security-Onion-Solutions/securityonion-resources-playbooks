name: TAIDOOR RAT DLL Load
id: 8b651433-4123-4d55-a5b8-4d6fd91c1cc0
description: |
  Fires when a process command line either contains the literal `dll,MyStart` or `dll MyStart`, or ends
  with ` MyStart` while also naming rundll32.exe. Both forms describe an exported function named MyStart
  being called out of a DLL through the rundll32 proxy-execution path. The TAIDOOR loader uses a MyStart
  export as its entry point: the exporting DLL reads a second, encrypted DLL by a fixed filename from its
  own running directory, decrypts it in memory, and transfers execution to an export in the decrypted
  image, so the export name is the observable while the payload never touches disk in cleartext.
  Determine which of the two command-line forms matched, which DLL file and directory the export was
  called from, whether that module is signed and known on this host, and whether memory-write or
  thread-creation API activity followed the load.
type: detection
detection_id: d1aa3382-abab-446f-96ea-4de52908210b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: 'Does the command line either contain `dll,MyStart` or `dll MyStart`, or end with ` MyStart` while also naming rundll32.exe?'
  context: >-
    The rule has two independent trigger forms, and which one matched changes what to read next. The
    first form matches a command line containing the literal `dll,MyStart` or `dll MyStart` — the
    rundll32 syntax for calling an exported function named MyStart out of a DLL file. The second form
    matches a command line that ends with ` MyStart` and separately mentions rundll32.exe anywhere in
    the string, which catches spacing and quoting variants of the same invocation. Note which form
    matched: a first-form match names the exporting DLL directly next to the export name, while a
    second-form match may carry the DLL path elsewhere in the argument string or be a wrapper command
    that reaches rundll32 indirectly, so the exporting module has to be identified from the load events
    rather than read off the command line.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to invoke DLL exports through rundll32?
  context: >-
    Installers, control-panel applets, and management agents legitimately call exported functions through
    rundll32, but the export names they use are OS or vendor specific and MyStart is not one Windows
    components export. Knowing whether this host runs software that ships its own rundll32-invoked DLLs,
    and whether this user drives that software, is often the fastest path from alert to disposition.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this rundll32 export invocation part of an authorized penetration test or red team engagement?
  context: >-
    Loader entry points of this form are reproduced during red team exercises and during malware
    detonation or reverse-engineering work carried out on analyst workstations. Before investing
    investigation time, check whether an assessment is active on this host or network segment, or
    whether the host is an analysis machine. An authorized engagement with matching timing resolves
    the alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: Which DLL file was the MyStart export called from, and what arguments followed it?
  context: >-
    The rundll32 argument string carries the operational detail. The path or filename before the comma
    or space identifies the module exporting MyStart; anything after the export name is passed to it as
    a parameter. In this loader pattern the module named on the command line is the loader, not the
    payload — it locates an encrypted DLL by a fixed name in its own working directory, decrypts it in
    memory, and calls an export inside the decrypted image. Record the exact filename, its directory,
    and any trailing arguments before moving on.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Did the alerting process write configuration or staging files on this host after it ran?
  context: >-
    This loader pattern leaves file artifacts separate from the DLLs themselves: an INI-style
    configuration file written under a ProgramData subdirectory once a command-and-control channel is
    established, and a copy of cmd.exe placed in the system temp directory so commands can be run from
    a path the operator controls. Files written by the alerting process in the hour after execution show
    whether the load progressed past decryption into operation, and any file written to a temp or
    ProgramData path here is a collection target.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: What exactly did this command do — which DLL and export were invoked, and from which directory did the process run?
  context: >-
    The command line and the working directory together determine what was loaded. The MyStart export
    is a loader entry point that reads its encrypted payload by a fixed filename out of its own running
    directory, so the working directory is where that second file should sit on disk. Decode the DLL
    path, the export name, and any trailing arguments, then check the working directory for a second DLL
    alongside the one named on the command line. Scoping to MyStart command lines on this host in the
    surrounding window also surfaces repeated or paired invocations that belong to the same operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: MyStart
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: Which DLLs did the alerting process load, and were any unsigned or loaded from a user-writable directory?
  context: >-
    The rule matches on the command line alone, so the module that actually loaded is only visible on
    the DLL load events for this process. Those events carry the module path, whether it is signed, the
    signer name, and the module hash — enough to identify the exporting DLL, judge whether its signer
    has any relationship to software installed here, and check the hash against reputation sources. An
    unsigned module, or one signed by an unrelated party, loaded out of a temp, ProgramData, or user
    profile directory is the file to collect. A payload the loader decrypts and maps itself produces no
    load event at all, so a short module list is expected rather than evidence that nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
  - manual_review
- question: Did any process on this host make the memory-write, APC-queue, or hook-installation API calls that DLL injection depends on?
  context: >-
    Placing a decrypted image inside another process and forcing it to run needs a small set of calls
    — WriteProcessMemory to write the code, QueueUserAPC or SetWindowsHookEx to get it executed in the
    target. Behavioral API telemetry records these on the injecting side and names the process being
    written into, which distinguishes a load that stayed inside the alerting process from one that
    reached a second; explorer.exe, winlogon.exe, svchost.exe, and lsass.exe are the recurring targets
    worth checking first. Read-side access, such as reading another process's memory, has no equivalent
    record, so absence here does not rule out cross-process activity, and if this telemetry is not
    collected in this environment treat zero results as a visibility gap.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        event.dataset: endpoint.events.api
        process.Ext.api.name:
          - WriteProcessMemory
          - QueueUserAPC
          - SetWindowsHookEx
      condition: selection
    fields:
      - Image
      - process.Ext.api.name
      - Target.process.executable
  answer_sources:
  - edr_console
  - manual_review
- question: What process spawned this rundll32 invocation and is that parent chain expected?
  context: >-
    The parent reveals how the export call was launched. A parent of explorer.exe follows a double-click
    or a shortcut; a script host, an Office application, an archive utility, or a service host as parent
    points to the DLL having been dropped and launched programmatically rather than by the user. The
    parent's own command line shows what it was doing at the time, and walking one level further up
    reaches the delivery step.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What child processes did the alerting process spawn afterward?
  context: >-
    This loader pattern reaches command execution by copying cmd.exe into the system temp directory and
    running it from there, so children of the alerting process are where the load turns into operation.
    A cmd.exe running from a temp path rather than from System32, or any child launched out of the same
    directory the loader ran from, is the thread to follow. Anchoring on the alerting process's own
    children rather than on every process of the same binary keeps the result attributable to this event.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: When this host has previously produced the MyStart export pattern, what parents and users drove that activity, and does the current alert fit?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the parent and user
    distribution reflects how this specific command-line pattern has run here rather than generic
    rundll32 usage. MyStart is not an export Windows components use, so any prior history on this host
    is worth reading as a set: a repeated parent and user points to locally installed software that
    happens to use the export name, which is checkable against inventory, while no history at all makes
    this a first occurrence and a new parent or user against an existing history is the deviation.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains:
        - dll,MyStart
        - dll MyStart
      selection2a:
        CommandLine|endswith: ' MyStart'
      selection2b:
        CommandLine|contains: rundll32.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection1 or ( selection2a and selection2b )) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating every process and its parent in the surrounding window collapses routine agent and OS
    telemetry into high-count rows while unfamiliar parent-child pairs stand out at low counts. Read
    what ran immediately before the export call — an archive extraction, a browser or mail client child,
    a script host — and what ran immediately after, which places the load inside a sequence instead of
    treating it as an isolated event.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Has this user previously produced the MyStart export pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the user's
    90-day history of this specific command-line pattern, aggregated by host, rather than generic use of
    rundll32. A user with no prior history of this pattern is a different situation from one who produces
    it routinely on a workstation running software that uses the export name. Weigh the count and the
    host spread against the user's role and normal toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains:
        - dll,MyStart
        - dll MyStart
      selection2a:
        CommandLine|endswith: ' MyStart'
      selection2b:
        CommandLine|contains: rundll32.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection1 or ( selection2a and selection2b )) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: Has this parent process historically driven the MyStart export pattern on this host or across the environment, or is the parent new for this activity?
  context: >-
    When the alert fires under SYSTEM or another service principal, user identity does not attribute the
    behavior; the launch mechanism does. The query mirrors the rule's selection structure scoped to the
    alerting parent process, so the result is the 90-day history of that parent driving this specific
    pattern rather than generic parent-and-binary co-occurrence. A parent already accounting for a large
    volume of prior events is vendor or OS automation that uses the export name; a parent that is new
    for this pattern is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains:
        - dll,MyStart
        - dll MyStart
      selection2a:
        CommandLine|endswith: ' MyStart'
      selection2b:
        CommandLine|contains: rundll32.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection1 or ( selection2a and selection2b )) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did this user do across the environment around this time?
  context: >-
    Tracking the user's process activity across every host in the surrounding hour shows whether the load
    is confined to one endpoint or the same account is active on several. The same account producing
    loader or staging activity on multiple hosts widens the scope of the investigation beyond this
    machine. If the alert fired under SYSTEM or another service account, this view returns routine agent
    telemetry and the parent-scoped fleet view is the one that carries the answer.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, asking what else the user did across the environment returns agent
    telemetry from every host in it. The meaningful pivot is whether the same launch mechanism fired
    elsewhere: the query mirrors the rule's selection structure scoped to the alerting parent process,
    fleet-wide, inside the alert window. Several hosts in the same window points to scheduled or pushed
    automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains:
        - dll,MyStart
        - dll MyStart
      selection2a:
        CommandLine|endswith: ' MyStart'
      selection2b:
        CommandLine|contains: rundll32.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection1 or ( selection2a and selection2b )) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: Have other hosts produced the MyStart export pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of this command-line pattern rather than the generic footprint of rundll32. Many hosts
    producing it points to a deployed application whose DLL exports MyStart, which software inventory
    can confirm or refute; one host, or a small set with no common function, points to operator-driven
    activity. Use the host distribution to calibrate how far the investigation has to reach.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains:
        - dll,MyStart
        - dll MyStart
      selection2a:
        CommandLine|endswith: ' MyStart'
      selection2b:
        CommandLine|contains: rundll32.exe
      condition: selection1 or ( selection2a and selection2b )
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host help reconstruct how the DLL arrived and what launched it. Look
    for delivery and staging signals ahead of the load — archive extraction, script host execution, a
    file written to a user-writable path — and for defense tampering or persistence around it, which
    together place this event in a timeline rather than leaving it as a single observation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
