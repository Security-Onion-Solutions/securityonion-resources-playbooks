name: Diamond Sleet APT DLL Sideloading Indicators
id: 5a2b7502-b891-41f8-9121-7922597a73fd
description: |
  Detects a signed Windows binary staged in C:\ProgramData side-loading a malicious DLL that shares
  the binary's directory - EITHER clip.exe loading Version.dll OR wsmprovhost.exe loading DSROLE.dll.
  In normal operation these system binaries load their libraries from the system path, not from
  C:\ProgramData; a matching load from that directory is the DLL search-order hijack signature, where a
  dropped payload DLL is executed under the identity of a legitimate signed process. The sideloaded DLL
  typically decodes an embedded or adjacent payload (byte-reversed data or an XOR-keyed blob) and launches
  a follow-on process for command and control. Investigation should confirm the load path and signature,
  characterize the loaded module, trace how the signed binary was staged and launched, and look for the
  surrounding staging, persistence, and follow-on activity.
type: detection
detection_id: d1b65d98-37d7-4ff6-b139-2d87c1af3042
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the loaded module match one of the rule's two side-loading pairs - either clip.exe loading Version.dll or wsmprovhost.exe loading DSROLE.dll from C:\ProgramData?
  context: >-
    The rule fires when EITHER pairing matches - clip.exe loading Version.dll, OR wsmprovhost.exe loading
    DSROLE.dll - with both the signed binary and the DLL living in C:\ProgramData. Confirm the exact loaded
    module path (ImageLoaded), its code-signature status, and the loading process against the rule's
    criteria, and note which of the two branches fired because that determines which binary and DLL family
    the rest of the investigation follows. A load of these DLL names from the system path is normal; the
    load from C:\ProgramData is the search-order hijack signature.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Is this host expected to run clip.exe or wsmprovhost.exe from C:\ProgramData and load libraries from that directory?
  context: >-
    clip.exe and wsmprovhost.exe normally live in C:\Windows\System32 and load their DLLs from the system
    path. A copy running out of C:\ProgramData and loading a DLL from the same directory is not a standard
    configuration. Knowing whether this host or its role ever legitimately stages these binaries in
    C:\ProgramData is often the fastest way to separate a true positive from an unusual but sanctioned
    deployment.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this DLL side-loading activity part of an authorized penetration test or red team engagement?
  context: >-
    DLL search-order hijacking from a staging directory is a common red-team loader technique. Before
    investing analysis time, check whether a penetration test or adversary-emulation exercise is currently
    active on this host or network segment. An authorized engagement with matching tooling and timing
    resolves the alert without further work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What modules did the loading process load, and are any from C:\ProgramData or other user-writable directories, unsigned, or otherwise non-canonical?
  context: >-
    The full set of modules the process loaded tells the story the alert only samples. Look for the flagged
    DLL (Version.dll or DSROLE.dll) loading from C:\ProgramData rather than the system path - the
    search-order hijack signature - and for any additional unsigned or non-canonical modules loaded in the
    same window. A system DLL name loaded from a user-writable directory instead of System32 is the core
    indicator here.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For the DLL loaded from C:\ProgramData, what is its signing status, hash, and threat-intel reputation?
  context: >-
    The load event carries the DLL's hash and signature directly, so reputation can be judged without a
    pivot. A genuinely Microsoft-signed Version.dll or DSROLE.dll would still be unusual from C:\ProgramData,
    but an unsigned module carrying one of those system-DLL names with no valid signature is a strong
    masquerading indicator. Watch SignatureStatus values Unsigned, Expired, Distrusted, and Invalid, and pivot
    the hash to threat intelligence to surface known loader families.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What launched the signed binary that loaded this DLL, and is that parent chain expected?
  context: >-
    The parent of the staged clip.exe or wsmprovhost.exe reveals how the sideload was set up. A signed system
    binary running from C:\ProgramData is often dropped and launched by a preceding stager - for example a
    PowerShell process that downloaded both the binary and the DLL into that directory. An unexpected parent,
    or a command line that points the binary at the staging directory, corroborates the hijack.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - CommandLine
- question: What child processes did the loading binary spawn afterward?
  context: >-
    Once the sideloaded DLL decodes and runs its payload, the loader commonly spawns a follow-on process for
    command and control - observed examples include iexpress.exe and wksprt.exe launched from the hijacked
    binary. Children of clip.exe or wsmprovhost.exe that reach out to the network, or that are themselves
    unusual for that parent, mark the transition from loader to active C2.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this specific DLL been loaded on this host before, and under which processes?
  context: >-
    A first-time load of Version.dll or DSROLE.dll on this host is a stronger anomaly than a recurring one.
    If the same DLL name has historically only been loaded from the system path by system processes, a new
    load from C:\ProgramData under a staged binary is a clear deviation. Zero prior occurrences from that
    location points to first-time staging.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: When this host has previously matched the rule's side-loading pattern, what programs and users drove it, and does the current alert fit?
  context: >-
    The query mirrors the rule's exact two-pair selection scoped to this host, so the resulting
    program and user distribution reflects how this specific side-loading pattern - not generic
    use of the binaries - has fired here before. A new acting program process or an unexpected
    user account driving the load is the deviation worth chasing; for most hosts there should be
    no prior history at all.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: image_load
    detection:
      selection_1:
        Image|endswith: :\ProgramData\clip.exe
        ImageLoaded|endswith: :\ProgramData\Version.dll
      selection_2:
        Image|endswith: :\ProgramData\wsmprovhost.exe
        ImageLoaded|endswith: :\ProgramData\DSROLE.dll
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts matched the rule's side-loading pattern in the past week, and does the cross-host distribution look like automated deployment or isolated activity?
  context: >-
    The query mirrors the rule's selection with no host scope, giving a fleet-wide count of the exact
    side-loading pattern rather than generic use of these binaries. Many hosts loading Version.dll or
    DSROLE.dll from C:\ProgramData points to scripted deployment across the environment; a single host or a
    small unrelated set points to targeted, manual operator activity. Use the host spread to calibrate scope
    and severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: image_load
    detection:
      selection_1:
        Image|endswith: :\ProgramData\clip.exe
        ImageLoaded|endswith: :\ProgramData\Version.dll
      selection_2:
        Image|endswith: :\ProgramData\wsmprovhost.exe
        ImageLoaded|endswith: :\ProgramData\DSROLE.dll
      condition: 1 of selection_*
    fields:
    - host.name
- question: Were DLL-load-order or persistence-related registry keys modified on this host around the alert?
  context: >-
    Search-order hijacking is frequently paired with registry changes that redirect module resolution or
    re-execute the payload at boot - KnownDLLs entries, per-application App Paths, Image File Execution
    Options, and Run keys. A registry modification to any of these near the DLL load broadens the
    persistence picture beyond the single library event and helps establish whether the foothold survives
    reboot.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\Session Manager\KnownDLLs'
          - '\CurrentVersion\App Paths\'
          - '\Image File Execution Options\'
          - '\CurrentVersion\Run'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: Are the staged binary, the sideloaded DLL, and any adjacent key/payload files still on disk for analysis?
  context: >-
    The sideload leaves files behind in C:\ProgramData - the signed binary, the malicious DLL, and often an
    adjacent key or payload file (for example a readme.md used as an XOR key, or a byte-reversed payload blob
    read from the same directory). Confirming these still exist enables hashing, signature review, and
    sandbox submission. The query ties file writes to the loading process and its direct children.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the staged binary write to disk, and do they match a loader's staging footprint?
  context: >-
    Beyond the DLL itself, loaders staged in C:\ProgramData often drop additional payload, key, or
    configuration files alongside the signed binary and later write a follow-on executable elsewhere on disk.
    Files created by the hijacked process - especially additional binaries or blobs in C:\ProgramData or under
    Windows temp/ADFS-style paths - confirm the activity and reveal its scope even after the original process
    exits.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    A DLL sideload rarely stands alone. Surrounding activity often includes the stager that dropped the files,
    discovery commands, credential access, or additional persistence installed in the same window. Aggregating
    process activity around the alert surfaces novel parent-child pairs that stand out against routine host
    noise.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - exploitation of an internet-facing service, PowerShell payload
    staging, discovery, or credential access - may reveal the stages that led to this sideload and help
    reconstruct the timeline. The sequence of alerts frequently tells the fuller story of how the foothold was
    established.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Does the timing of this activity align with normal work hours and maintenance windows?
  context: >-
    Staging system binaries into C:\ProgramData during a documented software deployment window is different
    from the same activity at 3 AM on a weekend. Correlating the load time with the host's normal working
    hours, timezone, and any scheduled maintenance helps weigh whether this fits sanctioned change activity or
    off-hours operator behavior.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    Operators rarely rely on a single foothold. Alongside a DLL sideload they commonly register a scheduled
    task, service, or registry Run entry as a backup - for example a scheduled task set to relaunch a staged
    binary at boot. Multiple persistence installations in the same timeframe indicate deliberate stacking
    rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations such as the Startup folder or scheduled-task definition paths on this host?
  context: >-
    File-based persistence bypasses command-line detection entirely. Dropping an executable or script into a
    Startup folder or a path referenced by a registry Run key achieves persistence without invoking schtasks,
    sc, or reg. File monitoring captures these drops even when standard persistence tools are avoided, which is
    consistent with an operator who prefers staged binaries over noisy command execution.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
