name: Potential Amazon SSM Agent Hijacking
id: a2e8c38b-a9e5-479c-b23f-04dabfb5cd73
description: |
  Detects amazon-ssm-agent.exe running with -register together with -code, -id, and -region. The legitimate AWS Systems Manager agent is Amazon-signed and pre-installed on cloud instances, but re-registering it with an activation code, activation id, and region binds the agent to a different AWS account. An operator can use that re-registered agent as a remote access tool, issuing commands, transferring files, and opening sessions through legitimate AWS APIs and traffic that blends with normal cloud infrastructure. Determine whether the registration was an authorized provisioning action or an attempt to repoint the agent to an externally controlled account.
type: detection
detection_id: d20ee2f4-822c-4827-9e15-41500b1fff10
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Did amazon-ssm-agent.exe run with -register and the -code, -id, and -region flags together?
  context: Confirm the alert is a true positive by reviewing the exact command line. The rule fires only when all four registration flags appear on a single amazon-ssm-agent.exe invocation, which is the command that binds the agent to an AWS account. Read the activation code, activation id, and region values from the command line before continuing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this host and account expected to register or re-register the SSM agent?
  context: Agent registration is a provisioning action normally tied to instance setup or a documented re-enrollment, performed by infrastructure automation or an administrator. Knowing whether this host and account would legitimately run an SSM registration is often the fastest way to separate routine provisioning from a repoint to an unfamiliar account.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What activation id, region, and working directory did this registration use?
  context: The registration parameters reveal which AWS account and region the agent is being bound to. An activation id or region that does not match the organization's own AWS tenancy points to an externally controlled account. A non-default working directory or a second agent install indicates a run-as-fresh-instance variant rather than a normal re-enrollment of the existing agent.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this SSM agent registration and is that parent chain expected?
  context: The parent process shows how the registration was launched. A re-enrollment driven by a provisioning tool or service has a predictable parent, while invocation from an interactive shell, a script host, or an unexpected installer suggests an operator manually repointing the agent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did the SSM agent spawn afterward?
  context: Once an agent is bound to an account, that account can issue commands that the agent executes locally, surfacing as shells, script hosts, or file-transfer utilities spawned by the agent process. Command interpreters or file-manager children spawned by amazon-ssm-agent.exe are interactive control signals consistent with the agent being driven as a remote access tool.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What SSM endpoints and regions is this agent connecting to?
  context: The agent communicates with ssm, ec2messages, and ssmmessages endpoints under amazonaws.com, and the region in those hostnames reflects which account it now serves. Connections to an SSM region the organization does not use, or sustained outbound sessions on non-standard high ports, indicate the agent is beaconing to an account outside the environment's normal AWS footprint.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: Is amazon-ssm-agent.exe running from its canonical install path, and is more than one agent process present on this host?
  context: The supported agent lives under the Amazon SSM program files directory; an agent executing from a user-writable, temporary, or otherwise non-canonical path is a re-deployment rather than the pre-installed service. Two or more concurrent amazon-ssm-agent processes on one host is the run-as-fresh-instance pattern, where a second agent is registered to a different account while the original keeps running.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \amazon-ssm-agent.exe
      condition: selection
    fields:
      - Image
      - CurrentDirectory
- question: Does this host normally run amazon-ssm-agent.exe registration?
  context: A registration that has never been seen on this host is more notable than one that recurs, since the agent is normally registered once at provisioning and then runs as a service. Zero or very low historical counts indicate a first-time or rare re-enrollment worth scrutiny.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously run the SSM registration pattern, what parents and users normally drove it, and does the current alert fit?
  context: The query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution reflects how the registration pattern has historically run here rather than generic agent activity. A new parent process, an unexpected account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \amazon-ssm-agent.exe
        CommandLine|contains|all:
        - '-register '
        - '-code '
        - '-id '
        - '-region '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts run the SSM registration pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of the registration pattern rather than generic agent usage. Many hosts running the same pattern points to a provisioning or re-enrollment campaign; a single host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate scope.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \amazon-ssm-agent.exe
        CommandLine|contains|all:
        - '-register '
        - '-code '
        - '-id '
        - '-region '
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \amazon-ssm-agent.exe
        CommandLine|contains|all:
        - '-register '
        - '-code '
        - '-id '
        - '-region '
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \amazon-ssm-agent.exe
        CommandLine|contains|all:
        - '-register '
        - '-code '
        - '-id '
        - '-region '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the account's activity across all hosts reveals whether the registration is isolated or part of broader hands-on activity. If the same account drove similar actions on multiple endpoints, the scope of the operation may be larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \amazon-ssm-agent.exe
        CommandLine|contains|all:
        - '-register '
        - '-code '
        - '-id '
        - '-region '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Is the SSM agent sanctioned for remote management on this host, and is the registering AWS account one the organization controls?
  context: The SSM agent itself may be approved infrastructure, but its value as a remote access tool depends on which account it answers to. Verify both that the agent belongs on this host and that the activation code, id, and region map to the organization's own AWS tenancy. Registration against an account or region the organization does not own is the abuse condition regardless of the agent's reputation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a change ticket or provisioning record explaining this SSM agent registration?
  context: Legitimate agent enrollment correlates with instance provisioning, a documented re-enrollment, or a maintenance window. If no provisioning or support context exists for this registration, the agent may have been repointed by an operator to establish persistent remote access through legitimate cloud APIs.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were other process-based persistence mechanisms installed on this host around the registration?
  context: A re-registered agent provides one persistent foothold through legitimate cloud APIs, and operators commonly stack additional mechanisms. Scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions installed in the same timeframe indicate intentional stacking rather than an isolated provisioning action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
