name: New Root Certificate Installed Via Certutil.EXE
id: 455cfc40-dfc7-4c7b-9750-15f4ec251c39
description: |
  Detects certutil.exe (by Image name or original filename) invoked with the -addstore flag and the
  word root in its command line, which adds a certificate to the machine root trust store. The rule
  fires only when all three conditions match: the certutil binary, the -addstore flag, and a root
  store reference. Installing a root certificate makes the system trust whatever that certificate
  signs, so an operator can use it to suppress TLS warnings for adversary-controlled sites or to make
  signed payloads appear trusted. Legitimate uses exist — help desk or IT staff sometimes add a
  corporate root CA manually, and GPO-based CA deployment can surface here — so the investigation
  should decode which certificate file was added, confirm the resulting registry trust-store change,
  establish whether the user, host, and parent process are expected to manage certificates, and check
  for surrounding LOLBin or download activity.
type: detection
detection_id: d2125259-ddea-4c1c-9c22-977eb5b29cf0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- question: Does the command line invoke certutil with -addstore against the root store?
  context: Confirm the alert is a true positive by reviewing the exact command line and process details.
    The rule fires only when the certutil binary (by Image or original filename), the -addstore flag,
    and a root store reference all appear together. Verify the full command, the certificate file path
    it references, and that the binary is genuinely certutil before investing further time.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to install root certificates?
  context: Legitimate administrative activity can trigger this detection — help desk or IT staff
    occasionally add a corporate root CA by hand, and managed CA deployment can surface the same
    command. Knowing whether the user role and host function include certificate management is often
    the fastest way to separate routine operations from an operator subverting trust controls.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which certificate file was added, and what store and certificate does the full command reference?
  context: The full command line reveals exactly what was installed. Identify the certificate file path
    passed to -addstore, the named store (root indicates the machine trusted root store), and any store
    location switches. Where the certificate file is reachable, inspect its subject, issuer, thumbprint,
    and validity to determine whether it is a corporate CA or an unknown self-signed certificate. The
    query scopes to all certutil executions on this host within a few minutes so that multi-step
    sequences (decode a blob, then add it to the store) are visible together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Did the root trust store registry key change on this host around the time of the alert, and which certificate was added?
  context: A root certificate installation writes to the machine root store under the registry path
    SystemCertificates\Root\Certificates, where each new entry is keyed by the certificate thumbprint.
    Confirming the registry modification ties the certutil command to the actual trust-store change and
    yields the thumbprint of the installed certificate, which can be checked against the organization's
    approved CA list. A registry write with no corresponding approved CA is the deviation worth chasing.
    Correlate the registry timestamp with the process execution to confirm they belong to the same
    operation. If registry-set telemetry is not collected in this environment, treat the absence of
    results as a visibility gap rather than evidence the store was unchanged.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\SystemCertificates\Root\Certificates\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - User
- question: What process spawned certutil, and is that parent chain expected?
  context: The parent process reveals how certutil was invoked. Certificate management driven by an
    interactive admin session, a management console, or a deployment agent differs sharply from a spawn
    by cmd.exe under an unusual script host, mshta.exe, wscript.exe, or an Office application — parents
    that point to scripted delivery or a macro rather than deliberate certificate administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Does this host normally run certutil?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly.
    Zero or very low historical counts for certutil indicate first-time or rare execution, which raises
    the weight of a root-store change; a host that runs certutil routinely as part of certificate
    management lowers it.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously run certutil with -addstore against the root store, what parents and users normally drive it, and does this alert fit?
  context: Even legitimate certificate management leaves a pattern. The query mirrors the rule's
    selection structure scoped to this host, so the resulting parent and user distribution reflects how
    the rule's specific firing pattern has historically run here — not generic certutil usage. A new
    parent process, an unexpected user account, or a first-time appearance of this pattern is the
    anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certutil.exe
      - OriginalFileName: CertUtil.exe
      selection_cli_add:
        CommandLine|contains|windash: -addstore
      selection_cli_store:
        CommandLine|contains: root
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did certutil spawn afterward?
  context: The processes spawned by certutil reveal its actual impact. Certificate installation is
    normally self-contained; certutil spawning cmd.exe, powershell.exe, or another LOLBin afterward
    points to post-installation activity such as connecting to a site the newly trusted certificate
    now validates, or staging further payloads.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Was certutil executed from its expected System32 path?
  context: LOLBins executed from non-standard paths (outside System32 or SysWOW64) may indicate the
    binary was copied or renamed to evade path-based allowlists. A certutil.exe running from a user's
    temp or download directory is more suspicious than one in System32, especially when it is modifying
    the machine root trust store.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Were any other download or content-staging LOLBins used on this host recently?
  context: Operators who install a root certificate to make adversary infrastructure or signed payloads
    appear trusted often pair it with content-transfer LOLBins. If certutil added a root cert, check
    whether bitsadmin, curl, expand, makecab, or related binaries were also used to pull down the
    certificate or a follow-on payload. Finding multiple LOLBins working toward the same objective
    strengthens the case for malicious activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\hh.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: How often has this host run certutil with -addstore against the root store over the past 90 days, and what command structures are typical?
  context: A root-store install with no prior history on a host is more suspicious than one that recurs
    under stable parents as part of routine certificate management. The query mirrors the rule's
    selection structure scoped to this host, so the count reflects the rule's specific firing pattern
    rather than generic certutil usage. The command-line projection lets the analyst compare typical
    invocation patterns — which certificate files, which stores — against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certutil.exe
      - OriginalFileName: CertUtil.exe
      selection_cli_add:
        CommandLine|contains|windash: -addstore
      selection_cli_store:
        CommandLine|contains: root
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certutil.exe
      - OriginalFileName: CertUtil.exe
      selection_cli_add:
        CommandLine|contains|windash: -addstore
      selection_cli_store:
        CommandLine|contains: root
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certutil.exe
      - OriginalFileName: CertUtil.exe
      selection_cli_add:
        CommandLine|contains|windash: -addstore
      selection_cli_store:
        CommandLine|contains: root
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated
    activity on multiple endpoints. If the same user installed certificates or ran related tooling
    elsewhere in the same window, the scope of the incident may be larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certutil.exe
      - OriginalFileName: CertUtil.exe
      selection_cli_add:
        CommandLine|contains|windash: -addstore
      selection_cli_store:
        CommandLine|contains: root
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering,
    reconnaissance, or credential access — may reveal the attack stages that preceded the certificate
    installation and help reconstruct the full timeline. Trust subversion often accompanies broader
    defense-evasion activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts run certutil with -addstore against the root store in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of the rule's firing pattern rather than generic certutil usage. Many hosts firing
    the same pattern points to a scripted or managed CA deployment; one host or a small unrelated set
    points to manual operator activity. Use the host distribution and parent consistency to calibrate
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certutil.exe
      - OriginalFileName: CertUtil.exe
      selection_cli_add:
        CommandLine|contains|windash: -addstore
      selection_cli_store:
        CommandLine|contains: root
      condition: all of selection_*
    fields:
    - host.name
