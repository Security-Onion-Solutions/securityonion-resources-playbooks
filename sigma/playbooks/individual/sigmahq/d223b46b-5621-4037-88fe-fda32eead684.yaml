name: New Root or CA or AuthRoot Certificate to Store
id: d71b1a0d-2917-440d-9619-36055bc2e6e6
description: |
  Detects a write to the Windows certificate trust store: a new thumbprint subkey ending in \Blob under a
  SystemCertificates, group-policy, or EnterpriseCertificates Root, CA, or AuthRoot Certificates path. Installing a
  new trusted root or CA certificate makes the system trust any certificate chain signed by it, which enables
  adversary-in-the-middle interception of TLS traffic and validation of attacker-signed code and drivers.
  Legitimate installs are normally driven by enterprise certificate distribution or operating-system trusted-root
  updates; a certificate appearing outside those channels, written by a browser, script host, or office application,
  is worth reviewing for what it authorizes and which process installed it.
type: detection
detection_id: d223b46b-5621-4037-88fe-fda32eead684
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Do the certificate-store registry key and value data match what this rule detects?
  context: >-
    Confirm the alert is a true positive by reviewing the exact key path (TargetObject) and value data (Details). The
    key falls under one of the trusted certificate stores (Root, CA, or AuthRoot) under SystemCertificates,
    group policy, or EnterpriseCertificates, and ends in \Blob with the certificate thumbprint as the parent subkey.
    Note which store and scope the write landed in, because a Root or AuthRoot write grants full trust-anchor status
    while a CA write adds an intermediate issuer.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to install a trusted root or CA certificate?
  context: >-
    Legitimate certificate installation is normally driven by enterprise policy distribution or operating-system
    update mechanisms running under SYSTEM or a machine account. A standard user, a browser, or an office application
    writing to the trust store is unusual and points to manual or scripted installation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this same certificate-store alert firing on other hosts in the environment?
  context: >-
    The same trusted-root write appearing across many hosts at once usually indicates a policy-driven or
    update-driven distribution, while an isolated write on a single host is more consistent with targeted
    installation. Counting affected hosts sets the scope for response.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
- question: Which certificate store was written, and does it grant trust-anchor or intermediate-issuer status?
  context: >-
    The store path determines the trust granted. Root and AuthRoot stores under SystemCertificates or
    EnterpriseCertificates hold trust anchors, so anything chaining to them is trusted outright. The CA store holds
    intermediate issuers. The group-policy path applies the certificate through policy. The thumbprint subkey and the
    Blob value identify the specific certificate installed and the process that wrote it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What certificate was installed? Decode the thumbprint, subject, and issuer from the value data.
  context: >-
    The value data holds the DER-encoded certificate. Read the thumbprint (the store subkey name), subject, and
    issuer to identify what the certificate authorizes and who it claims to be. A self-signed certificate, a subject
    that impersonates a well-known vendor, or an internal issuer name that matches no known enterprise CA indicates a
    rogue trust anchor. If the value data is not captured because it is binary, take the thumbprint from the key path
    and retrieve the certificate from the store on the host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Is the certificate still present in the trust store, and was the key written again after the alert?
  context: >-
    A trusted root that remains installed keeps validating anything signed by it. Registry key and value deletions
    are not recorded by endpoint telemetry, so removal cannot be confirmed from logs. Judge persistence from whether
    the thumbprint key is modified again over a longer window and from whether code or connections that depend on the
    certificate appear, and confirm the current state directly on the host's certificate store.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Which process wrote the certificate, and what launched that process?
  context: >-
    The writing process names the installation method. certutil.exe with an addstore argument, powershell.exe running
    Import-Certificate, or a certificate-manager utility indicate deliberate installation; a browser, office
    application, or unknown binary writing to the trust store is anomalous. Walk up to the parent to see whether the
    install came from an interactive session, a script, or a remote-execution tool.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What other registry modifications were made on this host in the same window?
  context: >-
    Installing a rogue certificate is often accompanied by other changes: additional certificates, disabling of
    certificate-revocation checks, proxy or auto-config settings that route traffic through an interception point, or
    persistence keys. Registry changes clustered from the same writing process reveal whether this was a single
    install or part of a broader configuration change.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Did the host make new outbound connections after the certificate was installed?
  context: >-
    A newly trusted root or CA silently validates TLS sessions and code that chain to it, which is the reason for
    installing one to support interception or covert command-and-control. Outbound connections beginning shortly
    after the install, especially to previously unseen destinations, may be traffic the new certificate now
    authorizes without warning.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
- question: What process activity occurred on this host around the time of the certificate write?
  context: >-
    Reviewing processes that ran near the alert reveals how the certificate was delivered and what followed. Look for
    the delivery vector (a script host, a downloaded installer, a remote-management tool) and for binaries that
    executed after the install and would now pass signature validation against the new trust anchor.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Has this certificate-store key been written before on this host?
  context: >-
    Certificate Blob keys are named by thumbprint, so each certificate produces a unique key; any prior history for
    the same key means the same certificate was previously installed or refreshed rather than newly introduced. Zero
    history means this trust anchor is new to the host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same certificate installed on other hosts in the environment?
  context: >-
    The same thumbprint key appearing on many hosts points to centralized distribution through policy or an update
    channel; the same certificate on only one or a few hosts is more consistent with targeted installation. Compare
    the writing process across hosts to tell managed deployment from ad-hoc installation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Does this host normally run the process that installed the certificate?
  context: >-
    A certificate-management utility or script host that has never run on this host before, or runs only rarely, is
    more suspicious than one that is part of routine administration. Low historical counts point to first-time or
    ad-hoc use of the installation tool.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Did other detections fire on this host in the hours before the certificate was installed?
  context: >-
    Earlier alerts on the same host (credential access, defense tampering, or delivery of tooling) can reveal how the
    actor reached the point of installing a trusted root and help reconstruct the sequence that preceded it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: What other activity has this user performed across the environment?
  context: >-
    Tracking the user beyond this host shows whether the certificate install is isolated or part
    of wider activity. The same user installing certificates, running management tooling, or
    touching multiple hosts in a short period suggests activity spanning more than a single
    system. If the alert fired under SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a machine
    account (name ending in $), this query intentionally returns nothing — every host runs those
    principals constantly, so a fleet-wide pivot on them is noise, not an actor trail; use the
    program- and host-scoped questions instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      filter_svcprin_builtin:
        User:
        - SYSTEM
        - LOCAL SERVICE
        - NETWORK SERVICE
      filter_svcprin_machine:
        User|endswith: $
      condition: (selection) and not 1 of filter_svcprin_*
    fields:
    - host.name
    - Image
- question: Where has this user authenticated recently?
  context: >-
    Authentication events show which systems the user reached before and after the install. A
    user authenticating to many systems in a short period, particularly interactive or remote
    logons, is consistent with hands-on activity spanning hosts rather than a local automated
    task. If the alert fired under SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a machine account
    (name ending in $), this query intentionally returns nothing — service-principal logons are
    background noise, not an actor trail. For a human account, zero results can also mean the
    Security channel is not ingested for the relevant hosts; confirm 4624 visibility before
    reading zero as "no authentications".
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
        - 4624
        - 4625
        TargetUserName|expand: '%User%'
      filter_svcprin_builtin:
        TargetUserName:
        - SYSTEM
        - LOCAL SERVICE
        - NETWORK SERVICE
      filter_svcprin_machine:
        TargetUserName|endswith: $
      condition: (selection) and not 1 of filter_svcprin_*
    fields:
    - host.name
    - IpAddress
    - EventID
    - LogonType
