name: XBAP Execution From Uncommon Locations Via PresentationHost.EXE
id: af8fe813-3641-4d75-a395-c96dbec36f9b
description: |
  Detects PresentationHost.exe executing a XAML Browser Application (.xbap) file from a path outside C:\Windows\ and C:\Program Files. The rule fires when all of the following hold: the image ends in presentationhost.exe (or its OriginalFileName is PresentationHost.exe) AND the command line contains .xbap AND the command line does NOT reference C:\Windows\ or C:\Program Files. PresentationHost.exe is a signed Microsoft binary that hosts WPF browser applications; because it is trusted and can both run XBAP code and retrieve a remote payload into INetCache, it is abused to proxy-execute code and bypass application allowlisting. Legitimate XBAPs are uncommon on modern workstations and normally ship from system or Program Files locations. Determine what the .xbap is and where it came from, whether a remote payload was fetched, what code the host loaded, and whether the parent and user account are expected to run browser applications this way.
type: detection
detection_id: d22e2925-cfd8-463f-96f6-89cec9d9bc5f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- question: Does the command line invoke presentationhost.exe against a .xbap file from a path outside C:\Windows\ and C:\Program Files?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when the image is presentationhost.exe (or its OriginalFileName is PresentationHost.exe) AND the command line contains .xbap AND the command line does not reference C:\Windows\ or C:\Program Files. Confirm all three conditions hold in the exact command that fired, and note the actual on-disk location of the .xbap file.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run XAML browser applications via presentationhost.exe?
  context: XBAPs are uncommon on modern production workstations, and PresentationHost.exe is rarely launched interactively. A user or host with no business reason to run browser applications is a stronger signal than a developer workstation or a line-of-business application that ships a legitimate .xbap. Knowing the user role and host function is often the fastest path to separating a true positive from routine use.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did presentationhost.exe run? Decode the full command line and the .xbap target.
  context: The full command line reveals the .xbap argument and any additional switches. Pull the exact on-disk path or URL of the .xbap target — a local path in a user-writable directory (Temp, Downloads, AppData, Public, ProgramData) versus a remote http(s) URL distinguishes a staged local payload from a remote-hosted one. Decode any URLs, script paths, or DLL entrypoints in the arguments to understand what code the binary was directed to host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Did this presentationhost.exe execution open a network connection, and to what destination?
  context: PresentationHost.exe can retrieve a remote XBAP payload and place it in INetCache, so a network connection from this process points to a remote-hosted payload rather than a purely local file. Confirm whether the destination is an expected internal or enterprise host, or an unknown external address. Connections to legitimate enterprise domains can be treated as routine; an unexpected external destination broadens the scope. If network telemetry for this process is not collected in this environment, treat zero results as a visibility gap rather than evidence no connection occurred.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: What modules did presentationhost.exe load while hosting the .xbap?
  context: Hosting a XAML browser application loads .NET and WPF assemblies into the process; an XBAP that proxies attacker code may also pull in unsigned or unexpected modules from user-writable directories. Review the loaded modules for assemblies outside the system framework paths or with absent or untrusted signatures, which indicate code being hosted beyond a benign browser application. If image-load telemetry is not collected in this environment, treat zero results as a visibility gap rather than evidence nothing loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- question: What process spawned presentationhost.exe, and is that parent chain expected?
  context: The parent process reveals how the browser application was launched. A user opening a .xbap from explorer.exe or a browser differs from one launched by mshta.exe, wscript.exe, cmd.exe, powershell.exe, or an Office application — those parents suggest a script or document drove the proxy execution. Walk up the tree to see what spawned the parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did presentationhost.exe spawn afterward?
  context: The processes a hosted XBAP spawns reveal its actual impact. A benign browser application rarely launches additional binaries; proxy execution often spawns cmd.exe, powershell.exe, certutil.exe, or other tooling for follow-on actions such as download, persistence, or reconnaissance.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \presentationhost.exe
      - OriginalFileName: PresentationHost.exe
      selection_cli:
        CommandLine|contains: .xbap
      filter_main_generic:
        CommandLine|contains:
        - ' C:\Windows\'
        - ' C:\Program Files'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \presentationhost.exe
      - OriginalFileName: PresentationHost.exe
      selection_cli:
        CommandLine|contains: .xbap
      filter_main_generic:
        CommandLine|contains:
        - ' C:\Windows\'
        - ' C:\Program Files'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar proxy-execution activity on several hosts, the scope may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \presentationhost.exe
      - OriginalFileName: PresentationHost.exe
      selection_cli:
        CommandLine|contains: .xbap
      filter_main_generic:
        CommandLine|contains:
        - ' C:\Windows\'
        - ' C:\Program Files'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, credential access, or a delivery step that staged the .xbap — may reveal the attack stages that preceded this proxy execution and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were any other proxy-execution LOLBins used on this host recently?
  context: Operators who use one proxy-execution LOLBin often use several. If PresentationHost.exe hosted code, check whether rundll32, regsvr32, mshta, msbuild, installutil, msiexec, or similar trusted binaries were also used to run arbitrary code on this host. Multiple proxy-execution utilities achieving the same objective strengthens the case for deliberate allowlist bypass rather than incidental use.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was presentationhost.exe executed from its expected system path?
  context: PresentationHost.exe normally runs from C:\Windows\System32 or C:\Windows\SysWOW64. A copy executed from outside those paths may have been relocated or renamed to evade path-based allowlists, and the rule already flags command lines that do not reference C:\Windows\ or C:\Program Files. Compare the Image path against OriginalFileName to spot a renamed or relocated copy.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired the rule's PresentationHost XBAP pattern over the past 90 days, and what command-line structures are typical?
  context: A PresentationHost XBAP pattern with no prior history on a host is more suspicious than one used regularly under stable parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects the rule's specific firing pattern rather than generic use of the binary. The command-line projection lets the typical invocation patterns be compared against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \presentationhost.exe
      - OriginalFileName: PresentationHost.exe
      selection_cli:
        CommandLine|contains: .xbap
      filter_main_generic:
        CommandLine|contains:
        - ' C:\Windows\'
        - ' C:\Program Files'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection* and not 1 of filter_main_*) and _pb_scope
    fields:
    - CommandLine
