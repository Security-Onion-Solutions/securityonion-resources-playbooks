name: Potential DLL Sideloading Of KeyScramblerIE.DLL Via KeyScrambler.EXE
id: b84d3c22-860e-4a00-82fa-c4a2f7f2ae4b
description: |
  Detects KeyScramblerIE.dll being loaded by KeyScrambler.exe or KeyScramblerLogon.exe when the module does not load from the canonical install directory (C:\Program Files\KeyScrambler\ or C:\Program Files (x86)\KeyScrambler\) AND is not validly signed by QFX Software Corporation. A legitimate KeyScrambler install loads a QFX-signed DLL from its own program directory; a fired alert means a DLL with that name loaded from an unexpected path or without a valid vendor signature, which is the pattern of a masqueraded module placed next to the trusted binary for search-order sideloading. Determine whether the loaded DLL is the genuine signed component or a substitute, where it was dropped from, what the loading process did afterward, and whether other execution-flow or persistence changes accompanied it.
type: detection
detection_id: d2451be2-b582-4e15-8701-4196ac180260
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the loaded module match what this rule detects — path, signature, and loading process?
  context: Confirm the alert by reviewing the exact module path (ImageLoaded), its code-signature status, and the loading process against the rule's criteria. The rule fires only when KeyScramblerIE.dll loads into KeyScrambler.exe or KeyScramblerLogon.exe AND the module is neither inside C:\Program Files\KeyScrambler\ (or the x86 variant) nor validly signed by QFX Software Corporation. A load from a user-writable or temporary directory, or an unsigned or invalidly signed DLL, is the true-positive condition. The library event carries the module's signing status and hash directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Is this user and host expected to run KeyScrambler?
  context: KeyScrambler is a consumer keystroke-encryption application. Knowing whether the host and user normally have it installed and running is often the fastest way to separate a genuine install from a binary staged only to sideload a DLL. A host with no history of this software, or a service or machine account loading it, weighs toward a staged foothold rather than routine use.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What modules did this process load, and which came from non-canonical paths, are unsigned, or sit in user-writable directories?
  context: The set of modules the process loaded tells the story of the sideload. The canonical location for this DLL is C:\Program Files\KeyScrambler\ or C:\Program Files (x86)\KeyScrambler\; a load of KeyScramblerIE.dll from %TEMP%, AppData, ProgramData, Public, or any other directory is a search-order sideloading signal. Note any additional unsigned modules loaded from the same directory, since a dropper commonly stages several files together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For the loaded KeyScramblerIE.dll, what are its signing status, hash, and threat-intel reputation?
  context: Module reputation separates the genuine component from a substitute. The legitimate KeyScramblerIE.dll is signed by QFX Software Corporation with a Valid signature status; a masqueraded copy is typically unsigned, or carries an Expired, Distrusted, or Invalid status, and its hash will not match the vendor build. Look up the Hashes value against threat intelligence — sideloaded copies of this DLL have been used to launch a command interpreter that downloads and runs a scripted follow-on payload.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What process spawned the loading binary, and is that parent chain expected?
  context: The parent of KeyScrambler.exe or KeyScramblerLogon.exe reveals how it was launched. A genuine install starts from explorer.exe, a services host, or an installer; a start from an archive utility, a browser download directory, a script host, or an Office application points to a binary that was dropped and launched to carry the sideloaded DLL. Walk up the tree by pivoting on the parent's own parent when the immediate parent looks routine.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What child processes did the loading binary spawn afterward?
  context: The processes spawned after the DLL loads reveal the sideload's actual payload. A genuine KeyScrambler run spawns predictable children; a sideloaded module commonly launches cmd.exe or a script interpreter to download and execute a staged next stage such as a scripting-engine interpreter. Unexpected command interpreters, downloaders, or interpreter binaries under this parent are the follow-on to chase.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When was KeyScramblerIE.dll written to this host, and which process wrote it?
  context: Correlating the DLL's on-disk creation time and writing process against the load event distinguishes a stable install from a fresh sideload. A DLL dropped minutes before the load, or written by an archive utility, a browser, or a script host rather than a KeyScrambler installer, indicates the module was staged to hijack the load. A file that has sat unchanged since the application was installed weighs toward legitimacy.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: '\KeyScramblerIE.dll'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
- question: Is the loaded DLL still on disk for analysis?
  context: If the sideloaded module and any files it staged are still present, they can be hashed, submitted to a safe environment, or reviewed directly. This query correlates file writes back to the alerting process and its direct children so the analyst can locate the DLL and any dropped payload for collection before it is cleaned up.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has KeyScramblerIE.dll been loaded on this host before, and under what processes?
  context: A first-time load of this module on a host is a stronger anomaly signal than a recurring one. If the same DLL has been loaded repeatedly by the same signed KeyScrambler binary from the canonical directory over the past 90 days, this load is probably routine. If this is the first occurrence, or the module has only ever loaded from different paths or under different processes, the current load is anomalous.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: When this host has previously matched the rule's pattern, what programs and users drove it, and does the current alert fit?
  context: The query mirrors the rule's selection scoped to this host, so the resulting program and user distribution reflects how this specific sideloading pattern (not generic KeyScrambler usage) has historically appeared here. A new acting program process, an unexpected user account, or a first-ever occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith:
        - \KeyScrambler.exe
        - \KeyScramblerLogon.exe
        ImageLoaded|endswith: \KeyScramblerIE.dll
      filter_main_legitimate_path:
        Image|contains:
        - C:\Program Files (x86)\KeyScrambler\
        - C:\Program Files\KeyScrambler\
        ImageLoaded|contains:
        - C:\Program Files (x86)\KeyScrambler\
        - C:\Program Files\KeyScrambler\
      filter_main_signature:
        Signature: QFX Software Corporation
        SignatureStatus: Valid
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts matched the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this sideloading pattern rather than generic use of the software. Many hosts matching the same pattern points to a scripted or packaged deployment; one host or a small unrelated set points to targeted operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith:
        - \KeyScrambler.exe
        - \KeyScramblerLogon.exe
        ImageLoaded|endswith: \KeyScramblerIE.dll
      filter_main_legitimate_path:
        Image|contains:
        - C:\Program Files (x86)\KeyScrambler\
        - C:\Program Files\KeyScrambler\
        ImageLoaded|contains:
        - C:\Program Files (x86)\KeyScrambler\
        - C:\Program Files\KeyScrambler\
      filter_main_signature:
        Signature: QFX Software Corporation
        SignatureStatus: Valid
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
- question: Were execution-flow registry keys modified on this host around the alert?
  context: Search-order sideloading is one execution-hijack mechanism; registry-driven variants are another and often accompany it. Modifications to AppInit_DLLs, the KnownDLLs list, Image File Execution Options, or a .NET profiler environment key near the alert time indicate a broader effort to redirect module loading or process launch. Correlate any hits with the process that wrote them.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\Windows\CurrentVersion\Windows\AppInit_DLLs'
          - '\Control\Session Manager\KnownDLLs'
          - '\Image File Execution Options\'
          - 'COR_PROFILER'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Aggregating the surrounding process activity collapses routine agent telemetry into high-count rows while novel parent-child pairs stand out at low counts. Look for the process that dropped or launched the loading binary, and for reconnaissance, downloader, or staging activity in the same window that provides broader context.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, a suspicious download or archive extraction — may reveal the stages that preceded the sideload and help reconstruct the timeline. The alert sequence on a host often tells the operation's story better than any single event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Does the user or administrator recall installing or running KeyScrambler?
  context: Direct confirmation from the person behind the account is often the fastest way to establish legitimacy. If the user did not install or launch this software, the binary was likely staged by something else and the DLL load should be treated as a sideload. If they did, capture why and from where they obtained the installer.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were other process-based persistence mechanisms installed on this host?
  context: A sideloaded module is one foothold; operators commonly add backup persistence using different techniques. Scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions installed in the same timeframe indicate intentional stacking rather than an isolated event. This query surfaces persistence-tool executions on the host around the alert.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations (Startup folders, scheduled-task definitions) on this host?
  context: File-based persistence bypasses command-line detection entirely. Dropping an executable or script into a Startup folder or a path referenced by a registry Run key achieves persistence without running the standard persistence tools. File event monitoring captures these drops even when the operator avoids schtasks, sc, or reg.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
