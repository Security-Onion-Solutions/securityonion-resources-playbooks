name: Potential Mfdetours.DLL Sideloading
id: 1a646447-4036-4252-b83f-515a949c15c8
description: >-
  Detects a module named mfdetours.dll being loaded from a directory other than
  the Media Foundation trace tooling location that ships with the Windows SDK
  (C:\Program Files (x86)\Windows Kits\10\bin\). The mftrace.exe debugging tool
  can be abused to attach to an arbitrary process and force-load any DLL named
  mfdetours.dll from the current working directory, giving code execution inside
  the target process. Investigation should confirm the load path and signature
  of the DLL, identify the process that loaded it and its parent chain, and
  determine whether a legitimate developer or tracing workflow explains the load.
type: detection
detection_id: d2605a99-2218-4894-8fd3-2afb7946514d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Is the flagged mfdetours.dll load genuine, and was it loaded from a directory other than the Windows Kits tracing path?
  context: >-
    Confirm the alert is a true positive by reviewing the exact module path
    (ImageLoaded) against the rule's known-good location, C:\Program Files
    (x86)\Windows Kits\10\bin\, which is where the Media Foundation trace tooling
    legitimately ships mfdetours.dll. A load of that filename from any other
    directory, especially the current working directory of the loading process,
    is what the rule flags. DLL loads carry signing status and a hash on the load
    event, so check those on the same record.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this user and host expected to run Media Foundation tracing or developer tooling that loads mfdetours.dll?
  context: >-
    Legitimate loads of mfdetours.dll come from developers or QA staff running
    mftrace.exe from the Windows SDK. If the host is not a developer or build
    machine and the user has no reason to run media-tracing tools, the load is
    harder to explain and warrants deeper review.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is the loaded mfdetours.dll signed, and what are its hash and reputation?
  context: >-
    Module reputation separates a legitimate Microsoft-signed mfdetours.dll from
    a side-loaded impostor. A validly signed Microsoft binary staged in an
    unusual directory may still be benign, but an unsigned or invalidly signed
    file reusing the mfdetours.dll name is a strong masquerading signal. The load
    event carries signing status and hash directly, so pivot the hash against
    threat intelligence and compare it to a known-good mfdetours.dll baseline.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What other modules did this process load, and are any from user-writable or non-canonical directories?
  context: >-
    The full set of modules a process loads around the sideload shows whether
    mfdetours.dll was an isolated event or part of a broader set of untrusted
    loads. Look for additional DLLs loaded from the same working directory,
    unsigned modules where signed ones are expected, and system DLL names loaded
    from non-system paths.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: From what working directory did the loading process run, and what was its full command line?
  context: >-
    DLL sideloading via mftrace.exe relies on the target process running with a
    current working directory that contains the planted mfdetours.dll. Reviewing
    the loading process command line and its working directory shows where the
    DLL was loaded from and whether that directory is attacker-controlled, such
    as a user-writable or temporary path.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned the process that loaded mfdetours.dll, and is that parent chain expected?
  context: >-
    The mftrace.exe tool attaches to a target process and forces the
    mfdetours.dll load from the current directory, so it typically appears as the
    parent or launching process. A parent of mftrace.exe, or a scripting or
    Office parent launching the loader, points to abuse rather than a developer
    running the trace tool directly.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Is the mfdetours.dll file still on disk for analysis?
  context: >-
    If the planted mfdetours.dll is still present it can be hashed, submitted to
    a sandbox, and reviewed for its export table and behavior. This query
    correlates file writes to the loading process and its direct children so the
    dropped file can be located even when the working directory is not obvious
    from the load event.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has mfdetours.dll been loaded on this host before, and by which processes?
  context: >-
    A first-time load of mfdetours.dll on a host is a stronger anomaly than a
    recurring one. If the same DLL has been loaded repeatedly by a consistent
    developer or tracing process over the past 90 days, this load is likely
    routine; a first occurrence, or a history of loads only by unrelated
    processes, marks the current load as anomalous.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Is mfdetours.dll being loaded on other hosts, and under which processes?
  context: >-
    Cross-host correlation shows how far the activity spread. The same
    mfdetours.dll load on a single host may be a localized event, while the same
    load across multiple hosts suggests shared tooling or distributed activity.
    Pay attention to the variety of loading processes: a single expected loader
    is benign, while the DLL loading under different or unexpected processes
    across hosts points to broader abuse.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Were DLL search-order or image-execution registry keys modified on this host around the alert?
  context: >-
    Beyond current-directory sideloading, DLL hijacking can be reinforced through
    registry keys that steer module resolution, such as KnownDLLs, AppInit_DLLs,
    and Image File Execution Options. Modifications to these keys near the load
    time suggest an attacker is establishing a more durable hijack than a one-off
    working-directory plant.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\Session Manager\KnownDLLs'
          - '\CurrentVersion\Windows\AppInit_DLLs'
          - '\Image File Execution Options\'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: What other activity occurred on this host around the time of the load?
  context: >-
    Alerts rarely occur in isolation. Activity in the minutes around the load
    reveals what led to it and what followed, such as reconnaissance, additional
    payload drops, privilege escalation, or persistence. Correlating process,
    file, and module telemetry within a short window around the load is how the
    sideload is placed in the context of the surrounding operation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Was there a change ticket, maintenance window, or documented approval for running this tooling?
  context: >-
    Media Foundation tracing and DLL debugging are legitimate developer
    activities but are rarely run on production hosts without a reason. A
    corresponding ticket or maintenance window suggests authorized work; its
    absence on a host where such tooling is not expected raises the priority.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this load align with normal work hours and maintenance windows?
  context: >-
    Legitimate tracing and debugging usually happen during business hours or
    scheduled work. A mfdetours.dll load outside working hours, on a host with no
    maintenance window, is more suspicious than the same load during a documented
    development session.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did other detections fire on this host in the hours before this load?
  context: >-
    Earlier detections on the same host, such as defense tampering,
    reconnaissance, credential access, or a suspicious file write, may reveal the
    stages that preceded the sideload and help reconstruct the timeline.
    Reviewing the alert sequence on the host shows whether this load is one step
    in a larger operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host around the load?
  context: >-
    Attackers rarely rely on a single foothold. After a sideload gives execution
    inside a target process, they commonly add backup persistence using
    scheduled tasks, services, registry Run keys, BITS jobs, or WMI
    subscriptions. Multiple persistence installations in the same timeframe
    indicate intentional stacking rather than isolated activity.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task persistence locations on this host?
  context: >-
    File-based persistence bypasses command-line detection. Dropping an
    executable or script into a Startup folder or a path referenced by a registry
    Run key achieves persistence without running standard persistence tools, and
    may accompany a sideload used for initial execution. File monitoring captures
    these drops even when the attacker avoids schtasks, sc, or reg.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
