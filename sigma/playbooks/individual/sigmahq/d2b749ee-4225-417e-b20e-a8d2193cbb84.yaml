name: PUA - AdvancedRun Execution
id: cbe6a6c5-4a4a-4a08-8fdb-d03203b15b9e
description: |
  Detects execution of the NirSoft AdvancedRun utility, which launches an
  arbitrary target binary under a chosen security context (current user,
  Administrator, SYSTEM, or TrustedInstaller) via a /RunAs token argument. The
  rule fires when the process carries the AdvancedRun OriginalFileName, or when
  the command line combines /EXEFilename with /Run, or when it combines
  /WindowState 0 with /RunAs and /CommandLine. Legitimate use is rare and
  usually tied to a documented IT or troubleshooting task; the same syntax is
  reused to elevate to SYSTEM or TrustedInstaller in order to stop endpoint
  protection services and delete protected directories before a destructive
  payload runs. Determine which target binary was launched, under what
  privilege level, with what window visibility, and whether protection on the
  host was weakened around the same time.
type: detection
detection_id: d2b749ee-4225-417e-b20e-a8d2193cbb84
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does this process match the AdvancedRun execution pattern this rule detects?
  context: >-
    Confirm the alert before investing time. The rule matches on any one of three
    conditions, so note which branch fired -- the OriginalFileName being
    AdvancedRun.exe, the command line carrying both /EXEFilename and /Run, or the
    command line carrying /WindowState 0 together with /RunAs and /CommandLine. The
    /RunAs and /CommandLine combination indicates a target binary was launched
    under a selected token; review the full command line against the branch that
    matched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run a run-as elevation utility like AdvancedRun?
  context: >-
    Legitimate AdvancedRun use is rare and usually tied to a specific
    administrator performing a documented task. A standard user account or a
    host with no IT support role running a tool that relaunches binaries as
    SYSTEM or TrustedInstaller is harder to explain as routine operations.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is AdvancedRun on the organization's approved software list?
  context: >-
    Organizations typically maintain a list of sanctioned administrative and
    support utilities. AdvancedRun is a portable run-as tool that does not
    require installation; its presence outside an approved toolset may represent
    shadow IT or attacker-staged tooling. Check it regardless of how well known
    the utility is.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a change ticket, maintenance window, or support session that explains this AdvancedRun run?
  context: >-
    Legitimate elevation-utility use generally lines up with a documented
    troubleshooting task, an installer that needs SYSTEM context, or a scheduled
    maintenance window. If no such context exists, the run is more likely
    operator activity staging an elevated action.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What target binary and arguments did AdvancedRun launch, and at what privilege level?
  context: >-
    Decode the command line argument by argument. /EXEFilename names the target
    binary; /CommandLine carries the arguments passed to it; /RunAs sets the
    security context, where 1 and 2 are the current user, 3 is Administrator, 4
    is SYSTEM, and 8 is TrustedInstaller; /StartDirectory sets the working
    directory; /Run executes immediately. A SYSTEM or TrustedInstaller target
    that invokes sc, net, taskkill, powershell, or cmd against security services
    or protected directories is the high-impact case.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        OriginalFileName: AdvancedRun.exe
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - User
- question: What security context did AdvancedRun request via /RunAs, and does it cross an integrity boundary?
  context: >-
    AdvancedRun spawns the target under the token named by /RunAs. Values of 4
    (SYSTEM) or 8 (TrustedInstaller) move the child above the integrity level the
    parent normally holds, which is the privilege-escalation step this technique
    describes. Compare the spawning user against the requested context; a
    medium-integrity user account requesting SYSTEM or TrustedInstaller is the
    mismatch worth chasing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: ' /RunAs '
      condition: selection
    fields:
      - CommandLine
      - User
      - IntegrityLevel
      - ParentImage
- question: Did a privileged logon or special-privileges assignment occur on this host around the alert?
  context: >-
    When a target is launched under SYSTEM or TrustedInstaller, the host records
    a logon and a special-privileges assignment for the new security context.
    Correlating that event with the AdvancedRun execution window confirms the
    token change actually took effect rather than failing. Absence of a matching
    privileged logon suggests the elevation request did not succeed.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - EventID
      - SubjectUserName
      - TargetUserName
      - PrivilegeList
- question: Was the launched target hidden from the interactive desktop via /WindowState 0?
  context: >-
    /WindowState 0 starts the spawned process with its window hidden, so an
    elevated action runs without a visible window on the interactive desktop.
    Hidden execution paired with an elevated /RunAs context is consistent with an
    operator suppressing on-screen evidence of a privileged action rather than an
    administrator running an interactive tool.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: ' /WindowState 0'
      condition: selection
    fields:
      - CommandLine
      - User
      - ParentImage
- question: What process spawned AdvancedRun, and is that parent chain expected?
  context: >-
    The parent process reveals how the utility was invoked. A launch from
    explorer.exe or a console a known administrator was using fits interactive
    work; a launch from a script host such as wscript.exe or cscript.exe, from
    an Office application, or from a binary dropped in a temporary directory is
    consistent with automated staging of an elevated action.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What processes did AdvancedRun launch, and what did those targets do next?
  context: >-
    The processes spawned through AdvancedRun reveal its actual impact. The
    target named in /EXEFilename runs under the requested token; watch for
    service-control utilities, powershell, cmd, or file-deletion commands that
    act against endpoint protection services or protected directories, which is
    the destructive-staging pattern this tooling enables.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this host run AdvancedRun before, and how often?
  context: >-
    A utility that has never run on a host is more notable than one that appears
    regularly as part of a support workflow. Zero or very low historical counts
    point to first-time or rare execution and raise the weight of the other
    findings.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        OriginalFileName: AdvancedRun.exe
      condition: selection
    fields:
      - User
- question: When this host has fired this AdvancedRun pattern before, what parents and users drove it, and does this alert fit?
  context: >-
    The query mirrors the rule's selection scoped to this host, so the parent and
    user distribution reflects how this specific firing pattern -- not generic
    AdvancedRun usage -- has run here. A new parent process, an unexpected user
    account, or an unusual command-line structure relative to that history is the
    deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
      - OriginalFileName: AdvancedRun.exe
      - CommandLine|contains|all:
        - ' /EXEFilename '
        - ' /Run'
      - CommandLine|contains|all:
        - ' /WindowState 0'
        - ' /RunAs '
        - ' /CommandLine '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
      - OriginalFileName: AdvancedRun.exe
      - CommandLine|contains|all:
        - ' /EXEFilename '
        - ' /Run'
      - CommandLine|contains|all:
        - ' /WindowState 0'
        - ' /RunAs '
        - ' /CommandLine '
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
      - OriginalFileName: AdvancedRun.exe
      - CommandLine|contains|all:
        - ' /EXEFilename '
        - ' /Run'
      - CommandLine|contains|all:
        - ' /WindowState 0'
        - ' /RunAs '
        - ' /CommandLine '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around the time of this alert?
  context: >-
    Tracking the user's activity across all hosts reveals whether the elevated
    execution is isolated or part of activity spanning multiple endpoints. The
    same user triggering similar activity on several hosts widens the scope of
    the investigation.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
      - OriginalFileName: AdvancedRun.exe
      - CommandLine|contains|all:
        - ' /EXEFilename '
        - ' /Run'
      - CommandLine|contains|all:
        - ' /WindowState 0'
        - ' /RunAs '
        - ' /CommandLine '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
