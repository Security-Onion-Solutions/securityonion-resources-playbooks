name: AWL Bypass with Winrm.vbs and Malicious WsmPty.xsl/WsmTxt.xsl - File
id: 771fabec-5195-4a28-91a2-f83cf495a5dc
description: |
  Detects creation of WsmPty.xsl or WsmTxt.xsl anywhere other than C:\Windows\System32 or C:\Windows\SysWOW64. The signed
  Windows script winrm.vbs loads these XSL files from the script host's own directory when it is invoked with -format:pretty
  or -format:text; an attacker who copies cscript.exe (or a renamed wscript.exe) into a writable directory and drops a
  malicious XSL alongside it can execute arbitrary unsigned JScript through the signed cscript.exe -> signed winrm.vbs -> XSL
  chain, bypassing application allow-listing. The legitimate catalog-signed copies live only in the system directories, so a
  copy elsewhere is the trigger. Investigation should confirm the file is not the system copy, read the XSL for embedded
  script blocks, determine whether a script host actually loaded it via winrm.vbs, and identify any unsigned code or child
  processes that resulted.
type: detection
detection_id: d353dac0-1b41-46c2-820c-d7d2561fc6ed
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Was WsmPty.xsl or WsmTxt.xsl written to a path outside the Windows system directories?
  context: 'The legitimate copies of these XSL files exist only under C:\Windows\System32 and C:\Windows\SysWOW64. This detection
    fires when one of these filenames is written AND the path does not start with either system directory. Confirm the exact
    on-disk path and the process that wrote it; a copy anywhere else is the starting point for the rest of the investigation.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to place a Windows management XSL file in this directory?
  context: 'These XSL files are shipped once with the operating system and are not normally copied out of the system directories
    by users or administrators. If the writing process is a machine or service account, judge by the writing process and the
    host role rather than the account name.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the XSL file still on disk, or was it deleted or renamed after the alert?
  context: 'The file lifecycle drives next steps. An XSL still on disk can be retrieved, hashed, and compared against the
    catalog-signed system copy; a file deleted shortly after creation suggests anti-forensic cleanup and shifts the focus to
    what loaded or executed in the interval.'
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What is inside this XSL file, and does it contain an embedded script block?
  context: 'A weaponized WsmPty.xsl or WsmTxt.xsl embeds an ms:script block with implements-prefix="user" and language="JScript"
    that runs arbitrary code during the XSL transform, for example new ActiveXObject("WScript.Shell").Run to spawn a child, or
    a DotNetToJScript stub for in-memory .NET execution. Retrieve the file from its on-disk path and read it: legitimate system
    copies contain only formatting logic and no script/ActiveXObject content.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did a script host run winrm.vbs on this host, and is that host binary the genuine catalog-signed copy?
  context: 'The XSL is loaded as data by cscript.exe or wscript.exe running winrm.vbs, so it never runs as its own process and
    carries no execution hash. The verifiable binary is the script host itself: read its hash and signature and submit the hash
    to threat intelligence. A copied or renamed script host defeats the "cscript.exe" substring self-check inside winrm.vbs, so
    an unsigned or unexpectedly located cscript.exe/wscript.exe is itself the signal. Separately, compare the dropped XSL on disk
    against the catalog-signed System32 copy; any difference means the file was altered.'
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
        Image|endswith:
          - \cscript.exe
          - \wscript.exe
      selection_winrm:
        CommandLine|contains: winrm.vbs
      condition: selection_host and selection_winrm
    fields:
      - Image
      - CommandLine
      - Hashes
- question: After the XSL was dropped, did a script host load it by running winrm.vbs with a format switch?
  context: 'winrm.vbs reads WsmPty.xsl when invoked with -format:pretty and WsmTxt.xsl with -format:text (the /format and quoted
    variants behave identically). A command line combining winrm.vbs with one of these format switches on this host is the load
    event that turns the dropped file into executed code. The parent process shows how the script host was launched. A short delta
    between the file drop and this execution strengthens the link between the two stages.'
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_winrm:
        CommandLine|contains: winrm.vbs
      selection_format:
        CommandLine|contains:
          - format:pretty
          - format:text
          - 'format:"pretty"'
          - 'format:"text"'
      condition: selection_host and selection_winrm and selection_format
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: What child processes did cscript.exe or wscript.exe spawn while running winrm.vbs?
  context: 'The embedded JScript in a malicious XSL executes inside the script host and typically spawns a child, for example
    cmd.exe or powershell.exe via WScript.Shell.Run, or a download cradle. A signed script host that is the parent of an
    unsigned or unexpected child is the signed-to-unsigned transition this technique produces. Review the child command lines
    for payload retrieval, encoded content, or interactive shells.'
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        host.name|expand: '%hostname%'
        ParentImage|endswith:
          - \cscript.exe
          - \wscript.exe
      selection_winrm:
        ParentCommandLine|contains: winrm.vbs
      condition: selection_parent and selection_winrm
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Did the script host load the .NET runtime, indicating in-memory unsigned code execution?
  context: 'cscript.exe and wscript.exe do not normally host the managed runtime. A load of clr.dll, clrjit.dll, or mscoree.dll
    into the script host is the signature of a DotNetToJScript-style payload executing unsigned .NET assemblies in memory
    through the XSL script block. If module-load telemetry is not collected in this environment, treat zero results as a
    visibility gap rather than evidence nothing loaded.'
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
        Image|endswith:
          - \cscript.exe
          - \wscript.exe
      selection_clr:
        ImageLoaded|endswith:
          - \clr.dll
          - \clrjit.dll
          - \mscoree.dll
      condition: selection_host and selection_clr
    fields:
      - Image
      - ImageLoaded
      - Signed
- question: What other files did the responsible process write or delete around the alert?
  context: 'The same process that dropped the XSL often stages the rest of the bypass in the same operation, most notably a
    copied cscript.exe or a renamed wscript.exe placed alongside the XSL so winrm.vbs loads from an attacker-controlled
    directory. The breadth, paths, and extensions of the process other file activity enumerate what else needs review.'
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has this XSL file been seen before on this host?
  context: 'The legitimate copies of these files change rarely and live only in the system directories. A first-time or very
    low historical count for this filename at this path indicates a newly introduced file rather than routine operation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Is this XSL file present on any other hosts in the environment?
  context: 'The same filename appearing outside the system directories on multiple hosts points to deliberate distribution or a
    repeatable bypass procedure rather than a one-off. A single host suggests a targeted or manual action; several hosts warrant
    mapping the distribution pattern and timeline.'
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: 'The query mirrors the rule selection scoped to this user, so the result is the user 90-day history of dropping these
    XSL files outside the system directories, aggregated by host. A user who has never produced this pattern is more notable than
    one who does so routinely; weigh the count against the user role and typical toolset.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      system_files:
        TargetFilename|endswith:
        - WsmPty.xsl
        - WsmTxt.xsl
      in_system_folder:
        TargetFilename|startswith:
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
      _pb_scope:
        User|expand: '%User%'
      condition: (system_files and not in_system_folder) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this XSL-drop pattern, or is the program new for this activity?
  context: 'When the alert fires under a service or machine account, user identity does not attribute the behavior; the launch
    mechanism does. The query mirrors the rule selection scoped to the alerting program, so the result is the 90-day
    history of this program producing this specific pattern. A new or rare program for this pattern is the deviation worth chasing;
    a program that already accounts for many prior events is likely vendor or operating-system automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      system_files:
        TargetFilename|endswith:
        - WsmPty.xsl
        - WsmTxt.xsl
      in_system_folder:
        TargetFilename|startswith:
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (system_files and not in_system_folder) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: 'Tracking the user activity across all hosts reveals whether the same account triggered related activity elsewhere.
    Concurrent activity on multiple hosts widens the potential scope; when the alert fires under a service or machine account,
    the parent-driven view is the meaningful pivot instead.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window, or is it isolated to this host?
  context: 'Under a service or machine account, per-user network activity returns agent-telemetry noise. The meaningful question
    is whether the same launch mechanism produced this XSL-drop pattern elsewhere in the alert window: multiple hosts point to
    scheduled or pushed automation, while a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      system_files:
        TargetFilename|endswith:
        - WsmPty.xsl
        - WsmTxt.xsl
      in_system_folder:
        TargetFilename|startswith:
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (system_files and not in_system_folder) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Aggregating process activity around the alert surfaces the immediate context of
    the drop and load, such as the copy of cscript.exe into place, reconnaissance, or follow-on execution. Novel parent-child
    pairs stand out at low counts against the repetitive high-count agent telemetry.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: 'Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal the
    stages that preceded the drop and help reconstruct the timeline. The sequence of alerts often tells the operation story.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
