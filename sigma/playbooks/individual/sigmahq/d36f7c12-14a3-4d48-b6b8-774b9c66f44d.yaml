name: Potential Python DLL SideLoading
id: f3effb03-39dc-4633-8d05-d8e9c034d5e3
description: |
  Detects a Python runtime DLL (python39.dll through python312.dll) loading from a directory outside the canonical Python installation, build, and packaging locations while the module is not signed by the Python Software Foundation. This is the pattern of DLL search-order hijacking, where a legitimately named Python DLL is placed beside a loader executable in a user-writable directory so the loader resolves the malicious copy first; trojanized installers commonly use this to run obfuscated Python loaders and stage follow-on payloads and persistence. Legitimate Python applications, PyInstaller bundles, Visual Studio, and Anaconda are excluded by the rule, so the investigation should confirm the load path, the module's signature and hash, and the identity and lineage of the loading process.
type: detection
detection_id: d36f7c12-14a3-4d48-b6b8-774b9c66f44d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the loaded module match what this rule detects for its path, code signature, and loading process?
  context: Confirm the alert is a true positive by reviewing the exact module path, its code-signature status, and the process that loaded it against the rule's criteria. The rule fires when a python3xx.dll loads from outside the standard Python install, build, and packaging directories and the module is not signed by the Python Software Foundation, so a genuine Python runtime relocated by an installer can still be benign. DLL loads carry a hash and signing status directly on the load event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
  answer_sources:
  - alert
  - image_load
- question: Is this user and host expected to run Python-based software from the observed location?
  context: Legitimate Python applications and developer tooling load these runtime DLLs routinely. Knowing whether this user role and host function are consistent with running Python-based software from the observed path is often the fastest way to separate a benign relocation from a side-loaded payload.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What modules did the loading process pull in, and did any load from a user-writable or non-canonical directory?
  context: The set of modules a process loads tells the story when the load path alone is ambiguous. Look for the python3xx.dll resolving from the loader's own directory rather than an installed Python location, and for additional payload DLLs loaded from AppData, ProgramData, Temp, or Public immediately afterward, which extends a single sideload into a loader chain.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - image_load
  - manual_review
- question: What is the signing status, hash, and reputation of the python DLL and any other modules loaded from unusual paths?
  context: Module reputation separates the genuine runtime from a side-loaded copy. A Python Software Foundation signature indicates the real DLL; an unsigned python3xx.dll, or one carrying a mismatched or invalid signer, is a strong masquerading signal. The hash on the load event supports a threat-intel lookup for known loaders. SignatureStatus values to weigh are Valid, Unsigned, Expired, Distrusted, and Invalid.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
  answer_sources:
  - image_load
  - external_threat_intel
  - manual_review
- question: What is the loading process, its full command line, and the working directory it ran from?
  context: Sideloading requires a loader executable placed beside the malicious DLL. The command line and working directory reveal whether the loader ran from a user-writable staging directory (a freshly extracted archive, a Temp path, an AppData folder) rather than an installed program location. This query returns every execution of the loading binary on this host within the window, which for a multi-stage dropper can span several sequential invocations.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned the loading executable, and is that parent chain expected for this program?
  context: The parent process reveals how the loader was invoked. A browser, mail client, archive utility, or script host spawning a freshly extracted executable that then side-loads a runtime DLL is a common delivery pattern. A loader launched by explorer.exe from a downloads or temp folder, or by wscript.exe or mshta.exe, deserves closer scrutiny than one started by an installed application's own service.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: When and by what process was the python DLL written to disk on this host, and where?
  context: Search-order hijacking depends on planting a python3xx.dll next to the loader. Identifying the writing process and the drop time relative to the load separates a normal Python install from a stage that dropped the DLL into a user-writable directory shortly before it was loaded. A DLL written by an archive extractor, browser, or script host rather than a Python installer is the stronger signal.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith:
          - \python39.dll
          - \python310.dll
          - \python311.dll
          - \python312.dll
      condition: selection
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
  answer_sources:
  - file_event
  - manual_review
- question: Are files written by the loading process or its child processes still on disk for analysis?
  context: If the loader or its children wrote payloads, scripts, or additional DLLs, checking whether those files still exist enables deeper analysis through hash lookups, sandbox submission, or content review. The correlation runs on the loading process and its direct children so files staged by the same operation are captured.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Were the registry values that govern DLL search order modified on this host around the time of the load?
  context: Removing an entry from KnownDLLs, adding it to ExcludeFromKnownDlls, or disabling SafeDllSearchMode forces the loader to resolve modules through the search path, which lets a planted DLL win over the system copy. Modifications to these Session Manager values shortly before the load point to deliberate manipulation of the resolution order rather than a simple misplaced file.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - \Session Manager\KnownDLLs
          - \Session Manager\ExcludeFromKnownDlls
          - \Session Manager\SafeDllSearchMode
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - manual_review
- question: Has this exact DLL load path been seen on this host before, and under which processes?
  context: A first-time load of this path is a stronger anomaly signal than a recurring one. If the same path has been loaded by the same process binary repeatedly over the past 90 days, the load is probably routine. If this is the first occurrence, or the path has only been loaded by unrelated processes historically, the current load is anomalous.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
  answer_sources:
  - image_load
- question: Is the same python DLL path loading on other hosts, and by which processes?
  context: Cross-host correlation surfaces distribution scope. A single-host load can be a localized incident; the same path loading across multiple hosts points to shared tooling or a multi-host intrusion. The variety of loading processes matters — a path loaded only by its expected application is routine, while the same path loaded by unrelated processes on other hosts suggests lateral progression.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - image_load
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the load reveals what led to it and what followed, and whether it is part of a larger sequence. Look for archive extraction, script hosts, reconnaissance commands, or persistence tooling running in the same window.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — delivery, reconnaissance, or defense tampering — may reveal the stages that preceded this load and help reconstruct the timeline leading to the sideload.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Was there a change ticket, maintenance window, or approval for installing or running this Python-based software?
  context: Many organizations require change tickets for software deployment. A corresponding ticket for installing or updating a Python-based application suggests authorized activity; absence of one when policy requires it suggests the load was unauthorized. This check can quickly close false positives or escalate true positives.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: Does the user recall installing or launching the application that loaded this DLL?
  context: Direct confirmation from the human behind the account is often the fastest path to determining legitimacy. If the user does not recall running the application, their credentials may be compromised or the activity may be automated. If they do recall it, get context on where the software came from and how it was obtained.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: Were other process-based persistence mechanisms installed on this host around the time of the load?
  context: Attackers rarely rely on a single persistence mechanism. After establishing a foothold through the sideload, they commonly install backups using scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions. Multiple persistence installations in the same timeframe indicate intentional stacking rather than isolated administration.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Were files dropped to Startup-folder or scheduled-task persistence locations on this host?
  context: File-based persistence bypasses command-line detection entirely. Dropping an executable or script into the Startup folder or a path referenced by a registry Run key achieves persistence without running schtasks, sc, or reg. File event monitoring captures these drops even when the loader avoids standard persistence tooling.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
