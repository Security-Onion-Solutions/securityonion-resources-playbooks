name: Ie4uinit Lolbin Use From Invalid Path
id: add084ee-0f87-4fae-a500-36d94c85802e
description: |
  Detects ie4uinit.exe running with a working directory that is set and is neither
  System32 nor SysWOW64. ie4uinit.exe references its INF file (ieuinit.inf) by bare
  filename, so it loads the INF from its own working directory first; copying the
  signed binary plus a maliciously edited ieuinit.inf into a writable directory and
  invoking it side-loads the attacker INF, which can register scrobj.dll against a
  remote Script Component (.sct) to gain code execution while presenting a
  Microsoft-signed binary. Legitimate use runs from the System32/SysWOW64 paths;
  execution from any other directory is the anomaly. The investigation should confirm
  the working directory, decode the command line, identify the INF and any scrobj.dll
  load or outbound .sct fetch, and establish whether the parent chain and user are
  expected.
type: detection
detection_id: d3bf399f-b0cf-4250-8bb4-dfc192ab81dc
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the alert match the rule — ie4uinit.exe (by Image or OriginalFileName) running with a working directory that is set and is not System32 or SysWOW64?
  context: Confirm the alert is a true positive before investing time. The rule fires when the
    process is ie4uinit.exe (matched on Image ending in ie4uinit.exe or OriginalFileName IE4UINIT.EXE)
    AND the CurrentDirectory is populated AND is neither c:\windows\system32\ nor c:\windows\sysWOW64\.
    Note the exact CurrentDirectory value — a user-writable location such as a profile folder, Temp,
    or C:\Windows\Tasks is the side-loading setup the rule targets.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Is this user and host expected to run ie4uinit.exe from a non-standard directory?
  context: Legitimate ie4uinit.exe runs during user-profile setup from System32/SysWOW64; a known
    exception is the ViberPC updater invoking ie4uinit.exe -ClearIconCache. Knowing whether this user
    role and host function would run the binary from a writable directory is often the fastest way to
    separate routine software behavior from operator-staged side-loading.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did ie4uinit.exe do? Decode the command line and identify the INF it processed.
  context: The full command line reveals the action taken. ie4uinit.exe -BaseSettings (and similar
    switches) processes the co-located ieuinit.inf; an INF carrying a RegisterOCXs/UnregisterOCXs
    directive that references scrobj.dll plus a URL is the INF-SCT execution primitive. Pair the
    command line with the working directory to locate the INF the binary read, since the reference is
    by bare filename relative to that directory.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Did ie4uinit.exe or a sibling process load scrobj.dll on this host around the alert?
  context: Script Component (.sct) execution from an INF works by registering scrobj.dll, which
    instantiates the embedded JScript/VBScript. An image-load of scrobj.dll by ie4uinit.exe (or by a
    related process in the same window) is direct evidence the INF-SCT primitive executed rather than
    a benign icon-cache refresh. If image-load telemetry is not collected in this environment, treat
    zero results as a visibility gap rather than evidence nothing loaded.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith: '\scrobj.dll'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Did ie4uinit.exe or a related process make any outbound connection to fetch a remote Script Component shortly after the alert?
  context: The INF-SCT directive can point scrobj.dll at a remote .sct URL, so the registration is
    followed by an outbound HTTP(S) fetch of the script payload. An outbound connection from
    ie4uinit.exe — or from a child it spawned — in the minutes after execution corroborates remote
    code retrieval. If network telemetry from endpoints is not collected here, treat zero results as a
    visibility gap, not absence of activity.
  range: +15m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        Initiated: 'true'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: What process spawned ie4uinit.exe and is that parent chain expected?
  context: The parent process reveals how the binary was invoked. Profile-setup runs are driven by
    predictable Windows parents; ie4uinit.exe launched from a writable directory by a script host
    (wscript.exe, cscript.exe, mshta.exe), an Office application, or a Run-key shell points toward
    staged execution or persistence rather than normal Active Setup behavior.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did ie4uinit.exe spawn afterward?
  context: The processes spawned after execution reveal the actual payload. Side-loaded INF-SCT
    activity commonly leads to script hosts or command interpreters (cmd.exe, powershell.exe,
    wscript.exe) running attacker code; benign icon-cache refreshes spawn nothing of interest.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      lolbin:
      - Image|endswith: \ie4uinit.exe
      - OriginalFileName: IE4UINIT.EXE
      filter_correct:
        CurrentDirectory:
        - c:\windows\system32\
        - c:\windows\sysWOW64\
      filter_missing:
        CurrentDirectory: null
      _pb_scope:
        User|expand: '%User%'
      condition: (lolbin and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      lolbin:
      - Image|endswith: \ie4uinit.exe
      - OriginalFileName: IE4UINIT.EXE
      filter_correct:
        CurrentDirectory:
        - c:\windows\system32\
        - c:\windows\sysWOW64\
      filter_missing:
        CurrentDirectory: null
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (lolbin and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or staging across
    multiple endpoints. If the same user triggered similar activity on more than one host, the scope
    of the activity may be larger than a single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      lolbin:
      - Image|endswith: \ie4uinit.exe
      - OriginalFileName: IE4UINIT.EXE
      filter_correct:
        CurrentDirectory:
        - c:\windows\system32\
        - c:\windows\sysWOW64\
      filter_missing:
        CurrentDirectory: null
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (lolbin and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- question: When this host has previously fired the rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even signed binaries can be abused. The query mirrors the rule's selection scoped to this
    host, so the parent/user distribution reflects how the rule's specific firing pattern — not
    generic ie4uinit.exe usage — has historically run here. A new parent process, an unexpected user
    account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      lolbin:
      - Image|endswith: \ie4uinit.exe
      - OriginalFileName: IE4UINIT.EXE
      filter_correct:
        CurrentDirectory:
        - c:\windows\system32\
        - c:\windows\sysWOW64\
      filter_missing:
        CurrentDirectory: null
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (lolbin and not 1 of filter_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led to
    this event and what happened after. Look for reconnaissance, privilege escalation, or persistence
    mechanisms; novel parent-child pairs at low counts stand out against repetitive system telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering,
    reconnaissance, or persistence setup — may reveal the stages that preceded this event and help
    reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were any other proxy-execution LOLBins used on this host recently?
  context: Operators who use one proxy-execution LOLBin often use several. If ie4uinit.exe was used to
    proxy code through an INF, check whether rundll32, regsvr32, mshta, cmstp, msiexec, installutil, or
    similar binaries also ran on the host. Finding multiple proxy-execution LOLBins performing the same
    objective strengthens the case for staged execution.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\installutil.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was ie4uinit.exe executed from an expected System32 or SysWOW64 path?
  context: ie4uinit.exe executed from outside System32/SysWOW64 may indicate the signed binary was
    copied into a writable directory to side-load a co-located malicious INF. The OriginalFileName
    field confirms the true identity of the binary even if the on-disk name was changed, and the Image
    path shows where it actually ran from.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired the rule's ie4uinit.exe pattern over the past 90 days, and what command-line structures are typical?
  context: A LOLBin pattern with no prior history on a host is more notable than one used regularly
    under stable parents. The query mirrors the rule's selection scoped to this host, so the count
    reflects the rule's specific firing pattern rather than generic ie4uinit.exe usage. The
    command-line projection lets the analyst compare typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      lolbin:
      - Image|endswith: \ie4uinit.exe
      - OriginalFileName: IE4UINIT.EXE
      filter_correct:
        CurrentDirectory:
        - c:\windows\system32\
        - c:\windows\sysWOW64\
      filter_missing:
        CurrentDirectory: null
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (lolbin and not 1 of filter_*) and _pb_scope
    fields:
    - CommandLine
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide
    count of the rule's firing pattern rather than generic binary usage. Many hosts firing the same
    pattern points to scripted deployment or vendor automation; one host or a small unrelated set
    points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      lolbin:
      - Image|endswith: \ie4uinit.exe
      - OriginalFileName: IE4UINIT.EXE
      filter_correct:
        CurrentDirectory:
        - c:\windows\system32\
        - c:\windows\sysWOW64\
      filter_missing:
        CurrentDirectory: null
      condition: lolbin and not 1 of filter_*
    fields:
    - host.name
