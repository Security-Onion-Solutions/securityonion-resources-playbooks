name: New Network Trace Capture Started Via Netsh.EXE
id: 25469469-10e7-4f39-8795-e0a2417c5eaa
description: |
  Detects netsh.exe invoked with both 'trace' and 'start' on the command line, which begins a packet capture session that writes traffic to an ETL file. Administrators and support staff legitimately use netsh trace for connectivity troubleshooting, so the action is not inherently malicious. Captured traffic can expose credentials, tokens, and session data transiting the host, so the investigation should determine who started the capture, under what parent process, what the capture was scoped to collect, and whether the activity fits the operator's normal role.
type: detection
detection_id: d3c3861d-c504-4c77-ba55-224ba82d0118
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line show netsh starting a network trace capture?
  context: Confirm the alert is a true positive by reviewing the triggering event. The rule fires only when the process is netsh.exe (by image name or original filename) and the command line contains both 'trace' and 'start'. Verify both terms are present and that the command begins a capture rather than querying or stopping one.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to start network packet captures?
  context: Network and desktop support staff legitimately run netsh trace for connectivity troubleshooting. A standard user, a service account, or a host with no support role starting a capture is harder to explain. Knowing whether the user role and host function fit packet-capture activity is often the fastest way to separate routine troubleshooting from collection activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What was the capture configured to collect, and where does it write output?
  context: Parse every netsh trace argument to understand the capture scope. Look for an output path (tracefile=, persistent=yes), a capture filter (capture=yes, scenario=, protocol=, IPv4.Address=, Ethernet.Type=), and report=yes. A broad capture with no filter and a persistent or user-writable output path points toward collection of credentials or session data in transit rather than scoped troubleshooting.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned netsh, and is that parent chain expected for a capture?
  context: The parent reveals how the capture was started. Interactive troubleshooting usually traces back to explorer.exe to cmd.exe or powershell.exe. A parent such as wscript.exe, mshta.exe, wmiprvse.exe, wsmprovhost.exe, or an Office application points to scripted or remote invocation rather than a person at the keyboard.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single capture may be legitimate troubleshooting, but multiple reconnaissance commands in rapid succession (ipconfig, net, arp, nbtstat, netstat, nltest) alongside the capture is a signature of post-compromise enumeration. Attackers map the host and network before deciding what to collect.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: What process spawned netsh, and does that launch pattern look interactive or automated?
  context: A capture launched from an interactive shell under explorer.exe reads as a person troubleshooting. A capture spawned by a script interpreter (wscript.exe, cscript.exe, mshta.exe), a remote-execution host (wmiprvse.exe, wsmprovhost.exe), or an Office application reads as automated or remote-driven collection and raises the priority of the investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Which accounts and credentials could be exposed by traffic on this host, and are any privileged?
  context: Packet captures expose whatever authenticates or transits the wire during the session, including service-account tokens, NTLM exchanges, and cleartext protocol credentials. The severity depends on what runs on this host and which accounts authenticate to it. A capture on a domain controller, jump host, or admin workstation can expose high-value credentials and warrants cross-referencing the host's logon population against directory group memberships.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Were any other capture or transfer LOLBins used on this host recently?
  context: Operators who use netsh trace for collection often pair it with other living-off-the-land utilities to stage or move the captured file (certutil, bitsadmin, curl, makecab, expand). Finding additional LOLBins working the same objective around the capture strengthens the case that this is collection rather than troubleshooting. The ToolNames worth tracking should be tuned to the binaries actually deployed in this environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\wmic.exe'
          - '\diskshadow.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Were any other network-capture or sniffing tools run on this host recently?
  context: netsh trace is one of several ways to capture traffic. Other capture tooling on the same host (pktmon, dumpcap, tshark, Wireshark, tcpdump, windump, or the rawcap-style utilities) indicates broader collection capability and that the operator may be comparing or combining capture methods. The list of known capture tools should be tuned to what is approved in this environment so that authorized monitoring software is not treated as a finding.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_capture:
        Image|endswith:
          - '\pktmon.exe'
          - '\dumpcap.exe'
          - '\tshark.exe'
          - '\wireshark.exe'
          - '\windump.exe'
          - '\tcpdump.exe'
          - '\rawcap.exe'
          - '\netmon.exe'
          - '\nmcap.exe'
          - '\microsoftmessageanalyzer.exe'
      condition: selection and selection_capture
    fields:
      - Image
      - CommandLine
- question: Was netsh executed from its expected System32 path?
  context: netsh.exe normally runs from C:\Windows\System32 (or SysWOW64). A netsh running from a user-writable directory such as a temp or download folder suggests the binary was copied or renamed to evade path-based allowlists or naming detections. Compare the Image path against the expected location and confirm OriginalFileName still reads netsh.exe.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host started a netsh trace capture over the past 90 days, and what command-line structures are typical?
  context: A capture pattern with no prior history on a host is more notable than one that recurs under stable conditions. The query mirrors the rule's selection so the count reflects netsh trace start specifically rather than all netsh usage. Compare the typical capture command structures against the alerting one to see whether the scope, filters, or output path differ from the host's norm.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - trace
        - start
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- question: Have other hosts started a netsh trace capture in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of netsh trace start rather than generic netsh usage. Many hosts firing the same pattern points to scripted deployment or a monitoring rollout; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - trace
        - start
      condition: all of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - trace
        - start
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - trace
        - start
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in the alert window reveals whether the capture is isolated or part of broader hands-on activity. If the same user triggered similar actions on multiple hosts, the scope of the activity may extend past this endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - trace
        - start
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
