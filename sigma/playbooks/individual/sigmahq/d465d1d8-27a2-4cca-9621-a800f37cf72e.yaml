name: Equation Group DLL_U Export Function Load
id: 2c44e7a1-f3f6-4314-a3cf-292a880280dc
description: |
  Detects a process command line that either contains the argument `-export dll_u` or ends with `,dll_u` or ` dll_u`.
  Either branch alone fires the rule. `dll_u` is an export function name carried by modules from the Equation Group
  toolset, and both forms describe the same mechanism: a signed system binary such as rundll32.exe is asked to load a
  module and call a named export, so the payload runs inside a trusted process and never appears as its own image on disk
  execution. Determine which branch fired, read the module path out of the command line, and establish whether that module
  is present on the host, what it is signed by, and what the loading process did afterward.
type: detection
detection_id: d465d1d8-27a2-4cca-9621-a800f37cf72e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: >-
    Does the alerting command line either contain `-export dll_u`, or end with `,dll_u` or ` dll_u`?
  context: >-
    Confirm the alert against the two alternative branches and note which one matched, because the branch determines where
    the module path is read from. An explicit `-export dll_u` argument names the export the loader was asked to call and
    usually sits alongside a separate module path token; a trailing `,dll_u` or ` dll_u` is the export appended to a
    rundll32-style `<module>,<export>` argument, so the module path is the token immediately before the separator. If
    neither form is present in the full command line, the alert is a match artifact and can be closed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this DLL_U loader execution part of an authorized penetration test or red team engagement?
  context: >-
    Leaked offensive toolsets are used in authorized security assessments and in detection-engineering test runs. Before
    investing investigation time, check whether a pentest, red team exercise, or purple team validation is currently
    active on this host or network segment. An authorized engagement with matching tool usage and timing resolves the
    alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: Is this user and host expected to load DLL exports through a system binary from the command line?
  context: >-
    Calling a named export out of a module via a proxy binary is a developer, installer, and control-panel pattern as well
    as an offensive one, but it is rare on ordinary workstations and rare for ordinary accounts. Knowing whether the user
    role and host function involve software packaging, driver work, or vendor installers is often the fastest path to
    separating routine operations from operator activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Which module was the loader pointed at, and what other arguments were passed alongside the export name?
  context: >-
    The export name is fixed by the rule; everything else in the command line describes the capability. Read the module
    path or filename that accompanies `dll_u`, any ordinal or additional export selector, and any arguments passed
    through to the export. The module identity, not the export name, determines what capability ran and therefore what
    the response scope is.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: What files did the loading binary create or modify on this host after the alert?
  context: >-
    A module loaded by export is usually staged to disk first and often writes output, configuration, or staging files
    while it runs. File activity from the loading binary in the hour after the alert shows the module path it worked
    against and any artifacts left behind, which remain available even after the process exits.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: What did the full `dll_u` invocation sequence on this host do, and were several loader commands issued together?
  context: >-
    Export-load operations are frequently issued as a short series of commands against the same module rather than a
    single call. Scoping to `dll_u` command lines on this host in a five-minute window shows the whole sequence and the
    working directory each ran from, which is where relative module paths resolve. Decode every argument, including any
    quoted paths, ordinals, and pass-through parameters.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: 'dll_u'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: Which modules did the alerting process load, and are they signed and known?
  context: >-
    The export call only means something if the module carrying it is mapped into the proxy process, so the load events
    for this process are the direct evidence that the payload ran. Library load events carry the module hash and its
    signature state on the load itself, so an unsigned or invalid-signature module loaded from a user-writable directory
    can be identified and hashed without waiting for a separate execution event. Compare the loaded set against the
    modules this binary normally maps, and take the hash of anything outside that set for reputation review.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: What process spawned this loader and is that parent chain expected?
  context: >-
    The parent process reveals how the loader was invoked. Packaging and installer workflows have predictable parents
    such as explorer.exe, a setup binary, or a service host. Parents such as script hosts, Office applications, or a
    remote-execution service point to the command being delivered rather than typed, in which case the parent's own
    command line and lineage are the next thing to read.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Did the alerting process open any network connections, and to what destinations?
  context: >-
    Proxy execution is often chosen because outbound traffic then originates from a trusted system binary rather than an
    unfamiliar image. Connections from this process to addresses outside the environment's own ranges indicate the loaded
    module is retrieving a stage or reporting to an operator; connections confined to internal ranges may still indicate
    lateral use. Absence of connections does not clear the alert, since the module may be tasked entirely on disk.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
- question: What child processes did the loader spawn afterward?
  context: >-
    The processes spawned after the export call reveal what the module actually did. A module that only performs its own
    work in-process spawns nothing; command interpreters, script hosts, or transfer utilities appearing underneath the
    loader indicate hands-on follow-through and expand the scope beyond a single execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: >-
    When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does
    the current alert fit that pattern?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution
    reflects how the `dll_u` export-load pattern has actually run here rather than generic use of the loading binary. No
    prior history at all is the common outcome and makes this a first occurrence; a recurring parent and account instead
    point at packaging or test tooling that reuses the same export name.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains: -export dll_u
      - CommandLine|endswith:
        - ',dll_u'
        - ' dll_u'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the account's 90-day history of
    the export-load pattern aggregated by host. A user who has never produced it warrants more scrutiny than one who does
    so regularly; weigh any count against whether the role involves software packaging, driver work, or security testing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains: -export dll_u
      - CommandLine|endswith:
        - ',dll_u'
        - ' dll_u'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: >-
    Has this parent process historically driven the rule's pattern on this host or across the environment, or is the
    parent new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute the behavior and the launch
    mechanism is the meaningful pivot. The query mirrors the rule's selection structure scoped to the alerting parent
    process, so the result is the 90-day history of this parent driving the export-load pattern. A new or rare parent for
    this pattern is the deviation worth chasing; a parent already accounting for thousands of prior events is vendor or
    operating-system automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains: -export dll_u
      - CommandLine|endswith:
        - ',dll_u'
        - ' dll_u'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the account's activity across all hosts reveals whether the export-load attempt was one step of a wider
    operation or an isolated event. The same account driving comparable activity on several hosts in the same window
    widens the scope of the investigation beyond this endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  always_include: true
  answer_sources:
  - process_creation
- question: >-
    Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, asking what else the user did across the network returns agent telemetry from every host
    and answers nothing. The query instead mirrors the rule's selection structure scoped to the alerting parent process,
    fleet-wide, in the alert window. Multiple hosts in the same window point to scheduled or pushed automation; a single
    host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains: -export dll_u
      - CommandLine|endswith:
        - ',dll_u'
        - ' dll_u'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity in the window around the export load collapses routine
    agent and system telemetry into high-count rows while novel parent-child pairs stand out at low counts. Look for
    reconnaissance, credential access, archive utilities, or transfer tooling running next to the loader.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
- question: >-
    Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent
    automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the
    export-load pattern rather than generic use of the loading binary. Many hosts firing the same pattern points to
    scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use
    the host distribution to calibrate how far the investigation extends.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains: -export dll_u
      - CommandLine|endswith:
        - ',dll_u'
        - ' dll_u'
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host help reconstruct how the loader arrived. Delivery, defense tampering, or
    credential access preceding an export-load attempt indicates the module was staged as part of a multi-stage
    operation rather than run by a local administrator in one step.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
