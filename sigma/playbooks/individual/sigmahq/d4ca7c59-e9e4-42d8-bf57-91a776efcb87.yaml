name: LOLBIN Execution From Abnormal Drive
id: 04987d6f-c23b-44ac-9b1a-9ed30210b7c7
description: |
  Detects one of a set of living-off-the-land binaries (calc.exe, certutil.exe, cmstp.exe, cscript.exe,
  installutil.exe, mshta.exe, regsvr32.exe, rundll32.exe, wscript.exe) executing from a working directory that does
  not start with C:\. The rule fires when the image name (or its OriginalFileName) matches one of these binaries AND
  the CurrentDirectory is non-empty and does not contain C:\ — typical of execution from a mounted ISO/IMG, a USB
  volume, or a mapped network drive. These binaries are Microsoft-signed and run constantly during legitimate
  operation, but running them from a removable or mounted volume is a known proxy-execution and mark-of-the-web bypass
  pattern, since files inside a mounted disk image do not inherit the downloaded-from-internet marking. Investigation
  should confirm the exact image and working drive, decode the full command line, identify what spawned the binary and
  what it spawned in turn, and determine whether the drive and user are expected for this host.
type: detection
detection_id: d4ca7c59-e9e4-42d8-bf57-91a776efcb87
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Did one of the watched LOLBins run from a working directory outside the C:\ drive?
  context: Confirm the alert is a true positive by reviewing the exact image and OriginalFileName against the triggering
    event. The rule fires when the image name ends in one of calc.exe, certutil.exe, cmstp.exe, cscript.exe,
    installutil.exe, mshta.exe, regsvr32.exe, rundll32.exe, or wscript.exe (or its OriginalFileName matches one of
    these) AND the CurrentDirectory is non-empty and does not contain C:\. The full working directory and command line
    are surfaced in the command-decode question — note the actual drive letter there (a mounted ISO/IMG, a USB volume,
    or a mapped network share), because the source of that drive determines the rest of the investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Is this user and host expected to run signed system utilities from a removable or mounted drive?
  context: Legitimate use of these binaries from a non-C:\ drive is uncommon on most endpoints; it usually appears on
    machines that routinely mount software images or work off network shares. Knowing whether the user role and host
    function involve installer media, packaged software on ISO/IMG, or network-share workflows is often the fastest path
    to separating routine activity from a mark-of-the-web bypass.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this binary do? Decode the full command line and the path it operated on.
  context: The full command line reveals the specific action. Identify the file the binary loaded or processed, its
    extension and on-disk location, and any switches that control behavior — a DLL export name for rundll32.exe, an
    /i or /u registration mode for regsvr32.exe, a -decode or -urlcache flag for certutil.exe, or a script path for
    cscript.exe and wscript.exe. Pay attention to whether the referenced file also lives on the mounted or removable
    drive rather than on local disk.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is the command line or the file it processed encoded or obfuscated, and what does it decode to?
  context: Several of these binaries are used to stage payloads from media that has already bypassed the
    downloaded-from-internet marking. certutil.exe -decode/-decodehex reconstructs a base64 or hex blob into an
    executable or DLL; cscript.exe and wscript.exe run scripts that may use Chr() chains or string concatenation;
    rundll32.exe and mshta.exe may carry inline script or an encoded export argument. Decode the suspicious content to
    determine the real operation — a download cradle, an in-memory loader, or a script that drops or runs the next
    stage. Note the named source and output files so they can be tracked on disk.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did this binary fetch a file over the network or write a payload to local disk?
  context: certutil.exe in particular doubles as a download utility (-urlcache -split -f against a URL) and as a
    decoder that writes a new file to disk, and the other watched binaries can pull or drop a follow-on stage. A
    command line that references a URL, a remote host, or a local output path indicates the binary moved code rather
    than simply executing media already present on the mounted drive. Correlate the working drive from the alert with
    any output path to see whether the payload was copied off the removable volume onto local disk.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this binary and is that parent chain expected?
  context: The parent process reveals how the binary was invoked. Execution from a mounted image is commonly initiated
    by explorer.exe (a user double-clicking content on the drive) or by a command shell launched from a shortcut on the
    media. Parents such as a script host, an office application, or a command shell carrying a copy-then-run sequence
    suggest the invocation came from a document, shortcut, or operator activity rather than routine software
    installation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did this binary spawn afterward?
  context: The processes spawned after the binary runs reveal its actual impact. A signed utility loading content from a
    mounted drive often serves as a launcher; a follow-on command shell, script host, or additional binary that carries
    out discovery, persistence, or further download activity points to a staged execution chain rather than a one-off
    legitimate run.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run this binary at all?
  context: A binary that has never been seen on a host is more notable than one that runs regularly. Zero or very low
    historical counts for this image on this host indicate first-time or rare execution and raise the weight of the
    abnormal-drive context; a high steady count suggests the binary is part of routine operation and the working drive
    is the only unusual element.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this abnormal-drive pattern, what parents and users normally drive it,
    and does the current alert fit?
  context: Even common tools can be abused. The query mirrors the rule's selection structure scoped to this host — the
    resulting parent and user distribution reflects how the rule's specific firing pattern (a watched LOLBin running off
    a non-C:\ drive), not generic binary usage, has historically run here. A new parent process, an unexpected user
    account, or a working drive that has not appeared before is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \calc.exe
        - \certutil.exe
        - \cmstp.exe
        - \cscript.exe
        - \installutil.exe
        - \mshta.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
      - OriginalFileName:
        - CALC.EXE
        - CertUtil.exe
        - CMSTP.EXE
        - cscript.exe
        - installutil.exe
        - MSHTA.EXE
        - REGSVR32.EXE
        - RUNDLL32.EXE
        - wscript.exe
      filter_main_currentdirectory:
        CurrentDirectory|contains: C:\
      filter_main_empty:
        CurrentDirectory: ''
      filter_main_null:
        CurrentDirectory: null
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this abnormal-drive pattern in the past week, and does the cross-host distribution
    look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of
    the rule's firing pattern — a watched LOLBin running off a non-C:\ drive — not generic usage of these binaries. Many
    hosts firing the same pattern points to scripted deployment or imaging automation that mounts media; one host or a
    small unrelated set points to manual or targeted activity. Use the host distribution and parent consistency to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \calc.exe
        - \certutil.exe
        - \cmstp.exe
        - \cscript.exe
        - \installutil.exe
        - \mshta.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
      - OriginalFileName:
        - CALC.EXE
        - CertUtil.exe
        - CMSTP.EXE
        - cscript.exe
        - installutil.exe
        - MSHTA.EXE
        - REGSVR32.EXE
        - RUNDLL32.EXE
        - wscript.exe
      filter_main_currentdirectory:
        CurrentDirectory|contains: C:\
      filter_main_empty:
        CurrentDirectory: ''
      filter_main_null:
        CurrentDirectory: null
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \calc.exe
        - \certutil.exe
        - \cmstp.exe
        - \cscript.exe
        - \installutil.exe
        - \mshta.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
      - OriginalFileName:
        - CALC.EXE
        - CertUtil.exe
        - CMSTP.EXE
        - cscript.exe
        - installutil.exe
        - MSHTA.EXE
        - REGSVR32.EXE
        - RUNDLL32.EXE
        - wscript.exe
      filter_main_currentdirectory:
        CurrentDirectory|contains: C:\
      filter_main_empty:
        CurrentDirectory: ''
      filter_main_null:
        CurrentDirectory: null
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \calc.exe
        - \certutil.exe
        - \cmstp.exe
        - \cscript.exe
        - \installutil.exe
        - \mshta.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
      - OriginalFileName:
        - CALC.EXE
        - CertUtil.exe
        - CMSTP.EXE
        - cscript.exe
        - installutil.exe
        - MSHTA.EXE
        - REGSVR32.EXE
        - RUNDLL32.EXE
        - wscript.exe
      filter_main_currentdirectory:
        CurrentDirectory|contains: C:\
      filter_main_empty:
        CurrentDirectory: ''
      filter_main_null:
        CurrentDirectory: null
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple
    endpoints. If the same user triggered similar activity on more than one host, the scope may be larger than a single
    endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \calc.exe
        - \certutil.exe
        - \cmstp.exe
        - \cscript.exe
        - \installutil.exe
        - \mshta.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
      - OriginalFileName:
        - CALC.EXE
        - CertUtil.exe
        - CMSTP.EXE
        - cscript.exe
        - installutil.exe
        - MSHTA.EXE
        - REGSVR32.EXE
        - RUNDLL32.EXE
        - wscript.exe
      filter_main_currentdirectory:
        CurrentDirectory|contains: C:\
      filter_main_empty:
        CurrentDirectory: ''
      filter_main_null:
        CurrentDirectory: null
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the process activity around the alert reveals what led to this
    event and what followed — including the mount of the source drive, reconnaissance, or staging of additional tools.
    Novel parent-child pairs at low counts stand out against the high-count rows of routine agent and OS telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — user execution of a downloaded file,
    reconnaissance, or defense tampering — may reveal the stages that preceded this event and help reconstruct the full
    timeline leading up to execution from the abnormal drive.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
