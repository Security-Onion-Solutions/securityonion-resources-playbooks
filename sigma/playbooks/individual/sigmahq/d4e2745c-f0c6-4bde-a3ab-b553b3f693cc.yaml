name: Persistence Via Disk Cleanup Handler - Autorun
id: 39208c56-3529-4608-b812-1a0d54cba661
description: |
  Detects modification of a Disk Cleanup handler value under HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\VolumeCaches\, a persistence technique that abuses the Windows disk cleanup mechanism. The rule fires when a value under a VolumeCaches handler branch is written AND EITHER an Autorun DWORD is set to 1 (which lets the handler's CleanupString/PreCleanupString commands run silently when cleanmgr.exe runs with /autoclean) OR a CleanupString/PreCleanupString value is set to a command interpreter (cmd, powershell, rundll32, mshta, cscript, wscript, wsl) or a payload path under Users\Public, Windows\TEMP, or a Startup folder.
  Legitimate cleanup handlers are registered by the operating system and by applications during install, so this branch changes infrequently outside servicing. The investigation should determine which handler branch was touched, what command or flag was written, whether the referenced payload exists on disk, and whether cleanmgr subsequently executed it.
type: detection
detection_id: d4e2745c-f0c6-4bde-a3ab-b553b3f693cc
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Do the registry key path and value data match a Disk Cleanup handler autorun or cleanup-command modification?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires when a value under a VolumeCaches
    cleanup-handler branch is written AND EITHER an Autorun DWORD is set to 0x00000001, OR a CleanupString/PreCleanupString
    value is set to a command interpreter or a payload path under Users\Public, Windows\TEMP, or a Startup folder. Note
    which branch fired: an Autorun=1 write only enables silent triggering, while a CleanupString/PreCleanupString write
    carries the payload command itself, so the branch determines which follow-up questions carry weight.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify Disk Cleanup handler registry values?
  context: >-
    VolumeCaches cleanup-handler branches are rarely modified outside operating-system servicing or application installs.
    Knowing whether the writing user and host normally perform this kind of change is often the fastest way to separate a
    routine install from unauthorized persistence. If User is a machine account or missing, pivot on the writing process
    instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Was there a change ticket, maintenance window, or documented approval for this Disk Cleanup handler change?
  context: >-
    Registry persistence changes under VolumeCaches are rarely part of routine operations. A corresponding change ticket
    or software-deployment record suggests authorized activity; its absence when policy requires one suggests the
    modification was unauthorized. This check can quickly close false positives or escalate true positives.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the user or administrator recall making this Disk Cleanup handler change or installing software that would?
  context: >-
    Direct confirmation from the account owner is often the fastest legitimacy check. If nobody recalls the change and no
    installer accounts for it, the credentials may be compromised or the write may be automated persistence. If they do
    recall it, get context on what they were installing or configuring.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What specific VolumeCaches value was modified, and is this a known persistence location?
  context: >-
    The registry path reveals intent. Values under HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\VolumeCaches\
    control disk cleanup handlers: an Autorun DWORD enables silent execution, while CleanupString and PreCleanupString name
    a command that runs when cleanmgr.exe performs cleanup. Identify the handler branch and value name, and whether it maps
    to a legitimate built-in handler or an unrecognized one.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value data was written, and what would it execute?
  context: >-
    Interpret the Details field. A DWORD of 0x00000001 on an Autorun value enables the handler to run silently under
    cleanmgr /autoclean. A CleanupString or PreCleanupString value carries the actual command, so look for a command
    interpreter (cmd, powershell, rundll32, mshta, cscript, wscript, wsl) or a payload path under Users\Public,
    Windows\TEMP, or a Startup folder. If the value references a rundll32 DLL or a script, that path becomes the payload to
    verify on disk.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote this registry value, and what launched that process?
  context: >-
    The writing process shows how the change was made. Legitimate cleanup-handler registration comes from operating-system
    servicing or application installers with predictable parents; a write from an interactive shell, a script host, or an
    Office child process points to hands-on activity or a malicious script. Walk up the parent chain to see what initiated
    it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Were other registry modifications made on this host in the same session?
  context: >-
    Disk cleanup handler persistence often takes more than one write, for example setting the CleanupString/PreCleanupString
    command AND the Autorun DWORD that makes it fire silently, or registering a CLSID that points to the payload DLL.
    Clusters of registry changes from the same writing process in a short window reveal the full scope of the configuration
    and whether other objectives such as defense tampering or additional persistence were pursued alongside.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Does the change survive reboot, and is the referenced payload present on disk?
  context: >-
    The handler persistence is only effective if the command's target exists: the DLL that rundll32 loads, the script the
    interpreter runs, or the executable named in the CleanupString. Correlating file activity from the writing process and
    its children shows whether that payload was dropped in the same session. The file-write event carries no hash; if the
    payload is present, hash it from a later execution or retrieve it for a reputation lookup. Registry key deletion is not
    observable here, so judge durability from the value's re-modification history rather than expecting a removal event.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did cleanmgr.exe run afterward, and did the configured payload execute?
  context: >-
    The handler command runs when disk cleanup executes, typically cleanmgr.exe with /autoclean, which can run silently
    once Autorun is set. Look for cleanmgr.exe execution after the registry write and for the referenced interpreter
    (rundll32, powershell, cmd, mshta, cscript, wscript, wsl) running as its child; that confirms the persistence is active
    and the payload ran.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_exec:
        Image|endswith:
          - '\cleanmgr.exe'
          - '\rundll32.exe'
          - '\powershell.exe'
          - '\cmd.exe'
          - '\mshta.exe'
          - '\cscript.exe'
          - '\wscript.exe'
          - '\wsl.exe'
      condition: selection and selection_exec
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Has this VolumeCaches value been modified before on this host?
  context: >-
    Cleanup-handler branches change during operating-system servicing and application installs but are otherwise stable. A
    first-time modification, or a value that differs from what servicing normally writes, is more suspicious than a
    recurring change. Compare historical Details values and the writing process to calibrate.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Persistence writes rarely occur in isolation. Reviewing process activity around the alert shows what led to the change
    and what followed, such as reconnaissance, privilege escalation, payload staging, or additional persistence. Novel
    parent-child pairs stand out at low counts against routine agent telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal the
    stages that preceded this persistence write and help reconstruct the timeline. The alert sequence often tells the
    attack story.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was this VolumeCaches value modified on other hosts in the environment?
  context: >-
    The same handler modification across multiple hosts may indicate a management push or widely deployed malware; a
    single-host change is more likely targeted. Compare the Details values and writing process across hosts to tell a
    fleet-wide install from isolated persistence.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    Attackers rarely rely on one foothold. Alongside a disk cleanup handler entry they commonly stack scheduled tasks,
    services, Run keys, BITS jobs, or WMI subscriptions. Multiple persistence installs in the same timeframe indicate
    intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup folders or scheduled-task definition paths on this host?
  context: >-
    File-based persistence bypasses command-line detection entirely. A payload dropped into a Startup folder or a path
    referenced by a registry Run key achieves persistence without a persistence tool running. File-event monitoring
    captures these drops even when the disk cleanup handler is only one of several mechanisms in play.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
