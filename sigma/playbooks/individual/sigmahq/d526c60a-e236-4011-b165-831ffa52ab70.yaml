name: Windows Vulnerable Driver Blocklist Disabled
id: cdf66627-a391-4c7e-92f6-735cb4738303
description: |
  Detects a registry modification that sets the Windows vulnerable-driver blocklist value
  (TargetObject ending in \Control\CI\Config\VulnerableDriverBlocklistEnable) to DWORD 0x00000000,
  which turns the blocklist off. The rule fires only when both the key path and the disabling value
  data are present. Disabling this control removes the mechanism that blocks known-exploitable signed
  kernel drivers from loading, enabling bring-your-own-vulnerable-driver activity used to run kernel
  code or impair endpoint defenses; legitimate changes come almost exclusively from managed
  configuration (Group Policy, device management, or a security-tooling installer). Determine which
  process wrote the value, whether the blocklist is still off, and whether a vulnerable driver
  subsequently loaded.
type: detection
detection_id: d526c60a-e236-4011-b165-831ffa52ab70
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Do the registry key and value data match the disabled-blocklist pattern this rule detects?
  context: Confirm the alert is a true positive by checking that TargetObject ends in \Control\CI\Config\VulnerableDriverBlocklistEnable
    and that Details is DWORD 0x00000000, the value that turns the vulnerable-driver blocklist off. Both
    conditions must hold together for this to be the detected pattern. Note the writing process before
    investing further investigation time.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to change Code Integrity policy settings?
  context: Code Integrity configuration is normally changed only by Group Policy, device-management agents,
    or a security-tooling installer, and typically on a maintenance schedule. A write from an interactive
    user session or an unexpected process is the anomaly. The set of administrative tools and service
    accounts that legitimately manage this host is the baseline that separates a routine policy push from
    tampering.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this a known evasion-relevant registry location, and what process wrote it?
  context: The key controls whether the Windows vulnerable-driver blocklist loads and sits under the Code
    Integrity configuration hive, a security-policy location that ordinary software rarely touches. The
    writing process (Image) together with the exact value data determines whether this is a sanctioned
    policy change or defense tampering.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value was written to the blocklist key, and what does that value mean?
  context: A DWORD of 0x00000000 in VulnerableDriverBlocklistEnable disables the blocklist, while 0x00000001
    enables it. A zero here removes the control that blocks known-exploitable signed kernel drivers from
    loading. Confirm the Details value and that it represents a disable rather than a re-enable.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process and command performed the blocklist-disable write?
  context: The writing process and its command line reveal how the change was made, whether a reg.exe add,
    a PowerShell Set-ItemProperty, a device-management agent, or the Group Policy client. A direct reg or
    PowerShell write from a user session points to hands-on tampering; a management-client write points to
    a configuration push.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the vulnerable-driver blocklist currently re-enabled, or is the host still exposed?
  context: The disable takes effect only after a reboot, and the setting may since have been reverted or may
    still be off. Check the current value and whether the blocklist is enforced. If it remains disabled, the
    host can load known-vulnerable kernel drivers until the control is restored.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the disabled setting persist, or was the key re-modified afterward on this host?
  context: Registry value deletions are not observable in this telemetry, so persistence is judged from the
    key's re-modification history rather than from a delete event. If the value was set to zero and never
    rewritten, the blocklist stays disabled; a later write back to 0x00000001 indicates the change was
    reverted. Repeated flips can indicate testing or an install-uninstall cycle.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Did any kernel drivers load on this host after the blocklist was disabled?
  context: Disabling the blocklist enables bring-your-own-vulnerable-driver activity, where a legitimately
    signed but exploitable kernel driver is loaded to run code in kernel mode or disable endpoint defenses.
    Because these drivers are validly signed, signature status alone will not flag them, so compare each
    loaded driver's name and signer against known-vulnerable driver lists. The disable requires a reboot to
    take effect, so relevant loads may appear only after the next restart.
  range: +24h
  query: |
    aggregation: true
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - ImageLoaded
      - Signature
      - SignatureStatus
- question: Has this blocklist key been modified before on this host?
  context: Security-policy keys like this one should change rarely and only through managed configuration.
    A first-time or very-low-count history makes an out-of-band disable more suspicious, while a recurring
    pattern tied to a management agent points to routine policy application. Compare the historical Details
    values.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What process activity occurred on this host after the blocklist was disabled?
  context: Controls are disabled to enable something the actor expects to be blocked or logged, such as
    dropping a driver, loading a payload, or dumping credentials. Process creations in the window after the
    write reveal what the tampering was meant to enable. Correlate this window with the driver-load and
    network activity for the same interval.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other registry keys modified on this host in the same session?
  context: Tampering often arrives in clusters, disabling the driver blocklist alongside turning off
    real-time protection, weakening firewall rules, or setting a Run key for persistence. Registry changes
    from the same writing process within a short window show the full scope of the configuration tampering.
    The triggering key appears in the results; the signal is what else was changed.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Were other defense-tampering actions performed on this host?
  context: An actor who disables one control frequently disables several to maximize coverage, clearing
    event logs, deleting shadow copies, stopping services, or weakening the firewall. Multiple tampering
    actions from the same user or parent process in the same window indicate a deliberate operation rather
    than an isolated policy change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Was this blocklist key disabled on other hosts in the environment?
  context: The same disable across many hosts can indicate a Group Policy or management push, or widespread
    compromise, while a change confined to this host looks targeted. Compare the Details values and writing
    processes across hosts to tell a fleet-wide policy change from selective tampering.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other activity occurred on this host around the time of the alert?
  context: The immediate context around the write shows what led to it and what followed, such as a script
    host or remote-management tool launching just before the change or new processes spawning just after.
    Novel parent-child process pairs stand out against routine, high-volume agent telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Defense-impairment rarely starts a chain. Earlier detections for reconnaissance, credential
    access, or execution may show the stages that preceded the disable. The alert timeline on this host
    helps reconstruct how the actor reached the point of tampering with kernel-level controls.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other persistence mechanisms installed on this host around the same time?
  context: Disabling the driver blocklist is an enabling step, not persistence itself. Actors commonly pair
    it with a foothold such as a scheduled task, service, Run key, or BITS job so the loaded driver or
    payload survives reboot. Persistence-tool executions clustered in the same window point to intentional
    stacking rather than isolated administration.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
