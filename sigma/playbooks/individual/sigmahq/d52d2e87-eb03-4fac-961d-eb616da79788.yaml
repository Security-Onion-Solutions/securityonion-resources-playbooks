name: Raspberry Robin Subsequent Execution of Commands
id: 9ef0357c-47b8-4a4b-91f7-585b99cb9daa
description: |
  Detects rundll32.exe or regsvr32.exe spawned by fodhelper.exe with a command line that hands work to odbcconf.exe.
  The rule requires every condition together — fodhelper.exe as the parent, rundll32.exe or regsvr32.exe as the child,
  the strings odbcconf.exe, regsvr, and shellexec_rundll all present in the command line, at least one of the odbcconf
  actions installdriver, setfiledsndir, or vkipdse, and a trailing /a, /f, or /s switch. fodhelper.exe runs at high
  integrity without a consent prompt, so a chain that routes through it is an auto-elevation primitive rather than a
  normal launcher; odbcconf.exe carries a built-in regsvr action that registers and executes a DLL through a signed
  Microsoft binary, which sidesteps application control that would block regsvr32 directly. Raspberry Robin uses this
  exact sequence to load its dropped DLL at high integrity, and no routine ODBC administration reaches odbcconf through
  fodhelper. The investigation should identify the DLL the odbcconf action string references, establish what spawned
  fodhelper.exe, determine which modules were loaded and whether any outbound connections followed, and check whether
  this host has any prior history of this pattern.
type: detection
detection_id: d52d2e87-eb03-4fac-961d-eb616da79788
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the command line show odbcconf.exe with a regsvr action and shellexec_rundll, launched from fodhelper.exe?
  context: Confirm the alert before investing time. Every element has to be present together — fodhelper.exe as the
    parent, rundll32.exe or regsvr32.exe as the child, the strings odbcconf.exe, regsvr, and shellexec_rundll in the
    command line, one of the actions installdriver, setfiledsndir, or vkipdse, and a trailing /a, /f, or /s switch.
    Read the command line for the file the odbcconf action points at, since that path is the payload the chain loads.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to configure ODBC drivers through odbcconf.exe?
  context: ODBC driver registration is a real administrative task on database and reporting servers, where it normally
    runs from an installer or a management console under an admin account. It does not normally arrive by way of
    fodhelper.exe on a general-purpose workstation. When the account is a machine or service principal, judge by the
    host's role and by what started the chain rather than by user identity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What started fodhelper.exe, and does that grandparent explain the elevation?
  context: fodhelper.exe is the Features On Demand helper and is auto-elevated, so it runs at high integrity without a
    consent prompt. Started by a user from the Settings interface it has an interactive lineage; started by msiexec.exe,
    a script host, or a command interpreter it is being used as an elevation primitive, and the grandparent's own command
    line usually names the file that set the chain up. The parent's command line and its origin decide whether this is
    an intentional configuration action or an escalation step.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other child processes did this same fodhelper.exe instance spawn?
  context: An elevation primitive is usually used for more than one action. Other children of the same fodhelper.exe
    instance show whether the odbcconf chain was the only elevated step or one of several, and any additional command
    interpreters, copy operations, or registry tooling under the same parent extend the scope of what ran at high
    integrity.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Which DLL does the odbcconf action string reference, and what do the installdriver, setfiledsndir, and
    vkipdse actions configure?
  context: odbcconf.exe takes action blocks in braces. REGSVR loads and executes a DLL through the ODBC subsystem the
    same way regsvr32 would, INSTALLDRIVER registers a driver entry pointing at a DLL path, SETFILEDSNDIR sets the
    directory used for file data sources, and a name such as VKIPDSE is an arbitrary driver label rather than a real
    product. Read the full command line for the DLL path and file name, then treat that path as the artifact to
    examine — it is commonly a random-looking name under a temporary or installer directory. The trailing /a, /f, or
    /s switch controls the action and silent behavior.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains|all:
          - odbcconf.exe
          - regsvr
          - shellexec_rundll
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: Is the command line obfuscated, and what does it resolve to once the casing and quoting are normalized?
  context: The command line is readable rather than base64 encoded, so the work here is deobfuscation rather than
    decoding. Look for mixed-case binary and action names, embedded quotes, environment variable expansion, and caret
    or backtick escaping, all of which are used to defeat literal string matching while leaving the resolved command
    intact. Normalize the string, then record the DLL path and the ordered list of odbcconf actions the chain actually
    performs.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Which modules did odbcconf.exe, rundll32.exe, or regsvr32.exe load on this host around the alert, and are
    any of them unsigned or loaded from a user-writable path?
  context: The point of the regsvr action is to get a DLL loaded inside a signed Microsoft process, so the module load
    is where the payload becomes visible. A load of an unsigned or invalidly signed DLL, or of any DLL from a temporary,
    installer, or user profile directory, identifies the file the chain was built to run and yields a hash for
    reputation work. Loads limited to system DLLs from the Windows directory mean the payload either had not loaded yet
    or failed.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - \odbcconf.exe
          - \rundll32.exe
          - \regsvr32.exe
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: Did rundll32.exe, regsvr32.exe, or dllhost.exe make outbound connections from this host after the alert?
  context: Once the DLL is registered, the follow-on stage of this pattern is command and control from rundll32.exe,
    regsvr32.exe, or dllhost.exe processes started with no command-line arguments, reaching out to short recently
    registered domains or to proxy relay infrastructure. Outbound traffic from these binaries is unusual on most hosts
    because they normally act on local resources. Note the destination addresses and ports, including non-standard HTTP
    ports, and carry them forward as the pivot for the rest of the investigation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - \rundll32.exe
          - \regsvr32.exe
          - \dllhost.exe
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
  - external_threat_intel
- question: What else did fodhelper.exe launch on this host in the hours after the alert?
  context: The elevated child is the start of the operation rather than the end of it. Children of fodhelper.exe beyond
    the alerting one show whether the elevation was reused for persistence, credential access, or additional payload
    execution. The window is deliberately wider than the alert itself because follow-on stages are often delayed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Has fodhelper.exe ever spawned this binary on this host before?
  context: fodhelper.exe legitimately manages optional Windows features and rarely spawns anything beyond its own
    supporting processes. A 90-day count of this parent-child pairing separates a novel relationship from something a
    management tool does routinely on this host. Zero or near-zero prior events mean the pairing itself is the
    deviation, independent of the command line.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Has this binary invoked odbcconf.exe on this host at any point in the last 90 days?
  context: rundll32.exe and regsvr32.exe run constantly on a Windows host, so their bare execution count says nothing.
    Constraining the history to invocations that reference odbcconf.exe isolates the specific behavior and makes the
    count meaningful. A host that has driven odbcconf through these binaries before likely has database tooling or an
    installer that does so; a first-ever occurrence points at the alerting chain itself. The user column shows which
    accounts have done it.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: odbcconf.exe
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's criteria scoped to this user, so the result is the user's 90-day history of
    this specific fodhelper-to-odbcconf pattern rather than generic use of rundll32.exe, aggregated by host. A user who
    has never produced this pattern is a different situation from one who produces it regularly; weigh the count
    against the account's role and its normal toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \fodhelper.exe
        Image|endswith:
        - \rundll32.exe
        - \regsvr32.exe
        CommandLine|contains|all:
        - odbcconf.exe
        - regsvr
        - shellexec_rundll
        CommandLine|contains:
        - installdriver
        - setfiledsndir
        - vkipdse
        CommandLine|endswith|windash:
        - /a
        - /f
        - /s
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this parent process historically driven the rule's pattern on this host or across the environment, or
    is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute the behavior. The
    meaningful pivot is the launch mechanism: the query mirrors the rule''s criteria scoped to the alerting parent
    process, so the result is the 90-day history of fodhelper.exe driving this specific pattern rather than generic
    parent and binary co-occurrence. A parent that is new for this pattern is the deviation worth chasing; a parent
    already accounting for a large volume of prior events is automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \fodhelper.exe
        Image|endswith:
        - \rundll32.exe
        - \regsvr32.exe
        CommandLine|contains|all:
        - odbcconf.exe
        - regsvr
        - shellexec_rundll
        CommandLine|contains:
        - installdriver
        - setfiledsndir
        - vkipdse
        CommandLine|endswith|windash:
        - /a
        - /f
        - /s
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the account's activity across all hosts shows whether the elevated execution is confined to this
    endpoint or is one instance of the same account acting in several places. This pattern spreads through removable
    media rather than by remote logon, so the same account appearing on multiple hosts in the same window more often
    reflects a shared drive being carried between machines than a network-borne intrusion.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to
    this host?
  context: 'Under a service principal, asking what else the user did across the network returns agent telemetry from
    every host. The meaningful question is whether the same launch mechanism fired elsewhere: the query mirrors the
    rule''s criteria scoped to the alerting parent process, fleet-wide, in the alert window. Several hosts in the same
    window points to a pushed or scheduled trigger; a single host points to a host-local one such as an inserted drive.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \fodhelper.exe
        Image|endswith:
        - \rundll32.exe
        - \regsvr32.exe
        CommandLine|contains|all:
        - odbcconf.exe
        - regsvr
        - shellexec_rundll
        CommandLine|contains:
        - installdriver
        - setfiledsndir
        - vkipdse
        CommandLine|endswith|windash:
        - /a
        - /f
        - /s
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What other process activity occurred on this host around the time of the alert?
  context: The steps that lead into this chain are visible as process activity in the surrounding minutes — a command
    interpreter reading a file from a removable drive, an installer service launched with an unusual command line, or a
    script host started from a shortcut. Aggregating by binary and parent collapses routine agent traffic into
    high-count rows and leaves novel parent-child pairs standing out at low counts, which is what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: This execution sits in the middle of a longer sequence, so earlier detections on the same host often name
    the stages that preceded it — removable media execution, an installer binary retrieving content over an unusual
    port, or a user-agent bypass of the consent prompt. Reading the alert timeline in order reconstructs how the chain
    reached the elevated step.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Is this parent-child spawning pattern occurring on other hosts in the environment?
  context: The same parent-child pairing on several hosts within a day indicates the pattern is spreading rather than
    being confined to one endpoint, and the per-host command lines show whether they carry the same DLL name or
    host-specific ones. A single host is the more common outcome for media-borne execution and narrows containment to
    that machine and whatever removable drives it has seen.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
  answer_sources:
  - process_creation
