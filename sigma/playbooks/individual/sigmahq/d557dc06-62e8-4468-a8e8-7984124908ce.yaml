name: HackTool - WinPwn Execution
id: d923c906-1a00-4229-92ff-2266277069a0
description: |
  Fires when a process command line contains one of the WinPwn invocation strings
  (Offline_Winpwn, "WinPwn ", WinPwn.exe, WinPwn.ps1). WinPwn is a PowerShell
  post-exploitation framework that wraps reconnaissance, UAC bypass, credential
  harvesting, and lateral-movement tooling behind a single menu-driven entry point,
  and is commonly delivered through a download cradle or an offline bundle. The same
  strings also appear in authorized penetration tests and in atomic test harnesses,
  so the investigation should confirm the command, identify which capability was
  invoked, and determine whether the activity maps to a sanctioned engagement or to
  hands-on-keyboard operator activity.
type: detection
detection_id: d557dc06-62e8-4468-a8e8-7984124908ce
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line contain a WinPwn invocation string?
  context: Confirm the alert is a true positive by reviewing the full command line
    against the rule's detection criteria, which match the literal strings
    Offline_Winpwn, "WinPwn ", WinPwn.exe, or WinPwn.ps1. Note which string and which
    delivery pattern fired (a download cradle pulling WinPwn.ps1, the Offline_Winpwn
    bundle, or a direct WinPwn.exe/.ps1 invocation), since that frames the rest of
    the investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this WinPwn execution part of an authorized penetration test or red team engagement?
  context: WinPwn is an offensive framework used in sanctioned security assessments
    and in atomic test harnesses. Check whether a pentest or red team exercise is
    active on this host or network segment. An authorized engagement with matching
    tool usage and timing resolves the alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user expected to run offensive or reconnaissance tooling?
  context: Penetration testers and IT staff may legitimately run security tooling,
    but standard users rarely launch a post-exploitation framework. The user's role
    and typical behavior baseline determine whether running WinPwn is routine or
    anomalous.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: What credential stores or sensitive resources did this WinPwn invocation target?
  context: WinPwn bundles modules that read LSASS memory, the SAM database, DPAPI
    secrets, and browser credential stores (via SafetyKatz, SessionGopher, SharpWeb,
    and similar). Decode the full command line to identify which module or subcommand
    was requested -- the target store determines which accounts may be compromised
    and what remediation is needed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which WinPwn capability or module was invoked, and were any console or non-interactive flags set?
  context: WinPwn is multi-purpose -- the menu exposes credential harvesting
    (Kittielocal), AD reconnaissance (Domainreconmodules), UAC bypass (UACBypass),
    kerberoasting, and others. The command-line module name and flags such as
    -noninteractive, -consoleoutput, or -repo reveal which capability ran and whether
    the run was scripted for an agent rather than driven interactively, which scopes
    potential compromise and response actions.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did the WinPwn command write known artifacts to disk on this host?
  context: WinPwn modules drop characteristic files -- loot folders, LSASS dump
    files, .kirbi tickets, BloodHound JSON or zip collections, and obfuscated script
    bundles such as the Offline_Winpwn package. Checking for these confirms execution
    and reveals scope even if the original process has exited. The query scopes file
    creation to this host and to the WinPwn-related paths derived from the command line.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - 'WinPwn'
          - 'Offline_Winpwn'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Is the WinPwn script or downloaded payload still on disk for analysis?
  context: The command may reference a script (WinPwn.ps1, Offline_Winpwn.ps1) or a
    payload pulled by a download cradle. Checking whether the file still exists
    enables deeper analysis -- hash lookups, sandbox submission, or content review of
    the menu and module strings it carries.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process spawned this WinPwn execution and is that parent chain expected?
  context: The parent process reveals how WinPwn was invoked. A PowerShell download
    cradle, an Office application, or a script interpreter (wscript.exe, mshta.exe)
    as the parent points to delivery through phishing or remote loading; explorer.exe
    or a developer shell points to interactive operator use. Walk the parent chain to
    establish how the framework reached this host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did other reconnaissance commands run on this host around the same time?
  context: WinPwn drives bursts of enumeration. Multiple reconnaissance commands in
    rapid succession -- whoami, net, nltest, systeminfo, dsquery -- alongside the
    WinPwn invocation is a signature of post-compromise enumeration. Three or more
    distinct recon binaries within the window typically indicates automated discovery
    rather than isolated troubleshooting.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: Which accounts may be compromised, and do any have elevated privileges?
  context: The severity of credential theft depends on the privilege level of the
    affected accounts. Domain admin or service-account exposure requires escalation;
    a standard user account may only need monitoring. Cross-reference the running user
    and any accounts named in the command line with directory group memberships.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: What action ran at high or system integrity shortly after this event?
  context: WinPwn ships a UAC bypass menu (ccmstp, UACMagic, diskcleanup, DccwBypass)
    used to reach high integrity before credential dumping, persistence, or security
    tampering. Processes spawned at High or System integrity on this host shortly
    after the WinPwn invocation reveal what the elevated context was used for.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: Were registry modifications made to set up a UAC bypass before this event?
  context: Several WinPwn bypass methods write a command to a registry key that an
    auto-elevated process reads and executes -- common targets include
    HKCU\Software\Classes\ms-settings\Shell, mscfile\shell, and HKCU\Environment.
    Finding the registry write confirms the bypass mechanism and reveals the payload
    that ran with elevated privileges.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\reg.exe'
          - '\powershell.exe'
          - '\cmd.exe'
        CommandLine|contains:
          - 'ms-settings'
          - 'mscfile'
          - 'Classes\exefile'
          - 'Classes\Folder'
          - 'Environment'
          - 'Shell\Open\command'
          - 'DelegateExecute'
      condition: selection
    fields:
      - CommandLine
      - Image
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - Offline_Winpwn
        - 'WinPwn '
        - WinPwn.exe
        - WinPwn.ps1
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - Offline_Winpwn
        - 'WinPwn '
        - WinPwn.exe
        - WinPwn.ps1
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the WinPwn
    run is isolated or part of broader hands-on activity. The same user triggering
    activity on multiple endpoints around this time widens the potential scope.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - Offline_Winpwn
        - 'WinPwn '
        - WinPwn.exe
        - WinPwn.ps1
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What is the identity of the process running the WinPwn command line, and is it the host's genuine PowerShell binary?
  context: WinPwn modules load native API surfaces (ntdll.dll, kernel32.dll) to run
    in-memory .NET assemblies and direct syscalls, so the process hosting the command
    line matters. Confirm the executing image is the real powershell.exe in
    System32/SysWOW64 rather than a renamed or relocated copy used to blend the
    framework into expected process names. The query returns the image path, hashes,
    and signature for the triggering event.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
      - CommandLine
