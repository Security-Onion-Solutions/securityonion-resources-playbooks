name: Suspicious Child Process Of Veeam Dabatase
id: 0e472138-ee9e-40c0-9096-3a1567c92278
description: |
  Detects the Veeam backup database engine (sqlservr.exe running the VEEAMSQL instance) spawning a child process that is
  either a shell or script host carrying a download/execution pattern (cmd.exe, powershell.exe, pwsh.exe, wsl.exe, or wt.exe
  with -ex, bypass, cscript, DownloadString, http://, https://, mshta, regsvr32, rundll32, wscript, or copy in its command
  line) OR a built-in reconnaissance binary (net.exe, net1.exe, netstat.exe, nltest.exe, ping.exe, tasklist.exe, whoami.exe).
  A database service does not normally launch interactive shells or discovery tools; this pattern is consistent with command
  execution against the backup server's SQL backend, such as xp_cmdshell driven by exploitation of the backup service.
  Investigation should confirm the child command, trace how the SQL engine came to spawn it, decode any encoded or download
  payloads, and determine whether reconnaissance, credential access, or persistence followed.
type: detection
detection_id: d55b793d-f847-4eea-b59a-5ab09908ac90
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Did the Veeam SQL engine spawn a child that either is a shell with a download/execution pattern or is a built-in
    recon binary?
  context: Confirm the alert is a true positive by reviewing the parent and child against the detection criteria. The rule fires
    when sqlservr.exe (VEEAMSQL instance) spawns EITHER a shell or script host (cmd.exe, powershell.exe, pwsh.exe, wsl.exe,
    wt.exe) carrying one of the download/execution tokens (-ex, bypass, cscript, DownloadString, http://, https://, mshta,
    regsvr32, rundll32, wscript, copy) OR a recon binary (net.exe, net1.exe, netstat.exe, nltest.exe, ping.exe, tasklist.exe,
    whoami.exe). Note which branch fired -- a shell-with-payload branch points to download/execute, a recon-binary branch points
    to enumeration, and they steer the downstream questions differently.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Is this server and the account it ran under expected to launch shells or discovery tools from the backup database
    engine?
  context: A backup database server has a narrow, predictable workload; the SQL service account does not normally spawn interactive
    shells or reconnaissance binaries. Knowing whether any maintenance, backup automation, or administrative task legitimately
    drives the SQL engine to launch these processes is often the fastest path to separating a true positive from routine operations.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is sqlservr.exe expected to spawn this child, and what started the SQL engine itself?
  context: The parent-child relationship is the core signal here. A database engine spawning a command interpreter or recon
    tool is almost always driven by SQL-side command execution (for example xp_cmdshell), not by normal database work. Tracing
    the SQL engine's own origin and command line confirms it is the Veeam backup instance and helps establish whether the
    execution chain is administrative or attacker-driven.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did the same sqlservr.exe instance spawn?
  context: If the backup SQL engine spawned the alerting child, it likely spawned others in the same operation -- a shell to
    download a payload, then recon binaries, then further tools. Examining siblings of the exact parent instance reveals the
    full scope of activity driven through the SQL backend rather than a single isolated command.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What SQL query or stored procedure caused the database engine to execute this command?
  context: When a database engine spawns a shell, the trigger is usually a SQL statement that reaches the operating system
    -- commonly xp_cmdshell or a CLR/stored-procedure call. Identifying the originating query, and whether it arrived over
    the network against the backup service, points to the delivery vector and to whether the service was exploited. SQL audit
    or query logs, and the connection source for the backup service port, are the places to confirm this.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Is the backup and replication software on this server patched against known remote code execution flaws in its service?
  context: Command execution through the backup database engine is a known consequence of exploiting unauthenticated remote
    code execution in the backup service. Confirming the installed version and patch level establishes whether a known flaw
    made this possible and identifies other similarly unpatched backup servers that are at risk. Patch status also distinguishes
    exploitation of a known fixed flaw from a zero-day.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: Are the files referenced by the child command still on disk for analysis?
  context: If the child command downloads, copies, or writes a file -- a script, a copied configuration file, or a downloaded
    payload -- checking whether it still exists on disk enables hash lookups, content review, and sandbox submission. File
    paths extracted from the alerting command line drive this lookup.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What did the shell or script host actually do? Decode the full command, including any download or execution tokens it carried.
  context: The full command line reveals the specific action taken. Decode flags, parameters, encoded content, file paths,
    and URLs. The query scopes to the same host and binary, filtered to the download and execution tokens the rule keys on
    (-ex, bypass, cscript, DownloadString, http://, https://, mshta, regsvr32, rundll32, wscript, copy), so multiple sequential
    invocations that form one logical operation are surfaced together rather than buried in routine shell noise.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains:
          - '-ex '
          - 'bypass'
          - 'cscript'
          - 'DownloadString'
          - 'http://'
          - 'https://'
          - 'mshta'
          - 'regsvr32'
          - 'rundll32'
          - 'wscript'
          - 'copy '
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Was the command encoded or obfuscated, and what does it decode to?
  context: PowerShell payloads driven through a SQL backend are frequently launched with -EncodedCommand (-enc) or with download
    cradles such as Net.WebClient.DownloadString and Invoke-WebRequest. Decode any base64 or obfuscated content to recover
    the actual payload, and identify the source URL it fetches and what it executes -- in-memory reflective loads of .NET
    assemblies are a common end state that leaves little on disk.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the full deobfuscated script content?
  context: Script block logging records the deobfuscated script content PowerShell actually executes, even when the command
    line is encoded or obfuscated, providing ground truth about what ran. If PowerShell operational logs are not ingested in
    this environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell security controls bypassed or weakened before this execution?
  context: The detected children commonly carry execution-policy bypass flags (-ex, bypass) directly. Beyond those, attackers
    often disable AMSI, change execution policy, or downgrade to PowerShell v2 to evade logging before running a payload. Finding
    these precursor actions on the host strengthens the case that the SQL-driven execution was malicious.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: Did other reconnaissance commands run on this server around the same time?
  context: A single discovery command may be troubleshooting, but multiple recon commands in rapid succession -- whoami, net,
    nltest, netstat, tasklist, ping -- is a signature of post-compromise enumeration. On a backup database server, where this
    activity has no routine cause, three or more distinct recon binaries within the window points to automated enumeration
    following the SQL-driven execution.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: Does this backup SQL engine normally spawn this child binary on this host?
  context: Some parent-child relationships are routine, but a database engine spawning a shell or recon tool is inherently
    suspicious. Historical frequency of this specific sqlservr.exe-to-child pairing on this host distinguishes a novel, first-time
    spawning relationship from established automation. Zero or very low counts indicate the pairing has not been seen before.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \sqlservr.exe
        ParentCommandLine|contains: VEEAMSQL
      selection_child_1:
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
        - \wsl.exe
        - \wt.exe
        CommandLine|contains:
        - '-ex '
        - bypass
        - cscript
        - DownloadString
        - http://
        - https://
        - mshta
        - regsvr32
        - rundll32
        - wscript
        - 'copy '
      selection_child_2:
        Image|endswith:
        - \net.exe
        - \net1.exe
        - \netstat.exe
        - \nltest.exe
        - \ping.exe
        - \tasklist.exe
        - \whoami.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_parent and 1 of selection_child_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \sqlservr.exe
        ParentCommandLine|contains: VEEAMSQL
      selection_child_1:
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
        - \wsl.exe
        - \wt.exe
        CommandLine|contains:
        - '-ex '
        - bypass
        - cscript
        - DownloadString
        - http://
        - https://
        - mshta
        - regsvr32
        - rundll32
        - wscript
        - 'copy '
      selection_child_2:
        Image|endswith:
        - \net.exe
        - \net1.exe
        - \netstat.exe
        - \nltest.exe
        - \ping.exe
        - \tasklist.exe
        - \whoami.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_parent and 1 of selection_child_*) and _pb_scope
    fields:
    - host.name
- question: What else did this account do across the network around this time?
  context: Tracking the account's activity across all hosts in the alert window reveals lateral movement or activity spanning
    multiple endpoints. If the same account drove similar activity on other hosts, the scope of compromise may be larger than
    this one server.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \sqlservr.exe
        ParentCommandLine|contains: VEEAMSQL
      selection_child_1:
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
        - \wsl.exe
        - \wt.exe
        CommandLine|contains:
        - '-ex '
        - bypass
        - cscript
        - DownloadString
        - http://
        - https://
        - mshta
        - regsvr32
        - rundll32
        - wscript
        - 'copy '
      selection_child_2:
        Image|endswith:
        - \net.exe
        - \net1.exe
        - \netstat.exe
        - \nltest.exe
        - \ping.exe
        - \tasklist.exe
        - \whoami.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_parent and 1 of selection_child_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this server in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- defense tampering, reconnaissance, or
    credential access -- may reveal the attack stages that preceded this event and help reconstruct the timeline of how the
    backup server came to be running attacker commands.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
