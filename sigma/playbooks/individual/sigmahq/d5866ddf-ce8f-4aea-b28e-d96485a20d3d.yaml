name: Files With System Process Name In Unsuspected Locations
id: 7da09a42-a6ba-42d4-a78e-53434bc69e86
description: |
  Detects the creation of an executable carrying the name of a Windows system process — svchost.exe,
  lsass.exe, services.exe, powershell.exe and roughly seventy others — in a directory other than the
  canonical system locations. The rule fires only when both conditions hold together: the written file
  name matches one of those system executable names AND the path falls outside System32, SysWOW64,
  WinSxS, SoftwareDistribution, uus, and the servicing and update paths the rule excludes, so a
  name-versus-location mismatch is present by construction. Copies made for testing, and third-party
  software that reuses a system process name for its own executable, produce the same event. The
  investigation should establish which process wrote the file, how it arrived, whether the file's
  content and metadata match the system binary its name implies, and whether it was subsequently
  executed.
type: detection
detection_id: d5866ddf-ce8f-4aea-b28e-d96485a20d3d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the written file carry a Windows system process name while sitting outside the system directories?
  context: >-
    Confirm the alert before investing time: review the exact path, the operation performed (created,
    renamed, deleted), and the process responsible for it. Both conditions must hold together for this
    rule to fire — the file name matches one of the listed system process executables, and the path is
    outside System32, SysWOW64, WinSxS, SoftwareDistribution, uus, and the servicing and update
    locations the rule excludes. The signer columns describe the acting process, not the written file;
    read them for coherence with what was written rather than as a verdict.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - file_event
- question: Is this user and host expected to place a copy of a system-named executable outside the system directories?
  context: >-
    Routine activity produces this pattern: an engineer copying a system executable to a test
    directory, a packaging or imaging job staging files, or third-party software installing an
    executable that happens to reuse a system process name. Knowing the account's role and the host's
    function is usually the fastest way to separate that from a dropper. When the user is a machine
    account or SYSTEM, judge by the writing process and the host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What is the actual identity of the process that wrote this file?
  context: >-
    The alert names the writing process's path but not its embedded identity. Comparing the Image path
    against OriginalFileName in the PE metadata shows whether the writer is itself operating under a
    borrowed name, and the signing details show whether it is a Microsoft-signed system component, a
    signed third-party installer, or unsigned. The hash supports a reputation lookup against
    threat-intelligence sources. A signed installer writing a system-named executable into its own
    program directory reads differently from an unsigned binary in a temp directory doing the same.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: How did a file with this system process name arrive on this host, and which processes have written it before?
  context: >-
    Match by file name over a long window rather than by full path over a short one — a misplaced
    system-named executable is often placed at install time, days or weeks before it draws attention.
    The writing process on each hit identifies the delivery mechanism: an installer or package
    manager, an archive extractor, a browser or transfer utility, a remote administration tool, or a
    dropper. A single arrival written by a signed installer points at third-party software reusing the
    name; repeated arrivals into user-writable directories point elsewhere.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - process_creation
- question: Is the file still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives the next step. A copy still on disk can be retrieved,
    hashed, and compared against the genuine system binary; a file deleted seconds after it was
    written is the signature of cleanup or a self-deleting dropper and moves the investigation to what
    ran in between. Read the operation type on each row to tell creation, modification, rename, and
    deletion apart.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What did the writing process spawn after it created this file?
  context: >-
    The children of the process that wrote the file show what it was doing beyond the drop. An
    installer spawning its own helpers and a package manager spawning a servicing component are
    routine. A script host, archive utility, or remote-access tool spawning command interpreters,
    discovery utilities, or the newly written file itself places the write inside a longer sequence
    rather than at the end of an install.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What process wrote this file, and what launched it?
  context: >-
    The alert names the acting process but not its origin. Retrieving that process's own start event
    gives its full command line and its parent. Installers launched by a package manager or by
    msiexec.exe, and update components launched by services.exe, have predictable lineage; a writer
    launched by a script host, an archive utility, an office application, or a remote-access tool does
    not, and that parent is usually more informative than the write itself.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What operation was the writing process actually performing, and from which working directory?
  context: >-
    The file event carries no command line, so the operation behind the write has to be read from
    process telemetry. All executions of the writing binary on this host within a few minutes are
    returned, because a copy, extract, or install operation is frequently several sequential
    invocations that together form one task. Decode the arguments for source and destination paths,
    archive names, and remote locations, and read the working directory for where the operation was
    staged.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: Is this file the genuine system binary, or a different program using its name?
  context: >-
    The name proves nothing about the content. Retrieve the file from its path and compare it against
    the real system binary of that name: file size, PE metadata and OriginalFileName, embedded
    strings, imports, packer artifacts, and signing status. A byte-identical Microsoft-signed copy
    means a relocated system file; a differing size, an unsigned or third-party signature, or packer
    artifacts mean a different program is wearing the name. This query lists the write events for that
    file name on the host with the process responsible for each; the content itself has to be pulled
    from the endpoint.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
- question: Has this file executed, and what does its hash say about it?
  context: >-
    A file's hash is recorded when it runs, not when it is written, so execution is the pivot from an
    unidentified drop to an identifiable sample. Both legs are kept: a dropped executable runs
    directly and shows in Image, while a file handed to an interpreter appears only on a command line
    — and on that leg the hash belongs to the interpreter, so use the on-disk path for the artifact
    itself. Because the match is by name, executions of the genuine system binary from its normal
    directory appear alongside; read the Image path on each row. Compare the hash against the
    known-good hash for the real system binary and against threat-intelligence sources. A file that
    has not executed does not appear here and must be hashed from disk.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A process that places one system-named executable outside its normal directory often places more
    than one: an installer laying down a program directory, an archive extractor unpacking a bundle,
    or a dropper staging components. The breadth, paths, and extensions of the process's other file
    activity separate a single copy from a staged set and enumerate what else needs review. The
    correlation covers the writer and its direct children, since droppers commonly delegate. For
    installers and servicing components, volume alone is not the signal — look at where the writes
    land.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: Does this host normally run the process that wrote the file?
  context: >-
    Counting 90 days of executions of the writing binary on this host, grouped by account, separates
    resident software from a first-seen program. An installer or update component that has run for
    months under the same accounts is routine background activity. A writer with no prior history on
    the host deserves attention on its own, before what it produced is even considered.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this account do across the environment around this time?
  context: >-
    Tracking the account across all hosts in the alert window shows whether the activity is confined
    to this endpoint or the same account is active elsewhere. File writes frequently carry a machine
    account or SYSTEM as the user; when that is the case this returns routine agent telemetry, and the
    questions about the writing program carry the answer instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did the same program write this same system-named file on other hosts in the same window?
  context: >-
    Under a service or machine account, user identity does not attribute the behavior, and a file
    write carries no parent process to pivot on, so the meaningful question is whether the same
    program produced the same write elsewhere. The query is scoped to the alert's own file name and
    writing binary, fleet-wide, in the alert window. Several hosts in the same window points to a
    scheduled or pushed rollout such as a deployment or update package; a single host points to a
    host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: selection and _pb_scope
    fields:
      - host.name
  answer_sources:
  - file_event
- question: Where else in the environment was a file with this name written in the last day?
  context: >-
    The same system-named executable being written outside the system directories on several hosts
    points to distribution — a deployment, a package rollout, or placement during lateral movement —
    while a single host points to something local. Because the match is by file name only, writes of
    the genuine binary by servicing and update processes appear too; read the path and the writing
    process on each row to tell the two apart.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating the host's process activity by executable and parent in a short window around the
    write collapses routine repetition into single high-count rows and leaves novel parent-child pairs
    standing out at low counts. Look for what surrounds the drop: an archive being extracted, a script
    host running, discovery commands, or a persistence mechanism being created.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host may show the stages that preceded the write — a download or
    extraction, defense tampering, or a script execution — and help place the file drop in a timeline.
    Read the sequence rather than any single earlier alert.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
