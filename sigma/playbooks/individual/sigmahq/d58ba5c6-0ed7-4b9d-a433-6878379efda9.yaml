name: Remote Access Tool - AnyDesk Incoming Connection
id: d019d95b-367c-4240-a80f-5be4569aa5a1
description: |
  Detects an inbound network connection (Initiated false) to a listening AnyDesk instance, where the
  connecting process Image ends in \AnyDesk.exe or \AnyDeskMSI.exe. Because the connection is incoming,
  the remote party is the source of the connection and this host is the destination that accepted it on
  AnyDesk's listening port (7070 by default). AnyDesk is legitimate remote-support software, so a sanctioned
  support session is the benign explanation; the same tool is also installed by operators to hold interactive
  remote control and persistence after an intrusion, chosen because a widely trusted utility draws less
  scrutiny than custom malware. Investigation should confirm the direction and remote source, establish
  whether the tool is approved and tied to a support session, determine how and when AnyDesk arrived on the
  host, and identify what the session spawned and how persistent the deployment is.
type: detection
detection_id: d58ba5c6-0ed7-4b9d-a433-6878379efda9
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Is the alerting connection an inbound connection to AnyDesk, and which remote source initiated it?
  context: Confirm the alert by reviewing the connection direction, the local listening port, and the process
    against the rule's criteria. The rule fires when the process Image ends in \AnyDesk.exe or \AnyDeskMSI.exe
    and the connection is inbound (Initiated is false), meaning a remote host connected in to this machine
    rather than this machine dialing out. AnyDesk listens on TCP 7070 by default; RMM tools can also be
    configured onto non-standard high ports such as 5650, so note the local port the session used. The
    remote party is the source of the connection.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - Image
      - Initiated
- question: Is this user and host expected to accept inbound remote access via AnyDesk?
  context: Legitimate remote-support activity can trigger this detection. Knowing whether the host function
    and the account context are consistent with sanctioned inbound remote access is often the fastest path
    to distinguishing approved IT use from an unauthorized or operator-deployed remote access agent. A jump
    host or a machine under active support is expected to receive inbound sessions; a standard user endpoint
    accepting an incoming AnyDesk connection is less expected. If the alerting event came from network-level
    telemetry without process attribution, this process-anchored lookup returns nothing and the account must
    be established from the endpoint's own process records.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is AnyDesk on the organization's approved remote access software list?
  context: Organizations typically maintain a list of sanctioned remote-support tools for IT use. A remote
    access tool that is not on that list -- even well-known commercial software like AnyDesk -- may represent
    shadow IT or operator-deployed persistence. Suppressing expected support tools while still reviewing
    anomalous ones is the tuning intent here, so check AnyDesk against the approved list regardless of the
    tool's reputation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a current helpdesk ticket or support session explaining this inbound AnyDesk access?
  context: Legitimate remote access usage typically correlates with an active support ticket, a scheduled
    maintenance window, or a user request. An inbound AnyDesk connection with no matching support context
    suggests the tool was installed for persistent access after an intrusion or by a user circumventing
    security controls. Confirm whether a support engagement was in progress for this host at the alert time.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this inbound session align with normal work hours and maintenance windows?
  context: Legitimate remote support typically occurs during business hours or scheduled maintenance windows.
    An inbound remote access session at 3 AM on a Saturday is more suspicious than the same activity during
    a documented support window. Check whether the session time falls inside the host's normal working hours,
    a planned maintenance window, or the local business hours of the host's timezone.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: How was AnyDesk launched on this host, and from what path? Decode its command line and working directory.
  context: The launch command line and working directory reveal how AnyDesk was started and where it lives.
    An install under Program Files started by a managed installer points to a sanctioned deployment; a portable
    copy run from a user-writable or temporary directory (Downloads, AppData, ProgramData staging, %TEMP%)
    points to operator staging rather than a managed install. This scopes to every execution of the binary on
    the host in the surrounding window. If the alert came from network-level telemetry without process fields,
    this pivot lands only on the endpoint's own process records.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What is the remote source of this inbound connection? What do DNS, WHOIS, and threat intel reveal?
  context: For an inbound session the remote party is the source of the connection. Investigate that source
    address -- reverse DNS, WHOIS and registration age, hosting provider, and known threat intelligence hits.
    A residential or cloud address that is not vendor relay infrastructure, or one with threat intel hits,
    points to an attacker-controlled endpoint reaching in rather than a sanctioned support connection. The
    query retrieves the inbound connection detail for this source; the reputation lookup is manual.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        SourceIp|expand: '%src_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
- question: What process spawned the AnyDesk process, and is that parent chain expected?
  context: The parent process reveals how AnyDesk was invoked and under which context. A managed installer,
    services.exe for the AnyDesk service, or an interactive explorer.exe launch points to a deployment or a
    user starting the tool; script hosts, archive utilities, or another remote access session as the parent
    point to delivery by a loader or staging from a prior foothold. The expected parent varies by environment,
    so weigh it against how AnyDesk is normally deployed here.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What child processes did AnyDesk spawn afterward?
  context: An interactive remote session is visible in the children the tool parents. AnyDesk spawning command
    interpreters, script hosts, reconnaissance utilities, or download tools indicates hands-on-keyboard control
    or follow-on actions rather than passive availability for support. Examine the spawned processes and their
    command lines to determine whether the session is doing routine support work or staging further activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What external endpoints does AnyDesk on this host reach, and on what ports?
  context: Alongside the inbound session, AnyDesk maintains outbound connections to relay and vendor cloud
    infrastructure. The destinations reveal whether the tool is reaching AnyDesk's own relay network or a
    custom and unusual endpoint, and the ports matter because these tools can be configured onto non-standard
    high ports. An endpoint that is not vendor infrastructure, or an unusually long-lived or high-volume
    session, is a pivot toward an unauthorized or operator-controlled deployment.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: When did AnyDesk arrive on this host, and how close is that to this inbound session?
  context: Remote access agents do not appear spontaneously -- they are installed, downloaded, or copied by a
    parent process before they can accept a connection. Tracing file-creation events for the AnyDesk binaries
    reveals delivery timing and the writing process. A binary written to disk only hours before the first
    inbound session, especially by a download utility, an archive tool, or another remote access session,
    points to a freshly deployed RAT rather than long-standing sanctioned software; the gap between file drop
    and inbound connection bounds when access was established.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith:
        - \AnyDesk.exe
        - \AnyDeskMSI.exe
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: Does this host normally receive inbound connections from this remote source?
  context: A first-time inbound connection from a remote source is more suspicious than routine communication
    with a known one. Establishing a baseline of prior connections from this source to this host helps
    distinguish new attacker infrastructure reaching in from a support endpoint that has connected before.
    Zero or very low historical counts indicate a new or unusual remote source for this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        SourceIp|expand: '%src_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
- question: When this host has previously fired the rule's pattern, what programs and users normally drive it,
    and does the current alert fit?
  context: Even sanctioned tools can be abused. This query mirrors the rule's selection structure scoped to
    this host, so the resulting program and user distribution reflects how the rule's specific firing pattern
    -- inbound connections to AnyDesk -- has historically run here, not generic use of the binary. The Image
    column will show the AnyDesk binary itself; connection events carry no parent lineage, so pivot to its
    process-creation event if launch lineage matters. An unexpected user account, or a first-time occurrence
    of inbound AnyDesk on this host, is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        Image|endswith:
        - \AnyDesk.exe
        - \AnyDeskMSI.exe
        Initiated: 'false'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts received inbound AnyDesk connections in the past week, and does the cross-host
    distribution look like consistent automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of the rule's firing pattern rather than generic usage of the binary. Many hosts receiving inbound
    AnyDesk points to a broadly deployed remote-support product or a scripted rollout; a single host or a
    small unrelated set points to a targeted deployment. Use the host distribution and parent consistency to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        Image|endswith:
        - \AnyDesk.exe
        - \AnyDeskMSI.exe
        Initiated: 'false'
      condition: selection
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context
    -- what led to this event, what happened after, and whether it is part of a larger sequence. Look for
    reconnaissance, privilege escalation, persistence, or additional tooling installed near the inbound
    session's time.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- exploitation of a
    public-facing service, defense tampering, reconnaissance, or credential access -- may reveal the attack
    stages that preceded an unauthorized remote access deployment and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host?
  context: Attackers rarely rely on a single persistence mechanism. After establishing remote access, they
    commonly install backup mechanisms using different techniques -- scheduled tasks, services, registry Run
    keys, BITS jobs, or WMI subscriptions. Multiple persistence installations from the same timeframe as the
    inbound session indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
