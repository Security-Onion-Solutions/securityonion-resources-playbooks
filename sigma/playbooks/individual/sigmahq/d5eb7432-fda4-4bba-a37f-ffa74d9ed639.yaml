name: Serpent Backdoor Payload Execution Via Scheduled Task
id: f0b83545-599f-4dee-b402-0a3adfa03a64
description: |
  Detects a single cmd.exe or powershell.exe command line that combines every element of an
  event-triggered scheduled-task execution sequence: an XPath event filter fragment
  ("[System/EventID="), a task creation flag (/create), a task deletion flag (/delete), an event
  channel flag (/ec), an event source flag (/so), and the task name "run" (/tn run). All of these
  must appear together for the rule to fire. The Serpent backdoor uses this sequence to proxy
  execution through the signed Task Scheduler service: it registers a one-time task keyed to a
  fabricated event ID, writes a matching event to trigger the task immediately, then deletes the
  task, leaving the payload running as a child of taskhostw.exe rather than of the calling shell.
  Investigation should recover the task's payload command from the /TR argument, confirm whether
  the Task Scheduler service actually spawned that payload, and establish how the shell itself was
  launched.
type: detection
detection_id: d5eb7432-fda4-4bba-a37f-ffa74d9ed639
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: >-
    Does the alerting command line combine an XPath event-ID filter with /create, /delete, /ec,
    /so, and a task named run, all in one invocation of cmd.exe or powershell.exe?
  context: >-
    The rule fires only when every one of those elements is present in the same command line, so a
    partial match is not this pattern. Confirm the full sequence before spending further
    investigation time, and note the exact event ID inside the XPath filter and the payload named
    after /TR.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to register and immediately delete event-triggered scheduled tasks from a command shell?
  context: >-
    Tasks deployed by administrators or management tooling normally use a durable schedule and a
    descriptive task name, and they are not deleted seconds after creation. A user or host with no
    task-authoring role makes the sequence harder to explain as routine operations.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Does the user or administrator recall running this scheduled-task command, and can they explain the payload named after /TR?
  context: >-
    Direct confirmation from the person behind the account is often the fastest way to resolve the
    alert. If nobody recalls the command, the shell was likely driven by a script, a document
    macro, or another program rather than typed at a console, which shifts the investigation to
    how the shell was launched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: What task name, event channel, trigger event ID, and payload command does this command line configure?
  context: >-
    Read /TN for the task name, /SC ONEVENT with /EC for the event channel the task watches, /MO
    for the XPath filter that names the triggering event ID, and /TR for the program the task runs.
    The /TR value is the payload; everything else is delivery. The paired event-creation step
    normally names the same event ID and channel, and /SO supplies the fabricated event source,
    which confirms the trigger was manufactured rather than waited for.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Is the payload passed to /TR encoded or obfuscated, and what does it decode to?
  context: >-
    The task's target command is frequently more than a plain binary path. Look for base64 passed
    via -EncodedCommand or -enc, string concatenation, backtick escaping, environment-variable
    substitution, and nested quoting inside the /TR value. Decoding it reveals what the task
    actually runs, which in this family has included download cradles and interpreter payloads
    staged from images or package managers.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Did PowerShell script block logging capture the full script content on this host?
  context: >-
    Event ID 4104 records the deobfuscated script text PowerShell actually compiled, which is the
    ground truth when the command line is encoded or built at runtime. It also captures the stages
    around the task command, such as a downloader that fetched the payload before the task was
    registered. If PowerShell operational logs are not ingested in this environment, treat an empty
    result as a visibility gap rather than as evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
  answer_sources:
  - powershell_script_block
- question: What scheduled tasks were registered, updated, or deleted on this host around the time of the alert, and under which account?
  context: >-
    Task registration is recorded independently of the process that requested it, so these events
    corroborate the command line and survive the task being deleted. Event ID 4698 records
    creation, 4702 an update, and 4699 a deletion; a 4698 and a 4699 for the same task name within
    seconds is the create-trigger-delete sequence this pattern relies on. The subject account names
    who registered the task, which may differ from the account that owns the shell.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4698
          - 4699
          - 4702
      condition: selection
    fields:
      - EventID
      - TaskName
      - SubjectUserName
  answer_sources:
  - manual_review
- question: What writes landed in the Task Scheduler registry cache on this host around the time of the alert?
  context: >-
    Registering a task writes the task name, its GUID, and its trigger and action data under the
    Schedule\TaskCache tree. These writes record the registration independently of the shell's
    command line. Key and value deletions are not observable in this telemetry, so read a cache
    entry as evidence the task was registered, not as proof it is still present; pair it with a
    direct task query on the host to settle current state.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_taskcache:
        TargetObject|contains: '\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\'
      condition: selection and selection_taskcache
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - manual_review
- question: Did the Task Scheduler service spawn the task's payload on this host, and how soon after the task was registered?
  context: >-
    A task registered with an event trigger fires as soon as a matching event is written to the
    named channel, so the payload typically runs within seconds of registration rather than at a
    future time. Its process appears under the Task Scheduler service rather than under the shell
    that created the task, which is the point of the technique. Compare the child command lines
    against the /TR value to confirm the payload executed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\svchost.exe'
        ParentCommandLine|contains: 'Schedule'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Is the task named run still registered on the host, or did the delete step remove it?
  context: >-
    This sequence deletes the task immediately after it fires, so the task being absent is the
    expected outcome and is not evidence the activity was routine. Query the task directly on the
    host or through the endpoint console. A task that is still registered means the delete step
    failed or a second task was left behind, and it is then live persistence that needs
    remediation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - manual_review
  - edr_console
- question: What process spawned this shell, and is that parent chain expected?
  context: >-
    The parent reveals how the command was delivered. An interactive parent such as explorer.exe or
    a management agent points toward an operator or tooling; winword.exe, wscript.exe, mshta.exe,
    or python.exe as the parent points toward document-macro or interpreter-driven delivery, which
    is how this task sequence has typically been reached.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the
    user's 90-day history of this specific create-trigger-delete pattern rather than generic use of
    a command shell. A user who has never produced it is harder to explain than one who does so
    regularly; weigh the count against the account's role and normal toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
        CommandLine|contains|all:
        - '[System/EventID='
        - /create
        - /delete
        - /ec
        - /so
        - /tn run
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: Has this parent process historically driven the rule's pattern here, or is the parent new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute the behavior
    and the launch mechanism is the meaningful pivot. The query mirrors the rule's selection
    structure scoped to the alerting parent, so the result is the 90-day history of that parent
    driving this specific pattern. A new or rare parent is the deviation worth chasing; a parent
    already accounting for thousands of prior events is vendor or operating-system automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
        CommandLine|contains|all:
        - '[System/EventID='
        - /create
        - /delete
        - /ec
        - /so
        - /tn run
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did this user do across the environment around this time?
  context: >-
    Tracking the account's activity across all hosts shows whether the same identity was driving
    execution elsewhere in the same window, which separates a host-local event from movement across
    endpoints. Aggregating by host and binary keeps the view readable while novel host or tool
    combinations stand out at low counts.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, asking what else the user did returns agent telemetry from every
    host and answers nothing. The query instead mirrors the rule's selection structure scoped to
    the alerting parent process, fleet-wide, in the alert window. Multiple hosts point to scheduled
    or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
        CommandLine|contains|all:
        - '[System/EventID='
        - /create
        - /delete
        - /ec
        - /so
        - /tn run
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of this create-trigger-delete pattern rather than generic shell usage. Many
    hosts firing the same pattern points to scripted deployment; one host or a small unrelated set
    points to operator-driven activity. Use the host distribution to calibrate how far the
    investigation needs to reach.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
        CommandLine|contains|all:
        - '[System/EventID='
        - /create
        - /delete
        - /ec
        - /so
        - /tn run
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Were other persistence mechanisms installed on this host in the surrounding hours?
  context: >-
    A task that is deleted seconds after it fires provides execution, not persistence, so anything
    meant to survive a reboot was established separately. Services, registry run keys, BITS jobs,
    WMI subscriptions, and additional tasks installed in the same window indicate the operator
    stacked mechanisms rather than relying on the one the rule caught.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Were files dropped to persistence locations such as Startup folders or scheduled-task definitions on this host?
  context: >-
    File-based persistence bypasses command-line detection entirely. Writing a task XML definition
    directly under the Tasks directories, or dropping an executable or script into a Startup
    folder, establishes persistence without running a task or registry tool. File events capture
    these drops even when no persistence tool was invoked.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
