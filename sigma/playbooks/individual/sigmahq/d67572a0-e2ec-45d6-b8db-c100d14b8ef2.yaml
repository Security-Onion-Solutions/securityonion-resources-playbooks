name: NetNTLM Downgrade Attack - Registry
id: 69fc7088-1fa1-417e-be93-d2e3d2735c70
description: |
  Detects a registry write under HKLM\SYSTEM\CurrentControlSet\Control\Lsa that weakens NTLM/LM
  authentication security. The rule fires when the target key lives under the ControlSet\Control\Lsa
  path AND EITHER LmCompatibilityLevel is set to 0, 1, or 2 (which permits the legacy LM/NTLMv1
  response), OR NtlmMinClientSec is set to a value that drops message integrity/confidentiality
  (0x0, 0x10, 0x20, 0x30), OR RestrictSendingNTLMTraffic is modified. Weakening these settings lets
  an attacker force subsequent authentications to negotiate a weaker NetNTLM/LM exchange whose
  captured challenge-response is far easier to crack offline, so the investigation should determine
  what was set, whether the weakened state persists, whether a fresh authentication was then forced,
  and whether this was an authorized configuration change. Legitimate hardening tools and Group
  Policy usually move these values toward MORE restrictive settings, so a move toward a weaker value
  outside a known deployment deserves scrutiny.
type: detection
detection_id: d67572a0-e2ec-45d6-b8db-c100d14b8ef2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting registry write target an Lsa authentication-security value and set it to a weakened level?
  context: >-
    Confirm the alert is a true positive before investing time. The key must live under
    HKLM\SYSTEM\CurrentControlSet\Control\Lsa AND the write must set one of three values to a weaker
    state, EITHER LmCompatibilityLevel to 0, 1, or 2 (permits LM/NTLMv1), OR NtlmMinClientSec to
    0x0, 0x10, 0x20, or 0x30 (drops required message integrity/confidentiality), OR
    RestrictSendingNTLMTraffic being modified. Note which value fired, because it changes which
    downstream checks carry weight.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify NTLM/LM authentication policy in the Lsa registry?
  context: >-
    Legitimate hardening and Group Policy processing can touch these keys, but they normally move
    them toward stronger settings. Knowing whether the writing account and host role are consistent
    with authentication-policy administration is often the fastest way to separate a routine change
    from an attacker weakening the host. User attribution is present on most endpoint registry
    events; when it is a machine account or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What process wrote this registry value, and what started that process?
  context: >-
    The writing process and its own origin reveal whether the change is legitimate. A change pushed
    by a policy or management process reads differently than one written by a command shell, a
    scripting host, or a process spawned from an interactive foothold. Tracing the parent's origin
    shows whether the execution chain is expected or part of a hands-on session.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What value data was written, and what authentication posture does it set?
  context: >-
    Decode the Details value against the setting that fired. LmCompatibilityLevel of DWORD 0 sends
    LM and NTLMv1 responses and never uses NTLMv2, while 1 and 2 still permit the weaker responses;
    NtlmMinClientSec of 0x0/0x10/0x20/0x30 stops requiring the higher-bit protections (NTLMv2
    session security and 128-bit encryption), so a captured challenge-response becomes crackable
    offline. Read the exact DWORD to establish how far the authentication strength was lowered.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Is this a known authentication or security-policy registry location rather than a routine key?
  context: >-
    The path determines intent. Values under HKLM\SYSTEM\CurrentControlSet\Control\Lsa
    (LmCompatibilityLevel, NtlmMinClientSec, RestrictSendingNTLMTraffic) govern how the host
    negotiates NTLM/LM authentication, and are not values that user software or routine activity
    changes. Classify the key so the analyst treats it as a security-control modification, not
    ordinary configuration churn, and let the value-decoding work sit with the setting analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What command or action performed the downgrade, and which authentication protection did it remove?
  context: >-
    The writing process command line reveals how the change was made and which protection was
    dropped. Look for a direct registry write to LmCompatibilityLevel, NtlmMinClientSec, or
    RestrictSendingNTLMTraffic (for example a reg add setting the value to 0). Establishing the
    exact target confirms whether stronger NTLMv2 negotiation or NTLM egress restrictions were
    removed, which sets the remediation priority.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the weakened setting still stand, and what is its recent modification history on this host?
  context: >-
    Determine whether the downgrade is transient or durable. Registry key and value deletions are
    not emitted as endpoint events, so cleanup cannot be observed directly, judge persistence from
    the value's re-modification history over a longer window (whether it was later restored to a
    stronger value or left weakened) rather than from any removal event. A setting left weakened
    keeps every later authentication from this host negotiable down to the weaker exchange.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: After the setting was weakened, was a fresh authentication forced from this host?
  context: >-
    Weakening the setting only pays off if an authentication then occurs so a weaker NetNTLM/LM
    challenge-response can be captured. A common pattern is forcing a fresh authentication with
    net use to a UNC admin share immediately after the downgrade. Look for authentication-forcing
    commands close to the change; their presence indicates active credential-capture attempts, not
    a standalone configuration edit.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_auth:
        CommandLine|contains:
          - 'net use'
          - 'admin$'
          - 'New-SmbMapping'
      condition: selection and selection_auth
    fields:
      - Image
      - CommandLine
      - User
- question: Is NTLM authentication strength currently restored on this host, or is it still weakened?
  context: >-
    The downgrade may be temporary for a single capture attempt or left in place. Check the current
    effective value of the targeted setting through host inspection or endpoint tooling. If
    LmCompatibilityLevel remains at a permissive level or NtlmMinClientSec still omits the required
    protections, the host keeps negotiating weaker authentication and the setting should be restored
    before further investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What activity occurred on this host after the authentication setting was weakened?
  context: >-
    Weakening authentication is usually a means to an end, most often capturing and cracking a
    credential. Examining what ran immediately after the change reveals what the downgrade was meant
    to enable, such as credential-access tooling, lateral authentication, or additional
    reconnaissance. Correlate this window with network connections and any new process activity.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense-tampering actions performed on this host in the same window?
  context: >-
    An actor who weakens one control often disables several, clearing logs, stopping services, or
    disabling protection tooling to widen coverage for the same operation. Finding multiple tampering
    events from the same account or parent process indicates a coordinated effort to reduce visibility
    around the authentication downgrade rather than an isolated change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: What other registry modifications were made on this host in the same session?
  context: >-
    Actors who change one security value often change several, weakening authentication alongside
    persistence keys, service configuration, or protection policies. Reviewing all registry writes on
    the host in the surrounding window, grouped by key path and writing process, shows whether the
    downgrade landed with other configuration changes that together point to a hands-on session or an
    installer-style implant.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has this Lsa value been modified before on this host, and what values were set previously?
  context: >-
    Authentication-policy values should rarely change. A history of modifications setting stronger
    values, or no prior history at all, both help calibrate this event. If the same weak value has
    never appeared before, the change is a departure from the host's normal configuration and is
    more suspicious than a routine policy refresh.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same Lsa value modified on other hosts in the environment?
  context: >-
    The same modification across many hosts often indicates a Group Policy or management push, while
    a change confined to this one host suggests a targeted action. Comparing the value data set across
    hosts distinguishes a fleet-wide policy change (which may be intentional hardening or a broad
    misconfiguration) from a single-host downgrade tied to activity on that host.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Authentication downgrades in a hands-on operation usually follow earlier stages such as initial
    execution, privilege escalation, or reconnaissance. Reviewing detections on the same host in the
    hours before this event helps reconstruct the sequence that led to the change and whether it is
    part of a multi-stage operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
