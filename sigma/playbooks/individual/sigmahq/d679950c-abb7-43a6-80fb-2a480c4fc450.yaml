name: PDQ Deploy Remote Adminstartion Tool Execution
id: cc520176-9f45-4fa0-8b71-c0f267255c97
description: |
  Fires when a process whose file metadata identifies it as PDQ Deploy Console runs (Description "PDQ Deploy Console", Product "PDQ Deploy", Company "PDQ.com", or OriginalFileName PDQDeployConsole.exe). PDQ Deploy is a legitimate dual-use software deployment tool that pushes MSIs, custom packages, and PowerShell scripts to fleets of Windows endpoints over SMB admin shares and remote service creation, which on the wire resembles PsExec-style lateral movement. In an environment that licenses and operates it from a known management host the activity is routine patching and deployment; on a host or under an account that should not run it, the same binary is an operator-grade remote-execution and lateral-movement capability. Determine whether the console execution is authorized deployment automation or unsanctioned use, and trace what was deployed and where it reached.
type: detection
detection_id: d679950c-abb7-43a6-80fb-2a480c4fc450
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the process metadata match PDQ Deploy Console as this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the triggering event's file metadata against the rule's criteria. The rule matches on any one of the Description "PDQ Deploy Console", Product "PDQ Deploy", Company "PDQ.com", or OriginalFileName PDQDeployConsole.exe. Confirm one of these is present and that the on-disk image is the genuine signed PDQ binary rather than a renamed or spoofed file carrying copied metadata.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - OriginalFileName
      - Company
      - Description
      - Product
- question: Is this user and host expected to run a software deployment console?
  context: PDQ Deploy is normally operated from a small number of designated management or admin hosts by IT staff who run deployments. Execution on a general workstation, a server that is not a deployment point, or under an account with no deployment role is the fastest signal that this is unsanctioned remote-administration use rather than routine patching.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this PDQ Deploy Console invocation do? Decode its command-line arguments.
  context: The full command line reveals what the console was driving -- which package, target list, or scheduled deployment was invoked. Decode any package names, target references, credential or schedule switches, and embedded script paths to understand the specific deployment action. This Phase 2 view scopes to all PDQ Deploy Console executions on this host within the window, so a multi-step deployment driven by several sequential invocations is captured as one operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned PDQ Deploy Console, and is that parent chain expected?
  context: The parent process reveals how the console was launched. Interactive operator use typically descends from explorer.exe or a console shell on a management host; launch from a script host, a remote-execution service, or an unexpected automation parent suggests the tool was driven programmatically rather than by an administrator at the keyboard.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did PDQ Deploy Console spawn afterward?
  context: The processes a deployment console spawns reveal what it actually executed locally -- installer processes, script hosts such as powershell.exe or cmd.exe, or service-control utilities used to stage the agent push. Unexpected children point to what was deployed and whether the operation went beyond ordinary package installation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run PDQ Deploy Console?
  context: A deployment console that has never run on this host before is far more suspicious than one that runs on a regular cadence. Zero or very low counts over the trailing window indicate first-time or rare execution on a host that is probably not a sanctioned deployment point.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit?
  context: Even a licensed deployment tool can be abused. The query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution reflects how this specific PDQ Deploy Console firing pattern has historically run here. A new parent process, an unexpected account, or an unusual launch pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: PDQ Deploy Console
      - Product: PDQ Deploy
      - Company: PDQ.com
      - OriginalFileName: PDQDeployConsole.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of the PDQ Deploy Console firing pattern rather than generic binary usage. Many hosts firing the same pattern points to a sanctioned deployment server pushing packages on a schedule; a single host or a small unrelated set points to manual operator activity worth scrutinizing. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: PDQ Deploy Console
      - Product: PDQ Deploy
      - Company: PDQ.com
      - OriginalFileName: PDQDeployConsole.exe
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: PDQ Deploy Console
      - Product: PDQ Deploy
      - Company: PDQ.com
      - OriginalFileName: PDQDeployConsole.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: PDQ Deploy Console
      - Product: PDQ Deploy
      - Company: PDQ.com
      - OriginalFileName: PDQDeployConsole.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether deployment activity is spreading or whether the same account is touching multiple endpoints. If the same user drove similar activity on several hosts in the window, the scope of the operation is larger than the alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: PDQ Deploy Console
      - Product: PDQ Deploy
      - Company: PDQ.com
      - OriginalFileName: PDQDeployConsole.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- defense tampering, reconnaissance, credential access -- may reveal the stages that preceded a deployment-tool execution and help reconstruct whether this is sanctioned patching or part of a hands-on-keyboard operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: What host initiated this remote connection, and is it an expected administrative source?
  context: PDQ Deploy reaches targets over SMB admin shares and remote service creation, which looks like PsExec-style lateral movement on the wire. Identifying the originating host reveals whether the connection came from the sanctioned deployment server, a known admin jump box, or an unexpected source. An operator who has compromised one host uses it as a pivot to reach others.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 445
          - 135
          - 3389
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - SourceIp
      - DestinationPort
- question: What processes were spawned on this host after the remote connection was established?
  context: Deployment via a tool like PDQ is a means to an end -- the operator pushes packages to install software, run scripts, or stage tooling on the target. Examining processes spawned shortly after the remote access event reveals what was actually deployed and whether the activity stayed within expected installation behavior.
  range: +30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - Image
- question: Has this source host or user account connected to other hosts in the environment?
  context: A deployment operator rarely targets a single endpoint. If the source host or account is reaching many systems with remote-execution tooling in a short window, the scope is fleet-wide rollout -- benign when it matches a sanctioned deployment, but the same pattern characterizes lateral movement when the activity is unsanctioned.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_lateral:
        Image|endswith:
          - '\psexec.exe'
          - '\psexec64.exe'
          - '\mstsc.exe'
          - '\ssh.exe'
          - '\plink.exe'
          - '\wmic.exe'
      condition: selection and selection_lateral
    fields:
      - host.name
      - Image
- question: Where has this user authenticated recently?
  context: Authentication events show which systems the account reached before and after the deployment activity. An account authenticating to many systems in a short period, particularly with network logons consistent with SMB push and remote service creation, suggests a fleet-wide rollout -- or lateral movement if the activity is not sanctioned deployment.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 4624
          - 4625
        TargetUserName|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - IpAddress
      - EventID
      - LogonType
