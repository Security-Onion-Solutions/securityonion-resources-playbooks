name: Wdigest Enable UseLogonCredential
id: b9a73543-f8ca-40dc-9224-0ca3ba200080
description: |
  Detects a modification that sets the WDigest security provider value UseLogonCredential to DWORD 0x00000001 under
  HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest. The rule fires when the TargetObject ends with
  WDigest\UseLogonCredential AND the written value data equals DWORD (0x00000001). Setting this value to 1 reverses a
  Windows hardening default and forces the WDigest provider to cache clear-text logon passwords in LSASS memory, which
  is done to enable later clear-text credential extraction from an LSASS memory dump. Investigation should confirm the
  exact value written, attribute the writing process and its parent, judge whether the change is an authorized
  configuration action, and determine whether a subsequent LSASS access or credential dump followed.
type: detection
detection_id: d6a9b252-c666-4de6-8806-5561bbbd3bdc
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the registry key and value data match the WDigest UseLogonCredential change this rule detects?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires only when the TargetObject ends with
    WDigest\UseLogonCredential AND the written value data (Details) equals DWORD (0x00000001) — both conditions together.
    Review the exact key path, the value data, and the writing process; a value of 1 re-enables clear-text credential
    caching, whereas 0 is the hardened default.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify the WDigest security provider configuration?
  context: >-
    Changing the WDigest UseLogonCredential value is not routine end-user activity and is rarely part of standard build
    tooling. Knowing whether the writing account and the host's function are consistent with a legitimate hardening or
    troubleshooting change is often the fastest way to separate an authorized action from an attacker weakening the host.
    When the account is a machine account or missing, attribute the change by the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What process wrote this value, and what started that process?
  context: >-
    Attribution of the writing process is the core signal. Legitimate changes to this value typically come from
    interactive administrative tools such as regedit.exe or a managed deployment via msiexec.exe; direct writes from
    reg.exe, powershell.exe, or an unsigned binary with an unusual parent lineage point to hands-on tampering. Tracing
    the parent's own origin reveals whether the chain is an operator at a console or a payload spawned from a script or
    document.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Was there a change ticket, maintenance window, or documented approval for this registry change?
  context: >-
    Security-provider hardening settings are usually managed centrally and, when deliberately changed, tend to have a
    corresponding change record. A matching ticket or maintenance window suggests an authorized configuration action;
    absence of one where policy requires it moves this toward an unauthorized weakening of the host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this change align with normal work hours and maintenance windows?
  context: >-
    Legitimate configuration changes usually occur during business hours or a scheduled maintenance window. A change to
    the WDigest credential-caching setting outside of those windows, or on a host that should never receive such a
    change, is more suspicious than the same action during a documented maintenance period.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What value data was written, and what does enabling UseLogonCredential do?
  context: >-
    The Details field carries the written value data. DWORD (0x00000001) sets WDigest UseLogonCredential to 1, which
    reverses the post-2014 hardening default and forces the WDigest provider to retain plain-text-recoverable logon
    credentials in LSASS memory. A value of 0 is the hardened state; any non-zero value re-enables clear-text caching
    and is the configuration attackers set specifically to make a later LSASS memory dump yield usable passwords.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Is the WDigest UseLogonCredential value a known credential-access or defense-evasion location?
  context: >-
    The key path determines intent. The WDigest provider subkey under
    HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders governs whether logon credentials are cached in clear text;
    it is a well-documented credential-access and defense-weakening location rather than a general application setting.
    A write here that sets the value to 1 has no benign automatic cause and should be treated as a deliberate
    configuration change requiring attribution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Does this value remain set to 1, or was it later returned to the hardened default?
  context: >-
    Endpoint telemetry records value modifications but not key or value deletions, so attacker cleanup cannot be
    confirmed by looking for a delete event. Judge the current state instead from the re-modification history of this
    key over a longer window: a later write returning UseLogonCredential to 0 indicates the exposure window closed,
    while no subsequent write means clear-text caching remained enabled and any process that authenticated in between
    left recoverable credentials in memory.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Were other registry modifications made on this host in the same session?
  context: >-
    Attackers who weaken one security setting frequently weaken several — for example enabling WDigest clear-text
    caching alongside disabling anti-malware protections or loosening token-filter policy. Registry changes clustered
    from the same writing process within a short window reveal the full scope of tampering and whether this was a single
    setting change or one step in a broader defense-weakening pass.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has the WDigest UseLogonCredential value been modified before on this host?
  context: >-
    Security-provider settings should rarely change. A first-time modification of this value on the host is more
    suspicious than a key that changes on a regular schedule. Compare the historical Details values and writing
    processes; if the only prior state was the hardened default, this write is the point at which clear-text caching was
    introduced.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Did an LSASS access or credential dump follow this change on the same host?
  context: >-
    Enabling WDigest clear-text caching has value to an attacker only if LSASS memory is subsequently read. Look for
    process execution that targets LSASS in the hours after the change — dump utilities, rundll32 driving comsvcs
    MiniDump, or command lines referencing lsass or sekurlsa. Cross-process handle access is not recorded by endpoint
    telemetry, so this searches process creation for the dumping tooling itself; a match alongside the WDigest change
    is a strong sign the setting was flipped to harvest clear-text passwords.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_dump:
        CommandLine|contains:
          - 'lsass'
          - 'MiniDump'
          - 'sekurlsa'
          - 'comsvcs'
      condition: selection and selection_dump
    fields:
      - Image
      - CommandLine
- question: What other process activity occurred on this host around the time of the change?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity in the window around the change collapses routine
    agent noise into high-count rows while novel parent-child pairs stand out at low counts, revealing what led to the
    registry write and what ran afterward — reconnaissance, credential tooling, or additional tampering.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Was the WDigest UseLogonCredential value changed on other hosts in the environment?
  context: >-
    The same value set to 1 across many hosts may reflect a group policy or software deployment, whereas a change on
    only one host points to targeted tampering. Compare the value data written across hosts; a fleet-wide write to the
    hardened default 0 is a hardening rollout, while scattered writes to 1 indicate credential-access preparation on
    specific machines.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Were other persistence or defense-weakening tools run on this host around the same time?
  context: >-
    A host weakened for credential access is often also given a foothold. Surfacing executions of common persistence
    and configuration tools in the surrounding window shows whether the WDigest change was an isolated action or one
    step in a hands-on session that also installed scheduled tasks, services, or registry Run-key persistence.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Did other detections fire on this host in the hours before this change?
  context: >-
    Weakening credential protections is typically a mid-chain action. Earlier detections on the same host — defense
    tampering, reconnaissance, or privileged execution — may reveal how the attacker gained the local administrator or
    SYSTEM rights needed to write this value, and help reconstruct the sequence leading up to the change.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
