name: RestrictedAdminMode Registry Value Tampering
id: c2a8f3b6-b6b9-44ee-8099-818c91bb6ce0
description: |
  Detects writes to the DisableRestrictedAdmin value under HKLM\System\CurrentControlSet\Control\Lsa,
  which governs Remote Desktop RestrictedAdmin mode on the destination host. Setting the DWORD to 0
  enables RestrictedAdmin (a network-logon RDP path that avoids sending reusable credentials); setting
  it to 1 disables it. The value is legitimately managed through policy, but enabling it is also the
  precondition that allows pass-the-hash over RDP into this host, so the investigation should establish
  which process wrote the value, what it was set to, whether the change was authorized, and whether
  inbound Remote Desktop activity followed.
type: detection
detection_id: d6ce7ebd-260b-4323-9768-a9631c8d4db2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alert show a write to the DisableRestrictedAdmin value under the LSA control key?
  context: >-
    Confirm the alert is a true positive before investing time: the triggering event should be a
    registry modification to HKLM\System\CurrentControlSet\Control\Lsa\DisableRestrictedAdmin. Review
    the exact key path (TargetObject) and the writing process against the rule's criteria. Any other key
    path is a mismatch worth flagging.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is DisableRestrictedAdmin under the LSA key a known security-relevant location, and what does this modification change?
  context: >-
    This value sits under HKLM\System\CurrentControlSet\Control\Lsa and controls Remote Desktop
    RestrictedAdmin mode, a security-policy setting rather than a Run/RunOnce persistence key. It is not
    a location a routine user workflow touches; typical writers are policy tooling or an administrator
    acting deliberately. The specific value data written determines whether the mode was turned on or off,
    which is the load-bearing detail for judging intent.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What DWORD value was written to DisableRestrictedAdmin, and does it enable or disable RestrictedAdmin mode?
  context: >-
    The value data (Details) is a REG_DWORD. A value of 0 enables RestrictedAdmin mode, which is the
    state that permits pass-the-hash over RDP into this host; a value of 1 disables it. Flipping from the
    default to 0 outside a documented change window is the attacker-enable pattern (for example
    reg add ...\Lsa /v DisableRestrictedAdmin /t REG_DWORD /d 0 /f). If Details is absent the write may
    have carried non-string data; fall back to the writing process and command line to infer the value set.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Is this user and host expected to modify Remote Desktop or LSA security-policy settings?
  context: >-
    Legitimate changes to RestrictedAdmin mode are usually made by administrators or configuration
    management, not ordinary users. Knowing whether the account and the host's function line up with
    security-policy administration is often the fastest way to separate authorized hardening from tampering.
    User attribution is present on most endpoint registry events; when it is a machine account or missing,
    pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What process wrote this value, and what started that process?
  context: >-
    Registry writes to security policy arrive through a process such as reg.exe, powershell.exe, wmic.exe,
    or a direct API call. Legitimate writers are typically policy tooling like regedit.exe or msiexec.exe
    launched from a management context. Tracing the writing process's own origin (its parent) reveals
    whether the chain is administrative or whether an unsigned or unexpected parent (a script host, an
    Office child, a remote-access tool) drove the change.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Were other registry modifications made on this host in the same window?
  context: >-
    An actor enabling RestrictedAdmin to allow pass-the-hash RDP frequently makes companion changes -
    disabling defenses, adjusting firewall or authentication policy, or adding persistence. All registry
    modifications on this host in the surrounding window, grouped by key path and writing process, show
    whether this write stood alone or was one of several configuration changes from the same session. The
    triggering key will appear in the results; the signal is what else changed alongside it.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has this value been modified on this host before, and how has it changed over time?
  context: >-
    RestrictedAdmin state should rarely change on a given host, so a first-time or infrequent modification
    is more notable than a routinely churned key. The re-modification history also stands in for cleanup
    detection - deletion of a registry value is not observable here, so an attacker reverting the setting
    shows up as a later write flipping the DWORD back rather than as a delete event. Compare the value data
    across occurrences to see whether it is being toggled.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What other process activity occurred on this host around the time of the change?
  context: >-
    A single registry write rarely tells the whole story. Aggregating process activity in the surrounding
    window surfaces what led to the change and what followed - the reg.exe or PowerShell invocation that
    wrote the value, remote-access tooling, or recon binaries. Novel parent-child pairs stand out at low
    counts against the routine agent noise that dominates the high-count rows.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: After the value was set, did Remote Desktop connections on port 3389 to this host follow?
  context: >-
    Enabling RestrictedAdmin (DWORD 0) permits a network-logon RDP path that does not transmit reusable
    credentials, which is precisely what makes pass-the-hash over RDP into this host possible. If the value
    was enabled, look for inbound Remote Desktop sessions afterward; the Initiated field distinguishes
    ingress (a client connecting into this host) from egress. Inbound RDP shortly after the change, from an
    unexpected source, is the outcome the setting enables.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort: 3389
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
      - Image
- question: Was this value modified on other hosts in the environment?
  context: >-
    The same modification across many hosts often reflects a policy or GPO rollout, whereas a change
    confined to one host is more likely targeted. Comparing the value data set on each host distinguishes a
    consistent managed configuration from an actor selectively enabling RestrictedAdmin on chosen machines.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Were other persistence mechanisms installed on this host in the surrounding window?
  context: >-
    Actors who tamper with authentication policy to enable lateral movement commonly also establish
    persistence. Executions of scheduling, service, registry, and BITS tooling in the surrounding window
    show whether backup footholds were set up alongside the RestrictedAdmin change rather than in isolation.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Did other detections fire on this host in the hours before this change?
  context: >-
    Configuration tampering rarely happens in isolation. Earlier detections on the same host - defense
    tampering, reconnaissance, or credential access - may reveal the stages that preceded this change and
    help reconstruct the timeline leading to the RestrictedAdmin modification.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was there a change ticket, maintenance window, or documented approval for this RestrictedAdmin change?
  context: >-
    Security-policy changes affecting Remote Desktop authentication are the kind of modification most
    organizations gate behind change control. A corresponding ticket or maintenance window suggests
    authorized hardening; the absence of one where policy requires it suggests the change was unauthorized.
    This check can quickly close a false positive or escalate a true one.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is a direct registry edit the way your organization normally manages RestrictedAdmin state?
  context: >-
    RestrictedAdmin mode is typically managed through group policy or configuration management rather than
    a direct reg.exe or PowerShell edit on an individual host. A direct command-line write may indicate an
    actor bypassing normal tooling, or an administrator taking a shortcut. Understanding the standard
    procedure helps distinguish the two.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
