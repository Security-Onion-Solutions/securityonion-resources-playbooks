name: PUA- IOX Tunneling Tool Execution
id: 9c8144ab-895a-41e3-bbe2-737695fd01ab
description: |
  Detects execution of IOX, a Go-based port-forwarding and SOCKS5 proxy/relay tool used to bridge traffic
  and pivot into internal networks. The rule fires when EITHER the image name ends in iox.exe, OR the command
  line contains an fwd/proxy subcommand with -l/-r listen/remote flags, OR the file hashes match known IOX
  builds. IOX has legitimate use as a tunneling utility, but it is repurposed by operators to expose internal
  services such as RDP, SMB, or SSH to external infrastructure, often with optional traffic encryption to
  evade signature matching. Investigation should determine which branch fired, decode the forwarding or proxy
  topology, identify the external endpoint and ports, and confirm whether a business purpose exists.
type: detection
detection_id: d7654f02-e04b-4934-9838-65c46f187ebc
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does this event match what the rule detects - an iox.exe image, an fwd/proxy command line, or a known IOX hash?
  context: >-
    Confirm the alert is a true positive by reviewing the triggering event. The rule fires on ANY one of three
    independent branches, so note which one matched - the image name ending in iox.exe, a command line containing
    an fwd or proxy subcommand with -l/-r flags, or a file hash matching a known IOX build. The branch that fired
    determines the rest of the investigation - a command-line match already tells you the forwarding topology, while a
    bare image or hash match means you must still decode what the tool was instructed to do.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - Hashes
- question: Is this user and host expected to run a network tunneling or proxy tool?
  context: >-
    Tunneling and proxy utilities are rarely part of routine end-user or server workloads. Knowing whether the
    user role and host function include penetration testing, network engineering, or sanctioned remote access
    is often the fastest way to separate authorized use from operator-deployed pivoting.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this tunneling tool on the organization's approved software list, and what business purpose does it serve?
  context: >-
    Organizations typically sanction a specific set of remote access and tunneling tools for IT or development.
    IOX is not a mainstream commercial product, so its presence usually represents shadow IT or operator-deployed
    pivoting rather than approved tooling. Any tunneling tool not on the approved list should be checked regardless
    of reputation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there an approved support ticket, maintenance window, or development use case explaining this tunnel?
  context: >-
    Legitimate tunneling typically correlates with an active support ticket, a scheduled maintenance window, or a
    documented test case. If no such context exists, the tool may have been deployed by an operator for persistent
    access or by a user circumventing network controls.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What forwarding or proxy topology did iox.exe set up? Decode the fwd/proxy subcommand and its -l/-r/-k/-u flags.
  context: >-
    The command line reveals the tunnel topology. The fwd subcommand bridges ports; -l binds a local listener and
    -r dials a remote host, so -l with -r is a classic bind-and-forward, while two -r flags dial two remotes
    concurrently. The proxy subcommand stands up a SOCKS5 server, often paired with an inside callback to an
    external relay. A -k flag adds a pre-shared-key cipher meant to defeat signature matching, and -u enables UDP
    forwarding. Decode the listen and remote addresses, ports, and any encryption key to understand what is being
    exposed and to where.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned iox.exe, and is that parent chain expected?
  context: >-
    The parent process shows how the tool was launched. An interactive shell, a remote-execution service, or an
    Office or script-host parent points to hands-on-keyboard deployment, whereas a known automation or installer
    parent may indicate sanctioned use. Note what spawned the parent and what else the parent launched to place
    this execution in its broader chain.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What external endpoint is iox.exe connecting to?
  context: >-
    Tunneling tools establish outbound connections to relay or staging infrastructure. The destination reveals
    whether traffic is going to an internal pivot host or to an external address, and which internal service is
    being exposed. Correlate the destination with the listen and remote ports decoded from the command line.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: Did this host make outbound connections on common proxy or non-standard high ports around the alert time?
  context: >-
    IOX forwards traffic to operator-chosen ports rather than a fixed service port. Connections to well-known
    proxy ports such as 1080, 8080, or 4444, or to other high-numbered non-standard ports, on the alerting host
    in the alert window help confirm an active tunnel and identify the relay endpoint. Match these destinations
    against the listen and remote ports decoded from the command line.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 1080
          - 8080
          - 4444
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
- question: What child processes did iox.exe spawn afterward?
  context: >-
    Processes spawned by the tunneling tool reveal its actual impact on this host. A pure forwarder typically
    spawns nothing, so unexpected children such as cmd.exe, powershell.exe, or reconnaissance binaries point to
    post-exploitation activity riding through the established tunnel.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run iox.exe?
  context: >-
    A binary that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low
    historical counts over 90 days indicate first-time or rare execution of the tunneling tool on this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: >-
    Even tools with a legitimate niche can be abused. The query mirrors the rule's selection structure scoped to
    this host, so the resulting parent and user distribution reflects how the rule's specific firing pattern has
    historically run here, not generic binary usage. A new parent process, an unexpected user account, or an
    unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \iox.exe
      selection_commandline:
        CommandLine|contains:
        - '.exe fwd -l '
        - '.exe fwd -r '
        - '.exe proxy -l '
        - '.exe proxy -r '
      selection_hashes:
        Hashes|contains:
        - MD5=9DB2D314DD3F704A02051EF5EA210993
        - SHA1=039130337E28A6623ECF9A0A3DA7D92C5964D8DD
        - SHA256=C6CF82919B809967D9D90EA73772A8AA1C1EB3BC59252D977500F64F1A0D6731
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \iox.exe
      selection_commandline:
        CommandLine|contains:
        - '.exe fwd -l '
        - '.exe fwd -r '
        - '.exe proxy -l '
        - '.exe proxy -r '
      selection_hashes:
        Hashes|contains:
        - MD5=9DB2D314DD3F704A02051EF5EA210993
        - SHA1=039130337E28A6623ECF9A0A3DA7D92C5964D8DD
        - SHA256=C6CF82919B809967D9D90EA73772A8AA1C1EB3BC59252D977500F64F1A0D6731
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \iox.exe
      selection_commandline:
        CommandLine|contains:
        - '.exe fwd -l '
        - '.exe fwd -r '
        - '.exe proxy -l '
        - '.exe proxy -r '
      selection_hashes:
        Hashes|contains:
        - MD5=9DB2D314DD3F704A02051EF5EA210993
        - SHA1=039130337E28A6623ECF9A0A3DA7D92C5964D8DD
        - SHA256=C6CF82919B809967D9D90EA73772A8AA1C1EB3BC59252D977500F64F1A0D6731
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple
    endpoints. If the same user triggered similar activity on several hosts, the scope of the pivot may be larger
    than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \iox.exe
      selection_commandline:
        CommandLine|contains:
        - '.exe fwd -l '
        - '.exe fwd -r '
        - '.exe proxy -l '
        - '.exe proxy -r '
      selection_hashes:
        Hashes|contains:
        - MD5=9DB2D314DD3F704A02051EF5EA210993
        - SHA1=039130337E28A6623ECF9A0A3DA7D92C5964D8DD
        - SHA256=C6CF82919B809967D9D90EA73772A8AA1C1EB3BC59252D977500F64F1A0D6731
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining activity around the alert reveals what led to this event and what
    happened after - reconnaissance, privilege escalation, persistence, or data staging that the tunnel was set up
    to support. Novel parent-child pairs at low counts are what to scan for against the high-count routine noise.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the
    rule's firing pattern rather than generic usage of the binary. Many hosts firing the same pattern points to
    scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity.
    Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \iox.exe
      selection_commandline:
        CommandLine|contains:
        - '.exe fwd -l '
        - '.exe fwd -r '
        - '.exe proxy -l '
        - '.exe proxy -r '
      selection_hashes:
        Hashes|contains:
        - MD5=9DB2D314DD3F704A02051EF5EA210993
        - SHA1=039130337E28A6623ECF9A0A3DA7D92C5964D8DD
        - SHA256=C6CF82919B809967D9D90EA73772A8AA1C1EB3BC59252D977500F64F1A0D6731
      condition: 1 of selection*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - defense tampering, reconnaissance, credential access - may reveal the
    attack stages that preceded the tunnel setup and help reconstruct the timeline. Tunneling is usually a
    mid-to-late stage activity, so prior alerts often explain how the operator reached this point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
