name: Add SafeBoot Keys Via Reg Utility
id: 23adf3c3-d226-484f-840b-5dd55bb55f25
description: |
  Detects reg.exe executed with an "add" or "copy" operation against the SafeBoot control registry path
  (\SYSTEM\CurrentControlSet\Control\SafeBoot). The rule fires when the reg.exe image (or OriginalFileName reg.exe)
  AND the SafeBoot key substring AND a copy/add flag are all present. Legitimately this branch is rarely modified;
  malicious use stages a service or remote-access tool to survive a Safe Mode reboot, where many security products
  do not load, so an encryptor or other payload can run unimpeded. Determine which key was written, what service or
  value it points at, whether the host was subsequently rebooted into Safe Mode, and whether other defense-tampering
  or persistence actions accompanied it.
type: detection
detection_id: d7662ff6-9e97-4596-a61d-9839e32dee8d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the reg.exe command line match the SafeBoot add/copy pattern this rule detects?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires only when all three conditions hold
    together: the image is reg.exe (or OriginalFileName reg.exe), the command line contains the SafeBoot control path
    \SYSTEM\CurrentControlSet\Control\SafeBoot, and it carries a copy or add operation. Read the exact command line and
    note whether it writes into the SafeBoot or SafeBoot\Network branch and what key it sources from.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to modify SafeBoot registry keys?
  context: >-
    Writing into the SafeBoot control branch is uncommon outside of specialized recovery or imaging workflows. Knowing
    whether the acting user role and host function (administrative workstation, server, recovery imaging host) routinely
    touch boot configuration is often the fastest way to separate a routine operation from operator preparation. SafeBoot
    edits driven by an interactive user on a normal endpoint warrant closer review.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What specific SafeBoot key and value were written, and what service or component does it point at?
  context: >-
    The registry_set event gives the actual key path and value written as structured fields rather than parsing them
    from reg.exe's command line. A copy into \Control\SafeBoot\Network\<service> stages that service to load during a
    Safe Mode with Networking boot; an add of a Minimal or Network subkey enables a component in Safe Mode. Identify the
    exact subkey and the service or driver name it registers, since that names what the operator wants running when most
    protection is offline.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Which security or boot-mode control did this SafeBoot modification target?
  context: >-
    SafeBoot edits weaken the host's protection posture by design. Copying a service into the SafeBoot\Network branch
    lets that service start under Safe Mode with Networking, an environment where many AV/EDR products do not load,
    leaving the host effectively unprotected after a reboot. Read the command line to identify which service or value
    the operation enables and whether it is a remote-access tool, encryptor staging, or a legitimate recovery component.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned this reg.exe execution, and is that parent chain expected?
  context: >-
    The parent process reveals how reg.exe was invoked. SafeBoot edits driven by interactive administration usually
    descend from explorer.exe or a console shell a human is using. A parent such as a scripting host, an Office
    application, a remote-execution service, or an unfamiliar binary points to automated or operator-driven tampering
    rather than maintenance. Note what spawned the parent and what else that parent launched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Has the host been rebooted into Safe Mode since this modification, and is protection currently active?
  context: >-
    A SafeBoot edit only takes effect on the next Safe Mode boot. Check whether the host has since rebooted into Safe
    Mode (or has a pending Safe Mode boot configured via bcdedit) and whether AV/EDR is reporting healthy now. If the
    staged service is still present in the SafeBoot branch, the host remains primed to run that component with protection
    offline and the entry should be removed before further investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What activity occurred on this host after the SafeBoot key was modified?
  context: >-
    Operators stage Safe Mode persistence to enable an action that protection would otherwise block, such as deploying
    an encryptor or a remote-access tool. Examining process activity in the window after the modification reveals what
    the SafeBoot change was meant to enable, including a forced reboot, service installation, or payload execution.
    Correlate this with file and network activity over the same window.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense-tampering or service-control actions performed on this host in the same window?
  context: >-
    Operators who stage Safe Mode persistence commonly also disable AV/EDR services, clear logs, delete shadow copies,
    or change firewall rules in the same operation to maximize coverage. Finding additional tampering events from the
    same user or parent process indicates multiple controls were targeted together rather than an isolated registry edit.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Were other registry modifications made on this host in the same session?
  context: >-
    Operators who modify one registry key often modify several, such as staging a SafeBoot service AND enabling a Run
    key AND disabling a Defender policy. Finding clusters of reg.exe or regedit write operations from the same user
    within a short window reveals the full scope of the configuration changes and whether multiple objectives were
    pursued alongside the SafeBoot edit.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_safeboot:
        CommandLine|contains: \SYSTEM\CurrentControlSet\Control\SafeBoot
      selection_flag:
        CommandLine|contains:
        - ' copy '
        - ' add '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_safeboot:
        CommandLine|contains: \SYSTEM\CurrentControlSet\Control\SafeBoot
      selection_flag:
        CommandLine|contains:
        - ' copy '
        - ' add '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or actions on multiple endpoints. If the same
    user triggered similar boot-configuration or tampering activity on other hosts, the scope of the operation may be
    larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_safeboot:
        CommandLine|contains: \SYSTEM\CurrentControlSet\Control\SafeBoot
      selection_flag:
        CommandLine|contains:
        - ' copy '
        - ' add '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host, such as credential access, reconnaissance,
    or other defense tampering, may reveal the attack stages that preceded the SafeBoot edit and help reconstruct the
    full timeline leading up to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was this reg.exe executed from its expected System32 or SysWOW64 path?
  context: >-
    reg.exe running from outside System32 or SysWOW64 may indicate the binary was copied or renamed to evade path-based
    allowlists, or that a renamed binary reported reg.exe as its OriginalFileName while living in a user-writable
    directory. A reg.exe in a temp or profile directory is more suspicious than one in System32.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired the SafeBoot add/copy pattern over the past 90 days, and what command-line structures are typical?
  context: >-
    A SafeBoot reg.exe pattern with no prior history on a host is more suspicious than one that recurs under stable
    parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects the rule's
    specific firing pattern rather than generic reg.exe usage. The command-line projection lets the analyst compare
    typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_safeboot:
        CommandLine|contains: \SYSTEM\CurrentControlSet\Control\SafeBoot
      selection_flag:
        CommandLine|contains:
        - ' copy '
        - ' add '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection*) and _pb_scope
    fields:
    - CommandLine
- question: Have other hosts fired the SafeBoot add/copy pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the
    SafeBoot add/copy firing pattern rather than generic reg.exe usage. Many hosts firing the same pattern points to
    scripted deployment or imaging automation; one host or a small unrelated set points to manual operator activity. Use
    the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_safeboot:
        CommandLine|contains: \SYSTEM\CurrentControlSet\Control\SafeBoot
      selection_flag:
        CommandLine|contains:
        - ' copy '
        - ' add '
      condition: all of selection*
    fields:
    - host.name
