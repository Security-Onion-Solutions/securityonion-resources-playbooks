name: Potential Vcruntime140 DLL Sideloading
id: b6b6dda6-c77c-42d6-8ee7-ad643c7e05ee
description: |
  Detects a module named vcruntime140.dll being loaded from a location or with a signature inconsistent with the legitimate Microsoft Visual C++ runtime. The rule fires when a file named vcruntime140.dll loads from outside the standard System32, SysWOW64, and Program Files directories, or without a valid Microsoft "C Runtime Library" signature, which is the signature of DLL search-order hijacking: a malicious DLL is staged alongside a legitimately-signed executable so the trusted process loads attacker code.
  A copy of the runtime that is unsigned, signed by another party, or loaded from a user-writable directory should be treated as a possible sideloaded payload. Investigation should confirm the loaded DLL's path and signing status, identify the loading process and how it was launched, and determine whether the DLL and its host executable were staged together in a non-standard directory.
type: detection
detection_id: d7a63acb-1284-49bc-bfea-7771146c8b1c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the loaded vcruntime140.dll match the rule's detection criteria for path and signature?
  context: >-
    Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded), its code-signature status, and the
    process that loaded it. The legitimate vcruntime140.dll ships with a valid Microsoft "C Runtime Library" signature and loads
    from System32, SysWOW64, or a Program Files directory; a copy loaded from elsewhere, unsigned, or signed by another party is
    what this rule targets. DLL loads carry a hash and signing status on the load event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this host and the loading application expected to run this operation from its current location?
  context: >-
    Legitimate administrative activity and normal application installs can load a C++ runtime. Knowing whether this host and the
    loading application are expected to run from their current path helps separate a routine third-party install from a sideloaded
    payload staged in a user-writable directory.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Are the DLL and any files written by the loading process still on disk for analysis?
  context: >-
    If the loading process wrote files around the time of the alert (the DLL itself, a staged copy of the loader, decoded output),
    checking whether they remain on disk enables hash lookups, sandbox submission, or content review. The query correlates file
    writes to the loading process and its direct children by process lineage.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was there a documented software deployment or maintenance window that would explain this application loading vcruntime140.dll from this location?
  context: >-
    A documented software deployment, patch, or maintenance window can explain an application loading its own bundled runtime from
    a non-standard directory. A corresponding record suggests authorized activity; its absence when policy requires one suggests
    the load was unplanned and warrants closer review of the loading binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the loaded vcruntime140.dll signed, and by whom, and what is its hash reputation?
  context: >-
    Module reputation separates the genuine Microsoft runtime from a sideloaded copy. The legitimate vcruntime140.dll carries a
    valid Microsoft signature and the description "C Runtime Library"; an unsigned copy, or one signed by another party, that
    carries the same filename is a masquerading indicator. Look up the hash against threat intelligence, and treat a file that
    imports the .NET runtime loader (mscoree.dll) as inconsistent with the native C++ runtime, which never does so.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
        ImageLoaded|endswith: '\vcruntime140.dll'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What other modules did the loading process pull in, and are any from user-writable or non-canonical directories?
  context: >-
    The full set of modules a process loads often reveals its purpose when the loaded DLL alone is ambiguous. Look for other DLLs
    loaded from the same writable directory as vcruntime140.dll, unsigned modules where signed ones are expected, and system DLL
    names loaded from non-system paths; each is a search-order-hijack tell that points to more than a single planted file.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: What process spawned the executable that loaded this DLL, and is that parent chain expected?
  context: >-
    The parent reveals how the loading executable was invoked. A legitimately-signed application launched from explorer.exe or
    services.exe is routine; the same binary launched from mshta.exe, wscript.exe, or from a temp or Tasks directory suggests it
    was staged and run by a script-based delivery step.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: How was the loading executable launched, and from what working directory?
  context: >-
    The command line and working directory of the loading process show whether it ran from its normal install path or from a
    user-writable staging directory such as a Tasks or temp folder. Sideloading typically runs a legitimate binary out of a
    directory the attacker controls so the malicious DLL beside it loads first.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Where was vcruntime140.dll written on this host, and was a copy of the loading executable staged in the same directory?
  context: >-
    Search-order hijacking relies on placing the malicious DLL in the same writable directory as a trusted, signed executable.
    Finding the write event for vcruntime140.dll identifies the process that dropped it and the directory it landed in; a signed
    loader executable sitting in that same non-standard directory is the staging pattern. If available, check the file's
    mark-of-the-web on the host to see whether it arrived from the internet.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: '\vcruntime140.dll'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
- question: Has vcruntime140.dll been loaded on this host before, and by which processes?
  context: >-
    A first-time load of this DLL on the host is a stronger anomaly than a recurring one. If the same DLL has loaded under the
    same application repeatedly over the past 90 days it is likely routine; a first occurrence, or one under a process that never
    loaded it before, is anomalous.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Does this host normally run the executable that loaded this DLL?
  context: >-
    An application that has never run on a host is more suspicious than one that runs regularly. Zero or very low historical
    counts indicate first-time or rare execution of the loading binary, which fits a binary staged specifically to sideload a
    payload.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Were DLL-search or image-hijack registry keys modified on this host around the time of the alert?
  context: >-
    Beyond dropping a DLL beside a trusted binary, execution flow can be redirected through registry keys such as AppInit_DLLs,
    KnownDLLs, Image File Execution Options, App Paths, or a COR_PROFILER environment entry. Modifications to these keys near the
    alert indicate a registry-based hijack running alongside or instead of the file-based one.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\AppInit_DLLs'
          - '\KnownDLLs'
          - '\Image File Execution Options\'
          - '\App Paths\'
          - '\Environment\COR_PROFILER'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Activity in the minutes around the load — the decode-and-extract steps that stage a
    sideload, follow-on process launches, or persistence setup — reveals whether this is one step in a longer sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — script-based delivery, decoding utilities, or file-staging activity — may reveal the
    stages that preceded the sideload and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Is vcruntime140.dll being loaded by other hosts, especially under unexpected processes?
  context: >-
    Cross-host correlation surfaces how far the staging has spread. The same DLL loaded on a single host may be a localized event;
    the same DLL loading across several hosts, or under processes that do not normally load it, points to distribution beyond one
    machine.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    Attackers rarely rely on a single persistence mechanism. After establishing one foothold, they commonly install backup
    mechanisms using different techniques — scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions.
    Multiple persistence installations in the same timeframe indicate intentional stacking rather than isolated administrative
    action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations such as the Startup folder or scheduled-task definition paths on this host?
  context: >-
    File-based persistence bypasses command-line detection entirely. Dropping an executable or script into the Startup folder or
    a path referenced by a registry Run key achieves persistence without running schtasks, sc, or reg. File event monitoring
    captures these drops even when the attacker avoids standard persistence tools.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
