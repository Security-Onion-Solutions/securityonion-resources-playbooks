name: Forest Blizzard APT - Custom Protocol Handler DLL Registry Set
id: 8992b9d9-969e-479e-9b42-e30b34bde7fe
description: |
  Fires when a registry value under the CLSID {026CC6D7-34B2-33D5-B551-CA31EB6CE345}\Server subkey is set to a path ending in .dll. That subkey registers a DLL as the in-process COM server for a specific CLSID, and the Forest Blizzard GooseEgg tooling wires that CLSID to a custom protocol handler so the DLL loads whenever the handler's protocol or URL is invoked. Because the handler can be reached from a privileged host process, the registered DLL runs as a launcher for follow-on execution, giving both persistence and privilege escalation. Investigation should confirm the exact key and value, identify and locate the referenced DLL, determine whether it was written to disk and subsequently loaded, look for the companion protocol-handler registration, and reconstruct the process that made the change.
type: detection
detection_id: d807056b-0e00-4cec-b7f8-b8b7518e382b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the registry key and value data match what this rule detects?
  context: >-
    Before investing investigation time, confirm the alert is a true positive by reviewing the exact key path (TargetObject), which
    should be the Server subkey under CLSID {026CC6D7-34B2-33D5-B551-CA31EB6CE345}, and the value data (Details), which should be a path
    ending in .dll. Confirm the writing process as well.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to register a COM server CLSID for a protocol handler?
  context: >-
    Registering an in-process COM server under a CLSID Server subkey is a rare operation on most endpoints and is normally performed by
    software installers, not interactive users. Knowing whether the account and host function are consistent with COM registration is
    often the fastest way to separate a legitimate install from unauthorized activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What process wrote this registry value, and what started that process?
  context: >-
    The process that set the CLSID Server value, and what spawned it, is the core attribution signal. Tracing the parent reveals whether
    the write came from a normal installer chain or from a dropped binary launched by a batch script or another implanted tool, which is
    how the GooseEgg loader stages this registration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because this event type does not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What CLSID and value were set, and is this a known persistence or COM-hijack location?
  context: >-
    The key path determines intent. A value written under a CLSID Server or InprocServer32 subkey registers a DLL as that object's
    in-process server, so any code that instantiates the CLSID loads the DLL. When the CLSID is also bound to a protocol handler, the DLL
    loads whenever the protocol or URL is invoked, which is the mechanism this detection targets. Confirm the CLSID matches
    {026CC6D7-34B2-33D5-B551-CA31EB6CE345} and note the writing process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What DLL path was written to this key, and where does that DLL live on disk?
  context: >-
    The Details value is the DLL that will load when the registered CLSID is instantiated. Read the full path and judge the location. A
    DLL under a user-writable or staging directory such as ProgramData, Temp, or a user profile is far more suspicious than one under a
    vendor install path, and the file name itself may be a decoy resembling a system component.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Does this CLSID registration persist, or was the value later rewritten?
  context: >-
    Endpoint telemetry does not record registry value deletion, so persistence is judged from the value's re-modification history and from
    whether the referenced DLL actually ran, not from a deletion event. Repeated writes to the same key, or a later change of the DLL
    path, indicate ongoing tampering rather than a one-time install.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What other registry modifications were made on this host in the same window?
  context: >-
    Wiring a protocol handler takes more than one key. The CLSID Server registration is normally paired with a protocol-handler entry
    under a Classes PROTOCOLS Handler path that points back to the same CLSID. Finding those companion writes from the same process
    confirms the handler was fully assembled and reveals any additional configuration changes made alongside it.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Is the referenced DLL present on disk, and was it written in the same session?
  context: >-
    The registration is only effective if the DLL named in the value exists at that path. The registry write carries no hash, so correlate
    file activity by the writing process and its children to find the DLL drop, which usually lands in the same session. If the payload is
    present, retrieve it or hash it from a later load for a reputation lookup rather than from the write event.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was the registered DLL actually loaded by a process on this host?
  context: >-
    A custom protocol handler DLL loads into whatever process invokes the protocol, which for this technique can be a privileged host
    process. A load event for the exact DLL path from the registry value confirms the handler was invoked and the payload ran. If no load
    is seen and image-load telemetry is collected, the handler has not yet been triggered.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%Details%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
- question: Has this CLSID key been modified before on this host?
  context: >-
    A first-time write to a CLSID Server subkey is more suspicious than a routine change. Legitimate COM registration for a given CLSID
    typically happens once at install time, so a value that has never been set before, or one whose DLL path differs from prior writes,
    stands out.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same CLSID key modified on other hosts in the environment?
  context: >-
    The same CLSID registration appearing on multiple hosts may indicate the tool was deployed at scale or moved laterally. If only this
    host carries the change it may be an isolated foothold. Compare the DLL paths written across hosts to see whether the same payload was
    staged everywhere.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    A registration like this rarely stands alone. Process activity in the surrounding window can show the loader that wrote the key, batch
    scripts that ran, or new processes launched at elevated privilege after the handler was invoked. Aggregating by process and parent
    collapses routine agent noise so that novel pairs stand out.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    Operators rarely rely on a single persistence method. Alongside a COM-hijack registration, the same session often creates a scheduled
    task or service so the payload re-runs after reboot, which is how this tooling maintains its SYSTEM foothold. Multiple persistence
    installations in the same timeframe indicate deliberate stacking rather than isolated administration.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup folders or scheduled-task definition paths on this host?
  context: >-
    File-based persistence bypasses command-line detection entirely by dropping an executable or script into a Startup folder or a path
    referenced by a Run key. File-event monitoring captures these drops even when the operator avoids the standard persistence tools, and
    finding one alongside the COM registration reveals a parallel foothold.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    A persistence registration is usually a late stage. Earlier detections on the same host, such as privilege escalation, credential
    access, or reconnaissance, may reveal the stages that preceded this write and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
