name: Arbitrary DLL or Csproj Code Execution Via Dotnet.EXE
id: ab33b9af-db8c-463f-b4c1-ff0ae10e7aec
description: |
  Detects dotnet.exe (or a binary whose OriginalFileName is ".NET Host") invoked with a command line ending in a ".csproj" or ".dll" path, excluding the known-benign CSScriptNpp Notepad++ integration. dotnet.exe is a Microsoft-signed management CLI that will load and run arbitrary class-library DLLs and compile inline C# from a RoslynCodeTaskFactory .csproj, providing an application-allowlisting bypass that does not integrate with in-process malicious-code inspection. Legitimate use is a developer or build agent running or compiling a project; malicious use stages unsigned code under a trusted binary. Determine whether the invoked DLL or project is expected on this host, who launched it, and what it did after loading.
type: detection
detection_id: d80d5c81-04ba-45b4-84e4-92eba40e0ad3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line show dotnet.exe loading a .dll or compiling/running a .csproj?
  context: Confirm the alert is a true positive before investing time. The rule fires when the process is dotnet.exe (or carries the ".NET Host" OriginalFileName) AND the command line ends in a .csproj or .dll path. Read the full command line and note whether it points at a DLL (direct class-library load) or a .csproj (inline-task compile or project run), and where that file lives.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to build, run, or execute .NET projects and assemblies?
  context: Legitimate dotnet.exe project execution is normal on developer workstations and build agents. On a server or end-user endpoint with no development role, a .NET host loading a DLL or compiling a .csproj is harder to explain and shifts the disposition toward investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What DLL or .csproj did dotnet.exe load, and what does the full command line reveal about how it was invoked?
  context: The full command line reveals the specific operation. Identify the target file path and the invocation verb -- exec or a bare path runs a class-library DLL directly, run builds and then runs a project, and msbuild on a .csproj compiles inline C# via RoslynCodeTaskFactory. Note where the DLL or project file resides; a path under a user-writable or temporary directory is a stronger signal than an installed application directory.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned dotnet.exe, and is that parent chain expected?
  context: The parent process reveals how the .NET host was invoked. A build IDE, terminal, or CI agent is a routine parent; mshta.exe, wscript.exe, an Office application, or a freshly written downloader spawning dotnet.exe points to scripted or exploitation-driven execution rather than developer activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did dotnet.exe load the MSBuild assemblies that indicate an inline-compile or project-build operation?
  context: Module loads of MSBuild.dll, Microsoft.Build.dll, or Microsoft.Build.Framework.dll inside dotnet.exe indicate an MSBuild operation regardless of the command-line arguments, which is the pathway used to compile and run inline C# from a .csproj. These loads inside a .NET host outside a normal build context corroborate an allowlisting-bypass attempt. If image-load events are not collected in this environment, treat zero results as a visibility gap rather than evidence nothing loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        ImageLoaded|endswith:
          - \MSBuild.dll
          - \Microsoft.Build.dll
          - \Microsoft.Build.Framework.dll
      condition: selection
    fields:
      - ImageLoaded
      - CommandLine
- question: What child processes did dotnet.exe spawn afterward?
  context: The processes a .NET host spawns reveal the loaded code's actual impact. A project build legitimately re-invokes dotnet.exe for build and compile stages, but dotnet.exe spawning cmd.exe, powershell.exe, certutil.exe, conhost.exe in a non-build context, or an unknown executable is a post-exploitation signal worth following.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did dotnet.exe make outbound network connections around the time of the alert?
  context: System binary proxy execution often pairs with retrieving or staging a payload over the network. Outbound connections from dotnet.exe to external addresses -- particularly directly after the DLL or .csproj load -- suggest the loaded code is fetching or exfiltrating rather than running a self-contained local project. Connections to internal package or build infrastructure are the routine explanation.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Does this host normally run dotnet.exe with a .dll or .csproj target?
  context: A .NET host that has never run on an endpoint, or runs only rarely, is more suspicious than one that runs constantly on a developer or build machine. Zero or very low historical counts indicate first-time or rare execution and raise the priority of the other findings.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this dotnet.exe pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even a routine build host fires this rule. The query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution reflects how this specific .csproj/.dll execution pattern has historically run here. A new parent process, an unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \dotnet.exe
      - OriginalFileName: .NET Host
      selection_cli:
        CommandLine|endswith:
        - .csproj
        - .csproj"
        - .dll
        - .dll"
        - .csproj'
        - .dll'
      filter_optional_notepadplus_plus:
        ParentImage:
        - C:\Program Files (x86)\Notepad++\notepad++.exe
        - C:\Program Files\Notepad++\notepad++.exe
        CommandLine|contains|all:
        - C:\ProgramData\CSScriptNpp\
        - '-cscs_path:'
        - \cs-script\cscs.dll
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \dotnet.exe
      - OriginalFileName: .NET Host
      selection_cli:
        CommandLine|endswith:
        - .csproj
        - .csproj"
        - .dll
        - .dll"
        - .csproj'
        - .dll'
      filter_optional_notepadplus_plus:
        ParentImage:
        - C:\Program Files (x86)\Notepad++\notepad++.exe
        - C:\Program Files\Notepad++\notepad++.exe
        CommandLine|contains|all:
        - C:\ProgramData\CSScriptNpp\
        - '-cscs_path:'
        - \cs-script\cscs.dll
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \dotnet.exe
      - OriginalFileName: .NET Host
      selection_cli:
        CommandLine|endswith:
        - .csproj
        - .csproj"
        - .dll
        - .dll"
        - .csproj'
        - .dll'
      filter_optional_notepadplus_plus:
        ParentImage:
        - C:\Program Files (x86)\Notepad++\notepad++.exe
        - C:\Program Files\Notepad++\notepad++.exe
        CommandLine|contains|all:
        - C:\ProgramData\CSScriptNpp\
        - '-cscs_path:'
        - \cs-script\cscs.dll
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar .NET host execution on several hosts, the scope of the activity may be broader than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \dotnet.exe
      - OriginalFileName: .NET Host
      selection_cli:
        CommandLine|endswith:
        - .csproj
        - .csproj"
        - .dll
        - .dll"
        - .csproj'
        - .dll'
      filter_optional_notepadplus_plus:
        ParentImage:
        - C:\Program Files (x86)\Notepad++\notepad++.exe
        - C:\Program Files\Notepad++\notepad++.exe
        CommandLine|contains|all:
        - C:\ProgramData\CSScriptNpp\
        - '-cscs_path:'
        - \cs-script\cscs.dll
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining process activity around the alert reveals what led to this event and what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, persistence, or data staging surrounding the .NET host execution.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts fired this dotnet.exe pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this .csproj/.dll execution pattern rather than generic dotnet.exe usage. Many hosts firing the same pattern points to scripted deployment or build automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \dotnet.exe
      - OriginalFileName: .NET Host
      selection_cli:
        CommandLine|endswith:
        - .csproj
        - .csproj"
        - .dll
        - .dll"
        - .csproj'
        - .dll'
      filter_optional_notepadplus_plus:
        ParentImage:
        - C:\Program Files (x86)\Notepad++\notepad++.exe
        - C:\Program Files\Notepad++\notepad++.exe
        CommandLine|contains|all:
        - C:\ProgramData\CSScriptNpp\
        - '-cscs_path:'
        - \cs-script\cscs.dll
      condition: all of selection_* and not 1 of filter_optional_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- defense tampering, reconnaissance, credential access -- may reveal the attack stages that preceded this event and help reconstruct the timeline. An allowlisting bypass via a trusted binary is often a mid-chain step rather than the start.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
