name: Remote Access Tool - LogMeIn Execution
id: 7755c934-a52d-4752-9cef-537a8b0ab2c5
description: |
  Detects execution of LogMeIn remote access components by matching the LMIGuardianSvc description or product
  string, or the "LogMeIn, Inc." company signature, on a process_creation event. Remote access tools are widely
  used for legitimate IT support but are also adopted by operators to establish an interactive command-and-control
  channel that blends with sanctioned administration. Determine whether this execution corresponds to authorized
  support activity (an open ticket, an approved tool, an expected user and host) or to an unsanctioned or
  attacker-deployed install, and follow the install-to-egress sequence the tool produced on this host.
type: detection
detection_id: d85873ef-a0f8-4c48-a53a-6b621f11729d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- question: Does this process match the LogMeIn signature this rule detects (LMIGuardianSvc description/product or "LogMeIn, Inc." company)?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the process metadata
    against the rule's criteria. The rule fires when any one of the signature fields matches, so confirm which field
    carried the LogMeIn identity and that the binary's signing and version metadata are consistent with a genuine vendor build.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Company
      - Description
      - Product
- question: Is this user and host expected to run LogMeIn remote access software?
  context: Legitimate remote support can trigger this detection on the endpoints that IT or a sanctioned vendor manages.
    Knowing whether the user role and host function are consistent with remote-access tooling is often the fastest path
    to separating routine support from an unexpected or unsanctioned install.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is LogMeIn on the organization's approved remote access software list?
  context: Organizations typically sanction a limited set of remote access tools for IT support. A remote access tool
    not on that list -- even a well-known commercial product like LogMeIn -- may represent shadow IT or attacker-deployed
    persistence and should be checked regardless of the tool's reputation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a current helpdesk ticket or support session explaining this LogMeIn activity?
  context: Legitimate remote access usually correlates with an active support ticket, a scheduled maintenance window,
    or a user request. If no support context exists for this session, the tool may have been installed for persistent
    operator access or by a user circumventing controls.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What external endpoint is this LogMeIn process connecting to?
  context: Remote access tools establish outbound sessions to vendor relay infrastructure or, when abused, to
    operator-controlled endpoints. Connections to LogMeIn's own cloud are expected; connections to unfamiliar IPs or
    on configurable high ports (RMM tooling often uses non-standard ports such as 7070 or 5650) warrant scrutiny. Compare
    the destination and port against known vendor infrastructure.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: What exactly did the LogMeIn process do? Decode its full command line and working directory.
  context: The full command line reveals the specific action taken -- a guardian service heartbeat, an installer, an
    update routine, or an interactive control invocation. Decode any flags, configuration paths, or relay parameters to
    understand what behavior this execution represents and whether it matches an expected vendor agent.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this LogMeIn binary and is that parent chain expected?
  context: The parent process reveals how the tool was invoked. A vendor service or installer spawned under
    services.exe or an MSI host is consistent with managed deployment; invocation from a script host, an Office
    application, or a user-writable directory points to an unsanctioned or attacker-driven install.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Does this host normally run LogMeIn?
  context: A remote access tool that has never been seen on a host is more suspicious than one that runs regularly.
    Zero or very low historical counts indicate a first-time or rare install, which on an endpoint with no support
    history is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this LogMeIn signature, what parents and users normally drive it, and does the current alert fit that pattern?
  context: Even sanctioned tools can be abused. The query mirrors the rule's signature match scoped to this host, so the
    resulting parent and user distribution reflects how this specific firing pattern has historically run here. A new
    parent process, an unexpected user account, or a first-time appearance is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: LMIGuardianSvc
      - Product: LMIGuardianSvc
      - Company: LogMeIn, Inc.
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did the LogMeIn binary spawn afterward?
  context: The processes a remote access tool spawns reveal its actual impact. An interactive operator session typically
    produces shell or file-manager children (cmd.exe, powershell.exe, explorer.exe); unexpected children such as
    reconnaissance or credential-access utilities point to hands-on-keyboard activity beyond routine support.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other tools ran on this host around the same time?
  context: Operator sessions over a remote access tool rarely involve a single process. Activity surrounding the
    detected execution may reveal reconnaissance, persistence installation, or data staging that provides broader
    context, particularly when the install lacks a support ticket.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Have other hosts fired this LogMeIn signature in the past week, and does the cross-host distribution look like managed deployment or isolated activity?
  context: The query mirrors the rule's signature match with no host scope, giving a fleet-wide count of this firing
    pattern. Many hosts firing the same pattern points to a managed rollout or vendor automation; one host or a small
    unrelated set points to a targeted or ad-hoc install. Use the host distribution and parent consistency to calibrate
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: LMIGuardianSvc
      - Product: LMIGuardianSvc
      - Company: LogMeIn, Inc.
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: LMIGuardianSvc
      - Product: LMIGuardianSvc
      - Company: LogMeIn, Inc.
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: LMIGuardianSvc
      - Product: LMIGuardianSvc
      - Company: LogMeIn, Inc.
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple
    endpoints. If the same user drove similar remote-access activity on several hosts, the scope of the session -- or
    the compromise -- may be larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: LMIGuardianSvc
      - Product: LMIGuardianSvc
      - Company: LogMeIn, Inc.
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- defense tampering, reconnaissance, credential access -- may reveal
    the stages that preceded a remote access tool reaching this endpoint and help reconstruct the timeline that led to
    the session.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Where on disk does the LogMeIn binary live, and was it written recently from a user-writable or temporary path?
  context: Remote desktop software installation is the first stage of the remote-access behavior chain. A binary written
    into Program Files by a managed installer is consistent with sanctioned deployment; one dropped into a user-writable
    or temporary path (a user profile, AppData, or a temp directory) shortly before execution is consistent with an
    operator-staged install. Correlate the file-write time and writing process against the support context for this host.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
      - EventType
