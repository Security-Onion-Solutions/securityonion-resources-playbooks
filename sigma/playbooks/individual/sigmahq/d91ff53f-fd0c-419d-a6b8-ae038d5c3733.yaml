name: Potential SNAKE Malware Installation Binary Indicator
id: 6c30bf4a-a89c-4c55-b265-db084cdc2cf9
description: |
  Detects execution of a process whose image name is jpsetup.exe or jpinst.exe — binary names
  associated with the installer stage of the SNAKE implant — where the command line carries
  content beyond the bare binary name and is neither empty nor unset. The rule keys on a
  hardcoded filename indicator rather than on behavior, so the alert says only that a binary
  with a matching name ran; the investigation has to establish whether the file is what the
  name suggests, what wrote it to disk, and whether the surrounding activity looks like an
  installation chain (a dropped kernel driver, a covert local store, service or persistence
  registration) or an unrelated program that happens to share the name.
type: detection
detection_id: d91ff53f-fd0c-419d-a6b8-ae038d5c3733
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: >-
    Does the alerting event match what this rule detects — a process whose image name ends in
    jpsetup.exe or jpinst.exe, run with a command line that carries more than the bare binary name?
  context: >-
    The rule fires on both conditions together: the image name must match one of the two
    installer names, and the command line must not be empty, unset, or nothing more than the
    binary name itself. Confirm the full image path and the command line before spending
    further time, and note where on disk the binary lives.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run a setup or installer binary with these names?
  context: >-
    These names belong to no common Windows component or mainstream software package, so there
    is rarely a routine explanation. Check whether the host is currently in a software
    deployment or packaging window and whether the account is one that installs software at
    all, before treating the execution as unexplained.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What exactly did this binary do? Decode the full command line and the working directory.
  context: >-
    The rule excludes invocations that are nothing but the binary name, so whatever arguments
    are present are the operational content of this execution. Read them for install or
    uninstall switches, target paths, service names, and passphrases or key material handed in
    on the command line. The working directory shows where the operator or dropper was staged.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned this binary, and is that parent chain consistent with a software install?
  context: >-
    A deployment tool, a package manager, or services.exe implies a managed installation. An
    interactive shell, a remote-access agent, a script host, or an Office application implies a
    hands-on-keyboard or delivery chain. Walk further up the tree from the parent if the
    immediate parent is itself a shell.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: When was this binary written to disk on this host, and which process wrote it?
  context: >-
    The detection sees only execution. The write event names the dropper and the delivery path,
    and the gap between write and execution separates a staged install from a file that has sat
    on the host. File write events carry no hash; take the hash from the execution event of the
    same path instead.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith:
        - \jpsetup.exe
        - \jpinst.exe
      condition: selection
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
  answer_sources:
  - file_event
  - process_creation
- question: What files did this process write to disk while it ran?
  context: >-
    An installer stage is defined by what it leaves behind. SNAKE installation drops a kernel
    driver and a queue or store file alongside it, typically under a system directory or a
    dedicated path created for the implant. Collect every path this process wrote, then check
    each one for later execution or loading.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetFilename
  answer_sources:
  - file_event
- question: What child processes did this binary spawn afterward?
  context: >-
    Children reveal what the execution actually accomplished. An install stage commonly hands
    off to service-control, driver-loading, or scripting utilities; a command interpreter or a
    network utility as a child points at hands-on activity rather than a packaged install.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Did any driver load on this host around the time of this execution, and is it signed?
  context: >-
    SNAKE installation registers a kernel driver, so a driver load close in time to the
    installer execution is the artifact that distinguishes an implant install from an
    unremarkable program. Look for a driver whose path is not a vendor directory and whose
    signature is absent, self-signed, or does not match the claimed publisher. If driver events
    are not collected from this host, treat an empty result as a visibility gap, not as
    evidence no driver loaded.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - ImageLoaded
      - Signature
      - SignatureStatus
  answer_sources:
  - manual_review
  - edr_console
- question: Has this host ever run a binary with this name before?
  context: >-
    These names are not part of any Windows component, so a 90-day history that is empty is the
    expected result and tells the analyst this is first-time execution. A non-zero count means
    either the activity has been running unnoticed or a locally packaged tool legitimately uses
    the name — resolve which before dismissing it.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: >-
    When this host has previously fired the rule's pattern, what parents and users drove that
    activity, and does the current alert fit that history?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the parent and user
    distribution reflects the rule's specific firing pattern rather than generic binary usage.
    A single new parent or an account that has never driven this activity here is the deviation
    worth chasing; a stable, repeating parent points to a locally packaged tool.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \jpsetup.exe
        - \jpinst.exe
      filter_main_cli_name:
        CommandLine:
        - jpinst.exe
        - jpinst
        - jpsetup.exe
        - jpsetup
      filter_main_cli_empty:
        CommandLine: ''
      filter_main_cli_null:
        CommandLine: null
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, aggregated by host, so
    the result is the account's 90-day history of this specific activity rather than generic use
    of a binary. An account that has never produced it before, or that produced it across many
    hosts, is worth more attention than one with a steady local history.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \jpsetup.exe
        - \jpinst.exe
      filter_main_cli_name:
        CommandLine:
        - jpinst.exe
        - jpinst
        - jpsetup.exe
        - jpsetup
      filter_main_cli_empty:
        CommandLine: ''
      filter_main_cli_null:
        CommandLine: null
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: >-
    Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: >-
    When the alert fires under SYSTEM or a machine account, the user field attributes nothing and
    the launch mechanism is the meaningful pivot. The query mirrors the rule's selection
    structure scoped to the alerting parent, so the result is that parent's 90-day history of
    driving this activity. A parent that has never driven it before is the deviation; a parent
    already responsible for large volumes is deployment automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \jpsetup.exe
        - \jpinst.exe
      filter_main_cli_name:
        CommandLine:
        - jpinst.exe
        - jpinst
        - jpsetup.exe
        - jpsetup
      filter_main_cli_empty:
        CommandLine: ''
      filter_main_cli_null:
        CommandLine: null
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
- question: What else did this user do across the environment around this time?
  context: >-
    Tracking the account's activity on every host in the alert window shows whether the same
    identity was working elsewhere at the same time, which separates a single-host install from
    activity spread across endpoints. If the alert fired under a service principal, this view
    returns routine background telemetry and the launch-mechanism pivot is the meaningful one.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  always_include: true
  answer_sources:
  - process_creation
- question: >-
    Did this same parent-driven activity fire on other hosts in the same window, or is it
    isolated to this host?
  context: >-
    The query mirrors the rule's selection structure scoped to the alerting parent process,
    fleet-wide, within the alert window. Several hosts in the same window points to scheduled or
    pushed deployment; a single host points to a host-local trigger and narrows the
    investigation to this endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \jpsetup.exe
        - \jpinst.exe
      filter_main_cli_name:
        CommandLine:
        - jpinst.exe
        - jpinst
        - jpsetup.exe
        - jpsetup
      filter_main_cli_empty:
        CommandLine: ''
      filter_main_cli_null:
        CommandLine: null
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating process activity by binary and parent collapses repetitive background telemetry
    into single high-count rows and leaves novel parent-child pairs visible at low counts. Scan
    for staging, archive or transfer utilities, service configuration, and account activity in
    the same window.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    An installer stage lands after access is already established, so earlier detections on the
    same host often carry the delivery step — remote execution, a scripting host, credential
    access, or defense tampering. Reading the alert timeline backwards reconstructs how the
    binary arrived.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: >-
    Have other hosts fired the rule's pattern in the past week, and does the cross-host
    distribution look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, giving a fleet-wide
    count of this specific activity rather than the binary's generic footprint. Many hosts
    firing the same way points to scripted deployment of a locally packaged tool; one host or a
    small unrelated set points to operator activity and sets the containment boundary.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \jpsetup.exe
        - \jpinst.exe
      filter_main_cli_name:
        CommandLine:
        - jpinst.exe
        - jpinst
        - jpsetup.exe
        - jpsetup
      filter_main_cli_empty:
        CommandLine: ''
      filter_main_cli_null:
        CommandLine: null
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
  answer_sources:
  - process_creation
