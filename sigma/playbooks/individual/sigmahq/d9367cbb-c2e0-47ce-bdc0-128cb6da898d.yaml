name: HackTool - SharpLdapWhoami Execution
id: 3d1fc090-e42c-4434-b361-0d994671304c
description: |
  Detects SharpLdapWhoami, a whoami alternative that resolves the current security context by querying
  the LDAP service on a domain controller rather than calling the local API. The rule fires when EITHER
  the image name ends in SharpLdapWhoami.exe, OR the PE metadata (OriginalFileName or Product) identifies
  the tool, OR the command line ends in an LDAP authentication-method flag (/method: or /m: with ntlm,
  kerb, or nego) — at least one branch is sufficient. The behavior maps to System Owner/User Discovery:
  an operator confirming who they are and how they can authenticate, typically early in hands-on-keyboard
  activity. Investigation should confirm the alert is a true positive, decode which authentication method
  was requested, identify the launching process and account, and determine whether this is isolated or
  part of a wider enumeration burst.
type: detection
detection_id: d9367cbb-c2e0-47ce-bdc0-128cb6da898d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- question: Does this event match what the rule detects — the SharpLdapWhoami name, PE metadata, or an LDAP auth-method flag?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires on ANY ONE of three
    independent branches: the image name ending in SharpLdapWhoami.exe, the PE OriginalFileName or
    Product naming SharpLdapWhoami, or the command line ending in a /method: or /m: flag (ntlm, kerb,
    or nego). Note which branch fired. A PE-metadata or name match identifies the tool itself; a
    flag-only match may be a renamed copy or an unrelated program that happens to use the same
    switches, so the binary's identity and signing become load-bearing in that case.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
      - Product
- question: Is this SharpLdapWhoami execution part of an authorized penetration test or red team engagement?
  context: >-
    SharpLdapWhoami is an offensive enumeration utility used in authorized security assessments. Before
    deeper analysis, check whether a pentest or red team exercise is active on this host or network
    segment. An authorized engagement with matching tooling and timing resolves the alert without
    further investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run LDAP-based user-context enumeration tooling?
  context: >-
    Administrators and IT staff legitimately enumerate directory context for troubleshooting, but they
    rarely do so with a purpose-built LDAP whoami tool rather than the native whoami command. A standard
    user account, or a service account that has no reason to query the directory for its own identity,
    running this tool is anomalous. The account role and its typical toolset determine whether this is
    routine or worth chasing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: Which LDAP authentication method did this execution request?
  context: >-
    SharpLdapWhoami resolves the caller's identity by binding to the domain controller's LDAP service.
    The /method: or /m: flag selects how that bind authenticates — ntlm, kerb (Kerberos), or nego
    (Negotiate). The chosen method reveals which credential material the operator expected to work and
    can hint at whether they hold a Kerberos ticket or NTLM hash. Identify the exact flag from the
    triggering command line.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Decode the full SharpLdapWhoami command line — what did this invocation actually do on the host?
  context: >-
    The full command line reveals the complete operation, including any authentication-method flags and
    additional arguments. This query returns every SharpLdapWhoami execution on the host within a few
    minutes of the alert, which captures sequential invocations that together form one logical
    enumeration step. Decode each argument to understand what was queried and how.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Did this process write any files to the host shortly after execution?
  context: >-
    Enumeration tools often write their output to disk for later collection. Checking for files created
    by this process confirms execution and reveals whether the directory query results were staged, even
    if the original process has already exited. Review any created files for captured directory or
    identity data.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process spawned this tool, and is that parent chain a normal way to launch enumeration here?
  context: >-
    The parent process shows how the tool was invoked. A command interpreter launched from explorer.exe
    (interactive operator) or an automation script is one profile; spawning from a script interpreter
    (wscript.exe, cscript.exe, mshta.exe), an Office application, wmiprvse.exe, or wsmprovhost.exe points
    to automated or remote post-exploitation. Identifying whether the launch came from a non-interactive
    shell or a system service is the key tuning signal here.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Did other reconnaissance commands run on this host around the same time?
  context: >-
    A single identity query may be benign, but several reconnaissance commands in rapid succession —
    whoami, net user, nltest, dsquery, setspn — is a signature of post-compromise enumeration. Tight
    temporal grouping of identity discovery with directory or lateral-movement reconnaissance raises the
    severity; an isolated query is closer to routine activity.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: Has this host run SharpLdapWhoami before?
  context: >-
    A binary never before seen on a host is more suspicious than one that runs regularly. Zero or very
    low historical counts over 90 days indicate first-time or rare execution, which is typical for an
    operator-introduced tool rather than installed software.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host previously fired the rule's pattern, what parents and users drove it, and does the current alert fit?
  context: >-
    The query mirrors the rule's full selection structure scoped to this host, so the resulting
    parent/user distribution reflects how this specific firing pattern — not generic binary usage — has
    run here historically. A new parent process, an unexpected account, or an unusual command-line structure
    relative to that history is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_name:
        Image|endswith: \SharpLdapWhoami.exe
      selection_pe:
      - OriginalFileName|contains: SharpLdapWhoami
      - Product: SharpLdapWhoami
      selection_flags1:
        CommandLine|endswith:
        - ' /method:ntlm'
        - ' /method:kerb'
        - ' /method:nego'
        - ' /m:nego'
        - ' /m:ntlm'
        - ' /m:kerb'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did this tool spawn afterward?
  context: >-
    Processes spawned by the tool reveal what the operator did next. An identity-enumeration utility
    that spawns command interpreters, credential-access tooling, or lateral-movement utilities indicates
    the discovery step fed directly into further action rather than ending the activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_name:
        Image|endswith: \SharpLdapWhoami.exe
      selection_pe:
      - OriginalFileName|contains: SharpLdapWhoami
      - Product: SharpLdapWhoami
      selection_flags1:
        CommandLine|endswith:
        - ' /method:ntlm'
        - ' /method:kerb'
        - ' /method:nego'
        - ' /m:nego'
        - ' /m:ntlm'
        - ' /m:kerb'
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_name:
        Image|endswith: \SharpLdapWhoami.exe
      selection_pe:
      - OriginalFileName|contains: SharpLdapWhoami
      - Product: SharpLdapWhoami
      selection_flags1:
        CommandLine|endswith:
        - ' /method:ntlm'
        - ' /method:kerb'
        - ' /method:nego'
        - ' /m:nego'
        - ' /m:ntlm'
        - ' /m:kerb'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the account's activity across all hosts in the alert window reveals lateral movement or
    enumeration spread across multiple endpoints. If the same account drove similar activity elsewhere,
    the scope of the activity is larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_name:
        Image|endswith: \SharpLdapWhoami.exe
      selection_pe:
      - OriginalFileName|contains: SharpLdapWhoami
      - Product: SharpLdapWhoami
      selection_flags1:
        CommandLine|endswith:
        - ' /method:ntlm'
        - ' /method:kerb'
        - ' /method:nego'
        - ' /m:nego'
        - ' /m:ntlm'
        - ' /m:kerb'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining the surrounding activity reveals what led to this event
    and what happened after — reconnaissance, privilege escalation, or persistence mechanisms that place
    the enumeration in a larger sequence. Novel parent-child pairs at low counts are what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, credential access — may
    reveal the stages that preceded this enumeration and help reconstruct the timeline. The sequence of
    alerts often tells the story: credential access followed by identity enumeration followed by lateral
    movement.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's full selection structure with no host scope, giving a fleet-wide count
    of this firing pattern rather than generic binary usage. Many hosts firing the same pattern points
    to scripted deployment or automation; one host or a small unrelated set points to manual operator
    activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_name:
        Image|endswith: \SharpLdapWhoami.exe
      selection_pe:
      - OriginalFileName|contains: SharpLdapWhoami
      - Product: SharpLdapWhoami
      selection_flags1:
        CommandLine|endswith:
        - ' /method:ntlm'
        - ' /method:kerb'
        - ' /method:nego'
        - ' /m:nego'
        - ' /m:ntlm'
        - ' /m:kerb'
      condition: 1 of selection*
    fields:
    - host.name
