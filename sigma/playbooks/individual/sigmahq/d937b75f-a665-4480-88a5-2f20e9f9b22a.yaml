name: Possible Privilege Escalation via Weak Service Permissions
id: 9ae581f0-e3dd-428c-a66f-1c5f3b8d6261
description: |
  Detects sc.exe run by a Medium integrity-level (non-administrative) process where the command line EITHER changes a service binary path ('config' plus 'binPath') OR sets a service failure command ('failure' plus 'command'). When a standard user holds write access to a service object's DACL, reconfiguring its binPath or failure command lets an attacker-chosen command run as LocalSystem at the next service start or failure, escalating from a normal account to SYSTEM. The same command line is also a legitimate, if uncommon, administrative pattern, so the investigation should confirm the integrity level, decode the exact service and target binary, determine whether the change was authorized, and check for the surrounding escalation and persistence activity that typically accompanies abuse.
type: detection
detection_id: d937b75f-a665-4480-88a5-2f20e9f9b22a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Did a Medium integrity-level process run sc.exe to either change a service binPath or set a service failure command?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires when sc.exe runs at Medium
    integrity AND the command line contains EITHER 'config' and 'binPath' OR 'failure' and 'command'. Review
    the exact command line and IntegrityLevel and note which branch fired, because the binPath branch points
    at the service binary itself while the failure branch points at the recovery command - both run as the
    service account but the downstream payload differs.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: Is this user and host expected to reconfigure Windows services from the command line?
  context: >-
    Service reconfiguration via sc.exe is normally an administrative or deployment-tooling action. A standard
    user account running it at Medium integrity, or a host where service management is not part of its
    function, is harder to explain as routine operations and shifts the disposition toward abuse of a weak
    service DACL.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Was there a change ticket, maintenance window, or documented approval for this service reconfiguration?
  context: >-
    Many organizations require change records for service modifications. A corresponding ticket suggests
    authorized maintenance; absence of one, when policy requires it, suggests the binPath or failure-command
    change was unauthorized. This check can quickly close a false positive or escalate a true positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What service was reconfigured, and what binary or command does it now execute?
  context: >-
    The sc.exe command line names the target service and the new binPath or failure command. Attackers point
    a writeable service at a command that runs as LocalSystem - often a payload in a world-writable directory
    (C:\Users\Public, C:\Windows\Temp) or an inline 'cmd.exe /c net localgroup administrators ... /add'. The
    structured service-install event exposes ImagePath, StartType, and the service account for comparison
    against the command line. Decode the full target path or command - it is the escalation payload.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: system
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 7045
      condition: selection
    fields:
      - ServiceName
      - ImagePath
      - StartType
      - AccountName
- question: Was a service registry key under HKLM\SYSTEM\CurrentControlSet\Services modified on this host around the alert?
  context: >-
    sc.exe config writes the new binary path into the service's registry key, and the same escalation can be
    performed directly by editing the registry. Modifications to ImagePath, FailureCommand, ServiceDll, or
    Parameters values for a service that runs as LocalSystem are the persisted form of this technique. Compare
    any modified value against the known-good service configuration; a path moved into a user-writable
    directory is the payload.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\CurrentControlSet\Services\'
      selection_values:
        TargetObject|contains:
          - '\ImagePath'
          - '\FailureCommand'
          - '\ServiceDll'
          - '\Parameters'
      condition: selection and selection_values
    fields:
      - TargetObject
      - Details
      - Image
      - User
- question: Is the reconfigured service currently running, and under what account?
  context: >-
    A reconfigured service may not have started yet (demand start) or may have been stopped after detection.
    Current status reveals whether the persistence is live. A service running as LocalSystem holds full system
    privileges; the run state and account indicate whether the escalation has already executed. Run a status
    check (for example sc query or sc qc) against the named service on the host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned this sc.exe instance, and is that parent chain expected?
  context: >-
    The parent reveals how sc.exe was invoked. A user-driven escalation typically traces back to an
    interactive shell (cmd.exe, powershell.exe) under explorer.exe; service-management tooling has its own
    predictable chain. An unusual parent - a script host, an Office application, or a freshly dropped binary -
    points toward exploitation rather than administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: >-
    Even routine service management can match this pattern. The query mirrors the rule's selection structure
    scoped to this host, so the parent/user distribution reflects how the rule's specific firing pattern has
    historically run here. A new parent process, an unexpected user, or an unusual command-line structure is the
    deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      scbynonadmin:
        Image|endswith: \sc.exe
        IntegrityLevel:
        - Medium
        - S-1-16-8192
      selection_binpath:
        CommandLine|contains|all:
        - config
        - binPath
      selection_failure:
        CommandLine|contains|all:
        - failure
        - command
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (scbynonadmin and 1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      scbynonadmin:
        Image|endswith: \sc.exe
        IntegrityLevel:
        - Medium
        - S-1-16-8192
      selection_binpath:
        CommandLine|contains|all:
        - config
        - binPath
      selection_failure:
        CommandLine|contains|all:
        - failure
        - command
      _pb_scope:
        User|expand: '%User%'
      condition: (scbynonadmin and 1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      scbynonadmin:
        Image|endswith: \sc.exe
        IntegrityLevel:
        - Medium
        - S-1-16-8192
      selection_binpath:
        CommandLine|contains|all:
        - config
        - binPath
      selection_failure:
        CommandLine|contains|all:
        - failure
        - command
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (scbynonadmin and 1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or repeated escalation attempts on
    multiple endpoints. If the same user triggered service reconfiguration or other administrative actions on
    several hosts in this window, the scope of the activity may be larger than one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      scbynonadmin:
        Image|endswith: \sc.exe
        IntegrityLevel:
        - Medium
        - S-1-16-8192
      selection_binpath:
        CommandLine|contains|all:
        - config
        - binPath
      selection_failure:
        CommandLine|contains|all:
        - failure
        - command
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (scbynonadmin and 1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Activity surrounding the alert reveals the immediate context - what led
    to the service change and what followed it. Look for reconnaissance, the service-restart that triggers the
    payload, account additions, or other persistence mechanisms in the same window.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    Attackers rarely rely on a single mechanism. After reconfiguring a service, they commonly install backup
    footholds using different techniques - scheduled tasks, additional services, registry Run keys, BITS jobs,
    or WMI subscriptions. Multiple persistence installations in the same timeframe indicate intentional
    stacking rather than isolated administration.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Was sc.exe executed from its expected System32 path?
  context: >-
    sc.exe run from outside System32 or SysWOW64 may have been copied or renamed to evade path-based
    allowlists. Comparing the Image path and OriginalFileName confirms whether this is the genuine system
    binary in its expected location or a relocated copy, which would itself be suspicious independent of the
    service change.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired this rule's sc.exe pattern over the past 90 days, and what command-line structures are typical?
  context: >-
    A service-reconfiguration pattern with no prior history on a host is more suspicious than one used
    regularly under stable parents. The query mirrors the rule's selection structure scoped to this host, so
    the count reflects the rule's specific firing pattern rather than generic sc.exe usage. The command-line
    projection lets the analyst compare typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      scbynonadmin:
        Image|endswith: \sc.exe
        IntegrityLevel:
        - Medium
        - S-1-16-8192
      selection_binpath:
        CommandLine|contains|all:
        - config
        - binPath
      selection_failure:
        CommandLine|contains|all:
        - failure
        - command
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (scbynonadmin and 1 of selection_*) and _pb_scope
    fields:
    - CommandLine
