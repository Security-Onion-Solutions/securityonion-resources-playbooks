name: Windows Defender Disabled Via SystemSettingsAdminFlows.EXE
id: ea20433b-a1ea-46af-bcb2-8ff55940afb0
description: |
  Detects SystemSettingsAdminFlows.exe — the backing process for the Windows Settings app —
  invoked with a command line referencing Defender that matches either of two disablement
  branches: EITHER a real-time-protection flag (RTP, RealTimeProtection, or
  DisableEnhancedNotifications) set to 1, OR a cloud-protection flag (SubmitSamplesConsent,
  SpyNetReporting, or DisableCDPUserAuthPolicy) set to 0. The binary is a legitimate Windows
  component normally launched by the Settings UI or by MDM/GPO tooling on an administrator's
  behalf; command-line-driven invocation outside that context is a documented pattern in
  ransomware deployment chains that strip Defender protection immediately before payload
  execution. The investigation should confirm which branch fired, identify the process and
  user that invoked the change, verify whether the corresponding registry policy value and
  current protection state reflect the change, and look for the activity the change was
  intended to enable.
type: detection
detection_id: da92713f-ca2d-4fab-8320-098013d3f43a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the command line match either branch of this rule's disablement pattern?
  context: |
    The rule fires when SystemSettingsAdminFlows.exe's command line references Defender AND
    either sets one of the real-time-protection flags (RTP, RealTimeProtection,
    DisableEnhancedNotifications) to 1, or sets one of the cloud-protection flags
    (SubmitSamplesConsent, SpyNetReporting, DisableCDPUserAuthPolicy) to 0. Note which branch
    fired: the real-time-protection branch degrades on-access scanning or notification
    behavior directly, while the cloud-protection branch degrades sample submission and
    cloud-delivered telemetry without necessarily stopping the local scan engine. Confirm
    against the exact command-line arguments before investing further investigation time.
  range: +/-30d
  answer_sources:
  - alert
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to change Windows Defender protection settings from the command line?
  context: |
    Legitimate Defender configuration changes are normally driven by an administrator through
    the Settings app, or pushed by MDM/GPO tooling — SystemSettingsAdminFlows.exe is the
    backing process for that UI either way. Confirming whether this user and host routinely
    perform this kind of change is often the fastest way to separate authorized troubleshooting
    from unauthorized tampering.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which Defender protection control did this command line target, and to what state?
  context: |
    The rule's condition is a branch: RTP, RealTimeProtection, or DisableEnhancedNotifications
    set to 1 targets on-access scanning or notification behavior directly; SubmitSamplesConsent,
    SpyNetReporting, or DisableCDPUserAuthPolicy set to 0 targets cloud-delivered protection and
    sample submission without necessarily touching the local scan engine. Identifying the
    specific flag and branch determines how exposed the host currently is.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is Windows Defender protection currently restored, or does the host remain exposed?
  context: |
    A tampering command from earlier does not guarantee the setting was ever restored.
    Confirm the current state directly — real-time protection state, cloud-protection state,
    and any policy overrides — rather than assuming the alerting command was the final word on
    the host's configuration.
  range: +/-30d
  answer_sources:
  - edr_console
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process invoked SystemSettingsAdminFlows.exe, and is that parent chain expected?
  context: |
    SystemSettingsAdminFlows.exe is normally launched by SystemSettings.exe or explorer.exe
    when a user interacts with the Settings app, or by an MDM/management agent for
    policy-driven changes. A parent such as a script host, a remote-management tool, or an
    unfamiliar binary indicates the command line was constructed and launched programmatically
    rather than through the Settings UI. The invoking process may have started well before the
    alert, so this looks up its creation event over a wide window.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did registry policy values under Windows Defender change to reflect this command, or persist afterward?
  context: |
    Defender configuration changes made through the Settings app or its administrative flows
    are normally written through to registry policy values under the Windows Defender
    real-time-protection and cloud-protection (Spynet) keys. Confirming the corresponding
    registry state closes the gap between the command that ran and the control's actual
    on-disk configuration, since execution and configuration application can diverge if the
    command failed partway or the value was reset afterward.
  range: +/-15m
  answer_sources:
  - registry_event
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_defender:
        TargetObject|contains:
          - '\Windows Defender\Real-Time Protection\DisableRealtimeMonitoring'
          - '\Windows Defender\Real-Time Protection\DisableBehaviorMonitoring'
          - '\Windows Defender\Real-Time Protection\DisableEnhancedNotifications'
          - '\Windows Defender\Spynet\SpyNetReporting'
          - '\Windows Defender\Spynet\SubmitSamplesConsent'
          - '\Windows Defender\DisableAntiSpyware'
      condition: selection and selection_defender
    fields:
      - TargetObject
      - Details
      - Image
- question: Were other defense tampering actions performed on this host?
  context: |
    An operator degrading Defender protection in one pass commonly also clears logs, disables
    recovery, changes firewall rules, or stops security services in the same operation.
    Multiple tampering commands from the same user or parent process indicate a deliberate,
    broader defense-degradation sequence rather than an isolated Defender change.
  range: +/-1h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: What activity occurred on this host after the Defender protection setting was changed?
  context: |
    Reducing Defender protection is typically a means to an end — running a payload or tool
    that would otherwise be scanned or blocked. Aggregated process activity in the following
    hour shows what the change was clearing the way for; look for unfamiliar executables,
    downloader/LOLBIN activity, or mass tool execution shortly after.
  range: +1h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: When this host has previously fired either branch of this rule's pattern, what parents and users normally drive that activity, and does the current alert fit?
  context: |
    The query mirrors the rule's two-branch selection structure scoped to this host, so the
    resulting parent/user distribution reflects how this specific disablement pattern has
    historically run here — not generic SystemSettingsAdminFlows.exe usage, which also handles
    unrelated Settings pages. A new parent process, an unexpected user account, or a branch
    that has never fired here before is the deviation worth chasing.
  range: -14d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_ssaf_img:
      - Image|endswith: \SystemSettingsAdminFlows.exe
      - OriginalFileName: SystemSettingsAdminFlows.EXE
      selection_ssaf_cli:
        CommandLine|contains: defender
      selection_cli_enable_opt:
        CommandLine|contains:
        - 'RTP '
        - 'RealTimeProtection '
        - 'DisableEnhancedNotifications '
      selection_cli_enable_value:
        CommandLine|contains: '1'
      selection_cli_disable_opt:
        CommandLine|contains:
        - 'SubmitSamplesConsent '
        - 'SpyNetReporting '
        - 'DisableCDPUserAuthPolicy '
      selection_cli_disable_value:
        CommandLine|contains: '0'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_ssaf_* and (all of selection_cli_enable_* or all of selection_cli_disable_*)) and _pb_scope
    fields:
    - ParentImage
    - User
- always_include: true
  question: Has this user previously produced either branch of this rule's pattern, and does that history fit their role?
  context: |
    The query mirrors the rule's two-branch selection structure scoped to this user, showing
    their 90-day history of actually disabling Defender protection through this mechanism —
    not generic use of the Settings app. A user with no prior history of this pattern is more
    suspicious than an IT or support account that does this routinely; weigh the count against
    the user's role.
  range: -90d
  answer_sources:
  - process_creation
  - organizational_knowledge
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_ssaf_img:
      - Image|endswith: \SystemSettingsAdminFlows.exe
      - OriginalFileName: SystemSettingsAdminFlows.EXE
      selection_ssaf_cli:
        CommandLine|contains: defender
      selection_cli_enable_opt:
        CommandLine|contains:
        - 'RTP '
        - 'RealTimeProtection '
        - 'DisableEnhancedNotifications '
      selection_cli_enable_value:
        CommandLine|contains: '1'
      selection_cli_disable_opt:
        CommandLine|contains:
        - 'SubmitSamplesConsent '
        - 'SpyNetReporting '
        - 'DisableCDPUserAuthPolicy '
      selection_cli_disable_value:
        CommandLine|contains: '0'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_ssaf_* and (all of selection_cli_enable_* or all of selection_cli_disable_*)) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this parent process historically driven this rule's pattern on this host or across the environment, or is the parent new for this activity?
  context: |
    When the alert fires under a service principal, user identity does not attribute the
    behavior. The meaningful pivot is the launch mechanism: this shows the 90-day history of
    the alerting parent process driving this specific disablement pattern. A new or rare
    parent for this pattern is the deviation worth chasing; a parent that already accounts for
    many prior events is management-tooling automation.
  range: -90d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_ssaf_img:
      - Image|endswith: \SystemSettingsAdminFlows.exe
      - OriginalFileName: SystemSettingsAdminFlows.EXE
      selection_ssaf_cli:
        CommandLine|contains: defender
      selection_cli_enable_opt:
        CommandLine|contains:
        - 'RTP '
        - 'RealTimeProtection '
        - 'DisableEnhancedNotifications '
      selection_cli_enable_value:
        CommandLine|contains: '1'
      selection_cli_disable_opt:
        CommandLine|contains:
        - 'SubmitSamplesConsent '
        - 'SpyNetReporting '
        - 'DisableCDPUserAuthPolicy '
      selection_cli_disable_value:
        CommandLine|contains: '0'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_ssaf_* and (all of selection_cli_enable_* or all of selection_cli_disable_*)) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: |
    Tracking the user's activity across all hosts around the alert reveals whether the same
    account touched multiple endpoints — for example, if the same identity is disabling
    Defender protection or running other tooling on additional hosts, the scope of the
    operation is larger than this single host.
  range: +/-1h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same parent-driven pattern fire on other hosts in the same window, pointing to a rollout rather than isolated activity?
  context: |
    Under a service principal, tracking user activity network-wide returns agent-telemetry
    noise. The meaningful question is whether the same launch mechanism produced this
    disablement pattern elsewhere in the same window: multiple hosts points to scheduled or
    pushed automation, while a single host points to a host-local trigger.
  range: +/-1h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_ssaf_img:
      - Image|endswith: \SystemSettingsAdminFlows.exe
      - OriginalFileName: SystemSettingsAdminFlows.EXE
      selection_ssaf_cli:
        CommandLine|contains: defender
      selection_cli_enable_opt:
        CommandLine|contains:
        - 'RTP '
        - 'RealTimeProtection '
        - 'DisableEnhancedNotifications '
      selection_cli_enable_value:
        CommandLine|contains: '1'
      selection_cli_disable_opt:
        CommandLine|contains:
        - 'SubmitSamplesConsent '
        - 'SpyNetReporting '
        - 'DisableCDPUserAuthPolicy '
      selection_cli_disable_value:
        CommandLine|contains: '0'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_ssaf_* and (all of selection_cli_enable_* or all of selection_cli_disable_*)) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired either branch of this rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: |
    The query mirrors the rule's two-branch selection structure with no host scope, giving a
    fleet-wide count of the pattern itself, not generic SystemSettingsAdminFlows.exe usage.
    Many hosts firing the identical branch points to scripted deployment or endpoint-management
    automation; a single host or a small, unrelated set points to manual operator activity.
  range: -7d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_ssaf_img:
      - Image|endswith: \SystemSettingsAdminFlows.exe
      - OriginalFileName: SystemSettingsAdminFlows.EXE
      selection_ssaf_cli:
        CommandLine|contains: defender
      selection_cli_enable_opt:
        CommandLine|contains:
        - 'RTP '
        - 'RealTimeProtection '
        - 'DisableEnhancedNotifications '
      selection_cli_enable_value:
        CommandLine|contains: '1'
      selection_cli_disable_opt:
        CommandLine|contains:
        - 'SubmitSamplesConsent '
        - 'SpyNetReporting '
        - 'DisableCDPUserAuthPolicy '
      selection_cli_disable_value:
        CommandLine|contains: '0'
      condition: all of selection_ssaf_* and (all of selection_cli_enable_* or all of selection_cli_disable_*)
    fields:
    - host.name
- question: What other process activity occurred on this host around the time of the alert?
  context: |
    Aggregated parent-child process pairs around the alert reveal the immediate context
    surrounding the Defender change. Reconnaissance, credential-access tooling, or payload
    staging landing in the same window shows up here as novel low-count pairs against the
    host's usual noise.
  range: +/-15m
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: |
    Earlier detections — initial access, credential access, or reconnaissance — may reveal the
    stages that preceded this Defender-disablement attempt and help reconstruct the operation's
    timeline. Defense tampering aimed specifically at Defender often comes just before payload
    execution, so recent precursor alerts raise the priority of this one.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host?
  context: |
    An operator who disables Defender protection typically intends to run something that would
    otherwise be blocked or flagged, and often wants that access to survive a reboot. Scheduled
    tasks, services, registry Run keys, BITS jobs, or WMI subscriptions installed around the
    same time indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations (Startup folders, scheduled-task definitions) on this host?
  context: |
    File-based persistence bypasses command-line detection entirely — an executable or script
    dropped into the Startup folder or a Run-key-referenced path achieves persistence without
    running schtasks, sc, or reg. On a host where Defender protection was just reduced, a drop
    in this window is a direct way to guarantee unscanned code execution at the next logon.
  range: +/-4h
  answer_sources:
  - file_event
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
