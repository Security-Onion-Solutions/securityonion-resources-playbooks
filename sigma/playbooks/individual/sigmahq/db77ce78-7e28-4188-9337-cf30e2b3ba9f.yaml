name: Potential Wazuh Security Platform DLL Sideloading
id: 879b1745-5e4d-4cde-8f5e-f3ea201e5a53
description: |
  Detects a Wazuh security platform DLL (libwazuhshared.dll or libwinpthread-1.dll) loaded from a directory outside the standard C:\Program Files install locations and not the known mingw64 runtime path, a pattern consistent with DLL side-loading. Because libwinpthread-1.dll is a shared MinGW runtime shipped by many development tools (Visual Studio, JetBrains, Ruby, Anaconda, GithubDesktop), a load of that library alone is frequently benign, while a load of libwazuhshared.dll, or either DLL from a user-writable path under an unexpected process, is the stronger indicator. Investigation should confirm the load path and signature, identify and vet the loading process, and correlate any nearby file writes or registry redirection that would establish the hijack.
type: detection
detection_id: db77ce78-7e28-4188-9337-cf30e2b3ba9f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the loaded module match the DLL name and non-standard load path this rule detects?
  context: >-
    Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded) against the rule's criteria: one
    of libwazuhshared.dll or libwinpthread-1.dll, loaded from a directory other than C:\Program Files or C:\Program Files
    (x86), and not the mingw64 runtime path (\mingw64\bin\libwinpthread-1.dll under \AppData\Local\ or \ProgramData\). Note
    which DLL fired -- libwazuhshared.dll is Wazuh-specific and rarely benign outside its install directory, while
    libwinpthread-1.dll is a shared MinGW runtime and more often legitimate. The load event carries the module's signature
    status and hash directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this host and process expected to load a Wazuh platform DLL from a non-standard directory?
  context: >-
    Legitimate agents and development tools load these libraries from their own install directories. A load of
    libwinpthread-1.dll by a known development tool (Visual Studio, JetBrains, Ruby, Anaconda, GithubDesktop) or by the
    Wazuh agent from its install path is routine; the same DLL loaded by an unrelated process from a user-writable directory
    is not. Knowing whether this host runs Wazuh or these tools quickly separates expected loads from side-loading.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What other modules did the loading process pull in, and are any from user-writable or non-canonical paths?
  context: >-
    The full set of modules a process loads tells the operator's story. Look for DLLs loaded from %TEMP%, AppData,
    ProgramData, or Public (a side-loading signal), unsigned modules where signed ones are expected, and system DLL names
    resolved from non-system paths (search-order hijacking). A loader that pulled the flagged Wazuh DLL from a user-writable
    directory has often staged additional planted libraries alongside it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For the loaded Wazuh DLL, what is its signature status, hash, and reputation?
  context: >-
    Module reputation distinguishes a routine third-party DLL from a side-loaded malicious one. A genuinely signed DLL loaded
    from an unexpected location may still be legitimate, but an unsigned libwazuhshared.dll or libwinpthread-1.dll, or one
    whose SignatureStatus is Expired, Distrusted, or Invalid, is a masquerading indicator. Compare the Hashes value against
    a known-good baseline for the DLL and pivot the hash to threat intelligence to surface known loaders.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What is the process that loaded this DLL, where does it run from, and what was its full command line?
  context: >-
    The loading process's own path and command line reveal whether it is a legitimate signed application in its expected
    install location or a relocated or renamed binary staged alongside the DLL. Side-loading works by placing a planted
    library next to a trusted executable, so a loader running from AppData, ProgramData, Public, or a temp directory is the
    concern even when the DLL name looks familiar.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned the loader, and is that parent chain expected for this application?
  context: >-
    The parent process reveals how the loader was invoked. Legitimate applications have predictable parents (services.exe
    for agents and services, explorer.exe or an installer for user-launched tools). An unusual parent such as a script host,
    an Office application, or a process itself running from a user-writable path suggests the loader was dropped and launched
    as part of an intrusion rather than a normal install.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Has this DLL been loaded on this host before, and by which processes?
  context: >-
    A first-time module load on a host is a stronger anomaly than a recurring one. If the same DLL has been loaded by the
    same process binary repeatedly over the past 90 days, this load is probably routine. If this is the first occurrence, or
    the DLL has only ever been loaded by entirely different processes, the current load is anomalous and points back to the
    loading process.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Is this DLL being loaded on other hosts, and by what processes?
  context: >-
    Cross-host correlation surfaces the scope of the activity. The same DLL loaded across multiple hosts points to
    distribution beyond a single machine, whereas a single localized load is more likely an isolated event. Pay attention to
    the variety of loading processes: a DLL loaded only by its expected parent is benign, while the same DLL loaded by
    unexpected processes elsewhere suggests the loader is being spread.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Were registry keys that control DLL resolution or per-image execution modified on this host around the alert?
  context: >-
    DLL side-loading and hijacking are sometimes reinforced through registry redirection -- KnownDLLs entries, AppInit_DLLs,
    a COM InprocServer32 value pointing at the planted DLL, or Image File Execution Options. Modifications to these keys near
    the load time indicate the redirection was configured deliberately rather than the library simply sitting in a search
    path, and tie the load to a persistence or hijack setup step.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_redirect:
        TargetObject|contains:
          - '\KnownDLLs'
          - '\AppInit_DLLs'
          - '\InprocServer32'
          - '\Image File Execution Options\'
      condition: selection and selection_redirect
    fields:
      - TargetObject
      - Details
      - Image
- question: What other activity occurred on this host around the time of the DLL load?
  context: >-
    Alerts rarely occur in isolation. Examining activity in a tight window around the load correlates it with the file write
    that staged the DLL, the process that launched the loader, and any follow-on execution. Novel parent-child pairs at low
    counts stand out against the repetitive agent telemetry that dominates the aggregation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this load?
  context: >-
    Earlier detections on the same host -- defense tampering, reconnaissance, or credential access -- may reveal the attack
    stages that preceded the side-load and help reconstruct the timeline. A hijack rarely stands alone; preceding alerts
    often show how the loader and its planted DLL arrived on the host.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Is the side-loaded DLL still on disk for analysis?
  context: >-
    If the DLL is still present, it can be hashed, submitted for analysis, and its signature examined. The loading process's
    file writes to and around the load path show whether the library was freshly staged next to the executable, which is the
    defining artifact of a side-load.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was there a software install, update, or change ticket that explains a new DLL load path?
  context: >-
    A recent install or update of the Wazuh agent or a development tool can legitimately introduce one of these libraries in
    a new location. A corresponding change record suggests authorized activity; its absence when policy requires one raises
    the priority and shifts the load toward unauthorized staging.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this DLL load align with normal work hours or a maintenance window?
  context: >-
    Legitimate installs and updates usually occur during business hours or scheduled maintenance windows. A first-time load
    of a Wazuh DLL from a non-standard path at an odd hour, with no maintenance window, is more suspicious than the same
    activity during a documented deployment.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were process-based persistence mechanisms installed on this host around the same time?
  context: >-
    Attackers rarely rely on a single foothold. After establishing execution through a side-loaded DLL, they commonly add
    backup persistence using scheduled tasks, services, registry Run keys, or BITS jobs. Multiple persistence installations
    in the same timeframe indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup folders or scheduled-task definition paths on this host around the same time?
  context: >-
    File-based persistence bypasses command-line detection entirely. Dropping an executable or script into a Startup folder
    or a path referenced by a registry Run key achieves persistence without running schtasks, sc, or reg. File event
    monitoring captures these drops alongside the side-load and shows whether the intrusion also secured a boot-time foothold.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
