name: Potential Initial Access via DLL Search Order Hijacking
id: 0bf5cc1f-2b1f-4767-99c0-59341b4a10fb
description: >-
  Fires when a process on the Office and scripting allowlist — an Office
  application, cmd.exe, certutil.exe, mshta.exe, a script host, powershell.exe or
  pwsh.exe, or curl.exe — creates a file ending in .dll under a user AppData path
  inside a desktop application's dependency folder for OneDrive, Teams, Slack, or
  VS Code, AND the write is not the excluded benign cmd.exe OneDrive
  api-ms-win-core case. Dropping a DLL next to a trusted application's binary sets
  up search-order or phantom side-load hijacking, so that when the application
  next starts it loads the planted module from its own directory instead of the
  legitimate copy, executing attacker code inside a trusted process. Investigation
  should confirm the drop, determine whether the DLL subsequently loaded and into
  which process, inspect and hash the module, and establish whether the writing
  process and its lineage are expected on this host.
type: detection
detection_id: dbbd9f66-2ed3-4ca2-98a4-6ea985dd1a1c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Do the created DLL file path and the process that created it match what this rule detects?
  context: >-
    Confirm the alert before investing time. A listed process — an Office
    application, cmd.exe, certutil.exe, mshta.exe, a script host, powershell.exe or
    pwsh.exe, or curl.exe — created a file ending in .dll under a user AppData path
    inside a desktop application dependency folder for OneDrive, Teams, Slack, or
    VS Code, and the write is not the excluded cmd.exe OneDrive api-ms-win-core
    case. Both conditions must hold together for a true positive.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to write a DLL into a desktop application's dependency folder?
  context: >-
    Legitimate installers and the applications' own updaters write DLLs into these
    folders, but the listed writer processes — Office apps, cmd.exe, certutil.exe,
    script hosts, powershell.exe — are not the normal source. Judge by the writing
    process and the host role; when the user is a machine or service account, weigh
    the process and host function rather than the account name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What launched the process that wrote this DLL, and is that parent chain expected?
  context: >-
    A trusted binary writing a DLL into another application's folder is unusual, so
    how it was launched matters. A malicious document opening in an Office
    application, or a script host spawned from an attachment, points to
    attacker-driven activity; an installer or the app's own updater points to
    routine maintenance. A winword.exe or powershell.exe parent driving the write
    is a common lineage for this technique.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What email, document, or web request led to the process that wrote this DLL?
  context: >-
    Initial access via this pattern often begins with a malicious document opened
    in an Office application or a script host launched from an attachment or link.
    Identifying the delivery vector — the parent command line, the document
    filename, or the originating request — enables blocking at the perimeter and
    finding other recipients. The parent command line is the starting point; email
    and web logs complete the picture.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: What is inside the dropped DLL, is it signed, and what does it import or export?
  context: >-
    Retrieve and inspect the module. A hijack DLL is typically unsigned or
    self-signed and often proxies or forwards its exports to the legitimate library
    it impersonates, so the host application keeps working while attacker code runs.
    Check exports, imports, embedded strings, and any alternate data stream or
    mark-of-the-web on the file; content retrieval is a manual endpoint or offline
    step, since file-write telemetry carries no stream or hash data itself.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did the dropped DLL load into a process, into which one, and is the loaded module signed?
  context: >-
    The drop is only the setup; the payoff is the load. When the targeted
    application next starts, search-order or phantom-DLL hijacking causes it to load
    the planted module from its own directory instead of the legitimate copy in a
    system path such as C:\Windows\System32. A load into one of the targeted desktop
    applications, especially an unsigned or untrusted-signature module loading from
    an AppData path, confirms code execution inside a trusted process; the loaded
    module's hash can be submitted to threat intelligence. If no load appears, the
    hijack has not yet triggered and the file remains a staged, unfired artifact.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
      - SignatureStatus
      - Hashes
- question: Is the dropped DLL still on disk, or was it deleted or renamed after the alert?
  context: >-
    The DLL's post-drop lifecycle drives next steps. A module still on disk can be
    retrieved, hashed, and analyzed; a DLL deleted or renamed shortly after creation
    suggests staging or cleanup and shifts focus to what loaded it in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the writing process and its children create or delete around the alert?
  context: >-
    A process that plants one hijack DLL often plants several, or stages additional
    payloads. The breadth, paths, and extensions of the writing process's other file
    activity distinguish a single planted module from a broader drop and enumerate
    what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has a DLL with this name been written on this host before, and by what process?
  context: >-
    A module name that matches a legitimate Windows or application DLL but has never
    before been written into this folder points to a phantom or side-load DLL
    planted where the real library does not normally live. Zero or very low prior
    counts, or a new writing process, mark this as a first-time drop worth
    escalating.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: When this host previously matched this DLL-drop pattern, what writing processes and users drove it, and does the current alert fit?
  context: >-
    The query mirrors the rule's full selection scoped to this host, so the writer
    and user distribution reflects how this specific DLL-drop pattern has fired here
    before, not generic use of these binaries. A new writing process, an unexpected
    user, or a first-ever match is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith:
        - \winword.exe
        - \excel.exe
        - \powerpnt.exe
        - \MSACCESS.EXE
        - \MSPUB.EXE
        - \fltldr.exe
        - \cmd.exe
        - \certutil.exe
        - \mshta.exe
        - \cscript.exe
        - \wscript.exe
        - \curl.exe
        - \powershell.exe
        - \pwsh.exe
        TargetFilename|endswith: .dll
        TargetFilename|contains|all:
        - \Users\
        - \AppData\
        TargetFilename|contains:
        - \Microsoft\OneDrive\
        - \Microsoft OneDrive\
        - \Microsoft\Teams\
        - \Local\slack\app-
        - \Local\Programs\Microsoft VS Code\
      filter:
        Image|endswith: \cmd.exe
        TargetFilename|contains|all:
        - \Users\
        - \AppData\
        - \Microsoft\OneDrive\
        - \api-ms-win-core-
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts matched this DLL-drop pattern in the past week, and does the spread look like automation or isolated activity?
  context: >-
    The query mirrors the rule's full selection with no host scope, giving a
    fleet-wide count of this DLL-drop pattern rather than generic usage of these
    binaries. Many hosts matching the same pattern suggests a pushed installer or
    vendor automation; one host or a small unrelated set points to targeted,
    operator-driven activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith:
        - \winword.exe
        - \excel.exe
        - \powerpnt.exe
        - \MSACCESS.EXE
        - \MSPUB.EXE
        - \fltldr.exe
        - \cmd.exe
        - \certutil.exe
        - \mshta.exe
        - \cscript.exe
        - \wscript.exe
        - \curl.exe
        - \powershell.exe
        - \pwsh.exe
        TargetFilename|endswith: .dll
        TargetFilename|contains|all:
        - \Users\
        - \AppData\
        TargetFilename|contains:
        - \Microsoft\OneDrive\
        - \Microsoft OneDrive\
        - \Microsoft\Teams\
        - \Local\slack\app-
        - \Local\Programs\Microsoft VS Code\
      filter:
        Image|endswith: \cmd.exe
        TargetFilename|contains|all:
        - \Users\
        - \AppData\
        - \Microsoft\OneDrive\
        - \api-ms-win-core-
      condition: selection and not filter
    fields:
    - host.name
- always_include: true
  question: Has this user previously produced this DLL-drop pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's full selection scoped to this user, returning the
    user's 90-day history of this specific pattern aggregated by host. A user who
    has never produced this drop is more suspicious than one who does so routinely;
    weigh the count against their role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith:
        - \winword.exe
        - \excel.exe
        - \powerpnt.exe
        - \MSACCESS.EXE
        - \MSPUB.EXE
        - \fltldr.exe
        - \cmd.exe
        - \certutil.exe
        - \mshta.exe
        - \cscript.exe
        - \wscript.exe
        - \curl.exe
        - \powershell.exe
        - \pwsh.exe
        TargetFilename|endswith: .dll
        TargetFilename|contains|all:
        - \Users\
        - \AppData\
        TargetFilename|contains:
        - \Microsoft\OneDrive\
        - \Microsoft OneDrive\
        - \Microsoft\Teams\
        - \Local\slack\app-
        - \Local\Programs\Microsoft VS Code\
      filter:
        Image|endswith: \cmd.exe
        TargetFilename|contains|all:
        - \Users\
        - \AppData\
        - \Microsoft\OneDrive\
        - \api-ms-win-core-
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has the alerting program historically driven this DLL-drop pattern, or is the program new for this activity?
  context: >-
    When the alert fires under a machine or service account, user identity does not
    attribute the behavior; the launch mechanism does. This query mirrors the rule's
    full selection scoped to the alerting program, giving its 90-day history
    of driving this pattern aggregated by host. A new or rare program is the
    deviation; a program already accounting for many prior events is vendor or
    platform automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith:
        - \winword.exe
        - \excel.exe
        - \powerpnt.exe
        - \MSACCESS.EXE
        - \MSPUB.EXE
        - \fltldr.exe
        - \cmd.exe
        - \certutil.exe
        - \mshta.exe
        - \cscript.exe
        - \wscript.exe
        - \curl.exe
        - \powershell.exe
        - \pwsh.exe
        TargetFilename|endswith: .dll
        TargetFilename|contains|all:
        - \Users\
        - \AppData\
        TargetFilename|contains:
        - \Microsoft\OneDrive\
        - \Microsoft OneDrive\
        - \Microsoft\Teams\
        - \Local\slack\app-
        - \Local\Programs\Microsoft VS Code\
      filter:
        Image|endswith: \cmd.exe
        TargetFilename|contains|all:
        - \Users\
        - \AppData\
        - \Microsoft\OneDrive\
        - \api-ms-win-core-
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around the time of the alert?
  context: >-
    Tracking the user's activity across all hosts reveals whether the drop is
    isolated or part of movement across multiple endpoints. If the same user drove
    similar activity elsewhere, the scope may be larger. When the alert fires under
    SYSTEM or a service account this view returns agent-telemetry noise, so pair it
    with the parent-driven cross-host view.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven DLL-drop pattern fire on other hosts in the same window, or is it isolated to this host?
  context: >-
    Under a service principal, network-wide user activity is agent noise, so the
    meaningful question is whether the same launch mechanism fired elsewhere. This
    query mirrors the rule's full selection scoped to the alerting program,
    fleet-wide, in the alert window. Multiple hosts in the same window points to
    scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith:
        - \winword.exe
        - \excel.exe
        - \powerpnt.exe
        - \MSACCESS.EXE
        - \MSPUB.EXE
        - \fltldr.exe
        - \cmd.exe
        - \certutil.exe
        - \mshta.exe
        - \cscript.exe
        - \wscript.exe
        - \curl.exe
        - \powershell.exe
        - \pwsh.exe
        TargetFilename|endswith: .dll
        TargetFilename|contains|all:
        - \Users\
        - \AppData\
        TargetFilename|contains:
        - \Microsoft\OneDrive\
        - \Microsoft OneDrive\
        - \Microsoft\Teams\
        - \Local\slack\app-
        - \Local\Programs\Microsoft VS Code\
      filter:
        Image|endswith: \cmd.exe
        TargetFilename|contains|all:
        - \Users\
        - \AppData\
        - \Microsoft\OneDrive\
        - \api-ms-win-core-
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating the process activity around the
    drop reveals what led to it and what followed, and whether it sits inside a
    larger sequence such as reconnaissance, privilege escalation, or additional
    persistence. Novel parent-child pairs at low counts are what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance,
    credential access, or a prior delivery alert — may reveal the stages that
    preceded the DLL drop and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
