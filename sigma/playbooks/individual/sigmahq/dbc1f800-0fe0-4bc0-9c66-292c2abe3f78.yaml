name: Delete Important Scheduled Task
id: 40268b34-2b76-4438-9a69-1fa2863ca34d
description: |
  Detects schtasks.exe removing a Windows-maintained scheduled task that backs a protective, update, or recovery
  component. The rule fires when the alerting process is identified as schtasks.exe by either of two alternative
  branches — an Image path ending in \schtasks.exe, or an OriginalFileName of schtasks.exe — and, in addition, its
  command line contains /delete and names one of the protected task paths (BitLocker, Exploit Guard, System Restore,
  Update Orchestrator, Windows Defender, Windows Backup, Windows Update). Deleting these tasks stops the scheduled work
  that maintains defenses, patching, restore points, and backups, and the technique commonly appears alongside other
  recovery-inhibiting commands ahead of data destruction. The investigation should establish which task was removed,
  whether the removal was authorized servicing or change activity, and whether it clusters with other tamper actions on
  the host or across the environment.
type: detection
detection_id: dbc1f800-0fe0-4bc0-9c66-292c2abe3f78
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the alerting process match schtasks.exe by either its Image path or its OriginalFileName, and does the command line carry /delete against a protected task path?
  context: >-
    Confirm the identity of the process and the exact command line before investing further time. The rule accepts either
    branch for binary identity — an Image path ending in \schtasks.exe, or an OriginalFileName of schtasks.exe — so note
    which one matched. If only OriginalFileName matched, the file was renamed or copied and the binary-path question
    below becomes load-bearing; if the Image path matched, path provenance is largely informational. Both branches still
    require /delete and one of the protected task paths in the same command line.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to delete Windows-maintained protective scheduled tasks?
  context: >-
    Removal of these tasks is normally driven by imaging, servicing, or an approved configuration change, and only a
    narrow set of accounts and hosts do that work. Establishing whether the account role and host function include
    servicing the update, backup, or defense stack is often the fastest way to separate routine change activity from
    tampering.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What other recovery-inhibiting commands were executed on this host?
  context: >-
    Recovery inhibition is usually chained rather than singular: shadow copy deletion (vssadmin, wmic), boot recovery
    disabling (bcdedit), backup catalog deletion (wbadmin), and recovery environment removal (reagentc) accompany the
    removal of scheduled backup and restore tasks. This query surfaces recovery-inhibiting commands on the host across
    the following day, showing whether the task deletion stands alone or sits inside a wider sequence, and the time span
    between them indicates whether the actions were scripted together. Verify each result against system state on the
    host with vssadmin list shadows, bcdedit /enum, reagentc /info, and wbadmin get versions.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\reagentc.exe'
          - '\diskshadow.exe'
      selection_cmdline:
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'recoveryenabled'
          - 'bootstatuspolicy'
          - 'delete catalog'
          - 'delete systemstatebackup'
          - 'boot.ini'
          - 'winre.wim'
          - '/disable'
      condition: selection and (selection_recovery or selection_cmdline)
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
  - edr_console
- question: Is this same protective-task deletion firing on other hosts in the environment?
  context: >-
    The same removal executed across many hosts in a short period points to scripted or pushed execution rather than a
    host-local administrative action. The number of hosts returned sets the scope for containment, and the first-to-last
    detection timeline shows the direction and rate of the sequence.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
  answer_sources:
  - process_creation
  - alert
- question: Which scheduled task was deleted, and was removal forced without confirmation?
  context: >-
    The schtasks command line carries the task name in /TN, and /F suppresses the confirmation prompt. Read the full /TN
    value to identify which component lost its scheduled work — the rule matches task paths under BitLocker, Exploit
    Guard, System Restore, Update Orchestrator, Windows Defender, Windows Backup, and Windows Update, and each maps to a
    different consequence (no restore points, no backups, no definition updates, no patching). A forced, non-interactive
    deletion is consistent with scripted removal rather than an operator working through a console.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Which protective components were targeted on this host beyond the task named in the alert?
  context: >-
    Task deletion is one route to stopping protective work; the same components are also reachable through service
    control, policy, and configuration commands. This query surfaces commands on the host that name the protected task
    paths or the services behind them (WinDefend, wuauserv, BDESVC, VSS, swprv, SDRSVC), so the analyst can tell a
    single task removal from a sweep across the defense, update, and backup subsystems. Several distinct components
    touched in one window indicates a prepared sequence rather than a targeted servicing edit.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_targets:
        CommandLine|contains:
          - '\Windows\BitLocker'
          - '\Windows\ExploitGuard'
          - '\Windows\SystemRestore\SR'
          - '\Windows\UpdateOrchestrator\'
          - '\Windows\Windows Defender\'
          - '\Windows\WindowsBackup\'
          - '\Windows\WindowsUpdate\'
          - 'WinDefend'
          - 'wuauserv'
          - 'BDESVC'
          - 'swprv'
          - 'SDRSVC'
      condition: selection and selection_targets
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Do the Security-channel task events corroborate the deletion, and were other tasks created or updated around it?
  context: >-
    Task removal is recorded independently of process telemetry as event 4699, with 4698 for task creation and 4702 for
    task update. These events name the task and attribute the change to an account, which corroborates the command line
    and shows whether the same session also registered a replacement task after removing the original. If the Security
    channel is not collected in this environment, treat an empty result as a visibility gap rather than as evidence the
    deletion did not occur.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 4698
          - 4699
          - 4702
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - EventID
      - TaskName
      - SubjectUserName
  answer_sources:
  - manual_review
  - process_creation
- question: Is the deleted task absent from the system now, or has it been re-registered?
  context: >-
    Remediation depends on the current state of the task, which process telemetry alone does not report. Query the host
    for the task named in the command line (schtasks /query /tn <taskname> /v) or read the endpoint's task inventory. A
    task that is still missing means the component's scheduled work is not running and needs restoring; a task that
    reappeared with different content is a replacement rather than a restoration and should be read as a persistence
    artifact.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - manual_review
  - edr_console
- question: What has the Task Scheduler launched on this host since the deletion, and is the removed component's payload still among it?
  context: >-
    Scheduled tasks execute as children of the Task Scheduler service, so what the scheduler launched after the deletion
    shows whether the removed component's work actually stopped. Compare the launched images against the component named
    in the alert. A task that took the deleted one's place, or an unfamiliar image running under the scheduler, is worth
    following up.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\svchost.exe'
        ParentCommandLine|contains: 'Schedule'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What process spawned schtasks.exe, and is that parent chain expected?
  context: >-
    The parent reveals how the deletion was invoked. Servicing and management stacks launch schtasks under predictable
    parents; a shell, script host, or remote-execution service as the parent points to interactive or scripted removal.
    Walking up to the parent's own parent shows what drove the sequence and whether the same launcher issued the other
    commands on the host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Defense tampering and recovery inhibition normally follow earlier stages rather than opening an intrusion. Earlier
    detections on the same host — credential access, reconnaissance, remote execution, or other tamper actions — help
    reconstruct what led to the task deletion and how the account obtained the rights to perform it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Has this user previously produced this task-deletion pattern, and does that history fit their role?
  context: >-
    The query counts this user's 90-day history of the same deletion pattern, grouped by host. An account with no prior
    history of removing these tasks is a different proposition from a servicing account that does it on every rebuild;
    weigh the count against the account's role and normal toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_cli_delete:
        CommandLine|contains|windash: /delete
      selection_cli_task:
        CommandLine|contains:
        - \Windows\BitLocker
        - \Windows\ExploitGuard
        - \Windows\SystemRestore\SR
        - \Windows\UpdateOrchestrator\
        - \Windows\Windows Defender\
        - \Windows\WindowsBackup\
        - \Windows\WindowsUpdate\
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Has this parent process historically driven this deletion pattern on this host or across the environment, or is the parent new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute the behavior and the launch
    mechanism does. The query counts the 90-day history of this parent driving the same deletion pattern, grouped by
    host. A parent that already accounts for thousands of prior events is servicing or vendor automation; a parent that
    is new or rare for this pattern is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_cli_delete:
        CommandLine|contains|windash: /delete
      selection_cli_task:
        CommandLine|contains:
        - \Windows\BitLocker
        - \Windows\ExploitGuard
        - \Windows\SystemRestore\SR
        - \Windows\UpdateOrchestrator\
        - \Windows\Windows Defender\
        - \Windows\WindowsBackup\
        - \Windows\WindowsUpdate\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the account's activity across all hosts shows whether the deletion is isolated or one step in a sequence
    spanning endpoints. The same account touching multiple hosts in the alert window, particularly with management or
    tamper utilities, widens the scope of the investigation.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  always_include: true
  answer_sources:
  - process_creation
- question: Did this same parent-driven deletion pattern fire on other hosts in the same window?
  context: >-
    Under a service principal, a user-wide sweep returns routine agent telemetry rather than an answer. The meaningful
    pivot is the launch mechanism: this query counts the same deletion pattern under the alerting parent, fleet-wide, in
    the alert window. Several hosts in the same window points to scheduled or pushed automation; a single host points to
    a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_cli_delete:
        CommandLine|contains|windash: /delete
      selection_cli_task:
        CommandLine|contains:
        - \Windows\BitLocker
        - \Windows\ExploitGuard
        - \Windows\SystemRestore\SR
        - \Windows\UpdateOrchestrator\
        - \Windows\Windows Defender\
        - \Windows\WindowsBackup\
        - \Windows\WindowsUpdate\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
- question: Was schtasks.exe executed from its expected System32 path?
  context: >-
    The rule identifies the binary by OriginalFileName as well as by path, so a copied or renamed schtasks.exe still
    matches. An Image outside C:\Windows\System32 or C:\Windows\SysWOW64 means the binary was relocated, which is a step
    taken to sidestep path-based allowlists and application control policies. An Image in the expected location makes
    this line of enquiry informational.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
  answer_sources:
  - process_creation
- question: Were other tamper or recovery-inhibiting LOLBins used on this host in the past day?
  context: >-
    Removing one protective task rarely happens alone — reg, sc, netsh, wevtutil, bcdedit, vssadmin, diskshadow, and
    dnscmd reach the same defensive, logging, and recovery stack through different interfaces. Several of these running
    under one parent inside a short window points to a scripted sequence rather than an isolated administrative edit.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\reg.exe'
          - '\sc.exe'
          - '\at.exe'
          - '\netsh.exe'
          - '\wevtutil.exe'
          - '\bcdedit.exe'
          - '\vssadmin.exe'
          - '\diskshadow.exe'
          - '\dnscmd.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: How often has this host produced this task-deletion pattern over the past 90 days, and what command-line structures are typical?
  context: >-
    A deletion pattern with no prior history on the host is a different proposition from one that recurs under stable
    servicing automation. The query counts the same pattern scoped to this host and projects the command lines, so the
    typical invocation structure, task names, and flags can be compared against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_cli_delete:
        CommandLine|contains|windash: /delete
      selection_cli_task:
        CommandLine|contains:
        - \Windows\BitLocker
        - \Windows\ExploitGuard
        - \Windows\SystemRestore\SR
        - \Windows\UpdateOrchestrator\
        - \Windows\Windows Defender\
        - \Windows\WindowsBackup\
        - \Windows\WindowsUpdate\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
  answer_sources:
  - process_creation
