name: Suspicious Cabinet File Execution Via Msdt.EXE
id: b084ed84-12f0-4b6b-b93a-b3ea2fa02b73
description: |
  Detects msdt.exe (Microsoft Support Diagnostic Tool) invoked with the "-cab" flag, which loads a .diagcab cabinet
  file. The rule fires when the process Image ends in msdt.exe OR its OriginalFileName is msdt.exe, AND the command
  line contains "-cab". A .diagcab archive wraps diagnostic configuration XML that can reference local or network paths,
  and crafted packages can write attacker-controlled files outside the temp directory or proxy execution of secondary
  programs through this Microsoft-signed binary. Legitimate use exists when support staff or vendor tooling run packaged
  troubleshooters, so the investigation should determine the cabinet source, the parent that launched msdt.exe, and
  whether any child process, file write, or outbound connection followed.
type: detection
detection_id: dc4576d4-7467-424f-9eee-fd2b02855fe0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line show msdt.exe running with the -cab flag?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line
    against the rule's criteria - the process must be msdt.exe (by Image name or OriginalFileName) AND the command line
    must contain the "-cab" flag, which is what loads a .diagcab cabinet file. Note the cabinet path or filename in the
    command line, as the source of that file drives the rest of the investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run packaged Windows troubleshooters from a cabinet file?
  context: Legitimate administrative or support activity can trigger this detection - a help-desk session or vendor
    diagnostic package may run msdt.exe against a .diagcab. Knowing whether the user role and host function are consistent
    with running diagnostic cabinets is often the fastest path to distinguishing routine support from abuse.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What cabinet file did msdt.exe load, and where does that file path point?
  context: The full command line reveals the specific .diagcab the tool was told to process. Decode the path after the
    "-cab" flag - a local user-writable directory, a temp folder, or a UNC/WebDAV path each carry different risk. A
    network path or a recently dropped local cabinet is the indicator worth chasing, since the diagnostic XML inside can
    reference further local or remote paths.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned msdt.exe and is that parent chain expected?
  context: The parent process reveals how msdt.exe was invoked. A diagnostic cabinet opened by a user typically descends
    from explorer.exe or a browser/mail client; a parent such as winword.exe, an Office application, wscript.exe, or a
    scripting host points to a document or script triggering the load rather than a deliberate support action.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did msdt.exe spawn after loading the cabinet?
  context: msdt.exe processing a malicious cabinet can proxy execution of a secondary program. Spawned children such as
    powershell.exe, cmd.exe, rundll32.exe, regsvr32.exe, mshta.exe, msiexec.exe, or curl.exe indicate the cabinet
    carried a payload rather than a benign troubleshooter. A clean diagnostic run usually spawns only Windows diagnostic
    helpers.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did msdt.exe or its children open outbound network connections around the time of the alert?
  context: A crafted .diagcab can reference a UNC/WebDAV source, causing the diagnostic engine or a spawned child to reach
    out to a remote host to retrieve files or stage further execution. Outbound connections from msdt.exe or a child it
    launched - especially to an external address or a non-standard port - point to remote retrieval rather than local
    diagnostics. Correlate the connecting process against the process tree from the alert.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\msdt.exe'
          - '\powershell.exe'
          - '\cmd.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msiexec.exe'
          - '\curl.exe'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: What files were written on this host around the alert, and did any land in startup or autorun locations?
  context: The diagcab handling flaw copies files from the cabinet source into a temp directory before signature
    verification, and a path-traversal filename can redirect that write into the user's Startup folder so the file
    executes at next logon. File writes under the Startup folder, Roaming AppData, or a SDIAG temp directory in the same
    window are the artifact that distinguishes a benign troubleshooter from a planted payload.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\AppData\Roaming\'
          - '\AppData\Local\Temp\SDIAG_'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - User
- question: Does this host normally run msdt.exe?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. msdt.exe is rarely
    invoked outside of an active support session, so zero or very low historical counts indicate first-time or rare
    execution worth scrutinizing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive it, and does the
    current alert fit?
  context: Even Microsoft-signed tools can be abused. The query mirrors the rule's selection structure scoped to this host,
    so the resulting parent/user distribution reflects how this specific msdt.exe -cab firing pattern has historically run
    here. A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \msdt.exe
      - OriginalFileName: msdt.exe
      selection_cmd:
        CommandLine|contains|windash: ' -cab '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led to this event and what
    followed - look for reconnaissance, payload retrieval, privilege escalation, or persistence mechanisms that surround
    the cabinet execution and provide broader context.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - phishing-payload execution, reconnaissance, or defense tampering - may
    reveal the attack stages that preceded the cabinet execution and help reconstruct the full timeline. A .diagcab is
    commonly delivered by attachment or download, so prior alerts around document or download activity are relevant.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \msdt.exe
      - OriginalFileName: msdt.exe
      selection_cmd:
        CommandLine|contains|windash: ' -cab '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \msdt.exe
      - OriginalFileName: msdt.exe
      selection_cmd:
        CommandLine|contains|windash: ' -cab '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints.
    If the same user triggered similar activity on multiple hosts, the scope of the event may be larger than a single
    cabinet execution.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \msdt.exe
      - OriginalFileName: msdt.exe
      selection_cmd:
        CommandLine|contains|windash: ' -cab '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Were any other proxy-execution LOLBins used on this host recently?
  context: Attackers who abuse one signed proxy-execution binary often use several. If msdt.exe loaded a malicious cabinet,
    check whether rundll32, regsvr32, mshta, msiexec, or similar binaries were also used to run arbitrary code. Finding
    multiple proxy-execution LOLBins performing the same objective strengthens the case for malicious activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\mavinject.exe'
          - '\installutil.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
          - '\wmic.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was msdt.exe executed from its expected System32 path?
  context: A LOLBin executed from a non-standard path (outside System32 or SysWOW64) may have been copied or renamed to
    evade path-based allowlists. An msdt.exe running from a user temp directory or a download folder is more suspicious
    than the genuine binary in System32; compare the Image path against the OriginalFileName.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired the msdt.exe -cab pattern over the past 90 days, and what command-line structures are
    typical?
  context: A LOLBin pattern with no prior history on a host is more suspicious than one used under stable parents. The
    query mirrors the rule's selection structure scoped to this host, so the count reflects this specific msdt.exe -cab
    firing pattern rather than generic msdt.exe usage. The command-line projection lets the analyst compare typical
    cabinet invocations against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \msdt.exe
      - OriginalFileName: msdt.exe
      selection_cmd:
        CommandLine|contains|windash: ' -cab '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
