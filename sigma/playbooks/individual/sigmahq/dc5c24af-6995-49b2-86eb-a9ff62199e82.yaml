name: COM Hijacking via TreatAs
id: 45fa259d-3d47-4d42-ae54-70961d15b965
description: |
  Detects a process writing the TreatAs\(Default) value under a COM CLSID key. TreatAs redirects one class
  identifier to a substitute CLSID, so whenever the original object is instantiated the substitute's registered
  code loads instead — a persistence and privilege-escalation technique that survives reboot and runs the
  attacker's payload in place of a legitimate component. The rule fires when the TreatAs\(Default) write is
  performed by a process other than the excluded Office servicing, integrator, svchost, and msiexec binaries.
  Investigation should identify the substitute CLSID written to the value, resolve its InprocServer32 DLL,
  and determine whether that DLL was dropped to disk, loaded, or executed after the redirect was registered.
type: detection
detection_id: dc5c24af-6995-49b2-86eb-a9ff62199e82
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the registry key path and the substitute CLSID value written to it match what this rule detects?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires when a process writes the
    TreatAs\(Default) value under a COM CLSID key AND the writing process is none of the excluded Office
    servicing, integrator, svchost, or msiexec binaries. Review the exact key path (TargetObject) so you can
    identify which legitimate CLSID is being redirected.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to register COM object redirections under the CLSID hive?
  context: >-
    Legitimate administrative or installer activity can register COM classes, but writing a TreatAs redirect
    under HKCU\Software\Classes\CLSID or HKLM\SOFTWARE\Classes\CLSID is rare outside software setup. Knowing
    whether this user role and host function normally perform COM registration is often the fastest way to
    separate a routine deployment from a hijack. User attribution is present on most endpoint registry events;
    when it is a machine account or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the process that wrote the TreatAs key expected, and what started it?
  context: >-
    The writing process and its origin are the core signal. Registry redirects registered by an interactive
    shell, a script host (wscript.exe, mshta.exe, powershell.exe), or an Office application point to a hijack,
    while writes from a known installer or management agent point to routine software configuration. Tracing the
    parent's own origin reveals whether the chain is user-initiated or spawned by a macro or downloaded payload.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Which legitimate CLSID is being redirected, and is a TreatAs write under this key a known hijack location?
  context: >-
    The registry path names the CLSID being hijacked. A TreatAs\(Default) value under a CLSID key forces every
    consumer of that class to load a substitute class instead, which is a documented persistence and
    privilege-escalation location — especially when the hijacked CLSID belongs to a frequently instantiated or
    logon-triggered component. Determine whether this CLSID is one your software legitimately re-registers or a
    high-value class an attacker would choose to guarantee execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What substitute CLSID was written to the TreatAs value, and what code does it resolve to?
  context: >-
    The value data (Details) is the substitute CLSID that the original class is redirected to. Resolve that
    GUID to its own registration and read its InprocServer32 entry to find the DLL that will load — for example
    scrobj.dll (the Windows Script Component runtime, paired with a ScriptletURL pointing to a remote or local
    .sct scriptlet) or an attacker DLL under a user-writable path. The substitute CLSID and its InprocServer32
    DLL are the concrete payload this redirect executes.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: After the redirect was registered, did scrobj.dll or a DLL from a user-writable path load on this host?
  context: >-
    When the hijacked class is next instantiated, the substitute CLSID's InprocServer32 DLL loads into whatever
    process instantiated the original object. The documented pattern loads scrobj.dll to run a scriptlet; a fully
    custom hijack loads an attacker DLL staged under Users, AppData, ProgramData, or Temp. A load of either after
    the TreatAs write ties the registry change to actual code execution and identifies the hosting process.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_dll:
        ImageLoaded|endswith: '\scrobj.dll'
      selection_userpath:
        ImageLoaded|contains:
          - '\Users\'
          - '\AppData\'
          - '\ProgramData\'
          - '\Temp\'
      condition: selection and (selection_dll or selection_userpath)
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
- question: Was the hijacked object instantiated — did rundll32.exe run with -sta or -localserver after the write?
  context: >-
    A common way to trigger a COM redirect on demand is rundll32.exe with -sta {clsid} or -localserver {clsid},
    which instantiates the hijacked class and forces the substitute code to load. Execution of rundll32.exe with
    these switches after the TreatAs write confirms the redirect was exercised rather than merely staged. Absence
    does not clear the alert — logon-triggered or application-triggered classes fire when the target is next used.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\rundll32.exe'
        CommandLine|contains:
          - '-sta'
          - '-localserver'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did the writing process or its children drop a DLL or scriptlet to disk for the substitute CLSID to load?
  context: >-
    The redirect is only effective if the substitute CLSID's referenced payload exists on disk. Correlating file
    activity by the registry-writing process and its children surfaces the DLL or .sct scriptlet staged in the
    same session as the TreatAs write. The file-write event carries no hash; if the payload is present, hash it
    from a later execution or retrieve it for a reputation lookup. Registry deletion is not observable here, so
    judge cleanup from re-modification history and payload execution rather than expecting a key-removal event.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was this TreatAs key written again or reverted after the initial modification?
  context: >-
    Registry key and value deletion events are not emitted by endpoint telemetry in this environment, so attacker
    cleanup of the redirect is not directly observable. Judge whether the persistence is still in place from the key's re-modification history
    over a longer window — a second write that restores or replaces the value, or a lack of any reversion — and
    from whether the configured payload executed. Do not treat the absence of a removal event as evidence the
    key was cleaned up.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What other registry modifications were made on this host in the same session?
  context: >-
    Registering a COM hijack usually means several writes together — the substitute CLSID's InprocServer32 value,
    its ScriptletURL, and the TreatAs redirect itself. Registry changes from the same writing process in a short
    window reveal the full registration and whether persistence, tampering, or configuration changes landed
    together, which points to a hands-on session or an installer-style implant rather than a single stray write.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity in the surrounding window collapses repetitive
    agent telemetry into high-count rows while novel parent-child pairs stand out at low counts, revealing what
    led to the redirect and what followed — reconnaissance, payload staging, or the process that later
    instantiated the hijacked class.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Has this TreatAs key been written before on this host?
  context: >-
    A TreatAs redirect under a CLSID should essentially never be written on a normal endpoint outside a specific
    software installation. Zero or very low history for this exact key indicates a first-time modification, which
    is far more suspicious than a value that a known application re-registers on every update. Compare historical
    Details values to see whether the same substitute CLSID has been set before.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same TreatAs key written on other hosts in the environment?
  context: >-
    The same redirect appearing on many hosts may indicate a management-pushed change or widespread malware,
    while a modification isolated to this host suggests targeted activity. Compare the substitute CLSID (Details)
    and writing process across hosts to distinguish a legitimate fleet-wide software behavior from a hijack.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — reconnaissance, credential access, or defense tampering — may reveal
    the stages that preceded the redirect and help reconstruct the timeline. Persistence is typically installed
    after an initial foothold, so prior alerts often name the process or user that went on to register the COM
    hijack.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other persistence mechanisms installed on this host around the same time?
  context: >-
    Attackers rarely rely on a single persistence mechanism. After registering a COM redirect, they commonly
    install backup footholds using scheduled tasks, services, registry Run keys, or BITS jobs. Multiple
    persistence installations in the same timeframe indicate intentional stacking rather than an isolated
    configuration change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
