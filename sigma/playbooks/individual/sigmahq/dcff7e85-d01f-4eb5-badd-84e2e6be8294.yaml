name: Windows Default Domain GPO Modification via GPME
id: 54ef48c1-1cbb-4c7a-bd33-221a7673c892
description: |
  Detects the Group Policy Management Editor launched from mmc.exe (by Image name or original
  filename MMC.exe) with a command line that contains both gpme.msc and a gpobject reference,
  and that references one of the two well-known default GPO GUIDs — the Default Domain Policy
  (31B2F340-016D-11D2-945F-00C04FB984F9) or the Default Domain Controllers Policy
  (6AC1786C-016F-11D2-945F-00C04FB984F9). The rule fires only when all three conditions match
  together. Editing these default GPOs is discouraged by hardening guidance, so the action is
  uncommon for routine administration; an operator can use it to push configuration changes that
  apply domain-wide — scheduled tasks, registry settings, or security policy — without creating a
  new, more visible GPO. Legitimate administrative edits do occur, so the investigation should
  decode the exact GPO and command targeted, confirm the corresponding directory-object and SYSVOL
  changes, establish whether the user, host, and parent process are expected to administer Group
  Policy, and look for surrounding tooling that points to a domain-wide push.
type: detection
detection_id: dcff7e85-d01f-4eb5-badd-84e2e6be8294
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- question: Does the command line launch gpme.msc against a default domain GPO via mmc.exe?
  context: Confirm the alert is a true positive by reviewing the exact command line and process
    details. The rule fires only when the mmc.exe binary (by Image or original filename MMC.exe),
    the gpme.msc and gpobject tokens, and one of the two default GPO GUIDs all appear together.
    Verify the full command, which default GPO GUID the gpobject LDAP path references, and that
    the binary is genuinely mmc.exe before investing further time.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to edit Group Policy Objects?
  context: Legitimate administrative activity can trigger this detection — a domain admin may
    deliberately edit a default GPO despite hardening guidance that discourages it. Knowing whether
    the user role and host function include Group Policy administration, and whether this host is a
    domain controller or a management workstation, is often the fastest way to separate routine
    operations from an operator pushing changes domain-wide.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which default GPO and LDAP object does the gpobject argument reference, and what is the full command?
  context: The full command line reveals exactly which policy was opened for editing. Decode the
    gpobject LDAP path to identify the domain and the GPO GUID — 31B2F340-016D-11D2-945F-00C04FB984F9
    is the Default Domain Policy and 6AC1786C-016F-11D2-945F-00C04FB984F9 is the Default Domain
    Controllers Policy — and note any /s or /gpobject switches. The query scopes to all mmc.exe
    executions on this host within a few minutes so that related console invocations are visible
    together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Did a Group Policy directory object under the policies container change on this host or domain controllers around the time of the alert?
  context: Editing a GPO through the management editor writes changes to the GPO's directory object
    under CN=Policies,CN=System in the domain naming context. Confirming a directory-service object
    modification ties the editor session to an actual policy change and surfaces which attributes
    were altered — high-risk ones include gPCFileSysPath and ntSecurityDescriptor, the latter
    governing delegation on the GPO itself. A modification with no corresponding approved change
    record is the deviation worth chasing. Correlate the object-change timestamp with the editor
    process execution to confirm they belong to the same operation. If directory-service object
    auditing is not collected in this environment, treat the absence of results as a visibility gap
    rather than evidence nothing changed.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: '5136'
      filter:
        ObjectDN|contains: 'CN=Policies,CN=System'
      condition: selection and filter
    fields:
      - ObjectDN
      - AttributeLDAPDisplayName
      - SubjectUserName
- question: Were policy files under the SYSVOL Policies share written or modified on a domain controller around the time of the alert?
  context: A GPO edit that adds a scheduled task, registry setting, or security policy is persisted
    as files under the SYSVOL Policies tree on domain controllers — for example ScheduledTasks.xml
    or GptTmpl.inf. Confirming a SYSVOL file write that matches the edited GPO GUID ties the editor
    session to a concrete on-disk change and shows what the policy now deploys to domain members.
    A new or modified ScheduledTasks.xml is especially worth inspecting because it can run code on
    every machine the GPO applies to. If file-write telemetry from domain controllers is not
    collected in this environment, treat the absence of results as a visibility gap.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains: '\SYSVOL\'
      filter:
        TargetFilename|contains:
          - '\Policies\'
      condition: selection and filter
    fields:
      - TargetFilename
      - Image
      - User
- question: What process spawned mmc.exe, and is that parent chain expected?
  context: The parent process reveals how the management editor was invoked. A GPO edit driven by an
    interactive admin session under explorer.exe on a management workstation or domain controller
    differs sharply from mmc.exe spawned by cmd.exe, powershell.exe under an unusual script host,
    mshta.exe, wscript.exe, or an Office application — parents that point to scripted delivery or a
    macro rather than deliberate policy administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Does this host normally run mmc.exe?
  context: A binary that has never been seen on a host is more suspicious than one that runs
    regularly. mmc.exe is common on administrative hosts and domain controllers but rare on ordinary
    workstations; zero or very low historical counts on the alerting host raise the weight of a
    default-GPO edit, while a host that routinely runs management consoles lowers it.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously launched gpme.msc against a default domain GPO, what parents and users normally drive it, and does this alert fit?
  context: Even legitimate Group Policy administration leaves a pattern. The query mirrors the rule's
    selection structure scoped to this host, so the resulting parent and user distribution reflects
    how the rule's specific firing pattern has historically run here — not generic mmc.exe usage. A
    new parent process, an unexpected user account, or a first-time appearance of this exact pattern
    is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_mmc:
      - Image|endswith: \mmc.exe
      - OriginalFileName: MMC.exe
      selection_gpme:
        CommandLine|contains|all:
        - gpme.msc
        - 'gpobject:'
      selection_default_gpos:
        CommandLine|contains:
        - 31B2F340-016D-11D2-945F-00C04FB984F9
        - 6AC1786C-016F-11D2-945F-00C04FB984F9
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did mmc.exe spawn afterward?
  context: The processes spawned by the management editor reveal its actual impact. A GPO edit is
    normally self-contained within the console; mmc.exe spawning cmd.exe, powershell.exe, or network
    tooling afterward points to follow-on activity — for example launching a remote-execution tool to
    apply the new policy immediately, or staging further payloads to the SYSVOL share. Unexpected
    children, including processes that open network connections to domain controllers or member
    hosts, broaden the scope of the investigation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_mmc:
      - Image|endswith: \mmc.exe
      - OriginalFileName: MMC.exe
      selection_gpme:
        CommandLine|contains|all:
        - gpme.msc
        - 'gpobject:'
      selection_default_gpos:
        CommandLine|contains:
        - 31B2F340-016D-11D2-945F-00C04FB984F9
        - 6AC1786C-016F-11D2-945F-00C04FB984F9
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_mmc:
      - Image|endswith: \mmc.exe
      - OriginalFileName: MMC.exe
      selection_gpme:
        CommandLine|contains|all:
        - gpme.msc
        - 'gpobject:'
      selection_default_gpos:
        CommandLine|contains:
        - 31B2F340-016D-11D2-945F-00C04FB984F9
        - 6AC1786C-016F-11D2-945F-00C04FB984F9
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated
    activity on multiple endpoints. If the same user edited policy, ran remote-execution tooling, or
    touched domain controllers elsewhere in the same window, the scope of the incident may be larger
    than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_mmc:
      - Image|endswith: \mmc.exe
      - OriginalFileName: MMC.exe
      selection_gpme:
        CommandLine|contains|all:
        - gpme.msc
        - 'gpobject:'
      selection_default_gpos:
        CommandLine|contains:
        - 31B2F340-016D-11D2-945F-00C04FB984F9
        - 6AC1786C-016F-11D2-945F-00C04FB984F9
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering,
    reconnaissance, credential access, or privilege escalation — may reveal the attack stages that
    preceded the policy edit and help reconstruct the full timeline. Domain-wide policy changes are
    often a late-stage action that follows the operator gaining the privileges needed to reach a
    domain controller or management host.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts launched gpme.msc against a default domain GPO in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of the rule's firing pattern rather than generic mmc.exe usage. Editing a default
    GPO from more than one host in a short window is unusual and may point to a coordinated push or to
    the same operator working from multiple footholds; a single host points to a localized
    administrative action. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_mmc:
      - Image|endswith: \mmc.exe
      - OriginalFileName: MMC.exe
      selection_gpme:
        CommandLine|contains|all:
        - gpme.msc
        - 'gpobject:'
      selection_default_gpos:
        CommandLine|contains:
        - 31B2F340-016D-11D2-945F-00C04FB984F9
        - 6AC1786C-016F-11D2-945F-00C04FB984F9
      condition: all of selection_*
    fields:
    - host.name
