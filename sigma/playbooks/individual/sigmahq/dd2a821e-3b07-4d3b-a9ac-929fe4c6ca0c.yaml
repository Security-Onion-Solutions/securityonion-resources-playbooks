name: Suspicious Scheduled Task Creation via Masqueraded XML File
id: 6abd3f06-911a-48d9-8485-66676d924678
description: |
  Detects schtasks.exe creating a scheduled task by importing an XML definition file (/create with /xml) where the
  referenced file does not carry a .xml extension. Importing task properties from XML hides the run-as principal, trigger
  schedule, hidden flag, and executed command from the schtasks command line itself, so the command line alone does not
  reveal what the task does. Legitimate installers and management tooling occasionally import .xml task definitions, but a
  non-.xml import file combined with a user-writable source location is a common persistence-install pattern. Investigation
  should recover the imported task definition, confirm the run-as principal and trigger, and determine whether the task is
  still registered and has executed.
type: detection
detection_id: dd2a821e-3b07-4d3b-a9ac-929fe4c6ca0c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line match what this rule detects - schtasks creating a task by importing a non-.xml file?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires only when schtasks.exe (or a binary whose
    OriginalFileName is schtasks.exe) runs with a create flag (/create or -create) AND an XML-import flag (/xml or -xml) AND
    the command line does NOT contain the literal string ".xml". Verify all three conditions hold in the alerting command
    line, and note the path passed to /xml - a file without the .xml extension, especially one in a user-writable directory,
    is the masquerading behavior the rule targets.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to create scheduled tasks by importing task definition files?
  context: >-
    Legitimate administrative activity and some installers create scheduled tasks from XML definitions. Knowing whether the
    user role and host function normally involve task scheduling - an admin workstation, a deployment server, a packaging
    host - is often the fastest path to separating routine operations from operator-driven persistence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What scheduled task was created, and what task name and source file were passed on the command line?
  context: >-
    The schtasks command line carries the task name (/tn) and the path to the imported XML definition (/xml). Because the
    task properties live in the imported file rather than on the command line, the /tr command, /sc schedule, and /ru run-as
    principal are NOT visible here - identify the task name and the source file path so the definition can be recovered and
    parsed. A source file in %TEMP%, %APPDATA%, %ProgramData%, %PUBLIC%, or the root of C:\ is a notable signal.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the process that created the task genuinely schtasks.exe, or a renamed binary, based on its metadata and hash?
  context: >-
    The rule matches either Image ending in schtasks.exe OR an OriginalFileName of schtasks.exe, so a renamed copy of
    schtasks placed elsewhere will also fire. Compare the Image path on disk against the embedded OriginalFileName, and check
    the signing chain and hash. A genuine Microsoft-signed schtasks.exe in System32 narrows the focus to the imported task
    definition; a copy running from a user-writable path or an unsigned binary shifts the disposition toward deliberate
    masquerading.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: Once the imported task definition is recovered, what command does the task execute, and is it encoded or obfuscated?
  context: >-
    The imported file holds the actual payload - the <Exec><Command> and <Arguments> the task runs. Recover the definition
    file (its path is on the schtasks command line) and inspect the executed command. Common encodings to decode include
    base64 (for example a PowerShell -EncodedCommand in the task arguments), hex, character concatenation, and
    environment-variable substitution. Decoding reveals the real intent - a download cradle, reverse shell, loader, or
    credential-theft action - that the command line deliberately keeps out of view.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: When is the task scheduled to run, and has it already executed?
  context: >-
    The trigger in the imported definition determines when the persistence activates. Tasks set to run at boot or logon fire
    on the next restart; recurring tasks may already have run multiple times. Scheduled tasks execute as children of the
    Task Scheduler service, so processes spawned by svchost.exe hosting the Schedule service after the task was created
    indicate the payload has run.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\svchost.exe'
        ParentCommandLine|contains: 'Schedule'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is the scheduled task still registered on the system?
  context: >-
    Persistence is only effective if the task still exists. Some operators delete the task after a single execution to
    reduce forensic artifacts. Confirming the task is still present, by querying the task name recovered from the command
    line on the host or via endpoint tooling, determines whether the persistence is active and requires remediation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does a scheduled-task creation event in the security log confirm this task, and what run-as principal and author does it record?
  context: >-
    Task creation is also recorded as a security-log event (4698) that includes the full task definition - the run-as
    principal, trigger, hidden flag, and executed command - which the schtasks command line hides when properties are
    imported from a file. Correlating the security event for this task name on this host recovers the run-as account (a
    SYSTEM or highly privileged principal is high-risk) and the author, giving an authoritative view of what was registered
    independent of the process command line.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 4698
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TaskName
      - TaskContent
      - SubjectUserName
- question: What process spawned schtasks, and is that parent chain expected for task creation?
  context: >-
    The parent process reveals how the task creation was invoked. Interactive administration typically descends from
    explorer.exe or a console, and software installs from an installer or service. Parents such as a script host, an Office
    application, or a process running from a user-writable directory point to scripted or operator-driven task installation
    rather than routine management.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_cli_create:
        CommandLine|contains:
        - /create
        - -create
      selection_cli_xml:
        CommandLine|contains:
        - /xml
        - -xml
      filter_main_extension_xml:
        CommandLine|contains: .xml
      filter_main_system_process:
        IntegrityLevel:
        - System
        - S-1-16-16384
      filter_main_rundll32:
        ParentImage|endswith: \rundll32.exe
        ParentCommandLine|contains|all:
        - :\WINDOWS\Installer\MSI
        - .tmp,zzzzInvokeManagedCustomActionOutOfProc
      filter_optional_third_party:
        ParentImage|endswith:
        - :\ProgramData\OEM\UpgradeTool\CareCenter_*\BUnzip\Setup_msi.exe
        - :\Program Files\Axis Communications\AXIS Camera Station\SetupActions.exe
        - :\Program Files\Axis Communications\AXIS Device Manager\AdmSetupActions.exe
        - :\Program Files (x86)\Zemana\AntiMalware\AntiMalware.exe
        - :\Program Files\Dell\SupportAssist\pcdrcui.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_cli_create:
        CommandLine|contains:
        - /create
        - -create
      selection_cli_xml:
        CommandLine|contains:
        - /xml
        - -xml
      filter_main_extension_xml:
        CommandLine|contains: .xml
      filter_main_system_process:
        IntegrityLevel:
        - System
        - S-1-16-16384
      filter_main_rundll32:
        ParentImage|endswith: \rundll32.exe
        ParentCommandLine|contains|all:
        - :\WINDOWS\Installer\MSI
        - .tmp,zzzzInvokeManagedCustomActionOutOfProc
      filter_optional_third_party:
        ParentImage|endswith:
        - :\ProgramData\OEM\UpgradeTool\CareCenter_*\BUnzip\Setup_msi.exe
        - :\Program Files\Axis Communications\AXIS Camera Station\SetupActions.exe
        - :\Program Files\Axis Communications\AXIS Device Manager\AdmSetupActions.exe
        - :\Program Files (x86)\Zemana\AntiMalware\AntiMalware.exe
        - :\Program Files\Dell\SupportAssist\pcdrcui.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or coordinated activity across multiple
    endpoints. If the same user drove similar task creation on several hosts, the scope of the activity may be larger than a
    single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_cli_create:
        CommandLine|contains:
        - /create
        - -create
      selection_cli_xml:
        CommandLine|contains:
        - /xml
        - -xml
      filter_main_extension_xml:
        CommandLine|contains: .xml
      filter_main_system_process:
        IntegrityLevel:
        - System
        - S-1-16-16384
      filter_main_rundll32:
        ParentImage|endswith: \rundll32.exe
        ParentCommandLine|contains|all:
        - :\WINDOWS\Installer\MSI
        - .tmp,zzzzInvokeManagedCustomActionOutOfProc
      filter_optional_third_party:
        ParentImage|endswith:
        - :\ProgramData\OEM\UpgradeTool\CareCenter_*\BUnzip\Setup_msi.exe
        - :\Program Files\Axis Communications\AXIS Camera Station\SetupActions.exe
        - :\Program Files\Axis Communications\AXIS Device Manager\AdmSetupActions.exe
        - :\Program Files (x86)\Zemana\AntiMalware\AntiMalware.exe
        - :\Program Files\Dell\SupportAssist\pcdrcui.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining activity around the task creation reveals what led to it and what followed -
    reconnaissance, privilege escalation, payload staging, or additional persistence - and whether the task creation is part
    of a larger sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - defense tampering, reconnaissance, credential access - may reveal the attack
    stages that preceded the task creation and help reconstruct the timeline. A persistence install late in a sequence
    carries different weight than an isolated event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: How often has this host fired this schtasks XML-import pattern over the past 90 days, and what command-line structures are typical?
  context: >-
    A task-creation pattern with no prior history on a host is more suspicious than one used regularly under stable parents.
    The query mirrors the rule's selection structure scoped to this host, so the count reflects the rule's specific firing
    pattern rather than generic schtasks usage. The CommandLine projection lets the analyst compare typical invocation patterns
    against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_cli_create:
        CommandLine|contains:
        - /create
        - -create
      selection_cli_xml:
        CommandLine|contains:
        - /xml
        - -xml
      filter_main_extension_xml:
        CommandLine|contains: .xml
      filter_main_system_process:
        IntegrityLevel:
        - System
        - S-1-16-16384
      filter_main_rundll32:
        ParentImage|endswith: \rundll32.exe
        ParentCommandLine|contains|all:
        - :\WINDOWS\Installer\MSI
        - .tmp,zzzzInvokeManagedCustomActionOutOfProc
      filter_optional_third_party:
        ParentImage|endswith:
        - :\ProgramData\OEM\UpgradeTool\CareCenter_*\BUnzip\Setup_msi.exe
        - :\Program Files\Axis Communications\AXIS Camera Station\SetupActions.exe
        - :\Program Files\Axis Communications\AXIS Device Manager\AdmSetupActions.exe
        - :\Program Files (x86)\Zemana\AntiMalware\AntiMalware.exe
        - :\Program Files\Dell\SupportAssist\pcdrcui.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - CommandLine
- question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: >-
    Operators rarely rely on a single persistence mechanism. After establishing one foothold, they commonly add backups
    using different techniques - other scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions.
    Multiple persistence installations in the same timeframe point to intentional stacking rather than an isolated
    administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
