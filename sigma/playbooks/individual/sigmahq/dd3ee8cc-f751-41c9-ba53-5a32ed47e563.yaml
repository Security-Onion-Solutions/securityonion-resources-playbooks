name: Registry Modification of MS-settings Protocol Handler
id: 03c422f6-b1ff-43cf-834a-f94c9ef2f1cb
description: |
  Detects reg.exe or PowerShell writing to the 'ms-settings' protocol handler command key
  (Software\Classes\ms-settings\shell\open\command). The rule fires when the command line targets
  that key AND the writer is EITHER reg.exe with an 'add' operation OR powershell.exe/pwsh.exe using
  New-ItemProperty/Set-ItemProperty (including the 'ni'/'sp' aliases). Auto-elevated binaries such as
  fodhelper.exe and computerdefaults.exe read this key and execute its default value at high integrity,
  so writing it stages a UAC bypass that runs an attacker-chosen command without a consent prompt; the
  same key can also serve as a file-association persistence handler. Investigation should confirm what
  command was written into the key, what spawned the writer, and what executed at elevated integrity
  immediately afterward.
type: detection
detection_id: dd3ee8cc-f751-41c9-ba53-5a32ed47e563
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does this event write the ms-settings handler key via either reg.exe add or a PowerShell ItemProperty cmdlet?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires when the command line targets
    Software\Classes\ms-settings\shell\open\command AND the writer is either reg.exe performing an 'add', or
    powershell.exe/pwsh.exe using New-ItemProperty, Set-ItemProperty, or their 'ni'/'sp' aliases. Note which
    branch fired (reg.exe vs PowerShell) and read the exact command line and value being written, since the
    writer determines where the decoded payload and value name will appear downstream.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to modify protocol-handler registry keys under HKCU Classes?
  context: >-
    Legitimate administrative activity can trigger this detection, but direct writes to the ms-settings handler
    command key are rarely part of normal user or host behavior. Knowing whether this account and endpoint
    normally perform registry configuration of this kind is often the fastest way to separate a true positive
    from routine operations.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exact registry value was written to the ms-settings handler key, and what command does it set to run?
  context: >-
    The data written into Software\Classes\ms-settings\shell\open\command is what an auto-elevated binary will
    execute. The (default) value holds the command to run; a DelegateExecute value set to empty is the trick that
    forces the shell to use the command key. Pull the structured registry fields linked to this process to read
    the actual key path and value data rather than parsing them by hand from the command line.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: If the writer was PowerShell, was the command encoded or obfuscated, and what does it decode to?
  context: >-
    PowerShell writes to this key may hide the value being set behind -EncodedCommand (-enc), string concatenation,
    backtick escaping, or variable substitution. Decoding reveals the actual command staged into the handler key
    and any surrounding actions (setting DelegateExecute to empty, pointing (default) at a payload in a user-writable
    path). If the writer was reg.exe, the command is already plain text and this step is a quick read of the value data.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned this reg.exe or PowerShell writer, and what started that parent?
  context: >-
    The launch chain reveals how the registry write was initiated. A user double-clicking a shortcut or an admin
    script produces a predictable parent; a parent such as a script host, Office application, or a binary running
    from a user-writable directory points to exploitation or a malicious dropper. Trace the parent's own origin to
    see whether the chain is legitimate.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Were related UAC-bypass registry writes (DelegateExecute, other handler keys) made on this host?
  context: >-
    The ms-settings handler write is one of a family of registry-based UAC bypasses. The DelegateExecute value
    set to empty is the companion write that completes the fodhelper/computerdefaults technique, and related keys
    such as mscfile and Classes\Folder shell\open\command serve other auto-elevated binaries. Finding these
    companion writes confirms the bypass mechanism and reveals the exact payload staged for elevation.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\reg.exe'
          - '\powershell.exe'
          - '\cmd.exe'
        CommandLine|contains:
          - 'ms-settings'
          - 'mscfile'
          - 'Classes\exefile'
          - 'Classes\Folder'
          - 'Environment'
          - 'Shell\Open\command'
          - 'DelegateExecute'
      condition: selection
    fields:
      - CommandLine
      - Image
- question: What ran at high or system integrity shortly after the handler key was written?
  context: >-
    Writing the ms-settings command key is a means to an end. Once an auto-elevated binary such as fodhelper.exe
    or computerdefaults.exe is launched, the staged command runs at high integrity. Examining processes that
    appear at High or System integrity on this host just after the write reveals the actual objective, such as
    credential dumping, persistence installation, or security-tool tampering.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_reg_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_pwsh_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - powershell.exe
        - pwsh.dll
      selection_reg_cli:
        CommandLine|contains: add
      selection_pwsh_cli:
        CommandLine|contains:
        - New-ItemProperty
        - Set-ItemProperty
        - 'ni '
        - 'sp '
      selection_cli_key:
        CommandLine|contains: \ms-settings\shell\open\command
      _pb_scope:
        User|expand: '%User%'
      condition: ((all of selection_reg_* or all of selection_pwsh_*) and selection_cli_key) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_reg_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_pwsh_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - powershell.exe
        - pwsh.dll
      selection_reg_cli:
        CommandLine|contains: add
      selection_pwsh_cli:
        CommandLine|contains:
        - New-ItemProperty
        - Set-ItemProperty
        - 'ni '
        - 'sp '
      selection_cli_key:
        CommandLine|contains: \ms-settings\shell\open\command
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: ((all of selection_reg_* or all of selection_pwsh_*) and selection_cli_key) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around the time of this write?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple
    endpoints. If the same user staged similar registry writes on more than one host, the scope of compromise
    may be larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_reg_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_pwsh_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - powershell.exe
        - pwsh.dll
      selection_reg_cli:
        CommandLine|contains: add
      selection_pwsh_cli:
        CommandLine|contains:
        - New-ItemProperty
        - Set-ItemProperty
        - 'ni '
        - 'sp '
      selection_cli_key:
        CommandLine|contains: \ms-settings\shell\open\command
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: ((all of selection_reg_* or all of selection_pwsh_*) and selection_cli_key) and _pb_scope
    fields:
    - host.name
- question: When this host has previously fired the rule's pattern, what parents and users drove it, and does this alert fit?
  context: >-
    Even common tools can be abused. This query mirrors the rule's selection structure scoped to this host, so the
    resulting parent and user distribution reflects how the rule's specific firing pattern, not generic reg.exe or
    PowerShell usage, has historically run here. A new parent process, an unexpected account, or an unusual
    command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_reg_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_pwsh_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - powershell.exe
        - pwsh.dll
      selection_reg_cli:
        CommandLine|contains: add
      selection_pwsh_cli:
        CommandLine|contains:
        - New-ItemProperty
        - Set-ItemProperty
        - 'ni '
        - 'sp '
      selection_cli_key:
        CommandLine|contains: \ms-settings\shell\open\command
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: ((all of selection_reg_* or all of selection_pwsh_*) and selection_cli_key) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining activity in the minutes around the write shows what led to it and
    what followed, and whether it is part of a larger sequence. Correlating the registry write with nearby
    reconnaissance, privilege escalation, or persistence activity establishes the time relationship between the
    tampering and any elevated execution.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may
    reveal the attack stages that preceded the registry write and help reconstruct the timeline. Multiple
    privilege-escalation or bypass detections in succession strengthen the case for deliberate activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired the rule's pattern in the past week, and does the distribution look like automation or one-off activity?
  context: >-
    This query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of
    the rule's firing pattern rather than generic usage of reg.exe or PowerShell. Many hosts firing the same
    pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual
    operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_reg_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_pwsh_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - powershell.exe
        - pwsh.dll
      selection_reg_cli:
        CommandLine|contains: add
      selection_pwsh_cli:
        CommandLine|contains:
        - New-ItemProperty
        - Set-ItemProperty
        - 'ni '
        - 'sp '
      selection_cli_key:
        CommandLine|contains: \ms-settings\shell\open\command
      condition: (all of selection_reg_* or all of selection_pwsh_*) and selection_cli_key
    fields:
    - host.name
- question: Was the writer binary executed from its expected system path?
  context: >-
    reg.exe and powershell.exe run from System32 or SysWOW64 under normal conditions. A copy of either running
    from a user temp directory or another non-standard path may indicate the binary was relocated or renamed to
    evade path-based allowlists, which raises the suspicion of the registry write.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Were other registry modifications made on this host in the same session?
  context: >-
    An actor who writes one registry key often writes several, for example staging the ms-settings handler for
    UAC bypass while also setting a Run key for persistence or disabling a security setting. Finding a cluster of
    registry writes from the same host within a short window reveals the full scope of configuration changes and
    establishes the time correlation between them.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- question: Does the staged command reference an executable or script that still exists on disk?
  context: >-
    The handler write is only effective if the command it stages points at a payload that exists. If the (default)
    value references an executable in a user-writable path, checking whether that file is present and analyzing its
    hash determines whether the bypass would actually run code and what that code is. Examine the registry value
    data to identify the referenced path, then verify it on disk.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
