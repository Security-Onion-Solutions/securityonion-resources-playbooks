name: Use NTFS Short Name in Command Line
id: 3257808f-d1f3-4f22-ae7c-525a6abb4fe7
description: |
  Detects command lines that reference a file using its Windows 8.3 short name (the auto-generated TILDE+digit form such as PROGRA~1 or BACKUP~1.SQL) for one of several scriptable or executable extensions. The rule fires when the command line contains a tilde-digit token AND the activity is not one of the known-benign WebEx, THOR, or xampp vcredist parents. Short names resolve to the same file as the long path but evade string-based detections that key on long-path substrings such as Program Files or Users, so the investigation should determine whether the short-name reference is incidental application behavior or a deliberate attempt to obscure what file was run.
type: detection
detection_id: dd6b39d9-d9be-4a3b-8fe0-fe3c6a5c1795
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the alerting command line actually contain an 8.3 short-name token, and is the parent not one of the rule's benign exclusions?
  context: Confirm the alert is a true positive before investing time. The rule fires when the command line contains a TILDE+digit token for a scriptable or executable extension AND the parent is not WebEx, THOR, or the xampp vcredist installer. Read the full command line and resolve the short name to the long path it points at so you know which file was actually referenced.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to invoke files by their 8.3 short name?
  context: Legitimate tooling almost always references long paths; short-name references in a command line are unusual for interactive users and most automation. Knowing whether the user role and host function involve legacy installers or older applications that emit short names is often the fastest way to separate routine activity from deliberate evasion.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What does the full command line do once the short name is resolved to its long path?
  context: The short name hides which file was referenced and may also obscure flags or chained commands. Resolve the TILDE+digit token to the real file, then decode the remaining arguments, any encoded content, and any piped or chained commands. Because the rule keys only on the command line and not on a fixed binary, this query is scoped by the short-name pattern on this host so it surfaces the related invocations rather than every execution of the alerting process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
          - '~1.exe'
          - '~1.bat'
          - '~1.msi'
          - '~1.vbe'
          - '~1.vbs'
          - '~1.dll'
          - '~1.ps1'
          - '~1.js'
          - '~1.hta'
          - '~2.exe'
          - '~2.bat'
          - '~2.msi'
          - '~2.vbe'
          - '~2.vbs'
          - '~2.dll'
          - '~2.ps1'
          - '~2.js'
          - '~2.hta'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - Image
- question: What process spawned the process that issued the short-name command, and is that parent chain expected?
  context: The parent process reveals how the short-name command was invoked. Interactive shells, script hosts, or Office applications spawning a process that references a file by its 8.3 name is more concerning than a packaged installer or maintenance task doing so. Walk up from the parent to understand the launch context.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously fired the short-name pattern, what parents and users normally drive it, and does the current alert fit that pattern?
  context: Even legacy applications occasionally emit short names. This query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution reflects how the rule's specific firing pattern has historically run here rather than generic binary usage. A new parent process, an unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - ~1.exe
        - ~1.bat
        - ~1.msi
        - ~1.vbe
        - ~1.vbs
        - ~1.dll
        - ~1.ps1
        - ~1.js
        - ~1.hta
        - ~2.exe
        - ~2.bat
        - ~2.msi
        - ~2.vbe
        - ~2.vbs
        - ~2.dll
        - ~2.ps1
        - ~2.js
        - ~2.hta
      filter:
      - ParentImage|endswith:
        - \WebEx\WebexHost.exe
        - \thor\thor64.exe
      - CommandLine|contains: C:\xampp\vcredist\VCREDI~1.EXE
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did the short-name invocation spawn afterward?
  context: The processes spawned after the short-name command reveal its actual impact. A resolved installer or script that then launches command interpreters, certutil, or other living-off-the-land binaries points to post-exploitation rather than benign software behavior.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Have other hosts fired the short-name pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: This query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of the rule's firing pattern rather than generic command-line activity. Many hosts firing the same pattern points to a packaged installer or vendor automation that emits short names; one host or a small unrelated set points to manual operator activity worth a closer look.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - ~1.exe
        - ~1.bat
        - ~1.msi
        - ~1.vbe
        - ~1.vbs
        - ~1.dll
        - ~1.ps1
        - ~1.js
        - ~1.hta
        - ~2.exe
        - ~2.bat
        - ~2.msi
        - ~2.vbe
        - ~2.vbs
        - ~2.dll
        - ~2.ps1
        - ~2.js
        - ~2.hta
      filter:
      - ParentImage|endswith:
        - \WebEx\WebexHost.exe
        - \thor\thor64.exe
      - CommandLine|contains: C:\xampp\vcredist\VCREDI~1.EXE
      condition: selection and not filter
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - ~1.exe
        - ~1.bat
        - ~1.msi
        - ~1.vbe
        - ~1.vbs
        - ~1.dll
        - ~1.ps1
        - ~1.js
        - ~1.hta
        - ~2.exe
        - ~2.bat
        - ~2.msi
        - ~2.vbe
        - ~2.vbs
        - ~2.dll
        - ~2.ps1
        - ~2.js
        - ~2.hta
      filter:
      - ParentImage|endswith:
        - \WebEx\WebexHost.exe
        - \thor\thor64.exe
      - CommandLine|contains: C:\xampp\vcredist\VCREDI~1.EXE
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - ~1.exe
        - ~1.bat
        - ~1.msi
        - ~1.vbe
        - ~1.vbs
        - ~1.dll
        - ~1.ps1
        - ~1.js
        - ~1.hta
        - ~2.exe
        - ~2.bat
        - ~2.msi
        - ~2.vbe
        - ~2.vbs
        - ~2.dll
        - ~2.ps1
        - ~2.js
        - ~2.hta
      filter:
      - ParentImage|endswith:
        - \WebEx\WebexHost.exe
        - \thor\thor64.exe
      - CommandLine|contains: C:\xampp\vcredist\VCREDI~1.EXE
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated activity across multiple endpoints. If the same user triggered similar short-name or follow-on activity on several hosts, the scope of the activity may be larger than a single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - ~1.exe
        - ~1.bat
        - ~1.msi
        - ~1.vbe
        - ~1.vbs
        - ~1.dll
        - ~1.ps1
        - ~1.js
        - ~1.hta
        - ~2.exe
        - ~2.bat
        - ~2.msi
        - ~2.vbe
        - ~2.vbs
        - ~2.dll
        - ~2.ps1
        - ~2.js
        - ~2.hta
      filter:
      - ParentImage|endswith:
        - \WebEx\WebexHost.exe
        - \thor\thor64.exe
      - CommandLine|contains: C:\xampp\vcredist\VCREDI~1.EXE
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the parent-child process pairs around the alert reveals the immediate context, what led to this event and what followed. Look for reconnaissance, privilege escalation, or staging activity that frames the short-name reference within a larger sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal the stages that preceded this event and help reconstruct the timeline. Short-name obfuscation is itself an evasion step, so prior alerts can show what the operator was trying to hide.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were any Alternate Data Streams created on this host around the time of the alert, and what processes wrote them?
  context: The primary technique covers hiding artifacts in NTFS metadata, including Alternate Data Streams written with colon syntax such as file.ext:streamname. The endpoint agent records these as ordinary file-creation events with the stream name embedded in the path — there is no stream hash, so this establishes the write and the writing process, not what the stream holds. Correlating stream creation with the alert window strengthens the malicious context, since data hidden in a stream and then referenced by a short name is a common pairing. Legitimate stream usage by system or antivirus tools can be excluded once the writing process is known.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_stream:
        TargetFilename|re: ':[A-Za-z0-9_$.]+$'
      condition: selection and selection_stream
    fields:
      - Image
      - TargetFilename
      - User
- question: What scriptable or executable files were created on this host around the alert, and do any sit at short-name resolvable paths?
  context: The technique hides files for later execution, so correlating file creation with the short-name command line shows whether a payload was staged just before it was referenced. Focus on the sensitive, scriptable extensions the rule keys on (exe, bat, msi, vbe, vbs, dll, ps1, js, hta) and on user-writable directories where a high-entropy long name collapses to a single guessable short name.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith:
          - .exe
          - .bat
          - .msi
          - .vbe
          - .vbs
          - .dll
          - .ps1
          - .js
          - .hta
      condition: selection
    fields:
      - Image
      - TargetFilename
      - User
