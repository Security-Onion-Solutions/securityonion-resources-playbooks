name: Suspicious LNK Command-Line Padding with Whitespace Characters
id: 4999512b-9e12-442d-9ec0-fdac0ec53c55
description: |
  Detects a child process spawned from Windows Explorer via a .lnk shortcut whose command line contains long runs of
  whitespace or non-printable characters (space, tab, line feed, vertical tab, form feed, carriage return). The .lnk
  command-line argument field holds up to 4096 characters while the shortcut Properties UI only shows about 260, so an
  operator can pad the visible portion with whitespace and push a malicious command past what a user can see while the
  full argument is still parsed and executed. The rule fires when both the parent lineage (explorer.exe with a .lnk in
  its command line) AND the whitespace-padding pattern in the child command line match. Investigation should decode the
  hidden command, identify the .lnk file and how it reached the host, and determine whether the spawned binary and its
  follow-on activity are benign.
type: detection
detection_id: dd8756e7-a3a0-4768-b47e-8f545d1a751c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the alerting process show explorer.exe launching it via a .lnk shortcut with whitespace-padded arguments?
  context: Confirm the alert is a true positive before investing time. The rule requires both conditions together - the parent
    is explorer.exe with a .lnk path in its command line, AND the child command line carries long runs of whitespace or
    non-printable characters (space, tab, line feed, vertical tab, form feed, carriage return). Review the full parent and
    child command lines and note the padded segment that the shortcut Properties UI would have hidden from the user.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - CommandLine
- question: Is this user and host expected to open shortcuts that launch command interpreters or scripting hosts?
  context: Legitimate shortcuts that pass arguments to a target binary exist (installers, vendor helpers, admin tooling),
    but a shortcut whose arguments are deliberately padded out of UI view is rarely benign. Knowing whether this user role
    and host function routinely run such shortcuts is often the fastest way to separate a true positive from an unusual but
    sanctioned workflow.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the full hidden command after the whitespace padding, and what does it do?
  context: The padding only hides the command from the shortcut Properties view - the full argument is parsed and executed.
    Strip the leading whitespace runs and decode whatever follows. Look for an interpreter or proxy-execution binary (mshta,
    rundll32, regsvr32, powershell, cmd, wscript, cscript) and decode any encoded payload, remote URL or UNC path, or
    secondary file it pulls down or writes.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is explorer.exe expected to spawn this child here, and what spawned explorer.exe?
  context: The explorer-to-child relationship via a .lnk is the core signal. A user double-clicking a shortcut produces this
    lineage legitimately, so trace the parent's own origin - whether explorer was the interactive desktop shell or was spawned
    by an archiver, mail client, or browser handing off a downloaded shortcut points to how the .lnk reached execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What .lnk file was opened, and how did it reach this host?
  context: This execution chain typically begins with a shortcut delivered as an email attachment, inside a ZIP or ISO
    archive, or downloaded from a link. Read the .lnk path and filename from the parent command line, then determine how it
    arrived - sender, archive, or download source - so the same shortcut can be blocked and other recipients identified.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: What other child processes did the same explorer.exe instance spawn around this time?
  context: If a malicious shortcut drove this execution, the same parent instance may have launched additional processes -
    a decoy document opened for the user, a downloader, or a persistence step. Multiple unusual children from the same parent
    around the alert time points to orchestrated activity rather than a one-off user action.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What did the spawned process do in the hours after it launched?
  context: User-execution chains continue after the initial launch - the spawned binary may download a payload, write files
    to user-writable paths, or hand off to a further child for the next stage. Tracking activity from this lineage forward
    reveals the full scope of what the shortcut set in motion.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Are the .lnk file and any files it referenced still on disk for analysis?
  context: If the shortcut or a payload it pulled down or dropped is still present, it can be hashed, submitted for analysis,
    or parsed to recover the full command-line argument and shortcut metadata directly. Files in user-writable staging paths
    (Downloads, Temp, Desktop, AppData) are the ones most likely tied to this execution.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Does the .lnk file carry a Mark-of-the-Web alternate data stream indicating it came from the internet?
  context: Shortcuts delivered by email, download, or archive extraction often carry a Zone.Identifier alternate data stream
    recording an internet origin. The endpoint agent records this stream write as an ordinary file-creation event, with the
    Zone.Identifier stream name appended to the .lnk path — there is no content field on it, so this confirms the mark's
    presence, not what the shortcut points to. A .lnk with that stream was not created locally and reached the host from an
    external source, which strengthens the case that this was user-opened delivered content rather than a sanctioned local
    shortcut. MOTW writes are comparatively sparse fleet-wide, so this looks across a wide window.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: .lnk
      selection_motw:
        TargetFilename|contains: ':Zone.Identifier'
      condition: selection and selection_motw
    fields:
      - TargetFilename
      - Image
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - ParentImage|endswith: \explorer.exe
      - ParentCommandLine|contains: .lnk
      selection_cmd:
      - CommandLine|contains:
        - '                 '
        - \u0009
        - \u000A
        - \u0011
        - \u0012
        - \u0013
        - \u000B
        - \u000C
        - \u000D
      - CommandLine|re: \n\n\n\n\n\n
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - ParentImage|endswith: \explorer.exe
      - ParentCommandLine|contains: .lnk
      selection_cmd:
      - CommandLine|contains:
        - '                 '
        - \u0009
        - \u000A
        - \u0011
        - \u0012
        - \u0013
        - \u000B
        - \u000C
        - \u000D
      - CommandLine|re: \n\n\n\n\n\n
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: After identifying the actor, check their activity across all hosts in the surrounding window. The same user
    triggering similar activity on multiple endpoints points to a wider scope of compromise rather than a single opened
    shortcut.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - ParentImage|endswith: \explorer.exe
      - ParentCommandLine|contains: .lnk
      selection_cmd:
      - CommandLine|contains:
        - '                 '
        - \u0009
        - \u000A
        - \u0011
        - \u0012
        - \u0013
        - \u000B
        - \u000C
        - \u000D
      - CommandLine|re: \n\n\n\n\n\n
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did this same rule fire for other users or hosts recently?
  context: Shortcut-delivery campaigns rarely target a single user. If one person opened a padded .lnk, others may have
    received the same lure. Correlating this detection across hosts and users reveals delivery breadth and identifies
    additional systems that need investigation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining process activity around the alert time reveals what led to this
    execution and what followed - reconnaissance, additional payloads, or persistence. Aggregating by image and parent
    collapses routine agent noise into high-count rows so novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - reconnaissance, defense tampering, or credential access - may reveal the
    attack stages that preceded this execution and help reconstruct the timeline. The sequence of alerts often tells the
    story of how the host reached this point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Is the application that handed off the shortcut up to date?
  context: Some delivery chains lean on a vulnerable handler (archiver, mail client, or browser) to write or open the .lnk
    with reduced prompting. Confirming the parent application's patch level helps establish whether a known weakness eased
    delivery and whether other similarly unpatched hosts are exposed to the same lure.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
