name: Potential Persistence Via Outlook Home Page
id: 0f0a3d7d-ccc9-4b2e-8521-7b8b18be20cf
description: |
  Detects a URL value written under an Outlook folder's WebView registry key
  (HKCU\Software\Microsoft\Office\<version>\Outlook\WebView\<Folder>\URL). This legacy
  folder home page feature causes Outlook to fetch and render the configured URL's HTML
  whenever the user opens that folder, and script embedded in that HTML (VBScript/JScript)
  runs in outlook.exe's trusted context, giving an attacker code execution and persistence
  from a single non-privileged registry change. Legitimate use is rare and limited to
  administrators pointing folders at an internal page; investigate the URL that was set,
  which process wrote it, and whether Outlook subsequently fetched or executed it.
type: detection
detection_id: ddd171b5-2cc6-4975-9e78-f0eccd08cc76
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Do the Outlook WebView registry key path and the home page URL value match what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact
    key path (TargetObject) ending in \URL under an ...\Outlook\WebView\<Folder> location, the URL written
    to the value (Details), and the writing process against the rule's detection criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to configure an Outlook folder home page?
  context: Configuring a folder home page URL is a rare, legacy action; most users and endpoints never touch
    these keys. Knowing whether the user's role (for example, an admin performing a documented Outlook
    configuration) and the host's function fit this change is often the fastest true-positive/false-positive
    split. User attribution is present on most endpoint registry events; when it is a machine account or
    missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which process wrote this Outlook WebView value, and what started that process?
  context: The writing process is the core attribution signal. A legitimate change comes from expected tooling
    (reg.exe or regedit.exe under an admin session, or Outlook itself); an unsigned binary, a script host such
    as wscript.exe or powershell.exe, or an unusual parent chain points to an implant. Tracing the parent's
    own origin shows whether the write came from an interactive admin action or an automated foothold.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does the user or an administrator recall setting an Outlook folder home page?
  context: Direct confirmation from the account owner is often the fastest legitimacy check for a rarely used
    feature. If no one recalls pointing an Outlook folder at a web page, the credentials may be compromised or
    the write was automated. If someone does recall it, capture which URL was configured and why.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What specific Outlook WebView key and URL value were written, and is this a known persistence location?
  context: The WebView\<Folder>\URL value is a documented but legacy persistence and execution location; Outlook
    renders the URL's HTML when the folder is opened, so a value here executes attacker-controlled content in
    outlook.exe's context. The specific folder (Inbox, Calendar, Tasks, and similar), the Office version
    (14.0/15.0/16.0), and the URL data together determine what loads and runs.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What URL was written to the home page value, and what does it fetch?
  context: The Details field holds the home page URL. Examine its scheme and destination, whether an external
    http/https address, a UNC/WebDAV path, or a local file, since Outlook fetches and renders whatever it points
    to and runs any embedded VBScript/JScript. Treat an unfamiliar external or UNC destination as
    attacker-controlled until proven otherwise; if it resolves to HTML, review that content in a safe environment.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Does the home page value persist or get rewritten over time on this host?
  context: The mechanism stays active as long as the value is present, so it survives reboots by design.
    Endpoint telemetry emits no registry deletion events, so cleanup cannot be confirmed directly; instead judge
    persistence from the key's re-modification history over a longer window and from whether the configured URL
    was actually loaded. Staged frameworks deliberately update the URL after repeated check-ins, so a value that
    changes over time is itself notable.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Did Outlook load and execute the home page URL after the value was written?
  context: A folder home page only runs when Outlook opens that folder and renders the URL. Execution typically
    surfaces as outlook.exe spawning a script host or shell (wscript.exe, cscript.exe, powershell.exe, mshta.exe,
    cmd.exe, or rundll32.exe) or as outlook.exe reaching out to fetch the page. Child processes under outlook.exe
    in the hours after the write indicate the home page rendered and its script executed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\outlook.exe'
        Image|endswith:
          - '\wscript.exe'
          - '\cscript.exe'
          - '\powershell.exe'
          - '\mshta.exe'
          - '\cmd.exe'
          - '\rundll32.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Did the process that wrote the registry value also drop files to disk in the same session?
  context: Some home page setups reference a locally staged script or HTML file rather than a remote URL, and the
    writing process may drop supporting payloads alongside the registry change. Correlating file activity by the
    writing process and its children surfaces any such files. The file-write event carries no hash; if a payload
    is present, hash it from a later execution for a reputation lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other registry modifications were made on this host in the same session?
  context: A hands-on foothold often stacks changes, such as setting the home page URL alongside enabling the feature via
    EnableRoamingFolderHomepages or NonDefaultStoreScript, altering macro-loading keys, or adding other
    persistence. Registry changes from the same writing process in a short window reveal the full scope of the
    configuration tampering.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has this Outlook WebView URL value been set on this host before?
  context: A first-time write to a WebView\<Folder>\URL key is more notable than a routine change; these keys
    should essentially never change on a normal endpoint. Zero prior history over the baseline window indicates
    the persistence was newly introduced rather than a long-standing internal configuration.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was the same Outlook WebView URL key modified on other hosts?
  context: The same modification across many hosts can indicate a pushed configuration or a widespread implant; a
    single host points to targeted persistence. Comparing the URL values set across hosts distinguishes a uniform
    internal page from per-host attacker URLs, which staged frameworks generate individually.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the registry write?
  context: Alerts rarely occur in isolation. Process activity in the minutes around the registry write reveals
    what led to it and what followed, such as reconnaissance, credential access, or additional persistence, and
    whether the write is part of a larger sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Were other process-based persistence mechanisms installed on this host?
  context: Attackers rarely rely on a single foothold. After configuring the Outlook home page, they commonly add
    backup persistence via scheduled tasks, services, registry Run keys, or BITS jobs. Multiple persistence
    installations in the same timeframe indicate intentional stacking rather than isolated administration.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access,
    may reveal the stages that preceded the persistence setup and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
