name: Process Explorer Driver Creation By Non-Sysinternals Binary
id: 6969019f-a633-4129-b448-1bb092cc96d0
description: |
  Detects a Windows process other than Process Explorer itself writing a Process Explorer kernel driver -- a file whose name contains PROCEXP and ends in .sys, typically procexp152.sys -- to disk. The genuine, Microsoft-signed Process Explorer driver is abused in bring-your-own-vulnerable-driver operations: a tool drops the signed driver, registers and loads it as a kernel service, and uses its kernel access to close the handles of protected security or antimalware processes and terminate them, often deleting the driver afterward. Investigate the writing process and its command line, whether the driver was loaded and used to tamper with protected processes, and whether the drop is instead a legitimate renamed Process Explorer binary.
type: detection
detection_id: de46c52b-0bf8-4936-a327-aace94f94ac6
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the created file match the Process Explorer driver name pattern, and is the creating process something other than Process Explorer itself?
  context: Before investing investigation time, confirm the alert is a true positive. The file name should end in .sys and contain the PROCEXP driver pattern (typically procexp152.sys), and the responsible process should not be a legitimate Process Explorer binary (procexp.exe, procexp64.exe, procexp64a.exe). A genuine renamed Process Explorer is the main benign explanation for this pattern.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to write a kernel driver to disk?
  context: Legitimate administrative activity can trigger this detection, but writing a .sys driver via a process that is not a driver-management tool is unusual on most endpoints. Judge by the writing process and the host role; when the account is a machine or service account, weigh the writing process rather than the user identity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What command line did the process that wrote this driver run?
  context: The dropping process is the suspected tool. Its command line reveals the operation -- for example a target process name and a handle-close or kill flag. This class of tooling drops the signed Process Explorer driver, loads it, and instructs it to close the handles of an endpoint-protection or antimalware process. Decode the arguments to identify what protected process was targeted and how the driver was invoked.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is the dropped .sys file the legitimate signed Process Explorer driver, or a modified or unexpected driver?
  context: Read the dropped driver's content and signature. The genuine Process Explorer driver (procexp152.sys) is Microsoft-signed, and abuse typically drops that exact legitimate signed driver to leverage its kernel access, so a valid Microsoft signature does not clear the alert. Confirm the file is the expected driver, note its size and signer, and treat an unsigned or altered driver as higher severity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What is the hash of the process that dropped this driver, and does it have known threat-intel detections?
  context: The dropped driver is often the legitimate signed Process Explorer driver, so its reputation is not the discriminator -- the tool that dropped it is. File-creation events carry no hash, so this pivots to the writing process's execution record to read its hash. Submit that hash to threat intelligence to determine whether the dropping binary is known offensive tooling, benign software, or previously unseen.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: What process spawned the tool that dropped this driver, and is that parent chain expected?
  context: The parent process reveals how the dropping tool was invoked. Legitimate driver management has predictable parents; unusual parents such as script hosts, Office applications, or remote-execution utilities suggest the dropper was delivered or launched by an earlier stage of an intrusion.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: After the driver was written, what did the responsible process do next?
  context: The abuse sequence continues after the drop -- the driver is registered as a service and loaded into the kernel, then the tool closes the handles of a protected security or antimalware process to terminate it. Check the dropping process's subsequent child processes for service-control activity, and watch for an endpoint-protection process on this host stopping shortly after the drop.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other files did the process that dropped this driver write or delete around the alert?
  context: A process that drops one driver often stages more -- a service configuration, additional payloads, or output files. The breadth and paths of the writer's other file activity distinguish a single artifact from broader tooling, and a deletion of the driver shortly after creation is the cleanup signature this abuse leaves behind.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Is the driver still on disk, or was it deleted or renamed after the alert?
  context: The driver's post-alert lifecycle drives next steps. This tooling commonly drops the driver, uses it, then deletes it within moments, so a deletion shortly after creation shifts the investigation toward what executed in between and toward recovering the driver from the writing process's path or from backups. A driver still on disk can be retrieved, hashed, and analyzed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has this driver file been written on this host before?
  context: A file that has never been seen written on a host is more suspicious than one that is part of normal operations. First-time appearance of a Process Explorer driver write on a host, outside of genuine Process Explorer use, is a meaningful deviation. Zero or very low historical counts indicate a first-time or rare event.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Were other persistence mechanisms, including driver service registration, installed on this host around the alert?
  context: Loading a kernel driver requires registering it as a service under the registry Services key, often via sc.exe or direct registry writes, and attackers commonly stack additional persistence alongside the foothold. This surfaces service-control, scheduled-task, and registry tooling executed on the host within the surrounding window so stacked mechanisms stand out.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Around the time of the driver drop, were special or driver-loading privileges assigned to a logon on this host?
  context: Loading a kernel driver requires elevated privileges such as the load-driver and debug privileges. Special-privilege assignment events on this host in the same window as the driver write help confirm whether a process obtained the rights needed to register and load the driver, and which account held them. If Security channel privilege events are not collected in this environment, treat absence as a visibility gap rather than evidence nothing occurred.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 4672
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - SubjectUserName
      - PrivilegeList
- always_include: true
  question: Has this user previously produced this driver-drop pattern, and does that history fit their role?
  context: The query mirrors the rule's detection scoped to this user -- a 90-day history of this user writing a Process Explorer driver via a non-Sysinternals binary, aggregated by host. A user who has never produced this pattern is more suspicious than one who does so as part of a known role; a driver-writing pattern rarely fits a standard user account.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|contains: \PROCEXP
        TargetFilename|endswith: .sys
      filter_main_process_explorer:
        Image|endswith:
        - \procexp.exe
        - \procexp64.exe
        - \procexp64a.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this driver-drop pattern on this host or across the environment, or is the program new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute the behavior. The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection scoped to the alerting program, so the result is the 90-day history of this program driving this driver-drop pattern. A new or rare program for this pattern is the deviation worth chasing; a program that already accounts for many prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|contains: \PROCEXP
        TargetFilename|endswith: .sys
      filter_main_process_explorer:
        Image|endswith:
        - \procexp.exe
        - \procexp64.exe
        - \procexp64a.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around the time of the driver drop?
  context: Tracking the user's activity across all hosts reveals lateral movement or tooling run on multiple endpoints. If the same user triggered similar activity on other hosts around this time, the scope of the compromise may be larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven driver-drop pattern fire on other hosts in the same window, or is it isolated to this host?
  context: 'Under a service principal, asking what else the user did across the network returns agent-telemetry noise. The meaningful question is whether the same launch mechanism dropped the driver elsewhere: the query mirrors the rule''s selection scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|contains: \PROCEXP
        TargetFilename|endswith: .sys
      filter_main_process_explorer:
        Image|endswith:
        - \procexp.exe
        - \procexp64.exe
        - \procexp64a.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this driver was dropped?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- defense tampering, reconnaissance, or credential access -- may reveal the stages that preceded the driver drop and help reconstruct the full timeline of the operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
