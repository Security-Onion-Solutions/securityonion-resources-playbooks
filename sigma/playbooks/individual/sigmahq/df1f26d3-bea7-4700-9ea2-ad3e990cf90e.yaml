name: Node Process Executions
id: b6ed3beb-54ba-40c5-a7e5-768cf3a126db
description: |
  Detects the node.exe interpreter bundled with Adobe Creative Cloud Experience running a script other than the vendor's own JavaScript. The rule fires when the executing image ends in \Adobe Creative Cloud Experience\libs\node.exe AND the command line does NOT reference the legitimate Adobe Creative Cloud Experience\js path. A signed, locally present Node runtime is a trusted developer utility that an operator can repurpose to run arbitrary JavaScript while evading name-based and application-control detections, so the load-bearing question is what script node was pointed at and where it came from. Confirm the full command line and target script, decode any inline or encoded JavaScript, walk the parent and child process chain, and determine whether the activity is isolated to one host or part of a multi-host operation.
type: detection
detection_id: df1f26d3-bea7-4700-9ea2-ad3e990cf90e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- question: Is the executing image the Adobe-bundled node.exe, and is it running a script other than the vendor's own JavaScript?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact image path and command line. The rule fires only when the image ends in \Adobe Creative Cloud Experience\libs\node.exe AND the command line does NOT contain the legitimate Adobe Creative Cloud Experience\js reference. Confirm the image is the bundled Node runtime and note the script path or inline code the command line points at, since that target is what makes this anomalous rather than the binary itself.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is this user and host expected to run the Adobe-bundled Node interpreter against non-Adobe scripts?
  context: Legitimate Creative Cloud operation drives node.exe against the vendor's own js path, which the rule explicitly excludes. A user or host pointing the bundled Node runtime at an arbitrary script is rarely normal end-user behavior. Knowing whether the user role and host function fit script execution through a developer utility is often the fastest way to separate a true positive from a routine operation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What script or inline code did this Node process run, and what does it do?
  context: The full command line reveals the operational purpose. Parse the node.exe invocation to identify the target .js file path or any -e/--eval inline code, and note any URL, file path, or downstream binary referenced. JavaScript run through a trusted developer utility commonly stages a download cradle, a reverse connection, or a loader for a follow-on binary. This payload-analysis step is distinct from confirming the alert matched.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is the script path or command line encoded or obfuscated, and what does the decoded JavaScript do?
  context: 'JavaScript run through a developer utility is frequently obfuscated to hide its intent. Look for inline -e/--eval payloads, base64 or hex blobs, String.fromCharCode chains, character concatenation, escape-sequence encoding, and environment-variable substitution in the command line. Decoding reveals the actual operation: a download cradle, a reverse shell, an in-memory loader, or credential theft. For multi-layer encoding, iterate decoding until the payload is readable.'
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned this Node interpreter and is that parent chain expected?
  context: The parent process reveals how the Node runtime was invoked. Legitimate Creative Cloud activity launches it from the Adobe application stack. An unexpected parent such as a command interpreter, a script host (wscript.exe, cscript.exe, mshta.exe), an Office application, or a browser is a strong reason to walk the chain upward and check what spawned the parent and what else that parent did.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did this Node interpreter spawn afterward?
  context: The processes spawned afterward reveal the actual impact of the script. Look for follow-on command interpreters (cmd.exe, powershell.exe), proxy-execution binaries (rundll32.exe, regsvr32.exe), download utilities (certutil.exe, curl.exe), or a freshly written binary executed from a user-writable path. A short interval between the Node execution and a child process making an external connection is the canonical second-stage pattern.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run the Adobe-bundled Node interpreter?
  context: A process that has never been seen on a host is more suspicious than one that recurs. Because the rule already excludes the vendor's own js path, even a low baseline count for this binary is meaningful here. Zero or very low historical counts indicate first-time or rare execution of the bundled Node runtime on this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even a trusted runtime can be repurposed. The query mirrors the rule's full selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern (the bundled node.exe running a non-Adobe script) has historically run here, not generic Node usage. A new parent process, an unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \Adobe Creative Cloud Experience\libs\node.exe
      filter:
        CommandLine|contains: Adobe Creative Cloud Experience\js
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \Adobe Creative Cloud Experience\libs\node.exe
      filter:
        CommandLine|contains: Adobe Creative Cloud Experience\js
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \Adobe Creative Cloud Experience\libs\node.exe
      filter:
        CommandLine|contains: Adobe Creative Cloud Experience\js
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity on more than one host, the scope of the event may be larger than a single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \Adobe Creative Cloud Experience\libs\node.exe
      filter:
        CommandLine|contains: Adobe Creative Cloud Experience\js
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's full selection structure with no host scope, so the result is a fleet-wide count of this firing pattern rather than generic use of the bundled binary. Many hosts firing the same pattern points to scripted deployment or a packaged tool that ships this Node runtime; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \Adobe Creative Cloud Experience\libs\node.exe
      filter:
        CommandLine|contains: Adobe Creative Cloud Experience\js
      condition: selection and not filter
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining the surrounding activity reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, persistence installation, or a payload written shortly before the Node interpreter ran.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as defense tampering, reconnaissance, credential access, or a malicious document opening, may reveal the attack stages that preceded this script execution and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
