name: DarkGate - Drop DarkGate Loader In C:\Temp Directory
id: 1f033ce4-99f2-496e-8de7-6b5d5d089b78
description: |
  This rule detects an AutoIt artifact landing under a C:\Temp directory. It fires when EITHER a file whose
  name ends in .au3 or autoit3.exe is written into a ...\temp\ path, OR a process whose own image is an
  au3/autoit3.exe under ...\temp\ performs file activity. AutoIt-based loaders are a common staging step for
  RAT payloads: a signed autoit3.exe interpreter runs an encrypted .au3 script that decrypts and injects a
  second-stage implant, and C:\Temp is a frequent extraction target for that chain. Confirm whether the
  dropped interpreter and script executed, decode what the script does, and determine what followed on the host.
type: detection
detection_id: df49c691-8026-48dd-94d3-4ba6a79102a8
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: 'Does this file event match the rule: an AutoIt artifact (.au3 or autoit3.exe) written into a C:\Temp path, or an AutoIt process running from C:\Temp?'
  context: The rule fires on either branch, so note which one matched — a written file named .au3 or autoit3.exe under a ...\temp\ path, or a process image that is itself au3/autoit3.exe under ...\temp\ doing file activity. Confirm the exact TargetFilename, the operation performed, and the responsible process before investing further.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - file_event
- question: Is this user and host expected to write AutoIt artifacts into a C:\Temp directory?
  context: Legitimate AutoIt automation exists, but interpreter scripts staged in C:\Temp are rarely part of routine operations on most endpoints. When the writer is a machine or service account, judge by the responsible process and the host's role rather than the account name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What is in the dropped AutoIt artifact, and does its content match a known loader pattern?
  context: Retrieve and inspect the file. An .au3 script is text, so look for obfuscation, embedded or encrypted blobs, marker strings that delimit a payload, and environment or sandbox checks. If the artifact is autoit3.exe itself, confirm whether it is the genuine signed interpreter or a renamed or patched binary. Content retrieval is manual from the endpoint.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
- question: If the dropped artifact executed, what is its hash and does it have known threat-intel detections?
  context: A file's hash is recorded when it runs, not when it is written, so this looks for the artifact executing and reads its hash for a reputation lookup. For the script branch, execution appears as autoit3.exe with the .au3 path on its command line rather than the .au3 as an image, so check both. If the artifact is present but has not executed, hash it manually from its on-disk path.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: Did AutoIt execute the dropped script, and what was on its command line?
  context: The loader chain completes when the interpreter runs the script. This surfaces autoit3.exe executions and any process whose command line references a .au3 file on this host, revealing the script path passed to the interpreter and how it was launched. The command line often carries the script location and staging arguments.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_interpreter:
        host.name|expand: '%hostname%'
        Image|endswith: '\autoit3.exe'
      selection_script_arg:
        host.name|expand: '%hostname%'
        CommandLine|contains: '.au3'
      condition: 1 of selection_*
    fields:
      - Image
      - CommandLine
      - ProcessGuid
      - ParentImage
  answer_sources:
  - process_creation
  - manual_review
- question: What did the process responsible for the drop spawn afterward?
  context: The processes launched after the drop reveal the loader's actual impact. AutoIt-based loaders frequently follow extraction with injection into or spawning of another process, and interpreters or shells launched afterward can carry the next stage.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What process spawned the process that dropped this artifact, and is that lineage expected?
  context: The parent of the writing process shows how the drop was reached. Loader chains commonly arrive via a sideloaded or masqueraded process launched from an installer or a browser download, so an unexpected parent such as an installer utility, a script host, or a signed application loading an untrusted library is worth tracing upward.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Is the dropped artifact still on disk, or was it deleted or renamed after the alert?
  context: The artifact's post-alert lifecycle drives next steps. A loader still on disk can be retrieved, hashed, and analyzed; one deleted seconds after creation points to self-cleanup or a self-deleting stager and shifts focus to what executed in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What other files did the responsible process write or delete around the alert?
  context: A loader stub often extracts several components at once — an interpreter, an encrypted script, and helper libraries split from a single blob. The breadth, paths, and extensions of the writer's other file activity distinguish a single artifact from a full staging operation and enumerate what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: What else has been written to the temp directory recently, and by which processes?
  context: C:\Temp is a frequent extraction target for staged loaders. Other recent arrivals in the same directory reveal whether this is an isolated drop or a location under active use, and which other artifacts belong to the same activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: ':\temp\'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Has this artifact been written to this host before, or is this its first appearance?
  context: A file that has never been seen on a host is more suspicious than one that is part of normal operations. First appearance of an AutoIt interpreter or script under temp, even with an innocuous-looking name, is worth checking.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- always_include: true
  question: Has this user produced this drop pattern before, and does that history fit their role?
  context: This counts the user's 90-day history of the rule's specific pattern — an AutoIt artifact under temp — aggregated by host, rather than generic AutoIt usage. A user who has never produced this pattern is more notable than one who does so routinely; weigh the count against their role and expected toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_filename_suffix:
        TargetFilename|contains: :\temp\
        TargetFilename|endswith:
        - .au3
        - \autoit3.exe
      selection_image_suffix:
        Image|contains: :\temp\
        Image|endswith:
        - .au3
        - \autoit3.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this program historically driven this drop pattern, or is the program new for this activity?
  context: When the alert fires under a machine or service account, user identity does not attribute the behavior — the launch mechanism does. This counts the 90-day history of the alerting program driving this specific pattern, by host. A new or rare program for this pattern is the deviation worth chasing; a program already responsible for many prior events is more likely automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_filename_suffix:
        TargetFilename|contains: :\temp\
        TargetFilename|endswith:
        - .au3
        - \autoit3.exe
      selection_image_suffix:
        Image|contains: :\temp\
        Image|endswith:
        - .au3
        - \autoit3.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user do across the environment around this time?
  context: Tracking the user's activity across all hosts in the alert window reveals whether the same account drove related activity elsewhere. Concurrent activity on multiple endpoints widens the likely scope of the event.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same program-driven drop pattern fire on other hosts in the same window?
  context: Under a service principal, a user-wide pivot returns agent-telemetry noise, so the meaningful question is whether the same launch mechanism fired elsewhere. Multiple hosts producing this pattern in the same window points to pushed or scheduled automation; a single host points to a local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_filename_suffix:
        TargetFilename|contains: :\temp\
        TargetFilename|endswith:
        - .au3
        - \autoit3.exe
      selection_image_suffix:
        Image|contains: :\temp\
        Image|endswith:
        - .au3
        - \autoit3.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What other processes ran on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Process activity in a tight window around the drop reveals what led to it and what followed — reconnaissance, additional execution, or persistence — and helps place the event in a sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — download or delivery activity, defense evasion, or execution — may reveal the stages that preceded the drop and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Have other hosts produced this drop pattern in the past week, and does the distribution look like a coordinated rollout or isolated activity?
  context: This counts fleet-wide firings of the rule's pattern — an AutoIt artifact under temp — over the past week, not generic AutoIt usage. Many hosts producing the same pattern suggests a wider delivery campaign; one host or a small unrelated set points to isolated activity.
  range: -7d
  query: |
    aggregation: true
