      category: file_event
      product: windows
    detection:
      selection_filename_suffix:
        TargetFilename|contains: :\temp\
        TargetFilename|endswith:
        - .au3
        - \autoit3.exe
      selection_image_suffix:
        Image|contains: :\temp\
        Image|endswith:
        - .au3
        - \autoit3.exe
      condition: 1 of selection_*
    fields:
    - host.name
  answer_sources:
  - process_creation
