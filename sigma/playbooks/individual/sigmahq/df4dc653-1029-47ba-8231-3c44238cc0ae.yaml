name: Potential Persistence Using DebugPath
id: bb7a1149-c8dd-43e4-bee4-ee252feca9b5
description: |
  Detects a registry write that configures Universal Windows Platform (Appx) debugger persistence. The rule fires when a registry
  modification targets EITHER a DebugPath value under a package's ActivatableClasses DebugInformation key (TargetObject contains
  'Classes\ActivatableClasses\Package\Microsoft.' and ends in '\DebugPath'), OR the (Default) value under a PackagedAppXDebug package
  key (TargetObject contains '\Software\Microsoft\Windows\CurrentVersion\PackagedAppXDebug\Microsoft.' and ends in '\(Default)').
  Either value stores a command that Windows launches when the associated UWP app (Cortana, People, and similar auto-start apps) is
  activated at logon, so an attacker who points it at an arbitrary binary gains logon persistence that Autoruns does not surface.
  The investigation should decode the referenced command, confirm the payload exists on disk, determine whether it executed, and
  establish who wrote the key and whether the change was authorized.
type: detection
detection_id: df4dc653-1029-47ba-8231-3c44238cc0ae
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting registry write match either DebugPath persistence key this rule detects?
  context: >-
    The rule fires on either of two branches, so confirm which one matched before investing time. Branch one is a DebugPath value
    under 'Classes\ActivatableClasses\Package\Microsoft.<package>\DebugInformation\<AppXid>.mca'. Branch two is the (Default) value
    under 'Software\Microsoft\Windows\CurrentVersion\PackagedAppXDebug\Microsoft.<package>'. Note which branch fired and read the
    exact TargetObject and its value data, since the branch determines where the launch command is stored.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to configure Appx debugger settings?
  context: >-
    Legitimate DebugPath or PackagedAppXDebug writes are almost exclusively developer or QA activity on a workstation running the
    Windows SDK tooling. On a server, a shared kiosk, or a standard user's endpoint they are unusual. Confirm whether the writing
    account and host role are consistent with UWP application debugging. When User is a machine account or missing, pivot on the
    writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the modified key a known UWP debugger persistence location rather than a routine Appx setting?
  context: >-
    Both branches this rule detects are event-triggered execution locations: a DebugPath value or a PackagedAppXDebug (Default)
    value stores a command that runs when the associated UWP app activates at logon. This is the modern equivalent of Image File
    Execution Options debugger hijacking and is not surfaced by autorun inventory tooling. Confirm the exact key, the value data,
    and the writing process, and judge whether this path is a legitimate debugging setting or a persistence anchor.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What command or binary path is stored in the value, and where does it point?
  context: >-
    The value data (Details) holds the command Windows runs at UWP app activation, commonly a full path such as
    'C:\Windows\System32\cmd.exe' but potentially any executable. Decode the value and note the target path. A path under Temp,
    AppData, ProgramData, or a user-writable directory, or one pointing at a script host, is a strong indicator the entry was
    planted for persistence rather than genuine debugging. The path recovered here becomes the payload to trace on disk and in
    execution telemetry.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Were other registry modifications made on this host in the same session?
  context: >-
    Attackers who set one persistence anchor often make several changes together. A DebugPath write landing alongside Run-key,
    Services, Winlogon, or security-policy modifications from the same user in a short window points to a hands-on session or an
    installer-style implant rather than an isolated developer action. The triggering key appears in the results; the signal is
    what else was modified around it.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Is the binary referenced by the value present on disk, and does the change survive reboot?
  context: >-
    UWP debugger persistence is only effective if the referenced binary exists at the path stored in the value. If the value points
    at a dropped payload, confirming the file was written at that path determines whether the persistence is armed and what would
    run at the next logon. Correlate file activity to the registry-writing process and its children, since the payload usually lands
    in the same session. Registry key and value deletion events are not emitted by endpoint telemetry in this environment, so do not
    judge cleanup by whether the key was removed; judge persistence from the value data, the payload's presence on disk, and the
    re-modification history.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did the binary referenced by the value run after the key was written?
  context: >-
    The configured command executes when the associated UWP app is activated, which for
    auto-start apps like Cortana or People happens at the next logon. The query anchors on the
    command stored in the value data, so it returns executions whose command line carries the
    configured binary or command. Execution confirms the persistence is live and the payload
    ran; absence may mean the app has not activated yet, the entry targets a package version not
    installed on this host, or the payload was launched with arguments differing from the stored
    value — in that case compare the path recovered by the value-decode question against process
    telemetry manually.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|expand: '%Details%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this DebugPath or PackagedAppXDebug key been modified before on this host?
  context: >-
    UWP debugger keys should rarely change outside active development. A first-time or one-off modification is more suspicious than
    a key that a developer touches routinely. Compare historical value data to see whether the same command was set before or
    whether this write is new, which helps calibrate severity and tune which package paths are expected to change on this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same key modified on other hosts in the environment?
  context: >-
    The same UWP debugger key changing across many hosts may indicate a software deployment, a management-tool action, or widespread
    implantation; a change confined to this one host is more likely targeted. Comparing the value data across hosts shows whether
    the same command is being planted everywhere or whether values differ, and it establishes whether this path is routinely
    modified fleet-wide, which informs how tightly to monitor it.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What process wrote this registry key, and what started that process?
  context: >-
    The writing process reveals how the key was set. Purpose-built tooling (plmdebug.exe attaching a debugger) or a manual reg add
    from a shell each tell a different story, and tracing the writer's own parent shows whether the chain is an interactive
    developer action or a scripted or remotely driven session. A writer launched from a script host, an Office application, or a
    remote-execution service is a suspicious origin for a debugger persistence write.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    Attackers rarely rely on a single persistence anchor. After planting a UWP debugger entry, they commonly add backups using
    scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions. Multiple persistence installations in the same
    timeframe indicate intentional stacking rather than an isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations on this host around the same time?
  context: >-
    File-based persistence bypasses command-line detection entirely. Dropping an executable or script into the Startup folder or a
    path referenced by a registry Run key achieves persistence without running standard persistence tools. File event monitoring
    captures these drops even when the attacker avoids schtasks, sc, or reg, and pairs naturally with the UWP debugger payload the
    value points at.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining process activity in a tight window around the registry write reveals what led to
    it and what followed, including reconnaissance, privilege escalation, or payload staging. Aggregating by process and parent
    collapses routine agent noise into high-count rows so that novel parent-child pairs stand out.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal the attack
    stages that preceded this persistence write and help reconstruct the timeline. Persistence is typically established after an
    initial foothold, so preceding alerts often frame how the actor arrived.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was there a change ticket, maintenance window, or documented approval for this action?
  context: >-
    UWP debugger configuration is normally deliberate developer activity. A corresponding change ticket or a known development or
    packaging effort suggests authorized work; absence of one when policy requires it points toward unauthorized persistence. This
    check can quickly close a false positive or escalate a true positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the user or administrator recall configuring Appx debugging on this host?
  context: >-
    Direct confirmation from the account holder is often the fastest path to legitimacy. A developer who recalls attaching a
    debugger to a UWP app explains the write; if no one recalls the action, the credentials may be compromised or the activity may
    be automated. If the user confirms, capture why and which application they were debugging.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
