- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Enumeration rarely happens in isolation. Earlier detections on the same host — defense tampering, initial access, credential access — may reveal the attack stages that preceded this reconnaissance and help reconstruct the timeline. Discovery activity following a prior execution or access alert shifts the disposition toward an active operation.
