name: Renamed AdFind Execution
id: 42ca5b75-3332-4668-9820-31d8d373ed97
description: |
  Detects execution of AdFind under a non-AdFind.exe filename. The rule fires when EITHER the command line carries AdFind reconnaissance syntax (trustdmp, objectcategory=, -subnets -f, computers_pwdnotreqd, and similar shortcut queries), OR the import hash matches a known AdFind build, OR the PE OriginalFileName is AdFind.exe — while the on-disk filename is NOT AdFind.exe. AdFind is a legitimate dual-use Active Directory query utility, but renaming it is a common evasion against tools that block the canonical binary by name, and AdFind-driven domain recon is a recurring pre-ransomware and lateral-movement staging step. Investigation should confirm the rename/metadata mismatch, decode what AD data was enumerated, establish whether the user, host, and parent process make this routine administration, and map any follow-on activity.
type: detection
detection_id: df55196f-f105-44d3-a675-e9dfb6cc2f2b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does this process match the renamed-AdFind pattern — either AdFind recon command-line syntax, a known AdFind import hash, or an AdFind OriginalFileName while the filename on disk is not AdFind.exe?
  context: >-
    Confirm the alert before investing time. The rule fires on any one of three independent branches, so note which one matched: AdFind shortcut syntax in the command line (trustdmp, objectcategory=, -subnets -f, computers_pwdnotreqd, and similar), a matching import hash, or an embedded OriginalFileName of AdFind.exe — combined with an on-disk name that is not AdFind.exe. Which branch fired determines what follow-up matters most. A command-line-branch fire makes decoding the enumeration arguments load-bearing; a hash-only or OriginalFileName-only fire (no recon syntax visible) means the arguments may be off-screen and the identity-of-binary evidence carries the disposition.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - OriginalFileName
      - CommandLine
      - Hashes
- question: What is the actual identity of this binary based on its metadata and hash?
  context: >-
    The file is named something other than AdFind.exe on disk, but the PE metadata and import hash still reflect the original tool. Compare the Image path (name on disk) against OriginalFileName (embedded metadata) to confirm the rename, and submit the hash for reputation lookup to establish whether this is a known AdFind build, a known malware sample, or a novel binary. The signing chain indicates whether this is a third-party-signed utility, a system binary, or unsigned.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: How did this renamed binary arrive on the host?
  context: >-
    A renamed AdFind binary does not appear spontaneously — it was copied, downloaded, or dropped by another process. Tracing the file-creation event for this filename over a long window reveals the delivery mechanism: a download tool, an archive extraction, a manual copy via remote access, or lateral movement from another host. The process that created the file (Image in the file event) identifies the dropper. A user-writable landing path (Desktop, Downloads, Temp, AppData) points to download or extraction; a staging share points to operator placement.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What did this renamed binary spawn after execution, and is the same renamed binary present on other hosts?
  context: >-
    The purpose of renaming AdFind is to keep running the tool while evading name-based blocking. Child processes, command shells, and output redirection spawned by the renamed binary reveal what it actually did and whether enumeration output was written to disk for collection. The same renamed binary appearing on multiple hosts suggests deliberate distribution rather than an isolated execution. Pair the local child-process view with the metadata/hash identity to confirm scope.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What exactly did this AdFind execution enumerate? Decode the command-line arguments.
  context: >-
    The full command line reveals which Active Directory data was queried. Decode the shortcut syntax — trustdmp dumps trust objects, objectcategory= enumerates persons/computers/subnets, computers_pwdnotreqd and users_noexpire hunt weak accounts, dclist and dcmodes map domain controllers, -subnets -f maps the network, name="Domain Admins" targets privileged groups. Output piping (-csv, -list) and redirection to a file indicate the operator intended to collect the results. This host+binary scope over a short window also surfaces multiple sequential invocations that together form one enumeration sweep.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this discovery command, and is that parent chain expected?
  context: >-
    Legitimate administrative discovery typically runs from cmd.exe spawned by explorer.exe (an interactive admin session) or from a known automation engine. AdFind reconnaissance spawned by Office applications, script interpreters (wscript.exe, cscript.exe, mshta.exe), wmiprvse.exe (WMI remote execution), or wsmprovhost.exe (WinRM remote execution) points to automated post-exploitation rather than hands-on administration. Examine the immediate parent and its command line to judge how the enumeration was initiated.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Is this user expected to run administrative domain-discovery commands?
  context: >-
    Network administrators and IT staff legitimately query Active Directory for troubleshooting and inventory. Standard users and most service accounts rarely run AD enumeration tools. The user's role and typical behavior baseline determine whether this AdFind execution is routine administration or anomalous reconnaissance — a non-admin or unexpected account performing domain trust and account enumeration is the case worth chasing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: Did other reconnaissance commands run on this host around the same time?
  context: >-
    A single AD query may be legitimate, but multiple reconnaissance commands in rapid succession — net.exe, nltest.exe, dsquery.exe, nslookup.exe, csvde.exe, setspn.exe, whoami — is a signature of post-compromise enumeration. Operators run these to map the domain before moving to the next stage. Three or more distinct recon binaries within fifteen minutes typically indicates automated reconnaissance rather than ad-hoc troubleshooting.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: Did this renamed binary make LDAP or directory-service connections to a domain controller?
  context: >-
    AdFind enumerates Active Directory by binding to a domain controller over LDAP (389/636) or the global catalog (3268/3269) — discovery that crosses into network telemetry, not just process arguments. Correlating outbound connections from this process to directory-service ports confirms the enumeration actually reached a DC and identifies which controller was queried, which the command line alone does not show. A host that does not normally talk LDAP to a DC making these connections under a renamed binary is the deviation to chase. If directory-service network telemetry is not collected in this environment, treat zero results as a visibility gap rather than evidence nothing happened, and fall back to the decoded command line for intent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 389
          - 636
          - 3268
          - 3269
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
- question: Does this host normally run this AdFind binary?
  context: >-
    A binary that has never been seen on this host is more suspicious than one that runs regularly. A zero or very low ninety-day count for this renamed binary indicates first-time or rare execution, consistent with operator-introduced tooling rather than an installed administrative utility.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: >-
    Even legitimate AD administration leaves a baseline. The query mirrors the rule's full selection structure scoped to this host, so the parent/user distribution reflects how this specific firing pattern — not generic binary usage — has historically run here. A new parent process, an unexpected user account, or an unusual command-line structure against an otherwise stable baseline is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        CommandLine|contains:
        - domainlist
        - trustdmp
        - dcmodes
        - adinfo
        - ' dclist '
        - computer_pwdnotreqd
        - objectcategory=
        - -subnets -f
        - name="Domain Admins"
        - '-sc u:'
        - domainncs
        - dompol
        - ' oudmp '
        - subnetdmp
        - gpodmp
        - fspdmp
        - users_noexpire
        - computers_active
        - computers_pwdnotreqd
      selection_2:
        Hashes|contains:
        - IMPHASH=BCA5675746D13A1F246E2DA3C2217492
        - IMPHASH=53E117A96057EAF19C41380D0E87F1C2
        - IMPHASH=d144de8117df2beceaba2201ad304764
        - IMPHASH=12ce1c0f3f5837ecc18a3782408fa975
        - IMPHASH=4fbf3f084fbbb2470b80b2013134df35
        - IMPHASH=49b639b4acbecc49d72a01f357aa4930
        - IMPHASH=680dad9e300346e05a85023965867201
        - IMPHASH=21aa085d54992511b9f115355e468782
      selection_3:
        OriginalFileName: AdFind.exe
      filter:
        Image|endswith: \AdFind.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection* and not filter) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What other tools ran on this host around the same time?
  context: >-
    Reconnaissance rarely happens alone. Activity surrounding the AdFind execution may reveal credential access, privilege escalation, persistence installation, or data staging that frames the enumeration as one stage of a multi-step operation. Scan the surrounding process activity for tools that do not fit routine host operation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this firing pattern, not generic usage of the binary. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent/binary consistency to calibrate severity.
