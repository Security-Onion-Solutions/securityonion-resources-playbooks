name: Creation Of Non-Existent System DLL
id: 7de69b1e-67ac-474b-a360-cd523deeb861
description: |
  Detects creation of a DLL bearing the name of a known phantom system library — a library that Windows components reference by name in System32 but that does not ship on disk by default (for example WLBSCTRL.dll, TSMSISrv.dll, oci.dll, offdmpsvc.dll, axeonoffhelper.dll, shellchromeapi.dll, wow64log.dll, and SprintCSP.dll). Because a trusted, signed Windows process resolves and loads that missing library by name at service startup or through a command-line trigger, planting a file at the exact path causes attacker code to execute inside the trusted process, yielding persistence, privilege escalation, or defense evasion. Legitimate writes to these paths are rare and normally come from Windows servicing; the investigation should establish which process wrote the file, whether the DLL subsequently loaded and into what process, and whether the file is a known component or an unrecognized payload.
type: detection
detection_id: df6ecb8b-7822-4f4b-b412-08f524b4576c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the created file path match one of the known phantom system DLL names this rule watches?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact file path and the responsible process against the rule's criteria. The rule fires only when a file is created whose name matches a documented missing System32 library (WLBSCTRL.dll, TSMSISrv.dll, oci.dll, offdmpsvc.dll, axeonoffhelper.dll, shellchromeapi.dll, wow64log.dll, SprintCSP.dll, and similar). Note which name fired, since the loading process and trigger differ per library.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user, host, and writing process expected to create a DLL in a system directory?
  context: Writes into System32 are normally performed by Windows servicing components (TrustedInstaller and its worker process) under SYSTEM, not by interactive users or ad-hoc tools. If the responsible process is a script host, an unpacker, a remote-management agent, or a manually launched administrative binary, the write is out of pattern. When the user is a machine or service account, judge by the writing process and the host's role rather than by the account name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What process created this DLL, and what was its full command line and parent?
  context: The file-creation event carries the responsible process identifiers, so pivoting on them reveals the writer's own command line and lineage. Legitimate System32 DLL writes come from Windows servicing; an unfamiliar writer such as a script interpreter, an archive extractor, or a hand-run administrative tool placing a known phantom DLL name into a system directory is the signal to chase. The command line and parent process indicate whether the drop was scripted, interactive, or driven by an installer.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: What is inside the created DLL, and does it behave like a hijack payload rather than a legitimate library?
  context: Retrieve the file from the endpoint and analyze its content. Phantom DLL payloads typically export the same function names the trusted loader expects (so the host process does not crash) while their DllMain runs the attacker's code; check exported functions, imports, embedded strings, packer signatures, and signing status. A payload often copies an invalid or mismatched digital signature from the legitimate original. Content retrieval is a manual endpoint or forensic step; the query anchors the file event and the writing process for reference.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did the created DLL subsequently load, and into which process?
  context: This is the crux of phantom DLL hijacking. A trusted, signed Windows process resolves the missing library by name and loads whatever is planted at that path, so attacker code runs in that process context. Watch for the DLL loading into a process consistent with the specific name that fired — svchost.exe for WLBSCTRL.dll or TSMSISrv.dll (IKEEXT and SessionEnv services), msdtc.exe for oci.dll, wermgr.exe for offdmpsvc.dll, wpr.exe for axeonoffhelper.dll, DeviceEnroller.exe for shellchromeapi.dll, or svchost.exe hosting StorSvc for SprintCSP.dll. The load may not occur until the triggering service starts or the host reboots, so a wide window is used. The signature fields show whether the loaded module carries a valid signature; phantom payloads frequently present an invalid or mismatched one. If oci.dll is involved, also confirm the loaded filename was not redirected through the MSDTC configuration to a different name.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
      - Signature
- question: If the DLL has loaded, what is its hash and does it have known threat intel or reputation hits?
  context: A DLL records its hash on the module-load event, so if the planted library has been loaded its hash can be read directly and submitted to reputation and threat-intelligence sources to determine whether it is known malicious, a legitimate component, or previously unseen. A baseline of legitimate hashes for these library names helps detect substitution. If the file is present but has not yet loaded, retrieve it from its on-disk path and hash it manually; the signature status field also indicates whether the module is unsigned or carries an untrusted signature.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - SignatureStatus
- question: Is the DLL still on disk, or was it deleted or renamed after the alert?
  context: The file's post-alert lifecycle drives both urgency and next steps. A payload still on disk can be retrieved, hashed, and analyzed; a file deleted seconds after creation suggests anti-forensic cleanup or a stager that removes itself after the trusted process has loaded it. The operation type distinguishes a persistent plant from a transient drop.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was there a change ticket, servicing event, or documented approval that would explain a DLL being written to this system path?
  context: Legitimate arrivals of these libraries are essentially limited to Windows servicing and vendor installers. A corresponding change ticket, patch window, or software-deployment record can quickly close a false positive; the absence of one, when policy requires it for system-directory changes, supports treating the write as unauthorized and escalating.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What other files did the responsible process write or delete around the alert?
  context: A process that drops one phantom DLL often stages more — a loader unpacking components, a toolkit writing several planted libraries, or a dropper delegating writes to a child. The breadth, paths, and extensions of the writer's other file activity distinguish a single artifact from a staging operation and enumerate what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to the System32 directory recently, and by which processes?
  context: Writes into System32 come from a small set of legitimate servicing processes. Other recent arrivals in the same directory reveal whether this is an isolated plant or a location under active use, and which additional artifacts may belong to the same activity. A single unfamiliar writer touching multiple files there is the pattern to isolate. For a library planted outside System32 (such as SprintCSP.dll in a writable PATH directory), re-run this against that directory instead.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\Windows\System32\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has a DLL with this name been seen before on this host or in the environment?
  context: These library names do not exist on a clean system by default, so any prior creation is itself noteworthy. A first-time appearance on the host, or a count of zero over the baseline window, points to a fresh plant; recurring appearances may indicate a persistent foothold that has been re-established or a benign vendor file that has been present for some time. Weigh the count against known-good hashes for the name.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Is a DLL with this name present on any other hosts in the environment?
  context: Finding the same phantom DLL name written across multiple hosts points to distribution through a shared mechanism — a deployment tool, lateral movement, or a repeated hands-on-keyboard action. A single host suggests targeted or opportunistic activity. Where the file appears on many hosts, establish the distribution pattern and timeline.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- always_include: true
  question: Has this user previously produced this file-creation pattern, and does that history fit their role?
  context: The query mirrors the rule's selection scoped to this user, so the result is the user's history of creating one of these phantom DLL names, aggregated by host. A user who has never produced this pattern is more suspicious than one who does so regularly. Weigh the count against the user's role; note that writes to System32 usually run under SYSTEM or a machine account, in which case the account name attributes little and the launch mechanism is the better pivot.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith:
        - :\Windows\System32\axeonoffhelper.dll
        - :\Windows\System32\cdpsgshims.dll
        - :\Windows\System32\oci.dll
        - :\Windows\System32\offdmpsvc.dll
        - :\Windows\System32\shellchromeapi.dll
        - :\Windows\System32\TSMSISrv.dll
        - :\Windows\System32\TSVIPSrv.dll
        - :\Windows\System32\wbem\wbemcomn.dll
        - :\Windows\System32\WLBSCTRL.dll
        - :\Windows\System32\wow64log.dll
        - :\Windows\System32\WptsExtensions.dll
        - \SprintCSP.dll
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this file-creation pattern, or is the program new for this activity?
  context: When the alert fires under a service principal, user identity does not attribute the behavior; the meaningful pivot is the launch mechanism. The query mirrors the rule's selection scoped to the alerting program, so the result is the program's history of driving this specific pattern, aggregated by host. A new or rare program for this pattern is the deviation worth chasing; a program that already accounts for many prior events is servicing or vendor automation. A servicing baseline for the affected library helps separate expected writes from anomalous ones.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith:
        - :\Windows\System32\axeonoffhelper.dll
        - :\Windows\System32\cdpsgshims.dll
        - :\Windows\System32\oci.dll
        - :\Windows\System32\offdmpsvc.dll
        - :\Windows\System32\shellchromeapi.dll
        - :\Windows\System32\TSMSISrv.dll
        - :\Windows\System32\TSVIPSrv.dll
        - :\Windows\System32\wbem\wbemcomn.dll
        - :\Windows\System32\WLBSCTRL.dll
        - :\Windows\System32\wow64log.dll
        - :\Windows\System32\WptsExtensions.dll
        - \SprintCSP.dll
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around the time of the alert?
  context: Tracking the account's activity across all hosts reveals whether the file drop is isolated or part of broader movement. If the same account triggered related activity on multiple endpoints, the scope may be larger. When the alert fires under SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a machine account, this account-wide view returns routine agent telemetry and the parent-driven view is the meaningful answer.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven file-creation pattern fire on other hosts in the same window?
  context: Under a service principal, an account-wide sweep returns agent-telemetry noise. The meaningful question is whether the same launch mechanism produced this pattern elsewhere in the alert window; the query mirrors the rule's selection scoped to the alerting program, fleet-wide. Multiple hosts in the same window point to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith:
        - :\Windows\System32\axeonoffhelper.dll
        - :\Windows\System32\cdpsgshims.dll
        - :\Windows\System32\oci.dll
        - :\Windows\System32\offdmpsvc.dll
        - :\Windows\System32\shellchromeapi.dll
        - :\Windows\System32\TSMSISrv.dll
        - :\Windows\System32\TSVIPSrv.dll
        - :\Windows\System32\wbem\wbemcomn.dll
        - :\Windows\System32\WLBSCTRL.dll
        - :\Windows\System32\wow64log.dll
        - :\Windows\System32\WptsExtensions.dll
        - \SprintCSP.dll
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: A phantom DLL plant is usually a mid-chain action. Earlier detections on the same host — code execution, credential access, defense tampering, or privilege escalation — may reveal how the actor obtained the write access needed to place a file in a system directory and help reconstruct the timeline that led here.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: Attackers rarely rely on a single persistence mechanism. Alongside a phantom DLL plant, they commonly install backup footholds using different techniques — scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions. Multiple persistence installations in the same timeframe indicate deliberate stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
