name: Potentially Suspicious Child Processes Spawned by ConHost
id: d82435f9-6eb1-40f5-af74-959da3d14ad3
description: |
  Fires when conhost.exe is the parent of a Windows shell or scripting utility (cmd.exe, cscript.exe, mshta.exe, powershell_ise.exe, powershell.exe, pwsh.exe, regsvr32.exe, or wscript.exe), matched either by the child Image name or its OriginalFileName. conhost.exe normally hosts console windows for child processes rather than spawning interpreters directly, so this parent-child pattern is used to launch commands indirectly and break the expected process lineage, masking the true launcher of the downstream activity. Investigation should confirm the child binary and its full command, trace what started conhost.exe, decode any encoded or obfuscated payload, and determine whether the spawned utility went on to retrieve or execute a remote payload.
type: detection
detection_id: dfa03a09-8b92-4d83-8e74-f72839b1c407
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- question: Does the alerting event show conhost.exe as the parent spawning one of the listed shell or scripting utilities?
  context: Confirm the alert is a true match by reviewing the triggering event. The rule fires only when the parent Image ends in conhost.exe AND the child is one of cmd.exe, cscript.exe, mshta.exe, powershell_ise.exe, powershell.exe, pwsh.exe, regsvr32.exe, or wscript.exe (matched on Image name or OriginalFileName). Verify the parent is genuinely conhost.exe and note which child binary fired.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - OriginalFileName
- question: Is this user and host expected to launch command interpreters or scripting utilities through conhost.exe?
  context: Legitimate administrative or installer activity occasionally produces console-hosted child processes. Knowing whether the user role and host function are consistent with running cmd.exe, PowerShell, or script hosts is often the fastest path to separating routine operations from indirect command execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What started conhost.exe, and is conhost.exe expected to spawn this child on this host?
  context: The parent-child relationship is the core signal here. Tracing the origin of conhost.exe (its own parent and command line) reveals whether the chain is a benign console host attached to a normal application or an indirection step used to obscure the real launcher. The --headless argument and an unexpected grandparent are notable.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did this same conhost.exe instance spawn?
  context: Indirect execution chains often launch several stages in sequence. Examining the siblings of the alerting child reveals whether this conhost.exe instance spawned additional interpreters, scheduled-task creation, or download tooling, which indicates orchestrated activity rather than a single benign launch.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What did the spawned utility actually do? Decode its full command line.
  context: The child command line reveals the specific action taken. Decode flags, parameters, encoded content, file paths, and URLs. Indirect execution commonly chains set-variable assembly, environment-variable indirection, or piping into another interpreter to hide the final command, so reconstruct the effective command, not just the literal arguments.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: Was the command encoded or obfuscated? What does it decode to?
  context: Attackers frequently use PowerShell's -EncodedCommand (-enc) parameter, string concatenation, backtick escaping, and variable substitution to hide intent. Base64-encoded commands are the most common form. Decoding reveals the actual payload -- download cradles, reverse shells, or in-memory execution of .NET assemblies. If the alerting child is cmd.exe rather than PowerShell, decode any set-variable assembly or caret/quote obfuscation in its command line.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the full script content?
  context: Script block logging records the deobfuscated script content PowerShell actually executes, even when the command line is encoded or obfuscated, providing ground truth about what ran. If PowerShell operational logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell or endpoint security controls bypassed or weakened before this execution?
  context: Operators often disable or bypass protections before running a payload -- AMSI patching, execution-policy changes (-ExecutionPolicy Bypass / -ep bypass), constrained-language escapes, PowerShell v2 downgrade, or Defender real-time disablement. Finding these precursor events on the host strengthens the case for malicious activity.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: Does the spawned utility's command line carry remote URLs, script paths, or DLL entrypoints consistent with proxy execution?
  context: 'System-binary proxy execution loads externally hosted or unsigned payloads through command-line parameters. For regsvr32.exe look for /i:URL and scrobj.dll; for mshta.exe look for http(s) URLs or javascript:/vbscript: handlers; for the script hosts look for remote .js/.vbs/.hta paths. Such arguments turn a trusted binary into a loader for attacker-controlled code.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      selection_args:
        CommandLine|contains:
          - 'http://'
          - 'https://'
          - 'scrobj.dll'
          - '/i:'
          - 'javascript:'
          - 'vbscript:'
          - '.hta'
          - '.sct'
          - 'DllRegisterServer'
      condition: selection and selection_args
    fields:
      - Image
      - CommandLine
- question: Did regsvr32.exe, mshta.exe, or another spawned binary load an unusual or unsigned module from a user-writable path?
  context: Proxy-execution utilities frequently side-load a DLL or script component rather than carrying the payload on the command line. Modules loaded from user-writable directories (AppData, Temp, ProgramData) or with no valid signature point to a payload delivered through the trusted binary rather than normal operation.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
      - Signature
- question: Did the spawned utility open outbound network connections in the minutes around the alert?
  context: Indirect command execution and proxy execution commonly retrieve a second-stage payload or beacon out immediately after launch. Outbound connections from cmd.exe, the script hosts, regsvr32.exe, mshta.exe, or PowerShell -- especially to external addresses or non-standard ports -- mark the transition from launcher to network retrieval. Correlate the connection time with the spawning event.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - Initiated
- question: What files did the spawned utility or its children write around the time of the alert?
  context: After indirect execution, the launched utility often drops a downloaded payload, script, or scheduled-task artifact to disk. Files written to user-writable locations (Temp, AppData, Public, ProgramData) by the spawned binary indicate staging of a follow-on stage and provide artifacts for hashing and reputation review.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - EventType
- question: How often has conhost.exe spawned this child binary on this host historically?
  context: conhost.exe hosting a console for an application is routine, but conhost.exe directly spawning an interpreter is far less common. Zero or very low historical counts for this specific conhost-to-interpreter pairing indicate a novel spawning relationship worth chasing; a long history suggests a known installer or management tool behavior.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \conhost.exe
      selection_child:
      - Image|endswith:
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \wscript.exe
      - OriginalFileName:
        - cmd.exe
        - cscript.exe
        - mshta.exe
        - powershell_ise.exe
        - powershell.exe
        - pwsh.dll
        - regsvr32.exe
        - wscript.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \conhost.exe
      selection_child:
      - Image|endswith:
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \wscript.exe
      - OriginalFileName:
        - cmd.exe
        - cscript.exe
        - mshta.exe
        - powershell_ise.exe
        - powershell.exe
        - pwsh.dll
        - regsvr32.exe
        - wscript.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, or persistence such as scheduled-task creation.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- defense tampering, reconnaissance, credential access -- may reveal the attack stages that preceded this event and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
