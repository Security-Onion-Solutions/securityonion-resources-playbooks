name: Potential Persistence Via Shim Database Modification
id: a9c229cb-661d-4c0f-ac72-58d5d1ae72bb
description: |
  Detects a registry write that registers an application-compatibility shim database (.sdb) under
  the AppCompatFlags InstalledSDB or Custom subkeys with non-empty value data. Application shims are
  a legitimate Windows backward-compatibility mechanism, and app-compat patches are installed the
  same way via sdbinst.exe, so custom SDB registration is a real administrative action. Abused, a
  custom shim can inject a DLL into or patch a target process every time that process launches,
  giving durable persistence and privilege escalation with no Run key, service, or scheduled-task
  artifact. Investigation should decode the SDB path or GUID in the value data, identify the writing
  process and how it was launched, correlate any sdbinst.exe execution, confirm the .sdb payload on
  disk, and watch for the injected module loading when the target process next starts.
type: detection
detection_id: dfb5b4e8-91d0-4291-b40a-e3b0d3942c45
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the registry key and value data match a shim database registration this rule detects?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires on a write to a value
    under either the InstalledSDB or the Custom subkey of HKLM SOFTWARE\Microsoft\Windows
    NT\CurrentVersion\AppCompatFlags, provided the value data is non-empty. Review the exact key path
    (TargetObject), the value data (Details), and the writing process, and note which of the two
    subkeys was touched — InstalledSDB tracks installed databases while Custom binds a shim to a
    specific target executable.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to install or modify application shim databases?
  context: >-
    Registering an SDB requires administrative (HKLM) write access and is uncommon outside legacy
    application support. Knowing whether the account and host normally perform app-compatibility work
    is often the fastest way to separate a routine install from an unauthorized one. User attribution
    is present on most endpoint registry events; when it is a machine account or missing, pivot on the
    writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What process wrote this shim registration, and what started that process?
  context: >-
    The parent-child chain shows how the shim was registered. A registration written by sdbinst.exe
    launched from an installer or management tool differs from one written directly by cmd.exe,
    powershell.exe, or an unfamiliar binary. Tracing the writing process back to its own origin
    (grandparent) reveals whether the chain is a legitimate deployment or an interactive hands-on
    session.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Was there a change ticket, maintenance window, or documented approval for this shim installation?
  context: >-
    Application-compatibility fixes are sometimes deployed as part of legacy software support, which
    would be captured in a change record. A corresponding ticket suggests authorized activity; the
    absence of one where policy requires it suggests the registration was unauthorized.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this shim registration align with normal work hours and maintenance windows?
  context: >-
    Legitimate application-compatibility changes typically occur during business hours or a scheduled
    maintenance window. A shim registration off-hours, with no maintenance activity around it, is more
    suspicious than the same action during a documented change window.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which AppCompatFlags subkey and value were modified, and does the location indicate a shim-based persistence binding?
  context: >-
    The key path carries the intent. A value under InstalledSDB registers a database on the system,
    while a value under Custom binds a shim to a named target executable so the shim runs whenever that
    program starts — the binding location most directly tied to code execution at launch. The value
    name and data determine which database is registered and, for Custom entries, which target process
    is patched.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What SDB path or GUID is written in the value data, and where does the referenced database live on disk?
  context: >-
    The value data (Details) typically holds the SDB display name and the database GUID. Installed
    databases resolve to a file at %WINDIR%\AppPatch\Custom\<GUID>.sdb (or the AppPatch64\Custom
    equivalent). A GUID or path pointing outside AppPatch, or a database whose name does not match any
    known app-compat package, is the concrete artifact to pull and analyze. If the value data is
    absent, the write may have carried binary or empty data — pivot to the SDB file on disk instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Does this shim registration persist, and was the same key re-modified after the alert?
  context: >-
    Shim persistence is durable across reboots until the SDB registration is removed. Endpoint
    telemetry does not emit registry-deletion events, so removal of the key is not directly
    observable — judge durability from the key's re-modification history over a longer window and from
    whether the shimmed payload executed. A registration that is written once and never revisited, on a
    key that is otherwise quiet, points to a standing foothold.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What other registry modifications were made on this host in the same session?
  context: >-
    An actor who registers a shim database often makes other configuration changes in the same
    window — additional persistence, security-tool tampering, or firewall edits. All registry
    modifications on the host in the window, grouped by key path and writing process, reveal whether
    the shim registration stands alone or is part of a broader set of changes from one hands-on
    session.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Was sdbinst.exe executed on this host around the time of the registration, and what command line did it run?
  context: >-
    The native installer sdbinst.exe writes these AppCompatFlags entries during a normal shim install,
    so a matching execution close in time corroborates a standard install path and its command line
    names the .sdb file being registered. Silent invocation (/q) or an .sdb loaded from %TEMP% or
    %APPDATA% is a stronger signal. Note that an actor with administrative access can write the
    registration directly, bypassing sdbinst.exe entirely — absence of an sdbinst.exe execution near
    the write does not clear the alert and points back to the writing process from the registry event.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\sdbinst.exe'
      condition: selection
    fields:
      - CommandLine
      - Image
      - ParentImage
      - User
- question: Is the referenced .sdb database (and any companion DLL) present on disk from this session?
  context: >-
    A shim registration is only effective if the SDB file it references exists, and an injecting shim
    also needs its payload DLL on disk. Correlating file activity by the registering process and its
    children surfaces the .sdb write into AppPatch\Custom and any DLL dropped alongside it in the same
    session. The file-write event carries no file content; if the .sdb or DLL is present, retrieve it
    for analysis of which shim fixes and target executable it defines.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: After the registration, did any unsigned or unusual modules load into processes on this host?
  context: >-
    An injecting shim loads an attacker-supplied DLL into the shimmed target executable each time that
    program starts, which appears as a module load rather than a new process. Grouping unsigned module
    loads on the host after the registration surfaces candidate injected DLLs; a module loading from
    AppPatch\Custom or a user-writable directory, into a high-frequency target such as a shell or
    service binary, is the injection to confirm. A signed but relocated module still warrants a path
    review.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Signed: 'false'
      condition: selection
    fields:
      - ImageLoaded
      - Signature
      - Image
- question: Has this AppCompatFlags key been modified before on this host?
  context: >-
    A first-time modification of the shim registration keys is more suspicious than a routine one.
    These keys should change rarely — only when app-compatibility packages are installed — so zero or
    very low history over the trailing period indicates a key that is not normally touched on this
    host. Compare the historical value data to see whether the same database is being re-registered or
    this entry is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Registrations rarely happen in isolation. Aggregating process activity around the alert reveals
    what led up to the shim write and what followed — reconnaissance, privilege escalation, or other
    persistence. Novel parent-child pairs stand out at low counts against the repetitive agent
    telemetry that dominates the volume.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may
    reveal the stages that preceded the shim registration and help reconstruct the timeline. Persistence
    is usually installed after an actor already has a foothold, so preceding alerts help place this
    event in the larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: >-
    Actors rarely rely on a single persistence method. After registering a shim, they commonly add
    backup mechanisms — scheduled tasks, services, registry Run keys, BITS jobs, or WMI
    subscriptions. Executions of the common persistence-installation tools in the surrounding window
    indicate intentional stacking rather than one isolated change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
