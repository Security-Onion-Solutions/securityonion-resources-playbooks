name: COLDSTEEL RAT Anonymous User Process Execution
id: 770e2a06-a090-4f79-a88f-aad432964282
description: |
  Detects a process creation event in which the recorded user context contains the string ANONYMOUS
  and, at the same time, the parent image path lies under \Windows\System32\ or under an \AppData\
  directory. Both conditions must hold together for the rule to fire. An anonymous user context on a
  process is unusual on Windows: it is normally reached through a credential-less network logon
  (null session), and a process inheriting that token means execution was driven by something
  attached to that session rather than by an interactive account. COLDSTEEL runs its components out
  of svchost.exe and rundll32.exe and spawns cmd.exe for interactive command-line control, so the
  parent-path constraint covers both the system-service launch path and a payload staged in a
  user-writable AppData directory. Investigation should establish which binary ran and with what
  arguments, which parent launched it, whether a null-session logon preceded it, and whether the same
  launch mechanism appears on other hosts or is accompanied by persistence installation.
type: detection
detection_id: e01b6eb5-1eb4-4465-a165-85d40d874add
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: >-
    Does the alerting event show a user context containing ANONYMOUS and a parent image path under
    \Windows\System32\ or \AppData\?
  context: >-
    The rule requires both conditions in the same event, so confirm each one before investing further
    time. Read the User value and the ParentImage path directly from the alert. User attribution on
    process events is collection-dependent and may render as NODATA, SYSTEM, or a literal
    ANONYMOUS LOGON string; if the field is empty rather than anonymous, the match is a telemetry
    artifact and not the behavior the rule targets.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - User
  answer_sources:
  - alert
  - process_creation
- question: Is an anonymous user context expected to launch processes on this host?
  context: >-
    A few legitimate patterns place work under a null-session token, chiefly anonymous SMB or
    named-pipe access to a share or print service on a server that permits it. On a workstation, or
    on a server with anonymous access disabled, there is normally no path by which a process acquires
    this context. Knowing the host's role and whether anonymous access is permitted is often the
    fastest way to separate a configuration quirk from execution driven by an unauthenticated remote
    session.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What is the parent process, and what was it doing when it spawned this child?
  context: >-
    The parent is constrained by the rule to a System32 path or an AppData directory, and those two
    branches mean different things. A System32 parent such as svchost.exe or services.exe points at
    a service-hosted component; loading a payload into a service host and registering it under
    svchost-related registry values is a documented way this family stays resident. An AppData parent
    points at a binary staged in a user-writable directory. This retrieves the parent's own creation
    event so its command line and its own parent are visible.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
  answer_sources:
  - process_creation
- question: What exactly did the alerting binary do? Decode its full command line and working directory.
  context: >-
    The rule places no constraint on the child binary, so the command line is where the operation
    becomes readable. Remote command-and-control tooling of this kind commonly spawns cmd.exe and
    drives it over a separate channel, and rundll32.exe with an export name is the usual way a
    payload DLL is invoked. Read the arguments for an export ordinal or name, a redirected pipe or
    handle, a decoded or encoded blob, and a working directory that sits outside the binary's own
    install path.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: >-
    Which logon session established the anonymous user context on this host in the hour before the
    process ran?
  context: >-
    An anonymous token is normally created by a credential-less network logon, recorded as event 4624
    with a LogonType of 3 and an account name of ANONYMOUS LOGON. The source address and workstation
    name on that logon identify where the session originated, which is the pivot from an
    unexplained local process to a remote origin. If Security-channel logon events are not collected
    in this environment, treat an empty result as a visibility gap rather than evidence that no
    session existed.
  range: -1h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 4624
        host.name|expand: '%hostname%'
        TargetUserName|contains: ANONYMOUS
      condition: selection
    fields:
      - LogonType
      - IpAddress
      - WorkstationName
      - AuthenticationPackageName
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: Does this parent normally spawn this child binary on this host?
  context: >-
    Historical frequency of this specific parent-child pairing separates a routine service or
    application launch from a novel one. A System32 service host has a well-defined and narrow set of
    children on any given host, so a child it has never spawned before is the deviation to chase. A
    parent under AppData with no prior history of launching this binary carries the same weight. High
    counts across 90 days point at installed software or operating-system behavior.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- always_include: true
  question: Has this user context previously produced the rule's pattern, and does that history fit its role?
  context: >-
    The query mirrors the rule's selection scoped to the alerting user, giving that account's 90-day
    history of this specific combination of anonymous context and constrained parent path, aggregated
    by host. This pivot is informative when the alert carries a real account name and degenerates when
    the recorded value is NODATA, SYSTEM, or a literal ANONYMOUS LOGON string, which is the common
    case for this rule. Read the count against what the account is expected to do; a value that
    resolves to a service principal makes the launch-mechanism view the one that answers the question.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|contains:
        - \Windows\System32\
        - \AppData\
        User|contains: ANONYMOUS
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: >-
    Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: >-
    When the alert fires under an anonymous, SYSTEM, or machine-account context, user identity
    attributes nothing and the launch mechanism is the meaningful pivot. The query mirrors the rule's
    selection scoped to the alerting parent process, giving the 90-day history of that parent driving
    this pattern rather than generic parent-and-child co-occurrence. A parent already accounting for
    thousands of prior events is vendor or operating-system automation; a new or rare parent for this
    pattern is the deviation to chase.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|contains:
        - \Windows\System32\
        - \AppData\
        User|contains: ANONYMOUS
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user context do across the environment around this time?
  context: >-
    Tracking the account's activity across all hosts shows whether the execution was isolated or part
    of movement between endpoints, which matters when a null session was established from a remote
    source. When the recorded value is a service principal or a placeholder such as NODATA, this view
    returns routine agent telemetry across the fleet and the parent-driven view is the one that
    answers the question.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: >-
    Did this same parent-driven pattern fire on other hosts in the same window, or is the activity
    isolated to this host?
  context: >-
    The query mirrors the rule's selection scoped to the alerting parent process, fleet-wide, within
    the alert window. Several hosts inside the same hour points at scheduled or pushed automation
    carrying the same launch convention, or at a remote operator working through null sessions across
    a subnet. A single host keeps the investigation focused on how the binary arrived here.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|contains:
        - \Windows\System32\
        - \AppData\
        User|contains: ANONYMOUS
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What did this user context do next on this host?
  context: >-
    Follow-on activity under the same account shows what the session was used for after the detected
    execution. Interactive command-line control produces discovery of the host, its files, its
    processes, and its network neighbours; look also for service or registry modification and for
    outbound connection attempts. This view is only meaningful when the recorded account value is
    specific enough to scope on.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- always_include: true
  question: >-
    What other launches of this binary on this host followed in the next four hours, and does the
    parent or command-line structure change?
  context: >-
    When the account value cannot be scoped on, repeat invocations of the same binary on the same
    host are the focused follow-on. Routine automation repeats with a stable parent and a stable
    argument structure. A change of parent, or arguments that grow and vary between invocations, is
    the pattern produced by an operator driving the binary by hand and is the signal worth chasing.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ParentImage
      - CommandLine
  answer_sources:
  - process_creation
- always_include: true
  question: Are there detections for this user context on other hosts?
  context: >-
    The same account driving detections on several hosts widens the scope beyond a single endpoint
    and points at credential abuse or repeated null-session access across the environment. If the
    account value is not carried on alert records, or resolves to an omnipresent service principal,
    fall back to scoping process events by the account instead and read this result as unbounded.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        user.name|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
  answer_sources:
  - alert
- always_include: true
  question: >-
    Did this same rule fire on other hosts in the past 24 hours, and does the cross-host pattern look
    like coordinated automation or an isolated detection?
  context: >-
    Because the alerting account is anonymous, asking whether this detection itself is firing
    elsewhere is more useful than asking whether the actor is active elsewhere. A rule firing across
    many hosts on the same day usually tracks a deployment or a scheduled job that happens to satisfy
    both conditions. A rule firing on one host alone is the deviation to chase.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.name|expand: '%rule_name%'
      condition: selection
    fields:
      - host.name
  answer_sources:
  - alert
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating every process creation on the host in a narrow window collapses repetitive agent
    telemetry into high-count rows and leaves novel parent-child pairs standing out at low counts.
    That is what to scan for here: a service host with an unfamiliar child, a rundll32.exe invocation,
    or a command interpreter appearing alongside the alerting event.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Execution under an anonymous context is an outcome, not an entry point. Earlier detections on the
    same host may show how the session was reached, commonly exploitation of an internet-facing
    service, followed by service or registry modification to place a component under a system process.
    Reading the detection timeline backwards helps reconstruct the order of events.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    A resident remote-access component is usually backed by at least one mechanism that survives
    reboot, and operators commonly install more than one. Service registration via sc.exe, registry
    writes via reg.exe, and scheduled tasks via schtasks.exe are the executions to look for in the
    same window as the alert. Several of these appearing together points at intentional stacking
    rather than an isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: >-
    Were files dropped to persistence locations (Startup folders, scheduled-task definitions) on this
    host?
  context: >-
    A payload can be made to survive reboot without running any persistence tool, by writing an
    executable into a Startup folder or a task definition directly under the Tasks directories. File
    events capture those writes even when no command line is available to detect. Given that the rule
    already allows a parent staged under AppData, a matching drop in a Startup path is worth checking
    for as a parallel mechanism.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
