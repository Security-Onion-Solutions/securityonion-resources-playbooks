name: DNS Query To AzureWebsites.NET By Non-Browser Process
id: 9cb866af-3f05-4e93-9965-2dd80d5a0a4e
description: |
  Detects a DNS query for a hostname ending in azurewebsites.net made by a process that is
  not one of the recognized web browsers or excluded security and monitoring agents.
  azurewebsites.net is the domain Azure App Service assigns to tenant web applications;
  anyone can register a subdomain, and the platform's trusted reputation has made these
  endpoints a recurring home for malware hosting, web-service command-and-control, and data
  exfiltration -- while legitimate line-of-business applications, SDK clients, and deployment
  tools also resolve them routinely. Because the alert is a name lookup rather than a
  connection, the investigation identifies the querying program and whether its identity
  holds up, the specific tenant subdomain, whether the host then connected to the resolved
  address, and any follow-on lookups, downloads, or child processes that separate
  command-and-control use from routine application traffic.
type: detection
detection_id: e043f529-8514-4205-8ab0-7f7d2927b400
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the queried domain end in azurewebsites.net, and which non-browser process performed the lookup?
  context: |
    Confirm the alert from the exact queried name (a subdomain of azurewebsites.net) and the
    querying program, which must be something other than the rule's excluded browsers and
    security agents for the rule to fire. The DNS lookup carries the full tenant subdomain
    and reliable process attribution. Note whether the lookup resolved to an address, since
    an unresolved query means no connection could follow, while a resolved one sets up the
    egress check.
  range: +/-5m
  answer_sources:
  - alert
  - dns_query
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
- question: Is this user or host expected to run a non-browser program that resolves azurewebsites.net?
  context: |
    Many legitimate programs resolve App Service endpoints without a browser -- line-of-business
    applications with an Azure-hosted backend, deployment and publishing tools, SDK-based
    clients, and internal automation. A developer workstation or a server hosting a known
    Azure-integrated application reads differently from a standard user's machine with no
    cloud-development role. Whether the lookup ran under an interactive user or a service
    account also matters, since unattended tasking retrieval tends to run under service or
    SYSTEM context.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What do the tenant subdomain and threat intelligence reveal about this destination, and did the lookup resolve?
  context: |
    The platform domain itself is trustworthy, so the verdict comes from the specific
    subdomain. The tenant name is freely chosen at registration, so it identifies the
    application behind the traffic -- a recognizable corporate or vendor app name supports
    routine use, while a name imitating Microsoft services or update infrastructure with no
    corresponding product is a masquerading pattern seen in hosting and exfiltration
    endpoints. Look up the exact subdomain in threat intelligence and passive DNS, and check
    whether it resolved to an address, which is the pivot into the egress and connection
    questions.
  range: +/-5m
  answer_sources:
  - external_threat_intel
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: What is the querying program, and what do its command line and working directory show?
  context: |
    The querying program is the center of this investigation, since the rule already excluded
    browsers. A recognizable application binary in its installed path with a plausible command
    line supports legitimate use; a script interpreter with encoded or URL-bearing arguments,
    a binary running from a user-writable directory, or an update-sounding executable with no
    matching product installed points at implant tooling. This query returns all executions of
    the binary on the host within the window, so multi-step operations spread across sequential
    invocations are visible together.
  range: +/-5m
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned the querying program, and is that parent chain expected?
  context: |
    The parent lineage shows how the querying program came to run. A program started by
    explorer.exe or a service manager fits normal use; one launched by an Office application,
    a script interpreter, or a scheduled task is the delivery-and-persistence lineage that
    typically precedes web-service command-and-control. The parent's own command line shows
    what it was doing when it started the child.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What child processes did the querying program spawn around the lookup?
  context: |
    Remote access and remote-control tooling reaching external infrastructure typically
    exposes interactive control by spawning command shells, script interpreters, or
    file-management helpers under the parent that opened the channel. Child processes such as
    cmd.exe, powershell.exe, or file-transfer utilities launched by the querying program are
    the interactive-session signal; a program with no children, or only its own expected
    helpers, weighs toward an application backend rather than hands-on-keyboard control.
  range: +/-15m
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is the querying program an approved application authorized to reach azurewebsites.net-hosted services?
  context: |
    Organizations typically know which applications legitimately reach Azure-hosted backends
    -- an approved line-of-business client, an SDK-based tool, or a sanctioned deployment
    utility. A program that is not on the approved software inventory, even a well-known
    commercial tool, may represent shadow IT or attacker-deployed tooling and should be
    checked regardless of the binary's reputation. Match the program against the software
    approved for this host's role.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a documented business reason or support session explaining this program's access to azurewebsites.net?
  context: |
    Legitimate outbound access to a cloud-hosted service usually correlates with a known
    workflow -- an active support ticket, a scheduled deployment or maintenance window, or a
    documented application function. If no business context exists for this program reaching
    an App Service endpoint, the access may have been established by an attacker for tasking
    retrieval or exfiltration, or by a user circumventing controls.
  range: +/-30d
  answer_sources:
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: After the lookup, what external endpoints did the querying program actually connect to?
  context: |
    A DNS query only shows intent to resolve a name; the connection is a separate event.
    Pivoting on the querying program's own outbound connections shows whether it followed the
    lookup with traffic and where that traffic went -- to the resolved App Service address, to
    the vendor's legitimate infrastructure, or to a custom or previously unseen endpoint.
    App Service front-end addresses are shared across many unrelated tenant applications, so
    weigh the destination hostname and the program's identity over the IP alone. A connection
    to new infrastructure shortly after the App Service contact is the dead-drop follow-through
    pattern.
  range: +/-15m
  answer_sources:
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: What other domains did this program resolve, and do they look like beaconing or algorithmic generation?
  context: |
    The useful clustering pivot for a DNS alert is the querying program -- every name it looked
    up in the window. A burst of algorithmically varied names, a set of unrelated cloud or
    dynamic-DNS providers, or a steady periodic cadence of the same lookups is a beaconing or
    dead-drop pattern; a small set of names tied to one application's backend fits routine use.
  range: +/-1h
  answer_sources:
  - dns_query
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: What files did the querying program write or read around the lookup?
  context: |
    This destination class is abused in both directions -- as a hosting site, where a retrieved
    payload lands on disk shortly after resolution, and as an exfiltration endpoint, where
    archives or exported data are staged before upload. File activity by the querying program
    shows both, plus any configuration files it maintains. An executable or script written to a
    user-writable path, or an archive appearing just before outbound transfer, each set the
    follow-up direction.
  range: -24h
  answer_sources:
  - file_event
  - network_connection
  query: |
    aggregation: true
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: Does this host normally resolve this azurewebsites.net subdomain?
  context: |
    A subdomain this host has resolved daily for months under the same program is an
    established workflow -- still worth the identity and authorization checks, but not an
    emerging intrusion. A first-time lookup, or history that begins abruptly in recent days,
    marks when the channel appeared and anchors the timeline for the rest of the investigation.
  range: -90d
  answer_sources:
  - dns_query
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: Does this host normally run the querying program?
  context: |
    A program that has executed regularly on this host for months supports the
    established-application reading; a binary appearing for the first time at the alert points
    at fresh tooling. The user grouping also shows whether it runs under the interactive user
    or a service context, which feeds the expected-usage judgment.
  range: -90d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Did other hosts in the environment resolve this same subdomain?
  context: |
    Fleet-wide resolution of the platform domain is expected wherever legitimate Azure-hosted
    applications are in use, so the discriminator is the specific subdomain from this alert. If
    only this host resolves it, the lookup weighs toward targeting; several hosts resolving the
    same uncommon subdomain points at shared tooling, and each of those hosts needs the same
    program-identity check as this one. Anchoring fleet scope on a resolved IP would mislead
    here, because App Service front-end addresses are shared across unrelated tenant
    applications.
  range: -7d
  answer_sources:
  - dns_query
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - host.name
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: |
    Aggregated parent-child process pairs around the alert place the lookup in its surrounding
    sequence -- a dropper or script host before it, discovery commands or payload execution
    after it. Novel low-count pairs stand out against repetitive agent noise.
  range: +/-15m
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: |
    Earlier detections -- delivery artifacts, script-interpreter execution, persistence
    creation, defense tampering -- may capture how the querying program arrived and what it did
    before resolving the endpoint. The alert timeline reconstructs the sequence from foothold to
    command-and-control.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
