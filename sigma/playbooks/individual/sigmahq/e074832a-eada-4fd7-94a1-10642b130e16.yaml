name: HackTool - SafetyKatz Dump Indicator
id: 5b694f29-2630-4fe9-99bb-5e9a0bbfc315
description: |
  Detects the default LSASS minidump file that SafetyKatz writes to disk. SafetyKatz is a GhostPack tool that opens a
  handle to lsass.exe, calls MiniDumpWriteDump to save a full memory dump to C:\Windows\Temp\debug.bin, then reflectively
  loads an embedded Mimikatz in memory to run sekurlsa on the dump and deletes the file. The debug.bin dump contains the
  credential material of every account with a session on the host, so its creation means LSASS was dumped and those
  credentials are exposed. Determine whether an authorized engagement explains it, confirm the dump, identify which
  accounts are exposed, and check for follow-on lateral movement.
type: detection
detection_id: e074832a-eada-4fd7-94a1-10642b130e16
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the file path and creating process match the SafetyKatz LSASS dump indicator?
  context: >-
    Confirm the alert is a true positive by reviewing the exact file path (the rule fires on a file named debug.bin
    written under a \Temp\ directory — SafetyKatz's default dump path), the operation performed, and the writing
    process. The writing process is the tool itself; note its name and whether it was renamed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to write a memory dump to a Temp directory?
  context: >-
    Writing an LSASS memory dump to a Temp path has no legitimate purpose outside sanctioned security testing or a
    supervised crash-analysis session. Knowing whether the user role and host function fit that activity is the fastest
    way to separate an authorized assessment from an intrusion. When the writing account is a machine or service
    account, judge by the writing process and host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this SafetyKatz execution part of an authorized penetration test or red team engagement?
  context: >-
    LSASS-dumping tools are used in authorized internal assessments to demonstrate credential exposure. Before
    investing analysis time, check whether a pentest or red team exercise is active on this host or network segment.
    An authorized engagement with matching tooling, host, and timing resolves the alert; absence of one on a
    production host makes an LSASS dump a live credential-access incident requiring account resets.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Was LSASS memory dumped, and by what method — and which process opened the handle to lsass?
  context: >-
    SafetyKatz dumps LSASS by calling MiniDumpWriteDump against a handle to lsass.exe and writing the minidump to
    debug.bin. The command line and writing process confirm the method (default lsass target, or a supplied PID). Note
    a visibility limit: the read-side handle open against lsass and the in-memory Mimikatz load leave no endpoint
    handle-access record here, so absence of a process_access event is not evidence the dump did not happen — the
    debug.bin file is the ground truth that it did.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is debug.bin an LSASS minidump, and what credential material does it contain?
  context: >-
    Confirm the file is a Windows minidump (MDMP header) of lsass rather than a benign crash dump: check its size and,
    if it can be retrieved from the on-disk path, parse it in a safe environment. A minidump of lsass yields logon
    passwords, NTLM hashes, and Kerberos keys for every account with a live session, so its contents define the scope
    of exposure. If the file was already deleted, the dump still occurred and the credentials should be treated as
    captured.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If the tool binary executed, what is its hash and does it have known threat-intel detections?
  context: >-
    A file's hash is recorded when it runs, not when it is written. This query looks for the writing binary executing
    and reads its hash so it can be submitted to reputation and threat-intel services to confirm it is the known
    credential-dumping tool or a renamed copy. If the binary already exited or was removed, retrieve it from its
    on-disk path for manual hashing.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: What other artifacts of this tool are present — the dump file, the tool binary, and its output?
  context: >-
    The tool leaves a consistent footprint: the debug.bin minidump, the tool binary that wrote it, and any files
    created by the same process while it ran. Enumerate the files this process created around the alert to confirm the
    dump and find any staged output or copies. The dump file is frequently deleted moments after use, so a deletion
    event for debug.bin corroborates the tool's cleanup step rather than ruling the activity out.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Which accounts had sessions on this host, and do any have elevated privileges?
  context: >-
    The severity of an LSASS dump depends on which accounts were logged on when it ran — every one with a live session
    is exposed in the dump. A domain administrator, service account, or backup operator among them requires incident
    escalation and immediate reset; enumerate the interactive and service logons on this host around the dump and
    cross-reference each against directory group memberships to prioritize resets.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Was LSASS protection weakened via the registry around the time of the dump?
  context: >-
    Operators frequently weaken LSASS defenses before dumping — disabling RunAsPPL (LSA protection), turning on WDigest
    UseLogonCredential to force cleartext passwords into memory, or clearing Credential Guard flags. A modification to
    these keys shortly before the dump indicates deliberate staging and widens what the dump yields. Absence does not
    clear the alert; the dump can succeed without them on an unprotected host.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - \Control\Lsa\RunAsPPL
          - \SecurityProviders\WDigest\UseLogonCredential
          - \Control\Lsa\LsaCfgFlags
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A credential-dumping run often touches several files — the dump itself, staged output, and its own cleanup
    deletions. The full breadth of the writing process's file activity and that of its direct children enumerates what
    else was produced and whether the dump was copied elsewhere before deletion. Deletions of the dump path are the
    tool's expected cleanup and should be read alongside the creation.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to this Temp directory recently, and by which processes?
  context: >-
    The dump lands in a \Temp\ directory that many processes write to, so volume alone is not suspicion — the signal is
    an unfamiliar writer dropping executables, dumps, or staged output there. Recent arrivals in the same directory
    reveal whether this is an isolated dump or a staging location under active use, and which other artifacts belong to
    the same activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\Temp\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after this event?
  context: >-
    Credentials pulled from an LSASS dump are typically reused to move laterally. This query returns outbound
    connections from this host to remote-access ports — 3389 (RDP), 445 (SMB), 5985/5986 (WinRM), 22 (SSH) — in the
    hours after the dump, with the originating process and account. Credentials replayed from a different machine will
    not appear here, so also review logons for the exposed accounts on their likely targets. If host network telemetry
    is not collected, treat zero rows as a visibility gap rather than evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- always_include: true
  question: Has this user previously produced this dump-file pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's file-name pattern scoped to this user, returning their 90-day history of writing this
    dump indicator (not generic file activity), aggregated by host. A user who has never produced this pattern is more
    suspicious than one who does so regularly as part of a sanctioned testing role. Weigh the count against the
    account's normal function.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: \Temp\debug.bin
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this dump-file pattern on this host or across the environment, or is it new for this activity?
  context: >-
    When the alert fires under a service or machine account, user identity does not attribute the behavior; the launch
    mechanism does. The query mirrors the rule's file-name pattern scoped to the alerting program, returning the
    90-day history of that program producing this pattern. A new or rare program for this dump is the deviation worth
    chasing; a program that already accounts for many prior events is more likely a testing harness or automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: \Temp\debug.bin
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether the credential dump is isolated or part of a wider
    hands-on operation — additional dumps, reconnaissance, or tooling on other endpoints. If the same account produced
    activity on multiple hosts in the same window, the scope of compromise is larger than this one alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven dump pattern fire on other hosts in the same window?
  context: >-
    Under a service or machine account, a user-wide network sweep returns agent-telemetry noise. The meaningful
    question is whether the same launch mechanism fired elsewhere: the query mirrors the rule's file-name pattern
    scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts point to pushed or scheduled
    distribution of the dump; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: \Temp\debug.bin
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What process spawned the tool, and is that parent chain expected?
  context: >-
    The parent process reveals how the tool was launched — an interactive shell, a remote-execution service, or a
    script host — and tracing the parent's own origin distinguishes a hands-on operator session from an automated or
    pushed execution. Because the dump requires high integrity, an elevated parent chain is expected and the question
    is which account elevated it and how.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Is the dump file still on disk, or was it deleted after the alert?
  context: >-
    The dump's post-alert lifecycle drives next steps. A debug.bin still on disk can be retrieved to enumerate exactly
    which credentials were captured; a deletion within seconds of creation is the tool's own cleanup step and confirms
    the dump-then-remove pattern. Either way the credentials should be treated as exposed — deletion removes the
    evidence, not the exposure.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
