name: Suspicious Printer Driver Empty Manufacturer
id: 7f33ee17-00c7-4375-988a-ab005e2e1563
description: |
  Detects a printer driver registered under HKLM\SYSTEM\CurrentControlSet\Control\Print\Environments\Windows x64\Drivers
  whose Manufacturer value is empty. Legitimate print drivers populate DriverInfo metadata such as Manufacturer,
  InfPath, and Dependencies; an empty Manufacturer on a freshly registered driver is one of the abnormal-metadata
  signals of a faked or hijacked print driver used to load an attacker-supplied driver DLL through the print
  subsystem. The rule fires when the driver key with an empty Manufacturer value is written AND none of the known
  benign printer packages (CutePDF Writer v4.0, VNC Printer, PDF24) match. Investigation should confirm the empty
  metadata, identify the driver DLL that gets loaded and where it loads from, and determine whether the print
  spooler subsequently executed anything unexpected.
type: detection
detection_id: e0813366-0407-449a-9869-a2db1119dc41
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Do the registry key and value data match a printer-driver entry with an empty Manufacturer value?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a value under
    \Control\Print\Environments\Windows x64\Drivers ending in \Manufacturer is written with empty Details AND none
    of the excluded benign packages (CutePDF Writer v4.0, VNC Printer, PDF24) match. Review the exact TargetObject
    path, the empty value data, and the writing process against those criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to install or register printer drivers?
  context: >-
    Print driver registration is normally performed by the print spooler service or a driver installer during an
    intentional printer setup. A registration on a host that does not host printers, or driven by an unexpected
    user, is harder to explain as routine and raises the priority of the finding.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Was there a change ticket, maintenance window, or documented approval for a printer driver deployment?
  context: >-
    Printer driver rollouts are often planned and ticketed, especially in managed environments. A corresponding
    change record suggests authorized activity; the absence of one when policy requires it suggests the driver
    registration was unexpected and should be escalated.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What specific driver key and value were modified, and is this a known driver-loading abuse location?
  context: >-
    The Print\Environments\Windows x64\Drivers subtree defines how the print subsystem loads driver components.
    Registering a driver here with metadata that real drivers always populate lets an attacker stage a driver DLL
    that the spooler will load. The exact key path, the empty value data, and the writing process together
    establish whether this is a genuine printer setup or an attempt to plant a loadable driver.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What does the empty Manufacturer value mean, and are the driver's other metadata fields also empty?
  context: >-
    Genuine printer drivers set a Manufacturer string along with related DriverInfo metadata. An empty Manufacturer
    can be spoofed, so corroborate it by reviewing the sibling values under the same driver key (InfPath,
    Dependencies, DriverDate, provider). Several normally populated fields left empty on the same driver strengthen
    the finding that the driver was staged programmatically rather than installed through a normal package.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Is this driver entry a point-and-print style loading location, and does it persist or get re-modified?
  context: >-
    Driver entries under the print environments subtree survive reboot and cause the referenced driver components
    to load when printing occurs, which is why they are abused for persistent code loading. Direct removal of the
    entry is not observable from the endpoint telemetry available here, so judge persistence from the key's
    re-modification history over a longer window and from whether the driver DLL was subsequently loaded or executed,
    rather than looking for a delete event.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Was a driver DLL loaded from the print spooler driver directory, and is it unsigned or abnormally signed?
  context: >-
    A staged print driver takes effect when its DLL is loaded out of the spool drivers directory
    (C:\Windows\System32\spool\drivers\...) by the spooler or a printing process. A component that loads from that
    path while unsigned, signed by an unexpected party, or with a failed signature is the concrete execution
    artifact of the abuse. Compare the loading module's path and signature against the driver components legitimate
    printers are expected to load.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|contains: '\spool\drivers\'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - ProcessGuid
- question: Did the installing process write driver files (DLL or INF) to disk, and are they still present?
  context: >-
    A staged print driver is only effective if its backing files exist on disk. Correlating file writes by the
    process that registered the driver, and by its children, surfaces the driver DLL, print processor, and INF that
    were dropped, typically into the spool drivers directory in the same session as the registry write. Confirming
    those files determines what the print subsystem would load. The file-write event carries no hash; if a payload
    is present, hash it from a later execution or retrieve it for a reputation lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Were other registry modifications made on this host in the same session?
  context: >-
    An operator staging a driver often changes several keys at once, for example registering the driver, adding a
    port or monitor, and adjusting security settings. Registry changes clustered from the same writing process within
    a short window reveal the full scope of the configuration change and whether more than one objective was pursued.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has this printer driver key been modified before on this host?
  context: >-
    A driver key that has never been touched before is more suspicious than one changed as part of routine printer
    maintenance. Comparing prior modification history against the expected set of installed drivers on this host
    helps calibrate whether this registration is new and unexpected.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: After the driver was registered, did the print spooler spawn any unexpected child processes?
  context: >-
    Abuse of the print driver path frequently results in the spooler service launching command interpreters or
    loaders such as cmd.exe, powershell.exe, or rundll32.exe shortly after the driver entry is written. Child
    processes of spoolsv.exe that are not printer-related are a strong sign the staged driver executed code. Correlate
    the timing of any such execution with the registry write.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\spoolsv.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Was this printer driver key modified on other hosts in the environment?
  context: >-
    The same driver registration appearing on many hosts may reflect a managed deployment, while an entry confined
    to a single host looks targeted. Compare the value data and writing process across hosts to distinguish a
    fleet-wide rollout from an isolated staging action.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Driver staging rarely happens in isolation. Examining the processes running around the registry write reveals
    what led to it and what followed, and whether the driver registration is part of a larger sequence such as
    reconnaissance, privilege escalation, or additional persistence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal
    the stages that preceded the driver staging and help reconstruct the full timeline of the activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    Attackers rarely rely on a single persistence mechanism. After staging a print driver, they commonly add backup
    footholds through scheduled tasks, services, registry Run keys, or similar tooling. Multiple persistence
    installations in the same timeframe indicate intentional stacking rather than isolated administration.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations such as the Startup folder or scheduled-task definition paths on this host?
  context: >-
    File-based persistence bypasses command-line detection entirely. Dropping an executable or script into a Startup
    folder or a path referenced by a registry Run key establishes persistence without invoking standard persistence
    tools. File monitoring captures these drops even when the operator avoids schtasks, sc, or reg.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
