name: CVE-2022-24527 Microsoft Connected Cache LPE
id: 949be000-b2e8-404d-ae2d-d386bd4db8d3
description: |
  Detects creation of a webAdministration.psm1 PowerShell module under a
  WindowsPowerShell\Modules\webAdministration path that a SYSTEM-owned scheduled
  task imports. A privileged task that calls import-module can be hijacked when a
  low-privileged user is able to create the module file in a directory the task
  searches before the standard module path, so the task loads attacker-supplied
  code and runs it as SYSTEM (the weak-permissions local privilege escalation
  behind CVE-2022-24527). The rule fires when the file is written by a
  non-service account; determine whether the module is legitimate or
  attacker-supplied and whether the privileged task subsequently loaded and
  executed it.
type: detection
detection_id: e0a41412-c69a-446f-8e6e-0e6d7483dad7
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the created file path and the writing process match what this rule detects?
  context: >-
    Confirm the alert is a true positive by reviewing the exact path
    (a webAdministration.psm1 dropped into a WindowsPowerShell\Modules\webAdministration
    directory), the operation performed, and the process that wrote it against the
    rule's criteria. The rule excludes writes by SYSTEM and service accounts, so a
    match here means an interactive or low-privileged user created the module file.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to write PowerShell modules into this task-owned module path?
  context: >-
    Legitimate module installs land in the standard PSModulePath, not in a nested
    WindowsPowerShell\Modules directory beside a scheduled task's scripts. A
    non-service user creating a module file where a SYSTEM task will resolve it is
    the core of this escalation. When the writer is a machine or service account,
    judge by the writing process and the host's role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the module file still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives next steps. A module still on disk can
    be retrieved, hashed, and read; a file deleted seconds after creation suggests
    cleanup after the privileged task has already loaded it. Note whether the write
    was followed by a deletion or rename on this path.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What is inside this module file? Read its content for arbitrary commands or obfuscation.
  context: >-
    A legitimate webAdministration module exports IIS management cmdlets. A hijack
    payload placed on this path instead contains arbitrary code the SYSTEM task will
    run on its next cycle (for example New-Item, a download cradle, or a call to
    another interpreter). Read the actual file content and check for base64 or
    obfuscated strings, embedded URLs or IPs, and commands that spawn processes or
    write files. Content retrieval is a manual step from the endpoint or the on-disk path.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Was the module written by an encoded or obfuscated command, and what does the writing command decode to?
  context: >-
    The process that created the module file may have used an encoded (-enc /
    -EncodedCommand) or obfuscated command to stage it, or a plain redirection such
    as echo into the path. The writing command line shows how the module was
    delivered. Decode any base64 or concatenated arguments to recover the payload the
    module contains.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned the writer of this module, and is that parent chain expected?
  context: >-
    The parent of the process that wrote the module reveals how the drop was
    staged. A user shell, a script host, or an exploitation tool as the parent points
    to a deliberate escalation attempt; an installer or management agent may be
    benign. Abnormal parents such as mshta.exe, wscript.exe, or an Office application
    are worth chasing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Did a payload run under a SYSTEM or service account after the drop, and is it known malicious?
  context: >-
    The hijacked module loads inside the scheduled task's PowerShell process and
    runs with its privileges, so the module itself does not appear as its own
    execution event. If the module spawns a child process, that child carries a hash
    on its execution event. Review processes launched by the privileged PowerShell
    shortly after the drop and submit their hashes to threat intelligence to
    determine whether the SYSTEM-context payload is known malicious, benign, or
    previously unseen.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\powershell.exe'
      condition: selection
    fields:
      - Image
      - Hashes
      - User
- question: Did PowerShell script block logging capture the module content executing under SYSTEM?
  context: >-
    Event ID 4104 records the deobfuscated script content PowerShell actually runs,
    including module code loaded via import-module. This is the ground-truth answer to
    whether the privileged task loaded the hijacked module and what it executed as
    SYSTEM, even when the on-disk module is obfuscated or later deleted. Rare or
    never-before-seen module content and unusually large script blocks are the tuning
    signals worth flagging. If PowerShell operational logs are not ingested in this
    environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Which PowerShell processes ran after the drop, and under what account and parent?
  context: >-
    The escalation completes when the vulnerable scheduled task runs PowerShell as
    SYSTEM and imports the module. PowerShell invocations under a SYSTEM or service
    account whose parent is a task engine or service host, in the window after the
    drop, confirm the privileged import path was reached. Scope the window to the
    time between the file write and the next task cycle; the vulnerable task in this
    pattern runs on a short recurring interval.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\powershell.exe'
      condition: selection
    fields:
      - CommandLine
      - ParentImage
      - User
- question: Did the privileged PowerShell load unusual or unsigned assemblies after the module drop?
  context: >-
    A hijacked module can reflectively load .NET assemblies into the PowerShell
    process to run code in memory. Assembly loads into powershell.exe that are unsigned
    or carry an unexpected signer are the tuning signal for this in-memory execution,
    distinct from the on-disk module content. Rare or never-before-seen assemblies
    tied to the privileged PowerShell are worth flagging.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\powershell.exe'
      filter_signed:
        Signed: 'true'
      condition: selection and not filter_signed
    fields:
      - ImageLoaded
      - Signature
      - SignatureStatus
      - Signed
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    Staging this escalation involves creating the missing directory tree
    (WindowsPowerShell, Modules, webAdministration) before dropping the module, so the
    writing process often touches several paths in sequence. The breadth and location
    of its other file activity distinguishes a single module write from a broader
    setup or cleanup. Look at where the writes land, not just how many.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to this module directory recently, and by which processes?
  context: >-
    A module directory beside a scheduled task's scripts should have a small, stable
    set of writers. Other recent arrivals under WindowsPowerShell\Modules on this host
    reveal whether this is an isolated drop or a path under active manipulation, and
    which other files belong to the same activity. A single unfamiliar writer across
    several files is the signal.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\WindowsPowerShell\Modules\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, returning the user's
    90-day history of writing this specific module hijack path (not generic file
    activity), aggregated by host. A user who has never produced this pattern is more
    suspicious than one who does so routinely; weigh the count against the user's role.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: WindowsPowerShell\Modules\webAdministration\webAdministration.psm1
      filter:
        User|contains:
        - AUTHORI
        - AUTORI
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven the rule's pattern, or is the program new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute
    the behavior; the launch mechanism does. The query mirrors the rule's selection
    scoped to the alerting program, returning the 90-day history of this program
    driving this specific pattern. A new or rare program for this write is the deviation
    worth chasing; a program already accounting for many prior events is vendor or OS
    automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: WindowsPowerShell\Modules\webAdministration\webAdministration.psm1
      filter:
        User|contains:
        - AUTHORI
        - AUTORI
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether the escalation
    attempt is isolated or part of broader movement. If the same user triggered
    similar activity on other endpoints, the scope of compromise may be larger than
    this one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven module drop fire on other hosts in the same window?
  context: >-
    Under a service principal, tracking the user across the network returns
    agent-telemetry noise. The meaningful question is whether the same launch mechanism
    wrote this module path elsewhere: the query mirrors the rule's selection scoped to
    the alerting program, fleet-wide, in the alert window. Multiple hosts in the
    same window points to pushed or scheduled automation; a single host points to a
    host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: WindowsPowerShell\Modules\webAdministration\webAdministration.psm1
      filter:
        User|contains:
        - AUTHORI
        - AUTORI
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: Is this module hijack path present on any other hosts in the environment?
  context: >-
    Finding the same module written to this hijack path on multiple hosts indicates
    the weak-permissions condition is being exploited across the fleet rather than on
    one machine. If it is only on one host, the activity may be targeted; if on many,
    determine the distribution pattern and timeline.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Escalation attempts rarely occur in isolation. Earlier detections on the same host
    (reconnaissance of directory permissions, other file drops, or defense tampering)
    may reveal the stages that preceded this module write and help reconstruct the
    timeline leading to the privileged execution.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
