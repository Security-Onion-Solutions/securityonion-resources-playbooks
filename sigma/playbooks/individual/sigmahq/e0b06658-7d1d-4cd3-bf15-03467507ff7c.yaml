name: Suspicious DotNET CLR Usage Log Artifact
id: 52393767-61aa-41cd-9e01-d446b03caf29
description: |
  Detects the creation of a .NET CLR "Usage Log" file under a \UsageLogs\ directory, named after a binary that normally does
  not run managed code (cmstp.exe, cscript.exe, mshta.exe, msxsl.exe, regsvr32.exe, rundll32.exe, svchost.exe, wscript.exe, or
  wmic.exe). The CLR writes this side-effect file the first time a process hosts the runtime in a user session, so its presence
  is evidence that one of these unmanaged binaries loaded the CLR and executed a .NET assembly in memory. The rule fires when a
  matching UsageLog path is created AND the activity is not the benign rundll32.exe custom-action pattern (parented by MsiExec.exe
  with -Embedding and the zzzzInvokeManagedCustomActionOutOfProc marker). The filename identifies the executing image; the
  investigation should determine which binary hosted the CLR, what assembly or command it ran, whether it retrieved a remote
  payload, and whether that host and user routinely produce this pattern.
type: detection
detection_id: e0b06658-7d1d-4cd3-bf15-03467507ff7c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the created file path match a CLR UsageLog named after an unmanaged binary?
  context: >-
    Confirm the alert is a true positive by reviewing the exact file path and the responsible process. The rule fires when a
    file ending in one of the enumerated \UsageLogs\<binary>.exe.log names is created and the activity is not the benign
    MsiExec-hosted rundll32 custom-action pattern. A path such as ...\CLR_v4.0\UsageLogs\wscript.exe.log means the CLR host was
    wscript.exe.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to run this binary as a .NET runtime host?
  context: >-
    The binaries this rule watches (script hosts, regsvr32, rundll32, wmic, svchost) legitimately load the CLR on some hosts,
    for example a signed line-of-business tool that runs a managed COM object. Knowing whether the user role and host function
    routinely produce managed-code execution from this binary is often the fastest way to separate a routine operation from a
    LOLBin proxying a .NET payload. When the writing account is a machine or service account, judge by the host role and the
    writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the UsageLog file still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle affects both urgency and next steps. A UsageLog that is deleted seconds after creation
    points to anti-forensic cleanup or CLR-log tampering, which shifts the investigation toward what executed in between and
    toward the registry knob and environment variable that suppress future logging. A log left in place can still be correlated
    with the hosting process and its command line.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What did the binary that hosted the CLR actually execute? Decode its command line.
  context: >-
    The UsageLog names the process that hosted the runtime, but not what it ran. Read the full command line and working
    directory of that binary to find the .NET assembly, script, DLL entrypoint, URL, or COM object it invoked. Suspicious
    arguments include remote URLs, script paths, DLL entrypoints, and paths under Temp or a user profile. For multi-step tools
    the operation may span several sequential invocations of the same binary.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What is the hash of the binary that hosted the CLR, and is it the genuine signed system binary?
  context: >-
    The UsageLog side-effect proves the runtime was hosted, but not that the binary is legitimate. A hash lives on the execution
    event, not on the file-write event, so this query matches the hosting binary running and reads its hash. Submit that hash to
    threat intel to determine whether it is the genuine Microsoft-signed binary, a renamed or relocated copy masquerading under a
    trusted name, or a known-malicious file. A signed original still executing an attacker's assembly is proxy execution; a
    masqueraded copy is a different problem.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: Did the hosting binary load the .NET runtime DLLs that confirm managed-code execution?
  context: >-
    The UsageLog is the on-disk trace, but the load event is the direct evidence that the binary initialized the CLR. Look for
    the hosting process loading the managed runtime modules (clr.dll, mscoree.dll, mscorlib.ni.dll, clrjit.dll). A script host or
    utility that normally never loads these DLLs doing so corroborates that it ran a .NET assembly. Check the signer of the
    loaded modules to distinguish the genuine framework from a sideloaded copy.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        ImageLoaded|endswith:
          - \clr.dll
          - \mscoree.dll
          - \mscorlib.ni.dll
          - \clrjit.dll
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - SignatureStatus
- question: Did the binary that hosted the CLR make outbound network connections consistent with payload retrieval or C2?
  context: >-
    Proxy execution through a trusted binary frequently pairs with retrieving an externally hosted assembly or beaconing to a
    controller. Review outbound connections initiated by the hosting process around the alert. Destinations that are not
    legitimate enterprise or update endpoints, or repeated connections to a single external address, warrant follow-up; suppress
    known-good corporate domains when building the baseline.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: What process spawned the binary that hosted the CLR, and is that parent chain expected?
  context: >-
    The parent reveals how the runtime host was launched. A script host or utility launched by an Office application, a browser,
    an email client, or an unusual scripting parent is a stronger signal than the same binary launched by a legitimate installer
    or management framework. Walk up the tree from the parent to reconstruct how the activity started.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A process that hosts the CLR to run a payload often touches other files as well, staging an assembly, dropping a DLL next to
    a script, or writing tool output. The breadth, paths, and extensions of the writing process's other file activity separate a
    single side-effect log from a dropper or loader in progress and enumerate what else needs review. The correlation covers the
    writer and its direct children.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other CLR UsageLog files exist under UsageLogs on this host, and which binaries do they name?
  context: >-
    Each file in a UsageLogs directory is named after a distinct binary that hosted the runtime. Enumerating the other entries
    on this host reveals whether managed-code hosting by unmanaged binaries is a one-off or a recurring pattern, and which other
    binaries were involved. A cluster of UsageLog files for script hosts and proxy binaries around the same time is a stronger
    signal than a single isolated entry.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\UsageLogs\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has this binary hosted the CLR on this host before, or is this the first time?
  context: >-
    A UsageLog for this binary that has never appeared on this host is more suspicious than one that recurs as part of normal
    operations. Zero or very low historical counts indicate first-time or rare managed-code hosting by a binary that normally
    does not run .NET; a steady history usually points to an installed tool with a legitimate managed component.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Is the same binary hosting the CLR on other hosts in the environment?
  context: >-
    The same UsageLog appearing across multiple hosts may indicate a pushed tool, a management action, or distribution of a
    loader. If the artifact is only on one host it may be targeted; if on many, determine the distribution pattern and timeline
    to tell coordinated automation from a spreading payload.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- always_include: true
  question: Has this user previously produced this CLR UsageLog pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, returning the user's 90-day history of this specific UsageLog
    firing pattern rather than generic use of the binary, aggregated by host. A user who has never produced this pattern is more
    suspicious than one who does so regularly; weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
      definition: 'Requirements: UsageLogs folder must be monitored by the sysmon configuration'
    detection:
      selection:
        TargetFilename|endswith:
        - \UsageLogs\cmstp.exe.log
        - \UsageLogs\cscript.exe.log
        - \UsageLogs\mshta.exe.log
        - \UsageLogs\msxsl.exe.log
        - \UsageLogs\regsvr32.exe.log
        - \UsageLogs\rundll32.exe.log
        - \UsageLogs\svchost.exe.log
        - \UsageLogs\wscript.exe.log
        - \UsageLogs\wmic.exe.log
      filter_main_rundll32:
        ParentImage|endswith: \MsiExec.exe
        ParentCommandLine|contains: ' -Embedding'
        Image|endswith: \rundll32.exe
        CommandLine|contains|all:
        - Temp
        - zzzzInvokeManagedCustomActionOutOfProc
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this CLR UsageLog pattern, or is the program new for this activity?
  context: >-
    When the alert fires under a service or machine account, user identity does not attribute the behavior; the launch mechanism
    does. The query mirrors the rule's selection scoped to the alerting program, returning the 90-day history of this
    program driving this specific pattern. A new or rare program for this pattern is the deviation worth chasing; a program that
    already accounts for thousands of prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
      definition: 'Requirements: UsageLogs folder must be monitored by the sysmon configuration'
    detection:
      selection:
        TargetFilename|endswith:
        - \UsageLogs\cmstp.exe.log
        - \UsageLogs\cscript.exe.log
        - \UsageLogs\mshta.exe.log
        - \UsageLogs\msxsl.exe.log
        - \UsageLogs\regsvr32.exe.log
        - \UsageLogs\rundll32.exe.log
        - \UsageLogs\svchost.exe.log
        - \UsageLogs\wscript.exe.log
        - \UsageLogs\wmic.exe.log
      filter_main_rundll32:
        ParentImage|endswith: \MsiExec.exe
        ParentCommandLine|contains: ' -Embedding'
        Image|endswith: \rundll32.exe
        CommandLine|contains|all:
        - Temp
        - zzzzInvokeManagedCustomActionOutOfProc
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around the time of the alert?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or parallel activity on multiple endpoints. If the
    same user triggered similar execution on several hosts in the same window, the scope of the activity is larger than this one
    UsageLog and should be mapped before scoping the response.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window, or is it isolated to this host?
  context: >-
    Under a service or machine account, network-wide user activity returns agent-telemetry noise, so the meaningful question is
    whether the same launch mechanism fired elsewhere. The query mirrors the rule's selection scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a
    single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
      definition: 'Requirements: UsageLogs folder must be monitored by the sysmon configuration'
    detection:
      selection:
        TargetFilename|endswith:
        - \UsageLogs\cmstp.exe.log
        - \UsageLogs\cscript.exe.log
        - \UsageLogs\mshta.exe.log
        - \UsageLogs\msxsl.exe.log
        - \UsageLogs\regsvr32.exe.log
        - \UsageLogs\rundll32.exe.log
        - \UsageLogs\svchost.exe.log
        - \UsageLogs\wscript.exe.log
        - \UsageLogs\wmic.exe.log
      filter_main_rundll32:
        ParentImage|endswith: \MsiExec.exe
        ParentCommandLine|contains: ' -Embedding'
        Image|endswith: \rundll32.exe
        CommandLine|contains|all:
        - Temp
        - zzzzInvokeManagedCustomActionOutOfProc
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining the surrounding process activity reveals what led to the CLR hosting and what
    followed it, and whether it is part of a larger sequence such as reconnaissance, privilege escalation, or persistence. Novel
    parent-child pairs stand out at low counts against the high-count agent noise.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal the stages
    that preceded managed-code hosting and help reconstruct the timeline. CLR UsageLog tampering is itself a defense-evasion
    step, so a preceding chain of evasion or execution alerts strengthens the case that this is not routine.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
