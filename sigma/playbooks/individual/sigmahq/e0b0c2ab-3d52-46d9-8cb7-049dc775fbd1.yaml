name: Enumeration for Credentials in Registry
id: 82f27b8f-6722-4c56-b0ff-f63845da1bbe
description: |
  Detects reg.exe performing a recursive value search of the registry for string values, scoped to a hive (HKLM or HKCU) or to the PuTTY saved-sessions key. This is the command-line structure used to hunt for credentials, connection strings, and stored passwords left in the registry by applications and services. Legitimate administrators and software inventory tools occasionally run broad registry searches, so confirm the user, host role, and parent chain before escalating; an unexpected account or parent enumerating credential-bearing paths points to active credential discovery.
type: detection
detection_id: e0b0c2ab-3d52-46d9-8cb7-049dc775fbd1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- question: Does the command line match a recursive reg.exe value search for stored credentials?
  context: Confirm the alert is a true positive by reviewing the exact command line. The rule fires when reg.exe runs a query with the recursive flag and a string-value type filter (' query ', '/t ', REG_SZ, '/s') AND searches a hive (HKLM or HKCU with '/f ') or the PuTTY saved-sessions key. Verify all of these elements are present in the alerting command.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to perform broad registry credential searches?
  context: Legitimate administrative activity and inventory tooling can run recursive registry searches. Knowing whether the user role and host function are consistent with credential-discovery-style queries is often the fastest way to separate routine operations from credential access.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What registry paths and search terms did this query target, and which credential stores do they expose?
  context: The full command line reveals which hive and search string were used. A '/f ' filter naming a credential-related term, or a query against HKCU\Software\SimonTatham\PuTTY\Sessions, targets application-stored secrets and connection details. The specific hive and search term determine which accounts, services, or saved sessions may be exposed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did the same host run additional reg.exe query commands targeting other hives or credential terms in the same window?
  context: Credential discovery is often iterative -- an operator sweeps HKLM, then HKCU, then specific application keys with different search strings. Surfacing other reg.exe query invocations in a tight window shows whether this was a single lookup or a systematic registry credential sweep.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith: '\reg.exe'
        CommandLine|contains: ' query '
      condition: selection and selection_reg
    fields:
      - CommandLine
      - User
- question: What process spawned reg.exe and is that parent chain expected?
  context: The parent process reveals how the query was invoked. Interactive use from explorer.exe or a known admin shell differs from invocation by a script host, Office application, or an unfamiliar binary. An unusual parent such as wscript.exe, mshta.exe, or a freshly dropped executable points to scripted or operator-driven credential discovery.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      reg:
        Image|endswith: \reg.exe
        CommandLine|contains|all:
        - ' query '
        - '/t '
        - REG_SZ
        - /s
      hive:
      - CommandLine|contains|all:
        - '/f '
        - HKLM
      - CommandLine|contains|all:
        - '/f '
        - HKCU
      - CommandLine|contains: HKCU\Software\SimonTatham\PuTTY\Sessions
      _pb_scope:
        User|expand: '%User%'
      condition: (reg and hive) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      reg:
        Image|endswith: \reg.exe
        CommandLine|contains|all:
        - ' query '
        - '/t '
        - REG_SZ
        - /s
      hive:
      - CommandLine|contains|all:
        - '/f '
        - HKLM
      - CommandLine|contains|all:
        - '/f '
        - HKCU
      - CommandLine|contains: HKCU\Software\SimonTatham\PuTTY\Sessions
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (reg and hive) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user ran credential-discovery activity on several hosts, the scope of compromise may be larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      reg:
        Image|endswith: \reg.exe
        CommandLine|contains|all:
        - ' query '
        - '/t '
        - REG_SZ
        - /s
      hive:
      - CommandLine|contains|all:
        - '/f '
        - HKLM
      - CommandLine|contains|all:
        - '/f '
        - HKCU
      - CommandLine|contains: HKCU\Software\SimonTatham\PuTTY\Sessions
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (reg and hive) and _pb_scope
    fields:
    - host.name
- question: When this host has previously fired this registry-search pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even routine tools get abused. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern has historically run here -- not generic reg.exe usage. A new parent, an unexpected user account, or an unusual command structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      reg:
        Image|endswith: \reg.exe
        CommandLine|contains|all:
        - ' query '
        - '/t '
        - REG_SZ
        - /s
      hive:
      - CommandLine|contains|all:
        - '/f '
        - HKLM
      - CommandLine|contains|all:
        - '/f '
        - HKCU
      - CommandLine|contains: HKCU\Software\SimonTatham\PuTTY\Sessions
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (reg and hive) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, or follow-on credential use.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- defense tampering, reconnaissance, or initial execution -- may reveal the attack stages that preceded this credential-discovery activity and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Which accounts or saved sessions may be exposed, and do any grant elevated or remote access?
  context: The severity depends on what the registry search could surface. PuTTY saved sessions expose hostnames and connection details for remote systems; credential strings in HKLM may belong to services or domain accounts. Cross-reference the user and any discovered targets against directory group memberships to gauge the blast radius.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Was reg.exe executed from its expected System32 path?
  context: reg.exe executed from outside System32 or SysWOW64 may indicate the binary was copied or renamed to evade path-based allowlists. A reg.exe running from a user's temp or download directory is more suspicious than one in System32.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Were other discovery or credential-access tools run on this host recently?
  context: Operators who use reg.exe to hunt for credentials often pair it with other living-off-the-land utilities for discovery and proxy execution. Finding additional LOLBins active on the host strengthens the case that this registry search is part of hands-on-keyboard credential access rather than an isolated administrative query.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\findstr.exe'
          - '\nltest.exe'
          - '\whoami.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\schtasks.exe'
          - '\sc.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: How often has this host fired this reg.exe credential-search pattern over the past 90 days, and what command-line structures are typical?
  context: A registry-search pattern with no prior history on a host is more suspicious than one used regularly under stable parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects this specific firing pattern rather than generic reg.exe usage. The command-line projection lets the analyst compare typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      reg:
        Image|endswith: \reg.exe
        CommandLine|contains|all:
        - ' query '
        - '/t '
        - REG_SZ
        - /s
      hive:
      - CommandLine|contains|all:
        - '/f '
        - HKLM
      - CommandLine|contains|all:
        - '/f '
        - HKCU
      - CommandLine|contains: HKCU\Software\SimonTatham\PuTTY\Sessions
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (reg and hive) and _pb_scope
    fields:
    - CommandLine
