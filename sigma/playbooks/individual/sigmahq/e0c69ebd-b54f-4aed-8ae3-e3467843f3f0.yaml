name: Renamed Cloudflared.EXE Execution
id: 020f7a20-a0d8-4b78-8647-b2f344b485c0
description: |
  Detects a process whose command line matches cloudflared tunnel usage while its
  binary is NOT named like an official Cloudflare release, indicating a renamed copy
  of cloudflared. The rule fires when EITHER a cleanup invocation, a tunnel-run
  invocation, an accountless quick-tunnel invocation, OR a known-bad release hash is
  present, AND the image name is not one of the canonical cloudflared names.
  cloudflared is a legitimate Cloudflare Tunnel client used for dev sharing and
  private routing, but renaming it is a masquerading step that lets an operator
  expose internal services (RDP, SMB, web shells) outbound over HTTPS to Cloudflare
  infrastructure with little network signal. Investigation should confirm the
  command line, establish the binary's true identity and origin, determine whether
  the tunnel is authorized, and identify what is being exposed and to where.
type: detection
detection_id: e0c69ebd-b54f-4aed-8ae3-e3467843f3f0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line match one of the cloudflared tunnel patterns this rule detects, and which branch fired?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires when EITHER a
    cleanup invocation (tunnel + cleanup with -config/-connector-id), OR a tunnel-run invocation
    (tunnel + run with -config/-credentials-contents/-credentials-file/-token), OR an accountless
    quick-tunnel invocation (tunnel + -url), OR a known cloudflared release hash matches, AND the
    binary name is not a canonical cloudflared name. Note which branch fired -- the run and
    accountless branches point to an active tunnel, the cleanup branch to teardown, and a
    hash-only match means a known release binary running under a non-standard name.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - Hashes
- question: Is this user and host expected to run a Cloudflare tunnel client?
  context: >-
    Legitimate tunnel usage is concentrated on developer or admin hosts with a documented
    use case. A tunnel client invoked under a renamed binary on a host or by a user with no
    development or remote-access role is far more likely to be operator-deployed access than
    sanctioned activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the actual identity of this binary based on its metadata and hash?
  context: >-
    The binary fired under a name that is not a canonical cloudflared release name, but the PE
    metadata (OriginalFileName) and code-signing details still reflect the original tool. Compare
    the Image path on disk against OriginalFileName, and check whether the file is Cloudflare-signed,
    signed by another party, or unsigned. Submit the hash for reputation lookup -- a match to an
    official cloudflared release confirms a renamed-but-genuine binary, while a non-matching hash
    points to a repacked or modified copy.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: What exactly does the tunnel command line do? Decode every flag and identify what is being exposed.
  context: >-
    The full command line reveals the tunnel mode and what is being routed. Decode the flags:
    a -token value means the configuration is pulled live from the Cloudflare console and held in
    memory only (nothing on disk to inspect); -credentials-file or -config points to local tunnel
    configuration worth retrieving; -url http://localhost:<port> exposes a specific local service
    (RDP on 3389, SMB on 445, a web shell, or a SOCKS listener). The query scopes to all executions
    of this renamed binary on this host within the window so multi-step tunnel operations are visible.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is this tunneling tool authorized for use on this host, and what business purpose does it serve?
  context: >-
    Organizations typically maintain a list of approved remote access and tunneling tools. A
    Cloudflare tunnel client -- especially one running under a renamed binary -- may represent
    shadow IT or operator-deployed persistence regardless of the tool's legitimate reputation.
    Determine whether any sanctioned development or remote-access use case covers this host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there an approved development or support context explaining this tunnel?
  context: >-
    Legitimate tunnel usage typically correlates with an active support ticket, a scheduled
    maintenance window, or a documented development task. If no support or development context
    exists for this session, the tunnel may have been established by an operator for persistent
    external access or by a user circumventing controls.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What external endpoints and ports is this tunnel client connecting to?
  context: >-
    A Cloudflare tunnel client establishes outbound connections to Cloudflare edge infrastructure,
    typically TLS on 443 and QUIC on UDP 7844, alongside argotunnel.com name resolution. Connections
    consistent with Cloudflare edge are expected for sanctioned use; connections on unusual high or
    proxy ports (for example 1080, 8080, or 4444) or to non-Cloudflare destinations indicate a
    different proxy mechanism. The destination and port reveal whether this is a Cloudflare-fronted
    tunnel and help calibrate what internal service is being relayed outbound.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: How did this renamed binary arrive on the host?
  context: >-
    Renamed binaries do not appear spontaneously -- they are copied, downloaded, or dropped by a
    parent process. Tracing the file-creation event for this basename over a long window reveals the
    delivery mechanism: a download tool, an archive extraction, a manual copy via remote access, or a
    dropper. A binary placed in a user-writable location (Desktop, Downloads, Temp, AppData) was
    likely downloaded or extracted; one in a system directory may indicate compromise of a privileged
    process. The creating process shown in Image identifies who placed it.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What did this binary do after execution, and is the same renamed binary present on other hosts?
  context: >-
    Renaming a tunnel client evades name-based detection while it performs its function. Examining
    the child processes spawned by the renamed binary reveals what it actually did beyond establishing
    the tunnel. The same renamed binary appearing on multiple hosts suggests deliberate distribution
    rather than an isolated event; pivot on OriginalFileName or hash to find other instances.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What process spawned this tunnel client, and is that parent chain expected?
  context: >-
    The parent process reveals how the tunnel client was invoked. Interactive launch from explorer.exe
    or a shell points to hands-on-keyboard operation; launch from services.exe points to a service that
    was installed for persistence; launch from a script host (wscript.exe, mshta.exe, powershell.exe) or
    an Office application points to scripted or delivered execution. Walk up the tree to see what spawned
    the parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host previously fired this tunnel pattern, what parents and users drove it, and does the current alert fit?
  context: >-
    Even legitimate tunnel clients can be abused. This query mirrors the rule's selection structure
    scoped to this host, so the resulting parent and user distribution reflects how the rule's specific
    firing pattern has historically run here rather than generic binary usage. A new parent process, an
    unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cleanup:
        CommandLine|contains|all:
        - ' tunnel '
