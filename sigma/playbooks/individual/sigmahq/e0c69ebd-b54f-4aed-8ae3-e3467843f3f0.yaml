- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining activity around the alert reveals what led to the tunnel
    being established and what happened after -- reconnaissance, privilege escalation, account creation,
    or persistence mechanisms that provide broader context. Novel parent-child pairs stand out at low
    counts against the high-count repetitive system noise.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host -- defense tampering,
    reconnaissance, credential access, or account creation -- may reveal the attack stages that
    preceded the tunnel being established and help reconstruct the full timeline. Outbound tunneling
    is frequently a mid-operation step rather than the entry point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
