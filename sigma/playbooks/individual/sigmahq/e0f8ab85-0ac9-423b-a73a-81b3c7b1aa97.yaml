name: Network Communication Initiated To File Sharing Domains From Process Located In Suspicious Folder
id: 08bdb64f-0259-49b7-a51c-4a55c9dc40be
description: |
  Detects an executable running from a potentially suspicious directory (Recycle Bin, Perflogs, Temp, Users\Public, Windows\Fonts, Windows\Temp, AppData\Temp, config\systemprofile, and similar) that initiates an outbound connection to a file-sharing, paste, or code-hosting domain. The rule fires only when both conditions match together - the process path lives in one of the watched folders AND the outbound destination hostname ends in one of the watched domains. These domains support ingress tool transfer (pulling second-stage tooling onto a host) and data exfiltration to web services, and a binary launched from a non-standard, user-writable folder reaching one of them is a common step in both. Legitimate installers unpacked to Temp occasionally reach code-hosting domains to fetch components, so establish whether the process, its path, and its destination are expected for this host.
type: detection
detection_id: e0f8ab85-0ac9-423b-a73a-81b3c7b1aa97
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the destination and initiating process match what this rule detects, and did the connection go outbound?
  context: >-
    Confirm the alert by reviewing the destination hostname, the initiating Image path, and the connection direction against
    the rule's criteria - a process running from a suspicious folder such as C:\Windows\Temp\, C:\Users\Public\, or an
    AppData\Temp\ path, reaching a file-sharing or code-hosting domain with an outbound (egress) connection. Destination
    hostname is sparsely recorded on endpoint network telemetry, so if it is blank confirm the domain through the paired
    DNS-resolution question and treat the connection's destination address as the anchor.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - Image
      - DestinationHostname
      - Initiated
- question: Is this user and host expected to run software from these folders and reach file-sharing or code-hosting domains?
  context: >-
    Legitimate administrative activity, developer workstations, and installers can produce connections to code-hosting
    domains. Knowing whether the user role and host function normally involve running binaries from user-writable folders
    and pulling content from file-sharing services is often the fastest way to separate a routine operation from a delivery
    or exfiltration step.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the process behind this connection, and what does its command line and working directory reveal?
  context: >-
    Pivot from the network event to the process record to read the full command line and current directory of the binary
    that opened the connection. The command line reveals the specific action - a download URL, an exfiltration target, an
    encoded argument, or a script path - and the working directory confirms which suspicious folder the binary was launched
    from. This process record is present only on the endpoint-collected subset of network events; a purely network-level
    detection carries no process fields, in which case fall back to the DNS-resolution and destination questions.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: What process spawned this binary, and is that parent chain expected?
  context: >-
    The parent process reveals how the binary in the suspicious folder was launched. Legitimate deliveries usually descend
    from a known updater or installer (for example a OneDrive or Chrome update process, or an msiexec-driven install);
    parents such as a script host, an Office application, or a shell spawned from a document point toward exploitation or a
    malicious loader. Tuning to known-good updater parents is the primary way to reduce false positives on this behavior.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What is this destination, and what do DNS, WHOIS, and threat intelligence reveal about it?
  context: >-
    Investigate the destination address the host connected to - passive DNS history, registration age, TLS certificate
    details, and known threat-intel hits. File-sharing and paste domains are frequently abused for both tool delivery and
    exfiltration precisely because the traffic blends with normal web activity, so distinguish a routine content-delivery
    endpoint from attacker-staging infrastructure by its reputation and how this host uses it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - DestinationPort
- question: Did this host resolve any of the watched file-sharing domains, and which process issued the lookup?
  context: >-
    Destination hostname is rarely recorded on the connection event itself, so the DNS lookup is the reliable way to
    confirm which file-sharing or code-hosting domain the host contacted and, critically, which process asked for it. The
    resolving process is the load-bearing pivot when the network event carries no process fields - it ties the outbound
    connection back to the binary in the suspicious folder. Compare the resolving process against the expected owner of any
    legitimate file-sharing traffic.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|endswith:
          - .githubusercontent.com
          - 0x0.st
          - anonfiles.com
          - bashupload.com
          - cdn.discordapp.com
          - chunk.io
          - ddns.net
          - dl.dropboxusercontent.com
          - ghostbin.co
          - github.com
          - glitch.me
          - gofile.io
          - hastebin.com
          - mediafire.com
          - mega.co.nz
          - mega.nz
          - onrender.com
          - pages.dev
          - paste.ee
          - pastebin.com
          - pastebin.pl
          - pastetext.net
          - pixeldrain.com
          - privatlab.com
          - privatlab.net
          - send.exploit.in
          - sendspace.com
          - storage.googleapis.com
          - storjshare.io
          - supabase.co
          - temp.sh
          - transfer.sh
          - trycloudflare.com
          - ufile.io
          - w3spaces.com
          - workers.dev
          - x0.at
      condition: selection
    fields:
      - QueryName
      - Image
- question: Does this host normally communicate with this destination?
  context: >-
    First-time connections to a destination are more suspicious than routine communication. A host that has never reached
    this address before, or reaches it only from an unexpected process, points to new staging or exfiltration
    infrastructure rather than established business traffic. Weigh the result against whether the address is an internal
    service or an external file-sharing endpoint, since only external destinations carry ingress or exfiltration risk here.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
- question: Was a file created on disk after this connection, indicating a completed transfer?
  context: >-
    An outbound connection to a file-sharing domain does not prove a file was actually retrieved - the request may have
    been blocked, failed, or been an exfiltration upload rather than a download. Correlating file writes to the connecting
    process and its direct children establishes whether a payload landed on disk and where, which distinguishes a delivery
    that progressed from one that stalled at the network stage.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Is any file written by this process still on disk for analysis?
  context: >-
    If the connection pulled down a payload, checking whether the resulting file still exists on disk enables deeper
    analysis - hash lookup, sandbox submission, or content review. Files dropped into the same user-writable folders the
    rule watches (C:\Users\Public\, C:\Windows\Temp\, AppData\Temp\) are the ones most likely to be second-stage tooling.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did this process or its spawned children write to disk around the alert?
  context: >-
    A transfer rarely arrives alone - the same process, or a child it spawns, often writes further files during extraction,
    decompression, or a follow-on download. Surfacing the full file-write footprint of the connecting process and its
    direct children reveals the broader scope of the delivery beyond a single dropped file.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: If a transferred payload was executed, what is its hash, and is it known to threat intelligence?
  context: >-
    The hash needed for a reputation lookup or sandbox detonation is recorded when a payload runs, not when it is written -
    file-creation events carry no hash in this telemetry. This query returns the processes the connecting binary and the
    shell that launched it spawned - its children and siblings - with their executable hashes; for a download-and-execute
    that is the payload. If the payload was run later by an unrelated process it will not appear here, so retrieve the file
    from the on-disk path and hash it manually.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection_children
    fields:
      - Image
      - Hashes
- question: What child processes did this binary spawn afterward?
  context: >-
    The processes spawned by the connecting binary reveal its actual impact. A benign installer has predictable children;
    a delivery step often spawns interpreters or living-off-the-land utilities (cmd.exe, powershell.exe, certutil.exe,
    rundll32.exe) to run or unpack the retrieved payload, which turns a single network alert into a visible execution chain.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run this binary from this location?
  context: >-
    A binary that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low
    historical counts for this executable indicate first-time or rare execution, which for a process launched from a
    user-writable folder reaching a file-sharing domain raises the likelihood of a delivery or staging step.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining process activity around the connection reveals what led to it and what
    followed - reconnaissance, credential access, staging, or additional transfers - and whether this event is one step in
    a larger sequence. Novel parent-child pairs standing out at low counts are what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - defense tampering, reconnaissance, credential access - may reveal the attack
    stages that preceded this connection and help reconstruct the timeline. Ingress tool transfer is often a mid-chain
    step, so a preceding execution or evasion alert changes how this event should be weighed.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
