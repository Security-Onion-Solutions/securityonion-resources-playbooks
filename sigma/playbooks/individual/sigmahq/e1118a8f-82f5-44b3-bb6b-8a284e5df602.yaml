name: Potential ACTINIUM Persistence Activity
id: 10895844-8a27-4c00-af80-01d982897f9c
description: |
  Detects a single command line that combines all four of schtasks, create, wscript, and the
  /e:vbscript engine flag — a scheduled-task registration whose task action launches wscript.exe
  against a VBScript file with the script engine named explicitly. All four elements must be
  present together, so the rule fires on task creation whose payload is a VBScript interpreter
  invocation rather than on scheduled-task creation generally. ACTINIUM tooling registers
  recurring tasks in this form to re-launch staged VBScript droppers after reboot, frequently
  with the script placed under a world-writable directory and an unremarkable task name. The
  investigation should recover the task name, schedule, and script path from the command line,
  confirm whether the task was actually registered and has already run, identify the parent that
  drove the registration, and determine whether the script and its follow-on activity are part of
  documented automation.
type: detection
detection_id: e1118a8f-82f5-44b3-bb6b-8a284e5df602
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the alerting command line contain all four elements the rule requires — schtasks, create, wscript, and the /e:vbscript engine flag?
  context: The rule requires every one of the four substrings in the same command line, so a match
    means a scheduled task was being registered whose action runs wscript.exe against a VBScript
    file. Confirm all four are present in the alerting command rather than a partial match, and
    note the quoting style, since the task action is nested inside the outer schtasks arguments.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to register scheduled tasks that launch wscript against a VBScript file?
  context: Scheduled tasks whose action is a script interpreter are common in older in-house
    automation and in some vendor installers, so the account and the host function matter. A
    build server or an administrator workstation registering an interpreter-backed task is
    ordinary; the same command from a general user endpoint with no scripting role is not.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this scheduled-task registration part of an authorized penetration test or red team engagement?
  context: Scheduled tasks running script interpreters are a routine persistence step in
    authorized assessments. Before investing investigation time, check whether an engagement is
    active on this host or network segment. An authorized exercise with matching task names,
    script paths, and timing resolves the alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: What scheduled task was created, and what command does it execute?
  context: >-
    Read the task name from /TN, the action from /TR, the schedule from /SC and /MO, and any
    run-as account from /RU. In this pattern the /TR value holds a nested wscript.exe invocation
    with the script path and the //e:VBScript engine selector; that path is the persistence
    payload. A short recurring interval (for example /sc minute /mo 12), a task name unrelated to
    any installed product, and a script under a world-writable directory such as the Public
    profile are the parameters worth recording before touching the host. A /RU of SYSTEM means
    the payload runs with full local privilege.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Is the task action or the referenced VBScript encoded or obfuscated, and what operation does the decoded content perform?
  context: >-
    The /TR value can carry escaped quoting, environment-variable substitution such as %PUBLIC%
    or %windir%, and doubled slashes on the engine selector, all of which hide the real script
    path from a quick read. Resolve the variables and the quoting to get the literal path, then
    read the script itself. Staged VBScript droppers of this family typically reconstruct strings
    from Chr() chains or concatenation, then fetch and execute a later stage, so the decoded
    content is what identifies the operation rather than the task command line alone. The
    unusual file extension on the script (a name that does not end in .vbs) is why the engine had
    to be named explicitly.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned the schtasks invocation, and is that parent chain expected?
  context: The parent reveals how the task registration was driven. An administrator working
    interactively produces explorer.exe or a console shell; a deployment tool produces its own
    agent. A parent of wscript.exe, mshta.exe, an Office application, or a shell spawned by one
    of those indicates the registration came from a staged script rather than an operator, which
    is the pattern this family uses to convert a first-stage document execution into persistence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Do the task-registration audit events confirm the task was created, and was it later updated or deleted?
  context: >-
    Task registration is recorded independently of the creating command line on the Security
    channel — 4698 when a task is created, 4702 when its definition is updated, 4699 when it is
    deleted. These events carry the task name and the account that performed the operation, so
    they confirm the schtasks command actually registered a task rather than failing on a
    malformed argument, and they show whether the task still stands or was removed after running.
    A 4698 followed shortly by a 4699 is the self-cleanup pattern. If these audit events are not
    collected in this environment, treat their absence as a visibility gap rather than evidence
    the task was never created.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4698
          - 4702
          - 4699
      condition: selection
    fields:
      - EventID
      - TaskName
      - user.name
  answer_sources:
  - manual_review
- question: Were Task Scheduler registry entries written for this task on the host?
  context: A registered task is persisted under the Schedule\TaskCache tree, with entries under
    TaskCache\Tree carrying the task name and TaskCache\Tasks holding the GUID-keyed definition
    and its action string. These writes survive reboot and are the on-disk commitment of the
    persistence, so their presence confirms the registration took effect and locates the task
    definition for removal. The value data on the Tasks subkey often contains the wscript action
    string, which corroborates the script path recovered from the command line.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - manual_review
- question: When is the task scheduled to run, and has it already executed?
  context: The trigger determines when the persistence activates. A minute-interval task set at
    creation time fires within the same hour and will have run repeatedly by the time the alert
    is reviewed; a logon or boot trigger waits for the next session. Tasks run as children of the
    Task Scheduler service, so processes spawned by the svchost.exe instance hosting the Schedule
    service after the registration show whether the VBScript payload has already executed. Widen
    the window for logon and boot triggers.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\svchost.exe'
        ParentCommandLine|contains: 'Schedule'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What files did the alerting process write to the host?
  context: Registering a task writes its XML definition under Windows\System32\Tasks with the task
    name as the file name, and the definition contains the full action string including the
    script path and arguments. Files written by the alerting process therefore confirm the
    registration landed on disk and give a second copy of the payload path that survives even if
    the process record has aged out. Any additional files written in the same window are worth
    reading alongside it.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: The query mirrors the rule's selection scoped to this host, so the resulting parent and
    user distribution reflects how this specific combination of schtasks, create, wscript, and the
    engine flag has historically run here rather than generic schtasks usage. A recurring
    deployment or an in-house script produces a stable parent and account; a new parent process
    or an account that has never registered an interpreter-backed task is the deviation worth
    chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - schtasks
        - create
        - wscript
        - ' /e:vbscript'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection scoped to this user, so the result is the
    90-day history of this account registering wscript-backed tasks, aggregated by host. A
    scripting or packaging role with a steady count across build hosts reads differently from an
    account with no prior instance of the pattern. Weigh the count against the user's role and
    normal toolset rather than against raw volume.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - schtasks
        - create
        - wscript
        - ' /e:vbscript'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: Has this parent process historically driven the rule's pattern on this host or across the environment, or is the parent new for this activity?
  context: >-
    When the registration runs under a service principal, user identity attributes nothing — the
    launch mechanism does. The query mirrors the rule's selection scoped to the alerting parent
    process, so the result is the 90-day history of this parent driving this specific pattern,
    aggregated by host. A parent already accounting for hundreds of prior registrations across
    many hosts is deployment automation; a parent that is new for this pattern, or that appears
    on only the alerting host, is the deviation to pursue.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - schtasks
        - create
        - wscript
        - ' /e:vbscript'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did this user do across the network around this time?
  context: Persistence is normally one step in a sequence. Tracking the account's activity across
    every host in the surrounding hour shows whether the same identity was also staging files,
    running interpreters, or registering tasks elsewhere, which sets the scope of the
    investigation beyond the alerting host. If the alert fired under a machine account or a
    built-in service principal, this view returns routine agent telemetry and the parent-scoped
    view is the meaningful one.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal the user-scoped network view returns agent telemetry from every
    host and answers nothing. The meaningful question is whether the same launch mechanism
    registered the same kind of task elsewhere in the alert window: the query mirrors the rule's
    selection scoped to the alerting parent process, fleet-wide. Several hosts in the same window
    points to a scheduled or pushed rollout; a single host points to a host-local trigger such as
    a script that ran only there.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - schtasks
        - create
        - wscript
        - ' /e:vbscript'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What other activity occurred on this host around the time of the alert?
  context: 'Aggregating process activity on the host in the surrounding window collapses routine
    telemetry into high-count rows and leaves novel parent-child pairs visible at low counts.
    That is what to scan for: a document handler spawning a shell, an interpreter running from a
    user-writable directory, an archive utility unpacking a stage, or a second persistence tool
    running near the task registration.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: Persistence sits in the middle of an intrusion, not at its start. Earlier detections on
    the same host — a document handler spawning an interpreter, a remote-template fetch, an
    archive self-extracting, or a download cradle — reconstruct how the operator reached the point
    of registering a task and identify the first-stage artifact that needs recovering.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a
    fleet-wide count of this exact task-registration pattern. Many hosts firing it with a
    consistent parent and task name points to a packaged installer or in-house deployment worth
    documenting as an exception. One host, or a small unrelated set, points to operator-driven
    activity and raises the priority of recovering the script payload.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - schtasks
        - create
        - wscript
        - ' /e:vbscript'
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
