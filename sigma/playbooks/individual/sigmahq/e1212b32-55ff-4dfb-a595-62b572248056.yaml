name: Diamond Sleet APT File Creation Indicators
id: ee5408c4-b85a-414a-9b65-635e341e5c35
description: |
  Detects creation of files whose paths match a set of known Diamond Sleet intrusion indicators, all written under C:\ProgramData: a config blob named 4800-84DC-063A6A41C5C, plus clip.exe, DSROLE.dll, Forest64.exe, readme.md, Version.dll, and wsmprovhost.exe. These correspond to two payload-delivery patterns — a downloaded loader (Forest64.exe) that reads and decrypts a co-located config blob with an embedded key, and DLL search-order hijack pairings (DSROLE.dll beside wsmprovhost.exe, Version.dll beside clip.exe with readme.md as an XOR key) where a legitimately signed executable is used to sideload a malicious DLL that reverses or XOR-decrypts an embedded payload into memory.
  Because these are exact filename and path indicators rather than a behavioral pattern, a match is high-confidence. Investigation should confirm the exact file created, examine its content, determine whether it later executed or was loaded as a DLL, identify the process that wrote it and its parent chain, and enumerate co-dropped components and any other affected hosts.
type: detection
detection_id: e1212b32-55ff-4dfb-a595-62b572248056
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the created file path match one of this rule's known indicator paths?
  context: >-
    Before investing investigation time, confirm the alert is a true positive by reviewing the exact
    created file path and the responsible process against the rule's indicator list. The rule fires when
    a file is written whose path ends in one of the ProgramData indicators — the 4800-84DC-063A6A41C5C
    config blob, clip.exe, DSROLE.dll, Forest64.exe, readme.md, Version.dll, or wsmprovhost.exe. Note
    which specific indicator matched, because that determines which payload pattern applies.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to have files written into C:\ProgramData under these names?
  context: >-
    Legitimate software occasionally writes to ProgramData, but the specific indicator filenames here are
    not associated with normal operations. Knowing whether the host role and the writing account are
    consistent with routine ProgramData activity helps separate a true positive from noise. When the
    writer is a machine or service account, judge by the writing process and host function instead of the
    account name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this file drop part of an authorized penetration test or red team engagement?
  context: >-
    Named intrusion indicators are sometimes reproduced during authorized security assessments or
    detection-tuning exercises that stage sample payloads on disk. Before deeper analysis, check whether
    a sanctioned test is active on this host or network segment. A matching engagement with corresponding
    timing resolves the alert without further work; the query re-displays the writing event so it can be
    matched against engagement scope.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the file still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives urgency and next steps. A payload still on disk can be
    retrieved, hashed, and analyzed; a file deleted seconds after creation suggests anti-forensic cleanup
    or a self-deleting stager and shifts the focus to what executed in between. The config blob and the
    sideloaded DLLs are read by their loaders shortly after being dropped, so a short-lived file is
    consistent with the delivery pattern.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What is the content and structure of this dropped file, and is it the malicious component or a benign look-alike?
  context: >-
    Retrieve the file and examine what is actually in it. For the DLLs (DSROLE.dll, Version.dll), check the
    exports and whether the code reverses the byte order of neighboring files or XOR-decrypts an embedded
    payload — DSROLE.dll exposes a StartAction export and reads files in its directory, while Version.dll
    uses readme.md as a multibyte XOR key to decrypt position-independent code. For the executables
    (Forest64.exe, clip.exe, wsmprovhost.exe), check signing status and whether they are the genuine signed
    binaries used to sideload a DLL. For the 4800-84DC-063A6A41C5C blob, look for encrypted config data.
    This content question is distinct from a hash or reputation lookup — it answers what is in the file, not
    whether the hash is known.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If this artifact has executed or been loaded, what is its hash, and does it have known detections?
  context: >-
    A file's hash is recorded when it runs, not when it is written, so file-creation events carry no hash.
    This query looks for the artifact executing and reads its hash; submit that to threat intelligence to
    determine whether it is known malicious, benign, or previously unseen. For the sideloaded DLLs
    (DSROLE.dll, Version.dll), the hash appears on the DLL load event rather than a process start. If the
    artifact is present but has not executed, retrieve it from its on-disk path and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
- question: What process wrote this file, and is that parent chain expected?
  context: >-
    The process that created the file and its parent reveal how the drop was staged. In this delivery
    pattern the files are written by a downloader such as powershell.exe, often descending from a
    compromised service or build-server process rather than an interactive user session. An unexpected
    ancestry — a script host or service account writing signed-executable and DLL pairs into ProgramData —
    is the deviation to chase.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Was this file executed or loaded as a DLL after it was created?
  context: >-
    A dropped file becomes dangerous once it runs. Forest64.exe and the signed sideload hosts (clip.exe,
    wsmprovhost.exe) appear in process_creation when launched, while DSROLE.dll and Version.dll appear as
    DLL loads inside their paired host process. Correlating the write to a later execution or load reveals
    whether the intrusion progressed from delivery to running code and which downstream process to examine.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    This delivery pattern drops components in sets — a loader plus its encrypted config, or a signed
    executable plus the malicious DLL and key file it sideloads. A process that wrote one indicator often
    wrote the paired components in the same window. The breadth, paths, and names of the process's other
    file activity enumerate what else needs review and distinguish an isolated artifact from a staged
    multi-file payload.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to C:\ProgramData recently, and by which processes?
  context: >-
    Location drives suspicion here — the indicators all land directly in ProgramData, which a small set of
    installers and services legitimately writes to. Other recent arrivals in the same directory reveal
    whether this is an isolated drop or a location under active staging, and which co-dropped components
    (the config blob, key file, or paired DLL) belong to the same activity. A single unfamiliar writer
    across several ProgramData files is the signal.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\ProgramData\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has a file with this indicator path been seen before on this host?
  context: >-
    A file that has never appeared on a host is more suspicious than one that is part of normal operations.
    These indicator paths are not expected to recur; zero or very low historical counts confirm a first-time
    appearance, while a prior history would point to a benign local process that happens to use one of these
    names and warrants closer confirmation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Is a file with this indicator path present on any other hosts in the environment?
  context: >-
    Finding the same indicator file on multiple hosts points to broader intrusion activity or deliberate
    distribution; a single host suggests a targeted drop. If the file appears across several hosts,
    determine the distribution pattern and timeline to scope the affected systems. The query matches the
    indicator filename across hosts rather than scoping to the alerting host.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- always_include: true
  question: Has this user previously produced this indicator-drop pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user — the result is the user's 90-day history of
    these specific indicator paths being written, aggregated by host, rather than generic file activity. A
    user who has never produced this pattern is more suspicious than one who does so regularly; weigh the
    count against the account's role. When the alert fires under a service or machine account, the launch
    mechanism is the more meaningful pivot.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith:
        - :\ProgramData\4800-84DC-063A6A41C5C
        - :\ProgramData\clip.exe
        - :\ProgramData\DSROLE.dll
        - :\ProgramData\Forest64.exe
        - :\ProgramData\readme.md
        - :\ProgramData\Version.dll
        - :\ProgramData\wsmprovhost.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this indicator-drop pattern, or is the program new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute the behavior; the
    launch mechanism does. The query mirrors the rule's selection scoped to the alerting program, so
    the result is the 90-day history of this program writing these indicator paths — not generic use of the binary. A new or rare program for this pattern is the deviation worth chasing;
    a program that already accounts for many prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith:
        - :\ProgramData\4800-84DC-063A6A41C5C
        - :\ProgramData\clip.exe
        - :\ProgramData\DSROLE.dll
        - :\ProgramData\Forest64.exe
        - :\ProgramData\readme.md
        - :\ProgramData\Version.dll
        - :\ProgramData\wsmprovhost.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts around the alert reveals lateral movement or coordinated
    activity on multiple endpoints. If the same account triggered related activity elsewhere in the same
    window, the scope of the intrusion may be larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven pattern write these indicators on other hosts in the same window?
  context: >-
    Under a service principal, cross-network user activity returns agent-telemetry noise. The meaningful
    question is whether the same launch mechanism dropped these indicators elsewhere: the query mirrors the
    rule's selection scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts
    in the same window point to scheduled or pushed automation; a single host points to a host-local
    trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith:
        - :\ProgramData\4800-84DC-063A6A41C5C
        - :\ProgramData\clip.exe
        - :\ProgramData\DSROLE.dll
        - :\ProgramData\Forest64.exe
        - :\ProgramData\readme.md
        - :\ProgramData\Version.dll
        - :\ProgramData\wsmprovhost.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining process activity around the drop reveals what led to it and
    what followed — a download stager, a scheduled-task registration for persistence, a sideloaded process
    reaching out for command and control, or credential-access tooling. Novel parent-child pairs stand out
    against the aggregated background of routine processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — exploitation of an internet-facing service, script-based
    downloads, reconnaissance, or credential access — may reveal the stages that preceded this file drop and
    help reconstruct the timeline. The delivery pattern here typically follows initial access to a
    vulnerable service, so preceding alerts often mark how the host was first reached.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
