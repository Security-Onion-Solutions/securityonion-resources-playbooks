name: Invoke-Obfuscation Via Use Clip
id: b190f993-e4a0-436a-94bf-a10f16e5819f
description: |
  Detects a command-line pattern characteristic of the Invoke-Obfuscation CLIP+ launcher, where a payload is echoed into the
  Windows clipboard via clip.exe and then read back and invoked by PowerShell (echo ... | clip && powershell ...
  [Clipboard]::GetText().Invoke()). The technique bounces an obfuscated PowerShell command through the clipboard to evade
  command-line inspection, and the invocation itself runs in memory rather than from a file. Legitimate clipboard piping with
  clip.exe is common in scripting, but the combination of an echoed payload followed by a clipboard read that resolves to
  Clipboard or a backtick-broken Invoke is rarely benign. Investigation should decode the obfuscated payload, identify what the
  resolved command executes, and confirm whether the launch context and user are expected.
type: detection
detection_id: e1561947-b4e3-4a74-9bdd-83baed21bdb5
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the alerting command line match the clipboard-launcher obfuscation pattern this rule detects?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires on a single command line that
    echoes content into the clipboard via clip.exe and then reads it back with a Clipboard reference or a backtick-broken
    Invoke. Review the full command line of the triggering event and confirm both halves of the pattern are present.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run clipboard-piped command interpreters?
  context: >-
    Legitimate administrative scripting can pipe text through clip.exe, but a clipboard read that resolves to PowerShell
    invocation is unusual outside of obfuscation frameworks. Knowing whether the user role and host function include
    interactive scripting or automation that uses this pattern is often the fastest way to separate routine activity from
    operator tradecraft.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this clipboard-launcher execution part of an authorized penetration test or red team engagement?
  context: >-
    The Invoke-Obfuscation framework that produces this clipboard-launcher pattern is used in authorized security
    assessments. Before deeper analysis, check whether a penetration test or red team exercise is active on this host or
    network segment. An authorized engagement with matching timing and tooling resolves the alert without further work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Are any files referenced or written by the decoded payload still on disk for analysis?
  context: >-
    Clipboard-launched payloads often resolve to download cradles or in-memory loaders that may drop a secondary file. If the
    decoded command references a payload path, decoded output, or downloaded file, checking whether it still exists on disk
    enables hash lookups, content review, and reputation checks.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What does the clipboard-bounced payload decode to, and what operation does the resolved command perform?
  context: >-
    The clipboard launcher hides the real command by echoing it into the clipboard and resolving it back at runtime, often
    layered with backtick escaping, string concatenation, or base64. Reconstruct the obfuscated payload and identify what the
    resolved command does -- common outcomes are download cradles such as Net.WebClient.DownloadString, in-memory .NET
    assembly loading, or reverse shells. Focus on any payload source and what ultimately gets executed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did the PowerShell process load the .NET automation assemblies that indicate in-memory script execution on this host?
  context: >-
    The clipboard launcher resolves its payload in memory through a Clipboard GetText invocation rather than from a file, so
    the in-memory invocation surfaces as image-load events for the PowerShell automation and CLR assemblies (such as
    System.Management.Automation and clr.dll) on the host. Correlate these loads in the alert window to confirm that an
    in-memory PowerShell invocation actually ran. If image-load telemetry is not collected in this environment, treat zero
    results as a visibility gap rather than evidence nothing executed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|contains:
          - 'System.Management.Automation'
          - 'System.Management.Automation.ni.dll'
          - '\clr.dll'
          - '\clrjit.dll'
          - 'amsi.dll'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
- question: Did PowerShell script block logging capture the deobfuscated content of the clipboard-resolved command?
  context: >-
    Script block logging records the deobfuscated script content that PowerShell actually executes, even when the original
    command line is obfuscated or resolved from the clipboard at runtime. This provides ground truth about what ran, bypassing
    the clipboard indirection. If PowerShell operational logs are not ingested in this environment, treat the absence of
    records as a visibility gap worth noting.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell security controls bypassed or weakened on this host before this execution?
  context: >-
    Obfuscated launchers are frequently paired with control evasion. Common precursors include AMSI bypass by patching
    amsi.dll in memory, execution policy changes, constrained language mode escapes, and PowerShell version-2 downgrade
    attacks that lack logging. Finding these events in the hour before the clipboard launcher fired strengthens the case for
    malicious intent.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: What process spawned the clipboard launcher, and is that parent chain expected?
  context: >-
    The parent process reveals how the launcher was invoked. A clipboard one-liner launched from explorer.exe or an
    interactive cmd session looks different from one spawned by mshta.exe, wscript.exe, an Office application, or a remote
    execution service. Walk up the tree to see what spawned the parent and what else it spawned.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously fired this clipboard-launcher pattern, what parents and users drove it, and does the current alert fit?
  context: >-
    Even on hosts where this pattern has appeared before, the parent process and user distribution reflects how the rule's
    specific firing pattern has historically run here, not generic clip.exe usage. A new parent process, an unexpected user
    account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|re: (?i)echo.*clip.*&&.*(?:Clipboard|i`?n`?v`?o`?k`?e`?)
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this clipboard-launcher pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    This query counts the rule's firing pattern fleet-wide with no host scope, so the result reflects the clipboard-launcher
    pattern rather than generic clip.exe usage. Many hosts firing the same pattern points to scripted deployment or vendor
    automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|re: (?i)echo.*clip.*&&.*(?:Clipboard|i`?n`?v`?o`?k`?e`?)
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|re: (?i)echo.*clip.*&&.*(?:Clipboard|i`?n`?v`?o`?k`?e`?)
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|re: (?i)echo.*clip.*&&.*(?:Clipboard|i`?n`?v`?o`?k`?e`?)
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the
    same user triggered similar activity on multiple hosts, the scope of the incident may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|re: (?i)echo.*clip.*&&.*(?:Clipboard|i`?n`?v`?o`?k`?e`?)
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining activity around the alert reveals what led to this event and what happened
    after, and whether it is part of a larger sequence. Novel parent-child process pairs stand out against the repetitive
    background of agent telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host -- defense tampering, reconnaissance, or credential
    access -- may reveal the attack stages that preceded this clipboard launcher and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
