name: Suspicious Creation with Colorcpl
id: aeff76e7-4477-443a-95a5-66cafcef6753
description: |
  Detects colorcpl.exe writing a file into the color driver directory
  (c:\windows\system32\spool\drivers\color\) whose extension is not one of the
  legitimate color-profile types (.icm, .gmmp, .cdmp, .camp). colorcpl is a
  living-off-the-land binary: given a file path as an argument it copies that file
  into the color directory, a location not normally monitored, which lets an
  operator relocate a payload out of a commonly watched staging area through a
  process that is rarely inspected. Legitimate color-management activity writes
  actual color profiles; the investigation should determine what file colorcpl
  copied, where it came from, whether that file has since executed, and whether
  this copy fits normal color-management use for the host and user.
type: detection
detection_id: e15b518d-b4ce-4410-a9cd-501f23ce4a18
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Did colorcpl.exe write a non-color-profile file into the color driver directory, as this rule detects?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when colorcpl.exe is the writing
    process AND the created file's extension is not a legitimate color-profile type (.icm, .gmmp, .cdmp, .camp). Review the exact
    file path, the file name and extension, and the responsible process against those criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to run colorcpl and drop files into the color driver directory?
  context: >-
    Legitimate color-management activity does invoke colorcpl, but it writes actual color profiles. A file that is not a color
    profile being placed there by a user or host with no color-management role is the anomaly. When the writing identity is a
    machine or service account, judge by the writing process and the host's function instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What file did colorcpl copy? Decode its command line to recover the source path it was given.
  context: >-
    colorcpl takes a file path as an argument and copies that file into the color directory. The source path in the command line
    identifies what was actually relocated and where it came from, for example a payload staged under a user Temp or Downloads
    directory. The file event itself carries no command line, so this pivots to the process record for the same writing process.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What is the copied file, and what type is it once the color-profile extensions are set aside?
  context: >-
    The rule fires precisely because the copied file's extension is not one of the legitimate color-profile types, so the file's
    real type is the load-bearing signal. Retrieve it from its on-disk path and check whether it is a PE executable, a script,
    a DLL, or another payload rather than a genuine color profile, and inspect its content for obfuscation, encoded strings, or
    embedded indicators.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What process launched colorcpl, and is that parent chain expected?
  context: >-
    The parent process reveals how colorcpl was invoked. Interactive color-management use is normally launched from control-panel
    or explorer-driven chains. A parent such as cmd.exe, powershell.exe, wscript.exe, mshta.exe, or an Office application points
    to scripted or operator-driven use of the copy primitive rather than a user adjusting color settings.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: If the copied file has since executed, what is its hash and does it have known threat-intel detections?
  context: >-
    A file's hash is recorded when it runs, not when it is written, so the file-creation event carries no hash. This looks for
    the copied file executing from any path and reads its hash; submit that to reputation and threat-intel sources to decide whether
    it is known malicious, benign, or previously unseen. If the file is present in the color directory but has not executed,
    retrieve it from disk and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
- question: What else has been written to the color driver directory recently, and by which processes?
  context: >-
    The color directory has a small set of processes that legitimately write there, and they write color profiles. Other recent
    arrivals in that directory, especially executables, scripts, or DLLs written by unexpected processes, reveal whether this is
    an isolated copy or a location under active use for staging relocated payloads.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\spool\drivers\color\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What other files did colorcpl write or delete around the alert?
  context: >-
    A process that relocates one file often relocates several. The breadth, paths, and extensions of colorcpl's other file activity
    in the surrounding window distinguish a single copy from a batch of staged payloads and enumerate what else was moved into or
    out of monitored locations and needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has a file with this name been written to this host before?
  context: >-
    A file that has never been seen on a host is more suspicious than one that is part of normal operations. First-time appearance
    of this file name in the color directory should be checked even if the name looks benign, since colorcpl lets an operator pick
    the destination name.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Does this host run colorcpl at all under normal operations?
  context: >-
    colorcpl runs during genuine color-management activity, which is rare on most hosts and absent on many. A host with zero or
    very low historical execution of colorcpl is more suspicious when it suddenly runs it to copy a non-profile file; a host that
    runs it regularly narrows the question to whether this particular copy fits that routine.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this rule's pattern, what programs and users drove it, and does the current alert fit?
  context: >-
    Even a benign-looking tool can be abused. This mirrors the rule's selection scoped to this
    host, so the resulting program and user distribution reflects how colorcpl writing non-
    color- profile files has historically run here, not generic colorcpl usage. A new acting
    program process, an unexpected user account, or a first-time firing is the deviation worth
    chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith: \colorcpl.exe
      filter_ext:
        TargetFilename|endswith:
        - .icm
        - .gmmp
        - .cdmp
        - .camp
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_*) and _pb_scope
    fields:
    - Image
    - User
- always_include: true
  question: Has this user previously produced this rule's pattern, and does that history fit their role?
  context: >-
    This mirrors the rule's selection scoped to this user, so the result is the user's 90-day history of colorcpl writing
    non-color-profile files, aggregated by host, rather than generic use of the binary. A user who has never produced this pattern
    is more suspicious than one who does so regularly; weigh the count against the user's role and expected toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith: \colorcpl.exe
      filter_ext:
        TargetFilename|endswith:
        - .icm
        - .gmmp
        - .cdmp
        - .camp
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this rule's pattern, or is the program new for this activity?
  context: >-
    When the alert fires under a service or machine account, user identity does not attribute behavior; the launch mechanism does.
    This mirrors the rule's selection scoped to the alerting program, so the result is the 90-day history of this program
    driving colorcpl to write non-profile files. A new or rare program for this pattern is the deviation; a program already accounting
    for thousands of prior events is vendor or operating-system automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith: \colorcpl.exe
      filter_ext:
        TargetFilename|endswith:
        - .icm
        - .gmmp
        - .cdmp
        - .camp
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or parallel activity on multiple endpoints. If the same
    user drove similar tool use or file staging on other hosts in the same window, the scope of the activity is larger than this
    single copy.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window, or is it isolated to this host?
  context: >-
    Under a service or machine account, asking what else the user did returns agent-telemetry noise. The meaningful question is
    whether the same launch mechanism fired elsewhere: this mirrors the rule's selection scoped to the alerting program,
    fleet-wide, in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host
    points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith: \colorcpl.exe
      filter_ext:
        TargetFilename|endswith:
        - .icm
        - .gmmp
        - .cdmp
        - .camp
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- question: What other processes ran on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining the process activity around the copy reveals what led to it and what followed,
    such as a script that invoked colorcpl or a later launch of the relocated file. Look for reconnaissance, privilege escalation,
    persistence, or execution that provides broader context.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal the stages
    that preceded this copy and help reconstruct the full timeline of the activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
