name: Suspicious WMIC Execution Via Office Process
id: 34541588-8b0c-4729-936e-8105e0184d01
description: |
  Detects an Office application (Word, Excel, PowerPoint, Publisher, Visio, Access, Equation Editor, OneNote, or WordPad)
  spawning wmic.exe with a "process call create" command that launches a proxy-execution binary such as regsvr32, rundll32,
  msiexec, mshta, verclsid, wscript, or cscript. The rule fires only when all three conditions match together: an Office
  parent, the WMIC image or original filename, and the WMIC command-line pattern combining process/create/call with one of
  the proxy keywords. Legitimately, Office almost never invokes wmic.exe to launch another interpreter; this pattern is a
  documented macro-execution trick that breaks the visible Office-to-payload parent-child chain by routing the launch through
  WMI. Investigation should confirm what document drove the macro, decode the full WMIC command and the proxied payload, and
  check whether the proxy binary loaded a module or reached out to the network afterward.
type: detection
detection_id: e1693bc8-7168-4eab-8718-cdcaa68a1738
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line match what this rule detects, with an Office parent launching WMIC to proxy a child binary?
  context: >-
    Confirm the alert is a true positive by reviewing the triggering event against all three required conditions together:
    the parent is an Office application, the image is wmic.exe (or OriginalFileName wmic.exe), and the command line combines
    process, create, and call with one of the proxy keywords (regsvr32, rundll32, msiexec, mshta, verclsid, wscript, cscript).
    All three must hold for the rule to fire, so verify each one rather than assuming.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to invoke WMIC from an Office application?
  context: >-
    Office applications launching wmic.exe to start another interpreter is not part of normal document workflows. Knowing
    whether this user routinely runs administrative WMI commands and whether this host is an admin workstation helps separate
    a rare-but-legitimate scripted task from macro-driven execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this Office application expected to spawn WMIC, and what started the Office process itself?
  context: >-
    The Office-to-WMIC relationship is the core signal. Tracing the Office parent's own origin shows whether it was launched
    interactively by a user opening a document or by some other process. A macro spawning wmic.exe to proxy a payload is the
    pattern this rule targets; identifying the document that drove it is the next step.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What exactly did the WMIC command do? Decode the full process-call-create argument and the proxied payload.
  context: >-
    The WMIC command line carries the real action. Parse the "process call create" argument to recover the full command WMIC
    was told to spawn, including the proxy binary (regsvr32, rundll32, msiexec, mshta, verclsid, wscript, or cscript) and its
    arguments. Look for a remote scriptlet or DLL path, a switch such as regsvr32 -s, and any URL or user-writable file path
    that the proxy binary will load or execute.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What document or email attachment triggered this execution?
  context: >-
    Office spawning WMIC almost always traces back to a macro or embedded object in a delivered file. Check the parent command
    line for the document filename and determine whether it arrived by email, web download, or a share. Identifying the
    document enables blocking it at the perimeter and searching for other recipients.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Is this Office installation fully patched against macro, OLE, and DDE execution issues?
  context: >-
    Some macro-execution and document-handling weaknesses depend on the Office version. Confirming patch level helps establish
    whether the execution relied on a known vulnerability and identifies other similarly unpatched systems at risk. Patch
    status also helps distinguish exploitation of a known issue from a novel one.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: What other child processes did the same Office parent spawn?
  context: >-
    If the Office macro spawned wmic.exe, it likely spawned other processes too. Examining siblings of the WMIC process under
    the same parent reveals the full scope of macro activity -- additional interpreters, downloaders, or persistence tools
    launched from the same document.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Are the files referenced by the proxied command still on disk for analysis?
  context: >-
    The proxied command frequently names a file -- a scriptlet, DLL, or payload the proxy binary will load, often dropped to
    a user-writable path. Checking whether those files still exist enables hash lookups, sandbox submission, and content
    review. The file paths come from the decoded WMIC command line.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did the proxied binary load a scriptlet or DLL shortly after WMIC launched it?
  context: >-
    Proxy-execution binaries such as regsvr32 and rundll32 work by loading a module -- a .sct/.ocx scriptlet or a DLL,
    sometimes from a temporary directory or a user-writable path. A module load from outside System32 or SysWOW64 by the
    proxied binary right after the WMIC launch is the operational payload step. Correlate the load time and path against the
    decoded command.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\regsvr32.exe'
          - '\rundll32.exe'
          - '\msiexec.exe'
          - '\mshta.exe'
          - '\verclsid.exe'
          - '\wscript.exe'
          - '\cscript.exe'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
- question: Did the proxied binary make outbound network connections after WMIC launched it?
  context: >-
    Proxy-execution binaries are commonly used to fetch or beacon to a remote host after launch -- regsvr32 retrieving a
    remote scriptlet, rundll32 or mshta reaching out for a second stage. An outbound connection from the proxied binary in
    the minutes after the WMIC launch identifies the destination to block and pivots the investigation toward command and
    control. Exclude known-good update or proxy destinations when reviewing results.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\regsvr32.exe'
          - '\rundll32.exe'
          - '\msiexec.exe'
          - '\mshta.exe'
          - '\wscript.exe'
          - '\cscript.exe'
        Initiated: 'true'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
- question: Was WMIC executed from its expected System32 path?
  context: >-
    WMIC normally runs from C:\Windows\System32\wbem\WMIC.exe. A wmic.exe running from a user temp directory or another
    non-standard path, or one whose OriginalFileName is wmic.exe while the image name differs, may have been copied or
    renamed to evade path-based allowlists. Compare the image path against the expected location.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Were any other proxy-execution LOLBins used on this host recently?
  context: >-
    Operators who proxy execution through one trusted binary often use several. If WMIC launched regsvr32, check whether
    rundll32, mshta, msiexec, installutil, or similar binaries were also used to run code on this host in the same window.
    Multiple proxy-execution binaries performing the same kind of launch strengthens the case for hands-on activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\installutil.exe'
          - '\xwizard.exe'
          - '\verclsid.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: How often has this host fired the Office-to-WMIC proxy pattern over the past 90 days, and what command-line structures are typical?
  context: >-
    A pattern with no prior history on a host is more suspicious than one seen routinely under stable parents. This query
    mirrors the rule's full selection structure scoped to this host, so the count reflects the rule's specific firing pattern
    rather than generic WMIC usage. The command-line projection lets you compare typical invocation patterns against the
    alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_parent:
        ParentImage|endswith:
        - \WINWORD.EXE
        - \EXCEL.EXE
        - \POWERPNT.exe
        - \MSPUB.exe
        - \VISIO.exe
        - \MSACCESS.EXE
        - \EQNEDT32.EXE
        - \ONENOTE.EXE
        - \wordpad.exe
        - \wordview.exe
      selection_wmic_img:
      - Image|endswith: \wbem\WMIC.exe
      - OriginalFileName: wmic.exe
      selection_wmic_cli:
        CommandLine|contains|all:
        - process
        - create
        - call
        CommandLine|contains:
        - regsvr32
        - rundll32
        - msiexec
        - mshta
        - verclsid
        - wscript
        - cscript
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_parent:
        ParentImage|endswith:
        - \WINWORD.EXE
        - \EXCEL.EXE
        - \POWERPNT.exe
        - \MSPUB.exe
        - \VISIO.exe
        - \MSACCESS.EXE
        - \EQNEDT32.EXE
        - \ONENOTE.EXE
        - \wordpad.exe
        - \wordview.exe
      selection_wmic_img:
      - Image|endswith: \wbem\WMIC.exe
      - OriginalFileName: wmic.exe
      selection_wmic_cli:
        CommandLine|contains|all:
        - process
        - create
        - call
        CommandLine|contains:
        - regsvr32
        - rundll32
        - msiexec
        - mshta
        - verclsid
        - wscript
        - cscript
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_parent:
        ParentImage|endswith:
        - \WINWORD.EXE
        - \EXCEL.EXE
        - \POWERPNT.exe
        - \MSPUB.exe
        - \VISIO.exe
        - \MSACCESS.EXE
        - \EQNEDT32.EXE
        - \ONENOTE.EXE
        - \wordpad.exe
        - \wordview.exe
      selection_wmic_img:
      - Image|endswith: \wbem\WMIC.exe
      - OriginalFileName: wmic.exe
      selection_wmic_cli:
        CommandLine|contains|all:
        - process
        - create
        - call
        CommandLine|contains:
        - regsvr32
        - rundll32
        - msiexec
        - mshta
        - verclsid
        - wscript
        - cscript
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or activity on multiple endpoints. If the same
    user triggered similar activity elsewhere, the scope of the incident may be larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_parent:
        ParentImage|endswith:
        - \WINWORD.EXE
        - \EXCEL.EXE
        - \POWERPNT.exe
        - \MSPUB.exe
        - \VISIO.exe
        - \MSACCESS.EXE
        - \EQNEDT32.EXE
        - \ONENOTE.EXE
        - \wordpad.exe
        - \wordview.exe
      selection_wmic_img:
      - Image|endswith: \wbem\WMIC.exe
      - OriginalFileName: wmic.exe
      selection_wmic_cli:
        CommandLine|contains|all:
        - process
        - create
        - call
        CommandLine|contains:
        - regsvr32
        - rundll32
        - msiexec
        - mshta
        - verclsid
        - wscript
        - cscript
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Were other users or systems hit by the same delivery vector?
  context: >-
    Document-borne execution rarely targets a single user. If this rule fired on one host, the same malicious document may
    have reached others. Correlating this detection across hosts reveals campaign breadth and identifies additional systems
    that need investigation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
