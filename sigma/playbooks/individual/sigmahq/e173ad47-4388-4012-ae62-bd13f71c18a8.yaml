name: Potential DLL Sideloading Via DeviceEnroller.EXE
id: ff922fc2-0e7b-4dba-9e74-bdbd7471d22a
description: |
  Detects DeviceEnroller.exe being run with the /PhoneDeepLink parameter, which causes the
  signed system binary to attempt to load a library named ShellChromeAPI.dll. The rule fires
  when the Image ends in deviceenroller.exe OR the OriginalFileName is deviceenroller.exe, AND
  the command line contains /PhoneDeepLink. ShellChromeAPI.dll does not ship with Windows, so
  the load normally fails harmlessly; an actor who drops a renamed library by that name into a
  directory DeviceEnroller.exe searches gets their code loaded and executed inside a trusted,
  Microsoft-signed process. The investigation should confirm the command line and binary
  identity, determine whether ShellChromeAPI.dll was actually present and loaded, find any file
  write or registry redirection that planted it, and establish whether this DeviceEnroller.exe
  invocation fits any legitimate MDM-enrollment activity on this host.
type: detection
detection_id: e173ad47-4388-4012-ae62-bd13f71c18a8
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- question: Was deviceenroller.exe run with the /PhoneDeepLink parameter, and does the binary identity match?
  context: Before investing investigation time, confirm the alert. The rule fires when the Image
    ends in deviceenroller.exe OR the OriginalFileName is deviceenroller.exe, AND the command line
    contains /PhoneDeepLink. Read the exact command line, Image path, and OriginalFileName from the
    triggering event. A binary whose OriginalFileName is deviceenroller.exe but whose Image sits in
    a non-system path is a relocated copy and is the stronger sideload candidate; the /PhoneDeepLink
    flag is what makes the trusted binary attempt the ShellChromeAPI.dll load.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run device enrollment tooling?
  context: DeviceEnroller.exe is the Windows MDM enrollment client and normally runs in the context
    of managed-device enrollment, typically driven by the OS or management agents rather than by an
    interactive user. A host that is enrolled or being enrolled in an MDM, and an account associated
    with that workflow, is a routine context. An ad-hoc interactive launch on a host with no
    enrollment activity, or under an account with no enrollment responsibility, is a weaker fit and
    pushes the disposition toward deliberate invocation to trigger the phantom-DLL load.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this DeviceEnroller.exe invocation do? Decode its full command line and working directory.
  context: The full command line and working directory reveal what this invocation was anchored to
    and whether anything beyond /PhoneDeepLink was supplied. The working directory matters here
    because DeviceEnroller.exe resolves ShellChromeAPI.dll relative to its own load path and current
    directory; a working directory in a temporary, profile, or staging path indicates the binary may
    have been positioned alongside a planted library rather than invoked from its system location.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Did this DeviceEnroller.exe process load ShellChromeAPI.dll, and from what directory and signer?
  context: ShellChromeAPI.dll does not ship with Windows, so a successful load of a module by that
    name is the core sideload event this rule anticipates. Review the loaded modules for this process
    and locate any ShellChromeAPI.dll, the directory it was loaded from, and its signature. A
    ShellChromeAPI.dll loaded from the same directory the binary ran from, from a temporary or profile
    path, or carrying no valid Microsoft signature is the suspected attacker library running inside
    the trusted process. Absence of the module suggests the load failed harmlessly, which is the
    normal outcome.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith: \ShellChromeAPI.dll
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- question: Was a file named ShellChromeAPI.dll written into a directory DeviceEnroller.exe searches around this time?
  context: The sideload requires the attacker library to be present where the trusted binary will
    find it. File-write events for ShellChromeAPI.dll, or for any library written into the directory
    DeviceEnroller.exe ran from, often show the planted module arriving shortly before execution,
    including files decoded or renamed from an innocuous extension into a DLL. A ShellChromeAPI.dll
    written into the system32 directory, the binary's own directory, or a current-directory staging
    path just before the alert supports the sideload reading; review the writing process to identify
    who placed it.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: \ShellChromeAPI.dll
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: Were registry values that influence DLL search order or known-DLL resolution modified on this host around this time?
  context: Beyond co-locating a library, an actor can redirect which library a process resolves by
    editing registry values that govern DLL search behavior or known-DLL mappings. Modifications to
    these values near the alert can explain how DeviceEnroller.exe was steered to load an attacker
    library and represent a more durable redirection than a one-time file drop. Review the changed
    value, the writing process, and whether the change aligns with any documented configuration work.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\Session Manager\KnownDLLs'
          - '\Session Manager\ExcludeFromKnownDlls'
          - '\Image File Execution Options\'
          - '\CWDIllegalInDllSearch'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What process spawned this DeviceEnroller.exe and is that parent chain expected?
  context: The parent process reveals how the binary was invoked. Legitimate enrollment runs are
    normally launched by the OS, management agents, or service hosts. A DeviceEnroller.exe spawned by
    a command shell, a script host, an Office application, or a decode-and-rename chain points to the
    binary being driven deliberately to trigger the phantom-DLL load rather than as part of genuine
    enrollment. The parent process and its own command line establish how this invocation was
    initiated.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Does this host normally run deviceenroller.exe?
  context: A binary that has rarely or never run on a host is more notable than one that runs on a
    predictable cadence. On an MDM-managed host, DeviceEnroller.exe may appear around enrollment or
    policy events; on a host with no enrollment activity it should be effectively absent. Zero or very
    low historical counts indicate a first-time or rare execution, which fits a deliberately staged
    invocation rather than routine enrollment.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even a signed system binary can be abused. The query mirrors the rule's selection structure
    scoped to this host, so the resulting parent and user distribution reflects how this rule's
    specific firing pattern (DeviceEnroller.exe with /PhoneDeepLink) has run here, not generic binary
    usage. A new parent process, an unexpected user account, or an unusual launch pattern relative to
    that history is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \deviceenroller.exe
      - OriginalFileName: deviceenroller.exe
      selection_cli:
        CommandLine|contains: /PhoneDeepLink
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did this DeviceEnroller.exe spawn afterward?
  context: A genuine enrollment run has limited, predictable children. Code running from a sideloaded
    ShellChromeAPI.dll inside DeviceEnroller.exe commonly leads to additional execution such as command
    shells, script hosts, or download utilities used for post-exploitation. Unexpected child processes
    following this DeviceEnroller.exe are a strong sign the invocation served as a loader for attacker
    code rather than as an enrollment action.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \deviceenroller.exe
      - OriginalFileName: deviceenroller.exe
      selection_cli:
        CommandLine|contains: /PhoneDeepLink
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \deviceenroller.exe
      - OriginalFileName: deviceenroller.exe
      selection_cli:
        CommandLine|contains: /PhoneDeepLink
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning
    multiple endpoints. If the same account triggered similar sideloading or relocated-binary activity
    on more than one host, the scope of the compromise may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \deviceenroller.exe
      - OriginalFileName: deviceenroller.exe
      selection_cli:
        CommandLine|contains: /PhoneDeepLink
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate
    context: what led up to this event, what happened after, and whether it is part of a larger
    sequence. Look for the decode-and-rename utilities, file drops, or follow-on execution that often
    accompany staging a phantom DLL for sideloading.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering,
    a malicious document opening, a decode-and-rename chain, or reconnaissance — may reveal the stages
    that preceded this event and help reconstruct how a planted ShellChromeAPI.dll came to be loaded
    here.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of this rule's firing pattern (DeviceEnroller.exe with /PhoneDeepLink) rather than
    generic binary usage. Many hosts firing the same pattern points to a deployment or management
    workflow that invokes this parameter; one host or a small unrelated set points to targeted, manual
    activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \deviceenroller.exe
      - OriginalFileName: deviceenroller.exe
      selection_cli:
        CommandLine|contains: /PhoneDeepLink
      condition: all of selection_*
    fields:
    - host.name
