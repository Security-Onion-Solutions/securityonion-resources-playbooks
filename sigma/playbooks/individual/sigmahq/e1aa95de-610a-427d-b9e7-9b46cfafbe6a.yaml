name: Windows Defender Service Disabled - Registry
id: 74dca3a5-20f9-4a21-aa79-020b650f7cc3
description: |
  Detects a registry modification that sets the WinDefend service Start value to 4 (0x00000004, Disabled) under
  HKLM\SYSTEM\CurrentControlSet\Services\WinDefend\Start, which prevents the Windows Defender antivirus service from
  starting at the next boot and leaves the host without its built-in protection. Administrators occasionally disable the
  service when deploying a third-party antivirus product, so the change is not malicious on its own, but attackers set
  this value to blind the host before dropping or executing a payload, and it frequently appears alongside broader
  defense-tampering and ransomware staging. Determine which process and user wrote the value, whether the change
  persists, what ran on the host afterward, and whether other controls were tampered with in the same session.
type: detection
detection_id: e1aa95de-610a-427d-b9e7-9b46cfafbe6a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the registry write set the WinDefend service Start value to 4 (Disabled) at the WinDefend\Start key?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when the TargetObject ends
    in \Services\WinDefend\Start AND the value data is the DWORD 0x00000004 (Start type 4, Disabled). Review the exact
    key path and the Details value against those two criteria, and note the writing process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to disable the Windows Defender service?
  context: >-
    Legitimate disabling of the WinDefend service is usually tied to deploying a replacement antivirus product or a
    documented maintenance routine, not to an interactive operator on an ordinary workstation. Knowing whether this
    account and host function normally reconfigure the Defender service is often the fastest way to separate a sanctioned
    change from tampering. User attribution is present on most endpoint registry events; when it is a machine account or
    missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value was written to the WinDefend Start key and what does it mean?
  context: >-
    Service Start values are DWORDs where 2 is Automatic, 3 is Manual, and 4 is Disabled. A value of 4 (0x00000004) on
    WinDefend stops the Defender antivirus service from starting at boot, disabling real-time protection until the value
    is restored. Read the Details field to confirm the disabled value and check the writing process for whether the
    change came from a service installer or from an operator tool such as reg.exe or powershell.exe.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Is the WinDefend\Start key a known defense-evasion location, and what process wrote to it?
  context: >-
    The \Services\WinDefend\Start key controls whether the Defender antivirus service loads at boot; setting it to
    Disabled is a recognized defense-evasion action rather than a routine configuration change. Identify the writing
    process (Image) and confirm the key and value data, since a service-manager or installer origin reads differently
    from a hands-on-keyboard reg.exe or PowerShell write.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which security control did this action target, and how much protection did it remove?
  context: >-
    The write disables the WinDefend antivirus service specifically, which removes real-time scanning and behavioral
    protection for the whole host once the service is stopped or the machine reboots. Pivot to the writing process on its
    ProcessGuid to read the full command line and confirm whether the service disable was a standalone action or one step
    in a larger tampering sequence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the disabled Start value still stand, and has the key been re-modified since?
  context: >-
    Judge whether the change is durable from the key's modification history over a longer window rather than from a
    deletion event, because value or key removals are not observable in this endpoint telemetry. If the Start value has
    since been reset to Automatic (2), a control may have restored it; if it remains 4 or was re-applied after a reset,
    the host is still exposed. Confirm the current state by inspecting the running service rather than assuming cleanup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Is Windows Defender currently restored, or is the host still running unprotected?
  context: >-
    Disabling the service may be temporary or persistent. Check the current state of the Defender antivirus service
    directly on the host or through the endpoint management console; if the service is still disabled or stopped, restore
    protection before continuing the investigation. The query re-displays the writing process so the action can be tied
    to a specific operator or tool.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were other registry modifications made on this host in the same session?
  context: >-
    Attackers who disable one Defender component often modify several keys together, such as setting the WinDefend Start
    value AND writing Defender policy keys AND changing firewall settings. Look at all registry writes on the host in the
    surrounding window grouped by key path and writing process; the WinDefend\Start change will appear, and the signal is
    what else was modified alongside it. If the host is registry-noisy, narrow to the writing process or to security-
    relevant hive paths such as Services, Policies, Run, and Winlogon.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Were other defense-tampering actions performed on this host?
  context: >-
    Disabling the Defender service is often one step of a broader effort that also clears event logs, deletes shadow
    copies, disables recovery, or stops other security services. Finding several such actions from the same user or
    parent process within a short window indicates that multiple controls were targeted in one operation rather than an
    isolated configuration change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: What activity occurred on this host after the Defender service was disabled?
  context: >-
    Defenses are disabled to enable something the scanner would otherwise block or log, such as malware execution,
    credential theft, or lateral movement staging. Examine process activity in the window after the WinDefend Start value
    was set to Disabled; new processes running with protection down point to what the tampering was meant to enable.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: What process disabled the service, and is its parent chain expected?
  context: >-
    The writing process on the alert made the registry change; its parent reveals how that write was launched. A service
    installer or management console reads differently from reg.exe or powershell.exe spawned by a script host, an Office
    application, or a remote-execution tool. Walk up the lineage to see what invoked the writing process.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Has the WinDefend\Start key been modified before on this host?
  context: >-
    Security service configuration keys should rarely change on a stable host. A first-time modification to the WinDefend
    Start value is more suspicious than a recurring change, and comparing prior Details values shows whether the service
    has been toggled before. Zero history indicates a key that has never been touched, which raises the priority.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining process activity around the registry write reveals what led to it and
    what followed, and whether the service disable is part of a larger sequence such as reconnaissance, privilege
    escalation, or payload staging. Novel parent-child pairs at low counts are what to scan for; high-count rows are
    usually routine agent and system noise.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host, such as reconnaissance, credential access, or other defense tampering, may
    reveal the attack stages that preceded this event and help reconstruct the timeline. Defense tampering commonly sits
    between initial access and execution, so an alert immediately before or after this one often names the next
    investigative pivot.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was the WinDefend\Start key set to Disabled on other hosts in the environment?
  context: >-
    The same modification across many hosts may indicate a policy or deployment change disabling Defender fleet-wide,
    whereas a single affected host looks targeted. Compare the Details values and writing processes across hosts to tell a
    sanctioned rollout from opportunistic tampering.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    Attackers who take down a control often also plant persistence so their access survives a reboot or cleanup. Look for
    scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions created around the same time; several
    persistence installations in one timeframe indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations such as the Startup folder or scheduled-task definition paths on this host?
  context: >-
    File-based persistence bypasses command-line detection entirely. Dropping an executable or script into a Startup
    folder or a path referenced by a registry Run key achieves persistence without running schtasks, sc, or reg. File
    event monitoring captures these drops even when the attacker avoids the standard persistence tools, which is relevant
    once protection has been disabled on the host.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
