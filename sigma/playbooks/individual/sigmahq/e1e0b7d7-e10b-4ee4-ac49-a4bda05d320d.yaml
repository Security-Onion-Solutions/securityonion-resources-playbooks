name: File Encryption/Decryption Via Gpg4win From Suspicious Locations
id: a2801ae6-cf48-4213-bbb1-af640bed8de0
description: |
  Detects Gpg4win (gpg.exe / gpg2.exe) invoked with a -passphrase argument that references a file path
  in a transient or world-writable location (PerfLogs, Temp, Users\Public, Windows\Temp, AppData\Local\Temp,
  AppData\Roaming). Legitimate GnuPG use exists, but symmetric passphrase operations against staged files in
  these directories are a common loader step for decrypting downloaded payloads before execution. The rule
  fires only when GnuPG metadata, the -passphrase flag, and a suspicious path all appear together; the
  investigation should determine what file was decrypted or encrypted, where its plaintext output landed,
  and what ran next.
type: detection
detection_id: e1e0b7d7-e10b-4ee4-ac49-a4bda05d320d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the gpg command line match what this rule detects — GnuPG with -passphrase against a file in a suspicious location?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line
    against the rule's criteria. All three conditions must hold together for a real fire — GnuPG product/description metadata,
    the -passphrase flag, and a file path under PerfLogs, Temp, Users\Public, Windows\Temp, AppData\Local\Temp, or
    AppData\Roaming. Note which path matched, as it scopes where the staged file lives.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - Description
      - Product
- question: Is this user and host expected to run GnuPG passphrase operations against files in transient directories?
  context: Legitimate administrative or developer use of GnuPG exists, but symmetric passphrase operations against files
    staged in Temp or AppData are rarely part of routine workflows. Knowing whether the user role and host function
    involve encryption tooling is often the fastest path to separating a true positive from a routine operation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this gpg invocation do? Decode the full command line — is it decrypting or encrypting, and against which file?
  context: The full command line reveals the operation. Look for the mode (-d / --decrypt vs. -c / --symmetric / --encrypt),
    -o / --output for the destination path, --batch and --yes for non-interactive operation, and the input file path. A
    decrypt of a staged .gpg file into an executable or DLL in the same directory is a classic loader unpack step; identify
    both the input file and the output file so the rest of the investigation can follow the unpacked artifact.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What passphrase and mode were supplied to gpg, and was the secret passed inline or by another channel?
  context: The rule fires on the presence of -passphrase, which places the secret directly on the command line. Read the
    exact value and the operation mode — a short literal passphrase paired with --batch --yes against a staged file points
    to scripted, hands-off unpacking rather than interactive user encryption. Some invocations supply the secret via
    --passphrase-fd or a file instead, in which case it will not appear in the command line.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What files did gpg read or write on this host around the time of the alert?
  context: The command-line arguments name an input file, but the file events show what GnuPG actually touched — the staged
    ciphertext it read and any plaintext output it produced. For a decrypt operation the output is frequently an executable,
    DLL, or installer dropped into the same Temp or AppData directory; the set of files touched determines what artifact to
    chase next.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: Where did the decrypted or encrypted output land, and was it moved afterward?
  context: A decrypt step usually writes plaintext to a -o / --output path, and that file is the payload that runs next.
    Identify the output path and watch for the same file being moved, copied, or renamed. For an encrypt step the output
    is ciphertext that may be staged for transfer, so pivoting to outbound network connections from this host in the same
    window is worthwhile.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process spawned gpg, and is that parent chain expected?
  context: The parent process reveals how GnuPG was invoked. Interactive use typically descends from explorer.exe or a shell
    the user opened. Parents such as cmd.exe or powershell.exe running a batch or script chain, mshta.exe, wscript.exe, or
    an installer process point to scripted invocation that decrypts staged content as part of a larger sequence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did gpg spawn, or what ran immediately after it on this host?
  context: GnuPG itself rarely spawns children, so the meaningful follow-on is what executed right after the decrypt
    completed. A freshly written executable, DLL loader (rundll32.exe, regsvr32.exe), installer (msiexec.exe), or script
    host launching seconds after the gpg event suggests the decrypted output was immediately run.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. A decrypt step sits in the middle of a loader chain — examining the surrounding
    process activity reveals what fetched and staged the ciphertext beforehand and what executed the plaintext afterward.
    Aggregating by parent and child collapses repetitive agent noise so novel pairs stand out.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_metadata:
      - Image|endswith:
        - \gpg.exe
        - \gpg2.exe
      - Product: GNU Privacy Guard (GnuPG)
      - Description: "GnuPG\u2019s OpenPGP tool"
      selection_cli:
        CommandLine|contains: -passphrase
      selection_paths:
        CommandLine|contains:
        - :\PerfLogs\
        - :\Temp\
        - :\Users\Public\
        - :\Windows\Temp\
        - \AppData\Local\Temp\
        - \AppData\Roaming\
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_metadata:
      - Image|endswith:
        - \gpg.exe
        - \gpg2.exe
      - Product: GNU Privacy Guard (GnuPG)
      - Description: "GnuPG\u2019s OpenPGP tool"
      selection_cli:
        CommandLine|contains: -passphrase
      selection_paths:
        CommandLine|contains:
        - :\PerfLogs\
        - :\Temp\
        - :\Users\Public\
        - :\Windows\Temp\
        - \AppData\Local\Temp\
        - \AppData\Roaming\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or staging spread across multiple
    endpoints. If the same user triggered similar activity elsewhere, the scope of the operation may be larger than this one
    host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_metadata:
      - Image|endswith:
        - \gpg.exe
        - \gpg2.exe
      - Product: GNU Privacy Guard (GnuPG)
      - Description: "GnuPG\u2019s OpenPGP tool"
      selection_cli:
        CommandLine|contains: -passphrase
      selection_paths:
        CommandLine|contains:
        - :\PerfLogs\
        - :\Temp\
        - :\Users\Public\
        - :\Windows\Temp\
        - \AppData\Local\Temp\
        - \AppData\Roaming\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Does this host normally run GnuPG at all?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low
    historical counts of gpg or gpg2 on this host indicate first-time or rare execution, which raises the weight of the
    suspicious-path and passphrase signals.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this rule's pattern, what parents and users normally drove it, and does the current alert fit?
  context: Even common tools can be abused. This query mirrors the rule's full selection — GnuPG metadata, the -passphrase
    flag, and a suspicious path — scoped to this host, so the resulting parent and user distribution reflects how the rule's
    specific firing pattern has historically run here. A new parent process, an unexpected account, or an unusual
    command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_metadata:
      - Image|endswith:
        - \gpg.exe
        - \gpg2.exe
      - Product: GNU Privacy Guard (GnuPG)
      - Description: "GnuPG’s OpenPGP tool"
      selection_cli:
        CommandLine|contains: -passphrase
      selection_paths:
        CommandLine|contains:
        - :\PerfLogs\
        - :\Temp\
        - :\Users\Public\
        - :\Windows\Temp\
        - \AppData\Local\Temp\
        - \AppData\Roaming\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: This query mirrors the rule's full selection with no host scope, so the result is a fleet-wide count of the rule's
    firing pattern rather than generic GnuPG usage. Many hosts firing the same pattern points to scripted deployment or
    vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and
    parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_metadata:
      - Image|endswith:
        - \gpg.exe
        - \gpg2.exe
      - Product: GNU Privacy Guard (GnuPG)
      - Description: "GnuPG’s OpenPGP tool"
      selection_cli:
        CommandLine|contains: -passphrase
      selection_paths:
        CommandLine|contains:
        - :\PerfLogs\
        - :\Temp\
        - :\Users\Public\
        - :\Windows\Temp\
        - \AppData\Local\Temp\
        - \AppData\Roaming\
      condition: all of selection_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — a download or fetch step, defense
    tampering, or reconnaissance — may reveal the attack stages that staged the encrypted file before this decrypt and help
    reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
