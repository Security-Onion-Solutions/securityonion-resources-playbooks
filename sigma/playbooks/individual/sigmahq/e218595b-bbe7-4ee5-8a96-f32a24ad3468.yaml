name: Suspicious Curl.EXE Download
id: dc0f2b2a-df08-475a-b8b9-26260b73e3ca
description: |
  Detects curl.exe started in a way that downloads a remote resource to a local file in a user-writable or staging
  location, or with an output filename whose extension is commonly used to disguise a payload. The rule fires when the
  process is curl AND the command line references EITHER a suspicious location (AppData, Public, Temp, ProgramData,
  PerfLogs, Windows\Temp, Desktop) OR a suspicious output extension (.dll, .png, .jpg, .txt, .vbs, .tmp, and similar) -
  the Git-for-Windows update helper invocation is excluded. curl is a signed, built-in Windows binary, so legitimate
  developer and automation use is common; the investigation should establish where the file came from, whether it
  landed on disk, what it contains, and whether the launch mechanism and host fit normal patterns.
type: detection
detection_id: e218595b-bbe7-4ee5-8a96-f32a24ad3468
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the curl command line match what this rule detects - curl writing to a staging location OR using a disguised output extension?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires when the process is curl AND the command
    line either references a suspicious download location (AppData, Public, Temp, ProgramData, PerfLogs, Windows\Temp,
    Desktop) OR ends in a suspicious output extension (.dll, .png, .jpg, .gif, .jpeg, .txt, .temp, .tmp, .vbs, .vbe).
    Note which branch fired - a disguised extension and a staging path carry different downstream weight when judging
    the output file.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - Product
- question: Is this user and host expected to download files with command-line tools like curl?
  context: >-
    Legitimate developer workflows, build agents, and IT automation routinely use curl to fetch files. Knowing whether
    this user role and host function normally pull remote resources via the command line is often the fastest way to
    separate routine activity from operator-driven download.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this curl invocation do? Decode the full command line - URL, output path, and transfer flags.
  context: >-
    The full command line reveals the source URL, the output file path and name, and any flags (-o/--output, -O,
    --silent, headers, proxy, or insecure transport). Identify the remote host the file was pulled from and the exact
    destination on disk; these drive the download-success, content, and file-baseline questions.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is the downloaded file still on disk at the destination path for analysis?
  context: >-
    The command references an output file. Checking whether that file still exists enables hash lookups, sandbox
    submission, or content review. If it is already gone, the download may have been staged-and-deleted, or the file
    may have been moved or executed.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What external destination did this curl process connect to, and is it an internal or external address?
  context: >-
    Ingress tool transfer pairs a downloading process with an outbound connection to the resource host. Pivot from the
    curl process to its network connections to recover the destination address and port. An external address pulling
    content into a staging path is the core transfer; a purely internal destination may indicate intra-environment
    staging or a benign internal mirror. Compare the destination against known-good update or repository endpoints.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - Initiated
- question: Was the download successful? Check for file creation at the destination path.
  context: >-
    A curl command does not guarantee the file arrived. Network errors, blocked URLs, or security controls may have
    prevented the transfer. Confirming a file-creation event at the target path establishes whether the activity
    progressed past delivery into a payload on disk.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What is the content of the downloaded file? Check for obfuscation, encoded strings, and known malware indicators.
  context: >-
    Read and analyze the file the command wrote. A suspicious extension or staging path is a disguise hint, not proof -
    a .png or .txt output may actually be a script, DLL, or encoded payload. Check for base64 or other encoding,
    embedded URLs or IP addresses, script content, and packer or signing characteristics for binaries. Content analysis
    requires retrieving the file from the endpoint or an EDR console.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: If the file curl downloaded was executed, what is its hash for a threat-intelligence check?
  context: >-
    The hash for a reputation lookup is recorded when the payload runs, not when curl writes it to disk —
    file-creation events carry no hash. curl only fetches; the payload is usually run by the same shell as a sibling
    or child process, so this query returns those processes with their executable hashes — match the downloaded file
    name and submit its hash. If it was run later by an unrelated process, retrieve it from disk and hash it manually.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      selection_siblings:
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: 1 of selection_*
    fields:
      - Image
      - Hashes
- question: What other files did this process or its spawned children write to disk around the alert?
  context: >-
    A download rarely arrives alone - the same process, or a child it spawns, may write further
    files (extraction, decompression, a second-stage download). This surfaces the broader
    file-write footprint of the alerting process and its direct children around the alert.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process spawned curl, and is that parent chain expected?
  context: >-
    The parent process reveals how curl was invoked. Build agents, scripts, and IT automation have predictable parents;
    curl spawned by Office applications, mshta.exe, wscript.exe, or a freshly written script in a user-writable path
    points toward operator or malware-driven download. Note that the Git-for-Windows updater parent is already filtered
    out by the rule.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_curl:
      - Image|endswith: \curl.exe
      - Product: The curl executable
      selection_susp_locations:
        CommandLine|contains:
        - '%AppData%'
        - '%Public%'
        - '%Temp%'
        - '%tmp%'
        - \AppData\
        - \Desktop\
        - \Temp\
        - \Users\Public\
        - C:\PerfLogs\
        - C:\ProgramData\
        - C:\Windows\Temp\
      selection_susp_extensions:
        CommandLine|endswith:
        - .dll
        - .gif
        - .jpeg
        - .jpg
        - .png
        - .temp
        - .tmp
        - .txt
        - .vbe
        - .vbs
      filter_optional_git_windows:
        ParentImage: C:\Program Files\Git\usr\bin\sh.exe
        Image: C:\Program Files\Git\mingw64\bin\curl.exe
        CommandLine|contains|all:
        - '--silent --show-error --output '
        - gfw-httpget-
        - AppData
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_curl and 1 of selection_susp_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_curl:
      - Image|endswith: \curl.exe
      - Product: The curl executable
      selection_susp_locations:
        CommandLine|contains:
        - '%AppData%'
        - '%Public%'
        - '%Temp%'
        - '%tmp%'
        - \AppData\
        - \Desktop\
        - \Temp\
        - \Users\Public\
        - C:\PerfLogs\
        - C:\ProgramData\
        - C:\Windows\Temp\
      selection_susp_extensions:
        CommandLine|endswith:
        - .dll
        - .gif
        - .jpeg
        - .jpg
        - .png
        - .temp
        - .tmp
        - .txt
        - .vbe
        - .vbs
      filter_optional_git_windows:
        ParentImage: C:\Program Files\Git\usr\bin\sh.exe
        Image: C:\Program Files\Git\mingw64\bin\curl.exe
        CommandLine|contains|all:
        - '--silent --show-error --output '
        - gfw-httpget-
        - AppData
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_curl and 1 of selection_susp_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or staging across multiple endpoints. If the
    same user drove similar download activity on more than one host, the scope may be larger than a single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_curl:
      - Image|endswith: \curl.exe
      - Product: The curl executable
      selection_susp_locations:
        CommandLine|contains:
        - '%AppData%'
        - '%Public%'
        - '%Temp%'
        - '%tmp%'
        - \AppData\
        - \Desktop\
        - \Temp\
        - \Users\Public\
        - C:\PerfLogs\
        - C:\ProgramData\
        - C:\Windows\Temp\
      selection_susp_extensions:
        CommandLine|endswith:
        - .dll
        - .gif
        - .jpeg
        - .jpg
        - .png
        - .temp
        - .tmp
        - .txt
        - .vbe
        - .vbs
      filter_optional_git_windows:
        ParentImage: C:\Program Files\Git\usr\bin\sh.exe
        Image: C:\Program Files\Git\mingw64\bin\curl.exe
        CommandLine|contains|all:
        - '--silent --show-error --output '
        - gfw-httpget-
        - AppData
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_curl and 1 of selection_susp_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: Was curl executed from its expected system path, or from an unusual location?
  context: >-
    curl shipped with Windows lives in System32. A curl.exe running from a user temp directory, a download folder, or
    another non-standard path may be a copied or renamed binary placed to evade path-based allowlists or to run a
    modified build. Compare the Image path and OriginalFileName against the expected system location.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Were any other download or transfer LOLBins used on this host recently?
  context: >-
    Attackers who use one download LOLBin often use several. If curl pulled a file, check whether certutil, bitsadmin,
    esentutl, or similar transfer utilities were also used on this host. Multiple LOLBins performing the same fetch-to-disk
    action strengthens the case for operator-driven activity over a one-off legitimate download.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\hh.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: How often has this host fired the curl download pattern over the past 90 days, and what command-line structures are typical?
  context: >-
    A download pattern with no prior history on a host is more notable than one used daily under stable parents. This
    query mirrors the rule's selection structure scoped to this host, so the count reflects the rule's specific firing
    pattern rather than generic curl usage. The command-line projection lets the analyst compare typical invocation
    patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_curl:
      - Image|endswith: \curl.exe
      - Product: The curl executable
      selection_susp_locations:
        CommandLine|contains:
        - '%AppData%'
        - '%Public%'
        - '%Temp%'
        - '%tmp%'
        - \AppData\
        - \Desktop\
        - \Temp\
        - \Users\Public\
        - C:\PerfLogs\
        - C:\ProgramData\
        - C:\Windows\Temp\
      selection_susp_extensions:
        CommandLine|endswith:
        - .dll
        - .gif
        - .jpeg
        - .jpg
        - .png
        - .temp
        - .tmp
        - .txt
        - .vbe
        - .vbs
      filter_optional_git_windows:
        ParentImage: C:\Program Files\Git\usr\bin\sh.exe
        Image: C:\Program Files\Git\mingw64\bin\curl.exe
        CommandLine|contains|all:
        - '--silent --show-error --output '
        - gfw-httpget-
        - AppData
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_curl and 1 of selection_susp_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - CommandLine
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host - defense tampering, reconnaissance, or
    initial access - may reveal the stages that preceded a download and help reconstruct the timeline. A download that
    follows earlier suspicious activity carries more weight than an isolated one.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
