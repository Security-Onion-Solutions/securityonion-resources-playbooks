name: Disable Internal Tools or Feature in Registry
id: 6ba43f1a-adba-4fb6-a8c3-49e37115f3fe
description: |
  Detects a registry modification that disables a built-in Windows tool or security feature by writing a policy value. The rule fires when EITHER a policy key that restricts a user-facing tool (Task Manager, Registry Editor, Command Prompt, Run dialog, Control Panel, Notification Center, lock/password/logoff controls) is set to 1, OR a key that governs a protection (UAC admin consent prompt, inactivity lock timeout, toast notifications, removable-storage write protection) is set to 0. Both patterns turn off a defensive or usability control, and the DWORD value inverts between the two branches, so the branch that fired and the exact value determine which control was affected. Legitimate group policy and administrative scripts can produce these writes, so the investigation should confirm the writing process, its parent lineage, whether the change was authorized, and whether it landed alongside other tampering or persistence.
type: detection
detection_id: e2482f8d-3443-4237-b906-cc145d87a076
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the modified policy key and DWORD value match either branch this rule detects?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires on EITHER a key that
    restricts a user tool set to 1 (DisableTaskmgr, DisableRegistryTools, DisableCMD, NoRun, NoControlPanel,
    NoDispCPL, NoDispBackgroundPage, StartMenuLogOff, DisableChangePassword, DisableLockWorkstation,
    DisableNotificationCenter) OR a key that governs a protection set to 0 (ConsentPromptBehaviorAdmin,
    InactivityTimeoutSecs, shutdownwithoutlogon, ToastEnabled, Write Protection, WriteProtect). Note which
    branch and which specific feature fired, because the branch determines what the value means and which
    downstream checks carry weight.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to change Windows policy keys?
  context: >-
    Legitimate administrative activity, imaging, and group policy application can write these same policy
    keys. Knowing whether the user role and host function are consistent with policy-key changes is often
    the fastest way to separate a routine push from unauthorized tampering. User attribution is present on
    most endpoint registry events; when it is a machine account or missing, pivot on the writing process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which specific policy key and value were written, and what control does that turn off?
  context: >-
    The key path and DWORD value together reveal intent. In the set-to-1 branch, a value of 1 activates a
    restriction that disables a user tool (for example DisableTaskmgr=1 blocks Task Manager, DisableRegistryTools=1
    blocks the Registry Editor, DisableCMD=1 blocks the Command Prompt). In the set-to-0 branch, a value of 0
    removes a protection (for example ConsentPromptBehaviorAdmin=0 suppresses the UAC consent prompt for
    administrators, and WriteProtect=0 clears removable-storage write protection). Establish exactly which
    control was affected before scoping the rest of the investigation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What process wrote this key, how was it launched, and is that process and lineage expected?
  context: >-
    Pivot from the registry event to the writing process to see its full command line and parent. Policy keys
    pushed by group policy or a management agent have predictable, signed tooling and a service or logon
    parent, while an unsigned binary, a script host, or a shell launched from an Office application or a
    temporary path performing the same write points to tampering. Judge the writing binary's signature and
    reputation and whether the parent chain fits how this host is normally administered.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Has this policy key been modified before on this host?
  context: >-
    Policy keys that govern security controls should rarely change on a stable host. A first-time or rare
    write is more suspicious than a value that is set repeatedly by an established management push. Compare
    the historical Details values and writing processes to see whether this change matches a known-good
    pattern or stands alone.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What other registry modifications were made on this host in the same window?
  context: >-
    Disabling one tool is rarely the whole objective. Operators who suppress Task Manager or the UAC prompt
    frequently disable several controls at once and stack persistence or defender-suppression keys in the
    same session. Finding a cluster of policy and security-key writes from the same process within a short
    window reveals the full scope of the configuration change and whether multiple objectives were pursued.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Was this same policy key modified on other hosts in the environment?
  context: >-
    The same policy write appearing across many hosts usually indicates a group policy change or a
    management deployment, while a change confined to this one host is more likely targeted or malware-driven.
    Compare the Details values and writing processes across hosts to tell a fleet-wide push apart from an
    isolated modification.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What launched the process that wrote this key, and is that parent expected?
  context: >-
    Tracing the parent of the writing process reveals whether the change came from a legitimate chain
    (group policy engine, a management agent, an administrator's interactive session) or a suspicious one
    (a macro-spawned shell, a script host, or a loader dropped in a temporary path). Known administrative
    tooling such as regedit.exe, reg.exe under a management agent, msiexec.exe, or gpupdate-driven policy
    application forms an allowlist; a parent outside that set performing policy writes warrants scrutiny.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining process activity in the minutes around the registry write
    reveals what led to it and what followed, including reconnaissance, privilege escalation, or execution
    that the disabled control would otherwise have hindered. Novel parent-child pairs at low counts are what
    to scan for against the routine agent telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host such as defense tampering, reconnaissance, or credential access may
    reveal the stages that preceded this policy change and help reconstruct the timeline. Disabling internal
    tools and protections commonly sits in the middle of a longer operation rather than at its start.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was there a change ticket, maintenance window, or documented approval for this policy change?
  context: >-
    Many organizations require change records for policy and security-configuration changes. A corresponding
    ticket or maintenance window suggests authorized activity; the absence of one where policy requires it
    suggests the change was unauthorized. This check can quickly close a false positive or escalate a true
    positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the user or administrator recall making this policy change?
  context: >-
    Direct confirmation from the person behind the account is often the fastest path to determining
    legitimacy. If the user does not recall disabling the tool or protection, their credentials may be
    compromised or the change may be automated malware; if they do recall it, capture why it was needed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this change align with normal work hours and maintenance windows?
  context: >-
    Legitimate configuration changes typically occur during business hours or scheduled maintenance. A
    policy key that disables Task Manager or the UAC prompt written outside working hours, with no
    corresponding maintenance window, is more suspicious than the same change during a documented push.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were other persistence mechanisms installed on this host around this time?
  context: >-
    Disabling internal tools and protections frequently accompanies broader implantation rather than
    standing alone. After weakening defenses, operators commonly install persistence using scheduled tasks,
    services, registry Run keys, or scripting utilities. Persistence-tool executions in the same timeframe
    indicate intentional stacking rather than an isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup folder or scheduled-task definition paths on this host around this time?
  context: >-
    File-based persistence bypasses command-line detection entirely. Dropping an executable or script into
    a Startup folder or a path referenced by a registry Run key achieves persistence without running
    scheduling or service tools. File-write monitoring captures these drops even when the operator avoids
    standard persistence utilities, complementing the process-based view.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
