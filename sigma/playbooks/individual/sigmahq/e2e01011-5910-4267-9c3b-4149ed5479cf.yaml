name: Potential WWlib.DLL Sideloading
id: a067d746-bbc8-4645-85c7-aaa4fc82bd09
description: |
  Detects wwlib.dll being loaded by a process, or from a path, other than the legitimate case of winword.exe
  loading it out of a Microsoft Office installation directory (the rule fires when a wwlib.dll load matches AND
  the known-good winword.exe-from-Microsoft Office path does NOT match). wwlib.dll is a genuine Microsoft Word
  component; DLL sideloading places an attacker-controlled library where a trusted, signed executable will load
  it, so the library runs with the host process's legitimacy. A wwlib.dll loaded from outside the canonical
  Microsoft Office directory, or by a process other than winword.exe, is a masquerade of that Office component and
  has been observed loading follow-on payloads and establishing autostart persistence. Investigation should confirm
  the loaded module's path, signature, and hash on the load event, establish whether the loading process is a
  genuine Office binary running from its install directory, trace where the DLL was written from and by what
  process, and check for follow-on persistence (registry autostart or Winlogon values, dropped files) on the host.
type: detection
detection_id: e2e01011-5910-4267-9c3b-4149ed5479cf
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the loaded module match what this rule detects, in path, signature, and loading process?
  context: >-
    Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded), its code-signature
    status, and the process that loaded it against the rule's criteria. The rule fires on a wwlib.dll load that is
    NOT the legitimate case of winword.exe loading it from a Microsoft Office directory (C:\Program Files\Microsoft
    Office\ or C:\Program Files (x86)\Microsoft Office\), so note whether the load path sits outside that canonical
    directory or whether the loader is something other than the real Word binary. Library events carry the module's
    hash and signing status directly on the load, so record them here.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
  answer_sources:
  - alert
  - image_load
- question: Is this user and host expected to run Microsoft Word and load this Office module?
  context: >-
    A genuine wwlib.dll load occurs on hosts where Microsoft Word is installed and run. If Word is not a sanctioned
    application for this user or host role, or the host is a server that would not normally run the Office suite, a
    module by that name loading here is more likely a sideloaded masquerade than routine document editing. Confirm
    whether the user role and host function are consistent with a legitimate Office install.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What other modules did the process that loaded wwlib.dll pull in, and are any from user-writable or non-standard directories?
  context: >-
    The full set of modules a process loads exposes a sideloading operation the alerting event alone does not. Look
    for other DLLs loaded from user-writable locations such as AppData, ProgramData, Public, a temp directory, or
    removable media; unsigned modules sitting where signed ones are expected; and system DLL names loaded from
    non-system paths. Loads outside C:\Windows\System32 and the Microsoft Office install path, clustered in the same
    process, point to a staged side-load set rather than an isolated event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - image_load
  - manual_review
- question: For the loaded wwlib.dll, what is its signing status, hash, and threat-intel reputation?
  context: >-
    Module reputation separates the genuine Office component from a sideloaded malicious one. The legitimate
    wwlib.dll is Microsoft-signed; an unsigned module, or one carrying a signature that is expired, distrusted, or
    invalid, is a strong masquerade indicator. The hash on the load event supports a threat-intel lookup that can
    surface a known loader, and comparing it against the hash of a known-good wwlib.dll from a clean Office install
    is the direct check for substitution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
  answer_sources:
  - image_load
  - external_threat_intel
  - manual_review
- question: Which process loaded wwlib.dll, and does it run from a legitimate Microsoft Office installation directory?
  context: >-
    Sideloading works by having a trusted, signed executable load the planted library, so the identity and location
    of the loading process are decisive. Determine whether the loader is a genuine winword.exe running from
    C:\Program Files\Microsoft Office\ or C:\Program Files (x86)\Microsoft Office\, a renamed or relocated copy of a
    signed binary staged in a user-writable directory, or an unrelated process. A loader running from AppData,
    ProgramData, Public, a temp directory, or removable media rather than the canonical Office path is the
    sideloading pattern this rule targets.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
      - ParentImage
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned the loader of wwlib.dll, and is that parent chain expected?
  context: >-
    The parent of the loading process reveals how the side-load was launched. A genuine Word session typically
    traces to explorer.exe or a user shell opening a document; a loader started from a mounted disk image or
    archive, a script host, or an unfamiliar dropper points to attacker-driven execution. Walk the parent chain to
    see what initiated the run.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What process wrote wwlib.dll to disk, and when relative to the load?
  context: >-
    Sideloading requires the attacker-controlled library to be placed on disk before a trusted binary loads it.
    Identify the process that created this wwlib.dll file and where it was written. A write by an Office installer or
    updater into the canonical Microsoft Office directory is expected; a write by an archive tool, script host,
    mounted-image launcher, or dropper into a user-writable location shortly before the load is the plant step of the
    side-load. The gap between the write and the load frames the correlation window for the rest of the activity.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
  answer_sources:
  - file_event
  - manual_review
- question: Is the wwlib.dll module still on disk for analysis?
  context: >-
    If the sideloaded module is still present, it can be hashed, submitted to a sandbox, or reviewed statically.
    Checking for the file written by the alerting process or its direct children confirms whether the artifact
    remains available or was already removed after execution, which is itself a cleanup signal.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Did activity around this load write registry autostart or Winlogon persistence values on this host?
  context: >-
    Loaders delivered by wwlib.dll side-loading commonly establish persistence immediately after the DLL loads,
    writing an autostart value under a Run or RunOnce key or altering Winlogon Shell/Userinit so the payload
    re-launches at logon or boot. These keys are also written by legitimate software, so weigh any change against the
    timing of the load and the process that made it rather than treating it as malicious on its own. Value deletion
    is not observable here, so focus on values that were added or modified in the same window.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\CurrentVersion\Run'
          - '\CurrentVersion\RunOnce'
          - '\Winlogon\Shell'
          - '\Winlogon\Userinit'
          - '\Winlogon\Notify'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - manual_review
- question: Has wwlib.dll been loaded on this host before, and under what processes?
  context: >-
    A first-time load of this module on the host is a stronger anomaly than a recurring one. If wwlib.dll has been
    loaded repeatedly by a genuine winword.exe from the Office directory over the prior 90 days, this load is
    probably routine. If this is the first occurrence, or the module has historically loaded only under different
    processes, the current load is anomalous and consistent with a newly planted side-load.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
  answer_sources:
  - image_load
- question: Is wwlib.dll being loaded on other hosts, especially under unexpected loading processes?
  context: >-
    Cross-host correlation surfaces how far the activity spread. The same module loaded on a single host may be a
    localized event; wwlib.dll loading across several hosts under non-winword processes points to multi-host
    distribution, such as a removable-media or shared-document vector. Watch the variety of loading processes: the
    module loaded only by a genuine winword.exe is routine, while the same module loaded by unrelated processes
    elsewhere suggests multi-host activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - image_load
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Sideloading is one stage in a chain, and the load event rarely stands alone. Examining process activity in a
    tight window around the load reveals what launched the loader, what the sideloaded module did next, and whether
    file writes, registry changes, and the load line up on the same short timeline. Look for dropper execution,
    document-handler activity, defense tampering, and persistence installation in the same interval.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host can reveal the stages that preceded the side-load. Phishing-document
    handling, execution from removable media, or defense tampering ahead of this event helps reconstruct the
    timeline and shows whether the load is an entry point or a later stage of an ongoing intrusion.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Does the user recall opening a document or running an application that would load this Office module?
  context: >-
    Direct confirmation from the person behind the account is often the fastest path to legitimacy. If the user
    knowingly opened a Word document from a trusted source, a load from the genuine install path may be routine. If
    no one recalls opening a document, or the file came from an unexpected archive, mounted image, or email
    attachment, the module is more likely a sideloaded masquerade riding the Office component's name.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: Does the timing of this activity align with normal work hours and expected document use?
  context: >-
    Legitimate Office use tracks a user's normal activity pattern. A wwlib.dll load on a server, an unattended host,
    or at an hour when the user is not active is harder to explain as routine document editing and more consistent
    with automated execution from a planted side-load.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - asset_inventory
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    A side-load that survives reboot is often paired with backup persistence. After establishing one foothold,
    operators commonly install additional mechanisms through scheduled tasks, services, registry Run keys, BITS
    jobs, or WMI subscriptions. Several persistence installations in the same timeframe indicate intentional
    stacking rather than an isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Were files dropped to persistence locations such as the Startup folder or scheduled-task definition paths on this host?
  context: >-
    File-based persistence bypasses command-line detection entirely. Dropping an executable or script into a Startup
    folder or a path referenced by a registry Run key achieves persistence without running schtasks, sc, or reg.
    File monitoring captures these drops even when the operator avoids standard persistence tooling, which is
    consistent with a stealth-focused side-load.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
