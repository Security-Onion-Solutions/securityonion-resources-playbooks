name: Compress Data and Lock With Password for Exfiltration With WINZIP
id: 07d13143-b88f-4d9c-9fbf-9756b79e5040
description: |
  Detects a command line that invokes WinZip (winzip.exe or winzip64.exe) AND carries a password flag (-s") AND a job flag (one of ' -min ' or ' -a '). All three patterns must appear together, which corresponds to creating a password-protected archive in an automated/minimized fashion -- a common way to compress and lock collected data prior to exfiltration. WinZip is also widely used for legitimate archiving, so the investigation should establish what files were targeted, whether encryption was applied, where the archive went, and whether the user, host, and parent process are expected to run this workflow.
type: detection
detection_id: e2e80da2-8c66-4e00-ae3c-2eebd29f6b6d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- question: Does the command line invoke WinZip with a password flag and an archive/minimize flag together?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when the command line contains winzip.exe or winzip64.exe AND the password flag -s" AND one of the job flags ' -min ' or ' -a '. Confirm all three are present in the exact command line.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to create password-protected WinZip archives from the command line?
  context: Legitimate backup, packaging, or IT automation can drive command-line WinZip with passwords. Knowing whether this user role and host function routinely produce password-protected archives is often the fastest way to separate a routine job from data theft staging.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this WinZip command do? Decode the full command line, including the archive name, source paths, password flag, and job flags.
  context: The full command line reveals the specific archiving action. Identify the output archive name, the files or directories being added, the password flag (-s"), the compression/job flags (' -a ' adds files, ' -min ' runs minimized), and any wildcards indicating bulk collection. The query scopes to WinZip invocations on this host within the window so multi-step archiving sequences are visible together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
          - winzip.exe
          - winzip64.exe
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What password protection was applied to the archive, and was the password visible in the command line?
  context: This rule already requires the -s" password flag, so encryption is confirmed by construction. The remaining question is whether the password itself is readable in the command line, was supplied from a config file or stdin (which would not appear here), and whether header/content encryption hides filenames. Password-protected archives prepared for transfer are a stronger indicator of deliberate data theft than unprotected ones.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What archive files were written on this host around the time of the alert, and where do they live?
  context: 'The archive output reveals what data was targeted and where it was staged: a single small archive looks routine, while a large archive or several archives written to a temp, public, or staging directory points to bulk collection. The path also indicates the likely next step -- a staging folder precedes movement or upload. WinZip is matched here by the command line, so the actual archive files are surfaced via file events for common archive extensions on this host.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith:
          - .zip
          - .zipx
          - .7z
          - .rar
          - .cab
      condition: selection
    fields:
      - TargetFilename
- question: After the archive was created, was it moved, copied, or uploaded off this host?
  context: Data staging typically creates an archive locally, then moves it to a staging location or sends it over the network. Checking file events for archive writes and subsequent copies, plus outbound connections from this host in the following hour, reveals the exfiltration path -- cloud upload, removable media, or transfer to an external host. The presence of a destination move strengthens the data-theft interpretation.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith:
          - .zip
          - .zipx
          - .7z
          - .rar
          - .cab
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What process spawned this WinZip command, and is that parent chain expected?
  context: The parent process reveals how the archiving was invoked. A user shell or a known backup scheduler is consistent with routine use; an unusual parent such as a script host, Office application, or a remote-access tool suggests the archiving is part of an operator-driven collection step rather than normal work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Is the executing image actually WinZip, or is a renamed or relocated binary presenting a winzip.exe command line?
  context: The rule matches the command line text, not the on-disk binary, so a renamed or relocated executable can produce a winzip.exe-looking command line while being something else. Compare the Image path and the process name against the WinZip product the command line claims, and check whether the binary runs from a standard install location or from a user-writable, temp, or staging directory. A mismatch points to masquerading rather than legitimate archiving.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Does this host normally run WinZip with this password-and-archive command-line pattern?
  context: A command-line WinZip archiving pattern that has never been seen on a host is more suspicious than one that runs regularly under a known job. Zero or very low historical counts indicate first-time or rare execution; high counts grouped under a consistent user point to an established backup or packaging routine and inform a noise-tuning threshold.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
          - winzip.exe
          - winzip64.exe
      condition: selection
    fields:
      - User
- question: When this host has previously fired this WinZip pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even routine archiving tools get abused. The query mirrors the rule's full selection -- WinZip plus the password flag plus a job flag -- scoped to this host, so the parent/user distribution reflects how this specific firing pattern has historically run here rather than generic WinZip usage. A new parent process, an unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_winzip:
        CommandLine|contains:
        - winzip.exe
        - winzip64.exe
      selection_password:
        CommandLine|contains: -s"
      selection_other:
        CommandLine|contains:
        - ' -min '
        - ' -a '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did this WinZip process spawn afterward?
  context: The processes spawned by the archiving tool reveal its actual impact. Legitimate WinZip invocations rarely spawn other tooling; follow-on cmd.exe, powershell.exe, or network/transfer utilities launched by this process suggest the archive creation is one step in a larger collection-and-exfiltration sequence.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Have other hosts fired this WinZip pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's full selection with no host scope, so the result is a fleet-wide count of this specific firing pattern rather than generic WinZip usage. Many hosts firing the same pattern points to a scripted deployment or packaging job; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_winzip:
        CommandLine|contains:
        - winzip.exe
        - winzip64.exe
      selection_password:
        CommandLine|contains: -s"
      selection_other:
        CommandLine|contains:
        - ' -min '
        - ' -a '
      condition: all of selection*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_winzip:
        CommandLine|contains:
        - winzip.exe
        - winzip64.exe
      selection_password:
        CommandLine|contains: -s"
      selection_other:
        CommandLine|contains:
        - ' -min '
        - ' -a '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_winzip:
        CommandLine|contains:
        - winzip.exe
        - winzip64.exe
      selection_password:
        CommandLine|contains: -s"
      selection_other:
        CommandLine|contains:
        - ' -min '
        - ' -a '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or staging across multiple endpoints. If the same user drove archiving or other collection activity on several hosts in this window, the scope of potential data loss is larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_winzip:
        CommandLine|contains:
        - winzip.exe
        - winzip64.exe
      selection_password:
        CommandLine|contains: -s"
      selection_other:
        CommandLine|contains:
        - ' -min '
        - ' -a '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to the archiving, what happened after, and whether it is part of a larger collection sequence. Look for reconnaissance, credential access, data discovery, or transfer tooling adjacent to the archive creation.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- data discovery, credential access, or defense tampering -- may reveal the attack stages that preceded the archiving and help reconstruct the timeline that led to staging data for exfiltration.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
