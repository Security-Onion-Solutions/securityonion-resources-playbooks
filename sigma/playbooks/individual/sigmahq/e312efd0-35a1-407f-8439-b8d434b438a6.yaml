name: Potential PowerShell Obfuscation Via WCHAR/CHAR
id: 13f3dac3-b967-4aed-aed8-eb30b8faa988
description: |
  Detects PowerShell command lines that build characters from numeric code points using
  '[char]0x' or '(WCHAR)0x' syntax. This substitutes encoded character sequences for literal
  dashes, slashes, and other parameter delimiters so that string-matching detection rules do
  not spot the real flags or payload. Legitimate scripts almost never construct argument
  delimiters this way; the technique is a defense-evasion measure used to obscure what
  PowerShell was actually told to do. Determine what the obfuscated command decodes to, whether
  PowerShell security controls were weakened beforehand, and whether the same pattern ran
  elsewhere on the host or fleet.
type: detection
detection_id: e312efd0-35a1-407f-8439-b8d434b438a6
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- question: Does the alerting command line contain '[char]0x' or '(WCHAR)0x' encoded character syntax?
  context: Before investing investigation time, confirm the alert is a true positive by reading the exact command line and checking that it builds characters from numeric code points with '[char]0x' or '(WCHAR)0x'. Either token matching satisfies the rule, so note which form fired and where in the command it appears.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run PowerShell with encoded character syntax?
  context: Legitimate administrative scripting almost never assembles parameter delimiters from numeric code points. Knowing whether the user role and host function involve hand-written or generated PowerShell that uses this construction is often the fastest path to separating a true positive from an unusual but sanctioned automation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Reconstruct the obfuscated characters from the '[char]0x' / '(WCHAR)0x' sequences. What command or parameters do they form?
  context: The '[char]0x' and '(WCHAR)0x' constructs convert hex code points into characters at runtime, commonly substituting for the dash and slash that introduce PowerShell parameters or for letters inside a payload. Convert each code point to its character and rebuild the intended command to reveal the real flags, cradle, or in-memory loader the syntax was hiding.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Across this host, what other PowerShell command lines used the same encoded character syntax around this time, and do they form one logical operation?
  context: The triggering event shows a single invocation, but obfuscated PowerShell activity often spans several sequential commands that together stage and run a payload. This scopes to other command lines on this host that use the same '[char]0x' / '(WCHAR)0x' construction within a few minutes so the full obfuscated operation is visible, not just the one command that fired.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
        - '[char]0x'
        - (WCHAR)0x
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Did PowerShell script block logging capture the deobfuscated content of this execution?
  context: Script block logging records the script content PowerShell actually executed after the engine resolves '[char]0x' and '(WCHAR)0x' code points, giving ground truth that bypasses the command-line obfuscation. If PowerShell operational logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell security controls bypassed or weakened on this host before this execution?
  context: Operators frequently disable or evade PowerShell defenses before running an obfuscated payload. Common precursors include AMSI bypass (patching amsi.dll in memory), execution policy changes such as -ep bypass, and downgrade to PowerShell v2 which lacks logging. Finding these precursor events strengthens the case that the encoded-character command was malicious.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: What process spawned this PowerShell instance, and is that parent chain expected?
  context: The parent process reveals how PowerShell was invoked. Interactive use typically descends from explorer.exe or a terminal; unusual parents such as office applications, mshta.exe, wscript.exe, or a service binary point to macro-borne or scripted execution. Walk up from the parent to see what launched it and what else it spawned.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did this PowerShell instance spawn afterward?
  context: The processes a script launches reveal its actual impact. Obfuscated PowerShell often spawns cmd.exe, additional powershell.exe instances, certutil.exe, or a dropped binary for the next stage. This walks forward from the alerting process to its children.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host has previously fired this encoded-character pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even where this construction has been seen before, the parent and user distribution describes how the rule's specific firing pattern has historically run on this host. A new parent process, an unexpected user account, or an unusual command-line structure relative to that history is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - '[char]0x'
        - (WCHAR)0x
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - '[char]0x'
        - (WCHAR)0x
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - '[char]0x'
        - (WCHAR)0x
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around this time?
  context: Tracking the user's activity across all hosts in the alert window reveals lateral movement or parallel activity on multiple endpoints. If the same user drove similar activity elsewhere, the scope of the event may be larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - '[char]0x'
        - (WCHAR)0x
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining the activity surrounding the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, or persistence mechanisms.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- defense tampering, reconnaissance, credential access -- may reveal the attack stages that preceded this event and help reconstruct the timeline. Defense tampering followed by execution, or reconnaissance followed by exploitation, are common orderings.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired this encoded-character pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: This counts the rule's firing pattern fleet-wide with no host scope, so the result reflects the obfuscation pattern itself rather than generic PowerShell usage. Many hosts firing the same pattern points to scripted deployment or vendor tooling; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - '[char]0x'
        - (WCHAR)0x
      condition: selection
    fields:
    - host.name
- question: If the decoded command references a file, is that file still on disk for analysis?
  context: If the deobfuscated command references a file -- a downloaded payload, a decoded output, or a script -- checking whether it still exists on disk enables deeper analysis such as hash lookup, sandbox submission, or content review. Scope to the paths reconstructed from the command line.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
