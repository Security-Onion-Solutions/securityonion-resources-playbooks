- question: Were any other download or transfer LOLBins used on this host recently?
  context: >-
    Attackers who use one command-line transfer tool often use several. Finding certutil, bitsadmin, esentutl,
    or similar cabinet/archive utilities performing file transfers alongside curl strengthens the case for
    deliberate data movement rather than a one-off use of curl.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\hh.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Was curl executed from its expected system path?
  context: >-
    curl.exe running from outside System32 or SysWOW64 — for example a user profile, temp directory, or staging
    folder — may indicate the binary was copied or renamed to evade path-based controls, since OriginalFileName
    still identifies it as curl even when relocated.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
  answer_sources:
  - process_creation
