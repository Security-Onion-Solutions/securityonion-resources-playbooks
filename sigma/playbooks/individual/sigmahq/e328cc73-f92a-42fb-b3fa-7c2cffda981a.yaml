name: Curl File Upload To File Sharing Websites
id: 3f5a3d55-6da1-4b7d-a323-ab401261137d
description: |
  Detects curl.exe uploading a file to a known anonymous file-sharing or paste site (0x0.st, bashupload.com, chunk.io,
  file.io, filebin.net, pastebin, send.firefox.com, temp.sh, transfer.sh, ufile.io, uploadfiles.io, wetransfer.com,
  x0.at) using an upload-oriented flag (--form, --upload-file, --data, -X POST/--request POST, or the short forms
  -F/-T/-d/-sT). curl ships by default on modern Windows and is rarely invoked interactively by end users, so a
  command-line upload to a no-authentication hosting service outside the organization is unusual traffic in most
  environments. This pattern has been used to stage tooling between compromised hosts and to move collected data to
  storage reachable without organizational credentials, so investigation should establish what file was uploaded,
  confirm the transfer actually left the host, and determine whether the account and host are expected to use curl
  this way.
type: detection
detection_id: e328cc73-f92a-42fb-b3fa-7c2cffda981a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the command line show curl uploading to one of the listed file-sharing domains using an upload flag?
  context: >-
    Confirm the alert is a true positive before investing analysis time. The rule fires only when all three
    conditions hold together: the process is curl (by Image name or OriginalFileName), the command line references
    one of the known file-sharing or paste-site domains, and the command line carries an upload-oriented flag such as
    --form, --upload-file, --data, -X POST, or their short equivalents. Read the full command line from the
    triggering event and verify all three are actually present.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to upload files via curl to external file-sharing services?
  context: >-
    Legitimate use of curl for file uploads is uncommon outside developer, automation, or support workflows. Knowing
    whether this user's role and this host's function are consistent with scripted uploads to an external hosting
    service is often the fastest path to separating routine automation from unauthorized data movement.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What exactly did the curl command upload, and to what domain and path?
  context: >-
    The full command line reveals the target URL, the upload method, and the local file supplied to --upload-file,
    -F, or --data. Decode any additional flags such as authentication headers, output redirection, or silent-mode
    switches to build a complete picture of the transfer. Multiple curl invocations on this host within the window
    may together form one staged upload.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What local file was selected as the upload source, and where does it live on disk?
  context: >-
    The command line names the file passed to --upload-file, -F, -T, or --data — a path under a user profile, a temp
    directory, or a staging folder each point to a different origin for the data. File-write events for the same
    process show whether that file was recently created or modified rather than a long-standing document, which
    narrows down whether it was staged specifically for this upload.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
  answer_sources:
  - process_creation
  - file_event
- question: Did curl write any local output before the upload, and what happened on the host after the transfer?
  context: >-
    curl's upload flags send data directly to the remote host without necessarily creating an archive, but some
    invocations save a response with -o or stage a copy first. File events from the same process on this host show
    any output written, and the process's activity after the request completes shows whether cleanup, deletion of
    the source file, or a follow-on transfer occurred.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
      - Image
  answer_sources:
  - file_event
  - network_connection
- question: Did curl actually establish an outbound connection for this upload, and what was the size and direction of the transfer?
  context: >-
    The command line shows intent, but the network connection confirms whether the request left the host and how
    much data moved. A connection that never completes, or one with an unusually small payload, may point to a
    failed or test upload rather than a completed transfer; a connection with a substantial outbound volume relative
    to the response corroborates a genuine file upload.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
- question: Were authentication credentials or insecure-transport flags included directly in the command line?
  context: >-
    Flags such as -u user:pass, a -H Authorization header, or -k/--insecure (skip TLS certificate validation)
    appearing directly in the command line indicate the operator embedded credentials or deliberately bypassed
    certificate checks rather than relying on a stored configuration. Credentials visible in process telemetry are
    also exposed to anyone with read access to the host's process history.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned curl, and is that parent chain expected for this activity?
  context: >-
    The parent process reveals how curl was invoked. Interactive use from explorer.exe or a console differs from
    invocation by a scripting host, a remote-administration tool, or an unfamiliar service. A parent such as
    wscript.exe, an Office application, or a remote-session shell driving curl toward one of these hosting services
    fits staged data movement rather than routine command-line use.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: When this host has previously matched the rule's pattern, what parents and users normally drove it, and does the current alert fit that history?
  context: >-
    The query mirrors the rule's exact selection — curl uploading to one of the listed hosting services with an
    upload flag — scoped to this host, so the resulting parent and user distribution reflects how this specific
    pattern has run here before, not generic curl usage. A new parent process, an unfamiliar user, or a command-line
    structure that departs from the established pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \curl.exe
      - OriginalFileName: curl.exe
      selection_cli_domain:
        CommandLine|contains:
        - 0x0.st
        - bashupload.com
        - chunk.io
        - file.io
        - filebin.net
        - pastebin
        - send.firefox.com
        - temp.sh
        - transfer.sh
        - ufile.io
        - uploadfiles.io
        - wetransfer.com
        - x0.at
      selection_cli_flags:
      - CommandLine|contains:
        - ' --form'
        - ' --upload-file'
        - ' --data'
        - ' -X POST'
        - ' --request POST '
      - CommandLine|re:
        - \s-[FTd]\s
        - \s-sT\s
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's exact selection scoped to this user — the result is the user's 90-day history of
    uploading to one of these hosting services with an upload flag, aggregated by host, not generic curl usage. A
    user who has never produced this pattern is more suspicious than one who does so regularly; weigh the count
    against the user's role and typical toolset.
