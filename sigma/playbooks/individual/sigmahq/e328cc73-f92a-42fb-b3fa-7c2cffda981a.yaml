- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Activity surrounding the upload may reveal reconnaissance, collection of the
    uploaded file's source data, or defense tampering that preceded staging the transfer. Aggregating by process and
    parent collapses repetitive agent telemetry while novel process pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
