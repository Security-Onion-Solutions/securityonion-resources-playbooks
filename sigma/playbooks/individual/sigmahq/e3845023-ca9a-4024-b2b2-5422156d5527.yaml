name: PowerShell Module File Created By Non-PowerShell Process
id: 72d1f369-0427-4677-b1b3-0d37c8900e40
description: |
  Detects the creation of a PowerShell module file (.psm1 script module, .psd1 manifest, .dll binary module, or .ps1) under a
  PowerShell Modules directory (\WindowsPowerShell\Modules\ or \PowerShell\7\Modules\) by a process that is not one of the
  expected PowerShell hosts or msiexec.exe. Modules placed on the module search path are auto-discovered and loaded by name
  when that module is imported or one of its commands is invoked, so a non-PowerShell process planting a module here is a
  persistence and command-hijack vector. Legitimately, modules are installed by powershell.exe/pwsh.exe or an MSI installer;
  the investigation should determine what the dropped module contains, which process wrote it and how that process was
  launched, and whether PowerShell subsequently loaded it.
type: detection
detection_id: e3845023-ca9a-4024-b2b2-5422156d5527
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Was a module file created under a PowerShell Modules directory by a process that is not PowerShell or msiexec?
  context: >-
    Confirm the alert is a true positive by reviewing the exact file path and the responsible process. The rule fires when a
    file is written under a PowerShell Modules directory AND the writing process is not one of the expected PowerShell hosts
    (powershell.exe, pwsh.exe, powershell_ise.exe, poqexec.exe) or msiexec.exe. Both conditions must hold. Verify the path
    ends in a module extension (.psm1, .psd1, .dll, .ps1) and that the creating process genuinely falls outside the allowed
    installer set before investing further.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to write PowerShell modules onto the module search path?
  context: >-
    Legitimate module installation is usually driven by PowerShell package management or an MSI package, not by arbitrary
    processes. Knowing whether the account and host function are consistent with authoring or deploying modules is often the
    fastest way to separate a routine deployment from a hijack. When the user is a machine or service account, judge by the
    writing process and the host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the module file still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives next steps. A module still on disk can be retrieved, hashed, and read; a module
    deleted seconds after creation suggests anti-forensic cleanup or a stager that drops-loads-and-removes and shifts the
    focus to what imported it in between. The operation type distinguishes a persistent plant from a transient drop.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What does this module file contain? Read it for exported commands, obfuscation, encoded strings, and download or execution logic.
  context: >-
    Read the module's actual content. A script module (.psm1) is arbitrary PowerShell; a manifest (.psd1) is a hash table
    whose RootModule/ScriptsToProcess/NestedModules and FunctionsToExport declare what auto-loads and what runs on import; a
    binary module (.dll) is a compiled assembly. Check for base64 or otherwise obfuscated strings, embedded URLs or IP
    addresses, download cradles, and commands that overshadow the name of a legitimate module or cmdlet. Content retrieval is
    a manual step from the endpoint or the on-disk path.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What did the non-PowerShell process that wrote this module actually do? Decode its full command line.
  context: >-
    The writing process is the anchor for this alert. Its full command line reveals whether the module drop was a deliberate
    write (a download-to-disk, an unpack, a copy from a staging path) and what else the process was instructed to do. Decode
    any flags, encoded content, source paths, or URLs. The query returns every execution of that binary on this host in a
    tight window, which for multi-step tools may span several invocations forming one operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned the writer, and is that parent chain expected for module installation?
  context: >-
    The parent process reveals how the writer was launched. A module written by a build tool, package manager, or deployment
    agent under a predictable parent chain reads differently from one written by a child of a browser, an Office application,
    mshta.exe, wscript.exe, or a script host, which points to exploitation or a malicious document. Walk up the tree from the
    immediate parent to see what set the writer in motion.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: If this module later executed or loaded, what is its hash, and does it have known AV or threat-intel detections?
  context: >-
    A file's hash is recorded when it runs or is loaded, not when it is written, so the file-creation event carries no hash.
    This query looks for the dropped module executing as a process and reads its hash; submit that to threat-intelligence
    services to determine whether it is known malicious, benign, or previously unseen. Binary modules that load as a DLL
    surface their hash on the load event instead. If the module is present but has not executed, retrieve it from its on-disk
    path and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
- question: Was this module loaded as a binary module (.dll) after it was written, and was the loaded image signed?
  context: >-
    A dropped binary module auto-loads when the module is imported or one of its commands is invoked; that load appears as an
    image-load event referencing the module path. A newly written module loading shortly after its creation confirms the plant
    progressed from delivery to use, and the signing status of the loaded image tells you whether it is an unsigned or
    improperly signed assembly. Script modules (.psm1) do not load as images; their execution is visible in PowerShell script
    block logging instead.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - SignatureStatus
- question: Did PowerShell script block logging capture this module being imported or its functions executing?
  context: >-
    Script block logging records the deobfuscated content PowerShell actually runs, including module import and the bodies of
    functions the module exports, even when the on-disk file is obfuscated. This is the ground-truth view of whether the
    dropped module was loaded and what it did once loaded. If PowerShell operational logs are not ingested in this
    environment, treat zero results as a visibility gap rather than evidence nothing ran, and read the module content directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A process that plants one module often stages several files, a dropper unpacking components or a stager writing multiple
    module parts, a manifest plus its RootModule, or output alongside the payload. The breadth, paths, and extensions of the
    writer's other file activity distinguish a single artifact from a broader staging operation and enumerate what else needs
    review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to the PowerShell Modules directories recently, and by which processes?
  context: >-
    The module search path has a small set of processes that legitimately write to it. Other recent arrivals in the same
    Modules directories reveal whether this is an isolated drop or a location under active use, and which other module files
    may belong to the same activity. A single unfamiliar writer touching several module files is the pattern to chase.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - '\WindowsPowerShell\Modules\'
          - '\PowerShell\7\Modules\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Were files dropped to other persistence locations (Startup folders, scheduled-task definitions) on this host?
  context: >-
    File-based persistence often stacks. Alongside a module planted on the search path, a Startup-folder drop or a file
    written to a Run/RunOnce key path achieves a second, independent foothold without running any standard persistence tool.
    File monitoring captures these drops even when the actor avoids schtasks, sc, or reg, and co-timed drops point to
    intentional stacking rather than isolated administration.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, so the result is the user's 90-day history of module files
    written to the search path by a non-PowerShell process (not generic file activity), aggregated by host. A user who has
    never produced this pattern is more suspicious than one who does so regularly as part of a documented deployment role;
    weigh the count against what this account is expected to do.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains:
        - \WindowsPowerShell\Modules\
        - \PowerShell\7\Modules\
      filter_main_pwsh:
        Image|endswith:
        - :\Program Files\PowerShell\7-preview\pwsh.exe
        - :\Program Files\PowerShell\7\pwsh.exe
        - :\Windows\System32\poqexec.exe
        - :\Windows\System32\WindowsPowerShell\v1.0\powershell_ise.exe
        - :\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
        - :\Windows\SysWOW64\poqexec.exe
        - :\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell_ise.exe
        - :\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe
      filter_main_msiexec:
        Image:
        - C:\Windows\System32\msiexec.exe
        - C:\Windows\SysWOW64\msiexec.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven the rule's pattern on this host or across the environment, or is the program new for this activity?
  context: >-
    When the alert fires under a service or machine account, user identity does not attribute the behavior; the meaningful
    pivot is the launch mechanism. The query mirrors the rule's selection scoped to the alerting program, so the result
    is the 90-day history of this program driving module writes to the search path. A new or rare program for this pattern is
    the deviation worth chasing; a program that already accounts for thousands of prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains:
        - \WindowsPowerShell\Modules\
        - \PowerShell\7\Modules\
      filter_main_pwsh:
        Image|endswith:
        - :\Program Files\PowerShell\7-preview\pwsh.exe
        - :\Program Files\PowerShell\7\pwsh.exe
        - :\Windows\System32\poqexec.exe
        - :\Windows\System32\WindowsPowerShell\v1.0\powershell_ise.exe
        - :\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
        - :\Windows\SysWOW64\poqexec.exe
        - :\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell_ise.exe
        - :\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe
      filter_main_msiexec:
        Image:
        - C:\Windows\System32\msiexec.exe
        - C:\Windows\SysWOW64\msiexec.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around the time of the alert?
  context: >-
    Tracking the account's activity across all hosts reveals whether the module drop is isolated or part of wider movement. If
    the same user drove similar activity on multiple endpoints in the same window, the scope of the incident is larger than a
    single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service or machine account, network-wide user activity returns agent-telemetry noise. The meaningful question is
    whether the same launch mechanism wrote modules to the search path elsewhere in the alert window. Multiple hosts in the
    same window point to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains:
        - \WindowsPowerShell\Modules\
        - \PowerShell\7\Modules\
      filter_main_pwsh:
        Image|endswith:
        - :\Program Files\PowerShell\7-preview\pwsh.exe
        - :\Program Files\PowerShell\7\pwsh.exe
        - :\Windows\System32\poqexec.exe
        - :\Windows\System32\WindowsPowerShell\v1.0\powershell_ise.exe
        - :\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
        - :\Windows\SysWOW64\poqexec.exe
        - :\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell_ise.exe
        - :\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe
      filter_main_msiexec:
        Image:
        - C:\Windows\System32\msiexec.exe
        - C:\Windows\SysWOW64\msiexec.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host, defense tampering, reconnaissance, or credential
    access, may reveal the stages that preceded the module drop and help reconstruct the timeline that led to persistence
    being established.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Is a module file with this name present on any other hosts in the environment?
  context: >-
    Finding the same module file name on multiple hosts may indicate deliberate distribution of a hijack module or lateral
    movement. If it is only on one host, the activity may be targeted; if it appears on many, determine the distribution
    pattern and timeline and whether the same writer was responsible each time.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
