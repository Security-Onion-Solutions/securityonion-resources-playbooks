name: Outlook Macro Execution Without Warning Setting Enabled
id: 9814f728-9056-48c5-a56f-ed6f4b62fdfd
description: |
  Detects modification of the Outlook macro-security Level registry value (a TargetObject ending in \Outlook\Security\Level) to the data 0x00000001, which enables all VBA macros to run without a warning prompt. Legitimately this value is rarely changed and is normally left at the more protective settings that disable macros or notify the user; a change to 0x00000001 weakens Office macro protection so any macro in the Outlook VBA project (VbaProject.OTM) executes silently, including code bound to Outlook startup or incoming-mail events. Investigation should confirm the exact key and value data, identify the process and user that made the change, and determine whether Outlook subsequently ran a macro, spawned a child process, or established outbound network activity.
type: detection
detection_id: e3b50fa5-3c3f-444e-937b-0a99d33731cd
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Do the registry key and value data match what this rule detects?
  context: Confirm the alert is a true positive by reviewing the exact registry path (a TargetObject ending in \Outlook\Security\Level), the value data (Details is 0x00000001), and the writing process against the rule criteria before investing further investigation time.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to change Outlook macro-security policy?
  context: Legitimate administrative or configuration activity can trigger this detection. Outlook macro-security posture is a per-user setting under the current user's Office profile, so a change made by a high-value mailbox account (administrator, finance, executive) or by an unexpected writing process is more notable than a routine configuration push. If User resolves to a machine account or is missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What macro-security level does the written value set, and what protection does it remove?
  context: The Outlook Security\Level value is a DWORD where 4 disables all macros, 3 notifies for digitally signed only, 2 notifies for all, and 1 enables all macros with no prompt. The detected data 0x00000001 turns the warning off entirely, so any VBA macro in VbaProject.OTM runs silently. Read the Details field to confirm the value and treat this as a weakening of Office macro protection rather than a benign preference change.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Is the modified key a known Outlook persistence or macro-security location, and what does changing it enable?
  context: The path ending in \Outlook\Security\Level controls whether Outlook prompts before running VBA macros. Setting it to 0x00000001 is a precondition for macro-based persistence and covert command execution, because it lets code bound to Outlook startup or incoming-mail events run without user interaction. Related Outlook keys abused for the same goal include LoadMacroProviderOnBoot, EnableUnsafeClientMailRules, and the WebView or Today home-page values, so confirm which specific key and value were touched here.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Does the weakened macro-security setting remain in place, or was it reverted after the change?
  context: Endpoint telemetry does not emit registry key or value deletion events, so a later cleanup of this value is not directly observable as a delete. Judge whether the weakened setting is still active from the key's re-modification history over a longer window and from whether a macro payload ran. A value that stays at 0x00000001 leaves macro protection off; a value re-modified back to a protective level narrows the window in which silent macro execution was possible.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Were other registry modifications made on this host in the same session?
  context: Attackers who weaken macro protection often make several related changes at once, such as setting LoadMacroProviderOnBoot to 1, adding an Outlook rule or home-page redirect, or disabling other security controls. Registry changes from the same writing process within a short window reveal the full scope of the configuration changes and whether multiple objectives were pursued together.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has this Outlook macro-security value been modified before on this host?
  context: Macro-security policy should rarely change on a given host, unlike frequently updated keys such as MRU lists. A first-time or very rare modification of this value is more notable than a recurring one. Compare historical Details values to see whether the same weakening was set previously or whether this is a unique change.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: After the macro warning was disabled, did Outlook spawn any child processes on this host?
  context: The purpose of enabling all macros is silent code execution, so the payoff appears as Outlook running a macro that launches other programs. Outlook spawning cmd.exe, powershell.exe, wscript.exe, or cscript.exe shortly after the value change is a strong sign the weakened setting was used. Review the child image and command line to determine what the macro did.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\outlook.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Was an Outlook VBA macro project or other payload written to disk by the process making these changes?
  context: Outlook macro persistence depends on a macro project file (VbaProject.OTM under %APPDATA%\Roaming\Microsoft\Outlook) or another dropped payload existing on disk; the registry change only removes the barrier to running it. Correlate file writes by the writing process and its children to see whether such a file landed in the same session. The file-write event carries no hash, so if a payload is present, hash it from a later execution or retrieve it for a reputation lookup. Reboot survival is a judgment call based on the value data and its re-modification history.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process made this registry change, and what started that process?
  context: The writing process and its own parent reveal how the macro-security change was made. A change made by reg.exe or powershell.exe launched from an unexpected parent, or by outlook.exe itself running a macro, points to attacker activity, whereas a change from a known configuration-management process points to routine administration. Trace the parent's origin to judge whether the chain is legitimate.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Do Windows application-log events show Outlook loading its VBA macro provider or add-in around this time?
  context: Outlook records add-in and macro-provider activity to the Windows application log, and loading of the Outlook VBA provider around the value change corroborates that macros were enabled and used. If the application channel is not collected in this environment, treat zero results as a visibility gap rather than evidence nothing ran, and rely on the process and network questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: application
    detection:
      selection:
        host.name|expand: '%hostname%'
        Provider_Name|contains: 'Outlook'
      condition: selection
    fields:
      - EventID
      - Provider_Name
- question: After the macro warning was disabled, did Outlook or a process it spawned make outbound network connections?
  context: Weaponized Outlook macros are used for covert command delivery and fallback command-and-control, so a macro may drive outbound connections directly from outlook.exe or from a script host it launches, sometimes on uncommon ports for a mail client. Identify which process initiated any connection and to which destination and port to separate normal mail traffic from macro-driven activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\outlook.exe'
          - '\powershell.exe'
          - '\cmd.exe'
          - '\wscript.exe'
          - '\cscript.exe'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
- question: Were scheduled tasks or other event-triggered persistence entries created on this host around the change?
  context: Enabling silent macros is one event-triggered execution mechanism; attackers frequently stack it with others such as scheduled tasks. Windows security auditing records scheduled task creation under event 4698. Correlating task creation with the macro-security change helps determine whether multiple persistence mechanisms were established in the same session. If security auditing for task creation is not enabled here, treat zero results as a visibility gap.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4698
      condition: selection
    fields:
      - EventID
      - TaskName
- question: Were WMI event subscriptions created or modified on this host around the change?
  context: >-
    WMI permanent event subscriptions are another event-triggered execution and persistence path an
    attacker may add alongside macro-based persistence. The native WMI-Activity channel records
    permanent consumer registration under event 5861 (its CONSUMER column carries the consumer
    definition, ESS the filter side), filter-to-consumer activity under 5859, and temporary
    subscriptions under 5860 — read the WQL trigger from Query and the namespace from
    NamespaceName, with message as the readable fallback. If the host does not ship the
    WMI-Activity channel, this returns no data and should be treated as a visibility gap rather
    than absence of activity.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: wmi
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 5859
          - 5860
          - 5861
      condition: selection
    fields:
      - EventID
      - winlog.user_data.CONSUMER
      - winlog.user_data.ESS
      - winlog.user_data.Query
      - winlog.user_data.NamespaceName
      - message
- question: Were files dropped to persistence locations such as the Startup folder or scheduled-task definition paths on this host?
  context: File-based persistence bypasses command-line detection entirely, and an operator who weakens macro protection may also drop a payload into the Startup folder or a Run-key path. File-event monitoring captures these drops even when standard persistence tools are avoided, so check for writes to these locations in the same timeframe as the macro-security change.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: What other registry activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Reviewing registry activity on the host in a tight window around the change reveals the immediate context, including other configuration or policy modifications that landed together. Novel key-and-process pairs at low counts stand out against routine, high-volume registry churn.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal the stages that preceded this change and help reconstruct the timeline. A macro-security weakening that follows earlier suspicious activity is more likely part of a multi-stage operation than an isolated configuration edit.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
