name: Suspicious Appended Extension
id: 9bcd5039-7c31-4d06-90eb-6ce186a11058
description: |
  Detects file rename operations where a document's original extension is retained and a new extension is appended, producing a double extension such as '.docx.locky' or '.jpg.crypted'. This rename pattern is the signature of ransomware encrypting files in place and tagging each encrypted file with a campaign-specific extension; backup, versioning, and archival software can produce a similar append and are the main benign cause. Investigation should confirm the responsible process, measure how many files it renamed and how quickly, and check for the recovery-inhibiting and encryption behaviors that accompany a ransomware sweep.
type: detection
detection_id: e3f673b3-65d1-4d80-9146-466f8b63fa99
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the rename match the double-extension pattern this rule detects, and which process performed it?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires when a file whose original name ends in a common
    document extension (.doc, .docx, .jpeg, .jpg, .lnk, .pdf, .png, .pst, .rtf, .xls, .xlsx) is renamed to a name that embeds
    that extension followed by another segment (a double extension such as .docx. or .jpg.), and the new name does not end in a
    known backup suffix (.bak, .old, .orig, .temp, .tmp, .backup). Read the source name, the new name, and the responsible
    process; backup and versioning software is the most common benign source of an appended extension.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - SourceFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to rename documents into a new appended extension in bulk?
  context: >-
    Legitimate administrative and backup activity can trigger this detection. Knowing whether the user role and host function
    are consistent with mass document renames is often the fastest way to separate a backup job or migration tool from
    ransomware. When the user is a machine or service account, judge by the responsible process and host role instead of the
    account name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What was the original name and the new name, and does the appended extension indicate encryption?
  context: >-
    The alert is a file rename, so the new name is the signal, not the file's content. Compare the source name against the new
    name: ransomware retains the original document extension and appends its own marker (for example a document renamed from
    report.docx to report.docx.locky). A single random or campaign-specific extension appearing across many renamed documents
    is the encryption fingerprint. Read the extension pattern rather than the file body.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_rename
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - SourceFilename
      - TargetFilename
      - Image
- question: What other files did the responsible process rename or write around the alert?
  context: >-
    Ransomware does not rename one file, it renames thousands in a short window. The breadth, paths, and appended extensions of
    the responsible process's other file activity separate an isolated rename from an encryption sweep in progress and enumerate
    what else has been affected. A high count of renames to the same new extension across user document directories, driven by a
    single process, is the mass-rename signature.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Are the renamed files still on disk, and were originals deleted after the rename?
  context: >-
    The post-alert lifecycle drives urgency and next steps. Encrypted files renamed in place remain on disk under their new
    extension while the readable originals disappear; recovering the plaintext then depends on shadow copies, backups, or a
    decryptor. Tracking the file activity forward reveals whether encryption is still spreading and how much has already been
    converted.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Are there signs of ransom notes or unknown binaries executing on this host during the rename sweep?
  context: >-
    Mass renames are usually accompanied by ransom-note file creation (README, HOW_TO_DECRYPT, and similar) and by an unfamiliar
    binary running with high file I/O. Surfacing non-system processes executing in the same window helps identify the encryption
    binary and confirm the activity is ransomware rather than a benign bulk rename. Check for ransom-note files in the affected
    directories through file activity or the endpoint console.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_known:
        Image|startswith:
          - 'C:\Program Files'
          - 'C:\Windows\System32\svchost'
          - 'C:\Windows\System32\wbem'
      condition: selection and not filter_known
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: What recovery-inhibiting commands were executed on this host?
  context: >-
    Ransomware operators chain recovery-inhibiting commands so victims cannot roll back: deleting shadow copies (vssadmin, wmic),
    disabling boot recovery (bcdedit), deleting backups (wbadmin), and disabling the Windows Recovery Environment (reagentc).
    This query surfaces those commands on the host, revealing the scope of recovery destruction. Verify whether each action
    succeeded by checking system state (vssadmin list shadows, bcdedit /enum, reagentc /info) and confirm offline or cloud backup
    status through organizational backup systems.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\reagentc.exe'
          - '\diskshadow.exe'
      selection_cmdline:
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'recoveryenabled'
          - 'bootstatuspolicy'
          - 'delete catalog'
          - 'delete systemstatebackup'
          - 'boot.ini'
          - 'winre.wim'
          - '/disable'
      condition: selection and (selection_recovery or selection_cmdline)
    fields:
      - Image
      - CommandLine
- question: What other destructive or recovery-inhibiting actions occurred on this host?
  context: >-
    Ransomware typically chains multiple destructive actions in one window: deleting shadow copies AND disabling recovery AND
    stopping security services AND changing file permissions. Finding the complete set of destructive commands, and whether they
    share a single parent process, distinguishes scripted ransomware execution from an isolated administrative command.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_destructive:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\cipher.exe'
          - '\fsutil.exe'
          - '\icacls.exe'
          - '\takeown.exe'
          - '\attrib.exe'
          - '\sc.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\powershell.exe'
          - '\taskkill.exe'
      condition: selection and selection_destructive
    fields:
      - Image
      - User
- question: How was the responsible renaming process launched, and is its parent chain expected?
  context: >-
    The rename event carries the responsible process identifier, which pivots to that process's creation event to reveal its
    image, parent, and command line. Ransomware binaries are frequently launched from a script host, a scheduled task, or a
    remote-execution tool rather than by a user double-click; an unexpected parent or a binary running from a user-writable path
    is the deviation worth chasing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - ParentImage
      - ParentCommandLine
      - CommandLine
- question: What is the hash of the responsible process binary, and does it have known threat intel detections?
  context: >-
    A process hash is recorded when the binary runs. This query locates the responsible process executing on the host and reads
    its hash; submit that hash to threat intelligence to determine whether the binary is known ransomware, a benign tool, or
    previously unseen. If the binary is present on disk but has not been captured executing, retrieve it from its path and hash
    it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - Hashes
- always_include: true
  question: Has this user previously produced this rename pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, returning the user's 90-day history of this specific
    double-extension rename pattern rather than generic file activity, aggregated by host. A user who has never produced this
    pattern is more suspicious than one who does so routinely; weigh the count against the user's role and typical toolset, since
    a backup operator may legitimately produce appended-extension renames.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_rename
      definition: 'Requirements: Microsoft-Windows-Kernel-File Provider with at least the KERNEL_FILE_KEYWORD_RENAME_SETLINK_PATH keyword'
    detection:
      selection:
        SourceFilename|endswith:
        - .doc
        - .docx
        - .jpeg
        - .jpg
        - .lnk
        - .pdf
        - .png
        - .pst
        - .rtf
        - .xls
        - .xlsx
        TargetFilename|contains:
        - .doc.
        - .docx.
        - .jpeg.
        - .jpg.
        - .lnk.
        - .pdf.
        - .png.
        - .pst.
        - .rtf.
        - .xls.
        - .xlsx.
      filter_main_generic:
        TargetFilename|endswith:
        - .backup
        - .bak
        - .old
        - .orig
        - .temp
        - .tmp
      filter_optional_anaconda:
        TargetFilename|contains: :\ProgramData\Anaconda3\
        TargetFilename|endswith: .c~
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this rename pattern on this host or across the environment?
  context: >-
    When the alert fires under a service or machine account, user identity does not attribute the behavior; the launch mechanism
    does. The query mirrors the rule's selection scoped to the alerting program, returning the 90-day history of that
    program driving this double-extension rename pattern. A new or rare program for this pattern is the deviation worth chasing;
    a program that already accounts for thousands of prior events is backup or archival automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_rename
      definition: 'Requirements: Microsoft-Windows-Kernel-File Provider with at least the KERNEL_FILE_KEYWORD_RENAME_SETLINK_PATH keyword'
    detection:
      selection:
        SourceFilename|endswith:
        - .doc
        - .docx
        - .jpeg
        - .jpg
        - .lnk
        - .pdf
        - .png
        - .pst
        - .rtf
        - .xls
        - .xlsx
        TargetFilename|contains:
        - .doc.
        - .docx.
        - .jpeg.
        - .jpg.
        - .lnk.
        - .pdf.
        - .png.
        - .pst.
        - .rtf.
        - .xls.
        - .xlsx.
      filter_main_generic:
        TargetFilename|endswith:
        - .backup
        - .bak
        - .old
        - .orig
        - .temp
        - .tmp
      filter_optional_anaconda:
        TargetFilename|contains: :\ProgramData\Anaconda3\
        TargetFilename|endswith: .c~
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around the time of the alert?
  context: >-
    Tracking the user's activity across all hosts reveals whether the rename is isolated or part of a wider push. If the same
    user drove similar activity on multiple endpoints in the same window, the scope of compromise may be larger and lateral
    movement may be underway.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven rename pattern fire on other hosts in the same window?
  context: >-
    Under a service or machine account, network-wide user activity returns agent-telemetry noise. The meaningful question is
    whether the same launch mechanism produced this rename pattern elsewhere: the query mirrors the rule's selection scoped to
    the alerting program, fleet-wide, in the alert window. Multiple hosts in the same window points to a coordinated
    encryption rollout; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_rename
      definition: 'Requirements: Microsoft-Windows-Kernel-File Provider with at least the KERNEL_FILE_KEYWORD_RENAME_SETLINK_PATH keyword'
    detection:
      selection:
        SourceFilename|endswith:
        - .doc
        - .docx
        - .jpeg
        - .jpg
        - .lnk
        - .pdf
        - .png
        - .pst
        - .rtf
        - .xls
        - .xlsx
        TargetFilename|contains:
        - .doc.
        - .docx.
        - .jpeg.
        - .jpg.
        - .lnk.
        - .pdf.
        - .png.
        - .pst.
        - .rtf.
        - .xls.
        - .xlsx.
      filter_main_generic:
        TargetFilename|endswith:
        - .backup
        - .bak
        - .old
        - .orig
        - .temp
        - .tmp
      filter_optional_anaconda:
        TargetFilename|contains: :\ProgramData\Anaconda3\
        TargetFilename|endswith: .c~
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: Is this same rename detection firing on other hosts in the environment?
  context: >-
    Ransomware often runs the same encryption sequence across many hosts at once or in rapid succession. Finding this same
    detection on multiple hosts indicates network-wide execution and determines the scope for containment and incident response.
    A spread across many hosts should escalate to incident response.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
- question: Did the responsible process make outbound network connections before or during the rename sweep?
  context: >-
    Double-extortion ransomware exfiltrates data before it encrypts, so the responsible process may have opened outbound
    connections to a staging or command-and-control destination ahead of the rename burst. Reviewing the process's egress
    identifies exfiltration targets and separates in-place encryption from a data-theft-plus-encryption operation. Unusual
    destinations, high outbound volume, or connections to freshly registered infrastructure are the indicators to weigh.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
