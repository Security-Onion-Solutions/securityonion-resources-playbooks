name: Change User Account Associated with the FAX Service
id: 428d3e12-0402-4e58-97ca-66b702939f11
description: |
  Detects a change to the Windows FAX service logon account, written as the ObjectName value under
  HKLM\System\CurrentControlSet\Services\Fax, to any account other than the default NetworkService. The
  built-in FAX service (FXSSVC.exe) normally runs as NetworkService and its logon account rarely changes
  outside of imaging or a documented reconfiguration. Reassigning the service to a privileged or
  attacker-controlled account, then starting the service, runs the service process under those privileges
  and is used as a persistence and privilege-escalation vector. Investigation should determine which
  account the service was changed to, which process and user made the change, whether the FAX service
  subsequently ran under the new account, and whether related registry or file changes accompanied it.
type: detection
detection_id: e3fdf743-f05b-4051-990a-b66919be1743
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alert show the FAX service ObjectName value changed to an account other than NetworkService?
  context: >-
    Confirm the true positive by reviewing the exact registry path (TargetObject
    HKLM\System\CurrentControlSet\Services\Fax\ObjectName), the value data written to it (Details), and the
    writing process. The rule fires when this value is set to any account whose data does not contain
    NetworkService, which is the service's default logon identity, so the account it was changed to is the
    signal to verify.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to reconfigure a built-in service logon account?
  context: >-
    Reconfiguring the logon account of a built-in Windows service is an infrequent administrative action.
    Knowing whether the user role and host function are consistent with service reconfiguration is often the
    fastest way to separate a legitimate maintenance change from an unauthorized one. If the writing user is
    a machine account or missing, pivot on the writing process (Image) instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the modified value the FAX service logon account, and why is that a security-relevant location?
  context: >-
    The ObjectName value under a service key defines the account the service runs as. Changing it is a
    service-account-hijack pattern: an operator points a service at a privileged or attacker-controlled
    identity so that starting the service executes code under those privileges. The Services hive is one of
    the critical, rarely-changed key classes that warrant scrutiny; confirm the exact key path and the
    account written before broadening the investigation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What account was the FAX service changed to run as?
  context: >-
    Read the Details value to determine the exact account the service was reassigned to. A change to
    LocalSystem grants the highest local privileges; a change to a specific domain or local user ties the
    service to an operator-controlled identity. Any value other than the default NetworkService raises the
    privileges or changes the identity the FAX service will execute under on next start.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Was the FAX service account changed once, or was it flipped repeatedly and possibly reverted?
  context: >-
    Direct value-delete events are not emitted for the registry, so cleanup cannot be judged by looking for a
    removal of the value. Instead read the re-modification history of the ObjectName value: whether it was set
    once and left, set and later reverted to NetworkService (consistent with a use-then-restore of the
    hijack), or changed multiple times. Pair this with whether the service actually ran under the new account
    to judge how effective the change was.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What process wrote this value, and what started that process?
  context: >-
    The parent chain of the writing process reveals how the reconfiguration was driven. Legitimate service
    reconfiguration usually comes from known administrative tooling (for example services.exe, an MMC snap-in,
    or a deployment agent); an unsigned binary, a script host, or an abnormal parent-child lineage performing
    the change points to hands-on operator activity. Trace the writing process back to its origin to
    distinguish the two.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: After the account change, did the FAX service (FXSSVC.exe) start and run?
  context: >-
    The hijack only executes code when the service is (re)started under the new account. Look for FXSSVC.exe
    running on this host in the window after the change; the FAX service process is expected to be idle on
    most hosts, so an FXSSVC.exe start correlated in time with the account change indicates the reconfigured
    identity was actually used. Note that FXSSVC.exe may exit almost immediately after triggering its payload.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\FXSSVC.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Were other registry modifications made on this host in the same session?
  context: >-
    The FAX-service hijack pattern adds or changes several registry keys to configure the service before it is
    started, so the ObjectName change rarely stands alone. Reviewing all registry modifications on the host in
    the surrounding window, grouped by key path and writing process, reveals the full scope of the
    configuration changes and whether the same process drove them. If the host is registry-noisy, narrow to
    the writing process from the alert or to service and startup hive paths.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Did the process that changed the service account also write executables or scripts to disk?
  context: >-
    A reconfigured service is most useful to an operator when it launches a payload. Correlating file activity
    by the registry-writing process and its children surfaces any binaries or scripts staged in the same
    session that the service could execute. The file-write event carries no hash; if a candidate payload is
    present, hash it from a later execution or retrieve it for a reputation lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has the FAX service logon account been changed before on this host?
  context: >-
    Service logon accounts are set at install or imaging time and then rarely touched. A historical view of
    modifications to this value on this host calibrates severity: zero or near-zero prior changes make this
    modification stand out, while a recurring pattern may reflect a management tool that reconfigures the
    service on a schedule.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was the FAX service account changed on other hosts in the environment?
  context: >-
    The same service-account change across multiple hosts may indicate lateral movement using authentication
    material to reconfigure services remotely, or a management change pushed fleet-wide. If only this host
    carries the modification it is more likely targeted. Compare the account values set across hosts to see
    whether the same identity was written everywhere.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Were other persistence mechanisms installed on this host around the same time?
  context: >-
    Operators rarely rely on a single foothold. After reconfiguring a service for persistence, backup
    mechanisms are commonly staged using scheduled tasks, other service changes, or registry autoruns.
    Persistence-tool executions clustered in the same timeframe as the account change point to intentional
    stacking rather than an isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Did other detections fire on this host in the hours before this change?
  context: >-
    Service-account hijacking is usually a mid-chain action rather than an entry point. Earlier detections on
    the same host, such as remote-service manipulation, credential access, or reconnaissance, may reveal the
    stages that preceded the change and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was there a change ticket or documented approval for reconfiguring the FAX service account?
  context: >-
    Reconfiguring a service logon account is the kind of change many organizations gate behind a ticket or
    maintenance window. A corresponding record suggests authorized activity; the absence of one where policy
    requires it suggests the change was unauthorized and should be escalated.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the administrator or service owner recall changing the FAX service account?
  context: >-
    Direct confirmation from the person behind the account is often the fastest path to determining
    legitimacy. If no administrator recalls reconfiguring the FAX service, the change may be automated or
    driven by compromised credentials; if someone does recall it, capture why the account was changed and to
    what.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
