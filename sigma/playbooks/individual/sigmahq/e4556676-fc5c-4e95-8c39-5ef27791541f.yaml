name: CVE-2023-38331 Exploitation Attempt - Suspicious Double Extension File
id: 87663fea-1dc2-4079-902e-5d1f148e1047
description: |
  Detects WinRAR writing a file with a spaced double extension into its temporary extraction folder
  (%LOCALAPPDATA%\Temp\Rar$...). This is the artifact left by the WinRAR archive-extraction spoofing
  vulnerability, where a crafted archive pairs a benign-looking entry (for example an image) with a
  same-named script or executable so that opening the decoy runs the malicious entry instead. The
  investigation should confirm the spoofed filename and extracting process, recover and inspect the
  extracted file, and determine what WinRAR launched afterward and how the archive reached the host.
type: detection
detection_id: e4556676-fc5c-4e95-8c39-5ef27791541f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Did WinRAR create a file with a spaced double extension under its Temp extraction folder?
  context: Confirm the alert is a true positive by reviewing the exact file path and the creating process.
    The rule fires only when WinRAR.exe writes a file whose path contains \AppData\Local\Temp\Rar$ and
    whose name carries a short extension followed by a space and a second dot (for example an image
    extension followed by a script extension). Verify the full TargetFilename before investing further time.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to open archives with WinRAR that extract to the Temp folder?
  context: Routine archive extraction is common on many workstations, so the distinguishing factor is the
    spaced double-extension name, which normal archives do not produce. Knowing whether this user commonly
    opens archives delivered by email, chat, or download is often the fastest way to separate a benign
    extraction from a lure.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which archive did WinRAR open, and where was it launched from?
  context: WinRAR's command line records the archive path passed when the user opened it. Determine the
    archive's origin and working directory to reconstruct which file the user believed they were opening
    versus the spoofed entry that extracted. The alert's file event carries no command line, so this pivots
    to the WinRAR process on the same host in the surrounding window.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What is the extracted file, and what does its content reveal?
  context: The file dropped into the Rar$ temp folder is what actually runs when the spoof succeeds. Recover
    it and inspect the content for script commands, batch loaders, encoded strings, embedded URLs, or a
    packed executable. The benign leading extension hides the real file type; the trailing extension after
    the space (.cmd, .bat, .exe, .scr, .ps1, .vbs) indicates what the payload really is.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If the extracted file executed, what is its hash and does threat intel flag it?
  context: A file-creation event carries no hash; the hash is recorded when the file runs. This looks for the
    dropped file executing by its name and reads the hash for reputation lookup against threat intel. If the
    file is present but has not run, retrieve it from its on-disk Temp path and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
- question: What process launched WinRAR, and is that parent chain expected?
  context: The parent reveals how WinRAR was invoked. A launch from an email client, browser, or chat
    application points to a delivered archive rather than a user browsing local files, and is consistent with
    the crafted-archive delivery this vulnerability relies on.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What did WinRAR launch after extracting the file?
  context: In a successful spoof, WinRAR's processing error runs the wrong entry, so WinRAR or a shell it
    invokes becomes the parent of the payload. Look for cmd.exe, powershell.exe, wscript.exe, cscript.exe,
    mshta.exe, rundll32.exe, or wmic spawned shortly after the extraction; a script loader that re-launches
    itself and uses WMI to create the payload process is a recurring follow-on pattern.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is the extracted file still on disk, or was it deleted or renamed after the alert?
  context: The extracted file's post-alert lifecycle drives both urgency and next steps. A file still present
    in the Temp\Rar$ folder can be retrieved, hashed, and analyzed; deletion moments after extraction suggests
    a self-cleaning loader and shifts the focus to what executed in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did WinRAR write or delete around the alert?
  context: A crafted archive commonly extracts several staged components together — a decoy image, an icon,
    and a hidden script or executable in the same-named folder. The breadth, paths, and extensions of the
    process's other file activity separate a single artifact from a fuller staging set and enumerate what
    else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else was written to the WinRAR Temp extraction folder recently, and by which processes?
  context: The Rar$ temp folders hold files WinRAR extracts for viewing or launching. Other recent arrivals
    in that location, and the processes that wrote them, reveal whether this is an isolated extraction or
    repeated activity from crafted archives, and which other artifacts belong to the same activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\AppData\Local\Temp\Rar$'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has a file with this spoofed name appeared on this host before?
  context: A filename that has never been seen on a host is more suspicious than one that is part of normal
    operations. The same lure filename recurring points to repeated delivery attempts, while a first-time
    appearance is consistent with a targeted or one-off archive.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What other processes ran on this host around the time of the extraction?
  context: The payload chain following a successful spoof shows up as new process activity in the minutes
    around the alert — a script host, a download tool, or persistence setup such as a Run-key write.
    Aggregating process activity by parent and child collapses routine noise so novel pairs stand out at low
    counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: When this host has previously produced this spoofed-extension pattern, what programs and users drove
    it, and does the current alert fit?
  context: Even common tools can be abused. The query mirrors the rule's selection structure scoped to this
    host, so the resulting program and user distribution reflects how this specific WinRAR spoofed-extension
    pattern has historically run here. The Image column will show WinRAR.exe itself; file events carry no
    parent lineage, so pivot to the archiver's process-creation event if launch lineage matters. An
    unexpected user account, or a first-time fire of this pattern here, is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith: \WinRAR.exe
        TargetFilename|contains: \AppData\Local\Temp\Rar$
        TargetFilename|re: \.[a-zA-Z0-9]{1,4} \.
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts produced this spoofed-extension pattern in the past week, and does the cross-host
    distribution look like a campaign or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of this WinRAR spoofed-extension pattern. Many hosts firing the same pattern points to a crafted
    archive delivered to multiple users; one host or a small unrelated set points to an isolated target. Use
    the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith: \WinRAR.exe
        TargetFilename|contains: \AppData\Local\Temp\Rar$
        TargetFilename|re: \.[a-zA-Z0-9]{1,4} \.
      condition: selection
    fields:
    - host.name
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by host.
    A user who has never produced this pattern is more suspicious than one who does so regularly; weigh the
    count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith: \WinRAR.exe
        TargetFilename|contains: \AppData\Local\Temp\Rar$
        TargetFilename|re: \.[a-zA-Z0-9]{1,4} \.
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven the rule's pattern on this host or across the
    environment, or is the program new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior. The
    meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped to the
    alerting program, so the result is the 90-day history of this program driving this specific pattern
    (not generic use of the binary). A new or rare program for this pattern is the deviation worth
    chasing; a program that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith: \WinRAR.exe
        TargetFilename|contains: \AppData\Local\Temp\Rar$
        TargetFilename|re: \.[a-zA-Z0-9]{1,4} \.
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple
    endpoints. If the same user triggered similar activity on other hosts in the same window, the scope of the
    incident may be larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window, or is the activity
    isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same launch
    mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts in the same window points to scheduled or pushed
    automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith: \WinRAR.exe
        TargetFilename|contains: \AppData\Local\Temp\Rar$
        TargetFilename|re: \.[a-zA-Z0-9]{1,4} \.
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
