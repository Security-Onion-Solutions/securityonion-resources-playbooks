name: Potential Edputil.DLL Sideloading
id: 9723e26a-a8a4-42f5-ba7c-96e996406214
description: |
  Detects a process loading edputil.dll from a directory other than C:\Windows\System32, C:\Windows\SysWOW64, or C:\Windows\WinSxS. edputil.dll is a legitimate Windows system library that normally loads only from those signed system locations. A load from any other path is the signature of DLL search-order hijacking (side-loading): an attacker drops a malicious edputil.dll alongside a program — often a relocated but legitimately signed executable — so the program resolves and loads the attacker copy before the real system DLL. Investigation should confirm the load path, the loaded module's signature and hash, the identity and legitimacy of the loading process and its parent, and whether the same load appears on other hosts.
type: detection
detection_id: e4903324-1a10-4ed3-981b-f6fe3be3a2c2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the loaded module match what this rule detects — path, signature, and loading process?
  context: >-
    Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded) against the rule's criteria: the
    path must end in \edputil.dll AND must NOT start with C:\Windows\System32\, C:\Windows\SysWOW64\, or C:\Windows\WinSxS\.
    A load from any of those canonical locations is the legitimate system copy; a load from a program directory, AppData,
    ProgramData, Public, or %TEMP% is what this rule fires on. DLL loads carry the module's hash and code-signature status on
    the load event, so verify those here as well as the loading process identity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this user and host expected to run the process that loaded edputil.dll from a non-system path?
  context: >-
    Legitimate administrative or developer activity can relocate signed binaries that carry their own copies of system DLLs.
    Knowing whether the user role and host function are consistent with running the loading process from a non-standard
    directory is often the fastest path to distinguishing a true positive from a routine installer or portable-application
    load.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What modules did this process load, and are any from non-canonical paths, unsigned, or from user-writable directories?
  context: >-
    The full set of modules a process loads tells the load's story. edputil.dll normally resolves from C:\Windows\System32,
    SysWOW64, or WinSxS; a copy resolved from the loading process's own directory is search-order hijacking. Look also for
    other DLLs loaded from %TEMP%, AppData, ProgramData, or Public, and for unsigned modules sitting in directories where signed
    ones are expected — a side-loaded payload rarely arrives alone.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For the edputil.dll that loaded, what is its signing status, hash, and threat-intel reputation?
  context: >-
    Module reputation separates a relocated legitimate DLL from a side-loaded malicious one. The genuine edputil.dll is
    Microsoft-signed with a valid signature; an unsigned copy, or one whose SignatureStatus is Expired, Distrusted, or Invalid,
    is a strong masquerading signal even when the filename looks right. Pivot the module hash against threat intelligence to
    surface known loader families. A valid Microsoft signature on a copy staged outside System32 can still be an installer
    artifact, so weigh signature against path together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What is the process that loaded edputil.dll, and what were its full command line and working directory?
  context: >-
    The loading process is the target of the sideload — its own directory is where the malicious edputil.dll was staged. Decode
    its command line and working directory to establish what the binary is: a relocated legitimate application, a portable
    tool, or an unfamiliar executable dropped into a writable path. A working directory under AppData, ProgramData, Public,
    or %TEMP% alongside the loaded DLL is the classic sideload staging layout.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned the binary that loaded edputil.dll, and is that parent chain expected?
  context: >-
    The parent reveals how the loading binary was launched. A signed application started from explorer.exe or a package
    manager is a different story from the same binary spawned by a script host, an Office application, or an archive utility
    unpacking to a temp directory. An unexpected parent points to a delivery chain that staged the executable and its
    companion DLL together.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Has edputil.dll been loaded from this path on this host before, and by which processes?
  context: >-
    A first-time load of edputil.dll from a non-system directory is a stronger anomaly than a recurring one. If the same
    module path has been loaded by the same binary repeatedly over the past 90 days, this load is probably a stable
    application layout; if this is the first occurrence, or the module has previously loaded only from System32/SysWOW64/WinSxS,
    the current non-standard load is anomalous.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Is edputil.dll being loaded from non-system paths by other hosts in the environment?
  context: >-
    Cross-host correlation surfaces distribution. edputil.dll loaded from a non-standard path on one host could be a localized
    incident; the same non-system load across multiple hosts points to shared tooling or repeated delivery of the same staged
    package. Pay attention to the variety of loading processes: a single expected binary is likely benign, while the same DLL
    loaded by different unexpected processes across hosts suggests wider intrusion activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Were registry keys that influence DLL search order or per-application DLL loading modified on this host recently?
  context: >-
    DLL hijacking is not always achieved by co-locating a DLL. Registry-driven variants force libraries into processes through
    KnownDLLs redirection, the AppInit_DLLs and AppCertDlls values, or Image File Execution Options entries. A modification to
    any of these near the alert timeframe corroborates a deliberate load-path manipulation rather than an incidental
    non-standard load. Registry deletions are not observable here, so focus on modifications and their payload references.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_dll_keys:
        TargetObject|contains:
          - '\Session Manager\KnownDLLs'
          - '\CurrentVersion\Windows\AppInit_DLLs'
          - '\Control\Session Manager\AppCertDlls'
          - '\Image File Execution Options\'
      condition: selection and selection_dll_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: Is the edputil.dll and its companion binary still on disk for analysis?
  context: >-
    If the module and the executable that loaded it are still present, they can be hashed, submitted to a sandbox, and
    reviewed for masquerading. Correlating file writes to the loading process and its direct children shows whether the DLL
    and binary were freshly staged together and whether either has since been removed. Preserve both before cleanup or
    reboot removes them.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    A sideload rarely happens in isolation. Examining the process activity in a tight window around the load reveals what
    delivered and launched the loading binary and what the payload did next — reconnaissance, additional drops, or persistence
    installation. The correlation interval between the file staging, any registry change, and the module load is what ties
    these events into one operation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, or an initial-access delivery — may reveal the
    stages that preceded the DLL load and help reconstruct the timeline. Side-loading is frequently a mid-chain execution
    step following a phishing-driven download, so a preceding download or script-host alert changes the priority of this load.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was there a change ticket, deployment, or documented approval that would explain this binary running from a non-system path?
  context: >-
    Software deployments, packaging tests, and portable-application rollouts sometimes place signed executables and their
    bundled DLLs outside the standard system directories. A corresponding ticket or deployment record suggests authorized
    activity; the absence of one when policy requires it moves the load toward unauthorized. This check can quickly close a
    false positive or escalate a true positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the user or administrator recall running this application from that location?
  context: >-
    Direct confirmation from the person behind the account is often the fastest path to legitimacy. If the user does not
    recall launching the loading binary from that directory, their session may be executing dropped malware; if they do
    recall it, capture why the application was run from a non-standard path and whether they installed it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were files dropped to persistence locations (Startup folders, scheduled-task definitions) on this host?
  context: >-
    A successful sideload commonly establishes persistence in parallel. Dropping an executable or script into a Startup
    folder or a path referenced by a registry Run key achieves persistence without running schtasks, sc, or reg. File-event
    monitoring captures these drops around the same window as the DLL load even when the attacker avoids standard persistence
    tools.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    Attackers rarely rely on a single foothold. After a sideloaded payload executes, backup persistence is commonly installed
    with different techniques — scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions. Multiple
    persistence installations in the same timeframe indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
