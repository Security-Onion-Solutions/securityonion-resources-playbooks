name: Potential DLL Sideloading Of Libcurl.DLL Via GUP.EXE
id: 448d67ae-07e2-4361-ae97-9554f0e6f75a
description: |
  Detects the Notepad++ Generic Updater (gup.exe) loading libcurl.dll from a location other than the
  legitimate Notepad++ updater directory, a DLL side-loading pattern. Legitimately, the bundled gup.exe
  loads its own native libcurl.dll from the Notepad++\updater path; the rule excludes that known-good
  location. A relocated gup.exe loading a libcurl.dll from a user-writable directory can indicate a
  trojanized module whose exported functions are hijacked to decode and run an embedded payload the moment
  gup.exe launches. Investigation should confirm the load path and signature of the module, verify its hash
  and reputation, trace how and from where gup.exe was launched, and determine what it spawned afterward.
type: detection
detection_id: e49b5745-1064-4ac1-9a2e-f687bc2dd37e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the loaded module match what this rule detects — path, signature, and loading process?
  context: >-
    Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded), its
    code-signature status, and the loading process against the rule's criteria. The rule fires when
    gup.exe loads a file ending in libcurl.dll AND that load did NOT come from the legitimate
    Notepad++\updater\GUP.exe location. A load from a user-writable directory (AppData, ProgramData,
    Public, or a per-user temp path) rather than the Notepad++ install tree is the side-loading signal.
    DLL loads carry a hash and signing status on the load event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Is this user and host expected to run gup.exe and the Notepad++ updater?
  context: >-
    Hosts with Notepad++ installed run gup.exe routinely to check for updates, and that activity is
    benign. Knowing whether Notepad++ is deployed here, whether the account tied to this event normally
    uses it, and whether the host is a workstation where an updater would run helps separate a routine
    update check from a relocated gup.exe used to side-load a module. An updater running under a service
    account or on a server with no interactive Notepad++ use is worth a closer look.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What modules did this process load, and are any from user-writable or non-canonical paths, unsigned, or name-collisions with system DLLs?
  context: >-
    The full set of modules the process loaded shows whether libcurl.dll was the only unusual load or one
    of several. For a side-load, look for a DLL that carries a well-known native library name but loads
    from the application's own relocated directory instead of the system path, is unsigned or signed by an
    unexpected party, or sits in AppData, ProgramData, Public, or a temp path. A managed (.NET) module
    masquerading under a native library name is a strong substitution signal.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For the loaded libcurl.dll, what is its signing status, hash, and threat-intel reputation?
  context: >-
    Module reputation separates a routine third-party DLL from a side-loaded malicious one. The legitimate
    libcurl.dll is a signed native library; an unsigned module using that filename, or one signed by an
    unexpected party, is a masquerading indicator. Take the hash from the load event and compare it against
    a known-good baseline for libcurl.dll and against threat intelligence — a mismatch against the vendor
    baseline points to substitution, and a known-bad hash confirms a malicious loader.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: From what directory did gup.exe run, and how was it invoked?
  context: >-
    The current working directory and command line of gup.exe reveal whether it ran from its legitimate
    Notepad++ install tree or from a relocated, user-writable location. A search-order side-load works by
    placing a trojanized DLL next to a copy of gup.exe outside its normal directory; the process path and
    working directory are the fastest way to see that relocation. Compare the path to the expected
    Notepad++\updater location.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Which process wrote libcurl.dll to disk on this host, and when relative to the load?
  context: >-
    A side-load begins with the malicious DLL being placed on disk next to the loader. Identifying the
    process that wrote libcurl.dll, and the interval between that write and the module load, separates a
    vendor installer or update staging a signed library from a dropper planting a trojanized one. A write
    from a script host, an archive utility, or an unexpected parent shortly before the load is the
    placement stage of the side-load chain.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: '\libcurl.dll'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
- question: Is the loaded libcurl.dll still on disk for analysis?
  context: >-
    If the module or a related dropped file is still present, it can be hashed, submitted to a sandbox, or
    reviewed directly. A side-loaded DLL that decodes and runs an embedded payload often leaves companion
    files (an encoded payload blob, a launching script, or a copy of the loader) in the same directory.
    Confirming what remains on disk enables deeper analysis; absence may indicate cleanup.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process spawned gup.exe, and is that parent chain expected?
  context: >-
    A legitimate update check has gup.exe launched by notepad++.exe or a scheduled updater. A gup.exe
    launched by a script host (wscript.exe, cscript.exe), a command shell running a batch file, or an
    Office application points to a planted side-load chain rather than a routine update. Walk up the parent
    to see what invoked it and what else that parent launched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What child processes did gup.exe spawn afterward?
  context: >-
    A hijacked export in the side-loaded DLL runs the moment gup.exe launches, so its downstream children
    reveal the payload's intent. Legitimate gup.exe spawns little beyond its own update helpers; a
    side-load may spawn a command shell, a script host, or a signed system binary used for the next stage.
    Unexpected children shortly after the load are the execution stage of the chain.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Were autorun registry Run or RunOnce keys modified on this host around the alert?
  context: >-
    Side-load chains are frequently anchored by an autorun entry that relaunches the loader at logon,
    pointing a Run or RunOnce value at a script or the relocated gup.exe. Modifications to these keys near
    the load — especially values referencing a user-writable path, a script host, or the loader directory —
    tie the module load to a persistence mechanism. Examine the value data for what each entry launches
    rather than treating the key change alone as the finding.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\CurrentVersion\Run'
          - '\CurrentVersion\RunOnce'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Has libcurl.dll been loaded on this host before, and under what processes?
  context: >-
    A first-time load of this module on the host is a stronger anomaly than a recurring one. If libcurl.dll
    has loaded here repeatedly under gup.exe from the Notepad++ tree over the past 90 days, the current
    load is likely routine update activity. If this is the first occurrence, or the module has previously
    loaded only under unrelated processes or from a different path, the current load is anomalous and
    consistent with a planted DLL.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: When this host has previously fired the rule's pattern, what programs and users normally drive that activity, and does the current alert fit that pattern?
  context: >-
    Even a legitimate gup.exe update can occasionally trip the rule. The query mirrors the
    rule's selection scoped to this host, so the resulting program and user distribution
    reflects how this specific firing pattern has historically run here. A new acting program
    process, an unexpected user account, or a first appearance of the pattern is the deviation
    worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith: \gup.exe
        ImageLoaded|endswith: \libcurl.dll
      filter_main_notepad_plusplus:
        Image|endswith: \Notepad++\updater\GUP.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - Image
    - User
- question: Does the timing of this activity align with normal work hours and maintenance windows?
  context: >-
    A Notepad++ update check typically runs when a user is active on a workstation. A gup.exe module load
    at an unusual hour, on a server, or on a host with no interactive Notepad++ use is harder to explain as
    routine updating. Compare the event time against the host's usual activity window and any documented
    maintenance to judge whether the timing fits legitimate use.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were files dropped to persistence locations such as the Startup folder or scheduled-task definition paths on this host?
  context: >-
    File-based persistence bypasses command-line detection entirely. Dropping an executable, DLL, or script
    into a Startup folder or a path referenced by a Run key achieves relaunch at logon without running
    schtasks, sc, or reg. Alongside a side-load, such a drop in the same timeframe indicates the loader was
    installed for persistence rather than executed once.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining process activity around the load reveals what led to it and
    what followed — a preceding script execution or download that staged the DLL, or reconnaissance and
    lateral-movement tooling that followed. Novel parent-child pairs at low counts are what to scan for
    against the routine agent and system noise.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — script execution, ingress tool transfer, defense tampering, or
    credential access — may reveal the stages that placed the side-load and help reconstruct the timeline.
    A side-load is often a mid-chain persistence step, so preceding alerts frequently show how the loader
    arrived.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this specific
    firing pattern rather than generic gup.exe usage. Many hosts firing the same pattern points to scripted
    deployment or a shared software package; one host or a small unrelated set points to targeted operator
    activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith: \gup.exe
        ImageLoaded|endswith: \libcurl.dll
      filter_main_notepad_plusplus:
        Image|endswith: \Notepad++\updater\GUP.exe
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
