name: System File Execution Location Anomaly
id: b0206cfb-4a77-44f9-af98-227018eb72e6
description: |
  Detects a Windows system binary (such as svchost.exe, lsass.exe, powershell.exe, certutil.exe, schtasks.exe, or one of the other shipped system executables in the rule's list) executing from a path outside the expected system locations. The rule fires when the Image name matches a known system binary AND the path is none of the canonical locations (System32, SysWOW64, WinSxS, servicing/update staging directories, and the explicit PowerShell 7 and WSL install paths). Legitimately, these binaries always run from C:\Windows\System32 or the other allow-listed roots; a copy running from ProgramData, a user profile, Temp, or any other directory is the masquerading signal (T1036) — adversaries relocate a trusted, signed Microsoft binary to load a same-named malicious DLL from its new folder or to blend a renamed payload in among system tooling. Determine the true identity of the binary, how it arrived at the anomalous path, what it did after launch, and whether the same pattern is present on other hosts.
type: detection
detection_id: e4a6b256-3e47-40fc-89d2-7a477edd6915
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Is the alerting binary a known system executable running from a path outside the expected system locations?
  context: Confirm the alert is real before investing time. The rule fires when the Image name is one of the shipped Windows system binaries (svchost.exe, lsass.exe, powershell.exe, certutil.exe, schtasks.exe, and others) AND the path is none of the canonical roots (System32, SysWOW64, WinSxS, the servicing and update staging directories, or the explicit PowerShell 7 / WSL install paths). Note the exact full Image path the alert fired on; the location is the entire signal, since the binary name alone is legitimate.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is this user and host expected to run this system binary from this location?
  context: A system binary running from a non-standard directory is sometimes legitimate — a portable PowerShell 7 build, a vendor application that bundles a renamed Windows utility, or a developer staging tools. Knowing whether the user role and host function explain a copy of this binary outside the system folder is often the fastest path to separating a true positive from routine operations.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the true identity of this binary based on its embedded metadata, signature, and hash?
  context: A system binary running from an anomalous path is either a genuine Microsoft binary that was copied out of System32 or a renamed payload wearing a system name. Compare the on-disk Image name against the embedded OriginalFileName, and check the signing party and signature status — a valid Microsoft signature points to a relocated-but-genuine binary (often a DLL-sideloading host), while an unsigned or third-party-signed file with a mismatched OriginalFileName points to a renamed payload. Submit the hash for reputation lookup to determine whether it is a known-good system file, a known-bad sample, or novel.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: How did this binary arrive at the anomalous path, and what process created it?
  context: A system binary does not appear outside System32 on its own — it was copied, downloaded, extracted from an archive, or dropped by another process. Tracing the file-creation event for this binary name reveals the delivery mechanism and the creating process. A copy into ProgramData or a user-writable directory paired with a same-named DLL written to the same folder is the relocated-sideload pattern; a drop into Temp or Downloads points to download or extraction. The match is by binary name over a long window because the file may have been placed days or weeks before it ran.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What did this binary do after it launched, and is the same binary running from an anomalous location on other hosts?
  context: The point of relocating or renaming a trusted binary is to perform its real function while evading detection. The child processes, command lines, and downstream activity spawned by this binary reveal its actual objective — credential access, reconnaissance, lateral movement, or loading a sideloaded DLL. The same binary executing from a comparable non-standard path on other hosts points to deliberate distribution rather than an isolated event.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What process spawned this binary, and is that parent chain expected for it?
  context: The parent process reveals how the relocated binary was launched. Genuine system binaries normally have predictable parents (services.exe, explorer.exe, the Task Scheduler). A parent such as an installer dropped in Temp, an Office application, mshta.exe, wscript.exe, or a loader running from a user profile points to attacker-driven execution rather than the OS launching its own tooling.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did this binary spawn afterward?
  context: The processes spawned by the relocated binary reveal its impact. A genuine system binary launched from an odd path may spawn nothing unusual, while a masqueraded or sideload-host binary often launches command interpreters, network tools, or further payloads (cmd.exe, powershell.exe, certutil.exe, rundll32.exe) for post-exploitation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this host run this binary from any location before?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low historical counts for this system binary indicate first-time or rare execution and raise the weight of the location anomaly. Note that this counts the binary by name regardless of path; pair it with the path-specific and fleet views to judge whether this exact anomalous location is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this location-anomaly pattern, what parents and users normally drive it, and does the current alert fit that pattern?
  context: Even legitimate relocations recur — a vendor build that ships a renamed Windows utility will fire repeatedly under the same parent and user. The query mirrors the rule's full selection-and-filter logic scoped to this host, so the resulting parent and user distribution reflects how this specific anomaly pattern has historically run here. A new parent process, an unexpected user account, or a first-ever appearance of the pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \atbroker.exe
        - \audiodg.exe
        - \bcdedit.exe
        - \bitsadmin.exe
        - \certreq.exe
        - \certutil.exe
        - \cmstp.exe
        - \conhost.exe
        - \consent.exe
        - \cscript.exe
        - \csrss.exe
        - \dashost.exe
        - \defrag.exe
        - \dfrgui.exe
        - \dism.exe
        - \dllhost.exe
        - \dllhst3g.exe
        - \dwm.exe
        - \eventvwr.exe
        - \fsquirt.exe
        - \finger.exe
        - \logonui.exe
        - \LsaIso.exe
        - \lsass.exe
        - \lsm.exe
        - \msiexec.exe
        - \ntoskrnl.exe
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \runonce.exe
        - \RuntimeBroker.exe
        - \schtasks.exe
        - \services.exe
        - \sihost.exe
        - \smartscreen.exe
        - \smss.exe
        - \spoolsv.exe
        - \svchost.exe
        - \taskhost.exe
        - \taskhostw.exe
        - \Taskmgr.exe
        - \userinit.exe
        - \werfault.exe
        - \werfaultsecure.exe
        - \wininit.exe
        - \winlogon.exe
        - \winver.exe
        - \wlanext.exe
        - \wmic.exe
        - \wscript.exe
        - \wsl.exe
        - \wsmprovhost.exe
      filter_main_generic:
        Image|startswith:
        - C:\$WINDOWS.~BT\
        - C:\$WinREAgent\
        - C:\Windows\SoftwareDistribution\
        - C:\Windows\System32\
        - C:\Windows\SystemTemp\
        - C:\Windows\SysWOW64\
        - C:\Windows\uus\
        - C:\Windows\WinSxS\
      filter_optional_system32:
        Image|contains: \SystemRoot\System32\
      filter_main_powershell:
        Image|contains:
        - C:\Program Files\PowerShell\7\
        - C:\Program Files\PowerShell\7-preview\
        - C:\Program Files\WindowsApps\Microsoft.PowerShellPreview
        - \AppData\Local\Microsoft\WindowsApps\Microsoft.PowerShellPreview
        Image|endswith: \pwsh.exe
      filter_main_wsl_programfiles:
        Image|startswith:
        - C:\Program Files\WindowsApps\MicrosoftCorporationII.WindowsSubsystemForLinux
        - C:\Program Files\WSL\
        Image|endswith: \wsl.exe
      filter_main_wsl_appdata:
        Image|startswith: C:\Users\'
        Image|contains: \AppData\Local\Microsoft\WindowsApps\
        Image|endswith: \wsl.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this same location-anomaly pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's full selection-and-filter logic with no host scope, so the result is a fleet-wide count of this anomaly pattern rather than generic usage of the binaries. Many hosts firing the same pattern points to a scripted deployment or vendor application that ships a relocated system binary in a fixed path; one host or a small unrelated set points to targeted, manual operator activity. Use the host distribution to calibrate severity and to spot whether the anomalous install directory is consistent across hosts.
