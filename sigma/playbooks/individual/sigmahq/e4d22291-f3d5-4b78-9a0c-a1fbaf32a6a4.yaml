name: Potentially Suspicious ODBC Driver Registered
id: 1f0b695f-0508-4f8f-a873-9a1c0c1498a5
description: >-
  Detects the registration of a new ODBC driver whose driver DLL path points to a
  world-writable or staging directory. The alert fires on a registry value write
  under \SOFTWARE\ODBC\ODBCINST.INI\ ending in \Driver or \Setup whose value data
  references a suspicious location. Registering an ODBC driver installs an attacker
  DLL that is loaded into any process which subsequently opens an ODBC connection or
  DSN resolving to that driver, providing stealthy persistence and proxied code
  execution under the loading process. Investigation should identify the DLL on disk,
  determine which processes loaded it, confirm whether the registration was performed
  by an expected tool and account, and reconstruct surrounding host activity.
type: detection
detection_id: e4d22291-f3d5-4b78-9a0c-a1fbaf32a6a4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Do the registry key and value data match what this rule detects?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires when a
    registry value under \SOFTWARE\ODBC\ODBCINST.INI\ ending in \Driver or \Setup is
    written AND the value data (Details) points to a suspicious directory such as
    \Users\Public\, \Windows\Temp\, \ProgramData\, or an AppData path. Review the exact
    key path, the registered driver DLL path in the value data, and the writing process
    against those criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to register ODBC drivers?
  context: >-
    Legitimate ODBC driver installs are normally performed by application installers or
    administrators on database-facing hosts. A driver registration from an interactive
    user session, a general workstation, or an unexpected account is more suspicious.
    User attribution is present on most endpoint registry events; when it is a machine
    account or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the ODBCINST.INI driver key a known abuse location, and what driver DLL was registered?
  context: >-
    Keys under \SOFTWARE\ODBC\ODBCINST.INI\ define installed ODBC drivers; the \Driver
    value names the DLL loaded for that driver and \Setup names its configuration DLL.
    Registering a driver whose DLL sits in a user-writable or staging directory is the
    persistence and proxied-execution primitive this rule targets. Read the exact key
    path, the DLL path in the value data, and the writing process to judge whether this
    is a real driver install or an implant.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What driver DLL path was written to the ODBC registry value and what does it point to?
  context: >-
    The value data (Details) holds the on-disk path to the DLL that will be loaded when
    a process opens this ODBC driver. Resolve the path and confirm whether it lives in a
    suspicious directory (PerfLogs, ProgramData, Temp, Users\Public, spool, Tasks,
    AppData). This DLL path becomes the artifact for the rest of the investigation. A
    driver DLL in a world-writable directory is the strongest signal that the
    registration is an implant rather than a legitimate install.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What data sources or credentials could a driver loaded on this ODBC path intercept?
  context: >-
    A rogue ODBC driver DLL executes inside every process that opens a connection through
    it, so it can observe the connection strings, data source names, and any credentials
    those processes pass to database or application back ends. Identify which applications
    and service accounts on this host use ODBC connectivity to scope what could be
    captured. The triggering command line is shown for context while the analyst maps the
    ODBC consumers.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process registered the ODBC driver and is that parent chain expected?
  context: >-
    ODBC driver registration is typically driven by odbcconf.exe INSTALLDRIVER, reg.exe,
    or an application installer. Identify the process that wrote the registry value and
    what launched it. A registration driven from a script host, an Office application, a
    remote-execution tool, or an interactive shell is more suspicious than one from a
    known installer running under services.exe or explorer.exe.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Which processes loaded the registered ODBC driver DLL, and is that DLL signed?
  context: >-
    The credential-access effect of this registration manifests when a process loads the
    registered DLL, not through a handle opened to another process, so the classic
    LSASS full-access-mask check does not apply here. Look for image loads of the DLL at
    the registered path and note which processes loaded it and whether it carries a valid
    signature. An unsigned or newly written DLL loaded into applications that handle
    database connectivity confirms the driver is active. If no load appears in the window,
    the driver has not yet been exercised rather than being benign.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|contains|expand: '%Details%'
      condition: selection
    fields:
      - ImageLoaded
      - Image
      - Signed
      - Signature
- question: Did any process configure a DSN or invoke the ODBC tools that would force the registered driver to load?
  context: >-
    A registered ODBC driver only executes once a process opens a connection through it.
    An attacker forces this by adding a data source with odbcad32.exe or by running
    odbcconf.exe configsysdsn. Finding these invocations after the registration confirms
    the driver was actively loaded rather than left dormant, and links the registration to
    the execution that followed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_trigger:
        - Image|endswith:
            - '\odbcad32.exe'
            - '\odbcconf.exe'
        - CommandLine|contains:
            - 'configsysdsn'
            - 'CONFIGDSN'
      condition: selection and selection_trigger
    fields:
      - Image
      - CommandLine
- question: Is the driver DLL referenced by the registration present on disk under the registered path?
  context: >-
    The registration is only effective if the DLL exists at the path written to the ODBC
    value. Confirm whether a file was created at that path by the registering process or
    its children; the drop usually lands in the same session as the registry write. If the
    DLL is present, retrieve it for a signature and reputation review to determine what it
    would execute when loaded.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Does the ODBC driver registration persist, or was it re-modified after the alert?
  context: >-
    ODBC driver entries survive reboot and remain active until removed, so a malicious
    registration provides durable persistence. Endpoint telemetry does not record registry
    key or value deletions, so judge durability from the key's re-modification history over
    a longer window and from whether the configured DLL was loaded, rather than trying to
    observe a removal. Repeated writes to the same driver key can indicate an implant
    re-establishing itself.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Were other registry modifications made on this host in the same session?
  context: >-
    An operator who registers a rogue ODBC driver often makes additional changes in the
    same session, such as adding a data source, disabling a defense, or setting another
    persistence key. Reviewing all registry writes on the host in a short window around the
    alert, grouped by key path and writing process, reveals whether this registration was
    isolated or part of a broader configuration change.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Does the Windows Security audit log independently record the write to this ODBC driver key?
  context: >-
    When registry object-access auditing is enabled, a value write under
    \SOFTWARE\ODBC\ODBCINST.INI\ is recorded as event 4657 in the Security log,
    independently of endpoint sensor telemetry, capturing the account and process that
    performed it. Corroborating the modification across both sources confirms it occurred
    and is useful if endpoint registry telemetry is incomplete or was tampered with. If
    registry auditing is not enabled in this environment, treat zero results as a
    visibility gap rather than evidence the write did not happen.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4657
        ObjectName|contains: \SOFTWARE\ODBC\ODBCINST.INI\
      condition: selection
    fields:
      - ObjectName
      - ObjectValueName
      - ProcessName
      - SubjectUserName
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after this event?
  context: >-
    Credentials captured through a rogue ODBC driver are typically reused to move to
    other systems. The query returns outbound connections from this host to remote-access
    ports 3389 (RDP), 445 (SMB), 5985/5986 (WinRM), and 22 (SSH) in the hours after the
    event, with the originating process and user. Credentials replayed from another
    machine will not appear here; check authentication logs on suspected targets for this
    account. If endpoint network telemetry is not collected from this host, treat zero
    rows as a visibility gap rather than evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Which accounts and applications rely on ODBC connectivity on this host, and do any have elevated access?
  context: >-
    The impact of a rogue ODBC driver depends on what flows through the ODBC consumers on
    this host. Service accounts used for database connectivity, applications with broad
    data access, and administrative sessions are the highest-value targets. Cross-reference
    the writing account and the host's ODBC-using applications with directory group
    memberships to determine what may be exposed and whether escalation is warranted.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Has this ODBC driver key been modified before on this host?
  context: >-
    ODBC driver entries change rarely once installed, so a first-time write to this key is
    more suspicious than a routine change. A long-range history of modifications to this
    key on this host calibrates whether the registration is novel or matches prior
    legitimate installs, and whether the same driver DLL path has been set before.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this ODBC driver key modified on other hosts in the environment?
  context: >-
    The same driver registration across multiple hosts may indicate a software deployment
    or a widely distributed implant, while a single-host modification suggests targeted
    activity. Comparing the driver DLL paths set across hosts distinguishes a consistent
    legitimate install from divergent attacker-controlled paths.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    A driver registration rarely occurs in isolation. Aggregating process activity in a
    tight window around the alert surfaces what led to the registration and what followed,
    such as the download or drop of the driver DLL, reconnaissance, or additional
    persistence. Novel parent-child process pairs stand out at low counts against routine
    high-count telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host, such as defense tampering, reconnaissance, or
    credential access, may reveal the stages that preceded the driver registration and
    help reconstruct the timeline. A cluster of alerts leading up to this event points to
    a hands-on intrusion rather than an isolated administrative change.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
