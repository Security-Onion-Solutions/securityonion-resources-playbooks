name: Potential Pikabot Infection - Suspicious Command Combinations Via Cmd.EXE
id: 6b9deed6-1541-4992-ba5f-ee29823f8d79
description: |
  Fires on a single cmd.exe command line that combines all four of the following at once: the
  "cmd" and "/c" command-handler tokens, a concatenation operator (" & " or " || "), a transfer or
  delay command (" curl", " wget", " timeout ", " ping "), and a loader or staging command
  (" rundll32", " mkdir "). Chaining a download, a delay, a directory creation, and a DLL entry-point
  invocation into one one-liner is how a loader stages and runs a second-stage DLL without writing a
  script to disk; Pikabot deliveries use this structure. Installers, packaging jobs, and CI helpers
  also emit long chained one-liners, so the investigation should determine what each concatenated
  segment did, whether a file arrived and executed from the referenced path, and whether the parent
  chain and user match known automation on this host.
type: detection
detection_id: e5144106-8198-4f6e-bfc2-0a551cc8dd94
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the command line contain all four pattern groups at once — the cmd /c handler, a
    concatenation operator, a transfer or delay command, and rundll32 or mkdir?
  context: The rule only fires when every group is present in the same command line, so confirm all
    four are really there and not an artifact of a long quoted argument. Read the full string end to
    end before investing further time.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run chained cmd.exe one-liners that download files and
    invoke rundll32?
  context: Software installers, packaging pipelines, and IT deployment tooling legitimately emit
    chained command handlers on build agents and admin workstations. On a general-purpose endpoint
    with an interactive user, the same pattern has no routine explanation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What did each concatenated segment of the chained cmd.exe command actually do?
  context: Split the command at each " & " or " || " and read the segments in order — the transfer
    URL, the destination directory created by mkdir, the delay length, and the DLL path plus export
    name passed to rundll32. The query returns every chained cmd handler on this host in the alert
    window, because a staging operation is frequently split across several consecutive one-liners
    rather than carried in a single event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_scope:
        host.name|expand: '%hostname%'
      selection_cmd:
        CommandLine|contains|all:
        - cmd
        - /c
      selection_pipes:
        CommandLine|contains:
        - ' & '
        - ' || '
      condition: all of selection_*
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned this command handler, and is that parent chain expected?
  context: A command handler launched by explorer.exe or a management agent reflects user or
    administrative action. A parent such as a browser, an Office application, a script host, or an
    unsigned binary in a user-writable directory points at a delivery stage that ran before this
    command. Note what else the parent spawned.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Was the download successful? Check for file creation at the destination.
  context: A curl or wget segment in the command line does not mean the transfer completed — the URL
    may have been blocked, unreachable, or filtered. File writes by the command handler or its direct
    children establish whether the payload reached the directory the mkdir segment created.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: What other files did this process or its spawned children write to disk around the alert?
  context: A staged delivery rarely writes one file — the same chain often drops an archive, an
    extracted DLL, and a marker or configuration file, commonly under a directory created earlier in
    the same command line. Writes under %TEMP%, %APPDATA%, C:\Users\Public, or ProgramData are the
    ones to read first. This covers the alerting process and its direct children, not grandchildren
    or unrelated writers.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: If the downloaded payload was executed, what is its hash — and is it known to threat
    intelligence?
  context: The hash needed for a reputation lookup or sandbox submission is recorded when the payload
    runs, not when it is written — file-creation events carry no hash in this telemetry. This returns
    the processes spawned by the command handler and by the shell that launched it, with their
    executable hashes; for a download-then-rundll32 chain that is the loader stage. If the payload ran
    later under an unrelated process it will not appear here — retrieve it from the on-disk path and
    hash it manually.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      selection_siblings:
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: 1 of selection_*
    fields:
      - Image
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: Did the transfer and loader binaries on this host make outbound connections, and where to?
  context: The curl or wget segment names a URL, but only connection telemetry confirms an egress
    attempt and records the address and port actually reached. Connections to a raw IP address, to a
    non-standard port, or to freshly registered infrastructure separate a real retrieval from a
    command that failed at name resolution. Traffic from rundll32.exe after the transfer indicates the
    loaded module is calling out on its own.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
        - \curl.exe
        - \wget.exe
        - \cmd.exe
        - \rundll32.exe
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - Initiated
  answer_sources:
  - network_connection
- question: What modules did rundll32.exe load on this host after the alert, and are they signed?
  context: rundll32.exe is a Microsoft-signed binary, so its own signature says nothing about what it
    executed — the module it loads carries the payload. An unsigned DLL, or one whose signature does
    not validate, loaded from a user-writable directory is the proxy-execution stage the command line
    set up. Module loads carry a hash, so the hash can be looked up directly from this result.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \rundll32.exe
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - process_creation
  - manual_review
- question: What child processes did the alerting command handler spawn, and with what arguments?
  context: The chained segments each run as a child of the command handler, so the children list is
    the executed form of the one-liner. Look for the transfer utility, rundll32.exe with its DLL and
    export arguments, and any interpreter or scheduled-task binary that the chain launched afterward.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: Delivery chains sit inside a wider sequence — the process that dropped the command handler
    before it, and reconnaissance, persistence, or a second stage after it. Repetitive high-count
    parent-child pairs are routine telemetry; novel low-count pairs near the alert time are what to
    read. The time of day the chain ran also matters — execution outside working hours weakens the
    interactive-administration explanation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: When this host has previously produced this command combination, what parents and users
    drove it, and does the current alert fit that history?
  context: The query mirrors the rule's selection structure scoped to this host, so the resulting
    parent and user distribution reflects how this specific command combination has run here rather
    than generic cmd.exe usage. A recurring parent with a stable user is packaging or deployment
    automation; a parent and user that appear only at the alert are the deviation to chase.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_cmd:
        CommandLine|contains|all:
        - cmd
        - /c
      selection_pipes:
        CommandLine|contains:
        - ' & '
        - ' || '
      selection_commands_1:
        CommandLine|contains:
        - ' curl'
        - ' wget'
        - ' timeout '
        - ' ping '
      selection_commands_2:
        CommandLine|contains:
        - ' rundll32'
        - ' mkdir '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Has this user previously produced this command combination, and does that history fit
    their role?
  context: The query mirrors the rule's selection structure scoped to this user, so the result is the
    user's 90-day history of this specific combination aggregated by host, not their generic cmd.exe
    usage. A developer or packager with a long history of chained one-liners reads differently from an
    account that has never produced one. Weigh the count against the user's role and toolset.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_cmd:
        CommandLine|contains|all:
        - cmd
        - /c
      selection_pipes:
        CommandLine|contains:
        - ' & '
        - ' || '
      selection_commands_1:
        CommandLine|contains:
        - ' curl'
        - ' wget'
        - ' timeout '
        - ' ping '
      selection_commands_2:
        CommandLine|contains:
        - ' rundll32'
        - ' mkdir '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Has this parent process historically driven this command combination here or across the
    environment, or is the parent new for this activity?
  context: >-
    When the alert fires under a service or machine account, user identity does not attribute the
    behavior; the launch mechanism does. The query mirrors the rule's selection structure scoped to
    the alerting parent process, giving the 90-day history of that parent driving this specific
    combination. A parent already accounting for thousands of prior events is vendor or OS
    automation; a new or rare parent is the deviation worth chasing.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_cmd:
        CommandLine|contains|all:
        - cmd
        - /c
      selection_pipes:
        CommandLine|contains:
        - ' & '
        - ' || '
      selection_commands_1:
        CommandLine|contains:
        - ' curl'
        - ' wget'
        - ' timeout '
        - ' ping '
      selection_commands_2:
        CommandLine|contains:
        - ' rundll32'
        - ' mkdir '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the same account drove
    execution on more than one endpoint in the alert window. Activity on several hosts widens the
    scope beyond a single infection. If the alert fired under a service or machine account, expect
    routine agent telemetry to dominate this result and read the parent-anchored view instead.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did this same parent-driven command combination fire on other hosts in the same window, or
    is the activity isolated to this host?
  context: >-
    Under a service principal the user pivot returns agent noise, so the meaningful question is
    whether the same launch mechanism fired elsewhere. The query mirrors the rule's selection
    structure scoped to the alerting parent process, fleet-wide, in the alert window. Several hosts in
    the same window points to scheduled or pushed automation; a single host points to a host-local
    trigger.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_cmd:
        CommandLine|contains|all:
        - cmd
        - /c
      selection_pipes:
        CommandLine|contains:
        - ' & '
        - ' || '
      selection_commands_1:
        CommandLine|contains:
        - ' curl'
        - ' wget'
        - ' timeout '
        - ' ping '
      selection_commands_2:
        CommandLine|contains:
        - ' rundll32'
        - ' mkdir '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Have other hosts produced this command combination in the past week, and does the
    cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of this specific combination rather than generic cmd.exe usage. Many hosts
    producing it points to a deployment script or vendor automation that should be tuned out; one host
    or a small unrelated set points to operator-driven activity on those endpoints.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_cmd:
        CommandLine|contains|all:
        - cmd
        - /c
      selection_pipes:
        CommandLine|contains:
        - ' & '
        - ' || '
      selection_commands_1:
        CommandLine|contains:
        - ' curl'
        - ' wget'
        - ' timeout '
        - ' ping '
      selection_commands_2:
        CommandLine|contains:
        - ' rundll32'
        - ' mkdir '
      condition: all of selection_*
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: A staging one-liner is usually not the first stage. Earlier detections covering document
    or archive execution, script hosts, or defense tampering identify how the command handler came to
    run and where the timeline starts.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
