name: UAC Bypass via Windows Firewall Snap-In Hijack
id: 6d10433d-589e-4476-9788-bd1a392a2398
description: |
  Detects a child process spawned by mmc.exe when mmc.exe was launched with the Windows Firewall snap-in (WF.msc),
  excluding WerFault.exe error-reporting children. mmc.exe loading certain auto-elevated snap-ins runs at High
  integrity without a UAC prompt; an actor who preconditions the system to load attacker-controlled code into mmc's
  process space when it opens WF.msc obtains a Medium-to-High integrity elevation. Legitimate use of this exact
  parent-child pattern is rare, so the investigation should determine what the mmc child process did with the elevated
  token, whether registry or system state was modified to set up the bypass, and whether other escalation activity
  surrounds the event.
type: detection
detection_id: e52cb31c-10ed-4aea-bcb7-593c9f4a315b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Was this process spawned by mmc.exe launched with the WF.msc Windows Firewall snap-in, and is the child something other than WerFault.exe?
  context: Confirm the alert is a true positive by reviewing the parent process and parent command line of the triggering event. The rule fires when the parent is mmc.exe AND its command line contains WF.msc AND the child is not WerFault.exe. A WerFault.exe child would have been excluded, so any child seen here is in scope.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Is this user and host expected to be managing the Windows Firewall through the MMC snap-in?
  context: Administrators do open the Windows Firewall snap-in through mmc.exe, but it spawning a child process at elevated integrity is unusual. Knowing whether this user routinely performs local firewall administration on this host helps separate legitimate management from an elevation attempt.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the mmc.exe parent process and what was it doing when it spawned this child?
  context: The mmc.exe parent event shows how the management console was launched and what loaded the WF.msc snap-in. Retrieving the parent's own creation event reveals what spawned mmc.exe and the full parent command line, which establishes whether the snap-in load was an interactive admin action or driven by another process.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: What did the mmc child process do at elevated integrity, and is the child binary signed and located where expected?
  context: The bypass succeeds when attacker-controlled code runs inside mmc's elevated process space. Decode the child command line and check the binary's path and signature; an unsigned binary, or one running from a user-writable directory such as a profile or temp path, points to hijacked execution rather than a normal snap-in component.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
      - IntegrityLevel
- question: Was an elevated or special-privilege logon assigned around the time of this event?
  context: A successful UAC bypass yields a High integrity token without a normal consent prompt. Special-privilege assignment events on this host near the alert time corroborate that an elevated session was established; correlating the account and time with the process activity confirms the elevation took effect.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4672
          - 4624
      condition: selection
    fields:
      - EventID
      - SubjectUserName
      - TargetUserName
      - LogonType
- question: Were registry modifications made through reg.exe, powershell, or cmd to set up this UAC bypass?
  context: Many UAC bypass techniques write a command to a registry key that an auto-elevated process reads and executes. Common targets include ms-settings, mscfile, exefile and Folder shell-open-command keys, the Environment key, and DelegateExecute. Finding such a write shortly before the mmc child spawn confirms the bypass mechanism and reveals the payload that ran elevated.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\reg.exe'
          - '\powershell.exe'
          - '\cmd.exe'
        CommandLine|contains:
          - 'ms-settings'
          - 'mscfile'
          - 'Classes\exefile'
          - 'Classes\Folder'
          - 'Environment'
          - 'Shell\Open\command'
          - 'DelegateExecute'
      condition: selection
    fields:
      - CommandLine
      - Image
- question: Were registry values written to the COM/snap-in keys that mmc.exe reads when loading WF.msc?
  context: The byeintegrity-style bypass preconditions the system by registering attacker-controlled code under the COM or snap-in registration keys that mmc consults when it loads the firewall snap-in. A registry_set event touching CLSID, InprocServer32, or snap-in registration paths shortly before the spawn is the setup step that process-creation visibility alone can miss.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - 'CLSID'
          - 'InprocServer32'
          - 'SnapIns'
          - 'NodeTypes'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What action was performed with elevated privileges after the UAC bypass?
  context: UAC bypass is a means to an end. After elevating, actors install persistence, dump credentials, tamper with security tools, or access protected resources. Examining processes running at High or System integrity on this host shortly after the spawn reveals the objective behind the elevation.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: What other child processes did mmc.exe spawn on this host?
  context: An actor who has hijacked mmc's elevated process space may use it to launch several tools in sequence. Seeing every child of mmc.exe on this host reveals the full scope of activity initiated through the compromised console, beyond the single child that triggered the alert.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has mmc.exe spawned this child binary on this host before?
  context: Some parent-child relationships are routine, but mmc.exe spawning an arbitrary child process is not part of normal snap-in operation. Historical frequency of this specific mmc.exe-to-child pairing on the host distinguishes a novel spawning relationship from an established one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \mmc.exe
        ParentCommandLine|contains: WF.msc
      filter:
        Image|endswith: \WerFault.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \mmc.exe
        ParentCommandLine|contains: WF.msc
      filter:
        Image|endswith: \WerFault.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spread across multiple endpoints. If the same user triggered similar activity on more than one host, the scope of compromise may be larger than the single alert suggests.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \mmc.exe
        ParentCommandLine|contains: WF.msc
      filter:
        Image|endswith: \WerFault.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: Were other privilege escalation techniques attempted on this host?
  context: Actors who attempt one UAC bypass often try several methods until one succeeds, especially when the OS version or configuration blocks certain techniques. Finding multiple bypass or escalation detections from the same user or process confirms deliberate privilege escalation rather than a false positive.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the stages that preceded the elevation and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
