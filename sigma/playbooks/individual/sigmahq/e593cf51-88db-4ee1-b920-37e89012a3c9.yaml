        - FileProtocolHandler
      - CommandLine|contains|all:
        - zipfldr.dll
        - RouteTheCall
      - CommandLine|contains|all:
        - shell32.dll
        - Control_RunDLL
      - CommandLine|contains|all:
        - shell32.dll
        - ShellExec_RunDLL
      - CommandLine|contains|all:
        - mshtml.dll
        - PrintHTML
      - CommandLine|contains|all:
        - advpack.dll
        - LaunchINFSection
      - CommandLine|contains|all:
