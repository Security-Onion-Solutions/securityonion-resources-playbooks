        - OpenURL
      - CommandLine|contains|all:
        - shdocvw.dll
        - OpenURL
      - CommandLine|contains|all:
        - syssetup.dll
        - SetupInfObjectInstallAction
      - CommandLine|contains|all:
        - setupapi.dll
        - InstallHinfSection
      - CommandLine|contains|all:
        - pcwutl.dll
        - LaunchApplication
      - CommandLine|contains|all:
        - dfshim.dll
        - ShOpenVerbApplication
      - CommandLine|contains|all:
        - dfshim.dll
        - ShOpenVerbShortcut
      - CommandLine|contains|all:
        - scrobj.dll
        - GenerateTypeLib
        - http
      - CommandLine|contains|all:
        - shimgvw.dll
        - ImageView_Fullscreen
        - http
      - CommandLine|contains|all:
        - comsvcs.dll
        - MiniDump
      filter_main_screensaver:
        CommandLine|contains: shell32.dll,Control_RunDLL desk.cpl,screensaver,@screensaver
      filter_main_parent_cpl:
        ParentImage: C:\Windows\System32\control.exe
        ParentCommandLine|contains: .cpl
        CommandLine|contains|all:
        - Shell32.dll
        - Control_RunDLL
        - .cpl
      filter_main_startmenu:
        ParentImage: C:\Windows\System32\control.exe
        CommandLine|startswith: '"C:\Windows\system32\rundll32.exe" Shell32.dll,Control_RunDLL "C:\Windows\System32\'
        CommandLine|endswith: .cpl",
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
