name: Active Directory Structure Export Via Csvde.EXE
id: a7f497e8-0682-4588-a824-1a4ea615c464
description: |
  Detects execution of csvde.exe with an output flag (-f) and without an import flag (-i), which exports
  Active Directory objects and attributes to a CSV file. csvde.exe is a legitimate domain administration
  utility, so the activity is routine when run by directory administrators or scheduled reporting jobs; it
  is also a common post-compromise discovery step because it dumps the full directory structure to a single
  file without requiring domain-admin rights in many environments. Determine who ran the export, what the
  LDAP filter and target attributes were, where the output file went, and whether the export was accompanied
  by other reconnaissance or staging activity on the host.
type: detection
detection_id: e5d36acd-acb4-4c6f-a13f-9eb203d50099
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line match what this rule detects -- csvde.exe with an output flag and no import flag?
  context: >-
    Confirm the alert is a true positive before investing investigation time. The rule fires when csvde.exe
    (by image name or original filename) runs with a "-f" output flag and without a "-i" import flag, meaning
    the invocation exports directory data rather than loading it. Review the exact command line and process
    details against that criteria.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user expected to export the Active Directory structure?
  context: >-
    Directory administrators and IT staff legitimately export AD objects for reporting, audits, or migration
    planning. Standard users and service accounts rarely need to run csvde.exe at all. The user's role and
    typical behavior baseline determine whether this export is routine or anomalous.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: What exactly did this csvde.exe export do? Decode the LDAP filter, attribute list, and output file from the command line.
  context: >-
    The full command line reveals the scope of the export. Decode the "-r" LDAP filter (which object classes
    were targeted -- users, computers, the whole directory), the "-l" attribute list (which fields were
    pulled, e.g. samAccountName, mail, lastLogon, description), the "-f" output filename, and any "-s" server
    or "-d" base-DN scoping. A narrow query for a specific OU reads differently than a full-directory dump.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned csvde.exe, and is this a normal pattern?
  context: >-
    Legitimate exports are typically launched from an interactive cmd.exe or PowerShell session spawned by
    explorer.exe, or from a known scheduled-reporting script. Discovery commands spawned by unusual parents --
    Office applications, script interpreters like wscript.exe or mshta.exe, wmiprvse.exe (WMI remote
    execution), wsmprovhost.exe (WinRM), or a remote-execution utility -- point to automated post-exploitation
    enumeration rather than admin work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Is the alerting binary the genuine Microsoft csvde.exe, or a renamed copy matched by its original filename?
  context: >-
    The rule matches both the image name "\csvde.exe" and the embedded OriginalFileName "csvde.exe", so a
    renamed binary still fires. Compare the on-disk path against the expected system location, and check the
    signature and original filename: a file named something else but carrying the csvde.exe original filename,
    or an unsigned copy outside the system directory, indicates the utility was relocated or repackaged to
    evade name-based controls.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: What directory data did the export target, and what output file was written?
  context: >-
    The command-line arguments reveal what was collected -- a specific OU and a short attribute list (a
    scoped admin report) versus the full directory with broad attributes (bulk enumeration). The "-f" output
    file is the artifact that holds the exported data; its name and path determine the severity of potential
    data loss and where to look for the dropped CSV.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: Where was the exported CSV moved or sent after creation?
  context: >-
    Directory exports are often staged locally and then moved to a staging location or sent over the network.
    Checking file events for the output file being copied, renamed, or compressed, and network connections
    from the same host, reveals whether the CSV left the endpoint -- uploaded to cloud storage, copied to
    removable media, or sent to an external server.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did other reconnaissance commands run on this host around the same time?
  context: >-
    A single export may be legitimate troubleshooting, but multiple reconnaissance commands in rapid
    succession -- whoami, net, nltest, ldifde, dsquery, nslookup -- is a signature pattern of post-compromise
    enumeration. Attackers run these to map the environment before moving to the next stage. Three or more
    different recon binaries within fifteen minutes typically indicates automated reconnaissance.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: What child processes did csvde.exe spawn afterward?
  context: >-
    A directory export tool has no legitimate reason to spawn child processes. Children such as cmd.exe,
    powershell.exe, or a compression or transfer utility appearing under csvde.exe would indicate the export
    was part of a larger scripted operation that staged or moved the collected data.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run csvde.exe?
  context: >-
    A binary that has never been seen on a host is more suspicious than one that runs regularly. csvde.exe
    on a workstation or a non-administrative server is unexpected; on a directory-management host it may be
    routine. Zero or very low historical counts indicate first-time or rare execution.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this export pattern, what parents and users normally drive it, and does the current alert fit?
  context: >-
    Even routine tools get abused. The query mirrors the rule's selection scoped to this host, so the parent
    and user distribution reflects how this specific export pattern -- not generic csvde.exe usage -- has run
    here before. A new parent process, an unexpected user account, or an unusual command-line structure is the
    deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \csvde.exe
      - OriginalFileName: csvde.exe
      selection_remote:
        CommandLine|contains: ' -f'
      filter_import:
        CommandLine|contains: ' -i'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \csvde.exe
      - OriginalFileName: csvde.exe
      selection_remote:
        CommandLine|contains: ' -f'
      filter_import:
        CommandLine|contains: ' -i'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \csvde.exe
      - OriginalFileName: csvde.exe
      selection_remote:
        CommandLine|contains: ' -f'
      filter_import:
        CommandLine|contains: ' -i'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple
    endpoints. If the same user triggered similar enumeration on several hosts, the scope of the operation
    may be larger than a single export.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \csvde.exe
      - OriginalFileName: csvde.exe
      selection_remote:
        CommandLine|contains: ' -f'
      filter_import:
        CommandLine|contains: ' -i'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining surrounding activity reveals what led to the export and what
    happened after, and whether it is part of a larger sequence. Look for credential access, privilege
    escalation, lateral-movement tooling, or data-staging utilities around the export.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts fired this export pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this
    export pattern rather than generic csvde.exe usage. Many hosts firing the same pattern points to scripted
    deployment or scheduled reporting; one host or a small unrelated set points to manual operator activity.
    Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \csvde.exe
      - OriginalFileName: csvde.exe
      selection_remote:
        CommandLine|contains: ' -f'
      filter_import:
        CommandLine|contains: ' -i'
      condition: all of selection_* and not 1 of filter_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host -- defense tampering,
    reconnaissance, credential access -- may reveal the attack stages that preceded the export and help
    reconstruct the full timeline. Reconnaissance followed by exploitation, or credential access followed by
    enumeration, tells the attack story.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
