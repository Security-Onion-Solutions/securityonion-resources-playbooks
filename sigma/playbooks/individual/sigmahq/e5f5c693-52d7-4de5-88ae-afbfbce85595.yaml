name: Unsigned .node File Loaded
id: 3d207bfd-9fe5-4c8a-a9bc-8f6b671395fb
description: |
  Detects an Electron or Node.js process loading a native addon (.node module) that is either unsigned or carries an
  unavailable signature status, excluding a known Visual Studio Code Jupyter extension pattern. Native .node addons are
  compiled C++ modules that legitimate Electron applications such as Slack, Discord, and Visual Studio Code load from
  their own packaged directories; a genuine addon is normally signed as part of the application build. An unsigned or
  unknown-signer .node loaded into a trusted application is a module side-loading pattern: an attacker places a native
  module beside the application (for example a substituted keymapping.node next to Slack) so trusted code loads and runs
  attacker-supplied native code. Determine whether the load is a benign unsigned extension, and if not, trace how the
  module reached the host, whether the loading process is genuine, and whether the process made follow-on outbound
  connections consistent with a loader staging a beacon.
type: detection
detection_id: e5f5c693-52d7-4de5-88ae-afbfbce85595
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the loaded module match what this rule detects — path, signature, and loading process?
  context: >-
    Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded), its code-signature status
    (Signed and SignatureStatus), and the process that loaded it. The rule fires when a module whose path ends in .node
    is loaded AND its signature is either Signed false or SignatureStatus Unavailable, unless it matches the excluded
    Visual Studio Code Jupyter pattern (Code.exe loading electron.napi.node or node.napi.glibc.node under
    ms-toolsai.jupyter-). Both conditions must hold. A .node load event carries the module hash and signing status
    directly, so this triage does not require an execution pivot.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - SignatureStatus
- question: Is this user and host expected to run this Electron application and load native addon modules?
  context: >-
    Legitimate developer and desktop-application activity loads native .node addons routinely. Knowing whether this host
    runs the application in question (a developer workstation with Visual Studio Code extensions behaves very differently
    from a locked-down server) and whether the signed-in user normally uses it is often the fastest way to separate a
    benign unsigned extension from a side-loaded module.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What modules did this process load, and are any from user-writable directories, unsigned, or from non-canonical paths?
  context: >-
    A genuine Electron application loads its native addons from its own packaged install tree (node_modules or a build
    directory beside the application binary). Modules loaded from %TEMP%, %APPDATA%, ProgramData, Public, or a UNC share
    (\\host\share\) are a side-loading signal, as are unsigned modules sitting where signed ones are expected. Review the
    full set of modules the process loaded around the alert to see whether the flagged .node stands alone or arrived
    alongside other unexpected modules.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: What is the signing status, hash, and reputation of the loaded .node module?
  context: >-
    Module reputation separates a routine third-party addon from a side-loaded malicious one. A SignatureStatus of
    Unavailable or a Signed value of false is what the rule keys on, but the specific status matters: Unsigned, Expired,
    Distrusted, and Invalid each carry different weight. Submit the module hash for threat-intelligence lookup. A module
    that borrows the filename of a known application addon (for example keymapping.node, a real Slack addon) but is
    unsigned or hashes to an unknown sample is a strong side-loading indicator.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What process spawned the loading application, and is that parent chain expected for this application?
  context: >-
    The parent of the loading process shows how the application was launched. A genuine desktop application is normally
    started by explorer.exe, a session-manager or update service, or a login shell. A native-module-loading process
    launched by an unusual parent such as a script host, an Office application, or a remote-execution tool points to the
    process itself being run under attacker control rather than by the user.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What is the actual identity of the loading process binary based on its metadata and hash?
  context: >-
    The .node side-loading pattern relies on trusted application code running the module, so the loading process should
    itself be genuine. Compare the Image path against the embedded OriginalFileName and check the signing details and
    hash of the loading binary. A process that presents as a known Electron application but whose metadata or hash does
    not match the real product indicates the trusted-application cover is itself fake, which changes the investigation
    from a suspicious module to a fully attacker-controlled process.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: Is the loaded .node module still on disk for analysis?
  context: >-
    If the flagged module is still present it can be hashed, submitted to a sandbox, or reviewed directly. This query
    correlates file writes to the loading process and its direct children so the analyst can locate the module and any
    companion files the process wrote around the load. If the module has already been removed, that itself is a cleanup
    signal worth noting.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Which process wrote .node modules to this host, and does the write source look like a legitimate installer?
  context: >-
    Genuine native addons are produced by an application build or installer and land inside the application's own tree.
    This query lists every .node file written on the host and the process that wrote it, which reveals the delivery
    mechanism for the flagged module: a browser or command-line download tool, an archive extractor, a remote-admin
    copy, or a legitimate package installer. A .node written into a user-writable location by something other than the
    application's own installer is consistent with a dropped side-loading payload.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: .node
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did the loading process make outbound network connections shortly after the module load?
  context: >-
    A native-module loader commonly stages code into memory and then reaches out to command-and-control, often within a
    short window (roughly 0 to 20 minutes) after the load and frequently over HTTPS to blend with normal web traffic.
    Outbound connections initiated by the loading process immediately after an unsigned .node load are a strong follow-on
    signal. If the process shows no network activity but spawned children, check those children for the egress instead.
  range: +/-20m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: Has this specific .node module been loaded on this host before, and under which processes?
  context: >-
    A first-time module load is a stronger anomaly than a recurring one. If this module has been loaded by the same
    application repeatedly over the past 90 days it is probably a routine addon; if this is its first appearance, or it
    has historically been loaded only by different processes, the current load is anomalous. Rare or never-before-seen
    signers on native modules deserve the same scrutiny.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Is this .node module being loaded on other hosts, and by which processes?
  context: >-
    Cross-host correlation shows distribution scope. The same module loaded on a single host may be a localized event;
    the same module name appearing across many hosts points to broader deployment. Watch the variety of loading
    processes: a module loaded only by its expected application is routine, while the same module loaded by unexpected
    processes elsewhere suggests the side-loading is spreading.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Reviewing the surrounding process activity reveals what led to the module load and
    what followed it, including reconnaissance, privilege escalation, or additional persistence. Novel parent-child
    process pairs at low counts are what to scan for against the routine background of high-count agent telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the
    stages that preceded the module load and help reconstruct the timeline. A loader dropping an unsigned native module
    is often a mid-chain step rather than the beginning of the activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    Module side-loading into a trusted application is itself a persistence and re-execution foothold, and attackers
    rarely rely on one mechanism. Scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions installed
    in the same timeframe indicate deliberate stacking rather than an isolated action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations such as the Startup folder or scheduled-task definition paths on this host?
  context: >-
    File-based persistence bypasses process-based detection entirely. An executable or script dropped into a Startup
    folder or a path referenced by a registry Run key achieves persistence without running a persistence tool. File
    monitoring captures these drops even when standard persistence utilities are avoided, which is relevant when the
    delivered payload is a native module rather than a scheduled command.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Was there a change ticket, extension deployment, or documented approval for this native module?
  context: >-
    Some unsigned native modules are legitimate — Visual Studio Code extensions and similar developer tools ship them,
    and the rule already excludes one known VS Code Jupyter case. A corresponding change record, approved extension
    deployment, or documented developer install strongly suggests authorized activity; the absence of one, when policy
    would require it, moves the load toward unauthorized side-loading.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
