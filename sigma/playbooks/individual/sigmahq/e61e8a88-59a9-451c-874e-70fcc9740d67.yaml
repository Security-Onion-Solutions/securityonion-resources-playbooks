name: New DNS ServerLevelPluginDll Installed
id: 0a9cc2a6-59a1-4351-9941-c17f5469a9cc
description: |
  Detects a write to the DNS server ServerLevelPluginDll registry value under
  services\DNS\Parameters. This value makes the DNS Server service (dns.exe,
  running as SYSTEM) load an arbitrary DLL the next time the service restarts,
  which on a domain controller yields SYSTEM-level code execution and domain
  persistence. Legitimate writes are rare and administrator-driven during DNS
  plugin deployments; a non-empty value pointing at a UNC share or a
  non-System32 path, especially set by a delegated (DnsAdmins) account, is the
  malicious pattern. Investigation should confirm the value data, determine
  whether the referenced DLL was staged and loaded by dns.exe, and reconstruct
  who made the change and what else happened in the session.
type: detection
detection_id: e61e8a88-59a9-451c-874e-70fcc9740d67
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alert write the DNS ServerLevelPluginDll value, and what path is in the value data?
  context: Confirm the true positive by reviewing the exact registry path (TargetObject ending in services\DNS\Parameters\ServerLevelPluginDll) and the value data written to it. The value data is the path of the DLL that dns.exe will load on the next service restart.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this host a DNS server or domain controller where an administrator would legitimately configure a server-level plugin?
  context: The ServerLevelPluginDll value should change only on DNS servers (domain controllers are DNS servers by default) and only during a rare, planned plugin deployment. Knowing whether the host role and the writing identity match a legitimate deployment is the fastest way to separate an authorized change from an escalation attempt by a delegated DnsAdmins-style account.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What DLL path was written to the ServerLevelPluginDll value?
  context: The value data (Details) holds the DLL path dns.exe will load. A UNC path or any location outside C:\Windows\System32 is attacker-supplied and will execute as SYSTEM on restart. The value is normally empty or unset, so any non-empty path is meaningful. A valid plugin must export DnsPluginInitialize, DnsPluginQuery, and DnsPluginCleanup, so a path to an ordinary tool or script is itself an anomaly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Is ServerLevelPluginDll a known code-execution location, and what does the configured value data do?
  context: This value is a documented persistence and privilege-escalation vector, not a routine setting. Writing a DLL path here makes dns.exe load and run that DLL as SYSTEM after a service restart. The expected baseline is an empty or unset value, so any configured path, particularly a UNC or non-System32 path, points at an intent to run arbitrary code in the DNS service.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Does the ServerLevelPluginDll value remain set, and has it been changed again since the alert?
  context: Endpoint telemetry does not emit registry key or value deletion events, so attacker cleanup of this value cannot be observed directly. Judge whether the persistence is still in place from the value's re-modification history over a longer window and from whether dns.exe actually loaded the referenced DLL, rather than looking for a removal event that will never appear.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Is the plugin DLL referenced by the value present on disk, and was it staged locally in the same session?
  context: The DLL only executes if dns.exe can reach it. When it is staged locally by the writing process or its children, the file-write appears here; a payload hosted on a UNC share will not produce a local file event, so treat an absent local write as remote staging rather than proof no payload exists. The file-write event carries no hash, so hash the DLL from a later load or execution if reputation is needed.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did dns.exe load the configured plugin DLL after a service restart, and was that DLL unsigned or from an unusual path?
  context: The DLL is not loaded when the value is written; it maps into dns.exe only on the next DNS service restart. A successful load shows dns.exe loading a DLL with Signed false or an unavailable signature status from a UNC or non-System32 location. When a server-level plugin is active, dns.exe additionally loads icmp.dll and oleaut32.dll on top of its default modules, so those two appearing alongside a foreign DLL is a plugin-enabled fingerprint.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\dns.exe'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - SignatureStatus
- question: Was the DNS Server service restarted after the registry change, the event that triggers the plugin DLL load?
  context: Writing the value alone does nothing; dns.exe loads the DLL only when the DNS service restarts. Look for the dns.exe process starting again, or for sc.exe or dnscmd.exe control commands, shortly after the write. A restart outside a maintenance window immediately following the value change indicates the actor triggering their own payload.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_restart:
        Image|endswith:
          - '\dns.exe'
          - '\sc.exe'
          - '\dnscmd.exe'
      condition: selection_host and selection_restart
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: What other registry modifications were made on this host around the same time?
  context: An actor who configures DNS plugin persistence often makes other changes in the same session, such as disabling security tooling or altering service configurations. Clusters of registry writes from the same window and writing process reveal the full scope of the change and whether multiple objectives were pursued.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has the ServerLevelPluginDll value ever been set on this host before?
  context: Legitimate server-level plugin deployments are rare, so this value should have little or no modification history. Zero prior changes indicate a first-time modification, which is more suspicious than a value that is updated as part of a recurring, documented process.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was the ServerLevelPluginDll value modified on other DNS servers or domain controllers?
  context: The same write appearing across several DNS servers may indicate a group policy push or an operation targeting the domain's DNS infrastructure. A change isolated to a single host suggests targeted persistence. Compare the value data across hosts to see whether the same DLL path is being set everywhere or differs per host.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What process wrote this value, and is its lineage expected?
  context: This value normally changes only through dns.exe handling a management RPC request. A writing process other than dns.exe, such as reg.exe, powershell.exe, or an unknown binary, is a stronger anomaly. The account that actually drove the change over RPC is not visible in this process lineage; pivot to the DNS server audit records for the user identity that set the value.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What processes ran on this host around the time of the registry change?
  context: DNS management tooling such as dnscmd.exe or sc.exe, or reconnaissance and credential-access activity near the alert, places the registry write in the context of the operator's broader session. Aggregating by process and parent collapses routine service noise while unusual pairings stand out.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host before this alert?
  context: Persistence installations rarely happen in isolation. Earlier defense-tampering, reconnaissance, or credential-access alerts on the same host can reveal the stages that led up to the DNS plugin change and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was there a change ticket or approved maintenance window for a DNS server-level plugin deployment?
  context: DNS plugin deployments are infrequent and should follow a documented change process. A matching ticket or maintenance window for this host suggests authorized work and can quickly close the alert; the absence of one when policy requires it escalates the change to likely unauthorized persistence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were other persistence mechanisms installed on this host around the same time?
  context: Attackers rarely rely on a single foothold. Scheduled tasks, services, or registry Run-key writes appearing alongside the DNS plugin change indicate a hands-on session stacking backup persistence rather than an isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
