name: File Encoded To Base64 Via Certutil.EXE
id: c79db806-3c59-4849-bb1d-22d70e647ae0
description: |
  Detects certutil.exe invoked with the -encode flag, which base64-encodes an arbitrary file on disk. The rule fires when the
  image is certutil.exe (or its original filename is CertUtil.exe) AND the command line contains -encode. certutil is a
  Microsoft-signed System32 binary present on every Windows host, so legitimate certificate and file-handling tasks can trigger
  this; the same primitive is also used to convert collected data into an upload-friendly encoding before exfiltration, often
  pairing a recon-output file with a later HTTP upload. Investigation should confirm the encoded source and output files,
  determine what was encoded, identify the parent and user that drove the activity, and look for the staging-to-exfil follow-on.
type: detection
detection_id: e62a9f0c-ca1e-46b2-85d5-a6da77f86d1a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line match what this rule detects -- certutil.exe (or OriginalFileName CertUtil.exe) with the -encode flag?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and
    process details. The rule requires both that the binary is certutil.exe (by image or original filename) and that the command
    line contains -encode; verify both conditions hold and note the source file being encoded and the output path.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run certutil with the -encode flag?
  context: certutil base64-encoding is rarely part of routine user workflows but can appear in admin scripting, backup, or
    certificate-handling automation. Knowing whether the user role and host function are consistent with this operation is
    often the fastest path to distinguishing a true positive from a routine task.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What are the encoded source file and output path, and what is the content being encoded?
  context: certutil -encode reads a source file and writes a base64 (or hex with -encodehex) representation to an output file.
    Identify the named source and output files from the full command line and inspect the source content -- staging for
    exfiltration typically encodes a recon-output or collected-data file before an upload step. The encoded output is the
    artifact that leaves the host, so determining what went into it establishes what data was at risk.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Are the encoded source or output files still on disk for analysis?
  context: If the encoded source or its base64 output file still exists on disk, deeper analysis becomes possible -- hash
    lookups, content review, or sandbox submission. File paths here are derived from the certutil command line, so scope the
    search to those named paths rather than all file activity on the host.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What did certutil encode, and what data was staged for exfiltration?
  context: certutil -encode base64-encodes a file — this is exfiltration staging, not a download, and the encoded
    output is data, not an executable (file-creation events carry no hash). The sensitive artifact is the SOURCE file
    that was encoded; retrieve it and the encoded output from the paths below and inspect their content to confirm what
    was collected. The base64 output is the wrapper meant to be moved out — track it for any subsequent exfiltration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - EventType
- question: What other file activity occurred in the same directory as the encoded files?
  context: Staging operations often collect, encode, and stage multiple files in a single directory. Examining directory-level
    file activity around the certutil invocation reveals whether the encoded output sits alongside other collected or recon
    files, decompression artifacts, or additional staged payloads -- which broadens the picture of what was being prepared.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process spawned certutil.exe and is that parent chain expected?
  context: The parent process reveals how certutil was invoked. Legitimate usage often has predictable parents (explorer.exe
    for user actions, services.exe for services). Unusual parents like cmd.exe driven from a script host, mshta.exe,
    wscript.exe, or an Office application can indicate that the encode step is part of a scripted collection-and-staging
    sequence rather than an interactive admin task.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What did certutil.exe spawn, and what process touched the encoded output shortly afterward?
  context: After encoding a file, a staging sequence commonly hands the output to an upload step within a short window -- for
    example a script host or PowerShell sending the base64 file to a remote endpoint, followed by deletion of the staged files.
    Children of certutil and processes acting right after the encode reveal whether the encode fed an exfiltration follow-on.
    Tune how far forward to look based on expected attack progression.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certutil.exe
      - OriginalFileName: CertUtil.exe
      selection_cli:
        CommandLine|contains|windash: -encode
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certutil.exe
      - OriginalFileName: CertUtil.exe
      selection_cli:
        CommandLine|contains|windash: -encode
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals collection or lateral movement spanning multiple endpoints.
    If the same user triggered similar staging activity on multiple hosts, the scope of the operation may be larger than the
    single alerting event.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certutil.exe
      - OriginalFileName: CertUtil.exe
      selection_cli:
        CommandLine|contains|windash: -encode
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the encode event reveals the immediate context: what
    led to it, what happened after, and whether it is part of a larger collection-and-staging sequence. Look for reconnaissance
    commands, credential access, or additional staging that surrounds the certutil invocation.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- reconnaissance, defense tampering, or
    credential access -- may reveal the attack stages that preceded the encode step and help reconstruct the full timeline
    leading up to staging.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was certutil.exe executed from an expected System32 or SysWOW64 path?
  context: certutil run from a non-standard path (outside System32 or SysWOW64) may indicate the binary was copied or renamed
    to evade path-based allowlists. A certutil.exe running from a user's temp or AppData directory is more suspicious than one
    in System32. The original filename in the alert helps confirm whether a renamed copy is in play.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired the certutil -encode pattern over the past 90 days, and what command-line structures are typical?
  context: A LOLBin pattern with no prior history on a host is more suspicious than one used daily under stable parents. The
    query mirrors the rule's selection structure scoped to this host, so the count reflects the rule's specific firing pattern
    (certutil with -encode), not generic certutil usage. The command-line projection lets the analyst compare typical
    invocation patterns -- which source and output files, which flags -- against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certutil.exe
      - OriginalFileName: CertUtil.exe
      selection_cli:
        CommandLine|contains|windash: -encode
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- question: Have other hosts fired the certutil -encode pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the
    certutil -encode pattern, not generic certutil usage. Many hosts firing the same pattern points to scripted deployment or
    vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certutil.exe
      - OriginalFileName: CertUtil.exe
      selection_cli:
        CommandLine|contains|windash: -encode
      condition: all of selection_*
    fields:
    - host.name
