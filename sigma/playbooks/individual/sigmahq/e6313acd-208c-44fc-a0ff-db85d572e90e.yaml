name: Network Reconnaissance Activity
id: 4e600455-ba3c-46ff-8b86-f3e11638bdff
description: |
  Detects nslookup being used to resolve the DNS SRV record _ldap._tcp.dc._msdcs.<domain>, a query that enumerates a domain's domain controllers. The rule fires when a single command line contains both 'nslookup' and the LDAP DC SRV string. Administrators and AD tooling occasionally run this lookup for diagnostics, but it is also a common early-discovery step after a host is compromised, used to locate directory and authentication infrastructure before account enumeration or lateral movement. Investigation should confirm the exact command, determine which process and user launched it, and check whether other reconnaissance or follow-on directory/authentication traffic occurred on the host.
type: detection
detection_id: e6313acd-208c-44fc-a0ff-db85d572e90e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line contain both nslookup and the LDAP domain-controller SRV string _ldap._tcp.dc._msdcs.?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line. The rule fires only when both 'nslookup' and the '_ldap._tcp.dc._msdcs.' SRV-lookup string are present in the same command, so verify both appear and note the domain name that follows the SRV string.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What exactly did this nslookup command do? Decode the full command line and identify the targeted domain and query options.
  context: The full command reveals the operation. nslookup against _ldap._tcp.dc._msdcs.<domain> returns the SRV records for that domain's domain controllers. Note the domain that follows the SRV string, and decode any options such as -querytype=ALL or -timeout that broaden or speed the lookup. The host scope returns every matching invocation in the window, so a sequence of related lookups appears together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
        - nslookup
        - _ldap._tcp.dc._msdcs.
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - ParentImage
- question: After the SRV-record lookup, did this host connect to directory or authentication services on the resolved domain controllers?
  context: Resolving _ldap._tcp.dc._msdcs.<domain> returns the addresses of domain controllers. A discovery lookup that is part of an operation is often followed by connections to those controllers on LDAP (389/636), Global Catalog (3268/3269), Kerberos (88), or SMB (445). Follow-on traffic to newly resolved controllers shifts the disposition from idle diagnostics toward active enumeration or lateral movement; no follow-on traffic is consistent with a one-off lookup.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
        - 389
        - 636
        - 3268
        - 3269
        - 88
        - 445
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
- question: What process spawned this nslookup command, and is that parent chain normal for this host?
  context: Discovery commands run from cmd.exe under explorer.exe (an interactive operator) or from a known automation script are routine. The same lookup spawned by an Office application, a script interpreter (wscript.exe, cscript.exe, mshta.exe), wmiprvse.exe (WMI remote execution), or wsmprovhost.exe (WinRM remote execution) indicates automated post-exploitation enumeration rather than an administrator at a console.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Is this user expected to run domain-controller discovery commands?
  context: Network administrators and IT staff legitimately run DNS and directory lookups for troubleshooting. Standard users and most service accounts rarely query _ldap._tcp.dc._msdcs. directly. The user's role and typical behavior determine whether this lookup is routine diagnostics or anomalous enumeration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single DC lookup may be legitimate troubleshooting, but multiple reconnaissance commands in rapid succession -- whoami, net user, nltest, systeminfo, arp, netstat -- is a signature pattern of post-compromise enumeration. Three or more distinct recon binaries within fifteen minutes typically indicates automated reconnaissance before the next attack stage.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: Has this host run the nslookup DC SRV-record lookup before, and how often?
  context: A firing pattern that has never been seen on a host is more suspicious than one that recurs regularly. Zero or very low historical counts over ninety days indicate first-time or rare execution; a steady recurring count points to a scheduled diagnostic or monitoring job.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
        - nslookup
        - _ldap._tcp.dc._msdcs.
      condition: selection
    fields:
      - User
- question: When this host has previously fired this lookup pattern, what parents and users drove it, and does the current alert fit that pattern?
  context: Even routine diagnostics leave a consistent pattern. This query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern has historically run here. A new parent process, an unexpected user account, or an unusual command structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - nslookup
        - _ldap._tcp.dc._msdcs.
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - nslookup
        - _ldap._tcp.dc._msdcs.
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - nslookup
        - _ldap._tcp.dc._msdcs.
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or enumeration spanning multiple endpoints. If the same user triggered similar activity on several hosts, the scope of the operation may be larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - nslookup
        - _ldap._tcp.dc._msdcs.
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this lookup, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, or persistence mechanisms running near the same time.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts fired this lookup pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: This query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of the firing pattern rather than generic nslookup usage. Many hosts firing the same lookup points to scripted deployment or monitoring automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - nslookup
        - _ldap._tcp.dc._msdcs.
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- defense tampering, initial execution, or credential access -- may reveal the attack stages that preceded this lookup and help reconstruct the timeline. Discovery commonly follows initial access and precedes lateral movement.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
