name: DLL Names Used By SVR For GraphicalProton Backdoor
id: c1da6d7f-e7d1-4a98-96d3-33a41580372f
description: |
  Detects an image_load event for one of a set of hardcoded, randomly-generated DLL names associated with the GraphicalProton backdoor, which is delivered by side-loading a malicious DLL into a legitimate signed application or by loading it directly via rundll32. None of these DLL names ship with legitimate software, so a name match is high-confidence, but the investigation must still confirm the on-disk path, code signature, and which process loaded the module. Determine where the DLL came from on disk, whether the loading process was legitimately hijacked through DLL search order, and whether related backdoor staging, persistence, or lateral-movement activity is present on the host.
type: detection
detection_id: e64c8ef3-9f98-40c8-b71e-96110991cb4c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the loaded module match one of the known backdoor DLL names, and what is its path, signature, and loading process?
  context: Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded), its code-signature status, and the process that loaded it. The rule matches any of a set of hardcoded, non-standard DLL names tied to the GraphicalProton backdoor; note which specific name fired, because that name is the primary indicator. DLL loads carry a hash and signing status directly on the load event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this host and the account running the loading process expected to load this module?
  context: Legitimate administrative software can load third-party DLLs, but a randomly-named module with no known vendor is not expected on any host. Knowing whether the host function and the account context match the loading process helps separate a genuine side-load from an in-house tool that happens to load unusual libraries.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this DLL load part of an authorized penetration test or red team engagement?
  context: Red team operators sometimes emulate DLL side-loading and backdoor tradecraft during sanctioned assessments. Before investing investigation time, check whether a penetration test or red team exercise is currently active on this host or network segment. An authorized engagement with matching timing resolves the alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What other modules did this process load, and are any from non-canonical paths, unsigned, or from user-writable directories?
  context: 'The full set of modules a process loads reveals whether this is an isolated side-load or one of several planted libraries. Look for: (1) DLLs from %TEMP%, AppData, ProgramData, or Public - a strong side-loading signal; (2) unsigned modules in directories where signed ones are expected; (3) system DLL names loaded from non-system paths, indicating search-order hijacking; (4) modules the loading process does not normally load. AllowedDllPaths such as System32 are the canonical baseline; loads outside those directories deserve scrutiny.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For the loaded module, what is its signing status, hash, and threat-intel reputation?
  context: Module reputation distinguishes a routine third-party DLL from a side-loaded backdoor. GraphicalProton DLLs are typically unsigned or carry a signature that does not match their non-standard filename. A hash lookup against threat intelligence confirms whether the loaded module is a known backdoor loader; a HashBaseline of the legitimate DLL that the name masquerades as helps confirm substitution. SignatureStatus values to watch are Unsigned, Expired, Distrusted, and Invalid.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What is the full command line of the process that loaded this module?
  context: The loading process command line shows how the DLL was invoked. A rundll32 command line that names one of the backdoor DLLs and an exported function reveals direct loading for execution or lateral movement, while a legitimate signed application loading the DLL from its own directory points to classic side-loading. Decode the command line to identify the entrypoint and any arguments.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned the module's loading process, and is that parent chain expected?
  context: The parent process reveals how the loading process was started. A legitimate application that has been abused for side-loading normally has a predictable parent (explorer.exe, services.exe, an installer). An unexpected parent such as a script host, a remote-execution service, or an office application suggests the loading process was staged by the operator rather than launched routinely. A ProcessAllowList of applications expected to load DLLs from non-standard locations is the baseline to compare against.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Which process wrote this DLL to disk, and to what directory?
  context: Side-loading requires the malicious DLL to be planted next to or in the search path of the loading application. Identifying which process created the file, and whether it landed in an application directory, a user-writable path, or a system directory, distinguishes a planted backdoor from a legitimately installed library. File writes into temp, WinStore, or an application folder that shadows a system DLL name are consistent with the side-loading pattern.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
- question: Has this specific DLL been loaded on this host before, and under what processes?
  context: A first-time module load is a stronger anomaly than a recurring one. Because these DLL names are non-standard, any prior load is itself notable and may indicate the backdoor has been resident for some time. If the module has never been seen on this host before, the current load is a fresh planting; if it recurs, establish how long it has persisted and which processes loaded it.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Is this DLL being loaded on other hosts in the environment, and under which processes?
  context: Cross-host correlation surfaces how far the backdoor has spread. The same non-standard DLL name loading on multiple hosts indicates distribution beyond a single victim and may point to shared tooling or lateral movement. Pay attention to the variety of loading processes, since the same DLL loaded by different applications on different hosts suggests the operator is reusing the module across the environment.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Were DLL-load-influencing registry keys modified on this host around the time of the alert?
  context: DLL search order and load behavior can be steered through registry keys such as AppInit_DLLs, KnownDLLs, Image File Execution Options, and per-application App Paths. Modifications to these keys near the load event indicate the operator arranged for the malicious DLL to be loaded automatically, a persistence and execution-hijack facet that complements the file-based side-load.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\Windows NT\CurrentVersion\Windows\AppInit_DLLs'
          - '\Control\Session Manager\KnownDLLs'
          - '\Image File Execution Options\'
          - '\CurrentVersion\App Paths\'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: Were files dropped to persistence locations such as the Startup folder or scheduled-task definition paths on this host?
  context: File-based persistence bypasses command-line detection entirely. Dropping an executable or script into the Startup folder or a path referenced by a registry Run key achieves persistence without running standard persistence tools. File-event monitoring captures these drops even when the operator avoids schtasks, sc, or reg, and multiple planted artifacts in the same timeframe corroborate a deliberate foothold.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: A single foothold is rarely the only one. After planting the backdoor DLL, an operator commonly installs backup persistence using different techniques - scheduled tasks, services, registry Run keys, or WMI subscriptions. Multiple persistence installations in the same window indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Are backdoor staging artifacts present in the loading process's file activity?
  context: The associated backdoor family stages exfiltration data as randomly-generated image files inside cloud-sync folders, creating a randomly named subdirectory per run. Checking the files created by the loading process can surface these staging artifacts, image files with appended marker bytes, or archives assembled for exfiltration, confirming operational activity even after the original process has exited.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity in a tight window around the load reveals the immediate context: what staged the DLL, what the loading process did next, and whether reconnaissance, credential access, or privilege escalation accompanied it. The correlation window between the DLL file write, any registry change, and the module load is where the sequence becomes visible.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - defense tampering, reconnaissance, credential access - may reveal the attack stages that preceded the DLL load and help reconstruct the timeline. A backdoor load late in an intrusion is often preceded by exploitation, discovery, and credential theft alerts.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
