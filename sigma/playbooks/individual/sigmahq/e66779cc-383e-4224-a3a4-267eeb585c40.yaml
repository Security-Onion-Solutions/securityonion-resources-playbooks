name: Bypass UAC via CMSTP
id: 968f9350-c89f-4f03-9bf0-0eeae31d6994
description: |
  Detects the Connection Manager Profile Installer (cmstp.exe) running with silent/auto-install switches (/s, /au, /ni and their dash variants), the pattern used to install a specially crafted local or remote .INF file. cmstp.exe is a Microsoft-signed System32 binary that auto-elevates via the CMSTPLUA COM interface, so a crafted INF can bypass UAC or proxy-execute VBScript/JScript scriptlets while the executing process stays signed. Legitimate VPN and connection-manager profile installs use the same switches, so the investigation must establish whether the INF and its source are expected, what cmstp.exe spawned afterward, and whether elevated follow-on activity occurred. The rule fires when both the image/OriginalFileName match cmstp.exe AND the command line contains one of the install switches.
type: detection
detection_id: e66779cc-383e-4224-a3a4-267eeb585c40
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line show cmstp.exe running with a silent or auto-install switch?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and process details. The rule requires both that the image is cmstp.exe (or OriginalFileName CMSTP.EXE) AND that the command line contains one of the install switches /s, -s, /au, -au, /ni, or -ni. Confirm which switch fired and capture the .INF path or URL passed to it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to install connection-manager or VPN profiles via cmstp.exe?
  context: Legitimate VPN and connection-manager profile installs invoke cmstp.exe with the same switches, typically during provisioning or a deployment package. Knowing whether the user role and host function involve VPN/profile management is often the fastest path to distinguishing a routine install from an auto-elevation abuse attempt.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did cmstp.exe do? Decode the switches and the .INF target it was given.
  context: The full command line reveals the specific action taken. Identify the install switch (/s silent, /ni no-icon, /au auto-install) and decode the .INF path or URL argument. A local INF in a user-writable directory or a remote URL is the abuse pattern; a signed vendor profile under Program Files is the routine one. The INF's UnRegisterOCXSection or RunPreSetupCommandSection is where arbitrary script or commands hide.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned cmstp.exe and is that parent chain expected?
  context: The parent process reveals how cmstp.exe was invoked. A profile install driven by a deployment tool or by explorer.exe is routine; parents like mshta.exe, wscript.exe, powershell.exe, or an Office application point to a scripted launch and indicate the auto-elevation is being abused rather than used for a real VPN profile.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What action was performed with elevated privileges after the cmstp.exe execution?
  context: UAC bypass is a means to an end -- the auto-elevation lets an operator run high-integrity actions such as installing persistence, dumping credentials, tampering with security tools, or accessing protected resources. Examining High or System integrity processes on the same host shortly after the cmstp.exe execution reveals the objective behind the bypass.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: Were registry-based UAC bypass attempts also made on this host around the same time?
  context: CMSTP abuses an INF file and the CMSTPLUA COM interface rather than a registry key, so this query will not capture the cmstp.exe setup itself. It is included because operators who try one bypass often try registry-based methods (ms-settings, mscfile, Environment, DelegateExecute) in parallel; finding those alongside the cmstp.exe execution confirms deliberate privilege escalation rather than a routine profile install.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\reg.exe'
          - '\powershell.exe'
          - '\cmd.exe'
        CommandLine|contains:
          - 'ms-settings'
          - 'mscfile'
          - 'Classes\exefile'
          - 'Classes\Folder'
          - 'Environment'
          - 'Shell\Open\command'
          - 'DelegateExecute'
      condition: selection
    fields:
      - CommandLine
      - Image
- question: Were other privilege escalation or UAC bypass techniques attempted on this host?
  context: Attackers who attempt one UAC bypass often try multiple methods until one succeeds, especially if the OS version or configuration blocks certain techniques. Multiple bypass or escalation alerts from the same user or process around the same time confirm deliberate privilege escalation activity rather than a false positive. This also surfaces any earlier detections that preceded the cmstp.exe execution.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- question: What child processes did cmstp.exe spawn afterward?
  context: The processes spawned by cmstp.exe reveal its actual impact. A real profile install spawns little or nothing; a weaponized INF causes cmstp.exe to launch cmd.exe, powershell.exe, scriptlet hosts, or other tooling. Child processes here are the proxy-executed payload and the highest-value evidence that the auto-elevation was abused.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Were suspicious .INF, .SCT, or .DLL files created on this host shortly before the cmstp.exe execution?
  context: CMSTP abuse depends on a crafted .INF file, often paired with a .SCT scriptlet that scrobj.dll loads or a DLL the profile references. A file of one of those types dropped into a user-writable or temp directory shortly before cmstp.exe ran is the payload the install consumed; correlating its path with the .INF argument from the command line confirms the source of the executed content.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith:
          - '.inf'
          - '.sct'
          - '.dll'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: Did cmstp.exe load the .NET CLR or other unexpected managed-code modules?
  context: cmstp.exe does not normally need the .NET CLR; the presence of clr.dll, mscoree.dll, or mscorlib loaded into cmstp.exe is a strong negative-baseline signal that managed code was hosted inside the signed binary. A corresponding CLR usage log entry for cmstp.exe under the standard .NET log directory carries the same meaning. Matches here indicate proxy execution rather than a profile install.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\cmstp.exe'
        ImageLoaded|endswith:
          - '\clr.dll'
          - '\mscoree.dll'
          - '\mscorlib.dll'
          - '\clrjit.dll'
          - '\scrobj.dll'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \cmstp.exe
      - OriginalFileName: CMSTP.EXE
      selection_cli:
        CommandLine|contains:
        - /s
        - -s
        - /au
        - -au
        - /ni
        - -ni
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \cmstp.exe
      - OriginalFileName: CMSTP.EXE
      selection_cli:
        CommandLine|contains:
        - /s
        - -s
        - /au
        - -au
        - /ni
        - -ni
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints. If the same user triggered similar activity on multiple hosts, the scope of the operation may be larger than a single profile install.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \cmstp.exe
      - OriginalFileName: CMSTP.EXE
      selection_cli:
        CommandLine|contains:
        - /s
        - -s
        - /au
        - -au
        - /ni
        - -ni
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: Were any other proxy-execution LOLBins used on this host recently?
  context: Attackers who use one signed-binary proxy often use several -- if cmstp.exe was used to proxy-execute a payload, check whether rundll32, regsvr32, mshta, msbuild, installutil, or similar binaries were also used for the same objective. Finding multiple proxy-execution LOLBins performing arbitrary code execution strengthens the case for malicious activity over a routine install.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was cmstp.exe executed from its expected System32 or SysWOW64 path?
  context: cmstp.exe normally lives at C:\Windows\System32\cmstp.exe or C:\Windows\SysWOW64\cmstp.exe. A cmstp.exe running from a user temp directory or other non-standard path may be a copied or renamed binary used to evade path-based allowlists, which would make the execution considerably more suspicious. Compare the Image path against OriginalFileName to confirm.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired the cmstp.exe install-switch pattern over the past 90 days, and what command-line structures are typical?
  context: A cmstp.exe install-switch pattern with no prior history on a host is more suspicious than one used regularly under stable parents. The query mirrors the rule's selection structure scoped to this host, so the resulting count reflects the rule's specific firing pattern rather than generic cmstp.exe usage. The command-line projection lets the analyst compare typical install patterns (and their .INF targets) against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \cmstp.exe
      - OriginalFileName: CMSTP.EXE
      selection_cli:
        CommandLine|contains:
        - /s
        - -s
        - /au
        - -au
        - /ni
        - -ni
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection*) and _pb_scope
    fields:
    - CommandLine
