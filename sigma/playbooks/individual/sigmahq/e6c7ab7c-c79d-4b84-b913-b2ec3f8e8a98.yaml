name: Katz Stealer DLL Loaded
id: e8f4b1f4-df9b-441f-80e4-75c546749dc4
description: >-
  Detects a process loading a DLL whose path ends in katz_ontop.dll or a
  received_dll.dll staged under AppData\Local\Temp — module names and paths
  tied to a known information-stealer family and not associated with
  legitimate software, so false positives are unlikely. The process that loads
  these modules is very likely running attacker-supplied or injected code;
  investigate the module's origin, signature, and hash, the host process it
  loaded into, and any follow-on execution or outbound connections. Determine
  how the DLL reached disk, what process loaded it, and whether the host shows
  credential-theft or exfiltration activity around the load.
type: detection
detection_id: e6c7ab7c-c79d-4b84-b913-b2ec3f8e8a98
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the loaded module match the path, signature, and loading process this rule detects?
  context: >-
    Confirm the alert is a true positive by reviewing the exact module path
    (ImageLoaded), its code-signature status, and the loading process against
    the rule's criteria. The rule fires on modules whose path ends in
    katz_ontop.dll or a received_dll.dll under AppData\Local\Temp, names
    associated with a known information-stealer family rather than legitimate
    software. DLL loads carry a hash and signing status directly on the load
    event, so signature and hash can be read without pivoting to an execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this user and host expected to be running the process that loaded this module?
  context: >-
    Legitimate administrative activity can trigger many detections. Knowing
    whether the user role and host function are consistent with the process
    that loaded this module is often the fastest path to distinguishing a true
    positive from routine operation. A stealer module loaded into an otherwise
    normal process on a general-purpose workstation is more concerning than one
    tied to a known testing or research host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What modules did the loading process load, and are any from user-writable or Temp paths, unsigned, or from non-canonical locations?
  context: >-
    The full set of modules a process loads tells the operator's story. Look
    for DLLs loaded from %TEMP%, AppData, ProgramData, or Public (a strong
    side-loading signal), unsigned modules where signed ones are expected,
    system DLL names loaded from non-system paths (search-order hijacking), and
    modules the loading process would not normally pull in (injection or
    hooking). The rule's own trigger, a DLL under AppData\Local\Temp, is exactly
    this user-writable-path pattern.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For the loaded module, what is its signing status, hash, and threat-intel reputation?
  context: >-
    Module reputation separates a routine third-party DLL from a side-loaded
    malicious one. An unsigned module, or one whose SignatureStatus is anything
    other than Valid (Unsigned, Expired, Distrusted, Invalid), staged in a
    user-writable path is a strong indicator to prioritize; alerting only on
    SignatureStatus not equal to Valid is the common tuning to cut noise. The
    Hashes value gives the module's hash for a threat-intelligence lookup, which
    surfaces known loaders for this information-stealer family.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What was the full command line of the process that loaded this module, and what was it doing?
  context: >-
    The loading process command line reveals how it was running and whether the
    module load fits its normal behavior. Stealers frequently inject into or
    side-load through an otherwise benign, signed process, so a normal-looking
    command line paired with this module load points to injection rather than a
    benign explanation. Decode any flags, paths, or encoded content in the
    command line to understand the operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned the process that loaded this module, and is that parent chain expected?
  context: >-
    The parent process reveals how the loading process was launched. Legitimate
    usage tends to have predictable parents (explorer.exe for user actions,
    services.exe for services). Unusual parents such as a browser, mshta.exe,
    wscript.exe, or an Office application suggest the loading process was started
    by a delivery or exploitation stage rather than by normal use.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Did the process that loaded this module spawn any child processes after the load?
  context: >-
    A loaded module is commonly followed by execution: the module run through
    rundll32.exe or regsvr32.exe, or helper processes launched to collect and
    stage data. Child processes of the loading process reconstruct that
    follow-on stage and show whether the load led to hands-on-keyboard or
    automated collection activity.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Was this DLL recently written to disk, and which process wrote it?
  context: >-
    For shared-module abuse the DLL is frequently written to a user-writable
    path shortly before it is loaded, often within a 0 to 20 minute window.
    Identifying the writing process ties the drop to a downloader, archive
    extraction, or loader stage and shows how the module reached disk. The query
    matches the known stealer module names directly, since the load event
    carries no file-write telemetry of its own.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith:
          - '\katz_ontop.dll'
          - '\received_dll.dll'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
- question: Did the loading process make outbound network connections around the time of the load?
  context: >-
    Information-stealers exfiltrate collected credentials and browser data to
    external infrastructure, typically within a short window after the module
    loads. Anchor on the destination IP because name resolution is a separate
    event, and treat connections to external addresses from the loading process
    as candidate exfiltration or command-and-control. Correlate the timing
    against the module load to confirm the connection follows it.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: Is the loaded DLL still on disk for analysis?
  context: >-
    If the module is still present on disk, it can be preserved for hash
    lookups, sandbox submission, or content review before any cleanup removes
    it. The query correlates file activity to the loading process and its direct
    children so the on-disk copy and its writer can be located.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has this DLL been loaded on this host before, and under which processes?
  context: >-
    A first-time module load is a stronger anomaly than a recurring one. If the
    same DLL has been loaded repeatedly by the same process over the past 90
    days it is probably routine; if this is the first occurrence, or it has only
    been loaded by unrelated processes historically, the current load is
    anomalous. For a stealer module the expected baseline is zero prior loads.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Does this host normally run the process that loaded this module?
  context: >-
    A process that has rarely or never run on a host is more suspicious than one
    that runs regularly. Zero or very low historical counts for the loading
    process, or a first appearance of an unseen or rarely seen signer, indicate
    first-time or rare execution consistent with a freshly delivered payload.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Is this DLL being loaded on other hosts, and under what processes?
  context: >-
    Cross-host correlation surfaces how far the module has spread. The same DLL
    loaded on a single host may be a localized incident; loaded across several
    hosts it points to wider distribution or shared delivery infrastructure. Pay
    attention to the variety of loading processes, since the same module loaded
    by different, unexpected processes on other hosts suggests broader
    compromise.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining activity around the load reveals
    what led to it and what followed, and whether it is part of a larger
    sequence. Look for delivery, reconnaissance, credential access, or
    persistence steps in the same window as the module load.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host, such as defense tampering,
    reconnaissance, or credential access, may reveal the stages that preceded
    the module load and help reconstruct the full timeline. The alert sequence
    on the host often tells the story of how the loading process was reached.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
