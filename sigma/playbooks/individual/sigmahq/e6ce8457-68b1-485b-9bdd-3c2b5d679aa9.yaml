name: VBA DLL Loaded Via Office Application
id: 9e34f3b1-8359-426b-9748-09e6c78d566a
description: |
  Detects an Office application (Word, Excel, PowerPoint, Outlook, OneNote, Publisher) loading the
  VBA runtime DLLs (VBE7.DLL, VBEUI.DLL, VBE7INTL.DLL), which indicates a macro-enabled document
  was opened or the VBA editor was launched (T1204.002). Legitimate macro use is common, so the
  investigation pivots on what happened after the load, such as child processes spawned by the
  Office application, capability DLLs loaded into it (Task Scheduler or WMI COM libraries let a
  macro act without spawning children), files it wrote, and outbound connections from the same
  lineage. Establish the document that carried the macro and whether its behavior matches routine
  business use.
type: detection
detection_id: e6ce8457-68b1-485b-9bdd-3c2b5d679aa9
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the loaded module match what this rule detects, a VBA runtime DLL loaded by an Office application?
  context: |
    Confirm the alert from the exact module path (ImageLoaded) and the loading process. The rule
    fires when winword.exe, excel.exe, powerpnt.exe, outlook.exe, onenote.exe, onenoteim.exe, or
    mspub.exe loads VBE7.DLL, VBEUI.DLL, or VBE7INTL.DLL. Which Office application loaded the VBA
    engine matters for the rest of the investigation; a macro in an emailed spreadsheet reads
    differently from one in a Publisher file.
  range: +/-5m
  answer_sources:
  - alert
  - image_load
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Is this user expected to work with macro-enabled Office documents?
  context: |
    Macro use concentrates in specific roles, such as finance, data-analysis, and operations teams
    with spreadsheet automation. A VBA load for a user who routinely runs macro workbooks is
    usually routine; the same load for a user who never touches macros, or on a host where Office
    automation has no business purpose, deserves the full follow-on review.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What launched this Office instance, and from where?
  context: |
    The parent process and its command line reveal the delivery path. An Office process launched
    by outlook.exe points to an email attachment; one launched by explorer.exe from a Downloads or
    Temp path points to a downloaded file; a browser parent points to a direct web open. The
    document name itself is visible in the Office process command line from the
    mechanism-decode question.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: What document did the Office application have open when the VBA engine loaded?
  context: |
    The Office process command line usually carries the opened document path. A macro-enabled
    file (.docm, .xlsm, .pptm) from Downloads, Temp, Outlook attachment cache, or another
    user-writable staging path fits the malicious-delivery pattern; a macro workbook from a
    departmental share that the user opens daily fits routine use. The working directory adds
    the same signal.
  range: +/-5m
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What capability DLLs did this Office process load alongside the VBA engine?
  context: |
    A macro can act without spawning visible children by driving COM APIs in-process, and the
    DLLs it pulls in reveal that. Watch for taskschd.dll (scheduled-task creation without
    schtasks.exe), the WMI set wbemdisp.dll, wbemcomn.dll, wbemprox.dll, wmiutils.dll,
    wbemsvc.dll, and fastprox.dll (WMI execution), vaultcli.dll (credential vault access), clr.dll
    (in-process .NET), and any unsigned module from a user-writable path.
  range: +/-5m
  answer_sources:
  - image_load
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: What child processes did this Office instance spawn after the VBA engine loaded?
  context: |
    Macro payloads most commonly appear as children of the Office process within minutes of the
    document opening. Spawns of powershell.exe, cmd.exe, wscript.exe, cscript.exe, mshta.exe,
    rundll32.exe, regsvr32.exe, msiexec.exe, curl.exe, or bitsadmin.exe from a document-bearing
    Office instance are the classic macro-execution chain. No children at all is also an answer;
    then the in-process COM activity from the capability-DLL question carries the weight.
  range: +4h
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did WMI spawn unusual processes on this host around the alert?
  context: |
    A macro that executes through WMI produces children of wmiprvse.exe rather than of the Office
    application, deliberately breaking the parent-child trail. Scripting engines or command shells
    appearing under wmiprvse.exe on this host near the document open indicate the macro used WMI
    indirection; pair the timing with the capability-DLL question's WMI module loads.
  range: +/-1h
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\wmiprvse.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: What files did the Office process or its children write, and are any still on disk?
  context: |
    Macro payloads commonly drop scripts or executables into Downloads, Temp, or AppData staging
    paths before running them, sometimes with double extensions or script extensions (js, vbs,
    bat, cmd, ps1, hta). Files written by this Office instance or its children identify the
    dropped payload; if still on disk, capture hashes and preserve a copy for analysis.
  range: +/-15m
  answer_sources:
  - file_event
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did this Office process initiate outbound network connections after the VBA load?
  context: |
    Macros frequently retrieve second stages over HTTP(S) from inside the Office process itself.
    Outbound connections from the Office instance shortly after the document opened, particularly
    to raw IPs or uncommon destinations rather than corporate update or collaboration endpoints,
    indicate payload retrieval or beaconing. Egress from macro children shows up under the
    follow-on child review.
  range: +/-1h
  answer_sources:
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: Is the loaded VBA engine DLL the genuine signed Microsoft library from the Office installation path?
  context: |
    VBE7.DLL and its companions are signed Microsoft libraries living under the Office install
    tree. A VBA-named DLL loaded from any other location, or one whose signature status is
    Unsigned, Expired, or Invalid, is a planted masquerade rather than the real macro engine and
    changes the investigation from macro abuse to DLL substitution.
  range: +/-5m
  answer_sources:
  - image_load
  - external_threat_intel
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: When this host has fired this Office-plus-VBA pattern before, which users and Office applications drove it, and does this alert fit?
  context: |
    Hosts with routine macro workflows fire this pattern repeatedly under the same user and the
    same Office application. An alert that matches the host's established pattern is likely
    routine automation; a first-time user or a different Office application from the historical
    pattern is the deviation worth pursuing — image-load events carry no parent lineage, so
    pivot to the Office process's start event if launch lineage matters.
  range: -14d
  answer_sources:
  - image_load
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith:
        - \excel.exe
        - \mspub.exe
        - \onenote.exe
        - \onenoteim.exe
        - \outlook.exe
        - \powerpnt.exe
        - \winword.exe
        ImageLoaded|endswith:
        - \VBE7.DLL
        - \VBEUI.DLL
        - \VBE7INTL.DLL
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts fired this Office-plus-VBA pattern in the past week, and does the distribution look like routine automation?
  context: |
    Macro-heavy organizations fire this pattern across many hosts every day; the fleet count
    establishes that base rate. A tight cluster of first-time hosts in the same window, or a
    pattern concentrated on hosts that share a delivery vector such as the same mailing list,
    points at a common malicious document rather than routine use.
  range: -7d
  answer_sources:
  - image_load
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith:
        - \excel.exe
        - \mspub.exe
        - \onenote.exe
        - \onenoteim.exe
        - \outlook.exe
        - \powerpnt.exe
        - \winword.exe
        ImageLoaded|endswith:
        - \VBE7.DLL
        - \VBEUI.DLL
        - \VBE7INTL.DLL
      condition: selection
    fields:
    - host.name
- question: Did this same detection fire for other users or hosts recently?
  context: |
    A malicious document distributed by email typically reaches several recipients, so the same
    rule fires on multiple hosts within hours. Aggregating this detection across hosts and users
    over the past day distinguishes a single user's routine macro from a distributed delivery
    reaching many mailboxes.
  range: -24h
  answer_sources:
  - alert
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this Office installation current on security updates?
  context: |
    Macro security has tightened across Office updates, including mark-of-the-web macro blocking
    for internet-sourced documents. An out-of-date Office installation both widens the exploit
    surface and weakens the macro-blocking defaults, which changes how much weight to give a
    macro-enabled document arriving from outside.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: What other activity occurred on this host around the time of the alert?
  context: |
    Aggregated parent-child process pairs around the alert reveal the surrounding context, such
    as archive extraction before the document open or scripting activity after it. Novel
    low-count pairs stand out against repetitive agent noise.
  range: +/-15m
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: |
    Earlier detections, such as suspicious attachment writes, archive tool execution, or
    script-host activity, may reveal the delivery stages that preceded the macro load and help
    reconstruct the timeline from arrival to execution.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
