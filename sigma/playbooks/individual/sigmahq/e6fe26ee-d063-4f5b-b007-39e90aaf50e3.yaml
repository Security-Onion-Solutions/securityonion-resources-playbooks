name: Potential Persistence Via AutodialDLL
id: 5c6f5550-870e-4cf2-a39e-ece311c56654
description: >-
  Detects a write to the AutodialDLL value under the WinSock2 Parameters registry key, which
  names a DLL that the Winsock library loads whenever a process connects to the network. Because
  nearly every networked process loads ws2_32.dll, a DLL referenced here is loaded broadly across
  the host, giving an attacker a durable persistence and code-injection foothold; the value is
  essentially never set during normal operation. Investigation should confirm the exact value
  data, determine whether the referenced DLL exists on disk and loaded into networked processes,
  and establish who wrote the key and what other persistence or configuration changes accompanied it.
type: detection
detection_id: e6fe26ee-d063-4f5b-b007-39e90aaf50e3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the triggering event write the WinSock2 AutodialDLL registry value, and what DLL path was set?
  context: >-
    Confirm the alert is a true positive by reviewing the exact registry path in TargetObject, the
    value data in Details, and the writing process against the rule criteria. The rule fires on any
    write to the AutodialDLL value under the WinSock2 Parameters key.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify the WinSock2 AutodialDLL registry value?
  context: >-
    The AutodialDLL value is essentially never written during normal operation, so a legitimate
    change is rare. Knowing whether the user role and host function involve low-level network stack
    configuration helps separate a genuine administrative action from unauthorized persistence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Was there a change ticket, maintenance window, or documented approval for this registry change?
  context: >-
    The AutodialDLL value controls a DLL that loads into networked processes, so a deliberate change
    would normally be tied to an approved deployment. A corresponding ticket suggests authorized
    activity; its absence when policy requires one points toward unauthorized persistence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the modified key a known persistence or code-injection location, and what does the AutodialDLL entry control?
  context: >-
    The AutodialDLL value under the WinSock2 Parameters key names a DLL that the Winsock library
    loads whenever a process connects to the network. Because nearly every networked process loads
    ws2_32.dll, a DLL referenced here is loaded broadly across the host, making the key a persistence
    and code-injection vector. The value data and writing process determine what runs.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What DLL path is written in the AutodialDLL value, and does it point to a suspicious location?
  context: >-
    The value data is a filesystem path to the DLL Winsock will load. Paths under user-writable or
    transient locations such as Temp, AppData, ProgramData, or a user profile are strong indicators
    of an implant, whereas a signed system DLL in System32 is less concerning. Decode the Details
    value and note the exact path for the on-disk and load checks.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote the AutodialDLL value, and what were its full command line and parent?
  context: >-
    Registry events do not carry the writing process command line, so pivot to the process by its
    identifier to recover the full command and its parent. A script host, a living-off-the-land
    binary such as reg.exe, or an unexpected parent chain writing this value indicates automated or
    hands-on persistence rather than a routine configuration tool.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - ParentImage
      - Image
- question: Was the DLL referenced by the AutodialDLL value loaded into networked processes on this host?
  context: >-
    Once the value is set, Winsock loads the referenced DLL into any process that touches the
    network, so a load confirms the persistence and injection are active. Review which processes
    loaded the DLL and whether the file is signed; loads into many unrelated networked processes are
    the expected effect of this mechanism.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%Details%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
      - Signature
- question: Is the DLL referenced by the AutodialDLL value present on disk, and was it dropped in the same session as the registry write?
  context: >-
    The persistence is only effective if the referenced DLL exists at the configured path.
    Correlating file activity from the writing process and its children locates the payload drop,
    which usually lands in the same session as the registry change. The file-write event carries no
    hash; if the DLL is present, obtain its hash from a later load or execution for a reputation
    lookup. Whether the change survives reboot is a judgment call from the value data and its
    re-modification history rather than a delete event, which endpoint telemetry does not record.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Is the AutodialDLL value a known persistence location, and does its re-modification history indicate the change is durable?
  context: >-
    This key is a documented, rarely-legitimate persistence location. Endpoint registry telemetry
    does not emit key or value deletion events, so durability cannot be judged by looking for a
    removal; instead review whether the value was re-modified over a longer window and whether the
    referenced DLL loaded. A value that stays set and whose DLL loads is active persistence.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Has the WinSock2 AutodialDLL value been modified before on this host?
  context: >-
    This value should almost never change in normal operation. Zero or near-zero history over the
    trailing window marks this as a first-time modification, which is more suspicious than a key that
    changes routinely. Compare prior Details values to see whether the same DLL path was set before.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Were other registry modifications made on this host in the same session as the AutodialDLL change?
  context: >-
    Operators who set one persistence value often make several changes together, such as adding a Run
    key, weakening a security policy, or altering a service. Registry modifications from the same
    host clustered in a short window reveal the full scope of the configuration changes and whether
    multiple objectives were pursued. The triggering key appears in the results; the signal is what
    else changed alongside it.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other process activity occurred on this host around the time of the AutodialDLL change?
  context: >-
    Alerts rarely occur in isolation. Process activity in the minutes around the registry write shows
    what led to the change and what followed, including any download, script execution, or
    reconnaissance that accompanied the persistence. Novel parent-child pairs stand out against
    routine, high-count background processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before the AutodialDLL change?
  context: >-
    Earlier detections on the same host, such as defense tampering, reconnaissance, or credential
    access, may reveal the stages that preceded this persistence and help reconstruct the timeline. A
    cluster of prior alerts points to a hands-on intrusion rather than an isolated event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was the WinSock2 AutodialDLL value modified on other hosts in the environment?
  context: >-
    The same modification across multiple hosts can indicate a pushed configuration, widespread
    malware, or lateral movement, whereas a change on this host alone suggests a targeted action.
    Compare the DLL paths set on each host; identical payload paths across hosts indicate a common
    operator or tool.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: >-
    Attackers rarely rely on a single persistence method. Alongside the AutodialDLL entry, they
    commonly stage backups using scheduled tasks, services, registry Run keys, BITS jobs, or WMI
    subscriptions. Multiple persistence installations in the same timeframe indicate intentional
    stacking rather than isolated administrative work.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup folders or scheduled-task definition paths on this host around the same time?
  context: >-
    File-based persistence bypasses command-line detection entirely by dropping an executable or
    script into a Startup folder or a path referenced by a registry Run key. File event monitoring
    captures these drops even when standard persistence tools are avoided, revealing persistence that
    parallels the AutodialDLL entry.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
