name: Potential Compromised 3CXDesktopApp Update Activity
id: cf2c89d7-9354-487d-9926-8ff83c075c4f
description: |
  Detects the 3CXDesktopApp updater (update.exe inside the application's install directory) running
  with a command line that carries --update, an http URL, and the /electron/update/win32/18.12
  release path together — all three must be present for the rule to fire. The updater is a signed,
  trusted component of a legitimate desktop application and fetching release payloads over HTTP is
  its documented job; the version path this rule matches corresponds to a build range that was
  distributed in trojanized form, and a valid signature on the updater says nothing about the
  integrity of what it retrieves. Trusted-updater abuse follows a consistent structure: an
  allowlisted binary reaches an external endpoint, writes the fetched payload into the application
  directory, and the application loads it on next start, so the payload inherits the application's
  reputation and network allowances. Determine which version was requested, what external
  destination the updater contacted, which modules the application loaded afterward and whether
  they are signed, and whether any unexpected child processes or egress followed.
type: detection
detection_id: e7581747-1e44-4d4b-85a6-0db0b4a00f2a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the command line show the updater running with --update against an http URL on the
    /electron/update/win32/18.12 release path?
  context: Confirm the alert before investing time. The rule requires all three elements on the same
    invocation, and the binary must be update.exe under the application's app directory. Read the
    full URL out of the command line and note the exact version token that follows the release
    path — that version drives the rest of the investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to be running this desktop application and taking its
    updates?
  context: The updater runs on hosts where the application is deployed, usually unattended and
    without the user initiating it, so the presence of the software is the question rather than the
    user's intent. If the host is not a sanctioned deployment target, or the software was installed
    outside the normal distribution process, the install itself is the finding.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What exactly did the updater request — which host, path, and version does the URL name?
  context: The command line carries the whole operation. Read the scheme (plain http rather than
    https means the payload arrived without transport integrity), the hostname or IP the update
    was pulled from, and the full version token after the release path. Compare that version and
    that download host against the build the organization intends to run and the vendor endpoint it
    should be pulling from; a version outside the approved range, or a download host that is not the
    vendor's, changes what the fetched payload is.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What external destinations did this updater process actually contact, and on which ports?
  context: The command line states the intended URL; the connection record states where the process
    went. An updater is expected to reach one vendor distribution endpoint over a web port and stop.
    Contact with an address unrelated to the vendor's distribution infrastructure, repeated contact
    with the same external address after the fetch completes, or connections on non-web ports all
    indicate the process is doing more than retrieving a release. Record the destination addresses
    for reputation checks and for pivoting to other hosts that reached the same infrastructure.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
  - external_threat_intel
- question: Which modules were loaded out of the application's install directory around this update,
    and are they signed?
  context: A retrieved update lands as files in the application directory and becomes active when the
    application loads them, which is where a trojanized payload first executes. Module-load events
    carry the module path, its signature state, its signer, and its hash directly, so this is the
    fastest read on what the update actually delivered. Look for modules that are unsigned, carry a
    broken or untrusted signature status, are signed by a publisher unrelated to the application, or
    whose hashes do not match the vendor's published release; a module sitting beside legitimate
    signed ones in the same directory is the sideloading pattern this class of compromise relies on.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|contains: \3CXDesktopApp\
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - process_creation
  - manual_review
  - external_threat_intel
- question: What process spawned this updater and is that parent chain expected?
  context: The updater is normally launched by the application itself or by its update service, on a
    schedule or at application start. A command interpreter, a script host, a remote-management
    agent, or an office application as the parent means something other than the product's own
    update cycle invoked it, and the URL on the command line was then supplied by that caller rather
    than by the vendor's release channel.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What child processes did the updater spawn afterward?
  context: An updater downloads, verifies, and stages files; it may restart the application, and
    little else. Command interpreters, script hosts, certutil, or a copy of a system binary launched
    from a user-writable path under this parent are the operational stage that a trojanized update
    delivers, and each one should be triaged in its own right. A signed parent does not make its
    children trusted.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What other tools ran on this host around the same time?
  context: A software update rarely stands alone in the surrounding window on a busy endpoint, but
    the binaries that appear alongside it are the read on whether the update was the whole event.
    Scan for discovery commands, credential-access tooling, archive utilities, or scheduling and
    registry tools appearing shortly after the fetch — those are the second-stage activity a
    compromised update is delivered to enable.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: Aggregating parent-child pairs on the host collapses routine agent and service telemetry
    into a few high-count rows while novel pairings stand out at low counts. Scan for parents that
    should not be launching anything, and for the application's own binaries appearing as parents of
    processes they have no reason to start.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Does this host normally run this updater at all?
  context: A host with the application deployed produces updater executions on a regular cadence, so
    a steady history under a consistent account is the expected picture and tells you the software
    is a sanctioned install. A count of zero before this event means the application, or this
    updater path, is new to the host — which turns the question into how it got there.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: When this host has previously fired this update pattern, what parents and users normally
    drive it, and does the current alert fit that history?
  context: The query mirrors the rule's selection scoped to this host, so the parent/user
    distribution reflects how this specific release-path fetch has run here rather than generic
    updater usage. A count of zero means the host has not previously pulled from this version path.
    A new parent process or an unexpected account against an established history is the deviation
    worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \3CXDesktopApp\app\update.exe
        CommandLine|contains|all:
        - --update
        - http
        - /electron/update/win32/18.12
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- always_include: true
  question: Has this user previously produced this update pattern, and does that history fit their
    role?
  context: The query mirrors the rule's selection scoped to this user, so the result is their 90-day
    history of this specific release-path fetch aggregated by host rather than generic updater use.
    Updates normally run under whichever account has the application open, or under a service
    principal, so a consistent history under one account on one host is ordinary; the same account
    producing the pattern across many hosts points at a deployment mechanism rather than a person.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \3CXDesktopApp\app\update.exe
        CommandLine|contains|all:
        - --update
        - http
        - /electron/update/win32/18.12
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this parent process historically driven this update pattern here or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal or a machine account, user identity does
    not attribute the behavior; the launch mechanism does. The query mirrors the rule''s selection
    scoped to the alerting parent, giving the 90-day history of that parent driving this fetch. A
    parent already accounting for a large prior count is the product''s own update cycle; a new or
    rare parent means something else called the updater with a release URL.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \3CXDesktopApp\app\update.exe
        CommandLine|contains|all:
        - --update
        - http
        - /electron/update/win32/18.12
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user do across the environment around this time?
  context: Tracking the account's activity across all hosts in the alert window shows whether the
    same identity was active on other endpoints. This is the read on whether the account is simply
    the one logged in where a scheduled update happened to land, or whether it was driving activity
    elsewhere at the same time.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same parent-driven update pattern fire on other hosts in the same window, or is
    the activity isolated to this host?
  context: Under a service principal, asking what else the user did returns agent telemetry from
    every host. The meaningful pivot is the launch mechanism — the query mirrors the rule's selection
    scoped to the alerting parent, fleet-wide, in the alert window. Many hosts pulling the same
    release path in the same window is the signature of a distribution push reaching the estate, and
    the count is the number of endpoints that took the payload.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \3CXDesktopApp\app\update.exe
        CommandLine|contains|all:
        - --update
        - http
        - /electron/update/win32/18.12
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Have other hosts fired this update pattern in the past week, and does the cross-host
    distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of
    this specific release-path fetch rather than the updater's general footprint. Because updates are
    pushed to every deployment at once, a wide host distribution is the expected outcome here and is
    also the exposure list — treat it as the inventory of endpoints that pulled this version and need
    their installed build and loaded modules checked, not as evidence of normality.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \3CXDesktopApp\app\update.exe
        CommandLine|contains|all:
        - --update
        - http
        - /electron/update/win32/18.12
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host may show what preceded the fetch, and detections in
    the hours after it are the more informative direction for this pattern — a payload delivered
    through an update becomes visible as the module loads, discovery commands, and outbound
    connections that follow. The ordering of alerts reconstructs the timeline and indicates how far
    back the activity started.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
