name: Dllhost.EXE Execution Anomaly
id: 76fc36d0-e719-450b-8332-64a729f7d343
description: |
  Detects a dllhost.exe process that started with no command-line arguments. A legitimate
  COM Surrogate is launched by the DCOM service control manager with a 'dllhost.exe /Processid:{GUID}'
  argument that names the AppID/CLSID it hosts; a dllhost.exe with a bare command line and no
  /Processid GUID is atypical and is consistent with manually spawned COM-surrogate-style process
  injection or process hollowing into the signed dllhost.exe image. Investigation should confirm the
  missing /Processid argument, identify the parent that launched it, and check whether the process
  acquired handles to or loaded credential-access modules consistent with injection rather than normal
  COM hosting.
type: detection
detection_id: e7888eb1-13b0-4616-bd99-4bc0c2b054b9
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Did dllhost.exe start with no /Processid argument, exactly as this rule detects?
  context: Confirm the alert is a true positive by reviewing the triggering event. A legitimate COM
    Surrogate runs as 'dllhost.exe /Processid:{GUID}'; this rule fires only when the command line is a
    bare dllhost reference with no /Processid GUID. Verify the recorded CommandLine has no /Processid
    clause before investing further time.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to run a COM Surrogate launched without a /Processid argument?
  context: A normal COM Surrogate is always started by the DCOM launcher with a /Processid GUID, so an
    argument-free dllhost.exe is not something a user or routine workload produces on purpose. Knowing
    the host role and the account the process ran under helps separate an unusual but explainable
    condition from operator-driven injection.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What does the full dllhost.exe command line show, and is the /Processid GUID genuinely absent?
  context: The COM Surrogate's command line is the primary tell. A legitimate instance reads
    'dllhost.exe /Processid:{AppID-or-CLSID-GUID}'; the absence of that clause is the anomaly this rule
    keys on. Confirm no /Processid GUID is present and note any other tokens, since a hollowed or
    manually spawned dllhost typically carries only the bare image name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this dllhost.exe, and is that parent expected for a COM Surrogate?
  context: A legitimate COM Surrogate's parent is 'svchost.exe -k DcomLaunch -p', because COM activation
    runs over DCOM. Any other parent is the strongest single deviation here. Parents such as scrcons.exe,
    Office applications, script hosts, or an application updater point toward WMI-event-driven execution,
    side-loading, or injection rather than normal surrogate hosting.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did this dllhost.exe or a child of it write a file consistent with a credential or memory dump pulled from a sensitive process such as lsass.exe?
  context: A hollowed or injected dllhost.exe used for credential access would need to open a read handle
    into lsass.exe or another sensitive process, but that handle-open itself generates no event in this
    environment — there is no telemetry channel that records it, regardless of what is collected. The only
    observable trace of a successful read is the file it produces. Review file-write activity from this
    dllhost.exe and any processes it spawned for dump-like artifacts in writable staging paths, and treat
    an empty result as a coverage gap on the handle-access step, not as proof no credential material was read.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did this dllhost.exe load credential-access or injection-related modules such as samlib.dll or vaultcli.dll?
  context: A genuine COM Surrogate loads the InProcServer32 DLL for the AppID it hosts and little else.
    Concurrent loads of samlib.dll and vaultcli.dll are a frequent credential-access fingerprint, and
    loads of unsigned or unexpected modules from user-writable paths point to injection into the signed
    dllhost.exe image. Review which modules were mapped and their signing status.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \dllhost.exe
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
- question: What child processes did this dllhost.exe spawn afterward?
  context: A normal COM Surrogate rarely spawns children. Subsequent processes such as cmd.exe,
    powershell.exe, certutil.exe, or rundll32.exe launched by this dllhost.exe reveal the operational
    impact of the injected code and point toward reconnaissance, download, or further execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run dllhost.exe, and how often?
  context: dllhost.exe runs routinely on most Windows hosts as the COM Surrogate, so raw frequency alone
    is not decisive — but a sharp change or a host that rarely sees it adds weight. Pair the count with
    the command-line and parent findings, since the anomaly is the missing /Processid argument, not the
    binary itself.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this argument-free dllhost.exe pattern, what parents and users drove it, and does the current alert fit?
  context: The query mirrors the rule's selection scoped to this host, so the resulting parent and user
    distribution reflects how this specific firing pattern has historically run here rather than generic
    dllhost.exe usage. A new parent process or an unexpected account compared with that history is the
    deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \dllhost.exe
        CommandLine:
        - dllhost.exe
        - dllhost
      filter_main_null:
        CommandLine: null
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \dllhost.exe
        CommandLine:
        - dllhost.exe
        - dllhost
      filter_main_null:
        CommandLine: null
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \dllhost.exe
        CommandLine:
        - dllhost.exe
        - dllhost
      filter_main_null:
        CommandLine: null
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this account do across the network around this time?
  context: Tracking the owning account's activity across all hosts reveals lateral movement or parallel
    activity on multiple endpoints. If the same account drove similar dllhost.exe activity elsewhere in
    the window, the scope of the activity may be broader than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \dllhost.exe
        CommandLine:
        - dllhost.exe
        - dllhost
      filter_main_null:
        CommandLine: null
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the processes that ran just before and after the
    dllhost.exe anomaly reveals what triggered it and what followed, and whether it sits inside a larger
    sequence such as reconnaissance, privilege escalation, or persistence. Novel parent-child pairs at
    low counts are what to scan for against the high-count routine noise.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts fired this argument-free dllhost.exe pattern in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count
    of this specific firing pattern rather than generic dllhost.exe usage. Many hosts firing the same
    pattern points to a scripted deployment or a broadly distributed trigger; one host or a small unrelated
    set points to manual operator activity. Use the host spread to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \dllhost.exe
        CommandLine:
        - dllhost.exe
        - dllhost
      filter_main_null:
        CommandLine: null
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential access —
    may reveal the stages that preceded this event and help reconstruct the timeline. Correlating the
    timing of those alerts with this dllhost.exe anomaly shows whether it is the next step in an ongoing
    sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
