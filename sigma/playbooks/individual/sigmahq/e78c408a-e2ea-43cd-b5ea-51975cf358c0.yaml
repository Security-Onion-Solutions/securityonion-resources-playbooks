name: Disable Windows Firewall by Registry
id: f6fa4afd-2ac3-4dcf-b55f-d3e3fa04d5f1
description: |
  Detects a registry write that sets EnableFirewall to 0 (DWORD 0x00000000) under a Windows Firewall
  policy key for either the Domain profile or the Standard profile, which turns off the Windows Defender
  Firewall for that profile. Legitimate changes normally arrive through Group Policy processing or a
  managed configuration agent; a direct write from reg.exe, PowerShell, or an unexpected parent points to
  hands-on tampering. Disabling the firewall removes inbound filtering, so the investigation should
  establish which profile was disabled, whether the change persists, what process and user made it, and
  whether new inbound connectivity or other tampering followed.
type: detection
detection_id: e78c408a-e2ea-43cd-b5ea-51975cf358c0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting write set EnableFirewall to 0 on a Domain or Standard firewall policy key?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires when a write lands on either
    the Domain profile or the Standard profile EnableFirewall policy value with data of DWORD 0x00000000.
    Note which profile branch fired from the TargetObject path, because the disabled profile determines which
    network zone lost its inbound filtering and drives the downstream exposure questions.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify Windows Firewall policy settings?
  context: >-
    Firewall policy values are normally set by Group Policy processing or a managed configuration agent, not
    by an interactive user. Compare the writing user and host against the accounts authorized to manage
    firewall settings and against approved change windows. A machine account or SYSTEM is expected for
    policy-driven writes; an interactive or unexpected account writing the value directly is the signal.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value was written to the firewall policy key, and what protection does setting it to 0 remove?
  context: >-
    EnableFirewall set to DWORD 0x00000000 turns off the Windows Defender Firewall for the affected profile,
    permitting inbound connections that the profile would otherwise block. Read the Details value to confirm
    the 0 write. If the same operation also widened rule scope from a subnet or local scope toward Any or
    0.0.0.0/0, that broadens exposure further and should be captured alongside the disable.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Is this firewall policy key a known evasion location, and what process wrote it?
  context: >-
    The path under SOFTWARE\Policies\Microsoft\WindowsFirewall for the Domain or Standard profile is a
    policy-enforced firewall control. Writes should originate from the Group Policy client. A direct write by
    reg.exe, powershell.exe, or another interactive tool is a defense-evasion pattern. Use the writing Image to
    judge whether the change came from managed configuration or from a hands-on process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What command wrote this firewall registry value, and does it confirm the firewall was the target?
  context: >-
    The full command line of the writing process names the control that was targeted. Direct registry disables
    commonly appear as a reg add against the profile key with EnableFirewall set to 0, or as a PowerShell
    New-ItemProperty on the same path. Compare the command against the tools sanctioned to change firewall
    settings to separate approved administration from tampering.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the disabled-firewall value persist, or was it re-enabled afterward?
  context: >-
    Endpoint telemetry does not emit registry value-deletion events, so attacker cleanup of the value is not
    directly observable. Judge persistence from the re-modification history of this key over a longer window,
    looking for a later write returning EnableFirewall to 1, and from whether the payload the disable was meant
    to enable ran. A value that stays at 0 means the profile remains unprotected.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process spawned the tool that modified the firewall registry, and is that parent chain expected?
  context: >-
    The parent process reveals how the firewall change was launched. Expected parents include the Group Policy
    client and managed configuration agents such as a software-deployment or MDM agent. A command interpreter
    or script host launched from an Office application, a browser, or an unsigned binary is an exploitation or
    hands-on pattern rather than routine administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Is the Windows Firewall currently re-enabled, or is the host still exposed?
  context: >-
    Tampering may be momentary or lasting. Check the current firewall state for the affected profile by direct
    host inspection or endpoint management. If EnableFirewall is still 0, the profile remains unprotected and
    should be restored before further investigation so the host is not left open to inbound connections during
    triage.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did new inbound connections to sensitive ports reach this host after the firewall was disabled?
  context: >-
    Disabling the firewall removes inbound filtering, which prepares a host for lateral movement or inbound C2.
    Within the exposure-correlation window after the change, look for ingress connections to remote-management
    and file-sharing ports such as RDP 3389, SMB 445, WinRM 5985 and 5986, and SSH 22. Inbound sessions on
    these ports that did not appear before the disable are the exposure this technique enables.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'false'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationPort
      - SourceIp
- question: Did the Security log record firewall service or policy changes around this time?
  context: >-
    Windows can audit firewall state directly. A firewall service stop, a changed firewall setting, or a rule
    added, modified, or deleted corroborates the registry disable and can show scope widening that the registry
    value alone does not. If firewall auditing is not enabled in this environment, treat an empty result as a
    visibility gap rather than evidence that nothing changed.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4950
          - 5025
          - 4946
          - 4947
          - 4948
      condition: selection
    fields:
      - EventID
- question: What process activity occurred on this host after the firewall was disabled?
  context: >-
    Defenses are disabled to enable something that would otherwise be blocked or exposed. Examining process
    activity in the window after the change surfaces the follow-on actions the disable was meant to permit,
    such as remote-access tooling, credential access, or payload execution that relies on inbound reachability.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense tampering actions performed on this host?
  context: >-
    Actors who disable one control often disable several, stopping antivirus and clearing logs and deleting
    shadow copies in the same operation to broaden their coverage. Finding additional tampering commands from
    the same user or parent process shows the firewall disable was part of a wider effort to remove defenses
    rather than an isolated change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Were other registry modifications made on this host in the same session?
  context: >-
    A firewall disable often travels with other registry changes, such as a Run key for persistence or a policy
    write that weakens another protection. Grouping registry writes on this host in the surrounding window by key
    path and writing process reveals whether multiple objectives were pursued together, which points to a
    hands-on session or an installer-style implant rather than a single setting change.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has this firewall policy key been modified before on this host?
  context: >-
    Firewall policy values should rarely change outside a Group Policy refresh, so a key with little or no prior
    modification history is more notable than one that changes routinely. Compare the historical Details values
    and writing processes to see whether this write matches an established pattern or is a first-time direct
    change to the profile.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this firewall policy key modified on other hosts in the environment?
  context: >-
    The same firewall disable across many hosts may be a Group Policy push or a widespread action, while a change
    confined to this host suggests targeting. Compare the writing process and the Details value across hosts to
    separate a centrally managed change, which typically shows a consistent process and value, from ad hoc
    tampering that varies host to host.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity on the host in the surrounding window
    collapses routine agent noise into high-count rows while novel parent-child pairs stand out at low counts.
    Scan for reconnaissance, privilege escalation, or remote-access tooling that brackets the firewall change and
    places it in a larger sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host can reveal the stages that preceded the firewall change. Reconnaissance,
    credential access, or an initial-access alert followed by defense tampering helps reconstruct the timeline and
    indicates whether the disable is one step in a longer operation rather than a standalone event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were process-based persistence mechanisms installed on this host?
  context: >-
    Firewall disabling to enable inbound access often accompanies persistence so the foothold survives a reboot.
    Look for scheduled tasks, services, registry Run keys, or BITS jobs created in the surrounding window from the
    same actor. Multiple persistence installations in the same timeframe indicate intentional stacking rather than
    isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
