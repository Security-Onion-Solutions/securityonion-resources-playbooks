name: Suspicious DNS Query Indicating Kerberos Coercion via DNS Object SPN Spoofing
id: fd720943-e6cf-4cc5-ae0e-3122ea939bf6
description: |
  Fires when a host resolves a DNS name whose query string carries a base64-encoded marshaled CREDENTIAL_TARGET_INFORMATION signature (the query name contains both the 'UWhRCA' and 'BAAAA' tokens). That signature is planted by coercion tooling (for example the DNS-record-registration step of CVE-2025-33073) so that a victim's SMB/Kerberos client resolves an attacker-crafted hostname and then authenticates to attacker-controlled infrastructure, letting the adversary relay that authentication (NTLM reflection or Kerberos relay) to a real service and act as the coerced machine account.
  The querying process is frequently a SYSTEM/service process (such as lsass.exe) driven by a forced-authentication coercion rather than a user action, so there is essentially no benign cause other than an authorized penetration test or red-team exercise. Investigation should confirm the crafted query name, decode which service the marshaled target info points at, determine whether the host then made outbound SMB/Kerberos authentication to an untrusted host, and check whether other hosts show the same coercion pattern.
type: detection
detection_id: e7a21b5f-d8c4-4ae5-b8d9-93c5d3f28e1c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the queried name carry the marshaled target-info signature this rule detects, and which host and process issued it?
  context: Confirm the alert by reviewing the exact query name (QueryName) against the rule's criteria — the name must contain both the 'UWhRCA' and 'BAAAA' tokens that mark a base64-encoded marshaled CREDENTIAL_TARGET_INFORMATION blob — and note the querying process and whether the lookup resolved. A DNS alert carries the queried name and the querying process, not a destination IP.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
- question: Is this host expected to resolve external hostnames of this form, and is the querying process one that normally performs external name resolution?
  context: Coercion forces a SMB/Kerberos client — often a SYSTEM or service process such as lsass.exe — to resolve an attacker-crafted hostname. A service/machine account resolving an unusual external name is far more suspicious than an interactive user browsing. Knowing the host role and the querying process is the fastest way to separate a forced-authentication event from routine name resolution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is there an authorized penetration test or security assessment window that could explain this coercion pattern?
  context: A sanctioned red-team or penetration-testing exercise is realistically the only benign cause of a query name carrying a marshaled target-info signature. Confirm whether an approved assessment covering NTLM/Kerberos coercion was running against this host or subnet at the time; absence of one points to unsanctioned coercion. Check whether the timing lines up with any documented testing window or maintenance activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What is the full queried name, is the resolved host attacker-controlled, and did the lookup resolve to an IP?
  context: The alert is a DNS lookup, not a connection. Investigate the full query name — the marshaled-target-info hostname resolves to whatever the attacker registered (WHOIS/registration age, passive DNS, threat intel on the parent domain). Check whether the query resolved (dns.resolved_ip) and whether that IP is external and unexpected rather than a legitimate internal host, because the coerced authentication is sent to the resolved address.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: Which service and target host does the marshaled target info point at?
  context: The base64 blob embedded in the crafted hostname (visible in the alert and in the domain-decode results) is a marshaled CREDENTIAL_TARGET_INFORMATION structure that encodes the service class and target the coerced authentication is relayed to — CIFS, HTTP, LDAP, or HOST plus the target hostname, following the CLASS/INSTANCE SPN format. Decode it to identify which real service the relay aims at — an SMB or LDAP target on a domain controller is a domain-compromise path, while a workstation target is narrower. Cross-reference the decoded target with the machine account that would be relayed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Has this host resolved this name (or names carrying this signature) before?
  context: A first-time resolution of an attacker-crafted hostname is far more suspicious than routine name resolution. Zero or very low historical counts for this query on this host indicate a new, unusual lookup consistent with a one-off coercion rather than an established service dependency.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: Did other hosts resolve hostnames carrying the same credential-target-info signature?
  context: Coercion campaigns typically target more than one host, and each spoofed target uses its own marshaled hostname while sharing the same signature tokens. Re-running the rule's own detection across the fleet surfaces every host that resolved a coercion query name over the past week — a burst across multiple hosts indicates an active operation rather than an isolated test, and reveals which machine accounts may already have been relayed.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        QueryName|contains|all:
          - UWhRCA
          - BAAAA
      condition: selection
    fields:
      - host.name
      - QueryName
      - Image
- question: Did other hosts in the environment resolve this same query name?
  context: If only this host resolved the crafted name, the coercion is likely targeted at it. If many hosts resolved the same name, a shared lure or a broader operation is in play. The distribution across hosts informs whether the response is a single-host containment or a wider incident.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - host.name
      - Image
- question: What other domains did the querying process look up around the same time?
  context: The querying process may have resolved other names as part of the same coercion or a staged operation. Reviewing every domain that process looked up in the surrounding window can reveal additional spoofed targets, attacker infrastructure, or beaconing. Anchor on the querying process rather than the single crafted name.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: Did this host make outbound SMB, Kerberos, or other remote-access connections to an untrusted host after the query?
  context: The point of the coercion is to make the host authenticate outbound to the attacker's resolved address so the auth can be relayed. This query returns outbound connections from this host to remote-access ports -- 445 (SMB), 3389 (RDP), 5985/5986 (WinRM), 22 (SSH) -- in the hours after the event; the originating Image and User show what drove each connection, and an outbound 445/SMB session to an unexpected external address is the direct follow-through of DNS-driven coercion. If network-connection telemetry is not collected from this host, treat zero rows as a visibility gap rather than evidence no authentication occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Which account would be relayed by this coercion, and does it hold elevated privileges?
  context: When a SYSTEM/service process is coerced, the credential relayed is the host's own machine account; the severity depends on what that account can reach. A domain controller or server machine account being relayed to LDAP/SMB can enable domain-level changes and requires escalation, while a workstation account is more contained. Cross-reference the coerced host's computer account and any privileged user sessions on it with directory group memberships.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What other activity occurred on this host around the time of the alert?
  context: 'Coercion rarely occurs in isolation. Examining activity around the alert reveals the immediate context: how the coercion was triggered, what ran before and after, and whether reconnaissance, credential access, or persistence accompanied it. Novel parent-child process pairs at low counts are what to scan for.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access, or an initial foothold — may reveal the stages that preceded the coercion and help reconstruct the timeline. The sequence of alerts on the host tells the attack story leading up to the forced authentication.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were process-based persistence mechanisms installed on this host around the coercion?
  context: A successful relay can grant SYSTEM-level access, after which attackers commonly install persistence using scheduled tasks, services, registry Run keys, or BITS jobs. Multiple persistence installations in the same timeframe as the coercion indicate intentional foothold-building rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations (Startup folders, scheduled-task definitions) on this host?
  context: File-based persistence bypasses command-line detection entirely. Dropping an executable or script into the Startup folder or a path referenced by a registry Run key achieves persistence without running schtasks, sc, or reg. File event monitoring captures these drops even when the attacker avoids standard persistence tools, which is relevant if a relay granted local write access.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
