name: System Scripts Autorun Keys Modification
id: b0e2efec-86c0-4bb0-ac52-9977e5877494
description: |
  Detects modification of the Group Policy scripts autostart extensibility points under
  \Software\Policies\Microsoft\Windows\System\Scripts, where Windows registers startup, shutdown,
  logon, and logoff scripts (T1547.001). The rule fires when the written key path sits under the
  System\Scripts policy branch AND names one of the Startup, Shutdown, Logon, or Logoff script
  lists, and the written value data is not empty. Group Policy processing legitimately rewrites
  these keys during policy refresh on domain-joined hosts, so the same entry appearing fleet-wide
  usually reflects a deployed policy, while a single-host write from an interactive process points
  to a locally planted script entry. Investigation should confirm the exact key and value written,
  identify and verify the referenced script, attribute the writing process and its lineage, and
  determine whether the change matches an approved policy deployment or a persistence attempt.
type: detection
detection_id: e7a2fd40-3ae1-4a85-bf80-15cf624fb1b1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting write target a Group Policy scripts autorun key with non-empty value
    data?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires
    when the written key path contains \Software\Policies\Microsoft\Windows\System\Scripts AND one
    of the \Startup, \Shutdown, \Logon, or \Logoff script lists, and the written value data is not
    the literal "(Empty)". Review the exact key path (TargetObject) and value data (Details) against
    those criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which script list was modified, and what does this Group Policy scripts entry control?
  context: The key path reveals when the payload runs. Entries under Scripts\Startup and
    Scripts\Shutdown execute at machine boot and shutdown under the SYSTEM account; entries under
    Scripts\Logon and Scripts\Logoff execute at session start and end in the logging-on user's
    context. The numbered subkeys carry Script and Parameters values naming the payload, making this
    branch a script-based autostart location that persists without any Run-key or scheduled-task
    artifact.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What script path and parameters does the value data reference, and is that payload
    known and legitimate?
  context: The Details field carries the value data — typically the script path (.bat, .cmd, .ps1,
    .vbs) for a Script value or its arguments for a Parameters value. Domain policy scripts
    normally resolve to the SYSVOL share or the local GroupPolicy directory; paths into Temp,
    AppData, ProgramData, or Public are not standard for policy scripts. Value data is present on
    roughly four of five registry writes; when it is empty or binary, pivot to the writing process
    instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Is this write consistent with Group Policy processing, or did a user or unexpected
    process set the script entry?
  context: On domain-joined hosts these keys are normally written by the Group Policy client during
    policy refresh, running as SYSTEM from a service host process. An interactive user account or an
    unexpected writing process setting a scripts entry directly is the pattern worth scrutiny. User
    attribution is present on most endpoint registry events; when it is a machine account or SYSTEM,
    judge from the writing process and its lineage instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What launched the process that wrote this scripts entry?
  context: The registry write's own Image is the writing process; tracing its parent reveals whether
    the write came from the policy engine's service chain or from an interactive shell, script host,
    or Office application spawned by a macro or exploit. The lineage is the core signal for
    attributing who set the script entry.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this scripts key been written on this host before?
  context: Group Policy refresh rewrites deployed script entries on a recurring schedule, so a
    legitimate entry usually has history on the host with identical value data each time. Zero
    history for this key indicates a first-time modification, and a Details value that differs from
    the recurring baseline indicates the entry was changed. Compare the historical Details values
    and writing processes.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Were other registry keys modified on this host in the same session?
  context: Attackers who plant one autostart entry often make several changes together — additional
    persistence keys, security-policy edits, or configuration changes. Clustering registry writes
    from the same process or user in a short window reveals the full scope of the change and whether
    multiple objectives were pursued. The triggering key will appear in the results; the signal is
    what else was modified alongside it.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Did the Group Policy script runner execute on this host after the key was written?
  context: Script entries in this branch execute via gpscript.exe — at the next boot or shutdown for
    machine script lists, or at the next logon or logoff for user script lists. The 5-10 minute
    write-to-execution window typical of Run-key persistence does not apply; execution is gated on
    the next boot or session event, so absence within a day does not rule the persistence out.
    Compare gpscript.exe runs and the script hosts they spawned against the script named in the
    value data.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_runner:
        - Image|endswith: '\gpscript.exe'
        - ParentImage|endswith: '\gpscript.exe'
      condition: selection and selection_runner
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Were script files or script-policy manifests written under the local Group Policy
    directories around the alert?
  context: The registry entries in this branch mirror the scripts.ini and psscripts.ini manifests
    stored under the local GroupPolicy directory tree, and locally planted script persistence
    typically writes the manifest and drops the script payload there in the same session as the
    registry change. File writes to these paths from anything other than the policy engine, or a
    payload dropped alongside the manifest, corroborate a hand-crafted entry rather than a deployed
    policy.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\GroupPolicy\'
      selection_scripts:
        TargetFilename|contains:
          - '\Scripts\'
          - 'scripts.ini'
          - 'psscripts.ini'
      condition: selection and selection_scripts
    fields:
      - TargetFilename
      - Image
- question: Is the script referenced by the value present on disk, and does the change survive
    reboot?
  context: Script persistence only works if the referenced script exists at the written path.
    Correlating file activity by the writing process and its children shows whether the payload
    was dropped in the same session. The file-write event carries no hash; if the
    script is present, hash it from a later execution for a reputation lookup. Registry deletion
    is not observable on endpoint telemetry, so judge durability from the key's
    re-modification history and whether the configured script executed.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other activity occurred on this host around the time of the alert?
  context: Autostart changes rarely occur in isolation. Reviewing process activity in a tight window
    around the write reveals what led to it and what followed — reconnaissance, payload staging, or
    additional persistence. Novel parent-child pairs stand out at low counts against the repetitive
    background of agent telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier alerts on the same host — defense tampering, reconnaissance, or credential access
    — may reveal the stages that preceded the persistence write and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was this same scripts key modified on other hosts in the environment?
  context: A deployed Group Policy writes identical script entries across many domain hosts near the
    policy refresh interval, so fleet-wide appearances with matching value data usually reflect
    administration. The same key changing on only this host, or carrying value data that differs
    from the rest of the fleet, points to a locally configured entry. Compare the value data and
    writing processes across hosts.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Were other process-based persistence mechanisms installed on this host?
  context: Attackers rarely rely on a single autostart entry. After planting a logon or startup
    script, they commonly add backups via scheduled tasks, services, or registry Run keys.
    Persistence-tool executions clustered in the same timeframe point to intentional stacking
    rather than an isolated administrative change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup folders or scheduled-task definition paths on this host?
  context: File-based persistence bypasses registry and command-line detection. A binary or script
    placed in a Startup folder achieves autostart without any policy-scripts entry, so a drop there
    alongside the detected write indicates parallel persistence mechanisms; file monitoring
    captures these drops even when the attacker avoids standard persistence tools.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Was this scripts change part of an approved Group Policy deployment or maintenance
    window?
  context: Logon and startup scripts are normally deployed through documented policy changes. A
    matching change record or policy-deployment ticket points to authorized activity; its absence
    when policy requires one raises the priority. This check can quickly close a false positive or
    escalate a true positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
