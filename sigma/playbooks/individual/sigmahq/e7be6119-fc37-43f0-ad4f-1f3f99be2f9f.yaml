name: Copying Sensitive Files with Credential Data
id: eebfce64-b68a-46c3-9b54-d129bd51f8dc
description: |
  Fires when a process either runs esentutl.exe with copy/snapshot switches (vss, /m, /y) or
  references the on-disk locations of credential-bearing files on its command line — the SAM,
  SYSTEM, and SECURITY registry hives (in config, config\RegBack, or repair) or the domain
  database ntds.dit. esentutl.exe is a Microsoft-signed ESE database utility whose /vss switch
  invokes Volume Shadow Copy to read files that are locked while Windows is running, making it a
  living-off-the-land primitive for grabbing hives and ntds.dit without third-party tooling.
  Legitimate backup software and incident-response collection can produce the same command lines,
  so the investigation should determine which firing branch matched, what credential store was
  targeted, whether the access fits an approved backup or IR workflow, and whether the copied
  data was staged or moved off the host.
type: detection
detection_id: e7be6119-fc37-43f0-ad4f-1f3f99be2f9f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Did this event match the esentutl copy/snapshot branch or the sensitive-hive-path branch?
  context: >-
    This rule fires on either of two independent branches. One branch matches esentutl.exe (by Image
    or OriginalFileName) running with vss, /m, or /y on its command line. The other branch matches any
    process whose command line references a credential-bearing file path — the SAM, SYSTEM, or SECURITY
    hive under config, config\RegBack, or repair, or windows\ntds\ntds.dit. Read the full Image,
    OriginalFileName, and CommandLine and note which branch fired; the binary identity and path checks
    downstream carry different weight depending on the branch.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to copy credential hives or run esentutl snapshot copies?
  context: >-
    Backup operators, domain controllers under approved backup jobs, and incident responders running
    live-collection tooling legitimately copy hives and ntds.dit. Knowing whether the account role and
    host function fit an approved backup or IR workflow is often the fastest way to separate routine
    activity from credential theft.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What credential store was targeted, and were SAM, SYSTEM, and SECURITY all copied?
  context: >-
    The targeted store determines which accounts are exposed. SAM yields local-account hashes; SECURITY
    holds LSA secrets and cached domain credentials; SYSTEM holds the SysKey needed to decrypt the
    others; ntds.dit holds every domain-account hash. Saving SAM, SYSTEM, and SECURITY together (or
    pairing a hive with ntds.dit) indicates intent to extract credentials offline. Read the command line
    to identify the exact source paths and destination.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Was a Volume Shadow Copy created or listed on this host around the time of the alert?
  context: >-
    Reading a locked hive or ntds.dit while Windows is running requires a shadow copy. esentutl /vss
    invokes Volume Shadow Copy itself, but operators also create snapshots separately with vssadmin or
    diskshadow before copying. Snapshot creation or listing in the same window as the alert ties the copy
    to a deliberate dump sequence rather than an isolated command.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_vss:
        Image|endswith:
          - '\vssadmin.exe'
          - '\diskshadow.exe'
          - '\wmic.exe'
        CommandLine|contains:
          - 'shadow'
      condition: selection_host and selection_vss
    fields:
      - Image
      - CommandLine
      - User
- question: Were copies of hive or ntds.dit files written to disk on this host near the alert?
  context: >-
    A successful copy leaves a destination file — commonly a .hive, .save, .dit, or .dmp under a writable
    staging directory such as a temp folder, C:\Users\Public, or another operator-chosen path. File-create
    evidence for these artifacts confirms the copy completed and points to where the stolen data was
    staged for pickup.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_name:
        TargetFilename|contains:
          - 'ntds.dit'
          - '\SAM'
          - '\SYSTEM'
          - '\SECURITY'
          - '.hive'
          - '.save'
          - '.dit'
      condition: selection_host and selection_name
    fields:
      - TargetFilename
      - Image
      - User
- question: Were the SAM, SYSTEM, or SECURITY hives exported through the registry on this host?
  context: >-
    Copying the on-disk hive files is one route to the same credentials; a registry save (reg save,
    reg.exe save, or a PowerShell equivalent against HKLM\SAM, HKLM\SYSTEM, or HKLM\SECURITY) is the
    other. Checking for hive exports run alongside the alerting activity shows whether the operator
    pursued the registry path in parallel with the file-copy path.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_save:
        CommandLine|contains|all:
          - 'save'
        CommandLine|contains:
          - 'hklm\sam'
          - 'hklm\system'
          - 'hklm\security'
      condition: selection_host and selection_save
    fields:
      - Image
      - CommandLine
      - User
- question: What process spawned this binary, and is that parent chain expected for a credential-hive copy?
  context: >-
    The parent reveals how the copy was launched. Approved backups and IR collection usually descend from
    a known scheduler, backup-agent service, or operator console. An interactive shell, a script host such
    as wscript.exe or mshta.exe, or a remote-execution parent like wmiprvse.exe points toward hands-on or
    remotely driven credential theft.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When the esentutl branch fired, was esentutl.exe run from its expected System32 or SysWOW64 path?
  context: >-
    esentutl.exe normally lives in System32 or SysWOW64. Execution from a temp folder, a user profile, or
    another writable directory suggests the binary was copied or renamed to evade path-based allowlisting.
    This check is load-bearing when the esentutl branch fired; when only the sensitive-path branch matched,
    the binary may be cmd.exe or another copy tool and the original-name comparison identifies what
    performed the copy.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Were any other download or extraction LOLBins used on this host recently?
  context: >-
    Operators who reach for one living-off-the-land binary often use several. Other binaries capable of
    copying, expanding, or transferring locked or sensitive files appearing on this host in the prior day
    broaden the picture of the credential-collection activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\diskshadow.exe'
          - '\ntdsutil.exe'
          - '\reg.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_esent_img:
      - Image|endswith: \esentutl.exe
      - OriginalFileName: \esentutl.exe
      selection_esent_cli:
        CommandLine|contains|windash:
        - vss
        - ' /m '
        - ' /y '
      selection_susp_paths:
        CommandLine|contains:
        - \config\RegBack\sam
        - \config\RegBack\security
        - \config\RegBack\system
        - \config\sam
        - \config\security
        - '\config\system '
        - \repair\sam
        - \repair\security
        - \repair\system
        - \windows\ntds\ntds.dit
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_esent_* or selection_susp_paths) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_esent_img:
      - Image|endswith: \esentutl.exe
      - OriginalFileName: \esentutl.exe
      selection_esent_cli:
        CommandLine|contains|windash:
        - vss
        - ' /m '
        - ' /y '
      selection_susp_paths:
        CommandLine|contains:
        - \config\RegBack\sam
        - \config\RegBack\security
        - \config\RegBack\system
        - \config\sam
        - \config\security
        - '\config\system '
        - \repair\sam
        - \repair\security
        - \repair\system
        - \windows\ntds\ntds.dit
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_esent_* or selection_susp_paths) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment in the hour around the alert?
  context: >-
    Tracking the account across all hosts in the alert window reveals whether credential collection was
    confined to this host or part of activity spanning several endpoints. The same account driving similar
    copies elsewhere widens the scope of the investigation.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_esent_img:
      - Image|endswith: \esentutl.exe
      - OriginalFileName: \esentutl.exe
      selection_esent_cli:
        CommandLine|contains|windash:
        - vss
        - ' /m '
        - ' /y '
      selection_susp_paths:
        CommandLine|contains:
        - \config\RegBack\sam
        - \config\RegBack\security
        - \config\RegBack\system
        - \config\sam
        - \config\security
        - '\config\system '
        - \repair\sam
        - \repair\security
        - \repair\system
        - \windows\ntds\ntds.dit
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_esent_* or selection_susp_paths) and _pb_scope
    fields:
    - host.name
- question: How often has this host fired the rule's pattern over the past 90 days, and what command-line structures are typical?
  context: >-
    A copy pattern with no prior history on a host is more suspicious than one that recurs under stable
    parents, such as a nightly backup. The query mirrors the rule's selection structure scoped to this host,
    so the count reflects the rule's specific firing pattern rather than generic esentutl usage. The
    command-line projection lets typical invocation patterns be compared against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_esent_img:
      - Image|endswith: \esentutl.exe
      - OriginalFileName: \esentutl.exe
      selection_esent_cli:
        CommandLine|contains|windash:
        - vss
        - ' /m '
        - ' /y '
      selection_susp_paths:
        CommandLine|contains:
        - \config\RegBack\sam
        - \config\RegBack\security
        - \config\RegBack\system
        - \config\sam
        - \config\security
        - '\config\system '
        - \repair\sam
        - \repair\security
        - \repair\system
        - \windows\ntds\ntds.dit
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_esent_* or selection_susp_paths) and _pb_scope
    fields:
      - CommandLine
- question: Which accounts may be exposed by the targeted store, and do any have elevated privileges?
  context: >-
    Severity scales with the privilege of the exposed accounts. A SAM grab exposes local accounts on one
    host; a SECURITY hive exposes cached domain and service-account credentials; ntds.dit exposes every
    domain account including Domain Admins and krbtgt. Cross-reference the targeted store with directory
    group memberships to size the exposure and decide on escalation and credential rotation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Credential collection rarely stands alone. Earlier detections on the same host — defense tampering,
    reconnaissance, privilege escalation — may reveal the stages that preceded the copy and help
    reconstruct how the operator reached the point of grabbing credential files.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
