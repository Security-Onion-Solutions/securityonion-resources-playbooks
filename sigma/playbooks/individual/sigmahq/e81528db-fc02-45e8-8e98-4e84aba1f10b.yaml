name: Network Connection Initiated Via Notepad.EXE
id: 19a67765-3c36-46b9-aa1b-7524bd627838
description: |
  Detects an outbound network connection initiated by notepad.exe, excluding traffic to destination
  port 9100 (raw print jobs). Notepad has almost no legitimate reason to reach the network beyond
  printing, so a connection from it typically means code was injected into the process - attack
  frameworks commonly spawn or migrate into a sacrificial notepad.exe and run a payload stager
  inside it, and that injected code, not notepad itself, opens the connection. Determine what the
  destination is, how this notepad instance was launched and by what parent, whether injection-side
  API calls or unexpected module loads corroborate injection, and whether the connection pattern
  resembles command-and-control check-ins.
type: detection
detection_id: e81528db-fc02-45e8-8e98-4e84aba1f10b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Did notepad.exe initiate this connection, and is the destination port something other than 9100?
  context: Confirm the alert by reviewing the initiating process image, the destination IP and port, and the direction. The rule fires when the initiating image ends in \notepad.exe and the destination port is not 9100, the raw-printing exclusion. On this telemetry the network category mixes sensor-level events that carry no process fields with endpoint events that do; a populated image path means the alerting event came from the endpoint subset.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - Image
- question: Is there an expected reason for notepad.exe on this host to generate network traffic?
  context: The main benign cause is printing - notepad reaching a print server or network printer, which typically uses port 9100 (excluded by the rule) but can also use adjacent print-service ports such as 631 or 515. Knowing whether this user was plausibly printing a document at the time, and whether the host's role involves interactive document editing at all, is the fastest way to separate a print-workflow edge case from injected code.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What command line launched this notepad.exe instance, and did it open a document?
  context: Legitimate notepad invocations from an interactive session almost always carry a document path as an argument. Injection targets are typically spawned hidden with a bare command line and no file argument, because the process exists only to host shellcode. An empty or bare command line, or a working directory outside the user's profile, supports the injection reading; a document path plus a plausible print action supports the benign one.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What is this destination, and what do DNS, WHOIS, and threat intel reveal?
  context: 'Investigate the destination: DNS resolution history, WHOIS registration age, TLS certificate details, and known-infrastructure hits. Destination hostname is sparsely recorded on this telemetry because name resolution is a separate event, so treat an empty hostname as expected and pivot through the DNS lookup for the domain. An internal destination could still be a print server or an internal pivot point; an external destination with a young registration or no business relevance points to attacker-controlled infrastructure.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - DestinationPort
- question: Did any process on this host issue process-injection API calls around the alert?
  context: A notepad.exe that beacons out was almost always written into first - the foothold process acquires a handle with write access such as PROCESS_VM_WRITE and issues memory-write primitives before the injected code runs. This surfaces the injection-side calls (WriteProcessMemory, QueueUserAPC, SetWindowsHookEx) recorded by the behavioral API channel; correlate the calling image and the call timing against the notepad process start and the alerting connection. Read-side handle access, such as memory reads, has no telemetry in this channel, so an empty result does not rule injection out - weigh the module-load and parent-chain findings instead.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        event.dataset: endpoint.events.api
        process.Ext.api.name:
          - WriteProcessMemory
          - QueueUserAPC
          - SetWindowsHookEx
      condition: selection
    fields:
      - Image
      - process.Ext.api.name
- question: What modules did this notepad.exe process load, and are any unsigned or unexpected?
  context: Notepad has no networking capability of its own beyond the print path, so injected code frequently pulls networking modules such as ws2_32.dll, winhttp.dll, or wininet.dll into the process, and staged payloads may load unsigned DLLs from user-writable paths. Module loads on this telemetry carry signature status and a hash directly, so an unfamiliar load supports an immediate reputation lookup without any further pivot.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: What process spawned this notepad.exe, and is that parent chain expected?
  context: Interactive notepad use is launched by explorer.exe. Injection workflows spawn a hidden notepad.exe directly from the compromised foothold process, so a browser, Office application, script host, or service binary as the parent points at where the operator is actually running. The network event itself may not carry parent details; this lookup fills them in, and walking one level further up shows what launched the parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What child processes did notepad.exe spawn afterward?
  context: Notepad spawns essentially nothing on its own apart from print-dialog helpers. Injected payloads use the process as a launch point for post-exploitation, so any child - a command interpreter, script host, or download utility - is worth decoding in full. An empty result here does not clear the alert, since a stager can operate entirely in memory without spawning children.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: How often has notepad.exe connected to this destination, and does the timing resemble beaconing?
  context: Command-and-control implants poll their controller at fixed or jittered intervals, so repeated connections from notepad.exe to the same destination across a day differ sharply from the short burst a single print job produces. A high count over the window points to a check-in loop; review the event timestamps for interval regularity, and note the port consistency across the connections.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
- question: Does this host normally communicate with this destination?
  context: First-time connections to a destination are more notable than routine communication. The historical view also shows which processes have contacted this destination before - a print server historically reached by spooler and application processes reads differently from a destination that only this notepad.exe instance has ever touched. Port variation across prior connections shows whether the contacted service is consistent with normal use.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
- question: Has notepad.exe initiated network connections from this host before?
  context: Notepad execution itself is ubiquitous, so the meaningful history is its network activity. Zero prior notepad-initiated connections over the baseline window makes this a first occurrence; a history limited to print-service destinations and ports, including the 9100 traffic the rule itself excludes, indicates an established printing workflow on this host. This view deliberately includes the excluded print traffic so the printing baseline is visible.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
- question: When this host previously fired this rule's pattern, which programs and users drove it, and does this alert fit?
  context: The query mirrors the rule's selection scoped to this host - non-print network connections initiated by notepad.exe - so the resulting program and user distribution reflects how this specific firing pattern has historically run here, not generic notepad usage. The Image column will show notepad.exe itself; connection events carry no parent lineage, so pivot to the notepad.exe start event if lineage matters. A recurring user driving prior events suggests an established local quirk; an unexpected account on the current alert, or an empty history, is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        Image|endswith: \notepad.exe
      filter_optional_printing:
        DestinationPort: 9100
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_optional_*) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts fired this rule's pattern in the past week, or is this activity isolated to one machine?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of non-print notepad.exe network connections rather than generic notepad usage. Many hosts firing the same pattern points to a shared cause - a fleet-wide software quirk or scripted deployment worth identifying once; a single host, or a small unrelated set, points to targeted activity on this machine. Use the host distribution to calibrate how widely to scope the rest of the investigation.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        Image|endswith: \notepad.exe
      filter_optional_printing:
        DestinationPort: 9100
      condition: selection and not 1 of filter_optional_*
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining process activity around the connection reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence such as reconnaissance, credential access, or persistence installation. Aggregating by parent-child pairs collapses repetitive agent noise into high-count rows while novel pairings stand out at low counts.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Injection into notepad presupposes that a foothold process was already running, so earlier detections on this host - delivery, initial execution, defense tampering, credential access - often show how the injecting process arrived and what stage the operation had reached before the beacon. The alert timeline helps reconstruct the sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
