name: New TimeProviders Registered With Uncommon DLL Name
id: 7a32b30a-2feb-4beb-8e53-c827d56df27e
description: |
  Detects a process setting a DllName value under
  HKLM\SYSTEM\CurrentControlSet\Services\W32Time\TimeProviders where the value data is not one
  of the standard system provider DLLs (w32time.dll or vmictimeprovider.dll). Time providers
  are DLLs that the Windows Time service loads at boot and whenever the service starts, so
  registering a new provider or repointing an existing one gives an attacker code execution in
  the Local Service context every time the system starts. Registration requires administrator
  privileges, and outside of OS servicing or virtualization guest tooling these values rarely
  change. Investigation should determine what DLL path was written, which process and user wrote
  it, whether the DLL exists on disk and was subsequently loaded by the time service, and
  whether the change is isolated to this host or part of a wider deployment.
type: detection
detection_id: e88a6ddc-74f7-463b-9b26-f69fc0d2ce85
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting registry write set a DllName value under the W32Time TimeProviders key with a non-standard DLL?
  context: >-
    Confirm the modified key sits beneath Services\W32Time\TimeProviders and ends in \DllName,
    and that the value data is not one of the standard providers the rule excludes
    (w32time.dll and vmictimeprovider.dll under the System32 directory). The alert panel
    carries the exact key path and value data for this check.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user or host expected to register or modify Windows Time providers?
  context: >-
    Time provider registration requires administrator privileges and is normally performed only
    by OS servicing or virtualization guest tooling, so a write attributed to an interactive
    user or an unexpected admin account warrants scrutiny. The resulting DLL executes as Local
    Service regardless of who registered it. When the user is SYSTEM or a machine account,
    pivot on the writing process to judge legitimacy.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Was there a change ticket or documented deployment covering this time-provider registration?
  context: >-
    Legitimate new time providers usually arrive with virtualization guest tools, hypervisor
    integration components, or specialized time-synchronization software, and those
    installations are typically documented. A corresponding ticket or deployment record
    suggests authorized activity; absence of one when policy requires it suggests the
    registration was unauthorized.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What launched the process that wrote this DllName value?
  context: >-
    Time provider registration normally comes from installers, OS servicing, or configuration
    management chains. Tracing the writing process back to its parent reveals whether the write
    came from a legitimate deployment lineage or from a shell, script host, or Office
    application, which points to hands-on or malicious modification. If parent lineage is
    unavailable on the registry event, pivot on the writing process identity instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Which TimeProviders subkey was modified, and what DLL path was written to its DllName value?
  context: >-
    The DLL path in the value data is the payload the time service will load. A path outside
    the System32 directory — a user-writable location, a temp or ProgramData directory, or a
    randomly named DLL — is the anomaly this rule targets, since legitimate providers live in
    System32. Note whether the write created a brand-new provider subkey or repointed an
    existing provider (such as NtpClient or NtpServer) at a different DLL.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Has this TimeProviders DllName value been modified before on this host?
  context: >-
    Time provider configuration is set at OS install and rarely changes afterward, so a
    first-time write to this value is far more notable than a recurring one. Compare historical
    value data against the current write — zero history means the provider entry has never been
    touched before, and a changed DLL path on an existing provider means an established entry
    was repointed.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Were other registry modifications made on this host in the same session?
  context: >-
    Attackers who install one persistence mechanism often make several registry changes
    together — additional autostart entries, service configuration, or security-control
    tampering. Registry changes from the same window, grouped by key path and writing process,
    reveal whether multiple configuration objectives were pursued together, which points to a
    hands-on session or an installer-style implant rather than an isolated write. If the host
    is registry-noisy, narrow to the writing process from the alert.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Was the DLL referenced by the DllName value dropped to disk by the registry-writing process?
  context: >-
    A registered time provider is only effective if the DLL exists at the configured path.
    Correlating file activity by the registry-writing process and its children shows whether
    the payload was dropped in the same session as the registry write — attackers typically
    copy the DLL to disk immediately before or after registering it. The file-write event
    carries no hash; if the DLL is present, hash it from a later load event or retrieve it for
    a reputation lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was the Windows Time service restarted or reconfigured with w32tm to activate the new provider?
  context: >-
    A newly registered provider only loads when the time service starts, so attackers commonly
    restart W32Time or run w32tm to force activation without waiting for a reboot. Service
    stop/start commands or w32tm configuration updates around the registry write indicate the
    attacker activated the persistence immediately; their absence means the DLL is staged to
    load at the next boot.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
          - 'w32tm'
          - 'w32time'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: Did the DLL registered as a time provider load into the Windows Time service host process?
  context: >-
    Provider DLLs load into the svchost.exe instance hosting W32Time at service start or boot,
    executing as Local Service. A load event for the configured DLL confirms the persistence
    fired; its signature status and hash on the load event support a reputation check without
    retrieving the file. If the value data was written in an environment-variable form rather
    than a literal path, search on the DLL file name instead of the full path.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|contains|expand: '%Details%'
      condition: selection
    fields:
      - ImageLoaded
      - Image
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: Was this DllName value re-modified after the alert, and does it still reference a non-standard DLL?
  context: >-
    Registry key and value deletions are not observable in endpoint registry telemetry, so
    attacker cleanup cannot be confirmed directly. Judge persistence instead from the value's
    re-modification history — whether it was overwritten again, reverted to a standard system
    provider DLL, or repointed to a new payload — and from whether the configured DLL actually
    loaded into the time service.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Was this TimeProviders value modified on other hosts in the environment?
  context: >-
    The same provider registration on many hosts with identical value data looks like a
    software rollout — virtualization guest tools and time-sync software deploy fleet-wide —
    while a write on only this host, or a DLL path that differs from every other host, suggests
    targeted activity. Compare the value data and writing process across hosts.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering,
    reconnaissance, or credential access — may reveal the attack stages that preceded the
    time-provider registration and help reconstruct how the attacker obtained the administrator
    privileges the write requires.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other persistence mechanisms installed on this host around this time?
  context: >-
    Attackers rarely rely on a single persistence mechanism. Alongside a time-provider
    registration, they commonly install backups using scheduled tasks, services, registry Run
    keys, BITS jobs, or WMI subscriptions. Multiple persistence installations in the same
    timeframe indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped into Startup folders or scheduled-task definition paths on this host?
  context: >-
    File-based persistence bypasses command-line detection entirely — dropping an executable or
    script into a Startup folder or a path referenced by a registry Run key achieves
    persistence without invoking schtasks, sc, or reg. File-event monitoring captures these
    drops even when the attacker avoids standard persistence tools, revealing parallel
    footholds alongside the time-provider registration.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
