name: Suspicious File Created by ArcSOC.exe
id: af6f59c8-0e5a-424f-8aae-bb646904e752
description: |
  Detects the ArcGIS Server service-instance process ArcSOC.exe creating a file with a script or
  executable extension (.aspx, .dll, .exe, .ps1, .bat, and similar). ArcSOC.exe hosts REST service
  requests and normally writes service data and logs — executable content written by it is associated
  with web-shell deployment or tool transfer through a malicious or compromised server object
  extension. The investigation should confirm the write, identify the originating request, determine
  whether the file executed or was loaded, and establish whether follow-on command execution,
  outbound connections, or additional drops occurred.
type: detection
detection_id: e890acee-d488-420e-8f20-d9b19b3c3d43
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Do the created file's extension and the writing process match what this rule detects?
  context: The rule fires when ArcSOC.exe writes a file whose name ends in a script or executable
    extension (.ahk, .aspx, .au3, .bat, .cmd, .dll, .exe, .hta, .js, .ps1, .py, .vbe, .vbs, .wsf).
    Confirm the responsible process is ArcSOC.exe and the path carries one of these extensions; the
    query returns every operation on this path around the alert, so the triggering write is visible
    with its operation type and responsible process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - file_event
- question: Is this host an ArcGIS server where writing this file type could be expected?
  context: ArcSOC.exe runs one instance per running service and normally writes service data, logs,
    and job outputs — not executables or scripts. The process usually runs under a dedicated service
    account, so judge legitimacy by the host's role and the writing process rather than the account
    name. Developer or staging systems where custom server object extensions are built and tested
    are the main context where such writes could be legitimate; on a production, internet-facing
    server they rarely are.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What is the content of the created file?
  context: 'Retrieve the file and inspect it. For .aspx, .js, .ps1, and other script types, look
    for request-parameter handling, command-execution calls, base64-encoded blocks, hardcoded access
    keys, and embedded URLs or IP addresses — the markers of a web shell or loader. For .dll and
    .exe payloads, check signing status, imports, embedded strings, and packer indicators, and
    compare notable strings against threat intelligence.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
- question: If the created file has executed, what is its hash — and does it have known threat intel detections?
  context: A file-creation event carries no hash; the hash is recorded when the file runs. This query
    looks for the dropped file executing as a process so its hash can be checked against reputation
    services and internal threat intelligence. A dropped DLL will not appear here — the module-load
    question covers that activation path. If the file is present on disk but has not executed,
    retrieve it from the alerting path and hash it manually.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: If the created file is a DLL, was it loaded into a process — and with what signature status?
  context: DLL payloads dropped by a server process typically execute through a module load rather
    than a new process, and the load event carries the module's hash and signature details. An
    unsigned or invalid-signature module loading shortly after the write is the execution evidence
    for the DLL branch of this detection, and the loading process identifies what activated the
    payload. The hash returned here can go straight to a reputation lookup.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - ImageLoaded
      - Image
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - external_threat_intel
- question: What web request triggered this file write?
  context: ArcSOC.exe writes files while servicing REST requests that arrive through the site's web
    gateway, so the originating request is the delivery vector. Correlate the write timestamp with
    web access logs to find the request, the operation invoked, and the source IP — then judge the
    source address, its geography, and the request timing against expected client access patterns
    and business hours. Repeated similar requests in short windows suggest interactive operation of
    an implanted service, and bursts of failed requests or failed authentication against the site's
    administrative endpoints in the same logs are the access-attempt precursor worth noting.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - manual_review
  - edr_console
- question: Is the created file still on disk, or was it deleted or renamed after the alert?
  context: The file's post-alert lifecycle drives next steps. A payload still on disk can be
    retrieved, hashed, and analyzed; deletion shortly after creation points to cleanup or a
    self-deleting dropper and shifts attention to what executed in between. Interpret the returned
    operations by their type — creation, modification, rename, deletion — to reconstruct the file's
    lifecycle on this host.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Is this ArcGIS Server deployment up to date with security patches?
  context: Server-side drops of executable content frequently follow exploitation of an unpatched
    web application or abuse of a compromised administrative account. Check the installed ArcGIS
    Server version against current security patches, and verify the site is reachable only through
    its web gateway — direct exposure of server ports 6443 or 6080 widens the attack surface. Patch
    and exposure state also indicate whether other similarly configured servers are at risk.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
  answer_sources:
  - asset_inventory
  - edr_console
- question: What other files did the writing process or its children create or delete around the alert?
  context: A process that drops one suspicious file often drops several — a dropper unpacking
    components or a tool staging output. Review where the other writes land. User-writable staging
    paths such as %TEMP%, %APPDATA%, and C:\Users\Public, new directories created under system
    paths, and web-accessible service directories are the drop locations that matter most. The
    breadth, paths, and extensions distinguish a single artifact from a multi-file delivery in
    progress.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: What processes did the writing service instance or its parent spawn after the alert, and what are their hashes?
  context: This returns the children of the writing ArcSOC.exe instance and its siblings under the
    same parent, with executable hashes for reputation lookup — for a write-then-execute delivery,
    that family contains the payload run. Note that siblings under the server's parent include the
    other legitimate service-instance processes; focus on entries that are not the standard service
    host or its expected console helpers. If the payload was run later by an unrelated process, it
    will not appear here — retrieve the file from disk and hash it manually instead.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection_children
    fields:
      - Image
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: What child processes did ArcSOC.exe spawn on this host after the alert?
  context: Expected children of this service host are conhost.exe and cmd.exe console helpers and
    javaw.exe whose command line points into the ArcGIS installation directory. High-risk children
    are powershell.exe, rundll32.exe, regsvr32.exe, wscript.exe, mshta.exe, cmd.exe with encoded or
    download-style arguments, or the dropped file itself — command execution through an implanted
    server object surfaces here. Judge cmd.exe by its command line, since it appears in both the
    expected and high-risk sets.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Did ArcSOC.exe initiate outbound network connections around the file write?
  context: Tool transfer pairs an outbound fetch with the file drop, and implant traffic often
    follows in the same window. Service-instance processes normally talk to internal data stores
    and local service ports; connections they initiate to external or unknown destinations —
    especially new or low-reputation addresses, including tunneling endpoints on port 443 — are the
    deviation to chase. Distinguish internal address space from external destinations when reading
    the results.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\ArcSOC.exe'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
  answer_sources:
  - network_connection
  - external_threat_intel
- question: When this host previously produced this file-write pattern, which programs and users drove it — and does the current alert fit?
  context: The query mirrors the rule's selection scoped to this host, so the resulting program and
    user distribution reflects how this exact firing pattern has historically occurred here rather
    than generic process activity. The Image column will show ArcSOC.exe itself; file events carry
    no parent lineage, so pivot to its process-creation event if lineage matters. Prior fires under
    the same service account may indicate long-standing automation — or earlier undetected activity
    of the same kind, which deserves its own review. A first-ever fire on this host raises the
    weight of the current event.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith: \ArcSOC.exe
        TargetFilename|endswith:
        - .ahk
        - .aspx
        - .au3
        - .bat
        - .cmd
        - .dll
        - .exe
        - .hta
        - .js
        - .ps1
        - .py
        - .vbe
        - .vbs
        - .wsf
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
  answer_sources:
  - file_event
- always_include: true
  question: Has this user account previously produced this file-write pattern, and does that history fit its role?
  context: The result is this account's 90-day history of the rule's specific firing pattern,
    aggregated by host. ArcSOC.exe typically runs under a dedicated service account, so a human
    username here is itself unusual and worth explaining; when the account is a service principal,
    identity does not attribute behavior and the parent-mechanism baseline is the meaningful pivot.
    Known-good updaters and deployment agents that legitimately write files establish themselves as
    steady counts over the window.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith: \ArcSOC.exe
        TargetFilename|endswith:
        - .ahk
        - .aspx
        - .au3
        - .bat
        - .cmd
        - .dll
        - .exe
        - .hta
        - .js
        - .ps1
        - .py
        - .vbe
        - .vbs
        - .wsf
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
  - organizational_knowledge
- always_include: true
  question: Has this program historically driven this file-write pattern on this host or elsewhere, or is the program new for this activity?
  context: 'When the alert fires under a service principal, the launch mechanism is the pivot that
    attributes behavior: the query mirrors the rule''s selection scoped to the alerting program, giving the 90-day history of this program driving this exact pattern, aggregated by
    host. A program that already accounts for many prior events across hosts looks like platform
    automation; a new or rare program for this pattern is the deviation worth chasing.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith: \ArcSOC.exe
        TargetFilename|endswith:
        - .ahk
        - .aspx
        - .au3
        - .bat
        - .cmd
        - .dll
        - .exe
        - .hta
        - .js
        - .ps1
        - .py
        - .vbe
        - .vbs
        - .wsf
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
- always_include: true
  question: What else did this user account do across the network around the alert?
  context: Activity by the same account on other hosts in the alert window shows whether the account
    is in use beyond this server — credential reuse from a compromised server commonly appears as
    process activity on additional endpoints, particularly administrative workstations. If the
    account is a machine or service principal, this view fills with routine agent noise; the
    parent-driven clustering question gives the meaningful cross-host answer in that case.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did the same program-driven file-write pattern fire on other hosts in the alert window?
  context: The query mirrors the rule's selection scoped to the alerting program, fleet-wide,
    in the alert window. Several hosts producing the same pattern at once points to pushed
    automation or a coordinated deployment; a single host points to a host-local trigger such as a
    request served only by this server. For a server-bound process like ArcSOC.exe, a simultaneous
    multi-host fire deserves scrutiny of the shared deployment channel that reached those machines.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith: \ArcSOC.exe
        TargetFilename|endswith:
        - .ahk
        - .aspx
        - .au3
        - .bat
        - .cmd
        - .dll
        - .exe
        - .hta
        - .js
        - .ps1
        - .py
        - .vbe
        - .vbs
        - .wsf
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
- question: Did this rule fire on other hosts in the last day?
  context: Exploitation of internet-facing services rarely stops at one server. The same rule firing
    on other hosts within a day indicates either a shared benign deployment or the same intrusion
    technique applied across the exposed fleet; either way, the affected host list defines the
    scope of follow-up review. A single-host fire keeps the investigation local to this server.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - alert
