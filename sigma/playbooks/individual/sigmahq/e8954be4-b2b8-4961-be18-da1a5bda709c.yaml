name: Potential Devil Bait Malware Reconnaissance
id: 3f1c5a26-9d0a-4a3e-8b41-6c9f1e2d7a84
description: |
  Detects a cmd.exe process launched by wscript.exe whose command line appends output into a file under
  %APPDATA%\Microsoft\ that ends in .xml or .txt, and which at the same time runs either an ipconfig /all
  query or a command containing dir, systeminfo, or tasklist. Both halves must be present for the rule to
  fire, but the recon half has two alternative branches and only one of them needs to match. The pattern is
  the collection step of a script-driven loader: a VBScript running under the Windows script host issues a
  burst of discovery commands through the shell and redirects each result into a staging file that is
  disguised as an ordinary Office data file, so the output can later be read back or sent to a remote
  endpoint. Devil Bait samples produce this exact structure. Determine which recon branch fired, read the
  full command burst and the staging file path, trace the VBScript that the script host executed and what
  else it launched, and establish whether the collected output left the host.
type: detection
detection_id: e8954be4-b2b8-4961-be18-da1a5bda709c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: >-
    Does the command line append output into a .xml or .txt file under %APPDATA%\Microsoft\, and does it run
    either ipconfig /all or a dir, systeminfo, or tasklist command?
  context: >-
    Two things must hold together for this alert. The redirect half requires all of its terms at once - the
    parent is wscript.exe, the child is cmd.exe, the command line contains the append redirect
    ">>%APPDATA%\Microsoft\", and the target file name ends in .xml or .txt. The recon half then matches on
    either of two branches on its own - an ipconfig /all invocation, or a command line containing dir,
    systeminfo, or tasklist. Note which branch fired. The ipconfig branch is narrow and points squarely at
    network enumeration being written to the staging file, so the network and staging-file follow-up carries
    the weight. The dir/systeminfo/tasklist branch matches on substrings that can appear inside unrelated
    words and paths, so read the full command line first and confirm the token is an actual command rather
    than an incidental match before treating the discovery framing as established.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: >-
    Is this user and host expected to run scripted discovery commands whose output is written into the user's
    application-data tree?
  context: >-
    Inventory and helpdesk tooling does collect ipconfig, systeminfo, and tasklist output, and some of it does
    so from a script. What separates that from the alerting pattern is where the output lands and under what
    name - packaged tooling writes to its own program or log directory, not into the Office data tree with an
    .xml or .txt extension chosen to blend in. Establish whether any sanctioned inventory or support script
    runs on this host under this account.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: >-
    Which script did wscript.exe execute, and what started the script host itself?
  context: >-
    The parent lookup returns the script host's own command line, which names the script file it was handed,
    and its parent, which shows how the script host was started. A script path pointing into the user's
    application-data or temporary directories, or a file with a data extension such as .xml being run through
    //e:vbscript, is the loader stage rather than an administrative script. A grandparent that is an Office
    application indicates a macro-enabled document delivered the script; explorer.exe indicates the user
    opened something directly; a scheduling or service parent indicates recurring execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: >-
    What other processes did this exact script-host instance spawn?
  context: >-
    A script that collects discovery output rarely issues one command. The same script-host instance typically
    drives a burst of shell invocations, each appending a different result into the staging file, and often
    other stages alongside them - registry writes through reg.exe, encoding through certutil.exe, task
    creation through schtasks.exe, or a process kill through taskkill.exe. The sibling list scoped to the exact
    parent instance is the fastest read of everything that script did.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: >-
    Read the full command burst that appended output into %APPDATA%\Microsoft\. Which discovery commands ran,
    and what staging file did they write to?
  context: >-
    cmd.exe is far too common on any host to scope by binary alone, so this view is narrowed to commands
    carrying the append redirect into the application-data tree. Each row is one collection step. Read the
    argument list of every command to establish what was enumerated - adapter and DNS configuration, running
    processes, installed patches and domain membership, or a directory listing of a specific path - and note
    the exact file name being appended to, since that becomes the pivot for the staging-file and exfiltration
    questions. The working directory shows where the shell was rooted when the burst ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: '>>%APPDATA%\Microsoft\'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: >-
    Does wscript.exe normally spawn cmd.exe on this host?
  context: >-
    The script host driving a command shell is the lineage this rule turns on. Some line-of-business
    installers and legacy logon scripts do it, and where that is routine the ninety-day history shows a steady
    count with recognisable command lines. A count of zero or a handful, or a history whose command lines look
    nothing like the alerting burst, makes this pairing new for the host and moves the script identified in
    the parent lookup to the centre of the investigation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: >-
    What did script-host activity on this host go on to launch in the hours after the alert?
  context: >-
    Collection is an early step. In the hours that follow, the same script host commonly drives the stages
    that matter more - scheduled task creation for a recurring beacon, mshta.exe or rundll32.exe reaching a
    remote endpoint, certutil.exe encoding the staged output for transport, or registry writes that weaken
    macro protection. This view covers every script-host instance on the host, not only the alerting one, so a
    second script started after the alert is still visible.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: >-
    How widely does wscript.exe spawn cmd.exe across the environment in the last day, and does that
    distribution look like consistent automation or isolated activity?
  context: >-
    This view counts the parent-child pairing fleet-wide without narrowing to the alerting command pattern, so
    it answers how normal script-host-driven shells are here rather than whether the rule's pattern spread.
    A large, even spread across many hosts with the same command lines is deployed tooling and lowers the
    weight of the lineage on its own. A pairing that appears on only this host, or on a small set of hosts in
    the same business unit, is consistent with delivery to selected recipients and makes the other hosts worth
    checking directly.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
  answer_sources:
  - process_creation
- question: >-
    Has anything on this host previously appended command output into the %APPDATA%\Microsoft\ tree?
  context: >-
    A ninety-day count of cmd.exe alone would be meaningless on any host, so the baseline is narrowed to the
    append redirect into the application-data tree, which is the part of the pattern that is genuinely rare.
    The user breakdown shows whether this construction has any prior history here and, if so, whether it
    belongs to a deployment or support identity. Zero prior events makes the alerting burst the first time
    this host wrote command output into that location.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: '>>%APPDATA%\Microsoft\'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: >-
    Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, aggregated by host, so the result is
    that identity's ninety-day history of this specific redirect-plus-discovery pattern rather than generic
    use of cmd.exe. Given how narrow the pattern is, any prior history at all points to repeated execution
    through the same script-driven path rather than to routine administration, and should be read alongside
    what the account is actually meant to do.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_redirect:
        ParentImage|endswith: \wscript.exe
        Image|endswith: \cmd.exe
        CommandLine|contains: '>>%APPDATA%\Microsoft\'
        CommandLine|endswith:
        - .xml
        - .txt
      selection_recon_cmd:
      - CommandLine|re: ipconfig\s+/all
      - CommandLine|contains:
        - dir
        - systeminfo
        - tasklist
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: >-
    Has this parent process historically driven the rule's pattern on this host or across the environment, or
    is the parent new for this activity?
  context: >-
    When the alert fires under a service or computer account, the user identity attributes nothing. The launch
    mechanism is the pivot that still works - this query mirrors the rule's selection structure scoped to the
    alerting parent process, giving that parent's ninety-day history of driving this exact pattern rather than
    generic parent-and-binary co-occurrence. A parent with no prior history of the pattern is the deviation to
    chase; a parent already accounting for a large volume of matching events is packaged automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_redirect:
        ParentImage|endswith: \wscript.exe
        Image|endswith: \cmd.exe
        CommandLine|contains: '>>%APPDATA%\Microsoft\'
        CommandLine|endswith:
        - .xml
        - .txt
      selection_recon_cmd:
      - CommandLine|re: ipconfig\s+/all
      - CommandLine|contains:
        - dir
        - systeminfo
        - tasklist
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
- question: >-
    What else did this user account do across the environment around this time?
  context: >-
    If the alert fires under a named account, that account's activity on other hosts in the same window shows
    whether the same identity was working beyond this endpoint - which for a script delivered to a person
    would suggest the document or script reached more than one of their machines. If the alert fires under a
    service or computer account, this view fills with routine service-owned processes and the parent-scoped
    view is the one that answers the question.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  always_include: true
  answer_sources:
  - process_creation
- question: >-
    Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to
    this host?
  context: >-
    Under a service principal, tracking the user across the environment returns agent-telemetry noise. Whether
    the same launch mechanism produced this pattern elsewhere in the alert window is the answerable version.
    Several hosts matching at once points to a script delivered to multiple recipients or pushed through
    scheduled automation, which widens the scope to every matching host; a single host points to a host-local
    trigger such as a document opened here.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_redirect:
        ParentImage|endswith: \wscript.exe
        Image|endswith: \cmd.exe
        CommandLine|contains: '>>%APPDATA%\Microsoft\'
        CommandLine|endswith:
        - .xml
        - .txt
      selection_recon_cmd:
      - CommandLine|re: ipconfig\s+/all
      - CommandLine|contains:
        - dir
        - systeminfo
        - tasklist
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
- question: >-
    What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating parent-child pairs across the alert window collapses repetitive service telemetry into single
    high-count rows and leaves novel pairs standing out at low counts. Look for the rest of the script's work
    around the collection burst - reg.exe writes, certutil.exe, schtasks.exe, taskkill.exe, mshta.exe or
    explorer.exe launching content, and rundll32.exe - and for any pairing under the script host that the
    sibling view did not already surface.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: >-
    Did script hosts or signed system binaries on this host load unexpected or unsigned modules around the
    alert?
  context: >-
    Proxy execution runs attacker-supplied code inside a trusted, signed binary, and the module load is where
    that becomes visible. rundll32.exe, msiexec.exe, regsvr32.exe and mshta.exe are the signed binaries most
    often used this way, and the script hosts sit next to them in the same chain. An unsigned module, a module
    with an invalid or unmatched signature, or a module loaded from the user's application-data or temporary
    directories identifies the code the trusted binary was made to execute. If module telemetry is not
    collected for this host, treat an empty result as a visibility gap rather than evidence nothing loaded.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_proxy:
        Image|endswith:
        - '\wscript.exe'
        - '\cscript.exe'
        - '\mshta.exe'
        - '\rundll32.exe'
        - '\regsvr32.exe'
        - '\msiexec.exe'
      condition: selection and selection_proxy
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
  answer_sources:
  - process_creation
  - manual_review
- question: >-
    Did the script host or any system binary on this host connect outbound around the alert, and where to?
  context: >-
    Collected discovery output has to reach somewhere, and the same binaries that proxy execution also carry
    the transfer - the script host itself over HTTP, mshta.exe fetching remote content, rundll32.exe, or a
    shell driving a command-line downloader. Destinations that resolve to internal update, management, or
    proxy infrastructure can be set aside; an externally routable destination from a script host is the
    finding, and the address becomes the pivot for checking whether other hosts contacted it. Read the
    direction field to separate outbound transfer from inbound service traffic.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_proxy:
        Image|endswith:
        - '\wscript.exe'
        - '\cscript.exe'
        - '\mshta.exe'
        - '\rundll32.exe'
        - '\certutil.exe'
        - '\cmd.exe'
      condition: selection and selection_proxy
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - Initiated
  answer_sources:
  - network_connection
  - external_threat_intel
- question: >-
    What files were written under the user's Microsoft application-data tree around the alert, and which
    processes wrote them?
  context: >-
    The rule fires on the redirect, not on the file, so the staging file itself is confirmed here. A file with
    an .xml or .txt name in a directory otherwise holding Office and Windows component data, written by a
    command shell rather than by an Office application, is the collected output. Neighbouring writes in the
    same window often reveal the rest of the stage - the script file the script host was handed, a second
    encoded copy of the output prepared for transport, or additional payloads dropped alongside. If file
    telemetry is not collected for this host, treat an empty result as a visibility gap rather than evidence
    nothing was written.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\AppData\Roaming\Microsoft\'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: >-
    Did other detections fire on this host in the hours before this alert?
  context: >-
    Collection through a scripted shell sits in the middle of a chain, so the preceding hours may hold the
    delivery and execution stages - an Office application spawning a script host, a script written into a user
    directory, or macro-security registry changes. Earlier alerts help fix when script execution first
    succeeded on this host and which document or download started it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
