name: Potential Suspicious PowerShell Module File Created
id: 46ff893b-bcb2-4956-9d4f-e19216bff70d
description: |
  Detects the creation of a PowerShell module file (a .ps* script or .dll binary module)
  written directly into a first-level folder of the WindowsPowerShell\Modules directory
  structure (e.g. \WindowsPowerShell\Modules\name\name.psm1) — legitimate module installs
  usually include a version subfolder at that level. Because directories under
  PSModulePath are auto-discovered, a module planted there loads by name the next time
  any of its commands is invoked, making this a low-visibility persistence and code
  execution mechanism. Investigation should identify the process that wrote the file and
  how it was launched, examine the module's content, determine whether the module was
  subsequently loaded or imported, and establish whether this is a documented software
  deployment reaching one host or many.
type: detection
detection_id: e8a52bbd-bced-459f-bd93-64db45ce7657
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Is the created file a module script or DLL written directly under a WindowsPowerShell\Modules folder?
  context: Before investing investigation time, confirm the alert is a true positive. The
    rule fires on file creation where the path matches \WindowsPowerShell\Modules\*\.ps
    or \WindowsPowerShell\Modules\*\.dll — a module file placed in the first-level module
    folder, without the version subfolder legitimate module installs usually create.
    Review the exact path, the operation performed, and the responsible process against
    that pattern.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user or host expected to install PowerShell modules?
  context: Developers, administrators, and software deployment pipelines write modules
    legitimately, and some vendor installers skip the version-folder convention. Knowing
    whether the user's role and the host's function are consistent with module
    installation is often the fastest way to separate routine software activity from a
    planted module. When the user is a machine or service account, judge by the writing
    process and the host's role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the module file still on disk, or was it deleted or renamed after the alert?
  context: The file's post-alert lifecycle drives both urgency and next steps. A module
    still on disk can be retrieved, hashed, and analyzed; a module deleted shortly after
    creation suggests staged one-time use or anti-forensic cleanup and shifts the
    investigation to what imported or executed it in between. A rename inside the Modules
    tree can also move the file into a version subfolder to blend in after the fact.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What is the content of the created module file?
  context: 'Retrieve the file from its on-disk path and read it. For script modules
    (.psm1) and manifests (.psd1): check for base64-encoded strings, obfuscation,
    embedded URLs or IP addresses, download cradles, and which functions
    Export-ModuleMember exposes — a module that shadows a common cmdlet name or exports a
    single loader function is characteristic of a planted hook. For binary modules
    (.dll): check imports, embedded strings, packer signatures, and signing status. This
    content question is distinct from hash-reputation checking — it answers what is IN
    the file, not whether the file is already known.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
- question: Has the module DLL been loaded, and if so what is its hash and signature status?
  context: File-creation events carry no hash — for the binary-module (.dll) branch of
    this rule, the hash and signature are recorded on the image-load event when the
    module is loaded. Submit the hash to threat intelligence to determine whether it is
    known malicious, benign, or previously unseen, and weigh an unsigned or
    invalid-signature module in the Modules tree accordingly. A .ps* script module never
    appears as an image load (it runs inside the PowerShell host process); for that
    branch, retrieve the file from disk and hash it manually.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
  answer_sources:
  - external_threat_intel
  - manual_review
- question: Was the command that wrote the module encoded or obfuscated, and what does it decode to?
  context: The file event carries the identifier of the writing process; this query
    retrieves that process's full command line. Attackers frequently hide module-planting
    behind PowerShell's -EncodedCommand (-enc) parameter, string concatenation, backtick
    escaping, or variable substitution. Decoding reveals the actual operation — a
    download cradle fetching the module body, in-memory staging that wrote it to disk, or
    a plain copy from removable media or a network share.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: What process wrote the module file, and is its parent chain expected?
  context: The writer's own process-creation event carries its image, command line, and
    parent details. Legitimate module installs typically descend from installers,
    package-management tooling, deployment agents, or an administrator's interactive
    console; a module written by a script host spawned from an Office application, a
    browser, or an unexpected service points to delivery through an earlier foothold.
    For deeper analysis, walk up the tree by querying the parent's own creation event.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: Did script block logging capture the commands that planted the module, or the module's own content?
  context: Windows Event ID 4104 records the deobfuscated script content that PowerShell
    actually executes — both the code that wrote this file and, if the module was later
    imported, the module body itself as it ran. This provides ground truth that bypasses
    command-line obfuscation. If PowerShell operational logs are not ingested in this
    environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
  answer_sources:
  - manual_review
- question: Were PowerShell security controls bypassed or weakened before the module was written?
  context: Planting a module often follows disabling the controls that would block or
    record it — AMSI bypass (patching amsi.dll in memory), execution policy changes
    (Set-ExecutionPolicy or -ep bypass), constrained language mode escape, or a downgrade
    to PowerShell v2, which lacks script block logging. Finding these precursors in the
    hour before the write strengthens the malicious reading; their absence keeps a
    routine-deployment reading open.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Was the module explicitly imported or referenced by later PowerShell commands?
  context: A module in a PSModulePath directory auto-loads the moment any of its exported
    commands is invoked, so an explicit Import-Module is not required — an empty result
    here does not mean the module never ran. Explicit imports or path references in later
    command lines do confirm use and identify who invoked it; for the auto-load case, the
    script-block-logging question is the ground truth for whether the module's code
    executed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_import:
        CommandLine|contains:
          - 'Import-Module'
          - 'ipmo '
          - '\WindowsPowerShell\Modules\'
      condition: selection and selection_import
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What other files did the writing process create or delete around the alert?
  context: A process that drops one suspicious file often drops several — a dropper
    unpacking components, a tool staging output, or an installer laying down a full
    package. The breadth, paths, and extensions of the writer's other file activity
    (including its direct children, since droppers often delegate) distinguish a single
    planted module from a larger staging operation and enumerate what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: What else has been written under the WindowsPowerShell Modules directory recently, and by which processes?
  context: The Modules tree has a small set of legitimate writers — package-management
    cmdlets, vendor installers, and configuration-management agents. Other recent
    arrivals in the tree reveal whether this is an isolated drop or several modules
    planted together, and which writers drove them. A single unfamiliar process writing
    across many module paths is the signal to chase; a known deployment agent writing
    versioned folders is routine.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\WindowsPowerShell\Modules\'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- always_include: true
  question: Has this user previously written module files into the WindowsPowerShell Modules tree, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the
    result is the user's 90-day history of writing module scripts or DLLs into the
    WindowsPowerShell Modules tree (not generic PowerShell use), aggregated by host. A
    user who has never produced this pattern is more suspicious than one who installs
    modules regularly; weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith:
        - \\WindowsPowerShell\\Modules\\*\.ps
        - \\WindowsPowerShell\\Modules\\*\.dll
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
  - organizational_knowledge
- always_include: true
  question: Has this program historically driven this module-write pattern, or is the program new for this activity?
  context: 'When the alert fires under a service principal, user identity does not
    attribute behavior. The meaningful pivot is the launch mechanism: the query mirrors
    the rule''s selection structure scoped to the alerting program, so the result
    is the 90-day history of this program driving module writes into the Modules tree
    (not generic use of the binary). A new or rare program for this pattern is the deviation
    worth chasing; a program that already accounts for thousands of prior events is
    vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith:
        - \\WindowsPowerShell\\Modules\\*\.ps
        - \\WindowsPowerShell\\Modules\\*\.dll
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in the surrounding window
    reveals whether this module write is isolated or part of broader activity, including
    movement to other endpoints. When the alert fires under SYSTEM or another service
    principal, this user pivot returns agent-telemetry noise — the parent-driven
    fleet question is the meaningful substitute in that case.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network"
    returns agent-telemetry noise (every host runs SYSTEM-owned agents constantly). The
    meaningful question is whether the same launch mechanism fired elsewhere: the query
    mirrors the rule''s selection structure scoped to the alerting program,
    fleet-wide, in the alert window. Multiple hosts in the same window points to
    scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith:
        - \\WindowsPowerShell\\Modules\\*\.ps
        - \\WindowsPowerShell\\Modules\\*\.dll
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
- question: Was the same module file created on other hosts in the environment?
  context: The same module appearing on multiple hosts may indicate configuration-
    management deployment, lateral movement, or deliberate distribution. If the file is
    on one host only, the activity is host-local; if it is on many, the distribution
    pattern and timeline distinguish an orchestrated software rollout (near-simultaneous,
    consistent writer) from attacker propagation (sequential, mixed writers).
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host —
    defense tampering, reconnaissance, credential access, or download activity — may
    reveal the attack stages that preceded the module write and help reconstruct how the
    writer got its foothold and what the planted module is for.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
