name: Suspicious HH.EXE Execution
id: d9bcfd2c-590f-43c8-b299-d8d5d7f0c043
description: |
  Detects hh.exe (Microsoft HTML Help) executing with a command line that references a
  compiled HTML Help (.chm) file or .application path located in a user-writable or
  delivery-staging directory (AppData\Local\Temp, Downloads, Users\Public, the Outlook
  content cache, or Windows\Temp). The rule fires only when both conditions hold — the
  process is hh.exe (by Image name or OriginalFileName) AND the command line contains one
  of those path tokens. hh.exe is a trusted, signed binary normally used to open local
  help files; opening a CHM from a download or temp location is a known proxy-execution
  primitive where the CHM carries embedded script (VBScript, JScript, or a COM object) that
  spawns a script engine or PowerShell and reaches out for a second stage. The investigation
  should confirm the path token that fired, identify the parent that delivered the CHM,
  determine what hh.exe spawned and wrote, and establish whether the user and host normally
  open help content from these locations.
type: detection
detection_id: e8a95b5e-c891-46e2-b33a-93937d3abc31
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Is the alerting process hh.exe, and does its command line reference a .chm or .application file under a download, temp, public, or Outlook-cache path?
  context: Confirm the alert is a true positive before investing time. The rule fires only when the process is hh.exe (by Image name or OriginalFileName) and the command line contains one of .application, \AppData\Local\Temp\, \Content.Outlook\, \Downloads\, \Users\Public\, or \Windows\Temp\. Note which path token actually appears — it tells you where the help file was staged and is the starting point for the delivery question.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to open help content from a download, temp, or shared public directory?
  context: hh.exe normally opens help files shipped inside installed software from System32 or Program Files. A user opening a .chm from their Downloads folder, an Outlook attachment cache, or Users\Public is the unusual pattern this rule targets. Whether this user role and host function routinely receive and open such files separates a benign double-click on a help file from a delivered payload.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the full hh.exe command line, and what .chm or .application file and path does it name?
  context: The full command line names the exact help file hh.exe opened and the directory it came from. Identify the file name and extension, the staging directory, and any extra arguments. A CHM opened from a delivery path is the container that carries the embedded script or COM object; recording its name lets you pivot to the file on disk and search for additional copies.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned hh.exe, and is that parent chain expected for opening a help file?
  context: The parent reveals how the help file was opened. A user double-clicking a downloaded CHM typically shows explorer.exe as the parent. An email client, an archive utility, a browser, or a script host as the parent points to delivery via attachment or download rather than a deliberate user action, which changes the disposition toward a delivered payload.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What email, attachment, or download delivered the help file that hh.exe opened?
  context: A compiled HTML Help file opened from a download or Outlook-cache path usually arrives as an email attachment or a web download. Identifying the delivering message, the attachment name, or the originating download enables blocking at the perimeter and searching for other recipients who received the same file. The parent command line often records the source file path or the application that handed off to hh.exe.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: What child processes did hh.exe spawn after opening the help file?
  context: A CHM that carries an embedded payload causes hh.exe to spawn a script engine or interpreter — commonly powershell.exe, mshta.exe, cmd.exe, wscript.exe, cscript.exe, or rundll32.exe. hh.exe opening a legitimate help file spawns no such children. Any of these child processes shortly after the alert indicates the help file executed code, and the child command line is the next thing to decode.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What files were written under the same staging directories around the time hh.exe ran?
  context: A weaponized CHM chain commonly drops a second-stage payload — renamed executables, DLLs, or script files — into the same user-writable directories the rule keys on (AppData\Local\Temp, Users\Public, Downloads, Windows\Temp). File-creation events under these paths in the alert window reveal whether the help file staged additional artifacts and give file names and hashes for containment and fleet-wide search. No file writes there narrows the activity to in-memory execution.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_paths:
        TargetFilename|contains:
          - \AppData\Local\Temp\
          - \Content.Outlook\
          - \Downloads\
          - \Users\Public\
          - \Windows\Temp\
      condition: selection and selection_paths
    fields:
      - Image
      - TargetFilename
- question: Did hh.exe or any process it spawned make outbound network connections after the help file opened?
  context: Compiled HTML Help payloads frequently fetch a second stage over HTTP(S) immediately after execution — either hh.exe itself retrieving a remote CHM, or a spawned script engine pulling down a payload. Outbound connections from hh.exe or its children to external hosts in the alert window identify the staging or command-and-control destination and provide an indicator to block and pivot on. Connections to internal-only addresses or none at all weaken the remote-payload theory.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - \hh.exe
          - \powershell.exe
          - \mshta.exe
          - \cmd.exe
          - \wscript.exe
          - \cscript.exe
          - \rundll32.exe
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: If hh.exe spawned PowerShell, was that command encoded or obfuscated, and what does it decode to?
  context: When a CHM chain reaches PowerShell it routinely hides the payload with -EncodedCommand (-enc), string concatenation, backtick escaping, or variable substitution. Base64-encoded commands are the most common form. Decoding the spawned PowerShell command line reveals the actual operation — a download cradle, a reverse shell, or in-memory loading of a .NET assembly. Look for the source URL and what gets executed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: HH.exe
      - Image|endswith: \hh.exe
      selection_paths:
        CommandLine|contains:
        - .application
        - \AppData\Local\Temp\
        - \Content.Outlook\
        - \Downloads\
        - \Users\Public\
        - \Windows\Temp\
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: HH.exe
      - Image|endswith: \hh.exe
      selection_paths:
        CommandLine|contains:
        - .application
        - \AppData\Local\Temp\
        - \Content.Outlook\
        - \Downloads\
        - \Users\Public\
        - \Windows\Temp\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around the time of this alert?
  context: Tracking the user's activity across all hosts in the alert window reveals whether this is isolated or part of a wider sequence. If the same account triggered related activity on other endpoints, the scope of the incident is larger than a single host. This is the immediate cross-host view, distinct from the long-run frequency baseline.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: HH.exe
      - Image|endswith: \hh.exe
      selection_paths:
        CommandLine|contains:
        - .application
        - \AppData\Local\Temp\
        - \Content.Outlook\
        - \Downloads\
        - \Users\Public\
        - \Windows\Temp\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: When this host has previously matched this rule's hh.exe pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even a trusted binary can be abused. The query mirrors the rule's selection structure scoped to this host, so the parent and user distribution reflects how this specific firing pattern — hh.exe opening a help file from a staging directory — has historically run here, not generic hh.exe usage. A new parent, an unexpected user, or an unusual command-line structure against that history is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: HH.exe
      - Image|endswith: \hh.exe
      selection_paths:
        CommandLine|contains:
        - .application
        - \AppData\Local\Temp\
        - \Content.Outlook\
        - \Downloads\
        - \Users\Public\
        - \Windows\Temp\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Were any other proxy-execution or download living-off-the-land binaries used on this host recently?
  context: An operator who proxies execution through one trusted binary often uses several. If hh.exe opened a weaponized help file, check whether mshta, rundll32, regsvr32, certutil, or similar binaries also ran on this host to fetch or execute a payload for the same objective. Multiple such binaries achieving the same goal strengthens the case for a deliberate intrusion over a benign double-click.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\wmic.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\ie4uinit.exe'
          - '\infdefaultinstall.exe'
          - '\installutil.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was hh.exe executed from its expected System32 or SysWOW64 path?
  context: hh.exe normally runs from C:\Windows\System32 or C:\Windows\SysWOW64. A copy running from a user's temp directory, Downloads, or another non-standard location may indicate the binary was relocated or renamed to evade path-based allowlists, and is more suspicious than one in its system path. Compare the Image path against OriginalFileName to confirm identity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host matched this rule's hh.exe pattern over the past 90 days, and what command-line structures are typical?
  context: An hh.exe firing pattern with no prior history on a host is more suspicious than one seen regularly under stable parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects the rule's specific firing pattern rather than generic hh.exe usage. The command-line projection lets you compare typical help-file invocations against the alerting one to spot a novel path or file name.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: HH.exe
      - Image|endswith: \hh.exe
      selection_paths:
        CommandLine|contains:
        - .application
        - \AppData\Local\Temp\
        - \Content.Outlook\
        - \Downloads\
        - \Users\Public\
        - \Windows\Temp\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- question: Did the same detection fire on other hosts or for other users, indicating the help file reached more than one recipient?
  context: A malicious help file delivered by email or download rarely targets a single person. If one user opened a weaponized CHM, others likely received the same attachment. Correlating this detection across hosts and users reveals the breadth of delivery and identifies additional endpoints that need investigation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
