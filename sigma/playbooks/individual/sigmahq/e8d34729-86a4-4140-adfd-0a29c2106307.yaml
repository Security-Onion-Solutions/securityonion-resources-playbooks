name: HackTool - CoercedPotato Execution
id: 3493cbf8-3478-4971-b286-75ff6b849efc
description: |
  Detects execution of CoercedPotato, a local privilege-escalation tool that abuses SeImpersonatePrivilege or
  SeAssignPrimaryToken to elevate a service account to SYSTEM. The rule fires when any one of three signals is present:
  the child Image ends in CoercedPotato.exe, the command line carries the --exploitId argument, or the binary's import
  hash matches a known build. The tool stands up a local named pipe, coerces an RPC interface (MS-RPRN PrinterBug or
  MS-EFSR PetitPotam) so a SYSTEM-owned process connects to that pipe, impersonates the connecting token, and spawns a
  chosen binary as SYSTEM. Determine which signal fired, decode the requested command and exploit interface, and confirm
  whether a SYSTEM-context process was launched as a result.
type: detection
detection_id: e8d34729-86a4-4140-adfd-0a29c2106307
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Did this alert fire on the CoercedPotato image name, the --exploitId argument, or a known import hash?
  context: >-
    The rule fires when at least one of three independent signals matches — the Image ends in CoercedPotato.exe, the
    command line contains the --exploitId argument, or the file's import hash matches a known build. Confirm which branch
    fired, because it determines the rest of the investigation. An import-hash-only match means the file was renamed away from
    CoercedPotato.exe, so the binary name in the alert is not the tool's original name; an --exploitId-only match means a
    differently named loader passed the tool's argument. Record the matching Image, CommandLine, and Hashes before
    continuing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - Hashes
- question: Is this CoercedPotato execution part of an authorized penetration test or red team engagement?
  context: >-
    Privilege-escalation tools are used in sanctioned security assessments. Check whether a pentest or red team exercise
    is active on this host or network segment, and whether the operator, timing, and target account match the engagement
    scope. An authorized engagement with matching activity resolves the alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the account that ran this binary expected to perform privilege escalation on this host?
  context: >-
    CoercedPotato is designed to run from a service account that holds SeImpersonatePrivilege — typically LOCAL SERVICE,
    NETWORK SERVICE, an IIS application pool identity, or a database service account. A SYSTEM-bound escalation tool
    launched by one of those principals on a server role is consistent with the technique; the same tool run by an
    interactive user account is unusual and worth scrutiny. Note the host's function and the launching account.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What command and exploit options did this tool run with? Decode the -c, -i, and --exploitId arguments.
  context: >-
    The command line carries the operation. The -c (or --command) value is the binary the tool will launch as SYSTEM
    (commonly cmd.exe or powershell.exe). The -i (interface) and --exploitId values select which RPC coercion path is
    used — ms-rprn (PrinterBug) or ms-efsr (PetitPotam) and a specific RPC function index. The query returns CoercedPotato
    executions on this host within the window so multi-step or repeated invocations are visible together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Which RPC interface and exploit index were selected, and what binary was requested as SYSTEM?
  context: >-
    CoercedPotato exposes distinct coercion paths. The --exploitId value combined with the -i interface selects a
    specific RPC function — for example ms-rprn index 0 is RpcRemoteFindFirstPrinterChangeNotificationEx, and ms-efsr
    index 0 is EfsRpcOpenFileRaw. The -c value is the program to be executed in SYSTEM context. Reading these from the
    alerting command line determines the coercion mechanism and the payload, which scope the response.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which SYSTEM-owned process connected to the coerced named pipe, and was a token impersonated from it?
  context: >-
    The escalation works by getting a privileged process to authenticate to a local named pipe the tool controls, then
    impersonating that connection's token. The auth source depends on the interface — MS-RPRN coercion draws the
    connection from spoolsv.exe, MS-EFSR coercion from lsass.exe. Look for one of those processes connecting to a local
    pipe immediately before a new SYSTEM-context child appears, and for handle-access or named-pipe events tying the tool
    process to that pipe. This is the step that proves token theft rather than a failed attempt.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\spoolsv.exe'
          - '\lsass.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: What action ran at SYSTEM or high integrity on this host right after the escalation?
  context: >-
    Token theft is a means to an end. The chosen -c binary spawns in SYSTEM context, and the operator's next steps run at
    that integrity level — credential dumping, persistence installation, security-tool tampering, or remote-execution
    staging. Examining SYSTEM and high-integrity processes spawned shortly after the alert reveals the objective and the
    blast radius.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: What process spawned this tool, and is that parent chain expected?
  context: >-
    The parent process shows how the tool was launched. A service-account parent such as an IIS worker (w3wp.exe), a
    database service, or a generic svchost-hosted service is consistent with the technique's target accounts. An
    interactive shell, a script host, or an Office application as the parent points to hands-on-keyboard or delivery via a
    document or script. Walk up to the parent's own parent if the immediate parent is itself a launcher.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did this tool spawn afterward?
  context: >-
    The processes the tool launches reveal its actual effect. A successful escalation produces the requested -c binary
    (cmd.exe, powershell.exe, or another program) running as SYSTEM; subsequent children of that process carry the
    post-escalation activity. An absence of spawned children may indicate a failed or blocked attempt.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_loader_img:
        Image|endswith: \CoercedPotato.exe
      selection_params:
        CommandLine|contains: ' --exploitId '
      selection_loader_imphash:
        Hashes|contains:
        - IMPHASH=A75D7669DB6B2E107A44C4057FF7F7D6
        - IMPHASH=F91624350E2C678C5DCBE5E1F24E22C9
        - IMPHASH=14C81850A079A87E83D50CA41C709A15
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_loader_img:
        Image|endswith: \CoercedPotato.exe
      selection_params:
        CommandLine|contains: ' --exploitId '
      selection_loader_imphash:
        Hashes|contains:
        - IMPHASH=A75D7669DB6B2E107A44C4057FF7F7D6
        - IMPHASH=F91624350E2C678C5DCBE5E1F24E22C9
        - IMPHASH=14C81850A079A87E83D50CA41C709A15
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user account do across the network in the surrounding window?
  context: >-
    Tracking the account's activity across hosts reveals whether the escalation is isolated or part of movement across
    endpoints. If the same account triggered related activity on other hosts in the window, the scope is broader. This
    pivot is informative for a human account; under a service principal it returns agent-telemetry noise, so the
    launch-mechanism spread is the meaningful read in that case.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_loader_img:
        Image|endswith: \CoercedPotato.exe
      selection_params:
        CommandLine|contains: ' --exploitId '
      selection_loader_imphash:
        Hashes|contains:
        - IMPHASH=A75D7669DB6B2E107A44C4057FF7F7D6
        - IMPHASH=F91624350E2C678C5DCBE5E1F24E22C9
        - IMPHASH=14C81850A079A87E83D50CA41C709A15
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: When this host previously matched this rule's pattern, what parents and accounts drove it, and does this alert fit?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the resulting parent and account distribution
    reflects how this specific firing pattern has run here historically, not generic binary usage. A new parent process,
    an unexpected account, or an unfamiliar command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_loader_img:
        Image|endswith: \CoercedPotato.exe
      selection_params:
        CommandLine|contains: ' --exploitId '
      selection_loader_imphash:
        Hashes|contains:
        - IMPHASH=A75D7669DB6B2E107A44C4057FF7F7D6
        - IMPHASH=F91624350E2C678C5DCBE5E1F24E22C9
        - IMPHASH=14C81850A079A87E83D50CA41C709A15
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts matched this rule's pattern in the past week, and is the spread automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this
    firing pattern rather than generic use of the binary. Many hosts matching the same pattern points to scripted
    deployment or vendor tooling; one host or a small unrelated set points to manual operator activity. Use the host
    distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_loader_img:
        Image|endswith: \CoercedPotato.exe
      selection_params:
        CommandLine|contains: ' --exploitId '
      selection_loader_imphash:
        Hashes|contains:
        - IMPHASH=A75D7669DB6B2E107A44C4057FF7F7D6
        - IMPHASH=F91624350E2C678C5DCBE5E1F24E22C9
        - IMPHASH=14C81850A079A87E83D50CA41C709A15
      condition: 1 of selection_*
    fields:
    - host.name
- question: Did this process write any files on the host?
  context: >-
    Even after the original process exits, file artifacts can confirm execution and reveal scope. The query returns files
    created by the tool's process on this host so the analyst can identify dropped payloads, output, or staged content.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Escalation rarely happens in isolation. Earlier detections on the same host — reconnaissance, initial execution,
    defense tampering, or credential access — help reconstruct what preceded the escalation and place it in a timeline.
    The ordering of alerts often tells the story of how the operator reached this point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
