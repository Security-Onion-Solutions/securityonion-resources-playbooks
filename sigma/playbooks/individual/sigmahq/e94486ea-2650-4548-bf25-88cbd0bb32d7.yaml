name: Lace Tempest File Indicators
id: 9d1201c7-931e-4008-a017-76aa797e3393
description: |
  Detects file-creation events for fixed paths under the SysAid Tomcat webroot — a usersfiles.war archive, a user.exe loader under webapps\usersfiles, a webapps\leave marker file, or webapps\user.* variants — the on-disk footprint left when on-premises SysAid servers are exploited through the CVE-2023-47246 path-traversal flaw, tradecraft associated with the Lace Tempest intrusion set. These names are not written by the product's own deployment or upgrade process, so legitimate occurrences are essentially limited to authorized security testing. Investigation should confirm the exact path and writing process, collect the artifacts before cleanup deletes them, determine whether the loader executed or the servlet container spawned command shells, and check other SysAid instances for the same writes.
type: detection
detection_id: e94486ea-2650-4548-bf25-88cbd0bb32d7
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the created file match one of the SysAid Tomcat webroot paths this rule detects?
  context: The rule fires when a file path ends with \Program Files\SysAidServer\tomcat\webapps\usersfiles\user.exe, \webapps\usersfiles.war, or \webapps\leave, or contains the segment \Program Files\SysAidServer\tomcat\webapps\user. with any extension. A match on any single one of these paths satisfies the rule — confirm the exact path, the operation performed, and the responsible process before investing investigation time.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - file_event
- question: Is this host an on-premises SysAid server, and is there an expected change writing to its Tomcat webapps directory?
  context: A SysAid upgrade or vendor maintenance session is the only plausible producer of new content under the SysAidServer Tomcat webroot, and the flagged filenames are not part of the product's own deployment. The query displays the triggering event's host, user, and writing process; when the user is a machine or service account, judge by the writing process and the host's exposure — internet-facing SysAid instances were the exploitation target.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this activity part of an authorized penetration test or red team engagement?
  context: Exploitation of an internet-facing help desk application followed by a webroot payload drop is a standard assessment scenario. Check whether a penetration test or red team exercise is currently active against this host or network segment; an authorized engagement with matching timing and scope resolves the alert. Webroot artifacts on a production SysAid server outside a declared engagement should be escalated.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: Is the file still on disk, or was it deleted or renamed after the alert?
  context: The tradecraft associated with these indicators includes a cleanup script that removes usersfiles.war and user.* files from the webroot after the loader runs, so deletion shortly after creation fits the post-exploitation pattern rather than suggesting a benign event. A file still on disk can be retrieved, hashed, and unpacked; interpret each returned row by its EventType.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Are the other file indicators from this intrusion pattern present on the same host?
  context: The rule's paths travel as a set — a WAR archive (usersfiles.war) that unpacks to a webshell, a user.exe loader under webapps\usersfiles, a webapps\leave marker file, and user.* variants. The alert fires on whichever was written first; checking for the companions shows how far the deployment progressed and enumerates what must be collected before cleanup deletes it.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - '\SysAidServer\tomcat\webapps\usersfiles'
          - '\SysAidServer\tomcat\webapps\leave'
          - '\SysAidServer\tomcat\webapps\user.'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What does the dropped file contain?
  context: Retrieve the artifact and analyze it. A usersfiles.war archive unpacks to JSP and class content — inspect it for webshell code. The user.exe variant functions as a loader that injects its payload into msiexec.exe, svchost.exe, or spoolsv.exe — check imports, packer signatures, and signing status. A bare leave file is a marker whose presence alone is meaningful; record its timestamps. Content retrieval requires endpoint access; the query shows the write events for the artifact.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
- question: Which process wrote the file, and what do its command line and parent reveal?
  context: The writer identifies the delivery stage. A write from the Tomcat service — java.exe running under the SysAid service wrapper — is consistent with upload through the path-traversal flaw in the web application, while a PowerShell writer indicates post-exploitation staging. Decode any PowerShell arguments and watch for hidden-window one-liners, environment-variable indirection ending in Invoke-Expression, and commands that remove webroot files after running the loader. The window is wide because a long-running service writer starts hours or days before the alert.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: If the dropped executable has run, what is its hash and does it have known detections?
  context: File-creation events carry no hash — the hash is recorded on the execution event. This query looks for the dropped file executing and reads its hash; submit it to threat intelligence to determine whether it is known malicious or previously unseen. This applies to the user.exe variant; the WAR archive does not execute as a process (its webshell runs inside the servlet container), so for that variant retrieve the file from disk and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: Did processes under the SysAidServer directory spawn command shells or discovery utilities around the alert?
  context: Webshell commands execute as children of the servlet container — on a SysAid server that is the Java service wrapper and java.exe running from the SysAidServer directory. Children such as cmd.exe, ping.exe, or powershell.exe under that parent are the webshell-interaction pattern associated with these indicators; each hit's command line shows what the operator ran.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|contains: ':\Program Files\SysAidServer\'
        Image|endswith:
          - '\cmd.exe'
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\ping.exe'
          - '\whoami.exe'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Did powershell.exe or the loader's injection-target processes initiate outbound connections after the alert?
  context: The post-drop chain fetches a second stage with a hidden PowerShell one-liner that downloads and executes content over HTTP, and the loader injects into msiexec.exe, svchost.exe, or spoolsv.exe, which then carry command-and-control traffic. The query returns outbound connections from powershell.exe, msiexec.exe, and spoolsv.exe on this host (svchost.exe is omitted for volume); external destinations that are not vendor update infrastructure need explanation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        Image|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\msiexec.exe'
          - '\spoolsv.exe'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
  answer_sources:
  - network_connection
- question: What other files did the responsible process write or delete around the alert?
  context: A single dropped indicator rarely travels alone — the WAR unpack produces webshell content, the loader stages components, and the cleanup pass deletes them. The correlation covers the writer and its direct children; watch where the writes land, since additional payloads outside the webroot widen the affected surface beyond what the rule's fixed paths cover.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: What else has been written to the SysAid Tomcat webapps directory recently, and by which processes?
  context: The webapps directory of a servlet container has a small set of legitimate writers — the product's own deployment and upgrade processes. Other recent arrivals reveal whether this is an isolated drop or a webroot under active use, including earlier upload attempts or additional archives the rule's fixed paths do not enumerate. A single unfamiliar writer across several files is the signal to chase.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\SysAidServer\tomcat\webapps\'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Is the same file present on any other hosts in the environment?
  context: Organizations often run more than one SysAid instance, and exploitation of an internet-facing service tends to touch every reachable installation. The fleet-wide match on the alerting filename identifies other servers with the same artifact; each hit needs the same triage as this host, and the write timeline across hosts indicates whether exploitation was sequential or scripted.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- always_include: true
  question: Has this user account previously produced this rule's file pattern, and does that fit its role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the account's 90-day history of writes matching these webroot paths, aggregated by host. For these paths any prior history is unexpected outside vendor maintenance; when the write is service-driven the user is often a machine or service account, and the parent-scoped variant of this question is the meaningful attribution.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
      - TargetFilename|endswith:
        - :\Program Files\SysAidServer\tomcat\webapps\usersfiles\user.exe
        - :\Program Files\SysAidServer\tomcat\webapps\usersfiles.war
        - :\Program Files\SysAidServer\tomcat\webapps\leave
      - TargetFilename|contains: :\Program Files\SysAidServer\tomcat\webapps\user.
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
  - organizational_knowledge
- always_include: true
  question: Has this program historically driven this rule's file pattern, or is the program new for this activity?
  context: When the alert fires under a service principal, user identity does not attribute behavior. The meaningful pivot is the launch mechanism — the query mirrors the rule's selection scoped to the alerting program, giving the 90-day history of this program driving this specific pattern rather than generic program activity. Any recurring program here should be identified precisely; no routine automation legitimately reproduces these webroot paths.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
      - TargetFilename|endswith:
        - :\Program Files\SysAidServer\tomcat\webapps\usersfiles\user.exe
        - :\Program Files\SysAidServer\tomcat\webapps\usersfiles.war
        - :\Program Files\SysAidServer\tomcat\webapps\leave
      - TargetFilename|contains: :\Program Files\SysAidServer\tomcat\webapps\user.
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the account's process activity across all hosts in the alert window reveals movement beyond this server — remote execution utilities, credential tools, or archiving binaries appearing on other hosts under the same account widen the compromise scope. If the account is a service principal this view fills with routine agent noise, and the parent-driven variant of this question is the meaningful one.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window, or is it isolated to this host?
  context: Under a service principal, user-scoped clustering returns agent-telemetry noise. The query mirrors the rule's selection scoped to the alerting program, fleet-wide, in the alert window — multiple SysAid servers producing the same webroot writes in the same window points to scripted exploitation of every reachable instance, while a single host points to a host-local event.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
      - TargetFilename|endswith:
        - :\Program Files\SysAidServer\tomcat\webapps\usersfiles\user.exe
        - :\Program Files\SysAidServer\tomcat\webapps\usersfiles.war
        - :\Program Files\SysAidServer\tomcat\webapps\leave
      - TargetFilename|contains: :\Program Files\SysAidServer\tomcat\webapps\user.
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host can reconstruct the stages that preceded the file drop — web-application exploitation activity, unusual child processes of the servlet container, or PowerShell execution alerts commonly come first. Review the sequence for a progression from initial access through payload staging to this write.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
