name: UEFI Persistence Via Wpbbin - FileCreation
id: 43f53c47-8a70-4088-b355-056a77f956b4
description: |
  Detects creation of C:\Windows\System32\wpbbin.exe, the path where the Windows Session Manager
  (smss.exe) writes an executable supplied by UEFI firmware through the Windows Platform Binary
  Table (WPBT) during early boot. A few hardware vendors legitimately ship WPBT-delivered software,
  so on those machines the file is rewritten by smss.exe as SYSTEM at every startup; on most
  enterprise endpoints the file should not exist at all, and its appearance can indicate
  firmware-level persistence - a planted WPBT structure executes before user logon, survives OS
  reinstallation, and runs on BitLocker-protected volumes after runtime decryption - or an attacker
  staging or planting the file directly from a running session. Investigation should establish
  whether the writer was smss.exe during boot on hardware that ships WPBT, what the written binary
  is and whether it executed, whether firmware flashing tooling preceded the write, and how widely
  the file appears across the fleet.
type: detection
detection_id: e94b9ddc-eec5-4bb8-8a58-b9dc5f4e185f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Was the created file exactly C:\Windows\System32\wpbbin.exe?
  context: >-
    The rule fires on one exact path - C:\Windows\System32\wpbbin.exe. Confirm the triggering
    event's full path and the operation performed against that criterion before investing further
    time. This is the path where the Session Manager (smss.exe) materializes a UEFI-supplied WPBT
    binary seconds into boot, so the write's timing - and the writer's identity, surfaced by the
    host-and-user context question - determine whether the event fits the firmware mechanism or a
    direct plant by a running process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this host's hardware known to ship a WPBT binary, and is this write consistent with that?
  context: >-
    Some hardware manufacturers legitimately use WPBT to install vendor software; on those machines
    wpbbin.exe is written by smss.exe as SYSTEM at every boot, so the same event recurs on every
    startup and on every same-model machine. Check asset inventory for this host's manufacturer and
    model and whether peers of the same model produce the same write. A writer other than smss.exe,
    or an interactive user account on the event, does not fit the vendor-delivered pattern.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Did this write occur during system startup, or in the middle of a running session?
  context: >-
    The documented WPBT flow writes wpbbin.exe very early in boot, before user logon, as the Session
    Manager initializes the system - so a write that coincides with host startup fits the firmware
    mechanism, whether vendor-shipped or implanted. A mid-session write points to the file being
    planted directly rather than delivered from firmware. Also correlate with approved firmware or
    BIOS update windows: vendor updates are the expected occasions for WPBT contents to change, and
    activity outside those windows deserves more scrutiny.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is wpbbin.exe still on disk, or was it deleted or renamed after the alert?
  context: >-
    A copy still on disk can be retrieved, hashed, and analyzed - do this before the next reboot,
    because on WPBT-carrying machines smss.exe rewrites the file from UEFI memory at every startup.
    Deletion shortly after creation suggests cleanup and shifts attention to what executed in
    between. Note that some environments deliberately pre-create a read-only wpbbin.exe as a
    blocking placeholder; smss.exe does not clear the read-only attribute, so on those hosts the
    overwrite fails and the pre-existing file is not the payload.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What is inside the written wpbbin.exe - is it a valid force-integrity-signed executable, and what does it do?
  context: >-
    Retrieve the file and analyze it. A binary that WPBT will actually execute must be signed with
    forced integrity (IMAGE_DLLCHARACTERISTICS_FORCE_INTEGRITY), and because it runs before the
    Win32 subsystem initializes it typically imports only ntdll.dll exports. Check the signer
    identity, import table, packer or obfuscation indicators, and embedded strings such as URLs, IP
    addresses, or command fragments. An unsigned file or one importing Win32 APIs at this path would
    not survive the integrity check - that profile suggests staging, a decoy, or a different
    delivery plan rather than a functional WPBT payload.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If wpbbin.exe has executed, what is its hash, and is that hash known to threat intelligence?
  context: >-
    File-creation events carry no hash - the hash is recorded when the file runs. This query looks
    for wpbbin.exe executing on this host and reads its hash for reputation lookup against threat
    intelligence services. A hash matching a vendor's known WPBT component supports the OEM
    explanation; an unknown or flagged hash escalates the investigation. If the file has not
    executed, retrieve the on-disk copy and hash it manually.
  range: +/-24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: Was wpbbin.exe executed after it was written, and with what command line?
  context: >-
    In the WPBT mechanism the Session Manager executes the file immediately after writing it, with a
    command line taken from the same UEFI block - so execution normally lands within seconds of the
    write, at boot, under an smss.exe parent. Execution long after the write or under a different
    parent indicates a manual or scripted launch rather than firmware delivery. The command line
    itself originates in firmware and may reveal the payload's parameters or targets.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    If the writer is smss.exe during boot, its other file activity is routine session-manager
    initialization work - look for writes landing outside expected system locations. If the writer
    is any other process, the breadth, paths, and extensions of its file activity distinguish a
    single planted artifact from a tool staging multiple components, and enumerate what else needs
    review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to System32 recently, and by which processes?
  context: >-
    Writes into the System32 directory legitimately come from a small set of servicing processes
    running as SYSTEM or TrustedInstaller. Aggregating a week of writes by path and writing process
    surfaces any unfamiliar process placing binaries alongside wpbbin.exe - a single unexpected
    writer across several system paths is the signal worth pulling on, and other recent arrivals in
    the directory may belong to the same activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\Windows\System32\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Were firmware or BIOS flashing utilities executed on this host in the days before the alert?
  context: >-
    Planting a WPBT structure requires UEFI write access, which on a running system usually means a
    firmware flashing utility or vendor update tool ran first. Look for flashing-tool executions
    outside approved update windows or by accounts that are not IT management accounts - those are
    the precursor to this write. Where a legitimate update did occur, verify the flashed image
    against vendor known-good firmware hashes, since a tampered update is itself a delivery path.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\fwupdate.exe'
          - '\fptw64.exe'
          - '\fpt.exe'
          - '\afuwin.exe'
          - '\afuwinx64.exe'
          - '\winflash.exe'
          - '\winflash64.exe'
          - '\h2offt-w.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: Has the WPBT execution control value been modified on this host?
  context: >-
    Setting the DisableWpbtExecution value to 1 under HKLM\SYSTEM\CurrentControlSet\Control\Session
    Manager stops smss.exe from executing UEFI-supplied binaries. A recent change matters in both
    directions - a change to 0 re-enables the mechanism ahead of an implant, while a defender-set 1
    means the written file will not run through WPBT. Value removal is not observable in this
    telemetry, so judge by the modification history here together with whether wpbbin.exe actually
    executed afterward.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|endswith: '\Session Manager\DisableWpbtExecution'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- always_include: true
  question: Has this user account been associated with wpbbin.exe writes before, and does that fit the account's role?
  context: >-
    The query counts this user's 90-day history of the rule's exact firing pattern - writes of
    C:\Windows\System32\wpbbin.exe - aggregated by host. In the firmware-delivered path the write
    occurs as SYSTEM during boot, so an interactive account appearing here is itself out of profile.
    For any account, zero prior history means a first occurrence; weigh recurring history against
    the account's role and whether it belongs to firmware or endpoint management tooling.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename: C:\Windows\System32\wpbbin.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program driven wpbbin.exe writes before, on this host or elsewhere, or is the program new for this pattern?
  context: >-
    When the write fires under SYSTEM or another service principal, the launch mechanism attributes
    the behavior better than user identity. This query counts the 90-day history of the alerting
    program driving this exact write pattern, aggregated by host. On hardware that ships
    WPBT, the pattern recurs at every boot under the same system program across the model's fleet; a
    new or rare program for this pattern is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename: C:\Windows\System32\wpbbin.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the environment around the time of the write?
  context: >-
    Cross-host activity for this account in the hour around the alert shows whether the write is
    part of wider hands-on activity - tool staging, lateral movement, additional persistence - or an
    isolated event. When the account is SYSTEM or a machine account this view fills with routine
    service telemetry; in that case the parent-scoped fleet question is the meaningful variant.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did the same program-driven wpbbin.exe write fire on other hosts in the same window?
  context: >-
    Fleet-wide, same-window recurrence of this exact write pattern under the same program
    separates coordinated or vendor-scheduled activity from a single-host event. On WPBT-shipping
    hardware, expect the write on same-model machines around their boot times. A cluster of hosts
    producing the write mid-session, or across mixed hardware models, does not fit the vendor
    mechanism and suggests deliberate distribution.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename: C:\Windows\System32\wpbbin.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other file activity occurred on this host around the time of the alert, and which processes drove it?
  context: >-
    The minutes around the write reveal its immediate context - what led to the event and what
    followed. Aggregating by writing process and operation type collapses routine churn into
    high-count rows while unusual writers stand out at low counts; review any unfamiliar process
    touching system paths in the same window, and note whether the overall activity fits a host in
    early boot.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - EventType
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - defense tampering, privilege escalation, suspicious
    tooling - may show how an attacker obtained the access needed to flash firmware or to plant a
    file in System32, and help reconstruct the sequence that led to this write. Review the alert
    timeline for stages that logically precede a pre-OS persistence attempt.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Is wpbbin.exe present on any other hosts in the environment?
  context: >-
    This file should not exist on most enterprise endpoints. Fleet-wide presence concentrated in one
    hardware model and recurring around boot times indicates vendor-shipped WPBT and can be
    baselined; presence on scattered hosts of mixed models, or appearing mid-session, indicates the
    file is being distributed by other means and widens the investigation to every host it touched.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
