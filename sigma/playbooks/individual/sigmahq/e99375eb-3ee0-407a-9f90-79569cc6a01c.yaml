name: Kalambur Backdoor Curl TOR SOCKS Proxy Execution
id: 3bbafa71-55f6-456d-9338-a5d07414a97b
description: |
  Detects curl.exe running with a SOCKS proxy URL (socks5h://, socks5:// or socks4a://) and a
  .onion address on the same command line. All three conditions must hold together for the rule
  to fire, so the alerting event is a single command-line transfer aimed at a hidden service by
  way of a SOCKS listener. The Kalambur backdoor uses this pattern: it installs its own Tor
  instance bound to loopback and drives curl.exe through it to reach command-and-control, which
  means the curl process connects to a local listener and the .onion target is carried only on
  the command line rather than in the process's own connection record. Determine what the command
  fetched or sent, which process assembled and launched it, what installed and started the local
  proxy, and whether this pattern has any precedent for the host, the user, or the fleet.
type: detection
detection_id: e99375eb-3ee0-407a-9f90-79569cc6a01c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: >-
    Does the alerting command line show curl.exe invoked with both a SOCKS proxy URL and a .onion
    address?
  context: >-
    The rule requires all three conditions at once — an image ending in curl.exe, a command line
    carrying socks5h://, socks5:// or socks4a://, and a command line carrying .onion. Read the
    event and confirm each part is present rather than a substring appearing inside an unrelated
    argument such as a file path or a user agent string.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: >-
    Is this user and host expected to reach external services through a SOCKS proxy using a
    command-line transfer tool?
  context: >-
    curl.exe ships with Windows and is used routinely by developers, packaging scripts and
    administrators, but proxying it through a SOCKS listener onto a hidden service is not part of
    ordinary administration. Establish whether the account belongs to someone whose role involves
    proxied network testing and whether the host is a workstation, a build machine or a server.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: >-
    Is anonymised tunnelling through a SOCKS proxy sanctioned on this host, and what business
    purpose would it serve?
  context: >-
    Organisations normally list the tunnelling and remote-access software permitted on their
    estate. A local SOCKS listener carrying traffic to a hidden service is rarely on that list;
    where it is, it is usually confined to named research or privacy-testing hosts. Check the
    approved software inventory and the host's build standard before treating the tunnel as
    sanctioned, and note that the tool's own reputation is not the question — the authorisation is.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: >-
    Where did the curl process actually connect, and does that endpoint match the proxy address
    named on its command line?
  context: >-
    When curl is pointed at a SOCKS URL such as socks5h://127.0.0.1:9050 its own connection
    terminates at a loopback listener; the hidden-service destination is resolved and contacted by
    the separate proxy process, so the .onion address will not appear as this process's
    destination. Use this result to confirm the listener exists and to read its port — loopback
    with a Tor-style 9050, or a proxy port such as 1080, 8080 or 4444, tells you a local proxy
    service is running and gives you the process to pivot to for the real egress. A destination
    that is not loopback means the proxy is hosted elsewhere and that address is worth reputation
    checks in its own right.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
  answer_sources:
  - network_connection
- question: >-
    What did curl.exe do in this window — which hidden-service address, proxy target, output path
    and request body were used?
  context: >-
    Decode every argument. The scheme distinguishes where name resolution happens (socks5h hands
    the hostname to the proxy, socks5 and socks4a differ in what they resolve locally), -o and -O
    name where retrieved content lands on disk, -d and -F indicate data being sent outward rather
    than fetched, and -H, -A and --retry reveal how the client is presenting itself and how
    persistently it retries. Backdoors that use this pattern typically run several curl
    invocations in sequence — registration, tasking poll, payload fetch, result upload — so read
    the window as one operation rather than a single command.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: >-
    Was the invocation obfuscated, and what does the fully resolved curl request fetch or send?
  context: >-
    The alerting arguments are plain text, so there is no base64 payload to decode here; the
    analytical work is reading the request itself. Identify the hidden-service host and path, the
    local proxy endpoint, and whether the invocation retrieves content or posts host data such as
    a public IP or a machine UUID outward. Command lines of this kind are frequently assembled by
    a wrapping script through variable substitution and concatenation, so treat the literal string
    as the resolved output of something else and look for the script that built it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: >-
    Did script block logging capture the script that assembled and ran this curl request?
  context: >-
    Event ID 4104 records the deobfuscated script content PowerShell actually executed, which is
    where a loader that terminates an existing proxy service, installs its own Tor instance on
    loopback and then drives curl through it becomes readable end to end. If PowerShell
    operational logs are not ingested in this environment, treat an empty result as a visibility
    gap rather than evidence that no script ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
  answer_sources:
  - powershell_script_block
- question: >-
    Which TLS and cryptographic modules did the curl process load, and were they signed system
    libraries or DLLs from a non-system path?
  context: >-
    Encrypted channel activity is corroborated by correlating the process with the encryption
    libraries it loads. A stock curl build resolves its TLS and certificate handling to signed
    system libraries under System32; a repackaged or relocated copy that side-loads its own
    crypto DLLs from a user-writable directory is a different binary from the one the OS ships,
    which changes what the process can do and how its traffic is protected. Unsigned or
    untrusted-signature loads at a non-system path are the deviation to chase. Traffic-level
    entropy or outbound-to-inbound volume ratios are not visible from process telemetry, so
    module provenance is the endpoint-side substitute for that judgement.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
  answer_sources:
  - process_creation
  - manual_review
- question: >-
    Were PowerShell or antimalware controls weakened on this host in the hour before this
    execution?
  context: >-
    Loaders that stage a proxy and a command-line transfer tool commonly relax the environment
    first — adding antimalware exclusion paths for the folder they write to, disabling real-time
    monitoring, or running with an execution policy bypass so an unsigned staging script will run.
    Hits here place the curl execution inside a staging sequence rather than treating it as an
    isolated command.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: What process launched curl.exe, and how was that parent itself started?
  context: >-
    curl called from an interactive shell by an administrator reads very differently from curl
    called by a script host, an installer, a scheduled-task binary, or an unfamiliar executable
    living in a user-writable directory. The parent's own command line usually shows whether the
    request was hand-typed or emitted by a wrapper, and the parent's start time indicates whether
    it is a long-running service or something that appeared minutes before the alert.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What else did the same parent process launch around this execution?
  context: >-
    curl itself rarely spawns children, so the productive view is the set of siblings the same
    parent produced. A proxied fetch is normally one step in a sequence — a proxy service being
    terminated and reinstalled, task scheduling for persistence, an archive being expanded, and
    the retrieved binary being executed. Siblings show whether the fetched content was run and
    what else the launching process was orchestrating.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Aggregating parent and child pairs collapses repetitive agent telemetry into a few high-count
    rows while novel pairs stand out at low counts. Scan the window for a proxy binary being
    installed or started, task registration, archive expansion, system and hardware enumeration,
    and changes to remote-access services — any of which would place the request in a wider
    sequence. A short burst of otherwise unrelated tooling in the same minutes is the pattern to
    look for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: >-
    When this host has previously produced the rule's pattern, what parents and users drove that
    activity, and does the current alert fit that history?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the resulting
    parent and user distribution reflects how this specific firing pattern — curl with a SOCKS
    URL and a .onion address — has run here before, not generic curl usage. For most hosts this
    returns nothing, which itself is the answer. Where there is history, a new parent process or
    an unexpected account is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \curl.exe
      selection_socks:
        CommandLine|contains:
        - socks5h://
        - socks5://
        - socks4a://
      selection_onion:
        CommandLine|contains: .onion
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: >-
    Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is their
    90-day history of proxied curl requests to hidden services, aggregated by host, rather than
    their generic use of curl. An account with no prior occurrences is a different proposition
    from one that produces this regularly; weigh the count against what the person's role
    actually requires.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \curl.exe
      selection_socks:
        CommandLine|contains:
        - socks5h://
        - socks5://
        - socks4a://
      selection_onion:
        CommandLine|contains: .onion
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: >-
    Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: >-
    When the alert fires under a service principal, the user field does not attribute the
    behaviour and the launch mechanism is the meaningful pivot. This query mirrors the rule's
    selection structure scoped to the alerting parent, giving the 90-day history of that parent
    driving proxied curl requests to hidden services. A parent that already accounts for a large
    volume of prior events is automation; a parent that has never done this before is the
    deviation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \curl.exe
      selection_socks:
        CommandLine|contains:
        - socks5h://
        - socks5://
        - socks4a://
      selection_onion:
        CommandLine|contains: .onion
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did this user account do across the environment around this time?
  context: >-
    Tracking the account's activity on every host in the surrounding hour shows whether the
    request is confined to one endpoint or part of activity spanning several. The same account
    driving comparable tooling on multiple hosts widens the scope of the investigation. If the
    alert fired under a machine or service account this view returns routine agent telemetry and
    the parent-scoped fleet question is the one that carries signal.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: >-
    Did the same parent-driven pattern fire on other hosts in the same window, or is the activity
    isolated to this host?
  context: >-
    Under a service principal, asking what else the user did returns telemetry from agents that
    run everywhere. The question that carries signal is whether the same launch mechanism produced
    the same proxied-curl pattern elsewhere in the alert window. Several hosts at once points to
    pushed or scheduled automation; a single host points to a host-local trigger and a narrower
    scope.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \curl.exe
      selection_socks:
        CommandLine|contains:
        - socks5h://
        - socks5://
        - socks4a://
      selection_onion:
        CommandLine|contains: .onion
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: >-
    Have other hosts fired the rule's pattern in the past week, and does the cross-host
    distribution look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of proxied curl requests to hidden services rather than the binary's general
    footprint. Several unrelated hosts producing the same pattern within days of each other
    indicates the staging is not confined to the alerting endpoint and changes the containment
    question. A single host points to a local trigger.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \curl.exe
      selection_socks:
        CommandLine|contains:
        - socks5h://
        - socks5://
        - socks4a://
      selection_onion:
        CommandLine|contains: .onion
      condition: all of selection_*
    fields:
    - host.name
  answer_sources:
  - process_creation
