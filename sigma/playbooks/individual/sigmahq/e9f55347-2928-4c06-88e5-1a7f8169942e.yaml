name: Invoke-Obfuscation VAR++ LAUNCHER OBFUSCATION
id: c3e4f541-edf8-4298-9358-5ef819514f8b
description: |
  Detects a cmd.exe command line that carries the signature of the Invoke-Obfuscation VAR++ launcher
  transform — the tokens &&set, cmd, /c, and -f appearing together alongside PowerShell format-string
  index markers ({0} through {5}). The transform builds a PowerShell expression at runtime by setting
  environment variables and reassembling a reordered format string, hiding the real command from casual
  inspection until it is executed. This obfuscation is almost never produced by legitimate scripting, so
  the investigation should reconstruct the format string into the actual PowerShell payload, confirm what
  spawned the cmd.exe shell, and determine what executed afterward.
type: detection
detection_id: e9f55347-2928-4c06-88e5-1a7f8169942e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line contain the &&set, cmd, /c, and -f tokens together with PowerShell format
    markers like {0} through {5}?
  context: Confirm the alert is a true positive by reviewing the exact command line. The rule fires only when
    the &&set, cmd, /c, and -f tokens all appear and at least one numeric format marker ({0}-{5}) is present,
    which together are the runtime-assembly signature of the VAR++ launcher transform. Verify the full command
    before investing further time.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run cmd.exe one-liners that build PowerShell commands from
    environment variables and format strings?
  context: Legitimate administration almost never assembles a PowerShell command at runtime from set commands
    and reordered format strings. Knowing whether the user role and host function include any tooling that
    produces this construction is often the fastest way to separate a true positive from a rare automation
    artifact.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this Invoke-Obfuscation activity part of an authorized penetration test or red team engagement?
  context: The VAR++ launcher transform ships with an offensive PowerShell obfuscation framework used in
    authorized security assessments. Before investing analysis time, check whether a penetration test or red
    team exercise is currently active on this host or network segment. An authorized engagement with matching
    timing resolves the alert without further work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Reconstruct the format string and environment-variable assignments. What PowerShell command does
    the launcher actually build and run?
  context: The VAR++ transform stores fragments in environment variables with set, then reassembles them
    through a -f format operation whose {0}-{5} markers reorder the pieces. Resolve each set assignment, apply
    the format reordering, and read the reconstructed command. The decoded result is the real payload — look
    for a download cradle, an in-memory loader, or a reverse shell. Because cmd.exe is too common to scope by
    binary, the lookup is keyed to the alerting event itself.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: After the format string is reassembled, was the resulting PowerShell further encoded or obfuscated,
    and what does the final layer decode to?
  context: The VAR++ launcher is one obfuscation layer; the command it builds is frequently obfuscated again,
    using base64 -EncodedCommand, string concatenation, backtick escaping, or further variable substitution.
    Iterate the decode until the script is readable. The final layer typically reveals the real intent — a
    download cradle, a reverse shell, or in-memory execution of a .NET assembly.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which Invoke-Obfuscation transform produced this command, and does the reconstructed payload point
    to download, in-memory loading, or recon?
  context: The framework offers many transforms, and the rebuilt command determines the scope of potential
    compromise. Identify the launcher style from the set and format-string construction, then read the
    reconstructed payload to classify the operation — a Net.WebClient or IWR download cradle, a
    Reflection.Assembly load, or a reconnaissance one-liner. The capability invoked drives the required
    response actions.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the deobfuscated script content?
  context: Script block logging (Event ID 4104) records the deobfuscated script content PowerShell actually
    executes, even when the launcher hides it behind environment variables and a reordered format string. This
    is ground truth that bypasses the obfuscation. If PowerShell operational logs are not ingested in this
    environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell security controls bypassed or weakened on this host before the obfuscated command
    ran?
  context: Obfuscated launchers are commonly paired with controls that reduce visibility or restrictions —
    AMSI bypass (patching amsi.dll in memory), execution policy changes, a downgrade to PowerShell v2 which
    lacks modern logging, or Defender preference changes. Finding these precursor events in the hour before the
    launcher strengthens the case for malicious intent.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: What process spawned this cmd.exe shell, and is that parent chain expected?
  context: The parent reveals how the launcher was invoked. Interactive use under explorer.exe or a console
    differs sharply from a spawn by mshta.exe, wscript.exe, rundll32.exe, an Office application, or a web
    server worker process — those parents point to a macro, exploit, or scripted delivery rather than an
    operator at the keyboard.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: How many format markers and set assignments does the command line carry, and does its length and
    fragmentation look like a generated launcher rather than a hand-typed command?
  context: A VAR++ launcher is long and fragmented — multiple set assignments feeding a -f format operation
    with several reorder markers, well beyond what an operator types by hand. Count the {0}-style markers and
    set statements and gauge the overall length and randomness. A short command with one or two markers is
    more consistent with a benign coincidence than with the generated transform.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: In the minutes around the obfuscated command, were encoded, compressed, or encrypted files created
    on this host?
  context: Obfuscated launchers frequently stage a second payload — an encoded blob, a .zip or .7z archive, or
    an .enc file written shortly before or after execution. A new encoded file in the same window ties the
    in-command obfuscation to a file artifact that can be hashed and analyzed. If file telemetry is not
    collected for this host, treat the absence of results as a visibility gap rather than evidence nothing was
    written.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_ext:
        TargetFilename|endswith:
          - '.zip'
          - '.7z'
          - '.gz'
          - '.rar'
          - '.enc'
          - '.b64'
          - '.dat'
      condition: selection and selection_ext
    fields:
      - TargetFilename
      - Image
- question: What child processes did this cmd.exe shell spawn afterward?
  context: The processes spawned after the launcher reveal its actual impact. A reconstructed payload that
    launches powershell.exe, another cmd.exe, certutil.exe, rundll32.exe, or an unexpected binary indicates
    post-execution activity rather than a self-contained command.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - '&&set'
        - cmd
        - /c
        - -f
        CommandLine|contains:
        - '{0}'
        - '{1}'
        - '{2}'
        - '{3}'
        - '{4}'
        - '{5}'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - '&&set'
        - cmd
        - /c
        - -f
        CommandLine|contains:
        - '{0}'
        - '{1}'
        - '{2}'
        - '{3}'
        - '{4}'
        - '{5}'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated activity on
    multiple endpoints. If the same user drove similar activity elsewhere in the same window, the scope of the
    incident may be larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - '&&set'
        - cmd
        - /c
        - -f
        CommandLine|contains:
        - '{0}'
        - '{1}'
        - '{2}'
        - '{3}'
        - '{4}'
        - '{5}'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired this launcher pattern in the past week, and does the cross-host distribution
    look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of
    the launcher pattern rather than generic cmd.exe usage. Many hosts firing the same pattern points to
    scripted deployment or vendor automation; one host or a small unrelated set points to manual operator
    activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - '&&set'
        - cmd
        - /c
        - -f
        CommandLine|contains:
        - '{0}'
        - '{1}'
        - '{2}'
        - '{3}'
        - '{4}'
        - '{5}'
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering,
    reconnaissance, or credential access — may reveal the attack stages that preceded the obfuscated launcher
    and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
