name: Potential PsExec Remote Execution
id: e4dc30d6-fdf6-4cb6-b9e8-c6ebca95ba3e
description: |
  Detects a command line carrying the PsExec/PAExec remote-execution flag combination — the EULA auto-accept switch, a username switch, a password switch, and a UNC target path (\\host) — with localhost and 127.* targets excluded. PsExec and its clones copy a service binary to the target's ADMIN$ share over SMB, register it under the Service Control Manager, and run it as LocalSystem, which is both a routine sysadmin remote-administration pattern and the canonical lateral-movement and mass-deployment mechanism in hands-on-keyboard intrusions. The investigation should determine which remote host was targeted, whether the source user and host normally perform remote execution, what was carried to or run on the target, and whether the activity is isolated or part of a wider push across multiple hosts.
type: detection
detection_id: ea011323-7045-460b-b2d7-0f7442ea6b38
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line carry the PsExec flag set — EULA accept, a -u user, a -p password, and a UNC target — against a non-local host?
  context: Confirm the alert is a true positive by reading the exact command line. The rule fires when all four elements are present together (accepteula, -u, -p, and a \\host target) and the target is not localhost or 127.*. Note the invoked binary and the UNC host named in the command, since the targeted host drives the rest of the investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and source host expected to run remote-execution tooling against other systems?
  context: Remote execution with explicit credentials is routine for administrators, deployment accounts, and management servers, and out of place for ordinary workstations and standard user accounts. Knowing whether the source user role and host function include remote administration is often the fastest way to separate sanctioned operations from operator activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly was the remote execution asked to do — which target host, which credentials, and what command or payload was launched there?
  context: The full command line reveals the operational intent. Identify the UNC target host, the account named by -u, and any -c copy, -s LocalSystem, -i interactive, -d detached, or -r service-rename switches, plus the command or executable run on the target. A copy-then-run pattern or a SYSTEM-level interactive shell is materially different from a single remote query.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
          - accepteula
          - ' -u '
          - ' -p '
          - ' \\\\'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - Image
- question: What process spawned this remote-execution command, and is that parent chain expected?
  context: The parent process shows how the command was launched. An interactive shell or a remote-administration console started by an administrator is a different posture than a script host, Office application, or a parent that itself looks anomalous driving the execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Has this source host run this PsExec flag pattern before, or is this the first time?
  context: A host that regularly performs credentialed remote execution has a baseline; a host that has never produced this pattern is more notable. Zero or very low historical counts indicate first-time or rare use of remote-execution tooling from this source.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
          - accepteula
          - ' -u '
          - ' -p '
          - ' \\\\'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this remote-execution pattern, what parents and users normally drive it, and does the current alert fit?
  context: The query mirrors the rule's selection scoped to this host, so the parent and user distribution reflects how this specific firing pattern — not generic tool usage — has historically run here. A new parent process, an unexpected account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - accepteula
        - ' -u '
        - ' -p '
        - ' \\\\'
      filter_main_localhost:
        CommandLine|contains:
        - \\\\localhost
        - \\\\127.
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What other processes ran on the source host with this same remote-execution pattern in the hours around the alert?
  context: Lateral-movement tooling is often run in batches — one invocation per target host, or a copy pass followed by a launch pass. Multiple firings of the same flag pattern from the source host in a short window point to a scripted push against several systems rather than a single administrative action.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
          - accepteula
          - ' -u '
          - ' -p '
          - ' \\\\'
      condition: selection
    fields:
      - CommandLine
- question: Which remote host was targeted, and is remote execution into that host from this source expected?
  context: The UNC target in the command line names the destination of the remote execution. Whether that destination is a server normally administered from this source, a peer workstation, or a sensitive system such as a domain controller or backup host changes the significance. A target list (@file) or a domain-wide wildcard target points to mass deployment rather than a one-off.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - accepteula
        - ' -u '
        - ' -p '
        - ' \\\\'
      filter_main_localhost:
        CommandLine|contains:
        - \\\\localhost
        - \\\\127.
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - accepteula
        - ' -u '
        - ' -p '
        - ' \\\\'
      filter_main_localhost:
        CommandLine|contains:
        - \\\\localhost
        - \\\\127.
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around the time of the alert?
  context: Tracking the account's activity across all hosts in the alert window reveals whether the remote execution is an isolated action or part of a wider sequence touching multiple endpoints. The same account driving similar activity on several systems widens the likely scope.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - accepteula
        - ' -u '
        - ' -p '
        - ' \\\\'
      filter_main_localhost:
        CommandLine|contains:
        - \\\\localhost
        - \\\\127.
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on the source host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining what else ran on the source host near the alert reveals what led to the remote execution and what followed it — staging of a payload to copy, reconnaissance to pick targets, or credential access that supplied the -u/-p account.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on the source host in the hours before this alert?
  context: Earlier detections on the same host — credential access, reconnaissance, or defense tampering — may reveal the stages that preceded the remote execution and help reconstruct the timeline. Credential access feeding a -u/-p launch, or reconnaissance that selected the target, are common precursors.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired this remote-execution pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this firing pattern rather than generic tool usage. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - accepteula
        - ' -u '
        - ' -p '
        - ' \\\\'
      filter_main_localhost:
        CommandLine|contains:
        - \\\\localhost
        - \\\\127.
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
