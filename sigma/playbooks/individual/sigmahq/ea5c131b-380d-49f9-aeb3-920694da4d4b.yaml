name: Suspicious Unsigned Thor Scanner Execution
id: b50b05b8-51d3-4ada-a745-3c7861689342
description: |
  Detects a process named thor.exe or thor64.exe loading its own executable image
  when that image is not validly signed by Nextron Systems GmbH, the publisher of
  the THOR APT scanner. Genuine THOR builds carry a valid Nextron signature, so an
  unsigned binary using the scanner's name may be a tampered or substituted copy,
  malware masquerading as a security tool to blend in during an intrusion, or an
  unrelated program that happens to share the name. The investigation should
  establish where the binary came from, whether its hash matches a published THOR
  release, who ran it and under what authorization, and whether it exhibits
  loader-like follow-on behavior or persistence registration.
type: detection
detection_id: ea5c131b-380d-49f9-aeb3-920694da4d4b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the loaded image match the rule's detection criteria for an unsigned thor scanner binary?
  context: 'The rule fires when a process named thor.exe or thor64.exe loads its own
    executable image and the image fails the publisher check — Signed true, SignatureStatus
    valid, and Signature "Nextron Systems GmbH" must all hold for the alert to be
    suppressed. Confirm the ImageLoaded path and the loading process against these
    criteria. A known false positive is other legitimate software that happens to be
    named thor.exe but is not published by Nextron Systems.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
  answer_sources:
  - alert
  - image_load
- question: Is this user or host expected to run the THOR APT scanner?
  context: THOR is a commercial compromise-assessment tool normally run by security
    or incident-response teams, often through scheduled sweeps or deployment tooling.
    The same filename under an ordinary user account, or on a host with no assessment
    scheduled, reads very differently. Organizations that permit tools to run from
    non-standard paths usually keep a list of which hosts and teams are expected to
    do so — check this host and user against it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is the alerting binary still on disk, and what files did it write?
  context: Preserve the unsigned binary for hash lookups, sandbox submission, or
    content review before it is removed. The query correlates file activity to the
    alerting process and its direct children — a genuine scanner writes report and
    log output under its working directory, while a masquerading payload more often
    drops executables, archives, or staging files.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Was this scanner execution part of a documented engagement, change ticket, or scheduled scan window?
  context: Compromise assessments and scheduled scans are normally documented — an
    engagement record, change ticket, or recurring scan window covering this host
    and this time. A matching record supports authorized activity; the absence of
    one when policy requires it, or a run far outside the scheduled window, suggests
    the execution was not sanctioned.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: Does the security team or administrator recall deploying and running this scanner?
  context: Direct confirmation from the team that owns scanning tooling is often the
    fastest path to a verdict. If they ran it, ask where the binary was obtained and
    why this build is unsigned — a locally repackaged or outdated copy explains the
    alert benignly. If nobody recalls running it, treat the binary as attacker-staged
    tooling masquerading as a scanner.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: What command-line arguments did the thor binary run with?
  context: A genuine scanner run carries scanner-style arguments — module selection,
    output and log paths, license or throttling flags. A masquerading payload
    typically runs with no arguments or with switches unrelated to scanning. The
    query covers all executions of the binary on this host in the window, so
    multiple sequential invocations are visible together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What other modules did this process load, and are any unsigned or from non-canonical paths?
  context: 'The module inventory tells the story when the command line is opaque.
    System DLLs are expected to load from C:\Windows\System32; modules loaded from
    the binary''s own directory, %TEMP%, AppData, ProgramData, or Public point to
    side-loading or search-order hijacking staged alongside the binary. Unsigned
    modules in locations where signed ones are expected deserve individual review.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
  answer_sources:
  - image_load
  - manual_review
- question: What is the hash and signing status of the loaded thor image, and is the hash a known THOR release?
  context: 'The load event carries the image''s hash and code-signature fields
    directly. Compare the hash against known-good hashes of genuine THOR releases
    and against threat intelligence — genuine builds are signed by Nextron Systems
    GmbH with a valid status. Watch the signature status values: Unsigned suggests
    substitution or repackaging, and Invalid indicates a tampered binary whose
    signature no longer verifies.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
  answer_sources:
  - image_load
  - external_threat_intel
  - manual_review
- question: What process launched the thor binary, and is that parent chain expected?
  context: Legitimate scanner deployments launch from predictable parents — scheduled
    tasks, deployment or management agents, or an interactive administrator shell.
    Parents such as office applications, script hosts, browsers, or archive utilities
    point to delivery through phishing or download rather than sanctioned deployment.
    The parent's own command line shows how the run was staged.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: When was the thor binary written to this host, and by what process?
  context: 'The gap between file placement and execution is a useful discriminator:
    deployment tooling staging a scanner ahead of a scheduled sweep differs from a
    browser, archive utility, or remote-access tool dropping the binary minutes
    before it runs. Alternate data stream and mark-of-the-web origin details are not
    captured in the collected telemetry — recover the download origin by manual
    review on the endpoint if the writing process does not explain it.'
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith:
          - '\thor.exe'
          - '\thor64.exe'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
  answer_sources:
  - file_event
  - manual_review
- question: Were registry values written that point execution flow or persistence at this binary?
  context: Execution-flow hijacks and persistence commonly register the substituted
    binary through the registry — service ImagePath values, Run and RunOnce keys,
    Image File Execution Options debugger entries, or App Paths. A registry value
    naming the binary's path shows how it gets launched and whether it survives
    reboot; compare any service paths found against the expected service baseline
    for this host. Value deletions are not observable in this telemetry, so an empty
    result does not prove cleanup.
  range: +/-24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Details|contains:
          - 'thor.exe'
          - 'thor64.exe'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What child processes did the thor binary spawn afterward?
  context: A genuine scanner's activity is largely self-contained — it reads the
    filesystem and writes reports. Command interpreters, script hosts, or network
    utilities spawned by the binary indicate it is functioning as a loader or
    dropper rather than a scanner, and each child becomes its own investigation
    thread.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the surrounding window shows
    what led to the load and what followed — reconnaissance, privilege escalation,
    or persistence installation. Aggregating by process and parent collapses
    repetitive agent telemetry into high-count rows while novel parent-child pairs
    stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
- question: Has a thor image been loaded on this host before, and was it signed then?
  context: History distinguishes substitution from first arrival. If a validly
    signed THOR build has loaded here in the past and today's load is unsigned, the
    tool was likely replaced or tampered with — compare hashes between the
    historical and current loads. If no thor image has ever loaded on this host,
    this is a first-time arrival and the file-placement question carries more
    weight.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - Signature
  answer_sources:
  - image_load
- question: When this host previously loaded an unsigned thor image, what programs and users drove it, and does this alert fit that history?
  context: The query mirrors the rule's selection scoped to this host, so the
    resulting program and user distribution reflects how this specific firing
    pattern — an unsigned thor image load — has previously occurred here, not
    generic use of the binary. The Image column will show the thor binary itself;
    image-load events carry no parent lineage, so pivot to its process start if
    lineage matters. An unexpected account, or a first-ever fire on this host, is
    the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith:
        - \thor.exe
        - \thor64.exe
        ImageLoaded|endswith:
        - \thor.exe
        - \thor64.exe
      filter_main:
        Signed: 'true'
        SignatureStatus: valid
        Signature: Nextron Systems GmbH
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter_main) and _pb_scope
    fields:
    - Image
    - User
  answer_sources:
  - image_load
- question: Have other hosts loaded unsigned thor images in the past week, and is the distribution consistent with automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a
    fleet-wide count of the rule's firing pattern rather than generic thor usage.
    Many hosts firing together points to a scripted rollout of an unsigned or
    repackaged build — still worth explaining, but organizational in nature. A
    single host, or a small unrelated set, points to manual operator activity on
    those machines.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith:
        - \thor.exe
        - \thor64.exe
        ImageLoaded|endswith:
        - \thor.exe
        - \thor64.exe
      filter_main:
        Signed: 'true'
        SignatureStatus: valid
        Signature: Nextron Systems GmbH
      condition: selection and not filter_main
    fields:
    - host.name
  answer_sources:
  - image_load
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance,
    credential access — may reveal the stages that preceded this load and help
    reconstruct the timeline. An attacker staging a masquerading tool has usually
    already produced other signals such as download activity, archive extraction,
    or security-tool discovery.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Were process-based persistence mechanisms installed on this host around the load?
  context: Attackers who stage tooling rarely rely on a single foothold. Scheduled
    tasks, services, registry Run keys, BITS jobs, or WMI subscriptions created in
    the same window can register the binary or a companion payload to survive
    reboot. Multiple persistence installations in one window indicate deliberate
    stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
