name: DLL Sideloading by VMware Xfer Utility
id: 0d050aef-9835-4c37-98a3-02cc4abbd778
description: |
  Detects the signed VMware Xfer utility (VMwareXferlogs.exe) running from any directory
  other than its standard VMware install path under C:\Program Files\VMware\. The rule fires
  when a process whose Image ends in \VMwareXferlogs.exe runs AND its path does not start with
  the VMware install directory. The signed utility imports glib-2.0.dll; when the binary is
  copied out of its install path, a same-named DLL planted alongside it loads in its place,
  giving the attacker code execution inside a trusted, signed process. Legitimate firing is
  rare — confirm the binary's location, the planted DLL, and what loaded into the process,
  then look for the downloads, decode/decrypt steps, and outbound traffic that typically
  surround signed-binary proxy execution.
type: detection
detection_id: ebea773c-a8f1-42ad-a856-00cb221966e8
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the alerting process match this rule — VMwareXferlogs.exe running from a path outside C:\Program Files\VMware\?
  context: Confirm the alert is a true positive before investing time. The rule fires when the Image ends in \VMwareXferlogs.exe AND the full path does not start with C:\Program Files\VMware\. Read the Image path on the alerting event and verify it points somewhere other than the standard VMware install directory; an in-place install path would be a tuning gap, not this pattern.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is this user and host expected to run VMware utilities from a non-standard directory?
  context: Legitimate VMware tooling runs from under C:\Program Files\VMware\. A host or user copying VMwareXferlogs.exe into another directory and running it there is the pattern the rule targets. Knowing whether this host runs VMware software at all, and whether this user administers it, is often the fastest way to separate a relocation by an admin from operator-staged proxy execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What directory was VMwareXferlogs.exe launched from, and is that location user-writable or a known staging path?
  context: The path the binary runs from is the load-bearing artifact for this technique. Signed-binary proxy execution depends on relocating the utility into a directory the operator controls so a planted DLL sits beside it. Directories such as a debug folder under the Windows directory, ProgramData, a user profile, or a temp path are common staging locations and carry more weight than a relocation into another Program Files subfolder.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CurrentDirectory
      - CommandLine
- question: What did VMwareXferlogs.exe do when it ran — decode its full command line and output handling?
  context: The full command line and current directory reveal the operation. Watch for output redirected to an unusual destination, including UNC paths or admin shares, which is an artifact-hiding pattern seen with this proxy-execution behavior. The query returns every run of the binary on this host within the window so sequential invocations that form one operation are visible together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Did VMwareXferlogs.exe load glib-2.0.dll or any other DLL from a non-standard directory?
  context: The sideload itself appears in module-load telemetry — the trusted process loading a same-named library from the relocated directory rather than from its install path. The signed utility imports glib-2.0.dll; a copy of that DLL loading from the same folder the binary was relocated to is the technique executing. If module-load events are not collected in this environment, treat zero results as a visibility gap rather than evidence nothing loaded, and confirm the DLL on disk instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- question: Was glib-2.0.dll or another DLL written into the same directory as the relocated binary?
  context: Before the sideload runs, the attacker must place the planted DLL next to the relocated executable. File-creation telemetry in the binary's directory shows the staged DLL and any accompanying payload files, including encrypted blobs disguised with innocuous extensions. The presence of glib-2.0.dll outside a VMware install path, especially under a debug or temp directory, is the on-disk form of this technique.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_dll:
        TargetFilename|contains: '.dll'
      condition: selection and selection_dll
    fields:
      - TargetFilename
      - Image
      - User
- question: Is the DLL loaded by VMwareXferlogs.exe the legitimate signed library, or has it been substituted?
  context: Substitution detection turns on comparing the loaded DLL against the known-good library — signature status and hash. A legitimate glib-2.0.dll is signed and matches the baseline shipped with VMware; a planted replacement exports the same function names but is unsigned or hash-mismatched. Confirm the signing chain and hash of every DLL that loaded into the process, and treat an unsigned same-named module as the substituted library.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
- question: What process spawned VMwareXferlogs.exe, and is that parent chain expected for this utility?
  context: The parent reveals how the relocated binary was invoked. A scripting host, a command shell run interactively, or an office application launching the utility points to operator-driven execution rather than a VMware service starting its own tooling. Walk up to the parent's own parent if the immediate parent is itself a generic shell.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did VMwareXferlogs.exe spawn after it ran?
  context: Once code runs inside the trusted process, the injected payload commonly spawns or injects into other processes for post-exploitation. Unexpected children such as command shells, script hosts, or download utilities indicate the sideloaded code acted beyond the utility's normal function.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host has previously matched this rule's pattern, what parents and users drove it, and does the current alert fit?
  context: The query mirrors the rule's selection and filter scoped to this host, so the parent and user distribution reflects how this specific firing pattern has run here historically rather than generic VMware usage. A new parent process or an unexpected account against the established pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|endswith: \VMwareXferlogs.exe
      filter:
        Image|startswith: C:\Program Files\VMware\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|endswith: \VMwareXferlogs.exe
      filter:
        Image|startswith: C:\Program Files\VMware\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|endswith: \VMwareXferlogs.exe
      filter:
        Image|startswith: C:\Program Files\VMware\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or staging on multiple endpoints. If the same user triggered similar relocation or execution activity elsewhere, the scope may be larger than this one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|endswith: \VMwareXferlogs.exe
      filter:
        Image|startswith: C:\Program Files\VMware\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: Have other hosts matched this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection and filter with no host scope, giving a fleet-wide count of this firing pattern rather than generic binary usage. Many hosts running VMwareXferlogs.exe from non-standard paths points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|endswith: \VMwareXferlogs.exe
      filter:
        Image|startswith: C:\Program Files\VMware\
      condition: selection and not filter
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — a download or staging step, reconnaissance, or defense tampering — may reveal the stages that preceded the sideload and help reconstruct the timeline of how the binary and its planted DLL arrived.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host around the alert?
  context: Hijacking a signed binary's DLL search path is itself a persistence and execution mechanism, and operators rarely rely on one foothold. Scheduled tasks, services, registry Run-key writes, BITS jobs, or WMI subscriptions installed in the same window indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
