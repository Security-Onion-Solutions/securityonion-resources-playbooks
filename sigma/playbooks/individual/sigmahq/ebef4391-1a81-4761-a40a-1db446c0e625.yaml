name: New ActiveScriptEventConsumer Created Via Wmic.EXE
id: f9013836-69f0-41ca-ac7e-514eb217595c
description: |
  Detects wmic.exe invoked with a command line that both names ActiveScriptEventConsumer and carries the CREATE verb,
  which registers a permanent WMI event consumer that runs VBScript or JScript when its bound event filter fires. WMI
  event subscriptions are a SYSTEM-context persistence mechanism that survives reboots and leaves no file on disk, so the
  triggered script executes under WmiPrvSE.exe rather than the creating process. Some backup, monitoring, and management
  software legitimately registers script consumers, so the investigation should decode the full subscription the command
  defines, confirm who and what launched wmic, and determine whether a triggered execution has already run from the new
  consumer.
type: detection
detection_id: ebef4391-1a81-4761-a40a-1db446c0e625
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- question: Does the command line both name ActiveScriptEventConsumer and carry the CREATE verb that this rule detects?
  context: >-
    The rule fires when a single command line contains both ActiveScriptEventConsumer and CREATE, indicating wmic is
    registering a new permanent script event consumer. Confirm the alert is a true positive by reading the exact command
    line and process details and verifying both tokens are present in a create operation rather than a query or delete.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to register WMI event consumers?
  context: >-
    Registering a permanent WMI event consumer is an uncommon administrative action normally tied to specific management,
    backup, or monitoring tooling. Knowing whether the acting user's role and the host's function are consistent with WMI
    subscription management is often the fastest path to separating sanctioned automation from operator-installed
    persistence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What WMI subscription does this command define? Decode the consumer name, the script it runs, and the bound event filter.
  context: >-
    The full command line defines the persistence. Read the consumer Name, the ScriptingEngine (VBScript or JScript), and
    the ScriptText or ScriptFileName the consumer will run, along with any namespace argument. A subscription becomes active
    only when an EventFilter is bound to the consumer via a FilterToConsumerBinding, so note whether this command also
    creates a filter and binding or whether those were registered separately. The script body is the payload that executes
    under WmiPrvSE.exe when the filter condition is met.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: wmic.exe
      - Image|endswith: \WMIC.exe
      selection_cli:
        CommandLine|contains|all:
        - ActiveScriptEventConsumer
        - ' CREATE '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
    - User
- question: What process spawned wmic.exe, and what started that parent?
  context: >-
    The parent process reveals how the subscription registration was driven. Legitimate WMI consumer creation usually
    descends from an interactive shell, a deployment agent, or a known management console. Unusual parents — Office
    applications, mshta.exe, wscript.exe, a web-server worker, or an unexpected service — point to the persistence being
    installed by another stage of an intrusion. Tracing the parent's own origin shows whether the chain began with a user
    action or with an automated trigger.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did the same parent spawn around this time?
  context: >-
    If the parent that launched wmic also launched other processes, examining the siblings reveals the full scope of
    activity from that parent. Multiple tooling invocations from the same parent in the alert window — reconnaissance,
    credential access, or additional persistence — point to coordinated operator activity rather than an isolated
    administrative command.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did WmiPrvSE.exe spawn any child processes on this host after the consumer was created, indicating the subscription fired?
  context: >-
    A permanent script consumer runs under WmiPrvSE.exe when its bound filter condition is met, so triggered execution
    appears as a child process of WmiPrvSE.exe rather than of the creating wmic process. scrcons.exe hosting the script,
    or an anomalous child such as cmd.exe, powershell.exe, or a script host descending from WmiPrvSE.exe, indicates the new
    consumer has already executed. The timing between the consumer creation and any such child execution shows whether the
    persistence is dormant or already active.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith:
          - '\WmiPrvSE.exe'
          - '\scrcons.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Do the WMI activity logs show creation of the event filter, consumer, and filter-to-consumer binding for this subscription?
  context: >-
    WMI persistence requires three objects — an __EventFilter, an ActiveScriptEventConsumer, and a
    __FilterToConsumerBinding that links them. The WMI activity channel records subscription
    registration under events 5859-5861 independently of the process command line, so the logs
    confirm whether the command line observed in the alert produced a complete, armed subscription
    or only one piece of it. The 5861 row is the one to read: its CONSUMER column carries the
    consumer definition and ESS the filter side; the Query and NamespaceName columns on
    5859/5860 rows carry the WQL trigger and namespace, and message holds the readable
    narrative. Correlate these with the decoded command line. If WMI activity logging is not
    collected in this environment, treat the absence as a visibility gap rather than evidence
    the subscription was incomplete.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        Channel: 'Microsoft-Windows-WMI-Activity/Operational'
        host.name|expand: '%hostname%'
        EventID:
          - 5859
          - 5860
          - 5861
      condition: selection
    fields:
      - EventID
      - winlog.user_data.CONSUMER
      - winlog.user_data.ESS
      - winlog.user_data.Query
      - winlog.user_data.NamespaceName
      - message
- question: When this host has previously fired this rule's pattern, what parents and users drove it, and does the current alert fit?
  context: >-
    Even legitimate tooling registers WMI consumers on occasion. This query mirrors the rule's selection structure scoped
    to this host, so the resulting parent and user distribution reflects how this specific subscription-creation pattern —
    not generic wmic usage — has historically run here. A new parent process, an unexpected user account, or an unusual
    command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: wmic.exe
      - Image|endswith: \WMIC.exe
      selection_cli:
        CommandLine|contains|all:
        - ActiveScriptEventConsumer
        - ' CREATE '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    This query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this
    subscription-creation pattern rather than generic wmic usage. Many hosts registering the same consumer pattern points
    to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use
    the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - ActiveScriptEventConsumer
        - ' CREATE '
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: wmic.exe
      - Image|endswith: \WMIC.exe
      selection_cli:
        CommandLine|contains|all:
        - ActiveScriptEventConsumer
        - ' CREATE '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: wmic.exe
      - Image|endswith: \WMIC.exe
      selection_cli:
        CommandLine|contains|all:
        - ActiveScriptEventConsumer
        - ' CREATE '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or coordinated action across multiple
    endpoints. If the same user registered consumers or ran other tooling on several hosts in the same window, the scope of
    the operation may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: wmic.exe
      - Image|endswith: \WMIC.exe
      selection_cli:
        CommandLine|contains|all:
        - ActiveScriptEventConsumer
        - ' CREATE '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host — reconnaissance, credential access, or defense
    tampering — may reveal the attack stages that preceded the persistence installation and help reconstruct the full
    timeline leading up to the consumer creation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: >-
    Attackers rarely rely on a single persistence mechanism. After registering a WMI consumer, they commonly install backup
    footholds using different techniques — scheduled tasks, services, registry Run keys, or BITS jobs. Multiple persistence
    installations from the same timeframe indicate intentional stacking rather than an isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were any other proxy-execution or persistence LOLBins used on this host recently?
  context: >-
    Operators who use one LOLBin often use several. wmic registering a script consumer is a proxy-execution and persistence
    route; check whether rundll32, regsvr32, mshta, schtasks, reg, or sc were also used in the surrounding window. Finding
    multiple LOLBins performing execution or persistence actions strengthens the case for an operator-driven sequence over a
    single administrative command.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\schtasks.exe'
          - '\reg.exe'
          - '\sc.exe'
          - '\at.exe'
          - '\bitsadmin.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: How often has this host fired the rule's wmic subscription pattern over the past 90 days, and what command-line structures are typical?
  context: >-
    A subscription-creation pattern with no prior history on a host is more suspicious than one used regularly under stable
    parents. This query mirrors the rule's selection structure scoped to this host, so the resulting count reflects the
    rule's specific firing pattern rather than generic wmic usage. The command-line projection lets the analyst compare
    typical consumer-registration patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: wmic.exe
      - Image|endswith: \WMIC.exe
      selection_cli:
        CommandLine|contains|all:
        - ActiveScriptEventConsumer
        - ' CREATE '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
