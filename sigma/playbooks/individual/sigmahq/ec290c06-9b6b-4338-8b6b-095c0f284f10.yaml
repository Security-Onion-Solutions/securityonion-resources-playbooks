name: Suspicious Execution of Shutdown to Log Out
id: 2185b226-5de7-40c6-9f14-ea5c4fec9170
description: |
  Detects shutdown.exe invoked with the /l flag to log off the current interactive session. Legitimate logoff is
  normally user-initiated through the shell UI or logoff.exe, so a /l invocation from a script or command interpreter
  context is the pattern this rule targets. Forcing a logoff can clear a credential-cached session or trigger
  logon-based persistence (Run/RunOnce keys, ONLOGON scheduled tasks, Winlogon Notify), and the same binary used with
  /r /f or /a appears in impact and anti-recovery activity. The investigation should determine who and what drove the
  logoff, whether the parent chain is expected, and whether the host shows other impact-tactic or persistence activity
  around the same time.
type: detection
detection_id: ec290c06-9b6b-4338-8b6b-095c0f284f10
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line show shutdown.exe run with the /l logoff flag?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line
    and process image against the rule's criteria — shutdown.exe with /l in the arguments. Confirm /l is present and is
    not a substring of an unrelated value.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to log off sessions from a command-line context?
  context: Routine logoff is normally driven from the shell UI or logoff.exe, not shutdown /l from a script. Knowing
    whether the user role and host function include scripted session management, kiosk reset, or automation that logs
    users off helps separate routine operations from operator-driven session clearing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What were the full shutdown.exe arguments, and do they go beyond /l into reboot, force, abort, or remote flags?
  context: The full argument list reveals the actual operation. Decode every flag — /l (logoff, current user only),
    /r (restart), /s (shutdown), /f (force apps closed, no warning), /t (delay seconds), /a (abort a pending shutdown),
    /p (immediate power-off), /m \\target (remote machine), /d (reason code). A bare /l differs sharply from /r /f /t 0
    or a /m remote invocation in intent and impact.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned shutdown.exe, and is that parent chain expected for a logoff?
  context: The parent reveals how the logoff was invoked. A user-driven logoff usually traces to explorer.exe or an
    interactive shell; shutdown /l descending from cmd.exe, powershell.exe, regsvr32.exe, rundll32.exe, wscript.exe, or
    an Office application points to scripted or automated invocation rather than a person choosing to log off.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Do host status change records on this host line up in time with the logoff, and do they fall during expected
    hours?
  context: Process execution of shutdown.exe can be correlated with host status change records (event IDs 1074 and 6006)
    that record shutdown, restart, and event-log-service start transitions. A logoff or shutdown with no corresponding
    status record, or one landing outside business hours when the user is not expected to be active, deserves closer
    review. If these Windows system event channels are not ingested in this environment, treat an empty result as a
    visibility gap rather than evidence nothing happened.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: system
    detection:
      selection:
        EventID:
          - 1074
          - 6006
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - host.name
      - EventID
      - User
- question: What recovery-inhibiting commands were executed on this host?
  context: 'shutdown with /r /f or /a appears in impact chains where the operator forces a reboot into a pre-staged
    state or aborts a defender-initiated shutdown. Recovery destruction often accompanies it: deleting shadow copies
    (vssadmin, wmic), disabling boot recovery (bcdedit), deleting backups (wbadmin), and disabling the recovery
    environment (reagentc). This query surfaces those commands so the analyst can confirm whether the logoff sits inside
    a broader anti-recovery sequence, then verify host state with vssadmin list shadows, bcdedit /enum, and reagentc
    /info.'
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\reagentc.exe'
          - '\diskshadow.exe'
      selection_cmdline:
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'recoveryenabled'
          - 'bootstatuspolicy'
          - 'delete catalog'
          - 'delete systemstatebackup'
          - 'boot.ini'
          - 'winre.wim'
          - '/disable'
      condition: selection and (selection_recovery or selection_cmdline)
    fields:
      - Image
      - CommandLine
- question: What other destructive or recovery-inhibiting actions occurred on this host?
  context: 'Impact activity typically chains several destructive actions: shadow copy deletion, recovery disabling,
    security service stopping, file permission changes, and event log clearing. Finding the full set of destructive
    commands around the logoff reveals whether this is an isolated administrative logoff or one step in a destruction
    sequence, and a shared parent process across those commands points to scripted execution.'
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_destructive:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\cipher.exe'
          - '\fsutil.exe'
          - '\icacls.exe'
          - '\takeown.exe'
          - '\attrib.exe'
          - '\sc.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\powershell.exe'
          - '\taskkill.exe'
      condition: selection and selection_destructive
    fields:
      - Image
      - User
- question: Does this host normally run shutdown.exe?
  context: A binary that has never or rarely run on a host is more notable than one that runs regularly. Zero or very low
    historical counts indicate first-time or rare execution of shutdown.exe here, which raises the weight of the
    parent-chain and argument findings.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously run shutdown.exe with /l, what parents and users drove it, and does the current
    alert fit that pattern?
  context: Even routine tools can be abused. The query mirrors the rule's selection scoped to this host, so the
    parent/user distribution reflects how this exact logoff pattern has historically run here rather than generic
    shutdown.exe usage. A new parent process, an unexpected account, or an unusual argument structure is the deviation worth
    chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \shutdown.exe
        CommandLine|contains: /l
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did shutdown.exe spawn afterward?
  context: shutdown.exe itself spawns little under normal use, so any children are worth noting. More importantly, a
    forced logoff can fire logon-triggered persistence on the next sign-in; reviewing what executed in the window after
    the logoff helps catch persistence that activates on session change.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \shutdown.exe
        CommandLine|contains: /l
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \shutdown.exe
        CommandLine|contains: /l
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated action across endpoints.
    The same user driving similar logoffs or impact-tactic activity on multiple hosts widens the apparent scope. Under a
    service or computer account this view returns agent-telemetry volume, in which case the launch-mechanism view is the
    meaningful one.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \shutdown.exe
        CommandLine|contains: /l
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the logoff?
  context: 'Alerts rarely occur in isolation. Examining activity around the logoff reveals the immediate context: what
    led up to it, what followed, and whether it is part of a larger sequence. Look for reconnaissance, privilege
    escalation, persistence installation, or impact-tactic commands clustered in the same window.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before the logoff?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the
    stages that preceded the logoff and help reconstruct the timeline. A logoff that follows tampering or anti-recovery
    activity reads very differently from one that stands alone.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Is this same logoff detection firing on other hosts in the environment?
  context: Impact-tactic activity is often executed across many hosts in a short span. The same alert firing on multiple
    hosts at once indicates coordinated or pushed execution and determines the scope for containment and response, rather
    than a single host-local action.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
- question: Have other hosts run shutdown.exe with /l in the past week, and does the cross-host distribution look like
    automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this logoff
    pattern rather than generic shutdown.exe usage. Many hosts firing the same pattern points to scripted deployment or
    vendor automation; one host or a small unrelated set points to manual operator activity. Use host distribution and
    parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \shutdown.exe
        CommandLine|contains: /l
      condition: selection
    fields:
    - host.name
