name: CVE-2023-38331 Exploitation Attempt - Suspicious WinRAR Child Process
id: 51efc28b-3afa-4ae8-bf16-ea0ff9d240da
description: |
  Detects WinRAR.exe spawning a command interpreter whose command line references the
  \AppData\Local\Temp\Rar$ extraction folder and contains a short-extension-followed-by-space-and-dot
  pattern, where the child is identified either by an Image path ending in cmd.exe, cscript.exe,
  powershell.exe, pwsh.exe or wscript.exe, or by an OriginalFileName naming one of those interpreters.
  This is the artifact of archive-tool extension spoofing (CVE-2023-38331, WinRAR before v6.23): a crafted
  archive pairs a benign-looking file with a same-named folder holding a script, and opening the
  benign-looking file runs the script from the temporary extraction directory instead. An archive tool
  spawning an interpreter it should never spawn is the generalizable pattern; legitimate archive use ends
  at extraction and hands the file to its registered application. The investigation should establish which
  branch of the child match fired, what the interpreter executed, which archive was opened and how it
  reached the host, and whether the extracted payload wrote files or made outbound connections.
type: detection
detection_id: ec3a3c2f-9bb0-4a9b-8f4b-5ec386544343
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the alerting event show WinRAR.exe spawning a command interpreter from the Rar$ extraction folder with a double-extension pattern in the command line?
  context: >-
    The rule fires only when all of these hold together: WinRAR.exe is the parent, the command line
    references the \AppData\Local\Temp\Rar$ extraction folder, and the command line matches a short
    extension followed by a space and a dot; and the child is identified either by an Image path ending
    in cmd.exe, cscript.exe, powershell.exe, pwsh.exe or wscript.exe, or by an OriginalFileName of
    Cmd.Exe, cscript.exe, PowerShell.EXE, pwsh.dll or wscript.exe. Note which branch of that child match
    fired, because it changes what matters next. An OriginalFileName match with an Image path that is not
    one of the listed interpreters means a stock interpreter was copied or renamed, so the on-disk path
    and origin of that binary become load-bearing. A match on both branches is the interpreter running
    under its own name, where the command line and the archive contents carry the analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - OriginalFileName
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to open archives that extract and run scripts?
  context: Opening archives is routine on most workstations; the extraction step running a script
    interpreter is not part of that routine. Knowing whether the user handles archives from external
    parties as part of their role, and whether this host is a workstation or a server, is often the
    fastest way to separate a delivery attempt from a packaging or build workflow that legitimately
    drives an archiver from scripts.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is WinRAR expected to spawn a script interpreter, and what started WinRAR itself?
  context: An archive tool has no reason to spawn cmd.exe, wscript.exe, cscript.exe or PowerShell during
    normal extraction, so the parent-child lineage is the core of this detection. The parent lookup shows
    the archiver's own command line, which normally names the archive that was opened, and its
    grandparent, which shows how the archive was reached. A grandparent of explorer.exe or a browser or
    mail client points to a user opening a delivered file; a grandparent that is itself a script host or
    an installer points to an automated chain. Known packaging tools and updaters that drive an archiver
    from scripts are the main benign source of this pairing and should be identifiable from the parent
    command line.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: Which archive was opened, and how did it reach this host?
  context: The archiver's command line normally carries the path of the archive that was opened, which is
    the delivery artifact for this technique. Its location tells the story of arrival - a mail client
    attachment directory, a browser download directory, a chat client cache, or a network share. Recover
    the archive path and preserve the file itself, then trace it back to the sending address, download
    URL or share it came from so the same archive can be found for other recipients and blocked at the
    perimeter.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - manual_review
  - edr_console
- question: What version of WinRAR is installed on this host, and is it below v6.23?
  context: CVE-2023-38331 is fixed in WinRAR v6.23. A version below that confirms the host was exploitable
    by this extension-spoofing pattern and turns the finding into a hunt for every other host running the
    same unpatched build. A patched version means the extraction should not have run the script, so the
    execution needs a different explanation - a packaging workflow, a different archiver on the same host,
    or a portable copy of the tool that the software inventory does not track. Confirm the version from
    the binary on disk rather than the inventory record alone, since portable builds are common.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
  answer_sources:
  - asset_inventory
  - edr_console
- question: What other child processes did the same WinRAR instance spawn?
  context: A crafted archive can hold more than one staged file, and the extraction step can launch
    several of them in sequence. Listing every child of the exact archiver instance shows whether this was
    a single interpreter launch or a chain that also started rundll32.exe, regsvr32.exe, mshta.exe,
    msiexec.exe or curl.exe - the children an archive tool should never produce. The times of the siblings
    also bracket the window in which the extracted content ran.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Did the same detection fire on other hosts or for other users?
  context: Archives carrying this extension-spoofing pattern are distributed to many recipients at once,
    on forums, in chat channels and by mail. The same rule firing on other hosts identifies the other
    people who opened the delivered archive and the breadth of the delivery. A single host points to a
    targeted or opportunistic delivery; several hosts in a short window point to a distribution run whose
    source needs to be found and blocked.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - alert
- question: What did the interpreter execute out of the Rar$ extraction folder?
  context: >-
    This scopes to every process on the host in the alert window whose command line references the
    \AppData\Local\Temp\Rar$ extraction folder, rather than to the interpreter binary by name - cmd.exe
    and powershell.exe run constantly on a normal host, so the extraction path is the discriminating
    pattern here. Read the full command line for what the extracted script does: the file it searches for
    by name, any second-stage file it launches, process creation through WMI, download or decode steps,
    and the working directory it runs from. Loaders of this type commonly search the extraction directory
    for the spoofed file by name and start it, so the searched-for name is the spoofed file the user
    thought they were opening.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: '\AppData\Local\Temp\Rar$'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: Was the command encoded or obfuscated? What does it decode to?
  context: When the interpreter branch of this detection is powershell.exe or pwsh.exe, the extracted
    script is frequently a thin launcher that hands PowerShell a base64 payload via -EncodedCommand or
    -enc, or a concatenated and backtick-escaped string. Decode it to recover the real payload, which is
    usually a download cradle for a second stage, a decryption routine over a file already extracted from
    the archive, or in-memory loading of a .NET assembly. If the child was cmd.exe, cscript.exe or
    wscript.exe instead, read the batch or script file it points at for the same content.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Did PowerShell script block logging capture the full script content?
  context: Event ID 4104 records the deobfuscated script content PowerShell actually executed, so it
    recovers the payload even when the command line only points at a file inside the extraction folder
    that has since been cleaned up. That matters here because the extracted files live in a temporary
    directory that the archiver removes when it closes, and the script block record often outlives them.
    If PowerShell operational logs are not ingested in this environment, treat zero results as a
    visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
  answer_sources:
  - powershell_script_block
- question: Were PowerShell security controls bypassed or weakened around this execution?
  context: An extracted launcher that wants PowerShell to run an unsigned script from a temporary
    directory generally has to clear the way first, most often with -ExecutionPolicy Bypass or -ep bypass
    on the same command line. AMSI patching, real-time monitoring changes and version-2 downgrade calls
    in the same hour point to a payload that expects to be inspected. Their presence alongside the
    archive-driven launch describes a prepared loader rather than a script a user wrote themselves.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: What did the extraction write to disk, and where did the archive itself land?
  context: >-
    The archive is the artifact to recover, and the extraction folder is where its contents briefly live.
    This looks for both: writes under \AppData\Local\Temp\Rar$, which enumerate what the crafted archive
    actually carried, and archive files written anywhere on the host, which show the delivered container
    and the process that saved it - a browser, a mail client or a chat client naming the arrival path.
    Files staged into Downloads, %TEMP%, %APPDATA% or a synchronized folder are the writable locations
    this technique depends on. The extraction directory is removed when the archiver closes, so collect
    the file names from these events even if the paths no longer exist, and pivot any surviving payload
    path to its execution event to obtain a hash.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_extract:
        TargetFilename|contains: '\AppData\Local\Temp\Rar$'
      selection_archive:
        TargetFilename|endswith:
          - '.rar'
          - '.zip'
          - '.7z'
      condition: selection_host and (selection_extract or selection_archive)
    fields:
      - TargetFilename
      - Image
      - User
  answer_sources:
  - file_event
  - manual_review
- question: Did the interpreter make outbound connections after the archive was opened?
  context: Extraction-driven execution is a delivery step; the payload that follows normally reaches out
    for a second stage or checks in. Connections from this interpreter within minutes of the extraction,
    to a destination that is not a known update or content-distribution endpoint and not the environment's
    proxy egress, describe a download or check-in rather than an archive being opened. Correlate the
    connection times against the extraction and any file writes - a tight sequence of extract, execute,
    connect within a 15-minute window is the chain this technique produces. No connections does not clear
    the event, since the payload may run under a different binary it started.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
  answer_sources:
  - network_connection
- question: Did the archive application log an error, hang or abnormal exit on this host around the alert?
  context: Client-application exploitation usually leaves a crash or hang record in the Application
    channel when memory corruption is involved. Extension spoofing is a logic flaw in how the archiver
    decides which file to open, so it does not crash the application - an error, hang or abnormal exit
    record for the archiver in the same window therefore points at something else, either a separate
    exploit attempt against the same application or a payload that failed to run. A clean Application
    channel is consistent with the logic-flaw pattern and does not weaken the finding. If the Application
    channel is not collected in this environment, treat zero results as a visibility gap.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: application
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 1000
          - 1001
          - 1002
      condition: selection
    fields:
      - Provider_Name
      - EventID
  answer_sources:
  - manual_review
- question: Has this user previously produced this archive-driven interpreter pattern, and does that history fit their role?
  context: The query mirrors the rule's selection criteria scoped to this user, so the result is the
    user's 90-day history of archive-driven interpreter launches from the extraction folder, aggregated
    by host - not their general use of cmd.exe or PowerShell, which every user produces constantly. A
    user who has never produced this pattern is the ordinary case for exploitation of this kind. A user
    with a steady history is more likely running a packaging or build workflow that drives the archiver
    from scripts, which their role should confirm.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \WinRAR.exe
      selection_folder:
        CommandLine|contains: \AppData\Local\Temp\Rar$
      selection_double_ext:
        CommandLine|re: \.[a-zA-Z0-9]{1,4} \.
      selection_binaries:
      - Image|endswith:
        - \cmd.exe
        - \cscript.exe
        - \powershell.exe
        - \pwsh.exe
        - \wscript.exe
      - OriginalFileName:
        - Cmd.Exe
        - cscript.exe
        - PowerShell.EXE
        - pwsh.dll
        - wscript.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Has this archiver historically driven this pattern on this host or across the environment, or is it new for this activity?
  context: 'When the alert fires under a service principal or a machine account, user identity does not
    attribute the behavior and the launch mechanism is the meaningful pivot: the query mirrors the rule''s
    selection criteria scoped to the alerting parent, so the result is the 90-day history of this archiver
    driving this specific pattern. A parent that already accounts for hundreds of prior events across
    many hosts is a packaging or deployment workflow. A parent with no history for this pattern is the
    deviation worth chasing, and on this rule that is the expected reading, since normal extraction never
    launches an interpreter.'
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \WinRAR.exe
      selection_folder:
        CommandLine|contains: \AppData\Local\Temp\Rar$
      selection_double_ext:
        CommandLine|re: \.[a-zA-Z0-9]{1,4} \.
      selection_binaries:
      - Image|endswith:
        - \cmd.exe
        - \cscript.exe
        - \powershell.exe
        - \pwsh.exe
        - \wscript.exe
      - OriginalFileName:
        - Cmd.Exe
        - cscript.exe
        - PowerShell.EXE
        - pwsh.dll
        - wscript.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What else did this user do across the environment around this time?
  context: A user who opened a delivered archive on one host may have opened it on another, or may have
    forwarded it onward. Their process activity across all hosts in the hour around the alert shows
    whether this was a single opening or part of wider handling of the same delivery, and surfaces
    follow-on activity that started under their session on machines the alert does not name. Aggregated
    by host and binary so repeated automation collapses and one-off launches stand out.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did this same archiver-driven pattern fire on other hosts in the same window?
  context: 'Under a service principal or machine account, asking what else the user did returns telemetry
    from agents that run on every host. The meaningful question is whether the same launch mechanism fired
    elsewhere: the query mirrors the rule''s selection criteria scoped to the alerting parent, fleet-wide,
    in the alert window. Several hosts in the same window points to a pushed or scheduled workflow, or to
    the same crafted archive being opened by several recipients at once. A single host points to a local
    trigger, most often one user opening one delivered file.'
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \WinRAR.exe
      selection_folder:
        CommandLine|contains: \AppData\Local\Temp\Rar$
      selection_double_ext:
        CommandLine|re: \.[a-zA-Z0-9]{1,4} \.
      selection_binaries:
      - Image|endswith:
        - \cmd.exe
        - \cscript.exe
        - \powershell.exe
        - \pwsh.exe
        - \wscript.exe
      - OriginalFileName:
        - Cmd.Exe
        - cscript.exe
        - PowerShell.EXE
        - pwsh.dll
        - wscript.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
