name: Forest Blizzard APT - JavaScript Constrained File Creation
id: b70be99d-aa2b-400e-bcef-48753fc5fd72
description: |
  Detects creation of a JavaScript file under C:\Windows\System32\DriverStore\FileRepository\. Exploitation of
  CVE-2022-38028 in the Windows Print Spooler stages a modified constraints file (MPDW-constraints.js) in this
  directory so the spooler loads attacker JavaScript — and through a registered custom protocol handler, an attacker
  DLL — with SYSTEM privileges; observed chains pair the write with protocol-handler and COM-server registrations in
  the registry, scheduled-task persistence running a batch script from C:\ProgramData, and registry-hive collection
  for credential theft. Legitimate JavaScript in this path is generally limited to print-driver package contents
  staged by driver-management processes, so the investigation should identify the writing process, review the file's
  content, check the spooler's subsequent module loads and child processes, and look for the registry and
  scheduled-task artifacts of the chain.
type: detection
detection_id: ec7c4e9b-9bc9-47c7-a32f-b53b598da642
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Is the created file a .js file under the DriverStore FileRepository, and which process wrote it?
  context: >-
    Before investing investigation time, confirm the alert is a true positive: the rule fires when TargetFilename
    starts with C:\Windows\System32\DriverStore\FileRepository\ AND ends in .js. Review the exact path, the operation
    performed, and the responsible process. Driver-package staging legitimately writes .js files here as part of v4
    print-driver packages — for those, the writer is a driver-management process; a standalone binary or script host
    writing a single .js into an existing package directory does not fit that profile.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - file_event
- question: Is this user or host expected to be installing or updating printer drivers right now?
  context: >-
    Legitimate JavaScript creation in the FileRepository accompanies printer-driver installation or servicing, which
    tracks driver rollouts, print-server maintenance, and endpoint provisioning. A host with no printing role, or a
    write outside any known driver deployment, lacks the routine explanation. The triggering event's user is
    frequently SYSTEM or a machine account for service-driven writes — in that case judge by the writing process and
    the host's function instead of the account name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this file creation part of an authorized penetration test or red team engagement?
  context: >-
    Exploit tooling for CVE-2022-38028 reproduces exactly this constraints-file write, and privilege-escalation
    exercises use the technique in authorized assessments. Check whether a pentest or red team engagement is active on
    this host or network segment; an authorized engagement with matching timing and scope resolves the alert without
    further analysis. The query shows the writing process's creation event for matching against engagement records.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: Is the JavaScript file still on disk, or was it modified, renamed, or deleted after the alert?
  context: >-
    The file's post-alert lifecycle drives next steps. A file still on disk can be retrieved, hashed, and compared
    against the driver package's original constraints file; deletion shortly after creation is anti-forensic cleanup.
    A tampered constraints file that remains in place keeps the SYSTEM escalation path armed — restoring known-good
    package content is part of remediation once evidence is preserved. Interpret the results by EventType.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What is the content of the created JavaScript file?
  context: >-
    Retrieve the file from disk and review it. Known tampering patches the constraints file so a print-ticket
    conversion loads a custom protocol URL (observed as printTicket.XmlNode.load('rogue9471://go')), which the spooler
    resolves through an attacker-registered protocol handler. Look for unfamiliar protocol schemes, obfuscated or
    encoded strings, and additions relative to the original constraints file shipped in the driver package. Hash the
    retrieved file and compare against internal and external threat intelligence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
- question: What security mechanism does this write target, and what does the writing process's command line show?
  context: >-
    This modification subverts the Print Spooler's JavaScript constraints validation rather than switching off a
    visible control — the tampered file makes a SYSTEM service execute attacker logic. The writing process's creation
    event identifies what performed the modification: observed chains invoke a standalone exploit binary launched from
    a batch script in C:\ProgramData, while legitimate writes come from driver-management tooling with
    package-installation arguments.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: What DLLs did spoolsv.exe load around this file creation, and are they signed and expected?
  context: >-
    File-creation events carry no hash, and this chain's JavaScript runs inside the spooler rather than as its own
    process — the verifiable executable artifact surfaces when the spooler loads a DLL staged through the patched
    constraints file. Library-load events carry the module path, hash, and signature directly: an unsigned or unknown
    DLL loading into spoolsv.exe from a DriverStore subdirectory or another user-writable path is the escalation
    payload. Submit its hash to reputation services or internal threat intelligence.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\spoolsv.exe'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - image_load
  - external_threat_intel
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    The constraints-file write is one step of a staged set. Observed chains place companion artifacts alongside it:
    batch scripts in C:\ProgramData (names seen include execute.bat, doit.bat, and servtask.bat) and auxiliary DLLs
    dropped into version-named subdirectories under the same DriverStore path. Correlating the writer and its direct
    children enumerates the staged set and distinguishes a single artifact from an operation in progress.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: What else has been written under the DriverStore FileRepository recently, and by which processes?
  context: >-
    This directory is normally written by driver-management processes during driver-package installation and
    servicing, so its writer set is small and consistent. Other recent arrivals reveal whether the location is under
    active staging use — attacker chains drop payload DLLs into version-named subdirectories here so the spooler's
    protocol-handler load resolves to them. A single unfamiliar writer across several files is the pattern to chase.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|startswith: 'C:\Windows\System32\DriverStore\FileRepository\'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Were new protocol handlers or COM server registrations written on this host around the alert?
  context: >-
    The chain registers a custom URL protocol under Software\Classes\PROTOCOLS\Handler\ and points the associated
    CLSID's Server value at an attacker DLL, so the patched constraints file's protocol load pulls that DLL into the
    SYSTEM spooler. Registration of new protocol schemes — particularly per-user HKCU entries — is rare outside
    application installs, and for CLSID Server values the Details field carries the registered DLL path for direct
    review.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_protocol:
        TargetObject|contains: '\Software\Classes\PROTOCOLS\Handler\'
      selection_clsid:
        TargetObject|contains: '\Software\Classes\CLSID\'
        TargetObject|endswith: '\Server'
      condition: selection_host and (selection_protocol or selection_clsid)
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - manual_review
- question: What child processes did spoolsv.exe spawn after this file was created?
  context: >-
    Successful exploitation executes inside the spooler at SYSTEM and uses it as a launcher for arbitrary
    applications. Command shells, script hosts, or unfamiliar binaries with spoolsv.exe as parent are the escalation
    succeeding; the spooler's routine children are limited to printing-related helper processes. Each unexpected child
    inherits SYSTEM and becomes its own investigation thread for follow-on tooling and lateral movement.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\spoolsv.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
  answer_sources:
  - process_creation
- question: Were other defense tampering actions performed on this host?
  context: >-
    Operators who tamper with one protection commonly touch several — clearing event logs, deleting shadow copies,
    stopping security services, or altering firewall state around the same operation. Multiple tampering events from
    the same user or parent process indicate several controls were targeted together; correlate any hits with the
    writing process's lineage and the SYSTEM-execution window.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: Were persistence mechanisms installed on this host around the file creation?
  context: >-
    Observed chains register a scheduled task with a system-sounding name (such as \Microsoft\Windows\WinSrv) that
    runs a C:\ProgramData batch script on a per-minute schedule — the script saves and compresses registry hives for
    credential theft — and later delete the task during cleanup, so both /Create and /DELETE invocations matter.
    Multiple persistence installations in the same timeframe indicate intentional stacking rather than isolated
    administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- always_include: true
  question: Has this user previously created JavaScript files under the DriverStore FileRepository?
  context: >-
    The query mirrors the rule's selection scoped to this user — the result is the user's 90-day history of this
    specific firing pattern aggregated by host, not generic file activity. Driver-package staging is normally
    performed under service principals, so any named-user history here should map to a driver-management,
    print-administration, or engineering role; a user who has never produced the pattern is the deviation worth
    weighing against their role.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\Windows\System32\DriverStore\FileRepository\
        TargetFilename|endswith: \.js
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
  - organizational_knowledge
- always_include: true
  question: Has this program historically driven JavaScript creation in the DriverStore, here or fleet-wide?
  context: >-
    When the alert fires under a service principal — common for spooler- and installer-driven writes — user identity
    does not attribute behavior; the launch mechanism does. The query mirrors the rule's selection scoped to the
    alerting program, giving the 90-day history of this program driving this specific pattern aggregated by
    host. A program that regularly produces the pattern fleet-wide is OS or vendor driver automation; a new or rare
    program for this pattern is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\Windows\System32\DriverStore\FileRepository\
        TargetFilename|endswith: \.js
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Cross-host activity for the account in the alert window reveals whether it was active on multiple endpoints —
    relevant here because the chain's purpose is SYSTEM-level credential theft that enables movement to other hosts.
    When the alert fires as SYSTEM or a machine account, this pivot degenerates into agent-telemetry noise; the
    parent-driven clustering question is the meaningful variant in that case.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did the same program-driven pattern fire on other hosts in the same window?
  context: >-
    Under a service principal, the meaningful scope question is whether the same launch mechanism produced the rule's
    pattern elsewhere: the query mirrors the rule's selection scoped to the alerting program, fleet-wide, in
    the alert window. Multiple hosts in the same window points to pushed automation such as a driver rollout — or to
    the same exploitation replayed across hosts, so cross-check the writer and its artifacts on each host that
    appears. A single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\Windows\System32\DriverStore\FileRepository\
        TargetFilename|endswith: \.js
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    A constraints-file write is a post-compromise escalation step, not initial access. Earlier detections on the same
    host — phishing payload execution, credential access, lateral movement, or other defense tampering — reconstruct
    how the operator reached the host, and log-clearing detections in the same span matter because anti-forensic
    cleanup accompanies SYSTEM access in this chain.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
