name: Suspicious DNS Query for IP Lookup Service APIs
id: 57705e87-a3a5-4926-b509-9aadd5dcc289
description: |
  Detects a DNS lookup for a public IP-address or geolocation lookup service (api.ipify.org,
  icanhazip.com, ip-api.com, checkip.amazonaws.com, and similar) made by a process other than
  a known web browser running from its standard install path. Malware frequently checks the
  victim's public IP shortly after infection to fingerprint the target, tag stolen data with a
  geolocation, apply geo-fencing, or confirm outbound connectivity before contacting its
  infrastructure — but VPN clients, dynamic-DNS updaters, monitoring agents, and
  administrator scripts perform the same lookup legitimately. The investigation identifies the
  querying program and how it was launched, whether the lookup fits an established pattern on
  this host, and whether follow-on connections, additional lookups, or file activity by the
  same process point to fingerprinting ahead of a larger operation rather than routine
  network tooling.
type: detection
detection_id: ec82e2a5-81ea-4211-a1f8-37a0286df2c2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the queried domain match an IP-lookup service this rule detects, and which process made the lookup?
  context: >-
    Confirm the alert before investing time. The rule fires when the queried domain (QueryName)
    matches one of roughly forty public IP-address or geolocation lookup services and the querying
    process is not one of the excluded browsers at their standard install paths. Review the exact
    domain and the querying process on the triggering event; note that a real browser running from
    a non-standard or user-writable path still fires this rule, and that case deserves the same
    scrutiny as a non-browser process.
  range: +/-5m
  answer_sources:
  - alert
  - dns_query
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
- question: Is this host or user expected to run software that checks the public IP address?
  context: >-
    Several legitimate programs resolve these services routinely: VPN and remote-access clients,
    dynamic-DNS updaters, cloud or network monitoring agents, speed-test utilities, and
    administrator scripts that verify egress connectivity. A network-management server or an IT
    workstation running such tooling reads differently from a standard user's machine where no
    installed software has a reason to ask "what is my IP". Pivot on the querying process to read
    the host and account attribution for the lookup.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which IP-lookup service was queried, and did the lookup resolve?
  context: >-
    Unlike a C2 domain, these services are legitimate infrastructure, so domain reputation is not
    the signal here — the signal is which process asked for the machine's public address. Read the
    exact QueryName to see which service was used and whether the lookup resolved. Some services
    also return geolocation, provider, and proxy/VPN attributes (ip-api.com, ipinfo.io,
    freegeoip.app), which fingerprint the victim's network beyond the bare address; a resolved
    lookup means the process could then fetch that data over an ordinary web request.
  range: +/-5m
  answer_sources:
  - dns_query
  - external_threat_intel
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: What was the full command line of the process that made this lookup?
  context: >-
    The DNS event names the querying process but not its arguments, so pivot to process telemetry
    on this host to read the command line. Look for the lookup service's URL passed as an argument
    (curl or PowerShell one-liners fetching icanhazip.com or api.ipify.org), scripted invocations,
    or a binary running from a user-writable path such as AppData or Temp. Stealers and loaders
    commonly perform the IP check as an early step of victim fingerprinting, so the command line
    often reveals the larger operation the lookup belongs to.
  range: +/-5m
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What launched the process that made this lookup?
  context: >-
    The parent chain distinguishes an installed utility doing its job from a delivered payload. A
    lookup by a monitoring agent launched from services.exe is ordinary; the same lookup by a
    binary spawned from an Office application, a script host such as wscript.exe or mshta.exe, an
    archive extractor, or a process started from the Startup folder points to the IP check being
    part of a freshly executed payload. Pivot on the querying process to read its own parent image
    and parent command line.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Was a browser launched in headless mode on this host around the time of the lookup?
  context: >-
    One documented fingerprinting pattern spawns a real browser with flags such as --headless,
    --disable-gpu, and --dump-dom pointed at an IP-lookup URL: --dump-dom prints the rendered page
    to stdout, letting the parent process capture the public IP and geolocation without any visible
    window. Because the rule excludes browsers by install path, that harness pattern is visible
    only in process telemetry. A browser invoked headless by a non-browser parent in this window
    corroborates programmatic IP discovery rather than user browsing.
  range: +/-1h
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
          - '--headless'
          - '--dump-dom'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: What outbound connections did the querying process make around the lookup?
  context: >-
    A public-IP check is usually a prelude: malware confirms connectivity and geolocation, then
    contacts its own infrastructure to check in or deliver collected data, often over ordinary
    HTTPS to web-service APIs such as messaging-platform bot endpoints. List the outbound
    connections the querying process initiated in the surrounding window. A connection to the
    lookup service itself is expected after the resolution; connections to additional external
    destinations from the same process are what separate fingerprinting-plus-check-in from an
    isolated IP query.
  range: +/-1h
  answer_sources:
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
- question: What files did the querying process create on this host?
  context: >-
    Stealers that perform the IP check commonly stage collected data into a plain text or archive
    file under the user's Temp directory before sending it out, and drop copies of themselves —
    often renamed to imitate common office software — into the Startup folder or packed one-file
    extraction directories under Temp. Files written by the querying process reveal staged
    collection, dropped payloads, or persistence artifacts; a legitimate connectivity checker
    typically writes little or nothing.
  range: -24h
  answer_sources:
  - file_event
  query: |
    aggregation: true
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
- question: What other domains did the querying process look up around the same time?
  context: >-
    The set of domains the same process resolved in the surrounding window shows what the IP check
    belongs to. Lookups of messaging-platform bot APIs, paste or file-sharing sites, or
    recently-registered domains alongside the IP-lookup service point to an exfiltration or
    command channel being established; a burst of algorithmically varied names points to
    domain-generation behavior. A legitimate utility usually resolves only its vendor's own
    endpoints next to the lookup service.
  range: +/-1h
  answer_sources:
  - dns_query
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: Has this host queried other public IP-lookup services in the past week?
  context: >-
    Malware families rotate among these services because any single one may be blocked or
    rate-limited, so the same host querying several different lookup services — especially from
    different non-browser processes — is a stronger fingerprinting signal than repeated use of
    one. Conversely, a single service queried on a steady schedule by the same program is the
    profile of an installed updater or monitoring agent. Compare which services were queried and
    by which processes.
  range: -7d
  answer_sources:
  - dns_query
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|contains:
          - 'api.2ip.ua'
          - 'api.bigdatacloud.net'
          - 'api.ipify.org'
          - 'bot.whatismyipaddress.com'
          - 'canireachthe.net'
          - 'checkip.amazonaws.com'
          - 'checkip.dyndns.org'
          - 'curlmyip.com'
          - 'db-ip.com'
          - 'edns.ip-api.com'
          - 'eth0.me'
          - 'freegeoip.app'
          - 'geoipy.com'
          - 'getip.pro'
          - 'icanhazip.com'
          - 'ident.me'
          - 'ifconfig.io'
          - 'ifconfig.me'
          - 'ip-api.com'
          - 'ip.360.cn'
          - 'ip.anysrc.net'
          - 'ip.taobao.com'
          - 'ip.tyk.nu'
          - 'ipaddressworld.com'
          - 'ipapi.co'
          - 'ipconfig.io'
          - 'ipecho.net'
          - 'ipinfo.io'
          - 'ipip.net'
          - 'ipof.in'
          - 'ipv4.icanhazip.com'
          - 'ipv4bot.whatismyipaddress.com'
          - 'ipv6-test.com'
          - 'ipwho.is'
          - 'jsonip.com'
          - 'myexternalip.com'
          - 'seeip.org'
          - 'wgetip.com'
          - 'whatismyip.akamai.com'
          - 'whois.pconline.com.cn'
          - 'wtfismyip.com'
          - 'www.ip.cn'
          - 'l2.io'
      condition: selection
    fields:
      - QueryName
      - Image
- question: Does this host normally run the querying binary?
  context: >-
    A program that has run on this host daily for months and always performed this lookup is
    almost certainly installed tooling; a binary executing for the first time is worth the closer
    look, particularly when the command-line decode places it in a user-writable path. Zero or
    very low historical counts indicate first-time or rare execution of this binary on this host.
  range: -90d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Has this host looked up this specific service before?
  context: >-
    First-time lookups carry more weight than routine ones. A 90-day history showing this domain
    resolved on a regular cadence by the same program is the profile of an installed agent
    checking connectivity; no prior history means the public-IP check is new behavior on this
    host and raises the weight of everything else the querying process did. The distribution over
    time also exposes whether the cadence is machine-regular or one-off.
  range: -90d
  answer_sources:
  - dns_query
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    An IP check performed by a fresh payload rarely happens in isolation — it typically sits
    between initial execution and follow-on actions such as credential access, persistence setup,
    or staging. Aggregating process activity in a tight window around the lookup collapses
    routine telemetry into high-count rows while novel parent-child pairs stand out at low
    counts, surfacing the delivery chain or follow-on tooling around the lookup.
  range: +/-15m
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other hosts in the environment query this same lookup service?
  context: >-
    The spread across hosts informs the response. Many hosts resolving the same service from the
    same program points to deployed software — a VPN client or monitoring agent rolled out
    broadly — or, if the querying binary is unrecognized, to the same payload landing on multiple
    machines. A single host querying it in isolation is more consistent with a targeted or
    early-stage foothold. Compare which processes on which hosts made the lookup.
  range: -7d
  answer_sources:
  - dns_query
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — phishing-delivery indicators, script-host execution,
    masquerading binaries, or defense tampering — may reveal the stages that preceded the IP
    check and help reconstruct the timeline. Because the public-IP check typically happens early
    in a payload's execution, prior alerts often mark the delivery step, and later alerts the
    follow-on objectives.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
