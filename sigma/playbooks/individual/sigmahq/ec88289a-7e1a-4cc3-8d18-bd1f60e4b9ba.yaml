name: Persistence Via TypedPaths - CommandLine
id: 017d70b6-0b5a-4a78-a6d3-dc09c8af6cf9
description: |
  Detects a command line that writes to the per-user TypedPaths key
  (\Software\Microsoft\Windows\CurrentVersion\Explorer\TypedPaths), the registry
  list that backs File Explorer's address-bar autocomplete. The rule fires when a
  process's command line contains that key path. Legitimate updates to TypedPaths
  happen interactively when a user types a path into the Explorer address bar and
  closes the window, so a process-driven write via reg.exe, PowerShell, or a script
  is anomalous. Adversaries plant a urlN value (url1 is the most recent path) to seed
  a UNC or lateral-movement target that auto-completes for the next person who opens
  Explorer, or to bias forensic readout. Determine which process performed the write,
  what path was planted, and whether the writing process and user are expected to edit
  this key.
type: detection
detection_id: ec88289a-7e1a-4cc3-8d18-bd1f60e4b9ba
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line write to the Explorer TypedPaths registry key?
  context: Confirm the alert is a true positive by reviewing the exact command line. The
    rule fires on any command line containing \Software\Microsoft\Windows\CurrentVersion\Explorer\TypedPaths.
    Read the full command to see which value name (url1 through url25) was set and what
    path string was written before investing further analysis time.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to modify Explorer autocomplete paths from the command line?
  context: Legitimate TypedPaths updates occur interactively through the Explorer address bar,
    not via a command-line registry write. A user or host with no reason to script Explorer
    settings points toward misuse; an administrator running a profile-customization script or a
    known deployment job is a routine explanation. Knowing the user role and host function is
    often the fastest way to separate the two.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exact TypedPaths value name and data were written to the registry?
  context: The registry_set event linked to this process exposes the key path (TargetObject)
    and the data written (Details) as structured fields instead of parsing them from the
    command line. TypedPaths uses url1 through url25 with url1 holding the most recent path;
    the data written is the path that will auto-complete in Explorer. Inspect the data for a
    UNC path, a remote share, or a path to a payload rather than an ordinary local folder.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process spawned the writer and is that parent chain expected?
  context: The parent process reveals how the registry write was invoked. An interactive
    administrative session or a known deployment agent is a routine explanation; parents
    such as mshta.exe, wscript.exe, an Office application, or a freshly written script host
    point to scripted or macro-driven execution. Walking up the tree shows whether the write
    was part of a larger sequence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has written to TypedPaths before, what parents and users normally drive it, and does the current alert fit that pattern?
  context: The query mirrors the rule's selection scoped to this host, so the resulting
    parent and user distribution reflects how command-line TypedPaths writes have historically
    run here, not generic process activity. A new parent process, an unexpected user account,
    or a first-time appearance of this pattern on the host is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: \Software\Microsoft\Windows\CurrentVersion\Explorer\TypedPaths
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Were other registry modifications made on this host in the same session?
  context: A process that edits TypedPaths often edits other keys in the same run. Finding a
    cluster of registry writes from the same host within a short window reveals whether the
    TypedPaths change was isolated or one of several configuration changes (for example a Run
    key for persistence alongside a Defender or firewall change), which shifts the disposition
    toward intentional tampering rather than a one-off edit.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- question: What path was planted in the TypedPaths value, and does it reference a remote share or a local payload?
  context: Unlike a Run key, TypedPaths does not directly execute the path it stores; it makes
    the path auto-complete in the Explorer address bar so the next user who opens Explorer is
    nudged toward it. A planted UNC path or remote share seeds a lateral-movement destination,
    while a local path may point at a dropped file. Examine the value data, then check whether
    any file at the referenced path exists on disk to determine what the planted entry leads to.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: \Software\Microsoft\Windows\CurrentVersion\Explorer\TypedPaths
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: \Software\Microsoft\Windows\CurrentVersion\Explorer\TypedPaths
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in the alert window reveals whether
    the same account drove activity on multiple endpoints. The same user touching several
    hosts at once widens the scope; activity confined to one host narrows it.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: \Software\Microsoft\Windows\CurrentVersion\Explorer\TypedPaths
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other tools ran on this host around the same time?
  context: Activity surrounding the registry write may reveal reconnaissance, privilege
    escalation, other persistence installation, or staging that frames the broader context.
    Aggregating by binary collapses repetitive noise so novel tools stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Have other hosts written to TypedPaths from the command line in the past week, and does the spread look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count
    of the command-line TypedPaths pattern rather than generic process usage. Many hosts firing
    the same pattern points to scripted deployment or profile-management automation; one host
    or a small unrelated set points to manual operator activity. Use the host distribution to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: \Software\Microsoft\Windows\CurrentVersion\Explorer\TypedPaths
      condition: selection
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the registry write shows
    what led to it and what followed, and whether it is part of a larger sequence. Aggregating
    by Image and ParentImage collapses agent-telemetry noise so novel parent-child pairs stand
    out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential
    access — may reveal the stages that preceded this registry write and help reconstruct the
    timeline. Persistence is usually installed after an initial foothold, so prior alerts often
    explain how the writer got there.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host?
  context: Attackers rarely rely on a single persistence mechanism. After seeding TypedPaths,
    they commonly install backup footholds with different techniques — scheduled tasks,
    services, registry Run keys, BITS jobs, or WMI subscriptions. Several persistence
    installations in the same timeframe indicate intentional stacking rather than an isolated
    administrative change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations such as the Startup folder or scheduled-task definition paths on this host?
  context: File-based persistence bypasses command-line detection entirely. Dropping an
    executable or script into a Startup folder or a path referenced by a registry Run key
    achieves persistence without running reg, sc, or schtasks. File event monitoring captures
    these drops even when the writer avoids standard persistence tooling, which is relevant when
    the TypedPaths edit may be one of several footholds.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
