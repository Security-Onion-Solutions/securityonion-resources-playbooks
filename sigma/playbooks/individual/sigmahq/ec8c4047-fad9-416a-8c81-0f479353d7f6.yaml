name: Diagnostic Library Sdiageng.DLL Loaded By Msdt.EXE
id: 9c203070-163e-48d1-8123-5d0b96b4ad0a
description: |
  Detects msdt.exe loading the scripted-diagnostics engine sdiageng.dll — the library-load
  pairing produced when the Microsoft Support Diagnostic Tool executes a troubleshooting
  package, and the execution path abused by CVE-2022-30190 (Follina) via crafted ms-msdt:
  URIs and by the DogWalk technique via malicious .diagcab packages that can fetch
  attacker-controlled files over WebDAV and plant payloads in the Startup folder.
  Legitimate troubleshooting wizards produce the same load, so the investigation turns on
  how msdt.exe was invoked: the command line and parent process identify the delivery
  vector, while children spawned through the diagnostics host, files dropped by the
  session, and outbound connections from msdt.exe separate exploitation from routine
  diagnostics.
type: detection
detection_id: ec8c4047-fad9-416a-8c81-0f479353d7f6
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the loaded module match what this rule detects — sdiageng.dll loaded by msdt.exe?
  context: Confirm the alert against the rule's two criteria — the loading process (Image)
    ends in \msdt.exe and the loaded module (ImageLoaded) ends in \sdiageng.dll. The
    library-load event carries the module's hash and code-signature details directly, so
    the match and the module's authenticity can be read from the same event. sdiageng.dll
    is the engine msdt.exe loads whenever a troubleshooting pack runs, so the pairing
    itself is expected mechanics — the rest of the investigation establishes how msdt.exe
    came to run.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
  answer_sources:
  - alert
  - image_load
- question: Is this user expected to be running Windows diagnostic troubleshooting packs on this host?
  context: msdt.exe runs when a user, help-desk session, or support tooling launches a
    diagnostic pack. Deliberate troubleshooting by the console user or an administrator on
    a support host can be routine, whereas a standard user on a workstation with no
    support activity — especially one who just opened a document or downloaded a file —
    deserves more scrutiny than server, jump-host, or managed-support contexts where
    diagnostic utilities are part of normal operations.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: How was msdt.exe invoked — what do its command-line arguments contain?
  context: The invocation separates exploitation from routine troubleshooting. An
    'ms-msdt:' URI referencing the PCWDiagnostic pack with IT_BrowseForFile or
    IT_RebrowseForFile parameters — particularly containing $( ) fragments — is the
    CVE-2022-30190 (Follina) injection pattern, while a command line ending in a .diagcab
    file path is the DogWalk delivery vehicle, and that file's location (Downloads, Temp,
    a mail-client cache) shows how it arrived. Legitimate troubleshooter launches
    reference built-in Microsoft diagnostic packs without either marker.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What other modules did this msdt.exe process load, and are any unsigned or from non-canonical paths?
  context: The module set tells the session's story. Scripted-diagnostics engines and
    script engines (sdiagprv.dll, vbscript.dll) are expected when a pack executes, whereas
    any module loaded from Temp, AppData, ProgramData, or another user-writable path
    points to planted content, and a system DLL name loading from a non-system path
    indicates search-order hijacking of the diagnostic session. Unsigned modules in a
    process that normally loads only Microsoft-signed libraries deserve individual review.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
  answer_sources:
  - image_load
  - manual_review
- question: Is the loaded sdiageng.dll the genuine Microsoft-signed system copy, and does its hash check out in threat intelligence?
  context: The legitimate diagnostic engine lives under the Windows system directory and
    carries a valid Microsoft signature, so an unsigned copy, an invalid signature, or an
    unusual path would mean the library itself was planted rather than abused in place.
    The load event carries the module hash directly — check it against reputation sources,
    and treat SignatureStatus values of Expired, Distrusted, or Invalid as tampering
    indicators.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
  answer_sources:
  - image_load
  - external_threat_intel
  - manual_review
- question: What process launched msdt.exe, and is that parent chain expected?
  context: The parent is the delivery vector. An Office application (WINWORD.EXE,
    EXCEL.EXE, OUTLOOK.EXE) or a browser as parent indicates a document or link invoked
    the ms-msdt handler — the Follina pattern. An explorer.exe parent can mean a user
    double-clicked a downloaded .diagcab (the DogWalk pattern) or deliberately launched a
    troubleshooter, while Control Panel and settings hosts are the common legitimate
    launchers. When the chain looks unusual, walk one level further and check what spawned
    the parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - CommandLine
  answer_sources:
  - process_creation
- question: What processes did msdt.exe or sdiagnhost.exe spawn after the load?
  context: Scripted-diagnostic payloads execute through sdiagnhost.exe, the diagnostics
    host that msdt.exe hands the package to, so injected code typically appears as a child
    of sdiagnhost.exe rather than of msdt.exe itself. High-risk children include
    powershell.exe, cmd.exe, rundll32.exe, regsvr32.exe, mshta.exe, msiexec.exe, curl.exe,
    and bitsadmin.exe. A routine troubleshooter mostly spawns nothing beyond the
    diagnostics host and console helpers, so any payload-class child is worth decoding in
    full.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith:
          - '\msdt.exe'
          - '\sdiagnhost.exe'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Did msdt.exe initiate outbound network connections around the library load?
  context: The diagnostic engine fetches remote content when a crafted package points it
    at an attacker-controlled share — DogWalk delivery places a WebDAV location in the
    package's Path= variable, retrieved over HTTP or SMB into the user's Temp directory.
    msdt.exe needs no external egress for local troubleshooting, so connections to
    destinations outside known management and content-delivery ranges are the deviation to
    chase, and the fetch typically lands within minutes of the load.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\msdt.exe'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
  answer_sources:
  - network_connection
  - external_threat_intel
- question: Are files written by the diagnostic session still on disk for analysis?
  context: Remote content fetched by the diagnostic engine lands in a randomly named
    folder beginning with SDIAG_ under the user's local Temp directory, and observed abuse
    plants payloads in the Startup folder for persistence. Files written by the msdt.exe
    process or its children that remain on disk can be hashed, submitted to a sandbox, or
    content-reviewed, while deletion shortly after the session points to cleanup.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What other activity occurred on this host around the time of the alert?
  context: The surrounding window shows what led to the load and what followed.
    Aggregating by image and parent collapses repetitive agent noise into high-count rows
    while novel parent-child pairs stand out at low counts — look for document handlers,
    script hosts, archive extractors, or reconnaissance tools appearing alongside the
    diagnostic session.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
- question: Does this host normally run msdt.exe?
  context: Troubleshooting packs run occasionally on end-user machines and support hosts,
    so some execution history is normal. Zero or near-zero history makes this launch a
    first for the host and raises the weight of the invocation and parent-chain findings,
    while the user grouping shows whether past runs came from the same account.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: When this host previously loaded sdiageng.dll into msdt.exe, which programs and users drove it — and does this alert fit?
  context: The query mirrors the rule's selection scoped to this host, so the program and
    user distribution reflects prior occurrences of this exact load pairing — every
    scripted-diagnostics session, not generic msdt.exe use. The Image column will show
    msdt.exe itself, so the account and count carry the signal — prior sessions under the
    console user describe routine troubleshooting, while an unexpected account or a
    first-ever session is the deviation worth chasing. Image-load events carry no parent
    lineage — pivot to the msdt.exe process-creation event to see whether an Office
    application or script host launched it.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith: \msdt.exe
        ImageLoaded|endswith: \sdiageng.dll
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
  answer_sources:
  - image_load
- question: Has sdiageng.dll been loaded on this host before, and by which processes?
  context: Grouping historical loads of the library by loading process shows whether
    anything other than msdt.exe has ever pulled it in. The engine should load only into
    the diagnostics tooling, so a different loader in the history deserves its own review,
    and a complete absence of prior loads marks this as the host's first
    scripted-diagnostics session in the window.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
  answer_sources:
  - image_load
- question: Was msdt.exe executed from its expected system path?
  context: msdt.exe belongs in System32 or SysWOW64. A copy running from a user-writable
    directory, or a process whose OriginalFileName reads msdt.exe while its on-disk name
    differs, indicates the binary was relocated or renamed to sidestep path-based
    allowlists — a different problem than in-place abuse and worth its own pivot.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
  answer_sources:
  - process_creation
- question: Were other proxy-execution LOLBins used on this host recently?
  context: msdt.exe abuse is proxy execution through a signed system utility, and
    operators who use one such utility often use several. Sibling proxy-execution binaries
    such as rundll32, regsvr32, mshta, cmstp, installutil, and msiexec running in the
    preceding day — especially with URLs, script paths, or unusual working directories on
    the command line — point to the diagnostic session being one step in a longer
    sequence.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: How often has this host loaded sdiageng.dll into msdt.exe over the past 90 days?
  context: A load pairing with no prior history on the host is more notable than one that
    appears whenever users run troubleshooters. The query mirrors the rule's selection
    scoped to this host, so the count reflects this exact pattern over 90 days rather than
    generic msdt.exe use. Library-load events may carry little command-line detail, so
    treat the frequency as the signal here and read invocation specifics from the
    process-creation questions.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith: \msdt.exe
        ImageLoaded|endswith: \sdiageng.dll
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - CommandLine
  answer_sources:
  - image_load
- question: Have other hosts loaded sdiageng.dll into msdt.exe in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide
    count of this load pairing. Broad, steady counts across many hosts point to support
    tooling or routine troubleshooting, a small cluster of hosts firing in the same window
    is consistent with a phishing wave delivering documents or .diagcab files, and a
    single host points to targeted or isolated activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith: \msdt.exe
        ImageLoaded|endswith: \sdiageng.dll
      condition: selection
    fields:
    - host.name
  answer_sources:
  - image_load
- question: Did other detections fire on this host in the hours before this alert?
  context: Exploitation through msdt.exe is usually mid-chain — a document, link, or
    archive arrived first. Earlier detections such as Office applications spawning
    processes, suspicious downloads, or script-host activity help reconstruct the
    delivery, and later ones show follow-through. The host's alert timeline frames where
    this load sits in the sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
