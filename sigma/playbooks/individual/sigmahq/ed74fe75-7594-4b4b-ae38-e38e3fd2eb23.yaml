name: Outbound RDP Connections Over Non-Standard Tools
id: 1ea51ce8-13e6-4edd-9d44-9918c01fb1aa
description: |
  Detects a process other than mstsc.exe or a known remote-desktop management tool initiating an
  outbound connection to TCP port 3389, the standard RDP service port. Operators moving laterally
  frequently drive RDP from their own tooling — tunneling utilities, custom clients, or
  post-exploitation frameworks — rather than the built-in client, so an unrecognized binary
  reaching 3389 points at either unbaselined third-party RDP software (the rule's stated
  false-positive source) or attacker-controlled remote access. The investigation identifies the
  initiating binary and how it was launched, establishes whether an RDP logon actually landed on
  the destination and under which account, and scopes how far the source host and that account
  have reached across the environment.
type: detection
detection_id: ed74fe75-7594-4b4b-ae38-e38e3fd2eb23
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does this event show an outbound connection to port 3389, and is the initiating process outside the rule's excluded RDP client list?
  context: |
    The rule fires when a connection with DestinationPort 3389 and Initiated true comes from a
    process image that is not mstsc.exe and not one of the excluded known remote-desktop clients,
    security agents, or scanners (events with an empty or unknown image are also excluded, so the
    alert carries a process by construction). Confirm the destination, the outbound direction, and
    the initiating image, and check whether the image is a legitimate RDP tool that simply is not
    on the exclusion list yet.
  range: +/-5m
  answer_sources:
  - alert
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Initiated
- question: Is this user and host expected to initiate RDP sessions, and to do so with a client other than mstsc.exe?
  context: |
    Administrators and helpdesk staff routinely use third-party RDP managers, which is why this
    rule requires a baseline of sanctioned tooling before deployment. Weigh the user's role and
    the host's function — an RDP connection from a management host under an admin account reads
    differently from one under a service account or a non-admin user, for whom interactive remote
    desktop is rarely expected.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What binary initiated the RDP connection, and what do its path and command line reveal?
  context: |
    Identify the tool. The image path matters — a remote-desktop utility installed under Program
    Files differs from an executable running out of Downloads, Temp, or AppData. The command line
    may name the target host, embed credentials, or carry port-forwarding arguments (for example
    plink or ssh -L style tunnels that relay 3389 through another channel), which distinguish a
    desktop client from a tunneling setup.
  range: +/-5m
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What is the RDP destination, and is it a system this host should be reaching?
  context: |
    For an internal destination, establish the asset's role and sensitivity — a domain controller
    or server-subnet target raises the stakes relative to a peer workstation. For an external
    destination, RDP leaving the network points at reverse tunneling or remote administration of
    outside infrastructure; check ownership, hosting, and threat-intelligence reputation. The
    hostname field is sparsely populated on endpoint network telemetry, so resolve the address
    through asset inventory or DNS records.
  range: +/-5m
  answer_sources:
  - asset_inventory
  - external_threat_intel
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - DestinationPort
- question: What process launched the tool that initiated this connection, and is that parent chain expected?
  context: |
    Interactive use typically launches from explorer.exe or an administrator's shell; a script
    host, an Office application, or a service parent points to automation or a compromised process
    driving the connection. If the parent lookup returns nothing — parent linkage is not always
    recorded on network telemetry — fall back to the process-identification question's
    process_creation view of the same binary and read the parent from there.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Did an RDP logon land on a destination host from this source, and under which account?
  context: |
    The network alert only proves a connection attempt; the destination's Security log shows
    whether a session was actually established. RemoteInteractive (type 10) logon events carry
    this host's address as the source — a success identifies the account the operator
    authenticated with, and 4625 failures alongside it suggest password guessing. The detection
    strategy for this technique correlates the login with follow-on activity inside a short
    window, on the order of 5 minutes. If destination Security logs are not ingested in this
    environment, treat zero results as a visibility gap rather than evidence no session happened.
  range: +30m
  answer_sources:
  - manual_review
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 4624
          - 4625
        LogonType: 10
        IpAddress|expand: '%src_ip%'
      condition: selection
    fields:
      - host.name
      - TargetUserName
      - EventID
- question: Which authentication method was used for this RDP session?
  context: |
    RDP normally produces a RemoteInteractive logon from typed or saved credentials, but
    restricted-admin mode allows pass-the-hash over RDP, and explicit-credential events (4648) on
    this source host just before the connection show the operator switching to a different
    account. Legitimate credential use still leaves the question of how the credentials were
    obtained — reuse, dumping, or phishing — which frames how far the compromise extends.
  range: +/-30d
  answer_sources:
  - process_creation
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
      - CommandLine
- question: Is this host an expected administrative source for RDP, and what other RDP-port connections did it make in this window?
  context: |
    Lateral movement needs a source, and this host is it. Compare against known administrative
    jump boxes and deployment systems — an allowlisted management host fanning out over RDP is
    routine, while a workstation or server that never initiates RDP suddenly reaching one or more
    destinations fits the pivot pattern. Each returned event carries the destination it reached,
    and the source address feeds the destination-logon check against Security log records.
  range: +/-15m
  answer_sources:
  - network_connection
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort: 3389
        Initiated: 'true'
      condition: selection
    fields:
      - SourceIp
      - DestinationPort
- question: Has this user account run remote-access or lateral-movement tooling on other hosts in the last day?
  context: >-
    | If this alert fired under SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a machine account
    (name ending in $), this query intentionally returns nothing — a user pivot on a service
    principal matches every host's background automation, not an actor; assess movement through
    the host- and program-scoped questions instead.

    If the account is operating tooling such as psexec, plink, wmic, or RDP clients across several
    systems, the activity is broader than this single connection and the containment scope grows
    with it. If the user field is unpopulated on the alert, pivot on the source host's other
    outbound activity instead.
  range: -24h
  answer_sources:
  - network_connection
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_lateral:
        Image|endswith:
        - \psexec.exe
        - \psexec64.exe
        - \mstsc.exe
        - \ssh.exe
        - \plink.exe
        - \wmic.exe
      filter_svcprin_builtin:
        User:
        - SYSTEM
        - LOCAL SERVICE
        - NETWORK SERVICE
      filter_svcprin_machine:
        User|endswith: $
      condition: (selection and selection_lateral) and not 1 of filter_svcprin_*
    fields:
    - host.name
    - Image
- question: What child processes did the initiating tool spawn afterward?
  context: |
    A desktop client mostly renders a remote session and spawns little; tunneling and
    post-exploitation utilities frequently launch helpers — shells, port-forwarders, staging
    commands. Children that are command interpreters or network utilities show the tool is doing
    more on this host than displaying a remote desktop.
  range: +4h
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did this account run command interpreters or download utilities on other hosts shortly after the connection?
  context: |
    Remote desktop is a means to an end. The detection strategy for this technique flags
    post-login execution of tools such as cmd.exe, powershell.exe, and certutil.exe on the
    accessed system; if the operator authenticated to the destination with the same account, that
    activity surfaces here grouped by host. An empty result under a populated user field weighs
    toward an interrupted or purely interactive session.
  range: +1h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith:
          - '\cmd.exe'
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\certutil.exe'
      filter_self:
        host.name|expand: '%hostname%'
      condition: selection and not filter_self
    fields:
      - host.name
      - Image
- question: Where has this user authenticated recently?
  context: >-
    | If the alert fired under SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a machine account
    (name ending in $), this query intentionally returns nothing — service-principal logons are
    background noise, not an actor trail. For a human account, zero results can also mean the
    Security channel is not ingested for the relevant hosts; confirm 4624 visibility before
    reading zero as "no authentications".

    Logon events across the environment show which systems the account touched before and after
    this connection. Type 10 entries are remote desktop sessions, type 3 network logons accompany
    file-share and remoting access, and bursts of authentications to many hosts in a short period
    — especially by a privileged or service account — fit lateral movement in progress.
  range: +/-1h
  answer_sources:
  - network_connection
  - manual_review
  query: |
    aggregation: true
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
        - 4624
        - 4625
        TargetUserName|expand: '%User%'
      filter_svcprin_builtin:
        TargetUserName:
        - SYSTEM
        - LOCAL SERVICE
        - NETWORK SERVICE
      filter_svcprin_machine:
        TargetUserName|endswith: $
      condition: (selection) and not 1 of filter_svcprin_*
    fields:
    - host.name
    - IpAddress
    - EventID
    - LogonType
- question: Has this host connected to this destination before, and with which client?
  context: |
    A first-time source-to-destination pair is the access-pattern anomaly this technique's tuning
    keys on; months of prior connections suggest an established administrative relationship. The
    image grouping shows whether prior access used mstsc.exe or sanctioned management tooling
    versus the binary in this alert.
  range: -90d
  answer_sources:
  - network_connection
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
- question: Does this host normally run the binary that initiated this connection?
  context: |
    Zero or near-zero history makes this a first-time execution on the host, which raises the
    weight of every other finding. Regular history under the same user points to installed
    tooling whose RDP use may simply need baselining and, if sanctioned, an exclusion in the
    rule.
  range: -90d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has fired this non-standard RDP pattern before, what programs and users drove it, and does this alert fit?
  context: |
    The query mirrors the rule's own selection and exclusions scoped to this host, so the program
    and user distribution reflects how this specific firing pattern has historically run here —
    not generic network activity. A new connecting program, a different user account, or a
    first-ever fire relative to that history is the deviation worth chasing; connection events
    carry no parent lineage, so pivot to the program's start event if lineage matters.
  range: -14d
  answer_sources:
  - network_connection
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        DestinationPort: 3389
        Initiated: 'true'
      filter_main_mstsc:
        Image:
        - C:\Windows\System32\mstsc.exe
        - C:\Windows\SysWOW64\mstsc.exe
      filter_optional_dns:
        Image: C:\Windows\System32\dns.exe
        SourcePort: 53
        Protocol: udp
      filter_optional_avast:
        Image|endswith:
        - \Avast Software\Avast\AvastSvc.exe
        - \Avast\AvastSvc.exe
      filter_optional_sysinternals_rdcman:
        Image|endswith: \RDCMan.exe
      filter_optional_chrome:
        Image: C:\Program Files\Google\Chrome\Application\chrome.exe
      filter_optional_third_party:
        Image|endswith:
        - \FSAssessment.exe
        - \FSDiscovery.exe
        - \MobaRTE.exe
        - \mRemote.exe
        - \mRemoteNG.exe
        - \Passwordstate.exe
        - \RemoteDesktopManager.exe
        - \RemoteDesktopManager64.exe
        - \RemoteDesktopManagerFree.exe
        - \RSSensor.exe
        - \RTS2App.exe
        - \RTSApp.exe
        - \spiceworks-finder.exe
        - \Terminals.exe
        - \ws_TunnelService.exe
      filter_optional_thor:
        Image|endswith:
        - \thor.exe
        - \thor64.exe
      filter_optional_splunk:
        Image|startswith: C:\Program Files\SplunkUniversalForwarder\bin\
      filter_optional_sentinel_one:
        Image|endswith: \Ranger\SentinelRanger.exe
      filter_optional_firefox:
        Image: C:\Program Files\Mozilla Firefox\firefox.exe
      filter_optional_tsplus:
        Image:
        - C:\Program Files\TSplus\Java\bin\HTML5service.exe
        - C:\Program Files (x86)\TSplus\Java\bin\HTML5service.exe
      filter_optional_null:
        Image: null
      filter_optional_empty:
        Image: ''
      filter_optional_unknown:
        Image: <unknown process>
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts fired this non-standard RDP pattern in the past week?
  context: |
    The query mirrors the rule's selection with no host scope, giving a fleet-wide count of the
    firing pattern. Many hosts firing under a consistent image point to a deployed tool that needs
    baselining or an exclusion; one host, or a small set sharing a destination, points to operator
    activity worth treating as lateral movement.
  range: -7d
  answer_sources:
  - network_connection
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        DestinationPort: 3389
        Initiated: 'true'
      filter_main_mstsc:
        Image:
        - C:\Windows\System32\mstsc.exe
        - C:\Windows\SysWOW64\mstsc.exe
      filter_optional_dns:
        Image: C:\Windows\System32\dns.exe
        SourcePort: 53
        Protocol: udp
      filter_optional_avast:
        Image|endswith:
        - \Avast Software\Avast\AvastSvc.exe
        - \Avast\AvastSvc.exe
      filter_optional_sysinternals_rdcman:
        Image|endswith: \RDCMan.exe
      filter_optional_chrome:
        Image: C:\Program Files\Google\Chrome\Application\chrome.exe
      filter_optional_third_party:
        Image|endswith:
        - \FSAssessment.exe
        - \FSDiscovery.exe
        - \MobaRTE.exe
        - \mRemote.exe
        - \mRemoteNG.exe
        - \Passwordstate.exe
        - \RemoteDesktopManager.exe
        - \RemoteDesktopManager64.exe
        - \RemoteDesktopManagerFree.exe
        - \RSSensor.exe
        - \RTS2App.exe
        - \RTSApp.exe
        - \spiceworks-finder.exe
        - \Terminals.exe
        - \ws_TunnelService.exe
      filter_optional_thor:
        Image|endswith:
        - \thor.exe
        - \thor64.exe
      filter_optional_splunk:
        Image|startswith: C:\Program Files\SplunkUniversalForwarder\bin\
      filter_optional_sentinel_one:
        Image|endswith: \Ranger\SentinelRanger.exe
      filter_optional_firefox:
        Image: C:\Program Files\Mozilla Firefox\firefox.exe
      filter_optional_tsplus:
        Image:
        - C:\Program Files\TSplus\Java\bin\HTML5service.exe
        - C:\Program Files (x86)\TSplus\Java\bin\HTML5service.exe
      filter_optional_null:
        Image: null
      filter_optional_empty:
        Image: ''
      filter_optional_unknown:
        Image: <unknown process>
      condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: |
    Aggregated parent-child process pairs around the alert reveal the surrounding sequence —
    credential tooling or reconnaissance before the connection, staging afterward. Novel low-count
    pairs stand out against repetitive agent noise and show whether the connection was an isolated
    event or one step in a longer chain.
  range: +/-15m
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: |
    Earlier detections on the same host — credential access, discovery, defense tampering — often
    mark the stages that precede a lateral-movement attempt and help reconstruct the timeline from
    initial access to this outbound RDP connection.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
