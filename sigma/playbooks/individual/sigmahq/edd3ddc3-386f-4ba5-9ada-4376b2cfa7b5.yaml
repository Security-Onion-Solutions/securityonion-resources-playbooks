name: Potential EACore.DLL Sideloading
id: 2d7c8f8a-e503-438f-8834-fef90699abce
description: |
  Detects a Windows library load of EACore.dll by any process, or from any path, other than the legitimate case of
  the EA Desktop client's EACoreServer.exe loading it out of C:\Program Files\Electronic Arts\EA Desktop\ (the rule
  fires when the EACore.dll load matches AND the known-good loader-plus-path case does NOT match). DLL sideloading
  places an attacker-controlled library where a trusted, signed executable will load it, so the library runs with the
  host process's legitimacy; EACore.dll side-load pairs have been observed staged outside the vendor directory, such
  as a ProgramData folder with a service-sounding name holding a copied EACoreServer.exe next to a malicious
  EACore.dll. Investigation should confirm the loaded module's path, signature, and hash on the load event, establish
  whether the loading process is the genuine EA Desktop binary in its installed location, trace what wrote the DLL
  and its paired executable to disk, and check for follow-on persistence, child-process execution, and additional
  footholds on the host.
type: detection
detection_id: edd3ddc3-386f-4ba5-9ada-4376b2cfa7b5
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the loaded module match what this rule detects, in path, signature, and loading process?
  context: >-
    Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded), its code-signature status,
    and the process that loaded it against the rule's criteria. The rule fires on an EACore.dll load that is NOT the
    legitimate case of EACoreServer.exe running from C:\Program Files\Electronic Arts\EA Desktop\ loading the DLL from
    that same directory, so note whether the load path sits outside the vendor install directory or whether the loader
    is something other than the genuine EA Desktop service binary. Library events carry the module's hash and signing
    status directly on the load, so record them here.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
  answer_sources:
  - alert
  - image_load
- question: Is this user and host expected to have the EA Desktop application installed and running?
  context: >-
    A genuine EACore.dll load only occurs on hosts where the EA Desktop gaming client is installed. On a corporate
    server, an unattended host, or a workstation whose role has no plausible gaming-software footprint, a module by
    this name loading at all is more consistent with a sideloaded masquerade riding the vendor's file name than with
    routine application activity. Confirm whether the user role and host function are consistent with a legitimate EA
    Desktop install.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What other modules did the process that loaded EACore.dll pull in, and are any from user-writable or non-standard directories?
  context: >-
    The full set of modules a process loads exposes a sideloading operation the alerting event alone does not. Look for
    other DLLs loaded from user-writable locations such as ProgramData, AppData, Public, or a temp directory; unsigned
    modules sitting where signed ones are expected; and known library names loaded from paths outside their canonical
    directories. A cluster of non-canonical loads in the same process points to a staged side-load set rather than an
    isolated event. Directories considered valid for DLL loading (system paths, the application's own install
    directory) are the comparison baseline.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - image_load
  - manual_review
- question: For the loaded EACore.dll, what is its signing status, hash, and threat-intel reputation?
  context: >-
    Module reputation separates the vendor's genuine library from a sideloaded malicious one. The legitimate EA Desktop
    component is vendor-signed; an unsigned module, or one whose signature is expired, distrusted, or invalid, is
    masquerading on the file name alone. The hash on the load event supports a threat-intel lookup that can surface a
    known loader, and comparing it against the hash of the genuine EACore.dll from a clean EA Desktop install directly
    detects substitution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
  answer_sources:
  - image_load
  - external_threat_intel
  - manual_review
- question: Which process loaded EACore.dll, and does it run from the legitimate EA Desktop installation directory?
  context: >-
    Sideloading works by having a trusted, signed executable load the planted library, so the identity and location of
    the loading process are decisive. Determine whether the loader is the real EACoreServer.exe running from
    C:\Program Files\Electronic Arts\EA Desktop\, a copied EACoreServer.exe staged in a directory such as ProgramData
    or AppData, or an unrelated process entirely. A signed vendor binary relocated to a user-writable directory next
    to the DLL is the classic staging pattern this rule targets — the executable stays legitimately signed while the
    library beside it is swapped.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
      - ParentImage
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned the loader of EACore.dll, and is that parent chain expected?
  context: >-
    The parent of the loading process reveals how the side-load was launched. A genuine EA Desktop service launch
    typically traces to the EA Desktop client, an installer, or a service host; a loader started by a removable-media
    launcher, a script host, an archive utility, or an unfamiliar dropper points to attacker-driven execution. Walk the
    parent chain to see what initiated the run.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What process wrote EACore.dll or a staged EACoreServer.exe copy to disk, and when relative to the load?
  context: >-
    Sideloading requires the attacker-controlled library to be placed on disk before a trusted binary loads it, and
    observed EACore.dll side-loads stage the pair together: a copied EACoreServer.exe and a malicious EACore.dll
    written into the same non-vendor directory. A write by the EA installer or updater into the vendor's Program Files
    directory is expected; a write by an archive tool, script host, or launcher into ProgramData or another
    user-writable location, shortly before the load, is the plant step of the side-load. The gap between the write and
    the load frames the correlation window for the rest of the activity.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_dll:
        TargetFilename|endswith|expand: '%ImageLoaded%'
      selection_exe:
        TargetFilename|endswith: '\EACoreServer.exe'
      host_scope:
        host.name|expand: '%hostname%'
      condition: 1 of selection_* and host_scope
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
  answer_sources:
  - file_event
  - manual_review
- question: Is the EACore.dll module still on disk for analysis?
  context: >-
    If the sideloaded module is still present, it can be hashed, submitted to a sandbox, or reviewed statically.
    Checking for files written by the alerting process or its direct children confirms whether the artifact remains
    available or was already removed after execution, which itself is a cleanup signal.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Were persistence-related registry values modified on this host around the time of the load?
  context: >-
    Side-loading operations that stage this DLL pair commonly add Run-key persistence pointing at the staged
    executable so the side-load survives reboot. Registry changes to Run/RunOnce keys or DLL-load-influencing values
    (AppInit_DLLs, KnownDLLs) near the load event show whether the foothold was made durable, and the Details value
    reveals what the persistence launches.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\CurrentVersion\Run'
          - '\CurrentVersion\RunOnce'
          - 'AppInit_DLLs'
          - 'KnownDLLs'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - manual_review
- question: What child processes did the loading process spawn after the DLL load?
  context: >-
    Once a malicious library runs inside the trusted process, its next stage typically appears as child processes.
    Backdoors delivered by this side-load pattern have been observed executing operator commands by feeding cmd.exe
    through a named pipe from the trusted host process, and staging or decrypting additional payloads. Command shells,
    script hosts, or persistence tooling spawned by a gaming-client service binary are the follow-on execution this
    question is designed to surface.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Has EACore.dll been loaded on this host before, and under what processes?
  context: >-
    A first-time load of this module on the host is a stronger anomaly than a recurring one. If the same module has
    been loaded repeatedly by the genuine EA Desktop binary over the prior 90 days, this load is probably routine
    application use. If this is the first occurrence, or the module has historically loaded only under different
    processes, the current load is anomalous and consistent with a newly planted side-load.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
  answer_sources:
  - image_load
- question: Is EACore.dll being loaded on other hosts, especially under unexpected loading processes?
  context: >-
    Cross-host correlation surfaces how far the activity spread. This module loaded on a single host may be a localized
    event; the same module loaded across several hosts points to multi-host distribution, such as a removable-media or
    shared-installer vector. Watch the variety of loading processes and paths: loads by genuine EA Desktop installs are
    routine, while the same module loaded from non-vendor directories or by unrelated processes elsewhere suggests the
    side-load has propagated.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - image_load
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Sideloading is one stage in a chain, and the load event rarely stands alone. Examining process activity in a tight
    window around the load reveals what launched the loader, what the sideloaded module did next, and whether file
    writes, registry changes, and the load line up on the same short timeline. Look for dropper execution, payload
    staging, and persistence installation in the same interval.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host can reveal the stages that preceded the side-load. Execution from removable
    media, file drops into staging directories, or defense tampering ahead of this event helps reconstruct the timeline
    and shows whether the load is an entry point or a later stage of an ongoing intrusion.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Does the user or administrator recall installing or running the EA Desktop application on this host?
  context: >-
    Direct confirmation from the person behind the account is often the fastest path to legitimacy. If the user
    knowingly installed EA Desktop and the load traces to the genuine install path, the event may be routine. If no one
    recalls installing EA software, or gaming software is unexpected on this host, the module is more likely a
    sideloaded masquerade riding the vendor's file name.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: Does the timing of this activity align with normal work hours and expected use of this host?
  context: >-
    Legitimate application installs, updates, and use track a user's normal activity pattern. An EACore.dll load on a
    server, an unattended host, or at an hour when the user is not active is harder to explain as routine application
    use and more consistent with automated execution from a planted side-load.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - asset_inventory
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    A side-load that survives reboot is often paired with backup persistence. After establishing one foothold,
    operators commonly install additional mechanisms through scheduled tasks, services, registry Run keys, BITS jobs,
    or WMI subscriptions. Several persistence installations in the same timeframe indicate intentional stacking rather
    than an isolated administrative action, and the expected service and task baseline for this host is the comparison
    point.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Were files dropped to persistence locations such as the Startup folder or scheduled-task definition paths on this host?
  context: >-
    File-based persistence bypasses command-line detection entirely. Dropping an executable or script into a Startup
    folder or a path referenced by a registry Run key achieves persistence without running schtasks, sc, or reg. File
    monitoring captures these drops even when the operator avoids standard persistence tooling, which fits the
    stealth-oriented character of a side-load.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
