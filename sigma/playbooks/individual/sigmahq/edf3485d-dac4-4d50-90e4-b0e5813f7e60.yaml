name: Suspicious Network Connection to IP Lookup Service APIs
id: cbb67fa3-4742-46a8-a7a4-8f55b0bec203
description: |
  Detects outbound connections to public IP-echo services (api.ipify.org, icanhazip.com,
  ip-api.com, checkip.amazonaws.com, and similar) when the initiating image is not a known
  browser at its standard install path. Malware and post-exploitation tooling commonly query
  these services shortly after execution to learn the victim's public IP, confirm outbound
  internet reachability, and geolocate before contacting their real infrastructure, while
  legitimate causes include network troubleshooting and monitoring automation. The
  investigation should identify the initiating process and its parent, check for surrounding
  reconnaissance and follow-on egress, and use host and fleet history to separate established
  automation from first-time tooling.
type: detection
detection_id: edf3485d-dac4-4d50-90e4-b0e5813f7e60
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the destination match one of the IP-lookup services this rule covers, and which process initiated the connection?
  context: |
    The rule fires when the destination hostname matches one of roughly forty public IP-echo
    services and the initiating image is not a known browser at its standard install path —
    a browser binary running from a non-standard location still fires. Confirm the destination
    and port and identify the initiating process. If this event came from network-level
    telemetry rather than the endpoint agent, process fields may be absent; the DNS-lookup
    question attributes the check to a process in that case.
  range: +/-5m
  answer_sources:
  - alert
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
- question: Is this user or host expected to check its external IP address?
  context: |
    Network administrators, VPN health checks, and monitoring or dynamic-DNS automation
    legitimately query IP-echo services; the rule's false-positive note covers exactly this
    troubleshooting and monitoring use. A standard user workstation with no such role
    performing the check — especially under an unexpected or non-admin account — carries the
    post-compromise reading, so weigh the user's role and the host's function first.
  range: +/-30d
  answer_sources:
  - organizational_knowledge
  - asset_inventory
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: What command line drove the process that contacted the IP-lookup service?
  context: |
    The command line explains why the process reached an IP-echo endpoint. Look for scripted
    retrieval (curl or wget invocations, PowerShell web-request cmdlets, one-liners embedding
    the service URL) and for headless-browser invocations combining flags like --headless and
    --dump-dom with an IP-echo URL — a fingerprinting pattern used by credential stealers to
    harvest the victim's public IP and geolocation. If the alerting event carries no process
    fields, use the DNS-lookup question to attribute the check before decoding.
  range: +/-5m
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Which IP-lookup service was contacted, and does the destination IP actually belong to that service?
  context: |
    These destinations are legitimate public services, so endpoint reputation rarely decides
    the verdict on its own. What matters is confirming the resolved IP genuinely belongs to
    the named service — verify ownership manually via WHOIS and passive DNS, since tooling
    occasionally fronts its own infrastructure behind an IP-check-looking domain — and noting
    which service was used, because specific malware families favor specific services and the
    choice can guide the threat-intelligence lookup.
  range: +/-5m
  answer_sources:
  - external_threat_intel
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - DestinationPort
- question: Which IP-lookup service domains did this host resolve in the past day, and which processes issued the lookups?
  context: |
    The connection event frequently carries only the destination IP because hostname
    population on endpoint network telemetry is sparse; the preceding DNS lookup carries both
    the domain and the querying process. Resolutions of these service domains attribute the
    check to a process even when the alerting event has no process fields, and repeated
    lookups across the day suggest either scheduled monitoring automation or a beacon-cadence
    connectivity check.
  range: -24h
  answer_sources:
  - network_connection
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_dom_exact:
        QueryName:
          - www.ip.cn
          - l2.io
      selection_dom_sub:
        QueryName|contains:
          - api.2ip.ua
          - api.bigdatacloud.net
          - api.ipify.org
          - bot.whatismyipaddress.com
          - canireachthe.net
          - checkip.amazonaws.com
          - checkip.dyndns.org
          - curlmyip.com
          - db-ip.com
          - edns.ip-api.com
          - eth0.me
          - freegeoip.app
          - geoipy.com
          - getip.pro
          - icanhazip.com
          - ident.me
          - ifconfig.io
          - ifconfig.me
          - ip-api.com
          - ip.360.cn
          - ip.anysrc.net
          - ip.taobao.com
          - ip.tyk.nu
          - ipaddressworld.com
          - ipapi.co
          - ipconfig.io
          - ipecho.net
          - ipinfo.io
          - ipip.net
          - ipof.in
          - ipv4.icanhazip.com
          - ipv4bot.whatismyipaddress.com
          - ipv6-test.com
          - ipwho.is
          - jsonip.com
          - myexternalip.com
          - seeip.org
          - wgetip.com
          - whatismyip.akamai.com
          - whois.pconline.com.cn
          - wtfismyip.com
      condition: selection_host and 1 of selection_dom_*
    fields:
      - QueryName
      - Image
- question: What process spawned the one that performed the IP check, and is that parent chain expected?
  context: |
    Legitimate checks typically descend from an interactive chain (explorer.exe spawning
    cmd.exe or powershell.exe during troubleshooting) or from a service host running
    monitoring automation. Parents like Office applications, script interpreters (wscript.exe,
    cscript.exe, mshta.exe), wmiprvse.exe, or wsmprovhost.exe point to automated
    post-exploitation enumeration rather than a person at a keyboard; known-good interactive
    chains are the main tuning filter for this pattern.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Did other reconnaissance commands run on this host around the time of the external IP check?
  context: |
    A lone IP check may be troubleshooting, but an external IP lookup alongside local
    network-configuration enumeration — ipconfig, route, netsh, net, nltest, nslookup — within
    a few minutes matches the post-compromise pattern of an operator or implant mapping its
    environment before the next stage. Three or more distinct reconnaissance binaries inside
    the fifteen-minute window typically indicate automated enumeration.
  range: +/-15m
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\route.exe'
          - '\netsh.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: What other connections did this host make to this destination, and where else did the same process connect?
  context: |
    Loaders and implants commonly perform the IP check immediately before or after contacting
    their real infrastructure, so egress from the same process to other external destinations
    within the hour is often the higher-value finding. Connections back to the same
    destination on a regular cadence instead suggest a scheduled connectivity check —
    automation if long-established, beaconing if new.
  range: +/-1h
  answer_sources:
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection_dst:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      selection_proc:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: 1 of selection_*
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - Initiated
- question: What files did the process behind this connection write on this host in the past day?
  context: |
    A process that fingerprints its network environment is frequently a loader operating
    between stages. Its file writes reveal staged payloads, dropped configuration, or
    harvested data awaiting exfiltration; writes into user-writable staging paths like Temp
    or C:\Users\Public deserve individual review.
  range: -24h
  answer_sources:
  - file_event
  - network_connection
  query: |
    aggregation: true
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: What other activity occurred on this host around the time of the alert?
  context: |
    Aggregated parent-child process pairs around the alert reveal the surrounding sequence —
    the session that launched the checking process, enumeration commands beside it, or
    execution of a delivered payload afterward. Novel low-count pairs stand out against
    repetitive agent noise; look for an enumeration-then-egress progression rather than any
    single event.
  range: +/-15m
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Does this host normally run the process that made this connection?
  context: |
    A binary that has run regularly for months under the same accounts reads as installed
    software or automation; a first-ever execution that immediately performed an external IP
    check reads as newly delivered tooling. Zero or very low historical counts are the
    deviation worth pursuing.
  range: -90d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Does this host normally communicate with this IP-lookup service?
  context: |
    Recurring history to this destination from the same non-browser image fits the
    documented false positive — established troubleshooting or monitoring automation. A
    first-contact connection has no such cover and shifts weight to the process lineage and
    reconnaissance questions.
  range: -90d
  answer_sources:
  - network_connection
  - dns_query
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
- question: Do other hosts in the environment connect to this destination?
  context: |
    Fleet-wide connections from a common monitoring or inventory agent indicate sanctioned
    automation and make suppression tuning the likely outcome. A small set of hosts reaching
    the service for the first time from the same uncommon process suggests the same tooling
    landing on multiple machines, which changes the response from single-host triage to
    scoping.
  range: -7d
  answer_sources:
  - network_connection
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - host.name
      - DestinationPort
      - Image
- question: Which hosts across the environment resolved IP-lookup service domains in the past week?
  context: |
    A single-IP anchor under-counts services that sit behind content-delivery networks or
    rotate address records, so the domain-side fleet view is the robust scope check for a
    hostname-keyed detection. Compare the resolving hosts and querying processes against known
    monitoring deployments; hosts resolving these domains outside that population are
    candidates for the same triage as the alerting host.
  range: -7d
  answer_sources:
  - network_connection
  - asset_inventory
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection_dom_exact:
        QueryName:
          - www.ip.cn
          - l2.io
      selection_dom_sub:
        QueryName|contains:
          - api.2ip.ua
          - api.bigdatacloud.net
          - api.ipify.org
          - bot.whatismyipaddress.com
          - canireachthe.net
          - checkip.amazonaws.com
          - checkip.dyndns.org
          - curlmyip.com
          - db-ip.com
          - edns.ip-api.com
          - eth0.me
          - freegeoip.app
          - geoipy.com
          - getip.pro
          - icanhazip.com
          - ident.me
          - ifconfig.io
          - ifconfig.me
          - ip-api.com
          - ip.360.cn
          - ip.anysrc.net
          - ip.taobao.com
          - ip.tyk.nu
          - ipaddressworld.com
          - ipapi.co
          - ipconfig.io
          - ipecho.net
          - ipinfo.io
          - ipip.net
          - ipof.in
          - ipv4.icanhazip.com
          - ipv4bot.whatismyipaddress.com
          - ipv6-test.com
          - ipwho.is
          - jsonip.com
          - myexternalip.com
          - seeip.org
          - wgetip.com
          - whatismyip.akamai.com
          - whois.pconline.com.cn
          - wtfismyip.com
      condition: 1 of selection_dom_*
    fields:
      - host.name
      - QueryName
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: |
    An external IP check usually sits early in an intrusion but rarely opens it. Earlier
    detections on the same host — initial-access execution, script-host activity, defense
    tampering — reveal what delivered the checking process and help place the discovery step
    in the timeline.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
