name: Powershell Inline Execution From A File
id: 54cf5a9b-862c-4cfc-8792-c41a5d7feaaa
description: |
  Detects a command line that reads a file's contents and pipes or passes them into PowerShell's inline-execution
  cmdlets. The rule fires only when all three pieces appear together: an execution cmdlet (iex, Invoke-Expression,
  Invoke-Command, icm), a file-read verb (cat, get-content, type), and the -raw switch that returns the file as a
  single string. This pattern lets an operator run script content straight from a dropped file without invoking
  powershell.exe with a script path, sidestepping execution-policy and file-path logging; the same construct also
  appears in legitimate administrative one-liners, so the investigation centers on what file is read, what it contains,
  and whether the user, host, and parent process are consistent with sanctioned automation.
type: detection
detection_id: ee218c12-627a-4d27-9e30-d6fb2fe22ed2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line read a file and pass its contents to a PowerShell inline-execution cmdlet with the -raw switch?
  context: >-
    Confirm the alert is a true positive by reviewing the exact command line. The rule requires all three elements
    present together — an execution cmdlet (iex, Invoke-Expression, Invoke-Command, or icm), a file-read verb (cat,
    get-content, or type), and the -raw switch. Verify the actual command contains a member from each group rather
    than an incidental keyword overlap.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run script content read directly from a file through PowerShell?
  context: >-
    Legitimate administrative automation and build tooling sometimes load script content from a file and execute it
    inline. Knowing whether this user role and host function normally run that pattern is often the fastest way to
    separate sanctioned automation from operator activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What file does the command read, and what does that file contain when executed inline?
  context: >-
    The full command line names the file being read and the cmdlets used. Identify the file path passed to cat,
    get-content, or type, then inspect that file's contents — inline execution runs whatever the file holds, so the
    file body is the actual payload. Look for download cradles, reflective assembly loading, or encoded blocks inside it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is the inline-executed content or the read file encoded or obfuscated, and what does it decode to?
  context: >-
    Inline execution from a file is frequently paired with encoding or obfuscation so the file body or the surrounding
    command hides its intent. Look for base64 blocks, FromBase64String, character-array XOR sequences, backtick or
    format-string mangling, and download cradles (Net.WebClient, Invoke-WebRequest, Reflection.Assembly Load).
    Decoding reveals the actual payload the inline execution runs.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the deobfuscated content that actually executed?
  context: >-
    Event ID 4104 records the deobfuscated script content PowerShell executes, including the full body of a file
    loaded inline, even when the command line or the file itself is encoded. At warning level it auto-flags suspicious
    blocks. This is ground truth about what ran. If PowerShell operational logs are not ingested in this environment,
    treat zero results as a visibility gap rather than evidence nothing executed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell security controls bypassed or weakened on this host before this execution?
  context: >-
    Inline execution from a file often follows steps that weaken PowerShell defenses — AMSI patching, execution-policy
    bypass, constrained-language-mode escape, or a downgrade to PowerShell v2, which lacks modern logging. Finding
    these precursor actions on the host strengthens the case that the inline execution was operator-driven.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: What process spawned this command, and is that parent chain expected for inline script execution?
  context: >-
    The parent process reveals how the inline execution was launched. Predictable parents (explorer.exe for
    interactive use, a build agent, a scheduling service) point toward sanctioned activity, while parents such as
    mshta.exe, wscript.exe, rundll32.exe, or an Office application point toward macro or loader-driven execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host previously fired the inline-execution pattern, what parents and users drove it, and does the current alert fit that history?
  context: >-
    The query mirrors the rule's three-part selection scoped to this host, so the parent and user distribution
    reflects how this specific pattern — read a file and execute it inline — has historically run here, not generic
    PowerShell usage. A new parent process, an unexpected user account, or a first-time appearance of the pattern is
    the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_exec:
        CommandLine|contains:
        - 'iex '
        - 'Invoke-Expression '
        - 'Invoke-Command '
        - 'icm '
      selection_read:
        CommandLine|contains:
        - 'cat '
        - 'get-content '
        - 'type '
      selection_raw:
        CommandLine|contains: ' -raw'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this host run the read-file-and-execute-inline pattern before, or is this a first-time occurrence?
  context: >-
    A pattern never seen on a host is more notable than one that recurs. The query counts prior occurrences of the
    inline-execution selection on this host so a zero or very low count flags first-time or rare use; the result is
    scoped to the rule's command-line pattern rather than to any single binary, since the rule has no Image constraint.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_exec:
        CommandLine|contains:
        - 'iex '
        - 'Invoke-Expression '
        - 'Invoke-Command '
        - 'icm '
      selection_read:
        CommandLine|contains:
        - 'cat '
        - 'get-content '
        - 'type '
      selection_raw:
        CommandLine|contains: ' -raw'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
      - User
- question: What child processes were spawned on this host right after the inline execution?
  context: >-
    Processes launched by the inline execution reveal its actual effect. Inline-executed
    payloads commonly spawn cmd.exe, additional powershell.exe instances, certutil.exe, or
    network utilities for staging or post-exploitation. The query resolves children by the
    alerting process's identity, so it returns what the PowerShell instance itself started; if a
    child in turn spawned further tooling, pivot again on that child's identity to walk the
    chain down.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - ParentImage
      - CommandLine
- question: Did this execution occur inside a normal maintenance or working window for this host and user?
  context: >-
    Scripted administration and build automation tend to cluster in business hours or known maintenance windows.
    Inline execution from a file landing off-hours, on a weekend, or outside any sanctioned change window shifts the
    disposition toward operator activity. Compare the alert timestamp against the host's and user's typical active
    hours.
  range: +/-12h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_exec:
        CommandLine|contains:
        - 'iex '
        - 'Invoke-Expression '
        - 'Invoke-Command '
        - 'icm '
      selection_read:
        CommandLine|contains:
        - 'cat '
        - 'get-content '
        - 'type '
      selection_raw:
        CommandLine|contains: ' -raw'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
      - User
      - CommandLine
- question: Have other hosts fired this inline-execution pattern in the past week, and does the spread look like automation or one-off activity?
  context: >-
    The query mirrors the rule's three-part selection with no host scope, giving a fleet-wide count of this specific
    pattern rather than generic PowerShell usage. Many hosts firing the same pattern points to scripted deployment or
    vendor automation; one host or a small unrelated set points to manual operator activity. Use the host spread to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_exec:
        CommandLine|contains:
        - 'iex '
        - 'Invoke-Expression '
        - 'Invoke-Command '
        - 'icm '
      selection_read:
        CommandLine|contains:
        - 'cat '
        - 'get-content '
        - 'type '
      selection_raw:
        CommandLine|contains: ' -raw'
      condition: all of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_exec:
        CommandLine|contains:
        - 'iex '
        - 'Invoke-Expression '
        - 'Invoke-Command '
        - 'icm '
      selection_read:
        CommandLine|contains:
        - 'cat '
        - 'get-content '
        - 'type '
      selection_raw:
        CommandLine|contains: ' -raw'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_exec:
        CommandLine|contains:
        - 'iex '
        - 'Invoke-Expression '
        - 'Invoke-Command '
        - 'icm '
      selection_read:
        CommandLine|contains:
        - 'cat '
        - 'get-content '
        - 'type '
      selection_raw:
        CommandLine|contains: ' -raw'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around the time of this alert?
  context: >-
    Tracking the user's activity across all hosts in the surrounding window reveals lateral movement or coordinated
    actions across endpoints. If the same account drove similar activity on multiple hosts, the scope of the activity
    may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_exec:
        CommandLine|contains:
        - 'iex '
        - 'Invoke-Expression '
        - 'Invoke-Command '
        - 'icm '
      selection_read:
        CommandLine|contains:
        - 'cat '
        - 'get-content '
        - 'type '
      selection_raw:
        CommandLine|contains: ' -raw'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining the process activity surrounding the alert reveals what led to the
    inline execution and what followed it. Aggregating by Image and ParentImage collapses repetitive agent telemetry
    into high-count rows while novel parent-child pairs stand out at low counts — those are what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the stages
    that preceded the inline execution and help reconstruct the timeline. A run of related alerts before this one
    points to a multi-stage operation rather than an isolated event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
