name: DLL Sideloading Of ShellChromeAPI.DLL
id: 47894c81-0b13-42e2-a51c-4288e5b9cff7
description: |
  This rule fires when any process loads a DLL whose path ends in \ShellChromeAPI.dll. That
  DLL does not ship with Windows: the built-in DeviceEnroller.exe attempts to load it when
  launched with the /PhoneDeepLink parameter, so a DLL planted under that name executes inside
  a signed Microsoft binary (phantom DLL sideloading, T1574.001). Because no legitimate version
  of the DLL exists, the investigation should establish which directory the module loaded from,
  which process wrote it to disk and when, whether the loader's invocation matches the known
  /PhoneDeepLink trigger, and whether persistence was installed to re-trigger the load.
type: detection
detection_id: ee4c5d06-3abc-48cc-8885-77f1c20f4451
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the loaded module path end in \ShellChromeAPI.dll, and which process loaded it?
  context: Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded)
    and the loading process against the rule's detection criteria. ShellChromeAPI.dll does not
    exist in any Windows build, so any load of a file by this name means a DLL was planted;
    the load event also carries the module's hash and signing status for immediate review.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this host expected to perform mobile-device (MDM) enrollment operations?
  context: DeviceEnroller.exe is the built-in MDM enrollment binary and the known trigger for
    this phantom DLL load. Knowing whether this host participates in device enrollment or
    mobile-management workflows, and whether the acting account administers such enrollment,
    frames how plausible any innocent explanation is — though no legitimate workflow produces
    a DLL named ShellChromeAPI.dll.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is the ShellChromeAPI.dll file still on disk for analysis?
  context: If the planted DLL is still on disk it can be collected for content review or sandbox
    analysis; the load event already carries its hash, but the file itself reveals the payload's
    capability. Download-origin markers such as alternate-data-stream zone information are not
    collected as telemetry — inspecting the file's origin metadata on the endpoint is a manual
    or EDR-console step.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Does the user or administrator recall running device-enrollment tooling on this host?
  context: Direct confirmation from the human behind the account is often the fastest path to
    context. Even if an administrator recalls running DeviceEnroller.exe or MDM enrollment,
    that does not explain the presence of a DLL named ShellChromeAPI.dll — ask what they were
    trying to accomplish and whether they placed any files on the host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this DLL load align with normal work hours or a maintenance window?
  context: Device-enrollment and deployment activity typically occurs during business hours or
    scheduled maintenance. A phantom DLL load at an off-hours time, on a host with no enrollment
    activity planned, weighs toward deliberate staging rather than administrative work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which directory was ShellChromeAPI.dll loaded from, and what other modules did the same process load?
  context: 'The full ImageLoaded path shows where the attacker staged the DLL. Windows has no
    canonical location for this module — a copy in C:\Windows\System32 means the actor could
    write to a protected directory, while %TEMP%, AppData, ProgramData, or Public indicates
    user-writable staging. Review the process''s other module loads in the same window for
    additional non-canonical, unsigned, or user-writable-path DLLs that would indicate broader
    sideloading.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: What is the signing status, hash, and threat-intel reputation of the loaded ShellChromeAPI.dll?
  context: No legitimate version of ShellChromeAPI.dll exists, so there is no known-good hash
    baseline — any hash observed is attacker-supplied and worth a threat-intelligence lookup
    to identify a known loader or implant family. SignatureStatus values of Unsigned, Invalid,
    Expired, or Distrusted are expected for a planted DLL; a Valid signature identifies the
    signer to pivot on.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What was the full command line of the process that loaded ShellChromeAPI.dll?
  context: The known trigger is DeviceEnroller.exe launched with the /PhoneDeepLink parameter,
    which makes the binary attempt to load ShellChromeAPI.dll from the search path. Check the
    command line for that flag and its arguments; a different loading process entirely means
    the DLL name is being triggered through another search-order or phantom-load vector, which
    changes what the loader's own legitimacy tells you.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned the DLL-loading process, and is that parent chain expected?
  context: How the loader was invoked reveals intent. DeviceEnroller.exe launched by an
    interactive shell (cmd.exe, powershell.exe), a script host, or an unfamiliar binary points
    to deliberate invocation of the /PhoneDeepLink trigger; enrollment flows initiated through
    normal system UI have system-service or shell-infrastructure parents. This query returns
    the loader's own process-creation event with its parent details.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: When was ShellChromeAPI.dll written to disk on this host, and by which process?
  context: Correlating the file write with the module load reconstructs the staging step. A
    drop minutes before the load, by a browser, archiver, script host, or remote-transfer
    process, indicates deliberate placement followed by triggering; a write from days earlier
    suggests the host was staged in advance. The writing process's own lineage is the next
    pivot toward initial access.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: '\ShellChromeAPI.dll'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: Were DLL-resolution or execution-flow registry locations modified on this host around the alert?
  context: Execution-flow hijacking variants extend beyond the file drop — KnownDLLs exclusions,
    SafeDllSearchMode, Image File Execution Options, and App Paths entries all redirect how
    binaries resolve modules. Compare any hits against the expected keys for this host; changes
    to these locations in the same window as the phantom load indicate the actor is tampering
    with load-order behavior more broadly.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_hijack_keys:
        TargetObject|contains:
          - '\Control\Session Manager\KnownDLLs'
          - '\Control\Session Manager\SafeDllSearchMode'
          - '\CurrentVersion\Image File Execution Options\'
          - '\CurrentVersion\App Paths\'
      condition: selection and selection_hijack_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: What other activity occurred on this host around the time of the DLL load?
  context: 'A sideloaded DLL executes inside its host process, so surrounding process activity
    reveals what the payload did next: reconnaissance commands, outbound transfer tools, or
    persistence utilities appearing as novel parent-child pairs. The aggregation collapses
    repetitive agent noise into high-count rows so low-count novel pairs stand out.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — download cradles, defense tampering, archive
    extraction, or reconnaissance — may show how the DLL arrived and what preceded the load,
    helping reconstruct the timeline from delivery to execution.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Has ShellChromeAPI.dll ever been loaded on this host before, and by which processes?
  context: Because no legitimate module by this name exists, the expected 90-day history is
    zero. Any prior loads mean the host was compromised earlier than this alert or a recurring
    trigger (scheduled task, logon script) is re-executing the sideload — extend the timeline
    investigation to the first occurrence.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Does this host normally run the process that loaded the DLL?
  context: DeviceEnroller.exe executes during MDM enrollment scenarios and is rarely run
    repeatedly on a workstation. Zero or very low historical counts indicate the loader itself
    is a first-time or rare execution on this host, consistent with an actor invoking it purely
    as a sideload trigger.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Is ShellChromeAPI.dll being loaded on other hosts in the environment?
  context: Cross-host correlation surfaces deployment scope. A single-host load could be a
    localized incident; the same phantom DLL loading across multiple hosts indicates scripted
    distribution of the sideload package. Compare loading processes across hosts — identical
    loader/path combinations suggest the same staging playbook was applied to each.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Were process-based persistence mechanisms installed on this host around the DLL load?
  context: A sideload via DeviceEnroller.exe only runs when the trigger binary is invoked, so
    actors commonly pair the planted DLL with a scheduled task, service, or Run key that
    relaunches the trigger. Persistence tool executions in the surrounding window show whether
    the load was wired up to survive reboots.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations (Startup folders, scheduled-task definitions) on this host?
  context: File-based persistence bypasses command-line detection entirely — dropping an
    executable or shortcut into the Startup folder achieves relaunch without running schtasks,
    sc, or reg. A drop in these locations near the DLL placement indicates the actor installed
    a re-trigger for the sideload chain.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
