name: Conhost.exe CommandLine Path Traversal
id: 7c0e9d2a-5b41-4e8f-9a3c-1d6b2f8e4a07
description: |
  Detects a process whose parent command line references conhost and whose own command line contains a dot-dot path-traversal
  sequence (/../../). conhost.exe is the console host for cmd.exe, but it also accepts and proxies execution of an arbitrary
  binary supplied on its command line; embedding a traversal sequence redirects the resolved target to a signed binary so the
  recorded parent and the argument-based view of the launch no longer reflect what actually executed. The same /../ idiom is
  used to bypass parent-process and argument-based monitoring and to spawn payloads under a trusted console-host parent. Legitimate
  use of path traversal in a conhost command line is rare; the investigation should establish what binary actually ran, what
  parent really launched it, and whether the surrounding host activity looks like operator hands-on-keyboard or automation.
type: detection
detection_id: ee5e119b-1f75-4b34-add8-3be976961e39
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does this event match the rule — a parent command line referencing conhost and a child command line containing the /../../ traversal sequence?
  context: Confirm the alert is a true positive by reviewing the exact command line and parent command line against the detection criteria. The traversal sequence (/../../) inside a conhost-parented command line is the specific idiom this rule fires on; verify it is present and not a benign relative-path argument before investing further.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentCommandLine
      - CommandLine
- question: Is this user and host expected to launch executables through conhost with relative-path arguments?
  context: Legitimate administrative or developer activity can occasionally trigger this pattern. Knowing whether the user role and host function involve console-host driven execution or relative-path invocation helps separate routine operations from argument-confusion abuse.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is the conhost parent expected to launch this child, and what started the parent itself?
  context: The parent-child relationship is the core signal for this detection. The traversal idiom is specifically designed to make conhost appear as the parent of an arbitrary binary; tracing the parent's own origin (grandparent process) shows whether the chain came from an interactive session, a script interpreter, or an Office or browser process that has no reason to drive console-host execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did the same parent spawn around this time?
  context: If the parent that produced this traversal launch also spawned other processes, the full set of siblings reveals the scope of activity from that parent. Multiple children launched through the same console-host parent point to scripted orchestration rather than a single benign invocation.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What binary did the traversal sequence actually resolve to, and what did the full command line do?
  context: Decode the command line to determine which executable the /../../ sequence resolves to and what arguments were passed. The traversal redirects the apparent target away from what argument-based monitoring would record, so resolve the path manually — the real binary may be a signed system tool used as a proxy, or a dropped payload. Note any chained commands, URLs, or quoted PowerShell-style argument strings.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: '/../../'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - ParentCommandLine
- question: What is the conhost parent command line, and what invoked conhost in this way?
  context: The parent command line shows how conhost was driven and whether the invocation carries the binary-proxy form (conhost followed by a path or traversal argument) rather than the normal console-attach form. Reading the parent's own creation event shows what process launched conhost and with what arguments, which distinguishes a normal console attach from a deliberate proxy execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Does the command line carry chaining or secondary-execution operators alongside the traversal?
  context: Indirect-execution proxies are frequently chained with follow-on commands — operators such as &&, ^, or embedded interpreter invocations that launch a second stage. Surface conhost-parented command lines on this host that combine the traversal sequence with command chaining or interpreter launches to see whether the traversal was a one-shot proxy or the front of a longer chain.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentCommandLine|contains: 'conhost'
        CommandLine|contains:
          - '/../../'
      filter_chain:
        CommandLine|contains:
          - ' && '
          - ' ^ '
          - 'powershell'
          - 'cmd /c'
          - 'cmd.exe /c'
          - 'IEX'
          - 'Invoke-'
      condition: selection and filter_chain
    fields:
      - CommandLine
      - Image
- question: What child processes were spawned in the same window after this traversal launch?
  context: The processes spawned after the proxy execution reveal the actual impact. A signed-binary proxy that then spawns command interpreters, script hosts, or network utilities indicates post-exploitation activity beyond the initial argument confusion.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host has previously fired this conhost-traversal pattern, what parents and users drove it, and does the current alert fit?
  context: Even routine tooling can occasionally produce relative-path arguments. The query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern — not generic conhost usage — has run here before. A new parent process, an unexpected account, or a first-ever occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentCommandLine|contains: conhost
        CommandLine|contains: /../../
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentCommandLine|contains: conhost
        CommandLine|contains: /../../
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentCommandLine|contains: conhost
        CommandLine|contains: /../../
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around the time of the alert?
  context: Tracking the user's activity across all hosts reveals lateral movement or parallel activity on multiple endpoints. If the same user triggered related activity elsewhere in the same window, the scope of the operation may be larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentCommandLine|contains: conhost
        CommandLine|contains: /../../
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired this conhost-traversal pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this firing pattern rather than generic conhost usage. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentCommandLine|contains: conhost
        CommandLine|contains: /../../
      condition: selection
    fields:
    - host.name
- question: Was the executing account an administrator or a service principal, and is that level of privilege expected for this host's normal operation?
  context: Privilege level determines both impact and likely intent. An administrator or service account producing a binary-proxy launch can reach more of the system than a standard user; confirm whether the account that ran this is expected to perform console-host driven execution on this host. This question is answered from directory and asset records rather than process logs alone.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
      - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the stages that preceded this event. Indirect-execution proxies are often a delivery or evasion step within a longer sequence, so prior alerts help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
