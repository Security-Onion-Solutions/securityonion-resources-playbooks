name: New Custom Shim Database Created
id: 06f757cd-8136-49bc-b9a1-22aa474c7806
description: |
  Detects creation of files under C:\Windows\apppatch\Custom\ or C:\Windows\apppatch\CustomSDB\, the directories where Windows stores custom application-compatibility shim databases (.sdb). Legitimate compatibility fixes deployed through the Application Compatibility Toolkit land here via the sdbinst.exe installer, but shim databases are also an established persistence and privilege-escalation mechanism: shim types such as InjectDll and RedirectEXE make a target application load an attacker-supplied DLL or execute a different binary every time it starts. Investigation should identify the writing process and its launch chain, determine whether the database was installed through sdbinst.exe and registered under the AppCompatFlags registry keys, parse the database's shim definitions, and check whether the shim's payload has taken effect.
type: detection
detection_id: ee63c85c-6d51-4d12-ad09-04e25877a947
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the created file's path fall under one of the custom shim database directories this rule watches?
  context: Confirm the alert is a true positive before investing investigation time. The rule fires when a file path contains either :\Windows\apppatch\Custom\ or :\Windows\apppatch\CustomSDB\. Review the exact path, the operation performed (created/deleted/renamed), and the responsible process; note whether the filename is a GUID-style name (the installer's convention) or an arbitrary name, which points to a manual drop.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - file_event
- question: Is this user or process expected to install custom application-compatibility shims on this host?
  context: Installing a shim database requires administrator privileges, and legitimate custom shims are typically deployed by IT through Application Compatibility Toolkit rollouts, endpoint-management tooling, or vendor installers for legacy software. Check change records, deployment schedules, and whether the write falls inside a maintenance window; a shim write outside a documented compatibility-fix deployment deserves the rest of this investigation. When the user is a machine or service account, judge by the writing process and host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is the shim database file still on disk, or was it deleted or renamed after the alert?
  context: A database still on disk can be retrieved, hashed, and parsed to reveal exactly what the shim does; preserve it before remediation. A .sdb deleted shortly after creation suggests staging or cleanup, and shifts attention to whether registry registration or an installer execution happened in between — an installed shim keeps working from its registered copy even if the original drop location is cleaned.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What launched the process that wrote the shim database, and is that chain expected?
  context: The parent of the writing process reveals the delivery mechanism. An endpoint-management or software-deployment agent parent is consistent with an authorized compatibility-fix rollout; an interactive shell, script host, or Office-application parent points to hands-on or macro-driven installation. Trace the parent's own command line and origin to see whether the chain began from a legitimate deployment framework or from user-level activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because this event type does not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What is the full command line of the process that wrote the shim database file?
  context: File events do not carry the command line; this retrieves the writer's own process-creation record. A command of the form sdbinst.exe <path>.sdb (or sdbinst /q for silent install) indicates the installer flow, while copy or scripting commands writing straight into the apppatch directories match the documented direct-drop technique that skips the installer. The working directory and any source path in the command show where the database was staged from.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What shim definitions does the database file contain?
  context: The database's content determines the verdict. Retrieve the .sdb from the endpoint and parse it with an SDB parser (for example sdb_dump_shims.py from the python-sdb toolkit, which resolves each shim entry into a target executable and the fix applied). Shim types such as InjectDll, RedirectEXE, DisableNX, DisableSEH, or ForceAdminAccess mean code injection, execution redirection, or exploit-mitigation tampering; note any DLL path referenced by an InjectDll fix for follow-up. The file's origin marker (Zone.Identifier alternate data stream) is not collected in endpoint telemetry, so check it manually while you have the file — an Internet zone marker shows the database was downloaded rather than built locally.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
- question: Was the shim database installed through sdbinst.exe, or dropped into the shim directory directly?
  context: sdbinst.exe is the native, auto-elevated installer; a legitimate installation copies the database to a GUID-named file under the apppatch custom directory and registers it in the registry. A .sdb appearing with no sdbinst.exe execution on the host matches the documented direct-drop technique in which an administrator-level intruder writes the file and registry entries manually to avoid installer telemetry. Shim databases never run as processes, so no hash is recorded in telemetry — hash the on-disk file manually and check it against threat intelligence.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\sdbinst.exe'
      condition: selection
    fields:
      - CommandLine
      - ParentImage
      - User
  answer_sources:
  - process_creation
  - external_threat_intel
- question: Were AppCompatFlags registry entries written to register this shim database?
  context: An installed shim is registered under HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\InstalledSDB\<GUID> and \AppCompatFlags\Custom\<target executable>; the Custom entries name exactly which applications the shim hooks. Registration written by a process other than sdbinst.exe indicates manual registry writes bypassing the installer, while a database file with no registration at all may be staged for a later install. Correlate the timing of these writes with the file creation to reconstruct the install sequence.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\AppCompatFlags\Custom'
          - '\AppCompatFlags\InstalledSDB'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - registry_event
- question: Did any process load DLLs from the apppatch directories after the shim database appeared?
  context: An InjectDll shim causes its payload DLL to load into the target application the next time that application starts, so activation can lag the install by hours. Microsoft-signed compatibility layers (AcLayers.dll, AcGenral.dll, AcXtrnal.dll, AcSpecfc.dll) load from this directory routinely; the signal is an unsigned or unfamiliar DLL loading from apppatch, or any DLL matching a path named in the parsed shim definitions. Payload DLLs can also live outside apppatch — if the content analysis produced a DLL path, widen this check to that path.
  range: +24h
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|contains: '\Windows\apppatch\'
      condition: selection
    fields:
      - ImageLoaded
      - Image
      - Signed
      - Signature
  answer_sources:
  - file_event
  - process_creation
- question: What other files did the responsible process write or delete around the shim database drop?
  context: A process installing a malicious shim often writes companion artifacts in the same window — the payload DLL referenced by an InjectDll fix, a staging copy of the database, or scripts driving the install. The correlation covers the writer and its direct children; watch where the writes land, since a DLL dropped to a user-writable path alongside a shim database is the injection payload being staged.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: What else has been written to the custom shim directories in the past week, and by which processes?
  context: The apppatch custom directories have a very small set of legitimate writers — essentially sdbinst.exe and managed deployment tooling. Other recent arrivals reveal whether this is an isolated drop or a location under active use, and whether one unfamiliar process has been populating it; multiple databases written in the same period by the same non-installer process points to repeated shim installs worth enumerating.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - ':\Windows\apppatch\Custom\'
          - ':\Windows\apppatch\CustomSDB\'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- always_include: true
  question: Has this user previously written custom shim database files, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's 90-day history of writes into the custom shim directories (not generic file activity), aggregated by host. Prior history is expected only for staff who package or deploy application-compatibility fixes; a first-ever shim write from an account with no compatibility-engineering role is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|contains:
        - :\Windows\apppatch\Custom\
        - :\Windows\apppatch\CustomSDB\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
  - organizational_knowledge
- always_include: true
  question: Has this program historically driven shim-database writes on this host or across the environment, or is the program new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior. The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped to the alerting program, so the result is the 90-day history of this program driving shim-directory writes (not generic use of the binary). A deployment agent that has written shim databases across many hosts for months is managed tooling; a program appearing for the first time with this pattern is the deviation worth chasing.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|contains:
        - :\Windows\apppatch\Custom\
        - :\Windows\apppatch\CustomSDB\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the user's process activity across all hosts in the alert window reveals whether the account is being used for movement across multiple endpoints — remote-execution utilities, installer runs, or registry tooling appearing on other hosts under the same account widens the compromise scope. If the account is a service principal, this view fills with routine agent noise and the parent-driven variant of this question is the meaningful one.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same program-driven shim write occur on other hosts in the same window, or is the activity isolated to this host?
  context: 'Under a service principal, user-scoped clustering returns agent-telemetry noise. The meaningful question is whether the same launch mechanism wrote shim databases elsewhere: the query mirrors the rule''s selection scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts receiving shim databases in the same window points to a pushed deployment — verify it against change records — while a single host points to a host-local install.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|contains:
        - :\Windows\apppatch\Custom\
        - :\Windows\apppatch\CustomSDB\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: 'Earlier detections on the same host may reveal the stages that preceded the shim install and help reconstruct the timeline: initial-access alerts, privilege-escalation activity, or defense tampering commonly precede a persistence install. Review the sequence for a progression that ends at this persistence stage rather than treating the shim write in isolation.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Beyond the shim database, were other persistence mechanisms installed on this host?
  context: Attackers rarely rely on a single persistence mechanism. After planting one foothold they commonly add backups using different techniques — scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions. Multiple persistence installations in the same timeframe indicate deliberate stacking rather than an isolated administrative action, and each mechanism found extends the remediation list.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
