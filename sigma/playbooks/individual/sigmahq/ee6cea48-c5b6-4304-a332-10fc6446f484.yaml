name: Potential appverifUI.DLL Sideloading
id: 5de08199-288c-4967-b66b-eed71701dbc3
description: |
  Detects a module ending in appverifUI.dll being loaded outside its legitimate context. The rule
  fires when appverifUI.dll is loaded, AND the load is NOT appverif.exe running from System32 or
  SysWOW64 loading the DLL from System32, SysWOW64, or WinSxS. appverif.exe (Application Verifier)
  performs an unqualified load of appverifUI.dll from its own directory, so copying the
  Microsoft-signed binary alongside a malicious DLL that exports StartUI and DisplayMessageBoxW
  executes attacker shellcode inside a signed, commonly-allowlisted process; the pattern is used for
  application-allowlisting bypass and for lateral movement from an already-elevated context. The
  investigation should establish where the DLL was loaded from, which process wrote it there, and
  what execution or network activity followed the load.
type: detection
detection_id: ee6cea48-c5b6-4304-a332-10fc6446f484
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the loaded module match what this rule detects, an appverifUI.dll loaded outside the legitimate Application Verifier context?
  context: |
    Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded) and the
    process that loaded it against the rule's criteria. The rule excludes the only expected pattern:
    appverif.exe running from C:\Windows\System32 or SysWOW64 loading appverifUI.dll from System32,
    SysWOW64, or WinSxS — those directories are the allowed-path baseline for this DLL, so any hit
    means either the DLL or the loading binary sits outside them. DLL load events carry signing
    status and a hash directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this user and host expected to run Application Verifier or otherwise load appverifUI.dll?
  context: |
    Application Verifier is a developer and debugging tool that requires elevation, so legitimate use
    is largely confined to developers, QA staff, and support engineers on workstations or test
    systems. Maintain awareness of which hosts and roles are expected to run debugging tools from
    non-standard locations; a load on a server or a non-technical user's machine has no routine
    explanation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is the loaded appverifUI.dll still on disk for analysis?
  context: |
    If the DLL is still present, it can be hashed, submitted to a sandbox, or reviewed for the
    exported StartUI and DisplayMessageBoxW functions that a side-load payload must implement. This
    query correlates file writes to the alerting process and its direct children; the DLL is often
    staged earlier by a different process, which the file-write question on the DLL name covers
    separately.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Does the user or an administrator recall running Application Verifier on this host?
  context: |
    Because appverif.exe triggers a UAC prompt, someone with elevation had to run it deliberately.
    Direct confirmation from that person is often the fastest path to a verdict: if a developer
    recalls a debugging session, ask what they were verifying and from which directory they launched
    the tool; if nobody recalls it, treat the load as unauthorized code execution under an elevated
    account.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What modules did the loading process load, and did appverifUI.dll come from the application's own directory rather than a system path?
  context: |
    For a search-order hijack the decisive fact is the DLL's directory relative to the loading
    binary: appverif.exe resolves appverifUI.dll from its own directory, so a copy of the pair in
    Users\Public, Temp, or an administrative share loads the attacker's DLL instead of the system
    copy. Review every module the process loaded — an unsigned appverifUI.dll alongside otherwise
    signed system modules, or any other module from a user-writable path, completes the picture.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: What is the signing status, hash, and threat-intel reputation of the loaded appverifUI.dll?
  context: |
    The legitimate appverifUI.dll is Microsoft-signed and lives under System32 or SysWOW64; compare
    the loaded module's hash against the hash of the system copy to detect substitution. An unsigned
    module carrying this Microsoft filename, or one with an Invalid, Expired, or Distrusted
    signature status, points to a planted payload; run the hash against threat intelligence to
    surface known loaders.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What command line and working directory did the process that loaded appverifUI.dll run with?
  context: |
    The loader in this pattern is typically a relocated copy of appverif.exe, so its full path,
    command line, and working directory reveal the staging location — a user profile, Users\Public,
    or a mapped administrative share rather than C:\Windows\System32. Multiple invocations of the
    same binary on the host in the window may show the operator re-running the payload or iterating
    on it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned the binary that loaded appverifUI.dll, and is that parent chain expected?
  context: |
    The parent reveals the invocation route. explorer.exe indicates an interactive launch by
    whoever staged the files; WmiPrvSE.exe indicates remote process creation via WMI, the
    documented lateral-movement route for this technique where the signed binary and malicious DLL
    are copied to an admin share and executed from another host; services.exe or a script host
    points to automated re-execution. The -7d range is intentional, since long-running parents
    often start well before the alert.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What process wrote appverifUI.dll or a copy of appverif.exe to disk on this host, and when?
  context: |
    A side-load requires staging: the malicious DLL must be written next to a copied appverif.exe
    before the load. The writing process and account identify the delivery route — an interactive
    copy through explorer.exe, a remote write to an admin share arriving as SYSTEM, or a script
    dropping both files. Correlate the write timestamp with the load time: a short gap between file
    creation, any registry changes, and the module load indicates a scripted deployment rather than
    stray files.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith:
          - '\appverifUI.dll'
          - '\appverif.exe'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
      - ProcessGuid
- question: Were registry keys that influence DLL resolution or suppress crash dialogs modified on this host around the load?
  context: |
    Hijack-supporting registry changes alter how or whether the load is noticed: KnownDLLs and
    SafeDllSearchMode change DLL search behavior, Image File Execution Options redirects execution,
    and the Windows Error Reporting DontShowUI value suppresses the crash dialog that a side-loaded
    appverif.exe typically throws while the shellcode runs. Compare any hits against the expected
    key values for this host; these keys change rarely outside imaging and patching.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\Image File Execution Options\'
          - '\Control\Session Manager\KnownDLLs'
          - 'SafeDllSearchMode'
          - '\Windows Error Reporting\DontShowUI'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Did the process that loaded appverifUI.dll spawn any child processes?
  context: |
    The planted DLL runs shellcode inside the signed host process, and follow-on stages commonly
    spawn interpreters or LOLBins — cmd.exe, powershell.exe, wscript.exe, rundll32.exe, wmic.exe —
    from it. Application Verifier has no routine reason to spawn children beyond its own UI
    helpers, so any child here is the payload's next stage and inherits the elevated context the
    UAC prompt granted.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: Did the loading process initiate outbound network connections after the DLL load?
  context: |
    Shellcode frequently stages command-and-control directly inside the host process rather than
    spawning children, so the signed binary itself becomes the network client. Application Verifier
    is a local debugging tool with no network function; any outbound connection initiated by this
    process is payload traffic — note the destinations for scoping and blocking decisions.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
- question: Has appverifUI.dll been loaded on this host before, and by which processes?
  context: |
    Legitimate loads of this DLL come from appverif.exe in System32 or SysWOW64 with the DLL under a
    system path — the exact pattern the rule filters out. A first-ever load on this host, or a
    history where the DLL was only ever loaded by different binaries or from different paths,
    marks the current load as anomalous; a recurring identical load pattern suggests an ongoing
    developer workflow worth confirming instead.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Is appverifUI.dll being loaded on other hosts in the environment, and by which processes?
  context: |
    Cross-host correlation surfaces deployment scope. The documented lateral-movement route copies
    the signed binary and malicious DLL pair to administrative shares on additional systems and
    executes them remotely, so the same DLL appearing as a first-time load across several hosts in a
    short window indicates multi-host activity rather than a localized event. Compare the loading
    processes too: loads outside appverif.exe from system paths widen the concern to search-order
    hijacking of other applications.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Does this host normally run the binary that performed this DLL load?
  context: |
    Application Verifier is rarely executed outside development and support work, so zero or very
    low historical counts for the loading binary mean first-time or rare execution on this host.
    A recurring run history under the same user on a known developer workstation lowers suspicion;
    a first run under an unexpected account does not.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: What other activity occurred on this host around the time of the alert?
  context: |
    The minutes around the load carry the surrounding operation: staging copies before it,
    reconnaissance or persistence commands after it. The aggregation collapses repetitive agent
    noise into high-count rows so that novel parent-child pairs — a fresh interpreter under an
    unusual parent, a copy utility touching Users\Public — stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: |
    Side-loading is usually a mid-chain step: initial access, credential use, or defense tampering
    often precede it, and because this technique requires elevation, look particularly for earlier
    privilege-escalation or remote-execution detections. The alert timeline on the host helps
    reconstruct the stages that led to the DLL being staged and executed.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host around the DLL load?
  context: |
    The staged binary-plus-DLL pair only runs again if something re-executes it, so operators
    commonly pair a side-load with a scheduled task, service, Run key, or WMI subscription pointing
    at the relocated signed binary. Multiple persistence installations in the same timeframe
    indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
