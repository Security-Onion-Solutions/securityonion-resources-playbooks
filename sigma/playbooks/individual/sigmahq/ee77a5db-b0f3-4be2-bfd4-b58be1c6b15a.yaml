name: Potential Attachment Manager Settings Attachments Tamper
id: d16c0336-6d43-4987-8d9a-80966d0fc375
description: |
  Detects a write to a Windows Attachment Manager policy value under
  \SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Attachments\ where the value is either
  HideZoneInfoOnProperties set to DWORD 0x00000001 (hides zone information on the file Properties
  dialog), SaveZoneInformation set to DWORD 0x00000002 (stops the Zone.Identifier alternate data
  stream — Mark of the Web — from being written to saved files), or ScanWithAntiVirus set to
  DWORD 0x00000001 (turns off antivirus scanning of handled attachments). These values are normally
  managed through group policy and rarely change; batch-script tamper utilities set them alongside
  bulk security-service removal so attacker-delivered files open without warnings or scanning. The
  investigation should establish which value changed, what process wrote it, whether related
  file-type-risk or security-service tampering occurred in the same window, and whether the change
  is a managed rollout or isolated to this host.
type: detection
detection_id: ee77a5db-b0f3-4be2-bfd4-b58be1c6b15a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the registry write match one of the three Attachment Manager tamper values this rule detects?
  context: |
    The rule fires when the registry path (TargetObject) contains
    \SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Attachments\ AND the write is EITHER
    HideZoneInfoOnProperties with Details DWORD (0x00000001), OR SaveZoneInformation with Details
    DWORD (0x00000002), OR ScanWithAntiVirus with Details DWORD (0x00000001). Confirm the exact key
    path and value data against these criteria, and note which branch fired — each value suppresses
    a different download protection, which matters for the follow-on checks.
  range: +/-5m
  answer_sources:
  - alert
  - registry_event
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user or host expected to configure attachment-handling policy?
  context: |
    Attachment Manager policy values are normally set through group policy administration or
    endpoint-hardening tooling, so writes tied to policy processing or a known management agent are
    the common legitimate case — though the rule's stated false-positive rate is low. User
    attribution is present on most endpoint registry events; when User is SYSTEM or a machine
    account the write is service-driven and the writing process (Image) is the better attribution
    pivot.
  range: +/-5m
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which Attachment Manager value was written, and what protection does the new data disable?
  context: |
    Decode the value: HideZoneInfoOnProperties=1 removes the zone-information (unblock) section
    from the file Properties dialog so a file's download origin cannot be seen or cleared;
    SaveZoneInformation=2 stops Windows from writing the Zone.Identifier alternate data stream to
    saved files, so downloads never receive Mark of the Web and open without origin warnings,
    Protected View, or reputation checks; ScanWithAntiVirus=1 turns off antivirus scanning of
    handled attachments. The hive matters too — a write under HKCU affects one user's profile while
    HKLM applies machine-wide. Details data is occasionally absent on registry telemetry for binary
    or empty writes; these DWORD values normally carry it.
  range: +/-5m
  answer_sources:
  - registry_event
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What command line performed the attachment-policy write?
  context: |
    A reg.exe add invocation or a PowerShell Set-ItemProperty call names the value and data
    directly on the command line, while group policy processing writes through service host
    processes with no telltale command. Batch tamper utilities are commonly staged in a Temp
    directory and run via cmd.exe, so a script path in the command line points at dropped tooling
    worth recovering. This retrieves the writing process's creation event.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What spawned the process that wrote the value, and is that parent chain expected?
  context: |
    The parent chain reveals how the write was initiated: service-host ancestry fits policy and
    management machinery, an interactive cmd.exe or explorer.exe chain fits a hands-on session, and
    script hosts, Office applications, or unfamiliar binaries in the chain point to malicious
    automation or a dropper. The writing process may have started hours or days before the alert,
    so this looks up its creation event over a wide window.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What files did the writing process create or modify around the alert?
  context: |
    Attachment-policy tamper is typically one action inside a dropper or batch utility that also
    stages payloads and helper scripts, often in Temp or Public paths. The writer's file activity
    shows what else it put on disk. File-write events carry no hash — to assess a dropped
    executable, follow the path to its later execution event, which carries the process hash.
  range: +/-30m
  answer_sources:
  - file_event
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Were other registry modifications made on this host in the same session?
  context: |
    Tamper utilities that touch attachment handling usually change several locations in one pass —
    removing security-product autostart entries, editing service keys, and writing other Policies
    values. The triggering key will appear in these results; the signal is what ELSE changed and
    whether the same writing process touched multiple policy or persistence locations. If the host
    is registry-noisy, narrow to the alerting writer's executable name or to Run, Services,
    Policies, Winlogon, and IFEO paths.
  range: +/-30m
  answer_sources:
  - registry_event
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Were file-type risk values under the Associations policy key also modified on this host?
  context: |
    The Attachments values suppress zone handling; the sibling Associations policy values
    (DefaultFileTypeRisk and LowRiskFileTypes) reclassify dangerous extensions as low risk so they
    open without prompts. Documented tamper scripts set both key trees together — for example
    DefaultFileTypeRisk 0x6152 paired with a LowRiskFileTypes list covering .exe, .bat, .cmd, .msi,
    and archive formats. Both key trees modified in the same window completes the suppression of
    download warnings.
  range: +/-4h
  answer_sources:
  - registry_event
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_associations:
        TargetObject|contains: '\CurrentVersion\Policies\Associations\'
      condition: selection and selection_associations
    fields:
      - TargetObject
      - Details
      - Image
- question: Did processes on this host remove security-product services or open broad drive shares around the alert?
  context: |
    Attachment tamper appears in batch utilities whose main job is bulk removal of security
    products: repeated reg.exe delete commands against HKLM\SYSTEM\CurrentControlSet\services
    entries and CurrentVersion\Run values, sometimes alongside net share commands granting Everyone
    full access to fixed drives for staging and lateral movement. A cluster of these commands
    within seconds indicates a scripted tamper pass rather than administration.
  range: +/-1h
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      sel_service_delete:
        Image|endswith: '\reg.exe'
        CommandLine|contains|all:
          - 'delete'
          - '\services\'
      sel_run_delete:
        Image|endswith: '\reg.exe'
        CommandLine|contains|all:
          - 'delete'
          - '\CurrentVersion\Run'
      sel_share:
        CommandLine|contains|all:
          - ' share '
          - 'Everyone'
      condition: selection and 1 of sel_*
    fields:
      - Image
      - CommandLine
      - User
- question: Were programs executed from download or staging directories after the policy change?
  context: |
    With SaveZoneInformation set to 2, files saved after the change carry no Zone.Identifier stream
    and execute without origin warnings or reputation checks — the outcome the tamper enables.
    Executions from Downloads, Temp, or Public paths in the hours after the write are candidates
    for content delivered under the weakened policy; assess each binary's origin, signer, and
    command line.
  range: +4h
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      sel_staging_paths:
        Image|contains:
          - '\Downloads\'
          - '\AppData\Local\Temp\'
          - '\Windows\Temp\'
          - '\Users\Public\'
      condition: selection and sel_staging_paths
    fields:
      - Image
      - CommandLine
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: |
    Aggregated parent-child process pairs around the alert reveal the immediate context: management
    tooling and policy refresh cycles produce recognizable high-count pairs, while novel low-count
    pairs (script hosts, archive tools, unfamiliar binaries) stand out and may represent the
    operation this policy change belongs to.
  range: +/-15m
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Has this Attachment Manager value been modified on this host before?
  context: |
    Attachment-policy values rarely change outside policy rollouts, so a first-ever write deserves
    more scrutiny than one rewritten on every policy refresh with the same data — compare
    historical Details values and writing processes with the alerting event. Endpoint registry
    telemetry records value writes but not deletions, so also use this history to judge whether the
    setting was later re-asserted or reverted by another write; the value's current state needs
    direct host inspection.
  range: -90d
  answer_sources:
  - registry_event
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Does this host normally run the process that wrote the value?
  context: |
    A writing process that appears regularly on this host over the past 90 days (policy engine,
    management agent) supports the managed-configuration explanation. Zero or very low historical
    counts mean the writer itself is new to this host, which shifts the investigation toward how
    that binary arrived and what else it did.
  range: -90d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Was this attachment policy value modified on other hosts in the environment?
  context: |
    A group policy rollout writes the same value on many hosts in a short window, usually with
    identical Details data and the same writing process. A single host receiving the change from an
    interactive tool or script is the targeted case — consistent with the rule's assessment that
    legitimate occurrences are unlikely. Compare Details values and writers across hosts to
    separate a managed change from isolated manipulation.
  range: -24h
  answer_sources:
  - registry_event
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Did other detections fire on this host in the hours before this alert?
  context: |
    Defense weakening typically comes after access is already established, so earlier detections on
    the same host — initial-access activity, script execution, credential access, or other
    tampering — may reveal the attack stages that preceded this write and help reconstruct the
    timeline.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
