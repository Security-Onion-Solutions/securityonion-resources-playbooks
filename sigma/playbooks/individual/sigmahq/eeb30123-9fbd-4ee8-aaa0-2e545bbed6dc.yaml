name: Security Support Provider (SSP) Added to LSA Configuration
id: 7485d3c9-f76f-4157-8251-e5cb9da7662e
description: |
  Detects modifications to the LSA Security Packages registry values (SYSTEM\CurrentControlSet\Control\Lsa\Security Packages
  and the OSConfig sibling), which register Security Support Provider DLLs that lsass.exe loads at boot or on demand through
  the AddSecurityPackage API — code loaded this way gains access to the plaintext and encrypted credentials LSA handles.
  Writes by the Windows Installer are filtered out, so the alert covers other writers; legitimate causes include OS servicing
  and installation of authentication or security software, while public post-exploitation tooling automates the malicious
  flow by copying a DLL into System32, appending its base name to this value, and loading it into lsass without a reboot.
  Determine what process wrote the value, which package name was added, whether a matching DLL landed in System32 and loaded
  into lsass.exe, and whether the change ties to approved work.
type: detection
detection_id: eeb30123-9fbd-4ee8-aaa0-2e545bbed6dc
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the modified registry value match the LSA Security Packages locations this rule detects?
  context: Confirm the alert is a true positive before investing investigation time. The rule fires on modifications to
    values ending in \Control\Lsa\Security Packages or \Control\Lsa\OSConfig\Security Packages, AND only when the writing
    process is recorded and is not the Windows Installer (msiexec.exe). Review the exact key path, the value data, and the
    writing process against these criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - registry_event
- question: Is this user or host expected to change the LSA security package configuration?
  context: Security Packages changes are rare outside OS servicing and installs of authentication, single-sign-on, or
    security software. User attribution is present on most endpoint registry events, but service-driven writes often show
    SYSTEM or a machine account — when that happens, judge legitimacy by the writing process and the host's role instead
    of the account name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What launched the process that wrote the Security Packages value, and is that chain expected?
  context: Registry telemetry does not carry the writer's command line or parent; this retrieves the writer's own
    process-creation record and, when the parent identifier is available, the parent's record too. An installer or
    deployment-agent lineage fits legitimate software; an interactive shell, script host, or Office application in the
    chain points to hands-on or macro-driven modification. Public SSP-install tooling runs from PowerShell, so a
    powershell.exe writer deserves its full command line decoded.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_writer:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_parent:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Was there a change ticket or documented approval for modifying this host's authentication packages?
  context: Registering a security package is a system-level configuration change that most organizations perform only
    through documented software deployments — new authentication agents, smart-card or SSO components, or endpoint
    security suites. A matching deployment record or maintenance window quickly closes the alert as authorized; absence
    of one for a change this sensitive escalates it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: Does an administrator recall installing software that registers a security package on this host?
  context: SSP registration requires administrative rights, so someone with that access either performed the change or
    their credentials were used for it. If an administrator confirms an install, capture what product and why; if nobody
    recalls the action, treat the administrative account involved as potentially compromised and widen the review of its
    recent activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: Which LSA Security Packages location was written, and what process performed the write?
  context: Both \Control\Lsa\Security Packages and \Control\Lsa\OSConfig\Security Packages feed the list of package DLLs
    that lsass.exe loads, so a write to either has the same effect. The writing process is the key discriminator — the
    rule already excludes Windows Installer activity, and legitimate authentication software typically writes through a
    recognizable setup binary, while scripting hosts and command-line tools writing this value match the pattern of
    credential-theft tooling.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - registry_event
- question: Which package name was added to the Security Packages value, and is it a recognized entry?
  context: The value is a multi-string list of package names without the .dll extension; Windows defaults include
    kerberos, msv1_0, schannel, wdigest, tspkg, and pku2u. Compare the Details data against the prior value and any
    organization-approved package list — the appended name is the DLL that lsass.exe will load from System32. An
    unfamiliar name, a look-alike misspelling of a default, or a name matching a recently dropped DLL identifies the
    payload.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
  answer_sources:
  - registry_event
  - manual_review
- question: Were other registry modifications made on this host in the same session?
  context: Tooling that registers a security package often changes adjacent LSA settings in the same session — for
    example enabling plaintext credential caching through the wdigest UseLogonCredential value or adjusting LSA audit
    settings — or adds separate persistence under Run, Services, or Winlogon keys. The triggering key will appear in the
    grouped results; the signal is what else changed alongside it and whether one writing process drove the cluster.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
  answer_sources:
  - registry_event
- question: Did the registry-writing process or its children also write a DLL to disk?
  context: The technique requires the named package DLL to exist in the System32 directory, matching the OS architecture —
    the registry entry alone does nothing until lsass.exe can load that file. Watch for .dll writes landing in System32
    in the same session as the registry change. File-write events carry no hash; if the payload is present, hash it from
    a later image-load event or retrieve the file for a reputation check.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Has lsass.exe loaded a new or unsigned DLL since this registry change?
  context: A registered package takes effect when lsass.exe loads the DLL — at the next reboot, or immediately if the
    AddSecurityPackage API was called after the write. Review the DLLs loaded by lsass.exe for the package name from the
    value data and for unsigned or unusual-publisher entries; the window spans a full day because activation is often
    deferred to the next boot. DLL loads carry signature and hash data directly, so a suspect entry can be checked
    against reputation sources without retrieving the file.
  range: +24h
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\lsass.exe'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
  answer_sources:
  - external_threat_intel
  - manual_review
- question: Has the Security Packages value been modified on this host before?
  context: This value changes rarely — typically at OS servicing or when authentication or security software is installed
    or upgraded — so zero prior history makes a first-time write more notable, while prior modifications show which
    processes routinely touch it and what data they set. Endpoint telemetry records no registry deletions, so also use
    the re-modification history around the alert to judge whether the entry persisted or was rewritten afterward.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
  answer_sources:
  - registry_event
- question: Does this host normally run the process that wrote this value?
  context: A writer binary that has never executed on this host before points to newly introduced tooling; a routinely
    seen binary shifts the question to why it touched an LSA configuration value now. The aggregation by user also shows
    which accounts normally drive this binary and whether the alerting account fits that history.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: Was the Security Packages value modified on other hosts in the environment?
  context: The same write appearing across many hosts suggests a managed software rollout or policy push — compare the
    Details data and writing process per host to confirm they match a single deployment. A modification on only this
    host is more consistent with targeted activity, and differing value data across hosts means the changes are not one
    coordinated rollout.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
  answer_sources:
  - registry_event
- question: Were other persistence mechanisms installed on this host in the surrounding hours?
  context: An SSP registration is itself a persistence foothold, and operators commonly stack backup mechanisms using
    different techniques — scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions. Multiple
    persistence installations in the same timeframe indicate deliberate stacking rather than isolated administrative
    action, and each mechanism found extends the remediation list.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Were files dropped into Startup or scheduled-task persistence locations on this host?
  context: File drops into Startup folders achieve persistence without running schtasks, sc, or reg, so they bypass
    command-line-based checks entirely. Any executable or script landing in these locations in the window around the
    SSP registration is a parallel persistence mechanism and extends the remediation scope beyond the registry change.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: What other process activity occurred on this host around the time of the alert?
  context: Aggregating by image and parent collapses routine agent noise into high-count rows while novel parent-child
    pairs stand out at low counts. Look for credential-access tooling, reconnaissance, or payload staging bracketing the
    registry write; registry-side context for the same window is carried by the related-modifications question.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: SSP registration requires administrative rights, so earlier detections on the same host — privilege
    escalation, defense tampering, credential access — may reveal how that access was obtained and which stage of a
    longer sequence this event represents. Review the alert timeline for a progression that ends at this persistence
    step rather than treating the registry write in isolation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
