name: Arbitrary File Download Via GfxDownloadWrapper.EXE
id: 3212253c-91cd-4982-8ae7-554796c944d5
description: |
  Fires when GfxDownloadWrapper.exe executes with a command line containing an http or https URL, and that command
  line does not contain the vendor's known update endpoint. The binary is a signed graphics-driver helper whose normal job
  is fetching vendor content, so it carries a valid signature and an unremarkable process name while accepting an arbitrary
  URL and an arbitrary output path as arguments — the pattern that makes it usable as a file downloader for ingress tool
  transfer. The investigation should establish the full URL and destination path from the command line, whether the transfer
  actually completed, what landed on disk, whether the downloaded file was subsequently executed, and whether the parent
  process and user account are consistent with driver-update activity on this host.
type: detection
detection_id: eee00933-a761-4cd0-be70-c42fe91731e7
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the command line show GfxDownloadWrapper.exe invoked with an http or https URL that is not the vendor update
    endpoint?
  context: Confirm the alert before investing investigation time. The rule requires both conditions together — the image name
    ends in GfxDownloadWrapper.exe AND the command line carries an http or https URL — with invocations pointing at the vendor's
    own gameplayapi.intel.com update endpoint excluded. Read the full command line and note the URL and any output path
    argument.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to fetch files from the internet through a graphics-driver helper utility?
  context: The binary ships with vendor graphics software and is normally driven by the vendor's own update components on
    hosts that have that software installed, so a valid signature on the executable says nothing about whether this invocation
    is legitimate — the question is whether the URL and the launch context fit driver-update activity. A host with no vendor
    graphics stack, or a user account with no reason to trigger driver content fetches, moves this toward operator-driven use.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What exactly did this invocation fetch? Extract the full URL and the destination path from the arguments.
  context: The utility takes a URL and a local output path as arguments, so the command line names both the remote resource
    and the file that was written. Record the full URL including host, path, and any query string, and record the destination
    path — both drive the rest of the investigation. Note whether the destination sits in a user-writable staging directory
    rather than the vendor's own content location, and whether the URL host has any relationship to the installed graphics
    software.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What destination did this process actually connect to, and what do DNS, WHOIS, and threat intel show for it?
  context: The URL in the command line states intent; the egress events state what the process reached. Check registration
    age, passive DNS history, hosting, TLS certificate details, and reputation for the destination, and separate internal
    destinations from external ones — an internal address points at a staging or mirror host, while a recently registered
    or unrelated external host points at operator-supplied infrastructure. Destination domain is resolved by a separate lookup
    event and is often absent here, so anchor on the address and pivot through DNS when the name is needed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
  answer_sources:
  - network_connection
  - external_threat_intel
  - manual_review
- question: What process spawned this utility and is that parent chain expected?
  context: The parent reveals how the fetch was invoked. Vendor update services and the graphics control panel are the routine
    launchers on a host with that software installed; a shell, script host, Office application, or remote-administration agent
    as parent means something other than the driver stack drove the download. Known-good updater parents are the tuning axis
    here — record which parent is normal on this host before treating a new one as ordinary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Was the download successful? Check for file creation at the destination.
  context: A download command does not guarantee the file arrived — a blocked URL, a proxy denial, or a network error leaves
    the command line looking identical while nothing lands. Confirming a write at the output path named in the arguments establishes
    whether the transfer completed and gives the on-disk path for retrieval and manual hashing. This correlates writes by
    the alerting process and its direct children, so writes by an unrelated later process are not shown here.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: If the downloaded payload was executed, what is its hash — and is it known to threat intelligence?
  context: File writes carry no hash in this telemetry; the hash is recorded when the file runs. This returns processes spawned
    by the downloader and by the process that launched it — its children and siblings — with their executable hashes, which
    for a download-and-execute is the payload. If the file was run later by an unrelated process it will not appear here;
    retrieve it from the on-disk destination path and hash it manually instead.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      selection_siblings:
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: 1 of selection_*
    fields:
      - Image
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: Did any file land in a user-writable staging directory on this host around the alert?
  context: Ingress tool transfer usually terminates in a directory any account can write and execute from — C:\Users\Public\,
    %TEMP% (\AppData\Local\Temp\ and \Windows\Temp\), \ProgramData\, or a Downloads folder — rather than the vendor content
    location a driver helper would normally write to. This is scoped to those paths on the alerting host rather than to the
    downloader's own lineage, so it also catches files written by a grandchild or by a second stage the direct-lineage correlation
    misses. Match anything here against the destination path in the arguments.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - \Users\Public\
          - \AppData\Local\Temp\
          - \Windows\Temp\
          - \ProgramData\
          - \Downloads\
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
- question: Does this host normally run this utility at all?
  context: A host without the vendor graphics stack has no reason to execute this binary, and a host with it will show a steady
    history under the update accounts. Zero or very low counts over the period point to first-time or rare execution, which
    matters more than the signature on the file.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and
    does the current alert fit that pattern?
  context: The query mirrors the rule's selection structure scoped to this host, so the parent/user distribution reflects how
    this specific firing pattern — the utility fetching a non-vendor URL — has historically run here, not generic use of the
    binary. A new parent process, an unexpected account, or a first-ever occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \GfxDownloadWrapper.exe
        CommandLine|contains:
        - http://
        - https://
      filter_main_known_urls:
        CommandLine|contains: https://gameplayapi.intel.com/
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent
    automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, giving a fleet-wide count of this firing pattern
    rather than the binary's generic footprint. Many hosts fetching the same non-vendor URL points at a software distribution
    or a mirror configuration that should be confirmed and tuned; a single host or a small unrelated set points at operator
    activity. Use the host distribution and the consistency of parents and URLs to calibrate.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \GfxDownloadWrapper.exe
        CommandLine|contains:
        - http://
        - https://
      filter_main_known_urls:
        CommandLine|contains: https://gameplayapi.intel.com/
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user, giving their 90-day history of this specific
    firing pattern aggregated by host, not generic use of the binary. An account that has never driven this pattern is a stronger
    lead than one that produces it routinely; weigh the count against the account's role and whether it manages endpoint software.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \GfxDownloadWrapper.exe
        CommandLine|contains:
        - http://
        - https://
      filter_main_known_urls:
        CommandLine|contains: https://gameplayapi.intel.com/
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Has this parent process historically driven the rule's pattern on this host or across the environment, or is the
    parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute the behavior and the launch mechanism
    is the meaningful pivot: the query mirrors the rule''s selection structure scoped to the alerting parent, giving the 90-day
    history of that parent driving this pattern. A parent that already accounts for a large volume of prior events is vendor
    or OS automation; a new or rare parent for this pattern is the deviation worth chasing.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \GfxDownloadWrapper.exe
        CommandLine|contains:
        - http://
        - https://
      filter_main_known_urls:
        CommandLine|contains: https://gameplayapi.intel.com/
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
- question: What else did this user do across the network around this time?
  context: Tracking the account's activity across all hosts in the alert window shows whether the fetch is isolated or part
    of a sequence that spans endpoints. The same account driving similar activity on several hosts widens the scope. If the
    alert fired under a machine account or a built-in service principal, this returns routine agent telemetry and the parent-driven
    view is the meaningful one.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  always_include: true
  answer_sources:
  - process_creation
- question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this
    host?
  context: 'Under a service principal, asking what else the user did returns agent telemetry from every host. The meaningful
    question is whether the same launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped
    to the alerting parent, fleet-wide, in the alert window. Multiple hosts in the same window points at scheduled or pushed
    automation; a single host points at a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \GfxDownloadWrapper.exe
        CommandLine|contains:
        - http://
        - https://
      filter_main_known_urls:
        CommandLine|contains: https://gameplayapi.intel.com/
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Aggregating process activity around the alert collapses repetitive agent noise
    into high-count rows and leaves novel parent-child pairs standing out at low counts: that is what to scan for. Look for
    what preceded the fetch and what followed it — other download utilities, script hosts, archive tools, or persistence mechanisms.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or initial execution — may show the stages
    that preceded the transfer and help place it in a timeline. Ingress tool transfer typically follows an initial foothold
    rather than starting a sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
