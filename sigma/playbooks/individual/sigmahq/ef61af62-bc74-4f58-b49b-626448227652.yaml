name: Suspicious Active Directory Database Snapshot Via ADExplorer
id: 323a9215-a700-4390-9b27-fccdd9f1faf9
description: |
  Detects Sysinternals ADExplorer run with the -snapshot flag writing an offline copy of the Active Directory database to a user-writable directory (Downloads, Users\Public, AppData, or Windows\Temp). The rule fires when all three conditions hold together — the process resolves to ADExplorer by image name, OriginalFileName, Description, or Product; the command line contains snapshot; and the command line contains one of the suspicious output paths.
  An ADExplorer snapshot issues a single (objectGuid=*) LDAP query that pulls the entire readable directory tree into a proprietary .dat file, which can later be parsed offline for account, group, and trust enumeration. ADExplorer is a signed, legitimate Microsoft tool, so the distinguishing signals are the snapshot flag, the staging path, the user and parent that launched it, and the volume of directory data read from a domain controller.
  Investigation should confirm the snapshot operation, identify where the .dat file was staged, establish whether the user and host are expected to run AD tooling, and look for surrounding discovery activity that would mark this as post-compromise enumeration rather than a sanctioned audit.
type: detection
detection_id: ef61af62-bc74-4f58-b49b-626448227652
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the alerting process resolve to ADExplorer running with the snapshot flag and writing to a user-writable directory?
  context: Confirm the alert is a true positive by reviewing the triggering event. The rule fires only when the process resolves to ADExplorer (by Image name, OriginalFileName AdExp, Description Active Directory Editor, or Product Sysinternals ADExplorer) and the command line contains snapshot and one of the staging paths (\Downloads\, \Users\Public\, \AppData\, \Windows\Temp\). Verify all three are present and note the exact output path the snapshot was directed to.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
      - Description
      - Product
- question: Is the alerting binary genuinely Sysinternals ADExplorer, or a renamed or relocated executable matching its metadata?
  context: The rule matches on multiple identity fields, so a binary renamed to ADExplorer.exe or one carrying the AdExp OriginalFileName and Sysinternals Product metadata both trigger it. Compare the Image path, OriginalFileName, Description, Product, and the signing chain. A signed Sysinternals binary in a standard tools path is consistent with the legitimate utility; an unsigned binary, a mismatch between Image name and OriginalFileName, or execution from an unusual directory points to a masqueraded or repackaged tool.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Description
      - Product
      - Hashes
- question: What output path and snapshot options did the ADExplorer command specify?
  context: The full command line reveals where the snapshot .dat file was written and which target directory was connected to. Decode the staging path (the value following the suspicious-directory match), any explicit connection target or credentials switches, and the LDAP server string. The staging path tells you where the offline AD copy now sits, which is the artifact to locate, contain, and hash.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: snapshot
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: How much directory data was read from a domain controller around the time of the snapshot?
  context: An ADExplorer snapshot issues a single (objectGuid=*) LDAP query that returns the entire readable directory tree, producing anomalous read volume from one source against a domain controller. Directory Service Access events (4662) on domain controllers, correlated to this host and window, show object and property reads that map to the snapshot. A large burst of reads from this host attributable to the alerting user supports a full-tree enumeration rather than a targeted lookup. If directory access auditing is not enabled in this environment, treat the absence of these events as a visibility gap rather than evidence the read did not occur.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      service: security
      product: windows
    detection:
      selection:
        EventID: 4662
      condition: selection
    fields:
      - SubjectUserName
      - ObjectName
      - AccessMask
- question: Has ADExplorer run on this host before, or is this a first-time execution?
  context: A snapshot-capable AD viewer that has never run on a host is more notable than one that appears regularly as part of a sanctioned process. Zero or very low historical counts indicate first-time or rare execution and shift the disposition toward investigation; recurring counts suggest an established administrative or audit workflow on this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously matched the snapshot pattern, what parents and users drove it, and does the current alert fit?
  context: The query mirrors the rule's selection structure scoped to this host, so the parent and user distribution reflects how this specific snapshot pattern (not generic ADExplorer use) has historically run here. A new parent process, an unexpected user account, or an unusual command-line structure relative to that history is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \ADExp.exe
        - \ADExplorer.exe
        - \ADExplorer64.exe
        - \ADExplorer64a.exe
      - OriginalFileName: AdExp
      - Description: Active Directory Editor
      - Product: Sysinternals ADExplorer
      selection_flag:
        CommandLine|contains: snapshot
      selection_paths:
        CommandLine|contains:
        - \Downloads\
        - \Users\Public\
        - \AppData\
        - \Windows\Temp\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What process spawned ADExplorer, and is that parent expected for AD tooling on this host?
  context: Legitimate ADExplorer use is typically launched interactively from explorer.exe or a command prompt, or from a known administrative script host. A snapshot spawned by Office applications, script interpreters (wscript.exe, cscript.exe, mshta.exe), wmiprvse.exe, or wsmprovhost.exe indicates remote or automated invocation consistent with post-exploitation enumeration rather than an operator at the console.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Is this user expected to run Active Directory enumeration tooling?
  context: Directory administrators, identity teams, and authorized red-team operators legitimately snapshot AD for audits and offline analysis. Standard users and most service accounts have no routine need to pull the full directory tree. The user's role and typical toolset determine whether this snapshot is sanctioned work or anomalous access to directory data.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \ADExp.exe
        - \ADExplorer.exe
        - \ADExplorer64.exe
        - \ADExplorer64a.exe
      - OriginalFileName: AdExp
      - Description: Active Directory Editor
      - Product: Sysinternals ADExplorer
      selection_flag:
        CommandLine|contains: snapshot
      selection_paths:
        CommandLine|contains:
        - \Downloads\
        - \Users\Public\
        - \AppData\
        - \Windows\Temp\
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \ADExp.exe
        - \ADExplorer.exe
        - \ADExplorer64.exe
        - \ADExplorer64a.exe
      - OriginalFileName: AdExp
      - Description: Active Directory Editor
      - Product: Sysinternals ADExplorer
      selection_flag:
        CommandLine|contains: snapshot
      selection_paths:
        CommandLine|contains:
        - \Downloads\
        - \Users\Public\
        - \AppData\
        - \Windows\Temp\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around the time of the snapshot?
  context: Tracking the user's activity across all hosts reveals lateral movement or staged activity on multiple endpoints. If the same user triggered AD enumeration or other discovery on several hosts in a short window, the scope of the access is wider than a single snapshot.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \ADExp.exe
        - \ADExplorer.exe
        - \ADExplorer64.exe
        - \ADExplorer64a.exe
      - OriginalFileName: AdExp
      - Description: Active Directory Editor
      - Product: Sysinternals ADExplorer
      selection_flag:
        CommandLine|contains: snapshot
      selection_paths:
        CommandLine|contains:
        - \Downloads\
        - \Users\Public\
        - \AppData\
        - \Windows\Temp\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single AD snapshot may be a sanctioned audit, but enumeration tooling running alongside native discovery binaries — net, nltest, dsquery, adfind, csvde, ldifde — within a tight window is a signature of post-compromise reconnaissance. Surrounding discovery activity helps separate an isolated administrative action from a staged enumeration sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\quser.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to the snapshot, what happened after, and whether it is part of a larger sequence. Novel parent-child process pairs stand out at low counts against repetitive system telemetry.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, credential access, or other reconnaissance — may reveal the attack stages that preceded the snapshot and help reconstruct the timeline. Discovery activity late in an intrusion is often preceded by initial access and privilege escalation alerts.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts matched the snapshot pattern in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the snapshot pattern rather than generic ADExplorer use. Many hosts matching the same pattern points to scripted deployment or a vendor audit process; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate how this fits the environment.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \ADExp.exe
        - \ADExplorer.exe
        - \ADExplorer64.exe
        - \ADExplorer64a.exe
      - OriginalFileName: AdExp
      - Description: Active Directory Editor
      - Product: Sysinternals ADExplorer
      selection_flag:
        CommandLine|contains: snapshot
      selection_paths:
        CommandLine|contains:
        - \Downloads\
        - \Users\Public\
        - \AppData\
        - \Windows\Temp\
      condition: all of selection_*
    fields:
    - host.name
