name: Wusa.EXE Executed By Parent Process Located In Suspicious Location
id: 9ff2810e-8beb-4f7a-9f14-3c28c0795cd7
description: |
  Detects execution of wusa.exe (Windows Update Standalone Installer) where the parent process lives in a suspicious, user-writable location. The rule fires when wusa.exe is spawned AND the parent path matches EITHER a known-suspicious directory (Perflogs, Users\Public, Windows\Temp, AppData\Local\Temp, Temporary Internet) OR a user profile sub-path (Favorites, Favourites, Contacts, Pictures) — AND the command line does NOT contain ".msu". wusa.exe is a Microsoft-signed, auto-elevating utility; because it elevates without a prompt, its access token can be duplicated to launch other code with elevated privileges, a User Account Control bypass primitive. The investigation should determine what spawned wusa.exe, whether that parent and location are expected, and whether wusa was used to install a legitimate update or to relay elevation to another process.
type: detection
detection_id: ef64fc9c-a45e-43cc-8fd8-7d75d73b4c99
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Did wusa.exe run from a parent in a suspicious location, and which path branch matched?
  context: >-
    Confirm the alert by reviewing the triggering event. The rule requires wusa.exe as the child AND a parent whose path matches EITHER a known-suspicious directory (Perflogs, Users\Public, Windows\Temp, AppData\Local\Temp, Temporary Internet) OR a user-profile sub-path (Favorites, Favourites, Contacts, Pictures) — AND a command line that does NOT contain ".msu". Note which branch fired, because it determines the rest of the investigation. A parent in a system temp or public directory points to a dropped or staged loader; a parent in a user-profile sub-path such as Contacts or Pictures points to a binary placed where files are not normally executed. The missing ".msu" means wusa was not invoked to install an update package.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
- question: Is this user and host expected to run wusa.exe from an application or script in a user-writable directory?
  context: >-
    Legitimate wusa.exe runs are launched by Windows Update or an administrator installing an .msu package, with a parent under System32 or a trusted installer path. A parent located in a user-writable or profile directory is not a normal update workflow. Knowing whether this user role and host function involve such activity is often the fastest way to separate a true positive from an unusual but sanctioned deployment.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the parent that spawned wusa.exe, and what started that parent?
  context: >-
    The parent-child relationship is the core signal here. wusa.exe itself is a signed, benign utility; the suspicious element is a parent process running from a user-writable or profile directory. Tracing the parent's own origin (the grandparent) shows whether the chain is benign (a user double-clicked an installer) or staged (a macro or dropped batch file launched a loader that spawned wusa.exe to relay elevation).
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did the same parent spawn?
  context: >-
    If a loader in a user-writable location spawned wusa.exe, it likely spawned other processes too. A token-duplication UAC bypass launches a second process under the elevated token, so an elevated child such as cmd.exe, a batch script, or sc.exe appearing alongside wusa.exe from the same parent strongly suggests the elevation was relayed rather than used to install an update.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What did this wusa.exe invocation do? Decode its full command line and current directory.
  context: >-
    Read the full command line of the wusa.exe execution and identify what it was asked to do. A legitimate run names an .msu package; this rule already excludes that case, so the invocation either carries no package argument or an unusual one. wusa launched without a package is consistent with the binary being used only for its auto-elevation property, where another process duplicates its token to gain elevated privileges. The current directory and any arguments help establish whether an update was actually being installed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Does this parent process normally spawn wusa.exe on this host?
  context: >-
    Some parent-child relationships are routine, while a binary running from a user-writable or profile directory spawning the update installer is not. Historical frequency of this specific parent-to-wusa.exe pairing on this host distinguishes an established workflow from a novel spawning relationship. Zero or very low counts indicate the pairing is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: What other child processes did this parent spawn in the hours after the alert?
  context: >-
    A loader that spawns wusa.exe to relay elevation often spawns additional tools in sequence — reconnaissance, service creation, or persistence. Seeing the full set of children from the same parent binary reveals the scope of activity initiated through this execution chain after the elevation was obtained.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other activity is associated with this parent process around the same time?
  context: >-
    Beyond child processes, the parent may have generated other process activity in the same window. A loader staged in a user-writable directory frequently performs file staging or downloads adjacent to spawning wusa.exe, so the surrounding activity from this parent helps establish whether the execution is part of a multi-stage operation.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run wusa.exe at all?
  context: >-
    wusa.exe runs on a managed endpoint mainly during update installation, which is infrequent and tied to maintenance windows. A host that has rarely or never run wusa.exe makes this execution more notable. Zero or very low historical counts indicate first-time or rare use of the utility on this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \wusa.exe
      selection_paths_1:
        ParentImage|contains:
        - :\Perflogs\
        - :\Users\Public\
        - :\Windows\Temp\
        - \Appdata\Local\Temp\
        - \Temporary Internet
      selection_paths_2:
      - ParentImage|contains|all:
        - :\Users\
        - \Favorites\
      - ParentImage|contains|all:
        - :\Users\
        - \Favourites\
      - ParentImage|contains|all:
        - :\Users\
        - \Contacts\
      - ParentImage|contains|all:
        - :\Users\
        - \Pictures\
      filter_main_msu:
        CommandLine|contains: .msu
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_img and 1 of selection_paths_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \wusa.exe
      selection_paths_1:
        ParentImage|contains:
        - :\Perflogs\
        - :\Users\Public\
        - :\Windows\Temp\
        - \Appdata\Local\Temp\
        - \Temporary Internet
      selection_paths_2:
      - ParentImage|contains|all:
        - :\Users\
        - \Favorites\
      - ParentImage|contains|all:
        - :\Users\
        - \Favourites\
      - ParentImage|contains|all:
        - :\Users\
        - \Contacts\
      - ParentImage|contains|all:
        - :\Users\
        - \Pictures\
      filter_main_msu:
        CommandLine|contains: .msu
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_img and 1 of selection_paths_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether this is isolated or part of broader hands-on activity. If the same user triggered similar elevation or staging activity on multiple hosts, the scope is larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \wusa.exe
      selection_paths_1:
        ParentImage|contains:
        - :\Perflogs\
        - :\Users\Public\
        - :\Windows\Temp\
        - \Appdata\Local\Temp\
        - \Temporary Internet
      selection_paths_2:
      - ParentImage|contains|all:
        - :\Users\
        - \Favorites\
      - ParentImage|contains|all:
        - :\Users\
        - \Favourites\
      - ParentImage|contains|all:
        - :\Users\
        - \Contacts\
      - ParentImage|contains|all:
        - :\Users\
        - \Pictures\
      filter_main_msu:
        CommandLine|contains: .msu
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_img and 1 of selection_paths_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Is this parent-to-wusa.exe spawning pattern occurring on other hosts?
  context: >-
    The same parent-to-wusa.exe relationship appearing on multiple hosts may indicate a deployment wave or a multi-host operation; a single occurrence is more likely targeted or a one-off administrative action. Enterprise-wide comparison helps calibrate scope and identify other affected endpoints.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining activity around the event reveals what led to it, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, service creation, registry changes, or other privilege-escalation steps near the wusa.exe execution.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the attack stages that preceded this execution and help reconstruct the timeline. A UAC bypass is typically a mid-chain step, so prior alerts often show how the operator gained their initial foothold.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
