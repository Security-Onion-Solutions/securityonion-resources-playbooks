name: HackTool - NetExec File Indicators
id: 5345a0c6-8b84-4c98-9647-8fc295bc8755
description: |
  Detects on-disk indicators that NetExec (nxc.exe, formerly CrackMapExec) has executed on the host. NetExec is a
  PyInstaller-bundled binary that unpacks its embedded data files into a "_MEI<random>" directory under Temp on each
  run; files landing under the "\nxc\data\" sub-path of that extraction directory are unique to the tool, and the
  extraction-path binary name is equally distinctive. The rule fires when either the writing process image sits under
  a "\nxc-windows-latest\" build path or a written file path contains both "\Temp\_MEI" and "\nxc\data\". NetExec is a
  post-exploitation framework for Active Directory enumeration, credential harvesting, and SMB/WinRM/LDAP/MSSQL remote
  execution, so its presence outside a sanctioned engagement is a strong candidate for hands-on-keyboard lateral
  movement. Investigation should confirm the artifact is the genuine tool, establish who ran it and how it was
  launched, and determine what enumeration, authentication, and remote-execution activity followed.
type: detection
detection_id: efc21479-9e83-41da-8cf1-122e06ba8db3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Do the written file path and the responsible process match what this rule detects?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires on either of two branches — the writing
    process image lives under a "\nxc-windows-latest\" build path, OR the written file path contains both "\Temp\_MEI"
    and "\nxc\data\". Note which branch fired: the file-path branch means the tool's data files were unpacked here, and
    the image branch means the extraction-path binary itself did the writing. Both point to NetExec running locally.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this NetExec execution part of an authorized penetration test or red team engagement?
  context: >-
    NetExec is standard tradecraft in authorized security assessments. Before deeper analysis, check whether a pentest
    or red team exercise is currently active on this host or network segment. An authorized engagement whose scope and
    timing match this activity resolves the alert without further work; the absence of one makes the tool's presence a
    live incident.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user expected to run administrative discovery or lateral-movement tooling?
  context: >-
    Network administrators and IT staff legitimately run enumeration tools for troubleshooting; standard users almost
    never do, and NetExec specifically is rarely part of sanctioned day-to-day operations. The account's role and
    typical toolset determine whether this is routine or anomalous. When the account is a machine or service account,
    judge by the writing process and host role instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: Confirm this is the genuine NetExec tool — check its size, signing status, and strings. Is it the real tool or a renamed decoy?
  context: >-
    The filename pattern already names the tool, so the analytical task is verification, not content discovery. Retrieve
    the artifact from its on-disk path and confirm whether it is a genuine NetExec build (a large PyInstaller executable
    with the expected embedded Python runtime and module set) or a renamed unrelated binary riding the same path. Actual
    inspection requires manual retrieval from the endpoint or EDR.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Which NetExec capability was invoked — which protocol and which modules?
  context: >-
    NetExec is multi-purpose: it drives SMB, WinRM, LDAP, MSSQL, RDP, SSH and more, and its modules cover credential
    dumping (--sam, --lsa, --ntds), share enumeration, and remote command execution (-x, -X). The command line of the
    nxc process reveals which protocol and module ran, which determines the scope of potential compromise and the
    response actions required. If the command line is not captured, reconstruct the capability from the extracted data
    files and any follow-on authentication activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: If the NetExec binary executed, what is its hash — and does it have known AV or threat-intel detections?
  context: >-
    A file's hash is recorded when it runs, not when it is written, so the hash lives on the execution event rather than
    the file-write that triggered this alert. This query looks for the binary executing by its filename and reads the
    hash; submit that to threat-intel services to confirm whether it is a known NetExec build or something else. If the
    file is present but has not executed, retrieve it from its on-disk path and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: What process launched NetExec, and is that parent chain expected?
  context: >-
    The parent process reveals how the tool was invoked. Interactive launches from explorer.exe or a shell suggest a
    hands-on operator; launches from a remote-execution service (wmiprvse.exe, wsmprovhost.exe, PSEXESVC.exe), a script
    interpreter, or an unexpected automation parent suggest the host is itself a lateral-movement landing point. Walk up
    the tree from the parent to see what spawned it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    NetExec's PyInstaller bootstrap unpacks dozens of files into its "_MEI" extraction directory, and its modules stage
    output files (credential dumps, enumeration results) as they run. The breadth and paths of the process's other file
    activity separate the routine extraction footprint from operator output worth collecting, and enumerate what else on
    disk belongs to this execution.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What child processes did NetExec spawn afterward?
  context: >-
    The processes a tool spawns reveal its actual impact. NetExec remote-execution modules and local actions can spawn
    cmd.exe, powershell.exe, runonce.exe, or dumped-credential handling utilities. Post-execution children pointing at
    command interpreters or credential tooling mark the transition from enumeration to hands-on action.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did other reconnaissance commands run on this host around the same time?
  context: >-
    A single discovery command may be troubleshooting, but several in rapid succession — whoami, net, nltest, nslookup,
    setspn, adfind — is a signature of post-compromise enumeration, and NetExec is frequently paired with native recon.
    Three or more distinct recon binaries within a tight window typically indicates automated enumeration surrounding the
    tool run.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: What host initiated remote connections to this host, and is it an expected administrative source?
  context: >-
    Lateral movement requires a source and destination. If NetExec ran here as the landing point of a remote push, an
    inbound connection to an admin-service port (445/135 for SMB, 3389 for RDP, 5985/5986 for WinRM, 22 for SSH) around
    the alert reveals the pivot host. A source that is not a known admin jump box is the lead to chase.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 445
          - 135
          - 3389
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - SourceIp
      - DestinationPort
- question: Has this user account moved to other hosts using remote-execution tooling?
  context: >-
    NetExec's purpose is to reach many hosts, so scope rarely stops at one. If the same account
    is running lateral tools across multiple systems in a short window, the compromise is
    broader than this host. A single account touching many hosts is active lateral movement in
    progress. If this alert fired under SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a machine
    account (name ending in $), this query intentionally returns nothing — a user pivot on a
    service principal matches every host's background automation, not an actor; assess movement
    through the host- and program-scoped questions instead.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_lateral:
        Image|endswith:
        - \psexec.exe
        - \psexec64.exe
        - \mstsc.exe
        - \ssh.exe
        - \plink.exe
        - \wmic.exe
      filter_svcprin_builtin:
        User:
        - SYSTEM
        - LOCAL SERVICE
        - NETWORK SERVICE
      filter_svcprin_machine:
        User|endswith: $
      condition: (selection and selection_lateral) and not 1 of filter_svcprin_*
    fields:
    - host.name
    - Image
- question: Where has this user authenticated recently?
  context: >-
    NetExec's SMB and WinRM modules authenticate outbound to the hosts they enumerate or execute
    on, leaving logon events on those targets. A user authenticating to many systems in a short
    period — especially network (type 3) and RDP (type 10) logons following the tool run — maps
    the reach of the activity and distinguishes broad enumeration from a targeted push. If
    Security logon events are not collected in this environment, treat zero results as a
    visibility gap rather than evidence no authentication occurred. If the alert fired under
    SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a machine account (name ending in $), this query
    intentionally returns nothing — service-principal logons are background noise, not an actor
    trail. For a human account, zero results can also mean the Security channel is not ingested
    for the relevant hosts; confirm 4624 visibility before reading zero as "no authentications".
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
        - 4624
        - 4625
        TargetUserName|expand: '%User%'
      filter_svcprin_builtin:
        TargetUserName:
        - SYSTEM
        - LOCAL SERVICE
        - NETWORK SERVICE
      filter_svcprin_machine:
        TargetUserName|endswith: $
      condition: (selection) and not 1 of filter_svcprin_*
    fields:
    - host.name
    - IpAddress
    - EventID
    - LogonType
- question: When this host has previously produced the rule's pattern, what programs and users normally drove it, and does this alert fit?
  context: >-
    The query mirrors the rule's own selection scoped to this host, so the program/user
    distribution reflects how the NetExec extraction pattern (not generic binary usage) has
    historically run here. A new acting program process or an unexpected account driving the
    pattern is the anomaly worth chasing; a host that has produced it before under a known admin
    account may be a sanctioned tester.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
      - Image|contains: \nxc-windows-latest\
      - TargetFilename|contains|all:
        - \Temp\_MEI
        - \nxc\data\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- always_include: true
  question: Has this user previously produced the rule's NetExec pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, giving the account's 90-day history of the specific
    NetExec extraction pattern (not generic tool usage), aggregated by host. A user who has never produced it is more
    suspicious than one who does so regularly; weigh the count against the account's role and sanctioned toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
      - Image|contains: \nxc-windows-latest\
      - TargetFilename|contains|all:
        - \Temp\_MEI
        - \nxc\data\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven the NetExec pattern, or is the program new for this activity?
  context: >-
    When the alert fires under a service or machine account, user identity does not attribute the behavior; the launch
    mechanism does. The query mirrors the rule's selection scoped to the alerting program, giving the 90-day
    history of that program driving this specific pattern. A new or rare program is the deviation worth chasing; a program
    already responsible for many prior events is automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
      - Image|contains: \nxc-windows-latest\
      - TargetFilename|contains|all:
        - \Temp\_MEI
        - \nxc\data\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the account's activity across all hosts reveals whether the NetExec run is isolated or part of movement
    across multiple endpoints. If the same user triggered similar activity elsewhere, the scope of compromise is larger.
    When the alert fires under SYSTEM or a machine account this returns broad agent-telemetry noise — the parent-scoped
    companion question is the meaningful read in that case.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window — a coordinated rollout, or isolated to this host?
  context: >-
    Under a service principal, asking what the user did network-wide returns agent noise. The meaningful question is
    whether the same launch mechanism fired elsewhere: the query mirrors the rule's selection scoped to the alerting
    program, fleet-wide, in the alert window. Multiple hosts in the same window point to scheduled or pushed
    automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
      - Image|contains: \nxc-windows-latest\
      - TargetFilename|contains|all:
        - \Temp\_MEI
        - \nxc\data\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
