name: Suspicious Program Names
id: 8d57f2bd-903f-45bc-bf06-000bf052405e
description: |
  Detects process activity where either the executable image name matches patterns common to proof-of-concept,
  exploit, or hacktool binaries (CVE-prefixed names, poc.exe, artifact*.exe, obfuscated.exe, meterpreter) OR the
  command line references script names associated with offensive tooling (inject.ps1, beacon.ps1, mimikatz.ps1,
  PowerView.ps1, powercat.ps1, and similar). The rule fires when at least one of these two selections matches, so
  a hit can come from the binary name alone or from the command line alone. These names appear in malicious samples
  and red-team tooling but can also surface from legitimate security testing, penetration-test engagements, or files
  that coincidentally match the searched substrings. Determine which selection fired, whether the user and host are
  expected to run offensive or testing tooling, and what the surrounding execution context reveals.
type: detection
detection_id: efdd8dd5-cee8-4e59-9390-7d4d5e4dd6f6
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- question: Does this event match the rule on a suspicious image name, a suspicious command-line script name, or both?
  context: >-
    Before investing investigation time, confirm the alert against the rule's criteria. The rule fires when EITHER
    the executable image name matches a hacktool/PoC pattern (CVE-prefixed, poc.exe, artifact*.exe, obfuscated.exe,
    meterpreter) OR the command line references an offensive script name (inject.ps1, beacon.ps1, mimikatz.ps1,
    PowerView.ps1, powercat.ps1, and similar). Note which branch fired: an image-name match makes the binary itself
    the focus, while a command-line match makes the script and its launching interpreter the focus, and that choice
    drives which downstream questions carry the most weight.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to run offensive, exploit, or security-testing tooling?
  context: >-
    Legitimate penetration testing, red-team engagements, and security research routinely produce binaries and
    scripts with these names. Knowing whether the user role and host function include security testing is often the
    fastest path to separating sanctioned activity from an intrusion. A general-purpose endpoint or a non-security
    user running these names is harder to explain than a dedicated testing host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this command or binary do? Decode the full command line and arguments.
  context: >-
    The full command line reveals the specific action taken. Decode any flags, parameters, encoded content, file
    paths, or URLs. If the command-line branch fired, the referenced script name (inject.ps1, beacon.ps1,
    mimikatz.ps1, PowerView.ps1, powercat.ps1, and similar) indicates the intended capability — injection, beaconing,
    credential dumping, AD reconnaissance, or reverse-shell tunneling — and the surrounding arguments show how it was
    invoked. This query scopes to executions of this binary on this host within a short window so multi-stage
    invocations that form one logical operation are visible together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this one and is that parent chain expected?
  context: >-
    The parent process reveals how the binary or script was invoked. Legitimate usage often has predictable parent
    chains (explorer.exe for user actions, a known testing harness for sanctioned tooling). Unusual parents such as
    mshta.exe, wscript.exe, or an Office application point to exploitation or a malicious document. Walk up the tree
    to see what spawned the parent and what else it spawned.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did this one spawn afterward?
  context: >-
    The processes spawned afterward reveal the actual impact. Offensive scripts and PoC binaries frequently spawn
    cmd.exe, powershell.exe, or certutil.exe for follow-on staging, download, or post-exploitation. A benign
    coincidental name match typically shows no such follow-on activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run this binary?
  context: >-
    A binary that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low
    historical counts indicate first-time or rare execution, which weighs against a routine testing explanation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit?
  context: >-
    Even sanctioned testing tooling produces a stable pattern over time. The query mirrors the rule's selection
    structure scoped to this host, so the resulting parent/user distribution reflects how this specific firing
    pattern has historically run here. A new parent process, an unexpected user account, or an unusual command-line
    pattern is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_image:
      - Image|contains:
        - \CVE-202
        - \CVE202
      - Image|endswith:
        - \poc.exe
        - \artifact.exe
        - \artifact64.exe
        - \artifact_protected.exe
        - \artifact32.exe
        - \artifact32big.exe
        - obfuscated.exe
        - obfusc.exe
        - \meterpreter
      selection_commandline:
        CommandLine|contains:
        - inject.ps1
        - Invoke-CVE
        - pupy.ps1
        - payload.ps1
        - beacon.ps1
        - PowerView.ps1
        - bypass.ps1
        - obfuscated.ps1
        - obfusc.ps1
        - obfus.ps1
        - obfs.ps1
        - evil.ps1
        - MiniDogz.ps1
        - _enc.ps1
        - \shell.ps1
        - \rshell.ps1
        - revshell.ps1
        - \av.ps1
        - \av_test.ps1
        - adrecon.ps1
        - mimikatz.ps1
        - \PowerUp_
        - powerup.ps1
        - \Temp\a.ps1
        - \Temp\p.ps1
        - \Temp\1.ps1
        - Hound.ps1
        - encode.ps1
        - powercat.ps1
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
