- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context — what led to
    this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege
    escalation, persistence installation, or data staging. The parent/child pairs that stand out at low counts are
    what the analyst is scanning for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance,
    credential access — may reveal the attack stages that preceded this event and help reconstruct the timeline.
    The sequence of alerts on a host tells the broader story.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this
    firing pattern rather than generic usage of any single binary. Many hosts firing the same pattern points to
    scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity.
    Use the host distribution and parent/binary consistency to calibrate severity.
