name: Set Suspicious Files as System Files Using Attrib.EXE
id: a224a4b4-3587-4804-ab52-d320ea0bf6d9
description: |
  Detects attrib.exe (or a binary with OriginalFileName ATTRIB.EXE) invoked with the +s switch to mark a script
  or executable as a system file when the target path sits in a user-writable or staging location such as Users\Public,
  AppData\Local, ProgramData, Downloads, or Windows\Temp. Setting the system attribute hides the file from default
  Explorer views and makes it harder for unprivileged users to delete, which malware uses to conceal a dropped payload.
  The rule fires only when the binary, the +s flag, a suspicious path token, and a script/executable extension all
  appear together, and it suppresses the common installer case where the command targets a .exe under Windows\TEMP.
  Investigation should confirm the exact command and target file, then determine whether the file and the process that
  dropped it are legitimate or part of a staging-and-concealment sequence.
type: detection
detection_id: efec536f-72e8-4656-8960-5e85d091345b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line show attrib setting the system attribute on a script or executable in a suspicious location?
  context: Confirm the alert is a true positive by reviewing the exact command and target. The rule requires attrib.exe (or
    a binary whose OriginalFileName is ATTRIB.EXE) run with the +s switch where the command line names a script or executable
    extension (.bat, .dll, .exe, .hta, .ps1, .vbe, .vbs) under a user-writable or staging path such as Users\Public, AppData\Local,
    ProgramData, Downloads, a Windows\Temp location, or an environment-variable-expanded path. The installer case of a .exe
    under Windows\TEMP is suppressed, so any fire on that path involves a non-installer target.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to set the system attribute on files in these locations?
  context: Legitimate administrative or packaging activity occasionally applies file attributes, but setting +s on a script
    or executable in a user profile, ProgramData, Downloads, or a temp directory is rarely part of routine work for an end-user
    workstation. Knowing whether the user role and host function involve installer authoring or file-attribute management
    helps separate a true positive from sanctioned work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the full attrib command line, and exactly which file path and attributes were set?
  context: The full command reveals which file was concealed and whether other attributes were applied alongside +s (for example
    +h to also hide the file). Identify the absolute target path, the file extension, and any quoting or environment-variable
    expansion so the dropped artifact can be located on disk. attrib runs once and exits, so reading the alert command directly
    is sufficient.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Was the target file recently written to disk, and by which process?
  context: Setting the system attribute is a concealment step that follows a drop. Locating the create or write event for the
    same path shows when the file landed and which process produced it, distinguishing a payload staged by a download or script
    cradle from a file that has existed legitimately for some time. If file write events are not collected in this environment,
    treat zero results as a visibility gap rather than evidence the file is benign, and corroborate from the artifact on disk.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - User
      - EventType
- question: Has the system attribute been set on other script or executable files on this host in the past week?
  context: The rule constrains the extension list to script and executable types (.bat, .dll, .exe, .hta, .ps1, .vbe, .vbs)
    because those are the file types worth concealing for later execution. Repeating the same +s concealment against additional
    files of those types on the same host points to multiple staged payloads rather than a single isolated action. Alternate
    data stream usage on the same paths is a related concealment angle worth checking on disk where stream enumeration is available.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_attrib:
      - Image|endswith: \attrib.exe
      - OriginalFileName: ATTRIB.EXE
      selection_sys:
        CommandLine|contains: ' +s'
      selection_ext:
        CommandLine|contains:
        - .bat
        - .dll
        - .exe
        - .hta
        - .ps1
        - .vbe
        - .vbs
      condition: selection_host and selection_attrib and selection_sys and selection_ext
    fields:
      - CommandLine
      - User
- question: What process spawned attrib, and is that parent chain expected for this kind of activity?
  context: The parent process reveals how attrib was invoked. A file dropped and then concealed is often launched from a script
    interpreter or downloader chain, so parents such as cmd.exe, powershell.exe, wscript.exe, cscript.exe, mshta.exe, or an
    Office application are more concerning than explorer.exe or an installer service. The immediate parent appears in the alert
    event; walking up to what spawned the parent helps reconstruct the staging sequence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What did the parent process launch after attrib ran?
  context: attrib only changes file attributes, so the impact comes from what runs next. Concealment is frequently followed
    by execution of the staged file or by persistence setup. Processes the same parent spawned after the alert reveal whether
    the hidden file was then run or registered for later launch.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run attrib at all?
  context: attrib is a built-in utility that some packaging and deployment workflows use, but many endpoints never invoke it
    interactively. A zero or very low historical count makes the current execution a first-time or rare event and raises the
    weight of the concealment behavior.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this attrib concealment pattern, what parents and users drove it, and does the
    current alert fit?
  context: Even a built-in tool can be abused. This query mirrors the rule's full selection structure scoped to this host, so
    the resulting parent and user distribution reflects how this specific concealment pattern has run here before rather than
    generic attrib usage. A new parent process, an unexpected user, or an unfamiliar command structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \attrib.exe
      - OriginalFileName: ATTRIB.EXE
      selection_cli:
        CommandLine|contains: ' +s'
      selection_paths:
        CommandLine|contains:
        - ' %'
        - \Users\Public\
        - \AppData\Local\
        - \ProgramData\
        - \Downloads\
        - \Windows\Temp\
      selection_ext:
        CommandLine|contains:
        - .bat
        - .dll
        - .exe
        - .hta
        - .ps1
        - .vbe
        - .vbs
      filter_optional_installer:
        CommandLine|contains|all:
        - \Windows\TEMP\
        - .exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \attrib.exe
      - OriginalFileName: ATTRIB.EXE
      selection_cli:
        CommandLine|contains: ' +s'
      selection_paths:
        CommandLine|contains:
        - ' %'
        - \Users\Public\
        - \AppData\Local\
        - \ProgramData\
        - \Downloads\
        - \Windows\Temp\
      selection_ext:
        CommandLine|contains:
        - .bat
        - .dll
        - .exe
        - .hta
        - .ps1
        - .vbe
        - .vbs
      filter_optional_installer:
        CommandLine|contains|all:
        - \Windows\TEMP\
        - .exe
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \attrib.exe
      - OriginalFileName: ATTRIB.EXE
      selection_cli:
        CommandLine|contains: ' +s'
      selection_paths:
        CommandLine|contains:
        - ' %'
        - \Users\Public\
        - \AppData\Local\
        - \ProgramData\
        - \Downloads\
        - \Windows\Temp\
      selection_ext:
        CommandLine|contains:
        - .bat
        - .dll
        - .exe
        - .hta
        - .ps1
        - .vbe
        - .vbs
      filter_optional_installer:
        CommandLine|contains|all:
        - \Windows\TEMP\
        - .exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in the alert window reveals whether the same account staged or concealed
    files on multiple endpoints. Concealment repeated across hosts by one account widens the likely scope of the activity.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \attrib.exe
      - OriginalFileName: ATTRIB.EXE
      selection_cli:
        CommandLine|contains: ' +s'
      selection_paths:
        CommandLine|contains:
        - ' %'
        - \Users\Public\
        - \AppData\Local\
        - \ProgramData\
        - \Downloads\
        - \Windows\Temp\
      selection_ext:
        CommandLine|contains:
        - .bat
        - .dll
        - .exe
        - .hta
        - .ps1
        - .vbe
        - .vbs
      filter_optional_installer:
        CommandLine|contains|all:
        - \Windows\TEMP\
        - .exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: What other tools ran on this host around the same time?
  context: Concealment usually sits inside a larger sequence. Activity surrounding the attrib invocation may reveal the download
    or script cradle that dropped the file, persistence registration, or follow-on execution that provides broader context
    for the investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: Concealment rarely happens in isolation. Earlier detections on the same host such as exploitation, script execution,
    or defense tampering may reveal the stages that preceded the drop-and-hide and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: What other activity occurred on this host around the time of the alert?
  context: Examining the immediate process activity around the alert reveals what led up to the concealment and what followed.
    Novel parent-child pairs stand out at low counts against the high-count rows of routine agent telemetry and help place
    the attrib invocation in context.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
