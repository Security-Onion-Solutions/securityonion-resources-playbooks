name: CVE-2024-50623 Exploitation Attempt - Cleo
id: 6a2a50f4-27b5-41af-b93d-f36a31c8325d
description: |
  Detects a cmd.exe process whose parent is javaw.exe AND whose parent command line names a Cleo
  managed-file-transfer product (Harmony, LexiCom, VersaLex, VLTrader) AND whose own command line
  references powershell, an encoded-command switch (-enc / -EncodedCommand), or a .Download call —
  all three conditions must hold together. This is the post-exploitation stage of a file-write-to-code-execution
  flaw in an internet-facing transfer service: the service reads attacker-supplied content from its
  own working directories and ends up launching an interpreter it has no operational reason to launch.
  The investigation should establish what the parent-child chain actually executed, what the encoded
  payload resolves to, what the service process wrote to disk immediately before the spawn, whether
  the host made outbound connections afterward, and whether the same parent-driven pattern appears on
  other transfer servers.
type: detection
detection_id: f007b877-02e3-45b7-8501-1b78c2864029
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the alerting event show javaw.exe running a Cleo transfer product spawning cmd.exe with a powershell or encoded-command argument?
  context: >-
    The rule requires all three conditions at once — a javaw.exe parent, a parent command line naming
    Harmony, LexiCom, VersaLex or VLTrader, and a cmd.exe child whose command line contains powershell,
    ' -enc ', ' -EncodedCommand', or '.Download'. Read the four fields together and confirm each part
    holds before investing further analysis time. A transfer service handing an interpreter invocation
    to a command shell is not part of its normal file-brokering work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this host a managed-file-transfer server, and is the account it runs under the service's own identity?
  context: >-
    A transfer server brokering partner traffic is expected to run javaw.exe continuously; it is not
    expected to run command interpreters. Confirm the host's function and whether the account is the
    service principal the transfer product installs under rather than an interactive operator. If an
    administrator was working on the server at the time, the chain may still be attributable to that
    session rather than to remote input.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the full command line handed to cmd.exe, and what does the encoded PowerShell payload decode to?
  context: >-
    The command line is where the operational intent lives. Base64 arguments following -enc or
    -EncodedCommand are UTF-16LE and frequently wrap a second encoding layer; decode both layers and
    read out any addresses, download calls, and file paths. A '.Download' reference resolves to a
    web-client method pulling remote content, and the payload commonly retrieves an archive or JAR
    that the transfer service then hosts. Record every path and address the payload names — they
    drive the file and network questions.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \cmd.exe
        CommandLine|contains:
          - powershell
          - ' -enc '
          - ' -EncodedCommand'
          - .Download
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: Is javaw.exe running the transfer product expected to spawn cmd.exe, and what started the parent itself?
  context: >-
    The parent-child lineage is the core signal here. A Java-hosted transfer service brokers files; it
    has no routine reason to hand a command shell an interpreter invocation, so the pairing itself is
    the finding rather than the arguments alone. Reading the parent's own creation event shows the
    install path and configuration the service started with, and whether it was launched as a service
    at boot or started by hand — a hand-started instance under an operator session points at a
    different explanation than a service-hosted one processing partner input.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What inbound request or transferred file drove the transfer service to execute this command?
  context: >-
    Exploitation of an internet-facing transfer service begins with a request that writes attacker-controlled
    content into a directory the service itself reads and evaluates. The parent command line identifies
    the product and its installation root; from there the service's own transaction and debug logs under
    that root record the inbound transfer, the partner or address it came from, and the file name that
    landed. That record is what identifies the entry point and what can be blocked at the perimeter.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - manual_review
  - edr_console
- question: What version of the transfer product is installed, and is it patched against CVE-2024-50623?
  context: >-
    CVE-2024-50623 is an arbitrary-file-write-to-code-execution flaw in Cleo Harmony, VLTrader, and
    LexiCom. Version matters twice over: an unpatched build confirms the execution path was reachable,
    and a build carrying the CVE-2024-50623 fix does not rule exploitation out, because a follow-on
    bypass reaches the same autorun evaluation path on patched installations. Record the exact build
    from the installation root the parent command line names, and check whether the service is reachable
    from the internet — the entry condition for this class of flaw is exposure, not version alone.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
  answer_sources:
  - asset_inventory
  - edr_console
- question: What other child processes did this same transfer-service instance spawn?
  context: >-
    A service process that has been driven to execute one command is usually driven to execute more.
    Siblings of the alerting cmd.exe under the same parent instance show whether the operation
    progressed past a single invocation — additional interpreter launches, archive or certificate
    utilities pulling content down, or domain-enumeration binaries such as nltest.exe are the common
    next steps after code execution lands on a transfer server.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What files did the transfer-service process write or read around the time it spawned the shell?
  context: >-
    The execution path runs through the service's own directories: attacker-supplied content is written
    into a directory the service polls, the service evaluates it, and the evaluated content registers
    the command that ran. Files appearing under the installation root — an autorun or polling directory,
    a temporary staging file whose extension does not match its contents, an imported configuration or
    host definition — are the durable evidence, and the service commonly deletes them immediately after
    evaluation, so the file event may be the only remaining trace. File writes carry no hash; note the
    paths and check whether any of them was later executed.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: What modules did the transfer-service process load around the time of the spawn, and are any of them unsigned or outside the installation root?
  context: >-
    Exploitation of an internet-facing application shows up in module telemetry as well as process
    telemetry — the server process may load a component that arrived with the attacker-supplied content
    rather than one shipped with the product. Modules loaded from a temporary, staging, or user-writable
    path, or modules that are unsigned or signed by a party unrelated to the transfer product or the Java
    runtime, indicate the service loaded content it did not install. Loaded modules do carry hashes, so
    anything unexpected here can be reputation-checked directly.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
  answer_sources:
  - process_creation
  - manual_review
- question: Did powershell.exe on this host make outbound connections after the alert, and where did they go?
  context: >-
    Code execution on a transfer server is typically followed by retrieval of a second stage — an archive
    or a Java component that the server then hosts and serves back over its own listener. Outbound
    connections from the interpreter, especially to raw addresses on high ports or on non-standard web
    ports, are that retrieval. Correlate the destinations against the addresses read out of the decoded
    payload; a match confirms the payload executed rather than merely being staged. Absence of egress is
    consistent with either a failed retrieval or an execution attempt that never completed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \powershell.exe
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
      - Image
  answer_sources:
  - network_connection
  - external_threat_intel
- question: Has javaw.exe on this host ever spawned cmd.exe before, and if so under what command lines?
  context: >-
    A transfer service that has never spawned a command shell in 90 days makes the alerting spawn a
    first-of-its-kind event on the host. A history of the same pairing points at a product feature or a
    local customisation — some transfer products let an administrator configure a post-processing command
    that runs when a transfer completes, and that configuration produces exactly this lineage legitimately.
    Read the historical command lines: routine post-processing is repetitive and names local scripts,
    while the alerting invocation carries interpreter and download arguments.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- always_include: true
  question: Has this account previously produced the rule's pattern, and does that history fit its role?
  context: >-
    The query mirrors the rule's selection scoped to this account, giving a 90-day history of this exact
    pattern for the account, aggregated by host. An account that has never produced it is worth more
    attention than one that produces it routinely. Note that on a transfer server the alerting account is
    usually the service identity the product installs under rather than a person, in which case this
    count says little and the launch-mechanism history carries the answer instead.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \javaw.exe
        ParentCommandLine|contains:
        - Harmony
        - lexicom
        - VersaLex
        - VLTrader
        Image|endswith: \cmd.exe
        CommandLine|contains:
        - powershell
        - ' -enc '
        - ' -EncodedCommand'
        - .Download
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this parent process historically driven the rule's pattern on this host or across the environment, or is the parent new for this activity?
  context: >-
    When the alert fires under a service principal, account identity does not attribute the behavior —
    the launch mechanism does. The query mirrors the rule's selection scoped to the alerting parent
    process across 90 days, aggregated by host. A parent that already accounts for a long history of
    this pattern is a configured post-processing command and reframes the alert as product behavior; a
    parent that is new for it means the transfer service started doing something today that it has never
    done, which is what exploitation of the service looks like in process telemetry.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \javaw.exe
        ParentCommandLine|contains:
        - Harmony
        - lexicom
        - VersaLex
        - VLTrader
        Image|endswith: \cmd.exe
        CommandLine|contains:
        - powershell
        - ' -enc '
        - ' -EncodedCommand'
        - .Download
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this account run across the environment around this time?
  context: >-
    Tracking the account across all hosts in the alert window shows whether the activity is confined to
    this server or the same identity is active elsewhere — relevant when the transfer product runs under
    a shared domain service account across a cluster of nodes. If the alert fired under a machine account
    or another service principal, this returns routine agent telemetry and the launch-mechanism questions
    carry the answer instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same parent-driven pattern fire on other hosts in the same window?
  context: >-
    Under a service principal, asking what else the account did returns agent telemetry from every host.
    The meaningful question is whether the same launch mechanism fired elsewhere: the query mirrors the
    rule's selection scoped to the alerting parent process, fleet-wide, in the alert window. Several
    transfer nodes producing it in the same window points at internet-facing exposure being worked
    through systematically, or at a configuration pushed to the cluster; a single host points at a
    host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \javaw.exe
        ParentCommandLine|contains:
        - Harmony
        - lexicom
        - VersaLex
        - VLTrader
        Image|endswith: \cmd.exe
        CommandLine|contains:
        - powershell
        - ' -enc '
        - ' -EncodedCommand'
        - .Download
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Have other servers in the environment produced this same detection in the past day?
  context: >-
    Internet-facing services are enumerated and worked through in bulk, so an exploitation attempt
    against one transfer node is rarely the only one. Counting this rule's firings across all hosts over
    24 hours sets the containment boundary and identifies additional nodes needing the same investigation.
    Pair the answer with an inventory of which transfer instances are reachable from outside — an
    unalerted but exposed node is still in scope.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - alert
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating process activity in the alert window collapses routine agent and service telemetry into
    high-count rows and leaves novel parent-child pairs standing out at low counts. On a transfer server
    the routine profile is narrow — the Java service, its helpers, and management agents — so discovery
    binaries, archive utilities, or additional interpreters appearing at low counts mark where the
    operation went after the initial execution.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Exploitation of an internet-facing service leaves a short trail before code execution lands — probing
    that trips other rules, earlier partial attempts against the same service, or a prior execution that
    the operator refined. Earlier detections on the same host reconstruct how far back the activity
    reaches and whether this alert is the first successful step or a later one.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
