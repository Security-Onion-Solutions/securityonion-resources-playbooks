name: Process Deletion of Its Own Executable
id: 3de6600d-6e00-42c4-adbd-5941b5becb6b
description: |
  Detects a file deletion event in which the deleted path is the deleting process's own executable
  (TargetFilename matches the process Image). Windows normally prevents deletion of a running
  executable's on-disk image, so self-deletion requires a deliberate workaround — typically renaming
  the file's primary data stream and marking the file delete-on-close — and is used by droppers and
  loaders to erase their on-disk footprint while the process keeps running in memory. Uninstallers
  legitimately remove their own binary as a final step, so the investigation should establish what
  the binary was and how it arrived, recover its hash from the earlier execution event, and determine
  what the still-running process wrote, launched, or contacted after the deletion.
type: detection
detection_id: f01d1f70-cd41-42ec-9c0b-26dd9c22bf29
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the deleted file path match the deleting process's own executable path?
  context: The rule fires when the deleted path is identical to the Image of the process that performed
    the deletion. Confirm on the alert that TargetFilename and the process executable are the same path,
    and review every operation on this path around the deletion — a rename immediately before the delete
    is part of the common workaround for removing a running executable's image.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - file_event
- question: Is this host expected to run software that removes its own executable, such as uninstallers
    or self-updating tools?
  context: Uninstallers commonly delete their own binary as the last step of removal, and some installers
    and updaters clean up temporary stub executables the same way — these are the expected false positives
    for this detection. When the user is a machine or service account, judge by the deleting process's
    path and the host's role instead of the account name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Was the deleted executable recreated or restored after the alert, or did it stay gone?
  context: Self-deleting malware stays gone by design — the on-disk copy is unrecoverable and the
    investigation shifts to the still-running process and the artifacts it left elsewhere. The same
    path being recreated shortly after points instead at an update or reinstall cycle. Interpret the
    operation type on each subsequent event for this path.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What executable deleted itself, and from what location on disk?
  context: The alert is a deletion, so the file's content can no longer be read from disk — the
    investigative value is in the name and location of what was removed. A vendor uninstaller erasing
    itself from Program Files or a temp folder reads as cleanup; an unfamiliar binary in Downloads,
    Temp, ProgramData, or another user-writable path erasing itself right after execution reads as a
    dropper covering its tracks. The query returns the deletion event with the responsible process,
    which for this rule should both point at the same path.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_delete
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
- question: What command line did the self-deleting process run with?
  context: The deletion event names the responsible process but not its arguments. The full command
    line and working directory show what the binary was doing — uninstall or silent-install switches
    point at software management, while a bare invocation with no arguments from a user-writable
    directory is typical of a dropped payload. A binary that deletes its own image is rarely a common
    system tool, so host-plus-binary scoping stays precise here.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What is the hash of the deleted executable, and when did it first run?
  context: The deletion event carries no hash and the content is gone from disk, but this file provably
    executed — it deleted itself — so its hash was recorded on the earlier execution event and can still
    be looked up against reputation sources. If a copy is needed for analysis, check Volume Shadow
    Copies, backups, and the recycle bin for the path.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
  answer_sources:
  - process_creation
  - file_event
  - manual_review
- question: What process spawned the self-deleting binary, and is that parent chain expected?
  context: The parent reveals the delivery path — explorer.exe suggests a user double-click, a browser
    or archive utility suggests a fresh download, an Office application or script host suggests a
    document-borne dropper chain, and msiexec or a service manager suggests software management. The
    query retrieves the process's own creation event with its parent details; walk further up the tree
    from the parent if the chain is unfamiliar.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
  answer_sources:
  - process_creation
- question: What other files did the self-deleting process write or delete around the alert?
  context: A dropper that erases its own image usually writes its real payload somewhere else first —
    a persistence-installed copy, a staged component, or configuration files. The breadth, paths, and
    extensions of the process's other file activity (including its direct children, since droppers often
    delegate) enumerate what survived the cleanup and still needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: Did the self-deleting process communicate over the network before or after deleting its
    executable?
  context: Removing the on-disk image does not stop the process — the in-memory copy keeps running, and
    loaders commonly retrieve a next stage or begin beaconing once their footprint is erased. Outbound
    connections from this process identify remote endpoints worth pivoting on; a process that ran
    briefly, deleted itself, and made no connections points instead at a local staging step.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
- question: What child processes did the self-deleting process launch after removing its executable?
  context: Self-deletion is usually a mid-chain step. The still-running process may launch the
    persistent payload it dropped, start a system binary to host injected code, or run cleanup shells
    that clear additional traces. Children of the alerting process show where execution went after the
    on-disk file vanished.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
  - file_delete
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate
    context: what led to this event, what happened after, and whether it is part of a larger attack
    sequence. Novel parent-child process pairs at low counts stand out against the repetitive
    high-count rows of routine host activity.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across
    multiple endpoints. If the same user triggered similar activity on multiple hosts, the scope of
    compromise may be larger. When the alert fired under SYSTEM or another service principal, this
    view returns broad automation noise — the parent-driven clustering question is the meaningful
    answer in that case.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did the same program drive deletion of this same executable on other hosts in the
    same window?
  context: 'Under a service principal, "what else did this user do across the network" returns
    agent-telemetry noise (every host runs SYSTEM-owned agents constantly). The meaningful question is
    whether the same launch mechanism fired elsewhere: the query counts deletions of the alerting
    executable''s filename under the same program, fleet-wide, in the alert window. Multiple
    hosts in the same window points to scheduled or pushed automation such as a software update removing
    itself everywhere at once; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_delete
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Has a file with this name appeared on this host before?
  context: The file history shows when and how the executable arrived — the creation event identifies
    the process that wrote it, such as a browser download, an archive extraction, or another dropper.
    Zero results within the lookback mean it arrived earlier or through a channel without file
    telemetry. Repeated create-and-delete cycles of the same name point to a recurring updater or a
    re-delivered implant.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- always_include: true
  question: Has this user deleted this executable before, and does that history fit their role?
  context: The query counts this user's 90-day history of deletions of the alerting executable's
    filename, aggregated by host. Recurring deletions of the same binary name reflect routine install,
    uninstall, or update cycles under this account; a first-ever deletion of a freshly arrived binary
    deserves more scrutiny. Weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_delete
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this program driven deletions of this executable before, or is the program new
    for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query counts the 90-day history of the alerting
    program driving deletions of this executable''s filename, aggregated by host. A new or rare
    program for this activity is the deviation worth chasing; a program that already accounts for many
    prior events across hosts is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_delete
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Has the same executable name appeared on other hosts in the environment?
  context: The same filename being written to multiple hosts recently suggests distribution — lateral
    movement, a software deployment channel, or mass delivery — while a single host suggests targeted or
    isolated activity. Generic names such as setup.exe or update.exe collide across unrelated software,
    so corroborate cross-host matches with the hash recovered from the execution event before treating
    them as the same artifact.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — initial access,
    execution, or defense tampering — may reveal the stages that delivered the self-deleting binary
    and help reconstruct the full timeline leading up to the cleanup.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
