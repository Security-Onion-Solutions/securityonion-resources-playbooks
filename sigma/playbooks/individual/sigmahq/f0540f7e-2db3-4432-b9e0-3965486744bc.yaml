        - \wordpad.exe
        - \wordview.exe
        - \certutil.exe
        - \certoc.exe
        - \CertReq.exe
        - \Desktopimgdownldr.exe
        - \esentutl.exe
        - \mshta.exe
        - \AcroRd32.exe
        - \RdrCEF.exe
        - \hh.exe
        - \finger.exe
        TargetFilename|endswith:
        - .com
        - .dll
        - .exe
        - .jar
        - .ocx
        - .pyc
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven the rule's pattern on this host or across the environment, or is the program new for this activity?
  context: |
    When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule's selection
    structure scoped to the alerting program, so the result is the 90-day history of
    this program driving this specific drop pattern (not generic use of the binary).
    A new or rare program for this pattern is the deviation worth chasing; a program that already
    accounts for thousands of prior events is vendor or OS automation.
  range: -90d
  answer_sources:
  - file_event
  query: |
    aggregation: true
