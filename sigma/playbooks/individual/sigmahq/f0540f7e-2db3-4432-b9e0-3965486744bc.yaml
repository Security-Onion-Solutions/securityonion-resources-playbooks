- question: Did other detections fire on this host in the hours before this alert?
  context: |
    Earlier detections on the same host may reveal the stages that preceded the drop - a
    phishing attachment being opened, a script host launching, defense tampering, or earlier
    download activity. An executable drop by a trusted application typically sits in the
    middle of a delivery chain, so the preceding alert timeline helps reconstruct how the
    dropper arrived.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: |
    The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of the rule's firing pattern (not generic usage of these binaries). Many
    hosts firing the same pattern points to scripted deployment or vendor automation; one host
    or a small unrelated set points to targeted delivery or manual operator activity. Use the
    host distribution and consistency of the writing binary to calibrate severity.
  range: -7d
