- always_include: true
  question: What else did this user do across the network around this time?
  context: |
    Tracking the user's activity across all hosts reveals lateral movement or activity across
    multiple endpoints. If the same user triggered similar drops or ran staging tools on
    multiple hosts in the same window, the scope of the operation is larger than this single
    endpoint. When the alert fires under SYSTEM or a machine account, this pivot returns
    service noise - the parent-driven clustering question is the meaningful counterpart.
  range: +/-1h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: |
    Under a service principal, tracking the user across the network returns agent noise (every
    host runs SYSTEM-owned services constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule's selection structure scoped
    to the alerting program, fleet-wide, in the alert window. Multiple hosts in the same
    window points to scheduled or pushed automation; a single host points to a host-local
    trigger such as a user opening a delivered document.
  range: +/-1h
