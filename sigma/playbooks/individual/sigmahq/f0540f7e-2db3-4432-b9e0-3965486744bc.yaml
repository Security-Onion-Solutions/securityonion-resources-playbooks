name: Legitimate Application Dropped Executable
id: bc591222-0799-404b-995e-697915493fe0
description: |
  Detects executable and executable-equivalent files (.com, .dll, .exe, .jar, .ocx, .pyc)
  written to disk by applications that should never produce them: Office document handlers
  (eqnedt32.exe, wordpad.exe, wordview.exe), PDF readers (AcroRd32.exe, RdrCEF.exe), HTML Help
  and script hosts (hh.exe, mshta.exe), and download-capable utilities (certutil.exe,
  certoc.exe, CertReq.exe, Desktopimgdownldr.exe, esentutl.exe, finger.exe). Such a write is
  the delivery leg of payload staging - a malicious document exploiting its reader, a CHM
  decompiled with hh.exe to extract embedded binaries, a trusted utility fetching or decoding
  a payload, or code injected into a trusted process. The investigation should establish what
  command drove the write, what the dropped file is, how it arrived (network retrieval or
  embedded/decoded content), and whether it subsequently executed or was loaded.
type: detection
detection_id: f0540f7e-2db3-4432-b9e0-3965486744bc
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alert show one of the rule's watched applications writing an executable-type file?
  context: |
    Before investing investigation time, confirm the alert is a true positive. The rule fires
    when the writing process (Image) ends with one of thirteen application names - document and
    PDF handlers (eqnedt32.exe, wordpad.exe, wordview.exe, AcroRd32.exe, RdrCEF.exe), HTML Help
    and script hosts (hh.exe, mshta.exe), or download-capable utilities (certutil.exe,
    certoc.exe, CertReq.exe, Desktopimgdownldr.exe, esentutl.exe, finger.exe) - AND the written
    file (TargetFilename) ends with .com, .dll, .exe, .jar, .ocx, or .pyc. Review the file path,
    the operation performed, and the responsible process against these criteria.
  range: +/-5m
  answer_sources:
  - alert
  - file_event
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to produce executable files with this application?
  context: |
    None of the watched applications writes executable payloads in routine use, but narrow
    legitimate cases exist - a developer or packaging host using certutil to decode a vendor
    blob, an administrative script copying files with esentutl, or software that bundles one of
    these names. Knowing whether the user role and host function fit such a case is often the
    fastest triage path. When the user is SYSTEM or a machine account, judge by the writing
    process and host role instead.
  range: +/-5m
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the dropped file still on disk, or was it deleted or renamed after the alert?
  context: |
    The file's post-alert lifecycle drives both urgency and next steps. A payload still on disk
    can be retrieved, hashed, and analyzed; a file deleted seconds after creation suggests
    anti-forensic cleanup or a self-deleting dropper and shifts the investigation to what
    executed in between. A rename to a different extension is a common staging step between
    download and execution.
  range: +4h
  answer_sources:
  - file_event
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What command line was the dropping application running, and what do its arguments reveal about the file's origin?
  context: |
    For the download-capable utilities the arguments carry the whole story - certutil with
    -urlcache/-split (remote fetch) or -decode/-decodehex (a named encoded source file turned
    into the dropped output), certreq -Post retrieval, desktopimgdownldr /lockscreenurl,
    finger pointed at an attacker host, esentutl /y copying a source to a destination, hh.exe
    -decompile extracting a CHM's embedded content, or mshta running a remote scriptlet. The
    host+binary window intentionally spans a few minutes to catch multi-step sequences such as
    a download command followed by a decode command. For document and PDF applications no
    command-line flag legitimately produces an executable, so an unremarkable command line
    paired with the drop points toward exploitation or injected code.
  range: +/-5m
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What is in the dropped file? Check for known executable formats, obfuscation, and embedded indicators.
  context: |
    Retrieve the file from its on-disk path and analyze the content. For a PE (.exe/.dll/.ocx/.com),
    check imports, embedded strings, packer signatures, and signing status; for a .jar, inspect
    the archive's classes and manifest; for a .pyc, decompile the Python bytecode - droppers
    have paired a dropped executable with a .pyc payload passed as its argument. Look for
    embedded URLs, IP addresses, encoded blobs, and command strings, and compare anything
    suspicious against threat intelligence.
  range: +/-5m
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If the dropped file has executed, what is its hash, and does it have known detections?
  context: |
    A file's hash is recorded when it runs, not when it is written - file-creation events carry
    no hash. This query looks for the dropped file executing and reads its hash; submit that to
    a reputation service or internal threat intelligence to determine whether it is known
    malicious, benign, or previously unseen. If the file is present but has not executed,
    retrieve it from its on-disk path and hash it manually.
  range: +/-1h
  answer_sources:
  - process_creation
  - external_threat_intel
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: Was the dropped file loaded as a module into any process after the write?
  context: |
    Library payloads (.dll, .ocx) execute by being loaded - via rundll32, regsvr32, an
    application host, or injection - rather than by spawning a process, so an execution-only
    check misses them. The load event carries the module's hash, signing status, and signer
    directly, providing the reputation pivot that the file-write event lacks, and the loading
    process identifies what consumed the payload.
  range: +4h
  answer_sources:
  - process_creation
  - external_threat_intel
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: Did the writing process make network connections around the file write?
  context: |
    Several of the watched binaries retrieve remote content (certutil URL fetches, certreq
    -Post, desktopimgdownldr, finger, mshta remote scriptlets, hh.exe opening remote CHM
    content), so an outbound connection immediately before the write is the delivery leg of an
    ingress tool transfer - note the destination and check it against known enterprise and
    content-delivery endpoints. For document and PDF readers, an outbound connection paired
    with an executable drop fits exploit-stage payload retrieval. No connection at all points
    to an embedded or locally decoded payload instead.
  range: +/-15m
  answer_sources:
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: What launched the application that dropped the file, and is that parent chain expected?
  context: |
    The parent reveals how the drop was set in motion. eqnedt32.exe is spawned by an Office
    document rendering an equation object; AcroRd32.exe and RdrCEF.exe by a user opening a PDF
    from explorer.exe or a browser; hh.exe by a user opening a CHM, often delivered in an
    archive; the command-line utilities by shells, scripts, or scheduled automation. An Office
    application, script host, or shell chain launching a utility that then drops an executable
    is the maldoc and loader pattern worth chasing, and the parent command line frequently
    carries the document or script path that started it.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What other files did the responsible process write or delete around the alert?
  context: |
    A process that drops one payload often drops several - a CHM decompilation extracts an
    entire directory tree, a downloader stages components across Temp subfolders, and cleanup
    deletions in the same burst mark anti-forensic behavior. The breadth, paths, and extensions
    of the process's other file activity distinguish a single artifact from a staging operation
    in progress and enumerate what else needs review. The correlation covers the writer and its
    direct children, since droppers often delegate the write.
  range: +/-30m
  answer_sources:
  - file_event
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What processes did the writer or its launching shell spawn, and what are their hashes?
  context: |
    The hash needed for a reputation lookup or sandbox detonation is recorded when the payload
    runs, not when it is written. This query returns the processes the writing application and
    the shell that launched it spawned - its children and siblings - with their executable
    hashes; for a drop-and-execute sequence that is the payload itself. If the payload was run
    later by an unrelated process it won't appear here; retrieve the file from the on-disk path
    surfaced by the lifecycle question and hash it manually.
  range: +1h
  answer_sources:
  - process_creation
  - external_threat_intel
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection_children
    fields:
      - Image
      - Hashes
- question: When this host has previously fired the rule's pattern, what programs and users normally drive that activity, and does the current alert fit that pattern?
  context: |
    Even watched applications can produce this pattern routinely on specific hosts - a packaging
    server decoding vendor blobs with certutil, or a documentation build extracting CHM content.
    The query mirrors the rule's selection structure scoped to this host, so the resulting
    program/user distribution reflects how the rule's specific firing pattern (not generic use of
    these binaries) has historically run here. Deviations - a new acting program, an unexpected
    user account, a first-ever occurrence - are the anomaly worth chasing.
  range: -14d
  answer_sources:
  - file_event
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith:
        - \eqnedt32.exe
        - \wordpad.exe
        - \wordview.exe
        - \certutil.exe
        - \certoc.exe
        - \CertReq.exe
        - \Desktopimgdownldr.exe
        - \esentutl.exe
        - \mshta.exe
        - \AcroRd32.exe
        - \RdrCEF.exe
        - \hh.exe
        - \finger.exe
        TargetFilename|endswith:
        - .com
        - .dll
        - .exe
        - .jar
        - .ocx
        - .pyc
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: |
    The query mirrors the rule's selection structure scoped to this user - the result is the
    user's 90-day history of the rule's specific firing pattern (not generic use of these
    binaries), aggregated by host. A user who has never produced an executable drop from these
    applications is more suspicious than one who does so regularly; weigh the count against the
    user's role and typical toolset.
  range: -90d
  answer_sources:
  - file_event
  - organizational_knowledge
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith:
