name: ZxShell Malware
id: ab533dc1-788f-4e2c-942f-26887f9639af
description: |
  Detects rundll32.exe started with a command line that references the exported function names zxFunction or
  RemoteDiskXXXXX. The rule requires both conditions on the same process event: the image ends in rundll32.exe AND the
  command line contains one of those export names. ZxShell is a remote-access backdoor shipped as a DLL and executed
  through rundll32.exe, which then provides an interactive shell, proxy relaying, and service manipulation; the export
  name is the entry point the loader is told to call. Investigation should establish which DLL rundll32 was told to
  load, how that DLL arrived on disk, what the process connected to, and what it launched afterward.
type: detection
detection_id: f0b70adb-0075-43b0-9745-e82a1c608fcc
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the command line show rundll32.exe being told to call an export named zxFunction or RemoteDiskXXXXX?
  context: >-
    Confirm the alert before investing further time. The rule fires only when the image is rundll32.exe and the command
    line carries one of those two export names, so read the full command line and note the DLL path passed alongside the
    export. A truncated or unrelated command line that lacks either name is a matching artifact worth flagging rather
    than a confirmed execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to load DLL exports through rundll32.exe by name?
  context: >-
    Installers, control-panel applets, and some management tooling legitimately call rundll32.exe with an export name,
    so the mechanism alone is not unusual. The named exports here are not part of any shipped Windows DLL, so the
    question is whether any local software or administrative process on this host is known to use custom rundll32
    entry points at all.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this rundll32 execution part of an authorized penetration test or red team engagement?
  context: >-
    Offensive tooling is used in authorized security assessments, and backdoor samples are sometimes detonated
    deliberately during testing or malware analysis on instrumented hosts. Check whether an assessment, sandbox run, or
    analysis exercise is active on this host or network segment. Matching scope and timing resolves the alert without
    further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: Which export was invoked, and which DLL path was passed to rundll32?
  context: >-
    ZxShell exposes multiple capabilities behind separate exports — remote shell, proxy relaying, port scanning, and
    service manipulation — so the export name and the DLL argument determine what the sample was asked to do and what
    the response scope is. Record the full DLL path, the export name, and any trailing arguments, since the path also
    tells you where the payload was staged.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: What files did rundll32.exe create or modify on this host after the alert?
  context: >-
    ZxShell writes plugin and configuration data under its own registry and file paths, and its command handlers stage
    output files for shell and proxy sessions. File activity from the loader process shows what the payload produced
    even after the process has exited, and reveals staged output or dropped secondary components.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: What exactly did this rundll32 invocation do — parse the DLL path, the export name, and every trailing argument.
  context: >-
    The full command line is the operation. Resolve the DLL path to a concrete location and note whether it sits in a
    user-writable or temporary directory, then read the export name and any arguments that follow it, which carry
    target addresses, ports, or session parameters for the invoked capability. Multiple rundll32 executions in the same
    window on this host may be separate stages of one operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned this rundll32.exe and is that parent chain expected?
  context: >-
    The parent reveals how the loader was invoked. rundll32.exe launched by explorer.exe, an Office application, a
    script host, or an archive utility points at user-initiated or document-delivered execution; a parent of
    services.exe or svchost.exe points at a service or scheduled entry that already survives reboot. Note what else the
    parent launched around the same time.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Which DLLs did this rundll32 process map into memory, and are they signed?
  context: >-
    The command line names the DLL, but the load events confirm what was actually mapped, including dependencies the
    payload pulled in. An unsigned DLL, or one loaded from a user-writable or temporary directory, is the payload
    itself rather than a system component. Record the hash for correlation across the environment.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - process_creation
  - manual_review
- question: Did rundll32.exe open outbound connections from this host, and to which addresses and ports?
  context: >-
    A DLL executed through rundll32.exe that then makes outbound connections is using the signed loader as its network
    process. ZxShell's shell and proxy handlers reach a controller over common service ports such as 21, 25, 53, 80,
    and 443, and repeated connections to one external address on a fixed interval indicate a controller channel rather
    than an application fetch. Pivot on any external address to see which other hosts contacted it.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
- question: What child processes did this rundll32 process spawn afterward?
  context: >-
    The children show what the payload actually did. Shell handlers spawn cmd.exe; service manipulation spawns sc.exe;
    self-removal uses a ping delay followed by a delete of the loader's own file. Any of those under this loader
    identifies which capability ran and whether cleanup was attempted.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: >-
    When this host has previously produced this rundll32 export pattern, what parents and users drove it, and does the
    current alert fit that history?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution
    reflects how this specific export pattern has run here rather than generic rundll32 usage. These export names are
    not part of any shipped component, so a non-zero history is itself a finding: it means the same payload ran here
    before, and the parent and user columns tell you under what mechanism.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \rundll32.exe
        CommandLine|contains:
        - zxFunction
        - RemoteDiskXXXXX
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Has this user previously produced this rundll32 export pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, giving their 90-day history of this specific
    export pattern aggregated by host. Because the export names belong to no shipped software, prior activity under the
    same account across several hosts suggests the account or its credentials have been used to deploy the payload
    repeatedly rather than that the behavior is routine.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \rundll32.exe
        CommandLine|contains:
        - zxFunction
        - RemoteDiskXXXXX
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: >-
    Has this parent process historically driven this rundll32 export pattern here or elsewhere, or is the parent new
    for this activity?
  context: >-
    When the alert fires under SYSTEM or another service principal, the user field does not attribute the behavior and
    the launch mechanism is the meaningful pivot. The query mirrors the rule's selection structure scoped to the
    alerting parent, giving the 90-day history of that parent driving this export pattern. A parent that already
    accounts for prior events points at an installed persistence mechanism; a new parent points at fresh delivery.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \rundll32.exe
        CommandLine|contains:
        - zxFunction
        - RemoteDiskXXXXX
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the account's activity across all hosts in the alert window shows whether the same identity was active
    elsewhere, which bounds the scope of the intrusion. If the alert fired under a service principal, expect this to
    return routine service telemetry and weigh the parent-scoped view instead.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did this same parent-driven export pattern fire on other hosts in the same window, or is it isolated here?
  context: >-
    Under a service principal, asking what else the user did returns routine agent telemetry. The query instead mirrors
    the rule's selection structure scoped to the alerting parent, fleet-wide, in the alert window. Several hosts in the
    same window points at pushed or scheduled deployment of the payload; a single host points at a host-local trigger.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \rundll32.exe
        CommandLine|contains:
        - zxFunction
        - RemoteDiskXXXXX
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur alone. Aggregating process activity in the surrounding window collapses repetitive agent
    telemetry into high-count rows and leaves novel parent-child pairs standing out at low counts. Look for the
    delivery step that preceded the load and for discovery, service creation, or staging that followed it.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host help reconstruct how the payload arrived. Delivery and defense tampering
    commonly precede loader execution, and credential access or lateral movement commonly follow it, so the ordering of
    prior alerts indicates which stage this event sits at.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: >-
    Have other hosts produced this rundll32 export pattern in the past week, and what does the cross-host distribution
    look like?
  context: >-
    The query mirrors the rule's selection structure with no host scope, giving a fleet-wide count of this export
    pattern rather than generic rundll32 usage. Because these export names belong to no shipped software, any
    additional host in the result is another host running the same payload and should be triaged the same way. Use the
    host list to bound containment.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \rundll32.exe
        CommandLine|contains:
        - zxFunction
        - RemoteDiskXXXXX
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
