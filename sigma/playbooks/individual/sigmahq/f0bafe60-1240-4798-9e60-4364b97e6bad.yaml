name: Goofy Guineapig Backdoor IOC
id: 15622c29-cc97-4f19-8a33-8e069218a896
description: |
  Detects file events for the on-disk artifacts the Goofy Guineapig backdoor stages under C:\ProgramData\GoogleUpdate -- config.dat, GoogleUpdate.exe, GoogleUpdate\tmp.bat, and goopdate.dll. The family is delivered as a trojanised NSIS Firefox installer that drops the legitimate signed GoogleUpdate.exe alongside a malicious goopdate.dll it side-loads via DLL search order, persists as an auto-start Windows service named GoogleUpdate whose binary path points into ProgramData, hollows later stages into a hidden dllhost.exe, and beacons over HTTPS with HTTP, KCP, UDP, and direct-socket transports compiled in. Because legitimate Google update components install under Program Files rather than ProgramData, the investigation should confirm which artifact was written, identify the dropper and its delivery path, and trace the side-load, service persistence, and outbound command-and-control that turn the files into running code.
type: detection
detection_id: f0bafe60-1240-4798-9e60-4364b97e6bad
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Is the written file one of the four GoogleUpdate-masquerade paths this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact file path, the operation performed, and the responsible process against the rule's detection criteria. The rule fires when TargetFilename equals any of C:\ProgramData\GoogleUpdate\config.dat, GoogleUpdate.exe, GoogleUpdate\tmp.bat, or goopdate.dll. Note which artifact fired -- the configuration file, the side-load host executable, the batch script, or the malicious DLL -- because the follow-up execution checks differ by artifact type.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is any sanctioned software on this host expected to create a GoogleUpdate directory under ProgramData?
  context: Legitimate Google update components install under Program Files\Google\Update, not C:\ProgramData\GoogleUpdate, so a sanctioned explanation for these paths is unlikely -- the rule's false-positive rating is "Unlikely". Check whether the host recently had a Firefox install or other user-initiated software setup, since the family arrives as a trojanised Firefox installer. When the user is a machine or service account, judge by the writing process and host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the file still on disk, or was it deleted or renamed after the alert?
  context: The file's post-alert lifecycle drives next steps. This family deletes its stage-1 loader components after handoff, so a deletion shortly after creation fits the cleanup behavior and shifts attention to what executed in between; the service binary and side-loaded DLL normally persist on disk to survive reboots and can be retrieved, hashed, and analyzed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Does the dropped file's content match the known component profile for this family?
  context: Retrieve the file from its on-disk path and inspect it in a safe environment. Expected traits per artifact -- goopdate.dll is a UPX-packed, unsigned DLL masquerading as a Google Update component; GoogleUpdate.exe is a genuinely signed Google updater binary abused as the side-load host, so a valid signature there does not clear the alert; config.dat carries the embedded command-and-control configuration; tmp.bat is a readable script whose commands can be reviewed directly. Packer signatures, signing status, and embedded strings confirm whether this is the real component set or a filename collision.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If the dropped artifact has executed, what is its hash, and does it have known threat intel detections?
  context: A file's hash is recorded when it runs, not when it is written. This applies when the alerting artifact is GoogleUpdate.exe or tmp.bat; the DLL's hash is read from its module-load event (see the side-load question), and config.dat never executes -- retrieve it from disk and hash it manually. Submit the hash to reputation services to distinguish the legitimate signed Google updater from a tampered copy and to confirm known family samples.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: What did the process that wrote this file execute, including its full command line and working directory?
  context: The file event names the writing process but carries no command line. Pivoting to that binary's process-creation events on this host reveals how the dropper was invoked and where it ran from. This family's dropper is a UPX-packed NSIS installer posing as a Firefox setup (delivered as Firefox-latest.exe), so an installer running from a Downloads or Desktop path that also unpacks Firefox files frames the delivery.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What launched the process that wrote these files, and is that parent chain expected?
  context: The writer's own process-creation event reveals its parentage, command line, and executable hash. A browser, archive tool, or explorer.exe parent points to a user-downloaded trojanised installer; a script host or Office parent points to a different delivery vector. Establishing what delivered and ran the dropper scopes the intrusion beyond the dropped files themselves.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - CommandLine
      - Hashes
- question: What other files did the responsible process write or delete around the alert?
  context: The installer drops legitimate Firefox files and the whole GoogleUpdate directory layout in one burst, so the writer's full file activity enumerates every staged component -- including decoy files and any additional payloads -- and any stage-1 self-deletion. The correlation covers the writer and its direct children, since droppers often delegate the final writes.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written into the ProgramData GoogleUpdate directory recently, and by which processes?
  context: No sanctioned updater populates C:\ProgramData\GoogleUpdate, so every arrival there belongs to this activity. Other recent writes into the directory reveal plugin DLLs the backdoor's framework loads dynamically, staged output, or repeated re-drops, and the set of writing processes separates the initial installer from the running backdoor's own writes. A single unfamiliar writer across many files is the signal to chase.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\ProgramData\GoogleUpdate\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Was goopdate.dll loaded into a process, and by which loader -- is the DLL signed, and what is its hash?
  context: The family's execution primitive is DLL search-order side-loading -- the signed GoogleUpdate.exe resolves goopdate.dll from its own ProgramData directory and runs the attacker code inside a trusted-looking process. Module-load events record the loading process, the DLL's signature status, and its hash directly. An unsigned goopdate.dll loaded by a GoogleUpdate.exe running outside Program Files\Google is the side-load; submit the hash to threat intelligence to confirm the sample.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith: '\goopdate.dll'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: Was a Windows service named GoogleUpdate registered or reconfigured around the time of the drop?
  context: The backdoor persists as an auto-start service named GoogleUpdate whose binary path points at C:\ProgramData\GoogleUpdate\GoogleUpdate.exe, blending with the legitimate Google update services (gupdate/gupdatem) that administrators typically allowlist. Registry modifications under the service key -- an ImagePath pointing into ProgramData rather than Program Files\Google\Update, or a Start value of automatic -- indicate the persistence was armed; the writing process ties the change back to the installer.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Services\GoogleUpdate'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Did dllhost.exe start on this host from a parent other than svchost.exe?
  context: Later stages of this family spawn a fresh dllhost.exe with a hidden window and hollow the payload into it, so the backdoor's code runs inside a legitimate system image. Legitimate dllhost.exe instances are spawned by svchost.exe (DcomLaunch) and carry a /Processid:{GUID} argument; a dllhost.exe with a non-svchost parent -- especially GoogleUpdate.exe -- or with an empty command line missing the /Processid argument is the injection host and identifies the process to contain.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\dllhost.exe'
      filter_dcom:
        ParentImage|endswith: '\svchost.exe'
      condition: selection and not filter_dcom
    fields:
      - ParentImage
      - CommandLine
- question: Did any process running from the ProgramData GoogleUpdate directory make outbound network connections?
  context: The backdoor's command-and-control configuration is embedded in the binary; the analyzed transport is HTTPS, but HTTP, KCP, UDP, and direct-socket alternatives are compiled in, so do not assume port 443 -- any egress from a binary in this path is attacker traffic, since no sanctioned updater runs from ProgramData. Destination addresses feed blocking and retro-hunting; note that traffic from a hollowed dllhost.exe will not match this path filter, so pair this with the dllhost anomaly check.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|contains: '\ProgramData\GoogleUpdate\'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
- always_include: true
  question: Has this user account previously produced writes to these GoogleUpdate-masquerade paths?
  context: The query mirrors the rule's own selection -- the four staged artifact paths -- scoped to the alerting user and aggregated by host over 90 days. For a malware artifact set, any prior history is itself unexpected; repeated hits point either to an earlier compromise of the same account's sessions or to a re-firing installer, and the host spread of that history scopes where else the account staged the files.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename:
        - C:\ProgramData\GoogleUpdate\config.dat
        - C:\ProgramData\GoogleUpdate\GoogleUpdate.exe
        - C:\ProgramData\GoogleUpdate\GoogleUpdate\tmp.bat
        - C:\ProgramData\GoogleUpdate\goopdate.dll
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven writes to these paths here or elsewhere, or is the program new for this pattern?
  context: 'When the alert fires under a service or machine account, user identity does not attribute the behavior -- the launch mechanism does. The query mirrors the rule''s selection scoped to the alerting program, aggregated by host, giving the 90-day history of this program staging these exact artifacts. A new or rare program for this pattern is the deviation worth chasing; for these malware paths, even an established history points to a persistent foothold rather than benign automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename:
        - C:\ProgramData\GoogleUpdate\config.dat
        - C:\ProgramData\GoogleUpdate\GoogleUpdate.exe
        - C:\ProgramData\GoogleUpdate\GoogleUpdate\tmp.bat
        - C:\ProgramData\GoogleUpdate\goopdate.dll
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the alerting user's activity across all hosts in the alert window reveals whether the drop is isolated or part of movement across endpoints. If the same account ran the installer or staged files on multiple hosts, the scope of compromise is larger than this single machine and containment must widen accordingly.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven drop pattern fire on other hosts in the same window, or is it isolated to this host?
  context: 'Under a service principal, cross-user activity is dominated by agent noise. The meaningful question is whether the same launch mechanism staged these artifacts elsewhere: the query mirrors the rule''s selection scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts in the same window points to a pushed or scripted rollout of the backdoor; a single host points to a host-local delivery such as a user-run installer.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename:
        - C:\ProgramData\GoogleUpdate\config.dat
        - C:\ProgramData\GoogleUpdate\GoogleUpdate.exe
        - C:\ProgramData\GoogleUpdate\GoogleUpdate\tmp.bat
        - C:\ProgramData\GoogleUpdate\goopdate.dll
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: A backdoor drop is usually preceded by earlier stages -- the download and execution of the trojanised installer, or follow-on activity such as an anomalous dllhost.exe spawn or new-service registration that fires its own detections. Earlier alerts on the same host help reconstruct how the dropper arrived and order the attack stages into a timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
