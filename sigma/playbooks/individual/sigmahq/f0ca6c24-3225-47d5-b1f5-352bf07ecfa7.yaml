name: PUA - DefenderCheck Execution
id: d473d963-5f18-4d69-9598-e20df53c5ba1
description: |
  Detects execution of DefenderCheck, a utility that takes a binary as input and bisects it until it isolates the exact bytes Microsoft Defender flags on, then prints those offending bytes so the operator can modify a tool to evade signature detection. The rule fires when a process either has an Image ending in \DefenderCheck.exe or a file Description of DefenderCheck. Execution is most often part of pre-attack tooling preparation rather than a hands-on-keyboard intrusion stage, so the investigation should determine who ran it, what binary it was pointed at, whether a modified version of a flagged tool subsequently appeared or executed, and whether the activity is sanctioned red-team or developer work versus unauthorized evasion staging.
type: detection
detection_id: f0ca6c24-3225-47d5-b1f5-352bf07ecfa7
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- question: Does the process match what this rule detects -- an Image ending in \DefenderCheck.exe or a file Description of DefenderCheck?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the Image path and file Description against the rule's criteria. The rule fires on either condition, so note which one matched -- a renamed binary that kept the DefenderCheck Description is a stronger evasion signal than a plainly named tool a user downloaded to test.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - Description
- question: Is this user and host expected to run AV signature-evasion tooling?
  context: Legitimate use is largely limited to red-team operators, malware analysts, and developers validating their own builds against Defender. A general-purpose workstation or server account running this tool is far harder to explain than a known security-testing host or account.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this tool on the organization's approved software list for this host?
  context: Signature-evasion utilities are rarely sanctioned outside dedicated security-testing programs. Any presence of this tool on a host not enrolled in an approved red-team or malware-analysis function should be checked regardless of who installed it, since the tool's sole purpose is to weaken detection of another binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there an authorized red-team engagement, penetration test, or development task that explains this execution?
  context: Sanctioned use of evasion tooling normally maps to a scheduled engagement, a tracked development effort, or a documented analyst task. If no such authorization exists for this host and user, the execution is more consistent with an operator preparing a payload to bypass endpoint protection.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did this tool or the user's session make outbound connections that suggest the analyzed binary was downloaded or exfiltrated?
  context: The tool itself operates offline against a local file, so any associated outbound traffic in the same window points to retrieval of the binary being tested or staging of a modified result. Connections to file-sharing or paste services around the execution are worth identifying.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: Is the binary that was analyzed still on disk, and was a modified copy written nearby?
  context: This tool reads a target file from disk and the operator typically saves a modified version after editing the flagged bytes. Locating both the original input and any newly written similar binary enables hashing, signature comparison, and sandbox submission. File paths derived from the command line scope the search.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Does the command line carry encoded or obfuscated content, and what does it decode to?
  context: The invocation may pass the target binary path, output path, or wrapper arguments through encoding or concatenation to hide what is being analyzed. Decode any base64, hex, or character-concatenation in the command line to reveal the actual input file and intended operation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What exactly did this tool do -- which binary did it read and what arguments were passed?
  context: The full command line reveals the file the tool was pointed at and any output options. Decode the input path and any flags to understand which tool the operator was preparing to evade detection on. Multiple sequential invocations on the same host within the window may represent iterative editing of the same target binary.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Did Microsoft Defender or another AV engine log a detection on this host in the same window, and what binary and signature name did it name?
  context: This tool is run to defeat a specific AV signature, so a near-term antivirus detection event on the same host frequently identifies the very binary the operator is trying to modify. The detection message names the flagged file and the signature string; correlating that with the analyzed file ties the evasion effort to a concrete payload and bounds the time between the AV alert and the resumed activity.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      service: application
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Provider:
          - 'Microsoft-Windows-Windows Defender'
          - 'Windows Defender'
      condition: selection
    fields:
      - Message
      - Provider
- question: What process spawned this tool and is that parent chain expected?
  context: The parent process reveals how the tool was invoked. A developer or red-team launch from explorer.exe or a terminal differs from invocation by a script host, an Office application, or a downloaded loader, which would point to a delivered tooling stage rather than deliberate analyst use.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Does this host normally run this tool?
  context: A signature-evasion utility that has never been seen on a host is far more suspicious than one that runs regularly on a dedicated testing system. Zero or very low historical counts indicate first-time or rare execution and raise the priority of identifying who introduced it.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drove it, and does the current alert fit?
  context: The query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern has historically run here -- not generic binary usage. A new parent process, an unexpected user account, or a first-ever appearance is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \DefenderCheck.exe
      - Description: DefenderCheck
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like coordinated automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this firing pattern. Many hosts firing it points to a managed red-team or testing fleet; a single host or a small unrelated set points to a one-off operator action that needs an explanation.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \DefenderCheck.exe
      - Description: DefenderCheck
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \DefenderCheck.exe
      - Description: DefenderCheck
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \DefenderCheck.exe
      - Description: DefenderCheck
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the evasion testing was isolated or accompanied other actions on multiple endpoints. If the same user triggered related activity elsewhere, the scope of the operation may be larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \DefenderCheck.exe
      - Description: DefenderCheck
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
