name: Potential Commandline Obfuscation Using Escape Characters
id: 26b880ef-0d7e-49bf-a2c5-b84525eade5c
description: |
  Detects command lines that obfuscate the literal string "http" using shell escape characters, where caret separators
  (h^t^t^p) or embedded double quotes (h"t"t"p) break up the token so signature-based detections that look for "http" do
  not match. Both forms are interpreted by the command-line parser back into the original characters at runtime, so the
  obfuscated string behaves identically to the plain text while evading naive string matching. The technique is most often
  used to hide download URLs or proxy-execution arguments inside otherwise normal-looking command lines. Read the full
  command line to reconstruct the de-obfuscated string, determine the binary and operation it drives, and check whether the
  surrounding activity looks like staging and payload execution.
type: detection
detection_id: f0cdd048-82dc-4f7a-8a7a-b87a52b6d0fd
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line contain "http" obfuscated with caret separators or embedded double quotes?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when a command line
    contains either the caret-escaped form h^t^t^p or the quote-broken form h"t"t"p. Read the full command line, confirm one
    of those exact patterns is present, and reconstruct what the obfuscated token resolves to once the escape characters are
    removed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run command lines that wrap URLs or arguments in escape characters?
  context: Caret and quote escaping inside command lines is rare in routine administration; legitimate scripts and installers
    usually write URLs and arguments in plain text. Determine whether the user role and host function plausibly produce escaped
    command lines (for example a developer testing parser behavior or a packaging tool that emits escaped paths) versus an
    ordinary endpoint and account where escaped "http" tokens have no benign explanation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Reconstruct the de-obfuscated command line. What URL, binary, and operation does the escaped string resolve to?
  context: The escape characters are the operator's way of hiding the real command from string matching. Remove the caret
    separators (h^t^t^p becomes http) or collapse the embedded double quotes (h"t"t"p becomes http) to recover the literal
    token, then read the rest of the command line in that light. Identify the full URL or argument the "http" fragment belongs
    to, which binary consumes it (a download cradle, a regsvr32 or rundll32 proxy-execution argument, a scripting host), and
    what operation the de-obfuscated command performs. Escaping is frequently combined with other layers such as environment-
    variable substitution or character concatenation, so iterate until the command reads cleanly.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned this command, and is that parent chain expected?
  context: The parent process reveals how the obfuscated command was invoked. Escaped command lines launched by explorer.exe
    or an administration shell may be benign tooling, while invocation from Office applications, scripting hosts such as
    wscript.exe, cscript.exe, or mshta.exe, a PowerShell download cradle, wmiprvse.exe (WMI remote execution), or
    wsmprovhost.exe (WinRM) points to a macro or remote operator hiding a URL or proxy-execution argument.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did this command spawn afterward?
  context: An obfuscated "http" token usually drives a download or proxy-execution step, and the impact shows up in what the
    process spawns next. Children such as cmd.exe, powershell.exe, certutil.exe, regsvr32.exe, rundll32.exe, or a freshly
    written binary indicate the escaped command reached an execution stage rather than failing harmlessly. Scoping to the
    alerting process by its own identifier returns exactly the processes it launched.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host has previously fired this escaped-http pattern, what parents and users drove it, and does the current
    alert fit?
  context: Even legitimate tooling occasionally emits escaped command lines. The query mirrors the rule's selection structure
    scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern - "http"
    broken up with carets or quotes - has historically run here, not generic command-line activity. A new parent process, an
    unexpected user account, or a first-ever appearance of the pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - h^t^t^p
        - h"t"t"p
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - h^t^t^p
        - h"t"t"p
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - h^t^t^p
        - h"t"t"p
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If
    the same user ran escaped command lines or other tooling on several hosts in this window, the scope of the activity may be
    larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - h^t^t^p
        - h"t"t"p
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining the surrounding activity reveals the immediate context: what led to
    the obfuscated command, what followed, and whether it is part of a larger sequence. Look for file staging, download tools,
    or proxy-execution binaries appearing as novel parent-child pairs at low counts against the high-count background of
    routine processes.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - initial access, file staging, execution, or other defense-evasion attempts -
    may reveal the attack stages that preceded this obfuscated command and help reconstruct the timeline. Command-line
    obfuscation typically wraps an execution or download step, so prior alerts here help place the escaped command within an
    attack sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Did the obfuscated command stage or write a file that is still on disk for analysis?
  context: Deobfuscation and download steps frequently land a payload on disk before execution - a decoded output file or a
    downloaded binary. Operators commonly disguise these with innocuous extensions such as .txt, .cer, .enc, .b64, or .zip in
    user-writable locations. If the de-obfuscated "http" token resolved to a download URL, check whether the fetched file
    still exists so it can be hashed, submitted to a sandbox, or reviewed.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did the obfuscated process call the Windows APIs that in-memory decoding or injection into another process depends on?
  context: Beyond writing decoded content to disk, deobfuscation and loaders often run in memory - the process reconstructs a
    payload and writes it into another process's address space rather than dropping a file. Review the behavioral API events
    tied to the alerting process for WriteProcessMemory, QueueUserAPC, or SetWindowsHookEx calls; the process named alongside
    them is the destination of the write. Their presence indicates in-memory deobfuscation or injection rather than a benign
    command line and identifies which process now holds the decoded payload.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        event.dataset: endpoint.events.api
        process.Ext.api.name:
          - WriteProcessMemory
          - QueueUserAPC
          - SetWindowsHookEx
      condition: selection
    fields:
      - process.executable
      - process.Ext.api.name
      - Image
- question: Have other hosts fired this escaped-http pattern in the past week, and does the cross-host distribution look like
    consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the
    escaped "http" pattern rather than generic command-line activity. Many hosts firing the same pattern points to scripted
    deployment or a packaging tool that emits escaped command lines; one host or a small unrelated set points to manual
    operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - h^t^t^p
        - h"t"t"p
      condition: selection
    fields:
    - host.name
