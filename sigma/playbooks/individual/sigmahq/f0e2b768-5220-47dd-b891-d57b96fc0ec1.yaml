name: CSExec Service File Creation
id: e8b463d4-1f59-4601-bca9-559176f37bb2
description: |
  Detects creation of a file named csexecsvc.exe, the default service executable name used by CSExec, an open-source C#
  implementation of PsExec-style remote service execution. Deployment follows the PsExec pattern -- the operator copies the
  service binary to the target's ADMIN$ share over SMB, installs and starts it as a service through the remote service control
  manager, relays commands through the \pipe\csexecsvc named pipe, then uninstalls the service and deletes the binary on
  exit -- so this file appearing on a host indicates that host is the target of remote command execution. Determine which
  remote host and account delivered the binary, confirm whether the service was installed and started, recover what commands
  were relayed, and establish whether the same binary was written to other hosts.
type: detection
detection_id: f0e2b768-5220-47dd-b891-d57b96fc0ec1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the created file's name and path match the CSExec service binary this rule detects?
  context: Confirm the alert is a true positive by reviewing the exact file path, the operation performed, and the responsible
    process. The rule fires on any file path ending in \csexecsvc.exe. PsExec-style deployment writes the service binary
    into the directory backing the ADMIN$ share (the Windows directory); a matching filename in an unrelated location such
    as a downloads folder or development workspace changes the interpretation from active remote execution to tool staging
    or research.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - file_event
- question: Is remote service-based administration of this host expected, and is the associated account authorized for it?
  context: PsExec-style tools are used by both administrators and intruders, and the deciding factor is usually whether this
    host is a routine target of remote administration and whether the account behind the write is an authorized admin account.
    The query displays the triggering event's host, user, and writing process. Because the binary arrives over SMB, the recorded
    user is frequently SYSTEM or a machine account -- when it is, attribute the activity through the delivering SMB session
    and the host's role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is csexecsvc.exe still on disk, or was it deleted after the alert?
  context: CSExec uninstalls its service and deletes the service executable when the operator's session ends, so a deletion
    shortly after creation indicates the remote-execution session completed and cleaned up after itself -- it does not mean
    the activity was benign, and it shifts the investigation to what executed in between. A binary still on disk suggests
    an active or aborted session and can be retrieved for hashing and analysis.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Is the dropped file actually the CSExec service binary, or a different payload wearing its name?
  context: The rule matches on filename alone, so confirm the binary's identity before drawing conclusions. CSExec's service
    component is a small open-source .NET executable (built against .NET 3.5, 4.0, or 4.5) and is typically unsigned; retrieve
    the file from the endpoint and check its size, .NET metadata, strings, and signing status. Any payload can be named csexecsvc.exe
    to blend into an expected pattern -- a large, packed, or non-.NET binary under this name points to a different tool hiding
    behind the CSExec convention.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
- question: What process wrote csexecsvc.exe to disk, and is that consistent with remote SMB delivery?
  context: The writing process reveals the delivery mechanism. A copy pushed over the ADMIN$ share is performed by the kernel
    on behalf of the SMB server, so the writer appears as the System process -- that is the expected signature of PsExec-style
    remote deployment. A local writer instead, such as an interactive shell, browser, archiver, or scripting host, means
    the binary was staged on this host directly and the operator may already have a local foothold rather than acting remotely.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - ParentImage
      - CommandLine
      - User
  answer_sources:
  - process_creation
- question: Which remote host held an SMB session to this machine when the service binary was written?
  context: The entire CSExec workflow rides SMB sessions from the operator's machine -- the file copy to the admin share,
    the remote service control manager calls, and the command relay over the \pipe\csexecsvc named pipe. Inbound connections
    to port 445 in the window around the write identify the source host; compare it against the systems approved to perform
    remote administration of this machine. If endpoint network telemetry does not capture inbound sessions in this environment,
    treat zero results as a visibility gap and identify the source from SMB session data or network sensor records instead.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'false'
        DestinationPort: 445
      condition: selection
    fields:
      - SourceIp
      - SourcePort
      - Image
      - User
  answer_sources:
  - network_connection
  - organizational_knowledge
- question: Was a csexecsvc service registered in the Services registry hive around the file write?
  context: Installing the service through the remote service control manager creates a key under HKLM\SYSTEM\CurrentControlSet\Services\csexecsvc
    whose ImagePath value points at the dropped executable -- a write to that key confirms the deployment progressed from
    file copy to service installation. Legitimate service-install allowlists never include this name. CSExec removes the
    service on exit, so the key may already be gone by review time; the registry write event itself remains the durable evidence
    of installation.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Services\csexecsvc'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - registry_event
- question: Was the dropped service binary executed, and does its hash have known threat intel detections?
  context: A file's hash is recorded when it runs, not when it is written. A service start appears as services.exe spawning
    csexecsvc.exe, typically within seconds of the file copy -- execution confirms the deployment reached its goal, and the
    parent should be services.exe for a genuine service launch. Read the hash from the execution event and check it against
    threat intelligence; public CSExec builds are widely known, while an unknown hash points to a custom or modified build.
    If the binary is present but never executed, retrieve it from disk and hash it manually.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - ParentImage
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: What commands were relayed through the CSExec service?
  context: Once started, the service receives commands over its named pipe and launches them as child processes -- each child
    of csexecsvc.exe is a command the remote operator ran on this host, and the equivalent of running psexec with the -s
    flag executes those children as SYSTEM. The children and their command lines are the most direct record of what the operator
    actually did; reconnaissance commands, credential tooling, or an interactive cmd.exe each set a different scope for the
    rest of the investigation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
  answer_sources:
  - process_creation
  - manual_review
- question: What other files did the writing process create or delete around the alert?
  context: An operator with an authenticated admin session often delivers more than one tool over the same channel. Because
    SMB-delivered writes are performed by the System process, this window can include other binaries pushed over admin shares
    in the same session -- additional executables landing in system paths around the alert enumerate the rest of the toolkit
    and any output files staged for retrieval.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: Has csexecsvc.exe been written to other hosts in the environment?
  context: PsExec-style tools execute against one target per invocation, so the same service binary appearing on multiple
    hosts within a day maps the operator's movement across the environment. Order the hosts by first-write time to reconstruct
    the sequence, and treat each host on the list as a target of the same remote-execution activity until shown otherwise.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user -- the result is the user's 90-day history
    of csexecsvc.exe file writes (not generic file activity), aggregated by host. Prior history is plausible only for administrators
    or assessment staff who have adopted this tool; for anyone else a first-ever occurrence is the deviation worth chasing.
    When the write was recorded under SYSTEM or a machine account, the parent-scoped variant of this baseline is the meaningful
    one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: \csexecsvc.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
  - organizational_knowledge
- always_include: true
  question: Has this program historically driven the rule's pattern on this host or across the environment, or is
    the program new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior. The meaningful pivot
    is the launch mechanism: the query mirrors the rule''s selection structure scoped to the alerting program, so
    the result is the 90-day history of this program driving csexecsvc.exe writes (not generic use of the binary). A new or
    rare program for this pattern is the deviation worth chasing; a program that already accounts for many prior events points
    to recurring automation that should be identified and verified.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: \csexecsvc.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
- always_include: true
  question: What else did this user do across the network around this time?
  context: The account behind a PsExec-style deployment is an authenticated admin credential, and tracking its process activity
    across all hosts in the alert window shows whether the same credential is being used to work through multiple endpoints
    -- remote-execution utilities, credential tooling, or archiving binaries appearing on other hosts under this account
    widen the scope. If the account is a service principal, this view fills with routine agent noise and the parent-driven
    variant of this question is the meaningful one.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window, or is the activity isolated to this
    host?
  context: 'Under a service principal, user-scoped clustering returns agent-telemetry noise (every host runs SYSTEM-owned
    agents constantly). The meaningful question is whether the same launch mechanism produced the rule''s pattern elsewhere:
    the query mirrors the rule''s selection scoped to the alerting program, fleet-wide, in the alert window. Several
    hosts receiving csexecsvc.exe in the same window points to scripted deployment against a target list; a single host points
    to a one-off session against this machine.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: \csexecsvc.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
- question: What other process activity occurred on this host around the time of the alert?
  context: A remote-execution deployment seldom happens in isolation -- the surrounding minutes often contain the commands
    the operator ran, follow-on tool launches, and persistence installation. The aggregation collapses repetitive platform
    noise into high-count rows so novel parent-child pairs stand out at low counts; unfamiliar binaries or service-spawned
    shells are what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: 'Earlier detections on the same host may reveal the stages that led to this deployment: credential access on another
    system supplies the admin credential a PsExec-style tool needs, and reconnaissance or lateral-movement alerts on the source
    network commonly precede the file copy. Review the alert sequence for a progression from credential access through remote
    execution on this host.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
