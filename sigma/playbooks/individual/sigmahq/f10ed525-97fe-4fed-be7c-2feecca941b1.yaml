name: Persistence Via Hhctrl.ocx
id: ecec06b2-d8a8-4564-a5a0-16947252b5b7
description: |
  Detects a registry write that changes the (Default) value of CLSID\{52A2AAAE-085D-4187-97EA-8C30DB990436}\InprocServer32 —
  the COM registration hh.exe (HTML Help) uses to locate the hhctrl.ocx library — to any path other than the legitimate
  C:\Windows\System32\hhctrl.ocx. Whatever library the value points to is loaded into hh.exe every time HTML Help starts,
  so redirecting it to an attacker-controlled module is a COM-hijack persistence mechanism that leaves no Run key, service,
  or scheduled-task artifact and activates whenever a .chm file is opened or an application invokes help. This registration
  changes essentially never outside OS servicing, so the investigation should confirm what path was written, which process
  wrote it and what launched that process, whether the configured library exists on disk and was subsequently loaded, and
  whether additional persistence was staged in the same session.
type: detection
detection_id: f10ed525-97fe-4fed-be7c-2feecca941b1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting registry write set the hhctrl.ocx COM registration to a non-standard library path?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a value whose path
    contains \CLSID\{52A2AAAE-085D-4187-97EA-8C30DB990436}\InprocServer32\(Default) is written AND the value data is
    anything other than C:\Windows\System32\hhctrl.ocx. Review the exact TargetObject, the Details value data, and the
    writing process on the triggering event. Details is populated on roughly 79% of endpoint registry modifications;
    if it is absent, read the key directly on the host to confirm what the value now points to.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user or host expected to modify COM class registrations for the HTML Help control?
  context: >-
    This registration is normally touched only by OS servicing or component re-registration, so there is rarely a
    routine explanation — the rule's own false-positive expectation is "unlikely". Establish whether the account has an
    administrative role and whether the host was undergoing any sanctioned maintenance. User attribution is present on
    roughly 94% of endpoint registry events; when it is a machine account, SYSTEM, or missing, pivot on the writing
    process (Image) instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Was there a change ticket, maintenance window, or documented deployment covering this registry change?
  context: >-
    Legitimate rewrites of this COM registration are rare, but OS component servicing, help-system repairs, or imaging
    scripts could plausibly touch it under a documented change. A corresponding ticket or deployment record suggests
    authorized activity; the absence of one for a modification to a rarely-touched system registration supports the
    unauthorized-change interpretation and speeds escalation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the user or an administrator recall any activity that would rewrite this help-viewer registration?
  context: >-
    Direct confirmation from the human behind the account is often the fastest path to a verdict. If the write occurred
    under a user account, ask whether they installed, repaired, or re-registered any software around the alert time and
    what they were trying to accomplish. If the write occurred under SYSTEM or a service account, ask the responsible
    team whether any maintenance or deployment job ran. No recollection of relevant activity points toward compromised
    credentials or automated malware.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What path was written to the InprocServer32 value, and why is this key a persistence location?
  context: >-
    When hh.exe starts it resolves the hhctrl.ocx library through CLSID\{52A2AAAE-085D-4187-97EA-8C30DB990436}\InprocServer32
    and loads whatever library the (Default) value names. A rewritten value therefore executes attacker code inside
    hh.exe on every HTML Help launch — an in-process COM hijack that needs no Run key, service, or scheduled task. The
    only expected value data is C:\Windows\System32\hhctrl.ocx; anything else, together with the writing process shown
    here, defines what the hijack would execute and who planted it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What library path does the new value data point to, and does that location look attacker-controlled?
  context: >-
    Analyze the Details field as a file path. User-writable directories (AppData, Temp, ProgramData, Users\Public), UNC
    paths, and masquerading names — such as a file named hhctrl.ocx sitting outside System32 — all point to a planted
    payload, while an OS-servicing path variant is more consistent with maintenance. The decoded path becomes the
    artifact for the on-disk and library-load checks. If Details is empty on the alert (binary or empty value data),
    read the key directly on the endpoint to recover the configured path.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote the new InprocServer32 value, and is its parent chain expected?
  context: >-
    The registry event's writing process is the alert's ProcessGuid; this query retrieves that process's own creation
    record with its command line and parent. A registry editor or script host launched from a document, browser
    download, or unfamiliar dropper points to malicious delivery, while an installer or servicing process under a
    deployment framework points to sanctioned change. Long-running parents can start hours or days before the alert,
    which is why the lookup window is wide.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Was the library configured in the hijacked value subsequently loaded?
  context: >-
    An InprocServer32 hijack executes as a library load inside hh.exe (or any process instantiating the class) — the
    payload never appears as a new process of its own, so library-load telemetry is the direct evidence of activation.
    A load event for the configured path confirms the persistence fired and carries the module's signer status and hash
    for reputation checks. If value data was absent on the alert, review libraries loaded by hh.exe in the same window
    instead.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%Details%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
      - Signature
      - Hashes
- question: Did hh.exe run on this host after the registry change?
  context: >-
    The hijack activates when HTML Help starts — a user opening a .chm file, an application invoking help, or the
    attacker launching hh.exe deliberately to trigger the payload. Executions of hh.exe after the write mark when the
    configured library would have loaded, and the parent process distinguishes an interactive user action from a
    scripted or attacker-forced trigger. No hh.exe execution means the persistence is planted but not yet activated.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\hh.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Was the library referenced by the new value dropped to disk in the same session?
  context: >-
    The hijack only fires if a loadable library exists at the configured path, and the payload commonly lands moments
    before or after the registration is written. This query correlates file activity from the registry-writing process
    and its children — look for a file creation matching the path decoded from the value data. File-write events carry
    no hash; if the payload is present, hash it from the library-load event or retrieve the file for a reputation
    lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Were other registry modifications made on this host in the same session?
  context: >-
    Attackers who plant one COM hijack often make several registry changes in the same session — additional CLSID
    hijacks, Run keys, service configuration, or security-setting changes. Clusters of modifications from the same
    writing process within a short window reveal the full scope of the configuration change. The triggering key will
    appear in these results; the signal is what ELSE was modified. If the host is registry-noisy, narrow to the
    alerting write's process or to security-relevant paths (Run, Services, Policies, Winlogon, CLSID).
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    The registry write rarely happens in isolation — a dropper writing the payload library, a script host driving the
    change, or follow-on hands-on activity typically executes in the same window. Aggregating by parent/child image
    pairs collapses repetitive agent noise into high-count rows while novel low-count pairs stand out; scan those for
    loaders, archive extractors, script interpreters, and unfamiliar binaries.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Has this hhctrl.ocx COM registration been modified before on this host?
  context: >-
    This value should essentially never change outside OS servicing, so zero prior history makes the alerting write a
    first-touch event on this host. If past modifications exist, compare their Details values and writing processes
    with the alerting event — a recurring identical write from a known servicing process suggests maintenance, while a
    new path from a different writer indicates fresh tampering.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Does this host normally run the process that wrote the registry value?
  context: >-
    A writing process with no execution history on this host is more consistent with a freshly dropped tool than with
    routine software, while a binary that runs regularly points to an existing application or agent making the change.
    If the writer is a ubiquitous utility (reg.exe, powershell.exe, msiexec.exe), frequency alone is not meaningful —
    judge legitimacy from its command line and parent chain instead.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Was the same hhctrl.ocx registration modified on other hosts in the environment?
  context: >-
    The same rewrite appearing on multiple hosts points to a software deployment, an imaging artifact, or a widespread
    implant, while a single-host modification is more consistent with targeted activity. Compare the Details values
    across hosts — identical non-standard paths on many machines suggest one distribution mechanism; differing paths
    suggest independent tampering.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Were other persistence mechanisms installed on this host around the same time?
  context: >-
    Attackers rarely rely on a single foothold. After planting a COM hijack, they commonly add backup mechanisms
    through different techniques — scheduled tasks, services, Run keys, BITS jobs, or WMI subscriptions — using tools
    like schtasks, sc, reg, bitsadmin, or wmic. Multiple persistence installations in the same timeframe indicate
    deliberate stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or other persistence locations on this host?
  context: >-
    File-based persistence complements a registry hijack without touching persistence tooling — dropping an executable
    or script into a Startup folder achieves execution at logon with no schtasks, sc, or reg invocation. File-event
    monitoring captures these drops even when the actor avoids standard persistence utilities, so this check widens
    coverage beyond the detected COM registration change.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — initial-access activity, defense tampering, reconnaissance, or credential
    access — may reveal the attack stages that preceded this persistence installation and help reconstruct the full
    timeline. Persistence typically follows execution and precedes lateral movement, so the alert sequence indicates
    how far the activity has progressed.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
