name: ImagingDevices Unusual Parent/Child Processes
id: 695349a7-9426-405c-a411-fe54483061e9
description: |
  Detects ImagingDevices.exe (the Windows Contacts imaging helper) in an unusual parent-child relationship. The rule
  fires when EITHER ImagingDevices.exe is spawned by WmiPrvSE.exe, svchost.exe, or dllhost.exe, OR ImagingDevices.exe
  itself spawns a child process. Legitimately, ImagingDevices.exe is launched by user interaction with scanner or camera
  hardware and rarely spawns children; the parent set above is associated with WMI/COM process injection that hollows a
  benign signed binary to evade parent-child detection. Determine which branch fired, whether the parent-child pairing is
  routine on this host, and what the involved process did after the alert.
type: detection
detection_id: f11f2808-adb4-46c0-802a-8660db50fa99
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the alerting event match either ImagingDevices.exe spawned by WmiPrvSE/svchost/dllhost, or ImagingDevices.exe spawning a child?
  context: >-
    The rule fires on one of two branches. The parent branch matches when ImagingDevices.exe (Image) has a parent of
    WmiPrvSE.exe, svchost.exe, or dllhost.exe. The child branch matches when ImagingDevices.exe is the ParentImage of
    another process. Read Image and ParentImage on the alerting event and note which branch fired, because that determines
    which downstream questions carry weight — the parent branch points at injection into ImagingDevices.exe, while the
    child branch points at code already running inside it reaching out to spawn tools.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
- question: Is this user and host expected to interact with imaging or scanner hardware?
  context: >-
    ImagingDevices.exe is the Windows imaging helper launched when a user works with a scanner or camera. A workstation
    with attached imaging hardware and a user who scans documents is a plausible benign source; a server or a host with no
    imaging hardware running this binary, especially under the injection parent set, is harder to explain as routine use.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this parent expected to spawn this child, and what started the parent itself?
  context: >-
    The parent-child relationship is the core signal. Trace the parent's own origin to see whether the chain is benign
    (user launched imaging from a known application) or unusual (a service host or COM surrogate spawned ImagingDevices.exe,
    consistent with WMI/COM injection into a signed binary). When ImagingDevices.exe is the parent, the grandparent shows
    what started the injected process before it spawned the alerting child.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did the same parent spawn?
  context: >-
    If the parent in this alert spawned the detected process, it may have spawned others. Examining siblings reveals the
    full scope of activity from that parent instance. Multiple tool-like children from the same parent — reconnaissance,
    credential access, or transfer utilities — points to orchestrated activity rather than an isolated event.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What is the parent process instance and why did it spawn this binary?
  context: >-
    Retrieving the parent's own creation event shows what started it and what it was doing when it spawned the alerting
    process. A WmiPrvSE.exe, svchost.exe, or dllhost.exe parent that spawned ImagingDevices.exe with no user-driven imaging
    activity is consistent with COM/WMI-driven injection. When ImagingDevices.exe is the parent, this shows how the imaging
    process was itself launched before it spawned a child.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: What did ImagingDevices.exe do on this host, and did it spawn or connect to anything?
  context: >-
    ImagingDevices.exe normally performs imaging-device work and does not spawn additional processes. Reviewing every
    ImagingDevices.exe execution on this host in a tight window around the alert surfaces whether the process behaved like a
    benign imaging helper or like an injected host that launched other tools. Pair this view with the children of the
    process to see what action followed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Has this parent-and-binary pairing been seen on this host before?
  context: >-
    Some parent-child pairings are routine; the ImagingDevices.exe pairings this rule targets are not. A pairing with zero
    or very low historical count on this host is a novel relationship and more suspicious than one that recurs regularly as
    part of normal imaging-hardware use.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \ImagingDevices.exe
      condition: selection
    fields:
      - ParentImage
- question: What other processes spawned from ImagingDevices.exe on this host after the alert?
  context: >-
    When code is running inside ImagingDevices.exe, it may launch several tools in sequence — discovery, credential access,
    or lateral movement utilities. Listing the children of the imaging process after the alert reveals the full scope of
    activity initiated through it.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: \ImagingDevices.exe
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What file or network activity surrounded the imaging process around the alert time?
  context: >-
    Beyond child processes, an injected host process may generate file writes or outbound connections. File events near the
    alert can reveal a dropped payload, while outbound connections to external addresses can reveal command-and-control
    traffic from the imaging process. Use the process identifier to tie this activity back to the alerting instance.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - Initiated
- question: Is this ImagingDevices.exe parent-child pattern occurring on other hosts?
  context: >-
    The same unusual ImagingDevices.exe pairing appearing across multiple hosts may indicate a phishing wave or lateral
    movement, whereas a single occurrence is more likely targeted. An environment-wide comparison helps calibrate the scope
    of the activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \ImagingDevices.exe
      condition: selection
    fields:
      - host.name
      - ParentImage
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith:
        - \WmiPrvSE.exe
        - \svchost.exe
        - \dllhost.exe
        Image|endswith: \ImagingDevices.exe
      selection_child:
        ParentImage|endswith: \ImagingDevices.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith:
        - \WmiPrvSE.exe
        - \svchost.exe
        - \dllhost.exe
        Image|endswith: \ImagingDevices.exe
      selection_child:
        ParentImage|endswith: \ImagingDevices.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts can reveal lateral movement or activity spanning multiple endpoints. If
    the same user triggered similar activity on several hosts, the scope of the activity may be larger than the single
    alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith:
        - \WmiPrvSE.exe
        - \svchost.exe
        - \dllhost.exe
        Image|endswith: \ImagingDevices.exe
      selection_child:
        ParentImage|endswith: \ImagingDevices.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining activity around the alert reveals what led to this event and what happened
    after. Aggregating by Image and ParentImage collapses repetitive agent telemetry into high-count rows while novel
    parent-child pairs stand out at low counts — those are what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the stages that
    preceded this event and help reconstruct the timeline. Injection into a signed binary is often a mid-chain step, so a
    preceding alert sequence can place this event in context.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
