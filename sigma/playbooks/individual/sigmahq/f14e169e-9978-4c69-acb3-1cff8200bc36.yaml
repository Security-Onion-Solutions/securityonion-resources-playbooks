name: Suspicious GrpConv Execution
id: 4db95ef8-37db-42d7-ab7c-0073be6c103f
description: |
  Detects execution of grpconv.exe with the -o switch (CommandLine contains 'grpconv.exe -o' or 'grpconv -o'). grpconv.exe is a legacy Windows utility for converting Windows 3.x program-group (.grp) files, but the -o (overwrite) mode reprocesses group definitions and can be abused for user-level persistence: an actor drops a crafted %userprofile%\setup.ini and launches 'grpconv.exe -o' so the conversion runs attacker-controlled commands at logon. Legitimate use is rare on modern systems, so the investigation should establish what spawned grpconv, what the conversion produced, and whether other autostart or persistence artifacts were planted on the host around the same time.
type: detection
detection_id: f14e169e-9978-4c69-acb3-1cff8200bc36
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- question: Does the command line match what this rule detects — does it contain 'grpconv.exe -o' or 'grpconv -o'?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line against the rule's criteria. The rule fires when the command line contains the grpconv overwrite switch; verify the '-o' flag is present and read the full invocation for additional arguments.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run grpconv.exe in overwrite mode?
  context: grpconv.exe converts legacy Windows 3.x program-group files and is essentially never run interactively on modern endpoints. Knowing whether the user role and host function would plausibly involve this legacy utility is often the fastest way to separate a routine quirk from operator-driven persistence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What process spawned grpconv.exe, and what started that parent?
  context: The parent-child relationship is the core legitimacy signal. Tracing the parent's own origin reveals whether grpconv ran from a normal user action (explorer.exe after a logon) or from a suspicious chain such as a script host, Office application, or a logon-triggered command that points to scripted persistence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did the same parent spawn around this time?
  context: If the parent that launched grpconv also spawned other processes, those siblings reveal the full scope of activity from that parent. Multiple related children from one parent in a tight window points to orchestrated activity rather than an isolated legacy-tool invocation.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What exactly did this grpconv invocation do — what arguments accompanied the -o switch?
  context: The full command line reveals the specific action. The -o (overwrite) mode reprocesses group definitions from %userprofile%\setup.ini, so decode every argument and note the working directory. The query scopes to all grpconv overwrite invocations on this host within the window so sequential or repeated runs surface together; pair it with reviewing the setup.ini contents, which the command line itself does not carry.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
          - 'grpconv.exe -o'
          - 'grpconv -o'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: When this host has previously fired the grpconv overwrite pattern, what parents and users drove it, and does the current alert fit?
  context: Even rarely-used tools have a baseline. This query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern has run here before. A new parent process, an unexpected account, or a first-ever occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - grpconv.exe -o
        - grpconv -o
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the grpconv overwrite pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: This query mirrors the rule's selection with no host scope, giving a fleet-wide count of the firing pattern rather than generic grpconv usage. Many hosts firing the same pattern suggests a scripted deployment or imaging artifact; one host or a small unrelated set points to manual operator activity. Use the host spread and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - grpconv.exe -o
        - grpconv -o
      condition: selection
    fields:
    - host.name
- question: What child processes did grpconv.exe spawn afterward?
  context: The processes a tool spawns reveal its actual impact. The overwrite mode can trigger conversion logic that launches further commands; unexpected children such as cmd.exe, powershell.exe, or script hosts shortly after grpconv ran indicate the conversion executed attacker-controlled actions rather than a benign file conversion.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\grpconv.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - grpconv.exe -o
        - grpconv -o
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - grpconv.exe -o
        - grpconv -o
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity on multiple endpoints. If the same user drove similar activity elsewhere in the same window, the scope of the persistence attempt may extend beyond this host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - grpconv.exe -o
        - grpconv -o
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Persistence is usually planted partway through an intrusion. Earlier detections on the same host — reconnaissance, credential access, or defense tampering — may reveal the stages that preceded the grpconv persistence attempt and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were Run or RunOnce autostart registry keys created or modified on this host around the time grpconv ran?
  context: T1547 autostart persistence frequently uses Run/RunOnce registry values in addition to, or instead of, the grpconv setup.ini path. Modifications to these keys in the same window indicate the actor stacked a registry-based autostart alongside the group-conversion mechanism. Review the writing process and the value data for the executable or script being launched at logon.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\CurrentVersion\Run'
          - '\CurrentVersion\RunOnce'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Was there a change ticket, maintenance window, or documented approval for this activity?
  context: Persistence-relevant changes typically require a change ticket in environments that track them. A corresponding ticket suggests authorized activity; the absence of one when policy requires it pushes the disposition toward unauthorized. Running a legacy conversion utility in overwrite mode is unusual enough that an approval trail is unlikely to exist for benign reasons.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this activity align with normal work hours and maintenance windows?
  context: Legitimate system changes typically occur during business hours or scheduled maintenance. A logon-triggered persistence mechanism firing off-hours, or outside any documented maintenance window, is more suspicious than the same activity during a known administrative session.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were other process-based persistence mechanisms installed on this host?
  context: Attackers rarely rely on a single persistence mechanism. Alongside the grpconv group-conversion path, they commonly install backups using scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions. Multiple persistence installations in the same timeframe indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations such as the Startup folder or scheduled-task definition paths on this host?
  context: File-based persistence bypasses command-line detection entirely. Dropping an executable or script into the Startup folder, or writing the setup.ini that grpconv -o consumes, achieves persistence without running standard persistence tools. File event monitoring captures these drops even when the actor avoids schtasks, sc, or reg.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
          - '\setup.ini'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
