name: Potential Dtrack RAT Activity
id: 3f185110-450a-48cf-ae2c-e7d1ef44fcca
description: |
  Detects three independent command-line patterns associated with Dtrack RAT reconnaissance, any one of
  which fires the rule on its own. The rule matches a command line that EITHER runs ping with -n and,
  within the next 6 to 64 characters, redirects an "echo EEEE" write, OR carries both "ipconfig /all"
  and the redirect target \temp\res.ip together, OR carries both "interface ip show config" and the
  redirect target \temp\netsh.res together. The two-string branches fire only when both strings are
  present in the same command line; a bare ipconfig /all or a bare netsh interface query does not match.
  Each branch is one step of a scripted host and network enumeration sweep that writes its output to
  files under the temp directory for later collection, typically driven by cmd.exe under a dropped
  loader rather than typed by an operator; the rule carries T1490 because the same tooling moves on to
  recovery inhibition ahead of file encryption. Establish which branch fired, decode the full command
  line and the file it redirects to, identify the parent that drove the sweep, and determine whether
  recovery-inhibiting commands, registry recovery changes, or encryption activity followed on the host.
type: detection
detection_id: f1531fa4-5b84-4342-8f68-9cf3fdbd83d4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Which of the rule's three command-line patterns does this event match, and does the full command line match that branch end to end?
  context: >-
    The rule fires when any ONE of three independent patterns matches, so establish which one before
    going further — the branch that fired determines what the event means and which follow-up carries
    weight. The command line matched EITHER ping with -n followed within 6 to 64 characters by an
    "echo EEEE" redirect, OR "ipconfig /all" together with the redirect target \temp\res.ip in the same
    command line, OR "interface ip show config" together with the redirect target \temp\netsh.res in the
    same command line. For the ping branch, the destination being pinged and the redirect target are the
    load-bearing details, since the echo write is a connectivity marker rather than an administrative
    check. For the two redirect branches, the enumeration itself is ordinary — ipconfig /all and netsh
    interface queries are routine support commands — and the pattern is the fixed output path under the
    temp directory, so confirm the redirect target is present verbatim and is not a coincidental
    substring in a longer script line.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run scripted network enumeration that redirects output to fixed temp-directory files?
  context: >-
    Interactive troubleshooting and inventory scripts both run ipconfig /all and netsh interface
    queries, so the enumeration alone does not separate routine work from an intrusion. What narrows it
    is the fixed output convention: a support engineer redirects to an ad-hoc path or reads output on
    screen, while the pattern here writes to the same hard-coded temp file every run. Check whether the
    account is a support or automation identity for this host and whether an inventory or monitoring job
    on this host is known to write these files.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What recovery-inhibiting commands were executed on this host after the enumeration?
  context: >-
    The enumeration sweep this rule matches is the staging step of a toolkit that also inhibits recovery
    before encrypting files, which is why the rule carries T1490. Recovery destruction is chained across
    several native utilities: shadow copy deletion via vssadmin or wmic, boot recovery disabling via
    bcdedit (bootstatuspolicy, recoveryenabled), backup catalog deletion via wbadmin, Recovery
    Environment disabling via reagentc, and diskshadow scripts. This query surfaces every such command on
    the host in the following 24 hours, whether the flag family is spelled /all, /quiet, -delete or
    /disable. Executed is not the same as succeeded — verify actual system state on the host with
    vssadmin list shadows, bcdedit /enum, reagentc /info and wbadmin get versions, and confirm the status
    of offline and off-host backup copies through the backup system itself.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\reagentc.exe'
          - '\diskshadow.exe'
      selection_cmdline:
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'recoveryenabled'
          - 'bootstatuspolicy'
          - 'delete catalog'
          - 'delete systemstatebackup'
          - 'boot.ini'
          - 'winre.wim'
          - '/disable'
      condition: selection and (selection_recovery or selection_cmdline)
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
  - edr_console
- question: What other destructive or recovery-inhibiting actions occurred on this host in the same window?
  context: >-
    Recovery inhibition rarely arrives alone — shadow copy deletion, recovery disabling, security service
    stopping and permission changes are run together, usually seconds to minutes apart from one script.
    This query aggregates the destructive utility family across a 30-minute window either side of the
    enumeration, which is the time correlation that separates one administrative command from a sequence.
    If every hit shares one parent, the actions came from a single script rather than from a person
    working through them.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_destructive:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\cipher.exe'
          - '\fsutil.exe'
          - '\icacls.exe'
          - '\takeown.exe'
          - '\attrib.exe'
          - '\sc.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\powershell.exe'
          - '\taskkill.exe'
      condition: selection and selection_destructive
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: Are there signs of file encryption, ransom notes, or unknown binary execution on this host after the enumeration?
  context: >-
    Enumeration output written to temp files is collected by the stage that runs next, and in this
    toolkit the encryption binary follows the recovery destruction by minutes to hours, commonly staged
    in the same temp tree as the recon output. This query lists processes on the host over the following
    30 minutes with well-known system paths filtered out, so unfamiliar executables, binaries launched
    from temp or user-writable directories, and command interpreters launching unknown children stand
    out. Also look for mass file renames, unusual extensions, and ransom-note file creation through file
    telemetry or an endpoint console.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_known:
        Image|startswith:
          - 'C:\Program Files'
          - 'C:\Windows\System32\svchost'
          - 'C:\Windows\System32\wbem'
      condition: selection and not filter_known
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: Is this same detection firing on other hosts in the environment?
  context: >-
    The same enumeration sweep run against many hosts in a short period points to operator-driven
    deployment with working credentials rather than a single infected endpoint, and the count of hosts
    plus the first-to-last timeline sets the containment boundary. This query looks for this rule firing
    anywhere in the environment in the hour either side of the alert, with no host filter.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
  answer_sources:
  - process_creation
  - alert
- question: What exactly did this command do, and what other enumeration output files did the same routine write on this host?
  context: >-
    Read the command line end to end rather than confirming the matched substring. Resolve the redirect
    target to its full path, note whether the shell used /c (run and exit, the scripted form) or /k, and
    for the ping branch record the destination address, since a hard-coded public address is a
    connectivity check for the operator rather than a check of a local resource. The enumeration is
    written as a set rather than a single command — interface configuration to \temp\res.ip, netsh
    interface state to \temp\netsh.res, process list to \temp\task.list, connection table to
    \temp\netstat.res, connectivity result to \temp\ping.res — so this query matches those output-file
    conventions and the echo marker across the host rather than scoping on the shell binary, which is far
    too common to scope on. The set of files that appears tells you how complete the sweep was and what
    the next stage was built to collect.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        CommandLine|contains:
          - '\temp\res.ip'
          - '\temp\netsh.res'
          - '\temp\task.list'
          - '\temp\netstat.res'
          - '\temp\ping.res'
          - 'echo EEEE'
      condition: selection and selection_recon
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned this command, and is that parent chain expected on this host?
  context: >-
    The rule matches on command-line content only, so the parent is where attribution starts. A shell
    driven by explorer.exe or by a remote-management agent during a support session reads very
    differently from one driven by an unfamiliar executable in a temp or profile directory, by a script
    host, or by a service host that does not normally spawn shells. This toolkit's recon typically runs
    as a child of a dropped loader, and the parent's own command line and working directory identify the
    file to retrieve for analysis. Parent-child pairing is also the tuning dimension for this technique:
    an enumeration or recovery command under a known monitoring or backup parent is a different finding
    from the same command under an unattributed one. Walk one more level up by querying the parent's own
    ParentProcessGuid if the parent itself is unexpected.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What child processes did this specific command spawn?
  context: >-
    A shell running redirected enumeration spawns the enumeration binary itself as a child, so the
    children of this exact process show which utilities actually ran and with what arguments — ipconfig,
    netsh, ping, tasklist or netstat, and anything the same shell was asked to run afterwards. The query
    anchors on this process instance rather than on the shell binary name, which would return unrelated
    shell activity across the host. Children that go beyond enumeration — an archiver, a transfer
    utility, or an unfamiliar executable from a temp path — mark where staging turned into collection or
    the next stage.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Were recovery or backup settings changed in the registry on this host after the enumeration?
  context: >-
    Recovery inhibition is not only done from the command line — System Restore can be turned off through
    DisableSR and DisableConfig, the Volume Shadow Copy, software shadow provider and backup services can
    be disabled by writing Start to their service keys, and BackupRestore policy keys can be edited to
    block restore paths. Those writes leave no process_creation trace when made through an API rather
    than a utility, so this query checks the registry side of the same behavior over the following 24
    hours. Read the written value alongside the key: a service Start value of 4 means disabled, and
    DisableSR set to 1 means restore point creation was turned off. Deletion of a key is not observable
    here, so treat re-modification history and the writing process as the evidence rather than expecting a
    removal event.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\SystemRestore\DisableSR'
          - '\SystemRestore\DisableConfig'
          - '\CurrentControlSet\Services\VSS\'
          - '\CurrentControlSet\Services\swprv\'
          - '\CurrentControlSet\Services\SDRSVC\'
          - '\CurrentControlSet\Services\vds\'
          - '\CurrentControlSet\Control\BackupRestore\'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - process_creation
  - manual_review
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Enumeration is a staging step, so the surrounding minutes usually carry the rest of the operation:
    the loader that dropped the tooling, the other recon commands in the same sweep, credential access,
    or the transfer of the collected output. Aggregating by binary and parent collapses repetitive
    background telemetry into single high-count rows, so novel parent-child pairs stand out at low
    counts — those are what to read first.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: When this host has previously produced the rule's pattern, what parents and users drove it, and does the current alert fit that history?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the parent and user
    distribution it returns reflects how this specific enumeration pattern has run here historically, not
    generic shell usage. A recurring inventory or monitoring job shows one consistent parent and account
    across the two weeks; a new parent, an account that has never produced this pattern, or an empty
    result against a host that runs the sweep constantly are each the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_ping:
        CommandLine|re: ping\s+-n.{6,64}echo EEEE\s?>\s?
      selection_ipconfig:
        CommandLine|re: ipconfig\s+/all
        CommandLine|contains: \temp\res.ip
      selection_netsh:
        CommandLine|contains|all:
        - interface ip show config
        - \temp\netsh.res
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the account's
    90-day history of this specific enumeration pattern across the environment, not generic use of a
    shell. An account that has never produced it is a different finding from one that produces it daily
    on the same maintenance hosts. Weigh the host list against the account's role: a support identity
    with a broad and stable host spread reads as its normal work, while a service or user account whose
    first occurrence is this alert does not.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_ping:
        CommandLine|re: ping\s+-n.{6,64}echo EEEE\s?>\s?
      selection_ipconfig:
        CommandLine|re: ipconfig\s+/all
        CommandLine|contains: \temp\res.ip
      selection_netsh:
        CommandLine|contains|all:
        - interface ip show config
        - \temp\netsh.res
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: Has this parent process historically driven the rule's pattern here or across the environment, or is the parent new for this activity?
  context: >-
    When the alert fires under SYSTEM, a service account or a machine account, the user field attributes
    nothing and the launch mechanism is the meaningful pivot. This query mirrors the rule's selection
    structure scoped to the alerting parent process, so it returns the 90-day history of that parent
    driving this exact enumeration pattern. A parent already responsible for thousands of prior events
    across many hosts is platform or vendor automation; a parent that appears for the first time with this
    alert is the deviation to chase, and its on-disk file is the artifact to retrieve.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_ping:
        CommandLine|re: ping\s+-n.{6,64}echo EEEE\s?>\s?
      selection_ipconfig:
        CommandLine|re: ipconfig\s+/all
        CommandLine|contains: \temp\res.ip
      selection_netsh:
        CommandLine|contains|all:
        - interface ip show config
        - \temp\netsh.res
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did this user do across the environment around this time?
  context: >-
    This asks what the account was doing right now on every host, not how often it has done this before.
    Credentials that work on more than one host are what turns a single staged endpoint into a
    multi-host operation, so a spread of hosts in the same hour — especially with shells, transfer
    utilities or remote-execution tooling among the binaries — sets the scope. If the alert fired under a
    service principal, expect this to return background agent telemetry, and read the parent-pivot view
    instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, asking what the account did across the environment returns background
    agent telemetry from every host. The answerable question is whether the same launch mechanism drove
    this pattern elsewhere in the alert window: this query mirrors the rule's selection structure scoped
    to the alerting parent, fleet-wide. Several hosts in the same window points to scheduled or pushed
    automation; a single host points to a host-local trigger and keeps the initial scope there.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_ping:
        CommandLine|re: ping\s+-n.{6,64}echo EEEE\s?>\s?
      selection_ipconfig:
        CommandLine|re: ipconfig\s+/all
        CommandLine|contains: \temp\res.ip
      selection_netsh:
        CommandLine|contains|all:
        - interface ip show config
        - \temp\netsh.res
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: Have other hosts produced the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of this enumeration pattern rather than of shell usage generally. A wide, even spread across
    many hosts points to a script or inventory job that happens to use the same fixed output paths, and
    that population can be confirmed and tuned out; a single host or a small set of unrelated hosts,
    particularly ones reached with the same account, points to operator-driven activity and is the
    population to work through.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_ping:
        CommandLine|re: ping\s+-n.{6,64}echo EEEE\s?>\s?
      selection_ipconfig:
        CommandLine|re: ipconfig\s+/all
        CommandLine|contains: \temp\res.ip
      selection_netsh:
        CommandLine|contains|all:
        - interface ip show config
        - \temp\netsh.res
      condition: 1 of selection_*
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Staging enumeration sits in the middle of an intrusion, not at its start, so earlier detections on
    this host often name the access path — an exploited service, a script host fetching a payload, a
    transfer utility pulling a second stage, or credential access. Read the alerts in time order to
    reconstruct what preceded the sweep and where the first foothold was, which is where containment and
    the hunt for other affected hosts should start.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
