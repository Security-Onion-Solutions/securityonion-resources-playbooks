name: Rundll32 Registered COM Objects
id: 88bdd666-355c-4663-82dc-ec4d44afaad6
description: |
  Detects rundll32.exe invoked with the -sta or -localserver switch together with a
  GUID-formatted CLSID argument (a string containing both { and }), the documented pattern
  for loading a registered COM object out of HKEY_CLASSES_ROOT\CLSID\<GUID>. Legitimate
  use of these switches is rare; the technique lets an attacker run code referenced by a
  hijacked or attacker-registered COM CLSID, providing both privilege escalation and
  persistence that survives reboots. Determine which COM object was loaded, what DLL or
  script the CLSID resolves to, who registered it, and whether the registration and load
  were authorized.
type: detection
detection_id: f1edd233-30b5-4823-9e6a-c4171b24d316
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the rundll32 command line carry -sta or -localserver with a CLSID GUID?
  context: Confirm the alert is a true positive by reviewing the exact command line. The
    rule fires when rundll32.exe (by Image or OriginalFileName) runs with -sta or
    -localserver AND the command line contains both { and }, the GUID delimiters of a
    CLSID. Note which switch fired and capture the full GUID for the registry and DLL-load
    follow-ups.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to load registered COM objects via rundll32?
  context: COM-object loading through rundll32 -sta or -localserver is not a routine
    end-user action. Knowing whether the account is a developer or administrator who works
    with COM components, and whether the host runs software that legitimately self-invokes
    this pattern, is often the fastest way to separate a true positive from sanctioned
    activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What CLSID did rundll32 load, and does that GUID resolve to a legitimate COM
    object?
  context: The full command line reveals the specific CLSID passed to -sta or -localserver.
    Extract the GUID between the braces and resolve it against HKEY_CLASSES_ROOT\CLSID\<GUID>
    to learn which DLL or script the COM object points to. A CLSID resolving to a DLL or
    .sct script under a user-writable path, or one with no legitimate registered owner,
    indicates the loaded component is attacker-controlled. This query returns every -sta or
    -localserver COM-load invocation of rundll32 on the host in the window so multiple
    sequential loads are visible together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains:
          - '-sta '
          - '-localserver '
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Was this rundll32 instance executed from its canonical System32 or SysWOW64
    path?
  context: Legitimate rundll32 runs from C:\Windows\System32\rundll32.exe or
    C:\Windows\SysWOW64\rundll32.exe. A copy running from a temp, profile, or other
    user-writable directory, or one whose OriginalFileName is RUNDLL32.EXE while the on-disk
    name differs, suggests the binary was relocated or renamed to evade path-based
    allowlists.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: What process spawned this rundll32, and what started that parent?
  context: The parent process attributes how the COM load was launched. Explorer.exe or a
    user shell points toward interactive activity; an Office application, a script host
    (wscript, cscript, mshta), or a freshly written binary as the parent points toward
    macro or downloader-driven execution. Tracing the parent's own origin reveals whether
    the chain is legitimate or part of an intrusion.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did the same parent spawn around this time?
  context: If the parent that launched rundll32 was operator- or malware-driven, it likely
    spawned other processes too. Multiple children from the same parent in a short window
    reveals the full scope of activity and distinguishes a single COM load from an
    orchestrated sequence of staging, execution, and persistence steps.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Was the loaded CLSID newly registered or modified under the user or machine
    CLSID hive on this host?
  context: COM hijacking works by writing a CLSID entry whose InprocServer32 or
    LocalServer32 value points to an attacker-controlled DLL or script. Placement under
    HKEY_CURRENT_USER\Software\Classes\CLSID overrides the default HKLM mapping without
    admin rights. A registry change to the same CLSID the rule fired on, especially shortly
    before the load, ties the load to a deliberate hijack rather than a benign registered
    component. If registry-set events are not collected in this environment, resolve the
    CLSID manually and inspect its InprocServer32 and LocalServer32 values directly.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\Software\Classes\CLSID\'
          - '\CLSID\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What modules did this rundll32 process load, and are any from a non-standard
    path?
  context: After rundll32 resolves the CLSID it loads the backing DLL into its own process.
    Correlating the load with the CLSID registry mapping confirms which module actually ran.
    A module loaded from a temp, profile, or other user-writable directory, or one that is
    unsigned, is the payload the COM registration points to. If image-load events are not
    collected in this environment, recover the backing module from the CLSID's
    InprocServer32 value instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- question: What other activity occurred on this host around the time of the alert?
  context: A COM-object load rarely stands alone. Aggregating process activity in the
    surrounding window collapses repetitive agent noise into high-count rows while novel
    parent-child pairs stand out at low counts, surfacing the reconnaissance, staging, or
    additional persistence that bracketed the load and establishing how the registry change,
    the COM load, and any follow-on execution line up in time.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      selection_cli:
        CommandLine|contains:
        - '-sta '
        - '-localserver '
        CommandLine|contains|all:
        - '{'
        - '}'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      selection_cli:
        CommandLine|contains:
        - '-sta '
        - '-localserver '
        CommandLine|contains|all:
        - '{'
        - '}'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the account's activity across all hosts in the window reveals lateral
    movement or parallel activity on multiple endpoints. The same user driving similar
    activity on several hosts widens the apparent scope of the operation.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      selection_cli:
        CommandLine|contains:
        - '-sta '
        - '-localserver '
        CommandLine|contains|all:
        - '{'
        - '}'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: When this host previously fired this rundll32 COM-load pattern, what parents and
    users drove it, and does the current alert fit?
  context: Even a tool that fires occasionally has a normal pattern. The query mirrors the
    rule's selection scoped to this host, so the parent and user distribution reflects how
    this specific firing pattern has historically run here. A new parent process, an
    unexpected account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      selection_cli:
        CommandLine|contains:
        - '-sta '
        - '-localserver '
        CommandLine|contains|all:
        - '{'
        - '}'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: How often has this host fired this rundll32 COM-load pattern over the past 90
    days, and what command-line structures are typical?
  context: A COM-load pattern with no prior history on a host is more notable than one used
    regularly under stable parents. The query mirrors the rule's selection scoped to this
    host, so the count reflects this specific firing pattern rather than all rundll32 usage.
    The command-line projection lets the alerting invocation be compared against the typical
    patterns.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      selection_cli:
        CommandLine|contains:
        - '-sta '
        - '-localserver '
        CommandLine|contains|all:
        - '{'
        - '}'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- question: Have other hosts fired this rundll32 COM-load pattern in the past week, and does
    the spread look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a
    fleet-wide count of this firing pattern rather than generic rundll32 usage. Many hosts
    firing the same pattern points to scripted deployment or vendor automation; one host or a
    small unrelated set points to manual operator activity. Use the host spread and parent
    consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      selection_cli:
        CommandLine|contains:
        - '-sta '
        - '-localserver '
        CommandLine|contains|all:
        - '{'
        - '}'
      condition: all of selection_*
    fields:
    - host.name
- question: Were any other proxy-execution LOLBins used on this host recently?
  context: Operators who proxy code through one signed binary often reach for several. If
    rundll32 loaded a COM object, check whether regsvr32, mshta, msbuild, installutil, or
    similar proxy-execution binaries also ran in the surrounding day. Multiple proxy-execution
    LOLBins working toward the same goal strengthens the case for hands-on activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Were other process-based persistence mechanisms installed on this host around
    this time?
  context: A COM CLSID hijack is one persistence foothold; attackers commonly stack backups
    using different techniques. Scheduled tasks, services, registry Run keys, BITS jobs, or
    WMI subscriptions created in the same window indicate intentional stacking rather than
    isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
