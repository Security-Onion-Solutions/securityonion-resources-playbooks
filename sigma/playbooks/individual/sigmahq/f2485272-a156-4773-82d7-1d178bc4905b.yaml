name: Suspicious Service Installed
id: a858a7a5-90c9-4cfc-9caf-d1f90ba1b96a
description: |
  Detects a registry write that sets the ImagePath of the NalDrv or PROCEXP152 service
  (HKLM\System\CurrentControlSet\Services\NalDrv\ImagePath or
  HKLM\System\CurrentControlSet\Services\PROCEXP152\ImagePath), excluding the routine case where a
  known Sysinternals binary (procexp, procmon, handle variants) writes the standard
  \WINDOWS\system32\Drivers\PROCEXP152.SYS path. These service names belong to well-known drivers —
  the Process Explorer kernel helper and an Intel network-adapter diagnostic driver — and
  re-pointing their ImagePath at another binary is how kernel-driver-abuse tooling loads a signed
  but vulnerable driver, and through it unsigned kernel code that can hook the syscall used to
  report ETW events, silencing ETW-based endpoint telemetry and the Windows event log without unloading them. Investigate the
  configured driver path, the process and command that wrote it, whether a driver loaded on the
  host afterward, and whether event telemetry from the host went quiet. The service names are
  trivially renamed, so the absence of other named hits does not clear the host.
type: detection
detection_id: f2485272-a156-4773-82d7-1d178bc4905b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting registry write set the NalDrv or PROCEXP152 service ImagePath?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when
    TargetObject is HKLM\System\CurrentControlSet\Services\NalDrv\ImagePath or
    HKLM\System\CurrentControlSet\Services\PROCEXP152\ImagePath, and does not fire when a known
    Sysinternals binary (procexp.exe, procexp64.exe, procexp64a.exe, procmon.exe, procmon64.exe,
    procmon64a.exe, handle.exe, handle64.exe, handle64a.exe) writes a Details path containing
    \WINDOWS\system32\Drivers\PROCEXP152.SYS. An alert therefore means either an unexpected writing
    process or a driver path other than the standard system32 location — note which service key was
    written and what path the Details field carries.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to run Sysinternals tools or install driver services?
  context: >-
    Administrators and analysts who run Process Explorer, Process Monitor, or Handle routinely
    create the PROCEXP152 service, and hosts with Intel diagnostic tooling can carry NalDrv — the
    detected write only stands out when the account and host do not fit that profile. Installing a
    kernel service requires administrative rights, so also note whether this account should hold
    them. User attribution is present on roughly 94% of endpoint registry events; when it is a
    machine account or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which service key was targeted, and what does its ImagePath control?
  context: >-
    HKLM\System\CurrentControlSet\Services\<name>\ImagePath tells the Service Control Manager which
    binary to load for that service; for a kernel service it is the driver that enters the kernel
    when the service starts. NalDrv and PROCEXP152 are names owned by well-known tools — an Intel
    network-adapter diagnostic driver and the Process Explorer helper driver — which is exactly why
    loader tooling reuses them: a familiar service name blends into routine administrative
    telemetry. The key path, value data, and writing process together identify what was configured
    to load.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What driver path was written to the ImagePath value, and is it a standard drivers location?
  context: >-
    The Details field holds the configured binary path, often in \??\C:\... or \SystemRoot\ form —
    normalize it and judge the location. The legitimate value for PROCEXP152 is
    \WINDOWS\system32\Drivers\PROCEXP152.SYS; a path under Temp, AppData, ProgramData, a user
    profile, or a network share is a planted driver, and that path becomes the artifact to chase in
    file and driver-load telemetry. Details is present on roughly 79% of endpoint registry
    modifications and is absent mainly for binary or empty value data, so for this string value it
    should be populated.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What command wrote the service ImagePath, and which logging mechanism does it target?
  context: >-
    The registry event carries no command line, so pivot to the writing process by its ProcessGuid
    to read the full command that made the change. A Service Control Manager-brokered install
    surfaces as services.exe, with the requesting client (sc.exe create/config, PowerShell
    New-Service, or a loader tool acting directly) behind it. The control targeted by this hijack
    pattern is event reporting itself: the driver loaded through the re-pointed service hooks the
    NtTraceEvent syscall so ETW-based endpoint telemetry and the Windows event log stop receiving events while the system
    keeps running.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process wrote this ImagePath, and is its parent chain expected?
  context: >-
    The writing process and its lineage reveal how the service was installed. A legitimate
    Sysinternals launch shows the tool binary itself writing the value from an interactive session
    under explorer.exe; a loader dropped by an earlier stage shows an unfamiliar binary, a script
    host, or a command shell in the chain. If the writer is services.exe the write was brokered by
    the Service Control Manager and the interesting party is the client that requested it — check
    the surrounding process activity on the host for the requesting command.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
- question: Was a driver file written to disk on this host around the time of the ImagePath change?
  context: >-
    The configured driver has to exist on disk before the service can load it, so loader tooling
    stages a .sys file — the signed vulnerable driver, and sometimes an unsigned payload alongside
    it — shortly before or after creating the service. Compare the .sys writes in this window
    against the path carried in the registry value data; a driver written to Temp, AppData, or
    ProgramData by a non-installer process is the staged artifact. File writes carry no hash in
    this telemetry — judge by path and writing process here, and use the driver-load question for
    signature evidence.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: '.sys'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did a kernel driver load on this host after the ImagePath was written?
  context: >-
    The re-pointed service exists to load the configured driver, so a driver load whose path
    matches the value data confirms the change took effect. In this hijack pattern a validly signed
    but vulnerable driver loads first and unsigned code is mapped into the kernel through it, so a
    clean signature does not clear a load — judge each by path, prior presence on the host, and
    signature status. Registry deletions are not observable in this telemetry, so whether the
    change "stuck" is judged from this load evidence and the key's re-modification history rather
    than from any cleanup event.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - ImageLoaded
      - Signature
      - SignatureStatus
- question: Is event telemetry from this host still flowing, or did reporting go quiet after this write?
  context: >-
    The driver loaded through this hijack suppresses the syscall that reports ETW events, so
    ETW-based endpoint telemetry and the Windows event log stop emitting while processes keep running — and the hook can be
    toggled, so gaps may be intermittent rather than total. Compare the host's event flow after the
    alert against its normal volume through the endpoint console or direct host inspection; a host
    that appears healthy but has stopped producing expected process and log events is the failure
    mode this tooling creates, and telemetry should be verified restored before trusting later
    queries.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What activity was recorded on this host in the hour after the ImagePath was written?
  context: >-
    Blinding event reporting is a means to an end — credential dumping, payload execution, or
    other actions the actor wants unrecorded typically follow. Examining the recorded activity
    after the write shows what the tampering enabled, but interpret the volume carefully: if the
    suppression took effect, the record itself may be sparse or truncated, and an abnormally quiet
    window on an otherwise active host is a signal rather than an all-clear. The correlation
    window links the registry edit to the activity, or the silence, that followed.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense-tampering actions performed on this host?
  context: >-
    An actor who suppresses event reporting often weakens several controls in the same operation —
    stopping security services, clearing logs already written, disabling real-time protection, or
    deleting shadow copies. Additional tampering commands from the same user or writing process
    indicate multiple controls were targeted together rather than a single configuration change.
    Commands issued while the reporting hook was active will simply be missing from this window,
    so pair the results with the telemetry-health check.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: What other registry modifications were made on this host in the same window?
  context: >-
    Creating a kernel service writes several values under the same Services\<name> key — Type,
    Start, ErrorControl, ImagePath — so sibling writes to the alerting key are expected and confirm
    a full service registration rather than a stray edit. The signal is what else changed: a second
    service name, Run keys, security policy values, or other Services entries landing in the same
    window point to a hands-on session or an installer-style implant pursuing several objectives at
    once. If the host is registry-noisy, narrow to the writing process from the alert.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Were other service ImagePath values on this host set to paths outside standard system locations?
  context: >-
    NalDrv and PROCEXP152 are only the well-known defaults for this loading technique — renaming
    the service defeats the name-based detection entirely, which is why the rule authors rate it
    bypassable. Sweeping all service ImagePath writes whose configured binary sits outside
    system32, syswow64, or Program Files surfaces the same pattern under any name: a service or
    driver configured to load from Temp, AppData, ProgramData, or a user profile deserves the same
    scrutiny as the alerting key.
  range: +/-24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\CurrentControlSet\Services\'
        TargetObject|endswith: '\ImagePath'
      filter_standard_paths:
        Details|contains:
          - 'system32\'
          - 'syswow64\'
          - '\Program Files'
      condition: selection and not filter_standard_paths
    fields:
      - TargetObject
      - Details
      - Image
- question: Has this service ImagePath been written before on this host?
  context: >-
    Hosts where administrators regularly run Process Explorer or Process Monitor accumulate routine
    PROCEXP152 ImagePath writes from those tools pointing at the standard system32 drivers path,
    and NalDrv appears where Intel diagnostic tooling is installed. Zero history makes this a
    first-time write and raises its weight; prior writes whose Details match today's value suggest
    routine tool usage, while a history of the standard path followed by today's different path is
    the deviation to explain.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A service hijack rarely happens in isolation — the loader had to arrive, elevate, and stage its
    driver first. Aggregating process activity in a tight window around the alert surfaces what led
    up to the write and what ran immediately after; novel parent-child pairs stand out at low
    counts against high-count routine telemetry. Look for archive extraction, script hosts,
    elevation utilities, or unfamiliar binaries executing near the registry change.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Installing a kernel service requires administrative rights, so earlier detections — privilege
    escalation, credential access, script execution, or other defense tampering — may show how the
    actor reached the position to make this write and help reconstruct the timeline. Defense
    tampering followed by quiet is a common progression for event-suppression tooling, so treat
    this alert as a potential midpoint of a sequence rather than its start.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was this service ImagePath modified on other hosts in the environment?
  context: >-
    Many hosts writing the standard Sysinternals driver path reflects widespread administrative
    tool usage and is expected in some environments. The same non-standard Details value appearing
    on several hosts points to the same loader being distributed — lateral movement or a deployment
    mechanism — while a single-host hit suggests targeted or hands-on activity. Compare the Details
    values and writing processes across hosts to separate the two.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Were other persistence mechanisms installed on this host in the same window?
  context: >-
    A service ImagePath survives reboot, so the hijacked service is itself a persistence point —
    and actors who establish one foothold commonly stack others using different techniques:
    scheduled tasks, additional services, registry Run keys, BITS jobs, or WMI subscriptions.
    Persistence tool executions clustered around the alert indicate intentional stacking rather
    than isolated administration; sc.exe invocations are particularly relevant here since
    sc.exe create or config binPath= re-points a service the same way this registry write does.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
