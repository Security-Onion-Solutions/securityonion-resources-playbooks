name: Uncommon  Assistive Technology Applications Execution Via AtBroker.EXE
id: fd1f5929-9b1b-45b2-9991-b76857335fd8
description: |
  Detects AtBroker.exe launching a non built-in assistive technology (AT) application. The rule fires when
  AtBroker.exe (by Image name or OriginalFileName) runs with a CommandLine containing "start" AND the AT name
  is not one of the known built-in accessibility features (Narrator, osk, magnifier, sticky keys, etc.) and is
  not the Java Access Bridge. AtBroker.exe is a signed Windows binary that proxies execution of ATs registered
  under the Accessibility registry keys, so an attacker can register a malicious binary as an AT and launch it
  through AtBroker to make the activity appear to originate from a legitimate signed OS process. Because
  AtBroker is normally spawned by winlogon.exe, the proxied payload inherits winlogon.exe in its lineage,
  defeating parent-process heuristics that expect user-launched processes to descend from explorer.exe.
  Determine which AT name was launched, whether it maps to a registered legitimate AT, and what the proxied
  process did next.
type: detection
detection_id: f24bcaea-0cd1-11eb-adc1-0242ac120002
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the AtBroker.exe command line start a non built-in assistive technology application?
  context: Confirm the alert is a true positive by reviewing the exact command line and process details.
    The rule fires only when AtBroker.exe (or a binary whose OriginalFileName is AtBroker.exe) runs with "start"
    in the command line AND the named AT is not one of the well-known built-in accessibility features and is not
    the Java Access Bridge. Read the AT name that follows "start" and confirm it is not an expected built-in.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to launch custom assistive technology applications via AtBroker.exe?
  context: Legitimate, non-default AT software (accessibility vendors, third-party magnifiers or readers) can
    trigger this rule on machines where users genuinely rely on those tools. Knowing whether the user role and
    host function are consistent with custom accessibility software is often the fastest way to separate routine
    use from a registered malicious AT.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which assistive technology name did AtBroker.exe start, and does it map to a registered legitimate AT?
  context: The AT name following "start" is the key indicator. AtBroker resolves that name against the
    Accessibility registry (the ATs key and the per-user Configuration value) and launches whatever executable
    path is registered for it. Decode the full command line, identify the AT name, then determine whether that
    name corresponds to a known legitimate accessibility product or to an attacker-registered entry pointing at
    an arbitrary binary. Scoping to all AtBroker.exe executions on this host within the window surfaces any
    related invocations that form one logical action.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned AtBroker.exe, and is that parent chain expected?
  context: AtBroker.exe is normally launched by winlogon.exe at logon, desktop switch, or via the Ease of
    Access entry points. A winlogon.exe parent is expected; an unusual parent such as a script host, Office
    application, or a generic command interpreter points to AtBroker being invoked as a proxy rather than by
    the normal accessibility path. Note that when AtBroker proxies a payload, the payload inherits winlogon.exe
    in its lineage, so a winlogon parent alone does not clear the activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did AtBroker.exe spawn afterward?
  context: AtBroker proxies execution of the registered AT, so the process it spawns is the actual payload of
    interest. A registered legitimate AT launches a known accessibility executable; an abused registration
    launches an arbitrary binary, and that child may in turn spawn command interpreters or downloaders. Review
    each child process and its command line to identify what the proxied AT actually ran.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run AtBroker.exe to start non built-in assistive technologies?
  context: AtBroker.exe itself runs routinely at logon on most workstations, but launches of non-default AT
    names are far less common. A host with zero or very low historical counts of this binary indicates rare
    execution worth scrutiny; a host where it runs constantly suggests an installed accessibility product.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously matched this rule's pattern, what parents and users normally drive it,
    and does the current alert fit?
  context: The query mirrors the rule's full selection structure (AtBroker.exe with "start" and a non built-in,
    non-Java AT name) scoped to this host, so the resulting parent and user distribution reflects how this
    specific firing pattern has historically run here rather than generic AtBroker usage. A new parent process,
    an unexpected user account, or a first-ever appearance of this pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \AtBroker.exe
      - OriginalFileName: AtBroker.exe
      selection_cli:
        CommandLine|contains: start
      filter_main_builtin:
        CommandLine|contains:
        - animations
        - audiodescription
        - caretbrowsing
        - caretwidth
        - colorfiltering
        - cursorindicator
        - cursorscheme
        - filterkeys
        - focusborderheight
        - focusborderwidth
        - highcontrast
        - keyboardcues
        - keyboardpref
        - livecaptions
        - magnifierpane
        - messageduration
        - minimumhitradius
        - mousekeys
        - Narrator
        - osk
        - overlappedcontent
        - showsounds
        - soundsentry
        - speechreco
        - stickykeys
        - togglekeys
        - voiceaccess
        - windowarranging
        - windowtracking
        - windowtrackingtimeout
        - windowtrackingzorder
      filter_optional_java:
        CommandLine|contains: Oracle_JavaAccessBridge
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts matched this rule's pattern in the past week, and does the cross-host distribution
    look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of this firing pattern rather than generic AtBroker usage. Many hosts launching the same non built-in
    AT pattern points to a deployed accessibility product or scripted rollout; a single host or a small
    unrelated set points to manual or host-local activity. Use the host distribution and parent consistency to
    calibrate the response.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \AtBroker.exe
      - OriginalFileName: AtBroker.exe
      selection_cli:
        CommandLine|contains: start
      filter_main_builtin:
        CommandLine|contains:
        - animations
        - audiodescription
        - caretbrowsing
        - caretwidth
        - colorfiltering
        - cursorindicator
        - cursorscheme
        - filterkeys
        - focusborderheight
        - focusborderwidth
        - highcontrast
        - keyboardcues
        - keyboardpref
        - livecaptions
        - magnifierpane
        - messageduration
        - minimumhitradius
        - mousekeys
        - Narrator
        - osk
        - overlappedcontent
        - showsounds
        - soundsentry
        - speechreco
        - stickykeys
        - togglekeys
        - voiceaccess
        - windowarranging
        - windowtracking
        - windowtrackingtimeout
        - windowtrackingzorder
      filter_optional_java:
        CommandLine|contains: Oracle_JavaAccessBridge
      condition: all of selection_* and not 1 of filter_main_* and not 1 of filter_optional_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \AtBroker.exe
      - OriginalFileName: AtBroker.exe
      selection_cli:
