name: HackTool - CrackMapExec Process Patterns
id: 46e87c1b-bb58-4645-867d-b3486eef32a3
description: |
  Detects the command-line patterns left behind when CrackMapExec drives its LSASS credential-dumping
  modules against a host. The rule fires when a command line matches either a `tasklist /fi` filter for
  `Imagename eq lsass.exe` issued through a `cmd /c`, `/r` or `/k` invocation under a built-in service
  identity (a User containing AUTHORI or AUTORI), or a for-loop that feeds the LSASS process ID into
  `rundll32.exe C:\windows\System32\comsvcs.dll, MiniDump` to write a `full` dump under `\Windows\Temp\`,
  or a `tasklist /v /fo csv` listing piped to `findstr /i "lsass"` — three branches of the same
  locate-the-PID-then-dump-the-process sequence, any one of which is enough to fire the rule.
  CrackMapExec is also a standard tool in authorized security assessments, so the first determination is
  whether a sanctioned engagement covers this host and window. If it does not, the investigation should
  establish which branch fired, whether a dump file was actually written and still exists, which accounts
  had sessions on the host and are therefore exposed, and whether the same account or launch mechanism
  went on to reach other hosts over SMB, WinRM, RDP or SSH.
type: detection
detection_id: f26307d8-14cd-47e3-a26b-4b4769f24af6
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the command line match one of the LSASS-dumping patterns this rule detects, and which branch fired?
  context: >-
    The rule fires when the command line matches either a `tasklist /fi` filter for `Imagename eq lsass.exe`
    run through a `cmd /c`, `/r` or `/k` invocation with a User containing AUTHORI or AUTORI, or a for-loop
    feeding a process ID into `rundll32.exe C:\windows\System32\comsvcs.dll, MiniDump` with `full` and a
    `\Windows\Temp\` output path, or a `tasklist /v /fo csv` listing piped to `findstr /i "lsass"`. Read the
    exact text and record which branch matched, because the branch determines what to chase next: the
    service-identity tasklist branch means the command arrived under a built-in service account and the
    parent-chain and remote-execution questions carry the weight; the comsvcs MiniDump branch means a dump
    was actually requested and the on-disk dump file, its path, and the exposed-account assessment become the
    load-bearing questions; the `tasklist /v /fo csv` plus `findstr` branch is PID discovery only, so the
    dump step, if it happened, has to be found separately through the file-artifact and follow-on questions.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - User
  answer_sources:
  - alert
  - process_creation
- question: Is this CrackMapExec execution part of an authorized penetration test or red team engagement?
  context: >-
    CrackMapExec is a standard tool in authorized security assessments, and its LSASS modules are routinely
    exercised during them. Check whether a pentest or red team exercise is currently active against this host
    or network segment, and whether the operator, source host and timing match the engagement scope and rules
    of engagement. A sanctioned engagement with matching tool usage and timing resolves the alert without
    further analysis. If no engagement covers it, the credentials resident on this host must be treated as
    exposed and the remaining questions worked through.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: Is this user and host expected to enumerate or dump the memory of the LSASS process?
  context: >-
    Reading LSASS memory is performed legitimately by a small, known set of endpoint security products and
    crash-reporting components, and by administrators running a sanctioned dump for a support case. The
    service-identity branch of this rule requires a User containing AUTHORI or AUTORI, which means the
    command ran as a built-in service principal rather than an interactive account — on this rule that
    usually reflects a remote execution path that installed a service or spawned through the management
    stack, not a person at a keyboard. Establish whether the host is a domain controller, a jump host, or a
    workstation, and whether any change record or support case explains a deliberate LSASS dump right now.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Which CrackMapExec module was invoked, and did it reach the dump stage or stop at process discovery?
  context: >-
    CrackMapExec is multi-purpose — it enumerates shares and sessions, sprays passwords, executes commands
    over SMB, WMI and WinRM, and dumps credentials from LSASS, the SAM hive and NTDS.dit. The command line
    identifies which capability ran. A `tasklist` filter or a `tasklist /v /fo csv` piped to `findstr /i
    "lsass"` is the PID-discovery step the lsassy and comsvcs modules perform first. A `rundll32.exe
    comsvcs.dll, MiniDump <pid> <path> full` invocation is the dump itself, and the numeric argument before
    the output path is the LSASS process ID the operator resolved. Note the output path and the `%%B`
    for-loop variable, which indicates the PID was substituted programmatically rather than typed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Was LSASS memory actually dumped, and by which method?
  context: >-
    All three branches of this rule point at LSASS, which holds the plaintext-equivalent secrets of every
    account with a live session on the host — NTLM hashes, Kerberos tickets, and under some configurations
    cleartext passwords. The method determines what to look for next. A `comsvcs.dll, MiniDump` invocation
    writes a minidump file to the path named on the command line and requires SeDebugPrivilege, so the dump
    file itself is the artifact. A `tasklist` or `tasklist /v /fo csv` plus `findstr` invocation only resolves
    the LSASS process ID, so the dump — if it followed — used a separate process, an in-memory reader, or a
    handle opened without writing to disk. Decode the full argument list and record the target PID and any
    output path.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - file_event
- question: What process spawned this command shell, and is that parent chain consistent with remote execution?
  context: >-
    The parent reveals how the command arrived. Remote execution over SMB registers and starts a service, so
    the shell appears under services.exe; execution over WMI appears under wmiprvse.exe; WinRM appears under
    wsmprovhost.exe. Any of those parents combined with the built-in service identity this rule's first branch
    requires means the command was pushed from another machine, and the source of that push becomes the next
    pivot. A parent of explorer.exe or a terminal points at an operator already logged on to this host. Walk
    up the tree from the returned parent to see what launched it and what else it launched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Did any process on this host make cross-process memory-write or execution-hijack API calls around this event?
  context: >-
    Credential-dumping operations frequently run alongside process injection — loading a reader into a trusted
    process, or hijacking execution in one that already holds a handle. This channel records WriteProcessMemory,
    QueueUserAPC and SetWindowsHookEx calls and identifies the calling and target processes, which corroborates
    that tooling beyond the observed command line was operating on this host. Two limits apply. This is the
    injection side only — the read-side access that `comsvcs.dll, MiniDump` performs against LSASS is not
    recorded on this channel, so the dump this rule fires on will not appear here even when it succeeded. And
    where this channel is not collected from the host, zero rows are a visibility gap rather than evidence that
    no injection occurred.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        event.dataset: endpoint.events.api
        process.Ext.api.name:
          - WriteProcessMemory
          - QueueUserAPC
          - SetWindowsHookEx
      condition: selection
    fields:
      - Image
      - process.Ext.api.name
      - Target.process.executable
  answer_sources:
  - edr_console
  - manual_review
- question: Did any process request a handle to lsass.exe or invoke SeDebugPrivilege on this host, and with what access mask?
  context: >-
    Opening LSASS for memory reading requires a handle and, from a non-LSASS-adjacent process, SeDebugPrivilege.
    Object-access events name the requesting process and the access mask it asked for — 0x1F0FFF is full access,
    while 0x1010 and 0x1410 combine VM_READ with QUERY_INFORMATION and are what minidump readers typically
    request; filtering to full access alone would miss the read-only masks. Compare the requesting process
    against the endpoint security products and crash-reporting components legitimately expected to touch LSASS
    on this host. Handle-request auditing depends on a system access control list being set on the process
    object and on privilege-use auditing being enabled; where neither is configured, zero rows are a visibility
    gap rather than evidence no handle was opened, and the command-line and file-artifact evidence carries the
    determination instead.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_lsass_handle:
        EventID:
          - 4656
          - 4663
        ObjectName|contains: \lsass.exe
      selection_debug_priv:
        EventID: 4673
        PrivilegeList|contains: SeDebugPrivilege
      condition: selection_host and (selection_lsass_handle or selection_debug_priv)
    fields:
      - EventID
      - ObjectName
      - AccessMask
      - ProcessName
      - PrivilegeList
  answer_sources:
  - manual_review
- question: Were LSA protection or credential-caching registry values modified on this host before the dump attempt?
  context: >-
    LSASS dumping is often preceded by registry changes that make the dump usable or possible at all. Clearing
    RunAsPPL removes the protected-process guard that blocks handle requests; clearing LsaCfgFlags disables
    Credential Guard; setting WDigest UseLogonCredential to 1 forces plaintext passwords back into LSASS memory
    so a later dump yields them directly; adding an entry to Security Packages or Notification Packages loads
    attacker code into the LSA process itself. Any of these appearing in the hours before the alert changes the
    assessment of what the dump could recover, and the writing process identifies who made the change.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_lsa:
        TargetObject|contains:
          - \Control\Lsa\RunAsPPL
          - \Control\Lsa\LsaCfgFlags
          - \Control\Lsa\DisableRestrictedAdmin
          - \Control\Lsa\Security Packages
          - \Control\Lsa\Notification Packages
          - \Control\SecurityProviders\WDigest\UseLogonCredential
      condition: selection_host and selection_lsa
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - manual_review
- question: Was a dump file written by this command or its children, and is it still on disk?
  context: >-
    The `comsvcs.dll, MiniDump` branch writes a minidump of LSASS to the path named on the command line, and
    this rule's own pattern constrains that path to `\Windows\Temp\`; operators also commonly target `%TEMP%`
    and other writable directories. The query correlates file activity back to the alerting process and its
    direct children by process lineage, which is how the rundll32.exe child that performs the write is caught.
    The interval between the LSASS handle being opened and the dump file appearing is typically under five
    minutes, so writes clustered tightly around the alert are the ones to read. A dump file still on disk can
    be hashed, submitted for analysis, and — more importantly — preserved before the operator deletes it. A
    file created and then removed within the window is itself informative about staging and cleanup.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Are known CrackMapExec artifacts present on this host?
  context: >-
    The tool leaves characteristic traces beyond the command line — minidump output under `\Windows\Temp\` or
    `%TEMP%`, batch or output files written by the SMB exec module, and service binary paths registered and
    removed as part of remote execution. The query lists file activity attributed to the alerting binary on
    this host in the hour after the event, which surfaces the staging and output files the modules create even
    if the original process has exited. Where the dump was written by a child rundll32.exe rather than the
    shell itself, the lineage-correlated file question is the one that catches it.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after this event?
  context: >-
    CrackMapExec exists to turn recovered credentials into access on other machines, and it drives that reuse
    over SMB, WinRM and WMI. The query returns outbound connections from this host to remote-access ports —
    3389 (RDP), 445 (SMB), 5985/5986 (WinRM), 22 (SSH) — in the hours after the event, with the originating
    Image and User showing what drove each connection. Two limits apply. Credentials pulled off this host and
    replayed from the operator's own machine will not appear here, so check 4624 logons on suspected targets
    for the accounts that had sessions on this host. And where network-connection telemetry is not collected
    from this host, treat zero rows as a visibility gap rather than evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
  answer_sources:
  - network_connection
- question: Which accounts had sessions on this host, and do any of them have elevated privileges?
  context: >-
    A dump of LSASS exposes the secrets of every account with a live or recently cached session on the host,
    not just the account that ran the command. Enumerate the interactive, service and scheduled-task identities
    present on this host at the time and cross-reference each against directory group membership. A domain
    admin, an enterprise admin, a backup account or a service account with broad rights turns this into a
    domain-scoped exposure requiring password and Kerberos ticket resets; a set of standard user accounts scopes
    the response to those users. Whether the host is a domain controller or a management server materially
    changes which identities were resident.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - active_directory
  - organizational_knowledge
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the user's 90-day
    history of these specific LSASS-dumping command patterns, aggregated by host, rather than generic use of a
    command shell. For a credential-dumping pattern with no documented benign cause, any non-zero history is
    itself worth reading: it either widens the timeline of an operation that started earlier than this alert,
    or identifies a recurring authorized assessment account. Note that this rule's first branch requires a User
    containing AUTHORI or AUTORI, so when that branch fired the identity is a built-in service principal and
    this pivot attributes the launch context rather than a person — read it alongside the parent-mechanism
    history.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_lsass_dump1:
        CommandLine|contains|all:
        - 'tasklist /fi '
        - Imagename eq lsass.exe
        CommandLine|contains:
        - 'cmd.exe /c '
        - 'cmd.exe /r '
        - 'cmd.exe /k '
        - 'cmd /c '
        - 'cmd /r '
        - 'cmd /k '
        User|contains:
        - AUTHORI
        - AUTORI
      selection_lsass_dump2:
        CommandLine|contains|all:
        - do rundll32.exe C:\windows\System32\comsvcs.dll, MiniDump
        - \Windows\Temp\
        - ' full'
        - '%%B'
      selection_procdump:
        CommandLine|contains|all:
        - tasklist /v /fo csv
        - findstr /i "lsass"
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Has this parent process historically driven the rule's pattern on this host or across the environment, or is the parent new for this activity?
  context: >-
    When the alert fires under a built-in service identity — which this rule's first branch requires — user
    identity does not attribute the behavior, and the launch mechanism does. The query mirrors the rule's
    selection structure scoped to the alerting parent process, so the result is the 90-day history of this
    parent driving these specific LSASS-dumping patterns, aggregated by host. A parent of services.exe,
    wmiprvse.exe or wsmprovhost.exe with no prior history for this pattern is a remote execution path used once,
    against this host; the same parent already accounting for a steady count across many hosts points at a
    recurring authorized assessment or an automation that should be identifiable by name.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_lsass_dump1:
        CommandLine|contains|all:
        - 'tasklist /fi '
        - Imagename eq lsass.exe
        CommandLine|contains:
        - 'cmd.exe /c '
        - 'cmd.exe /r '
        - 'cmd.exe /k '
        - 'cmd /c '
        - 'cmd /r '
        - 'cmd /k '
        User|contains:
        - AUTHORI
        - AUTORI
      selection_lsass_dump2:
        CommandLine|contains|all:
        - do rundll32.exe C:\windows\System32\comsvcs.dll, MiniDump
        - \Windows\Temp\
        - ' full'
        - '%%B'
      selection_procdump:
        CommandLine|contains|all:
        - tasklist /v /fo csv
        - findstr /i "lsass"
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What else did this user account do across the network around this time?
  context: >-
    Credential dumping sits in the middle of an operation, not at its end. Tracking every host this account
    touched in the hour around the alert shows whether the dump was a single stop or one of several, and the
    binaries it ran on each host outline what stage the operation had reached. The query intentionally omits a
    host filter. When the alert fired under a built-in service principal, this pivot returns the constant
    background of service-owned processes across the fleet and the count is not meaningful on its own — the
    parent-mechanism clustering question is the readable answer in that case.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a built-in service principal, asking what the user did across the network returns the constant
    background of service-owned processes on every host. The readable question is whether the same launch
    mechanism produced this pattern elsewhere. The query mirrors the rule's selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Several hosts in the same hour points at a sweep
    driven from one source — the operating pattern of a credential-harvesting run across a subnet, or of an
    authorized assessment working through a target list. A single host points at a host-local trigger and
    narrows the exposure accordingly.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_lsass_dump1:
        CommandLine|contains|all:
        - 'tasklist /fi '
        - Imagename eq lsass.exe
        CommandLine|contains:
        - 'cmd.exe /c '
        - 'cmd.exe /r '
        - 'cmd.exe /k '
        - 'cmd /c '
        - 'cmd /r '
        - 'cmd /k '
        User|contains:
        - AUTHORI
        - AUTORI
      selection_lsass_dump2:
        CommandLine|contains|all:
        - do rundll32.exe C:\windows\System32\comsvcs.dll, MiniDump
        - \Windows\Temp\
        - ' full'
        - '%%B'
      selection_procdump:
        CommandLine|contains|all:
        - tasklist /v /fo csv
        - findstr /i "lsass"
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of
    these LSASS-dumping patterns rather than generic command-shell usage. Many hosts firing the same pattern
    within a short span is the footprint of a tool run against a host list — either an authorized assessment
    whose scope should name those hosts, or an operator harvesting credentials across a segment; the host set
    then defines the containment boundary. One host, or a small unrelated set spread over days, points at
    targeted activity and keeps the scope local. Use the host distribution together with the parent-process
    consistency to decide which.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_lsass_dump1:
        CommandLine|contains|all:
        - 'tasklist /fi '
        - Imagename eq lsass.exe
        CommandLine|contains:
        - 'cmd.exe /c '
        - 'cmd.exe /r '
        - 'cmd.exe /k '
        - 'cmd /c '
        - 'cmd /r '
        - 'cmd /k '
        User|contains:
        - AUTHORI
        - AUTORI
      selection_lsass_dump2:
        CommandLine|contains|all:
        - do rundll32.exe C:\windows\System32\comsvcs.dll, MiniDump
        - \Windows\Temp\
        - ' full'
        - '%%B'
      selection_procdump:
        CommandLine|contains|all:
        - tasklist /v /fo csv
        - findstr /i "lsass"
      condition: 1 of selection*
    fields:
    - host.name
  answer_sources:
  - process_creation
