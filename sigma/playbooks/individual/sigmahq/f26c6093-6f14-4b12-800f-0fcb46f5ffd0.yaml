        - ZW1tb3Zl
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the stages that preceded this execution and help reconstruct the timeline. Defense tampering followed by execution, or reconnaissance followed by exploitation, are common orderings.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: This query mirrors the rule's full selection with no host scope, so the result is a fleet-wide count of this exact firing pattern, not generic PowerShell usage. Many hosts firing the same encoded pattern points to scripted deployment or a shared automation source; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate scope.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_hidden:
