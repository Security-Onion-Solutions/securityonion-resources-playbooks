name: RedSun - TieringEngineService.exe Staged in RS-Prefixed Temp Dir
id: 3980a524-2479-4e3c-8150-738af1a9c178
description: |
  Detects creation of a file named TieringEngineService.exe inside a Temp directory whose path contains an RS- prefix segment (e.g. %TEMP%\RS-{GUID}\TieringEngineService.exe). The RS-{GUID} directory is generated by the RedSun local privilege-escalation tooling, which registers a Cloud Files sync root under that path and stages a masqueraded copy of the Storage Tiers Management service binary there as part of an oplock-based antivirus-bypass and privilege-escalation chain; the path prefix and filename combination has no legitimate system usage. Investigation should confirm the path pattern, identify the process that staged the file, determine whether the staged file is a copy of the genuine service binary or an arbitrary payload, and check for sync-root or service-configuration registry changes that show the chain progressed beyond the file write.
type: detection
detection_id: f2e4b7d9-5c3a-4f8b-9e1d-7a6c2b3f4e5d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Is the created file TieringEngineService.exe inside an RS-prefixed Temp directory, as this rule requires?
  context: The rule requires all three path conditions together — the path contains \Temp, contains \RS-{, and ends with \TieringEngineService.exe (e.g. %TEMP%\RS-{GUID}\TieringEngineService.exe). Review the full path, the operation performed, and the responsible process. The genuine Storage Tiers Management binary lives in %SystemRoot%\System32 and is never written under Temp, so a matching path is not explainable as servicing activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - file_event
- question: Is this user or host associated with any activity that would stage a service binary under a Temp directory?
  context: There is no known legitimate producer of the RS-{GUID} directory pattern — the only plausible benign source is an authorized security assessment or exploit testing on a research host. The query displays the triggering event's host, user, and writing process; when the user is a machine or service account, judge by the writing process and the host's role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What is the actual identity of the process that staged this file?
  context: On a file-creation alert the process identifiers belong to the writing process — here, the exploit-tool candidate. Its on-disk name, embedded OriginalFileName, and hash reveal whether the writer is itself a renamed or unsigned binary; submit the hash for reputation checking. The staged file's own identity is established separately through content review and its execution hash.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: Is the staged TieringEngineService.exe still on disk, or was it deleted or renamed after the alert?
  context: This tooling stages the file as a Cloud Files placeholder and manipulates it with oplocks during the escalation attempt, so the file may be converted, renamed, or removed as the chain progresses. A file still on disk can be retrieved and hashed; deletion shortly after creation shifts the investigation to what executed in between and to the sync-root directory's other contents.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Is the staged file a copy of the genuine service binary or an arbitrary payload?
  context: Retrieve the file from the RS-prefixed directory and compare it against the genuine %SystemRoot%\System32\TieringEngineService.exe — size, signature, and version resource. A Microsoft-signed byte-identical copy fits the placeholder role in the oplock chain, where the file's name and location do the work; an unsigned or modified binary is itself the payload and needs full content analysis (imports, strings, packer indicators). The query shows the write events for the artifact on this host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
- question: If the staged file has executed, what is its hash, and does it have known detections?
  context: File-creation events carry no hash — the hash is recorded when the file runs. This query looks for the staged binary executing on this host and reads its hash; a hash matching the genuine Microsoft binary supports the placeholder pattern, while an unknown hash identifies the payload for reputation lookup. Execution shortly after the write also answers whether the chain progressed from staging to running code; if it never ran, retrieve the file from disk and hash it manually.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: How was the writing process invoked, and what were its arguments?
  context: The command line and working directory of the process that created the file show how the tooling was launched — an interactive run from a user's download directory, a dropped binary executed from Temp, or a script host wrapping it — plus any arguments that select the escalation target. The query covers every invocation of the writer binary on this host in the window, in case the tool ran multiple stages as separate processes.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned the file writer, and is that parent chain expected?
  context: The parent shows how the exploit-tool candidate started — explorer.exe points to manual execution by a logged-on user, a script host or Office application points to a delivery document, and a service or remote-management parent points to execution over an existing foothold. Long-running parents can predate the alert by hours or days, so the wide lookback is intentional.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What other files did the staging process write or delete around the alert?
  context: The chain creates the RS-{GUID} directory, the placeholder file, and typically further artifacts — payload copies, staging output, or cleanup deletions — in a short burst. The file activity of the writer and its direct children enumerates the rest of the operation and shows where any follow-on payload landed.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: What else has been written under RS-prefixed directories on this host recently, and by which processes?
  context: The RS-{GUID} directory is created by the tooling itself, so any content under such a path belongs to the same activity. Earlier writes under other RS-prefixed paths indicate prior runs or repeated escalation attempts on this host; the aggregation groups paths by writing process, and a single unfamiliar writer across the entries ties the artifacts to one tool.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\RS-{'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Were sync-root registrations or Storage Tiers Management service settings modified around the staging?
  context: The tooling registers a Cloud Files sync root for the RS-prefixed directory before staging the placeholder, and the masqueraded filename copies the Storage Tiers Management service binary, so registry changes around the alert reveal whether the chain progressed beyond the file write. Sync-root registration appears under SyncRootManager keys, and any modification of the TieringEngine service's configuration (such as its ImagePath) indicates service-level tampering to have the staged copy loaded with elevated privileges.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection_scope:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\SyncRootManager\'
          - '\Services\TieringEngine'
      condition: selection_scope and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- always_include: true
  question: Has this user previously produced this staging pattern, and does that history fit their role?
  context: The query mirrors the rule's selection scoped to this user — the result is the user's 90-day history of staging TieringEngineService.exe under RS-prefixed Temp paths, aggregated by host. The pattern has no legitimate production, so any prior history points to earlier undetected runs or authorized exploit testing rather than routine work; a zero count means this is the account's first occurrence.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains|all:
        - \Temp
        - \RS-{
        TargetFilename|endswith: \TieringEngineService.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
  - organizational_knowledge
- always_include: true
  question: Has this program historically driven this staging pattern on this host or across the environment?
  context: When the alert fires under a service principal or machine account, user identity does not attribute the behavior. The query mirrors the rule's selection scoped to the alerting program, giving the 90-day history of this program driving the staging pattern — a window that comfortably exceeds the roughly 30-day novelty horizon useful for judging first appearance. A new program for this pattern is the deviation worth chasing; recurring counts point to repeated runs that need their own timeline.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains|all:
        - \Temp
        - \RS-{
        TargetFilename|endswith: \TieringEngineService.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
- always_include: true
  question: What else did this user do across the network around this time?
  context: A local privilege-escalation attempt implies the account already runs code at standard privilege — the same account's process activity on other hosts in the window shows whether the operator is working a single endpoint or several. If the account is a service principal, this view fills with routine agent noise and the parent-driven variant of this question is the meaningful one.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did the same program-driven staging fire on other hosts in this window, or is the activity isolated to this host?
  context: Under a service principal, user-scoped clustering returns agent-telemetry noise; the meaningful pivot is whether the same launch mechanism produced the staging pattern elsewhere. The query mirrors the rule's selection scoped to the alerting program, fleet-wide, in the alert window — multiple hosts staging the same masqueraded binary points to pushed or scheduled distribution of the tooling, while a single host points to a local, hands-on attempt.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains|all:
        - \Temp
        - \RS-{
        TargetFilename|endswith: \TieringEngineService.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
- question: What other activity occurred on this host around the time of the alert?
  context: An escalation attempt sits inside a longer sequence — tool download or extraction before the staging, and elevated follow-on activity if it succeeded. The aggregation collapses repetitive platform noise into high-count rows so novel parent-child process pairs stand out at low counts; scan for siblings of the writer, archive extractors, and anything launching from Temp paths.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
- question: Was TieringEngineService.exe written on any other hosts recently?
  context: The same masqueraded filename appearing on multiple hosts indicates the tooling is being distributed rather than tried on a single machine. Judge each match by its directory — writes under RS-prefixed Temp paths are the exploit pattern regardless of host, while writes to %SystemRoot%\System32 by servicing processes are routine component updates of the genuine binary.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: A privilege-escalation stage presupposes earlier code execution — look for delivery and execution alerts (downloads, archive extraction, script hosts), defense tampering, or reconnaissance on this host in the preceding hours. The alert sequence reconstructs how the tooling arrived and what the operator did before attempting elevation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
