name: Malicious PowerShell Scripts - FileCreation
id: fdc9812b-f854-4fb2-b77d-292db39e06c0
description: |
  Detects the creation on disk of files whose names match known offensive PowerShell tooling — post-exploitation
  frameworks and single-purpose scripts (PowerSploit, Nishang, PowerSharpPack, powercat, ADRecon, Powermad, and
  similar). The rule fires when a written file EITHER ends with one of a large set of known offensive script names
  OR is a .ps1 whose name contains 'Invoke-Sharp'. Legitimate hits come from security testing, red-team practice,
  and defenders staging tooling; malicious hits represent an adversary dropping post-exploitation capability onto
  a host. Investigation should confirm the file is the real tool rather than a name collision, determine whether it
  was executed, and reconstruct what wrote it and what ran around it.
type: detection
detection_id: f331aa1f-8c53-4fc3-b083-cc159bc971cb
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the created file name match a known offensive PowerShell script, and which process wrote it?
  context: >-
    The rule fires when a written file EITHER ends with one of a large set of known offensive script names (for
    example Invoke-Mimikatz.ps1, PowerView.ps1, powercat.ps1, ADRecon.ps1) OR is a .ps1 whose name contains
    'Invoke-Sharp'. Note which branch matched — a name-list hit is high-confidence on the filename alone, while an
    'Invoke-Sharp*.ps1' hit is a broader pattern that still needs the name confirmed. Review the exact path, the
    operation (created/renamed), and the responsible process before investing further.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to have an offensive PowerShell script written to disk here?
  context: >-
    Security testers, red teams, and some administrative tooling legitimately place these scripts on disk. Knowing
    whether the user role and host function are consistent with security tooling is often the fastest way to
    separate sanctioned testing from an intrusion. When the writing account is a machine or service account, judge
    by the writing process and the host's role rather than the account name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this the actual offensive tool, or a decoy/renamed file — check size, hash, signing, and script content?
  context: >-
    The rule matches on filename only, so the first step is confirming the file really is the tool the name implies.
    Retrieve the .ps1 from its on-disk path and examine it: file size, hash, whether it is signed, and the script
    body. Look for the tool's characteristic function names and for base64 blocks, download cradles, or embedded URLs
    and IPs. A file bearing the name but with unrelated or empty content is a name collision; a file with the tool's
    real body confirms offensive capability is staged on the host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What command line did the process that created this file run, and does it decode to a download cradle or encoded payload?
  context: >-
    The write event carries the responsible process. If that process is powershell.exe or another interpreter,
    decoding its command line reveals how the script landed — an IEX download cradle, a Net.WebClient.DownloadFile,
    Start-BitsTransfer, or an -EncodedCommand base64 blob that reconstructs and writes the file. If the writer is a
    browser, archiver, or editor, the script was delivered rather than generated in place, which points the timeline
    back to the delivery vector.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture this script executing, and what is the deobfuscated content?
  context: >-
    Event ID 4104 records the deobfuscated script content PowerShell actually compiles, even when a command line is
    encoded. If the offensive script ran, its body — function names, cradles, in-memory assembly loads — appears here
    and is ground truth about what executed. If PowerShell operational logs are not ingested in this environment,
    treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Did powershell.exe load unsigned .NET assemblies on this host around the alert, indicating in-memory execution?
  context: >-
    Several of these tools (PowerSharpPack, Sharpcradle-style loaders) reflectively load .NET/GhostPack assemblies
    into the PowerShell process rather than dropping an executable, so the give-away is a rare or unsigned module
    loaded by powershell.exe rather than a new binary on disk. Unsigned or first-seen assemblies loaded by the
    interpreter around the time the script ran corroborate that the staged tooling executed in memory. A DLL carries
    its signing status and hash on the load event itself, so no execution pivot is needed.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \powershell.exe
        Signed: 'false'
      condition: selection
    fields:
      - ImageLoaded
      - Signature
      - SignatureStatus
- question: Was this script executed after it was written — does any command line reference the file name?
  context: >-
    A script that is written and then run has progressed from staging to execution, which raises urgency and defines
    what to contain. Scripts run interpreted, so the file name appears in the launching process's command line
    (powershell.exe -File or a dot-source), not as its own process image. Any process whose command line contains
    this file name after the write is evidence the tool was invoked.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ProcessGuid
- question: What process launched the one that wrote this script, and what else did that parent spawn?
  context: >-
    The writer's parent chain shows how the drop was initiated. A predictable parent (explorer.exe for a manual save,
    a package manager for a sanctioned install) points to benign staging; an unusual parent such as an Office
    application, mshta.exe, wscript.exe, or a remote-execution service points to exploitation. Siblings spawned by
    the same parent reveal whether the drop was one step in a larger sequence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A process that drops one offensive script often drops several — an unpacked framework, a bundle of modules, or an
    offline tool set staged together. The breadth, paths, and extensions of the writer's other file activity separate
    a single script from a full toolkit being deployed and enumerate what else needs review. The write event carries
    the responsible process identifiers, so the correlation covers the writer and its direct children.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Were PowerShell security controls bypassed or weakened on this host shortly before the alert?
  context: >-
    Offensive PowerShell tooling frequently disables defenses before running — AMSI bypass (patching amsi.dll,
    AmsiUtils/amsiInitFailed reflection), execution-policy changes (-ExecutionPolicy Bypass, -ep bypass), Defender
    tampering (Set-MpPreference, DisableRealtimeMonitoring), or a v2 downgrade that evades logging. These precursor
    commands on the same host strengthen the case that the staged script is being operationalized rather than merely
    present.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: Is the file still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives next steps. A script still on disk can be retrieved, hashed, and analyzed;
    a file deleted seconds after creation suggests a self-cleaning dropper or anti-forensic cleanup and shifts focus
    to what executed in between. Interpret by operation type — a deletion shortly after creation is the cleanup
    signature.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has a file with this name been written on this host before?
  context: >-
    A script name that has never appeared on a host is more suspicious than one that is part of routine tooling.
    First-time appearance of an offensive script name should be treated as noteworthy even when a legitimate
    explanation exists; a long history of the same name may indicate an established testing workflow or an installed
    security suite.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining process activity around the write reveals what led up to it and what
    followed — reconnaissance, privilege escalation, or additional staging. Novel parent-child pairs stand out at low
    counts against the repetitive high-count agent and service noise the aggregation collapses.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the writing user's activity across all hosts reveals whether the same account staged or ran tooling on
    other endpoints, which would widen the scope of the investigation. This pivot is meaningful when the alert fires
    under a human account; when it fires under a service or machine account it degenerates into agent-telemetry noise,
    which is why the responsible-process pivot is asked separately.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did the same responsible process write this offensive script on other hosts?
  context: >-
    When the write is attributed to SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a machine account, the user pivot is
    unbounded and not actionable, so attribution moves to the mechanism — the process that performed the write. The
    same writing process producing this script name on multiple hosts points to scripted or automated distribution
    rather than a one-off drop, and identifies the other endpoints holding the staged tooling.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith|expand: '%Image%'
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- question: Is a file with this name present on any other hosts in the environment?
  context: >-
    The same offensive script name on multiple hosts may indicate lateral distribution or a coordinated staging
    effort; a single host suggests a targeted or local action. Where the file appears broadly, establish the
    distribution pattern and timeline; where it is isolated, focus on that host's activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the
    stages that preceded the tooling drop and help reconstruct the timeline. Staging of offensive scripts often
    follows initial access and precedes credential access or lateral movement, so surrounding alerts frame where in
    an operation this event sits.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
