name: Potential DCOM InternetExplorer.Application DLL Hijack - Image Load
id: 83a7c26c-c6ff-4d97-ae0a-60fc4ff4220b
description: |
  Detects iexplore.exe loading iertutil.dll from the Internet Explorer program directory, the module-load stage of a
  DCOM InternetExplorer.Application DLL search-order hijack. In this technique an operator remotely writes a malicious
  iertutil.dll into the Internet Explorer folder over an administrative share, then instantiates the InternetExplorer.Application
  COM object over DCOM; the resulting iexplore.exe COM server loads the planted DLL and executes attacker code under the
  invoking account. The load itself is normal on hosts where Internet Explorer runs, so the investigation must establish
  whether the loaded iertutil.dll is the legitimate Microsoft-signed system library or a recently planted replacement, and
  whether a remote host delivered it over SMB and triggered the load over RPC/DCOM.
type: detection
detection_id: f354eba5-623b-450f-b073-0b5b2773b6aa
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the loaded module match what this rule detects -- path, loading process, and signature?
  context: Confirm the alert is a true positive by reviewing the exact module path (iertutil.dll under the Internet Explorer
    folder), the process that loaded it (iexplore.exe), and the module's code-signature status. The library event carries
    the signing status and hash directly, so a first pass can already tell whether the loaded DLL looks like the shipped
    Microsoft file or a replacement.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Is this host expected to instantiate the InternetExplorer.Application DCOM object under this account?
  context: Legitimate Internet Explorer automation and some administrative tooling instantiate the InternetExplorer.Application
    COM object, but a DCOM-invoked iexplore.exe COM server on a server or workstation that has no such workflow is unusual.
    Knowing whether the account and host routinely drive remote COM automation is often the fastest way to separate a benign
    load from remote code execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is the loaded iertutil.dll the legitimate Microsoft-signed system library, or is it unsigned or invalidly signed?
  context: The genuine iertutil.dll ships with Windows and carries a valid Microsoft signature. A planted hijack DLL is
    typically unsigned, self-signed, or fails signature validation while masquerading under the expected filename. Compare
    the signing status and status field against a known-good baseline and pivot the hash to threat intelligence; while
    reviewing the module list, also note any other loaded module from a non-canonical or user-writable path that could be
    a second planted component.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What launched this iexplore.exe instance, and is the parent chain consistent with a DCOM-instantiated COM server?
  context: A DCOM invocation of InternetExplorer.Application spawns iexplore.exe as a COM server, typically parented under
    svchost.exe hosting the DcomLaunch service and often carrying an -Embedding argument, rather than being launched by
    explorer.exe from a user click. A parent chain that shows COM activation rather than interactive browsing corroborates
    remote DCOM-based instantiation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: How and when did iertutil.dll appear in the Internet Explorer directory, and which process wrote it?
  context: The shipped iertutil.dll is not normally rewritten. A write to this path by the System process shortly before
    the load is characteristic of a file delivered over SMB and committed to disk by the RPC/DCOM-driven copy; a write by
    a non-system account over an administrative share points to a hands-on plant. Correlate the write time against the load
    time -- a fresh write minutes before the load is the plant-then-invoke pattern.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: '\Internet Explorer\iertutil.dll'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
      - EventType
- question: What files did this iexplore.exe process or its children write after the module load?
  context: A hijacked COM server running attacker code frequently drops follow-on payloads, tooling, or output files. Files
    written by the alerting iexplore.exe process or its direct children are candidates for hash lookup and sandbox review.
    Focus on writes rather than deletions, since file removal is not directly observable on this telemetry.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What remote host connected to this system over SMB (445) or RPC/DCOM (135) around the load, and is it an expected
    administrative source?
  context: DCOM lateral movement requires an SMB channel to deliver the DLL and an RPC/DCOM channel (port 135 plus a dynamic
    high port) to invoke the COM object. Inbound connections on 445 and 135 around the load time identify the originating
    host. A connection from a known admin jump box differs sharply from one from an unexpected workstation used as a pivot.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 445
          - 135
      condition: selection
    fields:
      - SourceIp
      - DestinationPort
- question: What account did this DCOM-launched iexplore.exe run under, and is that account expected to perform remote administration?
  context: The account context of the COM server reveals whose credentials drove the remote invocation. A service or privileged
    account performing routine remote administration is expected; an ordinary user account, or one that rarely touches this
    host, suggests stolen credentials or a pivot. Logon-type and pass-the-hash detail lives in the Security authentication
    logs and is examined separately.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
      - CommandLine
- question: What processes were spawned on this host in the 30 minutes after the module load?
  context: DCOM code execution is a means to an end. Processes launched shortly after the load -- cmd.exe, powershell.exe,
    runonce.exe, or reconnaissance and credential-access tooling -- indicate hands-on activity or payload execution on the
    target following the hijack. Aggregating by account and image surfaces the novel post-access processes against routine
    host noise.
  range: +30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - Image
- question: Has this account run remote-execution tools against other hosts in the last day?
  context: >-
    Operators rarely stop at one target. If the same account has driven psexec, remote desktop,
    SSH, or WMI execution If this alert fired under SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a
    machine account (name ending in $), this query intentionally returns nothing — a user pivot
    on a service principal matches every host's background automation, not an actor; assess
    movement through the host- and program-scoped questions instead.

    tooling across several hosts in the past day, the scope of compromise is broader than this single load. A spread across
    many hosts from one account within a short window points to active lateral movement.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_lateral:
        Image|endswith:
        - \psexec.exe
        - \psexec64.exe
        - \mstsc.exe
        - \ssh.exe
        - \plink.exe
        - \wmic.exe
      filter_svcprin_builtin:
        User:
        - SYSTEM
        - LOCAL SERVICE
        - NETWORK SERVICE
      filter_svcprin_machine:
        User|endswith: $
      condition: (selection and selection_lateral) and not 1 of filter_svcprin_*
    fields:
    - host.name
    - Image
- question: Has iertutil.dll been loaded on this host before, and always by iexplore.exe from the Internet Explorer directory?
  context: A first-time load of this module on the host, or a history of the same DLL name loaded from a different path or
    by different processes, is a stronger anomaly signal than a steady recurring load. A long, consistent history of
    iexplore.exe loading iertutil.dll from the shipped path suggests routine Internet Explorer usage rather than a plant.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: When this host previously loaded iertutil.dll into iexplore.exe, what programs and users drove it, and does the
    current alert fit that pattern?
  context: The query mirrors the rule's selection scoped to this host, so the resulting program and user distribution reflects
    how this exact load pattern has run here historically rather than generic Internet Explorer usage. The Image column will
    show iexplore.exe itself; image-load events carry no parent lineage, so pivot to its process-creation event if launch
    lineage matters. An unexpected account, or a first-ever load against that baseline, is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: image_load
    detection:
      selection:
        Image|endswith: \Internet Explorer\iexplore.exe
        ImageLoaded|endswith: \Internet Explorer\iertutil.dll
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: What child processes did this iexplore.exe instance spawn after loading the module?
  context: A browser COM server that suddenly spawns command interpreters, script hosts, or proxy-execution binaries
    (cmd.exe, powershell.exe, rundll32.exe) is executing the hijack payload. The child command lines reveal the operator's
    intent immediately after the load.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other process activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Aggregating process activity in the window around the load collapses routine
    agent noise into high-count rows while novel parent-child pairs stand out at low counts, revealing reconnaissance,
    privilege escalation, or staging that surrounds the hijack.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before the module load?
  context: Earlier detections on the same host -- defense tampering, reconnaissance, or credential access -- may reveal the
    stages that preceded this load and help reconstruct the timeline. Remote copy of the DLL and the DCOM invocation may
    each have tripped separate detections just before this one.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts loaded iertutil.dll into iexplore.exe in the past week, and does the spread look like coordinated
    activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this exact load pattern
    rather than the generic footprint of Internet Explorer. Many hosts showing the same pattern in a short window points to
    scripted deployment or coordinated lateral movement; a single host or a small unrelated set points to isolated activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: image_load
    detection:
      selection:
        Image|endswith: \Internet Explorer\iexplore.exe
        ImageLoaded|endswith: \Internet Explorer\iertutil.dll
      condition: selection
    fields:
    - host.name
- question: Where and how has this account authenticated recently -- network logons or remote desktop?
  context: >-
    Authentication events show which systems the account reached before and after the load. A
    network logon (type 3) If the alert fired under SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a
    machine account (name ending in $), this query intentionally returns nothing — service-
    principal logons are background noise, not an actor trail. For a human account, zero results
    can also mean the Security channel is not ingested for the relevant hosts; confirm 4624
    visibility before reading zero as "no authentications".

    from the source host immediately before the load ties the SMB/DCOM access to a specific credential, and a burst of logons
    across many systems suggests lateral movement in progress. If Security authentication logs are not collected in this
    environment, treat zero results as a visibility gap rather than evidence nothing happened.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
        - 4624
        - 4625
        TargetUserName|expand: '%User%'
      filter_svcprin_builtin:
        TargetUserName:
        - SYSTEM
        - LOCAL SERVICE
        - NETWORK SERVICE
      filter_svcprin_machine:
        TargetUserName|endswith: $
      condition: (selection) and not 1 of filter_svcprin_*
    fields:
    - host.name
    - IpAddress
    - EventID
    - LogonType
