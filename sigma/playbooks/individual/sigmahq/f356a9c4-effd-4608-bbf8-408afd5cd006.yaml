name: Suspicious Cobalt Strike DNS Beaconing - Sysmon
id: 0aec9aa7-5617-4387-a116-c3e51b213326
description: |
  Detects DNS queries whose names match label patterns used by Cobalt Strike DNS beacons — a query name that
  either starts with "aaa.stage." or "post.1", or contains ".stage.123456.". Cobalt Strike's Beacon payload can
  tunnel command-and-control over DNS, encoding operator traffic into subdomain labels of lookups issued by the
  compromised process; the staging and data labels this rule keys on are default artifacts of that beacon.
  Because the alert is a DNS lookup rather than a connection, investigation should center on the queried name and
  the querying process: decode the label structure, confirm whether the name resolved and whether the process then
  connected outbound, establish whether the process and its DNS behavior are normal for the host, and look for the
  named-pipe and rundll32 artifacts that accompany beacon privilege escalation and lateral movement. A default,
  un-customized beacon pattern usually reflects a careless deployment rather than a false positive.
type: detection
detection_id: f356a9c4-effd-4608-bbf8-408afd5cd006
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the queried name match either Cobalt Strike DNS beacon pattern, and which process issued it?
  context: >-
    Confirm the alert is a true positive before deeper work. The rule fires on either branch — a query name that
    starts with "aaa.stage." or "post.1", OR a query name that contains ".stage.123456.". Note which branch matched:
    the "stage" labels accompany beacon staging, and the ".stage.123456." data label carries tasking, so the branch
    hints at what phase of the beacon lifecycle fired. Record the exact QueryName and the querying process, and note
    whether the lookup resolved.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
- question: Is this beaconing activity part of an authorized penetration test or red team engagement?
  context: >-
    Cobalt Strike is standard tooling in sanctioned red team assessments, and a DNS beacon fired during an active
    engagement is expected. Before investing analysis time, check whether a pentest or adversary-simulation exercise
    is currently scoped to this host or segment; matching timing and infrastructure resolve the alert. The absence of
    an engagement makes a default-pattern beacon a live command-and-control candidate.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this process and host expected to issue external DNS lookups of this kind?
  context: >-
    A DNS beacon rides whatever process the operator injected into. Knowing whether the querying process and host
    normally make external name lookups — a browser or updater is routine; rundll32.exe, an unfamiliar binary, or a
    service process issuing outbound-looking queries is not — is often the fastest way to separate a true positive from
    a benign coincidence. When the user is a machine or service account, judge by the process and host role instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the full queried name, how is its label structure built, and did it resolve?
  context: >-
    The alert is a DNS lookup, so investigate the name itself. Cobalt Strike DNS beacons build query names from a
    fixed operator label plus generated labels; the "stage" and ".stage.123456." segments this rule matches are the
    default staging and data labels. Read the full QueryName to see the label layout, check registration age and
    passive DNS for the parent domain, and confirm whether the lookup resolved and to what address. A default,
    un-customized label pattern points to an out-of-the-box beacon.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: Which process is issuing the beacon queries, and does its command line show the injection or rundll32 signature?
  context: >-
    The querying process reveals which Beacon capability is active. A default beacon frequently runs inside an injected
    host such as rundll32.exe launched with no command-line arguments — anomalous for that binary — and its command
    line, or the lack of one, tells whether this is an injected C2 host versus a legitimately-invoked tool. Use this to
    determine the scope of compromise on the host and whether privilege escalation or lateral movement modules have run.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Do the subdomain labels of this process's DNS queries carry encoded command-and-control data?
  context: >-
    DNS beacons smuggle tasking and output through the query name: operator data is base32- or hex-encoded into
    subdomain labels, producing long, high-entropy, frequently-changing labels under a stable parent domain. Pull the
    set of names this process looked up and inspect the label lengths and character makeup — abnormally long or
    randomized labels that change every few queries are the encoded channel, distinct from a normal service that
    repeats a small set of fixed hostnames.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: Is the queried domain or its resolved infrastructure known-malicious in threat intelligence?
  context: >-
    Beyond the label structure, the parent domain and any resolved address should be checked against reputation and
    passive-DNS sources. A domain matching known Cobalt Strike infrastructure, a recently-registered parent, or a
    resolved IP tied to prior C2 confirms attacker infrastructure; a well-known benign service with an unlucky label
    match points to a false positive. Record the parent domain and resolved address and submit both to internal and
    external threat intel.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: After resolving, did the querying process make outbound network connections?
  context: >-
    A DNS lookup on its own is not the connection — the beacon resolves the name and then talks to the returned
    address, or falls back to another channel. This query lists outbound connections initiated by the querying process
    around the alert so the analyst can see whether the DNS activity was followed by actual egress, and to which
    external addresses and ports. Cross-reference the destinations against the resolved address from the lookup. If
    endpoint network telemetry is not collected, treat zero results as a visibility gap rather than proof nothing
    connected.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
- question: What other names did this process query, and is the timing a regular beacon cadence?
  context: >-
    A single beacon lookup sits inside a stream of them. List every name this process queried in the window: a burst
    of algorithmically varied labels under one parent domain, or lookups spaced at a regular interval, is the beaconing
    signature. A default beacon with no sleep set issues abnormally frequent requests, while a malleable profile paces
    them — either way the cadence and label variety separate C2 from a process resolving a handful of fixed service
    names.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: Has this host queried this domain before?
  context: >-
    First-time resolution of a domain is more suspicious than a name the host looks up routinely. A 90-day history of
    zero or very low counts for this parent domain marks it as new infrastructure rather than an established business
    service; a long steady history argues for a benign match. The querying process over time also shows whether this
    name is normally resolved by something other than the alerting process.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: Did other hosts in the environment query the same beacon pattern?
  context: >-
    The cross-host distribution informs the response. A single host resolving this pattern points to targeted C2 on
    that endpoint; several hosts resolving names under the same parent domain in the same period points to a broader
    intrusion with multiple beacons. Use the host set to scope containment and to find other compromised endpoints
    that have not alerted individually.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Does this host normally run the querying process?
  context: >-
    A process that has never run on the host, or one running in an unusual form, is more suspicious than a routine
    binary. A 90-day frequency for the querying image separates an established application from a first-seen or rare
    execution — and for a binary like rundll32.exe the relevant deviation is not whether it runs at all but whether it
    runs in the argument-less, network-active form the beacon uses.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: What process launched the querying process, and is that parent chain expected?
  context: >-
    The parent lineage of the beaconing process shows how the C2 host was created. An injected beacon is often spawned
    or hosted by an unexpected parent — a script interpreter, an Office application, or a process that would not
    normally launch the querying binary. Because parent-process identifiers are frequently absent on DNS-lookup
    telemetry, this pivots on the querying process's own record to expose its parent and creating command.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
- question: Are Cobalt Strike host artifacts — named pipes or dropped files — present around this activity?
  context: >-
    Cobalt Strike leaves characteristic host traces even when the beacon is memory-resident. Its default named pipes
    follow patterns like \\.\pipe\msagent_* and \\.\pipe\MSSE-*, and the built-in svc-exe privilege-escalation and
    PsExec lateral-movement paths drop an executable and create a short-lived service. This query surfaces files
    written by the querying process on the host; pair it with a review of named-pipe creation and new service
    installation to confirm which beacon capabilities ran.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    A beacon lookup rarely stands alone. Aggregating the host's process activity in a tight window around the alert
    surfaces the immediate context — what launched the beacon host, what it spawned, and any reconnaissance,
    privilege escalation, or lateral-movement tooling running alongside it. Novel parent-child pairs stand out at low
    counts against the routine agent-telemetry background.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Command-and-control usually follows earlier attack stages. Sigma alerts on this host in the preceding hours —
    initial execution, defense tampering, credential access, or discovery — help reconstruct how the beacon arrived
    and what the operator did before it started calling out. The alert timeline is the spine of the incident narrative.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
