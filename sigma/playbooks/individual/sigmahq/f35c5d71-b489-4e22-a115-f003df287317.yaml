name: Potential CobaltStrike Process Patterns
id: 3c2a9f4e-7b18-4d6c-9e0a-1f5b8c4d2a7e
description: |
  Detects process and command-line patterns characteristic of Cobalt Strike beacon
  post-exploitation. The rule fires when any one of four distinct branches matches —
  EITHER a cmd.exe /C whoami whose parent runs from C:\Temp, OR a cmd.exe /c echo that
  writes into a named pipe (> \\.\pipe) under a runonce.exe or dllhost.exe parent, OR a
  conhost.exe launched with 0xffffffff -ForceV1 whose parent command line wrote to a
  named pipe, OR that same conhost.exe pattern whose parent command line ends in /C
  whoami. These patterns correspond to Cobalt Strike's shell, pass-the-hash (named-pipe
  token transfer), and fork-and-run console artifacts. The same patterns can appear in
  authorized red-team work, so the investigation should confirm which branch fired,
  decode the command and any named-pipe write, trace the parent chain, and determine
  whether the activity is sanctioned.
type: detection
detection_id: f35c5d71-b489-4e22-a115-f003df287317
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the alert match one of this rule's branches — a cmd.exe /C whoami from a C:\Temp parent, a cmd.exe /c echo writing to a named pipe, or a conhost.exe 0xffffffff -ForceV1 tied to those parents?
  context: The rule fires on any one of four branches, and which one fired determines the rest
    of the investigation, so note the branch. A CommandLine ending in cmd.exe /C whoami
    with a ParentImage under C:\Temp is the shell-from-staging-directory branch. A
    CommandLine containing both cmd.exe /c echo and a write to \\.\pipe under a
    runonce.exe or dllhost.exe parent is the pass-the-hash named-pipe token transfer. A
    CommandLine ending in conhost.exe 0xffffffff -ForceV1 whose ParentCommandLine wrote
    to a pipe or ended in /C whoami is the console-host artifact that accompanies those
    spawns. Read the CommandLine, ParentCommandLine, and ParentImage together to make the
    true/false positive call.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - CommandLine
- question: Is this user and host expected to run command shells or token-transfer activity from a staging directory?
  context: Legitimate administration rarely runs cmd.exe /C whoami from C:\Temp or pipes
    output of cmd.exe /c echo into a named pipe. Knowing whether the account and host
    routinely perform hands-on-keyboard administration, and whether a staging directory
    like C:\Temp is in normal use here, is often the fastest way to separate sanctioned
    activity from beacon post-exploitation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this activity part of an authorized penetration test or red team engagement using Cobalt Strike?
  context: Cobalt Strike is widely used in authorized security assessments, and its shell,
    pass-the-hash, and fork-and-run commands produce exactly these process patterns. Check
    whether a sanctioned engagement is active on this host or network segment for this
    window. A matching engagement with corresponding tooling and timing resolves the alert
    without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What did the detected command actually do? Decode the command line and any named-pipe write or whoami invocation.
  context: The full command line shows the specific beacon action. A cmd.exe /c echo
    writing a hex string into \\.\pipe is the pass-the-hash token transfer — note the pipe
    name. A cmd.exe /C whoami is the shell command's identity check. A conhost.exe
    0xffffffff -ForceV1 is the console-host artifact a beacon spawn leaves behind. The
    query scopes to these patterns on the host within a tight window rather than to the
    binary name, because cmd.exe and conhost.exe are far too common to scope by image.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
          - 'cmd.exe /C whoami'
          - 'cmd.exe /c echo'
          - '\\.\pipe'
          - 'conhost.exe 0xffffffff -ForceV1'
      condition: selection
    fields:
      - CommandLine
      - ParentCommandLine
      - CurrentDirectory
- question: Which Cobalt Strike capability does the command pattern correspond to — shell, pass-the-hash, or fork-and-run?
  context: The framework's commands map to distinct patterns. cmd.exe /c echo writing into
    a named pipe is the pass-the-hash token transfer, which is preceded by access to LSASS
    and a new logon session. cmd.exe /C whoami is the shell command's identity check. A
    conhost.exe 0xffffffff -ForceV1 artifact accompanies spawns where the beacon creates a
    process with no attached console. Identifying the capability determines the scope of
    potential compromise and the response actions required.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this parent expected to spawn this child, and what started the parent itself?
  context: The parent-child relationship is the core signal. A cmd.exe or conhost.exe whose
    parent is runonce.exe or dllhost.exe, or whose parent runs from C:\Temp, is the
    fork-and-run or staging pattern — normal whoami and shell activity runs under
    explorer.exe, a logon shell, or a script host, not under dllhost.exe spawned for code
    injection. Tracing what started the parent reveals whether an injected process or a
    dropped binary launched the chain.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did the same parent spawn?
  context: If an injected or staged parent launched the detected process, it likely
    launched others. A dllhost.exe or runonce.exe parent that spawns cmd.exe alongside
    reconnaissance, credential-access, or lateral-movement children points to deliberate
    orchestration through one beacon rather than an isolated event. Examine every child of
    the same parent instance.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Was a named-pipe write performed by cmd.exe on this host, and what pipe name and value were used?
  context: The pass-the-hash branch writes a unique identifier into a named pipe with
    cmd.exe /c echo <hex> > \\.\pipe\<random>. The pipe name and the echoed value identify
    the token-transfer operation and let the analyst correlate it with LSASS access and a
    new logon session in the same window. This surfaces pipe writes on the host even when
    the original triggering event has scrolled past, so a single beacon's repeated
    transfers become visible.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
          - 'echo'
          - '\\.\pipe'
      condition: selection
    fields:
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What files did the detected process write to the host, and do any match Cobalt Strike artifacts?
  context: The framework leaves characteristic artifacts — dropped payloads, spawn-to
    images, and post-exploitation output files — alongside its default named pipes
    (postex_*, status_*, msagent_*, MSSE-*). Reviewing files created by the detected
    process around the alert confirms beacon presence and reveals the scope of activity
    even after the triggering process has exited. Named-pipe creation, where that
    telemetry is collected, is the clearest of these artifacts.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Does this parent normally spawn this child on this host?
  context: A runonce.exe or dllhost.exe spawning cmd.exe, or a parent under C:\Temp
    spawning a shell, is the discriminator here. A pairing with zero or very low history on
    this host indicates a novel spawning relationship worth chasing; thousands of prior
    events point to established behavior. dllhost.exe in particular almost never legitimately
    spawns interactive command shells.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: Does this host normally run command shells writing to named pipes?
  context: cmd.exe runs constantly on most hosts, so volume of cmd.exe alone is not
    informative; the discriminator is the named-pipe write and the staging-directory
    parent that this rule keys on. Historical counts of cmd.exe /c echo writing to \\.\pipe
    distinguish first-time or rare token-transfer activity from anything recurring. Zero or
    very low counts indicate the pattern is new to this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
          - 'echo'
          - '\\.\pipe'
      condition: selection
    fields:
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_generic_1:
        CommandLine|endswith: cmd.exe /C whoami
        ParentImage|startswith: C:\Temp\
      selection_generic_2:
        ParentImage|endswith:
        - \runonce.exe
        - \dllhost.exe
        CommandLine|contains|all:
        - cmd.exe /c echo
        - '> \\\\.\\pipe'
      selection_conhost_1:
        ParentCommandLine|contains|all:
        - cmd.exe /C echo
        - ' > \\\\.\\pipe'
        CommandLine|endswith: conhost.exe 0xffffffff -ForceV1
      selection_conhost_2:
        ParentCommandLine|endswith: /C whoami
        CommandLine|endswith: conhost.exe 0xffffffff -ForceV1
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_generic_1:
        CommandLine|endswith: cmd.exe /C whoami
        ParentImage|startswith: C:\Temp\
      selection_generic_2:
        ParentImage|endswith:
        - \runonce.exe
        - \dllhost.exe
        CommandLine|contains|all:
        - cmd.exe /c echo
        - '> \\\\.\\pipe'
      selection_conhost_1:
        ParentCommandLine|contains|all:
        - cmd.exe /C echo
        - ' > \\\\.\\pipe'
        CommandLine|endswith: conhost.exe 0xffffffff -ForceV1
      selection_conhost_2:
        ParentCommandLine|endswith: /C whoami
        CommandLine|endswith: conhost.exe 0xffffffff -ForceV1
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around this time?
  context: Tracking the account's activity across all hosts in the surrounding window
    reveals lateral movement or coordinated activity on multiple endpoints. If the same
    user triggered similar shell or token-transfer activity elsewhere, the scope is larger
    than this one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_generic_1:
        CommandLine|endswith: cmd.exe /C whoami
        ParentImage|startswith: C:\Temp\
      selection_generic_2:
        ParentImage|endswith:
        - \runonce.exe
        - \dllhost.exe
        CommandLine|contains|all:
        - cmd.exe /c echo
        - '> \\\\.\\pipe'
      selection_conhost_1:
        ParentCommandLine|contains|all:
        - cmd.exe /C echo
        - ' > \\\\.\\pipe'
        CommandLine|endswith: conhost.exe 0xffffffff -ForceV1
      selection_conhost_2:
        ParentCommandLine|endswith: /C whoami
        CommandLine|endswith: conhost.exe 0xffffffff -ForceV1
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Surveying activity around the alert reveals
    what led to the shell or token transfer and what followed — reconnaissance, credential
    access, or lateral movement. Aggregating by process and parent collapses repetitive
    agent telemetry into high-count rows while novel parent-child pairs stand out at low
    counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance,
    credential access — may reveal the attack stages that preceded this event. Beacon
    post-exploitation patterns commonly follow an initial loader and in-memory injection,
    so prior alerts help reconstruct how the host was first compromised and what the
    operator did before reaching this point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
