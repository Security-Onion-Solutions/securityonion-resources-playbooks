name: HackTool - Bloodhound/Sharphound Execution
id: b11d3f9d-39c9-4dcd-9315-c93eb7007a03
description: |
  Detects execution of the BloodHound/SharpHound Active Directory collector. The rule fires when EITHER the binary metadata or filename identifies the tool (Product, Description, Company, or Image naming SharpHound/BloodHound/SpecterOps) OR the command line carries a known collection pattern (a -CollectionMethod / --CollectionMethods value, the -JsonFolder + -ZipFileName output pair, the DCOnly + --NoSaveCache stealth pair, or an Invoke-Bloodhound / Get-BloodHoundData cmdlet) — only one branch needs to match.
  SharpHound enumerates domain users, groups, sessions, ACLs, and trust relationships and writes the result to a zip of JSON files for attack-path mapping; it is a legitimate component of authorized assessments and is also a routine precursor to lateral movement and privilege escalation. Determine which branch fired, whether the run is part of a sanctioned engagement, what collection scope was requested, and whether the activity sits inside a broader discovery or hands-on-keyboard sequence.
type: detection
detection_id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does this event match BloodHound/SharpHound either by binary identity or by a collection command line?
  context: >-
    Confirm the alert before investing time. The rule fires if any one branch matches — binary metadata or filename
    (Product, Description, Company, or Image naming SharpHound, BloodHound, or SpecterOps), a single collection flag (a
    -CollectionMethod / --CollectionMethods value, .exe -c All -d, or an Invoke-Bloodhound / Get-BloodHoundData cmdlet), the
    -JsonFolder plus -ZipFileName output pair, or the DCOnly plus --NoSaveCache stealth pair. Note which branch fired. A
    metadata or filename match identifies the tool even when its command line is benign or renamed, while a command-line-only
    match means the binary identity was not confirmed and could be a renamed or repackaged collector — that distinction drives
    how much weight the identity-versus-behavior questions carry downstream.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - Company
      - Description
      - Product
- question: Is this SharpHound/BloodHound run part of an authorized penetration test or red team engagement?
  context: >-
    Offensive AD collectors are standard tooling in sanctioned assessments. Before deeper analysis, check whether a pentest
    or red team exercise is active on this host or network segment. An authorized engagement whose scope, operator, host, and
    timing match the alert resolves it without further work; absence of any authorization, or a mismatch in host or window,
    keeps the investigation open.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and account context expected to run domain enumeration tooling?
  context: >-
    SharpHound must run in the context of a domain user and enumerates directory objects broadly. Administrators, IT staff,
    and security testers may run AD collection legitimately; standard users and most service accounts have no reason to. Note
    whether the executing account is privileged, a help-desk or admin role, a standard user, or a service principal — that
    determines whether the collection is routine or anomalous.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: What collection scope did this run request?
  context: >-
    SharpHound's collection methods control how aggressive and broad the enumeration is. CollectionMethod All pulls sessions,
    ACLs, group membership, and trusts in one pass; DCOnly with --NoSaveCache and stealth flags is a quieter, lower-footprint
    sweep; --Loop with --Loopduration runs repeated collection over time. The -CollectionMethod, --CollectionMethods, -c, and
    cmdlet arguments in the command line reveal which scope was used, which bounds how much directory data was exposed and
    determines the response.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Decode the full BloodHound/SharpHound command line — what output paths, domain targets, and stealth options were set?
  context: >-
    The full command line on this host shows the complete operation, which may span more than the single triggering
    invocation. Read the output destination (-JsonFolder, -ZipFileName, --outputdirectory), the targeted domain or domain
    controller (-d, --domain, --domaincontroller), and any stealth or evasion options (--stealth, --randomfilenames,
    --memcache, --zippassword, --throttle, --jitter). These reveal where collected data was written and how much effort went
    into avoiding detection.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: If this fired on the PowerShell ingestor (Invoke-Bloodhound / Get-BloodHoundData), was the command encoded and what does it decode to?
  context: >-
    The PowerShell branch of the tool exposes Invoke-Bloodhound and Get-BloodHoundData, which are frequently launched through
    -EncodedCommand, string concatenation, or download cradles to hide the collection call and its parameters. Base64-encoded
    arguments are the most common form. Decoding shows the actual collection parameters, any in-memory assembly load
    ([Reflection.Assembly]::Load) that runs the collector filelessly, and any remote source the script pulled from.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the binary's signing and metadata confirm it is really SharpHound, or could it be a renamed or repackaged collector?
  context: >-
    The metadata branch fires on Product, Description, or Company strings and the filename branch on Image, so a binary
    renamed away from SharpHound.exe can still match on embedded metadata, and a metadata-stripped copy can still match on a
    command-line pattern. Compare the on-disk name against the embedded Product/Description/Company and the signing chain
    (SpecterOps signs official releases; unsigned or mismatched signers on a SharpHound-named file, or SharpHound metadata
    inside an oddly named binary, point to a repackaged or relocated collector). This resolves whether the file identity and
    its claimed identity agree.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Product
      - Description
      - Company
- question: What process spawned this collector, and is that parent chain expected?
  context: >-
    The parent reveals how the collection was launched. An interactive launch from cmd.exe or powershell.exe under
    explorer.exe is consistent with an operator at a console; launches from Office applications, script interpreters
    (wscript.exe, cscript.exe, mshta.exe), wmiprvse.exe (WMI remote execution), or wsmprovhost.exe (WinRM remote execution)
    indicate automated or remote post-exploitation rather than hands-on assessment work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Did this collector write its output artifacts to disk on the host?
  context: >-
    SharpHound typically writes a zip of JSON files (commonly a timestamped *_BloodHound.zip plus per-object JSON) to the
    output directory unless --nozip or --memcache was used. Locating these artifacts confirms collection completed, shows
    where the data was staged for exfiltration or ingestion, and reveals the collection scope even after the process has
    exited. Absence of files alongside a stealth command line is consistent with an in-memory (--memcache) run.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did other reconnaissance commands run on this host around the same time?
  context: >-
    BloodHound collection rarely stands alone in an intrusion; it is commonly bracketed by native discovery — whoami, net
    user, net group, nltest, dsquery, setspn, adfind — and by AD PowerShell cmdlets like Get-ADUser and Get-ADGroupMember.
    Three or more distinct recon binaries inside a short window points to automated enumeration rather than a single
    troubleshooting command, and frames the collection as one stage of a broader discovery effort.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: Were PowerShell security controls bypassed or weakened on this host before the collection ran?
  context: >-
    When the collector is launched through PowerShell (Invoke-Bloodhound) or a download cradle, operators frequently weaken
    PowerShell defenses first — AMSI patching, an execution-policy bypass (-ExecutionPolicy Bypass / -ep bypass), or a
    downgrade to PowerShell v2 to evade logging. Finding these precursor events in the hour before the run strengthens the
    case that the collection was deliberate and adversarial rather than an administrator's sanctioned use.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Collection rarely occurs in isolation. The activity surrounding it on this host — what launched immediately before, what
    ran after — shows whether this is an isolated run or one step in a sequence that includes credential access, privilege
    escalation, or lateral movement. Aggregating by process and parent collapses routine telemetry into high-count rows so
    novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: When this host previously fired this rule's pattern, what parents and users drove it, and does the current alert fit?
  context: >-
    The query mirrors the rule's full selection structure scoped to this host, so the parent and user distribution it returns
    reflects how this specific collection pattern — not generic binary usage — has historically run here. A new parent
    process, an unexpected account, or an unusual command-line structure relative to that history is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Product|contains: SharpHound
      - Description|contains: SharpHound
      - Company|contains:
        - SpecterOps
        - evil corp
      - Image|contains:
        - \Bloodhound.exe
        - \SharpHound.exe
      selection_cli_1:
        CommandLine|contains:
        - ' -CollectionMethod All '
        - ' --CollectionMethods Session '
        - ' --Loop --Loopduration '
        - ' --PortScanTimeout '
        - '.exe -c All -d '
        - Invoke-Bloodhound
        - Get-BloodHoundData
      selection_cli_2:
        CommandLine|contains|all:
        - ' -JsonFolder '
        - ' -ZipFileName '
      selection_cli_3:
        CommandLine|contains|all:
        - ' DCOnly '
        - ' --NoSaveCache '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Product|contains: SharpHound
      - Description|contains: SharpHound
      - Company|contains:
        - SpecterOps
        - evil corp
      - Image|contains:
        - \Bloodhound.exe
        - \SharpHound.exe
      selection_cli_1:
        CommandLine|contains:
        - ' -CollectionMethod All '
        - ' --CollectionMethods Session '
        - ' --Loop --Loopduration '
        - ' --PortScanTimeout '
        - '.exe -c All -d '
        - Invoke-Bloodhound
        - Get-BloodHoundData
      selection_cli_2:
        CommandLine|contains|all:
        - ' -JsonFolder '
        - ' -ZipFileName '
      selection_cli_3:
        CommandLine|contains|all:
        - ' DCOnly '
        - ' --NoSaveCache '
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Product|contains: SharpHound
      - Description|contains: SharpHound
      - Company|contains:
        - SpecterOps
        - evil corp
      - Image|contains:
        - \Bloodhound.exe
        - \SharpHound.exe
      selection_cli_1:
        CommandLine|contains:
        - ' -CollectionMethod All '
        - ' --CollectionMethods Session '
        - ' --Loop --Loopduration '
        - ' --PortScanTimeout '
        - '.exe -c All -d '
        - Invoke-Bloodhound
        - Get-BloodHoundData
      selection_cli_2:
        CommandLine|contains|all:
        - ' -JsonFolder '
        - ' -ZipFileName '
      selection_cli_3:
        CommandLine|contains|all:
        - ' DCOnly '
        - ' --NoSaveCache '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the executing user's activity across all hosts in a tight window around the alert surfaces lateral movement or
    parallel collection on other endpoints. The same user driving similar activity on multiple hosts widens the apparent
    scope of the operation.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Product|contains: SharpHound
      - Description|contains: SharpHound
      - Company|contains:
        - SpecterOps
        - evil corp
      - Image|contains:
        - \Bloodhound.exe
        - \SharpHound.exe
      selection_cli_1:
        CommandLine|contains:
        - ' -CollectionMethod All '
        - ' --CollectionMethods Session '
        - ' --Loop --Loopduration '
        - ' --PortScanTimeout '
        - '.exe -c All -d '
        - Invoke-Bloodhound
        - Get-BloodHoundData
      selection_cli_2:
        CommandLine|contains|all:
        - ' -JsonFolder '
        - ' -ZipFileName '
      selection_cli_3:
        CommandLine|contains|all:
        - ' DCOnly '
        - ' --NoSaveCache '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired this rule's pattern in the past week, and does the spread look like automation or one-off activity?
  context: >-
    The query mirrors the rule's full selection structure with no host scope, giving a fleet-wide count of this collection
    pattern rather than generic binary usage. Many hosts firing the same pattern points to scripted deployment or vendor
    automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and
    parent/binary consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Product|contains: SharpHound
      - Description|contains: SharpHound
      - Company|contains:
        - SpecterOps
        - evil corp
      - Image|contains:
        - \Bloodhound.exe
        - \SharpHound.exe
      selection_cli_1:
        CommandLine|contains:
        - ' -CollectionMethod All '
        - ' --CollectionMethods Session '
        - ' --Loop --Loopduration '
        - ' --PortScanTimeout '
        - '.exe -c All -d '
        - Invoke-Bloodhound
        - Get-BloodHoundData
      selection_cli_2:
        CommandLine|contains|all:
        - ' -JsonFolder '
        - ' -ZipFileName '
      selection_cli_3:
        CommandLine|contains|all:
        - ' DCOnly '
        - ' --NoSaveCache '
      condition: 1 of selection_*
    fields:
    - host.name
