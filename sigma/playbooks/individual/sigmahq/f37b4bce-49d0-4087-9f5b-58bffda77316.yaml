name: Potential AutoLogger Sessions Tampering
id: 5ac2ccad-0aa1-4886-aad4-59137810c82a
description: |
  Detects tampering with Windows AutoLogger event-tracing sessions that record early-boot activity, including the channels behind the Windows event logs (EventLog-*) and Microsoft Defender's real-time ETW telemetry (DefenderApiLogger, DefenderAuditLogger). The rule fires when a value under `\Control\WMI\Autologger\` that names an `EventLog-*` or `Defender*` session and ends in `\Enabled` or `\Start` is set to DWORD 0, and the writing process is neither wevtutil.exe nor Defender's own MsMpEng.exe.
  Legitimately these keys change during OS servicing or security-product updates; zeroed by an operator tool or a custom binary, the change blinds a specific detection source at the next boot. Investigation should confirm which session was disabled, which process and user made the change, whether the disable persists, and what activity followed the resulting telemetry gap.
type: detection
detection_id: f37b4bce-49d0-4087-9f5b-58bffda77316
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Do the registry key path and value data match an Autologger session being disabled?
  context: >-
    Confirm the alert is a true positive before investing time: the modified value lives under `\Control\WMI\Autologger\`,
    names an `EventLog-*` or `Defender*` session, ends in `\Enabled` or `\Start`, and was set to DWORD 0x00000000.
    Sessions such as EventLog-Application, EventLog-Security, DefenderApiLogger, and DefenderAuditLogger start early in
    boot; zeroing Enabled or Start stops them collecting at the next boot.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify Autologger event-tracing session configuration?
  context: >-
    Autologger session keys are written at install time and by OS or security-product servicing; day-to-day changes are
    rare. Confirm whether the writing user and the host role (patch or imaging server, endpoint-management host) legitimately
    reconfigure ETW sessions. User attribution is present on roughly 94% of endpoint registry events; when it is a machine
    account or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which Autologger session was targeted, and is this a known logging or security-telemetry location?
  context: >-
    The path segment after `\Autologger\` names the session. EventLog-Application, EventLog-Security, and EventLog-System
    back the Windows event log channels; DefenderApiLogger and DefenderAuditLogger back Microsoft Defender's real-time ETW
    telemetry. Disabling any of these blinds a specific detection source. The value name (`Enabled` versus `Start`) and the
    DWORD data determine whether the session is turned off at boot.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value was written to the Autologger key, and does it disable the session?
  context: >-
    For these sessions, `Start` or `Enabled` set to DWORD 0x00000000 disables collection; a nonzero value (Start auto,
    Enabled on) leaves it running. Read the Details field to confirm the value is a disable rather than a benign
    reconfiguration. Details is captured on about 79% of registry modifications; when it is absent (binary or empty value
    data), fall back to the value name and the writing process to judge intent.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process and command performed the Autologger change, and was a standard tool or a custom binary used?
  context: >-
    The registry event names the writing process; this pivots to that process to read its full command line. A `reg add
    ... \Start /t REG_DWORD /d 0` or a PowerShell `Set-EtwTraceProvider` / `Set-ItemProperty` call shows an operator
    action; an empty command line points to a binary that wrote the value directly through the registry API, which is more
    consistent with implant behavior. This decodes the method, not just the target.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What spawned the process that wrote this value, and is that parent chain expected?
  context: >-
    The registry event names the writing process; this walks up to its parent. A servicing or management chain
    (services.exe, an endpoint-management or patch agent) is expected. A parent such as cmd.exe, powershell.exe,
    wscript.exe, or an Office or browser process points to interactive or scripted tampering. If ParentProcessGuid is
    absent on the alert, pivot on the writing process image and host instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Does the disable persist, or was the value later restored on this host?
  context: >-
    Registry key and value deletions are not observable on this telemetry, so attacker cleanup of the key itself cannot be
    seen directly. Judge persistence from the value's re-modification history: a later write returning `Start` or `Enabled`
    to a nonzero value means the session was restored (by servicing or by responders); no further writes means the disable
    stands and the session will not collect at the next boot.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Is the affected event-tracing session collecting again, or is the host still missing this telemetry?
  context: >-
    Disabling an Autologger session takes effect at the next boot and stays disabled until the value is restored and the
    host reboots. Confirm the current state directly on the host or from telemetry health: are events from the affected
    session (an event log channel or the Defender ETW feed) arriving now? If not, the visibility gap persists and the
    session should be restored. Treat a silent session as an active blind spot, not proof nothing is happening.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process activity ran on this host after the Autologger session was disabled?
  context: >-
    Early-boot ETW sessions and Defender's ETW feed exist to record activity that later detections rely on. Disabling them
    ahead of other actions is a way to blunt that recording. Review process activity in the window after the change for
    execution, credential access, or lateral movement that the missing telemetry would otherwise have captured, and
    correlate with network and file events in the same window.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: What other registry modifications happened on this host in the same window?
  context: >-
    A single Autologger disable is often one of several registry changes in a hands-on session: disabling additional
    sessions or providers, weakening Defender policy keys, or adding a Run-key. Reviewing all registry writes on the host
    in the surrounding window, grouped by key and writing process, shows whether the change stands alone or is part of a
    broader reconfiguration. The triggering key appears in the results; the signal is what else was written.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Were other defense-tampering actions performed on this host?
  context: >-
    Operators who disable one telemetry source often disable several: clearing event logs, stopping the event log or
    Defender service, deleting shadow copies, or changing firewall rules, to widen coverage. Multiple tampering actions from
    the same user or parent process in a tight window indicate a deliberate defense-impairment sequence rather than a single
    administrative change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: What else ran on this host around the time of the change?
  context: >-
    Registry tampering rarely occurs in isolation. Aggregating process activity by image and parent process in the
    surrounding window collapses routine agent noise into high-count rows and surfaces novel parent-child pairs at low
    counts: reconnaissance, staging, or follow-on execution that frames why the session was disabled.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Has this Autologger session key been modified before on this host?
  context: >-
    Autologger session values are written at install or servicing time and otherwise change rarely. A history with zero or
    very few prior writes marks this as an unusual change; a recurring pattern (for example, a management agent that
    rewrites the value on a schedule) points to routine activity. Compare the historical Details values against the current
    disable.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same Autologger session value changed on other hosts?
  context: >-
    The same disable across multiple hosts points to a pushed configuration (a management policy or group policy) or to the
    same operator moving laterally; a single-host change is more likely targeted. Compare the writing process and Details
    values across hosts: consistent tooling and identical value data suggest one source.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Did other detections fire on this host in the hours before this change?
  context: >-
    Earlier alerts on the same host, such as reconnaissance, credential access, or other defense-impairment steps, help
    place this event in a sequence and reconstruct the timeline leading to the telemetry tampering.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were process-based persistence mechanisms installed on this host around this time?
  context: >-
    Defense tampering and persistence are commonly staged together: after reducing telemetry, operators install footholds
    via scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions. Persistence-tool executions from the
    same window indicate intentional stacking rather than an isolated administrative change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped into Startup or Run-key paths on this host around this time?
  context: >-
    File-based persistence sidesteps command-line detection: dropping an executable or script into a Startup folder or a
    Run-key path achieves persistence without invoking schtasks, sc, or reg. File-event monitoring captures these drops even
    when standard persistence tools are avoided. Reviewing the surrounding window shows whether a foothold accompanied the
    telemetry tampering.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
