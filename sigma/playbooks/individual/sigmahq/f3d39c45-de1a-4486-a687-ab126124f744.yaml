name: Sdiagnhost Calling Suspicious Child Process
id: f6ac76f3-910e-402b-a38a-85e5d1313bba
description: |
  Detects sdiagnhost.exe spawning a suspicious child process. The rule fires when
  sdiagnhost.exe (the MSDT scripted-diagnostics host) is the parent AND the child's
  Image ends in one of a fixed set of interpreters and system binaries
  (powershell.exe, pwsh.exe, cmd.exe, mshta.exe, cscript.exe, wscript.exe,
  taskkill.exe, regsvr32.exe, rundll32.exe, calc.exe), excluding two benign cases
  (cmd.exe whose command line contains 'bits', and powershell.exe launched with
  -noprofile). Legitimately, sdiagnhost.exe runs Windows troubleshooting packs and
  does not normally launch command interpreters or proxy-execution binaries; this
  parent-child pattern is the signature of MSDT abuse such as the ms-msdt / CVE-2022-30190
  path, where a document or remote template drives sdiagnhost.exe to execute attacker
  code. Confirm the child and its command line, decode what it does, trace what spawned
  sdiagnhost.exe itself, and look for the follow-on file, DLL-load, and network activity
  the child sets up.
type: detection
detection_id: f3d39c45-de1a-4486-a687-ab126124f744
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- question: Was this process spawned by sdiagnhost.exe, and is the child one of the flagged interpreters or proxy-execution binaries?
  context: Confirm the alert is a true positive before investing time. The rule requires
    sdiagnhost.exe as the parent AND a child whose Image ends in one of powershell.exe,
    pwsh.exe, cmd.exe, mshta.exe, cscript.exe, wscript.exe, taskkill.exe, regsvr32.exe,
    rundll32.exe, or calc.exe, with two benign cases excluded (cmd.exe whose command line
    contains 'bits', and powershell.exe run with -noprofile). Read the parent and child Image
    from the triggering event to confirm the pairing matches the rule.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
- question: Is this user and host expected to be running Windows troubleshooting diagnostics right now?
  context: sdiagnhost.exe runs when a user or admin launches a Windows troubleshooter or an
    MSDT diagnostic pack. Knowing whether someone on this host was actually using a
    troubleshooter, and whether this user and host function are consistent with that, is often
    the fastest way to separate genuine diagnostics from a document or remote template driving
    sdiagnhost.exe to execute code.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What spawned sdiagnhost.exe, and is that chain consistent with a user-launched troubleshooter?
  context: The parent-child relationship is the core signal. sdiagnhost.exe is normally started
    by the diagnostic service (svchost.exe / msdt.exe) when a user opens a troubleshooter.
    Tracing sdiagnhost.exe's own origin reveals whether the chain is legitimate or whether an
    Office application, a remote-template fetch, or msdt.exe invoked with an ms-msdt payload
    drove it. Read the grandparent Image and its command line.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What exactly did the child process do? Decode its full command line and arguments.
  context: The child's full command line reveals the specific action sdiagnhost.exe was driven
    to take. Decode every flag, parameter, encoded block, file path, or URL. For mshta.exe and
    the script hosts (cscript.exe, wscript.exe) identify the script or remote resource invoked;
    for regsvr32.exe and rundll32.exe identify the DLL and entry point or any remote scriptlet
    or URL; for cmd.exe and powershell.exe identify the downstream command. The query scopes to
    children of sdiagnhost.exe on this host so multi-step invocations stay together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: If the child was powershell.exe or pwsh.exe, was the command encoded or obfuscated, and what does it decode to?
  context: When the spawned child is PowerShell, attackers frequently hide intent with the
    -EncodedCommand (-enc) parameter, base64, string concatenation, backtick escaping, or
    variable substitution. Decoding reveals the actual payload — download cradles, reverse
    shells, or in-memory execution of .NET assemblies. The MSDT abuse path commonly hands
    PowerShell a base64 blob, so decode it to ground truth what ran.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the spawned child the genuine signed system binary, or a renamed file masquerading as it?
  context: The rule keys on the child's name (calc.exe, regsvr32.exe, powershell.exe, and so
    on), but a renamed dropper can carry one of those names while being something else.
    Comparing the Image path against the embedded OriginalFileName, and checking the signing
    chain and file hash, reveals whether this is the real Microsoft-signed binary running from
    its expected location or a relocated or renamed file. The OriginalFileName mismatch and a
    non-standard install path are the discriminators; the hash enables a reputation lookup.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: If the child was regsvr32.exe or rundll32.exe, what DLL or module did it load?
  context: regsvr32.exe and rundll32.exe are trusted signed binaries used for proxy execution —
    they load and run a DLL or scriptlet supplied on the command line. The loaded module is the
    actual payload and is often not visible from process_creation alone. Reviewing image-load
    events for this process surfaces the DLL path and signer; a module loaded from a
    user-writable or temporary directory, or an unsigned module, points to proxy execution of
    attacker code rather than a legitimate diagnostic.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- question: Did the child process make an outbound network connection shortly after it started?
  context: System-binary proxy execution frequently retrieves a remote payload or reaches
    command-and-control immediately after the child runs — mshta.exe fetching a remote HTA,
    regsvr32.exe pulling a remote scriptlet, or PowerShell running a download cradle. Reviewing
    outbound connections initiated by this process in the surrounding window surfaces the
    download source or C2 endpoint and ties the egress to this execution.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
        Initiated: 'true'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: What other child processes did this same sdiagnhost.exe instance spawn around this time?
  context: If sdiagnhost.exe was driven to launch one interpreter, it may have launched others
    too. Examining the other children of the same sdiagnhost.exe instance reveals the full scope
    of activity from that one diagnostic host — multiple interpreters or proxy binaries from the
    same parent points to scripted abuse rather than an isolated benign troubleshooter step.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What did the child process do after it started, and did it spawn further processes?
  context: The purpose of driving a trusted binary through sdiagnhost.exe is to perform the
    intended action while blending in. Examining the child processes spawned by this binary
    reveals its actual objective — additional interpreters, reconnaissance, credential access,
    or persistence steps. A chain of further activity below the flagged child distinguishes
    active abuse from a single benign invocation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: If PowerShell ran, did script block logging capture the full deobfuscated script content?
  context: Script block logging records the deobfuscated script content PowerShell actually
    executes, even when the command line is encoded or obfuscated, giving ground truth about
    what ran. If PowerShell operational logs are not ingested in this environment, treat zero
    results as a visibility gap rather than evidence nothing ran, and decode the command line
    from the alerting event directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \sdiagnhost.exe
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \cmd.exe
        - \mshta.exe
        - \cscript.exe
        - \wscript.exe
        - \taskkill.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \calc.exe
      filter_main_cmd_bits:
        Image|endswith: \cmd.exe
        CommandLine|contains: bits
      filter_main_powershell_noprofile:
        Image|endswith: \powershell.exe
        CommandLine|endswith:
        - -noprofile -
        - -noprofile
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \sdiagnhost.exe
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \cmd.exe
        - \mshta.exe
        - \cscript.exe
        - \wscript.exe
        - \taskkill.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \calc.exe
      filter_main_cmd_bits:
        Image|endswith: \cmd.exe
        CommandLine|contains: bits
      filter_main_powershell_noprofile:
        Image|endswith: \powershell.exe
        CommandLine|endswith:
        - -noprofile -
        - -noprofile
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around this time?
  context: Tracking the account's activity across all hosts in the surrounding window reveals
    whether the same person triggered similar activity on other endpoints. If the same user
    shows matching execution elsewhere, the scope is larger than this one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \sdiagnhost.exe
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \cmd.exe
        - \mshta.exe
        - \cscript.exe
        - \wscript.exe
        - \taskkill.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \calc.exe
      filter_main_cmd_bits:
        Image|endswith: \cmd.exe
        CommandLine|contains: bits
      filter_main_powershell_noprofile:
        Image|endswith: \powershell.exe
        CommandLine|endswith:
        - -noprofile -
        - -noprofile
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Surveying activity around the alert reveals what
    led to the diagnostic-host execution and what followed — additional downloads, persistence,
    or recon. Aggregating by process and parent collapses repetitive agent telemetry into
    high-count rows while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — document execution, reconnaissance, or defense
    tampering — may reveal the stages that preceded this diagnostic-host execution and help
    reconstruct the timeline. The sequence of alerts on a host often tells the fuller story of
    how the activity unfolded.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
