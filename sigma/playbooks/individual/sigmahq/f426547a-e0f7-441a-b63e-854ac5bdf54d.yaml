name: Perl Inline Command Execution
id: e868645c-e93c-4779-9fc4-8f154431df30
description: |
  Detects perl.exe (matched by Image name or OriginalFileName) running with an inline-code flag in the form ' -e' on its
  command line. The rule fires only when both conditions hold: the process is perl, and the command line contains a ' -e'
  argument. Inline perl code is legitimate in development, build automation, and some packaged tooling, but the same flag
  lets an operator run arbitrary code directly from the command line without a script file on disk — a common way to launch
  reverse shells or stage follow-on activity. Investigation should decode the inline code, confirm the parent and user are
  expected to run perl this way, and look for network connections or child processes that the inline code spawned.
type: detection
detection_id: f426547a-e0f7-441a-b63e-854ac5bdf54d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line show perl running inline code via a ' -e' flag?
  context: Confirm the alert is a true positive by reviewing the exact command line and binary identity. The rule fires when
    the process is perl (by Image ending in perl.exe or by OriginalFileName perl.exe) AND the command line contains a ' -e'
    argument, which tells perl to execute code supplied directly on the command line. Verify both the perl identity and the
    inline-code flag are present in the alerting event.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run perl with inline code?
  context: Legitimate inline perl is common on developer workstations, build agents, and hosts running packaged tools that
    embed perl. Knowing whether the user role and host function involve perl development or automation is often the fastest
    way to separate routine use from operator activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What does the inline perl code actually do? Decode the ' -e' argument and any chained commands.
  context: The string passed after ' -e' is the operation. Read it for socket setup, file or process redirection, and execution
    of a secondary shell — the canonical perl reverse shell opens a PF_INET/SOCK_STREAM socket to a remote host, dups STDIN,
    STDOUT and STDERR onto it, and execs an interactive shell. Decode any encoded blobs, embedded IP addresses or ports, and
    follow-on commands. This query scopes to all perl executions on this host in the surrounding window, since a single logical
    operation may span more than one invocation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: ' -e'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this perl instance, and is that parent chain expected?
  context: The parent process reveals how perl was invoked. A build system, package manager, or interactive shell launched
    by explorer.exe is a routine parent for development use. Parents like a web server, an Office application, mshta.exe, or
    wscript.exe point to exploitation or a malicious launcher rather than hands-on development.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Does this host normally run perl?
  context: A perl process that has never run on a host is more notable than one that runs regularly as part of builds or packaged
    tooling. Zero or very low historical counts over the lookback window indicate first-time or rare execution and raise the
    weight of the inline-code finding.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously run perl with inline code, what parents and users normally drive that activity, and
    does the current alert fit that pattern?
  context: Even routine tools get abused. This query mirrors the rule's selection — perl identity AND a ' -e' command line —
    scoped to this host, so the resulting parent and user distribution reflects how the rule's specific firing pattern has
    historically run here rather than generic perl usage. A new parent process, an unexpected user account, or an unusual
    command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \perl.exe
      - OriginalFileName: perl.exe
      selection_cli:
        CommandLine|contains: ' -e'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did this perl instance spawn afterward?
  context: The processes spawned by inline perl reveal its actual impact. A reverse shell or stager typically execs a command
    interpreter such as cmd.exe or powershell.exe, or pulls down additional tooling. Children that look like an interactive
    shell or download utility shift the disposition toward operator activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did this perl instance open any network connections, and to where?
  context: The most common malicious use of inline perl is a reverse shell, which connects outbound to an operator-controlled
    host over a raw TCP socket. Correlate the perl process by its ProcessGuid to outbound connections in the surrounding window
    and check the destination address and port against expected build or update endpoints. An outbound connection to an unfamiliar
    external address shortly after the inline-code execution is the network half of a reverse-shell pattern.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - Initiated
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \perl.exe
      - OriginalFileName: perl.exe
      selection_cli:
        CommandLine|contains: ' -e'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \perl.exe
      - OriginalFileName: perl.exe
      selection_cli:
        CommandLine|contains: ' -e'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or parallel activity on multiple endpoints.
    If the same user triggered similar perl or other interpreter activity on more than one host in the window, the scope is
    larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \perl.exe
      - OriginalFileName: perl.exe
      selection_cli:
        CommandLine|contains: ' -e'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining process activity around the alert reveals what led to this event and
    what happened after, and whether the perl execution is part of a larger sequence such as reconnaissance, privilege escalation,
    or persistence installation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did this perl execution occur inside expected administrative or build windows, or at an unusual hour for this host?
  context: Interpreter abuse often runs outside normal administrative or scheduled-build windows. Compare the alert timestamp
    against this host's historical perl activity by hour and against known maintenance windows. Inline perl that runs at an
    hour when this host has no prior interpreter activity, and outside any documented automation schedule, is a deviation that
    raises the weight of the finding.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \perl.exe
      - OriginalFileName: perl.exe
      selection_cli:
        CommandLine|contains: ' -e'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the stages
    that preceded the perl execution and help reconstruct the timeline. The order in which detections fired often tells the
    story of how the host reached this point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
