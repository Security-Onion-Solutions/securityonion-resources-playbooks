name: PUA - CleanWipe Execution
id: 237ac186-e79a-4318-8f6d-b37786898b97
description: |
  Detects execution of CleanWipe, the vendor utility used to forcibly remove Symantec/Norton
  endpoint protection. The rule fires when at least one of its component binaries runs: SepRemovalToolNative_x64.exe,
  CATClean.exe with --uninstall, NetInstaller.exe with -r, or WFPUnins.exe with both /uninstall and /enterprise.
  A sanctioned migration or support engagement is the benign explanation; the same tool is also run by
  operators to strip endpoint protection before executing a payload, dumping credentials, or deploying
  ransomware, so removal of protective software is itself a defense-evasion action. Investigation should
  confirm which branch fired and the exact command, determine whether the removal was authorized and what
  protection was actually torn down, check whether the host is now unprotected, and look at what ran on the
  host before and after the removal and how widely the same pattern appears across the fleet.
type: detection
detection_id: f44800ac-38ec-471f-936e-3fa7d9c53100
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- question: Does this process match one of the CleanWipe component patterns this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when
    EITHER the Image ends in SepRemovalToolNative_x64.exe, OR it ends in CATClean.exe with --uninstall in
    the command line, OR it ends in NetInstaller.exe with -r, OR it ends in WFPUnins.exe with both /uninstall
    and /enterprise. Review the alerting event and note which branch matched — the binary and flags that
    fired determine which downstream questions carry weight, since the four components remove different
    parts of the Symantec/Norton stack.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to remove endpoint protection software?
  context: Legitimate antivirus migration or vendor support can trigger this detection. Removing endpoint
    protection is a high-impact action normally restricted to IT or security staff during a planned change.
    Knowing whether the user role and host function are consistent with a sanctioned removal is often the
    fastest path to distinguishing an approved migration from an operator stripping defenses before a
    payload.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is CleanWipe on the organization's approved software list, and was its use sanctioned for this host?
  context: CleanWipe is a potentially unwanted utility — legitimate when run by IT to clean up a broken or
    migrating Symantec/Norton install, but not something that belongs on a normal endpoint. Even a vendor
    tool with a valid signature can represent an unauthorized teardown of protection if it was not part of
    a planned change. Check it against the approved software and change-management lists regardless of the
    tool's reputation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a change ticket, maintenance window, or support session explaining this removal?
  context: Sanctioned removal of endpoint protection typically correlates with a change ticket, a scheduled
    migration window, or a vendor support engagement. If no such context exists for this execution, the tool
    may have been run by an operator to disable defenses or by a user circumventing security controls. Match
    the user, host, and timing against change records and helpdesk history.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which CleanWipe component ran and what part of the Symantec/Norton stack did it remove?
  context: The four component binaries tear down different pieces of protection. SepRemovalToolNative_x64.exe
    is the native SEP removal driver; CATClean.exe --uninstall removes the content catalog; NetInstaller.exe -r
    reverses the network installer; WFPUnins.exe /uninstall /enterprise removes the Windows Filtering Platform
    callout driver that enforces network protection. Read the command line to identify which control was
    removed — this determines how exposed the host now is and what remediation is required.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is Symantec/Norton endpoint protection currently running on this host, or has it been removed?
  context: CleanWipe removal may have been completed or only partially applied. Check the current state of
    the endpoint protection services and drivers — if the agent, real-time scanning, or the network filter
    driver are gone, the host is unprotected and protection should be restored or re-imaged before further
    investigation. A host left without endpoint protection is an open window for follow-on activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What activity occurred on this host after endpoint protection was removed?
  context: Protection is stripped for a reason — to execute malware, dump credentials, or perform actions
    that would otherwise be blocked or logged. Examining process activity in the window immediately after the
    removal reveals what the teardown was meant to enable. New or unusual binaries running shortly after the
    protection drop point to the payload the operator was clearing the way for.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense tampering actions performed on this host around the same time?
  context: Operators who remove one control often disable several — stopping additional security services,
    clearing event logs, deleting shadow copies, or changing the firewall — to maximize coverage before
    acting. Finding other tampering events from the same user or parent process near the removal indicates a
    deliberate teardown of multiple defenses rather than an isolated, sanctioned uninstall.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Were the Symantec/Norton service and driver registry keys modified or deleted around the removal?
  context: Removal of endpoint protection leaves registry evidence — the protection services and filter-driver
    keys under the service control hierarchy are deleted or disabled as the components are torn down.
    Registry-modification events targeting Symantec/Norton service keys (or the broader security-service hive)
    confirm the controls were actually removed at the system level rather than merely a removal tool being
    launched, and the writing process and account show who performed the teardown.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\Services\SepMasterService'
          - '\Services\SmcService'
          - '\Services\SAVService'
          - '\Services\Symantec'
          - '\Services\Norton'
          - '\Services\BHDrvx64'
          - '\Services\SymEvent'
          - '\Services\WFP'
      condition: selection_host and selection_keys
    fields:
      - TargetObject
      - Image
      - User
- question: What process spawned this CleanWipe component and is that parent chain expected?
  context: The parent process reveals how the removal tool was invoked and under which context. A managed
    deployment tool, an installer, or an interactive explorer.exe launch points to IT-driven removal; script
    hosts, archive utilities, or another remote access session as the parent point to delivery by a loader or
    staging from a prior foothold rather than a sanctioned migration. Examine the parent and what else it
    spawned.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously fired this pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even sanctioned cleanup tools recur. This query mirrors the rule's selection structure scoped to
    this host, so the resulting parent/user distribution reflects how the rule's specific firing pattern — not
    generic binary usage — has historically run here. A new parent process, an unexpected user account, or an
    unusual launch pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        Image|endswith: \SepRemovalToolNative_x64.exe
      selection2:
        Image|endswith: \CATClean.exe
        CommandLine|contains: --uninstall
      selection3:
        Image|endswith: \NetInstaller.exe
        CommandLine|contains: -r
      selection4:
        Image|endswith: \WFPUnins.exe
        CommandLine|contains|all:
        - /uninstall
        - /enterprise
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of the rule's firing pattern rather than generic usage of the binaries. Many hosts running the same
    removal pattern points to a scripted or managed migration; a single host or a small unrelated set points
    to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        Image|endswith: \SepRemovalToolNative_x64.exe
      selection2:
        Image|endswith: \CATClean.exe
        CommandLine|contains: --uninstall
      selection3:
        Image|endswith: \NetInstaller.exe
        CommandLine|contains: -r
      selection4:
        Image|endswith: \WFPUnins.exe
        CommandLine|contains|all:
        - /uninstall
        - /enterprise
      condition: 1 of selection*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        Image|endswith: \SepRemovalToolNative_x64.exe
      selection2:
        Image|endswith: \CATClean.exe
        CommandLine|contains: --uninstall
      selection3:
        Image|endswith: \NetInstaller.exe
        CommandLine|contains: -r
      selection4:
        Image|endswith: \WFPUnins.exe
        CommandLine|contains|all:
        - /uninstall
        - /enterprise
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        Image|endswith: \SepRemovalToolNative_x64.exe
      selection2:
        Image|endswith: \CATClean.exe
        CommandLine|contains: --uninstall
      selection3:
        Image|endswith: \NetInstaller.exe
        CommandLine|contains: -r
      selection4:
        Image|endswith: \WFPUnins.exe
        CommandLine|contains|all:
        - /uninstall
        - /enterprise
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning
    multiple endpoints. If the same user removed protection or ran other tooling on several hosts, the scope
    of the operation may be larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        Image|endswith: \SepRemovalToolNative_x64.exe
      selection2:
        Image|endswith: \CATClean.exe
        CommandLine|contains: --uninstall
      selection3:
        Image|endswith: \NetInstaller.exe
        CommandLine|contains: -r
      selection4:
        Image|endswith: \WFPUnins.exe
        CommandLine|contains|all:
        - /uninstall
        - /enterprise
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the removal reveals the immediate
    context — what led to it, what happened after, and whether it is part of a larger sequence. Look for
    reconnaissance, credential access, additional tampering, or new tooling installed near the removal time.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — reconnaissance, credential
    access, or other defense tampering — may reveal the attack stages that preceded the removal of endpoint
    protection and help reconstruct the full timeline. Removing protection is often a preparatory step, so
    activity in the hours before it matters.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
