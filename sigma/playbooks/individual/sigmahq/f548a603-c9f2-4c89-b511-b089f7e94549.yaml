name: Potential Persistence Via Microsoft Compatibility Appraiser
id: c6159320-8775-444c-a926-0a004ef3bfb3
description: |
  Detects schtasks.exe being used to manually run the built-in "Microsoft Compatibility
  Appraiser" scheduled task, identified by an Image ending in schtasks.exe (or an
  OriginalFileName of schtasks.exe) running with a command line that contains both "run "
  and the task path \Application Experience\Microsoft Compatibility Appraiser. Manually
  triggering this task forces CompatTelRunner.exe to re-read the
  AppCompatFlags\TelemetryController registry key, where an attacker can register a Command
  value that then runs as SYSTEM — a registry-backed persistence and Admin-to-SYSTEM
  escalation primitive that autoruns does not surface. The investigation should confirm the
  exact command, determine whether the TelemetryController registry key was modified, and
  identify any child process CompatTelRunner.exe spawned after the task ran.
type: detection
detection_id: f548a603-c9f2-4c89-b511-b089f7e94549
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line show schtasks running the Microsoft Compatibility Appraiser task — both the run verb and the Application Experience task path present?
  context: Before investing investigation time, confirm the alert is a true positive. The
    rule fires only when the process is schtasks.exe (by Image or OriginalFileName) AND the
    command line contains both "run " and \Application Experience\Microsoft Compatibility
    Appraiser. Confirm both elements are present and that this is a manual run of the
    existing task rather than the scheduler invoking it on its normal interval.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to manually run the Compatibility Appraiser task?
  context: The Compatibility Appraiser task normally runs unattended on its own schedule.
    A human or script manually invoking it with schtasks /run is unusual. Knowing whether
    the account is an administrator and whether the host's function involves telemetry or
    compatibility tooling is often the fastest way to separate sanctioned maintenance from a
    deliberate trigger of registry-backed persistence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exact schtasks command ran — confirm the /run verb, the targeted task name, and any additional flags?
  context: This re-displays the triggering event. The schtasks command line carries the
    operation (/run), the task name (/tn), and any run-as or extra flags. Unlike task
    creation, /run executes an already-registered task immediately. Identify the precise task
    name to confirm it is the canonical \Microsoft\Windows\Application Experience\Microsoft
    Compatibility Appraiser task and not a similarly named decoy.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Was the AppCompatFlags\TelemetryController registry key modified to register a Command that CompatTelRunner will run?
  context: Manually running the Compatibility Appraiser task forces CompatTelRunner.exe to
    re-read subkeys under HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\TelemetryController.
    A new subkey with a Command value and Nightly/Maintenance/Oobe DWORDs set to 1 is the
    persistence payload — it runs as SYSTEM at the next trigger. A registry-set event records
    the write directly even when it was made programmatically. Look for writes to that key
    path in the window around the task run.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\AppCompatFlags\TelemetryController'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: After the task ran, did CompatTelRunner.exe spawn any child process, and is that child a signed Microsoft binary from System32?
  context: When the registered Command fires, CompatTelRunner.exe launches it via
    CreateProcessW as SYSTEM, with a command line of the form <Command> -cv <random> and
    sometimes -oobe or -fullsync appended. CompatTelRunner has no legitimate reason to spawn
    arbitrary child processes; any non-Microsoft-signed child, or a child outside System32,
    is the persistence payload executing with SYSTEM privileges.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\CompatTelRunner.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: Did the manual run actually drive a payload execution, and did the scheduler also fire this task on its own?
  context: The /run verb triggers the task immediately, so CompatTelRunner should execute
    right after the alert; the scheduler also fires the same task periodically as a child of
    the Task Scheduler service. Reviewing processes spawned by the scheduler after the alert
    reveals whether the registered Command ran once or repeats on the task's normal interval,
    which determines how often the persistence reactivates.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\svchost.exe'
        ParentCommandLine|contains: 'Schedule'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is the persistence still active — is the TelemetryController Command still registered and the Compatibility Appraiser task still enabled?
  context: This persistence is effective only while the TelemetryController Command value and
    its Nightly/Maintenance/Oobe DWORDs remain set. The Compatibility Appraiser task itself is
    a built-in task and will normally still be present, so remediation hinges on the registry
    key, not the task. Confirm via direct registry inspection of HKLM\SOFTWARE\Microsoft\Windows
    NT\CurrentVersion\AppCompatFlags\TelemetryController whether the malicious subkey is still
    in place and requires removal.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the registered TelemetryController Command encoded or obfuscated, and what does it decode to?
  context: The Command REG_SZ registered under TelemetryController is what runs as SYSTEM, and
    operators commonly hide it as a base64 or otherwise encoded payload, a download cradle, or
    a path to a dropped binary. The schtasks /run command line itself carries no payload — the
    operation here is triggering an existing task — so the content to decode is the registry
    Command value found in the TelemetryController key. Reconstruct it to identify the actual
    operation it performs.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned this schtasks invocation, and is that parent chain expected?
  context: The parent reveals how schtasks was invoked. A user running it from an interactive
    shell (explorer-spawned cmd or powershell) differs from schtasks launched by a script
    host, a remote-execution service, or an Office application. An unexpected parent points
    toward an operator triggering the persistence rather than routine administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Was schtasks.exe executed from its expected System32 path?
  context: schtasks.exe legitimately lives in System32 (and SysWOW64). A copy running from a
    user-writable or temp directory, or a renamed binary whose OriginalFileName is schtasks.exe
    while its Image is something else, indicates an attempt to evade path-based allowlists.
    Compare the Image path against the expected location and check whether Image and
    OriginalFileName agree.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host run the Compatibility Appraiser task manually over the past 90 days, and what command-line structures are typical?
  context: A manual run of this task with no prior history on the host is more suspicious than
    one that recurs under a stable parent. The query mirrors the rule's selection scoped to
    this host, so the count reflects the rule's specific firing pattern rather than generic
    schtasks usage. The command-line projection lets the alerting invocation be compared
    against any prior patterns.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_cli:
        CommandLine|contains|all:
        - 'run '
        - \Application Experience\Microsoft Compatibility Appraiser
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- question: Have other hosts run the Compatibility Appraiser task manually in the past week, and does the spread look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result
    is a fleet-wide count of this specific firing pattern rather than generic schtasks usage.
    Many hosts running the same pattern points to scripted deployment or vendor automation; a
    single host or a small unrelated set points to manual operator activity. Use the host
    distribution to calibrate how isolated the event is.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_cli:
        CommandLine|contains|all:
        - 'run '
        - \Application Experience\Microsoft Compatibility Appraiser
      condition: all of selection_*
    fields:
    - host.name
- question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: Operators rarely rely on a single persistence mechanism. Alongside the
    TelemetryController registry trigger, they commonly stack scheduled tasks, services,
    registry Run keys, BITS jobs, or WMI subscriptions as backups. Several persistence tool
    executions in the same timeframe indicate intentional stacking rather than isolated
    administrative work.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Was there a change ticket, maintenance window, or documented approval for manually running this task?
  context: Many organizations require change tickets for persistence-relevant or telemetry
    configuration changes. A corresponding ticket suggests authorized maintenance; absence of
    one when policy requires it suggests the action was unauthorized. This check can quickly
    close a false positive or escalate a true positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_cli:
        CommandLine|contains|all:
        - 'run '
        - \Application Experience\Microsoft Compatibility Appraiser
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_cli:
        CommandLine|contains|all:
        - 'run '
        - \Application Experience\Microsoft Compatibility Appraiser
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around this time?
  context: Tracking the account's activity across all hosts in the surrounding window reveals
    lateral movement or coordinated activity on multiple endpoints. If the same user triggered
    similar task or persistence activity elsewhere, the scope is larger than this one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_cli:
        CommandLine|contains|all:
        - 'run '
        - \Application Experience\Microsoft Compatibility Appraiser
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
