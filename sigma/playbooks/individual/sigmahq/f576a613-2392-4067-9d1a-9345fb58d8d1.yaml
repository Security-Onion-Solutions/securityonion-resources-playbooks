name: Automated Collection Command Prompt
id: fdc94e31-62b7-4cf6-abc1-716822597c53
description: |
  Detects command-prompt activity that enumerates or searches for document files in bulk. The rule fires when a command line references at least one document extension (.doc, .docx, .xls, .xlsx, .ppt, .pptx, .rtf, .pdf, .txt) AND EITHER a recursive bare directory listing (dir with /b and /s) OR a findstr search (FINDSTR.EXE with /e or /si). This is the pattern of automated file collection: a script or operator walking the filesystem for office documents and text files, often a precursor to staging and exfiltration, and a way to locate credentials embedded in files. Legitimate administration, backup tooling, and developer scripts can produce the same pattern, so the investigation should determine what was searched for, who and what drove it, whether it ran once or as part of a repeating automated job, and whether the located files were subsequently archived, moved, or used to access other systems.
type: detection
detection_id: f576a613-2392-4067-9d1a-9345fb58d8d1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- question: Does the command line reference a document extension AND either a recursive dir listing or a findstr search?
  context: Confirm the alert before investing time. The rule fires only when the command line names a document extension (.doc, .docx, .xls, .xlsx, .ppt, .pptx, .rtf, .pdf, .txt) AND EITHER runs a recursive bare directory listing (dir with /b and /s) OR runs a findstr search (FINDSTR.EXE with /e or /si). Note which branch fired - the dir branch points to filesystem enumeration, the findstr branch points to content searching - because that distinction patterns which downstream questions carry weight.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to enumerate or search document files from the command line?
  context: Bulk document enumeration and content searching are produced by legitimate backup jobs, indexing tools, developer scripts, and IT discovery tasks as well as by collection activity. Knowing whether the account and host normally run recursive file searches for office and text documents is often the fastest way to separate routine automation from operator-driven collection.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly was the command searching for, and does the pattern point at documents, credentials, or both?
  context: The full command line reveals the intent. Decode the extension list, the search flags, and any literal strings or wildcards. A search confined to office documents reads as data collection; extensions or filename fragments such as .config, .xml, .ps1, password, credential, .kdbx, or unattend point at credentials stored in files. The specific terms searched for determine whether the exposure is data loss, credential theft, or both.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What files or directories did the search actually return or touch?
  context: 'The command-line arguments name the targets, but the file events show what the search actually reached: specific document types, sensitive directories (finance shares, HR folders, source repositories), or broad recursive wildcards indicating bulk collection. The scope of touched files determines the severity of potential data loss and which business areas may be affected.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - EventType
- question: Are the documents named or located by this search still on disk for analysis?
  context: If the search identified specific files, checking whether they still exist on disk enables deeper analysis - hash lookups, content review, and determining whether they hold sensitive or credential material. The file paths referenced in the command line drive this lookup.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did a successful or attempted logon follow this search, especially under an account whose credentials could have been read from a located file?
  context: Searching for documents and configuration files is frequently a path to credentials stored in plaintext. When credentials are recovered from a file they are typically used to authenticate, so a logon shortly after the search - particularly to another system or under a different account - indicates the located material may already be in use. Correlate the search time against authentication events on this host to spot credential reuse following the search.
  range: +4h
  query: |
    aggregation: false
    logsource:
      service: security
      product: windows
    detection:
      selection:
        EventID:
          - 4624
          - 4648
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetUserName
      - LogonType
      - IpAddress
- question: What process spawned this command interpreter, and is that parent chain expected?
  context: The parent process reveals how the search was launched. A backup agent, scheduler, or management tool spawning the interpreter reads as automation; an Office application, a script host (wscript.exe, mshta.exe), a remote-access tool, or an unsigned binary as the parent points at macro-driven or operator-driven collection. Walk up to the parent's own parent to reconstruct how the activity was initiated.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Were the located documents subsequently archived, copied, or moved off the host?
  context: >-
    Automated collection typically feeds staging - the located files are gathered into an
    archive locally and then moved to a staging path or exfiltrated over the network. The query
    anchors on archive-file writes on this host in the hour after the search; an archive
    appearing in a temporary or user-writable path right after a bulk document search is the
    staging signal. A zero here does not clear the host if the operator copied documents raw or
    disguised the archive extension - the child-process question surfaces archiving and transfer
    tooling, and the remote-access-connection question covers movement off-host.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith:
          - '.zip'
          - '.rar'
          - '.7z'
          - '.cab'
          - '.tar'
          - '.gz'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Which accounts may be exposed by the searched files, and do any have elevated privileges?
  context: The severity depends on what the located files held and whose credentials they could expose. Configuration files, scripts, and saved-credential stores often contain service-account or administrative secrets. A standard user's documents may only need monitoring, while files holding domain-admin or service-account credentials require escalation; cross-reference the affected accounts against directory group memberships.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: When this host has previously fired this document-search pattern, what parents and users drove it, and does the current alert fit?
  context: Even routine tools produce this pattern. The query mirrors the rule's selection scoped to this host, so the resulting parent/user distribution reflects how this specific search pattern - not generic command-interpreter usage - has historically run here. A new parent process, an unexpected account, or a command-line structure never seen before is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_ext:
        CommandLine|contains:
        - .doc
        - .docx
        - .xls
        - .xlsx
        - .ppt
        - .pptx
        - .rtf
        - .pdf
        - .txt
      selection_other_dir:
        CommandLine|contains|all:
        - 'dir '
        - ' /b '
        - ' /s '
      selection_other_findstr:
        OriginalFileName: FINDSTR.EXE
        CommandLine|contains:
        - ' /e '
        - ' /si '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_ext and 1 of selection_other_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did this command interpreter spawn afterward?
  context: The processes spawned after the search reveal what was done with the results. Archiving utilities (rar, 7z, makecab), copy or move operations, encoding tools (certutil, base64), or transfer tools (curl, bitsadmin, rclone) appearing shortly after the enumeration indicate the located files were staged or exfiltrated rather than merely listed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_ext:
        CommandLine|contains:
        - .doc
        - .docx
        - .xls
        - .xlsx
        - .ppt
        - .pptx
        - .rtf
        - .pdf
        - .txt
      selection_other_dir:
        CommandLine|contains|all:
        - 'dir '
        - ' /b '
        - ' /s '
      selection_other_findstr:
        OriginalFileName: FINDSTR.EXE
        CommandLine|contains:
        - ' /e '
        - ' /si '
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_ext and 1 of selection_other_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_ext:
        CommandLine|contains:
        - .doc
        - .docx
        - .xls
        - .xlsx
        - .ppt
        - .pptx
        - .rtf
        - .pdf
        - .txt
      selection_other_dir:
        CommandLine|contains|all:
        - 'dir '
        - ' /b '
        - ' /s '
      selection_other_findstr:
        OriginalFileName: FINDSTR.EXE
        CommandLine|contains:
        - ' /e '
        - ' /si '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_ext and 1 of selection_other_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user account do across the environment around this time?
  context: Tracking the account's activity across all hosts in the alert window reveals lateral movement or coordinated collection across endpoints. If the same account ran similar document searches on multiple hosts, the scope may be larger than one endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_ext:
        CommandLine|contains:
        - .doc
        - .docx
        - .xls
        - .xlsx
        - .ppt
        - .pptx
        - .rtf
        - .pdf
        - .txt
      selection_other_dir:
        CommandLine|contains|all:
        - 'dir '
        - ' /b '
        - ' /s '
      selection_other_findstr:
        OriginalFileName: FINDSTR.EXE
        CommandLine|contains:
        - ' /e '
        - ' /si '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_ext and 1 of selection_other_*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired this document-search pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this specific search pattern rather than generic interpreter usage. Many hosts firing the same pattern points to scripted deployment or backup automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_ext:
        CommandLine|contains:
        - .doc
        - .docx
        - .xls
        - .xlsx
        - .ppt
        - .pptx
        - .rtf
        - .pdf
        - .txt
      selection_other_dir:
        CommandLine|contains|all:
        - 'dir '
        - ' /b '
        - ' /s '
      selection_other_findstr:
        OriginalFileName: FINDSTR.EXE
        CommandLine|contains:
        - ' /e '
        - ' /si '
      condition: selection_ext and 1 of selection_other_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - reconnaissance, defense tampering, or credential access - may reveal the attack stages that preceded the document search and help reconstruct how the activity began.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
