name: Common Autorun Keys Modification
id: 2c6246b0-3211-49e3-a11c-127377b7c114
description: |
  Detects modification of a Windows autostart extensibility point (ASEP) in the registry — Command Processor
  Autorun, Active Setup Installed Components, CLSID InprocServer32 handlers, protocol handlers/filters, the
  screensaver executable, UserInitMprLogonScript, and similar keys that cause code to run automatically at boot,
  logon, or when a built-in Windows component starts. Installers and legitimate administrators write these keys
  routinely, so the investigation must determine which key and value data changed, which process wrote it, and
  whether the referenced payload is a legitimate program. Malicious use registers a binary or command in one of
  these keys so that an attacker's payload executes on the next trigger, often alongside other persistence and
  defense-tampering changes in the same session.
type: detection
detection_id: f59c3faf-50f3-464b-9f4c-1b67ab512d99
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Do the modified autostart registry key and its value data match what this rule detects?
  context: >-
    Before investing investigation time, confirm the alert is a true positive by reviewing the exact key path
    (TargetObject) against the rule's list of autostart extensibility points and reading the value data (Details)
    and writing process. The rule fires when one of the known ASEP keys is written and is not one of the vendor
    installer exclusions, so verify the key really is one of the monitored autostart locations.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify autostart registry keys?
  context: >-
    Legitimate installers, software updaters, and administrators write ASEP keys during deployment and
    maintenance. Knowing whether the user role and host function are consistent with autostart configuration
    changes is often the fastest way to separate a routine install from unauthorized persistence. User attribution
    is present on roughly 94% of endpoint registry events; when it is a machine account or missing, pivot on the
    writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which autostart key was modified, and is it a known persistence or hijack location?
  context: >-
    The key path reveals intent. Command Processor\Autorun runs a command every time cmd.exe launches; Active
    Setup\Installed Components runs a StubPath command once per user at logon; Classes\CLSID\...\InprocServer32
    registers a DLL for COM-based load; Control Panel\Desktop\Scrnsave.exe runs on screensaver activation; and
    UserInitMprLogonScript runs a script at logon. Identify which of these locations fired and read the value name
    and data to determine exactly what executes and when.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What payload does the value data point to, and what does it resolve to?
  context: >-
    The value data written to an autostart key is the payload — commonly a file path to a binary or script, a full
    command line, or a DLL path for a COM handler. Decode it: resolve environment variables, note whether the path
    lives in a user-writable location (Temp, AppData, ProgramData, Public), and check for base64 or command-shell
    content. If the value points to an executable or script, that path becomes the next investigation pivot. The
    referenced binary path is the tunable element the rule's analytics baseline against known software, so an
    unfamiliar path carries most of the weight.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: After the modification, was this key value re-written or reverted, and did its payload run?
  context: >-
    Autostart persistence is durable only if the value stays in place until its trigger fires. Endpoint telemetry
    does not emit registry key or value deletion events, so cleanup cannot be observed directly; judge durability
    from the key's re-modification history over a longer forward window and from whether the referenced payload
    subsequently executed. A value that is written once and never touched again, pointing at an unfamiliar payload,
    is more concerning than a key an updater rewrites on every run.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote this autostart key, and what started that process?
  context: >-
    The writing process is the core attribution signal for a registry persistence event. Tracing the writing
    process back to its own parent reveals whether the change came from a legitimate chain (an installer launched
    by the user or a software-deployment service) or a suspicious one (a script host, Office application, or
    command shell spawned from an unexpected parent). Name the writing process from the alert and confirm whether
    that lineage is expected for autostart configuration on this host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Were other registry modifications made on this host in the same session?
  context: >-
    Attackers who set one autostart key often make several changes at once — stacking a second persistence key,
    disabling a security setting, or altering firewall or policy values. All registry modifications on this host in
    the surrounding window, grouped by key path and writing process, show what else changed alongside the
    autostart write. The triggering key will appear in the results; the signal is what accompanied it. If the host
    is registry-noisy, narrow to the writing process from the alert or to security-relevant hive paths.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has this autostart key been modified before on this host?
  context: >-
    First-time modifications to an autostart key are more suspicious than routine changes. Some of these keys are
    written on nearly every software install (Active Setup entries), while others should almost never change on a
    given host (Command Processor\Autorun, screensaver executable, UserInitMprLogonScript). A long-lookback view of
    prior modifications, and the value data set each time, calibrates how unusual this write is.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: After the registry write, did a new or unusual binary start on this host?
  context: >-
    Autostart payloads execute at their trigger — cmd.exe launch, next logon, screensaver activation, or COM load —
    which may be minutes or hours after the key is set. Aggregating process starts on the host after the write
    surfaces binaries that could correspond to the payload named in the value data. Compare the executables that
    ran against the path recorded in the key; an execution from a user-writable directory matching that path
    confirms the persistence is live.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is the executable or script referenced by the value present on disk, written by this process or its children?
  context: >-
    Autostart persistence is only effective if the referenced payload exists at the path recorded in the value. If
    the writing process or one of its children dropped a file in the same session, correlating file activity by
    that process lineage shows whether the payload was staged locally and where. The file-write event carries no
    hash; if a payload is present, hash it from a later execution or retrieve it for a reputation lookup. Registry
    deletion is not observable on endpoint telemetry, so treat reboot survival as a judgment call informed by the
    value data and the key's re-modification history.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity in the window around the registry write reveals
    the immediate context — what launched the writing process, what ran just before and after, and whether
    reconnaissance, privilege escalation, or additional persistence appears nearby. Aggregating by process and
    parent collapses repetitive agent noise so novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Was this same autostart key modified on other hosts in the environment?
  context: >-
    The same autostart modification across multiple hosts may indicate a group-policy push, a widely deployed
    software update, or malware spreading a common persistence mechanism. If only this host shows the change, it
    may be targeted. Comparing the value data set on each host separates a uniform legitimate rollout from
    host-specific payloads.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the
    stages that preceded the persistence write and help reconstruct the timeline. Persistence is commonly
    established after an initial foothold, so a preceding execution or tampering alert changes how this event
    should be prioritized.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was there a change ticket, maintenance window, or documented approval for this autostart change?
  context: >-
    Many organizations require change records for persistence-related modifications and software deployments. A
    corresponding ticket or documented deployment suggests authorized activity; the absence of one where policy
    requires it suggests the change was unauthorized. This check can quickly close a false positive or escalate a
    true positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    Attackers rarely rely on a single persistence mechanism. After setting an autostart key, they commonly install
    backups using different techniques — scheduled tasks, services, additional registry keys, or BITS jobs.
    Persistence-tool executions in the surrounding window, grouped by tool and command, reveal whether multiple
    mechanisms were stacked in the same timeframe rather than an isolated administrative change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup folder or Run key persistence locations on this host?
  context: >-
    File-based persistence bypasses command-line and registry detection entirely — dropping an executable or
    script into a Startup folder achieves autostart without touching the keys this rule monitors. File-event
    monitoring captures these drops even when the attacker avoids standard persistence tooling, so checking for
    them alongside the autostart key write shows whether persistence was established through more than one channel.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
