- question: When this host has previously fired this copy-from-system pattern, what parents and users drove it, and does the current alert fit?
  context: >-
    The query mirrors the rule's full selection structure scoped to this host, so the resulting parent/user distribution reflects
    how this specific firing pattern (a system-directory LOLBIN copy) has historically run here rather than generic copy-tool
    usage. A new parent process, an unexpected user account, or an unusual command-line structure against that baseline is the anomaly
    worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
