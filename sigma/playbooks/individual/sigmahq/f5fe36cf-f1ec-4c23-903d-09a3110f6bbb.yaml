name: Potential ClickFix Execution Pattern - Registry
id: 4d26f90f-b897-4598-aa9e-f6057e970873
description: |
  Fires when a value written to the Run dialog history key (HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\RunMRU)
  contains an http or https link AND a social-engineering keyword (captcha, robot, verification, human, and similar)
  AND the name of a script interpreter or download utility (powershell, cmd, mshta, certutil, curl, finger, and similar) — all
  three conditions must be present together. This is the registry footprint of a ClickFix-style paste attack: a fake
  human-verification page copies a one-liner to the clipboard and instructs the user to open Run (Win+R) and paste it, so
  Windows records the attacker-authored command in RunMRU as the user executes it. Investigation should decode the recorded
  command, confirm the interpreter actually ran and reached the embedded URL, and determine whether a downloaded payload landed
  and executed.
type: detection
detection_id: f5fe36cf-f1ec-4c23-903d-09a3110f6bbb
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Do the RunMRU key path and the recorded command match what this rule detects?
  context: Confirm the alert is a true positive by reviewing the exact key path (TargetObject) and value data (Details). The
    rule fires only when the recorded command carries all three markers together — an http or https link, a
    verification-style keyword, and a script interpreter or download utility name. A value missing any one of these is a
    likely false positive.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user expected to run commands from the Run dialog on this host?
  context: The Run dialog is an ordinary Windows feature, but pasting an interpreter one-liner that fetches a remote URL is not
    routine end-user behavior. Knowing whether this user or host role commonly launches commands this way is often the fastest
    way to separate a genuine paste attack from an administrator's manual action. User attribution is present on most endpoint
    registry events; when it is a machine account or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What web page or message led the user to paste this command into the Run dialog?
  context: This paste pattern begins with a fake human-verification or "fix" page (often reached through a phishing link or a
    compromised site) that silently copies a command to the clipboard and tells the user to press Win+R and paste. The
    delivery surface is not in the registry event — reconstruct it from browser history, the referring page, or a brief user
    interview to identify the lure and block it for others.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Did this same detection fire for other users or hosts?
  context: Paste-based lures are delivered at scale through phishing and compromised sites, so a single RunMRU hit is rarely
    isolated. Correlating the same rule across the fleet reveals how many users pasted the command and which additional hosts
    need investigation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Did the process behind this Run dialog entry write files to disk — is the downloaded payload present?
  context: A ClickFix one-liner typically downloads a second-stage payload into a user-writable path (%TEMP%, %APPDATA%,
    ProgramData). Correlating file writes by the registry-writing process and its children reveals whether a payload was
    dropped in the same session and where it lives, enabling retrieval and deeper analysis.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was this command entered through the Run dialog, and does RunMRU normally hold interpreter one-liners on this host?
  context: RunMRU records each Win+R command verbatim, so the key is expected to change over time — but it should hold drive
    letters, control-panel applets, and short paths, not an interpreter-plus-URL download command. A value combining a
    verification keyword, an interpreter name, and a remote link is the ClickFix footprint rather than ordinary Run history.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Decode the recorded command — what URL, interpreter, and download method does the pasted value use?
  context: The Details value is the exact command the user pasted. Extract the http or https URL, the interpreter or utility
    invoked (powershell, cmd, mshta, certutil, curl, finger, bitsadmin, and similar), and the fetch-and-run method — for
    example a %comspec% wrapper, a "finger user@host | cmd" cradle, or a certutil/curl download. These fields identify what
    the command was built to retrieve and run.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What domains did this host resolve around the time of the paste, and does one match the URL in the recorded command?
  context: The registry write carries no destination, so the download target has to be correlated by host and time. Decode the
    URL from the recorded value, then scan the host's DNS lookups in the surrounding window for a matching resolution — a hit
    confirms the download cradle reached its infrastructure. Weigh newly registered domains, uncommon TLDs, and hosts outside
    the corporate CDN/update allow list more heavily; a resolution present here but absent from normal host traffic points to
    attacker-controlled infrastructure.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: Did the Run dialog actually spawn a script interpreter or download utility after this entry?
  context: RunMRU records intent, not execution. Confirm that explorer.exe (the process behind the Run dialog) went on to
    launch one of the interpreters or utilities named in the pasted value. If an interpreter did spawn, the paste executed and
    the download likely ran; if nothing spawned, the user may have abandoned the paste and the exposure is lower.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\explorer.exe'
        Image|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\cmd.exe'
          - '\mshta.exe'
          - '\cscript.exe'
          - '\wscript.exe'
          - '\regsvr32.exe'
          - '\rundll32.exe'
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\finger.exe'
          - '\schtasks.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: After the command ran, did a newly-created binary in a user-writable directory execute?
  context: The download cradle usually fetches a second-stage executable into a user-writable location (%TEMP%, %APPDATA%,
    ProgramData, Users\Public) and runs it. Execution from one of these directories shortly after the paste is the follow-on
    stage where the actual malware starts; treat a match as the point where the payload took hold.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|contains:
          - '\AppData\'
          - '\Temp\'
          - '\ProgramData\'
          - '\Users\Public\'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: What other registry modifications happened on this host in the same window?
  context: A hands-on session or an installer-style implant often changes several keys together — for example adding
    persistence, weakening a security setting, and editing configuration. Registry changes clustered around this event, grouped
    by key path and writing process, reveal whether the paste led to broader configuration tampering beyond the Run history.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What values has this RunMRU key held on this host over the past 90 days?
  context: RunMRU changes routinely as users launch Run commands, so volume alone is uninformative. Reviewing the recorded
    history shows whether a value combining an interpreter name and a remote URL has appeared before, or whether prior entries
    are limited to benign paths and applets. A first-time download command stands out against an otherwise mundane Run history.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What other processes ran on this host around the time of the alert?
  context: The paste rarely stands alone — reconnaissance, staging, or additional interpreter launches often surround it.
    Aggregating process activity by parent and child collapses routine agent noise into high-count rows while novel
    parent-child pairs surface at low counts, which is where the follow-on activity tends to show.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or a
    prior execution attempt — may reveal how the user reached the lure and help reconstruct the timeline leading to the paste.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
