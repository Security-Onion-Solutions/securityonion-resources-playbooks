name: Potential RoboForm.DLL Sideloading
id: 56d4ee30-9ca3-493f-bb9e-27d4c64ab013
description: |
  Detects roboform.dll or roboform-x64.dll loading into any process other than the legitimate RoboForm taskbar binary (robotaskbaricon.exe / robotaskbaricon-x64.exe) running from the Siber Systems\AI RoboForm install directory. Legitimately this DLL is loaded only by the installed RoboForm password manager from its own program directory; a load from another location or under an unrelated process indicates DLL sideloading, where a planted copy of roboform.dll is placed alongside a host executable and loaded ahead of any genuine copy. Investigation should confirm the load path and signature, identify the loading process and how the DLL reached disk, and check for parallel persistence or spread to other hosts.
type: detection
detection_id: f64c9b2d-b0ad-481d-9d03-7fc75020892a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting module match what this rule detects — is roboform.dll being loaded by a process outside the signed RoboForm install path?
  context: >-
    The rule fires when roboform.dll or roboform-x64.dll loads into any process EXCEPT robotaskbaricon(-x64).exe running from the Siber Systems\AI RoboForm install directory. Confirm the alert by reviewing the exact module path (ImageLoaded), the loading process, and the module's code-signature status against those criteria. DLL loads carry a hash and signing status on the load event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this host expected to run RoboForm, and is this user account associated with its use?
  context: >-
    Legitimate RoboForm activity loads roboform.dll from its own install directory under an interactive user. If this host has no RoboForm installation, or the loading account is a service or machine account, the load is harder to explain as normal password-manager use.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the full set of modules this process loaded, and did roboform.dll load from the application's own directory rather than the expected RoboForm path?
  context: >-
    The complete module list shows whether roboform.dll arrived via search-order hijacking — a DLL of that name placed in the loading process's own directory or another user-writable location is resolved ahead of any legitimate copy. Note any other unsigned or non-canonical modules loaded by the same process; sideloading rarely involves a single planted DLL.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: Is the loaded roboform.dll validly signed by the RoboForm vendor, and what does its hash reputation show?
  context: >-
    The legitimate roboform.dll is signed by the RoboForm vendor. An unsigned copy, one with an invalid or distrusted signature, or one whose hash is unknown to threat intelligence is a strong substitution indicator. Web-origin metadata (mark-of-the-web / Zone.Identifier alternate data stream) showing the DLL was downloaded is a manual or endpoint-console check, since that stream data is not carried in the load telemetry.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What is the process that loaded roboform.dll, and what were its full command line and working directory?
  context: >-
    The loading process, its command line, and its working directory reveal how the sideload was staged. A working directory in a user-writable or temporary location, or a launcher command line that points at a copied RoboForm binary, indicates the DLL was resolved from a planted location rather than the installed application.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned the process that loaded roboform.dll, and is that parent chain expected?
  context: >-
    A legitimate RoboForm process is typically launched by explorer.exe on user start or by a service. A parent such as an Office application, a script host (wscript.exe, mshta.exe), an archive tool, or a freshly written executable suggests the load followed a delivery chain rather than normal application startup.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: When and by what process was roboform.dll written to disk on this host?
  context: >-
    Sideloading requires the DLL to be placed in a location the loading process searches. A recent write of roboform.dll or roboform-x64.dll — especially by an archive utility, browser, script host, or installer that is not the RoboForm updater, and into a directory other than the Siber Systems install path — pins the drop that preceded the load. Correlate the write time against the module load time; a drop moments before the load is the sideloading signature.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith:
          - '\roboform.dll'
          - '\roboform-x64.dll'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Is the roboform.dll payload still on disk for analysis?
  context: >-
    If the planted roboform.dll remains on disk, it can be hashed, submitted to a sandbox, and compared against the vendor's legitimate copy. Correlating file activity to the loading process and its children captures whether the DLL or related staged files were written, renamed, or deleted after the load.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has roboform.dll been loaded on this host before, and by which processes?
  context: >-
    If roboform.dll has loaded repeatedly under robotaskbaricon.exe from the RoboForm install directory over the past 90 days, this load is likely routine. A first-ever load, or a history of loads only under unrelated processes, marks the current load as anomalous.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    The window around a sideload often contains the delivery and follow-on steps — an archive or document opening, a script host running, a new executable launching. Aggregating process activity by image and parent surfaces novel parent-child pairs against the routine background.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Does the user recall installing, updating, or running RoboForm at this time?
  context: >-
    Direct confirmation from the account owner is often the fastest legitimacy check. If the user runs RoboForm and this coincides with an update, the load may be routine. If the user does not use RoboForm at all, a load of its DLL under their session needs explanation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this activity align with normal work hours or a software deployment window?
  context: >-
    A RoboForm module load during the user's active hours or a documented software rollout is more consistent with legitimate use than one that occurs while the host is unattended or outside any maintenance window.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were autostart or execution-redirection registry keys modified on this host around the alert?
  context: >-
    Sideloading is frequently paired with a registry autostart entry that relaunches the host process (and thus reloads the planted DLL) across reboots, or with keys that redirect module resolution. Modifications to Run/RunOnce, Winlogon, or App Paths values near the alert time indicate persistence was established alongside the load.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\CurrentVersion\Run'
          - '\CurrentVersion\RunOnce'
          - '\Winlogon\Shell'
          - '\App Paths\'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: Is roboform.dll being loaded on other hosts, and by which processes?
  context: >-
    The same planted DLL loading across multiple hosts points to broader distribution rather than a single localized incident. Pay attention to the loading processes: loads only under the legitimate RoboForm binary are benign; loads under varied or unexpected processes on other hosts indicate the sideload spread.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier alerts on the same host — a suspicious download, a script host launch, defense tampering — may reveal the delivery chain that placed and loaded the DLL. Reconstructing the alert timeline helps distinguish an isolated event from a multi-stage intrusion.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    Sideloading provides execution, but attackers commonly add backup persistence — scheduled tasks, services, registry Run keys, or BITS jobs — using separate tools. Persistence-tool executions clustered in the same window as the load indicate deliberate stacking rather than isolated activity.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup folders or scheduled-task definition paths on this host?
  context: >-
    File-based persistence sidesteps command-line detection: dropping an executable or script into a Startup folder, or writing to a path referenced by a Run key, achieves relaunch without running a persistence tool. This surfaces drops that the process-based check would miss.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
